format: 1
kind: device
name: as7946-74xksb
version: 0.1.0
maturity: draft
manufacturer: Edgecore
model: AS7946-74XKSB
description: Edgecore AGR420 (AS7946-74XKSB) 25GbE aggregation router. 2RU, 74 fixed ports - 2
  x 100G QSFP-DD, 8 x 40/100G QSFP28 and 64 x 10/25G SFP28 - with a timing block, 1+1 redundant
  PSUs and 4+1 redundant fans.
provenance:
  sources: datasheet AGR420-AS7946-74XKSB-DS-R03 and quick start guide AS7946-74XKSB-QSG-R03,
    both Edgecore, plus six photographs of a real unit (IMG_6807 front, 6808 top, 6809 rear,
    6810 left, 6811 right, 6812 bottom) and Edgecore's stock renders. No mechanical drawing
    was available
  chassis: 'datasheet - "Dimensions (WxDxH): 440 mm x 480 mm x 87 mm (2RU)". The QSG Chassis
    section gives the same 440 x 480 x 87 mm (17.3 x 18.9 x 3.4 in), so unlike the AGR400 the
    two Edgecore documents agree and no disagreement has to be carried'
  depth: 'measured - 480 mm, and the AGR400 model''s 524 mm is believed WRONG. The AGR400 and
    the AGR420 are the SAME SHELL, not two shells: the bottom pans in IMG_6792 (AGR400) and
    IMG_6812 (AGR420) are the same stamping - the same dimple pattern, the same PSU and fan
    cut-out at one corner, the same rivet lines - and the top, side and rear metalwork matches
    as well. One shell can only have one depth. Three of the four Edgecore documents say 480
    (both AGR420 documents and the AGR400 datasheet); only the AGR400 quick start guide says
    524, and that is the outlier. It is not an over-handles figure either: the rear PSU and fan
    handles project about 17 mm past the rear panel, photo-measured in IMG_6810, not the 44 mm
    the difference would need. This model uses 480 for every face. The AGR400 model still
    carries 524 and should be corrected to match'
  scale: drawing - the datasheet page-2 Interfaces figures are orthographic. The front panel
    measures 3947 x 775 px on a 600 dpi render, an aspect of 5.093 against the datasheet 440/87
    = 5.057, a 0.7 percent match; the rear measures 3943 x 772, an aspect of 5.108. Both carry
    geometry, and everything below is measured off them at 8.9705 px/mm across and 8.9080 px/mm
    down
  ru: datasheet - 87 mm is 2 RU
  color: photo - the same dark grey painted steel as the AGR400, which is the same shell
  ports: 'drawing - four cage rows whose tops sit at panel y 14.6, 31.3, 44.3 and 61.0. The
    QSFP-DD pair occupies the middle two rows in a single column at x 16.1; the eight QSFP28
    sit in two abutting columns at x 44.6 and 63.1, four rows deep; the 64 SFP28 sit in four
    blocks of four columns, the blocks starting at x 90.35, 156.32, 222.29 and 288.26 on a
    65.97 mm pitch and the columns inside each block on a 14.25 mm pitch, which is exactly the
    std/sfp-module footprint - ganged cages abut'
  port-count: 'datasheet - callouts 1 to 3 on the page-2 figure: 2 x 100G QSFP-DD, 8 x 100G
    QSFP28, 64 x 25GE SFP28. 2 + 8 + 64 = 74, matching the model number'
  port-numbering: 'drawing - the pair legends read "N up down M" with the up arrow belonging to
    the LEFT number and the down arrow to the right, the same convention as the AGR400, read at
    7x on the 600 dpi render. Numbering runs down each column four at a time: ports 0-1 are the
    QSFP-DD, 2-5 the left QSFP28 column and 6-9 the right, then the SFP28 run 10-73 block by
    block and column by column. The last legend, 72 up down 73, is legible on the real device in
    IMG_6807 at the bottom right, which confirms the scheme end to end'
  port-cutouts: 'drawing - one cutout per aperture, 74 of them, sized from the module footprint
    rather than the registry aperture because ganged cages abut: 18.5 x 9.58 for QSFP and
    14.25 x 10.4 for SFP28. The registry apertures (19.0 x 10.0 and 14.5 x 10.0) are single-port
    figures and would overlap at the measured 14.25 mm pitch'
  port-leds: 'drawing plus datasheet - the QSG Front LEDs section gives two LEDs per port on all
    three families, and the ARRANGEMENT DIFFERS BY FAMILY. QSFP-DD: LED1 top, LED2 bottom, a
    stacked pair OUTSIDE the block at x 12.6, at y 36.6/39.7 for port 0 and 45.6/48.7 for port 1.
    QSFP28 and SFP28: LED1 left, LED2 right, as arrow-shaped light pipes in the white strip
    BETWEEN the two rows of a pair - centres at column x + 1.50, 3.45, 13.70, 15.70 for QSFP28
    and + 1.95, 4.85, 8.85, 11.75 for SFP28, on strips centred at panel y 28.4 and 57.8. Within
    each pair of marks the DOWN arrow serves the port below the strip and the UP arrow the port
    above it, so a strip carries four lamps for two ports. The strip is 6.4 mm tall and the marks
    were read at 7x before being assigned'
  mgmt-block: 'drawing - a ganged 2x2 RJ-45 block at 356.0/372.3 by 14.4/28.2 carrying BITS 0 and
    BITS 2 above and BITS 1 and PPS/TOD below; two SMB jacks at x 393.6 and 394.1; USB Type A on
    its side centred at 407.2, 33.6; MGMT and CONSOLE 1 RJ-45s at 413.5; a micro-USB CONSOLE 0 at
    402.9, 44.4 and a recessed RST button at 394.8, 44.6. The block is within 2 mm of the AGR400''s
    in every position, which is what a shared shell predicts'
  rj45-orientation: drawing - BITS 0, BITS 2, MGMT and CONSOLE 1 are keyway-UP; only BITS 1 and
    PPS/TOD, the lower row of the ganged block, are keyway-down. A 2-high ganged jack mirrors its
    rows so both release tabs stay reachable. std/rj45 draws keyway-down, so the other four carry
    rotate 180
  rj45-choice: Jason - use std/ before common/. std/rj45 is the IEC 60603-7 aperture; the
    hand-drawn common/rj45-shielded puts its integrated LEDs on the contacts side, which no real
    jack does. All six jacks are std/rj45@1, and MGMT's two LEDs are placed on top of it
  status-leds: drawing - DIAG, LOC, FAN, PS0 and PS1 on a 4.75 mm pitch beneath the timing block
    at y 45.0, legends beneath them at 48.9
  filters: 'drawing plus photo - the AGR420 front carries a top and a bottom air filter, and
    NEITHER is the AGR400 part. edgecore/agr-filter-top@1 is 353.5 mm wide and stepped for the
    AGR400''s TWO QSFP-DD blocks; this front has ONE QSFP-DD block, at the left, and the filter
    runs about 425 mm to clear the management corner. Both filters are therefore new components
    measured off this figure. Verified before assuming, as asked'
  rear: 'drawing plus Jason - two stacked PSU bays at the left, a grounding landing, then five fan
    bays. The AGR420 datasheet rear figure reads about 1.5 percent smaller than the AGR400 QSG
    figure for the same parts, which is within figure error, so the AGR400''s already-measured
    bay geometry is reused rather than re-derived: the two platforms share PSUs and fans (Jason),
    and re-measuring a shared part off a worse figure would only add noise. The AGR420 figure''s
    yellow callout box round the PSU pair starts at x 14, which does not fit a 60.1 mm PSU at
    x 6.26; the box is drawn loosely round the pair and the module faces inside it are what was
    matched'
  fan-labels: photo - the datasheet figure prints FAN 4 to FAN 0 vertically beside each bay. The
    real device (IMG_6809) prints them horizontally BELOW each bay with an airflow arrow to their
    left, the same as the AGR400. The real device wins
  grounding: photo - an IEC earth symbol with a two-hole plate beneath it, immediately right of
    the PSU bays, visible in IMG_6809. edgecore/agr-ground-plate@1 draws exactly this
  airflow: datasheet - both listed SKUs are front-to-back
  other-faces: 'photo - all four remaining faces were photographed and are modelled from those
    shots, not left blank. Top (IMG_6808): two rectangular labels near the front right and a
    caution notice at the rear left. Bottom (IMG_6812): rivets and formed dimples in five columns,
    no labels. Sides (IMG_6810 left, IMG_6811 right): a cluster of eight rack-bracket holes near
    the front and rivets along the length. Positions are photo-measured against the 440 mm width
    and the 480 mm depth and are approximate - none of these shots is orthographic'
  labels: 'photo - RECTANGULAR. common/device-label is an oval recess belonging to another
    platform and is deliberately not used. The artwork is placeholder blocks: the real serial,
    SKU and MAC addresses are legible in IMG_6808 and are NOT transcribed'
  spec-table: datasheet - silicon, external TCAM, CPU, memory, flash, SSD, BMC, capacity, timing,
    power and environmentals transcribed into attrs. Where the datasheet and the QSG disagree -
    weight 16 vs 15.3 kg, max power 692 vs 527/723 W - both numbers are carried rather than one
    being silently chosen
  part-numbers: datasheet Ordering Information - AS7946-74XKSB-O-DC-F is FNPEC7946007Z and
    AS7946-74XKSB-O-AC-F is FNPEC7946008Z
attrs:
  role: aggregation router
  rack: 2 RU
  switch-silicon: Broadcom BCM88820 Qumran-2C
  external-tcam: Broadcom BCM16K knowledge-based processor
  cpu: Intel Xeon D-1548 8-core
  memory: DDR4 SO-DIMM 32 GB (2 x 16 GB)
  boot-flash: SPI, redundant 2 x 16 MB
  storage: M.2 SSD 128 GB
  bmc: ASPEED AST2600
  capacity: 2.4 Tb/s
  timing: SyncE and IEEE 1588v2 PTP
  weight: 16 kg with PSUs and fans (datasheet); QSG says 15.3 kg
  power-max: 692 W (datasheet); QSG says 527 W at 25 C and 723 W at 45 C
  power-typical: 201 W
  psu-dc-input: -40 to -75 VDC, 40 A max per PSU
  psu-ac-input: 100-120 V 12 A or 200-240 V 7.5 A, 50-60 Hz per PSU
  operating-temp: 0 C to 45 C
  storage-temp: -40 C to 70 C
  humidity: operating 5-85 percent, storage 5-95 percent, non-condensing
  nos: ONIE preinstalled; ONL and commercial NOS supported
