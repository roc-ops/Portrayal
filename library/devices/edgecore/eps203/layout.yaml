  top:
    size: {w: 438.0, h: 474.0}
    empty: >-
      Not drawn square-on by either staged document. The quick start guide's Overview and
      FRU figures are three-quarter renders and do show the lid - a plain sheet with two
      long pressed seams - but a three-quarter view gives no dimension to place them at,
      and this device's whole geometry problem is that its family's figures are not
      orthographic.
  bottom:
    size: {w: 438.0, h: 474.0}
    empty: >-
      Not drawn by any staged source. The guide's package contents list a rack mounting kit
      of two front-post and two rear-post brackets and a screw kit, and no rubber feet, so
      what is underneath is unrecorded rather than known to be bare.
  left:
    size: {w: 474.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. The machine is front-to-back, so the intake is the
      front face's own perforation band and the exhaust is the three rear trays; the side
      walls carry nothing either document shows.
  right:
    size: {w: 474.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. The other side wall, for the same reason.
configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two supplies and three fan trays in, every cage empty. All
      seven ordering codes are front-to-back, so there is no second airflow configuration
      to describe - unlike the EPS201 on the same shell, which has four of each.
references:
- {title: 'Edgecore AS4630-54NPE Quick Start Guide'}
- {title: 'Edgecore EPS203 / AS4630-54NPE Enterprise Switch Datasheet'}
