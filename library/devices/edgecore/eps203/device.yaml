format: 1
kind: device
name: eps203
version: 1.0.3
maturity: modelled
manufacturer: Edgecore
model: AS4630-54NPE
aliases:
- {name: EPS203, kind: marketing}
portfolio: {line: Enterprise, family: Access Switch, series: EPS203}
description: >-
  54-port multi-gigabit PoE access switch, 1RU, sold as the EPS203 and stamped AS4630-54NPE. ITS COPPER
  ROW IS NOT ONE RATE: 36 ports run 100M/1G/2.5G and the last 12 run 1G/2.5G/5G/10GBASE-T, and the split
  falls exactly on a ganged-block boundary - three gangs of six columns and then a fourth. All forty-eight
  deliver up to 90 W of PoE. Four 10G/25G SFP28 uplinks and two 100G QSFP28 stacking ports finish the
  face, numbered 49-52 and 53-54 into the same sequence. A stacked management/console RJ-45 pair, a Type-A
  USB storage port, STK M/S and Reset buttons and eight status lamps sit at the left and centre. TWO HOT-SWAPPABLE
  1200 W AC SUPPLIES AND THREE HOT-SWAPPABLE FAN TRAYS on the rear, front-to-back only. It shares its
  438 x 474 x 44 shell with edgecore/eps201.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage
      upright (rotate 0) over the lower turned 180, so both cage lips face the band between the two cages
      and both bails face outward. Decided by the rule, not an observation, so a photograph of the stack
      overturns it: the 2 SFP pairs (port-49/port-50 and port-51/port-52), the 1 QSFP pair (port-53/port-54).
  sources:
    confidence: datasheet
    note: >-
      EACH OF THE THREE EPS20x MODELS HAS ITS OWN GUIDE AND ITS OWN DATASHEET - six distinct files, no
      two sharing a hash, unlike the EPS121/EPS122 pair. This model's are eps203-qsg.pdf (md5 5d12d3c155d2c7f797d9dc9d1dfee0df)
      and eps203-datasheet.pdf (md5 2de53f6bea0e8050273532607423eaf0). THE TWO DOCUMENTS DISAGREE ABOUT
      THE MODEL NAME PRINTED ON THE PANEL. The datasheet's front elevation prints `AS4630-54NPE`, legible
      at 10x; the guide's port enlargement prints `AS4630-54NPEM`. The datasheet's body uses the shorter
      spelling nineteen times including its title block and every one of its seven ordering codes; the
      guide uses each spelling six times. The shorter one is drawn here because it is what this device's
      own elevation carries and what the ordering codes buy, and the disagreement is recorded as a gap
      rather than resolved by preference.
  gate-1:
    confidence: measured
    note: >-
      THIS IS THE ONLY EPS20x FIGURE THAT IS DRAWN STRAIGHT, and finding that out is what decided which
      of the three to model first. NONE OF THE THREE QUICK START GUIDES CONTAINS A SQUARE-ON ELEVATION
      - their Overview figures are three-quarter renders with the lid visible - so the only candidates
      for absolute geometry are the datasheets' Interfaces pages, embedded at about 1000 px across a 438
      mm face. That is 2.29 px/mm, one pixel to 0.44 mm, and less than half the instrument the EPS112
      had. SO EACH CANDIDATE WAS TESTED FOR ORTHOGRAPHY RATHER THAN JUST FOR ASPECT. Fitting the twenty-four
      RJ-45 column positions with `first + pitch*i + gutter*(i//6)`, over every row and four thresholds
      in each figure: this one's best fit has an **rms of 0.121 mm** and adding a quadratic term in i
      buys nothing (it implies a local-pitch change of -0.7% across the row, which is noise at this scale).
      The EPS201's best fit over 114 candidate rows is **rms 0.674 mm** and its quadratic implies **-5.0%**;
      the EPS202's is **rms 0.675 mm** at **+3.8%**. Those two figures are photographed at an angle, and
      a linear fit on them returns a pitch that is simply wrong - 13.65 mm on the EPS201 against this
      figure's 14.07 for the same jack. THE ASPECT AGREES with the published dimensions once the figure
      is known to be straight: the body reads 1002 x 100 px, ratio 10.020 against 438/44 = 9.955, which
      is +0.66% - within the one pixel that a 100-px-tall figure can resolve. Every measurement in this
      file uses 2.2877 px/mm with the panel origin at (1, 2). THE CROSS-CHECK THAT MATTERS: the fitted
      pitch of 14.0706 agrees with the EPS112's 14.0198 and the EPS121's 14.0158 - two other Edgecore
      access switches, measured on different documents at different scales - to five hundredths of a millimetre.
      That is the same RJ-45 jack, and it is an independent confirmation that this figure's scale is right.
  the-port-wall:
    confidence: measured
    note: >-
      FORTY-EIGHT RJ-45 IN TWENTY-FOUR COLUMNS OF TWO, ganged six and six and six and six. Fitted over
      all twenty-four columns on the bright dividers between ports: **pitch 14.0706, gutter 4.1518, first
      centre 34.5102, rms 0.121 mm, max residual 0.215**. The residuals show no bow, which is the test
      the other two figures fail. THE ROWS MIRROR, and which row is rotated was measured rather than assumed.
      On the guide's left-end enlargement the upper row's wide body occupies its cell from +3.45 to +10.36
      mm, where `std/rj45-ganged@2` rotated 180 puts it at +3.67 to +10.5 and unrotated would put it at
      +0.5 to +7.33; the lower row's reads +0.95 to +7.85, which is the unrotated case. So `rotate: {top:
      180}`, the same way round as the EPS112. THE ROW PITCH IS 13.92 AND COMES FROM THE BEZEL PLATE,
      not from the aperture centres, for the reason the EPS112 records: mirrored rows are not symmetric
      about their cells. The plate reads y 11.802 to 36.719 at two independent columns - height 24.916
      - and two 11.0 mm cells fill it with 2.92 between them. The EPS112's plate is 25.015 and its row
      pitch 13.94, measured on a different document; the two agree to a tenth of a millimetre, which is
      what one shared jack housing should do. THEN FOUR SFP28 as two stacked pairs at x 388.83 and 403.25
      - cage apertures 13.55 wide, rows at 16.61 and 30.82 - and TWO QSFP28 as one stacked pair at x 422.48,
      its cage 17.92 wide against `std/qsfp-ganged@1`'s 18.5, rows at 16.61 and 31.70.
  the-two-copper-rates-are-two-groups:
    confidence: datasheet
    note: >-
      THE DATASHEET SPLITS THE COPPER ROW AND THE SPLIT LANDS ON A GANG BOUNDARY. Its Interfaces callouts
      read "3. 36 x 100M/1000M/2.5G ports" and "4. 12 x 1G/2.5G/5G/10GBASE-T ports", and on the elevation
      callout 3's bracket covers the first three gangs and callout 4's the fourth. Eighteen columns then
      six columns; thirty-six ports then twelve. So ports 1-36 and 37-48 are two groups, and unlike the
      EPS112 - where the PoE split fell in the middle of a gang - here the metal and the grouping agree.
      BOTH GROUPS CARRY PoE UP TO 90 W. The prose is explicit: "all RJ-45 Ethernet ports can support up
      to 90 W Power-over-Ethernet" and "up to 90 Watts ... for all 48 RJ-45 ports, including the 10G ports".
      The key-features list gives the standards per group - 802.3af/at and bt Type 3/Type 4 on both -
      which is why the rate, not the PoE, is what separates them.
  the-status-lamps-and-buttons:
    confidence: measured
    note: >-
      EIGHT LAMPS IN TWO ROWS OF FOUR, and the datasheet's own list names only seven. The panel reads
      System / PSU1 / STK1 / FAN across the top and PRI / PSU2 / STK2 / PoE across the bottom, with each
      label to the right of its lamp; the datasheet's LEDs section lists "PRI, PSU1, PSU2, STK1, STK2,
      FAN, PoE" and omits System. Eight are drawn because eight is what the panel shows, and the guide's
      legend names all eight. MEASURED ON THE GUIDE'S BUTTON/LAMP ENLARGEMENT at 10.0422 px/mm - calibrated
      on four port-column centres this file already knows exactly, with a fit rms of 0.11 px, or 0.011
      mm. The lamps are 2.888 x 1.494, on x centres 154.18, 162.05, 170.01 and 177.88 - a pitch of 7.90
      - with rows centred y 3.74 and 7.22. TWO ROUND BUTTONS to their left: STK M/S at x 136.61 and Reset
      at x 145.97, both about 2.2 mm across on y 5.0. The guide legends them "STK M/S button" and "Reset
      button" and gives the stacking behaviour with the STK1/STK2 lamps. THE LAMP ROWS ARE DRAWN 0.70
      mm ABOVE WHERE THE ENLARGEMENT PUTS THEM, and that is a reconciliation rather than a reading. The
      enlargement's y is anchored on the bezel plate and gives rows at 3.74 and 7.22; the elevation puts
      the port-numeral band at 7.43 to 8.74, which would have the lower lamp row painting over the numerals
      for columns nine to eleven. The two crops disagree by about half a millimetre and the elevation
      is the one whose y is not borrowed, so the lamps move. Both figures are written down here so the
      next reader can take the other view. THE `Mgmt (up) (down) Console` LEGEND'S x IS NOT MEASURED.
      It is present and its reading order is unambiguous, but the only crop that shows it is the guide's
      left-end enlargement, whose x scale could not be tied down: its port openings imply 7.53 px/mm and
      its indicator spacing implies 6.9, a nine percent disagreement that no anchor in the crop resolves.
      The four marks are placed symmetrically about the jack pair's measured centre instead.
  the-port-indicators:
    confidence: measured
    note: >-
      ONE INDICATOR PER PORT in a row below the port wall, with the port's number printed to its left
      - the datasheet's callout 6 on the EPS201's identical face calls them "Port indicators", and the
      guide's legend gives the vocabulary: "RJ-45 Port LEDs: Green (link), Blinking (activity)", "SFP28
      Port LEDs: White (25G), Green (10G), Blinking (activity)", "QSFP28 Port LEDs: White (100G), Green
      (40G link), Blinking (activity)". THE ROW IS MEASURED AND THE PER-PORT OFFSETS ARE DERIVED, and
      the difference is worth stating. The band reads y 38.75 to 40.34 on the guide's enlargement, where
      y is anchored on the bezel plate and does not depend on that crop's x scale; the count is one per
      port, legible. THE INDIVIDUAL OFFSETS ARE NOT MEASURABLE HERE: on the elevation at 2.29 px/mm a
      2 mm window and a 3 mm digit are four and six pixels and the band resolves into 78 undifferentiated
      marks across 48 ports. So each port's indicator is placed at a quarter-pitch either side of its
      column centre - 3.518 mm - which is where the EPS112's are, measured at 11.9 px/mm on the same vendor's
      same legend style. Derived from a measurement of a sibling, not measured here, and said so.
  the-vent:
    confidence: measured
    note: >-
      A HEXAGONAL PERFORATION BAND along the top of the face, y 0.1 to 5.4. Measured on the guide's left-end
      enlargement at 7.53 px/mm, where eight separate rows of the image agree: **pitch 3.717 mm with a
      coefficient of variation of 0.009**, holes 2.39 across. The EPS112's are 3.611 and 2.70 - the same
      perforation tooling at a slightly different pitch. THE BAND'S ENDS ARE THE WEAK FIGURE. On the elevation
      the band reads dark from about x 26 to the right end with the button and lamp plate interrupting
      it, and at 2.29 px/mm the segment boundaries are good to about a millimetre. Two rects are drawn,
      x 26-128 and 192-382, and that is the accuracy claimed.
  the-rear:
    confidence: measured
    note: >-
      MEASURED ON THIS MODEL'S OWN REAR ELEVATION at 2.2785 px/mm - 998 px across 438 mm - and it is the
      weaker of the two figures: its aspect reads -2.66% against 438 x 44, and the three fan-tray handles
      measure 38.18, 37.74 and 37.30 wide, a 2% spread in one direction. So the rear carries about a millimetre
      of slack where the front carries a tenth, and every figure below is stated at that accuracy. THE
      BAY NUMBERS ARE OBSERVED AND NOT DRAWN. The elevation prints a small fan glyph and a numeral - 1,
      2, 3 - on the chassis web beside each tray, at about x 88, 137 and 186. At 2.28 px/mm that web is
      one millimetre wide, which is two pixels and less than the figure's own gradient, so any placement
      would either sit on the tray - where a seated module hides it, which is the thing lint's overlap
      rule exists to catch - or be invented. The marks are recorded here instead of drawn. THREE FAN TRAY
      BAYS at x 46.1, 94.1 and 142.4 on a pitch of 48.15, each 39.5 wide and running y 2.5 to 42.0. THE
      WIDTH IS NOT THE PITCH: there is an 8.6 mm chassis web between trays, which a first pass through
      this figure missed by reading each seam as the end of the tray before it rather than the start of
      the tray after. The EPS201's rear, measured the same way, gives all six edges - 47.4-86.4, 95.1-134.2,
      143.6-182.6 - and the handle settles it, because a 38-to-40 mm bar cannot be bolted to a 47.5 mm
      tray and leave the seams where they are. A BLANK PLATE from about x 192 to 268 with a single screw.
      TWO SUPPLY BAYS at x 270.0 and 354.0, 72.0 wide on a pitch of 84.0, and the chassis prints PS2 and
      PS1 on the web to the right of each. THE GROUNDING POINT is a plate at the far left, x 4 to 44,
      with two holes and an IEC earth symbol - the datasheet's callout 11.
  finish-and-airflow:
    confidence: measured
    note: >-
      COUNTED, AND ON THIS FAMILY THE COLOUR IS A CLAIM ABOUT AIRFLOW. Over the whole rear elevation 2,748
      pixels pass a red test (R>110, R>G+40, R>B+40) at a median of (239, 57, 39), and every one of them
      is on the three fan-tray handles; the chassis, the blank plate, the ground point and the two supplies
      carry none. THE PROSE CONFIRMS IT INDEPENDENTLY, which is what keeps this from being the AIS800
      convention imported on faith. This model's datasheet reads "Front-to-back airflow only" and all
      seven of its ordering codes are -F. Its shell-mate the EPS201 ships both - eight codes, four -F
      and four -B, and two fan part numbers - and its datasheet's rear draws the handles BLUE while its
      own guide's fan-replacement figure draws them RED. Red is front-to-back, blue is back-to-front,
      and this machine only comes one way.
  power:
    confidence: datasheet
    note: >-
      THE SUPPLY IS 1200 W AND THE DRAWING SAYS OTHERWISE. Three published statements agree: the Power
      section's "2pcs 1+1 redundant, load-sharing, hot-swappable 1200 W AC (80 PLUS Platinum compliant)",
      the Interfaces callouts "9. PSU 2: 1200 Watts" and "10. PSU 1: 1200 Watts", and the ordering table's
      "YPEB1200AM-1A03P10 ... 1200 W AC Power Supply (3Y)". The rear elevation prints "2kV 920W" on each
      supply's fan hub, legible at 12x, and three published statements outrank one silkscreen on a render,
      so 1200 is carried and the hub text is recorded. WHAT THE HUB TEXT IS was worked out afterwards,
      on `edgecore/eps202`, and this note is corrected rather than left as it was. That machine takes
      the SAME supply - the ordering table names both chassis - and its rear elevation prints "2kV 1200W"
      on the same hub. So the label tracks the supply's output, not the fan, and this figure's "920W"
      is an inconsistency between two renders of one part rather than a different quantity. The conclusion
      here was right; the first explanation of it was not. THE MACHINE'S FIGURES: maximum power consumption
      "Low-line: 2000 Watts High-line: 2400 Watts"; input "Low-line: 15A for 90VAC-136VAC (1000 Watts)
      High-line: 8.A for 180VAC -264VAC (1200 Watts)", the high-line current printed with a missing digit
      in the source; PoE budget with a 30 W guard band "Low-line: 700 W for 1 PSU/1700 W for 2 PSU, High-line:
      900 W for 1 PSU/2100 W for 2 PSU".
  why-the-parts-are-named-for-their-FRUs:
    confidence: datasheet
    note: >-
      THE ORDERING TABLES NAME THE PARTS AND SAY WHICH CHASSIS TAKE THEM. `FAN-1U-1x1M` is listed in all
      three EPS20x datasheets as "Fan Module ... (for EPS201/AS4630-54TE, EPS202/AS4630-54PE, EPS203/AS4630-54NPE)"
      - one tray in three chassis - so the part is `edgecore/eps200-fan-tray@1` rather than being named
      after this one. `YPEB1200AM-1A03P10` is "1200 W AC Power Supply (3Y) ... (for EPS202/AS4630-54PE,
      EPS203/AS4630-54NPE)" - two chassis, not three, because the EPS201 takes a 150 W `YM-1151D` instead
      - so it is `edgecore/eps200-psu-1200w@1`. This is the ruling roc-ops/Portrayal#426 made for the
      2RU fan tray applied before the second chassis arrives rather than after.
attrs:
  environmental: {operating-temp: 0 to 45 C (32 to 113 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: 'Operating:
      5% to 90% non-condensing'}
  physical: {weight-note: 8.5 kg (18.74 lb)}
  power:
    power-consumption: Low-line 2000 W max; high-line 2400 W max
    system-input-rating-per-psu: Low-line 15 A for 90-136 VAC (1000 W); high-line 180-264 VAC (1200 W)
    poe-budget: >-
      With a 30 W guard band - low-line 700 W with one PSU, 1700 W with two; high-line 900 W with one,
      2100 W with two
  features:
    optics-sfp: >-
      Four 10G/25G SFP28 uplinks, ports 49-52. The datasheet's transceiver list gives 10GBASE-RJ-45, 10G
      DAC/AOC, 25GBASE-SR/LR, 25G DAC/AOC, 40GBASE-SR4/LR4, 40G DAC/AOC, 100GBASE-SR4/CWDM4/LR4 and 100G
      DAC/AOC for the chassis as a whole; no per-cage breakout table is published, so none is stated here.
    optics-qsfp28: >-
      Two 100G QSFP28 ports, 53-54, sold as stacking ports - "subject to NOS implementation, also can
      be used as data transmission ports". Whether stacking is available is a software question the hardware
      cannot answer, which is why it is here and not in a group's role.
    poe: >-
      All forty-eight RJ-45 ports deliver up to 90 W. The key-features list gives the standards per rate
      group: 36 x 1G/2.5G at IEEE 802.3af/at and bt Type 3/Type 4 90 W, and 12 x 1G/2.5G/5G/10G at the
      same. Cat 6 cabling, per the datasheet's prose.
  lifecycle: {eol: none-announced}
chassis: {width: 438.0, height: 44.0, depth: 474.0, ru: 1, weight-kg: 8.5, color: '#3c3f43', airflow: front-to-back}
gaps:
- what: the-model-name-on-the-panel
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    WHICH SPELLING THE METAL CARRIES. The datasheet's front elevation prints `AS4630-54NPE` and the quick
    start guide's port enlargement prints `AS4630-54NPEM`, both legible at 10x, and the two are renders
    of the same face by the same vendor. The datasheet's body, its title block and all seven of its ordering
    codes use the shorter form, so that is what is drawn - but a trailing M on a silkscreen is exactly
    the kind of thing an ordering code drops. A photograph of a real unit's right-hand end closes it.
- what: the-eps20x-front-elevations
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    A SQUARE-ON ELEVATION OF THE EPS201 AND THE EPS202. Neither model's own datasheet figure is orthographic:
    fitting their twenty-four RJ-45 columns gives rms 0.674 and 0.675 mm against this model's 0.121, with
    quadratic terms implying the local pitch changes -5.0% and +3.8% across the row. Their quick start
    guides contain no square-on figure at all. This device's face is measurable and theirs are not, which
    is why it is modelled first; the EPS201 shares this exact shell and could be carried from here, but
    the EPS202 is 32 mm shallower and 0.3 mm lower and cannot be assumed to share it.
- what: the-port-indicator-offsets
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    WHERE EACH PORT'S INDICATOR SITS RELATIVE TO ITS COLUMN. The row is measured - y 38.75 to 40.34, one
    window per port, number to its left - but at 2.29 px/mm the elevation resolves the band into 78 undifferentiated
    marks across 48 ports, and the guide's enlargement of that end is calibrated too loosely in x to place
    them. They are drawn at a quarter-pitch either side of each column centre because that is where the
    EPS112's are, measured at 11.9 px/mm. One enlargement of this device's lower edge closes it.
- what: the-rear-figure-gradient
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A REAR ELEVATION WITHOUT THE 2 PERCENT GRADIENT. The three fan-tray handles - the sharpest repeated
    feature on the face - measure 38.18, 37.74 and 37.30 wide left to right, and the figure's aspect reads
    -2.66% where the front's reads +0.66%. Nothing on the rear is wrong by more than about a millimetre,
    and nothing on it is better than that either. The fan and supply pitches are the reliable figures;
    their individual widths are not.
groups:
  rj45-2g5:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-six 100M/1G/2.5G RJ-45 ports - the datasheet's callout 3 - which are the first three
      ganged blocks of six columns, ports 1 to 36. They deliver up to 90 W of PoE, the same as the twelve
      beside them; what separates the two groups is rate.
    attrs: {media: rj45, speed: 2.5g, poe: 'IEEE 802.3af/at and bt Type 3/Type 4, up to 90 W per port'}
  rj45-10g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the twelve 1G/2.5G/5G/10GBASE-T RJ-45 ports - the datasheet's callout 4 - which are the fourth ganged
      block, ports 37 to 48. The datasheet is explicit that these carry PoE too: "up to 90 Watts ... for
      all 48 RJ-45 ports, including the 10G ports".
    attrs: {media: rj45, speed: 10g, poe: 'IEEE 802.3af/at and bt Type 3/Type 4, up to 90 W per port'}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the four 10G/25G SFP28 uplinks, two stacked pairs, numbered 49-52 into the same sequence as the
      copper ports.
    attrs: {media: sfp, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two 100G QSFP28 ports, one stacked pair, numbered 53-54. The datasheet sells them as stacking
      ports "subject to NOS implementation" and adds that they "also can be used as data transmission
      ports", so the role here is traffic and the stacking claim lives in attrs where a reader can see
      whose claim it is.
    attrs: {media: qsfp28, speed: 100g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the fifty-four port indicators, one per port, in a row below the port wall with each port's number
      printed to its left.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the left - a stacked RJ-45 pair carrying the management port over the
      console port, and a Type-A USB storage port above them. The datasheet's callouts 1, 7 and 2.
  buttons: {term: Button, role: service, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        "2pcs 1+1 redundant, load-sharing, hot-swappable 1200 W AC", two bays, either of which runs the
        switch. THE PoE BUDGET IS NOT 1+1 AND THE DATASHEET SAYS SO: it publishes the budget twice over,
        "700 W for 1 PSU/1700 W for 2 PSU" at low line and "900 W for 1 PSU/2100 W for 2 PSU" at high
        line. Losing a supply keeps the switch up and takes more than half the power it can deliver to
        attached devices.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 2+1
      redundancy-note: >-
        "Hot-swappable 2 + 1 redundant fan trays", in the key features and in Interfaces callout 8, over
        THREE BAYS - so the figure and the bay count agree and no exemption is needed. Unlike the EPS1xx
        family's fixed fans these are FRUs: the guide carries a Fan Tray Replacement procedure, "Loosen
        the fan tray screw. Remove fan tray from the chassis. Install replacement fan with matching airflow
        direction."
