format: 1
kind: device
name: dcs202
version: 1.0.0
maturity: draft
manufacturer: Edgecore
model: AS5835-54T
portfolio: {line: Cloud Data Center, family: Leaf Switch, series: DCS202}
description: >-
  48x 1/10GBASE-T RJ-45 and 6x 100G QSFP28 data-centre leaf switch, sold as the DCS202 -
  the copper-access member of the DCS201's shell. All fifty-four ports, both management
  jacks, the console and the USB are on the FRONT; two supplies and five fan trays are on
  the rear, and the rear is the DCS201's, proven rather than assumed. Ports number 1-54 and
  run DOWN each column. Ships front-to-back and back-to-front.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, MEASURED OFF THE PDF PAGE.
      dcs202-datasheet (the DCS202 / AS5835-54T data sheet) holds the specification tables and
      a photographic product shot; dcs202-qsg (the AS5835-54T Quick Start Guide) holds the
      panel art. THIS GUIDE IS MUCH THINNER THAN ITS SIBLING'S - 59 figures against the
      DCS201's 108, and it has NO Overview section at all. It goes from Package Contents
      straight to installation, so the only full-panel drawing in the whole corpus is the
      package-contents thumbnail on page 1, which shows the front and the rear stacked.
      It also carries the family disclaimer: "The switch drawings in this document are for
      illustration only and may not match your particular switch model."
  gate-1:
    confidence: measured
    note: >-
      FAILS ON THE ASPECT, AND WORSE THAN THE DCS201's DID. The front reads 1425 px wide on a
      face whose drawn height is nothing like 1/10.07 of that, because this is the same kind of
      perspective render as the sibling's and at 3.22 px/mm rather than 5.06 - the whole device
      is a thumbnail beside a picture of the bracket kit. The top cover is drawn above the face
      and the face is foreshortened.
      SO THE VERTICAL IS NOT USED AT ALL and the horizontal is used only where the ruler and the
      thing measured sit at the same height. That is the same split the DCS201 made, for the
      same reason, with less resolution to spend.
  why-this-is-draft-and-not-modelled:
    confidence: estimated
    note: >-
      THE WALL'S ANCHOR IS NOT SETTLED, AND GATE 5 CANNOT BE ASSERTED. Two bands of the same
      reference disagree about where column 1 is by nearly a full pitch: profiling the jack
      openings at page y948-958 fits column 1 at 27.95 mm, and profiling the row at page
      y913-940 puts it at 37.7. Both fits are internally consistent - each gives a clean 13.97
      pitch across its own run - so the disagreement is about WHICH feature is being detected
      (opening, bezel, or shadow) rather than about the pitch, and at 3.22 px/mm on a
      perspective thumbnail I could not tell them apart.
      Everything else here is sound and is left in place: the chassis is stated in this
      device's own guide, the rear is carried from the DCS201 and PROVEN against this device's
      own figure to 0.78 mm, the supplies and fan are the DCS201's on identical specification
      tables, the port count and block structure are counted, and the pitch is the registry's.
      What is missing is one number - the wall's left anchor - and with it the numeral and
      legend placement that hangs off it.
      SO THIS SHIPS AS DRAFT RATHER THAN AS A MODEL WHOSE GATE 5 SENTENCE WOULD BE UNTRUE. A
      square-on photograph of the front, or any elevation, closes it in one pass.
  the-x-axis-is-measured:
    confidence: measured
    note: >-
      The RJ-45 wall's own pitch is the ruler. The lower row of jack openings resolves as 24
      clean bright boxes whose steps read 13.97 mm against std/rj45-ganged@2's registry pitch of
      13.97 - a lookup from a TE magjack CAD, not a measurement - agreeing to two decimal places
      across twenty-one of the twenty-three steps.
      THREE ANCHORS, EACH CHECKED AGAINST ITS OWN EIGHT COLUMNS. Block A's first column centres
      at 41.92, block B's ninth at 159.14 and block C's seventeenth at 276.21. One block with
      gang 8 and a 5.46 gutter puts the seventeenth at 276.36, which is 0.15 mm from where it is
      drawn, so all twenty-four columns follow from three readings and a registry constant.
  the-y-axis-is-derived:
    confidence: estimated
    note: >-
      NOT MEASURED. The rows sit at 3.0 and 15.1, which is the ~12.1 mm belly-to-belly spacing
      std/rj45-ganged@2's registry notes record from the TE 2497310-1 CAD, started at the 3.0 mm
      top margin this vendor's 1RU faces use and edgecore/as5912-54x already carries. The wall
      then ends at 26.1 and leaves 17.9 mm for the label strip and the bottom vent, which is the
      proportion the drawing shows. None of it is a reading.
  the-rear-is-carried-over-and-proven:
    confidence: borrowed
    note: >-
      CARRIED FROM edgecore/dcs201, AND THEN CHECKED AGAINST THIS DEVICE'S OWN FIGURE. The
      programme's rule is that an inherited number is marked carried over rather than measured;
      this one is both, because the check passed. The five honeycomb grilles in the DCS202's own
      rear thumbnail centre at 102.82, 161.72, 220.94, 280.00 and 338.91 mm, against the
      DCS201's 103.6, 162.5, 221.4, 280.1 and 338.9 - five modules agreeing to 0.78, 0.78, 0.46,
      0.10 and 0.01 mm, and a bay pitch of 59.02 against 58.82, 0.3% apart. Two figures in two
      documents drawn for two devices landing inside a millimetre is what makes this a carry and
      not a guess.
      THE ARRANGEMENT IS IDENTICAL TOO: a supply at each end with a C14 inlet, a wire bail
      handle and a coloured latch, five honeycomb fan trays between them with pull bars and
      airflow diamonds, and the grounding screw outboard of the left-hand supply.
  the-same-supplies-and-the-same-fan:
    confidence: datasheet
    note: >-
      THE SPECIFICATION TABLES ARE WORD FOR WORD. This guide's AC PSU section reads "100-240
      VAC, 50-60 Hz, 400 Watts" with the breakdown "100-127 VAC, 47-63 Hz, 6.0 A / 200-240 VAC,
      47-63 Hz, 3.0 A", and its 48 VDC PSU section reads "48 VDC, 400 Watts" and "-36 - -75 VDC,
      14-7 A". Those are the DCS201's figures character for character, the faces drawn are the
      same faces, and the bays measure the same. So this device seats edgecore/dcs201-psu-ac@1,
      edgecore/dcs201-psu-dc@1 and edgecore/dcs201-fan@1 rather than copies of them under a
      second name. The parts carry a shared-with key recording that.
  the-jacks-are-lamped-and-the-management-jacks-are-not:
    confidence: measured
    note: >-
      THE SAME SPLIT AS THE SIBLING, AND HERE IT PUTS MOST PORTS ON THE LAMPED PART. The
      traffic jacks are Ethernet and light: "For the RJ-45 ports: Green - 10 Gbps mode, Amber -
      1 Gbps mode", which is the pair of bezel lamps common/rj45-ganged-eth@1 draws, so all 48
      take it and L76 is satisfied without argument.
      THE TWO MANAGEMENT JACKS DO NOT. Their label strip prints "MGMT" between an up and a down
      arrow with two plain windows beneath it and "On = link / Flash = ACT" beside them - the
      lamps are in the strip, not in the bezel - so those two take the BARE ganged part and
      their lamps are placed where the metal puts them, exactly as on the DCS201.
  lamps:
    confidence: datasheet
    note: >-
      quick start, Connect Network Cables, verbatim: "For the RJ-45 ports: Green - 10 Gbps mode,
      Amber - 1 Gbps mode" and "Each QSFP28 port has four LEDs that indicate valid links in the
      following modes: 1 LED Green - 100 Gbps mode, 1 LED Blue - 40 Gbps mode, 1-4 LEDs Amber -
      25 Gbps breakout mode (four lanes), 1-4 LEDs Purple - 10 Gbps breakout mode (four lanes)".
      Verify Switch Operation adds "the PSU1/PSU2, OS Diag, and Fan LEDs should all be on green".
      ONE LAMP PER QSFP PORT IS DRAWN rather than four, the same simplification the DCS201 and
      edgecore/as5912-54x make, because the art does not resolve four windows at 3.22 px/mm.
  the-breakout-legend:
    confidence: measured
    note: >-
      PRESENT, AND CARRIED IN STRUCTURE RATHER THAN IN POSITION. The label strip prints the same
      six bracketed groups of four numbered lane boxes the DCS201 has, one per QSFP28 port. At
      3.22 px/mm the boxes resolve as a row of marks but their individual centres do not, so
      they are placed on this device's own measured column grid - each group sitting under the
      columns the drawing puts it under - rather than by reading twenty-four box centres the
      figure cannot give. The count, the bracket labels and which ports they name are read; the
      millimetres are constructed.
  power:
    confidence: datasheet
    note: >-
      datasheet and quick start: "323 Watts maximum" for the chassis, against two 400 W supplies,
      so one supply carries the box and the second is redundant.
attrs:
  environmental:
    operating-temp: '0 to 45 C'
    storage-temp: '-40 to 70 C'
    humidity: '5% to 95% non-condensing'
  physical:
    weight-note: '9.59 kg (21.14 lb), with two installed PSUs'
  features:
    optics-qsfp28: >-
      quick start: DAC cables or QSFP28 transceivers; "1 LED Green - 100 Gbps mode, 1 LED Blue
      - 40 Gbps mode", with 25 Gbps and 10 Gbps four-lane breakout modes.
  compliance:
    emissions: EN 55032 Class A, EN 61000-3-2, EN 61000-3-3, AS/NZS Class A, ICES-003 Class A, FCC Class A, VCCI Class A, BSMI Class A, KC Class A (AC SKU only)
    immunity: EN 55024/55035, IEC 61000-4-2/3/4/5/6/8/11
    safety: UL (CSA 22.2 No 62368-1 & UL62368-1), CB (IEC/EN62368-1), BSMI CNS 15598-1
  lifecycle: {eol: none-announced}
chassis: {width: 442.5, height: 43.95, depth: 473.3, ru: 1, weight-kg: 9.59, color: '#2b2f33',
  airflow: front-to-back}
gaps:
- what: no-panel-elevation-in-this-corpus
  scope: [front, rear]
  reason: needs-drawing
  wanted: >-
    An elevation, of either face. The DCS201's guide has an Overview section with the front
    and rear drawn across half a page each; this one has no Overview at all, so the only
    full-panel art anywhere in the DCS202's corpus is the package-contents thumbnail on page 1
    - both faces stacked, beside a picture of the bracket kit, at 3.22 px/mm where the sibling
    gave 5.06. That is enough to read the architecture, the port count, the block structure
    and the label strip, and enough to pitch-calibrate the horizontal. It is not enough for
    the vertical, and it is not enough to read the breakout legend's individual boxes.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Nothing in this corpus draws
    any of them flat; the mounting figures show the lid and one side in three-quarter view
    while brackets go on, which shows nothing is printed there and gives nothing to model.
    Each carries an `empty:` sentence saying where I looked, per
    docs/deliberately-empty-faces.md - empty by verification, not by omission.
- what: breakout-legend-box-positions
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The individual centres of the twenty-four lane boxes. The label strip carries the same six
    bracketed groups of four the DCS201 has, and at 3.22 px/mm the groups resolve but the
    boxes inside them do not. They are therefore MAPPED from the DCS201's measured grid onto
    this device's own columns - x = 27.95 + (x201 - 32.78) x 13.97/14.25, which is the two
    walls' anchors and pitches - rather than read off this figure. The count, the bracket
    labels and which port each names are read here; the millimetres are constructed.
      I TRIED SCALING THEM AND GATE 5 DISPROVED IT. The first construction mapped the DCS201's
      grid onto this device's narrower columns - x = 27.95 + (x201 - 32.78) x 13.97/14.25 -
      on the assumption that the legend tracks the port pitch. Put beside the reference at
      matched scale that put every group about 8 mm left of where it is drawn. The legend does
      NOT track the wall: this device's first bracket starts at roughly 163.5 where the
      DCS201's measured 163.82, so the strip is printed at the same absolute place on both
      faces. The DCS201's measured grid is therefore used unshifted, which is a borrowing with
      one checked anchor rather than an arithmetic guess.
- what: dc-supply-face
  scope: [rear]
  reason: needs-photo
  wanted: >-
    An elevation of the DC supply, which this corpus lacks exactly as the DCS201's does. The
    part it seats, edgecore/dcs201-psu-dc@1, already records that its face comes from a
    three-quarter figure; nothing here improves on it.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - two 1000BASE-T RJ-45 management jacks stacked at the left of
      the face, and at its right an RJ-45 console port with a USB Type-A beside it. Two media
      and three jobs, one purpose: reaching this box when the data plane cannot.
  leds: {term: LED, role: indicator, index-origin: 1}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: redundant hot-swappable AC or -48 VDC PSUs. Each is rated 400 W against a
        chassis drawing 323 W maximum, so one supply carries the box and the second is
        redundant rather than additive.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '4+1'
      redundancy-note: >-
        datasheet: "4+1 redundant fan modules", five bays on the rear face - the same figure
        and the same five bays as the DCS201, whose rear this one is.
