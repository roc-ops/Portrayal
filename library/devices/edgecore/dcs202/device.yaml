configurations:
  ac-f2b:
    kind: orderable
    description: Dual 400 W AC PSUs, front-to-back airflow - red handles and red release latches
    default: true
  ac-b2f:
    kind: orderable
    description: >-
      Dual 400 W AC PSUs, back-to-front airflow. This guide states the rule in its own Caution: "All installed
      modules must have a matching airflow direction", and the family convention it shares colours B2F
      handles and latches blue.
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      dcs201-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      dcs201-psu-ac: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
  dc-f2b:
    kind: orderable
    description: Dual 400 W -48 VDC PSUs, front-to-back airflow - red handles and red release latches
    bays: {psu-1: edgecore/dcs201-psu-dc@1, psu-2: edgecore/dcs201-psu-dc@1}
  dc-b2f:
    kind: orderable
    description: Dual 400 W -48 VDC PSUs, back-to-front airflow - blue handles and blue release latches
    airflow: back-to-front
    region-context: {exhaust: Intake}
    bays: {psu-1: edgecore/dcs201-psu-dc@1, psu-2: edgecore/dcs201-psu-dc@1}
    component-attrs:
      dcs201-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      dcs201-psu-dc: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
