format: 1
kind: device
name: eps122
version: 2.0.8
maturity: modelled
manufacturer: Edgecore
model: AS4625-54P
aliases:
- {name: EPS122, kind: marketing}
portfolio: {line: Enterprise, family: Access Switch, series: EPS122}
description: >-
  48 x 1G RJ-45 PoE plus 6 x 1G/10G SFP+ 1RU access switch, sold as the EPS122 and stamped AS4625-54P. All ports on the front in TWO ROWS OF TWENTY-FOUR COLUMNS ganged in three blocks of eight, numbered 1-48, with the SFP+ uplinks numbered 49-54. THE RJ-45 ROW IS TWO PoE CLASSES AND THE PANEL SAYS WHICH: ports 1-40 at 30 W and ports 41-48 at 90 W, the latter marked with orange bands above and below and legended "0.53A Max/Port1-40, 1.65A Max/Port41-48". An RJ-45 management jack over an RJ-45 console, a Micro-USB storage port, a Reset button and six status lamps. TWO HOT-SWAPPABLE SUPPLIES AND THREE FIXED FANS on the rear. Its sibling edgecore/eps121 is the same chassis without PoE.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 3 SFP pairs (port-49/port-50 to
      port-53/port-54).
  sources:
    confidence: datasheet
    note: >-
      ONE QUICK START GUIDE COVERS BOTH MODELS and it is staged twice, byte-identical -
      md5 c81e696fe001edaa86961a6660f8da00, 1343641 bytes. Its title page reads "Ethernet
      Switch AS4625-54T | AS4625-54P" and its package contents "AS4625-54T/AS4625-54P
      (includes 2 PSUs)". Each model additionally has its own four-page datasheet with its
      own photographs of both faces.
      THE GUIDE DISCLAIMS ITS OWN DRAWINGS - "Note: The drawings in this document are for
      illustration only and may not match your particular model" - and on this family that
      is not boilerplate to ignore: see the status-lamp note below.
  gate-1:
    confidence: measured
    note: >-
      SIX INSTRUMENTS, AND ALL SIX SAY THE HEIGHT IS 44.45 mm RATHER THAN THE SPECIFICATION
      TABLE'S 44. The guide's four elevations read 2215x224, 2213x224, 2213x224 and
      2219x224 px; the two datasheet front photographs 3991x404 and 3998x408. Against
      440 x 44 they come out -1.116%, -1.205%, -1.205%, -0.938%, -1.213% and -2.010%.
      Against 440 x 44.45 - true 1RU - they come out -0.105%, -0.195%, -0.195%, +0.076%,
      -0.203% and -1.008%. Six failures become six passes and the spread collapses by an
      order of magnitude, so the table's "44" is a rounding and the drawings are to 44.45.
      EVERY y MEASUREMENT IN THIS FILE USES THE 44.45 SCALE. On a 44 mm face the difference
      is half a millimetre at the bottom edge, which is the size of the features being
      measured. `chassis.height` still records the vendor's published 44: this is a
      drawing-scale fact, not a dimension change.
      WHICH INSTRUMENT FOR WHICH JOB, and this one is the opposite of the DCS520's. The
      guide's LINE ART is the geometry instrument, and the datasheet PHOTOGRAPHS are for
      detail and colour - because the ganged-pitch fit below comes out with an rms of
      0.082 mm on the line art and 0.74 mm on the photograph. NATIVE RESOLUTIONS, since a
      page render is not one: the guide's elevations are embedded JPEGs about 1119 px
      across, about 2.5 px/mm (5.03 in a 600 dpi page render), and the datasheet front
      photograph is embedded at 1004 px, 2.29 px/mm (9.07 in a page render, a 4x upsample).
      White RJ-45 bezels are soft in a photograph; a drawn edge is not.
  the-port-wall:
    confidence: measured
    note: >-
      FORTY-EIGHT RJ-45 IN TWO ROWS OF TWENTY-FOUR COLUMNS, ganged in THREE BLOCKS OF
      EIGHT. Fitted by least squares over all twenty-four columns with a per-block offset,
      on the mean of both rows' openings: **pitch 14.0158, gutter 6.4058, first centre
      15.425, rms 0.082 mm, max residual 0.17**. Rows read y 14.96-22.78 and 27.29-34.66 on
      the photograph, centres 18.87 and 30.97, so a row pitch of 12.10.
      THEN SIX SFP+ AS THREE STACKED PAIRS at x 370.20, 387.98 and 405.75 - a pitch of
      17.78 - with rows at 16.67 and 32.25. The SFP rows are further apart than the RJ-45
      rows because that block has a divider band between its cages where the RJ-45 block has
      none; both were measured, neither was assumed from the other.
      NUMBERING IS ONE SEQUENCE ACROSS BOTH FAMILIES: RJ-45 1-48, SFP+ 49-54, legended
      `N (up)(down) N+1` above each column.
  the-management-cluster:
    confidence: measured
    note: >-
      AT THE RIGHT, STACKED: an RJ-45 management jack over an RJ-45 console jack - the panel
      legends them "(up) Mgmt" and "Console" - with a MICRO-USB storage port below under a
      "USB" label. Both jacks read rows 18.75 and 30.86, which is the RJ-45 block's own row
      pitch to 0.12 mm, so they sit in the same stack the traffic ports do.
      THE MICRO-USB IS WORTH NAMING because the third member of this shell family does not
      have one: the EPS112's guide lists a full-size "USB storage port" where this one lists
      a "Micro-USB storage port". The clusters are not interchangeable between the three.
  the-status-lamps-and-what-the-shared-guide-cannot-settle:
    confidence: measured
    note: >-
      SIX LAMPS IN TWO ROWS OF THREE, on a black plate beside the Edge-core logo and the
      model text, with a Reset button between them. Measured on the guide's Status LEDs
      enlargement, calibrated on the port columns it draws (`1 (up)(down) 2` through
      `11 (up)(down) 12`, whose centres this file already knows exactly) at 22.62 px/mm -
      four and a half times the elevation: lamp columns at x 53.2, 61.0 and 68.9, rows at
      y 4.50 and 7.90, which the elevation's own label baselines independently confirm at
      4.46 and 7.98.
      THE LEGEND, transcribed from the guide: System green = OK, amber = fault detected;
      PSU1/2 green = OK, amber = fault; FAN green = OK, amber = fault; LOC blinking amber =
      switch locator; PoE green = OK, amber = near PoE budget.
      THE ENLARGEMENT IS OF THIS MODEL - it is captioned AS4625-54P - so the six lamps and
      their legends are read rather than inherited. Its sibling the EPS121 is the one with
      the doubt: it has no PoE, and no enlargement of its own.
  power:
    confidence: datasheet
    note: >-
      THE POE MACHINE. "AS4625-54P: Low-line (90-136 VAC): 2000 Watts max. High-line
      (180-264 VAC): 2400 Watts max." power consumption at 25 C; a per-PSU system input
      rating of "100-120 VAC, 50/60 Hz, 12 A max. / 200-240 VAC, 50/60 Hz, 8.5 A max."; and
      a PoE budget of "Low-line: 850 W for 1 PSU, 1850 W for 2 PSUs. High-line: 1050 W for
      1 PSU, 1920 W for 2 PSUs".
      THE PER-SUPPLY OUTPUT IS NOWHERE STATED and is not invented - the supplies' own
      contract omits `power-output-w` rather than guess it.
      THE POE SPLIT IS PRINTED ON THE PANEL. The guide's right-hand enlargement shows the
      legend "PoE Output: 57V ... Max., 0.53A Max/Port1-40, 1.65A Max/Port41-48", and the
      Overview callouts match it: "40 x 1G RJ-45 PoE ports (30 W per port)" and "8 x 1G
      RJ-45 PoE ports (90 W per port)". So ports 41-48 are the 90 W ones, and the panel
      marks them with an orange band. The guide prints the tilde form "Port1~40" and
      "Port41~48"; the current reads 1.65 A, not 1.85 - re-read at 600 dpi, and 1.65 A at
      57 V is 94 W, near the callout's 90 W, where 1.85 A would be 105 W.
  the-90w-bands:
    confidence: measured
    note: >-
      TWO ORANGE BANDS, NOT ONE: a strip behind the legend row above ports 41-48 and a
      second behind the lamp row below them. Both elevations of this model draw both - the
      guide's line art and the datasheet photograph - and the guide's right-hand enlargement
      shows them carrying the 41-48 legends above and the port lamps below.
      MEASURED ON THE GUIDE'S FRONT ELEVATION AT ITS NATIVE RESOLUTION, the embedded JPEG of
      1119 x 122 px. Calibrated on the centres of the first and third cream RJ-45 bezel
      blocks (64.485 and 301.545 in this file), x reads 2.52 px/mm, so one source pixel is
      0.4 mm and the figures are rounded to that. Both bands start at x 301.7, in the gap
      between the 39/40 and 41/42 columns, which is the third block's own centre, and run 2
      to 3 px past the drawn bezel's right end; against this file's bezel, which ends at
      357.5, they end at 358.5. y is read on the VERTICAL scale, the face's own 111 px over
      44.45, 2.50 px/mm: upper band y 8.4-11.6, lower y 38.6-42.8. The horizontal scale
      would put both 0.1-0.4 mm higher. The datasheet photograph (embedded at 2.29 px/mm,
      calibrated on the outer bezel edges) agrees to 1 mm.
      COLOUR COUNTED, NOT GLANCED AT: a median of (228, 102, 31) over 19,502 saturated pixels
      on the guide's enlargement, the highest-resolution source; (214, 97, 33) over 2,382 on
      the elevation. The datasheet photograph prints it redder, (243, 97, 93), and is not
      used for colour. Sibling edgecore/eps112 marks its own 90 W ports with #e65919,
      counted on its own guide at (230, 89, 25). The two counts differ by 13 levels of green
      across two documents, which is document-to-document variation; this file keeps its
      own count rather than borrowing a sibling's.
      The first build carried one band at x 601.74 x 110.81, exactly twice a band at
      300.87 x 55.4 - measured in a doubled frame and never halved - so it lay wholly off
      the 440 mm face and was never seen (roc-ops/Portrayal#878).
  why-this-is-its-own-device:
    confidence: datasheet
    note: >-
      ONE GUIDE COVERS THE 54T AND THE 54P, SO THE QUESTION HAD TO BE ASKED.
      `docs/what-a-configuration-cannot-say.md` answers it in one sentence - a configuration
      can say what OCCUPIES a bay, but not what is TRUE of a part - and records that a
      config-scoped DEVICE attr is still open, filed as `config-scoped-device-attrs` on
      cisco/asr-9001. These two differ in exactly that forbidden way: weight 5.8 kg against
      6.6, power consumption 150 W against 2400, per-PSU input 4 A against 12 A. The
      supplies really are different parts - 50.4 mm wide against 62.3, and the PoE one
      carries a fan - which a configuration could have expressed through `bays`; the weight
      and the consumption are device attrs, which it could not. And the 54P's RJ-45 row is
      TWO port groups where the 54T's is one, which changes the shape of the face rather
      than what fills it. See roc-ops/Portrayal#335 for the full working.
attrs:
  environmental:
    operating-temp: '0 to 45 C (32 to 113 F)'
    storage-temp: '-40 to 70 C (-40 to 158 F)'
    humidity: 'Operating: 5% to 95% non-condensing'
  physical:
    weight-note: 'AS4625-54P: 6.6 kg, includes two PSUs (the guide gives both models in one line)'
  power:
    power-consumption: 'AS4625-54P: 2000 W max low-line, 2400 W max high-line at 25 C'
    input-ac: '100-120 VAC 12 A max; 200-240 VAC 8.5 A max'
    poe-budget: 'Low-line: 850 W for 1 PSU, 1850 W for 2 PSUs. High-line: 1050 W for 1 PSU, 1920 W for 2 PSUs'
  features:
    optics-sfp-plus: >-
      Six 1G/10G SFP+ uplinks, ports 49-54, which both documents call uplinks. The guide's
      lamp legend gives them two rates - "SFP+ Port LEDs: Green (10G), Amber (1G)" - and no
      breakout table is published, so none is stated here.
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.45, depth: 350.35, ru: 1, weight-kg: 6.6, color: '#43464a',
  airflow: front-to-back, power: ac}
gaps:
- what: the-row-under-the-ports
  scope: [front]
  reason: needs-drawing
  wanted: >-
    WHERE EACH PORT LAMP SITS IN THE ROW UNDER THE PORTS. What the row IS is settled: the
    guide's right-hand enlargement (embedded at about 7 px/mm) shows, under every column,
    the two port numbers each followed by a small dark window - "41 [] 42 []" - and its
    callouts 3 and 4 point into that row for the "RJ-45 Port LEDs: Green (link), Amber
    (link with PoE)" and the "SFP+ Port LEDs: Green (10G), Amber (1G)". So it is a per-port
    lamp row with its numbering, not a second legend. Only the geometry is open: the
    enlargement covers ports 39-54 alone, and the full elevation at about 2.5 px/mm shows
    the row but not the windows' size or offset. The lamps are not drawn until a measured
    window size and offset can be repeated across all fifty-four ports.
- what: fixed-fan-depth
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    HOW DEEP THE THREE FAN GUARDS ARE. `edgecore/eps-fan-fixed@1` carries a 10 mm vent
    depth and it is an estimate: the fans are fixed, no FRU figure exists for them, and
    neither document dimensions the rear. The guards' FACE geometry is measured - 25.5 x
    15.9 on a 47.8 pitch, agreeing between the two models' elevations to 0.2 mm - so only
    the depth is open.
groups:
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the forty-eight 1G RJ-45 ports, two rows of twenty-four columns ganged in three blocks
      of eight, numbered 1-48 down each column. ALL FORTY-EIGHT ARE PoE and they are TWO
      CLASSES: "40 x 1G RJ-45 PoE ports (30 W per port)" and "8 x 1G RJ-45 PoE ports (90 W
      per port)", which the panel's own legend resolves to ports 1-40 and 41-48.
    attrs: {media: rj45, speed: 1g, poe: '802.3at 30 W'}
  rj45-poe-hi:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      ports 41-48, the EIGHT 90 W PoE ports. They are the same jacks in the same ganged row
      as ports 1-40 and differ only in what they may deliver, which the panel prints beside
      them - "1.65A Max/Port41-48" - and marks with an orange band. The Overview callouts
      list them separately from the other forty for the same reason.
    attrs: {media: rj45, speed: 1g, poe: '802.3bt 90 W'}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the six 1G/10G SFP+ uplinks, three stacked pairs at the right of the port wall,
      numbered 49-54 into the same sequence as the RJ-45 ports. `index-origin` is 1
      because the schema allows 0 or 1 and nothing else; the 49 the panel prints is carried
      by each port's own `rel-pos`, which is where the panel's numbering belongs.
    attrs: {media: sfp-plus, speed: 10g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - an RJ-45 management jack over an RJ-45 console jack, a
      Micro-USB storage port and the Reset button. The guide legends the management jack's
      own lamps "Left (link), Right (activity)".
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        "Redundant hot-swappable AC PSUs", two bays, and the guide's Connect Power step
        says "Install one or two AC PSUs in the device, if they are not already installed
        in the factory" - so one will run the machine and the second is the redundancy.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        "2+1 fixed redundant fans", from the Overview callouts of both models. **THEY ARE
        NOT FRUs AND THERE ARE NO BAYS** - the guide's FRU Replacement section covers the
        supplies only, and there is no latch, handle or seam to draw. So the three fans are
        PLACED rather than bayed, and the 2+1 counts rotors that nobody swaps. A census
        that asks whether this figure fills its bays will find none, and that is correct.
