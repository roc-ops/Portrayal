format: 1
kind: device
name: dcs511
version: 2.0.8
maturity: modelled
manufacturer: Edgecore
model: AS9737-32DB
aliases:
- {name: DCS511, kind: marketing}
portfolio: {line: Cloud Data Center, family: Leaf Switch, series: DCS511}
description: >-
  32x 400G QSFP56-DD data-centre leaf switch on an Intel Xeon D-1713NTE with an AST2600 OpenBMC, sold
  as the DCS511. Every port, both consoles, the USB and a 1PPS timing input are on the FRONT; two supplies,
  SIX fan trays and the grounding screws are on the rear. BOTH RIGHT-HAND CAGES ARE MANAGEMENT PORTS,
  which is not what the quick start's callouts suggest. The datasheet lists them under "Management Ports
  on Port Side" - "1 x SFP+ 10G ASIC management" and "1 x SFP 1G CPU management" - and states "Switch
  Ports: 32 x QSFP56-DD 400 GbE", a count with no SFP in it. Neither cage carries traffic.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage
      upright (rotate 0) over the lower turned 180, so both cage lips face the band between the two cages
      and both bails face outward. Decided by the rule, not an observation, so a photograph of the stack
      overturns it: the 1 SFP pair (mgmt-asic/mgmt-cpu), the 16 QSFP pairs (port-1/port-2 to port-31/port-32).
  sources:
    confidence: datasheet
    note: >-
      Two documents and four photographs, all staged. dcs511-qsg (the AS9737-32DB quick start guide) and
      dcs511-datasheet, both docling-converted, MEASURED OFF THE PDF PAGE rather than the converted figures.
      working/intake/edgecore/photos/ holds dcs511-2-DCS511-F.png and dcs511-3-DCS511-B.png, square-on
      shots of both faces, plus an angled -A and a three-quarter -FF. HERE THE PHOTOGRAPH IS THE BETTER
      SOURCE AND THE GUIDE IS THE CHECK, which is the reverse of the DCS240. The guide's Overview elevation
      renders at 5.09 px/mm but its cage wall sits in a band whose contrast will not segment - a mid-threshold
      found one bright run where sixteen were wanted, and an ASCII dump of the profile showed why: the
      whole band lies between 60 and 100 grey. The photograph is 2.19 px/mm, a third of the resolution,
      but its cage flanges are unambiguous, and that turned out to matter more.
  gate-1:
    confidence: measured
    note: >-
      PASSES ON BOTH SOURCES, AND THEY AGREE ON THE RESIDUAL. The guide's page-1 Overview elevation reads
      x180-2411 by y2139-2366 - 2232 px by 227, an aspect of 9.833 against the stated 438.4 / 43.5 = 10.078,
      2.4% out. The photograph's chassis fills its frame at 960 by 98, an aspect of 9.796, 2.8% out. NO
      TAPER on either: the guide's width samples 2226-2239 px across fourteen bands, and the photograph's
      ink spans 960 at every height. Both are orthographic and both read ~2.5% short in x against y, which
      is one figure twice rather than two independent errors.
  the-photograph-has-square-pixels:
    confidence: measured
    note: >-
      THE SCALE QUESTION THIS DEVICE TURNED ON, and I got it wrong once before the geometry caught me.
      The photograph's 2.8% aspect deficit can be read two ways: the width is short, or the height is
      long. I first took the height as true - 98 px for 43.5 mm, 2.2529 px/mm - and measured a row pitch
      of 13.80, which I was ready to record as this device's own figure against the DCS240's 14.21. THE
      BLOCK PERIOD DISPROVED IT. The QSFP wall's eight blocks sit on a period that is 2 x 19.0 + 6.0 =
      44.0 mm by construction, and read against a width scale of 960/438.4 = 2.1898 px/mm it measures
      44.027 over a 308 mm baseline - 0.06% out. The x scale is therefore right to a fifteenth of a pixel,
      the width is NOT short, and the 98-px ink box is 2.7 px of shadow around a 95.3-px chassis. Rows
      301 and 398 are the brightest in the whole face, which is what an edge highlight looks like. READ
      WITH SQUARE PIXELS AT 2.1898 THE ROW PITCH IS 14.21, not 13.80. The lesson is that an aspect residual
      says a face is out of square without saying which axis did it, and the thing that answers is a length
      inside the picture whose true value you already know.
  the-optical-wall:
    confidence: measured
    note: >-
      MEASURED HERE AND IT IS THE DCS240'S WALL. The row-2 top flange resolves as fourteen clean runs
      of 18.7 mm plus a partial at each end; the within-pair step averages 19.25 against std/qsfp-ganged@1's
      registry pitch of 19.0, a lookup rather than a measurement, and the block step averages 44.07 over
      six intervals. Fitting all fourteen left edges with pitch 19.0 and gutter 6.0 held fixed puts column
      1 at 39.540 mm, rms residual 0.245, max 0.430. The DCS240's independently measured 39.63 fits the
      same fourteen edges with the SAME rms to three decimals. The two anchors are 0.09 mm apart - a fifth
      of a pixel on this photograph - so the DCS240's figure is used and this device's own face is what
      proves it. A SECOND, INDEPENDENT SIGNAL AGREES. Taking the per-column minimum of both cage rows
      and hunting valleys finds seven deep gutters at 78.09 through 342.50, steps of 43.84, 44.30, 44.29,
      43.84, 44.30 and 43.84. Mean 44.07, which is gang 2 on a 6.0 gutter, from a threshold-free instrument
      on a different feature. ROWS: the bright-flange centroid reads the two apertures 8.69 and 8.51 tall
      and the gradient peak reads them 9.99 and 9.91, straddling the registry's 9.58 because one instrument
      sits inside the rim and the other outside. THEIR MEAN RECOVERS 9.61 AND 9.48 - the known aperture
      height to 0.03 mm, which is the check that licenses the pitch that falls out of them: 14.23 top-to-top
      and 14.10 bottom-to-bottom against the DCS240's 14.21.
  the-two-right-hand-cages:
    confidence: datasheet
    note: >-
      BOTH ARE MANAGEMENT, AND THE TWO DOCUMENTS DO NOT SAY SO EQUALLY WELL. The quick start's Overview
      callouts read "4. 1 x 10G SFP+ port" and "5. 1 x 1G SFP management port", and callout 4's silence
      about what the port is for reads as a traffic port beside a management one. IT IS NOT. The datasheet's
      specification block is explicit:
        Management Ports on Port Side:
          1 x RJ-45 serial console / 1 x Micro USB console port
          1 x RJ-45 1000BASE-T management
          1 x SFP+ 10G ASIC management
          1 x SFP 1G CPU management
          1 x USB 3.0 storage port
      and the same datasheet gives "Switch Ports: 32 x QSFP56-DD 400 GbE" - thirty-two, with no SFP among
      them. The datasheet's own callout table says the same thing in short form, "Top: 10G SFP+ port (MAC)
      Bottom: 1G SFP port (CPU)", where MAC names the side of the box the jack reaches (the switch ASIC)
      rather than promising a traffic port. So the upper cage manages the ASIC at 10G and the lower manages
      the CPU at 1G, and this device has NO second port number space. An earlier revision of this model
      made the upper cage a traffic port called `tengig-1` in a `sfp-plus` group; that group is gone.
      GEOMETRY IS UNCHANGED AND STILL MEASURED. Both cage frames read x 389.1 to 403.7 and y 13.1-22.7
      and 27.3-36.9 on this device's own photograph, against the DCS240's modelled 389.60 + 14.25 and
      12.28 / 26.49 + 10.4. What changed is what they are, not where.
  the-four-right-hand-lamps:
    confidence: measured
    note: >-
      FOUR WINDOWS, NOT TWO, AND THEY ARE NOT WHERE THE DCS240'S ARE. The DCS240 puts one lamp to the
      RIGHT of each SFP cage at x 405.30. Here a brightened 20x crop shows two dark round windows ABOVE
      the upper cage and two BELOW the lower one, centred at x 391.93 and 400.38 and at y 10.48 and 39.02,
      about 2 mm across. They are too dim to threshold - a search for blobs above the cage found one of
      the two and a false positive on the product label's edge - so they were read off the enlarged crop
      and not from a segmentation. That is the weaker instrument and it is said plainly; what makes it
      safe is that the guide independently says there are two per port: "SFP+ 10G LEDs: Left: Green (10G),
      Amber (1G) | Right: Activity" and "SFP/RJ-45 Mgmt LEDs: Left: Amber (link) | Right: Amber (activity)".
  the-management-cluster:
    confidence: borrowed
    note: >-
      IDENTICAL TO THE DCS240'S AND CHECKED FEATURE BY FEATURE. The photograph's white bezels span x 15.8
      to 32.6 against the DCS240's measured 15.7 to 31.7; the console RJ-45's frame runs y 27.0 to 40.9
      against its 27.01 to 40.21; the reset pinhole centres at (9.7, 22.5) against (9.5, 21.8); the micro-USB
      at (10.1, 29.1) against (9.6, 27.5). Every one is inside a millimetre, which on a 2.19 px/mm photograph
      is two pixels. The cluster's coordinates are therefore taken from edgecore/dcs240@1, whose source
      resolves them at 5.08 px/mm, rather than re-derived from the coarser picture that confirms them.
      Callout 2 names the same set - "1 x 1000BASE-T RJ-45, micro-USB/RJ-45 console, USB" - and the panel
      again labels BOTH consoles, so both are drawn.
  the-edge-vents-are-slots:
    confidence: measured
    note: >-
      SLOTS, NOT HONEYCOMB, AND THE SAME MISTAKE AS THE DCS240'S FIRST PASS. Both end vents were carried
      from edgecore/dcs240 as `pattern: vent`, which paints hexagons. This device's front photograph shows
      small RECTANGLES in two columns at the left edge and one at the right - the same slot field the
      top and bottom bands already use. The left field measures x 1.0 to 3.6 where the carried decor claimed
      1.2 to 4.8, which is also why the Loc, PS1 and Fan legends were printing over it. edgecore/dcs240
      still draws hexagons at both ends. It is not changed here, because its panel was measured off its
      own guide and re-reading it is that device's work, not this one's.
  the-system-lamps:
    confidence: measured
    note: >-
      SIX WINDOWS, ALL ROUND, AND THE SIXTH HAS NO NAME. This device's own System LEDs/Buttons enlargement
      on quick start page 1 resolves the cluster at 600 dpi: a 3x2 grid of SIX windows, every one of them
      a circle, labelled Loc and Diag on the top row, PS1 and PS2 on the middle, and Fan on the bottom
      left. THE BOTTOM-RIGHT WINDOW CARRIES NO LEGEND, in this enlargement or anywhere in either document,
      and the guide's own list names exactly five: Loc, Diag, PS1/PS2, Fan. It is drawn and given an id
      rather than omitted, because a window in the metal that the model leaves out is worse than one it
      labels as unknown. IT IS NOT A SECOND FAN LAMP. The chassis has six fan trays and one Fan lamp;
      nothing in either document attaches the sixth window to a tray, and inventing that reading would
      be the model asserting something the vendor does not. IT STILL LIGHTS. An earlier revision pinned
      it to the single state `off`, which says the window is dead rather than that its meaning is unknown
      - a lamp nobody can turn on is a worse answer than a lamp nobody can name. It now states NO `states:`
      override at all and inherits common/led-dot@1's own `off`/`on`, which is the right shape for this:
      the part says a lamp can be lit, and this device declines to name a colour or a meaning it has no
      source for. The five lamps beside it override because their guide does name theirs. AN EARLIER REVISION
      DREW THE RIGHT COLUMN AS RECTANGLES. That came from the DCS240's guide, which describes its own
      cluster as "round in the left column, rectangular in the right", and was carried here without checking.
      This device's enlargement shows six circles, so all six are common/led-dot@1 and the cutouts are
      circles.
  lamps:
    confidence: datasheet
    note: >-
      A RICHER TABLE THAN THE DCS240'S AND IT IS TRANSCRIBED WHOLE. quick start, QSFP-DD LEDs, verbatim:
      "400G (50G PAM4): 1 LED Blue", "2 x 200G Breakout (50G PAM4): 1 LED Cyan, 1 LED Green", "4 x 100G
      Breakout (50G PAM4): 4 LEDs Green", "100G (25G NRZ): 1 LED Green", "4 x 25G Breakout (25G NRZ):
      1 LED Orange, 3 LEDs Green", "40G (10G NRZ): 1 LED Dark Green", "4 x 10G Breakout (10G NRZ): 1 LED
      Yellow, 3 LEDs Green". SEVEN MODES where the DCS240 lists four, and the two tables disagree about
      200G breakout - white there, cyan here - so this device's own table is used. ONE LAMP PER QSFP PORT
      IS DRAWN AND THE METAL HAS FOUR. The state colours are the FIRST lamp of each row, which is the
      one the table distinguishes the modes by; the trailing greens are the breakout members. Drawing
      the real four would be 128 placements and 128 cutouts, and edgecore/dcs240, edgecore/dcs201 and
      edgecore/as5912-54x all draw one. The gap below records what was left out.
  the-rear:
    confidence: measured
    note: >-
      THE DCS240'S REAR, PROVEN AGAINST THIS DEVICE'S OWN PHOTOGRAPH AT TWICE THE RESOLUTION. Colour-segmenting
      the six red pull bars gives left edges at 76.72, 126.50, 175.82, 224.22, 272.63 and 321.04 mm, which
      least-squares to a pitch of 48.81 and a first handle at 77.46; the two PSU release latches land
      at 57.08-66.67 and 420.13-432.92. THE INSTRUMENT WAS CALIBRATED ON THE SIBLING BEFORE ITS ANSWER
      WAS BELIEVED. Run unchanged over dcs240-3-DCS240_03.png it reads handle widths of 40.3 to 41.2 where
      that device's modelled handle is 38.75, so it carries about +2 mm of red bleed; and it puts the
      DCS240's own handles at 76.20, 125.51, 174.82, 223.23, 271.65 and 320.96, its latches at 54.69-64.55
      and 418.68-431.23. Feature for feature the two devices differ by a mean of 1.1 mm with a maximum
      residual of 1.3 mm about that mean, on a picture where one pixel is 0.46 mm and the sibling's is
      0.90 mm. The bay wall is therefore taken from edgecore/dcs240@1, whose 48.50 pitch came from a 5.08
      px/mm guide figure rather than from either photograph, and this device's rear is the confirmation.
      Its own fit differs by 0.31 mm per bay, 1.55 mm accumulated over five steps, which is inside what
      a 2.19 px/mm colour threshold can resolve.
  the-grounding-screws:
    confidence: measured
    note: >-
      CALLOUT 7 IS A REAR FEATURE EVEN THOUGH IT IS LISTED WITH THE FRONT. The Overview list runs 1-9
      across both faces and item 7 reads "2 x grounding screws (maximum torque 10 kgf-cm)"; the guide's
      own procedure says where they are - "Attach the included grounding wire to the grounding point on
      the device rear panel." They are on the strip left of PS2. Scanning bright pixels in the leftmost
      30 columns of the rear photograph finds two blobs: x 3.20-8.68, y 22.61-28.09, and x 1.37-11.42,
      y 30.37-41.79. Centres (5.94, 25.35) and (6.40, 36.10), and the same scan puts the chassis bottom
      edge at 43.7 mm against a stated 43.5, which is the check on the origin. THE TWO HEADS ARE NOT THE
      SAME SIZE - about 5.5 mm and about 10 mm - because the lower one has a washer fitted in this photograph
      and the upper one does not. What is measured is where the holes are; the part drawn in them is the
      library's generic 3.6 mm common/screw-head@1, which is what edgecore/dcs201 and edgecore/dcs202
      seat on the same family's rear. The gap below asks for a grounding screw sized to the metal.
  the-airflow-derate-has-nowhere-to-live:
    confidence: datasheet
    note: >-
      THE MODEL CANNOT SAY THIS AND IT IS NOT A GAP IN THE DEVICE. The guide derates hard by airflow -
      "Operating (F2B): 0 to 45 C" against "Operating (B2F): 0 to 30 C" - a fifteen-degree difference
      that decides whether a box can go in a hot aisle. A configuration may state `airflow` but has nowhere
      to state what that airflow costs, and `gaps.reason` has no value for a library that lacks the vocabulary:
      its enum names who can close a gap, and the answer here is a library maintainer rather than this
      device. Both figures are therefore carried in one `attrs.environmental.operating-temp` string so
      that neither is lost, and both b2f configurations repeat the derate in their descriptions. A reader
      can use it; a tool cannot.
  the-grounding-screw-part-is-generic:
    confidence: measured
    note: >-
      SAME SHAPE OF SHORTFALL, ON THE COMPONENT SIDE. The two screws photograph at about 5.5 mm and about
      10 mm across - the difference is a washer fitted to one of them - and the only fastener in the library
      is common/screw-head@1 at a generic 3.6 mm, which is also what edgecore/dcs201 and edgecore/dcs202
      seat on this family's rear. THEIR POSITIONS ARE MEASURED AND CORRECT; their drawn heads are a third
      to a sixth of the metal's area. Recorded here rather than as a gap for the same reason as the derate
      above: what is missing is a part, not a fact about this device.
  the-green-tab-is-a-pull-out-card:
    confidence: datasheet
    note: >-
      IT IS A PART, AND THE LIBRARY ALREADY HAD IT. A bright green bar sits at the foot of the panel at
      x 413.7-430.6, y 40.6-42.9. Two earlier revisions of this model got it wrong in two different ways:
      first as an unexplained `green-strip` decor with a gap asking what it was, then as a `product-label`
      decor once callout 6 was found. Both were paint, and paint has no entry in a component tree, so
      a reader looking at the thing could not find out what it was - which is exactly the question it
      kept provoking. IT IS common/pull-tab@1 - "Captive pull-out information tab (default credentials
      / serial card)", 16.0 x 4.5, whose relief colour is already '#2f7d1c'. edgecore/dcs510, this device's
      immediate sibling, seats it at [414.5, 38.4] and records the tab at "414.5-431.4 x 40.6-42.5" off
      its own photographs; this device measures 413.7-430.6 x 40.6-42.9, the same tab on the same shell.
      The DCS510's seat is used. THE CALLOUT AND THE PART ARE BOTH RIGHT. Quick start callout 6 reads
      "Product label" and its circle sits immediately below the tab's right end with no other feature
      near it - the same short leader as callouts 4 and 5 on the cages above. The vendor names it for
      what is PRINTED on the card you pull out; the model draws it as the thing that pulls out. The DCS510's
      own note says "Neither document names it", which is true of that device's sources and not of this
      one's. The white badge above it carries the Edge-corE wordmark, has no callout, and is not drawn
      at all: this library cannot set a logo into a decor, so it rendered as a blank grey box that told
      a reader nothing. The model number below it is drawn larger in the space.
  the-green-bar-is-the-product-label:
    confidence: datasheet
    note: >-
      CALLOUT 6 POINTS AT IT, AND I HAD IT THE WRONG WAY ROUND. A bright green bar sits at the foot of
      the panel at x 413.7-430.6, y 40.6-42.9, and above it sit a white badge carrying the Edge-corE wordmark
      and the silkscreened model number AS9737-32DB. On the quick start's Overview the callout numbered
      6, "Product label", has its leader on THE GREEN BAR - the same short leader style as callout 4 on
      the upper cage and callout 5 on the lower one. The white badge above is the brand mark, not the
      product label, and carries no callout at all. An earlier revision of this model drew the badge as
      `product-label` and the green bar as an unexplained `green-strip` with a gap asking what it was.
      The gap is withdrawn: the source does name it, and the green bar now carries the name. THE BADGE
      IS NOT DRAWN AT ALL. It is real metal - a white rectangle carrying the Edge-corE wordmark - but
      this library has no way to set a vendor logo into a decor, so it rendered as a blank grey box that
      told a reader nothing and invited exactly the question "what is that?". A silkscreen that cannot
      carry its own text is worse than no silkscreen, so the rectangle is dropped and the model number
      below it is drawn larger in the space, which is the part of that corner a reader can actually use.
      The same green bar is on the DCS240's front photograph at 413.3-430.3, so this reading applies to
      that device too, which does not draw it.
  power:
    confidence: datasheet
    note: >-
      NO SWITCH-LEVEL CONSUMPTION FIGURE IS PUBLISHED, and that is a difference from the DCS240, whose
      guide prints "Min. 396 W / Max. 714 W (w/o transceivers)". Neither staged document here states one
      at all, so none is recorded and none is guessed. What IS stated is the supplies: "100-127VAC at
      50-60Hz (12 A/1000 W max.)" and "200-240VAC at 50-60Hz (8 A/1500 W max.)" AC with an IEC 60320 C14
      inlet, and "-48 VDC, 1600 Watts" with "-40 V - -75 V, 40 A maximum" DC. Those are the DCS240's ratings
      to the digit, which is why its supply modules seat here.
  airflow-colour-convention:
    confidence: datasheet
    note: >-
      Stated in this device's own guide, in the family's words: "Remove front-to-back (F2B) airflow fan
      trays (red handles) and PSUs (red release latches)" and "Install back-to-front (B2F) airflow fan
      trays (blue handles) and PSUs (blue release latches)". The rear photograph shows the F2B build and
      the handles are legibly stamped "F2B". Both b2f configurations therefore override every handle,
      latch and legend, which is the defect roc-ops/Portrayal#277 is open about.
attrs:
  environmental: {operating-temp: 0 to 45 C (F2B) / 0 to 30 C (B2F), storage-temp: -40 to 70 C, humidity: 'Operating:
      5% to 95% (non-condensing)'}
  physical: {weight-note: '11.88 kg (26.16 lb), with 2 PSUs and 6 fans installed'}
  platform: {cpu: 'Intel Xeon D-1713NTE, 4-core 2.2 GHz', bmc: 'ASPEED AST2600 running OpenBMC, with Serial-over-LAN'}
  features:
    optics-qsfp-dd: >-
      datasheet: 32 x QSFP56-DD 400GbE. The guide's own LED table enumerates the modes each port runs
      - 400G and 2 x 200G and 4 x 100G on 50G PAM4, 100G and 4 x 25G on 25G NRZ, and 40G and 4 x 10G on
      10G NRZ - which is a fuller statement of what works than the datasheet's port line gives.
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 43.5, depth: 590.0, ru: 1, weight-kg: 11.88, color: '#2b2f33', airflow: front-to-back}
gaps:
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Nothing in this corpus draws any of them
    flat - the mounting figures show the lid and one side in three-quarter view while brackets go on,
    and the -FF photograph is a three-quarter of the front. Each carries an `empty:` sentence saying where
    I looked, per docs/deliberately-empty-faces.md: empty by verification, not by omission.
- what: qsfp-breakout-lamp-windows
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The four lamp windows per QSFP-DD port, drawn. This guide's table needs all four to say what it says
    - "4 x 25G Breakout: 1 LED Orange, 3 LEDs Green" describes a row of four, not one lamp with four meanings
    - and one lamp per port is drawn instead, carrying the seven modes as states coloured by each row's
    FIRST lamp. Drawing the real four would be 128 placements and 128 cutouts on a face that already carries
    34 ports, and the enlargement fixes them relative to a cage rather than to the panel. edgecore/dcs240,
    edgecore/dcs201 and edgecore/as5912-54x all make the same simplification; this records that it is
    a choice and not a limit of the source.
- what: rear-panel-silkscreen
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    The six fan-bay digits, the PS1/PS2 legends and the two airflow arrows, drawn. All of them are legible
    in the rear photograph and all were measured: the digits 6 to 1 are white blobs 3.65 mm tall centred
    at x 122.85, 171.25, 219.66, 268.07, 316.02 and 364.42, a 48.5 pitch that matches the bay wall exactly;
    "PS2" spans 69.41-75.81 and "PS1" 363.05-368.99, each under a small arrow at y 33.1-34.9. THEY ARE
    NOT DRAWN BECAUSE THE BAY WALL HAS NOWHERE TO PUT THEM. Each digit sits about 2.4 mm past its bay's
    right edge, and with six 48.5 mm trays on a 48.5 mm pitch the bays are edge to edge, so every digit
    would land inside the NEXT bay's box - silkscreen painted over a module, which is L21's case. The
    metal plainly has a rail there that this wall does not, and deciding whether the trays are narrower
    than 48.5 or the pitch wider than it needs a rear elevation with dimensions, which neither staged
    document has. "PS1" alone falls in the real 9 mm gap between fan-1 and psu-1 and could be drawn; it
    is held back so that the rear is not half-labelled. edgecore/csr440 has the same gap for the same
    reason.
- what: dc-supply-face
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    An elevation of the DC supply. The rear photograph draws the AC pair; the datasheet rates a -48 VDC
    variant at 1600 W and the ordering table lists AS9737-32DB-O-48V-F and -48V-B, so it certainly exists.
    edgecore/dcs240-psu-dc@1 is seated here and it borrows the AC module's measured face with its terminal
    marked estimated.
groups:
  qsfp-dd:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - a 1000BASE-T RJ-45 management jack, a USB Type-A, TWO consoles rather
      than one (a micro-USB and an RJ-45, both labelled as consoles on the metal), and TWO SFP management
      ports - a 10G on the switch ASIC and a 1G on the CPU. A 1PPS timing input sits beside them, which
      is a different job on the same strip and has its own group.
  timing:
    term: Port
    role: management
    index-origin: 1
    description: >-
      the 1PPS timing input - a single SMB coaxial jack beside the consoles. THE METAL SAYS "PPS", not
      "1PPS IN": the System LEDs enlargement prints PPS above Reset in one stack beside the button, and
      an earlier revision of this model carried the DCS240's longer legend, which on this narrower strip
      ran into the management housing at x 15.30. It states no group media because coax is not a pluggable
      cage and L40's optics question does not apply to it; the medium is on the placement, where the exporter
      reads it.
  leds: {term: LED, role: indicator, index-origin: 1}
  furniture:
    term: Part
    role: furniture
    index-origin: 1
    description: >-
      the USB symbol beside the storage port and the captive pull-out information tab at the foot of the
      panel - things you neither connect to nor read off the face.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        datasheet: "2 redundant, load-sharing, hot-swappable AC or 48VDC". Each is rated 1500 W at high
        line, and the datasheet's own footnote says the pair is redundant only there - "200-240VAC may
        be required for power redundancy under full loading" - so at low line the second supply may be
        carrying load rather than standing by.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 5+1
      redundancy-note: >-
        datasheet: "Hot-swappable 5 + 1 redundant fans", and the rear callout counts six - "6 x fan trays"
        - so the digit form and the bay count agree without argument.
