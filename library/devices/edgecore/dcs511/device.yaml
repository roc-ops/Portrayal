    size: {w: 590.0, h: 43.5}
    empty: Not drawn by any staged source. The other side wall, solid for the same reason.
configurations:
  ac-f2b:
    kind: orderable
    power: ac
    description: Dual AC PSUs, front-to-back airflow - red handles and red release latches
    default: true
    part-numbers:
      AS9737-32DB-O-AC-F: {part: FP5EC8632004Z}
      AS9737-32DB-O-AC-F-UN: {power-cord: UN}
      AS9737-32DB-O-AC-F-EU: {power-cord: EU}
      AS9737-32DB-O-AC-F-UK: {power-cord: UK}
      AS9737-32DB-O-AC-F-US: {power-cord: US}
      AS9737-32DB-O-AC-F-JP: {power-cord: JP}
    region-context: {optics: 32 x 400G QSFP56-DD}
  ac-b2f:
    kind: orderable
    power: ac
    description: >-
      Dual AC PSUs, back-to-front airflow. The guide states the colour: "Install back-to-front (B2F) airflow
      fan trays (blue handles) and PSUs (blue release latches)." This build is derated to 0-30 C where
      the F2B build runs to 45 C.
    airflow: back-to-front
    part-numbers:
      AS9737-32DB-O-AC-B: {part: FP5EC8632005Z}
      AS9737-32DB-O-AC-B-UN: {power-cord: UN}
      AS9737-32DB-O-AC-B-EU: {power-cord: EU}
      AS9737-32DB-O-AC-B-UK: {power-cord: UK}
      AS9737-32DB-O-AC-B-US: {power-cord: US}
      AS9737-32DB-O-AC-B-JP: {power-cord: JP}
    region-context: {exhaust: Intake}
    component-attrs:
      dcs240-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      dcs240-psu-ac: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
  dc-f2b:
    kind: orderable
    power: dc
    description: Dual -48 VDC PSUs, front-to-back airflow - red handles and red release latches
    part-numbers:
      AS9737-32DB-O-48V-F: {part: FP5EC8632006Z}
    bays: {psu-1: edgecore/dcs240-psu-dc@1, psu-2: edgecore/dcs240-psu-dc@1}
  dc-b2f:
    kind: orderable
    power: dc
    description: >-
      Dual -48 VDC PSUs, back-to-front airflow - blue handles and blue release latches, and the same 0-30
      C derate as the AC B2F build.
    airflow: back-to-front
    part-numbers:
      AS9737-32DB-O-48V-B: {part: FP5EC8632007Z}
    region-context: {exhaust: Intake}
    bays: {psu-1: edgecore/dcs240-psu-dc@1, psu-2: edgecore/dcs240-psu-dc@1}
    component-attrs:
      dcs240-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      dcs240-psu-dc: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
references:
- title: Edgecore DCS511 / AS9737-32DB 32x400G QSFP56-DD Data Center Switch Data Sheet
- title: Edgecore AS9737-32DB 32-Port 400G Ethernet Switch Quick Start Guide
