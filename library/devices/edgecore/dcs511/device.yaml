      gets no figure.
  left:
    size: {w: 590.0, h: 43.5}
    empty: >-
      Not drawn by any staged source, and on this chassis that is a statement: the DCS511 breathes end
      to end, so the side walls carry no perforation. The intake is the front face's own vent fields and
      the exhaust is the six rear trays - or the reverse, on a B2F build.
