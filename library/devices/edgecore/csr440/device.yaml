configurations:
  ac:
    kind: base
    default: true
    description: >-
      Two hot-swappable AC supplies and six rear fan modules. This is the variant both elevations draw.
      Neither staged document publishes an ordering matrix for this model, so the configuration carries
      no part numbers, and the DC variant is a gap rather than a second configuration.
    bays: {psu-1: edgecore/csr440-psu-ac@1, psu-2: edgecore/csr440-psu-ac@1, fan-1: edgecore/csr440-fan@1,
      fan-2: edgecore/csr440-fan@1, fan-3: edgecore/csr440-fan@1, fan-4: edgecore/csr440-fan@1, fan-5: edgecore/csr440-fan@1,
      fan-6: edgecore/csr440-fan@1}
