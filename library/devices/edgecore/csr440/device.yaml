    timing: IEEE1588v2 and SyncE in hardware; integrated GNSS
    timing-ports: BITS (RJ-45), ToD (RJ-45), 1PPS I/O (SMB), 10MHz I/O (SMB), GNSS antenna (SMA)
    optics-qsfp-dd: 50, 100, 200 or 400 GbE per port; 400GBASE-SR8/DR4/FR4/ZR/ZR+
    optics-qsfp28: 40 GbE or 100 GbE per port; 100GBASE-SR4/LR4/ER4/ZR4/PSM4-2
    optics-sfp28: 1, 10 or 25 GbE per port; 25GBASE-SR/LR, 10GBASE-SR/LR/ER/ZR, 1000BASE-SX/LX/EX/ZX
    port-leds-qsfp-dd: blue 400G, cyan 200G, green 100G, yellow 50G
    port-leds-qsfp28: green 100G, cyan 50G, magenta 40G, blue 25G, yellow 10G
    port-leds-sfp28: blue 25G, green 10G, cyan 1G
