      1x RJ-45 1000BASE-T management, 1x RJ-45 serial console, 1x RJ-45 alarm, 1x USB Type-C storage,
      1x micro-USB console
  compliance:
    emissions: CE Mark, EN 55032 Class A, FCC Title 47 Part 15 Subpart B Class A, VCCI Class A
    immunity: EN 55024, EN 55035 Class A
    safety: >-
      UL (CAN/CSA 22.2 No 62368-1 & UL62368-1), CB (IEC/EN60950-1 & IEC/EN62368-1), BSMI CNS15598-1
    rohs: RoHS 2.0
  lifecycle: {eol: none-announced}
