format: 1
kind: device
name: csr440
version: 1.0.3
maturity: modelled
manufacturer: Edgecore
model: AS7535-28XB
portfolio: {line: Service Provider, family: Cell Site Router, series: CSR440}
description: >-
  24x 25G SFP28, 2x 100G QSFP28 and 2x 400G QSFP-DD cell site router, sold as the CSR440,
  Broadcom BCM88843 Qumran-2A with an Intel Xeon D-1539. Ports and both supplies on the
  front, six hot-swappable fan modules on the REAR - the only device in this family with
  that split. An SMA GNSS input, SMB timing jacks, BITS and ToD RJ-45s, an alarm jack, a
  USB-C for storage and a micro-USB console. Ports number 1-28, the optics first.
profile: networking
lint:
  waive:
    L76: >-
      One jack. L76 wants a timing jack on the bare std/rj45-ganged@2, because
      docs/rj45-family-design.md reserves common/rj45-ganged-eth@1 for Ethernet and a BITS
      jack is not Ethernet. The rule is right about the taxonomy and wrong about this panel:
      the elevation puts two lamps in the upper corners of the BITS jack - the quick start's
      "BITS/ToD LEDs" - and the lamped part is the only one in the family that draws them.
      I TRIED THE ALTERNATIVE AND THE METAL REFUSED IT. Bare jack plus two common/led-rect@1
      placements at the measured corner coordinates lints as `[L13] bits and led-tod overlap`
      and `[L39] cutouts bits and led-bits overlap ... two holes cannot share metal`. That is
      not a lint technicality, it is the fact: an integrated lamp shares the jack's opening,
      so drawing it as its own cutout claims a second hole in metal that has one. The reason
      the family integrates these lamps is the reason I cannot place them.
      So the choice is a wrong port type or a wrong panel, and I take the wrong port type
      because it is DECLARED rather than drawn: the group says `role: timing` and
      `media: rj45-bits`, dcim_export reads the group and not the part, and this waiver names
      the misfit out loud. A misdrawn panel would have been silently wrong.
      THE REAL FIX IS A PART, NOT A WAIVER - a lamped ganged cell that does not assert
      Ethernet, which the five ways in docs/rj45-family-design.md do not yet include. That is
      a library change and not a device change, and `gaps:` is for what the DOCUMENTS do not
      say - this is a gap in the library, so it is filed as an issue rather than here.
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The belly-to-belly cage pairs on this face follow the library's stack convention
      (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage upright (rotate 0) over
      the lower turned 180, so both cage lips face the band between the two cages and both bails
      face outward, where a thumb reaches them. 12 of the 14 pairs carry port lamps pointing up
      over down, which is belly-to-belly; for the other 2 the orientation is the reading recorded
      in this provenance where there is one, and otherwise the rule, not an observation. A
      photograph of the stack that shows otherwise overturns it.
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, MEASURED OFF THE PDF PAGE RATHER
      THAN THE CONVERTED FIGURES. csr440-datasheet carries the specification list, the
      fifteen-callout interface table, and BOTH ELEVATIONS on page 2 - front and rear, one
      above the other. csr440-qsg is a TWO-MODEL document, "AS7535-28XB | AS7535-28XBE", and
      supplies the callout names, the FRU procedures and a complete LED table.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1 TWICE, because this device has two faces with content and both are drawn.
      FRONT: (385,1851)-(4317,2239), 3933 x 389 px, aspect 10.1105 against 10.1247 for
      438.4/43.3 - 0.14 PERCENT OUT, which ties the CSR310 for the best figure in this
      corpus. REAR: (385,3019)-(4319,3411), 3935 x 393, aspect 10.0127 - 1.11 percent out.
      THE TWO WIDTHS AGREE TO 0.05 PERCENT, 3933 against 3935, so one x scale of 8.97 px/mm
      reads both faces and a rear coordinate can be compared with a front one without a
      second calibration.
      AND THE ASPECT CORROBORATES THE STATED CHASSIS: 10.1105 measured against 10.1247 for
      the published 438.4 x 43.3 is a fifth of a percent, which is as close as a figure gets
      to confirming a dimension it was not derived from.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - "Dimensions (WxDxH): 438.4 x 300 x 43.3 mm", and the quick start's hardware
      specification restates it to the digit. THE WEIGHTS DIFFER and it is recorded as a gap:
      7.5 kg in the datasheet against 6.8 kg "with two installed PSUs" in the quick start.
      The quick start is a TWO-MODEL document covering the AS7535-28XB and the -28XBE, which
      is the most likely reason a second figure exists, and is not a reason to average them.
  port-numbering:
    confidence: measured
    note: >-
      ONE RANGE, 1 TO 28, WITH THE OPTICS FIRST AND INTERLEAVED. The two left-hand shells are
      2-high and hold a QSFP28 on top and a QSFP-DD below - the silkscreen reads
      `Q-DD 1 (down)` under the lower cage and `(up) QSFP28 1` under the upper, with the
      numerals above the shell reading `1 (up)(down) 2`. So ports 1 and 3 are the 100G QSFP28s
      and 2 and 4 the 400G QSFP-DDs, sharing two cages. The twenty-four SFP28 then run 5 to 28.
      THAT IS WHY THE TWO OPTICAL FAMILIES ARE NOT TWO BLOCKS: they are two rows of the same
      two shells, and the cage face is the same for both - QSFP-DD is mechanically the QSFP28
      footprint with more lanes behind it.
  optical-blocks:
    confidence: measured
    note: >-
      THE SFP28 BANK IS IN TWO GROUPS, like the CSR430's, and a 3.35 mm divider separates
      them: ports 5-16 in six columns from 184.85 and 17-28 in six from 273.70. The divider
      is visible in the art at 270.5-273.4 and the numerals bracket it - 15/16 centred on
      263.1 and 17/18 on 281.0, a 17.9 step where every other step is 14.2.
      Both groups are anchored on measured centres and sized from the registry: group A's six
      numeral centres span 192.1 to 263.1, a 14.2 pitch against the registry's 14.25, and
      group B's 281.0 to 351.9, 14.18.
  lamps:
    confidence: datasheet
    note: >-
      THE QUICK START'S LED TABLE IS THE MOST COMPLETE IN THIS FAMILY. System: "PSU1/2 -
      Green (OK), Amber (fault)", "DIAG - Green (OK), Orange (fault detected)", "FAN - Green
      (OK), Orange (fault)", "LOC - Blinking Blue (OK)", "ALARM - Green (OK), Red (alarm)".
      Ports: "QSFP-DD Port LEDs: Blue (400G), Cyan (200G), Green (100G), Yellow (50G)",
      "QSFP28 Port LEDs: Green (100G), Cyan (50G), Magenta (40G), Blue (25G), Yellow (10G)",
      "SFP28 Port LEDs: Blue (25G), Green (10G), Cyan (1G)". Management: "Left (link), Right
      (activity)". And the timing pair: "BITS/ToD LEDs: Green (valid BITS), Blinking Green
      (1PPS ToD)".
      So every lamp on this device carries a stated vocabulary, including the two that the
      BITS and ToD jacks share.
      THOSE TWO ARE PLACED RATHER THAN INTEGRATED, and that is a deliberate choice about
      which truth to draw. The elevation shows them in the upper corners of the BITS jack,
      which is where common/rj45-ganged-eth@1 would draw integrated lamps - but that part
      says ETHERNET, and docs/rj45-family-design.md reserves it for Ethernet jacks while a
      timing jack takes the bare std/rj45-ganged@2. Fitting the Ethernet part here to get
      two lamps would misdeclare the port to get the picture right.
      So the jacks are bare and the lamps are two placements at 385.70 and 396.55, which is
      where the corners are. It also says more than the integrated pair could: the quick
      start's "BITS/ToD LEDs" are ONE PAIR SERVING TWO JACKS - green for valid BITS on the
      upper, blinking green for 1PPS ToD on the lower - and separate placements can carry a
      `for:` each. An integrated pair belongs to one jack and could not.
  the-rear-is-a-drawn-face:
    confidence: measured
    note: >-
      AND IT IS THE FIRST IN THIS FAMILY. The datasheet's key features say "All ports and PSUs
      on front; fan modules on rear", and page 2 draws that rear: six fan modules on a 50.0
      pitch from 12.0, then a perforated blank from 313.0, a two-hole grounding pad at
      364.2-398.7 with its holes on a 15.2 pitch, and an earth symbol beside it at 409.8.
      The pitch is taken from the modules' thumbscrews and confirmed by their printed bay
      numbers, which repeat it to 0.4 mm across all six.
  psus-and-fans:
    confidence: datasheet
    note: >-
      NOTHING CARRIES OVER FROM THE CSR310 OR CSR430. Their supply is a dark module with a
      three-pole terminal block, shared between those two and proven so by a part number in
      both their quick starts. This one is a bright CRPS housing with a C14 inlet turned on
      its side, a wire bail handle and a perforated exhaust field - a different kind of part,
      not a different size of the same one. The fans differ more: theirs is one front tray,
      this is six rear modules.
      SIX FAN BAYS IS 5+1. The datasheet says "Hot-swappable 5+1 redundant fans" and the rear
      elevation draws six modules numbered 1 to 6, so the form and the bay count agree and
      the group can state `5+1` - which the CSR430's could not, its five fans being inside one
      tray.
  airflow:
    confidence: datasheet
    note: >-
      Each fan module prints a small arrow beside its bay number, and the chassis is
      side-to-side like the rest of this family. The quick start's fan procedure does not
      repeat the CSR430's "matching airflow direction" caution, and no airflow-direction SKU
      is published in either document, so `side` is taken from the family and the arrows
      rather than from an ordering code.
