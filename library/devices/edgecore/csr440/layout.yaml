gaps:
- what: dc-power-supply
  scope: [front]
  reason: needs-photo
  wanted: >-
    A picture of the DC supply's face. Both documents say the device takes "2 x DC or AC
    PSUs" and the datasheet publishes a DC input range of -44 to -60 V at 15.5-9.6 A per
    supply, so the variant certainly exists - but the only elevation draws AC modules, and
    the quick start's DC section pictures wiring and ring lugs rather than a module face. The
    bay therefore accepts edgecore/csr440-psu-ac@1 alone and there is no `dc` configuration.
    Inventing one from the CSR310's terminal-block module would be wrong twice over: that is
    a different kind of supply, and this chassis is a different chassis.
- what: fan-bay-numerals
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A way to print six different numbers from one contract. Each fan module's left-hand strip
    carries its bay number and a small airflow arrow - the rear elevation shows 1 to 6 at
    17.1, 67.5, 117.3, 167.7, 217.0 and 267.4 - and they are printed ON THE MODULE, not on
    the chassis behind it. edgecore/csr440-fan@1 is one contract used six times, so it cannot
    carry six digits; drawing them as chassis silkscreen puts them under the module that
    covers them, which L21 correctly reports as printing on nothing.
    SO THEY ARE NOT DRAWN, and the numbering lives in the bay ids `fan-1` to `fan-6`, which
    is where a consumer reads it anyway. A configuration's `skins:` maps one skin per
    COMPONENT rather than per bay, so the fix is either six near-identical contracts or a
    per-bay skin the format does not have. Neither is worth one digit today; this records
    that the marks exist and why the drawing omits them.
- what: chassis-weight
  scope: [front, rear, top, bottom, left, right]
  reason: sources-disagree
  wanted: >-
    One weight. The datasheet says "7.5 kg (NW) 16.53 lb"; the quick start says "6.8 kg
    (14.99 lb), with two installed PSUs". The dimensions agree to the digit between the two,
    so this is not two products - but the quick start is a TWO-MODEL document covering the
    AS7535-28XB and the AS7535-28XBE, which is the likeliest explanation and is not a reason
    to pick one. The datasheet's figure is carried because it is the model-specific document.
- what: alarm-jack-lamp
  scope: [front]
  reason: needs-photo
  wanted: >-
    What the small white square beside the `Alarm` legend is. It reads 1.4 x 1.7 at
    408.2-409.6, y 17.5-19.2 - the size and place of a lamp, immediately left of the word and
    above the jack - and the quick start's LED table does not list an alarm-jack lamp among
    the seven groups it does list. It is drawn as a lamp with an `off`/`alarm` vocabulary
    borrowed from the ALARM system lamp the table DOES name, and both the borrow and the
    doubt are recorded here.
- what: qsfp-bezel-content
  scope: [front]
  reason: needs-photo
  wanted: >-
    What the white perforated strip between each optical cage pair is. On the SFP28 columns
    the equivalent strip carries one arrow lamp per port with round vent holes between, and
    the quick start's table names those lamps' colours. Between the QSFP cages the strip is a
    dense grid of rectangular openings with no arrows, and the two ports' lamps are the
    rectangles in the silkscreen band below, where the `Q-DD 1`/`QSFP28 1` legends put them.
    Drawn as a vent on that reading; a photograph would confirm there is no lamp in it.
- what: rear-blank-panel
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What is behind the perforated blank that fills the rear from 313.0 to the panel edge.
    Neither document calls it out - the rear elevation's only callout is 15, the fan modules -
    and it carries no handle, latch or fastener that would make it a module. It is drawn as
    what it appears to be: a vent field in fixed metal, with the grounding pad and earth
    symbol that sit on it. If it is a blank over an unpopulated bay, nothing here says so.
groups:
  qsfp-dd:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the synchronisation cluster - a BITS RJ-45, a ToD RJ-45, an SMB 1PPS jack, an SMB
      10 MHz jack and the SMA antenna input of the integrated GNSS receiver. Three media, one
      job: disciplining this box's clock from the network or from the sky, and passing it on.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the 1000BASE-T RJ-45 and the RS-232 console share one bezel,
      an alarm RJ-45 sits beside them, and a USB-C for storage and a micro-USB console are
      at the panel's end. Four media, one job.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: '1+1', redundancy-note: 'two load-sharing hot-swappable supplies, AC or DC'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: '5+1', redundancy-note: 'six hot-swappable rear fan modules, 5+1 redundant per the datasheet'}
  furniture: {term: Item, role: furniture, index-origin: 1}
