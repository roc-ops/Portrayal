configurations:
  ac-f2b:
    kind: base
    default: true
    power: ac
    description: >-
      The only build either staged document draws: two AC supplies and five front-to-back fan trays. The
      datasheet's ordering table sells it with and without a regional cord (below) and a DC build, which
      is dc-f2b. Its last row, 7926-40XKFB-O-AC-F Lite (FNPZZ7640001A), is not listed here: nothing held
      says what 'Lite' leaves out.
    part-numbers:
      7926-40XKFB-O-AC-F: {part: FNPZZ7640009A, power-cord: none}
      7926-40XKFB-O-AC-F-US: {part: FNPZZ7640401A, power-cord: N. America}
      7926-40XKFB-O-AC-F-EU: {part: FNPZZ7640201A, power-cord: EU}
      7926-40XKFB-O-AC-F-UK: {part: FNPZZ7640301A, power-cord: UK}
      7926-40XKFB-O-AC-F-JP: {part: FNPZZ7640501A, power-cord: JP}
      7926-40XKFB-O-AC-F-TW: {part: FNPZZ7640T01A, power-cord: TW}
      7926-40XKFB-O-AC-F-CN: {part: FNPZZ7640701A, power-cord: CN}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      Dual 48 VDC supplies (datasheet: input 40 to 72 VDC; the quick start wires -48 to -60 VDC on #10
      AWG) and the same five front-to-back fan trays - the datasheet's one DC ordering row. DRAWN WITH
      THE AC SUPPLY'S FACE, C14 inlet and all, because neither document pictures the DC unit: the build
      is real and orderable, and what it is fed with is a field a tool filters on, so it is declared rather
      than left out, and the wrong connector is the dc-supply-face gap.
    component-attrs:
      cor550-psu-ac: {input: dc, inlet: dc-terminal}
    part-numbers:
      7926-40XKFB-O-48V-F: {part: FNPZZ7640003A, power-cord: none}
