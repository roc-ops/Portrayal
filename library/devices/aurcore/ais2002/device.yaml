format: 1
kind: device
name: ais2002
version: 0.1.0
maturity: modelled
manufacturer: AurCore
model: AIS2002
description: >-
  AurCore AIS2002 industrial Layer 2+ switch - 8x GbE and 2x GbE SFP in the small AIS fanless
  finned aluminium housing, which clips onto a 35 mm DIN rail or screws to a wall, -40 to 75 C.
  The port face hangs vertically on the rail: a reset, two status lamps, the two SFP lamps and a
  two-way DIP switch at the top, the RJ45 block in two columns and the two SFP cages turned on
  their side below it. Unlike the large housing, the console RJ45 is on the TOP face, beside the
  dual 12-55 V DC power header, the relay contact and the ground screw; the DIN clip and two
  wall plates are on the back.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      vendor datasheet (AIS2002 Data Sheet 1.0, 3 pages: spec table, and an annotated front and
      back figure that is the same artwork as the product images); the product page's three
      images (straight-on front, three-quarter front-top-right, and a back render raised to show
      the top face), 1000 px. No hardware guide or drawing is published, and the vendor video
      shows only the large housing.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 'Dimension (L*W*H) 4.33 x 3.66 x 2.84 in'. As on the large housing the letters
      are not width, height and depth: the straight-on front reads within 2.5 percent of
      2.84/4.33 = 0.656 wide-to-tall, so L (110.0 mm) is the face's height as the unit hangs on
      the rail, H (72.1) its width and W (93.0) the depth.
  bevel:
    confidence: photo-measured
    note: >-
      photo-measured - the small housing has the large one's octagonal section at its own size.
      The front's silhouette narrows about 9 mm at its top and bottom rows and reaches full
      width about 15-16 mm in, at every corner, so the four depth-wise edges are bevelled [9,
      16] (the image's mask quantises to 1.8 mm). The legend plate is 44.5 of the 72.1 mm face,
      so the edges where the front and back meet the finned sides are bevelled 13.8, taken at 45
      degrees as on the large housing, whose video shows the same bands.
  front-layout:
    confidence: photo-measured
    note: >-
      photo-measured on the straight-on AIS2002 front image at 4.427 px/mm from the datasheet's
      110 mm face height (Gate 1: the face's own width agrees to 1-2.5 percent). Lamps located
      by colour: the control row at y 8.6 (PWR 27.5, SYS 32.6, the SFP lamps 9 and 10 at 37.7
      and 42.75); jack lamps in columns at x 26.6 and 48.3, rows on a 15.77 mm pitch from y
      24.4; the SFP pair x 25.0-50.0, y 87.6-102.1, between two gold number strips. Jacks are
      drawn with the lamped ganged cell turned 90/270 so the keyways face out (its lamps 8.3 mm
      apart against the jacks' 11), cages std/sfp@1 on their side, left 270 and right 90. The
      reset hole is not visible against the dark plate in the image; it is drawn under its
      legend, where the large housing has it.
  lamps:
    confidence: photo-measured
    note: >-
      photo-measured - each jack has ONE lamp, green, at its top (the PoE builds add an amber
      one below it), and the colour key names only LINK/ACT; drawn with
      common/rj45-ganged-link@1, the right-hand column with its lamp-right skin.
  silkscreen:
    confidence: photo-measured
    note: >-
      photo-measured - legends transcribed from the AIS2002 front image: Reset, PWR, SYS, 9, 10;
      Fast Ring and SCP with leaders to switches 1 and 2; LINK/ACT under its colour key; the
      port numbers, odd on the left; the SFP numbers on their gold strips; the summary line '8 x
      GE | 2 x GE SFP' up the left. The AURCORE wordmark is printed as text: its A is drawn as a
      chevron mark, which is not reproduced (no logo marks).
  top-layout:
    confidence: estimated
    note: >-
      estimated - no straight-on top view exists. Positions are fractions of the top face in the
      back render (image 3), corrected with the parts' own sizes: the five-way power header runs
      front to back (its 35.56 mm reading 35 on the render) with its pole legend '1 + - earth +
      - 2' on one side and POWER:12-55V DC on the other, pole 1 at the rear; the RELAY header
      behind it; the CONSOLE jack behind that, a bare RJ45 with its keyway toward the front -
      the console is on the top face of the small housing, where the large one has it on the
      front; the ground screw and its earth symbol at the front edge. Good to a few millimetres.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - the back render is foreshortened top to bottom; widths are taken as fractions
      of the face on the same image row, heights as fractions of 110 mm and fitted to the face.
      An upper wall plate with its screws above the keyholes, the DIN clip, and a lower plate
      with its screws below, centred; the 42 mm plate (common/wall-plate-keyhole-2-42@1) because
      the large housing's 56 mm one would overrun the 44.5 mm flat. The DIN rail's centre line
      lies about 55 mm from the top of this face.
  side-layout:
    confidence: estimated
    note: >-
      estimated - from the three-quarter image: the sides are fins running front to back between
      the bevels, with a recessed channel and a raised badge plate carrying the wordmark on the
      right side. The left side is not photographed and is drawn as fins only.
  bottom-layout:
    confidence: estimated
    note: >-
      estimated - not photographed; drawn bare (see the underside gap).
  power:
    confidence: datasheet
    note: >-
      datasheet - 'Power Supply DC 12-55 V'; 'Idling: 12V 1.99W / 55V 2.48W'; 'Full load: 12V
      6.71W / 55V 6.99W'. power-max-w takes the highest figure (6.99 W); no ambient is stated
      with any of them. The supply is not included ('the power supply is excluded from the
      package').
  surge:
    confidence: datasheet
    note: >-
      datasheet - the AIS2002 data sheet states two figures: its feature list says 'Common mode
      4KV' and its specification table 'Common mode 6KV'. The table is taken, as it agrees with
      the AIS2001, AIS2001P and AIS2002P; the 4 kV bullet may be carried over from another model
      and is unresolved.
attrs:
  physical:
    dimensions-in: 4.33 x 3.66 x 2.84 (L x W x H, datasheet)
    enclosure: fanless all-aluminium, finned
    mounting: DIN rail (TS35) or wall
    accessories: two pluggable terminal plugs (power and relay), console cable
  performance:
    switching-capacity: 20 Gbps
    forwarding-rate: 14.88 Mpps
    mac-table: 8K
  power:
    power-max-w: 6.99
    power-envelope: fully-configured
    power-idle-w: 2.48
    power-input: DC 12-55 V, dual feed
  thermal:
    cooling: fanless (finned housing)
  environmental:
    operating-temp-c: -40 to 75
    storage-temp-c: -40 to 80
    surge-protection: differential mode 2 kV, common mode 6 kV
    esd: contact 6 kV, air 8 kV
  platform:
    flash-mb: 32
    memory: 128 MB
  features:
    optics-sfp: >-
      vendor optics listed under AurCore Accessories - AOM01M-S550 (1G, multimode, 550 m) and
      AOM01S-K10 (1G, single-mode, 10 km); the datasheet states no compatibility list or
      third-party policy
    layer: L2+ (static routing, ERPS ring recovery 20 ms or less)
  management:
    interfaces: console, Telnet, SSH, SNMP v1/v2c/v3, web, ACC/ACN cloud
    interface-naming: Ethernet1/0/N (Command Manual - 2000 Series)
  lifecycle:
    eol: none-announced
