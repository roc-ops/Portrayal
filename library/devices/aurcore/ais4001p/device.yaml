format: 1
kind: device
name: ais4001p
version: 0.1.1
maturity: modelled
manufacturer: AurCore
model: AIS4001P
description: >-
  AurCore AIS4001P industrial Layer 3 PoE+ switch - 8x GbE PoE+ and 4x 10G SFP+, L3 in a fanless
  finned aluminium housing that clips onto a 35 mm DIN rail or screws to a wall, -40 to 75 C.
  The port face hangs vertically on the rail: console, two status lamps, a reset and a two-way
  DIP switch at the top, the RJ45 block in two columns, the SFP+ cages turned on their side
  below it. Dual 48-57 V DC feeds, the relay contact and the ground screw are on the top face;
  the DIN clip and two wall plates on the back.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      vendor datasheet (AIS4001P Data Sheet 1.0, 3 pages: spec table, and an annotated front and
      back figure that is the same artwork as the product images); the product page's three
      images (straight-on front, three-quarter front-top-right, and a back render raised to show
      the top face), 1000 px; and the vendor's AIS4000 Series video (YouTube MfK6WpjLsA8,
      1080p), whose footage at 0:28-1:02 is a real AIS4001P. No hardware guide or drawing is
      published (the Download Center holds the CLI, ACC and ACN manuals only).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 'Dimension (L*W*H) 5.71 x 4.33 x 3.30 in'. The letters are not width, height
      and depth: the straight-on front reads 0.587 wide-to-tall against 3.30/5.71 = 0.578, so L
      (145.0 mm) is the face's height as the unit hangs on the rail, H (83.8) its width and W
      (110.0) the depth from the port face to the DIN face.
  bevel:
    confidence: photo-measured
    note: >-
      photo-measured - the housing is an octagon in section: the four edges that run from the
      port face to the back are cut off, which is what the user and the photographs call its
      wedge. The front's silhouette (front image, 4.407 px/mm) narrows 10.9 mm at its top and
      bottom rows and reaches full width 16.3 mm in, at every corner; the four product images
      give identical silhouettes, quantised to 1.8 mm by the image's mask, so 11 and 16 are good
      to about two millimetres. The video (0:31-0:41) shows these cuts running the whole depth.
      THE GREY BANDS BESIDE THE LEGEND PLATE ARE BEVELS TOO, which a first draft of this model
      read as flat casting and the maintainer corrected from the explorer: in the video's
      three-quarter frames (0:29-0:33, and the render at 0:46) the band right of the plate is
      lit as its own plane and its top edge slants up to meet the top face, and the back face
      (0:32) carries the same band between the plates and the fins. So the four edges between
      the front or back and the finned sides are bevelled as well, 12.6 mm across the face - the
      dark plate is 58.4 of the 83.8 mm, measured on the straight-on front - and taken at 45
      degrees, because no view shows how far back along the side the bevel runs. The back is
      taken to match the front.
  front-layout:
    confidence: photo-measured
    note: >-
      photo-measured on the straight-on AIS4001P front image at 4.407 px/mm (Gate 1: the face's
      own width agrees with the datasheet to 1.5 percent; the datasheet's front is the same
      artwork). Jack lamps located by colour; columns at x 23.85 and 45.2, rows on a 15.57 mm
      pitch from y 43.2; SFP+ block x 22.2-47.8, rows from y 106.8 and 122.1. Jacks are drawn
      with the lamped ganged cell turned 90/270 so the keyways face out; its lamps are 8.3 mm
      apart against the jacks' 11.5, the closest library cell that fits the 11 mm column. The
      console is the bare ganged cell, turned the same way. Cages are std/sfp@1 on their side;
      each SFP lamp is a small dash drawn with common/led-rect-sm@1 turned 90.
  sfp-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the gold strip reads, top to bottom, an up-pointing triangle and 9, a
      lamp, a down-pointing triangle and 10, a lamp, up 11, a lamp, down 12, a lamp, in text
      turned to read down the face. Up in that text points away from the strip, so 9 and 11 are
      the right-hand column and 10 and 12 the left, top row first.
  lamps:
    confidence: photo-measured
    note: >-
      photo-measured - each jack has two lamps, green at its top and amber at its bottom, and
      the faceplate's colour key pairs green with LINK/ACT and red-orange with PoE; so the green
      lamp is link/activity and the amber one PoE, set per placement because the two columns are
      turned opposite ways and swap led-a and led-b.
  silkscreen:
    confidence: photo-measured
    note: >-
      photo-measured - legends transcribed from the AIS4001P front image: Reset, SYS, PWR; Fast
      Ring and SCP with leaders to switches 1 and 2; CONSOLE; the port numbers as printed;
      LINK/ACT and PoE under their colour keys; the summary line '8 X GE | 4 X 10 GE SFP+ | L3
      PoE+'. The AURCORE wordmark is printed as text: its A is drawn as a chevron mark, which is
      not reproduced (no logo marks).
  top-layout:
    confidence: estimated
    note: >-
      estimated - no straight-on top view exists. Positions are fractions of the top face in the
      back render (image 3, raised about 35 degrees), corrected with the parts' own sizes: the
      five-way power header (Phoenix MSTB-GF family, 35.56 mm) runs front to back with its pole
      legend '1 + - earth + - 2' on one side and POWER:48-57V DC on the other (read off this
      build's back render), pole 1 at the rear; the RELAY header and the ground screw with its
      earth symbol are near the front edge. The video (1:00-1:02) confirms every part and legend
      close up but not their places on the face. Good to a few millimetres.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - the back render is foreshortened top to bottom; widths are taken as fractions
      of the face on the same image row, heights as fractions of 145 mm. Two wall plates (upper
      with its screws above the keyholes, lower with them below) and the DIN clip between them,
      centred. The DIN rail's centre line lies about 79 mm from the top of this face.
  side-layout:
    confidence: estimated
    note: >-
      estimated - from the video (0:37-0:41, 0:55) and the three-quarter image: both sides are
      fins running front to back, with a recessed channel and a raised badge plate carrying the
      wordmark on the right side. The left side is not photographed square on and is drawn as
      fins only.
  bottom-layout:
    confidence: estimated
    note: >-
      estimated - the underside is not photographed. Drawn as plain casting, the bevels strips
      at its sides; registered as a gap.
  power:
    confidence: datasheet
    note: >-
      datasheet - 'Power Supply DC 48-57 V'; 'Idling: 48V 7.12W / 57V 7.52W'; 'Full load: 48V
      243.36W / 57V 245.67W'; 'Power Budget 240W'. power-max-w takes the highest figure (245.67
      W); no ambient is stated with any of them. The supply is not included ('the power supply
      is excluded from the package').
attrs:
  physical:
    dimensions-in: 5.71 x 4.33 x 3.30 (L x W x H, datasheet)
    enclosure: fanless all-aluminium, finned
    mounting: DIN rail (TS35) or wall
    accessories: two pluggable terminal plugs (power and relay), console cable
  performance:
    switching-capacity: 96 Gbps
    forwarding-rate: 71.42 Mpps
    mac-table: 16K
  power:
    power-max-w: 245.67
    power-envelope: fully-configured
    power-idle-w: 7.52
    poe-budget-w: 240
    poe-standard: IEEE 802.3af/at
    power-input: DC 48-57 V, dual feed
  thermal:
    cooling: fanless (finned housing)
  environmental:
    operating-temp-c: -40 to 75
    storage-temp-c: -40 to 80
    surge-protection: differential mode 2 kV, common mode 4 kV
    esd: contact 6 kV, air 8 kV
  platform:
    flash-mb: 64
    memory: 1 GB
  features:
    optics-sfp-plus: >-
      vendor optics listed under AurCore Accessories - AOM10M-S300 (10G, multimode, 300 m) and
      AOM10S-K10 (10G, single-mode, 10 km), with AOM01M-S550 and AOM01S-K10 at 1G; the datasheet
      states no compatibility list or third-party policy
    layer: L3 (static routing, ERPS ring recovery 20 ms or less)
  management:
    interfaces: console, Telnet, SSH, SNMP v1/v2c/v3, web, ACC/ACN cloud
    interface-naming: Ethernet1/0/N (Command Manual - 4000 Series)
  lifecycle:
    eol: none-announced
chassis:
  width: 83.8
  height: 145.0
  depth: 110.0
  mount: din-rail
  bevel:
  - {edges: [top-left, top-right, bottom-left, bottom-right], size: [11, 16]}
  - {edges: [front-left, front-right, rear-left, rear-right], size: 12.6}
  color: '#63696f'
  edge: '#3f4449'
  silk: '#e3e6ea'
  airflow: passive
  power: dc
gaps:
- what: no-drawing
  scope: [front, rear, top]
  reason: needs-drawing
  wanted: >-
    A dimensioned drawing or the in-box quick installation guide. Nothing published gives the
    bevel, the DIN clip's position or the top-face layout; they are photo-measured or estimated
    (see provenance). AurCore support or a reseller holds the guide.
- what: weight
  scope: [base]
  reason: vendor-silent
  wanted: The unit's weight; the datasheet gives none.
- what: sfp-port-numbering
  scope: [port-9, port-10, port-11, port-12]
  reason: needs-hardware
  wanted: >-
    Confirmation of the port numbering read from the faceplate's arrows (see provenance
    sfp-numbering); a unit, or the switch's own port table against a seated optic, settles it.
- what: jack-lamp-spacing
  scope: [gbe-poe]
  reason: needs-hardware
  wanted: >-
    A lamped RJ45 cell with 11.5 mm between its lamps on an 11 mm column; the library's nearest
    puts them 8.3 mm apart.
- what: underside
  scope: [bottom]
  reason: needs-photo
  wanted: A photograph of the underside.
