configurations:
  base:
    kind: base
    default: true
    description: >-
      The frame as XPU00 ships: empty, all eight slots open, the five guide
      posts in place.
  xpu00:
    kind: orderable
    part-numbers:
      XPU00: {part: XPU00}
    description: >-
      XPU00 - the frame without grounding, as it ships: empty, all eight slots
      open.
  xps00:
    kind: orderable
    part-numbers:
      XPS00: {part: XPS00}
    component-attrs:
      grounding-bar: {finish: '#b87333'}
    description: >-
      XPS00 - the frame with grounding, as it ships: empty, all eight slots
      open. A copper-coloured grounding bar runs behind the posts; see
      provenance.grounding.
  mixed:
    kind: example
    description: >-
      One of each holder kind in each row: 12 LC duplex, 12 SC/APC, 6 LC
      duplex and 6 SC/APC. It shows the four slot fronts seated. Illustrative:
      holders are ordered separately from the frame.
    bays:
      slot-1: fibrain/xmn1021gb@2
      slot-2: fibrain/xmn1051gb@2
      slot-3: fibrain/xmi1021ga@2
      slot-4: fibrain/xmi1051ga@2
      slot-5: fibrain/xmn1051gb@2
      slot-6: fibrain/xmn1021gb@2
      slot-7: fibrain/xmi1051ga@2
      slot-8: fibrain/xmi1021ga@2
  copper-mixed:
    kind: example
    description: >-
      All eight slots in copper: 48 RJ45 ports in the one unit, the most the
      datasheet gives for copper. Odd slots take a screened six-way holder
      (XMS00) with screened modules. Even slots take an unscreened one (XMU00)
      with unscreened modules, as the datasheets pair them. Each holder mixes
      Cat.5, Cat.6 and Cat.6A. Illustrative: holders and modules are ordered
      separately from the frame.
    # The keystone-adapter modules are xe110, xe210, xq110, xq210, xr110 and
    # xr210. They draw the same face as the plain ones, so only the part
    # number tells them apart: the screened (odd) slots seat xe210, xq210 and
    # xr210 as three neighbours (pos 4-6 in slot 1, 3-5 in slot 3, 2-4 in slot
    # 5, 1-3 in slot 7) and the unscreened (even) slots seat xe110, xq110 and
    # xr110 the same way (pos 4-6 in slot 2, 3-5 in slot 4, 2-4 in slot 6,
    # 1-3 in slot 8). The other three modules of a holder are the plain ones.
    bays:
      slot-1: fibrain/xms00@1
      slot-1/pos-1: fibrain/xe200@1
      slot-1/pos-2: fibrain/xq200@1
      slot-1/pos-3: fibrain/xr200@1
      slot-1/pos-4: fibrain/xe210@1
      slot-1/pos-5: fibrain/xq210@1
      slot-1/pos-6: fibrain/xr210@1
      slot-2: fibrain/xmu00@1
      slot-2/pos-1: fibrain/xe100@1
      slot-2/pos-2: fibrain/xq100@1
      slot-2/pos-3: fibrain/xr100@1
      slot-2/pos-4: fibrain/xe110@1
      slot-2/pos-5: fibrain/xq110@1
      slot-2/pos-6: fibrain/xr110@1
      slot-3: fibrain/xms00@1
      slot-3/pos-1: fibrain/xq200@1
      slot-3/pos-2: fibrain/xr200@1
      slot-3/pos-3: fibrain/xe210@1
      slot-3/pos-4: fibrain/xq210@1
      slot-3/pos-5: fibrain/xr210@1
      slot-3/pos-6: fibrain/xe200@1
      slot-4: fibrain/xmu00@1
      slot-4/pos-1: fibrain/xq100@1
      slot-4/pos-2: fibrain/xr100@1
      slot-4/pos-3: fibrain/xe110@1
      slot-4/pos-4: fibrain/xq110@1
      slot-4/pos-5: fibrain/xr110@1
      slot-4/pos-6: fibrain/xe100@1
      slot-5: fibrain/xms00@1
      slot-5/pos-1: fibrain/xr200@1
      slot-5/pos-2: fibrain/xe210@1
      slot-5/pos-3: fibrain/xq210@1
      slot-5/pos-4: fibrain/xr210@1
      slot-5/pos-5: fibrain/xe200@1
      slot-5/pos-6: fibrain/xq200@1
      slot-6: fibrain/xmu00@1
      slot-6/pos-1: fibrain/xr100@1
      slot-6/pos-2: fibrain/xe110@1
      slot-6/pos-3: fibrain/xq110@1
      slot-6/pos-4: fibrain/xr110@1
      slot-6/pos-5: fibrain/xe100@1
      slot-6/pos-6: fibrain/xq100@1
      slot-7: fibrain/xms00@1
      slot-7/pos-1: fibrain/xe210@1
      slot-7/pos-2: fibrain/xq210@1
      slot-7/pos-3: fibrain/xr210@1
      slot-7/pos-4: fibrain/xe200@1
      slot-7/pos-5: fibrain/xq200@1
      slot-7/pos-6: fibrain/xr200@1
      slot-8: fibrain/xmu00@1
      slot-8/pos-1: fibrain/xe110@1
      slot-8/pos-2: fibrain/xq110@1
      slot-8/pos-3: fibrain/xr110@1
      slot-8/pos-4: fibrain/xe100@1
      slot-8/pos-5: fibrain/xq100@1
      slot-8/pos-6: fibrain/xr100@1
  # The orderable xpu00 and xps00 above stay empty on purpose: DSH XPU00 rev 2
  # is titled 'empty' and the XPS00 sheet gives the same, so neither SKU ships
  # with holders, and holders and modules are separate part numbers. These two
  # examples show each SKU with its slots full. The keystone-adapter modules
  # (xe110, xq110, xr110 in xpu00-copper; xe210, xq210, xr210 in
  # xps00-copper) draw the same face as the plain ones. In each holder they
  # are three neighbours: pos 4-6 in slots 1 and 5, pos 3-5 in slots 2 and 6,
  # pos 2-4 in slots 3 and 7, pos 1-3 in slots 4 and 8.
  xpu00-copper:
