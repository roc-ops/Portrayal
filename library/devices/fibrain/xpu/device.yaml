  physical:
    material: powder paint coated steel frame, plastic guides
    color: Black RAL 9005
  environmental:
    operating-temp: -40 to 70 C
    ingress-protection: IP 20 (EN 60529)
  lifecycle:
    eol: none-announced
chassis:
  width: 484.6
  height: 43.96
  depth: 250.0
  ru: 1
  shell: sheet
  thickness: 0.8
  weight-kg: 1.2
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: grounding
    scope: [front, rear, right]
    reason: needs-drawing
    note: >-
      the one drawing is named XPS00 and nothing separates what the grounded
      frame adds. The copper-coloured bar is read off one picture and is a
      mark on the plan only; the yellow label and the fasteners are not
      drawn.
    wanted: >-
      a drawing or a square-on photograph of each of XPU00 and XPS00, or the
      parts list that says what XPS00 adds.
  - what: depth-and-rear
    scope: [rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      no rear, side or top CAD is published; the rear is the front mirrored
      and the plan is read off a datasheet drawing at 1.376 px/mm.
    wanted: >-
      side and top views of XPS00 from the maker, whose CAD archive shows
      they exist.
  - what: cross-member
    scope: [front, rear, top]
    reason: needs-drawing
    note: >-
      the front elevation shows a slotted band 19 high at mid height behind
      the posts and nothing says how far back it stands. It is read as the
      upright of the rear cable bar and built there; it is not drawn on the
      front, where a slot mouth hides panel decor. See provenance.cross-member.
    wanted: >-
      a side or top view of the frame, or a photograph from behind.
  - what: floor
    scope: [front, top, bottom]
    reason: sources-disagree
    note: >-
      the front elevation and the datasheet front drawing both draw a floor
      sheet under the slot parts, 0.80 thick, and the datasheet plan an edge
      30.5 to 52 behind the face that is read as its rear edge; the six
      renders of XPU00 show the posts hanging from the top sheet with no
      sheet under them. The drawings are followed and the floor is built.
    wanted: >-
      a photograph of the underside of either frame.
  - what: copper-rear
    scope: [rear, top]
    reason: needs-drawing
    note: >-
      the six-way RJ45 holders and their modules are drawn from the front only.
      A seated RJ45 holder shows no back through the open rear, and no plan,
      because the maker publishes no rear or plan view of a holder or a module
      and the IDC back of a module is not a port here.
    wanted: >-
      a rear and a plan view of an XMS00 or XMU00 holder with modules seated,
      or a photograph from behind.
  - what: slot-numbering
    scope: [front]
    reason: vendor-silent
    note: >-
      nothing numbers the slots; the order here is proposed, upper row first.
    wanted: >-
      a photograph of a labelled, installed frame, or the numbering
      convention of the maker.
groups:
  slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      eight slots, four across and two high, each taking one HD slot part.
      Numbered left to right, the upper row first; the order is proposed, the
      frame prints none.
  frame:
    term: Item
    role: furniture
    index-origin: 1
    description: >-
      the metal and plastic of the frame itself: two ears, five guide posts,
      the floor, the top sheet, the rear cable bar and two sides; on XPS00
      the grounding bar.
