        - {at: [0, 0], size: [431.35, 22.2], fill: '#1b1e21'}
    components:
      bays:
        - id: drawer
          at: [0, 0]
          size: {w: 431.35, h: 22.2}
          accepts: [fibrain/xcu-drawer@1]
          default: fibrain/xcu-drawer@1
          group: drawer
          rel-pos: 1
          plan: {view: top, at: [0, 34.0], rotate: 180, in: interior, under: [shell-top]}

  rear:
    size:
      w: 431.35
      h: 22.2
    panel:
      decor:
        - {id: interior, at: [1.0, 1.0], size: [429.35, 20.2], fill: '#0b0c0d', kind: opening}
        - {id: top-sheet-edge, at: [0, 0], size: [431.35, 1.0], fill: '#1b1e21', kind: frame}
        - {id: floor-edge, at: [0, 21.2], size: [431.35, 1.0], fill: '#1b1e21', kind: frame}
        - {id: side-left-edge, at: [0, 1.0], size: [1.0, 20.2], fill: '#1b1e21', kind: frame}
        - {id: side-right-edge, at: [430.35, 1.0], size: [1.0, 20.2], fill: '#1b1e21', kind: frame}

  top:
    size:
      w: 431.35
      h: 284.0
    panel:
      decor:
        - {at: [0, 0], size: [431.35, 284.0], fill: '#141618'}
    components:
      placements:
        - {id: interior, ref: fibrain/xcu-interior@1, at: [1.0, 1.0], group: interior, rel-pos: 1, under: [shell-top]}
        - {id: side-left, ref: fibrain/xcu-side@1, at: [0.0, 1.0], group: interior, rel-pos: 2, in: interior, under: [shell-top]}
        - {id: side-right, ref: fibrain/xcu-side@1, at: [430.35, 1.0], group: interior, rel-pos: 3, in: interior, under: [shell-top]}
        - {id: shell-top, ref: fibrain/xcu-shell-top@1, at: [0.0, 0.0], group: covers, rel-pos: 1}

