    size:
      w: 431.35
      h: 284.0
    panel:
      decor:
        - {at: [0, 0], size: [431.35, 284.0], fill: '#1b1e21'}

  left:
    size:
      w: 284.0
      h: 22.2
    panel:
      decor:
        - {at: [0, 0], size: [284.0, 22.2], fill: '#1b1e21'}

  right:
