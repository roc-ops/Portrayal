configurations:
  base:
    kind: base
    default: true
    description: >-
      The panel with its drawer in and a blind cover in each of the four
      holder slots - the frame before a variant is chosen. Fibrain does not
      list the XCU10 empty; every part number is an equipped one.
  xcu10-51id:
    kind: orderable
    part-numbers:
      XCU10-51ID: {part: XCU10-51ID}
    description: >-
      XCU10-51ID - 48 SC/APC adapters, 48 SC/APC G.657A1 pigtails: four 12-port
      SC/APC holders.
    bays:
      drawer/slot-1: fibrain/xmn1051gb@2
      drawer/slot-2: fibrain/xmn1051gb@2
      drawer/slot-3: fibrain/xmn1051gb@2
      drawer/slot-4: fibrain/xmn1051gb@2
  xcu10-41id:
    kind: orderable
    part-numbers:
      XCU10-41ID: {part: XCU10-41ID}
    description: >-
      XCU10-41ID - 48 SC adapters, 48 SC G.657A1 pigtails: four 12-port SC
      holders.
    bays:
      drawer/slot-1: fibrain/xmn1041gb@2
      drawer/slot-2: fibrain/xmn1041gb@2
      drawer/slot-3: fibrain/xmn1041gb@2
      drawer/slot-4: fibrain/xmn1041gb@2
  xcu10-21ic:
    kind: orderable
    part-numbers:
      XCU10-21IC: {part: XCU10-21IC}
    description: >-
      XCU10-21IC - 24 LC duplex adapters, 48 LC G.657A1 pigtails: four 6-port
      LC duplex holders.
    bays:
      drawer/slot-1: fibrain/xmi1021ga@3
      drawer/slot-2: fibrain/xmi1021ga@3
      drawer/slot-3: fibrain/xmi1021ga@3
      drawer/slot-4: fibrain/xmi1021ga@3
  xcu10-31ic:
    kind: orderable
    part-numbers:
      XCU10-31IC: {part: XCU10-31IC}
    description: >-
      XCU10-31IC - 24 LC/APC duplex adapters, 48 LC/APC G.657A1 pigtails: four
      6-port LC/APC duplex holders.
    bays:
      drawer/slot-1: fibrain/xmi1031ga@3
      drawer/slot-2: fibrain/xmi1031ga@3
      drawer/slot-3: fibrain/xmi1031ga@3
      drawer/slot-4: fibrain/xmi1031ga@3
