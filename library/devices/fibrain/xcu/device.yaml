format: 1
kind: device
name: xcu
version: 1.0.3
maturity: modelled
manufacturer: Fibrain
model: XCU10
description: >-
  Extendable HD fibre patch panel, 0.5U, 19 in. A drawer on telescopic rails
  carrying four HD adapter holders across its front and two stacked splice
  cassettes behind them: 48 splices, so up to 48 SC simplex or 24 LC duplex
  adapters. Sold equipped, as XCU10-AB-CD, with adapters and pigtails to
  order.
profile: optical
provenance:
  method:
    confidence: estimated
    note: >-
      NO ORTHOGRAPHIC SOURCE EXISTS. Fibrain publishes a two-page datasheet with
      three overall figures and four three-quarter renders, and no drawing or
      installation guide (the site's media index was searched for both). The
      overall size is the datasheet's; everything across the face is measured
      off the one render with its camera on the centre line, which is of the 1U
      extendable sibling XHU00 (XHU00_6.jpg, 4000 px, the 482.6 rack face at
      7.94 px/mm). The XCU's own renders (XCU00_1 to _4) show the same row -
      five red latches, four holders between them - and were used to confirm
      counts, not to measure. Modelling from renders was accepted at intake.
  chassis:
    confidence: datasheet
    note: >-
      DSH_XCU00_EN rev 1.1 (05.07.2024): height 0.5U, width 19 in, depth 284 mm,
      powder painted steel. 22.2 is half of 44.45, the figure the sibling XAU
      sheet prints beside its own 0.5U. THE WIDTH IS NOT THE DATASHEET's: 19 in
      is the rack face with its ears. The body is drawn 431.35 wide, estimated -
      the five latch pillars stand on a 106.27 pitch centred on the rack face
      (centres 28.77, 135.03, 241.36, 347.63, 453.83 of 482.6) and the body is
      taken as the span of the row they bound, four pitches and one pillar. The
      ears reach about 25.6 either side of that. A HINT, NOT A MEASUREMENT OF
      THIS PANEL: the front elevation Fibrain publishes for the 1U frame of
      the same family (fibrain/xpu) is 484.60 over its ears, not 482.6, with
      five posts 7.01 wide on a 107.00 pitch and 435.00 between the ears.
      Scaled on 484.6 the render's pitch reads 106.71 and its pillar centres
      fall within 0.6 of that frame's. No drawing of the 0.5U panel is
      published, so the figures here stay as read.
  drawer:
    confidence: estimated
    note: >-
      THE WHOLE FRONT IS ONE PART. The front of the panel is the front of its
      drawer, so the front view is a single bay holding fibrain/xcu-drawer@1,
      which carries the four holder slots, pulls out its declared travel and
      stays captive. Its plan lands in the top view under the shell top,
      turned half a turn because a plan is drawn face-at-the-top and the top
      view has the rear at the top.
  not-drawn:
    confidence: estimated
    note: >-
      THE THREE PULL HANDLES ARE NOT ON THE FRONT VIEW. They hang from the top
      edge in front of the second, third and fourth pillars and dip across the
      adapters either side; seen square-on they cover parts of twelve ports and
      nothing fixes their outline. The rack ears are not drawn either: the
      library's ear is a 1U part. See `gaps`.
  shell:
    confidence: estimated
    note: >-
      A SHEET BODY, NOT A BLOCK TO 284. The panel is a drawer in a shell, so its
      solid is the shell's plates and the drawer's own parts and not a box the
      depth of the rack: a top sheet over the drawer (fibrain/xcu-shell-top@1),
      a floor (fibrain/xcu-interior@1) and a side wall each way
      (fibrain/xcu-side@1), with air between them for the adapter holders'
      backs and the cassettes, and THE REAR OPEN. 1.0 is the sheet the interior
      already assumed; no document states a gauge. THE OPEN REAR IS A STAND-IN:
      the datasheet shows no rear view, and the renders show only the top
      notched across the rear between two tabs, which is not dimensioned and is
      not drawn. A closed back with that notch would leave the same way in for a
      cable; what is drawn is the way in without its width. A cable reaches the
      far end of an adapter, which stands in the holder at 37 deep, from
      behind.
  rear:
    confidence: estimated
    note: >-
      THE REAR VIEW IS THE OPEN BACK OF THAT SHELL: the edges of the top sheet,
      the floor and the two sides round an opening, and nothing across it. No
      held image is square to the rear. The adapters' far ends are on this
      panel for a cable (the holders' rear faces, fibrain/xm*-rear@2, whose
      sources are in their own provenance) and are not drawn on it, because a
      holder in a drawer is not a bay of the device and no panel of the device
      draws the back of what the drawer holds.
  envelope-faces:
    confidence: estimated
    note: >-
      bottom, left and right are the envelope and are deliberately blank: the
      sides are plain sheet on the renders.
chassis:
  width: 431.35
  height: 22.2
  depth: 284.0
  ru: 0.5
  color: '#1b1e21'
  shell: sheet
  thickness: 1.0
  airflow: passive
gaps:
  - what: face-geometry
    scope: [front, top]
    reason: needs-drawing
    note: >-
      every position across the front is measured off a render of the 1U
      sibling, and the drawer's depth, travel and floor layout are read off
      three-quarter renders; no dimensional drawing of the XCU is published.
      Accepted at intake, 2026-10-05.
    wanted: >-
      a dimensional drawing or STEP file of XCU10, or a square-on photograph
      with a rule in frame.
  - what: handles-and-ears
    scope: [front, top]
    reason: needs-drawing
    note: >-
      the three pull handles and the rack ears are real and are not drawn; no
      held image is square to either.
    wanted: >-
      a square-on photograph of the front, and one from above.
  - what: e2000-capacity
    scope: [front]
    reason: sources-disagree
    note: >-
      the datasheet's configuration table gives 48 E2000 adapters in four
      holders; the product page gives 24 for E2000, FC and ST; the breakout
      cassette datasheet seats 8 E2000 in a 12-port body, which would be 32.
      No E2000 holder is modelled, so the manifest carries none of the three.
    wanted: >-
      the E2000 holder's own part number and datasheet.
  - what: holder-details
    scope: [front]
    reason: vendor-silent
    note: >-
      the holders carry no printing, so their port order is this library's
      and is ASSUMED: left to right, the upper row first, bore by bore. A
      lower-row LC adapter is an upper-row one turned over, so each LC holder
      states its bores in the order they are met along the row and a 12-port
      holder's ports read 13, 14, 15, 16 there. Fibrain's label field gives
      each bore a blank cell and prints no numbers. No held image shows an SC PC holder,
      an LC/APC holder or any multimode holder, so those adapter colours are
      carried over or assumed; each holder says which. The LC holders use an
      adapter measured on another vendor's cassette, turned on its side, and
      are drawn with the dust caps that adapter ships with, where the vendor's
      renders show open ports.
    wanted: >-
      a photograph of a labelled, installed panel, and of an LC and a multimode holder.
  - what: envelope-faces
    scope: [rear, bottom, left, right]
    reason: needs-photo
    note: >-
      no held image shows the rear or the underside. The rear is drawn open,
      and the notch the renders show across the top at the rear is not drawn.
    wanted: >-
      photographs of the rear and the underside.
groups:
  drawer:
    term: Drawer
    role: service
    index-origin: 1
    description: >-
      the one sliding drawer; its four holder slots are numbered left to right.
      Fibrain numbers nothing on the panel; the order is this library's.
  interior:
    term: Item
    role: furniture
    index-origin: 1
    description: >-
      the inside of the shell, the space the drawer slides in.
  covers:
    term: Cover
    role: furniture
    index-origin: 1
    description: >-
      the shell's top, which lifts off in the viewer to show the drawer from
      above.
