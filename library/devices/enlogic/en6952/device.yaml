gaps:
- what: weight
  scope: [front, rear, left, right]
  reason: vendor-silent
  note: "no held document states a weight: neither the drawing nor the data sheet has a field."
  wanted: a weight from the maker.
- what: colour
  scope: [front, rear, left, right]
  reason: needs-photo
  note: "no photograph of a unit, and no render, is held: bank plate and body colours are estimates from the drawing's colour names."
  wanted: photographs of a unit, front, back, sides and ends.
- what: module-ports
  scope: [front]
  reason: needs-photo
  note: "the module's picture on sheet 2 is a small undimensioned raster: the ports' positions are read in its proportions, which way each jack faces (the RJ45 latch side) is not stated, and the two sensor ports are drawn as dark openings, not as a connector, because no held document names their connector type."
  wanted: a photograph of the module's face and the manual's port table.
- what: sensor-count
  scope: [front]
  reason: sources-disagree
  note: "the data sheet says the module 'supports up to 10 digital sensor' and the drawing's close-up 'supports up to 8 physical sensors'; two sensor ports are drawn."
  wanted: the maker's word on the sensor capacity.
- what: input-plug
  scope: [top]
  reason: sources-disagree
  note: "the data sheet names the plug 460P9 (IP44) and the drawing's sheet 1 an optional 460P9W (IP67); only the default is drawn."
  wanted: the maker's word on the plug.
- what: button-locations
  scope: [rear]
  reason: needs-drawing
  note: "the side view marks '(4) PL 48.0' and '2X 24.0' without drawing what they locate; only the two rear buttons are placed."
  wanted: a drawing that dimensions the other locations.
- what: outlet-turn
  scope: [front]
  reason: needs-drawing
  note: "the sheet-2 close-ups of the two outlet wells are undimensioned rasters; no turn is claimed for any outlet, and the wells are drawn to the registry C13 and C19 shapes scaled into the drawn size."
  wanted: a dimensioned drawing of each well.
- what: c15-notch
  scope: [front]
  reason: needs-drawing
  note: "the maker's \"C13/C15 COMBO 10A, 250V\" well (the upper row) is a C13 with the C15 extension, rated 10 A; it is placed as `iec-c13` and not as a combination key, because it takes a C14 plug but not a C20. Whether it should have a key of its own is open."
  wanted: the maker's word on the C15 notch and a dimensioned drawing of the well.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: "the side and bottom views are plain outlines; no photograph looks at an end or a side."
  wanted: straight-on photographs of an end and a side.
- what: outlet-numbers
  scope: [front]
  reason: vendor-silent
  note: "no held view prints an outlet number, so no outlet name is taken."
  wanted: none.
- what: outlet-meters
  scope: [front]
  reason: needs-photo
  note: "the data sheet says every outlet is metered and switched; the front view draws a small window or lamp at each outlet that no held sheet names, so no outlet lamp is drawn."
  wanted: a photograph of the outlet face and the manual's outlet display section.
