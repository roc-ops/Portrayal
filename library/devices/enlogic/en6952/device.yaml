maturity: modelled
manufacturer: Enlogic
model: EN6952
description: "Enlogic EN6 PDU, 0U: a 1780 mm dark strip, 56 mm wide and 75 mm deep, that hangs on two toolless buttons beside a rack and hands a three-phase 208 V delta feed (a fixed 1.8 m cord with an IEC 60309 3P+E 9h plug (the maker's 460P9, IP44), 60 A (48 A derated)) on to 42 switched outlets - 21 C13/C15 and 21 C13/C15/C19 combination outlets - in six colour-coded banks, each behind its own 20 A double-pole breaker, with a hot-swap network management module (display, two Ethernet ports, USB-C and two sensor ports) between banks three and four."
profile: power
provenance:
  method: {confidence: drawing, note: "FIGURES FROM THE MAKER'S VECTOR DRAWING. Enlogic EN6952 customer drawing EN6952-WXYZ_DA rev E3, 2023/02/09 (three A3 sheets) and the EN6952 data sheet (four pages). Sheet 1 is vector: the front view's path boxes were read at 2.4306 mm per pt, the 56.0 width as drawn (23.04 pt), which the 1780.0 overall (732.3 pt between the end lines) checks. Sheet 2 carries a raster close-up of the network module, read by eye. The strip is drawn STANDING, cord end up: a drawing x along the strip becomes y down from the cord end and the drawing's top edge becomes the right edge (the turn the EB0803 uses)."}
  mount: {confidence: drawing, note: "`rack-side`, on the two toolless buttons of the rear view (VERTICAL, 0U FULL; 1555.0 between them, the first 40.5 from the cord end). `ru: 40` is the 1780 it runs, 1780 / 44.45; no source sells it by rack units. The drawing's universal bracket (note 3, 'provided with the unit') and the installation guide's brackets are not drawn; that guide is titled for the EB 2.0 series and is used only for its page 2 statement that the distance between pegs depends on the model (full length 1555 mm), which this drawing's 1555.0 agrees with."}
  chassis: {confidence: drawing, note: "drawing and datasheet - 1780.0 long, 56.0 wide and 75.0 deep (data sheet 'Chassis Dimensions (L x W x D) 1780.0 x 56.0 x 75.0 mm', 'Depth At Circuit Breaker 75 mm'; the drawing's front, side and bottom views give the same). The body is drawn dark: the drawing's identification table lists 'BLACK' as the default chassis colour, so #202020 is a stand-in, no photograph of a unit is held."}
  colour: {confidence: estimated, note: "ESTIMATED - the drawing names the banks B1 and B4 WHITE, B2 and B5 LIGHT GRAY, B3 and B6 DARK GRAY and gives no colour values; no photograph or render of a unit is held. The bank plates are drawn #e8e8e8, #b7b9ba and #4a4d51, the body #202020 (BLACK, the default of the identification table), the outlet mouldings the body's colour."}
  front: {confidence: drawing, note: "drawing - the front view, mm from the cord end and from the left as the strip stands: the cord gland and a ground screw with its earth symbol at the cord end; the six breaker plates B1 to B3 in a row, then 12 columns of outlets (three groups J1 to J3 of four), the network module, B4 to B6, then nine columns (three groups J4 to J6 of three). Each column is an upper well (C13/C15) and a lower well (C13/C15/C19), both 34.4 along the strip."}
  outlets: {confidence: drawing, note: "drawing and datasheet - OUTLET QTY & TYPE '(21)C13/C15,(21)C13/C15/C19'; data sheet 'Outlet Configuration 21(C13/C15),21(4-in-1 Combo)'. 21 wells of each kind, enlogic/combo-outlet-c13-c15@1 (10 A) and enlogic/combo-outlet-c13-c15-c19@1 (16 A). Every outlet is switchable ('Remote Outlet Switching Yes') and runs `through` its bank's breaker, the wiring sheet's B1 to B6 over J1 to J6. THE UNIT PRINTS NO OUTLET NUMBER in any held view, so the outlets keep their placement ids, counted from the cord end, upper well first."}
  input: {confidence: datasheet, note: "datasheet and drawing - 'Input Plug Type 460P9 (IP44)', 'Acceptable Input Voltage 208VAC, 3-phase', 'Input Current (Phase) 60 A (48 A derated)', 'Max Input Power 17.3 kVA', cord 'Input Cord Length 1.8m (5.91')' (the drawing's default, other lengths optional), the drawing 'THREE-PHASE,DELTA'. The unit has a fixed cord and no inlet."}
  breakers: {confidence: datasheet, note: "datasheet and drawing - '(6)2-pole,20A,5 kAIC' and '20 AMP, DOUBLE-POLE ELECTRO MECHANICAL SWITCH / BREAKER (6) PLACES'; each plate prints its bank and its lines (B1 L1-L2, B2 L2-L3, B3 L3-L1, then the same for B4 to B6). THE OUTLETS RUN `through` THEIR BANK'S BREAKER by the wiring sheet (sheet 3) printing B1 to B6 over J1 to J6."}
  module: {confidence: drawing, note: "drawing - sheet 1 draws the network module as a 147 mm block between banks three and four; sheet 2's raster close-up (about 25 mm by 76 mm of paper, undimensioned) shows, top to bottom: the large LED display with its coloured border, an oLED screen with three buttons, a USB-C port and a Reset pinhole, two RJ45 Ethernet ports side by side (labelled 10/100/1000 and 10/100) and two sensor ports labelled Sensor 1 and Sensor 2. THE MODULE'S PARTS ARE PLACED IN THE CLOSE-UP'S PROPORTIONS scaled into the front view's 147 mm, to about 3 mm, and are estimates."}
  rear: {confidence: drawing, note: "drawing - the rear view: two toolless buttons, O18.4, 1555.0 apart, the first 40.5 from the cord end, on the width's centre line."}
  sides: {confidence: drawing, note: "drawing - the side and bottom views are outlines with dimensions (the side view's '(4) PL 48.0' and '2X 24.0' mark positions the sheet does not draw), so the ends and sides are drawn empty (gaps: ends)."}
  dcim: {confidence: datasheet, note: "the input is one power port from the cord part and each outlet a power outlet it feeds: `iec-60320-c13` for the C13/C15 wells and `iec-60320-c19` for the C13/C15/C19 wells, a reading (the maker's combination wells take more than one cord end). Each outlet runs `through` its bank's breaker. No feed_leg is written: a delta input has no neutral."}
  lifecycle: {confidence: datasheet, note: "only the held documents were read: none announces an end of life, and the data sheet is copyright 2023. No web search was made."}
