model: EN2333
description: 'Enlogic EN2 PDU, 0U: a 1750 mm dark strip, 52 mm wide and 75 mm deep at the breakers. It hangs on two toolless
  buttons beside a rack. It hands a single-phase 208 V feed on to 36 switched outlets. They are 30 IEC C13 and 6 IEC C19,
  in two colour-coded banks of three groups. The feed is a fixed 3 m cord with a NEMA L6-30P plug, 30 A derated to 24 A,
  5.0 kVA. Each bank sits behind its own 20 A double-pole breaker. A hot-swap network management module between the banks
  carries a display, two Ethernet ports, USB-C and two sensor ports. Input metered, outlet switched.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S VECTOR DRAWING. Enlogic drawing TA-EN2333A rev E1, 2020.05.20
      (one A3 sheet) and the EN2333 data sheet. The front view''s paths were read in points at 2.7598 mm per pt. That is
      the scale of the printed 1750.0 overall. The end lines are 634.11 pt apart, at 158.97 and 793.08. The printed 52.0
      width reads 18.85 pt over the outer lines, 52.0 mm, so the scale checks. The strip is drawn lying with the cord end
      left. The library draws it standing, cord end up. A drawing x along the strip becomes y down from the cord end, and
      the drawing''s top edge becomes the right edge. Every count below was made twice, once from clusters of touching paths
      and once from 500 to 1600 dpi renders of the same view.'}
  recount: {confidence: drawing, note: 'Recounted twice. The six groups, the 36 outlets (30 C13, 6 C19), the two plates
      and the six seams agree with the order''s counts. One figure differs. In each group outlets 3 and 5 are turned 180
      degrees and outlets 2, 4 and 6 are not. The order''s note read 3 to 6 as turned. The drawing also prints a numeral,
      a round mark and two short windows at every outlet, which the order''s inventory did not list.'}
  mount: {confidence: drawing, note: '`rack-side`, on the two toolless buttons of the rear view (VERTICAL, 0U FULL; 1555.0
      between them, the first 40.5 from the cord end). `ru: 39` is the 1750 it runs, 1750 / 44.45. No source sells it by
      rack units. The drawing''s TOOLESS MOUNTING BUTTON LOCATIONS note counts twelve places. The top and bottom views draw
      the other ones as rings on the sides, and those are drawn.'}
  chassis: {confidence: drawing, note: 'drawing and datasheet - the data sheet gives ''Chassis Dimensions (L x W x D) 1750.0
      x 52.0 x 53.0 mm''. It also gives ''Depth At Circuit Breaker 75 mm''. The drawing''s top and bottom views show a block
      at the cord end, 74.5 deep, and the strip 52.5 deep. Its right view prints 52.0 and 75.0. The chassis depth is the
      75, the maximum. The side and end faces draw the block and the strip as outlines. The body colour is #202020, read
      off the data sheet''s face render, which is a vendor render and not a photograph of a unit.'}
  colour: {confidence: photo-measured, note: 'the data sheet''s face render (9862 by 329 px) reads plate B1 and its three
      outlet panels #646867, the drawing''s LIGHT GRAY. It reads plate B2 and its three panels #77a6ee, BLUE, and the body
      #202020. Each sample is the median of nine pixels, all within 12 of it. No photograph of a unit is held, so the colours
      are the render''s. The two windows beside each outlet are drawn a shade darker than their panel, an estimate.'}
  front: {confidence: drawing, note: 'drawing - the front view, mm from the cord end and from the left edge as the strip
      stands. First come the cord gland, a ground screw with its earth symbol, and plates B1 and B2 side by side. Then come
      a cross seam with one screw and three outlet groups under B1 [LIGHT GRAY]. The network module follows, then three
      groups under B2 [BLUE]. A group is a C19 and a C13 beside it, then a staggered block of four C13, in two panels with
      a seam between them. The groups start 293.34, 367.66 and 441.98 pt, then 574.32, 648.64 and 722.96 pt, a pitch of
      74.32 pt, 205.1 mm.'}
  outlets: {confidence: datasheet, note: 'datasheet and drawing - ''Outlet Configuration 30(C13),6(C19)''; the drawing''s
      receptacle block gives IEC 60320/C13 (10A, 250V) and IEC 60320/C19 (16A, 250V). std/c13-outlet@1 and std/c19-outlet@1.
      The drawing''s C19 ring is 35.8 by 27.8 and its C13 ring 30.9 by 22.8, within 1 mm of the parts. Every outlet is switchable
      (''Remote Outlet Switching Yes''). The unit prints the numbers 1 to 36, which name the outlets as printed. The C19
      is turned 90 degrees, its earth slot toward the drawing''s top edge. Each group turns outlets 3 and 5 by 180 degrees,
      so their chamfered end faces the far end.'}
  lamps: {confidence: estimated, note: 'drawing and render - the drawing prints one small ring, 0.94 pt (2.6 mm), beside
      each of the 36 outlets. The data sheet''s render shows a green lit lamp in its place. Each is placed as a lamp with
      the states `on` and `off`, drawn off. The lit colour #83ff73 is the median of the render''s lamp pixels (four of nine
      within 12). No held document says what the lamp shows, so no meaning is claimed.'}
  input: {confidence: datasheet, note: 'datasheet and drawing - ''Input Plug Type NEMA L6-30P'', ''Acceptable Input Voltage
      208VAC, 1-phase''. The data sheet also gives ''Input Current (Phase) 30A (24A DERATED)'', ''Max Input Power 5.0 kVA'',
      ''Input Cord Length 3m (9.84'')''. The drawing prints ''INPUT VOLTAGE: 200-240VAC'' and the plug ''NEMA L6-30P, 2P
      3W''. The unit has a fixed cord and no inlet.'}
  breakers: {confidence: datasheet, note: 'datasheet and drawing - ''(2)2-pole,20A,5 kAIC'' and ''20 AMP, DOUBLE-POLE ELECTRO
      MECHANICAL SWITCH / BREAKER (2) PLACES''. Each plate prints its bank and L1-L2. The outlets run `through` the breaker
      of the colour span they stand in. That is B1 for the three groups under B1 and B2 for the three under B2.'}
  module: {confidence: estimated, note: 'drawing - the front view draws the network module as a 150.7 mm block between the
      banks. It shows a large display window, three round dots, a small window and a dot. It also shows a small dark tab,
      two stacked connector cutouts with two smaller ones beside them, and a dark end tab. No close-up of this module is
      held. The data sheet names the module the Advanced Network Management Module, Advantage Series, the one of the EN2951.
      The parts are read as that module''s layout: display, oLED screen with three buttons, reset, USB-C, two RJ45 and two
      sensor ports. Their positions come from a 1200 dpi render of the view and are ESTIMATES to about 1 mm.'}
  plates: {confidence: drawing, note: 'drawing - plates B1 and B2 are 23.20 pt along by 16.31 pt across by their straight
      edge, 64.0 by 45.0 mm. By their outline they are 25.38 pt along, 70.0 mm. They are a different module from the EN2951''s,
      so the part is enlogic/en2333-breaker-20a-2p@1, drawn to the outline. The plate pitch is 25.74 pt, 71.0 mm.'}
  rear: {confidence: drawing, note: 'drawing - the rear view: two toolless buttons, O18.4, 1555.0 apart, the first 40.5
      from the cord end, on the width''s centre line.'}
  sides: {confidence: drawing, note: 'drawing - the top view gives the right face. It has 31 round heads: 27 screw heads
      6.6 to 6.9 across and 4 rings 12.1 across at the dimensioned button places. The bottom view gives the left face, 32
      of them. Positions are mm along from the cord end and from the front. The block at the cord end is 74.5 deep and the
      strip 52.5, the module standing 9.7 proud of the strip. These are drawn as step voids. The right view looks at the far
      end. It prints one round head 6.6 across on the width''s centre line, 6.0 from the rear edge. It is drawn on the bottom
      face, with the rear edge as its top. The view also prints a flat tab, which the `cord-end-tab` gap names.'}
  dcim: {confidence: datasheet, note: 'the input is one NEMA L6-30P power port from the cord part and each outlet a power
      outlet it feeds: `iec-60320-c13` for the C13 and `iec-60320-c19` for the C19. Each outlet runs `through` its bank''s
      breaker. No feed_leg is written: a single-phase 208 V feed has no neutral.'}
  lifecycle: {confidence: datasheet, note: 'only the held documents were read: none announces an end of life. No web search
      was made.'}
