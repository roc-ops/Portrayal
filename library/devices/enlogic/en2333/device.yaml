gaps:
- what: weight
  scope: [front, rear, left, right]
  reason: vendor-silent
  note: 'no held document states a weight: the drawing''s title block says N/A and the data sheet has no field.'
  wanted: a weight from the maker.
- what: colour
  scope: [front, rear, left, right]
  reason: needs-photo
  note: the only colour source is the data sheet's face render. No photograph of a unit, and no view of the back, the sides
    or the ends in colour, is held.
  wanted: photographs of a unit, front, back, sides and ends.
- what: depth
  scope: [left, right, top, bottom]
  reason: sources-disagree
  note: the data sheet gives 53 mm for the chassis and 75 mm at the breaker. The drawing's right view prints 52.0 and 75.0
    and its bottom view 53.0. The chassis depth is 75 and the strip is drawn 52.5 deep.
  wanted: the maker's word on which figure is the chassis depth.
- what: input-voltage
  scope: [front]
  reason: sources-disagree
  note: 'the data sheet gives ''Acceptable Input Voltage 208VAC, 1-phase'', the drawing ''INPUT VOLTAGE: 200-240VAC''. 208
    is written as the nominal and both are recorded.'
  wanted: the maker's word on the input voltage range.
- what: module-ports
  scope: [front]
  reason: needs-photo
  note: no close-up of this module is held. The data sheet lists two Ethernet ports and sensor support but no USB or reset.
    The ports are drawn in the layout of the EN2951's module. Which way each jack faces is not stated. The sensor ports
    are dark openings.
  wanted: a photograph of the module's face and the manual's port table.
- what: sensor-count
  scope: [front]
  reason: sources-disagree
  note: the data sheet says the module 'supports up to 10 digital sensor'. The EN2951 drawing's close-up says up to 8 physical
    sensors. Two sensor ports are drawn.
  wanted: the maker's word on the sensor capacity.
- what: lamp-meaning
  scope: [front]
  reason: vendor-silent
  note: the small ring at each outlet is a lamp in the data sheet's render, drawn green and lit there. No held document
    says what it shows.
  wanted: the manual's lamp table.
- what: windows
  scope: [front]
  reason: vendor-silent
  note: the drawing draws two short rounded windows beside each outlet, 36 pairs, and the render paints them in a shade
    of the panel. No held document names them, so they are drawn as decor.
  wanted: the maker's word on what they are.
- what: module-display
  scope: [front]
  reason: needs-photo
  note: the render shows the display lit with metering digits inside a blue border. The data sheet says the colour border
    is user programmable. The display is drawn dark.
  wanted: none.
- what: cord-end-tab
  scope: [left, right, bottom]
  reason: needs-drawing
  note: 'the drawing prints two small flat tabs, 18.4 mm wide and 4.0 mm proud of the rear edge, one near each end: 31 to
    50 mm and 1587 to 1606 mm from the cord end. The top and bottom views draw both, and the right view draws one end-on.
    The front view draws none. They stand outside every face''s rectangle, and the schema says ''L150 refuses a part outside
    its view that the side''s figure does not cover''. So they are not placed.'
  wanted: the maker's word on what they are.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: the drawing's views are outlines with round heads. The left face is read from the bottom view. No photograph looks
    at an end or a side.
  wanted: straight-on photographs of an end and a side.
