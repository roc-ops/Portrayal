name: en6324
version: 0.1.0
maturity: modelled
manufacturer: Enlogic
model: EN6324
description: 'Enlogic EN6 PDU, 0U: a 1750 mm dark strip, 52 mm wide and 53 mm deep. It hangs on two toolless buttons beside
  a rack. It hands a single-phase 208 V feed on to 24 switched outlets, 20 IEC C13 and 4 IEC C19, in six blocks of four.
  The feed is a fixed 3 m cord with a NEMA L6-30P plug, 30 A derated to 24 A, 5.0 kVA. Two 20 A double-pole breakers, one
  at the cord end and one after the module, protect the outlets. A hot-swap network management module carries a display,
  two Ethernet ports, USB-C and two sensor ports. Outlet metered, outlet switched.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S VECTOR DRAWING. Enlogic drawing TA-EN6324A rev E1, 2020.05.20
      (one A3 sheet) and the EN6324 data sheet. The front view''s paths were read in points at 2.7598 mm per pt. That is
      the scale of the printed 1750.0 overall. The end lines are 634.10 pt apart, at 186.51 and 820.61. The printed 52.0
      width reads 18.67 pt over the inner lines and 18.85 pt over the outer ones. The strip is drawn lying with the cord
      end left. The library draws it standing, cord end up. A drawing x along the strip becomes y down from the cord end,
      and the drawing''s top edge becomes the right edge. Every count below was made twice, once from clusters of touching
      paths and once from 500 to 1200 dpi renders of the same view.'}
  recount: {confidence: drawing, note: 'Recounted twice. The six blocks of four, the 24 outlets (20 C13, 4 C19) and the
      two plates agree with the order''s counts. Blocks 1 and 5 are a C19, a C13 and a staggered pair. Blocks 2 and 6 are
      the same turned 180 degrees. Blocks 3 and 4 are two pairs each. Moulding II holds block 3 under B1 and block 4 under
      B2. The drawing also prints a numeral, a round mark and two short windows at every outlet, which the order''s inventory
      did not list.'}
  mount: {confidence: drawing, note: '`rack-side`, on the two toolless buttons of the rear view (VERTICAL, 0U FULL; 1555.0
      between them, the first 40.5 from the cord end). `ru: 39` is the 1750 it runs, 1750 / 44.45. No source sells it by
      rack units. The top and bottom views draw the other button places as screw heads on the sides. The drawing''s note
      counts twelve places.'}
  chassis: {confidence: drawing, note: 'drawing and datasheet - 1750.0 long, 52.0 wide and 53.0 deep. The data sheet gives
      ''Chassis Dimensions (L x W x D) 1750.0 x 52.0 x 53.0 mm'' and ''Depth At Circuit Breaker 53 mm''. The drawing''s
      right view prints 52.0 and 53.0, so the strip is one depth with no deeper block. The top and bottom views draw the
      module 9.7 mm proud of the strip''s front, which the chassis depth does not include. The body colour is #202020, read
      off the data sheet''s face render, a vendor render and not a photograph of a unit.'}
  colour: {confidence: photo-measured, note: 'the data sheet''s face render (9800 by 357 px) reads plate B1 #646867, the
      drawing''s LIGHT GRAY. It reads plate B2 and the last two outlet blocks #77a6ee, BLUE, and the body #202020. The render
      paints block 4 light gray where the drawing''s colour span puts it under B2 [BLUE]. Block 4 is drawn blue, the drawing''s
      reading, and the disagreement is a gap. No photograph of a unit is held.'}
  front: {confidence: drawing, note: 'drawing - the front view, mm from the cord end and from the left edge as the strip
      stands. First come the cord gland, a ground screw with its earth symbol and breaker plate B1. Then come outlet blocks
      1 to 4 in two panels and the network module. Breaker plate B2 and blocks 5 and 6 in one panel close the strip. A panel
      holds two blocks with a seam between them. Block 1 starts at 284.46 pt and block 2 at 328.18. The pairs of blocks
      3 and 4 start at 397.64, 415.04, 435.02 and 452.42. Blocks 5 and 6 start at 665.14 and 708.86.'}
  outlets: {confidence: datasheet, note: 'datasheet and drawing - ''Outlet Configuration 20(C13),4(C19)''; the drawing''s
      receptacle block gives IEC 60320/C13 (10A, 250V) and IEC 60320/C19 (16A, 250V). std/c13-outlet@1 and std/c19-outlet@1.
      The drawing''s C19 ring is 35.8 by 27.8 and its C13 ring 30.9 by 22.8, within 1 mm of the parts. Every outlet is switchable
      (''Remote Outlet Switching Yes'') and metered (''individual outlet level measurements''). The unit prints the numbers
      1 to 24. The C19 of a block A is turned 90 degrees and that of a block B 270 degrees. In a pair the lower outlet is
      turned 180 degrees and the upper one is not.'}
  lamps: {confidence: estimated, note: 'drawing and render - the drawing prints one small ring, 0.94 pt (2.6 mm), beside
      each of the 24 outlets. The data sheet''s render shows a green lit lamp in its place. Each is placed as a lamp with
      the states `green` and `off`, drawn off. The lit colour #83ff73 is the median of the EN2333 render''s lamp pixels,
      the same artwork. No held document says what the lamp shows, so no meaning is claimed.'}
  input: {confidence: datasheet, note: 'datasheet and drawing - ''Input Plug Type NEMA L6-30P'', ''Acceptable Input Voltage
      208VAC, 1-phase''. The data sheet also gives ''Input Current (Phase) 30A (24A DERATED)'', ''Max Input Power 5.0 kVA'',
      ''Input Cord Length 3m (9.84'')''. The drawing prints ''INPUT VOLTAGE: 200-240VAC'' and the plug ''NEMA L6-30P, 2P
      3W''. The unit has a fixed cord and no inlet.'}
  breakers: {confidence: drawing, note: 'datasheet and drawing - ''(2)2-pole,20A,5 kAIC'' and ''20 AMP, DOUBLE - POLE ELECTRO
      MECHANICAL SWITCH / BREAKER (2) PLACES''. Each plate prints its bank and L1-L2. The drawing''s colour spans put B1
      [LIGHT GRAY] over plate B1 and blocks 1 to 3. They put B2 [BLUE] over blocks 4 to 6 and plate B2. The outlets run
      `through` the breaker of their span, B1 for outlets 1 to 12 and B2 for 13 to 24. This is a reading, since no wiring
      sheet is held.'}
  module: {confidence: estimated, note: 'drawing - the front view draws the network module as a 155 mm block between blocks
      4 and 5. It shows an empty window, three round dots, a small window and a dot. It also shows a small dark tab, two
      stacked connector cutouts with two smaller ones beside them, and a dark end tab. No close-up of this module is held.
      The data sheet names the module the Advanced Network Management Module, Advantage Series, the one of the EN2951. The
      parts are read as that module''s layout. Their positions come from the drawing''s vector boxes and a 1200 dpi render,
      and are ESTIMATES to about 1 mm.'}
  plates: {confidence: drawing, note: 'drawing - plates B1 and B2 are 23.20 pt along by 16.31 pt across by their straight
      edge. By their outline they are 25.38 pt along, 70.0 mm. They are the plate of the EN2333. Both use enlogic/en2333-breaker-20a-2p@1.
      Each plate prints its label above its rocker window, so the base configuration selects the `label-first` skin.'}
  rear: {confidence: drawing, note: 'drawing - the rear view: two toolless buttons, O18.4, 1555.0 apart, the first 40.5
      from the cord end, on the width''s centre line.'}
  sides: {confidence: drawing, note: 'drawing - the top view gives the right face, 18 round screw heads 6.6 to 6.9 across.
      The bottom view gives the left face, 18 of them. Positions are mm along from the cord end and from the front. The
      right view prints no head.'}
  dcim: {confidence: datasheet, note: 'the input is one NEMA L6-30P power port from the cord part and each outlet a power
      outlet it feeds: `iec-60320-c13` for the C13 and `iec-60320-c19` for the C19. Each outlet runs `through` its breaker.
      No feed_leg is written: a single-phase 208 V feed has no neutral.'}
  lifecycle: {confidence: datasheet, note: 'only the held documents were read: none announces an end of life. No web search
      was made.'}
