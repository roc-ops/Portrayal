gaps:
- what: weight
  scope: [front, rear, left, right]
  reason: vendor-silent
  note: 'no held document states a weight: the drawing''s title block has no field and the data sheet has none.'
  wanted: a weight from the maker.
- what: colour
  scope: [front, rear, left, right]
  reason: needs-photo
  note: the only colour source is the data sheet's small face render. No photograph of a unit, and no view of the back,
    the sides or the ends in colour, is held.
  wanted: photographs of a unit, front, back, sides and ends.
- what: metering-list
  scope: [front]
  reason: sources-disagree
  note: the data sheet says 'Metering Attributes N/A' and 'Metering Accuracy N/A'. The drawing's table lists 'METERING ACCURACY
    +-1% TO ISO/ IEC 62052-21' and attributes, but also 'METERED COMPONENTS N/A'. No metering is stated.
  wanted: the maker's word on whether the unit meters.
- what: outlet-banks
  scope: [front]
  reason: sources-disagree
  note: the front view's colour labels give B4 to B6 four places each. The wiring sheet draws seven three-column blocks
    J1 to J7 from six breakers. The colour reading is used for `through`.
  wanted: the maker's wiring diagram.
- what: ip67-option
  scope: [top]
  reason: vendor-silent
  note: the drawing's sheet 2 offers an IP67 (watertight) 60 A plug as an option, with the IP44 plug as the default. Only
    the default is drawn.
  wanted: none.
- what: bracket
  scope: [rear]
  reason: needs-drawing
  note: note 3 of the drawing names a universal mounting bracket, 'provided with the unit'. No held view draws it.
  wanted: a drawing of the bracket.
- what: button-locations
  scope: [rear, right]
  reason: needs-drawing
  note: the side view's '2X 24.0' pairs and '(4) PL 48.0' mark places the vector draws as four rings 5.4 across, 52.1 from
    the front. Only the two rear circles are buttons. The 48.0 is not matched to a drawn feature.
  wanted: a drawing that dimensions the other button places.
- what: outlet-turn
  scope: [front]
  reason: needs-drawing
  note: the close-ups of the outlet wells on sheet 2 are undimensioned. No turn is claimed for any outlet, and the wells
    are drawn to the combination parts' shapes.
  wanted: a dimensioned drawing of each well.
- what: warning-triangles
  scope: [front]
  reason: needs-drawing
  note: each printed rating label carries a small warning triangle, about 1.0 pt (2.4 mm) wide, which the label text is
    drawn without.
  wanted: a close-up of the label.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: the drawing's side view and end view are outlines with round heads. The left face is built as the documented side.
    No photograph looks at an end or a side.
  wanted: straight-on photographs of an end and a side.
