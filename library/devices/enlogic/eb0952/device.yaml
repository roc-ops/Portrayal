name: eb0952
version: 0.1.0
maturity: modelled
manufacturer: Enlogic
model: EB0952
description: 'Enlogic EB basic PDU, 0U: a 1780 mm dark strip, 56 mm wide and 75 mm deep. It hangs on two toolless buttons
  beside a rack. It hands a three-phase 208 V delta feed on to 42 unswitched outlets, 21 C13/C15 and 21 C13/C15/C19 combination
  outlets in 21 columns of two. The feed is a fixed 1.8 m cord with an IEC 60309 3P+E 9h plug, 60 A derated to 48 A, 17.3
  kVA. Six 20 A double-pole breakers feed the columns. No meter, no display, no network interface.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S VECTOR DRAWING. Enlogic drawing EB0952-WXYZ_DA rev E2,
      2022/10/08 (three A3 sheets) and the EB0952 data sheet (page 1 read). Sheet 1 is vector: the front view''s paths were
      read in points at 2.4232 mm per pt. That is the scale of the printed 1780.0 overall. The end lines are 734.58 pt apart,
      at 191.48 and 926.06. The printed 56.0 width reads 23.04 pt over the outer lines, 55.8 mm, so the scale checks. The
      strip is drawn lying with the cord end left. The library draws it standing, cord end up. A drawing x along the strip
      becomes y down from the cord end, and the drawing''s top edge becomes the right edge. Every count below was made twice,
      once from clusters of touching paths and once from 400 to 1000 dpi renders of the same view.'}
  recount: {confidence: drawing, note: 'Recounted twice. The 21 columns, the 42 wells, the six plates with four screws each
      and the two buttons agree with the order''s counts. Two figures differ. The plate outline reads 23.10 pt, 56.0 mm,
      where the order''s first draft had 56.4 from a crop that included an arrow. The order counted two marks beside each
      well, and the vector gives two tabs and two numerals per column, so 42 tabs and 42 numerals. The round mark on the
      centre line before B1 is one ring 6.5 mm across, below the line.'}
  mount: {confidence: drawing, note: '`rack-side`, on the two toolless buttons of the rear view (VERTICAL, 0U FULL; 1555.0
      between them, the first 40.5 from the cord end). `ru: 40` is the 1780 it runs, 1780 / 44.45. No source sells it by
      rack units. Note 3 of the drawing names a universal mounting bracket provided with the unit. No held view draws it.'}
  chassis: {confidence: drawing, note: 'drawing and datasheet - 1780.0 long, 56.0 wide and 75.0 deep. The data sheet gives
      ''Chassis Dimensions (L x W x D) 1780.0 x 56.0 x 75.0 mm'' and ''Depth At Circuit Breaker 75 mm''. The drawing''s
      side view shows the outlet columns standing 5.4 mm proud of the body. The body is drawn dark: the drawing''s identification
      table lists ''BLACK'' as the default chassis colour, so #202020 is a stand-in.'}
  colour: {confidence: photo-measured, note: 'the data sheet''s page-1 thumbnail (937 by 469 px, a vendor render) reads
      plate B1 #e3e3e3, plate B2 #686a69 and plate B3 #2c2c2f. Each is the median of nine pixels. The drawing names B1 and
      B4 WHITE, B2 and B5 LIGHT GRAY, B3 and B6 DARK GRAY. The outlet columns follow their plate''s colour. No photograph
      of a unit is held, so these are the render''s colours.'}
  front: {confidence: drawing, note: 'drawing - the front view, mm from the cord end and from the left edge as the strip
      stands. First come a ground screw with its earth symbol, the enLOGIC label, a round mark and plates B1 to B3. Then
      come nine columns of outlets in three groups of three and a long gap. Plates B4 to B6 and twelve columns in four groups
      of three close the strip. A column is an upper well (C13/C15) over a lower well (C13/C15/C19), 34.4 along the strip,
      and a pitch of 15.45 pt, 37.4 mm. Each column carries two numerals, two tabs and two small labels printed 10A 250V~
      and 16A 250V~.'}
  outlets: {confidence: datasheet, note: 'datasheet and drawing - ''OUTLET QTY & TYPE (21)C13/C15, (21)C13/C15/C19''; data
      sheet ''Outlet Configuration 21(C13/C15),21(4-in-1 Combo)''. 21 wells of each kind, enlogic/combo-outlet-c13-c15@1
      (10 A) and enlogic/combo-outlet-c13-c15-c19@1 (16 A). No outlet is switched (''Remote Outlet Switching No''). The
      unit prints the numbers 1 to 42, one pair per column, the upper well first. The outlets run `through` the breaker
      of their column''s colour, a reading of the front view and the wiring sheet.'}
  input: {confidence: datasheet, note: 'datasheet and drawing - ''Input Plug Type 460P9 (IP44)'', ''Acceptable Input Voltage
      208VAC, 3-phase''. The data sheet also gives ''Input Current (Phase) 60A (48A DERATED)'', ''Max Input Power 17.3 kVA''
      and ''Input Cord Length 1.8m (5.91'')''. The drawing prints ''IEC 60309, 3P 4W, 9H'' with an optional IP67 plug and
      ''THREE-PHASE,DELTA''. The unit has a fixed cord and no inlet. It is the cord part of the EN6952.'}
  breakers: {confidence: datasheet, note: 'datasheet and drawing - ''(6)2-pole,20A,5 kAIC'' and ''20 AMP, DOUBLE-POLE ELECTRO
      MECHANICAL SWITCH / BREAKER (6) PLACES''. Each plate prints its bank and its lines (B1 L1-L2, B2 L2-L3, B3 L3-L1,
      then the same for B4 to B6). The drawing''s colour labels say B1 [WHITE] 3 PLACES and B4 [WHITE] 4 PLACES, so a colour
      marks every third column. The wiring sheet feeds three-column blocks J1 to J7 from the six breakers. B1 is read as
      feeding columns 1, 4 and 7 and B4 columns 10, 13, 16 and 19.'}
  plates: {confidence: drawing, note: 'drawing - the six plates are 20.64 pt along by 18.54 pt across by their straight
      edge, 50.0 by 44.9 mm. By their outline they are 23.10 pt along, 56.0 mm. The EN2951''s plate is 20.64 pt by 18.48
      at 2.4306 mm per pt, 50.2 by 44.9 mm. By its outline it is 56.3 mm along. The two are the same module, so the part
      is enlogic/en-breaker-20a-2p@1.'}
  rear: {confidence: drawing, note: 'drawing - the rear view: two toolless buttons, O18.4, 1555.0 apart, the first 40.5
      from the cord end, on the width''s centre line.'}
  sides: {confidence: drawing, note: 'drawing - the side view gives the right face. It has seven screw heads 6.8 across
      and four rings 5.4 across at the dimensioned button places. The 21 outlet columns stand 5.4 proud. Positions are mm
      along from the cord end and from the front. No held view shows the left face, which is built as the documented side,
      as no document shows this one.'}
  dcim: {confidence: datasheet, note: 'the input is one power port from the cord part and each outlet a power outlet it
      feeds: `iec-60320-c13` for the C13/C15 wells and `iec-60320-c19` for the C13/C15/C19 wells, a reading. Each outlet
      runs `through` its breaker. No feed_leg is written: a delta input has no neutral.'}
  lifecycle: {confidence: datasheet, note: 'only the held documents were read: none announces an end of life. No web search
      was made.'}
