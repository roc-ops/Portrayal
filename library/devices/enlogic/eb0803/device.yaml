gaps:
- what: input-voltage
  scope: [front]
  reason: sources-disagree
  note: the data sheet gives "208VAC, 3phase" for input and output, the drawing "100-120/200-240VAC" for input with
    a 5-20R rated 125 V. 208 is written (the plug's 120/208 V agrees); both are recorded.
  wanted: the maker's word on the input and output voltage of this SKU.
- what: weight
  scope: [front, rear, left, right]
  reason: vendor-silent
  note: 'no held document states a weight: the drawing''s title block says N/A and the data sheet has no field.'
  wanted: a weight from the maker.
- what: colour
  scope: [front, rear, left, right]
  reason: needs-photo
  note: the only colour source is the data sheet's face render. No photograph of a unit, and no view of the back,
    the sides or the ends in colour, is held. The standard 5-20R part draws a dark face; the render paints it in
    the bank's colour.
  wanted: photographs of a unit, front, back, sides and ends.
- what: button-locations
  scope: [rear]
  reason: needs-drawing
  note: the drawing's note counts twelve toolless button locations and marks plus signs for them along the back;
    only two circles are drawn as buttons, so only two are placed.
  wanted: a drawing that dimensions the other ten locations.
- what: breaker-plate-length
  scope: [front]
  reason: sources-disagree
  note: the drawing's breaker plate is 75.2 along the strip, the data sheet's face render's 80.0 (it also prints
    the plate's lines and receptacle legends across the strip where the drawing prints them small and horizontal).
    The render is used, as the newer artwork; the plate and its legends are drawn as it shows them.
  wanted: the maker's word on which artwork is current.
- what: windows
  scope: [front]
  reason: vendor-silent
  note: each pack of C13 carries four pairs of small rounded windows beside its outlets, drawn and rendered in a
    shade of the bank's colour; no held document names them, so they are drawn as decor.
  wanted: the maker's word on what they are.
- what: outlet-locks
  scope: [front]
  reason: needs-drawing
  note: the data sheet's introduction says "color-coded locking IEC outlets" and the drawing shows a small tab on
    some wells; no held view dimensions it, so it is not drawn.
  wanted: a close-up of a well.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: the cord end and the far end are drawn only as the right view's plain square, and the sides as screw heads
    in a depth profile; no photograph looks at an end or a side.
  wanted: straight-on photographs of an end and a side.
- what: outlet-numbers
  scope: [front]
  reason: vendor-silent
  note: the unit prints no outlet number in the drawing or the render, so no outlet name is taken.
  wanted: none.
