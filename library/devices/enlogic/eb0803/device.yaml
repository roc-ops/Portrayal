format: 1
kind: device
name: eb0803
version: 0.1.0
maturity: modelled
manufacturer: Enlogic
model: EB0803
description: 'Enlogic EB basic PDU, 0U: a 1490 mm dark strip, 52 mm wide and 53 mm deep, that hangs on two toolless
  buttons beside a rack and hands a three-phase 208 V wye feed (a fixed 3 m cord with a NEMA L21-30P plug, 30 A
  derated to 24 A, 8.6 kVA) on to 30 unswitched outlets in three colour-coded banks of ten - 24 IEC C13, 3 IEC C19
  and 3 NEMA 5-20R - each bank behind its own 20 A double-pole breaker. No meter, no display, no network interface.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S VECTOR DRAWING AND ITS FACE RENDER. Enlogic EB0803
      dimensioned drawing TA-EB0803A, rev E1, 2020.05.20 (one A2 sheet) draws a top, a rear, a bottom, a front and
      a right view of the strip lying down, cord end at the left. Its views are paths: positions were read off the
      page''s geometry and off 400 and 1000 dpi renders, at the drawing''s own scale, 1.9524 mm per pt, which the
      1490.0 overall (763.19 pt between the end lines) and the 52.0 width both check. The data sheet''s page 1 carries
      one face-on render of the whole strip (9854 by 333 px, 6.385 px per mm over the 1490); the outlet wells, the
      bank colours and the printing were read off it, and it is the colour reference. The library draws the PDU
      STANDING, cord end up (the data sheet''s thumbnail stands it so, and the drawing''s TOP FEED says the cord
      is at the top), so a drawing x along the length becomes y down from the cord end and a drawing y across becomes
      x from the left.'}
  mount: {confidence: drawing, note: '`rack-side`, the library''s way to say a part stands vertically beside an
      upright, on the toolless buttons of the rear view (VERTICAL,MID; 1244.0 between the two drawn buttons, the
      first 65.5 from the cord end). `ru: 34` is the 1490 it runs, 1490 / 44.45 = 33.5; no source sells it by rack
      units. The installation guide''s mounting brackets (full length 1555, mid length 1244) are accessories and
      are not drawn.'}
  chassis: {confidence: drawing, note: 'drawing and datasheet - 1490.0 long, 52.0 wide and 53.0 deep (data sheet
      "Chassis Dimensions (L x W x D) 1490.0 x 52.0 x 53.0 mm", "Depth At Circuit Breaker 53 mm"; the drawing''s
      front, bottom and right views give the same). The body colour is #202020, read off the face render (a vendor
      rendering, not a photograph of a unit; the data sheet states no chassis colour for this model).'}
  colour: {confidence: photo-measured, note: 'the face render reads B1 plate and mouldings #646867 (the drawing''s
      "LIGHT GRAY"), B2 #77a6ee ("BLUE") and B3 #32353a ("DARK GRAY"), the body #202020 and the ground screw''s
      cap green (#4baf65). The strip is drawn in those colours. No photograph of a unit is held, so the colours
      are the render''s and are unchecked against a real strip.'}
  front: {confidence: drawing, note: 'drawing - the front view, mm from the cord end and from the left edge as the
      strip stands: three banks B1, B2 and B3, each 461.18 after the last, each from the cord end a breaker plate,
      one NEMA 5-20R receptacle, two packs of four IEC C13 (106.64 apart) and one IEC C19 plate. The four C13 of
      a pack stagger: two wells low on the page and two high, so the strip''s outlets alternate across its width;
      the render''s wells give each centre (the drawing''s pack outlines agree within 1.4 mm). The C13 wells with
      their earth slot toward the far end are turned 180, the others are not; the C19''s single slot is toward the
      cord end (no turn); the 5-20R is turned 180 (the drawing draws its earth hole toward the far end). A ground
      screw and its earth symbol stand at the cord end.'}
  outlets: {confidence: datasheet, note: 'datasheet and drawing - "Outlet Configuration 24(C13),3(C19),3(5-20R)";
      the drawing''s receptacle block gives IEC 60320/C13 (10A, 250V), IEC 60320/C19 (16A, 250V) and NEMA 5-20R
      (16A, 125V) as the maximum rated outputs. std/c13-outlet@1, std/c19-outlet@1 and std/nema-5-20r@1. None is
      switched, none has a lamp. THE UNIT PRINTS NO OUTLET NUMBER (the render and the drawing show none), so the
      outlets keep their placement ids, counted from the cord end.'}
  input: {confidence: datasheet, note: 'datasheet and drawing - "Input Plug Type NEMA L21-30P", "Input Current (Phase)
      30A (24A derated)", "Max Input Power 8.6 kVA", cord "3m (9.84'')"; the drawing: "THREE-PHASE WYE", plug "NEMA
      L21-30P, 4P 5W" and "3m[10''''],TOP FEED". The unit has a fixed cord and no inlet. THE DATA SHEET AND THE
      DRAWING DISAGREE ON THE VOLTAGE (gaps: input-voltage): "Acceptable Input Voltage 208VAC, 3phase" against "INPUT
      VOLTAGE: 100-120/200-240VAC". 208 is written because the plug''s own rating, 120/208 V, agrees with it.'}
  breakers: {confidence: datasheet, note: 'datasheet and drawing - "(3)2-pole,20A,5 kAIC" and "20 A, DOUBLE - POLE
      ELECTRO-MECHANICAL SWITCH / BREAKER (3) PLACES"; each plate prints its bank and its lines (B1 L1-L2, B2 L2-L3,
      B3 L3-L1) and "L1-N(5-20R)" and its like. THE OUTLETS RUN `through` THEIR BANK''S BREAKER, a reading: the
      printing puts the bank''s three kinds of outlet and its breaker on one colour and under one plate, and no
      wiring diagram is held. The 5-20R states its own lines (the line of the plate''s last legend and neutral);
      the C13 and C19 take the breaker''s.'}
  rear: {confidence: drawing, note: 'drawing - the rear view: two toolless buttons, O18.4, 1244.0 apart, the first
      65.5 from the cord end, on the width''s centre line. The drawing also marks "TOOLESS MOUNTING BUTTON LOCATIONS
      (12) PL" with plus marks along the back; only the two drawn circles are buttons (gaps: button-locations).'}
  sides: {confidence: drawing, note: 'drawing - the top and bottom views draw five and eleven round heads about
      6.9 across on the two sides, at the along positions and depths from the front written here (the top view puts
      five 40.1 behind the front on the standing PDU''s right side; the bottom view puts five 40.8 and six 8.6 behind
      it on the left side). The side faces'' colour and finish are not shown by any held source (gaps: ends).'}
  dcim: {confidence: datasheet, note: 'the input is one NEMA L21-30P power port from the cord part and each outlet
      a power outlet it feeds: `iec-60320-c13`, `iec-60320-c19` and `nema-5-20r`. Each outlet runs `through` its
      bank''s breaker. No feed_leg is written: a C13 or C19 is line to line and a DCIM outlet''s feed_leg names
      one leg.'}
  lifecycle: {confidence: datasheet, note: 'only the held documents were read: none announces an end of life, and
      the data sheet is copyright 2023. No web search was made.'}
