configurations:
  ac-f2b:
    kind: base
    default: true
    description: >-
      The chassis as it is specified before deciding what goes in it: two AC supplies,
      the fan tray, the management board, and BOTH TRAFFIC SLOTS BLANKED. so-ds-dcp-2-r4.3
      orders this as DCP-2-FB/HW.
      The slots carry the blind plate rather than being drawn as bare holes, which is a
      deliberate departure from the schema's "TRAFFIC SLOTS EMPTY" wording for a `base`.
      Two reasons: UM s4.1 lists the blind plate in the box, so a chassis as delivered HAS
      one, and UM s2.5 asks for it in any slot that is not carrying a unit - an empty hole
      is a configuration the vendor tells you not to run. It also reads far better.
  dc-f2b:
    kind: orderable
    description: >-
      The same chassis with both supplies ordered as DCP-2-PSU-DC-FB, -40 to -72 VDC at
      7A max. UM s2.3 is explicit that the bay geometry does not change and that "Both
      types can be used simultaneously", so a mixed AC/DC chassis is legal and this
      configuration is simply the all-DC case. Named explicitly rather than left implied
      by the base, so asking for the DC variant does not require knowing which flavour
      the base happens to carry.
    bays:
      psu-1: smartoptics/dcp-2-psu-dc@1
      psu-2: smartoptics/dcp-2-psu-dc@1
  dcp-404-x2:
    kind: example
    description: >-
      Both traffic slots carrying a DCP-404 400G muxponder - the fully populated chassis,
      8x QSFP28 client and 2x QSFP-DD line in 1RU. Illustrative: the two units are ordered
      separately from the chassis, so this is a picture rather than a SKU.
    bays:
      slot-1: smartoptics/dcp-404@1
      slot-2: smartoptics/dcp-404@1
  ila-node:
    kind: example
    description: >-
      THE ILA NODE, which is what a DCP-F-A22 is for: a 22 dB EDFA in slot 1 carrying a
      PPM-AD1-1510 in its upper bay and the dummy cover in its lower one, with the blind
      plate in slot 2. The 1510 adds and drops the supervisory channel at the amplifier
      site; the second PPM position is unused at a plain ILA, and UM s2.5 wants the empty
      one covered rather than open. Illustrative, like the other examples: the units are
      ordered separately from the chassis.
      It is also the ONLY configuration in the library that seats a relief-bearing module
      in a bay on a raised carrier, which is why it is worth having as a drawing and not
      just as a note - smartoptics/ppm-dummy@1 declares no relief, so with the bays at
      their defaults nothing exercises the depth arithmetic that puts an occupant on the
      A22's raised block.
    bays:
      slot-1: smartoptics/dcp-f-a22@2
      slot-1/ppm-1: smartoptics/ppm-ad1-1510@2
      slot-1/ppm-2: smartoptics/ppm-dummy@1
      slot-2: smartoptics/dcp-2-blank@1
  dcp-404-x1:
    kind: example
    description: >-
      One DCP-404 in slot 1 and the blind plate in slot 2 - the single-unit install
      UM s2.5 asks for, where the plate "should be mounted to the empty slot to help
      guide the airflow through the traffic unit". The DCP-404 technical description
      backs it with a high-temperature warning that tells the operator to check the
      second slot has a card or a dummy front panel.
    bays:
      slot-1: smartoptics/dcp-404@1
      slot-2: smartoptics/dcp-2-blank@1
