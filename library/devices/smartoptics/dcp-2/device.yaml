format: 1
kind: device
name: dcp-2
version: 2.0.1
maturity: modelled
manufacturer: Smartoptics
model: DCP-2
description: 1RU 19-inch chassis for the DCP transponder and muxponder family. Two
  half-width traffic slots at the front; two hot-pluggable PSUs, a four-fan tray and
  the management board at the rear.
profile: optical
provenance:
  model:
    note: >-
      the product is the DCP-2; DCP-2-FB/HW is the ORDERING CODE for its base hardware
      configuration ("Base HW, 1 RU chassis, 19in, 2-traffic slots, dual power, fan units,
      mgmt-board" in so-ds-dcp-2-r4.3). The "/HW" suffix distinguishes it from the
      DCP-2-ENL-7.x_SW embedded node licence ordered alongside, and is not part of the model name.
      Recorded because a requested-parts list names the part by its ordering code. NOTE FOR THE NEXT
      SMARTOPTICS PART: a slash in `model:` breaks the NetBox exporter, which builds a file path
      from it - DCP-M32-CSO-ZR+/HW will need the same treatment.
  method:
    note: >-
      FACT SHEET FIRST, THEN THE ARTWORK. The inventory came from DCP-Series_User_Manual_14.0_A
      and so-ds-dcp-2-r4.3 before any figure was opened (working/intake/factsheets/dcp-2.md), and
      the residual pass afterwards named everything on both faces the sheet had not predicted.
      Nine residuals were found and each is either promoted below with a source or written off in
      that sheet.
  chassis:
    confidence: datasheet
    note: >-
      datasheet and manual agree - 440mm (W) x 45mm (H) x 500mm (D), ~7kg without traffic units, 1
      RU. Note 45, not the 44.45 of a nominal 1RU; both documents say 45.
  ears:
    note: >-
      UM s3.2 - the rack brackets are a separate kit with seven part numbers and several mounting
      depths, not integral to the chassis. The front figure (fig 2-4) spans 440 with no ears
      fitted, which is what confirms the body width. Ears are therefore drawn `optional`, as on
      dcp-r-9d-cs.
  ground:
    note: >-
      UM s3.2.8 - "The front rack mount brackets include a grounding terminal ... located on the
      right-side front rack mount(s)", M5 nut, with the surface around it left unpainted. It is on
      the BRACKET, so it is drawn on the ear and disappears with it. The manual adds that the
      brackets are interchangeable left to right if the ground is wanted on the other side.
  no-front-silkscreen:
    note: >-
      the chassis front carries NO marking. "SLOT 1" and "SLOT 2" appear in UM fig 2-4 in white
      capitals across the two openings, and the first cut of this model put them on the faceplate
      as silkscreen. They are the FIGURE'S CALLOUT ANNOTATIONS, added to the photograph to explain
      s2.2's slot nomination, not paint on the metal - which is visible in the figure itself,
      where they float over the dark cavity rather than sitting on any surface. The slot numbering
      is carried by the bay ids instead.
  front-layout:
    confidence: photo-measured
    note: >-
      photo-measured - UM fig 2-4, scaled across from the 440 body. Side rails ~7 each, a centre
      assembly at ~213-226, and slot apertures of ~206.5. The assembly centres on 219.8 against a
      true centreline of 220, which is UM s2.2's "extraction mechanism is based in the center of
      the chassis". The apertures against a 205 DCP-404 leave 1.5 of clearance - the two numbers
      were measured independently and confirm each other.
  rear-layout:
    confidence: photo-measured
    note: >-
      photo-measured - UM figs 2-5 and 2-6. These are SEPARATE PHOTOGRAPHS and they agree on the
      PSU fan-sticker pitch to 0.15% (352.3 and 351.8), which is what says the x axis is
      trustworthy in both. The y axis is ~3% compressed in each (both were shot slightly from
      above), so y is scaled from the 45mm height and never from the same factor as x. Left to
      right: PSU bay, fan tray, management plate, PSU bay.
  psu-positions:
    note: >-
      the PSU sticker reads "CRPS 460W AC Gold", which names the form factor; 1U CRPS is 73.5 x
      40. The two installed bays measure 81 and 75 for what is demonstrably the same part, so the
      standard is worth more than either edge read. 73.5 at the measured 352.3 pitch puts the pair
      at 4.0 and 356.3, matching the right bay to under a millimetre.
  mgmt-ports:
    note: >-
      UM s2.6 gives the inventory - 4x RJ45 ETH1-4, 1x SFP ETH4 "shared with the electrical ETH4
      port and only one can be used at a time", 1x ETH0 local, 1x RS-232 console. That is 6 RJ45 +
      1 SFP, and the `DCP-2 Rear` stencil master reports exactly 7 connection points, which is
      what identifies that 80mm master as the management block alone rather than the 440mm face.
  mgmt-geometry:
    confidence: photo-measured
    note: >-
      photo-measured from fig 2-5, which is the sharper of the two rear plates. Jack apertures
      give a column pitch of 13.95 - the library's 13.97 RJ45 standard - and a row pitch of 15.13,
      which is the 0.6in row pitch of a standard 2xN magjack. Aperture centres: quad at x 288.26
      and 302.23, rows at y 17.39 and 32.52; the ETH0/CONSOLE pair at x 340.3, rows at y 17.96 and
      32.33; the SFP at x 321.47, y 32.52. CORROBORATED INDEPENDENTLY: scaling the `DCP-2 Rear`
      master on its own height rather than on the rack width gives a plate 77.7 wide against ~78
      measured, and its seven connection points land within 1.7mm of these centres.
  port-numbering:
    note: >-
      silkscreen, and it is not in any manual. The gang is column-major and bottom-first - ETH1
      bottom-left, ETH2 top-left, ETH3 bottom-right, ETH4 top-right. UM s2.6 names the four ports
      and never arranges them.
  caption-size:
    confidence: photo-measured
    note: >-
      photo-measured, and corrected after looking at the render beside the photograph. In fig 2-5
      the port captions stand about 1.33mm cap-height against the 1.8 a font-size of 1.9 produces,
      so the first cut was ~35% oversized - the same defect the DCP-404's Tx/Rx captions had.
      Font-size is 1.45, which puts the cap height at about 1.05 and the caption back in
      proportion to the jacks beside it.
  eth4-shared:
    note: >-
      silkscreen. BOTH ETH4 labels - the electrical jack's and the SFP's - are printed in a box on
      the real faceplate while no other caption is, so the artwork itself marks the shared pair
      that UM s2.6 describes in prose. The boxes are reproduced here.
  power:
    note: >-
      UM spec table, "POWER CONSUMPTION (CHASSI ONLY): DCP-2 chassis with fans and 2 PSU (AC) Min:
      14W Max: 17W". The manual's other rows bundle a traffic unit, which answers for itself. NO
      AMBIENT TEMPERATURE is quoted against any DCP power figure, so none is asserted.
  slot-occupants:
    note: >-
      the traffic slots accept smartoptics/dcp-f-a22@2 as well as the DCP-404. Both are 205 x 44 x
      270 - the DCP traffic-unit envelope is one shared footprint, stated independently by each
      part's own datasheet - so a slot that fits one fits the other. The A22 is what makes an ILA
      node out of this chassis.
  vents:
    confidence: photo-measured
    note: >-
      photo-measured - the rear vent area is the fan tray's own faceplate and belongs to
      smartoptics/dcp-2-fan@1, not to the chassis. The chassis draws none of its own.

chassis:
  width: 440
  height: 45
  depth: 500
  ru: 1
  color: '#1b1e21'
  airflow: front-to-back

gaps:
- what: front-vents
  scope: [front]
  reason: needs-photo
  note: >-
    UM s3.1.5 says "The air inlets and outlets are positioned in the front and back",
    but fig 2-4 is an empty chassis shot into a dark cavity and resolves no vent
    pattern on the chassis front itself. The populated render (fig 1-1) does show
    honeycomb mesh, but that mesh is on the TRAFFIC UNITS' faceplates, not the
    chassis. So the front view draws no vent of its own and whether the chassis
    carries any is unresolved.
    RE-READ when the duplex adapters renamed their bores from tx and rx to fibre
    positions 1 and 2 (the adapter at v5, and the A22 that composes it, in the traffic
    slots at v2): the rename lives inside the slot occupants, not on the chassis front between
    them, so it neither closes this gap nor opens one - the gap stands.
  wanted: >-
    a face-on photograph of a populated DCP-2, which would show the chassis front
    beside a unit faceplate and separate the two. Every front image in the corpus is
    either an empty chassis or a three-quarter render.
- what: side-top-bottom-detail
  scope: [left, right, top, bottom]
  reason: needs-photo
  note: >-
    These four views carry the ENVELOPE ONLY - the 440 x 45 x 500 box from the manual's
    spec table, with the front faceplate shown edge-on as a dark band - and no observed
    surface detail: no lid screws, no side rails, no ventilation. That is the same
    treatment dcp-r-9d-cs gives its four, and it is honest rather than complete. The
    populated three-quarter render (fig 1-1) does show the lid and the left flank, but
    it is a lit marketing render on a black ground at an angle that measures nothing.
  wanted: >-
    a square-on photograph of the lid and of one flank. Failing that, the 3/4 render
    would support screw positions on the lid if it were rectified, which is what was
    done for smartoptics/dcp-404@1's top face.
- what: mgmt-board-fru
  scope: [mgmt]
  reason: vendor-silent
  note: >-
    The management board is called "mgmt-board" in the DCP-2-FB/HW ordering description
    and "part of the DCP-2 chassis" in UM s2.6, and it has no orderable part number of
    its own. Its ports are placed directly on the rear view with the plate drawn as
    decor, rather than modelled as a bay.
  wanted: >-
    a statement either way on whether the board is field-replaceable. If it is, this
    becomes a bay accepting a management-board component, and the seven ports move onto
    that part.
- what: ground-terminal
  scope: [furniture]
  reason: needs-drawing
  note: >-
    UM s3.2.8 puts the protective ground on the FRONT RACK BRACKET - "It is located on
    the right-side front rack mount(s)" - with an M5 nut and an unpainted pad around it,
    and notes the brackets are interchangeable left to right if the terminal is wanted
    on the other side. common/rack-ear@1 carries no terminal, and a separate lug placed
    at the bracket's position simply overlaps it, so the DCP-2 draws none. The terminal
    is real and is on the bracket, not on the chassis body.
  wanted: >-
    a common/rack-ear variant, or a skin, carrying the ground stud - the same need any
    device whose ground is on its bracket will have. Until then this is recorded rather
    than drawn.
- what: console-lamps
  scope: [console]
  reason: needs-photo
  note: >-
    Both jacks of the ETH0/CONSOLE pair show small light features at their corners in
    fig 2-5. On ETH0 those read as link lamps; on an RS-232 console jack they are more
    likely shield retention tabs. CONSOLE is drawn as a bare std/rj45-ganged rather than
    the lamped common/rj45-ganged-eth used for the Ethernet ports.
  wanted: >-
    a rear photograph above about 5 px/mm, which would separate a lamp window from a
    retention tab. The best in the corpus is 2.7.
groups:
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      the two half-width traffic slots. UM s2.2 - "In the front 2 traffic slots are
      available. The left slot is called slot '1' and the right slot is nominated as
      slot '2'." Either may hold a traffic unit or the blind plate, and UM s2.5 asks
      for the plate whenever only one unit is fitted so the airflow still passes
      through it.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        so-ds-dcp-2-r4.3, Power Supply Characteristics - "Dual redundant supply". UM
        s2.3 adds that "The DCP-2 is dual feed and the power supplies are hot
        swappable", and the chassis draws at most 17W against a 400W rating, so either
        supply carries the whole load alone.
    description: >-
      two hot-pluggable supplies. UM s2.3 - AC and DC modules share a footprint and
      "Both types can be used simultaneously", so the two bays accept either.
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: >-
      one tray of four fans. UM s2.4 - the system "is designed to operate with 3
      working fans", and a failed fan raises an alarm to replace the tray.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management interfaces, all at the rear on one board. ETH1-4 are RJ45
      100/1000Base-T; ETH4 is ALSO available as an SFP, shared with the electrical
      jack so that only one may be used at a time; ETH0 is the local craft port and
      CONSOLE is the RS-232 serial port. Two connector families in one block because
      UM s2.6 lists them as one set of network management interfaces, and because the
      shared ETH4 pair would be split across blocks otherwise.
