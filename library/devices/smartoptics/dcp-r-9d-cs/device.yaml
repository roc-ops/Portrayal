format: 1
kind: device
name: dcp-r-9d-cs
version: 4.0.1
maturity: modelled
manufacturer: Smartoptics
model: DCP-R-9D-CS
description: 40-channel colourless/directionless ROADM line unit, 1RU. Two rows of LC duplex adapters
  carrying channels 921-960 plus Line, 1510 OSC filter and cross-connects XC1-XC4, with ETH0 and
  RS232 management.
profile: optical
provenance:
  port-speeds:
    confidence: datasheet
    note: >-
      the OSC cage is `1g`: the DCP-R user manual (14.0), Supported OSC transceivers, certifies
      SFPs from 155 Mb/s STM-1/Fast Ethernet parts up to 1GE ones, and its OTDR section offers the
      combined OSC/OTDR SFP at 155 Mb/s or 1 Gb/s. The highest native rate the cage runs at is
      therefore 1G.
  chassis:
    note: >-
      manual DIMENSIONS (DCP-R) - 440mm (W) x 45mm (H) x 505mm (D), 1 RU
  port-positions:
    note: >-
      stencil ShapeSheet connection points, which Visio stores as fractions of shape width/height
      and therefore survive without the drawing scale. Resolved against the 19-inch rack width the
      master is drawn at.
      ADAPTER BODIES MOVED, FIBRES DID NOT (common/lc-duplex-adapter@6, B3): that adapter's
      ferrule axis sits 5.82 from its latch-side edge where @4's sat at 5.5, so every placement
      of it here moved 0.32 toward its own latch side - up on an unturned row, down on a row at
      rotate 180, with the panel cutout of the same id - and each fibre stays on the position read above.
  port-pairing:
    note: >-
      each LC duplex adapter carries two connection points about 6.6mm apart, one per fiber;
      adapters recovered by pairing those
  column-grid:
    note: >-
      top and bottom rows agreed across all 23 columns, so one averaged grid is used and the
      drawing jitter discarded
  xc-orientation:
    note: >-
      stencil master r-9d-csx - THE BOTTOM ROW IS MIRRORED, latch tongues down against the top
      row's up, exactly as on the 34D. The drawing already encoded it: every bottom-row port
      prints its Tx/Rx box reversed. It could not be DRAWN until std/lc-bore@3 made the bore keyed
      (#126), because a 4.7 square has no orientation. All 23 bottom-row adapters now carry
      rotate: 180
  mgmt-jack-alignment:
    note: >-
      stencil, correcting a transcription slip. The ShapeSheet puts ETH0 and RS232 within 0.14mm
      of the same x (fractions 0.0828 and 0.0831) and the art draws the shells flush, but the
      model had them 1.2mm apart at 9.6 and 10.8. ETH0 moved onto RS232's x, and its rotated
      caption with it. RS232 is the half that already matched, so it did not move
  osc-captions:
    note: >-
      stencil art. As on the 34D, the Tx and Rx captions sat 4.3mm and 1.9mm from their own LEDs
      on opposite sides and threw the pair 1.65mm left of the cage. The LEDs were already right -
      measured at 34.98 and 40.81 against the model's 34.9 and 40.7, which is what validates this
      master's coordinate mapping to 0.1mm. Captions moved to 31.9 and 43.85
  status-leds:
    note: >-
      stencil art - Power and Status centres measured at 54.79 and 60.88, a 6.09mm pitch, against
      the 5.6 the model carried. Same defect and the same correction as the 34D, and the two
      masters agree on the pitch to 0.02mm
  y-scale:
    note: >-
      this master is drawn 46.0mm tall against a 45mm chassis, so y was scaled by 45/46.0. The 34D
      master needed no such correction - a reminder that masters in one stencil are not all drawn
      to the same scale
  channel-plan:
    note: >-
      silkscreen - channels alternate in pairs between rows, 921/922 top then 923/924 bottom,
      continuing to 960
  markings:
    note: >-
      photo - IEC 60825 laser hazard triangles in the gap between the two port blocks, matching
      the 34D
  tx-rx-boxes:
    note: >-
      photo - every optical port carries a boxed Tx/Rx pair between its name and the adapter,
      split by a divider, reversed on the bottom row
  rear-layout:
    note: >-
      photo IMG_2181 of racked DCP-R units - PSU with integrated fan and C14 inlet at each end,
      mirrored; honeycomb vent panel across the centre; management block right of centre. Block
      positions are approximate to about 3mm - the photo has uncorrected perspective and partial
      cable occlusion, so it fixes the structure and order but not exact millimetres
  side-top-bottom:
    note: >-
      IMG_2188 shows the lid, so these now carry the real finish - a light silver body with the
      black front panel wrapping about 12.7mm (half an inch) back along every face. Still no
      vents, screws or lid labels - the photo shows the finish and the panel depth but not those
      details, so they are left out rather than invented
  psu-part:
    note: >-
      label - Gospower G1251-0550WNA, P/N CRPS0550-AH, and the fan sticker reads 550W Platinum
      CRPS. So the module is a standard CRPS 1U part at 73.5 x 40 x 185, not the 84mm-wide
      estimate taken from the racked photo, and both bays sit flush to the chassis edges
  psu-orientation:
    note: >-
      photo - both modules are fitted the same way round, fan inboard of the inlet, so the C14
      sits at the far right on PSU-2 and inboard on PSU-1. They are not mirrored
  rear-mgmt-block:
    note: >-
      stencil master dcp-r-rear, which is orthographic - a 2x2 ganged RJ45 shell (ETH 2 / ETH 4
      over ETH 1 / ETH 3), ESD warning, Tx and Rx LEDs, an ETH 5 SFP cage and a recessed RESET
      button
  tx-rx-positions:
    confidence: measured
    note: >-
      stencil master r-9d-csx, read at 8.33 px/mm vertically - its two ferrule rows stand 92 px
      apart against this model's 11.05 row pitch, the same fit the 34D's 8.86 comes from, and
      within 1.7% of the 45/46.0 y-scale above - each figure measured outward from the art's own
      ferrule line and taken as the row's median, since this master is a JPEG and single pairs
      scatter by about 0.2. The white Tx/Rx box runs 7.68 to 9.38 from the ferrule on the top row
      and 7.65 to 9.45 on the bottom row; the port name's glyphs run 10.02 to 12.00 and 10.26 to
      12.18. Each frame - drawn 2.5 tall, where the stencil's box is 1.7-1.8 - is centred on the
      box's centre, its divider and Tx/Rx text move with it, and each name's glyph is centred on
      the stencil name's centre, taking its cap height as 0.72 of the font size. Until B3 the
      frames were generated from each adapter's placement 5.85 from the ferrule, about 1.8
      closer than the stencil draws them, and once the adapter bodies moved to keep the fibres on
      the connection points (common/lc-duplex-adapter@6) the bodies met them. The boxed style is
      the photograph's (`tx-rx-boxes`); only the positions are the stencil's

attrs:
  performance:
    channels: 40
chassis:
  width: 440
  height: 45
  depth: 505
  ru: 1
  color: '#1b1e21'
groups:
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  psus:
    term: PSU
    role: service
    index-origin: 1
  line:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the line side, as opposed to the add/drop channels and the cross-connects:
      the DWDM Line port, the 1510 filter that splits the optical supervisory
      channel off it, and the SFP that terminates that channel.
    mixed: >-
      TWO CONNECTOR FAMILIES, ONE JOB. Line and 1510 are LC duplex adapters and
      the OSC is an SFP cage, so the block declares no media of its own and each
      port carries its own. They are grouped by what they are FOR - everything
      facing the line, rather than the channels added and dropped from it - and
      splitting them by connector would put the filter and the transceiver it
      feeds in different blocks, which is the one relationship a reader of this
      face needs to see.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators, which report the unit rather than any one port
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  xc:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: fiber, role: cross-connect}
    description: XC1-XC4, the cross-connect ports. DCP-R User Manual 14.0 A section 2.1.2 has
      degrees interconnected either through the LC cross-connects or through the five connections
      carried in the MPO. Two sit in the upper row and two in the lower, which is why a positional
      grouping split them
  channels:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: fiber, role: channel}
    description: the 40 add/drop channel ports, silkscreened 921-960. They alternate in pairs
      between the two rows - 921/922 upper, 923/924 lower - so the rows are a layout, not a block
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the unit's management interfaces, on both faces. REAR - ETH1-4 on RJ45 to the
      shelf controller, ETH5 as an SFP for optical management access, and the recessed
      reset beside them; DCP-R User Manual 14.0 A section 2.10 lists those as one set of
      network management interfaces. FRONT - ETH0 on RJ45 and the RS-232 craft console,
      which were in no group at all and so drew a row each beside the port groups. Two
      blocks, one job, and the tree separates them by view without needing two words
