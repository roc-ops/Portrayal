format: 1
kind: device
name: dcp-r-9d-cs
version: 0.1.0
manufacturer: Smartoptics
model: DCP-R-9D-CS
description: 40-channel colourless/directionless ROADM line unit, 1RU. Two rows of LC duplex adapters
  carrying channels 921-960 plus Line, 1510 OSC filter and cross-connects XC1-XC4, with ETH0 and
  RS232 management.
profile: optical
provenance:
  chassis: manual DIMENSIONS (DCP-R) - 440mm (W) x 45mm (H) x 505mm (D), 1 RU
  port-positions: stencil ShapeSheet connection points, which Visio stores as fractions of shape
    width/height and therefore survive without the drawing scale. Resolved against the 19-inch rack
    width the master is drawn at.
  port-pairing: each LC duplex adapter carries two connection points about 6.6mm apart, one per
    fiber; adapters recovered by pairing those
  column-grid: top and bottom rows agreed across all 23 columns, so one averaged grid is used and
    the drawing jitter discarded
  y-scale: this master is drawn 46.0mm tall against a 45mm chassis, so y was scaled by 45/46.0.
    The 34D master needed no such correction - a reminder that masters in one stencil are not all
    drawn to the same scale
  channel-plan: silkscreen - channels alternate in pairs between rows, 921/922 top then 923/924
    bottom, continuing to 960
  markings: photo - IEC 60825 laser hazard triangles in the gap between the two port blocks, matching
    the 34D
  tx-rx-boxes: photo - every optical port carries a boxed Tx/Rx pair between its name and the adapter,
    split by a divider, reversed on the bottom row
  rear-layout: photo IMG_2181 of racked DCP-R units - PSU with integrated fan and C14 inlet at each
    end, mirrored; honeycomb vent panel across the centre; management block right of centre. Block
    positions are approximate to about 3mm - the photo has uncorrected perspective and partial cable
    occlusion, so it fixes the structure and order but not exact millimetres
  side-top-bottom: IMG_2188 shows the lid, so these now carry the real finish - a light silver body
    with the black front panel wrapping about 12.7mm (half an inch) back along every face. Still
    no vents, screws or lid labels - the photo shows the finish and the panel depth but not those
    details, so they are left out rather than invented
  psu-part: label - Gospower G1251-0550WNA, P/N CRPS0550-AH, and the fan sticker reads 550W Platinum
    CRPS. So the module is a standard CRPS 1U part at 73.5 x 40 x 185, not the 84mm-wide estimate
    taken from the racked photo, and both bays sit flush to the chassis edges
  psu-orientation: photo - both modules are fitted the same way round, fan inboard of the inlet,
    so the C14 sits at the far right on PSU-2 and inboard on PSU-1. They are not mirrored
  rear-mgmt-block: stencil master dcp-r-rear, which is orthographic - a 2x2 ganged RJ45 shell (ETH
    2 / ETH 4 over ETH 1 / ETH 3), ESD warning, Tx and Rx LEDs, an ETH 5 SFP cage and a recessed
    RESET button
attrs:
  performance:
    channels: 40
chassis:
  width: 440
  height: 45
  depth: 505
  ru: 1
  color: '#1b1e21'
groups:
  xc:
    term: Port
    index-origin: 1
    attrs: {media: fiber, role: cross-connect}
    description: XC1-XC4, the cross-connect ports. DCP-R User Manual 14.0 A section 2.1.2 has
      degrees interconnected either through the LC cross-connects or through the five connections
      carried in the MPO. Two sit in the upper row and two in the lower, which is why a positional
      grouping split them
  channels:
    term: Port
    index-origin: 1
    attrs: {media: fiber, role: channel}
    description: the 40 add/drop channel ports, silkscreened 921-960. They alternate in pairs
      between the two rows - 921/922 upper, 923/924 lower - so the rows are a layout, not a block
  mgmt:
    term: Port
    index-origin: 1
    mixed: the rear management block - ETH1-4 on RJ45 to the shelf controller, ETH5 as an SFP
      for optical management access, and the recessed reset beside them. DCP-R User Manual 14.0
      A section 2.10 lists them as one set of network management interfaces
