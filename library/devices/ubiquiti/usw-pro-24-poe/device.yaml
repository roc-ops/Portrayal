gaps:
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    The data sheet gives weights with and without mounting brackets and no figure for them, and no
    install guide is held. No ear position is stated, none is shipped as default and no kit is listed.
  wanted: The install guide (dl.ui.com/qig/usw-pro-24-poe) for the ear positions and the one shipped, and the maker's rail kits if any apply.
- what: jack-lamp-meaning
  scope: [rj45, sfp-plus-leds]
  reason: vendor-silent
  note: >-
    The data sheet's LED table gives the Ethernet and SFP+ lamps a function ("PoE Speed/link/activity",
    "Speed/link/activity") and no colour or state. The pictures show green lamps on the jacks and white
    triangles on the cages; no state is written beyond the component's own vocabulary.
  wanted: The install guide's LED table.
- what: rps-lamp-and-legend
  scope: [rear]
  reason: vendor-silent
  note: >-
    The data sheet says RPS "Status" and no state. The legend beside the RPS lamp (USP RPS, OFF, ON)
    is read off a community drawing at the limit of its resolution, and what the OFF and ON marks are for
    is not said.
  wanted: The install guide's rear panel and LED table.
- what: port-legend-detail
  scope: [front]
  reason: needs-photo
  note: >-
    The numerals under and over the jacks are not legible in any picture held, so the order is
    inferred (see provenance port-numbering) and the mark on ports 17 to 24 is not drawn. The screen's
    own legend is likewise unreadable.
  wanted: A straight-on photograph of the front, or the install guide's port figure.
- what: fans-and-airflow
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    Neither the data sheet nor the page names a fan or an airflow direction. The NetBox entry says
    front to rear; both faces carry vent slots; no fan is visible on the rear elevation.
  wanted: The install guide or the maker's thermal description.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  note: >-
    No maker photograph of the rear is held: the data sheet shows the front only. The rear is drawn
    from the community rear elevation.
  wanted: A maker's straight-on photograph of the rear.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    No end-of-life notice is in any held document; none was searched for online.
  wanted: The maker's end-of-life list, which the intake did not find.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 24 built-in Gigabit RJ45 ports, numbered 1 to 24, the upper row odd; 1 to 16 PoE+ and 17 to
      24 PoE++ (the placements carry which)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the two built-in 1/10G SFP+ ports; their ids carry the numbers 25 and 26 that the faceplate
      prints, and their position in the group is 1 and 2
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the speed, link and activity lamp between the two SFP+ cages, one triangle per cage
  lcm:
    term: Display
    role: indicator
    index-origin: 1
    description: the 1.3 inch touchscreen
  controls:
    term: Button
    role: management
    index-origin: 1
    description: the recessed factory-reset button
  power-input:
    term: Inlet
    role: service
    index-origin: 1
    description: the AC power inlet of the internal supply
  rps-input:
    term: Inlet
    role: service
    index-origin: 1
    description: the USP RPS DC input for an external redundant supply
  rps-leds:
    term: LED
    role: indicator
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
