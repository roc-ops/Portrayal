format: 1
kind: device
name: usw-pro-24-poe
version: 0.1.0
maturity: modelled
manufacturer: Ubiquiti
model: USW-Pro-24-PoE
portfolio: {line: UniFi Switching, family: Switch Pro}
description: >-
  Ubiquiti USW-Pro-24-PoE (UniFi Switch Pro 24 PoE) is a fixed 1RU Layer 2 switch. Its front carries 24
  Gigabit RJ45 ports in two stacked rows, 16 PoE/PoE+ and 8 60 W PoE++, two 1/10G SFP+ ports in a
  column beside them, a 1.3 inch touchscreen on the left and a recessed factory-reset button. The rear
  carries the AC power inlet and the USP RPS DC input for an external redundant supply. The 450 W
  supply is internal, so it is part of the chassis and not a bay.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Ubiquiti data sheet "Datasheet USW-Pro-24-PoE" (two pages, © 2023 Ubiquiti Inc., PDF created
      2023-03-08; https://dl.ui.com/ds/usw-pro-24-poe_ds.pdf): the Mechanical and Hardware tables and the
      LEDs table, and its faceplate photograph (1053 x 228 px, a three-quarter view). The maker's
      techspecs.ui.com page data for the model (https://techspecs.ui.com/unifi/switching/usw-pro-24-poe,
      read 2026-10-26): Form Factor "Rack mount (1U)", dimensions, port layout, supported rack depth.
      The NetBox community devicetype-library entry USW-Pro-24-PoE.yaml and its front and rear elevation
      drawings (netbox-community/devicetype-library, read 2026-10-26) are community work, not the maker's,
      and are used as a second opinion and, for positions, as the only straight-on drawing held. The
      install guide (dl.ui.com/qig/usw-pro-24-poe) is not held.
  gate-1:
    confidence: photo-measured
    note: >-
      The data sheet photograph is oblique (the right-hand side wall is in view and the face is
      foreshortened), so it is not measured: it supplies counts, the arrangement, lamp places and
      printed legends. The measuring drawing is the community front elevation, 1179 x 113 px. Its
      aspect, 10.43, is 3 percent from the body's 442.4 / 43.7 = 10.12, so x and y are not one scale:
      x is taken at 2.673 px per mm, which is the width scale 2.665 corrected so that the registry
      RJ45 pitch (13.97 mm) closes on the measured column pitch (37.7 px) with the 6 + 6 gang
      gutter of 2.9 mm read as the 45 px between columns 6 and 7; y is taken at 2.586 px per mm from
      the height. Every position is estimated to about 1.5 mm in x and 1 mm in y. Laid over the
      render at matched scale, the drawing's last jack column stands about 2 mm right of this
      model's (a pitch of 14.1 against 13.97 would close it) and the SFP+ column about 0.8 mm; the
      registry pitch was kept, because that error is inside the drawing's own blur.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, Mechanical: "442.4 x 285.4 x 43.7 mm (17.4 x 11.2 x 1.7")", read as width, depth and
      height (the 1U height settles which is which; the maker's page prints 442 x 285 x 44 mm in
      the same order). Weight "Without mounting brackets: 4.3 kg (9.5 lb) With mounting brackets: 4.4
      kg (9.7 lb)"; the weights imply the mounting brackets ship with the switch, but no contents list is
      held. The page's rack depth is 400 to 1200 mm ("Supported Rack Depth"). The elevation drawing
      shows no ears, and the body is modelled as 442.4 wide, the sheet's own figure, not the 19 inch
      482.6.
  ports:
    confidence: datasheet
    note: >-
      Data sheet, Hardware: "(24) GbE RJ45 ports (2) 1/10G SFP+ ports"; PoE interface "(16) PoE/PoE+
      (Pins 1, 2+; 3, 6-) (8) 60W PoE++ ...". Which ports are PoE++ is not in the sheet: the
      NetBox entry puts PoE++ on ports 17 to 24 and the elevation drawing prints a mark after the
      numerals of 17 to 24 (and none on 1 to 16), so ports 17 to 24 carry `poe: PoE++` and 1 to 16
      `poe: PoE+`, read as photo-measured, not stated by a sheet.
  port-numbering:
    confidence: photo-measured
    note: >-
      The numerals are 1 to 2 px high in every picture held, so the order is read as a pattern and
      not as digits: one numeral above each upper jack and one below each lower jack, each column's
      pair running up then down, the SFP+ pair marked above and below the cages, and the 17 to 24 mark
      matching the PoE++ group. The usual UniFi order is read from that: odd numbers on the upper row
      (1, 3, 5 ... 23), even numbers on the lower row (2, 4 ... 24), then 25 above and 26 below the SFP+
      cages. This is the figure most worth a second reading with the install guide.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off the community elevation at the scales under gate-1. Two shells of six
      columns; column step 13.97 and one 2.9 mm extra gutter between the sixth and seventh columns;
      the first jack's left edge at 213.1; the upper row at 7.8 and the lower at 22.3 (14.5 apart, read as
      the jacks' tops at 20.7 and 58.3 px); the two SFP+ cages on the registry cell (14.25 wide, 15.0
      row pitch) at 405.8 and 7.6; the touchscreen's dark square 23 mm across at 5.5, 9.2; the reset
      pinhole at 426.2, 37.2. The five horizontal slots along the top edge are read off the same drawing and
      are drawn as vents. The data sheet photograph agrees on every count: 12 columns, 2 rows, 2
      cages, the screen at the left end.
  jacks:
    confidence: photo-measured
    note: >-
      Each jack carries one lamp, at its upper right corner on the upper row and its lower right corner on
      the lower row (green in both pictures), so the upper row is turned 180 (latch up) and the lower
      row takes the lamp-right skin of common/rj45-ganged-link@1. The sheet names the lamp as "Ethernet:
      PoE Speed/link/activity" and gives no colour or state, so the jack keeps the component's own
      link and activity vocabulary and no state is invented (see the gap).
  sfp:
    confidence: photo-measured
    note: >-
      Two cages stacked in one column, each lamp a small white triangle between them: up for the upper
      cage and down for the lower. The sheet's LED table says "SFP+: Speed/link/activity" with no colours,
      so the lamps keep the component's on and off.
  display:
    confidence: datasheet
    note: >-
      Data sheet, Hardware: "LCM display: (1) 1.3" touchscreen"; the same part and wording as the
      UDM-Pro's, so both use ubiquiti/lcm-touchscreen-1-3@1. Its size is estimated from the elevation. The
      printed model legend under the screen and the brand mark beside it are too small to read, so
      only the logo zone is reserved and no legend is drawn.
  logo:
    confidence: estimated
    note: >-
      The brand mark beside the legend under the screen on the front, and the brand wordmark and mark on
      the rear label, are not drawn: three `logo-zone` regions are reserved where the elevations show
      them (the two on the rear named logo-zone and logo-zone-2).
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Data sheet, Hardware: "Power supply: AC/DC, internal, 450W" and "Power method: Universal input,
      100-240V AC, 50/60Hz; USP RPS DC input, 52V DC, 7.69A / 11.5V DC, 2.61A". The supply is internal,
      so it is part of the chassis, not a bay and not a component. The sheet says nothing of fans; the
      slots along the top edges of both faces are drawn as vents and no fan is placed (see the gap).
  rear-layout:
    confidence: estimated
    note: >-
      estimated - read off the community rear elevation (1271 x 126 px, 2.873 px per mm across from the
      body width, 2.883 down). The USP RPS socket is 63.8 x 18.5 at 18.0, 19.3, with its USP CONNECT legend
      under it; the AC inlet plate 30.8 x 23.6 at 379.6, 12.1 and the C14 in it; a serial label (a QR
      code and three lines) above the socket; three edge screws at 11.1, 221.7 and 431.9, y 37.4; five vent
      slots along the top. The rating label at the right carries the model text. The small legend
      beside the RPS lamp reads USP RPS, OFF and ON. A line of rating text under the inlet has one
      unreadable digit and is left out.
  airflow:
    confidence: estimated
    note: >-
      not stated by the data sheet or the page. The NetBox entry says front to rear, and the slots
      on both faces are vents, but no fan is shown, so no airflow is claimed on the chassis (see the gap).
  rps:
    confidence: datasheet
    note: >-
      Data sheet, LEDs: "RPS: Status" with no colour or state; the page says "Redundancy: DC Power
      Backup, with UniFi RPS". The lamp is the blue triangle left of the USP RPS socket in the elevation.
  colour:
    confidence: photo-measured
    note: >-
      median of the bare plate in the community front elevation (#e2e4e6).
