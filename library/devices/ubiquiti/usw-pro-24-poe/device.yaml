  physical:
    weight-note: >-
      without mounting brackets 4.3 kg (9.5 lb); with mounting brackets 4.4 kg (9.7 lb), data sheet
      Mechanical
    enclosure-material: SGCC steel
    rack-depth-mm: 400 to 1200
  performance:
    switching-capacity-gbps: 88
    non-blocking-throughput-gbps: 44
    forwarding-rate-mpps: 65.472
  power:
    power-max-w: 50
    power-envelope: bare
    poe-budget-w: 400
    power-supply: AC/DC, internal, 450 W
    power-input: 100 to 240 VAC, 50/60 Hz
    power-rps-input: 52 V DC at 7.69 A; 11.5 V DC at 2.61 A
    poe-per-port: >-
      PoE+ 32 W, PoE++ 64 W by the sheet's PSE column (the page says 30 W and 60 W at the device)
    poe-voltage: PoE 44 to 57 V, PoE+ 50 to 57 V
  environmental:
    operating-temp-c: -5 to 40
    humidity: 10 to 90 percent noncondensing
    esd: air ±16 kV, contact ±12 kV
    shock-vibration: ETSI 300-019-1.4
  management:
    interface: Ethernet in-band
  compliance:
    certifications: CE, FCC, IC
