gaps:
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    The data sheet gives one weight and no ear figure, and no install guide is held. No ear position is
    stated, none is shipped as default and no kit is listed.
  wanted: The install guide (dl.ui.com/qig/udm-pro) for the ear positions and the one shipped, and the maker's rail kits if any apply.
- what: hdd-bay
  scope: [front]
  reason: vendor-silent
  note: >-
    The page names "(1) 3.5" NVR HDD bay" and the sheet an HDD lamp. No held document says how the door
    opens, what drive the bay takes, whether one is supplied, or where the lamp sits. The door is panel
    decor and the lamp is placed on the dot the pictures show on it.
  wanted: The install guide's drive-bay procedure and LED figure.
- what: led-meaning
  scope: [rj45, sfp-plus, rps-leds]
  reason: vendor-silent
  note: >-
    The sheet's LED table gives each lamp its colours (Ethernet green 1G, amber 10/100M; SFP+ white 10G,
    green 1G; RPS blue ready) but not whether the two states are steady or blink, and not which jack
    lamp is which when a jack has more than one.
  wanted: The install guide's LED table.
- what: rps-lamp-and-legend
  scope: [rear]
  reason: vendor-silent
  note: >-
    The legend beside the RPS lamp (USP RPS, OFF, ON) is read off a community drawing at the limit of
    its resolution, and what the OFF and ON marks are for is not said.
  wanted: The install guide's rear panel and LED table.
- what: port-legend-detail
  scope: [front]
  reason: needs-photo
  note: >-
    The blue marks beside 9 and 10 and the small line of text under 11 are not resolved in any picture
    held, and are not drawn.
  wanted: A straight-on photograph of the front, or the install guide's port figure.
- what: fans-and-airflow
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    Neither the data sheet nor the page names a fan or an airflow direction. The NetBox entry says
    front to rear; both faces carry vent slots; no fan is visible on the rear elevation.
  wanted: The install guide or the maker's thermal description.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  note: >-
    No maker photograph of the rear is held: the data sheet shows the front only. The rear is drawn
    from the community rear elevation.
  wanted: A maker's straight-on photograph of the rear.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    No end-of-life notice is in any held document; none was searched for online.
  wanted: The maker's end-of-life list, which the intake did not find.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the nine built-in Gigabit RJ45 ports as numbered on the faceplate: 1 to 8 LAN, the upper row odd,
      and 9 WAN (the placements carry role)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the two built-in 10G SFP+ ports, 10 (WAN) above and 11 (LAN) below; their ids carry the
      printed numbers and their position in the group is 1 and 2
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the link and activity lamp between the two SFP+ cages, one triangle per cage
  hdd-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the disk lamp on the drive-bay door
  lcm:
    term: Display
    role: indicator
    index-origin: 1
    description: the 1.3 inch touchscreen
  controls:
    term: Button
    role: management
    index-origin: 1
    description: the recessed factory-reset button
  power-input:
    term: Inlet
    role: service
    index-origin: 1
    description: the AC power inlet of the internal supply
  rps-input:
    term: Inlet
    role: service
    index-origin: 1
    description: the USP-RPS DC input for an external redundant supply
  rps-leds:
    term: LED
    role: indicator
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
