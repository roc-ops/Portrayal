format: 1
kind: device
name: udm-pro
version: 0.1.0
maturity: modelled
manufacturer: Ubiquiti
model: UDM-Pro
portfolio: {line: UniFi Cloud Gateways, family: Dream Machine}
description: >-
  Ubiquiti UDM-Pro (UniFi Dream Machine Pro) is a fixed 1RU rack gateway. Its front carries a 1.3 inch
  touchscreen at the left, a door over a 3.5 inch drive bay, eight Gigabit RJ45 LAN ports in two
  stacked rows, one Gigabit RJ45 WAN port and two 10G SFP+ ports (one WAN, one LAN) in a column, and a
  recessed factory-reset button. The rear carries the AC power inlet and the USP-RPS DC input for an
  external redundant supply. The 50 W supply is internal, so it is part of the chassis and not a bay.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Ubiquiti data sheet "Datasheet UDM-Pro" (two pages, © 2023 Ubiquiti Inc., PDF created 2023-03-22;
      https://dl.ui.com/ds/udm-pro.pdf): the Mechanical, Hardware and LEDs tables and its faceplate
      photograph (923 x 197 px, a three-quarter view). The maker's techspecs.ui.com page data for the
      model (https://techspecs.ui.com/unifi/unifi-cloud-gateways/udm-pro, read 2026-10-26): Form Factor
      "Rack mount (1U)", dimensions, port layout, "(1) 3.5" NVR HDD bay". The NetBox community
      devicetype-library entry UniFi-Dream-Machine-Pro.yaml and its front and rear elevation drawings
      (netbox-community/devicetype-library, read 2026-10-26) are community work, not the maker's; they
      are used as a second opinion and, for positions, as the only straight-on drawing held. The install
      guide (dl.ui.com/qig/udm-pro) is not held.
  gate-1:
    confidence: photo-measured
    note: >-
      The data sheet photograph is oblique (the right side wall is in view), so it is not measured: it
      supplies counts, arrangement, lamp places and printed legends. The measuring drawing is the
      community front elevation, 1065 x 106 px: its aspect, 10.05, is 0.7 percent from the body's
      442.4 / 43.7 = 10.12, so x is taken at 2.407 px per mm and y at 2.425 from the stated width and
      height. The RJ45 column pitch then reads 15.6 mm (37.6 px) against the registry cell's 13.97,
      so the jacks are drawn on the measured pitch and not the registry's; the cell and its
      cutout are unchanged and the jacks stand 2.9 mm apart. Every position is estimated to about
      1 mm.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, Mechanical: "442.4 x 43.7 x 285.6 mm (17.4 x 1.7 x 11.2")", read as width, height and
      depth (the 1U height settles it; the switch's sheet prints depth second, this one prints it
      last: the order differs between the two sheets and each number is read against the model). Weight
      3.9 kg (8.6 lb); enclosure "Aluminium CNC, SGCC steel", mount material "SGCC steel". The sheet
      gives one weight and no with-bracket figure, so it does not say whether ears are in the box;
      the maker's page says "Rack mount (1U)". The body is modelled at the sheet's 442.4 wide, not 482.6.
  ports:
    confidence: datasheet
    note: >-
      Data sheet, Hardware: "Networking interface (8) LAN: GbE RJ45 ports (1) WAN: GbE RJ45 port";
      "SFP+ interface (1) LAN: 10G SFP+ (1) WAN: 10G SFP+". The page counts nine 1G RJ45 and two 10G SFP+.
  port-numbering:
    confidence: photo-measured
    note: >-
      Read off the community front elevation at 5x: the upper row of the LAN block prints 1, 3, 5, 7
      and the lower row 2, 4, 6, 8; the single jack prints 9 and the SFP+ column 10 above and 11 below,
      as printed on the metal. The elevation marks 9 and 10 with a small blue dot and gives 11 none;
      the sheet names a WAN jack and a WAN SFP+, and the NetBox entry labels port 9 WAN 1 and port 10
      SFP+ WAN 2, so 9 and 10 are the WAN ports and 1 to 8 and 11 are LAN. Digits are 3 to 4 px
      high at that size and read with that caution.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off the community elevation at the scales under gate-1. LAN block: first
      column's left edge 309.85, 15.6 mm column step, upper row at 9.5 and lower at 23.3; WAN jack at
      388.6, 22.2 (a single jack, latch up, lamp at the upper right); the two SFP+ cages on the registry
      cell (14.25 wide, 15.0 row pitch) at 405.5, 9.2; touchscreen 23 mm square at 6.5, 10.25; the door
      107.2 x 28.1 at 185.9, 7.9; reset pinhole at 426.7, 37.5. The five horizontal slots along the top
      edge are drawn as vents. The data sheet photograph agrees on every count.
  jacks:
    confidence: datasheet
    note: >-
      Data sheet, LEDs: "Ethernet: Link/ activity, Green: 1G, Amber: 10/100M". Each jack shows one lamp, at the
      upper right on the upper row and the lower right on the lower row (green in the pictures), so the upper
      row is turned 180 (latch up) and the lower row takes the lamp-right skin of
      common/rj45-ganged-link@1. The WAN jack is drawn on the same ganged cell, turned 180, because the
      library has no single jack with one lamp; its housing in the drawing is 13.6 wide against the cell's
      12.7.
  sfp:
    confidence: datasheet
    note: >-
      Data sheet, LEDs: "SFP+: Link/ activity, White: 10G, Green: 1G". One white triangle per cage between
      the two cages, up for the upper and down for the lower, as in the photograph.
  display:
    confidence: datasheet
    note: >-
      Data sheet, Hardware: "LCM display: (1) 1.3" touchscreen", the same part and words as on the
      USW-Pro-24-PoE, so ubiquiti/lcm-touchscreen-1-3@1. The printed model name under it, "Dream Machine
      Pro", is drawn as plain text; the brand mark is not.
  hdd-bay:
    confidence: photo-measured
    note: >-
      The page's "(1) 3.5" NVR HDD bay" and the sheet's HDD lamp ("White: disk activity, Amber: disk
      error") are the sources for a drive bay. The photograph and the drawing show a flat door over it
      with one dot near its right edge. The door is drawn as panel decor, not a bay: no held document says
      how a drive is fitted, what the bay accepts, or whether a drive is supplied, so no occupant is
      modelled. The dot is taken as the HDD lamp; that is a reading of the pictures (see the gap).
  logo:
    confidence: estimated
    note: >-
      The brand mark on the rear label is not drawn: one `logo-zone` region is reserved where the rear
      elevation shows it. No brand mark is seen on the front elevation, so none is reserved there.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Data sheet, Hardware: "Power supply: AC/DC, internal, 50W" and "Power method: (1) Universal AC input,
      100-240V AC, 50/60Hz; (1) USP-RPS DC input". The supply is internal, so it is part of the chassis, not
      a bay and not a component. The sheet says nothing of fans; the slots along the top edges are drawn
      as vents and no fan is placed (see the gap).
  rear-layout:
    confidence: estimated
    note: >-
      estimated - read off the community rear elevation (1258 x 128 px, 2.844 px per mm across from the
      body width and 2.929 down). The USP-RPS socket (two rows of twelve contacts) is 63.5 x 18.0 at
      18.4, 19.8 with its USP CONNECT legend under it; the AC inlet plate is 31.1 x 23.4 at 377.8, 12.6
      with the C14 in it; three edge screws at 11.6, 220.5 and 429.8, y 37.4; five vent slots along the
      top. The rating text block at the right and the rating line under the inlet are too small to read
      and are left out; an empty label outline above the socket is not drawn.
  rps:
    confidence: datasheet
    note: >-
      Data sheet, LEDs: "RPS: Blue: ready". The lamp is the grey triangle left of the socket in the elevation, with the legend USP RPS,
      OFF and ON beside it and a small blue dot at ON; which of the two marks is the lamp is not settled
      (see the gap).
  airflow:
    confidence: estimated
    note: >-
      not stated by the data sheet or the page. The NetBox entry says front to rear; no fan is shown, so
      no airflow is claimed on the chassis (see the gap).
  colour:
    confidence: photo-measured
    note: >-
      median of the bare plate in the community front elevation (#d1d1d3).
attrs:
  physical:
    weight-note: 3.9 kg (8.6 lb), data sheet Mechanical
    enclosure-material: Aluminium CNC, SGCC steel
    mount-material: SGCC steel
  performance:
    ids-ips-throughput: 3.5 Gbps, measured with iPerf3 (data sheet)
  power:
    power-max-w: 33
    power-supply: AC/DC, internal, 50 W
    power-input: 100 to 240 VAC, 50/60 Hz
  environmental:
    operating-temp-c: -10 to 40
    humidity: 5 to 95 percent noncondensing
    esd: air ±15 kV, contact ±8 kV
  platform:
    processor: Quad-core ARM Cortex-A57 at 1.7 GHz
    system-memory: 4 GB DDR4
    onboard-storage: 16 GB eMMC
  features:
    nvr-bay: (1) 3.5 inch NVR HDD bay (maker's page)
  management:
    interface: Ethernet, Bluetooth
  compliance:
    certifications: CE, FCC, IC
