  outlets-l1: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the three IEC C19 outlets of phase L1, counted from the cable foot'}
  outlets-l2: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the three IEC C19 outlets of phase L2, counted from the cable foot'}
  outlets-l3: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the three IEC C19 outlets of phase L3, counted from the cable foot'}
  power-input: {term: Input, role: service, index-origin: 1}
  control: {term: Controller, role: furniture, index-origin: 1}
  ethernet: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 1g}, description: 'ETH2 and ETH1, the two redundant network jacks'}
  serial: {term: Port, role: management, index-origin: 1, description: 'the RS232 serial jack'}
  can-bus: {term: Port, role: management, index-origin: 1, description: 'the CAN bus jack for CMC III sensors'}
  usb: {term: Port, role: management, index-origin: 1, description: 'the USB port for firmware updates and data logging'}
  signal: {term: Terminal, role: management, index-origin: 1, mixed: 'the digital input and the alarm relay output, two small pluggable headers'}
  lamps: {term: Lamp, role: indicator, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
