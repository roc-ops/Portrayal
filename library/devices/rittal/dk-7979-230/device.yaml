format: 1
kind: device
name: dk-7979-230
version: 0.1.0
maturity: modelled
manufacturer: Rittal
model: DK 7979.230
description: >-
  Rittal PDU metered, three-phase, 0U. A 845 mm extruded aluminium strip, 44 mm wide and about 72 mm deep, that
  hangs on two push-button attachments on its back. It takes a 400 V three-phase feed, 11 kW, through a 3 m fixed
  cord with a 16 A CEE plug. It hands that on to nine unswitched IEC C19 outlets, three on each phase. The
  controller between phase 2 and phase 3 measures each phase. It has a display, two Ethernet jacks, a CAN bus
  jack, an RS232 jack and a USB port. No breaker and no switching.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S DIMENSIONED DRAWING. Rittal, "Technical details, Power Distribution Unit, Metered
      version" (dri2108029en, 08.2023), PDF page 10, DK 7979.230. The page has a plan view, a side view, an end view
      and a front view, with the circuit diagram below. The cell lines of the front view were read from a 600 dpi
      render at the drawing's own scale. The 845 overall length reads 1.937 px per mm. Each cell edge is a
      full-height line. Good to about 1 mm. Each C19 outlet sits in its cell at the lines the drawing shows inside it.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, the library's way to say a part stands vertically beside an upright. It hangs on the two
      push-button attachments of the plan view, dimensioned 622.3 apart. The data sheet's "PDU mounting options"
      are the enclosure frame at the side of the 482.6 mm mounting frame and the cable route. The mounting adaptor
      7000.688 is an accessory and is not drawn. `ru: 19` is the 845 mm it runs, 845 / 44.45 = 19.0.
  chassis:
    confidence: drawing
    note: >-
      drawing - length 845 (the dimension of the front view and the table of page 1). Width is 44 (the data sheet's
      "44 mm (1 U)"), depth 72.1 (the side view's dimension). The data sheet (dri1308088en, p.1) prints "PDU
      enclosure depth 70 mm" and the end view 109. The 109 is the body with the cable gland standing out of the front
      and the button out of the back. The 70 is the extrusion profile. 72.1 is drawn, as on the basic devices.
  colour:
    confidence: datasheet
    note: >-
      The data sheet (dri1308088en, p.1) says "Aluminium, anodised in RAL 9005 (black, other colours may be
      configured)", so the body is drawn black. The screen value #0e0e10 is the usual one for RAL 9005 and is
      estimated. The two photographs of the metered family show a natural silver-grey extrusion, median #8a8a8a over
      383777 pixels of photograph 78_2802. They also show dark graphite plates, #2b2b2c over 301257 pixels. Colours are a later
      touch. The gap below names both.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of page 10, mm from the foot end. The foot cell is 0 to 72.1 with the gland ring.
      The cord cell runs to 195.89 with a raised label cover in it. A blank cell runs to 219.9. Phase 1 is 219.9 to
      356.43 and phase 2 is 356.43 to 492.7. The controller runs to 692.98. Phase 3 is 692.98 to 829.26 and the head
      cap runs to 845. Each phase is three C19 cells of 45.5 each. Outlets count from the foot. The C19 long axis is
      along the strip.
  controller:
    confidence: drawing
    note: >-
      drawing - the controller cell is 492.7 to 692.98 of page 10, between phase 2 and phase 3. Its parts are the
      PDU controller plate and two RJ45 jacks (ETH2 and ETH1). The rest are an RJ12 jack (RS232), an RJ45 jack (CAN bus), a USB-A
      port and two small headers. They are read as the DK 7979.238 page reads them, and the cell lines agree to
      0.3 mm. Rittal, "Montage-, Installations- und Betriebsanleitung" for the PDU metered (7979204), fig. 21 names
      each of them. The data sheet calls the RS232 port RJ12 and the library's `rj11` key is the same six-position
      body. Each jack is drawn unrotated with its pins up.
  lamps:
    confidence: estimated
    note: >-
      Instructions p.18 to 19, tables 1 to 4. Every lamp is drawn dark and states its colours. POWER is green. The
      multi-LED STATUS lamp is green, orange or red. It is blue for a changed position and white for a sensor update.
      Two flashing codes cycle colours in the table. Device-detected cycles green, orange and red. Device-lost
      alternates red and blue. Each is stated here as one colour, green and red, which is a single-colour
      approximation of the printed cycle. The CAN jack has a green and a red lamp and each Ethernet jack a green
      and an orange one. Fig. 21 shows no lit lamp. Its green #3baa39 over 2251 pixels is the ETH1 jack body. Its
      yellow #f0f130 over 287 pixels is a contact pad, in a 200 dpi render of page 18. The lit colours here are the
      library's usual values, estimated.
  outlets:
    confidence: datasheet
    note: >-
      datasheet and drawing - the table of page 1 ("PDU metered") lists DK 7979.230. It gives 3~, 16 A, 11 kW, CEE input, no C13
      and 9 IEC C19, measuring per phase, 845 mm. The circuit diagram draws three IEC C19 on each of L1, L2 and L3.
      std/c19-outlet@1. None is switched and none has a lamp. NO OUTLET NAME IS WRITTEN. No held photograph is of
      this SKU and the outlets keep their placement ids, counted from the foot.
  input:
    confidence: datasheet
    note: >-
      datasheet - dri1308088en p.1 gives 230 V per phase (400 V, 3~) and 16 A for this SKU. It gives five wires and a 3 m
      cable of type H05-VV. The circuit diagram draws the neutral to each phase group, so each outlet is line to
      neutral. The unit has a fixed cord and no inlet. `plug-rating-a` is not written, as the data sheet rates the
      unit and not the plug. The data sheet gives circuit-breakers only for 32 A versions, so none is drawn.
  mounting-buttons:
    confidence: drawing
    note: >-
      drawing - the plan view of page 10 shows two buttons 622.3 apart (dimensioned). Their plates read 98.85 to
      123.63 and 720.86 to 745.89 from the foot end, 25.2 long. The foot end of the plan view is taken to be the
      end of the front view's foot cell.
  rear:
    confidence: drawing
    note: >-
      drawing - the plan view of page 10 draws two grooves 3.0 wide and a ridge 1.55 wide with a line along its crest.
      It also draws two buttons. The grooves and the ridge run 597.3 mm, from 124.1 to 721.4 from the head end. They were read
      from the vector paths, twice. The mid circle is drawn by `mark-1`.
  phase-plates:
    confidence: photo-measured
    note: >-
      The instructions (7979204) mark the phases "L1: pink, L2: black, L3: white". They do so in the table of technical
      data and in the section on phases and slots. The data sheet (dri1308088en, p.1) says "Pink, black, white". The
      metered drawing document (dri2108029en) states neither. In photograph 78_2802 the pink reads #ee488f over 15335
      pixels and the white #fefefe over 15569 pixels. Both show as a thin margin round each outlet block. Three sample
      lines run across the strip, 81 px for the 44 mm face. They read the pink margin at 1.1 mm on the far side and 5.8
      mm on the near side. The white reads about 12 px on the far side. Each is drawn as a frame 3.5 mm wide, the mean,
      round each block of the drawing's cell lines, on a dark plate. The width is estimated. The black plate is not
      sampled and is drawn #1f1f21 as the basic family is. The photograph is of another SKU and the block edges are
      not measured.
  label-cover:
    confidence: drawing
    note: >-
      The label cover in the cord cell is the part rittal/pdu-cover-plate@1. The front view gives its rectangle. The
      side view of page 18 draws it as a trapezoid 13.2 mm proud, read at 600 and 1200 dpi. The part builds the
      sloped ends.
  plate-outline:
    confidence: drawing
    note: >-
      The controller plate steps in by 0.6 mm on each side over the last 23.0 mm of each end. An inner rim line runs
      1.4 mm inside each end section. Both are read from a 1800 dpi render of page 18. The foot end is drawn by the
      device and the head end by the controller part.
  head-cap-ribs:
    confidence: drawing
    note: >-
      The head cap in the front view of page 10 has one full-width line, 10.0 mm from the head end. It is a pair of
      lines 0.2 mm apart and is drawn as one 0.35 mm line. It was read from the page's vector paths and from a 1800 dpi
      render. The photographs are too small to count it.
  cell-lines:
    confidence: drawing
    note: >-
      The front view of page 10 draws full-height lines across the strip at the ends of each block of outlets. They are
      drawn as 0.2 mm lines, or 0.35 mm where the drawing doubles a line 0.2 mm apart. They were read from the vector
      paths. The strip has no C13, so no frame stands beside them.
  c19-frames:
    confidence: drawing
    note: >-
      Each C19 of the front view of page 10 sits in two rounded frames. The outer one is 42.1 along the strip and 34.11
      across, with R1.5 corners, and is drawn here. The inner one is 34.7 by 26.7 with R4.5 corners, 3.65 mm inside it.
      It is the mouth that std/c19-outlet@1 draws at 35.6 by 27.7, so it is not drawn twice. The outer frames were read from
      the page's vector paths and from a 1800 dpi render.
  plate-sections:
    confidence: drawing
    note: >-
      The controller plate in the front view of page 10 has five full-height section lines. They are at 74.0, 104.0, 131.0,
      142.7 and 160.0 mm from the head end of the plate. They were read from the vector paths and from a 1800 dpi render.
      The first is in rittal/pdu-controller@1 and the other four are drawn here.
  usb-port:
    confidence: photo-measured
    note: >-
      The data sheet (dri1308088en, p.1) calls the port "USB 2.0 port (USB-A)", so it is std/usb-a@1 in its
      white-tongue skin. Fig. 21 item 15 and photograph 78_2802 show a silver-white shell and no trident. The shell
      reads #c5c5c5 over 309 pixels of a 200 dpi render of page 18. It is drawn as a plate behind the port, as the device's own decor. No shared part draws a USB-A metal shell, and the white-tongue part is reused for the tongue.
  plan-circles:
    confidence: estimated
    note: >-
      The plan view of page 10 shows one small circle on the centre line, at 422.2 mm from the foot, the mid-length.
      It reads 2.4 mm across, twice at 600 dpi. Nothing says what it is. It is drawn on the back as a dark disc,
      marked as estimated.
  dcim:
    confidence: estimated
    note: >-
      the input is one power port from the cord part and each outlet a power outlet it feeds. C19 exports as the IEC
      type. The CEE plug exports as `other` with a label. The jacks export as ports of their own type.
  lifecycle:
    confidence: datasheet
    note: >-
      the maker's page lists the SKU among the metered variants. No end-of-life notice was found in the pages read.
attrs:
  physical:
    length-mm: 845
    construction: extruded aluminium
  power:
    input-ac: 230 V per phase (400 V, 3~), 16 A, 50-60 Hz
    input-plug: other
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 400
    input-current-a: 16
    capacity-kw: 11
    capacity-scope: >-
      the load the PDU can hand on, 11 kW (the "Output kW" column of the maker's table). It is not what the PDU
      draws itself
    frequency: 50-60 Hz
  environmental:
    operating-temp: +5 to +50 C
    humidity: 10 to 95 % non-condensing
  management:
    metering-scope: input
    outlet-switching: false
  compliance:
    product-compliance: CE, EAC
  lifecycle:
    eol: none-announced
chassis: {width: 44, height: 845, depth: 72.1, ru: 19, mount: rack-side, color: '#0e0e10', airflow: passive}
gaps:
- what: colour
  scope: [front, rear, left, right]
  reason: sources-disagree
  note: >-
    the two sources disagree. The data sheet says black anodised RAL 9005 ("other colours may be configured"), drawn
    as #0e0e10. The photographs of the metered family show a natural silver-grey extrusion, median #8a8a8a over
    383777 pixels of photograph 78_2802, and dark graphite plates. Black is drawn, as the data sheet states. Nine of
    the ten basic Rittal devices on main draw silver, #b9bbbe.
  wanted: a rating plate or order note naming the finish of this SKU.
- what: phase-modules
  scope: [front]
  reason: needs-drawing
  note: >-
    photograph 78_3236 shows a small module with two sockets, two arrows and dots at the foot end of one phase of
    a three-phase strip. No held document says which listed SKU carries it, so it is not drawn.
  wanted: a document that names the SKU and draws the module.
- what: can-rate
  scope: [front]
  reason: vendor-silent
  note: >-
    fig. 21 item 12 calls the jack a "CAN bus connection (daisy chain) for CMC III sensors, 24 V, 1 A". The
    instructions state no bit rate for it. It carries no speed and the search is recorded here.
  wanted: the maker's word on the CAN bus bit rate.
- what: numbering
  scope: [front]
  reason: needs-photo
  note: >-
    no photograph of this SKU shows what is printed beside the outlets. The placement ids stand.
  wanted: a photograph of the printed outlet numbers.
- what: group-plates
  scope: [front]
  reason: needs-photo
  note: >-
    the phase frames are drawn in the colours of photograph 78_2802, which is of another SKU. Their width and the
    block edges are estimated from three sample lines, and the plates touch as the drawing's cell lines give them.
  wanted: a straight-on photograph of the front with a scale.
- what: mounting-adaptor
  scope: [rear]
  reason: needs-drawing
  note: >-
    the mounting adaptor 7000.688 and the universal mounting kit are named and not drawn.
  wanted: a drawing of the adaptor.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    the end view draws the strip's section with the gland and the button and no detail. No photograph looks at an
    end or a side straight on.
  wanted: straight-on photographs of an end and a side.
