format: 1
kind: device
name: dk-7979-142
version: 0.1.0
maturity: modelled
manufacturer: Rittal
model: DK 7979.142
description: >-
  Rittal PDU basic, three-phase, 0U. A 1494 mm extruded aluminium strip, 44 mm
  wide and about 72 mm deep, that hangs on two push-button attachments on its
  back. It takes a 400 V three-phase feed, 11 kW, through a 3 m fixed cord with
  a 16 A CEE plug. It hands that on to 42 unswitched outlets in three phase groups of
  14. Each group has fourteen IEC C13. No breaker, no meter, no display, no network
  interface.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S DIMENSIONED DRAWING. Rittal, "Technical details,
      Power Distribution Unit, Basic version" (dri2108028en, 08.2023), PDF page
      23, DK 7979.142: a plan view (the back), a side view, an end view and a front
      view, with the circuit diagram below. The cell lines of the front view were
      read from a 600 dpi render of that page at the drawing's own scale: the 1494
      overall length between the two ends of the front view reads at 1.94 px per mm,
      the scale the DK 7979.175 page gives. Each cell edge is a full-height line of
      the front view. Good to about 1 mm. This page's own reading is used; no
      position is taken from another model. The offsets of an outlet in its cell
      are the DK 7979.175 model's.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, the library's way to say a part stands vertically beside an
      upright, on the two push-button attachments of the plan view (dimensioned
      1244.6 apart, 124.9 in from the two ends). The data sheet's "PDU
      mounting options" are the enclosure frame at the side of the 482.6 mm
      mounting frame (zero-U space) and the cable route (push-button attachment);
      the mounting adaptor 7000.688 is an accessory and is not drawn. `ru: 34` is
      the 1494 mm it runs, 1494 / 44.45 = 33.6; the data sheet sells it by
      minimum rack height and not by rack units.
  chassis:
    confidence: drawing
    note: >-
      drawing - length 1494 (the dimension of the front view; the table of page 1 prints
      1495), width 44 (the
      data sheet's "44 mm (1 U)"), depth 72.1 (the side view's dimension, the body
      from the front face to the back). The data sheet (dri1308088en, p.1) prints
      "PDU enclosure depth 70 mm" and the end view 109; the 109 is the body with the
      cable gland standing out of the front and the button out of the back, and the
      70 is the extrusion profile, as the DK 7979.175 model reads the same figures.
      72.1 is drawn.
  colour:
    confidence: photo-measured
    note: >-
      THE DATA SHEET AND THE PHOTOGRAPHS DISAGREE. The data sheet (dri1308088en,
      p.1) says "Aluminium, anodised in RAL 9005 (black, other colours may be
      configured)"; the photographs held of the basic family show a natural silver
      side, and none is of this SKU. The body is drawn silver as photographed
      (#b9bbbe, read by eye, estimated) and the disagreement is a gap.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of page 23, mm from the foot end: the foot cell 0 to 72.1 with the gland; a blank cell to 116.4 (44.3); phase 1, 116.4 to 533.8 (417.4); a spacer to 557.7 (23.9); phase 2, 557.7 to 975.1 (417.4); a spacer to 999.1 (24); phase 3, 999.1 to 1416.5 (417.4); a blank cell to 1477.8 (61.3); the head cap, 1477.8 to 1494, with its ribs.
      The cells are the ones this page draws, and no other page's. Each outlet stands in its cell as the
      DK 7979.175 model places it: the C13 long axis across the strip with the earth
      side toward the head, the C19 long axis along the strip with its earth slot
      toward the left of the face, the earthing-pin socket with its contact holes on
      one diagonal. Outlets count from the foot.
  outlets:
    confidence: datasheet
    note: >-
      datasheet and drawing - the table of page 1 ("PDU basic"): DK 7979.142, 3~, 16 A,
      11 kW, CEE input, 42 IEC C13, fourteen on each phase in a block of six and a block of eight, 1495 mm; the circuit
      diagram draws fourteen IEC C13 on each of L1, L2 and L3 and numbers the outlets 1 to 42.
      std/c13-outlet@1. None is switched; none has a lamp. NO OUTLET NAME IS WRITTEN: no
      held photograph is of this SKU, so what the unit prints beside an outlet is not
      known, and the outlets keep their placement ids, counted from the foot.
  input:
    confidence: datasheet
    note: >-
      datasheet - dri1308088en p.1: "Input voltage range (L - N) 230 V (400 V,
      3~), 50 - 60 Hz", "Input current 16 A/32 A (depending on product variant)",
      "No. of wires 3/5", "Connection cable type H05-VV", "Length of connection
      cable 3m"; the table: 3~, 16 A, 11 kW, input CEE. The circuit diagram draws
      the neutral to each phase group, so each outlet is line to neutral:
      `input-wiring: wye`. The unit has a fixed cord and no inlet. `plug-rating-a` is
      not written: the data sheet rates the unit, not the plug.
  breakers:
    confidence: datasheet
    note: >-
      datasheet - dri1308088en p.1: "No. of circuit-breakers 2 (single-phase) or 6
      (3-phase) with 32 A version"; the table prints this SKU at 16 A and the
      sheet's feature table has the breaker "only for 32 A PDU versions", so a 16 A
      version has none. No breaker is drawn and none is stated.
  mounting-buttons:
    confidence: drawing
    note: >-
      drawing - the plan view of page 23: two buttons 1244.6 apart (dimensioned),
      their centres 124.9 and 124.5 in from the two ends of the 1494
      (read from the two extension lines of the dimension); plate 25.2 along the strip.
      The foot end of the plan view is taken to be the end of the front view's foot
      cell.
  rear:
    confidence: drawing
    note: >-
      drawing - the plan view draws the same two long grooves, ridge and two buttons
      as the DK 7979.175 model reads, from 2.6 in of each end.
  logo:
    confidence: estimated
    note: >-
      no photograph of this SKU is held; the RITTAL mark of the basic family's
      renders is not drawn.
  dcim:
    confidence: estimated
    note: >-
      the input is one power port from the cord part and each outlet a power
      outlet it feeds. C13 and C19 export as the IEC types; the CEE plug and the
      earthing-pin socket export as `other` with a label, because no upstream type
      for either has been read from a held source.
  lifecycle:
    confidence: datasheet
    note: >-
      the maker's page lists the SKU among the 27 basic variants; no end-of-life
      notice was found in the pages read.
attrs:
  physical:
    length-mm: 1494
    construction: extruded aluminium
  power:
    input-ac: 230 V per phase (400 V, 3~), 16 A, 50-60 Hz
    input-plug: other
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 400
    input-current-a: 16
    capacity-kw: 11
    capacity-scope: >-
      the load the PDU can hand on, 11 kW (the "Output kW" column of the maker's
      table). It is not what the PDU draws itself, which the basic version does
      not state
    frequency: 50-60 Hz
  environmental:
    operating-temp: +5 to +50 C
    humidity: 10 to 95 % non-condensing
  management:
    metering-scope: none
    outlet-switching: false
  compliance:
    product-compliance: CE, EAC
  lifecycle:
    eol: none-announced
chassis: {width: 44, height: 1494, depth: 72.1, ru: 34, mount: rack-side, color: '#b9bbbe', airflow: passive}
gaps:
- what: colour
  scope: [front, rear, left, right]
  reason: sources-disagree
  note: >-
    the data sheet says black anodised RAL 9005 ("other colours may be configured");
    the photographs of the basic family show a natural silver extrusion and none is
    of this SKU. Silver is drawn.
  wanted: a rating plate or order note naming the finish of this SKU.
- what: length
  scope: [front, rear, left, right]
  reason: sources-disagree
  note: >-
    the table prints 1495 and the drawing dimensions 1494. The drawing is used
    because every position is read off it.
  wanted: the maker's word on which is the tolerance.
- what: numbering
  scope: [front]
  reason: needs-photo
  note: >-
    no photograph of this SKU shows what is printed beside the outlets; no name is
    taken, so the placement ids stand.
  wanted: a photograph of the printed outlet numbers.
- what: block-order
  scope: [front]
  reason: sources-disagree
  note: >-
    the circuit diagram draws eight C13 and then six on each phase; the front view
    draws a block of six and then a block of eight from the cable foot. The front
    view is used because every position is read off it.
  wanted: the maker's word on the order of the two blocks.
- what: group-plates
  scope: [front]
  reason: needs-photo
  note: >-
    the phase groups are drawn as full-width plates in the colours of the DK 7979.175
    render (the data sheet: L1 pink, L2 black, L3 white); no photograph of this SKU is
    held, the blank cells and the head cap are drawn in that model's end-cap colour,
    and the narrow margin each plate may leave at its edges is not measured.
  wanted: a straight-on photograph of the front with a scale.
- what: mounting-adaptor
  scope: [rear]
  reason: needs-drawing
  note: >-
    the mounting adaptor 7000.688 and the universal mounting kit are named and not
    drawn; the attachment on the enclosure frame at the side of the 19" frame is
    named and not dimensioned.
  wanted: a drawing of the adaptor.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    the end view draws the strip's section with the gland and the button and no
    detail; no photograph looks at an end or a side straight on.
  wanted: straight-on photographs of an end and a side.
