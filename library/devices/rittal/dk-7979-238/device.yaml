  control: {term: Controller, role: furniture, index-origin: 1}
  ethernet: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 1g}, description: 'ETH2 and ETH1, the two redundant network jacks'}
  serial: {term: Port, role: management, index-origin: 1, description: 'the RS232 serial jack'}
  can-bus: {term: Port, role: management, index-origin: 1, description: 'the CAN bus jack for CMC III sensors'}
