  outlets-l2: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 10 outlets of phase L2, counted from the cable foot: six IEC C13 and four IEC C19'}
  outlets-l3: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 10 outlets of phase L3, counted from the cable foot: six IEC C13 and four IEC C19'}
