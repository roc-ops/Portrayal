  signal: {term: Terminal, role: management, index-origin: 1, mixed: 'the digital input and the alarm relay output, two small pluggable headers'}
  lamps: {term: Lamp, role: indicator, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
