format: 1
kind: device
name: dk-7979-235
version: 0.1.0
maturity: modelled
manufacturer: Rittal
model: DK 7979.235
description: >-
  Rittal PDU metered, three-phase, 0U. A 1094 mm extruded aluminium strip, 44 mm wide and about 72 mm deep, that
  hangs on two push-button attachments on its back. It takes a 400 V three-phase feed, 11 kW, through a 3 m fixed
  cord with a 16 A CEE plug. It hands that on to 21 unswitched outlets in three phase groups of seven, each with six
  IEC C13 and one IEC C19. The controller between phase 2 and phase 3 measures each phase. It has a display, two
  Ethernet jacks, a CAN bus jack, an RS232 jack and a USB port. No breaker and no switching.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S DIMENSIONED DRAWING. Rittal, "Technical details, Power Distribution Unit, Metered
      version" (dri2108029en, 08.2023), PDF page 15, DK 7979.235. The page has a plan view, a side view, an end view
      and a front view, with the circuit diagram below. The cell lines of the front view were read from a 600 dpi
      render at the drawing's own scale. The 1094 overall length reads 1.938 px per mm. Each cell edge is a
      full-height line. Good to about 1 mm. The outlets sit in their housings as the DK 7979.138 model places them.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, the library's way to say a part stands vertically beside an upright. It hangs on the two
      push-button attachments of the plan view, dimensioned 933.45 apart. The data sheet's "PDU mounting options"
      are the enclosure frame at the side of the 482.6 mm mounting frame and the cable route. The mounting adaptor
      7000.688 is an accessory and is not drawn. `ru: 25` is the 1094 mm it runs, 1094 / 44.45 = 24.6.
  chassis:
    confidence: drawing
    note: >-
      drawing - length 1094 (the dimension of the front view; the table of page 1 prints 1095). Width is 44 (the data
      sheet's "44 mm (1 U)"), depth 72.1 (the side view's dimension). The data sheet (dri1308088en, p.1) prints
      "PDU enclosure depth 70 mm" and the end view 109. The 109 is the body with the cable gland standing out of the
      front and the button out of the back. The 70 is the extrusion profile. 72.1 is drawn, as on the basic devices.
  colour:
    confidence: datasheet
    note: >-
      The data sheet (dri1308088en, p.1) says "Aluminium, anodised in RAL 9005 (black, other colours may be
      configured)", so the body is drawn black. The screen value #0e0e10 is the usual one for RAL 9005 and is
      estimated. The two photographs of the metered family show a natural silver-grey extrusion, median #8a8a8a over
      383777 pixels of photograph 78_2802. They also show dark graphite plates, #2b2b2c over 301257 pixels. Colours are a later
      touch. The gap below names both.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of page 15, mm from the foot end. The foot cell is 0 to 72.1 with the gland ring.
      The cord cell runs to 195.9 with a flat cover plate in it. Phase 1 is 195.9 to 421.86, phase 2 is 421.86 to
      647.89, and the controller runs to 847.59. Phase 3 is 847.59 to 1073.62 and the head cap runs to 1094. Each
      phase is a block of six C13 cells, 180.4 long, and one C19 cell, 45.6 long. Outlets count from the foot. The
      C13 long axis is across the strip and the C19 long axis along it.
  hidden-cells:
    confidence: estimated
    note: >-
      The front view draws the cord and its plug across the first phase group. Two C13 housings show beside the cord
      and the other four lie under the plug. Their lines are estimated from the blocks of six in phase 2 and phase 3,
      180.4 long. The block ends at the 376.3 line, 180.4 from the cord cell.
  controller:
    confidence: drawing
    note: >-
      drawing - the controller cell is 647.89 to 847.59 of page 15, between phase 2 and phase 3. Its parts are the
      PDU controller plate and two RJ45 jacks (ETH2 and ETH1). The rest are an RJ12 jack (RS232), an RJ45 jack (CAN bus), a USB-A
      port and two small headers. They are read as the DK 7979.238 page reads them, and the cell lines agree to
      0.3 mm. Rittal, "Montage-, Installations- und Betriebsanleitung" for the PDU metered (7979204), fig. 21 names
      each of them. The data sheet calls the RS232 port RJ12 and the library's `rj11` key is the same six-position
      body. Each jack is drawn unrotated with its pins up.
  lamps:
    confidence: estimated
    note: >-
      Instructions p.18 to 19, tables 1 to 4. Every lamp is drawn dark and states its colours. POWER is green. The
      multi-LED STATUS lamp is green, orange or red. It blinks for the flashing codes, which cycle colours in the table and are shown here in one colour. It is blue for a changed
      position and white for a sensor update. The CAN jack has a green and a red lamp and each Ethernet jack a
      green and an orange one. Fig. 21 shows no lit lamp. Its green #3baa39 over 2251 pixels is the ETH1 jack body. Its yellow
      #f0f130 over 287 pixels, in a 200 dpi render of page 18. All lit colours here are the library's own
      usual values, estimated.
  outlets:
    confidence: datasheet
    note: >-
      datasheet and drawing - the table of page 1 ("PDU metered") lists DK 7979.235. It gives 3~, 16 A, 11 kW, CEE input, 18 IEC
      C13 and 3 IEC C19, measuring per phase, 1095 mm. The circuit diagram draws six IEC C13 and one IEC C19 on each
      of L1, L2 and L3. std/c13-outlet@1 and std/c19-outlet@1. None is switched and none has a lamp. NO OUTLET NAME
      IS WRITTEN. No held photograph is of this SKU and the outlets keep their placement ids, counted from the foot.
  input:
    confidence: datasheet
    note: >-
      datasheet - dri1308088en p.1 gives 230 V per phase (400 V, 3~) and 16 A for this SKU. It gives five wires and a 3 m
      cable of type H05-VV. The circuit diagram draws the neutral to each phase group, so each outlet is line to
      neutral. The unit has a fixed cord and no inlet. `plug-rating-a` is not written, as the data sheet rates the
      unit and not the plug. The data sheet gives circuit-breakers only for 32 A versions, so none is drawn.
  mounting-buttons:
    confidence: drawing
    note: >-
      drawing - the plan view of page 15 shows two buttons 933.45 apart (dimensioned). Their plates read 67.86 to
      92.63 and 1000.86 to 1025.88 from the foot end, 25.2 long. The foot end of the plan view is taken to be the
      end of the front view's foot cell.
  rear:
    confidence: drawing
    note: >-
      drawing - the plan view draws the same two long grooves, ridge and two buttons as the basic devices, from 2.6
      in of each end.
  phase-plates:
    confidence: photo-measured
    note: >-
      The instructions (7979204) mark the phases "L1 pink, L2 black, L3 white". In photograph 78_2802 the pink plate reads #ee488f over 15335
      pixels and the white plate #fefefe over 15569 pixels. The black plate is not sampled and is drawn #1f1f21 as
      the basic family is. The photograph is of another SKU and the plate edges are not measured.
  dcim:
    confidence: estimated
    note: >-
      the input is one power port from the cord part and each outlet a power outlet it feeds. C13 and C19 export as
      the IEC types. The CEE plug exports as `other` with a label. The jacks export as ports of their own type.
  lifecycle:
    confidence: datasheet
    note: >-
      the maker's page lists the SKU among the metered variants. No end-of-life notice was found in the pages read.
attrs:
  physical:
    length-mm: 1094
    construction: extruded aluminium
  power:
    input-ac: 230 V per phase (400 V, 3~), 16 A, 50-60 Hz
    input-plug: other
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 400
    input-current-a: 16
    capacity-kw: 11
    capacity-scope: >-
      the load the PDU can hand on, 11 kW (the "Output kW" column of the maker's table). It is not what the PDU
      draws itself
    frequency: 50-60 Hz
  environmental:
    operating-temp: +5 to +50 C
    humidity: 10 to 95 % non-condensing
  management:
    metering-scope: input
    outlet-switching: false
  compliance:
    product-compliance: CE, EAC
  lifecycle:
    eol: none-announced
chassis: {width: 44, height: 1094, depth: 72.1, ru: 25, mount: rack-side, color: '#0e0e10', airflow: passive}
gaps:
- what: colour
  scope: [front, rear, left, right]
  reason: sources-disagree
  note: >-
    the data sheet says black anodised RAL 9005 ("other colours may be configured"). The photographs of the
    metered family show a natural silver-grey extrusion and dark graphite plates. Black is drawn.
  wanted: a rating plate or order note naming the finish of this SKU.
- what: phase-modules
  scope: [front]
  reason: needs-drawing
  note: >-
    photograph 78_3236 shows a small module with two sockets, two arrows and dots at the foot end of one phase of
    a three-phase strip. No held document says which listed SKU carries it, so it is not drawn.
  wanted: a document that names the SKU and draws the module.
- what: can-rate
  scope: [front]
  reason: vendor-silent
  note: >-
    fig. 21 item 12 calls the jack a "CAN bus connection (daisy chain) for CMC III sensors, 24 V, 1 A". The
    instructions state no bit rate for it. It carries no speed and the search is recorded here.
  wanted: the maker's word on the CAN bus bit rate.
- what: numbering
  scope: [front]
  reason: needs-photo
  note: >-
    no photograph of this SKU shows what is printed beside the outlets. The placement ids stand.
  wanted: a photograph of the printed outlet numbers.
- what: group-plates
  scope: [front]
  reason: needs-photo
  note: >-
    the plates are drawn in the colours of photograph 78_2802, which is of another SKU. The edges of each plate
    are not measured, and the plates touch as the drawing's cell lines give them.
  wanted: a straight-on photograph of the front with a scale.
- what: hidden-cells
  scope: [front]
  reason: needs-drawing
  note: >-
    the front view draws the cord and its plug across the first phase group, so the cell lines of four of its C13
    are hidden. The block is set from the blocks of six that show.
  wanted: a front view with the cord drawn away.
- what: mounting-adaptor
  scope: [rear]
  reason: needs-drawing
  note: >-
    the mounting adaptor 7000.688 and the universal mounting kit are named and not drawn.
  wanted: a drawing of the adaptor.
- what: ends
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    the end view draws the strip's section with the gland and the button and no detail. No photograph looks at an
    end or a side straight on.
  wanted: straight-on photographs of an end and a side.
