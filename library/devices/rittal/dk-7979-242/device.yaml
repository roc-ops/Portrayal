  outlets-l2: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 14 IEC C13 outlets of phase L2, counted from the cable foot: a block of eight and a block of six'}
  outlets-l3: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 14 IEC C13 outlets of phase L3, counted from the cable foot: a block of eight and a block of six'}
