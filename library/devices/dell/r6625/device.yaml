# SOURCES:
# Dell's R6625 Installation and Service Manual (ISM), Technical Guide (TG) and
# Spec Sheet, as Dell publishes them; nothing else. The three are cited in
# `references` with their sha256, and every figure below says which table or
# figure of which it came from.
# STATE:
# DONE: six fronts - 10 x 2.5 inch, 8 x 2.5 inch with the Smart Flow vent,
# 4 x 3.5 inch, no backplane, 14 and 16 x EDSFF E3.S - as variant views; the
# rear for riser configurations 1-7 of ISM table 101 (34 builds, plus a
# populated example); the top view - system board, heatsinks, 24 DIMM sockets,
# air shroud, fans and bracket, covers, and the plan projections of the seated
# supplies, risers, OCP card, LOM, rear I/O board, boot module and upper front
# drives; estimated bottom and sides.
# NOT DONE: riser configuration 0 (no riser), the paddle-card configurations
# 8-10, Direct Liquid Cooling, the -48 V DC, 277 V and 1800 W supplies, the
# LCD bezel (see the gaps).
format: 1
kind: device
name: r6625
version: 0.1.2
maturity: draft
manufacturer: Dell
model: PowerEdge R6625
description: >-
  1U one- or two-socket AMD EPYC rack server, 16th generation. Up to ten 2.5
  inch front drive bays, or eight with a Smart Flow vent, four 3.5 inch,
  fourteen or sixteen EDSFF E3.S, or none. Two 60 mm power supplies stand at
  opposite ends of the rear. It has up to three PCIe slots, an OCP NIC 3.0
  slot, an optional LOM card and a rear BOSS-N1 boot module.
profile: server
provenance:
  chassis:
    confidence: datasheet
    note: >-
      datasheet - ISM table 10 and TG table 28 (the same figures): width 434.0
      between the ears (Xb) and 482.0 across them (Xa), height 42.8 (Y). DEPTH
      773.5 is the front face to the rear wall: the ears sit 22.0 behind the
      front face without the bezel (Za, 35.84 with it) and the rear wall 751.48
      behind the ears (Zb, for the 4, 8 and 10 drive builds), 773.48 in all. The
      PSU handles stand a further 35.57 proud (Zc, 787.05 ear to handle), which
      is the spec sheet's 809.05 without the bezel (22.0 + 787.05), and its
      822.89 with the bezel is 13.84 more. The 0-drive build is 50.8 shorter
      (Zb 700.7) and is not this depth; see the front-nobp note. Weight 20.4 kg
      fully populated and 15.8 kg without drives and supplies (ISM table 11).
      The R6625 shares the 16th-generation 1U chassis of the R660, whose
      Dell-published figures are the same to 0.01 mm.
  front-face:
    confidence: drawing
    note: >-
      THE EARS CARRY THE CONTROL PANELS, SO THEY ARE DRAWN - ISM tables 1 to 5
      list the left control panel (system health, system ID and status LEDs) and
      the right control panel (power button, USB, iDRAC Direct) as front
      features, and both figures draw them in the ears outboard of the drives.
      The front is therefore the 482.6 rack face.
  gate-1:
    confidence: drawing
    note: >-
      Gate 1 on ISM figures 1 to 3, extracted at 300 dpi (1650 x 372 px): the
      silhouette reads 1577 x 139 px, an aspect of 11.35 against 482.6 / 42.8 =
      11.28 - 0.6% - so the figures are drawn ear to ear at true scale, 3.268
      px/mm across, and every front position here is read off them. The rear
      figures (6 to 9) draw the 434 body: 1401 x 138 px against 434 / 42.8 =
      10.14 (0.1%), 3.225 px/mm. The two E3.S fronts (figures 4 and 5, 1602 x
      410 px) are drawn smaller, 2.878 px/mm, and their vertical scale is not
      trusted (the silhouette reads 118 px for 42.8 mm, 2.757 px/mm), so their
      rows are carried from the 2.5 inch fronts' row pitch (see e3s-fronts).
  the-r660-agrees:
    confidence: drawing
    note: >-
      WHERE A POSITION IS CARRIED FROM dell/r660, IT WAS CHECKED AGAINST THIS
      DOCUMENT FIRST. The R6625's front is the R660's: laying dell/r660's
      ear, vent-strip, drive-column and right-panel coordinates over ISM figure
      3 at 3.268 px/mm, and its E3.S bay grid over figure 5, puts every edge
      on its feature to within about 1.2 mm, the resolution of the figure; laid
      over the rear figures 6 and 7 at 3.225 px/mm, its supply, riser, OCP,
      LOM, rear I/O and boot bays land the same way, to the same 1.5 mm.
      The R660 numbers are finer than these figures' resolution, so they are
      used where the overlay agrees, and the R6625's own reading is used where
      it does not (the 3.5 inch bays and the VGA connector of that front, and
      the top view's board, heatsinks, DIMM sockets, fans and shroud).
  drive-bays-sff:
    confidence: drawing
    note: >-
      drawing - ISM figures 2 and 3. Five columns 73.0 wide at x 32.5, 115.35,
      198.2, 281.1 and 363.95 (an 82.85 pitch) and two rows 15.3 tall at y 7.71
      and 24.21: the carrier, common/drive-carrier-25@2, laid flat with rotate
      270. The ISM's drives are standard 2.5 inch carriers, and the figure's
      carriers (rails 7.3 to 22.4 and 23.7 to 38.3 mm) fit the rows.
  drive-numbering:
    confidence: drawing
    note: >-
      drawing - the service label of ISM figure 20 numbers the 10-bay build 0 and
      1, 2 and 3, 4 and 5, 6 and 7, 8 and 9 (upper bay even, lower odd, column
      by column), and figure 21 numbers the 8-bay build 0-3 then 4-7 around the
      vent. The front figures themselves resolve no printing on the dividers, so
      none is drawn: the ids and `rel-pos` carry Dell's numbering.
  drive-default:
    confidence: datasheet
    note: >-
      EVERY BAY DEFAULTS TO A BLANK: Dell publishes no default drive count, and
      the ISM requires blanks in every empty slot for cooling (ISM, "Drive
      blank"). A populated machine is a configuration.
  lff-front:
    confidence: drawing
    note: >-
      drawing - ISM figure 1 (4 x 3.5 inch, 10 TB SATA carriers). Four columns
      of common/drive-carrier-35@1, which is drawn wide (105.5 x 26.9) and so
      stands un-rotated: x 29.2, 136.4, 243.6 and 350.8 (a 107.2 pitch, the
      R740xd's 3.5 inch column pitch of 107.208, read here from the lamp panels
      and the rails' ends at 3.268 px/mm to about 1 mm) and y 13.7. The rails of
      the first and fourth carriers end at x 130.7 and 450.0 in the figure. The VGA connector is NOT in the right
      control panel on this front: figure 1 draws it in the top strip above
      the fourth drive (callout 3), a horizontal DE-15 at x 395.6, y 2.2 with
      the monitor mark at 418.3 to its right, on a textured plate 380.9 to
      430.0 wide. The right control panel and the Express Service Tag are the
      2.5 inch fronts'. The top strip is a grille of cells on a 5.46 pitch in
      five runs (x 59.5, 182.0, 288.5, 339.5 and 431.5), with a latch plate
      carrying a slot at x 40.8 and another at 169.6 and two pairs of small
      square latches at 281.1 and 331.4, all read off the figure at 6.2 px/mm
      and good to about 0.7 mm. The cell height, 8.2, is the figure's opening
      (y 2.7 to 10.9).
  lff-numbering:
    confidence: estimated
    note: >-
      estimated - no figure held prints the 3.5 inch bays' numbers (ISM figures
      20 and 21 are the 2.5 inch builds'). Dell numbers the 2.5 inch bays 0 and
      up from the left, so the ids run drive-0 to drive-3 left to right; nothing
      is drawn on the face. See the lff-bay-numbers gap.
  vent-strip:
    confidence: drawing
    note: >-
      drawing - the 2.5 inch fronts' row of 4.05 x 2.33 slots on a 5.46 pitch
      along the top edge, y 3.08, in groups of three and six: laid over ISM
      figure 3 at 2x, each of the fifty-three slots lands on a dark opening of
      the figure's strip. The master-style gaps where the figure draws a slot
      lighter (closed) are left out.
  right-side:
    confidence: drawing
    note: >-
      drawing - ISM figures 2 and 3: the VGA module is the plate at x
      436.95..457.15 carrying a vertical DB-15 and its monitor mark, and the
      right control panel in the ear carries the power button at the top, a
      vertical USB-A, and the iDRAC Direct micro-AB USB with its lamp below
      (ISM tables 1 to 5, item 4 and 3; the USB trident and the iDRAC Direct
      mark are in the figures). The parts seated there are the library's own,
      dell/power-button-14g@1 and the std/ ports, centred on the positions the
      overlay confirms.
  fronts:
    confidence: drawing
    note: >-
      SIX FRONTS, EACH ITS OWN VIEW bound by `configurations.<name>.views`, as
      the R660's are. All share the ears, both control panels and the right
      panel. ISM figures 1 to 5 and 20 draw them: 10 x 2.5 inch (the default
      `front`, figure 3); 8 x 2.5 inch with the Smart Flow vent (front-sff8sf,
      figures 2 and 21), the 10-drive front less the middle column, which is a
      vent plate 78.25 x 33.26 with eight openings, the dividers numbering 0-3
      then 4-7; 4 x 3.5 inch (front-lff4, figure 1); no backplane (front-nobp,
      figure 20); and 14 and 16 x EDSFF E3.S (front-e3s14 and front-e3s16,
      figures 4 and 5). ISM table 74 lists five backplanes: 4 x 3.5 inch SAS or
      SATA, 8 x 2.5 inch NVMe, 10 x 2.5 inch, and 14 and 16 x E3.S.
  front-nobp:
    confidence: estimated
    note: >-
      estimated - the no-backplane front is listed (ISM table 10 and TG table
      11 give the 0-drive build; ISM figure 20 draws its front) but Dell draws
      it only as the schematic of the service label, 1.81 px/mm, which resolves
      three grilles at the left (x 37.7 to 93.2, 121.3 to 176.6 and 204.7 on),
      a wide grille at the upper right (282.3 to 432) and two lower-right
      blocks, each within about 3 mm of the dell/r660 front this model carries
      its grille panels and hole pitch from (5.47 and 5.69 by 5.42, 4.05 x 4.03
      holes). The holes are therefore a carried pitch, not a reading. That
      chassis is 50.8 shorter (ISM table 10, 700.7 ear to rear wall) and this
      device has one depth.
  e3s-fronts:
    confidence: drawing
    note: >-
      drawing - ISM figures 4 and 5 (2.878 px/mm). Each carrier is found by its
      orange chevrons: columns at x 36.3, 117.3, 280.3 and 361.3, each carrier
      77.65 wide and 7.75 tall, with the centre vent at 197.5 to 276.5 -
      dell/r660's grid laid over figure 5 lands on every carrier, the vent and
      the last column's end (which, as there, reaches the VGA plate's edge).
      THE ROWS ARE NOT READ: the figures' vertical scale is not trusted (see
      gate-1), so the rows' 9.51 pitch (3.17, 12.68, 22.29 and 31.8) is
      carried from the R660 and checked only to the 1.2 mm the overlay shows.
      The 14-drive front's last column ends in a two-slot filler below its
      first two carriers, as figure 4 draws it. The top vent strip is left off:
      neither figure draws one over E3.S carriers.
  e3s-numbering:
    confidence: estimated
    note: >-
      estimated - the figures resolve no printing on the E3.S fronts' lower
      lip, and no other document held numbers the bays. The ids run e3s-0 to
      e3s-15 down each column in turn (0-3 under the first, 4-7, 8-11, 12-15),
      the order dell/r660's photographed lip prints; nothing is drawn on the
      face. See the e3s-bay-numbers gap.
  top:
    confidence: drawing
    note: >-
      drawing - ISM figure 11 (the interior from above, a straight-on render,
      1557 x 1918 px) read at 2.189 px/mm (the 434.0 body at 950 px; the
      ear-to-ear front at 1057 px agrees to 0.1%) with a 10 mm grid laid over
      it, cross-checked against ISM figures 10 and 101 and the technical
      guide's interior render. REAR AT y=0, FRONT AT y=773.5 - the library's
      plan convention; plan x runs left to right as the body is seen from above,
      so processor 2 and the B memory slots are on the left. The system board
      is the PCB's outline (421 x 341.7, narrower at the rear); the two
      heatsinks 92.7 x 144.3 over the AMD SP5 sockets; the 24 DDR5 sockets
      (twelve per processor: six at the left, twelve between the heatsinks, six
      at the right) named from the memory label (ISM figure 101, tables 95 and
      96); the four dual fan modules and their bracket (the R660's parts: the
      ISM's cooling-fan table gives the same four dual-rotor modules), the air
      shroud, the system cover and the drive backplane cover. SEATED MODULES
      PROJECT INTO THIS VIEW through their rear or front bay's `plan:`: the
      supplies (dell/psu-60mm-plan@1), the BOSS-N1 module, the OCP card, the
      LOM card, the rear I/O board, the risers and the upper row of front 2.5
      inch drives, at the R660's positions, which ISM figure 11 confirms for
      the supplies, risers 2 and 3 and the boot module (see the-r660-agrees:
      the rear faces of the two machines coincide). A blank seats no plan, so
      the default build shows the two supplies and the two risers. NOT YET IN
      THIS VIEW: the cards, the drive backplane, the cabling and the PERC
      modules, and the Direct Liquid Cooling module.
  top-dimm-sockets:
    confidence: drawing
    note: >-
      drawing - ISM figure 101 and tables 95 and 96, read with figure 11: the
      sockets (with their latches) run from plan y 260.3 to 414.7, 154.4 long;
      the module is the JEDEC DDR5 RDIMM's 133.4 inside it, centred, so each
      bay is common/dimm-plan@1's 3.8 x 133.4 at y 270.8 and 1.35 in from its
      socket's left edge. Pitch 8.3 (8.32 left, 8.28 middle, 8.30 right: the
      figure resolves about 0.1). Socket left edges 17.0 + 8.32k at the left
      (processor 2's B11 B7 B9 B3 B5 B1), 168.55 + 8.28k in the middle (B2 B6 B4
      B10 B8 B12, then processor 1's A11 A7 A9 A3 A5 A1) and 369.5 + 8.30k at the
      right (A2 A6 A4 A10 A8 A12). The names are read from figure 101's
      leader lines, which stair-step so the lowest (or, at the rear, highest)
      label belongs to the outermost socket of its run.
  top-fans:
    confidence: drawing
    note: >-
      drawing - the four dual fan modules' housings in figure 11 read x 24.4 to
      109.6, 111.5 to 198.0, 237.0 to 322.3 and 323.8 to 410.0 (about 85.5 wide,
      plan y 471.8 at the rear edge to 558 at the front of the orange handle).
      The part is dell/fan-1u-16g@1, 82.0 wide, its rotors only, so each is
      centred on its housing: x 26.0, 113.75, 238.65 and 325.9, y 478.0, good to
      about 2 mm. The fan bracket and the covers are carried from the R660 (the
      bracket's front edge at plan y 558.8 is the housings' front edge, the
      backplane cover's rear edge at 585.3 the technical guide's cover edge, to
      about 1 mm).
  bezel:
    confidence: drawing
    note: >-
      DRAWN FITTED, as on the R660, and taken off in the viewer: the optional
      security bezel (dell/bezel-1u-16g@1; the spec sheet and ISM list a
      security bezel and an LCD bezel, and the ISM's "Removing the front bezel"
      shows the same moulding) covers the body between the ears, and `for:`
      names the bays and parts behind it. Its openings are holes, so the drives
      show through. 35.84 ear to front with it, 22.0 without (ISM table 10).
      The LCD bezel is not modelled.
  sides-and-bottom:
    confidence: estimated
    note: >-
      estimated - no figure held shows the bottom or either side; their folded
      edges and the rail land are plausible shapes at plausible sizes, drawn so
      the faces are not blank, and marked estimated where drawn.
  rear:
    confidence: drawing
    note: >-
      drawing - ISM figures 6 to 9 and TG figure 6, the 434 body at 3.225
      px/mm. THE REAR MASTERS' FRAME IS THE R660'S: dell/r660's boss, supply,
      OCP, LOM, rear I/O and riser bays laid over figure 6 and over figure 7
      land on the figure's boot module, supplies, OCP bracket, LOM and iDRAC
      RJ45 openings, USB stack, VGA shell and riser windows (see the-r660-agrees).
      Positions: PSU 1 at x 33.06 and PSU 2 at 367.91, 59.8 wide; the OCP bay
      164.95 wide 71.8; the LOM window 110.59 to 153.17 and the rear I/O window
      250.5 to 335.87, y 24.71 to 40.64; the system ID button 252.43.
  rear-ism-numbering:
    confidence: datasheet
    note: >-
      datasheet - THE ISM NUMBERS THE RISERS TWICE. Its rear-view tables (6 to 9)
      call the left-hand riser "PCIe expansion card riser 1" and the right-hand
      "riser 2", while its expansion-card section (figures 115 to 124, tables
      100 to 112) calls the left one riser 2 (slots 1 and 2) and the right one
      riser 3 (slot 3), with risers 1 and 4 the full-height pair, and the
      risers' names (R2A, R3A, R2P, R3P, R1P, R4P, R2Q, R2S, R3S) agree with
      the second. The riser section governs here, as on the R660: the left riser
      is riser 2, the right riser 3.
  rear-boss-bay:
    confidence: drawing
    note: >-
      drawing - the boot module bay, 29.9 x 38.9 at x 0.85, the R660's, which
      ISM figure 6 overlays to about 1.5 mm (the BOSS-N1 module and its blank).
  rear-lom-and-io:
    confidence: drawing
    note: >-
      drawing - the LOM card and the rear I/O board are bays, each the window the
      figure shows - x 110.59 to 153.17 and 250.50 to 335.87, y 24.71 to 40.64 -
      and each module carries its own connectors. ISM figure 182 removes "the
      LOM card and rear I/O board" and figure 186 the MIC card: they are
      field-replaceable, as on the R660.
  rear-risers:
    confidence: drawing
    note: >-
      drawing - the riser bays are each riser's extent: riser 2 107.0..270.6 and
      riser 3 270.6..362.6, read on figures 6 and 7 (the overlay lands the riser
      windows to 1.5 mm), riser 3 listed before riser 2 so riser 2's cage covers
      the end of slot 3's bracket tip. Riser 2Q 107.0..293.5 and risers 1 and 4
      107.0..227.6 and 227.6..362.6 are the R660's, carried because no
      straight-on R6625 figure draws those risers (ISM figures 115 to 124 show
      them in isometric); all are at y 2.2, 19.8 tall. Figure 6 (R2A + R3A) and
      figure 7 (R3P with the rear drive module) are the only straight-on rears
      besides figure 9's E3.S module; the other risers' faces are the shared
      16th-generation risers' (see the riser-faces-shared gap).
  rear-slot-numerals:
    confidence: drawing
    note: >-
      drawing - the slot numbers are printed on the riser cages, not the
      chassis, so they are drawn by the cages and move with the configuration.
      ISM figures 116 to 124 number the slots: riser 1P slot 1, riser 2Q slots
      1 and 2, riser 2A slots 1 and 2, riser 2P slots 1 and 2, riser 3A and 3P
      slot 3, riser 4P slot 2, riser 3S slot 3, riser 2S slot 1 (TG figure 18
      prints riser 3A's as "Slot 2", which is a typo against its own table 18).
  rear-drives:
    confidence: drawing
    note: >-
      drawing - riser configuration 5's two rear 2.5 inch drive bays (ISM figure
      7, TG figure 7): 79.25 x 18.0 at x 111.12 and 190.83, y 2.1, laid flat as
      at the front and carried from the R660, whose bays figure 7 confirms to
      about 1 mm (the left carrier's body 109.7..182.7, the right 188.8..263.0).
      They seat the same common/drive-carrier-25@2 as the front; the rear
      module's bay is larger than the carrier, so the carrier sits centred with
      the module's frame round it. Riser configuration 6's two rear E3.S drives
      are in riser 2S (ISM figure 9, TG figure 8).
  rear-power:
    confidence: datasheet
    note: >-
      chassis.power is `ac`: every supply this device accepts is an AC mixed-mode
      unit (800, 1100 and 1400 W, C14: ISM table 13 and 14). The 1100 W -48 V DC,
      the 1400 W 277 V and 336 V DC and the 1800 W (C15) supplies are not
      modelled, and when they are, power moves onto per-build configurations.
      700 W, which the R660 has, is not in the R6625's tables and is not
      accepted.
attrs:
  physical:
    ru: 1
    weight-max-kg: 20.4
  lifecycle: {eol: none-announced}
chassis:
  width: 434.0
  height: 42.8
  depth: 773.5
  ru: 1
  power: ac
  color: '#2f3439'
  edge: '#1d2125'
  silk: '#c9ced3'
gaps:
  - what: riser-configuration-0-rear-unmodelled
    scope: [rear, top]
    reason: needs-photo
    note: >-
      ISM table 101 and TG table 17 list configuration 0 (no riser, no PCIe
      slots), but the one figure of it - TG figure 6, "Rear view of the system
      with no risers" - draws the three-slot rear of figure 6 with its slot
      fillers and not a blank plate across the riser band, so it cannot be
      told from configuration 1 with empty slots. The R660's no-riser rear is
      drawn from a sibling's figure of a different plate; this model does not
      borrow it. ISM figures 126 to 129 remove "riser blanks" 1 to 4 without a
      straight-on view.
    wanted: >-
      a straight-on rear photograph or drawing of an R6625 with no risers fitted
  - what: riser-configurations-8-9-10-unmodelled
    scope: [rear]
    reason: needs-drawing
    note: >-
      ISM table 101 lists configuration 8 (R2A + R4 E3 paddle card, two
      processors) and tables 111 and 112 give 9 (R2A + R4-SCM G5x4 paddle) and
      10 (R2A + R4 paddle); the technical guide's tables 12, 17 and 18 stop at 7
      and skip 6. Their rear is riser 2A with a blank where riser 3 would be,
      the face of configuration 7 (one processor), and the R4 paddle card is a
      cabled board no figure shows. No figure draws them, and a build per
      paddle card would repeat configuration 7's face.
    wanted: >-
      a drawing of riser 4's paddle card and of what the rear shows with it
  - what: riser-faces-shared
    scope: [rear, top]
    reason: needs-photo
    note: >-
      the straight-on rears the ISM and technical guide draw are configuration 1
      (R2A + R3A, figure 6), configuration 5's rear drive module (figure 7) and
      configuration 6's E3.S module (figure 9). The faces of risers 2P, 3P, 2Q,
      1P, 4P, 2S and 3S are the shared 16th-generation risers' (drawn for the
      R660 from its own figures); the R6625's figures 115 to 124 show them in
      isometric and agree on their slots and slot numbers. Their top-view
      outlines are the R660's estimates.
    wanted: >-
      straight-on rear photographs of an R6625 in riser configurations 2, 3, 4 and 6
  - what: lff-bay-numbers
    scope: [front-lff4]
    reason: needs-photo
    note: >-
      ISM figures 20 and 21 number the 10 and 8 bay builds; no figure held numbers
      the 4 x 3.5 inch bays, and figure 1 resolves no printing on the face.
    wanted: >-
      a straight-on photograph of a 4 x 3.5 inch R6625 front, or the service
      label of that build
  - what: e3s-bay-numbers
    scope: [front-e3s14, front-e3s16]
    reason: needs-photo
    note: >-
      ISM figures 4 and 5 and TG figures 4 and 5 resolve no printing on the E3.S
      fronts, and the ISM's service labels (figures 20 and 21) are the 2.5 inch
      builds'. The ids number down each column, as the R660's photographed lip
      prints; nothing is drawn.
    wanted: >-
      a straight-on photograph of an E3.S R6625 front, or its service label
  - what: dlc-unmodelled
    scope: [rear, top]
    reason: needs-drawing
    note: >-
      Direct Liquid Cooling is an option (ISM figures 8 and 12, tables 8 and 9):
      the rear I/O board has no VGA and two coolant tubes leave beside PSU 2, and
      the top view shows cold plates over the SP5 sockets with a tube route.
      dell/rear-io-board-dlc-16g@1 (drawn from this ISM's figure 8) exists, but
      a DLC build's top view needs cold plates on the R6625's own sockets, which
      no figure dimensions, so no DLC build is offered rather than one whose
      top view still shows heatsinks.
    wanted: >-
      the R6625's DLC cold plates' outline from above, with a height
  - what: air-shroud-outline-estimated
    scope: [top]
    reason: needs-drawing
    note: >-
      dell/r6625-air-shroud@1 is a plain 428 x 57.8 band read off ISM figures 10
      and 41 and the technical guide's interior render; the moulding is stepped
      and the figures do not resolve its outline. ISM figure 11 draws the place
      bare.
    wanted: >-
      a top-down view of the shroud fitted, at a scale
  - what: front-nobp-depth
    scope: [front-nobp]
    reason: sources-disagree
    note: >-
      ISM table 10 and TG table 28 give the 0-drive build 700.7 mm from ear to
      rear wall against 751.48 for the 4, 8 and 10 drive builds (50.8 shorter),
      and the 14 and 16 E3.S builds are in neither row. This device has one
      depth, 773.5, for every front.
    wanted: >-
      the chassis drawing's rows for the E3.S builds, and a one-depth decision
  - what: ocp-100g-listed-by-one-document
    scope: [ocp]
    reason: sources-disagree
    note: >-
      TG table 15 lists the OCP 3.0 cards 2VY37 (Broadcom, 2 x QSFP56, 100 GbE)
      and FD63G (Mellanox, 2 x SFP56) and "100 GbE" in table 16, while ISM table
      21 and TG table 30 give the OCP card as "1 GbE x 4, 10 GbE x 2, 10 GbE x 4,
      25 GbE x 2, 25 GbE x 4" and the MIC as 25 or 100 GbE x 2. The ISM governs:
      the OCP bay accepts the 1, 10 and 25 GbE cards and the blank, and not
      dell/ocp3-2x100g-qsfp56@1. The ISM adds that the board's OCP width is x8.
    wanted: >-
      Dell's statement of which of the two tables is current
  - what: spec-sheet-and-ism-disagree
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      the spec sheet's rear bays row reads "Up to 2 x E3.S NVMe direct drives max
      15.36.8 TB" (a typo), lists its 1800 W supply as Titanium (ISM table 13)
      where TG table 33 says Platinum, gives slot 3 as Gen4 only where ISM table
      100 gives R3P and R3S as Gen5, and its front-bay list stops at 10 x 2.5
      inch SAS, SATA or NVMe (8 x 2.5 inch NVMe is in the ISM's table 74). The
      ISM's figures are used throughout; none of these changes a drawn
      dimension.
    wanted: >-
      nothing - recorded so the next reader does not take the spec sheet's
      version
  - what: rack-kits-unlisted
    scope: [left, right]
    reason: vendor-silent
    note: >-
      the ISM's "Rail sizing and rack compatibility matrix" section and the TG's
      rails section (figures 22 to 35) point to Dell's separate Enterprise
      Systems Rail Sizing and Rack Compatibility Matrix, which is not among the
      three documents held, so no `chassis.ears` position or rail kit is listed
      (as on dell/r660 and dell/r740xd).
    wanted: >-
      Dell's Enterprise Systems Rail Sizing and Rack Compatibility Matrix

groups:
  drives:
    term: Drive
    role: service
    index-origin: 0
    description: the ten 2.5 inch front bays, numbered as the service label prints them (ISM figure 20)
    attrs: {media: sff-2.5}
  drives-lff:
    term: Drive
    role: service
    index-origin: 0
    description: the four 3.5 inch front bays, numbered from the left
    attrs: {media: lff-3.5}
  panels:
    term: Panel
    role: indicator
    index-origin: 1
    description: the left control panel, a field-replaceable module in the left ear
  ports:
    term: Port
    role: management
    index-origin: 1
    mixed: local console and service access
    description: the front VGA, the USB-A and the iDRAC Direct micro-AB USB
  mgmt:
    term: Button
    role: management
    index-origin: 1
    description: the power button
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: printed marks seated as parts - the VGA symbol
  tags:
    term: Tag
    role: furniture
    index-origin: 1
    description: >-
      the slide-out Express Service Tag under the right-hand drive columns (ISM
      tables 1 to 5, item 5). The E3.S fronts seat it where the 2.5 inch fronts
      do: their figures list it, and show it there.
  psus:
    term: PSU
    role: service
    index-origin: 1
    description: the two 60 mm supplies, PSU 1 at the left as the rear faces you
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        R6625 ISM table 13 and the spec sheet: two hot-swap supplies, "hot swap
        redundant"; one supply runs the system.
  boss:
    term: Bay
    role: service
    index-origin: 1
    description: the BOSS-N1 boot module bay at the far left of the rear
  risers:
    term: Riser
    role: service
    index-origin: 1
    description: >-
      the expansion card riser positions, numbered as the ISM's riser section
      numbers the risers (1 and 4 only in the full-height layout). `service`
      and not `traffic`: the group holds the riser, and the cards live in the
      riser's own slot bays, numbered as the riser prints them.
  drives-e3s:
    term: Drive
    role: service
    index-origin: 0
    description: >-
      the EDSFF E3.S front bays, numbered down each column (see e3s-numbering)
    attrs: {media: e3s}
  fillers:
    term: Filler
    role: service
    index-origin: 1
    description: the E3.S centre vent and the 14-drive build's two-slot filler
  memory:
    term: DIMM
    role: service
    index-origin: 1
    description: >-
      the 24 DDR5 sockets, named as Dell's memory label prints them (ISM figure
      101), twelve per processor - CPU 2's B slots on the left, CPU 1's A slots on
      the right, seen from above with the rear at the top
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: the four dual-rotor fan modules
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        R6625 technical guide, thermal features: "The PowerEdge R6625 allows N+1
        fan redundancy, allowing continuous operation with one fan failure in the
        system" (a second bullet adds "with >4 fans", which the four dual-rotor
        modules the ISM's cooling fan table counts satisfy). The ISM adds that for
        certain single-processor builds three sets are enough, with a fan blank
        closing bay 1.
  processors:
    term: CPU
    role: service
    index-origin: 1
    description: the two processor heatsinks - CPU 1 on the right as the front faces you
  interior:
    term: Part
    role: furniture
    index-origin: 1
    description: the system board, the air shroud and the fan bracket
  covers:
    term: Cover
    role: furniture
    index-origin: 1
    description: >-
      the system cover and the backplane cover on top, and the optional
      security bezel on the front. The bezel is DRAWN FITTED, as on the R660: it
      is `mounts`, so the viewer takes it off to show the drives, and `for:`
      names what it covers.
  riser-blanks:
    term: Blank
    role: service
    index-origin: 1
    description: the vented plate where riser 3 is absent
  drives-rear:
    term: Drive
    role: service
    index-origin: 0
    description: the two rear 2.5 inch bays of riser configuration 5, where riser 2 would be
    attrs: {media: sff-2.5}
  ocp:
    term: Slot
    role: traffic
    index-origin: 1
    description: the OCP NIC 3.0 slot
  lom-card:
    term: Card
    role: service
    index-origin: 1
    description: >-
      the LOM card position. The group holds the card, not its two ports, as the
      R740xd's NDC group does: the ports are the card's own.
  rear-io:
    term: Board
    role: service
    index-origin: 1
    description: >-
      the rear I/O board position - the board carries the ID button, the iDRAC
      port, two USB and the VGA, which are its own ports
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the iDRAC Direct lamp
