configurations:
  # WRITTEN FROM ONE TABLE with the only-in lists on the rear bays: six fronts by
  # five riser configurations (1, 2, 3, 4 and 7 of ISM table 101), plus the two
  # rear-storage configurations the ISM pairs with the 4 x 3.5 inch and the
  # 10 x 2.5 inch fronts only - configuration 5 (R3P, rear 2.5 inch drives:
  # ISM figures 80 and 82, TG table 11) and configuration 6 (R2S + R3S, rear
  # E3.S drives: ISM figures 70, 81 and 83). 34 builds and one example.
  sff10-rc1-2a3a:
    kind: orderable
    default: true
    description: >-
      10 x 2.5 inch front. Riser configuration 1, R2A + R3A: three low-profile Gen4 x16 slots, two on riser 2 and one on riser 3. ISM tables 100, 101 and 103.
  sff10-rc2-2p3p:
    kind: orderable
    description: >-
      10 x 2.5 inch front. Riser configuration 2, R2P + R3P: three low-profile slots, Gen5 x16 on slots 1 and 3 and Gen4 x16 on slot 2. The same face as configuration 1. ISM tables 100, 101 and 104.
    bays:
      riser-2: dell/riser-2p-16g@2
      riser-3: dell/riser-3p-16g@2
  sff10-rc3-1p4p:
    kind: orderable
    description: >-
      10 x 2.5 inch front. Riser configuration 3, R1P + R4P: two full-height Gen5 x16 slots, slot 1 on riser 1 and slot 2 on riser 4. ISM tables 100, 101 and 105.
  sff10-rc4-2q:
    kind: orderable
    description: >-
      10 x 2.5 inch front. Riser configuration 4, R2Q: two low-profile Gen5 x16 slots on riser 2, and a vented blank where riser 3 would be. ISM tables 100, 101 and 106.
  sff10-rc5-3p-rear2:
    kind: orderable
    description: >-
      10 x 2.5 inch front. Riser configuration 5, R3P with rear storage: slot 3 low-profile Gen5 x16, and two rear 2.5 inch drive bays where riser 2 would be. ISM figure 7, tables 101 and 107; TG table 17.
    bays:
      riser-3: dell/riser-3p-16g@2
  sff10-rc6-2s3s:
    kind: orderable
    description: >-
      10 x 2.5 inch front. Riser configuration 6, R2S + R3S with rear storage: slots 1 and 3 low-profile Gen5 x16, and two rear EDSFF E3.S drives in riser 2S. ISM figure 9, tables 101 and 108.
    bays:
      riser-2: dell/riser-2s-16g@1
      riser-3: dell/riser-3s-16g@1
  sff10-rc7-2a:
    kind: orderable
    description: >-
      10 x 2.5 inch front. Riser configuration 7, R2A, single processor: one usable low-profile Gen4 x16 slot, and a vented blank where riser 3 would be. ISM tables 101 and 109; TG table 18.
  sff8sf-rc1-2a3a:
    kind: orderable
    views: {front: front-sff8sf}
    description: >-
      8 x 2.5 inch front with the Smart Flow centre vent. Riser configuration 1, R2A + R3A: three low-profile Gen4 x16 slots, two on riser 2 and one on riser 3. ISM tables 100, 101 and 103.
  sff8sf-rc2-2p3p:
    kind: orderable
    views: {front: front-sff8sf}
    description: >-
      8 x 2.5 inch front with the Smart Flow centre vent. Riser configuration 2, R2P + R3P: three low-profile slots, Gen5 x16 on slots 1 and 3 and Gen4 x16 on slot 2. The same face as configuration 1. ISM tables 100, 101 and 104.
    bays:
      riser-2: dell/riser-2p-16g@2
      riser-3: dell/riser-3p-16g@2
  sff8sf-rc3-1p4p:
    kind: orderable
    views: {front: front-sff8sf}
    description: >-
      8 x 2.5 inch front with the Smart Flow centre vent. Riser configuration 3, R1P + R4P: two full-height Gen5 x16 slots, slot 1 on riser 1 and slot 2 on riser 4. ISM tables 100, 101 and 105.
  sff8sf-rc4-2q:
    kind: orderable
    views: {front: front-sff8sf}
    description: >-
      8 x 2.5 inch front with the Smart Flow centre vent. Riser configuration 4, R2Q: two low-profile Gen5 x16 slots on riser 2, and a vented blank where riser 3 would be. ISM tables 100, 101 and 106.
  sff8sf-rc7-2a:
    kind: orderable
    views: {front: front-sff8sf}
    description: >-
      8 x 2.5 inch front with the Smart Flow centre vent. Riser configuration 7, R2A, single processor: one usable low-profile Gen4 x16 slot, and a vented blank where riser 3 would be. ISM tables 101 and 109; TG table 18.
  lff4-rc1-2a3a:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front. Riser configuration 1, R2A + R3A: three low-profile Gen4 x16 slots, two on riser 2 and one on riser 3. ISM tables 100, 101 and 103.
