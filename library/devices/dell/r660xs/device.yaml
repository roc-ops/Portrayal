configurations:
  # GENERATED from one table with the only-in lists on the rear bays: three fronts
  # by six riser configurations, 18 builds. Riser configuration 0 (no riser) and
  # the no-backplane front are not drawn (see the gaps). Rear storage (riser
  # configuration 4) is listed with every front: ISM thermal tables 32 and 33
  # give '1 LP + 2 Rear drives' for the 4 x 3.5 inch, the 8 x 2.5 inch and the 10 x 2.5
  # inch builds.
