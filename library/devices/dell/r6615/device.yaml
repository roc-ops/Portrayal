configurations:
  # One table, five fronts by the riser configurations the ISM lists (tables 98
  # to 107): configuration 0 to 6 and 8 with every front, configuration 7 (rear 2
  # x E3.S) with the 4 x 3.5 inch and 10 x 2.5 inch fronts, and the rear 2 x 2.5
  # inch module with configuration 5 on the 10 x 2.5 inch front - the pairings TG
  # table 6 and ISM figures 70 and 78 to 83 give. 43 builds and four examples.
  # The riser bays carry only-in lists; a riser variant is the bay's override.
  lff4-rc0-none:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 0, no risers: one vented plate across the riser band, the LOM, OCP and rear I/O below it as in every build. ISM table 99, TG figure 6.
  lff4-rc1-2a3a:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 1, R2A + R3A: three low-profile slots - slots 1 and 2 x8 Gen4 (riser 2), slot 3 x16 Gen4 (riser 3), all on processor 1. ISM tables 16, 17 and 100.
  lff4-rc2-2t3p:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 2, R2T + R3P: three low-profile slots - slot 1 x16 Gen5, slot 2 x16 Gen4, slot 3 x16 Gen5, all on processor 1. ISM tables 16, 17 and 101.
    bays:
      riser-2: dell/r6615-riser-2t@1
      riser-3: dell/r6615-riser-3p@1
  lff4-rc3-1q4p:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 3, R1Q + R4P: two full-height Gen5 x16 slots - slot 1 on riser 1, slot 2 on riser 4, both on processor 1; the configuration Dell DPU cards and the management interface card need. ISM tables 16, 17 and 102, figure 6.
  lff4-rc4-2t:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 4, R2T: slot 1 x16 Gen5 and slot 2 x16 Gen4 on riser 2, and a vented blank where riser 3 would be. ISM tables 16, 17 and 103.
    bays:
      riser-2: dell/r6615-riser-2t@1
  lff4-rc5-3p:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 5, R3P: slot 3 x16 Gen5, and a riser 2 blank where riser 2 would be. ISM tables 16, 17 and 104, figures 129 and 131.
    bays:
      riser-3: dell/r6615-riser-3p@1
  lff4-rc6-2a:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 6, R2A: slots 1 and 2 x8 Gen4 on riser 2, and a vented blank where riser 3 would be. ISM tables 16, 17 and 105.
  lff4-rc7-2u3s:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front with the rear 2 x E3.S module; riser configuration 7, R2U + R3S: slot 1 x16 Gen5, two rear E3.S drives where riser 2's slot 2 would be, slot 3 x16 Gen5. ISM tables 16, 17 and 106, figure 9; TG table 6 pairs the module with this front.
    bays:
      riser-2: dell/r6615-riser-2u@1
      riser-3: dell/r6615-riser-3s@1
  lff4-rc8-2t3a:
    kind: orderable
    views: {front: front-lff4}
    description: >-
      4 x 3.5 inch front; riser configuration 8, R2T + R3A: slot 1 x16 Gen5, slot 2 x16 Gen4, slot 3 x16 Gen4. ISM tables 16, 17 and 107.
    bays:
      riser-2: dell/r6615-riser-2t@1
  sff8-rc0-none:
    kind: orderable
    views: {front: front-sff8}
    description: >-
      8 x 2.5 inch NVMe front with the vent plate; riser configuration 0, no risers: one vented plate across the riser band. ISM table 99, TG figure 6.
