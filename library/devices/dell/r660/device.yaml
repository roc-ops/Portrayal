    views: {front: front-e3s16}
    description: >-
      16 x EDSFF E3.S front (dual RAID); riser configuration 0, no riser: no PCIe slots - one vented plate across the riser band, the LOM, OCP and rear I/O below it as in every build, and front PERC only. Drawn from the R6615's figure of the same plate. TG table 14, ISM table 112.
  e3s14-rc0-none:
    kind: orderable
    views: {front: front-e3s14}
    description: >-
      14 x EDSFF E3.S front; riser configuration 0, no riser: no PCIe slots - one vented plate across the riser band, the LOM, OCP and rear I/O below it as in every build, and front PERC only. Drawn from the R6615's figure of the same plate. TG table 14, ISM table 112.
  sff10-rc1-2a3a-populated:
    kind: example
    description: >-
      The default build (10 x 2.5 inch front, riser configuration 1) with what
      the bays can hold seated rather than their blanks - ten 2.5 inch carriers,
      a BOSS-N1 module, a quad 25 GbE SFP28 OCP card and three low-profile
      NVIDIA ConnectX cards in the riser slots - so the rear shows seated cards
      and the top view the drives, the boot module and the OCP card from above.
    bays:
      drive-0: common/drive-carrier-25@2
      drive-1: common/drive-carrier-25@2
      drive-2: common/drive-carrier-25@2
      drive-3: common/drive-carrier-25@2
      drive-4: common/drive-carrier-25@2
      drive-5: common/drive-carrier-25@2
      drive-6: common/drive-carrier-25@2
      drive-7: common/drive-carrier-25@2
      drive-8: common/drive-carrier-25@2
      drive-9: common/drive-carrier-25@2
      boss: dell/boss-n1-module-1u@1
      ocp: dell/ocp3-4x25g-sfp28@1
      riser-2/slot-1: nvidia/mcx623106-lp@1
      riser-2/slot-2: nvidia/mcx4121a-lp@1
      riser-3/slot-3: nvidia/mcx713106-lp@1
  sff10-rc1-2a3a-dlc:
    kind: example
    description: >-
      The default build with the Direct Liquid Cooling module's rear: the
      liquid-cooling rear I/O board, which has no VGA and passes the two
      coolant tubes through the rear wall beside PSU 2. The cold plates and
      tubes inside are not drawn in the top view (see the gaps). DLC is a
      cooling option, not a riser configuration, so this is one example of it.
    bays:
      rio: dell/rear-io-board-dlc-16g@1
  sff10-rc1-2a3a-no-lom:
    kind: example
    description: >-
      The default build without the optional LOM card: Dell's LOM blank
      (YM3P9) in its window.
    bays:
      lom: dell/lom-blank-16g@1
  sff10-rc3-1p4p-mic:
    kind: example
    description: >-
      Riser configuration 3 (two full-height slots, the build Dell DPU cards
      need) with the Management Interface Card in the LOM card's place. The
      MIC has no rear ports; its face is an estimate (see the gaps).
    bays:
      lom: dell/mic-card-16g@1

