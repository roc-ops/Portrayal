  edge: '#1d2125'
  silk: '#c9ced3'
groups:
  drives:
    term: Drive
    role: service
    index-origin: 0
    description: the ten 2.5 inch front bays, numbered as the dividers print them
    attrs: {media: sff-2.5}
  panels:
    term: Panel
    role: indicator
    index-origin: 1
    description: the left control panel, a field-replaceable module in the left ear
  ports:
    term: Port
    role: management
    index-origin: 1
    mixed: local console and service access
    description: the front VGA, the USB-A and the iDRAC Direct micro-AB USB
  mgmt:
    term: Button
    role: management
    index-origin: 1
    description: the power button
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: printed marks seated as parts - the VGA symbol
  psus:
    term: PSU
    role: service
    index-origin: 1
    description: the two 60 mm supplies, PSU 1 at the left as the rear faces you
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        R660 technical guide: two hot-swap supplies, 1+1 redundant, with a hot-spare
        mode (ISM "Hot spare feature"); one supply runs the system.
  boss:
    term: Bay
    role: service
    index-origin: 1
    description: the BOSS-N1 boot module bay at the far left of the rear
  slots:
    term: Slot
    role: traffic
    index-origin: 1
    description: the PCIe slots of riser configuration 1 (R2A + R3A), numbered as printed
  ocp:
    term: Slot
    role: traffic
    index-origin: 1
    description: the OCP NIC 3.0 slot
  lom:
    term: Port
    role: traffic
    index-origin: 1
    description: the two 1 GbE ports of the LOM card
    attrs: {media: rj45, speed: 1g}
  mgmt-rear:
    term: Port
    role: management
    index-origin: 1
    mixed: the rear I/O board - service access at the back of the rack
    description: the system ID button, the dedicated iDRAC port, two USB and the VGA
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the iDRAC Direct lamp
