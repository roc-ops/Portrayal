configurations:
  sff10-rc1-2a3a:
    kind: orderable
    default: true
    description: >-
      10 x 2.5 inch front; riser configuration 1, R2A + R3A: three low-profile PCIe Gen4 x16 slots - slots 1 and 2 on riser 2 (processors 1 and 2), slot 3 on riser 3 (processor 2). ISM table 111.
  sff10-rc2-2p3p:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 2, R2P + R3P: three low-profile slots - slot 1 Gen5 x16 (processor 1), slot 2 Gen4 x16 (processor 2), slot 3 Gen5 x16 (processor 2). The same face as configuration 1. ISM table 111.
  sff10-rc3-1p4p:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 3, R1P + R4P: two full-height Gen5 x16 slots - slot 1 on riser 1 (processor 1), slot 2 on riser 4 (processor 2); the configuration DPUs and the management interface card need. ISM table 111.
  sff10-rc4-2r3r:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 4, R2R + R3R, single processor: three low-profile slots - slot 1 Gen5 x8, slot 2 Gen4 x16, slot 3 Gen5 x8, all on processor 1. The same face as configuration 1. ISM table 111.
  sff10-rc5-2a3q:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 5, R2A + R3Q: three low-profile slots - slots 1 and 2 Gen4 x16, slot 3 Gen5 x16 SNAPI on both processors. The same face as configuration 1. ISM table 111.
  sff10-rc6-2q:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 6, R2Q: two low-profile Gen5 x16 slots on riser 2 (processors 1 and 2), wider apart than R2A's, and a vented blank where riser 3 would be. TG table 14 splits it 6-1 / 6-2 by GPU support, not by face. ISM table 111.
  sff10-rc7-3p-rear2:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 7, R3P with rear storage: slot 3 low-profile Gen5 x16 (processor 2), and two rear 2.5 inch drive bays where riser 2 would be. TG table 14: rear storage possible. ISM table 111.
  sff10-rc8-2a:
    kind: orderable
    description: >-
      10 x 2.5 inch front; riser configuration 8, R2A, single processor: one usable low-profile Gen4 x16 slot (slot 1; slot 2's lanes belong to processor 2), and a vented blank where riser 3 would be. ISM table 111.
  # Riser configurations 0 (no riser) and 9 (R2S + R3S, two rear E3.S drives)
  # are orderable and NOT drawn: no master, figure or photograph held shows
  # either rear face - see the gaps.
