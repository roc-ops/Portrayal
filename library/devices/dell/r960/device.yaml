configurations:
  # FIVE RISER CONFIGURATIONS (ISM table 88, technical guide table 12) BY SIX FRONTS, THIRTY BUILDS, and two
  # examples. The ISM and technical guide publish no restriction pairing a front with a riser configuration
  # (table 12's only column on storage is "Rear storage possible: No"), so every pairing is built.
  sff16-rc01-1c-4c:
    kind: orderable
    default: true
    description: >-
      16 x 2.5 inch front; riser configuration 0-1 (basic entry), R1C + R4C, four processors: four full-height Gen5 x16 slots - 1 and 3 on riser 1 (processors 3 and 1), 10 and 11 on riser 4 (processors 4 and 2); no riser 2 or 3. ISM table 88, technical guide table 13.
  sff16-rc02-1c-4c:
    kind: orderable
    description: >-
      16 x 2.5 inch front; riser configuration 0-2 (basic entry), R1C + R4C, two processors: the same risers and face as 0-1 with slots 1 and 10 not usable (technical guide table 14 marks them N/A) - slot 3 on processor 1 and slot 11 on processor 2. ISM table 88.
  sff16-rc1-1c-3b-4c:
    kind: orderable
    description: >-
      16 x 2.5 inch front; riser configuration 1 (scale out), R1C + R3B + R4C: eight full-height Gen5 x16 slots - 1 and 3 on riser 1, 5 to 8 on riser 3B (processors 4, 2, 3 and 1), 10 and 11 on riser 4; no riser 2. ISM tables 88 and 13, technical guide table 15.
    bays:
      riser-3: dell/r960-riser-3b-scale-out@1
  sff16-rc2-1b-2-3b-4b:
    kind: orderable
    description: >-
      16 x 2.5 inch front; riser configuration 2 (maximum I/O), R1B + R2 + R3B + R4B: ten full-height and two low-profile Gen5 x16 slots - 1 to 3 on riser 1, 4 and 9 (low profile) on riser 2, 5 to 8 on riser 3, 10 to 12 on riser 4. ISM table 88, technical guide table 16; the rear is ISM figure 10.
    bays:
      riser-1: dell/r960-riser-1b@1
      riser-4: dell/r960-riser-4b@1
  sff16-rc3-1a-2-3a-4a:
    kind: orderable
    description: >-
      16 x 2.5 inch front; riser configuration 3 (GPU ready), R1A + R2 + R3A + R4A with full-length risers: single-width slots 1, 4, 9 and 10 and double-width slots 3, 6, 8 and 11 for up to four double-width GPUs. ISM table 88, technical guide table 17; drawn from the tables, not from a rear figure (see the gaps).
    bays:
      riser-1: dell/r960-riser-1a@1
      riser-3: dell/r960-riser-3a@1
      riser-4: dell/r960-riser-4a@1
  sff8-rc01-1c-4c:
    kind: orderable
    views: {front: front-sff8}
    description: >-
      8 x 2.5 inch front; riser configuration 0-1 (basic entry), R1C + R4C, four processors: four full-height Gen5 x16 slots - 1 and 3 on riser 1 (processors 3 and 1), 10 and 11 on riser 4 (processors 4 and 2); no riser 2 or 3. ISM table 88, technical guide table 13.
  sff8-rc02-1c-4c:
    kind: orderable
    views: {front: front-sff8}
    description: >-
      8 x 2.5 inch front; riser configuration 0-2 (basic entry), R1C + R4C, two processors: the same risers and face as 0-1 with slots 1 and 10 not usable - slot 3 on processor 1 and slot 11 on processor 2. ISM table 88, technical guide table 14.
  sff8-rc1-1c-3b-4c:
    kind: orderable
    views: {front: front-sff8}
    description: >-
      8 x 2.5 inch front; riser configuration 1 (scale out), R1C + R3B + R4C: eight full-height Gen5 x16 slots - 1 and 3 on riser 1, 5 to 8 on riser 3B, 10 and 11 on riser 4; no riser 2. ISM tables 88 and 13, technical guide table 15.
    bays:
      riser-3: dell/r960-riser-3b-scale-out@1
  sff8-rc2-1b-2-3b-4b:
    kind: orderable
    views: {front: front-sff8}
    description: >-
      8 x 2.5 inch front; riser configuration 2 (maximum I/O), R1B + R2 + R3B + R4B: ten full-height and two low-profile Gen5 x16 slots. ISM table 88, technical guide table 16.
    bays:
      riser-1: dell/r960-riser-1b@1
      riser-4: dell/r960-riser-4b@1
  sff8-rc3-1a-2-3a-4a:
    kind: orderable
    views: {front: front-sff8}
    description: >-
      8 x 2.5 inch front; riser configuration 3 (GPU ready), R1A + R2 + R3A + R4A with full-length risers, for up to four double-width GPUs. ISM table 88, technical guide table 17; drawn from the tables (see the gaps).
    bays:
      riser-1: dell/r960-riser-1a@1
      riser-3: dell/r960-riser-3a@1
      riser-4: dell/r960-riser-4a@1
  sff24-rc01-1c-4c:
    kind: orderable
    views: {front: front-sff24}
    description: >-
      24 x 2.5 inch front (24 NVMe, or 16 SAS/SATA + 8 NVMe on its backplanes: ISM table 70); riser configuration 0-1 (basic entry), R1C + R4C, four processors: four full-height Gen5 x16 slots. ISM table 88, technical guide table 13.
  sff24-rc02-1c-4c:
    kind: orderable
    views: {front: front-sff24}
    description: >-
      24 x 2.5 inch front (24 NVMe, or 16 SAS/SATA + 8 NVMe); riser configuration 0-2 (basic entry), R1C + R4C, two processors: slots 3 and 11 usable. ISM table 88, technical guide table 14.
  sff24-rc1-1c-3b-4c:
    kind: orderable
    views: {front: front-sff24}
    description: >-
      24 x 2.5 inch front (24 NVMe, or 16 SAS/SATA + 8 NVMe); riser configuration 1 (scale out), R1C + R3B + R4C: eight full-height Gen5 x16 slots. ISM tables 88 and 13, technical guide table 15.
    bays:
      riser-3: dell/r960-riser-3b-scale-out@1
  sff24-rc2-1b-2-3b-4b:
    kind: orderable
    views: {front: front-sff24}
    description: >-
      24 x 2.5 inch front (24 NVMe, or 16 SAS/SATA + 8 NVMe); riser configuration 2 (maximum I/O), R1B + R2 + R3B + R4B: ten full-height and two low-profile Gen5 x16 slots. ISM table 88, technical guide table 16.
    bays:
      riser-1: dell/r960-riser-1b@1
      riser-4: dell/r960-riser-4b@1
  sff24-rc3-1a-2-3a-4a:
    kind: orderable
    views: {front: front-sff24}
    description: >-
