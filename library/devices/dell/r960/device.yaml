# SOURCES:
# Dell's PowerEdge R960 Installation and Service Manual (the ISM), Technical
# Guide and Spec Sheet, read as the PDFs Dell publishes (hashes under
# `datasheet` and `references`), and Dell's R960 service model
# (working/intake/dell/3d-models/r960.glb, Dell's CAD, held and not committed),
# read with glbparts.py for the top view, the supplies' depth and the bezel.
# No stencil, reseller figure or third-party photograph was used. The ISM's
# figures are photographs and drawings embedded at 150 to 600 ppi, measured at
# the scale each provenance entry gives; none is orthographic, and each says by
# how much. The model's positions are the `Main Assembly` node's (the scene also
# holds exploded copies under `Extra content`), in plan as x = 228.0 - cad x1
# and y = 883.94 - cad z1.
# STATE:
# DONE: the envelope from ISM table 7; six fronts (32, 24, 16 and 8 x 2.5 inch,
# 16 x E3.S, 8 x 2.5 inch + 16 x E3.S) each a view bound by
# `configurations.<name>.views`, with the left control panel, the right panel,
# the Express Service Tag and the honeycomb security bezel fitted; the rear for
# riser configurations 0-1, 0-2, 1, 2 and 3 over the four 86 mm supply bays
# (the 60 mm supplies in their adapter, 2400 W and 2800 W), the BOSS-N1 bay,
# LOM, OCP and rear I/O board; the top view from ISM figures 12 to 15 and 95 to
# 96 (system board, processor expansion module, 64 DIMM slots, drive cage cover)
# and from the service model (four heatsinks, six fans, fan cage, shrouds,
# support bar, system cover and latch, and the plan projections of the seated
# parts); estimated bottom and sides.
# LEFT: the 1800 W and -48 V DC supplies, direct liquid cooling, the LCD bezel
# and rear serial/VGA brackets (see the gaps).
format: 1
kind: device
name: r960
version: 2.0.2
maturity: draft
manufacturer: Dell
model: PowerEdge R960
description: >-
  4U four-socket rack server, 16th generation - up to 32 x 2.5 inch front drive
  bays (or 24 NVMe, 16, 8, 16 EDSFF E3.S, or 8 + 16 E3.S), four hot-swap power
  supplies in 2+2 redundancy at the left and right of the rear, up to twelve PCIe
  Gen5 slots on four risers, an OCP NIC 3.0 slot and a rear BOSS-N1 boot module
profile: server
provenance:
  chassis:
    confidence: datasheet
    note: >-
      datasheet - ISM table 7 (chassis dimensions, figure 32): Xb 444.0 is the body BETWEEN THE EARS and Xa 482.0
      across them, Y 174.3 the height, Za 36 mm with the bezel and 22 mm without it (ear plane to the front), Zb
      844.74 ear to rear wall and Zc 847.195 ear to PSU handle. DEPTH 866.74 IS THE FRONT FACE TO THE REAR WALL: the
      22 mm the ears sit behind the front face without the bezel plus Zb, as the R660's is derived. It
      agrees with the spec sheet's 869.195 without the bezel and 883.195 with it, which are Za + Zc (22 + 847.195 and 36 +
      847.195): they reach the PSU handles, 2.455 further than the rear wall. The technical guide's table 2 prints the
      same 883.195 and 869.195 for the R960 and, beside them, 441.16 wide and 877.84 / 865.9 deep: THOSE ARE THE
      PREVIOUS-GENERATION R940xa's COLUMN of the same table, not the R960's, which the guide's own chassis
      table (Xb 444 mm) and ISM table 7 confirm. A converted copy that merged the two columns reads
      441.16; the ISM governs.
  front-face:
    confidence: drawing
    note: >-
      THE EARS CARRY THE CONTROL PANELS, SO THEY ARE DRAWN - the R740xd's and R660's reasoning: the left control panel
      (ISM figure 7) sits in the left ear outboard of the drives and the right panel (power, USB, iDRAC Direct, ISM
      figure 9) and the VGA in the right. The front is therefore the 482.0 rack face (ISM Xa), 174.3 tall.
  gate-1:
    confidence: photo-measured
    note: >-
      Gate 1 passed. ISM figures 1 to 6 are 1623 x 809 px photographs (300 ppi). Measured by non-white extent, the
      ear-to-ear width of figures 2 to 6 is 1599 px and the height 581 px: 3.3175 px/mm across the 482.0 face and
      3.333 px/mm down the 174.3 height, 0.5% apart, so they are orthographic enough to take positions from. Figure 1
      (32 bays) is a differently scaled copy: 1590 x 578 px, 3.299 and 3.316 px/mm, 0.5% apart. Every front
      position here is read off them at those scales.
  drive-bays:
    confidence: photo-measured
    note: >-
      photo-measured - the 2.5 inch bays are columns of 17.4 mm on the figures' own pitch (17.75 mm in the left bank, 17.28 in
      the middle and right banks of figures 2 and 3, 17.7 across figure 1), each 76.2 tall: the carriers' orange release
      buttons were found by colour and give each column's centre, and the carrier sits centred in it. The carrier is
      common/drive-carrier-25@2, standing up, as the R740xd seats it. The three banks of figure 2 do not share a pitch;
      it is drawn as measured, per bank.
  drive-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - a number strip runs under the upper row of drives on figures 1 to 3, 5 and 6 and prints the bay
      numbers: 0-7 in the left bank and 8-15 in the right on the 16 and 32 bay fronts, 0-23 across the 24 bay front, with
      CPU tags between pairs (CPU4 between 2 and 3, CPU2 between 8 and 9, CPU1 between 14 and 15, CPU3 between 20 and
      21) and an NVMe tag at the left. The 32-bay front prints 0-15 only, on the strip between its two rows: the lower
      row's 16 to 31 are NOT PRINTED on the figure, and it is numbered 16-31 by continuing the sequence
      (see the lower-row gap).
  drive-default:
    confidence: datasheet
    note: >-
      EVERY BAY DEFAULTS TO A BLANK, as on the R660 and R740xd: Dell publishes no default drive count, and the ISM requires
      blanks in every empty slot for cooling. A populated machine is a configuration.
  vent-plates:
    confidence: photo-measured
    note: >-
      photo-measured - where no drives fit, the figures show fixed vented plates: one between the two banks of the 16
      and 32 bay fronts, two in the upper band of the 8 bay front, two beside the E3.S block and one between the SFF bank
      and the E3.S block of the 8 + 16 front. The 24 bay front has drives across its whole upper band. Under the upper
      band three vented plates (the fan wall's grilles) fill the lower band of every front but the 32 bay one, which has a
      second row of drives there. The plates are read off the figures as rectangles with an inset mesh and are chassis decor;
      whether Dell's plates are removable blanks is not stated.
  fronts:
    confidence: photo-measured
    note: >-
      SIX FRONTS, EACH ITS OWN VIEW bound by `configurations.<name>.views`, as the R660's and R740xd's are: ISM figure 1
      (32 x 2.5 inch, `front-sff32`), 2 (24 x 2.5 inch, `front-sff24`), 3 (16 x 2.5 inch, `front`), 4 (8 x 2.5 inch,
      `front-sff8`), 5 (16 x EDSFF E3.S, `front-e3s16`) and 6 (8 x 2.5 inch with 16 x EDSFF E3.S, `front-sff8-e3s16`). The
      ISM's "16 x 2.5 inch SAS/SATA + 8 x 2.5 inch NVMe" is a backplane mix on the 24 bay face (ISM table 70 and the
      cabling tables 75, 76), not a seventh front; the technical guide's "32 x 2.5 inch (Smart Flow)" caption is
      figure 1. The ISM names no front without a backplane.
  e3s:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figures 5 and 6: sixteen EDSFF E3.S carriers standing side by side in the right of the upper
      band, found by the SSD legend printed down each carrier on a 34.87 px (10.51 mm) pitch from 290.3 mm across; the carrier
      is dell/e3s-carrier@1 (the R660's, the same Dell part) turned 90 so its orange chevrons are at the top as the figures
      show. THE E3.S NUMBERS ARE NOT PRINTED on either figure (the strip under the block carries no digits); the bays are
      numbered from ISM figure 27, the service label (a drive number, then "Bay 1 (0-7)", "Bay 2 (8-15)"): 0-15 left to right on
      the 16 E3.S front and, because the 2.5 inch bank is bay 1 (0-7), 8-23 on the 8 + 16 front.
  top:
    confidence: measured
    note: >-
      measured, where it says so. REAR AT y=0, FRONT AT y=866.74 - the library's plan convention, x left to right as the front faces you
      (CPU 2 and CPU 4 left, CPU 1 and CPU 3 right). MEASURED from Dell's R960 service model, working/intake/dell/3d-models/r960.glb, read with
      glbparts.py: the positions come from the un-exploded `Main Assembly` node only (the scene also holds exploded copies under `Extra
      content`), mapped as plan x = 228.0 - cad x1 (the system cover, cad x -216.0..228.0, is the 444 body) and plan y = 883.94 - cad z1 (the rear
      wall: the model's chassis front face at cad z 17.2 plus the ISM's 866.74, where its `Hole` cubes stand at 883.6, and the supply handles end
      2.56 past it against ISM table 7's 2.455; the handle is modelled at 2.6 mm, the model's figure rounded, 0.145 mm longer than the manual's). What the model gives, each part citing its node: the six fans and the fan cage (`R960_
      CoolingFan`), the four heatsinks (`R960_ HeatSink SYS` and `R960_ HeatSink PEM`), the air shroud top cover (`R960_ AirShroudTopCover`) and the
      shroud under it (`R960_ GPU_AirShroud`), the support bar (`R960_ SupportBar`), the system cover and its latch (`R960_ SystemCover`), the supplies
      (`R960_ PSU Prefab`), the four risers (`Riser 1B - FL`, `Riser 2`, `Riser 3A - FL`, `Riser 4A - FL`) and the rows of the 64 memory sockets (`Memory
      Module_SB`, `_PEM`). The model is one build: full-length risers, the GPU shroud and the full-length support bar, where ISM figure 12 is
      the half-length build; see `top-view-model-vs-ism`. NOT FROM THE MODEL, still read off ISM figures 12 to 15, 95 and 96 (photographs from above,
      1.813 px/mm across the 444 body and 1.863 px/mm down, 2.7% apart, with a memory socket drawn 157 long against 133.4 - a 15% stretch down): the
      two boards' outlines (the model holds them, system board 425.7 x 558.4 at 9.1, 30.0 and PEM 430.4 x 288.1 at 6.8, 264.3, and they are not re-read
      here), the sockets' x and their names (figures 95, 96: A1-A16 and B1-B16, C1-C16 and D1-D16, named by the labels the figures print) and the drive cage
      cover. SEATED MODULES PROJECT INTO THIS VIEW through their rear bay's `plan:` - the two upper supplies, the BOSS-N1 module, the OCP card, LOM,
      rear I/O board and risers - the supplies and risers at the model's positions, the rest mirrored from their rear bays (plan x = 444 - rear x - w).
      The standing front drives do not project (a standing 2.5 inch drive is 7 mm wide; the library's std/drive-25-plan@1 is a flat drive). NOT YET IN
      THIS VIEW: the cards, the backplane and the cabling.
  bezel:
    confidence: measured
    note: >-
      DRAWN FITTED, as on the R740xd and R660, and taken off in the viewer: the optional security bezel (dell/r960-bezel@1)
      covers the body between the ears, and `for:` names the bays and parts behind it. Its openings are holes, so the drives
      show through. MEASURED from Dell's R960 service model, working/intake/dell/3d-models/r960.glb: `R960_ FrontBezel` in the `Main Assembly` node,
      430.8 x 168.5 at front-face (25.5, 2.7), its plate's 42 openings found by decoding the mesh (large hexagons in a staggered grid, 38.5
      by 44.45 apart) and its release button. The model's bezel is the LCD bezel and the security bezel's own shape is not in it; the ISM says
      the mesh is the same (figure 34), and the lock's place is a guess (see `security-bezel-shape-estimated`). The LCD bezel is not modelled.
  sides-and-bottom:
    confidence: estimated
    note: >-
      estimated - no figure or photograph held shows the bottom or either side; their folded edges and the rail land are
      plausible shapes at plausible sizes, drawn so the faces are not blank, and marked estimated where drawn.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figure 10, the rear view (a 1565 x 807 photograph), which is riser configuration 2 (R1B + R2 +
      R3B + R4B) with four 2800 W supplies. Body 23..1521 px across (444 mm, 3.374 px/mm) and 110..691 down (174.3, 3.333
      px/mm): 1.2% apart, so positions are good to about a millimetre. The rear face is the 444 body, not the rack face. The
      technical guide's figures 7 and 8 (600 ppi, 5% out between axes: read for shape only) show configurations 0 and 1: no riser 2
      (a plate across its band), and in configuration 0 a vented plate where riser 3 would be.
  rear-psus:
    confidence: photo-measured
    note: >-
      photo-measured - four supplies in two stacks: PSU3 above PSU1 at the left (rear x 16.9..103.4) and PSU4 above PSU2 at the
      right (341.4..427.4), each plate 86.0 wide and about 40.5 tall at y 90.6 and 131.8 (ISM table 5 items 5, 6, 16, 17 and the
      figure's printed PSU marks). A 60 mm supply stands in this 86 mm bay in a 26 mm adapter (ISM table 11 note); the adapter's
      side is not stated. The marks (bolt and number) read 3 at the top left, 1 at the lower left, 4 at the top right and 2 at the
      lower right, as the figure prints them.
  rear-boss-lom-io:
    confidence: photo-measured
    note: >-
      photo-measured - the BOSS-N1 module on riser 1's side at 131.3, 10.4 (its two M.2 carriers, 480 GB, orange tab at the bottom of
      carrier 0 and the top of carrier 1: the R660's dell/boss-n1-module-1u@1, the same part); the LOM window at 118.8..160.6 and the
      OCP card at 171.4..243.2 (71.8 wide, the library's OCP bay), LOM and OCP in the R660's left-to-right order; the rear I/O board is
      NOT the R660's (96.4 wide against 85.37 and with its connectors on a different pitch): dell/r960-rear-io-board@1.
  rear-risers:
    confidence: photo-measured
    note: >-
      photo-measured - the riser cages 18.0..122.1 (riser 1), 176.4..280.7 (riser 3) and 317.7..422.9 (riser 4), the
      riser 2 band 124.2..273.9 under riser 3 and the VGA bracket blank above it; each riser's windows are 20 mm apart.
      Riser 4's cage prints 1 up, 2 down, 3 down and 4 down at its left (see the gaps: the ISM numbers its slots 10-12)
      and riser 3's prints 5 up 6 down and 7 up 8 down at its right; the slot numbers on every riser are those of the ISM.
  rear-power:
    confidence: datasheet
    note: >-
      chassis.power is `ac`: every supply this device accepts is an AC supply (100-240 V AC or 240 V DC, hot swap): 1100 and 1400 W
      in the adapter, 2400 and 2800 W. The 1800 W (C15 cord) and -48 V DC supplies of ISM table 10 are not modelled.
attrs:
  physical:
    ru: 4
    weight-max-kg: 60.2
  lifecycle: {eol: none-announced}
chassis:
  width: 444.0
  height: 174.3
  depth: 866.74
  ru: 4
  power: ac
  color: '#2f3439'
  edge: '#1d2125'
  silk: '#c9ced3'
gaps:
  - what: riser-configuration-3-rear-by-table
    scope: [rear, top]
    reason: needs-photo
    note: >-
      configuration 3 (R1A + R2 + R3A + R4A, the GPU build) is drawn from ISM tables 88 and 13 and the technical guide's table 17, not
      from a figure: the ISM and technical guide draw the rears of configurations 0 to 2 only. Slots 3, 6, 8 and 11 are
      double width, full length; the cages are the half-length risers' with windows merged, estimated.
    wanted: >-
      a straight-on rear photograph of an R960 in riser configuration 3, with GPUs or double-width fillers
  - what: riser-4-printed-marks-against-iso-slot-numbers
    scope: [rear]
    reason: sources-disagree
    note: >-
      ISM figure 10 and the technical guide's figures 7 to 9 show riser 4's cage printing 1 (up) over 2 (down), 3 and 4 (down arrows); the
      ISM's table 5 numbers riser 4's slots 10, 11 and 12, and table 88 gives it no slot 4. The marks are drawn as
      photographed; the slot ids and numbers follow the ISM.
    wanted: >-
      a close photograph of riser 4's cage, or a Dell statement of what the marks number
  - what: riser-2-slot-numbers
    scope: [rear]
    reason: sources-disagree
    note: >-
      ISM table 5 (rear view) names riser 2 "slot 3 and slot 9"; ISM tables 6, 13 and 88, the technical guide's tables 16 and 17 and ISM
      figure 104 say slots 4 and 9, and slot 3 is riser 1's. Slots 4 and 9 are used, slot 4 on the left by figure 104's callout order.
    wanted: >-
      a rear photograph of riser 2 with its slot numbers printed, or Dell's correction
  - what: top-view-model-vs-ism
    scope: [top]
    reason: sources-disagree
    note: >-
      the top view's parts are Dell's service model (r960.glb, the `Main Assembly` node), which is the full-length-riser build: `Riser 1B - FL`,
      `Riser 3A - FL`, `Riser 4A - FL`, the GPU shroud and the full-length support bar. ISM figure 12 is the half-length build, read at 1.813 px/mm
      across and 1.863 down (a 15% stretch down). They agree across and disagree down and by build: the support bar is 438.3 x 59.7 in the model
      against 436.0 x 35.0 in the figure; the shroud under the top cover 438.5 x 327.9 against 426.0 x 93.0; the top cover 434.9 x 173.8 against 436.0 x
      142.0; the heatsink 128.0 x 182.1 (a 78.9 x 120.6 block and a 126.8 x 49.3 fin pack) against 74.5 x 123.0 (the block, to 4.4 mm); a fan 62.7 x 88.2 against
      64.0 x 86.0; the cover 444.0 x 754.1 against 440.0 x 745.0. The device draws the model's, which is one build; the half-length support
      bar and bottom cover (ISM figures 39 and 40, 12) are not drawn.
    wanted: >-
      Dell's service model of the half-length build, or an orthographic drawing of the R960 from above with the cover off
  - what: top-view-boards-not-reread
    scope: [top]
    reason: needs-drawing
    note: >-
      the model is held and gives the boards, `R960_ Systemboard` 425.7 x 558.4 at plan (9.1, 30.0) and `R960_ Processor Expansion Module` 430.4 x
      288.1 at (6.8, 264.3), but the system board and PEM here are still the rectangles read off ISM figures 12 and 15 (427.0 x 560.0 at 8.5, 20.0 and 424.0 x
      230.0 at 10.0, 296.0): they were not on the review's list and sit under the parts that were. The drive cage cover is also still the figure's.
    wanted: >-
      the boards' and the cage cover's boxes read from r960.glb in a follow-up
  - what: memory-sockets-model-vs-figure-95
    scope: [top]
    reason: sources-disagree
    note: >-
      the model holds 30 sockets on each board (`Memory Module_SB` and `_PEM`: 8 at a 7.5 pitch, then 14 at an 8.65 pitch across the middle, then 8) where ISM
      figures 95 and 96 and the technical guide print 32 each (A1-A16 and B1-B16, C1-C16 and D1-D16). The outer banks agree to 0.6 mm (plan x 21.0 to
      73.7 and 366.4 to 419.1 against 20.4 to 72.9 and 366.0 to 418.5); the model's middle 14 span 163.5 to 280.5 against the figure's 16, 162.6 to
      278.9. The device keeps the ISM's 32 at the figure's pitch and moves every row to the model's y, 352.8 (133.4 long, as the model has them), 7.2
      from the figure's.
    wanted: >-
      a Dell drawing of the memory sockets with the middle banks dimensioned
  - what: psu-x-model-vs-figure-10
    scope: [top, rear]
    reason: sources-disagree
    note: >-
      the supplies' outer edges stand 11.4 in from the body wall in the model (`R960_ PSU Prefab`, plan x 346.3 and 11.8) and 16.9 in ISM figure 10
      (rear x 16.9 and 341.4, which mirror to plan x 341.1 and 16.6): 5.2 and 4.8 mm. The top view draws the model's, which is a drawing of the machine from
      above; the rear face keeps the photograph's, which is a photograph of the machine from behind at 3.374 px/mm, good to a millimetre.
    wanted: >-
      a rear photograph of the R960 with a rule across the supplies, or Dell's dimensioned rear drawing
  - what: riser-length-model-vs-table-13
    scope: [top, risers]
    reason: sources-disagree
    note: >-
      the model calls riser 1 `Riser 1B - FL` and makes its board 357.0 long, where ISM table 13 gives riser 1B's three slots half length; riser 3A
      (356.3, full length) agrees with the ISM, and the ISM states no length for riser 4A (357.0 in the model). The model's riser 1B and 4A are 159.9 and 148.4
      wide in plan against the rear cages' 117.1 and 120.0. The top view draws the model's, and the half-length variants (1C, 3B, 4B, 4C) borrow
      the nearest held riser's length marked estimated.
    wanted: >-
      Dell's statement of the length of riser 1B and a model of a half-length riser
  - what: front-lower-row-numbering-32-bay
    scope: [front-sff32]
    reason: needs-photo
    note: >-
      ISM figure 1 prints 0-15 on the strip between the two rows and nothing under the lower row; the lower row is numbered 16-31
      by continuing the sequence, and the strip is read as the upper row's (as figures 2 and 3 print under the carriers).
    wanted: >-
      a photograph of a 32-bay front with the number strip legible under both rows, or Dell's service label (figure 26) at a readable scale
  - what: e3s-numbering-unprinted
    scope: [front-e3s16, front-sff8-e3s16]
    reason: needs-photo
    note: >-
      ISM figures 5 and 6 print no digits under the E3.S block. ISM figure 27 (the service label, too small to read a single carrier's
      number) numbers the bays "Bay 1 (0-7)", "Bay 2 (8-15)" for 16 E3.S drives and "Bay 1 (0-7)" (the 2.5 inch bank), "Bay 2 (8-15)",
      "Bay 3 (16-23)" for the 8 + 16 build; the carriers are numbered left to right inside those ranges, 0-15 and 8-23, which is an
      assumption about the order within a bay.
    wanted: >-
      a photograph of an E3.S front with the bay numbers printed
  - what: e3s-blank-face-estimated
    scope: [front-e3s16, front-sff8-e3s16]
    reason: needs-photo
    note: >-
      the E3.S bays default to dell/e3s-carrier-blank@2, the R660's blank drawn from an angled photograph of the real part; the
      R960's blank is not shown in any R960 document.
    wanted: >-
      a straight-on photograph of an R960 E3.S front with empty slots
  - what: security-bezel-shape-estimated
    scope: [front, front-sff8, front-sff24, front-sff32, front-e3s16, front-sff8-e3s16]
    reason: needs-photo
    note: >-
      the model is held (r960.glb, `R960_ FrontBezel`) and gives the honeycomb, the bezel's box and the release button, which are drawn from it.
      It does not answer for the security bezel: the model's is the LCD bezel (a display window, arrow and tick buttons, their numbers),
      and Dell's guide shows no other. The ISM says the mesh is the same on both (figure 34), which is why the plate's cells stand; the
      security bezel's own end plates, the cell where the LCD window is, and its keylock's place are not in any document held (the lock
      is drawn on the left end plate by guess). The LCD bezel is not modelled.
    wanted: >-
      a Dell model or a straight-on photograph of the R960 security bezel fitted
  - what: psu-1800w-and-dc-not-modelled
    scope: [psus]
    reason: needs-photo
    note: >-
      ISM table 10 lists a 1800 W Titanium supply (C15 cord, 60 mm form factor) and a 1100 W -48 V DC supply (LOTES connector);
      no R960 document shows either face, and the 60 mm supplies this device accepts are the R660's 1100 and 1400 W units.
    wanted: >-
      rear photographs of the 1800 W and -48 V DC supplies in an R960
  - what: psu-adapter-not-in-the-model
    scope: [psus]
    reason: needs-photo
    note: >-
      the 86 mm supplies' depth is answered by the model (r960.glb, `R960_ PSU Prefab`: the can runs 233.5 into the chassis and the handle stands
      33.5 proud of the face, 2.6 past the rear wall; the face is recessed 30.9 inside it) and is drawn from it. The model holds ONE supply and no
      adapter: the 26 mm adapter, its side, its face and a 60 mm supply seated in it are in no R960 document (ISM figures 199 and 200 draw the
      adapter's screws only) and not in the model. The adapter is drawn at the left with the 60 mm supply's 222.0 depth, estimated, in a bay whose
      can is 233.5.
    wanted: >-
      a photograph of a 60 mm supply in its adapter from behind, and a side view of the adapter
  - what: psu-face-recess-not-built
    scope: [rear, psus]
    reason: needs-drawing
    note: >-
      the 86 mm supplies' faces are recessed 30.9 mm inside the rear wall and their handles stand 33.5 proud of them, 2.6 past the wall (r960.glb, `R960_
      PSU Prefab`; ISM table 7's Zc less Zb is 2.455). A rear bay seats its occupant with the face at the wall plane and gives it no recess, so the 3D scene
      draws the face at the wall and the grip 2.6 proud (the part past the wall), where the first build stood the whole 33.5 handle and a 14.7 latch outside
      the chassis. The supply's can and the top view are as measured; only the 30.9 mm between the wall and the face, and the latch's own height
      inside it, are not shown. The 60 mm supplies seated in the adapter are the R660's part and still stand its 35.7 handle past the wall.
    wanted: >-
      a bay that can recess its occupant (a `floor` or `inset` on a rear bay), and a section through the R960's rear wall at a supply for the latch
  - what: riser-cage-plate-depth-estimated
    scope: [rear, risers]
    reason: needs-drawing
    note: >-
      the risers' rear plates were drawn 20.0 mm proud of the rear wall by analogy with the R660's cages, which put them outside the 866.74 chassis (ISM table
      7 puts only the supplies' handles past the wall). They are drawn 1.0 proud, estimated: no R960 model or side figure is held for a cage's
      thickness or for how far the risers' PCBs stand behind it (the model's risers are drawn for the top view only).
    wanted: >-
      a side view or section of an R960 rear wall at a riser cage
  - what: full-height-slots-take-the-filler-only
    scope: [risers]
    reason: needs-drawing
    note: >-
      the full-height slots of risers 1, 3 and 4 accept dell/r960-pcie-filler-fh@1 only. A seated full-height card or bracket in this
      library (std/pcie-bracket-fh@2, common/pcie-card-fh@2) is 120.02 x 21.59, the PCIe CEM envelope, and the R960's cages are 100 to
      105 mm across on ISM figure 10: no R960 figure shows how the bracket's ends sit under the cage, so a seated card would
      draw 15 to 20 mm outside it. The low-profile slots of riser 2 take the R660's low-profile bracket and cards, whose envelope
      the cage covers as the R660's riser 2A does.
    wanted: >-
      a rear photograph of an R960 with a full-height card in a riser, or Dell's drawing of the full-height bracket in the cage
  - what: dlc-rear-and-modules-not-modelled
    scope: [rear, top]
    reason: needs-photo
    note: >-
      direct liquid cooling (ISM table 6 and figures 11, 16 to 18; the spec sheet's optional DLC) changes the rear (a BOSS blank, coolant
      tubes, an optional rear VGA and serial port) and the processors' cooling. Not modelled: the ISM's figure 11 shows
      the rear with coolant tubes over its middle and no straight-on view.
    wanted: >-
      a rear photograph of a DLC R960 with the tubes disconnected, and the cold plates from above
  - what: rear-and-mid-drive-bays-none
    scope: [rear, front]
    reason: vendor-silent
    note: >-
      the ISM's front, rear and technical-specification sections and the technical guide's table 12 ("Rear storage possible: No" in
      every riser configuration) list no rear and no mid drive bays; none is modelled.
    wanted: >-
      none unless Dell adds a rear or mid storage option
  - what: rack-ears-and-rail-kits-not-modelled
    scope: [front]
    reason: vendor-silent
    note: >-
      the ISM's "Rail sizing and rack compatibility matrix" section (page 30) points to Dell's separate Enterprise Systems Rail Sizing and Rack
      Compatibility Matrix, which this device did not hold; no ear position or rail kit is stated here.
    wanted: >-
      Dell's rail sizing and rack compatibility matrix
groups:
  drives:
    term: Drive
    role: service
    index-origin: 0
    description: the 2.5 inch front bays, numbered as the strip under the carriers prints them (the 32 bay front's lower row continues 16-31)
    attrs: {media: sff-2.5}
  drives-e3s:
    term: Drive
    role: service
    index-origin: 0
    description: the EDSFF E3.S front bays, sixteen standing carriers numbered left to right as ISM figure 27 gives them (0-15, or 8-23 after the 2.5 inch bank)
    attrs: {media: e3s}
  panels:
    term: Panel
    role: indicator
    index-origin: 1
    description: the left control panel, a field-replaceable module in the left ear
  ports:
    term: Port
    role: management
    index-origin: 1
    mixed: local console and service access
    description: the front VGA, the USB-A and the iDRAC Direct micro-AB USB
  mgmt:
    term: Button
    role: management
    index-origin: 1
    description: the power button
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: printed marks seated as parts - the VGA symbol
  tags:
    term: Tag
    role: furniture
    index-origin: 1
    description: the slide-out Express Service Tag under the right-hand drives
  psus:
    term: PSU
    role: service
    index-origin: 1
    description: the four 86 mm supply bays, PSU 3 over PSU 1 at the left and PSU 4 over PSU 2 at the right as the rear faces you
    attrs:
      redundancy: '2+2'
      redundancy-note: >-
        R960 ISM and technical guide: four AC or DC power supply units with 2+2 redundancy (ISM "System overview"; technical guide
        "Power supply units": up to four AC supplies with 2+2 redundancy, autosensing and auto switching).
  boss:
    term: Bay
    role: service
    index-origin: 1
    description: the BOSS-N1 boot module bay beside riser 1 at the rear
  risers:
    term: Riser
    role: service
    index-origin: 1
    description: >-
      the expansion card riser positions, numbered as Dell numbers them (1, 2, 3 and 4). `service` and not `traffic`, as on the R740xd:
      the group holds the riser, and the cards live in the riser's own slot bays, numbered as ISM table 88 numbers them.
  blanks:
    term: Blank
    role: service
    index-origin: 1
    description: the vented plates where riser 2 or riser 3 is absent, and the VGA bracket blank above riser 2
  memory:
    term: DIMM
    role: service
    index-origin: 1
    description: >-
      the 32 DDR5 slots of the system board, A1-A16 for processor 1 and B1-B16 for processor 2, named as ISM figure 95 prints them, seen
      from above with the rear at the top. The other 32 are `memory-expansion`
  memory-expansion:
    term: DIMM
    role: service
    index-origin: 1
    description: >-
      the 32 DDR5 slots of the processor expansion module, C1-C16 for processor 3 and D1-D16 for processor 4, as ISM figure 96 prints
      them. A group of their own because the PEM stands over the system board: each of its sockets has a twin under it at the
      same plan position
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: the six dual-rotor fan modules in the fan cage, numbered 1 to 6 as the cage prints them, left to right as the front faces you
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        R960 technical guide, thermal features: "The R960 allows N+1 fan redundancy, allowing continuous operation with one fan failure in
        the system."
  processors:
    term: CPU
    role: service
    index-origin: 1
    description: the four processor heatsinks - CPU 1 and CPU 3 on the right as the front faces you, CPU 2 and CPU 4 on the left (CPU 3 and 4 on the processor expansion module)
  interior:
    term: Part
    role: furniture
    index-origin: 1
    description: the system board, the processor expansion module, the fan cage, the air shrouds and the support bar
  covers:
    term: Cover
    role: furniture
    index-origin: 1
    description: >-
      the system cover and the drive cage cover on top, and the optional security bezel on the front. The bezel is DRAWN FITTED, as on
      the R740xd and R660: it is `mounts`, so the viewer takes it off to show the drives, and `for:` names what it covers.
  ocp:
    term: Slot
    role: traffic
    index-origin: 1
    description: the OCP NIC 3.0 slot
  lom-card:
    term: Card
    role: service
    index-origin: 1
    description: the LOM card position, held as a card and not its two ports (the ports are the card's own)
  rear-io:
    term: Board
    role: service
    index-origin: 1
    description: the rear I/O board position - the board carries the ID button, the iDRAC port, two USB and the VGA, which are its own ports
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the iDRAC Direct lamp
