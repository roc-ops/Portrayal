                   dimm-b7, dimm-b1, dimm-b8, dimm-b2, dimm-b9, dimm-b3,
                   dimm-a6, dimm-a12, dimm-a5, dimm-a11, dimm-a4, dimm-a10,
                   dimm-a7, dimm-a1, dimm-a8, dimm-a2, dimm-a9, dimm-a3,
                   heatsink-1, heatsink-2]}
        # THE HEATSINKS, one per processor, on the board and under the shroud
        # or the tray. Measured poses of `R740XD_ HeatSink 1U`; CPU1 right,
        # CPU2 left as seen from the front (ISM Figure 90).
        # `in: system-board` stands them on the board's PCB in 3D, 79.9 down,
        # and their measured 33.1 rises from there.
        # They are `mounts` and they are ALSO under the tray and its drives on
        # the nine mid-tray configurations - so render.py draws them in the
        # first pass, with the wells, rather than over the drives.
        - {ref: dell/heatsink-1u-14g@1, id: heatsink-1, at: [276.20, 265.80],
           group: processors, rel-pos: 1, in: system-board,
           under: [air-shroud, system-cover, mid-drive-tray-lff, mid-drive-tray-sff,
