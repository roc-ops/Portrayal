      placements:
        # THE LID, AND THE ONLY REASON THIS VIEW HAS PARTS AT ALL. The top was
        # five decor rectangles, so there was nothing to take off and nothing
        # underneath to take it off FOR. `behaviour: mounts` gives it the kit's
        # pull handle - the same one the bezel uses - in 2D and 3D alike.
        - {ref: dell/system-cover-14g@1, id: system-cover, at: [0.0, 0.0],
           group: covers, rel-pos: 1}
        # THE BOARD IS THE PCB, not the assembly's envelope: 422.8 x 456.5 from
        # the model's `Body_25_2.001`, with a notch at the rear left where the
        # supplies are (see the component). It is drawn first because everything
        # else in here stands on it. 46.17 below the lid line, so what shows of
        # it is the gaps between the fan cage, the shroud or tray, and the
        # rear. `under:` names all of them: a board is a well and they are
        # over it, which is what L13 checks before it lets the boxes share a
        # plan. The lid is not listed - `mounts` already puts it over anything.
        - {ref: dell/system-board-14g@1, id: system-board, at: [5.50, 6.20],
           group: interior, rel-pos: 1,
           under: [fan-cage, air-shroud, mid-drive-tray-lff, mid-drive-tray-sff,
                   mid-lff-0, mid-lff-1, mid-lff-2, mid-lff-3,
                   mid-sff-0, mid-sff-1, mid-sff-2, mid-sff-3,
