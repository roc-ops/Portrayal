        - ref: common/led-dot@1
          id: idrac-direct-led
          at: [462.50, 72.30]
          for: idrac-direct
          group: leds
          rel-pos: 1
          states: ['off',
                   {name: connected, color: '#22c55e'},
                   {name: recognised, color: '#22c55e',
                    behavior: {mode: blinking, rate: 0.25}}]
          description: >-
            ISM table 8 entire. `connected` is "solid green for two seconds" - a
            laptop or tablet has been plugged in, and the two seconds is how long
            that indication lasts before the next one rather than a blink, so it
            is modelled solid and the duration recorded here instead of being
            invented as a rate. `recognised` is "flashing green (on for two
            seconds and off for two seconds)", which is 0.25 Hz exactly. `off`
            is the device unplugged.
        - {ref: dell/rack-latch-14g@1, id: latch-left, at: [0.63, 46.91],
           for: chassis, group: latches, rel-pos: 1}
        - {ref: dell/rack-latch-14g@1, id: latch-right, at: [469.04, 46.91],
           for: chassis, group: latches, rel-pos: 2}
        - {ref: dell/bezel-2u-14g@1, id: bezel, at: [24.30, 2.23],
           for: [drive-0, drive-1, drive-2, drive-3, drive-4, drive-5, drive-6, drive-7, drive-8, drive-9, drive-10, drive-11, drive-12, drive-13, drive-14, drive-15, drive-16, drive-17, drive-18, drive-19, drive-20, drive-21, drive-22, drive-23, panel-left],
           group: covers, rel-pos: 0}
  rear:
    size:
      w: 434.0
      h: 86.8
    panel:
      decor:
        - {at: [3.0, 64.5], size: [233.0, 21.0], fill: '#6f767d'}
        # the teal and the blue Dell paints behind the serial and the VGA. It is
        # how the two D-subs are told apart on a crowded panel at arm's length,
        # and it is paint on the metal rather than part of either connector.
        - {at: [46.5, 65.5], size: [37.0, 19.5], fill: '#0f6f78'}
        - {at: [84.0, 65.5], size: [31.5, 19.5], fill: '#1f4f9e'}
      cutouts:
        - {id: idrac9, at: [28.60, 66.00], size: [16.0, 14.0], shape: rect}
        - {id: serial, at: [53.63, 68.60], size: [20.47, 11.4], shape: rect}
        - {id: vga, at: [87.30, 68.60], size: [20.47, 11.4], shape: rect}
        - {id: usb-1, at: [120.20, 73.06], size: [12.0, 4.5], shape: rect}
        - {id: usb-2, at: [120.20, 81.18], size: [12.0, 4.5], shape: rect}
        - {id: sys-id, at: [6.5, 68.5], size: [7.0, 7.0], shape: circle}
    components:
      bays:
        # THE BAY IS THE PLATE, NOT THE BRACKET ENVELOPE. Each riser now holds
        # std/pcie-bracket-fh and -lp at their real 120.02 and 79.20, which run
        # on past the riser's own 95 mm plate at both ends - so the riser
        # declares `insert` for what a slot must reserve and `size` for what it
        # draws. Sizing these bays to the envelope instead was tried and put
        # five overlaps on this face: riser 3 across the power supply, riser 1
        # down over the iDRAC port. None are collisions between PARTS - they are
        # boxes of things that sit at different heights, and the fix is to say
        # which number is which rather than to move anything.
        - {id: riser-1, at: [17.0, 4.0], size: {w: 95.0, h: 62.0},
           accepts: [dell/riser-1-3fh-14g@1, dell/riser-1-2fh-14g@1],
           default: dell/riser-1-3fh-14g@1,
           group: risers, rel-pos: 1}
        # RISER 2 IS TWO DIFFERENT HOLES, not one hole with two occupants. The
        # standards-only render against ISM figure 8 caught this: the figure
        # shows a low-profile slot at x 170..230, y 49.5..62.5 in the 4 x 2.5
        # machine, where the model showed bare panel - riser 2 carried
        # only-in: [no-rear-storage] and vanished, contradicting the rear-4-sff
        # description below, which costs riser 2 its "two full-height slots"
        # and not riser 2 itself. Dropping the only-in put a 62 mm plate
        # straight through both rear drive bays, and L13 was right to say so.
        # So: a TALL bay where the whole column is riser, and a SHORT one under
        # the drives where only the bottom band is. Both put slot 4's opening at
        # the same y 46.46, which is the check that nothing moved.
        - {id: riser-2, at: [161.0, 4.0], size: {w: 95.0, h: 62.0},
           accepts: [dell/riser-2-2fh-1lp-14g@1, dell/riser-2-3-blank-14g@1],
           default: dell/riser-2-2fh-1lp-14g@1,
           group: risers, rel-pos: 2, only-in: [no-rear-storage]}
        - {id: riser-2-lp, at: [161.0, 46.0], size: {w: 95.0, h: 20.0},
           accepts: [dell/riser-2-1lp-14g@1],
           default: dell/riser-2-1lp-14g@1,
           group: risers, rel-pos: 2, only-in: [rear-4-sff]}
        - {id: riser-3, at: [318.0, 4.0], size: {w: 95.0, h: 41.0},
           accepts: [dell/riser-3-2fh-14g@1, dell/riser-3-blank-14g@1],
           default: dell/riser-3-2fh-14g@1,
           group: risers, rel-pos: 3, only-in: [no-rear-storage]}
        - {id: ndc, at: [139.6, 66.4], size: {w: 90.3, h: 14.5},
           accepts: [dell/ndc-4x-rj45-14g@1], default: dell/ndc-4x-rj45-14g@1,
           group: ndc, rel-pos: 1}
        - {id: psu-1, at: [256.6, 45.0], size: {w: 88.7, h: 41.8},
           accepts: [dell/psu-1100w-ac-14g@1], default: dell/psu-1100w-ac-14g@1,
           group: psus, rel-pos: 1}
        - {id: psu-2, at: [345.3, 45.0], size: {w: 88.7, h: 41.8},
           accepts: [dell/psu-1100w-ac-14g@1], default: dell/psu-1100w-ac-14g@1,
           group: psus, rel-pos: 2}
        - {id: drive-r0, at: [173.0, 4.9], size: {w: 79.4, h: 17.868},
           accepts: [common/drive-carrier-25@1, common/drive-blank-25@1],
           default: common/drive-blank-25@1, rotate: 270,
           only-in: [rear-4-sff], group: drives-rear, rel-pos: 12}
        - {id: drive-r1, at: [173.0, 22.8], size: {w: 79.4, h: 17.868},
           accepts: [common/drive-carrier-25@1, common/drive-blank-25@1],
           default: common/drive-blank-25@1, rotate: 270,
           only-in: [rear-4-sff], group: drives-rear, rel-pos: 13}
        - {id: drive-r2, at: [331.0, 4.9], size: {w: 79.4, h: 17.868},
           accepts: [common/drive-carrier-25@1, common/drive-blank-25@1],
           default: common/drive-blank-25@1, rotate: 270,
           only-in: [rear-4-sff], group: drives-rear, rel-pos: 14}
        - {id: drive-r3, at: [331.0, 22.8], size: {w: 79.4, h: 17.868},
           accepts: [common/drive-carrier-25@1, common/drive-blank-25@1],
           default: common/drive-blank-25@1, rotate: 270,
           only-in: [rear-4-sff], group: drives-rear, rel-pos: 15}
      placements:
        # THE LIBRARY'S RJ45, not a second opinion about what one looks like.
        # This was common/rj45-jack, which draws its own face at 15.8 x 13.2
        # where the governed aperture is 16.0 x 14.0. HELD BY ITS BOTTOM EDGE,
        # not its corner: the iDRAC, serial and VGA share a baseline at y 80
        # (fact sheet B.3) and that is the fact worth preserving, so y moves
        # from 66.80 to 66.00 to keep the taller part sitting on the same line.
        - {ref: std/rj45@1, id: idrac9, at: [28.60, 66.00], rotate: 180,
           attrs: {role: management}, group: mgmt-ports, rel-pos: 1}
        - {ref: common/db9-receptacle@1, id: serial, at: [48.47, 68.05],
           group: mgmt-ports, rel-pos: 2}
        - {ref: common/vga-receptacle@1, id: vga, at: [82.13, 68.05],
           group: mgmt-ports, rel-pos: 3}
        - {ref: std/usb-a@1, id: usb-1, at: [120.20, 73.06],
           attrs: {speed: usb-3.0}, group: mgmt-ports, rel-pos: 4}
        - {ref: std/usb-a@1, id: usb-2, at: [120.20, 81.18],
           attrs: {speed: usb-3.0}, group: mgmt-ports, rel-pos: 5}
        # `for:` names BOTH riser-2 bays. The handle crosses riser 2 whichever
        # of its two holes this configuration has, and listing only the tall one
        # left the short one unexempted the moment it existed.
        - {ref: dell/rear-handle-14g@1, id: rear-handle, at: [133.0, 43.0],
           for: [riser-2, riser-2-lp, ndc], group: furniture, rel-pos: 1}
        - {ref: dell/system-id-button-14g@1, id: sys-id, at: [6.5, 68.5],
           for: chassis, group: mgmt-rear, rel-pos: 1}
        - {ref: common/led-indicator@1, id: sys-status, at: [18.5, 70.0],
           for: chassis, group: leds, rel-pos: 2,
           states: ['off', {name: 'on', color: '#2563eb'}]}
        - {ref: dell/idrac-direct-symbol@1, id: mark-idrac9, at: [33.2, 81.0],
           for: idrac9, group: marks, rel-pos: 10}
        - {ref: common/serial-symbol@1, id: mark-serial, at: [61.8, 81.4],
           for: serial, group: marks, rel-pos: 11}
        - {ref: common/vga-symbol@1, id: mark-vga-r, at: [97.9, 81.0],
           for: vga, group: marks, rel-pos: 12}
        # THE MARK MOVED BECAUSE THE PORTS DID. It sat under the lower socket,
        # which was fine while the stack rode 2.6 mm high and was a collision the
        # moment the stack dropped to where figure 8 puts it. The figure has a
        # small feature at x 111.6..115.8 in this band, left of the sockets,
        # which is where a legend belongs on a stack this close to the chassis
        # edge - so it goes beside them rather than beneath.
        - {ref: common/usb-symbol@1, id: mark-usb-r, at: [113.20, 80.60],
           for: usb-1, group: marks, rel-pos: 13}
        - {ref: common/nic-symbol@1, id: mark-nic, at: [182.0, 81.2],
           for: ndc, group: marks, rel-pos: 14}
configurations:
  base:
    kind: base
    source: derived
    default: true
    description: >-
      the chassis as an enclosure you can power on: every drive bay filled with a
      blank. DERIVED and not sourced - Dell publishes no default drive count for
      this chassis, so this is the library populating bays by role rather than
      following an orderable bundle, and the two are not equally good.
      THE PCIe SLOTS ARE NAMED HERE RATHER THAN LEFT TO THE BAY DEFAULT. A base
      is a chassis you can log into with nothing decided about expansion, so its
      traffic slots have to be EMPTY - and empty on real hardware means a filler
      bracket, not a hole, because the airflow depends on it. Saying so
      explicitly is what distinguishes "nobody has chosen a card yet" from
      "somebody forgot to write the bays down".
    bays:
      riser-1: dell/riser-1-3fh-14g@1
      riser-2: dell/riser-2-2fh-1lp-14g@1
      riser-3: dell/riser-3-2fh-14g@1
  no-rear-storage:
    kind: orderable
    description: >-
      the three-riser rear: seven full-height PCIe slots across risers 1, 2 and
      3, one half-height, and no rear drives. Drawn from the R740 ISM figure 9,
      "Back view of three riser system", which passes Gate 1 at 0.26%.
  rear-4-sff:
    kind: orderable
    description: >-
      four 2.5 inch drives in the rear, which costs riser 2's two full-height
      slots and all of riser 3 - the R740xd ISM figure 8. THE BAYS ARE METAL AND
      NOT OCCUPANCY: this configuration has holes the other does not, which is
      why the competing sets carry `only-in` rather than differing by what is
      plugged into them.
  rear-2-lff:
    kind: orderable
    description: >-
      NAMED AND NOT YET DRAWN. The R740xd ISM figure 9 shows two 3.5 inch drives
      in the rear, and this library has no 3.5 inch carrier - so the
      configuration is recorded and left unfinished rather than quietly drawn
      with a 2.5 inch drive standing in for one, which would be a picture of a
      machine nobody can order.
  full-24:
    kind: example
    description: >-
      all 24 bays carrying a drive. An ILLUSTRATION and not a SKU: the number of
      drives is what a buyer chooses, so this names no orderable thing and
      creates no device type.
    bays:
      drive-0: common/drive-carrier-25@1
      drive-1: common/drive-carrier-25@1
      drive-2: common/drive-carrier-25@1
      drive-3: common/drive-carrier-25@1
      drive-4: common/drive-carrier-25@1
      drive-5: common/drive-carrier-25@1
      drive-6: common/drive-carrier-25@1
      drive-7: common/drive-carrier-25@1
      drive-8: common/drive-carrier-25@1
      drive-9: common/drive-carrier-25@1
      drive-10: common/drive-carrier-25@1
      drive-11: common/drive-carrier-25@1
      drive-12: common/drive-carrier-25@1
      drive-13: common/drive-carrier-25@1
      drive-14: common/drive-carrier-25@1
      drive-15: common/drive-carrier-25@1
      drive-16: common/drive-carrier-25@1
      drive-17: common/drive-carrier-25@1
      drive-18: common/drive-carrier-25@1
      drive-19: common/drive-carrier-25@1
      drive-20: common/drive-carrier-25@1
      drive-21: common/drive-carrier-25@1
      drive-22: common/drive-carrier-25@1
      drive-23: common/drive-carrier-25@1
