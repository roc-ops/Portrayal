  # THE FOUR FACES THAT WERE MISSING. 83 of the library's 84 devices carry all
  # six views and this one carried two, which is what stops it being opened in
  # the 3D explorer at all.
  # WHAT THE SERVICE MODEL CONFIRMED: `Dell_PowerEdge_740_Shell-1.001` runs
  # x -216.9..217.1, which is 434.0 - the chassis width this entire device is
  # laid out on, taken from the datasheet and never before checked against a
  # second source. It now has one.
  # WHAT IT COULD NOT GIVE: anything along the DEPTH. This GLB poses parts and
  # it poses the ones that matter here - the system cover reads 444.0 wide
  # against the shell's 434.0 and runs to z 732.3 where the rear panel plane is
  # 713.5, so it is slid back. Every depth on these four faces is therefore
  # estimated, and each band says so in its own source rather than inheriting a
  # blanket disclaimer.
  # THE EDGE BANDS ARE #1a1d21 AND WENT IN AT #25292e, which is 41 grey against
  # this chassis's 52 - eleven levels, and invisible. Caught before anyone had
  # to report it, because three separate features on this device have already
  # been drawn in a tone that could not be seen against what they sit on.
  top:
    # REAR AT y=0, FRONT AT y=737.5. That is this library's plan convention -
    # every UfiSpace top puts screw-r* at the top of the drawing and screw-f*
    # at the bottom - and it is the viewer's: the top face is mounted so that
    # SVG y=0 lands at the rear. This view was first authored the other way
    # round, and looked right in 2D and mirrored in 3D, with the fan wall two
    # thirds of the way back. CAD: top_y = 713.5 - raw_z.
    # AND x = 217 - raw_x - w, NOT raw_x + 217. That one is the REAR face's
    # frame - psu-1 at raw 34.3 is at rear x 251.30 - and a plan is the rear
    # seen from the other side, so it runs the other way: the supplies are
    # at device-left, x 6.6..182.7 here, which is where the ISM's board figure
    # notches the PCB and where the rear view has them on its right. The top
    # was first built in the rear's frame, which put CPU1 on the left; every
    # x in this view has been mirrored since, and the asymmetric ones - the
    # DIMM sockets by name, the heatsinks by processor, the fan wall's wider
    # centre gap - checked against Figure 90 afterwards.
    size: {w: 434.0, h: 737.5}
    panel:
      decor:
        - {id: edge-left, at: [0.0, 0.0], size: [6.0, 737.5],
           fill: '#1a1d21', confidence: estimated,
           source: "the shell's own folded edge seen from outside. ESTIMATED width - the fold is real, the 6.0 is not measured"}
        - {id: edge-right, at: [428.0, 0.0], size: [6.0, 737.5],
           fill: '#1a1d21', confidence: estimated,
           source: "the shell's own folded edge seen from outside. ESTIMATED width - the fold is real, the 6.0 is not measured"}
        - {id: edge-rear, at: [0.0, 0.0], size: [434.0, 6.0],
           fill: '#1a1d21', confidence: estimated,
           source: "the shell's own folded edge seen from outside. ESTIMATED width - the fold is real, the 6.0 is not measured"}
        - {id: edge-front, at: [0.0, 731.5], size: [434.0, 6.0],
           fill: '#1a1d21', confidence: estimated,
           source: "the shell's own folded edge seen from outside. ESTIMATED width - the fold is real, the 6.0 is not measured"}
        # THE COVER LATCH IS NO LONGER PAINT ON THIS PANEL. It was decor
        # here, with its width measured and its depth position openly recorded
        # as "a placement and not a reading" because the cover carrying it is
        # posed in that axis. Both problems go away at once now the cover is a
        # part: the latch is on the lid, where it belongs, and de-posing the
        # lid turns its depth position into a reading. See
        # dell/system-cover-14g@1.
    components:
      bays:
        # TWENTY-FOUR DIMM BAYS at the measured seated positions of Dell's
        # `R740XD_ Memory Module`, 3.8 x 133.4 each on a ~9.45 pitch, named
        # for their sockets in the order of ISM Figure 90. The bay is the
        # DIMM's own footprint; the socket around it is drawn on the board.
        # Under the shroud, or on the nine mid-tray configurations under the
        # tray and its drives - `under:` says so, and L13 takes a bay's word
        # for having depth because an opening always has some.
        - {id: dimm-b6, at: [20.80, 281.00], size: {w: 3.8, h: 133.4},
           accepts: [common/dimm-plan@1], default: common/dimm-plan@1,
           group: memory, rel-pos: 1, physical-context: Memory, in: system-board,
           under: [air-shroud, system-cover, mid-drive-tray-lff, mid-drive-tray-sff, mid-lff-0, mid-lff-1,
                   mid-lff-2, mid-lff-3, mid-sff-0, mid-sff-1, mid-sff-2, mid-sff-3]}
        - {id: dimm-b12, at: [30.30, 281.00], size: {w: 3.8, h: 133.4},
           accepts: [common/dimm-plan@1], default: common/dimm-plan@1,
           group: memory, rel-pos: 2, physical-context: Memory, in: system-board,
           under: [air-shroud, system-cover, mid-drive-tray-lff, mid-drive-tray-sff, mid-lff-0, mid-lff-1,
