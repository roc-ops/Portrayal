    size: {w: 434.0, h: 737.5}
    panel:
      decor:
        - {id: edge-left, at: [0.0, 0.0], size: [6.0, 737.5],
           fill: '#1a1d21', confidence: estimated,
           source: "the shell's own folded edge seen from outside. ESTIMATED width - the fold is real, the 6.0 is not measured"}
