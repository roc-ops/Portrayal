        # THE RISER CARDS, standing in the board well behind the rear plates.
        # They are the furniture the expansion cards plug into; the cards
        # themselves are NOT here. A card's slot is the rear view's bay -
        # that is the face it is changed from - and this view had once
        # carried a second bay per slot with a generic card in it that nothing
        # tied to the rear one. See the gap. Riser 1's is MEASURED: Dell's model has its PCB at cad x -203.8,
        # which is face x 419.2..420.8, with the connectors inboard of it, so
        # the footprint runs 408.0..420.8 - the PCB at the bay's outer edge,
        # against the chassis wall. Riser 2's full-height card and riser 3's
        # are that cage placed BY ANALOGY at their own bays' outer edges (the
        # rear view's riser-2 bay ends at face x 278.7, riser-3's at 16.7 with
        # its brackets turned, so its card is mirrored); the model carries
        # neither. The low-profile riser 2 is measured as 2C.
        - {ref: dell/riser-card-14g@1, id: riser-1-card, at: [408.00, 13.90],
