        # the drives, not around them, and overlap none of them.
        # SHIFTED LEFT 6.94 TO MATCH THE PART'S OWN EXTENDED CANVAS. The
        # component grew a bridging strip on its left edge to close a gap
        # against dell/riser-1-shroud-14g@1; moving the placement the same
