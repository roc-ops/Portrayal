configurations:
  base:
    kind: base
    source: derived
    default: true
    description: >-
      the chassis as an enclosure you can power on: every drive bay filled with a
      blank. DERIVED and not sourced - Dell publishes no default drive count for
      this chassis, so this is the library populating bays by role rather than
      following an orderable bundle, and the two are not equally good.
  full-24:
    kind: example
    description: >-
      all 24 bays carrying a drive. An ILLUSTRATION and not a SKU: the number of
      drives is what a buyer chooses, so this names no orderable thing and
      creates no device type.
    bays:
      drive-0: common/drive-carrier-25@1
      drive-1: common/drive-carrier-25@1
      drive-2: common/drive-carrier-25@1
      drive-3: common/drive-carrier-25@1
