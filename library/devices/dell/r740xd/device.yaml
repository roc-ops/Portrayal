format: 1
kind: device
name: r740xd
version: 0.3.0
manufacturer: Dell
model: PowerEdge R740xd
description: 2U two-socket rack server - 24 x 2.5 inch front drive bays
profile: server
maturity: draft
provenance:
  chassis: >-
    datasheet - the R740xd spec sheet gives Height 86.8 mm, Width 434 mm, Depth
    737.5 mm and notes the figures exclude the bezel. 434 is the BODY between the
    ear folds; the drawn front face is 482.6 because this device's ears carry
    ports (see front-face).
  front-face: >-
    THE EARS ARE PART OF THE FACEPLATE AND CARRY PORTS, so they are drawn. Dell
    builds the mounting flanges into the front moulding and puts the VGA in the
    right-hand ear, the power button and USB stack in the strip beside it, and
    the system health lamp in the left. A 434 mm face would leave real,
    field-visible ports with nowhere to live. L43 tests what is seated in the
    outer 25 mm rather than the width, and passes this device for that reason.
  gate-1: >-
    ISM figure 2 'Front view of 24 x 2.5 inch drive system', rendered from the
    PDF at 600 dpi, measures 3168 x 564 px on the chassis itself - aspect 5.6170
    against 482.6/86.8 = 5.5599, which is 1.03%. ORTHOGRAPHIC, and at 6.5644
    px/mm. An earlier reading of 12.16% measured the docling-EXTRACTED PNG, whose
    bounding box takes in the callout numerals and leader lines; extracting a
    figure and measuring a figure are not the same operation.
  bay-pitch: >-
    17.868 mm, read three times from three documents that agree to 0.05 mm:
    Dell's marketing render of this device (Gate 1 2.10%) gives 17.868; the
    r750-24d-2-5-front Visio master, a line drawing of the 15G successor that
    passes Gate 1 at 0.67%, gives 17.8454 across 23 gaps of exact vector
    coordinates; and ISM figure 2 at 600 dpi gives 17.9094 from the 24 orange
    release rings. The device's OWN source is kept - adopting a measurement of a
    different machine would trade provenance for false precision - and the other
    two are corroboration.
  bay-origin: >-
    THE ARRAY IS CENTRED, and that is a measurement rather than an assumption.
    ISM figure 2 puts the first release ring 35.27 mm from the left edge of the
    face and the last at 447.18, so the array runs 26.3..456.1 and leaves margins
    of 26.3 and 26.5 - symmetric to 0.15 mm. Implausibility is a failed check;
    symmetry here is the check passing. x is therefore (482.6 - 24 x 17.868)/2 =
    26.884.
  bay-vertical: >-
    drawing - the r750 master draws 22 of its 24 carriers with an identical
    outline at y 4.01..83.02, height 79.01 mm (bays 1 and 24 catch chassis paths
    and are excluded). Correcting the 0.7% by which that master draws the face
    87.39 mm tall instead of 86.8 gives 78.48. common/drive-carrier-25 carries
    79.4 from an independent source, and 0.5% agreement between a render and a
    line drawing is why that figure stands rather than being re-derived here.
  right-control-panel: >-
    THE R740xd AND R750 SHARE THIS PANEL, which is what licenses reading exact
    vector geometry off the 15G master for a 14G machine, and it is established
    rather than assumed: the master puts the VGA at x 471.18..479.06 where the
    R740xd's own ISM figure puts it at 471.13..478.90 - 0.16 mm - and their power
    button centres agree to 0.5 mm. Where the two DISAGREE the ISM wins, because
    it is this device: the R750 carries one USB-A on this panel and the R740xd
    carries two, so the USB positions are the ISM's.
  left-control-panel: >-
    photo-measured from ISM figure 2 at 6.5644 px/mm. NOT taken from the R750
    master, which disagrees by 1.9 mm in x on the light bar and so is a different
    panel - the agreement that licensed the right-hand panel does not hold here,
    and reading it across anyway would have been the same evidence used twice
    with the negative result discarded.
  y-correction: >-
    the ISM figure draws the face 85.8 mm tall where the datasheet says 86.8, so
    every y read off it is scaled by 1.0103. x needs no such correction: the
    figure's width matches 482.6 to the 1.03% that Gate 1 reports.
  ports: >-
    POSITIONS from the figures above; SIZES from the registry. A connector's
    dimensions belong to spec/schemas/standards.yaml and to the std/ parts that
    conform to it, never to a reading of a picture - the picture is only allowed
    to say where the part sits.
  drive-default: >-
    EVERY BAY DEFAULTS TO A BLANK. A bay with nothing in it renders as an open
    hole, and a rack server does not ship with 24 open holes - it ships filled,
    because the airflow depends on it. Dell publishes no default drive count for
    this chassis, so the honest default is the filler rather than a drive count
    somebody invented. A populated machine is a configuration.
  power: >-
    NOT STATED HERE. The Information Update tech sheet (Rev 2, Nov 2022) lists
    thirteen orderable PSUs from 495 W to 2600 W across AC, DC, HVDC and Mixed
    Mode, so there is no single chassis figure to record; the draw belongs to
    whichever PSU is fitted, and that is a rear-face question this draft does not
    reach.
  bezel: >-
    DRAWN FITTED, AND IT DECLARES WHAT IT HIDES. `for:` names all 24 drive bays
    and the left control panel, which is how the C40G's snap-on PSU cover says it
    sits over four supplies - the same construction, and the reason L13 does not
    read a cover as a sizing mistake. A viewer can then hide it and see what is
    behind, which is the point.
    An earlier draft made it an `optional:` placement, the mechanism the
    SmartOptics rack ears use, and that was the wrong tool: `optional:` is for
    something absent unless asked for, and this is something PRESENT that a
    reader chooses to look past.
    IT CLEARS BOTH EARS AND DOES NOT COVER THE WHOLE FACE. At 434 x 82.35 centred
    on the 482.6 x 86.8 face it leaves 24.3 mm of ear showing each side and 2.2
    above and below, which is the operator's description of where it sits and is
    what fixed its size - see dell/bezel-2u-14g, whose master aspect fails Gate 1
    against a rack face precisely because a rack face is not what it covers.
  not-yet-modelled: >-
    THIS IS A FRONT-FACE DRAFT AND SAYS SO. No rear view, no top view with the
    lid off, no riser configurations - the tech sheet documents twelve of those
    and they are the rear's business. The two control panels are drawn as their
    apertures and contents rather than as the field-replaceable units they are;
    the ISM has removal procedures for both, so each should become a component
    with its own bay, and the light bar in particular has no part in the library
    that fits it.
chassis:
  width: 434.0
  height: 86.8
  depth: 737.5
  color: '#2f3439'
  edge: '#1d2125'
  silk: '#c9ced3'
groups:
  drives:
    term: Drive
    role: service
    index-origin: 0
    description: >-
      the 24 front bays. `service` rather than `traffic` because the five roles
      are network-shaped and traffic means a revenue port; a drive is a
      field-replaceable module that does the machine's work, which is the nearest
      of the five and is said here rather than left to be guessed.
    attrs: {media: sff-2.5}
  ports:
    term: Port
    role: management
    index-origin: 1
    mixed: local console and service access
    description: >-
      the front I/O: two USB 2.0, the iDRAC Direct micro USB and the VGA. Three
      families in one block DELIBERATELY - Dell's own table calls them one thing,
      the right control panel, and they do one job: they are what you plug a
      keyboard, a screen and a laptop into when you are standing at the rack.
      Splitting them by media would draw three groups where the faceplate has
      one. None of them is traffic; this chassis carries no network port on its
      front face.
  panels:
    term: Panel
    role: service
    index-origin: 1
    description: >-
      the control panels, which are field-replaceable units rather than features
      of the metal - the ISM carries removal and installation procedures for
      each. The right-hand one is still drawn as loose placements and is the next
      thing to become a module.
  covers:
    term: Cover
    role: service
    index-origin: 1
    description: >-
      removable covers over the face. The bezel is the only one, and it is drawn
      only when asked for: it hides the drives it protects, which is the whole
      point of it and exactly why the default drawing leaves it off.
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: >-
      printed and moulded marks that say what the opening beside them is for.
      They are `furniture` because nothing plugs into them and nothing lights -
      a mark that lit would be a lamp, and this panel has one of those and it is
      the power button.
  mgmt:
    term: Control
    role: management
    index-origin: 1
    description: the power button - what you press, not what you plug into
