# THE FRONT AND THE REAR ARE NOT INDEPENDENT, and nothing in this file can say
# so yet. Recorded as a gap rather than left for the next person to rediscover
# from a bay number that does not add up.
gaps:
  - what: mid-drive-tray
    scope: [front, rear]
    reason: needs-drawing
    note: >-
      ISM table 28 puts a MID DRIVE TRAY in three of its ten backplane rows -
      2.5 inch x4 behind the 24-bay front, 3.5 inch x4 behind the 12-bay one.
      This device models no mid bay at all, so a third of the orderable
      combinations cannot be expressed and a whole drive location is absent.
      IT IS NOT A FACE. The tray sits under the lid between the fans and the
      backplane, so it belongs to a top view with the cover off, which this
      device does not have either. Recorded here because a reader counting drive
      bays against a spec sheet will find this device short and no view will
      explain why.
    wanted: >-
      A top-with-cover-off view and a mid-tray bay group, or an explicit
      statement that this library models only externally visible bays. Either
      answers the question; leaving it unsaid does not.
  - what: front-panel-variants
    scope: [front, lff-12-rear-2, lff-12-rear-4]
    reason: needs-drawing
    note: >-
      ISM figures 17 and 18 number five fronts - 24, 16 and 8 x 2.5 inch at bays
      0-23, 0-15 and 0-7, and 12 and 8 x 3.5 inch at 0-11 and 0-7. This device
      draws ONE of them, the 24 x 2.5 inch. The others are not modelled and the
      12 x 3.5 inch is the one that matters, because it is the front the rears
      numbered 12-15 and 12-13 belong to.
      IT WAS BLOCKED ON A CARRIER AND IS NOT ANY MORE.
      common/drive-carrier-35 now exists, measured off ISM figure 9, and
      `rear-2-lff` draws with it. What remains is the FRONT PANEL itself - 12
      apertures in a 3 x 4 grid where this device draws 24 in a row, which is
      different metal rather than different occupancy, so it needs a second
      front view rather than a carrier.
    wanted: >-
      common/drive-carrier-35 and a 12 x 3.5 inch front view declaring
      `face: front`, after which `lff-12-rear-2` and `lff-12-rear-4` can bind it
      and the two rear numberings stop being mutually exclusive readings of one
      drawing.
  - what: front-rear-configuration-coupling
    scope: [front, rear, rear-4-sff, rear-2-lff]
    reason: vendor-silent
    note: >-
      DELL ENUMERATES THEM. ISM table 28, "Supported backplane options for
      PowerEdge R740XD systems", lists front, mid and rear together - ten rows,
      and the coupling falls straight out:
        2.5in x24                                      no rear
        2.5in x24  + 2.5in x4 mid  + 2.5in x4 rear
        2.5in x24 (20 SAS/SATA + 4 NVMe)               no rear
        3.5in x12                                      no rear
        3.5in x12  + 3.5in x4 mid  + 3.5in x2 rear
        3.5in x12  + 3.5in x4 mid  + 2.5in x4 rear
        3.5in x12                  + 3.5in x2 rear
        3.5in x12                  + 2.5in x4 rear
        2.5in x24 NVMe                                 no rear
        3.5in x12 Hybrid with NVMe U.2                 no rear
      The 24-bay front takes ONE rear, the 4 x 2.5 inch, which figure 19 numbers
      24-27. The 12-bay front takes either, and figure 19 numbers both from 12.
      This device carries the 24-bay front, which is why its rear reads 24-27.
      THE ARITHMETIC GOT THERE FIRST AND IS NOW REDUNDANT. Bays numbered 12-15
      imply eleven bays this model does not have; that is how the error was
      found. Table 28 is how it is now SOURCED, and a guess agreeing with a
      document afterwards is worth more than either alone.
      THE RISER SIDE IS TABLE 25, and its discriminator is riser 2 rather than
      riser 3. Rear storage is offered in riser configurations 0, 1 and 2 and no
      others: 1 and 2 fit a one-slot low-profile riser 2 (2B or 2C, slot 4
      only), while configuration 3 fits a three-slot 2A (slots 4, 5, 6) and has
      NO rear storage despite fitting no riser 3 at all. It is riser 2's
      full-height section that occupies the bay the rear cage needs. This
      device's `no-rear-storage` and `rear-4-sff` already encode exactly that,
      and row 3 itself is now `no-riser-3` - added when the riser 3 opening and
      rear storage bay 3 turned out to be the SAME HOLE, closed by two
      different blanks depending on which configuration you picked.
      RE-READ AND STILL OPEN: that change touched which bay closes an opening,
      not the front-to-rear coupling this gap is about. Re-read again when
      riser 1's brackets moved 1 mm and slot 2 lost its numeral on 1A - both
      are ink and geometry inside one bay, and neither reaches across faces.
      Re-read a third time when riser 1's plate grew to meet the slot strip and
      the shroud: the bay's own box moved, and still nothing crossed a face.
      A fourth time when riser 2's three slots were aligned and its plate cut
      back to the full-height pair. That one surfaced a NEW question but not a
      new gap of this kind: a bay's occupant is drawn after the panel, so a
      card cannot be shown "only through its cutout" without a part drawn after
      the bays to mask it. Recorded where it belongs, on the riser 2 slot 6
      cutout, rather than widened into this one.
      A fifth time when the screw tab was split out of the frame so it could
      draw in front of riser 2's bracket tails. That is a draw-order fact about
      one bay, not a coupling between faces.
      TWO SOURCES DISAGREE AND ARE LEFT DISAGREEING. The system information
      label draws FIVE fronts - 24, 16 and 8 x 2.5 inch, 12 and 8 x 3.5 inch -
      where table 28 lists TWO front backplanes. Whether the 16- and 8-bay
      fronts are different chassis or one backplane drawn part-populated,
      nothing held here says.
      AND TABLE 28 HAS A MID DRIVE TRAY in three of its ten rows. This device
      models no mid bay at all, which is a whole third drive location missing
      rather than a detail.
    wanted: >-
      NOW DEMONSTRABLE RATHER THAN HYPOTHETICAL. `rear-2-lff` draws a correct
      2 x 3.5 inch rear on a 24 x 2.5 inch front, and ISM table 28 lists no such
      machine - every row carrying that rear has a 12-bay front. The mismatch
      even forced an id: the figure prints 12 and 13, which are already two of
      this chassis's front bays, so the rear ones had to be rear-drive-12 and
      rear-drive-13. An id clash is what this gap looks like from the inside.
      RE-READ AFTER THE REAR BAYS WERE SEPARATED, and still open. The rear half
      of this is now expressible: the chassis structure across bays 2 and 3 is
      its own always-present part, and what each bay holds - drives, PCIe, a
      blank - varies independently of the other. That was the piece `only-in`
      could not reach while one 287 mm component owned both bays.
      WHAT REMAINS IS THE FRONT. The 24 x 2.5 inch and 12 x 3.5 inch fronts are
      different panels, not different occupancy, and until the second is drawn
      nothing exercises the face-binding that would couple it to a rear.
      A way for a configuration to constrain more than one view at once. Today
      `only-in` scopes a bay to a configuration and every view chooses
      independently, so nothing stops a consumer selecting a 24-bay front and a
      rear numbered 12-15 - a machine that cannot be bought. The library needs
      either configurations that span views, or a declared incompatibility
      between them; and this device needs its 12 x 3.5 inch front modelled
      before either can be exercised, which is the same gap `rear-2-lff` already
      stands on.

configurations:
  base:
    # the serial port's insulator is teal on this machine, not the
    # near-black a DE-9 usually carries - std/db9@1's `teal` skin. Named in
    # every configuration because a skin override has no device-wide default
    # and all five of these show this rear.
    skins:
      db9: teal
    kind: base
    source: derived
    default: true
    description: >-
      the chassis as an enclosure you can power on: every drive bay filled with a
      blank. DERIVED and not sourced - Dell publishes no default drive count for
      this chassis, so this is the library populating bays by role rather than
      following an orderable bundle, and the two are not equally good.
      THE PCIe SLOTS ARE NAMED HERE RATHER THAN LEFT TO THE BAY DEFAULT. A base
      is a chassis you can log into with nothing decided about expansion, so its
      traffic slots have to be EMPTY - and empty on real hardware means a filler
      bracket, not a hole, because the airflow depends on it. Saying so
      explicitly is what distinguishes "nobody has chosen a card yet" from
      "somebody forgot to write the bays down".
    bays:
      riser-1: dell/riser-1-3fh-14g@1
      riser-2: dell/riser-2-2fh-1lp-14g@2
      riser-3: dell/riser-3-2fh-14g@1
  no-rear-storage:
    # the serial port's insulator is teal on this machine, not the
    # near-black a DE-9 usually carries - std/db9@1's `teal` skin. Named in
    # every configuration because a skin override has no device-wide default
    # and all five of these show this rear.
    skins:
      db9: teal
    kind: orderable
    description: >-
      the three-riser rear: seven full-height PCIe slots across risers 1, 2 and
      3, one half-height, and no rear drives. Drawn from the R740 ISM figure 9,
      "Back view of three riser system", which passes Gate 1 at 0.26%.
  rear-4-sff:
    kind: orderable
    # THE BAYS ARE SEATED HERE, and `bays:` was there all along. An earlier note
    # in this file claimed a configuration could not say which accepted module
    # fills a bay, and put an override on a command line instead. It can, and
    # render.py has honoured it the whole time: bay id to component ref, with an
    # empty string for a deliberately empty bay. riser-2 is not listed because
    # it is not in THIS build - riser-2-lp is, and it already defaults right.
    bays:
      drive-24: common/drive-carrier-25@1
      drive-25: common/drive-carrier-25@1
      drive-26: common/drive-carrier-25@1
      drive-27: common/drive-carrier-25@1
    skins:
      drive-carrier-25: default
      db9: teal
    description: >-
      four 2.5 inch drives in the rear, which costs riser 2's two full-height
      slots and all of riser 3 - the R740xd ISM figure 8. THE BAYS ARE METAL AND
      NOT OCCUPANCY: this configuration has holes the other does not, which is
      why the competing sets carry `only-in` rather than differing by what is
      plugged into them.
  rear-2-lff:
    # the serial port's insulator is teal on this machine, not the
    # near-black a DE-9 usually carries - std/db9@1's `teal` skin. Named in
    # every configuration because a skin override has no device-wide default
    # and all five of these show this rear.
    skins:
      db9: teal
    # `example`, NOT `orderable`, AND IT WAS MARKED ORDERABLE BEFORE. ISM
    # table 28 lists no configuration pairing a 24 x 2.5 inch front with a
    # 2 x 3.5 inch rear - every row carrying this rear has a 12 x 3.5 inch
    # front, and this device draws the 24-bay one.
    kind: example
    description: >-
      DRAWN NOW, AND IT IS A PICTURE OF A REAR RATHER THAN OF A MACHINE.
      common/drive-carrier-35 exists, measured off ISM figure 9, so the two
      3.5 inch bays and the numbering on the divider between them are real and
      sourced. What is not real is the pairing: table 28 has no row with a
      24 x 2.5 inch front and a 2 x 3.5 inch rear, so selecting this shows a
      correct rear on a front it never ships with.
      THE ID CLASH IS THAT MISMATCH MADE VISIBLE. The figure prints 12 and 13,
      which are already two of this chassis's front bays, so the rear ones are
      rear-drive-12 and rear-drive-13 rather than following the ink the way
      drive-24 to drive-27 do. Named the obvious way, lint caught full-24
      fitting a 2.5 inch carrier into a 3.5 inch bay.
      It stops being an illustration the day the 12 x 3.5 inch front is drawn
      and a configuration binds the two faces together.
  no-riser-3:
    skins:
      db9: teal
      # RISER 1A LEAVES SLOT 2 UNLABELLED. Its middle opening has no connector
      # behind it and takes a filler only, and the operator states that position
      # carries no printed number. Nothing in the intake draws a 1A machine, so
      # this is the operator's word rather than a reading - see the strip's own
      # provenance.
      pcie-slot-strip-14g: no-2
    kind: orderable
    description: >-
      TABLE 25's ROW 3, 1A+2A - the three-slot riser 2 fitted and no riser 3 at
      all. Six PCIe slots, and the riser 3 opening carries the same perforated
      blank that closes a rear storage bay, because it is the same opening.
      IT HAD NO CONFIGURATION UNTIL NOW and the variant sheet reported that as a
      gap: it is the only row in table 25 that fits riser 2 without riser 3, so
      nothing in the device named it and the drawing could only be produced by
      overriding a bay from outside.
    bays:
      riser-1: dell/riser-1-2fh-14g@1
      riser-2: dell/riser-2-2fh-1lp-14g@2
  rear-storage-blank:
    # the serial port's insulator is teal on this machine, not the
    # near-black a DE-9 usually carries - std/db9@1's `teal` skin. Named in
    # every configuration because a skin override has no device-wide default
    # and all of these show this rear.
    skins:
      db9: teal
    kind: orderable
    description: >-
      THE "WITHOUT" HALF OF "WITH OR WITHOUT REAR STORAGE". ISM table 25 names
      riser configurations 0, 1 and 2 that way - one riser layout, two storage
      outcomes - and every other configuration on this device draws the "with".
      Here the one-slot low-profile riser 2 is fitted, no drives were ordered,
      and both rear bays carry a perforated blank.
      IT IS ORDERABLE WHERE rear-2-lff IS NOT. Table 28's rows 1, 3 and 9 all
      pair a 24 x 2.5 inch front with no rear backplane at all, which is exactly
      this machine, so unlike the 2 x 3.5 inch illustration this is a build you
      can buy.
      WHAT IT DOES NOT SHOW is riser 3: configurations 1 and 2 fit none, and the
      bay it would occupy is the one blanked here. `no-rear-storage` is the
      other shape - a three-slot riser 2 and a riser 3 - and the two are not the
      same machine despite both having no rear drives.
  full-24:
    # the serial port's insulator is teal on this machine, not the
    # near-black a DE-9 usually carries - std/db9@1's `teal` skin. Named in
