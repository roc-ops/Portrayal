# THE FRONT AND THE REAR ARE NOT INDEPENDENT, and nothing in this file can say
# so yet. Recorded as a gap rather than left for the next person to rediscover
# from a bay number that does not add up.
gaps:
  - what: riser-1-shroud-frame-gap-estimated
    scope: [rear]
    reason: needs-hardware
    note: >-
      A GAP THAT SHOWED AS A HOLE THROUGH THE PANEL is now bridged, and the
      bridge is estimated rather than measured. dell/riser-1-shroud-14g@1 ends at
      device x 137.32 and dell/rear-bay-frame-14g@4 used to start at 144.26,
      leaving 6.94 mm neither part drew - straight on, that read as an opening
      into the machine, and the shroud's composed shelf overhangs it, which made
      it look like a lid over open air.
      A CAD READ WAS ATTEMPTED. R740XD_GPU_Brackets_01-1 - the assembly
      riser-1-shroud-14g is measured from - gives a footprint 36.9 mm wide
      against the shroud's declared 25.62, from two independent mesh children
      agreeing to the hundredth. It was not applied: the same instance's y
      extent runs -40 to +24 against an 86.8 mm panel, which is not a seated
      pose, and moving 6.94 mm of real geometry on a reading that fails its own
      plausibility check would be worse than not reading it.
      So rear-bay-frame-14g now carries an estimated bridging plate on its own
      left edge, in its own metal, closing the gap without asserting a shape for
      it. Everything the frame already drew - rails, rivets, the far tab, the
      drive-bay openings - stays at the device coordinates it always occupied;
      only the new strip and the component's placement moved, by the same 6.94.
    wanted: >-
      a seated (not exploded) reading of R740XD_GPU_Brackets_01-1, or a
      mechanical drawing of the panel between riser 1 and the rear bay frame
  - what: front-vga-setback-estimated
    scope: [front, front-lff-12]
    reason: needs-hardware
    note: >-
      THE NUMBER CAME FROM A DESCRIPTION, NOT A MEASUREMENT. std/vga@1 stands
      6.73 proud because that is what a D-sub does when its flange bolts through
      sheet metal, and on this machine's front the connector is on the control
      panel board, which sits back from the bezel - so only a little of it
      emerges. The operator, looking at the hardware, put that at "a millimetre
      and a half"; `inset: 5.23` is 6.73 less 1.50 and is therefore an estimate
      dressed as two decimal places.
      IT IS THE SETBACK THAT IS UNKNOWN, not the connector. The 6.73 is TE
      114-40010's mating dimension and stays; what nobody here has measured is
      how far behind the faceplate the board sits. A caliper on the hardware, or
      any drawing that dimensions the control panel board against the front
      bezel, replaces one number and nothing else.
      THE REAR D-SUBS ARE NOT AFFECTED. They bolt through the rear panel in the
      ordinary way and carry no inset.
    wanted: >-
      the control panel board's setback from the front bezel, measured
  - what: psu-top-edge-unsettled
    scope: [rear]
    reason: sources-disagree
    note: >-
      TWO NUMBERS, ONE APPEARANCE EACH, AND NEITHER CORROBORATED. This device
      seats both supplies at y 46.20, and the only other place that number
      appears is a comment on riser 2's plate saying the plate was cut back to
      "face 46.20 - the power supply's top edge", which cites this seating
      rather than a source. psu-1100w-ac-14g's provenance used to argue the
      module top was y 45.0, read off R740 ISM figure 9 - but it argued that in
      the same breath as a height of 41.8, and the height has since been
      measured off Dell's own service model at 39.1. A position argued from a
      reading whose companion number is disproven is not evidence for the
      position.
      THE CAD CANNOT ANSWER IT. glb-parts.py states the rule it enforces:
      sizes survive a pose and positions do not, and this scene draws the
      supply with its withdrawal handle swung open for a removal procedure. The
      body measures cleanly at 86.3 x 39.1 x 195.5 and its face y lands
      nowhere near either candidate.
      AN ATTEMPT TO RE-READ FIGURE 9 FAILED GATE 1 AT 13.18%, against a
      provenance that claims 0.26% for the same figure - so the failure is in
      the panel detection, not in the figure, and nothing may be taken off it
      until somebody finds the body's true top and bottom edges in that raster.
      The seating is left where it is rather than moved on a measurement that
      did not pass its own gate.
      WHAT WOULD SETTLE IT: the body edges in ISM figure 9 identified by hand
      rather than by ink-density, which turns the 13.18% back into the 0.26%
      the figure is capable of and makes the fraction readable. 1.2 mm is worth
      one careful pass, because riser 2's plate is cut to this number.
    wanted: >-
      the supply's top edge on the rear face, from a figure that has passed Gate 1
  - what: riser-configurations-not-all-declared
    scope: [rear, riser-1, riser-2, riser-2-lp, riser-3]
    reason: needs-drawing
    note: >-
      THE PARTS EXIST FOR ALL ELEVEN AND THE DEVICE DECLARES THREE. Technical
      guide Table 12 names eleven riser configurations - 0, 1, 2, 3, 4, 5, 6, 9,
      15, 16 and 17 - and the eleven Dell part numbers behind them are now
      modelled one apiece: 1A, 1B, 1D, 2A, 2B, 2C, 2D, 2E, 2F, 3A and 3B, plus a
      no-riser arrangement for configuration 0. What this device still seats is
      riser configuration 5 (1B+2A+3A), 3 (1A+2A) and 1 (1B+2B), because those
      are the three its configurations were written around before the parts
      existed to say anything else.
      SO THIS IS A GAP IN THE DEVICE AND NOT IN THE LIBRARY, which is the reason
      it is worth recording separately from the four below: nothing needs
      measuring, drawing or sourcing. Eight configurations are a seating list
      away, and the reason token is the nearest available rather than an honest
      fit - `needs-drawing` is what the vocabulary offers for "the model cannot
      say it yet" and no token means "the parts are ready and nobody has wired
      them up".
      WHAT DOES NEED A DECISION FIRST is what the eight are called. The naming
      agreed for this device is a drive configuration plus a riser
      configuration - `lff12-rsff4-rc1` for the 16-drive machine on riser
      configuration 1 - and applying it renames every existing configuration,
      which is a change of addressing that belongs in its own version rather
      than riding along with a component split.
    wanted: >-
      eleven configurations seating the eleven riser parts, under the drive-plus-riser
      naming, replacing the three that exist
  - what: mid-drive-tray
    scope: [front, rear]
    reason: needs-drawing
    note: >-
      ISM table 28 puts a MID DRIVE TRAY in three of its ten backplane rows -
      2.5 inch x4 behind the 24-bay front, 3.5 inch x4 behind the 12-bay one.
      This device models no mid bay at all, so a third of the orderable
      combinations cannot be expressed and a whole drive location is absent.
      IT IS NOT A FACE. The tray sits under the lid between the fans and the
      backplane, so it belongs to a top view with the cover off, which this
      device does not have either. Recorded here because a reader counting drive
      bays against a spec sheet will find this device short and no view will
      explain why.
      IT IS NO LONGER SHORT OF NUMBERS. Dell's own R740XD 3D guide CAD carries
      `740XD_ MidDriveTray_-1.001` at 431.5 x 94.5 x 181.2 mm, with its bracket
      (`740XD_ MidDriveTray_ Bracket-1.001`, 73.40 x 18.10 x 117.00) and its
      drives (`740XD_ MidDriveTray_ 2.5 HDD-5.002`, 69.90 x 15.00 x 100.20 on a
      108.4 pitch) as named sub-parts. The R740 and R740xd Technical Guide adds
      what the tray is FOR - "The 4 x 3.5-inch mid-bay storage option, which also
      supports 2.5-inch drives in the Hybrid carrier" - which also names the
      hybrid carrier this library does not have. An interior photograph is staged
      beside the front one in working/intake/dell/r740xd/photos.
      So what remains is drawing, not measuring.
    wanted: >-
      A top-with-cover-off view and a mid-tray bay group, or an explicit
      statement that this library models only externally visible bays. Either
      answers the question; leaving it unsaid does not. The geometry is now
      available from the CAD rather than needing to be estimated.
  - what: front-panel-variants
    scope: [front, front-lff-12]
    reason: needs-drawing
    note: >-
      ISM figures 17 and 18 number five fronts - 24, 16 and 8 x 2.5 inch at bays
      0-23, 0-15 and 0-7, and 12 and 8 x 3.5 inch at 0-11 and 0-7.
      TWO OF THE FIVE ARE NOW DRAWN. `front` is the 24 x 2.5 inch; `front-lff-12`
      is the 12 x 3.5 inch, the one that mattered, because it is the front the
      rears numbered 12-15 and 12-13 belong to. It is a variant view with
      `face: front`, bound by `lff-12` and `lff-12-rear-2-lff`, and its grid was
      measured off dellr740xd-12x35.webp at Gate 1 0.07% - the same backplane
      opening the 24 SFF bays divide, 428.832 / 4 = 107.208 against a measured
      period of 107.216.
      THE 16 AND 8 x 2.5 INCH AND THE 8 x 3.5 INCH ARE STILL NOT MODELLED, and
      no figure for them has been measured.
    wanted: >-
      the remaining three fronts as further `face: front` variants, each with a
      configuration to bind it.
  - what: front-rear-configuration-coupling
    scope: [front, front-lff-12, rear, rear-4-sff, rear-2-lff, lff-12, lff-12-rear-2-lff]
    reason: vendor-silent
    note: >-
      DELL ENUMERATES THEM. ISM table 28, "Supported backplane options for
      PowerEdge R740XD systems", lists front, mid and rear together - ten rows,
      and the coupling falls straight out:
        2.5in x24                                      no rear
        2.5in x24  + 2.5in x4 mid  + 2.5in x4 rear
        2.5in x24 (20 SAS/SATA + 4 NVMe)               no rear
        3.5in x12                                      no rear
        3.5in x12  + 3.5in x4 mid  + 3.5in x2 rear
        3.5in x12  + 3.5in x4 mid  + 2.5in x4 rear
        3.5in x12                  + 3.5in x2 rear
        3.5in x12                  + 2.5in x4 rear
        2.5in x24 NVMe                                 no rear
        3.5in x12 Hybrid with NVMe U.2                 no rear
      The 24-bay front takes ONE rear, the 4 x 2.5 inch, which figure 19 numbers
      24-27. The 12-bay front takes either, and figure 19 numbers both from 12.
      This device carries the 24-bay front, which is why its rear reads 24-27.
      THE ARITHMETIC GOT THERE FIRST AND IS NOW REDUNDANT. Bays numbered 12-15
      imply eleven bays this model does not have; that is how the error was
      found. Table 28 is how it is now SOURCED, and a guess agreeing with a
      document afterwards is worth more than either alone.
      THE RISER SIDE IS TABLE 25, and its discriminator is riser 2 rather than
      riser 3. Rear storage is offered in riser configurations 0, 1 and 2 and no
      others: 1 and 2 fit a one-slot low-profile riser 2 (2B or 2C, slot 4
      only), while configuration 3 fits a three-slot 2A (slots 4, 5, 6) and has
      NO rear storage despite fitting no riser 3 at all. It is riser 2's
      full-height section that occupies the bay the rear cage needs. This
      device's `no-rear-storage` and `rear-4-sff` already encode exactly that,
      and row 3 itself is now `no-riser-3` - added when the riser 3 opening and
      rear storage bay 3 turned out to be the SAME HOLE, closed by two
      different blanks depending on which configuration you picked.
      RE-READ AND STILL OPEN: that change touched which bay closes an opening,
      not the front-to-rear coupling this gap is about. Re-read again when
      riser 1's brackets moved 1 mm and slot 2 lost its numeral on 1A - both
      are ink and geometry inside one bay, and neither reaches across faces.
      Re-read a third time when riser 1's plate grew to meet the slot strip and
      the shroud: the bay's own box moved, and still nothing crossed a face.
      A fourth time when riser 2's three slots were aligned and its plate cut
      back to the full-height pair. That one surfaced a NEW question but not a
      new gap of this kind: a bay's occupant is drawn after the panel, so a
      card cannot be shown "only through its cutout" without a part drawn after
      the bays to mask it. Recorded where it belongs, on the riser 2 slot 6
      cutout, rather than widened into this one.
      A fifth time when the screw tab was split out of the frame so it could
      draw in front of riser 2's bracket tails. That is a draw-order fact about
      one bay, not a coupling between faces.
      A sixth time when riser 3 became bay 1 reflected - mirrored brackets, a
      two-slot plate and its own slot strip. Handedness is a fact about one
      bay's own metal and reaches no further than that.
      A seventh time when riser 3 slid 9.525 right to sit over the power
      supply's edge. Moving one bay along its own face changes nothing about
      which front it can be sold with.
      An eighth time when two "rivet" pairs beside the divider turned out to be
      card retention clips. A misread of what is on the rear, corrected on the
      rear, and silent about any front.
      A ninth time when those rivets came back, scoped: they are what the riser
      cage mounts to and they show when drives are fitted instead. That one is
      a rear configuration telling two rear drawings apart, which is the
      mechanism this gap says is MISSING between faces - and still is.
      A tenth time when the C20 supply became its own part. A second occupant
      for an existing bay, on the same face, coupled to nothing at the front.
      TWO SOURCES DISAGREE AND ARE LEFT DISAGREEING. The system information
      label draws FIVE fronts - 24, 16 and 8 x 2.5 inch, 12 and 8 x 3.5 inch -
      where table 28 lists TWO front backplanes. Whether the 16- and 8-bay
      fronts are different chassis or one backplane drawn part-populated,
      nothing held here says.
      AND TABLE 28 HAS A MID DRIVE TRAY in three of its ten rows. This device
      models no mid bay at all, which is a whole third drive location missing
      rather than a detail.
    wanted: >-
      NOW DEMONSTRABLE RATHER THAN HYPOTHETICAL. `rear-2-lff` draws a correct
      2 x 3.5 inch rear on a 24 x 2.5 inch front, and ISM table 28 lists no such
      machine - every row carrying that rear has a 12-bay front. The mismatch
      even forced an id: the figure prints 12 and 13, which are already two of
      this chassis's front bays, so the rear ones had to be rear-drive-12 and
      rear-drive-13. An id clash is what this gap looks like from the inside.
      RE-READ AFTER THE REAR BAYS WERE SEPARATED, and still open. The rear half
      of this is now expressible: the chassis structure across bays 2 and 3 is
      its own always-present part, and what each bay holds - drives, PCIe, a
      blank - varies independently of the other. That was the piece `only-in`
      could not reach while one 287 mm component owned both bays.
      WHAT REMAINS IS THE FRONT. The 24 x 2.5 inch and 12 x 3.5 inch fronts are
      different panels, not different occupancy, and until the second is drawn
      nothing exercises the face-binding that would couple it to a rear.
      A way for a configuration to constrain more than one view at once. Today
      `only-in` scopes a bay to a configuration and every view chooses
      independently, so nothing stops a consumer selecting a 24-bay front and a
      rear numbered 12-15 - a machine that cannot be bought. The library needs
      either configurations that span views, or a declared incompatibility
      between them; and this device needs its 12 x 3.5 inch front modelled
      before either can be exercised, which is the same gap `rear-2-lff` already
      stands on.

