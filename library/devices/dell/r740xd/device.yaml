                     lff12-rsff4-rc1-1b2b, lff12-rsff4-rc2-1b2c, lff12-mlff4-rlff2-rc0-noriser,
                     lff12-mlff4-rlff2-rc1-1b2b, lff12-mlff4-rlff2-rc2-1b2c, lff12-mlff4-rsff4-rc0-noriser,
                     lff12-mlff4-rsff4-rc1-1b2b, lff12-mlff4-rsff4-rc2-1b2c, sff24-rc0-noriser,
                     sff24-rc1-1b2b, sff24-rc2-1b2c, sff24-rsff4-rc0-noriser, sff24-rsff4-rc1-1b2b,
                     sff24-rsff4-rc2-1b2c, sff24-msff4-rsff4-rc0-noriser, sff24-msff4-rsff4-rc1-1b2b,
                     sff24-msff4-rsff4-rc2-1b2c]}
