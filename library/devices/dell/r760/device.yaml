configurations:
  # GENERATED from one table, as the R660's are: six fronts by twelve riser configurations (ISM table 153 and the
  # technical guide's table 14: 0 to 10 and 13; 3-2, 5-2 and 10-2 share their -1 builds' rears, 12 repeats 7 and 11 is
  # the paddle build, see the gaps), then the rear-storage builds - 2 x 2.5 inch and 4 x E3.S modules with
  # configuration 7, the 4 x 2.5 inch module with configuration 6 - which ISM tables 88 to 90 pair with the 24 x 2.5 and
  # 12 x 3.5 inch fronts only. The ISM and technical guide do not restrict the riser configurations by front, so every front
  # carries every riser configuration. 78 builds and an example.
  sff24-rc1-1b2a3b4b:
    kind: orderable
    default: true
    description: '24 x 2.5 inch front (ISM figure 1); riser configuration 1, R1B + R2A + R3B + R4B: six x8 full-height Gen4 slots (1, 2, 4, 5, 7, 8) and two x16 low-profile Gen4 slots (3, 6). ISM table 153.'
  sff24-rc2-1q2a3b4q:
    kind: orderable
    description: '24 x 2.5 inch front (ISM figure 1); riser configuration 2, R1Q + R2A + R3B + R4Q: four x8 full-height Gen5 slots (1, 2, 7, 8), two x8 full-height Gen4 (4, 5) and two x16 low-profile Gen4 (3, 6). ISM table 153.'
    bays: &bays-rc2 {riser-1: dell/riser-1q-2u-16g@1, riser-4: dell/riser-4q-2u-16g@1}
  sff24-rc3-1p2a3b4p:
    kind: orderable
    description: '24 x 2.5 inch front (ISM figure 1); riser configuration 3 (3-1; the full-length 3-2 shares its rear), R1P + R2A + R3B + R4P: two x16 full-height Gen5 slots (2, 7), two x16 low-profile Gen4 (3, 6) and two x8 full-height Gen4 (4, 5). ISM table 153.'
    bays: &bays-rc3 {riser-1: dell/riser-1p-2u-16g@1, riser-4: dell/riser-4p-2u-16g@1}
  sff24-rc4-1p2a3b4r:
    kind: orderable
    description: '24 x 2.5 inch front (ISM figure 1); riser configuration 4-1, R1P + R2A + R3B + R4R: x16 full-height Gen5 slots 2 and 7 (7 SNAPI-capable), x16 low-profile Gen4 slots 3 and 6, x8 full-height Gen4 slots 4 and 5. ISM table 153.'
    bays: &bays-rc4 {riser-1: dell/riser-1p-2u-16g@1, riser-4: dell/riser-4r-2u-16g@1}
  sff24-rc5-1r2a3a4p:
    kind: orderable
    description: '24 x 2.5 inch front (ISM figure 1); riser configuration 5 (5-1; the full-length 5-2 shares its rear), R1R + R2A + R3A + R4P: x16 full-height slots 1 (Gen4), 2 (Gen5), 5 (Gen4) and 7 (Gen5) and x16 low-profile Gen4 slots 3 and 6. ISM table 153.'
    bays: &bays-rc5 {riser-1: dell/riser-1r-2u-16g@1, riser-3: dell/riser-3a-2u-16g@1, riser-4: dell/riser-4p-2u-16g@1}
  sff24-rc6-2a4q:
    kind: orderable
    description: '24 x 2.5 inch front (ISM figure 1); riser configuration 6, R2A + R4Q, no riser 1 or 3: x16 low-profile Gen4 slots 3 and 6 and x8 full-height Gen5 slots 7 and 8; rear storage possible (TG table 14). ISM table 153.'
    bays: &bays-rc6 {riser-1: dell/riser-1-blank-2u-16g@1, riser-3: dell/riser-3-blank-2u-16g@1, riser-4: dell/riser-4q-2u-16g@1}
  sff24-rc7-1q2a4q:
