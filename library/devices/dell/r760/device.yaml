# SOURCES:
# Dell's PowerEdge R760 Installation and Service Manual (ISM), Technical Guide
# and Spec Sheet, all three public documents read as converted PDFs; no
# reseller, review, stencil or CAD figure is used. Positions are read off the
# ISM's embedded figures (1 to 6 the fronts, 10 to 14 the rears, 15 the top,
# 180 the system board) at the scale each one's own known dimension gives.
# STATE:
# DONE: six fronts (24 x 2.5, 16 x 2.5 Smart Flow, 8 x 2.5, 12 x 3.5, and the
# two 16 x EDSFF E3.S layouts of ISM figures 5 and 6), each with the ears and
# both control panels, the bezel fitted and hiding the drives; the rear for
# every riser configuration of ISM table 153 but the paddle one (0 to 10 and
# 13; 12 repeats 7), the rear drive modules (2 x 2.5 and 4 x E3.S in riser 3's
# place, 4 x 2.5 in riser 1's) and the 86 mm supplies; the top view - system
# board, 32 DIMM slots, heatsinks, air shroud, six fans and their cage, covers
# and the plan projections of the seated parts; estimated bottom and sides.
# NOT DONE: riser configuration 11 (the paddle cards, no slots), the Direct
# Liquid Cooling rear, the 1800 / 2800 / 3200 W and DC supplies, the 8 x E3.S
# front, the rail kits - see the gaps.
format: 1
kind: device
name: r760
version: 2.0.3
maturity: draft
manufacturer: Dell
model: PowerEdge R760
description: >-
  2U two-socket rack server, 16th generation - up to 24 x 2.5 inch front drive
  bays (or sixteen with the Smart Flow vent, eight, twelve 3.5 inch, or sixteen
  EDSFF E3.S), two 86 mm power supplies at opposite ends of the rear, up to
  eight PCIe slots on four risers, an OCP NIC 3.0 slot, a rear BOSS-N1 boot
  module and optional rear drives
profile: server
provenance:
  chassis:
    confidence: datasheet
    note: >-
      datasheet - ISM table 10 and figure 34: X 482.0 across the ears and 434.0
      between them, Y 86.8, and the depths Za 35.84 with the bezel and 22.0 without
      (ear to front face), Zb 700.7 ear to rear wall and Zc 736.29 ear to PSU
      handle. DEPTH 722.7 is the front face to the rear wall: Zb 700.7 plus the 22.0
      the ears sit behind the face without the bezel, as the R660 derives its 773.5.
      THE SPEC SHEET AND TECHNICAL GUIDE AGREE WITH THE ISM AND ARE NOT A DISAGREEMENT:
      they give 772.13 with the bezel and 758.29 without, and those are Za and 22.0
      plus Zc, the depth to the PSU handles (35.84 + 736.29 = 772.13; 22.0 + 736.29 =
      758.29). The handles stand 35.59 behind the rear wall (736.29 - 700.7).
  front-face:
    confidence: drawing
    note: >-
      THE EARS CARRY THE CONTROL PANELS, SO THEY ARE DRAWN - the R740xd's reasoning
      and the R660's: the left panel in the left ear and the power button, USB,
      iDRAC Direct and VGA in the right, so the front is the 482.6 rack face and
      the rack-latch levers are in the ears below them.
  gate-1:
    confidence: photo-measured
    note: >-
      ISM figure 1 (24 x 2.5), the embedded 1650 x 516 image, passes Gate 1: its
      face is 1594 px wide and 286 tall, aspect 5.573 against 482.6 / 86.8 = 5.560,
      0.24% - orthographic, at 3.30 px/mm. The other five fronts' embedded images
      are 1584 to 1593 px wide at 3.28 to 3.30 px/mm. THEIR EDGES ARE LESS CLEAR
      (the face's top is a light gradient), so x is read from each image's own
      width and y is taken from figure 1 and figure 4, whose both edges are clear.
      Every front position here is photo-measured to about 0.5 mm.
  drive-bays:
    confidence: photo-measured
    note: >-
      photo-measured - the 24 x 2.5 front's release rings (ISM figure 1) run from
      x 37.2 to 446.0, a 17.77 pitch on the figure's own width; with the 16 and 8
      drive figures' rings (35.3 to 160.0 and 321.1 to 445.7) the right-hand ring
      agrees across figures 1, 2 and 6 to 1 mm and the left differs by 1.9 in figure 1, whose
      left edge is the less clear. THE PITCH IS THE R740xd'S: with the first ring at 35.3 the
      pitch is 17.855 to the last, which is the 17.868 the R740xd's ISM and three
      other documents give for the same 2U 24-bay cage, so the bays are that
      device's - 17.868 on x 26.884, 79.4 tall at y 4.0 - and the rings land within
      0.9 mm of the measured centres. THE BAY IS NOT THE CARRIER: common/drive-carrier-25@2
      (15.3 x 73.0) stands centred in it, as on the R740xd. The 16 and 8 drive
      fronts use bays 0 to 7 of the same grid and, for the 16, bays 16 to 23.
  drive-numbering:
    confidence: datasheet
    note: >-
      datasheet - ISM figures 25 and 26 (the service label under the lid): the 24 x 2.5
      front numbers its bays 0 to 23 left to right; the 16 x 2.5 numbers 0 to 7 in
      the left group and 8 to 15 in the right; the 12 x 3.5 numbers DOWN EACH COLUMN,
      0 1 2 in the first, 3 4 5 in the second, 6 7 8 in the third and 9 10 11 in the
      fourth. THE FACE PRINTS NO NUMBER (the bottom lip in figure 1 at 3.5x carries
      only vent slots), so there is no legend; the numbers are the bays' rel-pos. The
      R740xd's 12-bay front numbers its bays across the rows by convention; this
      device follows the R760's own figure.
  drive-default:
    confidence: datasheet
    note: >-
      EVERY BAY DEFAULTS TO A BLANK, as on the R660 and R740xd: Dell publishes no default
      drive count and the ISM requires blanks in every empty slot for cooling. A
      populated machine is a configuration.
  e3s-fronts:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figure 27 (the E3.S service label) gives five cage slots across
      the front, each a backplane position of eight drives: configuration b (16 drives)
      fills slot 1 (bay 1, drives 0 to 7) and slot 4 (bay 2, drives 8 to 15), and
      configuration d (16 drives) slot 1 and slot 5. Those are the two figures the
      ISM and technical guide draw - figure 5 'direct' and figure 6 'RAID' - and each is
      a front of its own. The slots are 84.8 apart from x 28.0 (the vent plates read
      112.4..198.4, 198.4..282.8 and 367.5..453.4 in figure 5), the carriers 10.2 apart
      (the chevrons' centres, 35.2 to 106.6 and 289.4 to 361.0, in figure 5; 35.4 to
      106.9 and 375.2 to 446.8 in figure 6), 77.65 long as the carrier part is and
      centred on the face. The label's configurations a (32 drives) and c (8 drives)
      are not figures and are not modelled; the ISM states a maximum of 16.
  left-panel:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figure 1 at 3.30 px/mm: the left ear is 0..13.6 (rack-latch
      lever below, as the R740xd) and the control panel a dark strip 13.6..23.7, y 2.1
      to 84.1, with the glyph column and the health bar at the top. It is
      dell/control-panel-left-2u-16g@1, a taller panel than the R660's: its health bar
      is 17.0 long where the R660's health and Quick Sync bars share that length.
  right-panel:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figures 1 and 5 at 3.3 px/mm put the right panel where the
      R740xd's is within 1 mm - power button 458.0..466.2 by 4.1..12.3, USB 458.6..464.4,
      iDRAC Direct 460.7..464.3 by 63.5..72.1, VGA 469.3..478.8 by 16.5..35.2 - so the
      R740xd's positions and its 14G parts are used (dell/power-button-14g@1, std/usb-a@1,
      std/micro-usb@1, std/vga@1, as the R660 seats them). THE R760 HAS ONE USB PORT
      where the R740xd has two (ISM table 4: 'USB 2.0 port'), and a vent grid in the
      strip below it where the R740xd's second port is.
  idrac-direct-led:
    confidence: datasheet
    note: >-
      datasheet - ISM table 1 lists the iDRAC Direct status LED on the right panel and
      table 181 gives its three codes (solid green for two seconds when a laptop or
      tablet is connected, flashing green when recognised, off when unplugged);
      NO FIGURE DRAWS IT, so its place is the R740xd's, below the port, which that
      device's ISM states in words and this one's does not.
  bezel:
    confidence: measured
    note: >-
      measured - DRAWN FITTED, as on the R740xd and R660, and taken off in the viewer: the
      optional security bezel (dell/bezel-2u-16g@1) covers the body between the ears, and
      `for:` names the drives behind it. THE ISM DRAWS NO FRONT FIGURE WITH THE BEZEL
      ON; Dell's R760 service model (r760.glb, `R760_ FrontBezel`) gives its size, honeycomb,
      button and lock, and the ISM's isometric figure 37 is the check on the honeycomb (see that
      part). Its depth is where the model and the ISM disagree - see the bezel-depth gap. The LCD
      bezel is not modelled.
  fronts:
    confidence: drawing
    note: >-
      SIX FRONTS, EACH ITS OWN VIEW bound by `configurations.<name>.views`: front
      (24 x 2.5, figure 1), front-sff16 (16 x 2.5 with the Smart Flow centre vent,
      figure 2), front-sff8 (8 x 2.5 and two blanking plates, figure 3), front-lff12
      (12 x 3.5, figure 4), front-e3s16 and front-e3s16r (16 x EDSFF E3.S direct and
      RAID, figures 5 and 6). They share the ears, both control panels, the right panel,
      the rack latches, the information tag and the bezel. NO 'NO-BACKPLANE' FRONT IS
      LISTED: the ISM's front figures and its table 91 (backplanes) give none, where the
      R660's ISM lists a 0-drive front.
  vent-plates:
    confidence: photo-measured
    note: >-
      photo-measured - the plates that replace the unfilled drive positions: on the
      16 x 2.5 a Smart Flow vent plate over bays 8 to 15's width (169.8..312.8), on the 8 x 2.5 two
      blanking plates (170.3..308.5 and 311.0..452.0, the second's right end the less
      clear), on the E3.S fronts the three or two 84.8 mm vent plates of the slot grid. Each
      is a dark mesh in a frame. THE 16 x 2.5 FRONT'S SMART FLOW VENT IS MEASURED, as a coarse grid: ISM figure 2
      (fig-0002.png, 2.364 px/mm) shows eight columns by four rows of openings between thick bars, a 16.95 pitch
      across and 17.55 down, drawn as the R660 draws its vent (a frame and one rectangle per opening, 14.95 x 15.55).
      The fan and cables seen through the openings are not drawn. The 8 x 2.5 and E3.S plates' mesh is still a
      grille pattern whose cell is an estimate.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figure 10 (rear view), the embedded 1529 x 528 image, read at
      3.36 px/mm from the origin (22, 121) px: the chassis height 86.8 against 291 px, and
      the 434 body against the PSU bays' outer walls (1456 px at 3.355) - the figure is
      not strictly orthographic (the two scales agree to 0.1%, but the figure's top rows
      read about 4 mm higher than its bottom, so positions carry about 1.5 mm). The
      supplies are at the lower corners, the risers above them - riser 1 at the left, then
      the BOSS bay, riser 3, riser 4 at the right - riser 2 low in the middle over the
      LOM, OCP and rear I/O row, which is the R660's row moved down 44 mm.
  rear-psu-bays:
    confidence: photo-measured
    note: >-
      photo-measured - each bay is 86.3 x 41.0 at y 45.8: PSU 1 at x 9.8 (figure px 55 to
      345) and PSU 2 at x 342.3 (the figure's bay walls at px 1172 and 1478 give
      342.3 and 433.3, and the 86 mm form leaves 4.7 to the right-hand wall). The bay is
      the 86 mm form factor and a 60 mm supply seats in it through the PSU adapter
      (ISM 'Removing a power supply unit adapter': remove it 'when installing PSU with
      86 mm wide form factor'), so each bay accepts the 86 mm supply and the adapter module
      that carries a 60 mm one.
  rear-row:
    confidence: measured
    note: >-
      measured - the LOM card (110.59), OCP card (164.95) and rear I/O board (250.5) are the R660's
      parts at the R660's x positions, the R660's y plus 44.0, and the ISM's table 5 names the same
      items. DELL'S R760 SERVICE MODEL (r760.glb) PUTS THE ROW AT THE R660'S x, offset 0.0 once each model is
      referred to its own chassis centre line (see the rear-row-offset gap). THE ISM'S FIGURE READS THE ROW A LITTLE
      RIGHT OF THE R660'S, which the model does not support and which is not applied:
      the LOM RJ45 pair 115.5..133.3 and 136.9..154.8 against the R660's openings at 114.7 and 136.7;
      the OCP cage 169.0..242.0 against 164.95..236.75 (about 4 right); the rear I/O's ID button
      centred at 259.2 against 252.4, its iDRAC RJ45 276.2 against 274.4 and its VGA 323.8 against
      about 325. That is 2 to 7 mm against a figure good to 1.5 mm in x (and 4 mm in y between its
      riser rows), so the R660's positions are kept and the difference is recorded, not applied.
      No R760-specific face is drawn.
  rear-risers:
    confidence: photo-measured
    note: >-
      photo-measured - the four riser bays (see the cages' provenance for each window): riser 1
      x 0..125, the BOSS bay 127.4..166.4, riser 3 168.0..296.7, riser 4 296.7..434, all y 1.0 to
      45.0; riser 2 x 97.6..342.3, y 45.0..68.2. Riser 4 is read as riser 1's mirror image.
      THE RISERS OF EACH CONFIGURATION come from ISM table 153 and the technical guide's table 14
      (see the riser-configurations gap), seated per configuration. NO SLOT NUMERAL IS PRINTED
      IN THE FIGURE (resolving a 3 mm glyph needs about 10 px and the cages show none), so the
      slots carry Dell's numbers by id and rel-pos only; Dell numbers them 1 to 8 with slot 2
      above 1, 5 above 4 and 8 above 7, slot 3 at the left and 6 at the right of riser 2.
  rear-drives:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figures 12, 13 and 14: the 2 x 2.5 inch module (figure 12) and the 4 x
      E3.S module (figure 14) take riser 3's place; the 4 x 2.5 inch module (figure 13)
      takes riser 1's and the BOSS bay's, the BOSS module moving to the middle - that build is
      the `rear-4x25` view. The technical guide's table 14 lists rear storage as possible
      only with configurations 6, 7 and 12 (the ones with no riser 3), and the ISM's tables
      88 to 90 pair the rear drives with the 12 x 3.5 and 24 x 2.5 fronts only. The drives'
      slot numbers are in those tables (Slot 0 and 1, or 24 and 25, and so on) and are not
      resolved to a position: see the rear-drive-numbering gap.
  top:
    confidence: photo-measured
    note: >-
      photo-measured - ISM figure 15 (inside the system), the embedded top view of the chassis
      with the cover off, at 1.965 px/mm (the 434 body against 850 px; a perspective render, so
      about 2%), origin x 185 px and y 128 px (the rear wall): the six fans (plan x 12.7, 77.1,
      141.5, 225.4, 289.8, 354.2; y 432.6; each 64 x 61, a 19 mm gap in the middle) and their
      cage, the air shroud and its wings, the risers' roofs, the cage's top plate. THE AIR SHROUD, SYSTEM COVER (AND ITS
      LATCH), BACKPLANE COVER AND SIX FANS ARE NOW MEASURED from Dell's R760 service model (r760.glb, un-exploded
      `Main Assembly (1)` nodes, mapped to this plan with the rear wall at cad z 736.1 - plan y = 736.1 - cad z1 - and
      plan x = 209.0 - cad x1, cad x -8.0 being the body's centre line): the shroud 434.4 x 187.7 at (0.1, 241.1), the
      cover 434.0 x 571.6 (the model's 444.0 drawn on the body's 434.0) seated with its rear edge on the rear wall, the
      backplane cover 434.0 x 54.0 at y 543.4, the fans 63.8 (their pitch; 64.0 with the handle) x 58.2 x 68.0 at y 437.3. The model's fan cage, heatsinks, DIMMs and board are not re-read here: the
      figure's positions stand for them, 0.8 to 4.7 off the model's (the fan-module-length gap). Where the model and
      the figure disagree the gaps say so. The fixed plate in front of the backplane cover (the shell's own cage top,
      `PEr760_ Shell_ Top_-1.001`) is this view's panel decor. Figure 180
      (the system board's DIMM plan, 2233 x 1887 px) gives the board, the 32 DIMM sockets and
      the processor sockets at 5.2 px/mm, anchored on the 7.6 mm socket pitch (the R660's); it puts
      the board 424.4 wide against the R660 PCB's 423.1, the check. The two figures are joined by the
      DIMM groups' x positions, which the shroud's wings in figure 15 reproduce (152.7..280.0 against
      157.5..279.1 for the middle 16 sockets), and by the fan connectors on the board's front edge
      (y 478) lying under the fan cage (423..497). THE DIMM SOCKETS' REAR ENDS ARE AT PLAN Y 257
      (the shroud's rear edge, figure 15 callout 5), 114 mm in front of where figure 180's own
      origin would put them: that shift is the board's 'neck' (see the board part). Each socket is the figure's
      158.8 mm from latch to latch (plan y 257.0 to 415.8) and is drawn with common/dimm-plan@1 (3.8 x 133.4,
      the module without its latches) centred in it, at y 269.7. SEATED
      MODULES PROJECT INTO THIS VIEW through their rear bay's `plan:` - the supplies, the risers,
      the BOSS module, the LOM and OCP cards and the rear I/O board - at positions mirrored from
      the rear bays (plan x = 434 - rear x - width). NOT IN THIS VIEW: the heatsinks' true outline
      (the R660's retention plate is used), the cards, the drive backplane, the rear-mounting front PERC module and the
      intrusion switch module (figure 15 callouts 2, 8 and 1), and the cabling.
  sides-and-bottom:
    confidence: estimated
    note: >-
      estimated - no figure held shows the bottom or either side; their folded edges and the rail
      land are plausible shapes at plausible sizes, as on the R660, drawn so the faces are not
      blank, and marked estimated where drawn.
  rear-power:
    confidence: datasheet
    note: >-
      chassis.power is `ac`: the supplies this device accepts are the 86 mm 2400 W mixed-mode unit
      and the 60 mm 700 to 1400 W ones (ISM table 15: AC 100-240 V, mixed mode). The 1800 W C15,
      2800 W C21, 3200 W 277 V / HVDC and 1100 W -48 V DC supplies are not modelled (no figure
      shows their faces and the library holds no C22, 277 V or DC-terminal inlet for them), and
      when they are, power moves onto per-build configurations.
attrs:
  physical:
    ru: 2
    weight-max-kg: 36.1
  lifecycle: {eol: none-announced}
chassis:
  width: 434.0
  height: 86.8
  depth: 722.7
  ru: 2
  power: ac
  color: '#2f3439'
  edge: '#1d2125'
  silk: '#c9ced3'
gaps:
  - what: rail-kits-not-listed
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the ISM refers to the 'Dell Enterprise Systems Rail Sizing and Rack Compatibility Matrix' for
      rail types and ranges and names none; the technical guide (chapter 10) names the families
      only - ReadyRails II sliding rails (the B21 4-post kit), Stab-in/Drop-in sliding rails, static
      rails, the cable management arm and the strain relief bar - with no part number or depth.
      Neither document is a kit's source, so no `kits` or `ears.positions` are written.
    wanted: >-
      Dell's Enterprise Systems Rail Sizing and Rack Compatibility Matrix for the R760
  - what: riser-configuration-11-paddle-cards-not-modelled
    scope: [rear]
    reason: needs-photo
    note: >-
      riser configuration 11 (ISM table 153; technical guide table 14: R1 paddle + R2A + R3B + R4
      paddle) carries paddle cards at risers 1 and 4 that 'do not have a physical PCIe slot'. No
      figure shows their rear, and what plates the empty positions is unknown, so the configuration
      is not built. The paddle risers are ISM figures 22 and 32 of the technical guide.
    wanted: >-
      a rear photograph or ISM figure of the paddle-card build
  - what: riser-configurations-12-and-10-2-not-separate
    scope: [rear]
    reason: sources-disagree
    note: >-
      THE DOCUMENTS' CONFIGURATION LISTS DIFFER. The technical guide's table 14 lists 0, 1, 2, 3-1,
      3-2, 4-1, 5-1, 5-2, 6, 7, 8, 9, 10-1, 10-2, 11 and 12; the ISM's table 153 lists 1 to 12 and
      adds 13 (R2A alone, one x16 low-profile slot) and omits 10-2, which its table 167 gives. The
      ISM governs: configurations 0 to 10 and 13 are built. Configuration 12 is R1Q + R2A + R4Q in
      both documents - exactly configuration 7's risers - and has no table of its own in the ISM,
      so it is not built apart from 7. The -2 builds (3-2, 5-2 and 10-2) differ from the -1 builds in
      the full-length risers 1P FL, 3A FL and 4P FL and double-width cards, not in anything the rear
      shows, so each shares its -1 build's rear.
    wanted: >-
      Dell's statement of how configuration 12 differs from 7, if it does
  - what: riser-4r-slot-record-disagrees
    scope: [rear]
    reason: sources-disagree
    note: >-
      ISM table 153 lists riser R4R with slot 7 only (Gen5 x16 on processors 1 and 2 in configuration
      4-1; Gen5 x8 on processor 1 in 9 and 10-1), while table 18 gives it a slot 7 (x8+x8 SNAPI) and a
      slot 8 (x8, Gen5) and figure 222 labels two slots. dell/riser-4r-2u-16g@1 carries both slots, the
      configuration tables' x16 and processor 1 for slot 7; its own provenance has the detail.
    wanted: >-
      Dell's per-slot statement for riser 4R
  - what: rear-drive-numbering
    scope: [rear, rear-4x25]
    reason: vendor-silent
    note: >-
      ISM tables 88 to 90 name the rear drive slots (0 and 1; 24 and 25; 0 to 3; 24 to 27) by front
      configuration but not which physical drive is which. The upper and left drives are taken as
      the lower numbers, an estimate, and the 24 to 27 numbering of the SAS/SATA builds is not
      modelled.
    wanted: >-
      the rear drive module's service label (ISM 'rear drive module' figures) with the slot numbers
  - what: dlc-rear-not-modelled
    scope: [rear, top]
    reason: needs-drawing
    note: >-
      the Direct Liquid Cooling build (ISM figure 11) shows risers 3 and 4 with one slot each (slots 5
      and 7), coolant tubes leaving beside PSU 2 through a rear I/O board with no VGA, and a processor
      cooling module in place of the heatsinks (figure 17). The rear I/O board for it is
      dell/rear-io-board-dlc-16g@1, which was drawn for the R660 and is a 1U face; the 2U build's
      tubes, grommets and slot cages are not drawn, and its top view is not.
    wanted: >-
      a straight-on rear figure of the DLC build and a top view of its cold plates
  - what: other-supplies-not-modelled
    scope: [rear]
    reason: needs-photo
    note: >-
      the 1800 W (C15), 2800 W (C21), 3200 W 277 Vac / HVDC, 1400 W 277 Vac / HVDC and 1100 W -48 V DC
      supplies of ISM tables 15 and 16 are not modelled: no figure shows their faces, and the
      library holds no C22 inlet, 277 V inlet or DC terminal block that matches them
      (dell/dc-terminal-6ryj9 is a 14G part). The bays accept the 86 mm 2400 W supply and the
      60 mm 700, 800, 1100 and 1400 W ones. The 2400 W face is itself READ from a figure that does not
      label it: see dell/psu-2400w-ac-86mm@1.
    wanted: >-
      rear photographs of the other supplies
  - what: e3s-8-drive-front-not-modelled
    scope: [front]
    reason: vendor-silent
    note: >-
      the E3.S service label (ISM figure 27) lists an 8-drive configuration (c: slot 1 only), and the
      ISM and technical guide draw only the two 16-drive fronts; no figure shows the 8-drive front's
      other four slots, so it is not built.
    wanted: >-
      a front figure of the 8 x E3.S build
  - what: bezel-front-not-drawn
    scope: [front]
    reason: needs-photo
    note: >-
      no photograph or ISM figure of the R760's front with its bezel on, straight on, is held; see
      dell/bezel-2u-16g@1, whose size, openings, button and lock are measured from Dell's R760 service
      model (r760.glb) and checked against the ISM's isometric figure 37. What the model cannot give is
      how the drawn face looks in light: the colour is this drawing's.
    wanted: >-
      a straight-on photograph of an R760 front with the security bezel
  - what: bezel-depth
    scope: [front]
    reason: sources-disagree
    note: >-
      Dell's R760 service model (r760.glb, `PEr760_ FrontBezel_-1.001` `Body_1_33.001`) has the bezel 19.7
      deep, cad z 0.3..19.9 against the drive carriers' front face at z 19.5 (20.2 with the LED-number
      bodies); the ISM's table 10 gives 35.84 mm ear to front with the bezel and 22.0 without, which
      is 13.84 off the drives' face (the R660's table gives the same 13.84). Same measure, different value
      by 5.9 mm. The part's `depth` is the model's 19.7; its 3D plate is drawn to the ISM's 13.84, the figure
      Dell's own table allows to stand out of the chassis.
    wanted: >-
      a side view or dimensioned drawing of the R760 with the bezel fitted
  - what: card-bracket-flange-past-the-wall
    scope: [rear, risers]
    reason: needs-drawing
    note: >-
      the risers' cage plates are drawn 1.0 proud of the rear wall (the ISM's table 10, PDF page 34, puts nothing but
      the supplies' handles past it), and a seated card's bracket flange stands past the wall with the part of the riser
      that covers it. The flange is the bracket's own 9.4 return flange (std/pcie-bracket-lp@1 and -fh@2, PCIe CEM 5.0
      figures 11-9 and 11-5) and the cover is each cage's `flange-cover` node at 10.26, the flange and one sheet: an
      estimate, as the ISM gives no depth for either. A rear bay cannot recess its occupant, so the flange stands 9.4
      past the wall in a configuration with a card seated. Dell's R760 service model gives no reach to read: its
      supply runs to 861.8 and its risers end at 754 to 770, short of the wall.
    wanted: >-
      a side view or dimensioned drawing of a seated bracket under its riser's cover
  - what: air-shroud-depth
    scope: [top]
    reason: sources-disagree
    note: >-
      Dell's R760 service model (r760.glb, `PEr760_ Airshroud_ Assembly-1.001`) has the shroud 434.4 x 187.7
      (plan y 241.1..428.8); the ISM's figure 15 (callout 4 on the embedded top view, 1.965 px/mm, about 2%)
      read 430.0 x 166.0 at y 250.0..416.0 - 21.7 shorter. The model is drawn; the figure's reading is
      kept in the part's provenance. The shroud's wings (ISM figure 15) are not in the model's bounding
      box and are kept from the figure.
    wanted: >-
      a dimensioned top view of the R760's air shroud
  - what: system-cover-width
    scope: [top]
    reason: sources-disagree
    note: >-
      Dell's R760 service model (r760.glb, `PEr760_ SystemCover_-1.001` and the drive backplane cover) has
      the lids 444.0 wide, 5.0 over the body's 434.0 on each side; the ISM's table 10 gives 434.0 between
      the ears (Xb) and the R660's model has its lid at 433.4 against the same 434.0. The model's 444.0 is
      recorded in the parts' provenance and the lids are DRAWN AT THE BODY'S 434.0 (plan x 0.0): the lint
      (L150) does not let a part reach past the face without a stated `chassis.overhang`, and a lid's side
      flanges are not an overhang of the rack face. The depths, 571.6 and 54.0, are the model's.
    wanted: >-
      the R760's cover as a dimensioned drawing, or its folded edges' width
  - what: fan-module-length
    scope: [top]
    reason: sources-disagree
    note: >-
      Dell's R760 service model (r760.glb, `CoolingFan Prefab (n)`) has each fan module 64.0 x 58.2 on the plan
      and 68.0 tall; the ISM's figure 15 top view read 64.0 x 61.0 (about 2%), 2.8 longer. The model is drawn:
      the bays are 63.8 x 58.2 at plan y 437.3 against the figure's 432.6, and 0.8 to 3.8 right of the figure's
      x positions (the model's six modules span 402.5, the figure's 405.5). The width is the model's 63.8 pitch:
      each module's 64.0 box includes a handle that overlaps its neighbour's by 0.2, which the lint (an overlap
      of bays) does not allow.
    wanted: >-
      Dell's fan module dimensions
  - what: backplane-cover-extent
    scope: [top]
    reason: sources-disagree
    note: >-
      The ISM's figure 15 shows one plate from the backplane to the chassis front (read 129.1 deep, plan y
      593.6..722.7) and the part was first drawn as the 'drive backplane cover'. Dell's R760 service model
      (r760.glb) has the removable `PEr760_ DriveBackPlane_ Cover_ Assembly-1.001` only 54.0 deep (plan y
      543.4..597.4) over the backplane, and the plate in front of it is the shell's own fixed cage top,
      `PEr760_ Shell_ Top_-1.001` (z 12.0..141.8, 129.8 deep, plan y 594.3..724.1 - the figure's reading to
      1 mm). The cover part is the model's 54.0; the cage top is drawn as the top view's own panel decor, so
      the look is the figure's.
    wanted: >-
      confirmation that the ISM's 'drive backplane cover' is the 54 mm piece
  - what: rear-row-offset
    scope: [rear]
    reason: sources-disagree
    note: >-
      The model gives the rear row's x: r760.glb has the LOM card (`R760_ LOM`), OCP board and rear I/O board
      (`R760_ RearIO`) at cad x -128.0, -61.5 and 22.0 (the left edges), exactly 8.0 left of the R660's
      model (`PE_R660_LOM card_Assemby` -120.0, OCP -53.5, `PEr760_RearIOBoard_Assembly` 30.0) - and the R760's
      chassis centre line is 8.0 left of the R660's (-8.0 against 0.0, from the two models' system covers, and the R760's shell and supplies).
      So the row sits at the R660's x positions to 0.1 mm, and the R660's x are KEPT (measured). The ISM's
      figure 10 reads the row 2 to 7 mm right of them (see the rear-row provenance); that is not
      supported by the model and is within the figure's 1.5 mm and perspective, so it is recorded here, not applied.
      The OCP board is 12.0 shallower in the R760's model (120.6 against 132.6); the R660's OCP parts are used.
    wanted: >-
      a dimensioned rear view of the R760's rear row

groups:
  drives:
    term: Drive
    role: service
    index-origin: 0
    description: the front 2.5 inch bays, numbered as the ISM's service label numbers them (figure 25)
    attrs: {media: sff-2.5}
  drives-lff:
    term: Drive
    role: service
    index-origin: 0
    description: >-
      the twelve 3.5 inch front bays, numbered down each column (ISM figure 26): 0 1 2 in the first
      column, 3 4 5 in the second, 6 7 8 in the third and 9 10 11 in the fourth
    attrs: {media: lff-3.5}
  drives-e3s:
    term: Drive
    role: service
    index-origin: 0
    description: >-
      the EDSFF E3.S front bays, numbered left to right (ISM figure 27): 0 to 7 in the first group
      and 8 to 15 in the second
    attrs: {media: e3s}
  panels:
    term: Panel
    role: indicator
    index-origin: 1
    description: the left control panel, a field-replaceable module in the left ear
  ports:
    term: Port
    role: management
    index-origin: 1
    mixed: local console and service access
    description: the front VGA, the USB-A and the iDRAC Direct micro-AB USB
  mgmt:
    term: Button
    role: management
    index-origin: 1
    description: the power button
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: printed marks seated as parts - the USB, iDRAC Direct and VGA symbols and the panel's vent grid
  tags:
    term: Tag
    role: furniture
    index-origin: 1
    description: the slide-out Express Service Tag under the right-hand drives
  latches:
    term: Latch
    role: furniture
    index-origin: 1
    description: >-
      the rack release levers, one built into each ear. Pressed to free the chassis from the rail, so
      they release the BOX rather than operating anything in it, which is why they are furniture
  psus:
    term: PSU
    role: service
    index-origin: 1
    description: the two 86 mm supply bays, PSU 1 at the left as the rear faces you
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        R760 technical guide (power supplies): "up to two AC power supplies with 1+1 redundancy,
        autosensing, and auto switching capability"; ISM 'Hot spare feature': a hot-spare mode in which one
        supply sleeps while the other carries the load.
  boss:
    term: Bay
    role: service
    index-origin: 1
    description: the BOSS-N1 boot module bay between riser 1 and riser 3
  risers:
    term: Riser
    role: service
    index-origin: 1
    description: >-
      the expansion card riser positions, numbered as Dell numbers them (ISM table 5): riser 1 at the left,
      riser 2 low in the middle, riser 3 beside the BOSS bay and riser 4 at the right. `service` and not
      `traffic`, as on the R740xd and R660: the group holds the riser, and the cards live in the riser's own
      slot bays, numbered 1 to 8 as the ISM numbers them.
  drives-rear:
    term: Drive
    role: service
    index-origin: 1
    description: the rear drive module - 2 x 2.5 inch or 4 x E3.S in riser 3's place, 4 x 2.5 inch in riser 1's
  ocp:
    term: Slot
    role: traffic
    index-origin: 1
    description: the OCP NIC 3.0 slot
  lom-card:
    term: Card
    role: service
    index-origin: 1
    description: >-
      the LOM card position. The group holds the card, not its two ports, as the R740xd's NDC group does: the
      ports are the card's own.
  rear-io:
    term: Board
    role: service
    index-origin: 1
    description: >-
      the rear I/O board position - the board carries the ID button, the iDRAC port, two USB and the VGA, which are
      its own ports
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the iDRAC Direct lamp
  memory:
    term: DIMM
    role: service
    index-origin: 1
    description: >-
      the 32 DDR5 slots, named as Dell's memory figure prints them (ISM figure 180), sixteen per processor - CPU 2's B
      slots on the left, CPU 1's A slots on the right, seen from above with the rear at the top
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: the six hot-plug cooling fans, in two groups of three
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        R760 technical guide, thermal features: "Cooling redundancy: The R760 allows N+1 fan redundancy,
        allowing continuous operation with one fan failure in the system." The ISM and spec sheet give up to six
        hot-plug fans of three grades.
  processors:
    term: CPU
    role: service
    index-origin: 1
    description: the two processor heatsinks - CPU 1 on the right as the front faces you
  interior:
    term: Part
    role: furniture
    index-origin: 1
    description: the system board, the air shroud and the fan cage
  covers:
    term: Cover
    role: furniture
    index-origin: 1
    description: >-
      the system cover and the backplane cover on top, and the optional security bezel on the front. The bezel is DRAWN
      FITTED, as on the R740xd and R660: it is `mounts`, so the viewer takes it off to show the drives, and `for:` names
      what it covers.
