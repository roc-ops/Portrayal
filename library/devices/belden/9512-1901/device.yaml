gaps:
  - what: cover-fixing
    scope: [front, top, left, right]
    reason: vendor-silent
    note: >-
      the data sheet gives no word on how the cover is held to the finger tips, and the photograph shows
      it detached; the format has no clip, so the cover is drawn as one fitted channel that lifts off.
    wanted: a picture of the cover fitted, and the installation instruction
  - what: rear-fingers
    scope: [front, rear, top, bottom]
    reason: vendor-silent
    note: >-
      the photograph shows the front and the top of the part only, so no row of fingers at its rear is
      modelled and none is ruled out.
    wanted: a picture of the part from behind
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet states no cable capacity and no fill ratio, so none is recorded or estimated.
    wanted: a fill table for the manager
  - what: bend-radius
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet says the managers help "maintain proper bend radius" and gives no figure, so none
      is recorded.
    wanted: the bend radius the finger stock maintains
  - what: ear-holes
    scope: [rear]
    reason: vendor-silent
    note: >-
      the photograph shows two slotted holes in each ear; no document gives their size or positions.
    wanted: a dimensioned drawing of the back plate
