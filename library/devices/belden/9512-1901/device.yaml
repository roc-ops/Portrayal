format: 1
kind: device
name: 9512-1901
version: 0.1.0
maturity: modelled
manufacturer: Belden
model: 9512-1901
description: >-
  1U horizontal cable manager with finger stock and cover, Belden 9512-1901. A black steel back plate
  the full 19 in width bolts to the rack rails and stands 2.0 in out. A row of steel fingers is
  stamped along its top and another along its bottom. Each row has twenty slits that a cable is laid
  in through. A steel cover clips over the finger tips to close the front and lifts off.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND FROM A PHOTOGRAPH. The 9512-1901 technical data sheet (revision
      0.48, 05-31-2024) states the rack units, the overall height, width and depth, the weight, the
      material and the finish, and carries one 430 px photograph of the part with its cover lying beside
      it. NO BELDEN DOCUMENT HOLDS A DIMENSIONED DRAWING: the manufacturer's product page returned a
      Cloudflare challenge (403) to the one request made for the family, and the catalog page is a
      script shell with no content, so the product photographs were not reached. Every figure below
      that is not the data sheet's table is read off that photograph and is `estimated`, with how.
      Nothing was copied from it; the figures are transcribed. The data sheet's footer ("Although
      Belden makes every reasonable effort ... provided on an AS IS basis") grants no licence to
      reuse its artwork, so only its figures are used.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 1U, 1.5 in (38.1 mm) high, 19 in wide and 2.0 in (50.8 mm) deep. The height is the
      data sheet's, under the 44.45 of the rack unit it takes; the 1U part 9510-1901 states 1.65 in the
      same way. The width is the 482.6 of 19 in, ears included, as a rack-face part is its ears and what
      hangs off them. The depth is the maker's overall projection from the rail face, cover and fingers
      included, and not a body depth. The data sheet's Mount Type is "19 in".
  mount:
    confidence: estimated
    note: >-
      estimated - the data sheet says the part is a 19 in mount and shows no figure of how it bolts. The
      photograph shows a flat ear at each end with two slotted holes, so it bolts to the rail face at a
      rack unit and stands out from it: a `rack-face` part, as the Chatsworth Evolution managers are.
      Whether the line is `rack-face` or `rack` is a choice the pull request asks the owner to accept.
  ears:
    confidence: estimated
    note: >-
      estimated - the 16.3 of ear each end is half of the 32.6 between the 450.0 the manager's body is
      taken to fill (the EIA-310 clear opening between the rails, 17.72 in) and the 482.6 overall. No
      Belden document gives the ear width, and its two slotted holes are not drawn: no document gives
      their size or place and the photograph is too small to measure them.
  shell:
    confidence: estimated
    note: >-
      estimated - A SHEET BODY, NOT A BOX: the back plate as a well 49.3 deep, the two rows of finger
      stock standing in it, the cover in it across the finger tips, which lifts off. The data sheet says
      "Steel" and nothing of the plate's construction.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, a stand-in; no Belden document states a gauge.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 1.1 LB in the data sheet's Weight row and Variants table, 0.5 kg. The data sheet does
      not say whether it is a net or a shipping weight; it is stated as the weight.
  fingers:
    confidence: estimated
    note: >-
      estimated - FINGER STOCK ALONG THE TOP AND THE BOTTOM EDGE OF THE FRONT, EACH A ROW OF TWENTY-ONE
      FINGERS WITH TWENTY SLITS. The photograph shows a comb of fingers stamped out of the sheet along the
      top edge, standing from the back plate toward the cover, and a second row along the bottom at the
      near end. Its bottom row is read as the top's again. The count, twenty, is read off a photograph
      430 px wide and may be out by two. 21.5 pitch, a 14.5 opening and a 7.0 finger, each read as
      proportions of the 450.0 between the ears; the finger is 6.0 deep. THE PHOTOGRAPH SHOWS NO ROW OF
      FINGERS AT THE REAR of the 2.0 in depth, only the back plate, so no rear row is modelled.
  cover:
    confidence: datasheet
    note: >-
      datasheet - "Horizontal Manager with Finger Stock and Cover" (the data sheet's Product Description).
      The photograph lays the cover beside the panel, so it comes off; it is its own part, fitted as
      shipped, so a drawing can take it off and show the fingers (the `cover-off` configuration). The
      data sheet does not say how it is held, and shows no hinge.
  front:
    confidence: estimated
    note: >-
      estimated - the cover, fitted, over the two rows of finger ends. The `duct` guide is the 26.1
      between the finger rows (38.1 less 2 x 6.0), over the 450.0 between the ears.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the back plate 1.5 thick, the finger row to the cover, twenty
      slits 14.5 wide on a 21.5 pitch from 6 to 36 deep with rounded roots, under the cover's 8.0 return.
      Read off the photograph against the 2.0 in depth; no view of the maker's is orthographic.
  bottom:
    confidence: estimated
    note: >-
      estimated - the photograph shows the same fingers along the bottom as along the top at the near
      end; the bottom is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - the side: the back plate, the two finger rows 6.0 high with the channel between, and
      the cover's face and returns at the front. No picture of the maker's is a side elevation; it is
      built from the photograph and the data sheet's table. The right is the same, turned round.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the plate, plain. The photograph shows its upper edge as a flange standing
      back from the plate, which is not drawn: it is seen too small to read. No Belden document shows the
      back of the part.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger rows, run across the
      rack; finger pitch 21.5 and opening 14.5 as `fingers`.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - none is stated. The data sheet's overview says only that the managers "help to
      maintain proper bend radius"; it gives no bend radius, no cable capacity and no fill ratio, so
      none is recorded and none is estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, the colour and the finish are the data sheet's table. It lists no
      mounting hardware for this part and no environmental space.
  color:
    confidence: estimated
    note: >-
      estimated - "Black Powdercoat Finish" and "Color: Black". The photograph shows black steel that
      reads dark brown in its lights, so the shade is this library's render of black, lightened a
      little so it reads on a dark stage.
