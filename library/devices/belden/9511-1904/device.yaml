format: 1
kind: device
name: 9511-1904
version: 0.1.0
maturity: modelled
manufacturer: Belden
model: 9511-1904
description: >-
  4U horizontal ring-style cable manager with saddle rings, Belden 9511-1904. A flat black steel
  panel the full 19 in width bolts to the rack rails. Steel saddle rings are screwed to it. Each ring
  is a strap bent into an open loop that stands 3.0 in out of the panel. A slit in its bottom bar lets
  a cable be laid in. The data sheet's thumbnail shows eight rings, two stacked at each end and four
  across the middle.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND FROM A THUMBNAIL. The 9511-1904 technical data sheet (revision
      0.27, 05-31-2024) states the rack units, the overall width and depth, the weight, the material and
      the finish, and carries one 430 px thumbnail of the part, a CAD render in grey. It states TWO
      HEIGHTS and NO COUNT OF RINGS. NO BELDEN DOCUMENT HOLDS A DIMENSIONED DRAWING: the manufacturer's
      product page returned a Cloudflare challenge (403) to the one request made for the family, and
      the catalog page is a script shell with no content, so the product photographs were not reached.
      Every figure below that is not the data sheet's table is read off the thumbnail and is
      `estimated`, with how. Nothing was copied from it; the figures are transcribed. The data sheet's
      footer ("Although Belden makes every reasonable effort ... provided on an AS IS basis") grants no
      licence to reuse its artwork, so only its figures are used.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 4U, 19 in wide and 3.0 in (76.2 mm) deep; THE HEIGHT IS A CONFLICT, SETTLED. The
      Construction and Dimensions table says "Overall Height 5.25 in" and the Variants table 6.9 in. The
      5.25 in is the 3U part's (the 9511-1903's); the 4U of the data sheet's own rack units is 7.0 in
      (177.8 mm), and the maker's BHH194UR 4U sheet states 7.0 in. The 6.9 in is 0.1 in under the 4U, as
      the 9510-1901's 1.65 in is 0.1 in under its 1U, so it may be the panel's own height with a gap
      between units; nothing says so. So 7.0 in is taken, and the pull request asks the owner to accept
      it. The width is the 482.6 of 19 in, ears included, as a rack-face part is its ears and what
      hangs off them. The depth is the maker's overall projection from the rail face, rings included, and
      not a body depth. The data sheet's Mount Type is "19 in".
  mount:
    confidence: estimated
    note: >-
      estimated - the data sheet says the part is a 19 in mount and shows no figure of how it bolts. The
      rings stand 3.0 in out of the plate, so it bolts to the rail face at a rack unit and stands out
      from it: a `rack-face` part, as the FS FHD-CMP5DR and the Chatsworth Evolution managers are.
      Whether the line is `rack-face` or `rack` is a choice the pull request asks the owner to accept.
  ears:
    confidence: estimated
    note: >-
      estimated - the ears are the flat ends of the panel and are drawn with it, with no holes: no
      document gives their size or place.
  shell:
    confidence: estimated
    note: >-
      estimated - A SHEET BODY, NOT A BOX: the panel as a well 74.7 deep, the rings standing in it. The
      data sheet says "Steel" and nothing of the panel's construction.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, a stand-in; no Belden document states a gauge.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 6.5 lb in the data sheet's Weight row and Variants table, 2.95 kg. The data sheet does
      not say whether it is a net or a shipping weight; it is stated as the weight.
  rings:
    confidence: estimated
    note: >-
      estimated - EIGHT RINGS, A COUNT NO DATA SHEET STATES. The 9511-1904 thumbnail shows two rings
      stacked at each end of the panel, further apart than on the 9511-1903, and four more between them,
      one in each column, eight in all. The count is read off a 430 px render and may be wrong; the
      part's name gives none, where the 9510-1901's states "(6)". The ring is the 9510-1901's saddle ring
      (`belden/saddle-ring`), which the thumbnails draw in the same shape; nothing states it. The six
      columns are taken as evenly spaced and symmetric, 80.0 apart, the first centred 41.3 from the left
      end; the stacked pair is centred a quarter and three quarters of the way up the face, and a single
      ring is centred on it. The pull request asks the owner to accept the count.
  front:
    confidence: estimated
    note: >-
      estimated - the eight rings on their screws, end-on: each ring's front leg, 10.0 wide and 40.0
      high. A vendor mark is never drawn.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the panel, plain. No Belden document shows the back of the part.
  top:
    confidence: estimated
    note: >-
      estimated - an elevation: the plate's edge at the rear and the top bar of the highest ring of each
      of the six columns from above, running out the full 74.7. The bottom is the same from underneath,
      where each bottom bar of the lowest ring stops at its hook.
  left:
    confidence: estimated
    note: >-
      estimated - an elevation: the plate's edge and the profiles of the two rings nearest, stacked,
      read off the thumbnail. The right is the same, turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the eight rings are the guides: each a component with a `ring` guide (see its
      contract), cables passing along the panel through each in turn. The opening is 34.0 high by 68.7
      deep.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - none is stated. The data sheet's overview says only that the managers "help to
      maintain proper bend radius"; it gives no bend radius, no cable capacity and no fill ratio, so
      none is recorded and none is estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, the colour and the finish are the data sheet's table. It lists no
      mounting hardware for this part and an "Indoor" environmental space.
  color:
    confidence: estimated
    note: >-
      estimated - "Black Powdercoat Finish" and "Color: Black". The thumbnail is a grey CAD render, so
      the shade is this library's render of black, lightened a little so it reads on a dark stage.
