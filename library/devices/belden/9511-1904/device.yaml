gaps:
  - what: ring-count
    scope: [front, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet gives no count of rings, and its thumbnail, a small render, shows eight; the count
      is an estimate.
    wanted: the number of rings in the data sheet's description or a larger picture
  - what: height-conflict
    scope: [front, rear, left, right]
    reason: sources-disagree
    note: >-
      "Overall Height 5.25 in" in the Construction and Dimensions table against 6.9 in in the Variants
      table. 7.0 in (177.8 mm) is used, the 4U of the data sheet's own rack units and the BHH194UR's
      height; 5.25 in is the 3U part's.
    wanted: the maker's drawing or product page
  - what: ear-holes
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no document gives the mounting holes' count or positions, or the ears' width.
    wanted: a dimensioned drawing of the panel
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet states no cable capacity and no fill ratio, so none is recorded or estimated.
    wanted: a fill table for the manager
  - what: bend-radius
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet says the managers help "maintain proper bend radius" and gives no figure, so none
      is recorded.
    wanted: the bend radius the rings maintain
