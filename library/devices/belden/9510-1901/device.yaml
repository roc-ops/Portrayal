gaps:
  - what: ear-holes
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the photograph shows a slotted hole in each ear; no document gives its size or position.
    wanted: a dimensioned drawing of the panel
  - what: top-flange
    scope: [top, left, right]
    reason: vendor-silent
    note: >-
      the photograph shows a narrow flange folded back along the panel's top edge; no document
      dimensions it, and the data sheet's 3.0 in is the overall projection, so none is drawn.
    wanted: a side view of the panel
  - what: ring-liner
    scope: [front, left, right]
    reason: vendor-silent
    note: >-
      the photograph shows a light strip along the inside of the top bar of the middle rings, which may
      be a liner or a pad; no document names or sizes it, so it is not drawn.
    wanted: a close picture of the ring
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet states no cable capacity and no fill ratio, so none is recorded or estimated.
    wanted: a fill table for the manager
  - what: bend-radius
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet says the managers help "maintain proper bend radius" and gives no figure, so none
      is recorded.
    wanted: the bend radius the rings maintain
