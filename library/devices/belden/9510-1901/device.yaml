format: 1
kind: device
name: 9510-1901
version: 0.1.0
maturity: modelled
manufacturer: Belden
model: 9510-1901
description: >-
  1U horizontal cable manager with six saddle rings, Belden 9510-1901. A flat black steel panel the
  full 19 in width bolts to the rack rails. Six identical steel saddle rings are screwed to it across
  its width. Each ring is a strap bent into an open loop that stands 3.0 in out of the panel. A slit
  in its bottom bar lets a cable be laid in.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND FROM A PHOTOGRAPH. The 9510-1901 technical data sheet (revision
      0.57, 05-31-2024) states the rack units, the overall height, width and depth, the weight, the
      material and the finish, counts the rings in its Product Description ("Saddle Rings (6)") and
      carries one 430 px photograph of the part. NO BELDEN DOCUMENT HOLDS A DIMENSIONED DRAWING: the
      manufacturer's product page returned a Cloudflare challenge (403) to the one request made for the
      family, and the catalog page is a script shell with no content, so the product photographs were
      not reached. Every figure below that is not the data sheet's table is read off that photograph and
      is `estimated`, with how. Nothing was copied from it; the figures are transcribed. The data
      sheet's footer ("Although Belden makes every reasonable effort ... provided on an AS IS basis")
      grants no licence to reuse its artwork, so only its figures are used.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 1U, 1.65 in (41.91 mm) high, 19 in wide and 3.0 in (76.2 mm) deep. The height is the
      data sheet's, 0.1 in under the 44.45 of the rack unit it takes. The width is the 482.6 of 19 in,
      ears included, as a rack-face part is its ears and what hangs off them. The depth is the maker's
      overall projection from the rail face, rings included, and not a body depth. The data sheet's Mount
      Type is "19 in".
  mount:
    confidence: estimated
    note: >-
      estimated - the data sheet says the part is a 19 in mount and shows no figure of how it bolts. The
      photograph shows a flat ear at each end with a slotted hole, and rings that stand 3.0 in out of the
      plate, so it bolts to the rail face at a rack unit and stands out from it: a `rack-face` part, as
      the FS FHD-CMP5DR and the Chatsworth Evolution managers are. Whether the line is `rack-face` or
      `rack` is a choice the pull request asks the owner to accept.
  ears:
    confidence: estimated
    note: >-
      estimated - the ears are the flat ends of the panel and are drawn with it. Their slotted holes are
      not drawn: no document gives their size or place and the photograph is too small to measure them.
  shell:
    confidence: estimated
    note: >-
      estimated - A SHEET BODY, NOT A BOX: the panel as a well 74.7 deep, the six rings standing in it.
      The data sheet says "Steel" and nothing of the panel's construction.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, a stand-in; no Belden document states a gauge.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 2.2 LB in the data sheet's Weight row and Variants table, 1.0 kg. The data sheet does
      not say whether it is a net or a shipping weight; it is stated as the weight.
  rings:
    confidence: estimated
    note: >-
      estimated - SIX RINGS, COUNTED BY THE DATA SHEET ("Saddle Rings (6)") AND SEEN SIX IN ITS
      PHOTOGRAPH, all the same shape. Their places are read off the photograph, where the perspective
      shortens the far ones: they are taken as evenly spaced and symmetric about the middle, 78.0 apart,
      the first centred 46.3 from the left end of the 482.6. The strap is 10.0 wide along the run and 40.0
      high, 3.0 thick, from proportions of the 41.91 face; see the component's contract. The photograph
      draws each ring reaching a little past the plate at the bottom edge; they are held inside the face.
  front:
    confidence: estimated
    note: >-
      estimated - the six rings on their screws, end-on: each ring's front leg, 10.0 wide and 40.0 high,
      centred on the 41.91 panel. A vendor mark is never drawn.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the panel, plain. No Belden document shows the back of the part, and the
      photograph's screws stand on the front.
  top:
    confidence: estimated
    note: >-
      estimated - an elevation: the plate's edge at the rear and each ring's top bar from above, running
      out the full 74.7. The bottom is the same from underneath, where each bottom bar stops at its hook.
  left:
    confidence: estimated
    note: >-
      estimated - an elevation: the plate's edge and a ring's profile in front of it, read off the
      photograph. The right is the same, turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the six rings are the guides: each a component with a `ring` guide (see its contract),
      cables passing along the panel through each in turn. The opening is 34.0 high by 68.7 deep.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - none is stated. The data sheet's overview says only that the managers "help to
      maintain proper bend radius"; it gives no bend radius, no cable capacity and no fill ratio, so
      none is recorded and none is estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, the colour and the finish are the data sheet's table. It lists no
      mounting hardware for this part and no environmental space.
  color:
    confidence: estimated
    note: >-
      estimated - "Black Powdercoat Finish" and "Color: Black". The photograph shows black steel, so the
      shade is this library's render of black, lightened a little so it reads on a dark stage.
