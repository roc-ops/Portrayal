format: 1
kind: device
name: bhh193ur
version: 0.1.0
maturity: modelled
manufacturer: Belden
model: BHH193UR
description: >-
  3U horizontal cable manager with molded fingers and hinging cover, Belden BHH193UR. A steel back
  plate the full 19 in width bolts to the rack rails and stands 7.22 in out. A row of eleven plastic
  molded fingers runs along its top and another along its bottom. Each row has ten openings that a
  cable is laid in through. A hinging steel cover closes the front and opens to lay cable in.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND FROM A THUMBNAIL. The BHH193UR technical data sheet (revision
      0.50, 05-31-2024) states the rack units, the overall height, width and depth, the weight, the
      material and the finish, and carries one thumbnail of the part. NO BELDEN DOCUMENT HOLDS A
      DIMENSIONED DRAWING: the manufacturer's product page returned a Cloudflare challenge (403) to
      the one request made, and the catalog page is a script shell with no content, so the product
      photographs were not reached. Every figure below that is not the data sheet's table is read off
      the thumbnails of the BHH192UR and BHH193UR, which are one CAD render in grey and not a
      photograph, and is `estimated`, with how. Nothing was copied from a thumbnail; the figures are
      transcribed. The data sheet's footer ("Although Belden makes every reasonable effort ...
      provided on an AS IS basis") grants no licence to reuse its artwork, so only its figures are
      used.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 3U, 5.25 in (133.35 mm) high, 19.0 in wide and 7.22 in (183.4 mm) deep. The width is
      the 482.6 of 19 in, ears included, as a rack-face part is its ears and what hangs off them. The
      depth is the maker's overall projection from the rail face, cover and fingers included, and not a
      body depth. The data sheet's Mount Type is "Rack Mount 19" Horizontal".
  mount:
    confidence: estimated
    note: >-
      estimated - the data sheet says the part is a 19 in rack mount with mounting hardware included
      and shows no figure of how it bolts. Its depth reaches 7.22 in past the rail face, so it is
      taken as a `rack-face` part that bolts to the rail face at a rack unit and stands out from it,
      as the Chatsworth Evolution managers are. Whether the line is `rack-face` or `rack` is a choice
      the pull request asks the owner to accept.
  ears:
    confidence: estimated
    note: >-
      estimated - the 16.3 of ear each end is half of the 32.6 between the 450.0 the manager's body is
      taken to fill (the EIA-310 clear opening between the rails, 17.72 in) and the 482.6 overall. No
      Belden document gives the ear width or its holes, so the ears are the ends of the back plate and
      are drawn with it, with no holes.
  shell:
    confidence: estimated
    note: >-
      estimated - A SHEET BODY, NOT A BOX: the back plate as a well 181.9 deep, the two rows of
      fingers standing in it, the cover in it across the finger heads, which opens and lifts off. The
      data sheet says "Steel and Plastic Molded Fingers" and nothing of the plate's construction.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, a stand-in; no Belden document states a gauge.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 4.4 LB in the data sheet's Weight row and Variants table, 2.0 kg. The data sheet does
      not say whether it is a net or a shipping weight; it is stated as the weight.
  fingers:
    confidence: estimated
    note: >-
      estimated - MOLDED FINGERS ALONG THE TOP AND THE BOTTOM EDGE OF THE FRONT, EACH A ROW OF ELEVEN
      WITH TEN OPENINGS. The BHH192UR thumbnail, the clearest of the family, shows the finger rods
      standing from the back plate to the cover along the top, ten openings counted across; the
      BHH193UR thumbnail draws the same row, at an angle that shows nine or ten. Its bottom row is
      read as the top's again. The count, ten, may be out by one. 42.5 pitch, a 34.0 opening and an
      8.5 finger, each read as proportions of the 450.0 between the ears; the finger plate is 10.0
      thick. THE THUMBNAILS SHOW NO ROW OF FINGERS AT THE REAR of the 7.22 in depth, only the back
      plate and its flange, so no rear row is modelled: it is not stated either way.
  cover:
    confidence: datasheet
    note: >-
      datasheet - "Horizontal Manager with Molded Fingers and Hinging Cover" (the data sheet's Product
      Description). The cover is its own part, fitted as shipped, so a drawing can take it off and show
      the fingers (the `cover-off` configuration). The format has no hinge, so which edge it swings on
      and its hinge are a gap; no mechanism is invented.
  front:
    confidence: estimated
    note: >-
      estimated - the cover, fitted, over the two rows of finger ends. The `duct` guide is the 113.35
      between the finger plates (133.35 less 2 x 10.0), over the 450.0 between the ears.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the back plate 1.5 thick, the finger plate to the cover, ten
      openings 34.0 wide on a 42.5 pitch from 16 to 160 deep with rounded roots, narrowing to a 28.0 neck
      under the cover's 13.9 return. Read off the thumbnails against the 7.22 in depth; no view of the
      maker's is orthographic.
  bottom:
    confidence: estimated
    note: >-
      estimated - the thumbnails show the same fingers along the bottom as along the top; the bottom is
      the top again.
  left:
    confidence: estimated
    note: >-
      estimated - the side: the back plate, the two finger plates 10.0 high with the channel between,
      and the cover's face and returns at the front. No picture of the maker's is a side elevation; it
      is built from the thumbnails and the data sheet's table. The right is the same, turned round.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the plate, plain. The thumbnails show its upper edge as a flange with
      two steps and a row of notches at one end of the section, which are not drawn: they are seen
      too small to read. No Belden document shows the back of the part.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger plates, run across the
      rack; finger pitch 42.5 and opening 34.0 as `fingers`.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - none is stated. The data sheet's overview says only that the managers "help to
      maintain proper bend radius"; it gives no bend radius, no cable capacity and no fill ratio, so
      none is recorded and none is estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, the colour, the finish, the mounting hardware and "Indoor" are the data
      sheet's table.
  color:
    confidence: estimated
    note: >-
      estimated - "Black powdercoat finish" and "Color: Black". The thumbnail is a grey CAD render, so
      the shade is this library's render of black, lightened a little so it reads on a dark stage.
