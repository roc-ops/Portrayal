gaps:
  - what: cover-hinge
    scope: [front, top, left, right]
    reason: vendor-silent
    note: >-
      the data sheet calls the cover hinging and no document says on which edge it swings or how it
      is held; the format has no hinge, so the cover is drawn as one fitted plate that comes off, and
      the swing is not stated.
    wanted: a drawing or a close picture of the cover's hinge
  - what: rear-fingers
    scope: [front, rear, top, bottom]
    reason: vendor-silent
    note: >-
      at 7.22 in deep the part might carry fingers at its rear as well as its front; the data sheet's
      thumbnail shows its front and top only, so no rear row is modelled and none is ruled out.
    wanted: a picture of the part from behind
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet states no cable capacity and no fill ratio, so none is recorded or estimated.
    wanted: a fill table for the BHH managers
  - what: bend-radius
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet says the managers help "maintain proper bend radius" and gives no figure, so none
      is recorded.
    wanted: the bend radius the fingers and cover maintain
  - what: ear-holes
    scope: [rear]
    reason: vendor-silent
    note: >-
      no document gives the mounting holes' count or positions, or the ears' width.
    wanted: a dimensioned drawing of the back plate
