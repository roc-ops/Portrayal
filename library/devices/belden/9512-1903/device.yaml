format: 1
kind: device
name: 9512-1903
version: 0.1.0
maturity: modelled
manufacturer: Belden
model: 9512-1903
description: >-
  1U rack-mount lacing bar, Belden 9512-1903. A black powder-coated steel bar the full 19 in width
  that bolts to the rack rails and stands 0.5 in out, for tying cables to. It is drawn as the
  maker's overall size and nothing inside it, and no tie point is placed: no document gives one.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND ONE PHOTOGRAPH. The 9512-1903 technical data sheet
      (revision 0.41, 05-31-2024, page 1) states the rack units, the overall height, width and
      depth, the weight, the material, the finish and the colour, and carries one 430 px photograph
      of the bar with its two screws lying beside it. The maker's product page held here is text
      with no dimension in it. NO BELDEN DOCUMENT HOLDS A DIMENSIONED DRAWING, so nothing inside the
      overall size is drawn: no hole, no tie point, no cut-out. Nothing was copied from the
      photograph; the data sheet's footer ("provided on an AS IS basis") grants no licence to reuse
      its artwork.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 1U, 0.5 in (12.7 mm) high, 19 in (482.6 mm) wide and 0.5 in (12.7 mm) deep, the
      data sheet's Overall Height and Overall Width rows and its Variants table (Height 0.5 in, Width
      19 in, Depth 0.5 in). The height is far under the 44.45 of the rack unit it takes, as the
      other Belden parts' heights are. The width is the 482.6 of 19 in, the bar's own length. The
      data sheet does not say which of the 0.5 in figures is the bar's face and which its
      projection from the rail face; see the `cross-section` gap.
  mount:
    confidence: estimated
    note: >-
      estimated - the data sheet says only "Mount Type: 19 in". The photograph shows one slotted
      hole near each end of a flat bar and two screws beside it, so it bolts to the rail face at a
      rack unit and stands out from it: a `rack-face` part, as the line's other managers are. At
      what height inside the unit it sits is not stated.
  shell:
    confidence: estimated
    note: >-
      estimated - `sheet`, as the line's other managers: the data sheet says "Steel" and the
      photograph shows a flat strip. The section of the bar is not stated, so each face below is a
      plain outline of the overall size.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, the stand-in the line's other managers use; no Belden document states a gauge
      for this bar.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 0.5 lb in the data sheet's Weight row and its Variants table, 0.227 kg. The data
      sheet does not say whether it is a net or a shipping weight, nor whether the two screws are in it.
  front:
    confidence: datasheet
    note: >-
      datasheet - the bar's face as a plain 482.6 by 12.7 strip, the overall width and height. The
      photograph shows a slotted hole near each end; their size and place are not stated and they are
      not drawn (`end-holes` gap).
  rear:
    confidence: datasheet
    note: >-
      datasheet - the back of the same strip, plain. No Belden document shows the bar from behind.
  top:
    confidence: datasheet
    note: >-
      datasheet - the overall 482.6 by 12.7 depth as one outline. This is the envelope, not a
      measured section (`cross-section` gap). The bottom is the same.
  left:
    confidence: datasheet
    note: >-
      datasheet - the end of the bar as the 12.7 by 12.7 overall size, an outline and not a measured
      section. The right is the same.
  guides:
    confidence: datasheet
    note: >-
      datasheet - none. A cable is tied to a lacing bar, and no document says where. The format has
      no tie point on a bar, and none is placed (`tie-points` gap).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, the colour and the finish are the data sheet's table. The overview
      sentence says the managers' 19 in mount "includes mounting hardware" and the photograph shows
      two screws; their size and thread are not stated and no part is modelled for them.
  color:
    confidence: estimated
    note: >-
      estimated - "Black Powdercoat Finish" and "Color: Black". The photograph shows a dark steel
      bar that reads dark grey where it catches light, so the shade is this library's render of
      black, the same as the line's other 1U managers.
