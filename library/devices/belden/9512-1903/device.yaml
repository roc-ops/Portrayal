gaps:
  - what: tie-points
    scope: [front, top, bottom]
    reason: vendor-silent
    note: >-
      the data sheet and the product page say the part is a rack-mount lacing bar and give no tie
      point, slot or cut-out along it, so none is drawn and no cable is told where to be tied.
    wanted: a Belden drawing, or a square-on photograph, that marks where a cable is tied
  - what: end-holes
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the photograph shows one slotted hole near each end, and the data sheet gives neither their
      size nor their place, nor the hole pattern against the rack unit.
    wanted: a dimensioned drawing of the bar
  - what: cross-section
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet gives 0.5 in for the height and 0.5 in for the depth and does not say whether
      the bar is a flat strip, an angle or a solid section. The photograph shows a thin strip, so the
      two figures may be a packing size. The sides are drawn as the overall size only.
    wanted: a dimensioned drawing, or an end-on photograph, of the bar
  - what: height-in-unit
    scope: [front]
    reason: vendor-silent
    note: >-
      the bar is 12.7 high and takes one 44.45 rack unit; no document says where in the unit it sits.
    wanted: a drawing of the bar fitted to a rail
  - what: mounting-screws
    scope: [front]
    reason: vendor-silent
    note: >-
      the photograph shows two screws beside the bar; no document gives their size, thread or head.
    wanted: the mounting hardware's part list
