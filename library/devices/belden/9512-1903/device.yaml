  weight-kg: 0.227
  color: '#3c3f43'
gaps:
  - what: tie-points
    scope: [front, top, bottom]
    reason: vendor-silent
    note: >-
      the data sheet and the product page say the part is a rack-mount lacing bar and give no tie
      point, slot or cut-out along it, so none is drawn and no cable is told where to be tied.
    wanted: a Belden drawing, or a square-on photograph, that marks where a cable is tied
  - what: cross-section
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the sheet gives 0.5 in for the height and for the depth. The photograph shows a thin flat strip,
      drawn 1.5 thick from the line's stand-in gauge. Which edge of the 12.7 depth it sits on is unknown.
    wanted: a dimensioned drawing, or an end-on photograph, of the bar
  - what: height-in-unit
    scope: [front]
    reason: vendor-silent
    note: >-
      the bar is 12.7 high and takes one 44.45 rack unit; no document says where in the unit it sits.
    wanted: a drawing of the bar fitted to a rail
  - what: mounting-screws
    scope: [front]
    reason: vendor-silent
    note: >-
      the photograph shows two loose screws beside the bar. They are not on any face and the format has
      no shape for a loose part beside a device. No document gives their size, thread or head.
    wanted: the mounting hardware's part list
