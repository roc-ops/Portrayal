format: 1
kind: device
name: cpm-800-2
version: 0.1.0
maturity: modelled
manufacturer: WTI
model: CPM-800-2
portfolio: {line: Console server and PDU, family: CPM-800}
description: >-
  WTI CPM-800-2 console server and switched PDU hybrid, 1U. The front is the console server. It has eight RJ45 serial ports, two Ethernet jacks, a phone jack and a USB set-up port. It also has two antenna mounts, RESET and DEFAULT buttons and lamps. The rear is the PDU. It has two IEC C20 inlets, each feeding four of the eight IEC C13 outlets, A1 to A8.
profile: power
provenance:
  sources:
    confidence: drawing
    note: >-
      NO PHOTOGRAPH IS HELD. Every position on both faces is read from the vector figures of the maker's one-page dimensional drawing (CPM-800 family, revision A): the views carry no dimension for a connector, so each is a point of the drawing, converted at the scale that makes the drawn faceplate the 17.15 inches the drawing prints, and is good to about 1.5 mm. The hardware guide's front and back figures (CPM Series Hardware Guide figures 2.1 to 2.5; DSM Series Hardware Guide figures 2.1 to 2.6) agree with the drawing on the order of every connector. The colours are read from the angled renders on the data sheets, which are marketing renders and not photographs.
  method:
    confidence: estimated
    note: >-
      THE DRAWING IS LINE ART AT ABOUT 1 TO 3 AND CARRIES NO CONNECTOR DIMENSION. Positions are measured on its vector geometry (a jack's outline, an outlet's box, an inlet's housing), centred on the drawn faceplate; a part is placed by its centre on the drawn outline. The drawn faceplate is slightly shorter than the stated height (drawing 1.74 or 3.46 inches against 1.75 or 3.5), so vertical positions are centred on the face. A lamp's spacing inside its frame is the drawing's. The captions inside the buttons, the lamp and port numerals, the ACT and LNK legends over the Ethernet jacks and the SETUP bracket over port 1 are placed from the printed positions in the drawing and are good to about 0.7 mm.
  chassis:
    confidence: drawing
    note: >-
      Width 17.15 inches (435.6 mm) is the drawing's top cover width, and the drawing's 18.32 inches is the distance between the rack ear holes. The height is the data sheet's 1.75 inches, one rack unit and the drawing prints 1.74 (the guide and the data sheet agree with each other). The depth is 8.7 inches, the data sheet and the drawing; the hardware guide prints 8.75. No net weight is stated, only a shipping weight, so none is given.
  colour:
    confidence: estimated
    note: >-
      Median pixels of the angled render on the data sheet (page 2, 'CPM-1600-2-ECA'; the DSM data sheet's renders show the same dark face): the front face #373b3e, the rear plate #ebf5fb (lit and bluish in the render) with black printing. A MARKETING RENDER IS NOT A PHOTOGRAPH, AND NO HELD DOCUMENT HAS ONE, SO EVERY COLOUR HERE IS UNCHECKED AGAINST A PHOTOGRAPH. The red printed bars and the red logo block the render shows are not drawn.
  ears:
    confidence: drawing
    note: >-
      The drawing shows an ear at each end with two holes (one round, one slotted) and the data sheet says '19 Rack Brackets Included'. The ear hole pitch is not dimensioned; the drawing's 18.32 inches is the distance between the two ear hole axes. The ears are drawn at the faceplate, so the shipped position is flush.
  outlets:
    confidence: datasheet
    note: >-
      Data sheet page 2 and the drawing: eight IEC C13 outlets in one row, A1 to A8 (the drawing's 'SWITCHED OUTPUT RECEPTACLES IEC C13'); a divider after A4 and each inlet 'supplies power to a single four-outlet Bus' (hardware guide, section 2.5). The ATS models feed the same outlets from a primary and a secondary inlet (hardware guide); this device is the standard, non-ATS family. No breaker is stated.
  inlets:
    confidence: datasheet
    note: >-
      IEC-320-C20 (hardware guide, section 2.2 and 2.5), '20 Amp' each (data sheet). A cord is not in the box for the -2 models: the data sheet lists the power cord as '(Sold Separately)', so none is drawn.
  power:
    confidence: datasheet
    note: >-
      Data sheet page 2: '100/240V' (footnote: 200/240V with the ATS add-on), '3.2/7.6 kW' of power distribution at 80% derating (the CPM-800-2 and CPM-1600-2 rows), 20 amps per inlet; the inlet label the drawing prints reads 100-240V, 50/60 Hz, 16A. The hardware guide (appendix A) prints 208 - 240 VAC for the -2 models and the data sheet and drawing do not; the device states the data sheet's figure and the disagreement is a gap. The unit's own draw is not stated by any held document, so no power-max-w is given.
  serial-ports:
    confidence: datasheet
    note: >-
      RJ45 RS-232 serial ports, eight (hardware guide, 'Eight (8) RJ45 connectors'), port 1 marked SETUP. Units ship with a standard or a straight pinout and which a part number has is not stated (hardware guide, appendix B), so the jacks state the media and no pinout.
  serial-role:
    confidence: datasheet
    note: >-
      The ports are console server ports (hardware guide, 'Serial Ports: connection to console ports on target devices').
  lamps:
    confidence: drawing
    note: >-
      The lamps of both faces are drawn as plain discs, not as states: the hardware guide names them (port activity, plug activity or status) and does not state a colour or a state for any, so none is claimed.
attrs:
  physical:
    construction: metal
  power:
    input-plug: iec-60320-c20
    input-voltage: 100 to 240 VAC, 50/60 Hz (data sheet)
    input-current-a: 20
    input-feeds: two inlets, one per bank of four outlets
    power-distribution: 3.2/7.6 kW (80% derated, data sheet)
  environmental:
    operating-temp: 0 to 60 C (data sheet)
    operating-humidity: 10 - 90% RH (data sheet)
  features:
    serial-pinout: standard or straight pinned serial ports, by part number (hardware guide)
