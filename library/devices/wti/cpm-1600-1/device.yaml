format: 1
kind: device
name: cpm-1600-1
version: 0.1.0
maturity: modelled
manufacturer: WTI
model: CPM-1600-1
portfolio: {line: Console server and PDU, family: CPM-1600}
description: >-
  WTI CPM-1600-1 console server and switched PDU hybrid, 2U. The front is the console server. It has sixteen RJ45 serial ports in two rows of eight, two Ethernet jacks, a phone jack and a USB set-up port. It also has two antenna mounts, RESET and DEFAULT buttons and lamps. The rear is the PDU. It has four IEC C20 inlets, each feeding four of the sixteen NEMA 5-15R outlets, A1 to A8 and B1 to B8.
profile: power
provenance:
  sources:
    confidence: drawing
    note: >-
      NO PHOTOGRAPH IS HELD. Every position on both faces is read from the vector figures of the maker's one-page dimensional drawing (CPM-1600 family, revision A): the views carry no dimension for a connector, so each is a point of the drawing, converted at the scale that makes the drawn faceplate the 17.15 inches the drawing prints, and is good to about 1.5 mm. The hardware guide's front and back figures (CPM Series Hardware Guide figures 2.1 to 2.5; DSM Series Hardware Guide figures 2.1 to 2.6) agree with the drawing on the order of every connector. The colours are read from the angled renders on the data sheets, which are marketing renders and not photographs.
  method:
    confidence: estimated
    note: >-
      THE DRAWING IS LINE ART AT ABOUT 1 TO 3 AND CARRIES NO CONNECTOR DIMENSION. Positions are measured on its vector geometry (a jack's outline, an outlet's box, an inlet's housing), centred on the drawn faceplate; a part is placed by its centre on the drawn outline. The drawn faceplate is slightly shorter than the stated height (drawing 1.74 or 3.46 inches against 1.75 or 3.5), so vertical positions are centred on the face. A lamp's spacing inside its frame is the drawing's. The captions inside the buttons, the lamp and port numerals, the ACT and LNK legends over the Ethernet jacks and the SETUP bracket over port 1 are placed from the printed positions in the drawing and are good to about 0.7 mm.
  chassis:
    confidence: drawing
    note: >-
      Width 17.15 inches (435.6 mm) is the drawing's top cover width, and the drawing's 18.32 inches is the distance between the rack ear holes. The height is the data sheet's 3.5 inches, two rack units and the drawing prints 3.46 (the guide and the data sheet agree with each other). The depth is 12.5 inches in the data sheet, the drawing and the hardware guide. No net weight is stated, only a shipping weight, so none is given.
  colour:
    confidence: estimated
    note: >-
      Median pixels of the angled render on the data sheet (page 2, 'CPM-1600-2-ECA'; the DSM data sheet's renders show the same dark face): the front face #373b3e, the rear plate #ebf5fb (lit and bluish in the render) with black printing. A MARKETING RENDER IS NOT A PHOTOGRAPH, AND NO HELD DOCUMENT HAS ONE, SO EVERY COLOUR HERE IS UNCHECKED AGAINST A PHOTOGRAPH. The red printed bars and the red logo block the render shows are not drawn.
  ears:
    confidence: drawing
    note: >-
      The drawing shows an ear at each end with two holes (one round, one slotted) and the data sheet says '19 Rack Brackets Included'. The ear hole pitch is not dimensioned; the drawing's 18.32 inches is the distance between the two ear hole axes. The ears are drawn at the faceplate, so the shipped position is flush.
  outlets:
    confidence: datasheet
    note: >-
      Data sheet page 2 and the drawing: sixteen NEMA 5-15R outlets in two rows of eight, A1 to A8 above and B1 to B8 below; a divider after the fourth column; each of the four inlets feeds four outlets, A1-A4, A5-A8, B1-B4, B5-B8 (hardware guide, section 2.2). The ATS models feed the same outlets from a primary and a secondary inlet (hardware guide); this device is the standard, non-ATS family. No breaker is stated.
  inlets:
    confidence: datasheet
    note: >-
      IEC-320-C20 (hardware guide, section 2.2 and 2.5), '20 Amp' each (data sheet). A cord is not in the box for the -1 models: the data sheet lists 'C19 to NEMA 5-15P, 8' as the detachable cord and is not a drawing of a cord, so none is drawn.
  power:
    confidence: datasheet
    note: >-
      Data sheet page 2: 100/120V, '3.2/3.8 kW' (CPM-800) or '6.4/7.6 kW' (CPM-1600) of power distribution at 80% derating, 20 amps per inlet; hardware guide: 100 - 120 VAC, 50/60 Hz. The unit's own draw is not stated by any held document, so no power-max-w is given.
  serial-ports:
    confidence: datasheet
    note: >-
      RJ45 RS-232 serial ports, sixteen (hardware guide), two rows of eight, odd numbers above and even below, port 1 marked SETUP. Units ship with a standard or a straight pinout and which a part number has is not stated (hardware guide, appendix B), so the jacks state the media and no pinout.
  serial-role:
    confidence: datasheet
    note: >-
      The ports are console server ports (hardware guide, 'Serial Ports: connection to console ports on target devices').
  lamps:
    confidence: drawing
    note: >-
      The lamps of both faces are drawn as plain discs, not as states: the hardware guide names them (port activity, plug activity or status) and does not state a colour or a state for any, so none is claimed.
attrs:
  physical:
    construction: metal
  power:
    input-plug: iec-60320-c20
    input-voltage: 100 to 120 VAC, 50/60 Hz
    input-current-a: 20
    input-feeds: four inlets, one per bank of four outlets
    power-distribution: 6.4/7.6 kW (80% derated, data sheet)
  environmental:
    operating-temp: 0 to 60 C (data sheet)
    operating-humidity: 10 - 90% RH (data sheet)
  features:
    serial-pinout: standard or straight pinned serial ports, by part number (hardware guide)
