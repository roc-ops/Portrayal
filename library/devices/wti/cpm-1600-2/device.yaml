  width: 435.6
  height: 88.9
  depth: 317.5
  ru: 2
  color: '#373b3e'
  ears:
    positions:
    - {name: flush, label: 2U rack bracket as shipped, default: true}
  power: ac
gaps:
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    No photograph of any face is held; the only pictures of the product are angled marketing renders. Every position is read from the line drawing and every colour from a render.
  wanted: A straight-on photograph of each face.
- what: lamp-states
  scope: [front]
  reason: vendor-silent
  note: >-
    The documents name the lamps and state no colour or state for them; they are drawn as plain discs.
  wanted: The maker's lamp table for the front panel.
- what: ear-holes
  scope: [front]
  reason: needs-drawing
  note: >-
    The ears are not dimensioned: the holes are drawn (one round, one slotted) with no pitch.
  wanted: A dimensioned drawing of the rack bracket.
- what: antenna-mounts
  scope: [front]
  reason: vendor-silent
  note: >-
    The two rings marked MAIN and AUX are 'optional cell modem antenna mounts' (drawing). They are drawn as discs and are not ports.
  wanted: The maker's drawing of the mounts, and which part numbers fit them.
- what: option-positions
  scope: [front]
  reason: vendor-silent
  note: >-
    The drawing shows the second Ethernet jack and the phone jack and says a label is added for units without them; the documents do not say whether a jack sits behind the label. Both are drawn as the drawing shows them.
  wanted: Which part numbers carry the second Ethernet jack and the phone jack.
- what: underside
  scope: [bottom]
  reason: needs-drawing
  note: >-
    No held page shows the underside.
  wanted: A drawing or photograph of the underside.
- what: right-side
  scope: [right]
  reason: needs-drawing
  note: >-
    The drawing shows one side only, and no held page shows the other.
  wanted: A drawing or photograph of the other side.
- what: side-identity
  scope: [left]
  reason: vendor-silent
  note: >-
    The drawing does not say which side its side view shows. It is drawn as the left, an estimate. Three hints point that way and none states it: the hardware guide puts the SIM card cover panel on the left hand side, adjacent to the cellular antenna; the guide says 'Side vents' in the plural; and the view stands beside the top view on the sheet.
  wanted: A drawing or photograph that names the side.
- what: top-beyond-outline
  scope: [top]
  reason: needs-drawing
  note: >-
    The drawing's top view also shows ten rear bodies (two inlet bodies and eight outlet bodies) beyond the cover's outline. Not drawn: a face is a width by height box (the view `size`, device schema lines 1352 to 1367) and the kit has no shape for a part outside it.
  wanted: A kit shape for a part beyond a face's box.
- what: side-bottom-fold
  scope: [left]
  reason: needs-drawing
  note: >-
    The side view's bottom edge is a rounded fold. Not drawn: `bevel` (device schema line 797) is a flat 45 degree cut and `rounded` (line 820) rounds plan corners, so the kit has no rounded-fold shape.
  wanted: A kit shape for a rounded fold along an edge.
