format: 1
kind: device
name: nps-8hs20-1
version: 0.1.0
maturity: modelled
manufacturer: WTI
model: NPS-8HS20-1
portfolio: {line: Network power switch, family: NPS-8HS}
description: >-
  WTI NPS-8HS20-1 network power switch (switched PDU), 1U. The front carries an RJ45 set-up port, ON and RDY lamps, DEFAULT and RESET buttons, eight output status lamps and two 20 A circuit breakers. The rear carries one IEC C20 inlet, eight switched NEMA 5-15R outlets, A1 to A8, two alarm lamps and a 10/100/1000 Ethernet jack.
profile: power
provenance:
  sources:
    confidence: drawing
    note: >-
      Every position on both faces is read from the vector figures of the NPS Series Hardware Guide (part 14531 rev A): figure 2.3, the NPS-8HS front panel (PDF page 9), and figure 2.4, the NPS-8HS back panel (PDF page 10). The figures are line art with no dimension printed on them. The size is from the NPS specification table (PDF page 2 of the specification sheet): W 19 in (48.3 cm), D 8.7 in (22 cm), H 1.75 in (4.5 cm), 1 U, the row shared by the NPS-8HS, 8HD and 8H20-ATS models. The colours are read from the product photograph of the NPS-8HS20-1 on page 1 of the specification sheet (an angled photograph, front above and back below, 860 by 283 pixels). The guide draws NEMA 5-15R outlets in figure 2.4 and its text says the NPS-8HS20-1 has them, so this model is the one the figures draw. The hardware guide's -2 and -3 models have IEC C13 outlets, which no figure draws.
  method:
    confidence: estimated
    note: >-
      THE FIGURES CARRY NO CONNECTOR DIMENSION. Each position is the centre of a drawn outline (a jack's frame, an outlet's box, an inlet's housing, a lamp's disc), converted at one scale on both axes: the figure's drawn outline width taken as the table's 19 in, 482.6 mm (1.5118 mm per point on the front figure, 1.5133 on the back). Heights are measured from the figure's vertical centre and set about the face's centre, because the drawn outline is 9 percent taller than 19 to 1.75, so the figure is not at true proportion. The scale is checked against two library parts: the figure's outlet box is 18.25 points wide, 27.6 mm here, against 27.0 for `std/nema-5-15r`, and its inlet housing is 21.08 points wide, 31.9 mm here, against 32.4 for `std/c20-inlet`. Every position is good to about 1.5 mm. The captions are placed from the figure's glyph positions and sized from its cap heights, to about 0.7 mm. The breakers are drawn from the figure's two boxes (the guide gives no size for a breaker) as plain art, not as a part.
  chassis:
    confidence: datasheet
    note: >-
      Width 19 in (482.6 mm), depth 8.7 in (220.98 mm) and height 1.75 in (44.45 mm), 1 U, from the specification table. The table's width is the figure's whole faceplate, and no document held says whether the rack ears are inside it or whether the body is narrower. The face is drawn the full 482.6 mm wide. No net weight is stated, only a shipping weight of 11 lb for the 8-outlet models, so none is given.
  colour:
    confidence: photo-measured
    note: >-
      Median pixels of the specification sheet's photograph of the NPS-8HS20-1: the front face #414043, the rear plate #ffffff with black printing, the buttons #fafafa and the top cover #a8a8a6. The top cover is lit from above in the photograph, so its grey is a lit grey and not a paint colour. The red rule is drawn in #ed1c24, the red the maker prints; the logo is not drawn. The photograph is 860 pixels wide for the two faces and the sides are seen at an angle, so a colour is read only from a flat patch of a face.
  ears:
    confidence: photo-measured
    note: >-
      The photograph on the specification sheet shows a bracket at each end of the front, with three slots; it is the only source for the ears. The specification table gives the 19 in width and says nothing of brackets. The ear hole pitch and the ear setback are not stated by any held document. The ears are taken as flush with the faceplate, as the photograph shows them.
  outlets:
    confidence: datasheet
    note: >-
      Hardware guide section 2.4 and figure 2.4: eight switched NEMA 5-15R outlets in one row, A1 to A8, all fed by the one inlet. The specification table says the same for the -1 model, with a (1) 20 Amp input feed and two 20 Amp circuit breakers.
  inlets:
    confidence: datasheet
    note: >-
      One IEC 60320 C20 inlet (hardware guide, section 2.4, 'NPS-8HS20-1 Units: One IEC 60320 C20 inlet, for 100/120V power'). The table prints the voltage range 85/125V. The power cord is detachable and the table says the -1 model 'Includes 15 Amp Power Cable'; no cord is drawn, as the table is not a drawing of one. The guide says the NPS-8HS inlet carries a pre-installed cable keeper (section 4); it is not drawn.
  breakers:
    confidence: datasheet
    note: >-
      Hardware guide section 2.3, item 7: two circuit breakers, one for outlets A1 to A4 and one for A5 to A8, each 20 Amp on the NPS-8HS20-1 (also the specification table). Figure 2.3 draws each as a square box with a rocker, captioned 'A1 - A4' and 'A5 - A8'. The photograph shows black rockers with a red mark. They are drawn as art, as the library holds no breaker part for this kind.
  power:
    confidence: datasheet
    note: >-
      Specification table: AC voltage 85/125V, 50/60 Hz, power distribution '1.3/2 kW' with the footnote '80% Derated', one 20 Amp input feed. The unit's own draw is not stated by any held document, so no power-max-w is given.
  setup-port:
    confidence: datasheet
    note: >-
      An RJ45 RS232 serial port, DCE configuration (hardware guide, section 2.3, item 1; appendix B), on the front at the left. The specification table gives 'RJ45, RS232C'. The pinout is the guide's appendix B and is not stated on the jack. The jack is drawn latch notch down, as the photograph shows it.
  ethernet:
    confidence: datasheet
    note: >-
      One RJ45 network port on the rear, 10/100/1000Base-T (hardware guide, section 2.4, item 4; specification table 'Ethernet Port: 10/100/1000 BaseT'), with a link and an activity lamp that belong to the jack part.
  lamps:
    confidence: drawing
    note: >-
      The lamps are drawn as plain discs, not as states: the guide names them (ON, RDY, output status, alarm) and states no colour for any. The photograph shows the front lamps lit green and yellow; one lit photograph is not a table of colours, so none is claimed.
attrs:
  physical:
    construction: metal
  power:
    input-plug: iec-60320-c20
    input-voltage: 85 to 125 VAC, 50/60 Hz (specification table)
    input-current-a: 20
    input-feeds: one inlet for all eight outlets
    power-distribution: 1.3/2 kW (80% derated, specification table)
  environmental:
    operating-temp: 0 to 50 C (specification table)
    operating-humidity: 10 - 90% RH (specification table)
chassis:
  width: 482.6
  height: 44.45
  depth: 220.98
  ru: 1
  color: '#414043'
  ears:
    positions:
    - {name: flush, label: 1U rack bracket as shipped, default: true}
  power: ac
gaps:
- what: straight-on-photographs
  scope: [front, rear]
  reason: needs-photo
  note: >-
    Only one angled photograph of the NPS-8HS20-1 is held, 860 pixels wide for both faces. Every position is read from the guide's line art, and no face has been laid over a straight-on photograph.
  wanted: A straight-on photograph of each face.
- what: lamp-states
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The guide names the lamps and states no colour or state for them; they are drawn as plain discs.
  wanted: The maker's lamp table for the front and rear panels.
- what: ear-holes
  scope: [front]
  reason: needs-drawing
  note: >-
    The ears are not dimensioned and no held document says whether they are inside the 19 in width. The photograph shows three slots in each bracket.
  wanted: A dimensioned drawing of the rack bracket and of the body.
- what: breaker-size
  scope: [front]
  reason: vendor-silent
  note: >-
    The figure draws each breaker as a box and a rocker with no size and no part number. They are drawn at the figure's scale.
  wanted: The breaker's part number and outline.
- what: cable-keeper
  scope: [rear]
  reason: needs-drawing
  note: >-
    The guide says each inlet has a cable keeper, pre-installed on the NPS-8HS (section 4); the figure does not draw it and the photograph shows a wire clip on the inlet. It is not drawn.
  wanted: The maker's drawing of the keeper.
- what: sides
  scope: [bottom, left, right]
  reason: needs-drawing
  note: >-
    No held document draws or names a side or the underside. The photograph shows the top cover and, at an angle, one side with a row of slots along its top edge, too small to place a slot.
  wanted: A drawing or a straight-on photograph that names each side.
