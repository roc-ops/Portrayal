format: 1
kind: device
name: dsm-8
version: 0.1.0
maturity: modelled
manufacturer: WTI
model: DSM-8
portfolio: {line: Console server, family: DSM}
description: >-
  WTI DSM-8 console server, 1U. The front carries a phone jack, a USB mini set-up port, two antenna mounts, a RESET and a DEFAULT button and lamps. The back carries two IEC C14 inlets, eight RJ45 serial ports in two rows of four and two Ethernet jacks.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      NO PHOTOGRAPH IS HELD. Every position on both faces is read from the vector figures of the maker's one-page dimensional drawing (DSM family, revision A): the views carry no dimension for a connector, so each is a point of the drawing, converted at the scale that makes the drawn faceplate the 17.15 inches the drawing prints, and is good to about 1.5 mm. The hardware guide's front and back figures (CPM Series Hardware Guide figures 2.1 to 2.5; DSM Series Hardware Guide figures 2.1 to 2.6) agree with the drawing on the order of every connector. The colours are read from the angled renders on the data sheets, which are marketing renders and not photographs.
  method:
    confidence: estimated
    note: >-
      THE DRAWING IS LINE ART AT ABOUT 1 TO 3 AND CARRIES NO CONNECTOR DIMENSION. Positions are measured on its vector geometry (a jack's outline, an outlet's box, an inlet's housing), centred on the drawn faceplate; a part is placed by its centre on the drawn outline. The drawn faceplate is slightly shorter than the stated height (drawing 1.74 or 3.46 inches against 1.75 or 3.5), so vertical positions are centred on the face. A lamp's spacing inside its frame is the drawing's. The captions inside the buttons, the lamp and port numerals, the ACT and LNK legends over the Ethernet jacks and the SETUP bracket over port 1 are placed from the printed positions in the drawing and are good to about 0.7 mm.
  chassis:
    confidence: drawing
    note: >-
      Width 17.15 inches (435.6 mm) is the drawing's top cover width, and the drawing's 18.32 inches is the distance between the rack ear holes. The height is the data sheet's 1.75 inches, one rack unit and the drawing prints 1.74 (the guide and the data sheet agree with each other). The depth is 6.55 inches in the data sheet and the drawing; the hardware guide prints 6.5. No net weight is stated, only a shipping weight, so none is given.
  colour:
    confidence: estimated
    note: >-
      Median pixels of the angled render on the data sheet (page 2, 'CPM-1600-2-ECA'; the DSM data sheet's renders show the same dark face): the front face #373b3e. THE DSM BACK PANEL'S COLOUR IS NOT SHOWN BY ANY HELD RENDER, SO IT IS DRAWN IN THE FRONT COLOUR AND IS UNCHECKED. NO PHOTOGRAPH IS HELD. The red printed bars and the red logo block the render shows are not drawn.
  ears:
    confidence: drawing
    note: >-
      The drawing shows an ear at each end with two holes (one round, one slotted) and the data sheet says '19 Rack Brackets Included'. The ear hole pitch is not dimensioned; the drawing's 18.32 inches is the distance between the two ear hole axes. The ears are drawn at the faceplate, so the shipped position is flush.
  inlets:
    confidence: datasheet
    note: >-
      The drawing's main view shows two C14 inlets, A and B ('DUAL INPUT RECEPTACLE C14'); the data sheet says '(1) IEC-320-C14 Inlet' for AC models and the guide calls the second inlet optional. WHICH PART NUMBERS CARRY ONE INLET IS NOT STATED, SO BOTH ARE DRAWN AS THE DRAWING SHOWS THEM.
  power:
    confidence: datasheet
    note: >-
      Data sheet page 2: '100 - 240 VAC, 50/60 Hz, 10 Watts Max.' for AC models. The DC models (terminal strip) are not modelled.
  serial-ports:
    confidence: datasheet
    note: >-
      RJ45 RS-232 serial ports, eight (hardware guide, 'Eight (8) RJ45 connectors'), port 1 marked SETUP. Units ship with a standard or a straight pinout and which a part number has is not stated (hardware guide, appendix B), so the jacks state the media and no pinout.
  serial-role:
    confidence: datasheet
    note: >-
      The ports are console server ports (hardware guide, 'Serial Ports: connection to console ports on target devices').
  lamps:
    confidence: drawing
    note: >-
      The lamps of both faces are drawn as plain discs, not as states: the hardware guide names them (port activity, plug activity or status) and does not state a colour or a state for any, so none is claimed.
attrs:
  physical:
    construction: metal
  power:
    input-voltage: 100 to 240 VAC, 50/60 Hz
    power-max-w: 10
  environmental:
    operating-temp: 0 to 60 C (data sheet)
    operating-humidity: 10 - 90% RH (data sheet)
  features:
    serial-pinout: standard or straight pinned serial ports, by part number (hardware guide)
chassis:
  width: 435.6
  height: 44.45
  depth: 166.37
  ru: 1
  color: '#373b3e'
  ears:
    positions:
    - {name: flush, label: 1U rack bracket as shipped, default: true}
  power: ac
gaps:
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    No photograph of any face is held; the only pictures of the product are angled marketing renders. Every position is read from the line drawing and every colour from a render.
  wanted: A straight-on photograph of each face.
- what: lamp-states
  scope: [front]
  reason: vendor-silent
  note: >-
    The documents name the lamps and state no colour or state for them; they are drawn as plain discs.
  wanted: The maker's lamp table for the front panel.
- what: ear-holes
  scope: [front]
  reason: needs-drawing
  note: >-
    The ears are not dimensioned: the holes are drawn (one round, one slotted) with no pitch.
  wanted: A dimensioned drawing of the rack bracket.
- what: antenna-mounts
  scope: [front]
  reason: vendor-silent
  note: >-
    The two rings marked MAIN and AUX are 'optional cell modem antenna mounts' (drawing). They are drawn as discs and are not ports.
  wanted: The maker's drawing of the mounts, and which part numbers fit them.
- what: option-positions
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The drawing shows the second Ethernet jack and the phone jack and says a label is added for units without them; the documents do not say whether a jack sits behind the label. Both are drawn as the drawing shows them.
  wanted: Which part numbers carry the second Ethernet jack and the phone jack.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    The drawing shows the top cover and one side with vent slots and screws, and does not say which side it is. They are not drawn. The underside is not shown.
  wanted: A drawing that names each side.
groups:
  inlets: {term: Inlet, role: service, index-origin: 1, description: 'the two IEC C14 inlets A and B at the left of the back'}
  serial: {term: Port, role: management, index-origin: 1, attrs: {media: rj45-serial, role: console-server}, description: 'the RJ45 RS-232 serial ports, port 1 marked SETUP'}
  eth: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 1g}, description: 'the 10/100/1000 Ethernet jacks, Ethernet 0 and Ethernet 1 (the second on dual Ethernet models)'}
  phone: {term: Port, role: management, index-origin: 1, description: 'the RJ11 phone line jack of the internal modem'}
  usb-setup: {term: Port, role: management, index-origin: 1, description: 'the USB mini set-up port'}
