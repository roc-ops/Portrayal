configurations:
  2am-2x4:
    kind: example
    description: >-
      Two 1x2 access modules and the forward injection module: two downstream and four upstream
      service groups (guide p38 and p52).
    default: true
    source: guide p38 and p49 to p52; the maker drawing of the node, the 2x4 with the forward injection module
  2am-no-fim:
    kind: example
    description: Two access modules without the optional forward injection module (guide p37 to p39, p95).
    source: guide p38, p39 and p95; the maker drawing of the node, the 2x4 without the forward injection module
    bays:
      fim: ''
  fiber-deep-1x2:
    kind: example
    description: >-
      One 1x2 access module on the left of the lid, with no forward injection module and the
      right-hand access module slot empty: one downstream and two upstream service groups (guide p38
      and p49 to p51).
    source: guide p38 and p49 to p51 (the 1X2 figure is at the top of p51); the maker drawing of the node, the 1x2
    bays:
      fim: ''
      am-2: ''
  one-supply:
    kind: example
    description: One power supply module, which the guide says is enough for normal operation (guide p36).
    source: guide p36
    bays:
      psm-2: ''
