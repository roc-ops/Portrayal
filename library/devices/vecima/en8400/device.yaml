format: 1
kind: device
name: en8400
version: 1.0.0
maturity: draft
manufacturer: Vecima
model: EN8400
description: >-
  Entra EN8400 Remote PHY node, the DOCSIS 4.0 member of the family, in the same finned cast
  housing as the EN8100. It opens along its middle into a base half and a lid half and hangs from
  a strand on two clamps. It differs from the EN8100 in its six port entry modules, which have
  screwless stinger seizures and are rated to 1.8 GHz, and in an orange 1.8 GHz label on the
  front; its RF amplifier modules are the 1.2 GHz ones until a 1.8 GHz module is released. The
  base carries the power: two power entry covers over six port entry modules, two RF amplifier
  modules, one or two power supply modules and the power distribution module. The lid carries one or
  two access modules, an optional forward injection module, the lid distribution module with its two
  SFP+ Ethernet ports, and the fibre tray. Each end carries two RF/AC ports, one AC-only port, two
  RF test ports and a fibre entry port, closed by stainless plugs; the ports under the plugs are not
  modelled. The EN8100 is the same housing with the earlier port entry module and is a device of
  its own. The faces are drawn as installed, rotated 180 degrees from the guide's lid-up
  photographs: the lid hangs below the base. The fibre plug is on the lower half of each end and
  the tall stepped fins are on the lower half of each long side.
profile: networking
provenance:
  chassis:
    confidence: datasheet
    note: >-
      Entra EN8100/8400 Hardware Unit Data Sheet (revision 1, 03/26/2024) p7, Dimensions (H x W x D)
      "11.3" x 11.0" x 23.9" (28.8 cm x 28.1 cm x 60.7 cm)", with the notes "Length excludes port
      plugs" and "Height measured from the bottom of the strand". The data sheet does not say which
      face is which; the 60.7 cm is the long axis, the ends carry the ports (guide p41), and the
      node is drawn lying on that axis, so chassis width is 607, height 288 and depth 281. The
      sheet's own W and D labels are therefore not the chassis' width and depth, and the height
      includes the strand clamp side as the sheet says. A second reading, 24 x 11.9 in, comes from an
      installation manual for the EN8400 and is not used; the two disagree and the data sheet is the
      maker's own figure for both nodes.
  pem:
    confidence: photo-measured
    note: >-
      Entra Remote PHY Node EN8100 Installation and Operations Guide (Rev_15) p35: "The PEM
      installed in the EN8400 features screwless stinger seizures as well as increased capacity for
      downstream channels", from 1.2 GHz to 1.8 GHz, and the data sheet p5 and the guide p29 say both
      nodes use one chassis. The guide shows one EN8400 PEM figure and does not name which board is
      which, so the three-board order of the EN8100 is kept. The 1.8 GHz label is on the housing in
      the p29 figure of the EN8400; its position on the front is an estimate.
  chassis-color:
    confidence: estimated
    note: >-
      Entra Remote PHY Node EN8100 Installation and Operations Guide (Rev_15) p29: the two closed
      housings are painted white or very light grey. No document names the colour or finish in
      words.
  mount:
    confidence: datasheet
    note: >-
      The data sheet p7 lists "Mounting options" as strand, pedestal and wall. The device is written
      `strand` because the guide ships the strand clamps with the node (p61, "2 x Top Strand Clamp
      (included with each EN8100)") and sells the wall bracket and the pedestal kit as options
      (p57, p62). The pedestal and wall mounts are stated here and not modelled: the bracket and rod
      kits have no list to stand in on a device that is not a rack device.
  power:
    confidence: estimated
    note: >-
      STAND-IN. Data sheet p7: "Input Voltage 45-90 VAC, 50/60 Hz", "AC Current Passing 15 A max".
      The node is fed through its RF/AC and AC-only ports (guide p41, p87), not through a mains
      inlet, and the feed vocabulary has no word for power carried on the coaxial plant, so `ac` is
      the nearest existing one.
  views:
    confidence: estimated
    note: >-
      Which face is `front`, `rear`, `top` and `bottom` is a drawing convention, because the node
      has no front. `front` is the long side shown on guide p29 and p69 (the side with the closure
      bolts), `rear` the opposite long side (the hinge side, not photographed from outside), `top`
      the back of the base half, where the strand clamps are (guide p61), `bottom` the back of the
      lid half, and `left`/`right` the two ends. The guide calls the ends "left hand side" and
      "right hand side" (p41, p87). The faces are drawn as installed: base up, clamped to the
      strand, lid swinging down and so on the bottom. The guide's closed-node photographs (p29,
      p41) show the unit lid up, so each face is drawn rotated 180 degrees from its photograph:
      the fibre plug and the tall stepped fins, which the photographs show on the upper casting
      (the lid), are on the lower half here. This is an inference from three passages, not a
      statement of the guide: the fibre entry ports are "on the bottom of the unit, 1 on each
      side" (p42), the lid "will swing down" on a horizontal mount (p59, p65), and the lid holds
      the LDM and the fibre tray (p59).
  outline:
    confidence: photo-measured
    note: >-
      Guide p29 (the closed housings, lid up: tall stepped fins on the upper casting, which is the
      lid, and shorter fins on the base below the flange; drawn as installed, so the tall fins are
      the lower half here), p41 (an end), p69 (the three closure bolts on the front) and p32 (the
      open halves).
      The maker's drawing of the node, supplied by the maker, shows the opened housing with the
      bolt bosses, gasket and hinge. The faces are rectangles, so the stepped silhouette is drawn as
      fin fields of different heights. Fin heights, the flange thickness and the position of the seam
      are read as fractions and are estimates, as no figure carries a dimension.
  bolts:
    confidence: photo-measured
    note: >-
      Guide p68: "10 captive clamping bolts", numbered on the enclosure and closed in order from #1
      to #10. Guide p69 shows #5, #1 and #3 along the front, left to right. The maker's drawing of
      the node shows three bolt bosses on each long edge and two on each end of each half, ten in
      all. The numbers of the other seven are not shown in any document held and are not drawn.
  gasket:
    confidence: photo-measured
    note: >-
      Guide p68 step 1, "Ensure the flange and O-ring are free of debris", and the maker's drawing
      of the node, which shows a dark ring round the rim of each half. Its section is not stated.
  hinge:
    confidence: photo-measured
    note: >-
      Guide p32 and p66 and the maker's drawing of the node: two hinges between the halves, each of
      stacked knuckles on one pin. Positions are read from the maker's drawing as fractions of the
      length. The guide says the lid swings down when the node is opened (p59, p65) and that a
      vertically mounted node opens with the hinges on the left, never on the right, or the hinge
      is damaged (p63, p66).
  end-ports:
    confidence: photo-measured
    note: >-
      Guide p41, the side view of one end, lid up: A fibre port on the upper casting, B two RF test
      ports, C two RF/AC ports, D one AC-only port, on the lower casting, as fractions of the end
      face. Plug sizes and the fraction readings are estimates (the plugs stand proud and the
      photograph is in perspective). Drawn as installed, rotated 180 degrees from the photograph
      (a rotation, not a mirror): the fibre plug is on the lower half, the lid, at the bottom right
      of the `right` face, and the RF/AC, AC-only and test plugs are on the upper half, the base.
      The other end is not photographed and is drawn as its pair, the same arrangement mirrored
      left to right, without the printed legends, which is an assumption. The pair follows the
      open node (p32, p42), which shows both fibre entries on the hinge side of the lid. The data
      sheet p7 and the guide p42 count two fibre ports (one per side); the guide's specification
      appendix counts four (two per side). One is drawn on each end.
  end-legends:
    confidence: photo-measured
    note: >-
      Guide p41: the letters "D" and "C" printed beside the RF/AC ports and "PWR (R)" beside the
      AC-only port on the end photographed. Drawn rotated 180 degrees with the end, so they read
      turned the other way up.
  modules:
    confidence: estimated
    note: >-
      Guide p32 (the open node: base above, lid below, items A to H) and the maker's drawing of the
      node give which module sits on which half and in which column. No document held gives a module
      size, a part number or a position in millimetres, so every module's size and every bay's
      place is an estimate: the proportions are those of the module figures on p33 to p40 and of
      the open-node photographs, scaled so that a half is the 607 x 281 of the closed housing.
  open-view:
    confidence: drawing
    note: >-
      The open drawing shows the base half above the lid half with the hinge between them, as guide
      p32 and the maker's drawing of the node show it. Its two regions name the half each part of
      the drawing belongs to. The lid is shown laid out flat, the way both figures show it.
  halves.base.outer:
    confidence: photo-measured
    note: >-
      Guide p61 and p58 to p59: the strand clamps, the wall bracket and the pedestal bracket all
      fit to the base, "the portion that contains the LDM and the Fiber Management Tray" being the
      lid. The base's back, the face with the clamps, is drawn as `top`.
  halves.base.stands:
    confidence: estimated
    note: >-
      Half of the 288 mm height. No document gives either half's depth; the seam is read at about
      the middle of the end (guide p41), so the two halves are taken as equal.
  halves.lid.hinge:
    confidence: photo-measured
    note: >-
      Guide p32, p65 and p66: the hinges are on one long side, and on a horizontally mounted node
      the lid swings down. That long side is drawn as `rear`.
  halves.lid.angle:
    confidence: estimated
    note: >-
      Guide p32 and the maker's drawing of the node show the lid laid out flat, 180 degrees from
      closed. No document states how far the hinge travels, so 180 is the angle the figures draw and
      not a limit.
  halves.lid.stands:
    confidence: estimated
    note: >-
      Half of the 288 mm height, as for the base.
  configurations:
    confidence: datasheet
    note: >-
      Guide p38 and p49 to p52: the access module comes as 1x1 or 1x2, the node as Fiber Deep (one
      module) or 2AM (two), the forward injection module is optional, and only one supply is needed.
      The maker's drawing of the node shows three arrangements: 2x4 with the forward injection
      module, 2x4 without it, and 1x2 with one access module. Where a module is absent the drawing
      shows a bare plate on the lid. Only the 1x2 module face is shown anywhere, so the 1x1 variant
      is not drawn.
