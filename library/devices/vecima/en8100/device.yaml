groups:
  rfam-bays:
    term: Slot
    role: traffic
    index-origin: 1
    description: the two RF amplifier modules, one at each end of the base half
  am-bays:
    term: Slot
    role: traffic
    index-origin: 1
    description: the one or two access modules on the lid half
  ldm-bay:
    term: Slot
    role: management
    index-origin: 1
    description: the lid distribution module
  fim-bay:
    term: Slot
    role: traffic
    index-origin: 1
    description: the optional forward injection module
  psm-bays:
    term: Slot
    role: service
    index-origin: 1
    description: the one or two power supply modules
  pdm-bay:
    term: Slot
    role: service
    index-origin: 1
    description: the power distribution module
  pec-bays:
    term: Cover
    role: service
    index-origin: 1
    description: the two power entry covers
  port-entry-bays:
    term: Slot
    role: service
    index-origin: 1
    description: the six port entry modules under the covers, three at each end
  tray-bay:
    term: Tray
    role: furniture
    index-origin: 1
    description: the fibre management tray
  port-plugs:
    term: Plug
    role: furniture
    index-origin: 1
    description: the plugs that close the external ports on each end
