format: 1
kind: device
name: en8100
version: 1.0.0
maturity: draft
manufacturer: Vecima
model: EN8100
description: >-
  Entra EN8100 Remote PHY node, an outdoor hybrid fibre-coax node in a finned cast housing that
  opens along its middle into a base half and a lid half. It hangs from a strand on two clamps. The
  base carries the power: two power entry covers over six port entry modules, two RF amplifier
  modules, one or two power supply modules and the power distribution module. The lid carries one or
  two access modules, an optional forward injection module, the lid distribution module with its two
  SFP+ Ethernet ports, and the fibre tray. Each end carries two RF/AC ports, one AC-only port, two
  RF test ports and a fibre entry port, closed by stainless plugs; the ports under the plugs are not
  modelled. The EN8400 is the same housing with a different port entry module and is a device of
  its own. The faces are drawn as installed, rotated 180 degrees from the guide's lid-up
  photographs: the lid hangs below the base. The fibre plug is on the lower half of each end and
  the tall stepped fins are on the lower half of each long side.
profile: networking
provenance:
  chassis:
    confidence: datasheet
    note: >-
      Entra EN8100/8400 Hardware Unit Data Sheet (revision 1, 03/26/2024) p7, the dimensions row:
      11.3 x 11.0 x 23.9 in (28.8 x 28.1 x 60.7 cm), with notes that the length leaves out the
      port plugs and that the height is measured from the bottom of the strand. The data sheet does not say which
      face is which; the 60.7 cm is the long axis, the ends carry the ports (guide p41), and the
      node is drawn lying on that axis, so chassis width is 607, height 288 and depth 281. The
      sheet's own W and D labels are therefore not the chassis' width and depth, and the height
      includes the strand clamp side as the sheet says. A second reading, 24 x 11.9 in, comes from an
      installation manual for the EN8400 and is not used; the two disagree and the data sheet is the
      maker's own figure for both nodes.
  chassis-color:
    confidence: estimated
    note: >-
      Entra Remote PHY Node EN8100 Installation and Operations Guide (Rev_15) p29: the two closed
      housings are painted white or very light grey. No document names the colour or finish in
      words.
  mount:
    confidence: datasheet
    note: >-
      The data sheet p7 lists strand, pedestal and wall as the mounting options. The device is written
      `strand` because the guide ships two top strand clamps with each node (p61)
      and sells the wall bracket and the pedestal kit as options
      (p57, p62). The pedestal and wall mounts are stated here and not modelled: the bracket and rod
      kits have no list to stand in on a device that is not a rack device.
  power:
    confidence: estimated
    note: >-
      STAND-IN. Data sheet p7: input 45-90 VAC at 50/60 Hz, and 15 A of passing current at most.
      The node is fed through its RF/AC and AC-only ports (guide p41, p87), not through a mains
      inlet, and the feed vocabulary has no word for power carried on the coaxial plant, so `ac` is
      the nearest existing one.
  views:
    confidence: estimated
    note: >-
      Which face is `front`, `rear`, `top` and `bottom` is a drawing convention, because the node
      has no front. `front` is the long side shown on guide p29 and p69 (the side with the closure
      bolts), `rear` the opposite long side (the hinge side, not photographed from outside), `top`
      the back of the base half, where the strand clamps are (guide p61), `bottom` the back of the
      lid half, and `left`/`right` the two ends. The guide names the ends the left hand and right
      hand sides (p41, p87). The faces are drawn as installed: base up, clamped to the
      strand, lid swinging down and so on the bottom. The guide's closed-node photographs (p29,
      p41) show the unit lid up, so each face is drawn rotated 180 degrees from its photograph:
      the fibre plug and the tall stepped fins, which the photographs show on the upper casting
      (the lid), are on the lower half here. This is an inference from three passages, not a
      statement of the guide: the fibre entry ports are on the bottom of the unit, one on each
      side (p42), the lid swings down on a horizontal mount (p59, p65), and the lid holds
      the LDM and the fibre tray (p59).
  outline:
    confidence: photo-measured
    note: >-
      Guide p29 (the closed housings, lid up: tall stepped fins on the upper casting, which is the
      lid, and shorter fins on the base below the flange; drawn as installed, so the tall fins are
      the lower half here), p41 (an end), p69 (the three closure bolts on the front) and p32 (the
      open halves).
      The maker's drawing of the node, supplied by the maker, shows the opened housing with the
      bolt bosses, gasket and hinge. The end profile and the ribs are stated as `chassis.section`
      and `chassis.fins`, and the open view draws each half's rim from the maker's drawing: a
      rounded rectangle whose corner radius is about 22 mm, a rim about 16 mm
      wide, a bulge round each of the ten closure bolts, and the gasket in a groove just inside
      the rim. Every figure is read as a fraction of the photograph or the drawing and is an
      estimate, as no figure carries a dimension.
  chassis.section:
    confidence: estimated
    note: >-
      Guide Rev_15 p41 (the end of the EN8100, lid up) and p29 (the two closed housings). The end
      is a stepped profile: a narrower casting carrying the tall ribs, a flange at the seam that is
      the widest part (about 8 per cent of the height tall, with the closure lugs on it), and the
      casting that carries the short ribs, which narrows a little towards them. Read from the photograph, the
      castings are about 0.88 of the flange's width where they meet it, and the profile is
      symmetrical about the middle of the depth. The photographs show the unit lid up; the profile
      is drawn as installed, rotated 180 degrees from the guide's photographs (a rotation, not a
      mirror), so the tall-rib casting, the lid, is the lower part and the short-rib casting, the
      base, is the upper part. The sloped and rounded corners of the photographs are approximated
      by steps of 4 to 5 mm, as the format only takes axis-aligned edges. The overall size is the
      data sheet's: the flange takes the 281 mm depth and the two rib edges the 288 mm height.
      Every figure is an estimate read as a fraction of the photograph; no document gives a
      dimension of the profile.
  chassis.plan-outline:
    confidence: estimated
    note: >-
      Guide Rev_15 p29 (the closed housings), p32 (the opened node) and p41 (an end), the data sheet
      p5 and p7, and the maker's drawing of the node, supplied by the maker, which shows the opened
      node from above. Every figure is an estimate read from that drawing, fitted so that the lobes
      at the ends span the data sheet's 607 mm and those of the long edges its 281 mm. The two agree
      to within 2 per cent. The EN8400 shares this housing and is drawn the same. Two assumptions stand. First, the data sheet's length, 23.9 in without
      port plugs, includes the lobes at the ends, so the box is the extremes of the body. Second,
      the castings are inset from the flange in the plan, with smaller corner radii and roughly the
      same outline as the flange. Guide p29 shows each casting ending about 21 mm inside the flange.
      The flange is the widest of eight bands, 24 mm tall: its body is 9.2 mm in from each end and
      9.4 mm in from each long edge, with corners of 22 mm radius. Three lobes stand on each long
      edge, at 108.5, 303.5 and 498.5 mm, each 42 mm wide and 9.4 mm high. Each end has four lobes
      at the bolt holes, 9.2, 6.0, 6.8 and 9.2 mm deep. The castings are seven bands, one for each
      row of the section, 21 mm in from each end with corners of 12 mm radius. A boss of the casting runs out to
      the end wherever a plug stands, so each plug stands on a wall; the drawing shows the port
      bodies standing out beyond the lobes, and the size of a boss is the plug's, which is an
      estimate. Every corner arc is cut into chords of 10 degrees, nine chords and ten points to a
      quarter turn, and a chord that would lie within 0.5 mm of a wall is laid on it. The O-ring
      groove is not part of this key: it stays in the open drawing.
  chassis.fins:
    confidence: estimated
    note: >-
      Guide Rev_15 p29 (the side of the closed housings) and p41 (the end), data sheet p5 (the
      same photographs). The ribs are thick, with gaps about as wide as the ribs. The tall ribs,
      on the lid, stand about 17 per cent of the height (49 mm) at the two ends and run along
      nearly the whole length, with a stepped tip line: a long flat stretch over the middle
      third about two thirds as tall. They are 21 in number, 13 mm thick with 13 mm gaps, from
      33 to 566 mm along the length. The short ribs, on the
      base, stand about 11 per cent of the height (32 mm), 9.5 mm thick with 9.5 mm gaps, 27 in
      number, from 67 to 570.5 mm. Both fields stop at the casting, which the plan outline
      insets by about 21 mm from each end of the flange: the photographs show the ribs ending at
      the casting and not in the flange, so the fields were shortened from the first reading (23
      tall ribs from 13.5 mm, 28 short ribs to 589.5 mm, and a lower step at the end of the tall
      field, which no rib now stands in). Both fields are inside the stated size, not outside it. The data sheet p7 gives
      the height as measured from the bottom of the strand and does not exclude the ribs, and
      the end photograph (p41) has the flange's width at about 1.03 of the whole height with
      both rib fields in it, close to the data sheet's 11.0 in by 11.3 in (0.97); ribs outside
      the 288 mm would make the whole noticeably taller than the flange is wide. Rotated 180
      degrees from the guide's lid-up photographs like the profile, so the tall ribs are on the
      lower edge and the short ribs on the upper edge as installed.
  bolts:
    confidence: photo-measured
    note: >-
      Guide p68: ten captive clamping bolts, numbered on the enclosure and closed in order from #1
      to #10. Guide p69 shows #5, #1 and #3 along the front, left to right. The maker's drawing of
      the node shows three bolt bosses on each long edge and two on each end of each half, ten in
      all. The numbers of the other seven are not shown in any document held and are not drawn.
  gasket:
    confidence: photo-measured
    note: >-
      Guide p68 step 1, which has the installer check the flange and O-ring are clean, and the maker's drawing
      of the node, which shows a dark ring round the rim of each half. Its section is not stated.
  hinge:
    confidence: photo-measured
    note: >-
      Guide p32 and p66 and the maker's drawing of the node: two hinges between the halves, each of
      stacked knuckles on one pin. Positions are read from the maker's drawing as fractions of the
      length. The guide says the lid swings down when the node is opened (p59, p65) and that a
      vertically mounted node opens with the hinges on the left, never on the right, or the hinge
      is damaged (p63, p66).
  end-ports:
    confidence: photo-measured
    note: >-
      Guide p41, the side view of one end, lid up: A fibre port on the upper casting, B two RF test
      ports, C two RF/AC ports, D one AC-only port, on the lower casting, as fractions of the end
      face. Plug sizes and the fraction readings are estimates (the plugs stand proud and the
      photograph is in perspective). Drawn as installed, rotated 180 degrees from the photograph
      (a rotation, not a mirror): the fibre plug is on the lower half, the lid, at the bottom right
      of the `right` face, and the RF/AC, AC-only and test plugs are on the upper half, the base.
      The other end is not photographed and is drawn as its pair, the same arrangement mirrored
      left to right, without the printed legends, which is an assumption. The pair follows the
      open node (p32, p42), which shows both fibre entries on the hinge side of the lid. The data
      sheet p7 and the guide p42 count two fibre ports (one per side); the guide's specification
      appendix counts four (two per side). One is drawn on each end.
  end-legends:
    confidence: photo-measured
    note: >-
      Guide p41: the letters "D" and "C" printed beside the RF/AC ports and "PWR (R)" beside the
      AC-only port on the end photographed. Drawn rotated 180 degrees with the end, so they read
      turned the other way up.
  modules:
    confidence: estimated
    note: >-
      Guide p32 (the open node: base above, lid below, items A to H) and the maker's drawing of the
      node give which module sits on which half and in which column. No document held gives a module
      size, a part number or a position in millimetres, so every module's size and every bay's
      place is an estimate: the proportions are those of the module figures on p33 to p40 and of
      the open-node photographs, scaled so that a half is the 607 x 281 of the closed housing.
  open-view:
    confidence: drawing
    note: >-
      The open drawing shows the base half above the lid half with the hinge between them, as guide
      p32 and the maker's drawing of the node show it. Its two regions name the half each part of
      the drawing belongs to. The lid is shown laid out flat, the way both figures show it.
  halves.base.outer:
    confidence: photo-measured
    note: >-
      Guide p61 and p58 to p59: the strand clamps, the wall bracket and the pedestal bracket all
      fit to the base, the part holding the LDM and the fibre management tray being the
      lid. The base's back, the face with the clamps, is drawn as `top`.
  halves.base.stands:
    confidence: estimated
    note: >-
      Half of the 288 mm height. No document gives either half's depth; the seam is read at about
      the middle of the end (guide p41), in the flange, so the two halves are taken as equal. The
      flange is the widest part of the section (y 132 to 156 mm), and the seam is at its middle.
  halves.lid.hinge:
    confidence: photo-measured
    note: >-
      Guide p32, p65 and p66: the hinges are on one long side, and on a horizontally mounted node
      the lid swings down. That long side is drawn as `rear`.
  halves.lid.angle:
    confidence: estimated
    note: >-
      Guide p32 and the maker's drawing of the node show the lid laid out flat, 180 degrees from
      closed. No document states how far the hinge travels, so 180 is the angle the figures draw and
      not a limit.
  halves.lid.stands:
    confidence: estimated
    note: >-
      Half of the 288 mm height, as for the base.
  configurations:
    confidence: datasheet
    note: >-
      Guide p38 and p49 to p52: the access module comes as 1x1 or 1x2, the node as Fiber Deep (one
      module) or 2AM (two), the forward injection module is optional, and only one supply is needed.
      The maker's drawing of the node shows three arrangements: 2x4 with the forward injection
      module, 2x4 without it, and 1x2 with one access module. Where a module is absent the drawing
      shows a bare plate on the lid. Only the 1x2 module face is shown anywhere, so the 1x1 variant
      is not drawn.
