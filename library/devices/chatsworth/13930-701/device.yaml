format: 1
kind: device
name: 13930-701
version: 0.1.0
maturity: modelled
manufacturer: Chatsworth Products
model: '13930-701'
description: >-
  Velocity single-sided horizontal cable manager, 1U, Chatsworth Products 13930-701: a black plastic
  manager the full 19 in EIA width that bolts to the rack rails and stands 150 mm out, with a row
  of T-shaped cable guides (fingers) along its top and along its bottom and a snap-on cover that
  closes the front. Two openings in its back let cables pass front to rear.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM THE DATA SHEET TABLE AND NOTES; THE CONSTRUCTION FROM ITS PHOTOGRAPH. The
      Velocity Cable Management product data sheet (page 3, Single-Sided Horizontal Cable Managers
      table) prints 13930-701 as 1U x 19 x 5.9 in (150 mm), shipping weight 2 lb (0.9 kg), with notes on
      colour, height, usable depth and usable height; page 1 lists what the manager includes and
      page 2 describes it. NO HELD PAGE DIMENSIONS THE PART INTERNALLY: the fingers, the cover, the ears and the
      rear openings are estimated, each in its own entry below, and the photograph is a grey
      render. Nothing was copied from a picture; the figures are transcribed.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 1U x 19 in x 5.9 in (150 mm) for 13930-701 in the ordering table. The width is the 482.6 of
      19 in EIA, ears included, as a rack-face part is its ears and what hangs off them. The height
      is the 44.45 of 1 unit at 1.75 in. The table's note says the overall height is less than the full unit
      by ".03 inches (0.16 mm)", two figures that disagree (0.03 in is 0.76 mm); the full unit is
      stated and the difference, under a millimetre, is a gap. The depth is the table's overall figure.
  mount:
    confidence: datasheet
    note: >-
      datasheet - the data sheet lists "Four #12-24 x 1" rack-mount screws and four M6 x 25 mm
      rack-mount screws" and "One 19"W EIA rack-mount cable manager", so the part bolts to the
      rail face at a rack unit and stands out from it, which is what `rack-face` says. No held
      page gives the hole positions.
  ears:
    confidence: estimated
    note: >-
      estimated - the 16.3 of ear each end is half of the 32.6 between the 450.0 the manager's body is
      taken to fill (the EIA-310 clear opening between the rails, 17.72 in) and the 482.6 overall.
      No document gives the ear width. Their mounting holes are not drawn.
  shell:
    confidence: estimated
    note: >-
      estimated - A SHEET BODY, NOT A BOX: the back plate as a well 148.0 deep, the two rows of
      fingers standing in it, and the cover across the finger heads, which snaps off.
  thickness:
    confidence: estimated
    note: >-
      estimated - no document states a gauge; 1.5 is the plate of comparable parts in this library.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 2 lb (0.9 kg) in the ordering table, whose column is SHIPPING weight: the carton is in
      it, so the manager itself weighs less. It is stated as the weight so the part has one, and is
      an upper bound.
  fingers:
    confidence: estimated
    note: >-
      estimated - T-SHAPED FINGERS, TOP AND BOTTOM, ON THE FRONT ONLY. The data sheet says the
      manager has "T-shaped cable guides (fingers)" and its photograph shows them along the upper and
      lower edges. No page counts them: 5 a row at a 90.0 pitch (four slots) is read by eye and is one
      more or less. The finger plates are 15.5 thick, half of the 31 mm by which the usable height is
      less than the overall height. The slot and head are estimates.
  usable:
    confidence: estimated
    note: >-
      estimated - the table's notes give a usable depth of 3.7 in (94 mm) and a usable height 1.2 in
      (31 mm) less than the overall height at the narrowest point. The slots end 56.0 out (150 less
      94) and the finger plates are 15.5 each; the notes do not say where the 94 starts or that the
      31 is split equally.
  door:
    confidence: datasheet
    note: >-
      datasheet - "One cover that snaps onto the T-shaped cable guides" and "the snap-on cover stays
      in the opened position to provide easy access to cables" (data sheet, pages 1 and 2). The cover
      is its own part, fitted as shipped, so a drawing can take it off and show the fingers; the format
      has no hinge, so how it swings is a gap.
  front:
    confidence: estimated
    note: >-
      estimated - the cover, fitted. With it off, the two rows of finger heads. The `duct` guide is the
      13.45 between the finger plates over the 450.0 between the ears.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the back plate 2.0 thick, the finger plate to 144.0, four
      slots 36.0 wide on a 90.0 pitch from 56.0 to 138.0 deep with rounded roots, narrowing to the 12.0
      neck under the cover. The depths are the table's and notes'; the slots are read off the photograph.
  bottom:
    confidence: estimated
    note: >-
      estimated - the same fingers along the bottom as along the top; the bottom is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - the side: the back plate, the two finger plates 15.5 high with the usable height
      between them, and the cover's face and returns at the front. No page gives a side elevation.
  right:
    confidence: estimated
    note: >-
      estimated - the left view mirrored: the manager is the same on both sides.
  rear:
    confidence: estimated
    note: >-
      estimated - the data sheet says "Two cable openings in the rear of the manager allow front-to-rear
      cabling" and no held page gives their size or position. They are drawn and declared as two
      obround openings 80 wide and 13.45 high (the usable height), a quarter and three quarters of the way
      across the body. Every figure of them is an estimate; see the `rear-openings` gap.
  passes:
    confidence: estimated
    note: >-
      estimated - the two openings are open (`cover: open`): a cable crosses the back plate through each
      from the front to the rear. The sizes are those of `rear` above.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger plates, run across the
      rack; finger pitch 90.0 and slot 36.0 as `fingers`.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material (plastic) and finish ("black plastic") are the data sheet's specifications
      table and "Color is Black" its note; the indoor-only statement is its description row.
  color:
    confidence: estimated
    note: >-
      estimated - "Color is Black" (the table's note); the shade is the near-black the other Velocity
      parts use. The data sheet's photograph of the part is a grey render.
