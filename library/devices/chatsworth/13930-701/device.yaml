gaps:
  - what: rear-openings
    scope: [rear]
    reason: vendor-silent
    note: >-
      the data sheet says two cable openings are in the rear; no held page gives their size or position,
      so the two obrounds are estimates (80 wide, the usable height high, at a quarter and three quarters).
    wanted: a dimensioned rear view
  - what: finger-count
    scope: [front, top, bottom]
    reason: vendor-silent
    note: >-
      no held page counts or dimensions the fingers: 5 a row at a 90.0 pitch is read by eye from a small
      grey render and is one more or less.
    wanted: a dimensioned plan view, or a larger photograph
  - what: usable-split
    scope: [front, top, bottom]
    reason: vendor-silent
    note: >-
      the notes give a usable depth of 94 mm and a usable height 31 mm under the overall height; they do not
      say where the depth starts or that the 31 is split equally between the two finger plates.
    wanted: a dimensioned section of the manager
  - what: height-under-unit
    scope: [front, left, right]
    reason: vendor-silent
    note: >-
      the table's note says the overall height is ".03 inches (0.16 mm)" under the full rack unit; the two
      figures differ (0.03 in is 0.76 mm). The full unit is drawn.
    wanted: the maker's drawing, to say which figure is meant
  - what: door-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the cover snaps on and "stays in the opened position" when swung out; the format has no hinge, so it
      is drawn as one fitted plate that lifts off, and the swing is not stated.
    wanted: a format that can say a hinged cover, and a close picture of the cover's edge
  - what: ear-holes
    scope: [rear]
    reason: vendor-silent
    note: >-
      the data sheet lists four #12-24 and four M6 rack-mount screws and gives no hole positions.
    wanted: a dimensioned drawing of the back plate
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet's cable fill row points to the maker's cable fill table on its site and states no
      figure; that table is not held.
    wanted: the maker's cable fill table
