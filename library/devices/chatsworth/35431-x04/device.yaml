format: 1
kind: device
name: 35431-x04
version: 0.1.0
maturity: modelled
manufacturer: Chatsworth Products
model: 35431-X04
description: >-
  4U Motive horizontal cable manager with cable pass-through ports, black fingers, Chatsworth
  Products 35431-X04 (35431-704 black, 35431-E04 Glacier White chassis): a back plate the full
  19 in EIA width that bolts to the rack rails and stands 208 mm out, with a row of ten plastic
  T-shaped cable guides (fingers) along its top and along its bottom, nine slots in each a cable
  is laid in through, and a contoured snap-on front door that closes the manager and opens up or
  down. Two oval ports in the back plate lead cables to the other side.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND TWO PHOTOGRAPHS. The Motive Cable Management data
      sheet (MKT-60020-675, 09/24, page 7) states each part's height in rack units, 19 in wide,
      8.2 in (208 mm) deep, chassis style, finger colour and shipping weight, and shows a
      photograph of a 35431 part and of a 35432 part. NO HELD DOCUMENT HOLDS A DIMENSIONED
      DRAWING of a Motive horizontal manager or says how it is built. The drawing is that of the
      Evolution horizontal manager of the same height and chassis style (`35441-x04` in this
      library): the Motive page prints the same envelope and describes the same parts (a snap-on
      door that swings up or down, plastic T-shaped cable guides, a solid or a
      pass-through-ports chassis), and its photographs show the same form. Every figure that is
      not the table's is the Evolution part's and is `estimated`, with its method in the notes
      below. Nothing was copied from a picture; the figures are transcribed.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 4U x 19 x 8.2 (208 mm) for 35431-X04 in the data sheet's ordering table (page
      7, "H x W x D"). The width is the 482.6 of 19 in EIA, ears included, as a rack-face part
      is its ears and what hangs off them. The height is the 177.80 of 4 unit(s) at the EIA-310
      1.75 in. The depth is the maker's overall figure as the table prints it, and not a body
      depth.
  mount:
    confidence: estimated
    note: >-
      estimated - NO HELD PAGE SAYS HOW A MOTIVE HORIZONTAL MANAGER MOUNTS. It is drawn as the
      Evolution horizontal manager is, a back plate the full 19 in EIA width that bolts to the
      rail face at a rack unit and stands out from it (`rack-face`), because the page prints the
      same 19 in by 8.2 in envelope for a manager of the same height. The `mounting` gap names
      what would settle it.
  ears:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the 16.3 of ear each end is half of the 32.6 between the 450.0 the manager's body
      is taken to fill (the EIA-310 clear opening between the rails, 17.72 in, to 450) and the
      482.6 overall. No document gives the ear width. The ears are the ends of the back plate
      and are drawn with it, as the rack-face FS parts draw theirs; their mounting holes are not
      drawn, because the installation instructions give only "two to four" screws for the whole
      range of heights and no hole position.
  shell:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: A SHEET BODY, NOT A BOX: the back plate as a well 206 deep whose floor is open at
      the two ports, the two rows of fingers standing in it, the door in it across the finger
      heads, which lifts off and opens the manager. The data sheet says "welded and riveted
      frame/door attaches to all CPI Rack Systems with supplied tool-less mounting hardware".
  thickness:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: no document states a gauge. 1.5 is the steel of comparable rack-face parts in
      this library (the FS FHD-CMP5DR, 1.5 mm cold-rolled), since the data sheet says only
      "steel, aluminum, and plastic T-shaped cable guides".
  weight:
    confidence: datasheet
    note: >-
      datasheet - 7 lb (3.2 kg) in the data sheet's ordering table (page 7): its column is
      SHIPPING weight, so the carton is in it and the manager itself weighs less. No net weight
      is stated by any document held; the figure is stated as the weight so the part has one,
      and is an upper bound.
  fingers:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: T-SHAPED FINGERS, TOP AND BOTTOM, ON THE FRONT ONLY. The data sheet and
      installation instructions show the plastic T-shaped cable guides along the top edge and
      the bottom edge of the manager, standing from the back plate to the door (step 1: "the
      cover snaps onto the ends of the plastic, T-shaped cable guides (fingers)"). Nothing is on
      the back plate's far side. Ten fingers a row (nine slots counted across the width in the
      data sheet pictures), 45.0 pitch, a 24.0 slot and a head that leaves an 8.0 neck. The
      finger plate is 11.4 thick, from the maker's interior width of 2.6 in for the 2U part; for
      this part the interior width is 6.1 in (154.9 mm), which the 11.4 plates leave to within
      0.1 mm. The pitch, slot and head are read off the pictures against the 450.0 between the
      ears and carry no tolerance.
  door:
    confidence: datasheet
    note: >-
      datasheet - "Contoured, snap-on front door opens up or down" (data sheet page 7, key
      features), and "Swing the cover up or down to access cables." The door is its own part,
      fitted as shipped, so a drawing can take it off and show the fingers; the format has no
      hinge, so that it swings up or down is a gap.
  front:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the door, fitted. With it off, the two rows of finger heads. The `duct` guide is
      the 155.0 between the finger plates (177.8 less 2 x 11.4), over the 450.0 between the
      ears; the cable fill table's interior width for this part is 6.1 in (154.9 mm).
  top:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the plan, rear at y=0: the back plate 2.0 thick, the finger plate to the door,
      nine slots 24.0 wide on a 45.0 pitch from 22 to 186 deep with rounded roots, narrowing to
      the 8.0 neck under the door's 16 mm return. Read off the data sheet pictures; no view of
      the maker's is orthographic.
  bottom:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the pictures show the same fingers along the bottom as along the top; the bottom
      is the top again.
  left:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the side: the back plate, the two finger plates 11.4 high with the cable space
      between them, and the door's face and returns at the front. No picture of the maker's is a
      side elevation; it is built from the front and plan figures.
  rear:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: THE BACK PLATE WITH ITS TWO PORTS. The data sheet's one picture of the
      pass-through ports (page 3, "Cable Pass-Through Ports shown", a 2U part) shows two oval
      ports in the back plate. Here they are 80 wide and 80 high (round), centred on the height,
      their centres 0.24 and 0.76 of the 450.0 between the ears: the 2U part's ovals read 0.45
      of its height and that ratio is held. No picture or table shows this part's ports. The
      plate's ears are the ends of the plate; their mounting holes are not drawn.
  passes:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the two ports are open (`cover: open`): a cable crosses the back plate through
      each from the front to the rear. The sizes are the ports' in `rear` above. The ports are
      round and each is declared `rect`, at the port's side: an `obround` of equal sides
      compiles to a hole of no width in rack.json, which no cable could cross.
  guides:
    confidence: estimated
    note: >-
      the drawing of the Evolution horizontal manager of the same height and chassis style
      (`35441-x04` in this library), used here for the reason in `method`; its own note, in
      which "the data sheet" and "the pictures" are the Evolution Cable Management System data
      sheet's: the duct on the front view is the channel between the finger plates, run across
      the rack; finger pitch 45.0 and slot 24.0 as `fingers`.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the chassis colour and the finger colour are the ordering table's (page 7):
      its group heading "White or Black Cable Manager with Black Fingers" and the note "X=
      Color; 7 = Black, E= Glacier White". No material, finish process, compliance or
      environment statement for a horizontal manager is on the held page, and none is written
      (the material of the back plate is not stated either).
  color:
    confidence: estimated
    note: >-
      estimated - the chassis is black (7) or Glacier White (E) and the fingers are black on
      both, as the table's heading says. The black is the photographs' dark grey-black; the
      Glacier White shade is not given by any document and is drawn a light grey, as the
      Evolution parts' is.
