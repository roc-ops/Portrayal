gaps:
  - what: door-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the maker says the door "opens up or down"; the format has no hinge, so the door is drawn
      as one fitted plate the drawing can take off to show the fingers (the Evolution door is
      described as removable; no held Motive page says this one is), and the swing is not
      stated.
    wanted: a format that can say a hinged cover, and a close picture of the door's edge
  - what: mounting
    scope: [rear]
    reason: vendor-silent
    note: >-
      no held page says how a Motive horizontal manager mounts, how many screws it takes or
      where its holes are; it is drawn as the Evolution horizontal manager is, bolted to the
      rail face.
    wanted: the Motive horizontal manager installation instructions and a dimensioned rear view
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the maker publishes a cable fill table on its site, which is not held, and the data sheet
      gives no capacity for these parts; none is written.
    wanted: the maker's cable fill table row for the Motive horizontal manager
  - what: drawing-borrowed
    scope: [front]
    reason: vendor-silent
    note: >-
      the whole drawing is that of the Evolution horizontal manager `35441-x04`; the Motive
      photographs show the same form, but no held page dimensions a Motive part.
    wanted: a dimensioned drawing of the Motive horizontal manager
  - what: door-features
    scope: [front]
    reason: vendor-silent
    note: >-
      the page 7 photographs show a logo plate on the door and a groove along its length, and no
      light centre strip; the drawing is the Evolution part's door, a plate with a light
      aluminium centre strip, and draws neither the logo plate nor the groove.
    wanted: a close picture or a dimensioned front view of the Motive door
  - what: white-chassis-views
    scope: [rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the Glacier White configuration recolours the front only (the back plate and the door are
      components); the rear, top, bottom and side views are drawn in the black chassis colours,
      as the Evolution part's are, and no held page shows a Glacier White Motive manager.
    wanted: a photograph of a Glacier White Motive horizontal manager and a format that recolours a view's own drawing
  - what: ports-size
    scope: [rear]
    reason: vendor-silent
    note: >-
      no document dimensions the two ports; their size and position are the Evolution part's,
      read off one perspective picture. The page 7 photograph of a 35431 part shows an opening
      with straighter sides than the oval the drawing keeps.
    wanted: a dimensioned rear view
