format: 1
kind: device
name: 32612-e03
version: 2.0.1
maturity: modelled
manufacturer: Chatsworth Products
model: '32612-E03'
description: >-
  Motive single-sided vertical cable manager, Chatsworth Products 32612-E03. It is a Glacier White
  steel and aluminum manager with black fingers. It is drawn at the nominal 7 ft (2134 mm) height
  and 10 in (250 mm) width of its part number. It bolts to the side of the rack and stands beside
  it. Left and right side assemblies carry T-shaped cable guides either side of a central track,
  behind a door hinged on either side. A guide is drawn to each rack unit, a count that is
  estimated. The overall depth is 15.5 in (392 mm). It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE DATA SHEET'S ORDERING MATRIX; THE CONSTRUCTION FROM ITS TEXT AND THE
      INSTALLATION DRAWINGS. The Motive Cable Management data sheet (MKT-60020-675, 09/24) (page 3)
      builds the part number 32612-E03 from a style (1, single-sided, black fingers), a width (10
      in, 250 mm), a colour (Glacier White) and a height (7 ft), and prints one overall depth for a
      single-sided manager, 15.5 in (392 mm). THE WIDTH AND THE HEIGHT ARE NOMINAL: the matrix
      prints them as sizes to order by, not as overall dimensions, and the figures here are taken as
      the overall size. The page 1 specifications and the installation instructions (IIS-737610) say
      what the manager is made of and how it is mounted and fitted with its door. NO HELD PAGE
      DIMENSIONS THE PART INTERNALLY: a guide, a side assembly, the track and the door are
      estimated, each in its own entry below. Nothing was copied from a picture; the figures are
      transcribed.
  mount:
    confidence: drawing
    note: >-
      drawing - rack-side. The installation instructions (page 2) have the manager positioned next
      to the rack and attached with 4 M8 carriage bolts, washers and flange nuts at the upper and
      lower pairs of holes (the kit holds 8 of each, instructions page 1), so it stands beside the
      rack. That its guides face forward is not stated by a held page and is drawn so. It occupies
      no rack unit; `ru: 48` is the 7 ft height over one rack unit and is estimated, because no held
      page says which racks a Motive height is for.
  chassis:
    confidence: estimated
    note: >-
      estimated - 250 mm wide, 2133.6 mm (7 ft, 84 in) high and 392 mm deep. THE DEPTH IS THE DATA
      SHEET'S (matrix note, page 3: 'Overall depth for Single-Sided manager is 15.5"D (392 mm)');
      THE WIDTH AND THE HEIGHT ARE NOMINAL (matrix, page 3: 10" (250) and 7' (2.1)), taken here as
      the overall size, which the matrix does not say they are. The section is therefore estimated
      as a whole, and the figure of each dimension is in the entry that uses it.
  shell:
    confidence: drawing
    note: >-
      drawing - a hollow manager, as every manager in the library is. The body is a sheet body and
      its views are elevations; the solid is what its parts build: the frame, the guides on both
      sides and the door that lifts off and opens the front.
  thickness:
    confidence: estimated
    note: >-
      estimated - no held page states a wall gauge. 1.5 is the plate of comparable parts in the
      library; the parts carry their own thicknesses.
  front:
    confidence: estimated
    note: >-
      estimated - the door, fitted. With it off the front is the channel between the two side
      assemblies, the heads of the guides down each edge and the central track between them. The
      channel is 210 wide, the nominal 250 less a side assembly of 20 each side, which is an
      estimate.
  fingers:
    confidence: estimated
    note: >-
      estimated - A GUIDE TO EACH RACK UNIT, 48 A SIDE. The data sheet (page 1) says the side
      assemblies carry T-shaped cable guides 'that align with rack-mount unit (U) spaces on rack';
      no page counts them. 48 is the nominal 84 in over 1.75 in, a column from the foot to the top
      of the manager. A guide is an arm 12 high with a head 30 high and 20 wide, read by eye from
      the page 1 photographs and taken to be the same on every width.
  door:
    confidence: estimated
    note: >-
      estimated - the door's size and section. The data sheet (page 1) lists one dual-hinged front
      door assembly, pre-installed, drawn as one plate the height of the manager (installation
      instructions, page 3). It opens to the right or to the left and lifts off; the format has no
      hinge, so the side is a gap. The door has the logo plate and two seams on its face and two
      latches on its back, each in the door component's notes.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear is open: the data sheet (page 6) sells a Rear Panel Kit that 'encloses
      the rear of the Motive Single-Sided Vertical Cable Manager', so none is fitted here. It is
      drawn as the back of the door seen between the two side assemblies and the central track; no
      held page dimensions the track.
  top:
    confidence: estimated
    note: >-
      estimated - the end of the manager seen from above, rear at y=0: the side assemblies and the
      track to 389, the heads of the guides from 375 and the door to 392. The 392 is the data
      sheet's; the split is the estimate of the guide and the frame.
  bottom:
    confidence: estimated
    note: >-
      estimated - the bottom end is the top end again.
  left:
    confidence: estimated
    note: >-
      estimated - the side, rear at x=0: 48 arms and heads at one rack unit and the door at the
      front. The side is open between the arms, as the data sheet's photographs show a side of
      slots.
  right:
    confidence: estimated
    note: >-
      estimated - the left view mirrored: the manager is the same on both sides.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the two side assemblies, 210
      wide, run down the height (`run: y`). Its finger pitch is the rack unit, 44.45; the gap
      between arms is the pitch less the arm's estimated 12.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, finish and the indoor-only statement are the specifications table (page
      1): 'Steel and aluminum with plastic T-shaped cable guides and plastic accessories', 'Black or
      Glacier White powder coat paint'. The matrix (page 3) gives the colour of this part and its
      black fingers.
  color:
    confidence: estimated
    note: >-
      estimated - 'Glacier White' (matrix, page 3); the shade is the near-white of the data sheet's
      page 1 photographs of a white manager, which are renders and not a colour value. The guides
      are black on every part number of this style.
attrs:
  physical:
    material: Steel and aluminum with plastic T-shaped cable guides and plastic accessories
    finish: Glacier White powder coat paint
    color: Glacier White
  compliance:
    environment: Indoor use only, in environmentally controlled areas
chassis:
  width: 250
  height: 2133.6
  depth: 392
  ru: 48
  mount: rack-side
  shell: sheet
  thickness: 1.5
  color: '#d8dbde'
gaps:
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet's cable fill row points to the maker's cable fill table on its site and states
      no figure; that table is not held.
    wanted: the maker's cable fill table
  - what: door-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the door opens to the right or to the left and lifts off; the format has no hinge, so it is
      drawn as one fitted plate and the side it swings from is not stated.
    wanted: a format that can say a hinged cover
  - what: finger-shape
    scope: [front, rear, left, right, top, bottom]
    reason: vendor-silent
    note: >-
      no held page dimensions a guide: the arm, the head and the width are read by eye from the page
      1 photographs.
    wanted: a dimensioned side view of one guide
  - what: finger-count
    scope: [front, left, right]
    reason: vendor-silent
    note: >-
      the data sheet says the guides align with rack units and gives no count; 48 a side is the
      nominal 84 in over one rack unit.
    wanted: the number of rack units the manager spans
  - what: nominal-size
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the matrix prints the width (10 in) and the height (7 ft) as sizes to order by; only the depth
      is printed as an overall figure, so the width and the height are drawn at their nominal
      values.
    wanted: an overall width and height, or a dimensioned drawing
  - what: central-track
    scope: [rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet and the installation drawing show an integral central track and no held page
      gives its width or how far it stands from the rear; it is drawn as a strip the full depth of
      the frame.
    wanted: a section through the manager
  - what: side-assembly
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no held page dimensions a side assembly: it is drawn as a plate 1.5 thick under its guides, the
      length of the manager and the width of a guide, which is an estimate; the guides stand on it
      and in front of the central section.
    wanted: a section through the manager
  - what: accessories
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the manager ships with accessory rods, rotating fingers, cable bundle swivels and half spools
      (the data sheet, page 1; none on the 6 in and 8 in widths for the fingers and spools), which
      fit anywhere on the track; none has a fixed place, so none is drawn.
    wanted: a drawing of a manager as shipped, with the accessories placed
  - what: door-hook
    scope: [rear]
    reason: vendor-silent
    note: >-
      the data sheet (page 1, key features) names a hook on the inside of the front door for a test
      meter, in text only. The installation figure (page 3) shows a hinge lug and the rear door's
      latches, not a hook. The hook is not drawn on the door's back because no held picture shows it.
    wanted: a photograph of the inside of the front door
  - what: end-caps
    scope: [front]
    reason: vendor-silent
    note: >-
      the page 1 photograph shows two dark rounded caps on the top of the manager, one near each
      side of the door; no held page gives their size. They belong to the shared frame, which the
      next part for this family draws, so they are not drawn here.
    wanted: a dimensioned view of the top of the frame
  - what: feet
    scope: [front]
    reason: vendor-silent
    note: >-
      the page 1 photograph shows two dark feet at the bottom of the manager and a plate between
      them with two holes; no held page gives their size. They belong to the shared frame, which
      the next part for this family draws, so they are not drawn here.
    wanted: a dimensioned view of the bottom of the frame
  - what: door-hinge-tabs
    scope: [rear]
    reason: vendor-silent
    note: >-
      the installation figure (page 3) shows four hinge tabs, one at each corner of the door's
      back, and gives no size. They belong to the shared frame, which the next part for this family
      draws, so they are not drawn here.
    wanted: a dimensioned view of the door's back
  - what: door-bevel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the door is drawn as a flat plate 3 mm thick at the front of the printed 392 mm depth; no held
      page gives its section. The frame, the guides and the door stand in a well 392 deep,
      open at the rear.
    wanted: a section through the door
  - what: bracket-stand-off
    scope: [rear]
    reason: vendor-silent
    note: >-
      the manager attaches to the rack with carriage bolts; how far it stands from the upright and
      whether it overlaps the rail is never dimensioned.
    wanted: a dimensioned drawing of the manager fitted to a rack
  - what: color-shade
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the matrix says only Glacier White; the shade drawn is chosen, and no held page gives a colour
      value.
    wanted: the maker's colour specification
