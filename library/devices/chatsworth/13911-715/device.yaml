gaps:
  - what: mid-panel
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet lists four steel mid panels with attachment points for cable management
      accessories and gives the usable depth of each channel; no held page draws or dimensions
      the panel, so the 75 mm between the two floors (406 less 191 less 140) is drawn as one
      solid plate with no attachment point or opening.
    wanted: a dimensioned section of the manager
  - what: rear-channel
    scope: [rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      no held page draws the rear of a double-sided manager: the data sheet lists four
      half-height covers and a usable depth of 140 mm at the rear, and its one photograph shows
      the front. The rear channel is drawn as the front one at that depth, its fingers level
      with the front ones.
    wanted: a dimensioned rear view or a section
  - what: finger-shape
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      no held page dimensions a finger: the arm and the head are read by eye from the page 2
      drawing of the single-sided part, and the count (51 a side of each channel) is the rack's
      units.
    wanted: a dimensioned side view of one section
  - what: section-joint
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the guide says the manager is two sections, equal for 6 ft and 8 ft and a short upper over
      a long lower for 7 ft; no held page gives the lengths, so the seam is drawn at the middle.
    wanted: the section lengths
  - what: door-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the doors swing open to the right or left and release when pulled from a corner; the
      format has no hinge, so each is drawn as one fitted plate and the swing is not stated.
    wanted: a format that can say a hinged cover
  - what: door-bevel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the table's depth is the 406 without doors plus the bevel of the doors, which varies
      slightly with width; the two doors are taken as equal, each drawn as a flat plate standing
      5.5 mm past the ends of the guides.
    wanted: a section through the door
  - what: bracket-stand-off
    scope: [left, right]
    reason: vendor-silent
    note: >-
      the manager bolts to the rack's upright with M8 bolts; how far it stands from the upright
      and whether it overlaps the rail is never dimensioned.
    wanted: a dimensioned drawing of the manager fitted to a rack
  - what: usable-split
    scope: [front, rear, top, bottom]
    reason: vendor-silent
    note: >-
      the table's notes give the usable width (33 mm less than overall) and the usable depths
      (191 mm front, 140 mm rear); they do not say that the two finger walls are equal and are
      all of the 33, or that each depth runs from the floor to the ends of the guides, so the
      16.5 mm wall and the 75 mm mid panel are derived with those assumptions.
    wanted: a dimensioned section of the manager
  - what: construction-source
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the installation instructions held are for the single-sided 6 in part and none is held for
      a double-sided one; the section, finger and wall are those drawn there and are taken to
      hold at 3.6 in and on both faces. The data sheet photograph of the 12 in double-sided part
      (page 3) shows T-shaped guides down the front and supports the front only.
    wanted: the installation instructions or a section of a double-sided part
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the data sheet's cable fill row points to the maker's cable fill table on its site and
      states no figure; that table is not held.
    wanted: the maker's cable fill table
