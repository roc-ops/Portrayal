format: 1
kind: device
name: 13911-715
version: 0.1.0
maturity: modelled
manufacturer: Chatsworth Products
model: '13911-715'
description: >-
  Velocity double-sided vertical cable manager, Chatsworth Products 13911-715: a black plastic
  and steel manager 91 in (2311 mm) tall, 3.6 in (91 mm) wide and 16.4 in (417 mm) deep, for 8'H
  (2.4 m), 51U racks, that bolts to the side of the rack and stands beside it. Two channels 58
  mm wide stand back to back, 191 mm deep at the front and 140 mm at the rear. Each has a wall
  of T-shaped fingers down each edge, one rack unit apart, and a plastic door in two halves. It
  takes no rack unit.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE DATA SHEET TABLE; THE CONSTRUCTION FROM THE INSTALLATION DRAWINGS OF THE
      SINGLE-SIDED 6 IN PART. The Velocity Cable Management product data sheet (Rev.23 06/22)
      (page 3) prints the part as 91 x 3.6 x 16.4 in (2311 x 91 x 417 mm), shipping weight 27 lb
      (12.2 kg) as printed, for 8'H (2.4 m), 51U racks, with notes on depth and usable size, and
      page 1 lists what the double-sided kit holds. The Velocity Vertical Cable Manager
      installation instructions (IIS-713902, Rev. 2) draw how a single-sided Velocity manager is
      assembled, mounted and fitted with its doors; none is held for a double-sided part, and
      its construction is taken to hold here, on both faces, which the data sheet photograph of
      the 12 in double-sided part (page 3) supports for the T-shaped guides down the front and
      no page states for the rear. NO HELD PAGE DIMENSIONS THE PART INTERNALLY: a finger, the
      root of a wall, the door section and the mid panel are estimated, each in its own entry
      below. Nothing was copied from a picture; the figures are transcribed.
  mount:
    confidence: drawing
    note: >-
      drawing - rack-side. The installation instructions of the single-sided part (pages 1 and
      4) have the manager positioned next to the rack and bolted to the rack's upright with M8
      bolts through the manager's holes and the rack's front holes ('the top front rack hole'),
      eight M8 x 25 mm bolts in the kit, so it stands beside the rack, outside the rails, its
      fingers facing forward and back. It occupies no rack unit; `ru: 51` is the rack it is sold
      for ('For 8'H (2.4 m), 51U Racks').
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 91 in (2311 mm) high, 3.6 in (91 mm) wide and 16.4 in (417 mm) deep for
      13911-715 in the ordering table. THE DEPTH IS THE TABLE'S, WITH THE BEVEL OF THE DOORS:
      the table's note says the manager is 16 in (406 mm) deep without doors, that the overall
      depth varies a little with width because of the bevel of the door, and that the usable
      depth is 7.5 in (191 mm) at the front and 5.5 in (140 mm) at the rear. So the guides end
      406 apart and the two doors stand 5.5 beyond them if they are equal.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX, as the dual-sided finger ducts
      already in the library are built. The body is a sheet body and its views are elevations;
      the solid is what its parts build: on each face the back plate as a well (196.5 deep at
      the front, 145.5 at the rear), the two finger walls, 51 fingers a wall standing in it and
      two half-height doors that pull off and open that channel. The two floors stand 75 apart
      in the middle of the part (see `spine`); plates sunk 0.05 inside the top, bottom and side
      faces close the mid panel between them.
  spine:
    confidence: estimated
    note: >-
      estimated - the mid panel is the 75 between the two floors: the table's note gives 406
      deep without doors, 191 usable at the front and 140 at the rear, and 406 less the two is
      75. This takes each usable depth to run from its floor to the ends of its guides, which
      the note does not say. The data sheet (page 1) lists four steel mid panels with attachment
      points; none is dimensioned, so the panel is drawn as one solid plate with no attachment
      point or opening.
  thickness:
    confidence: estimated
    note: >-
      estimated - no held page states a wall gauge. 1.5 is the plate of comparable parts in the
      library; the parts carry their own thicknesses.
  front:
    confidence: estimated
    note: >-
      estimated - the front doors, fitted. With them off the front is the channel between the
      two finger walls, the ends of the fingers along each edge and the back plate at the bottom
      of it. The channel is 58 wide, the 91 overall less the 33 (1.3 in) the table's note takes
      off for the usable width, so each wall is 16.5 if the two walls are equal and are all of
      the 33, which no held page says.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear channel, the same parts placed the same way as the front, at the rear
      usable depth of 140 (5.5 in): the data sheet lists four half-height covers and that usable
      depth, and the one photograph shows the front. Its fingers stand level with the front
      ones, which no page says. The rear is a working face, so no opening is drawn in it.
  fingers:
    confidence: estimated
    note: >-
      estimated - A FINGER TO EACH RACK UNIT, 51 A SIDE OF EACH CHANNEL. The data sheet says the
      T-shaped guides are 'spaced 1U apart' and the installation instructions show a column down
      each edge; no page counts them. 51 is the rack's units (8'H (2.4 m), 51U), a column
      centred on the height with 22.02 left at each end. A finger is an arm 14 high with a head
      32 high, read by eye from the page 2 drawing of the single-sided part, and taken to be the
      same on every width and at the rear.
  door:
    confidence: datasheet
    note: >-
      datasheet - four half-height covers that snap onto the T-shaped cable guides, two on each
      face, plastic on the 3.6 in manager (pages 1 and 2). They are drawn as one plate each, the
      seam at the middle of the height; for the 7 ft manager the installation instructions say
      the upper section is short and the lower long, and no page gives the lengths, so the seam
      is estimated there.
  top:
    confidence: estimated
    note: >-
      estimated - the end of the manager seen from above, rear at y=0: the rear door to 3, its
      rails to 5.5, the rear heads to 14.5, the arms to 135.5, the wall roots to 145.5, the mid
      panel to 220.5, then the front wall roots, arms, heads, rails and door out to 417. The
      depths are the table's and the note's; the split is the estimate of the finger, the wall
      and the door.
  bottom:
    confidence: estimated
    note: >-
      estimated - the bottom end is the top end again.
  left:
    confidence: estimated
    note: >-
      estimated - the side, rear at x=0: each channel's wall root, 51 arms and heads at one rack
      unit and the edge of its two doors with the seam between them, and the mid panel between
      the two.
  right:
    confidence: estimated
    note: >-
      estimated - the left view mirrored: the manager is the same on both sides.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on each face is the channel between its two finger walls, 58 wide,
      run down the height (`run: y`). Its finger pitch is the rack unit, 44.45; the gap between
      arms is the pitch less the arm's estimated 14.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 27 lb (12.2 kg) in the ordering table, whose column is SHIPPING weight: the
      carton is in it, so the manager itself weighs less. It is stated as the weight so the part
      has one, and is an upper bound.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, finish, colour and the indoor-only statement are the specifications
      table (page 2) and the table's note 'Color is Black'.
  color:
    confidence: estimated
    note: >-
      estimated - 'Color is Black' (ordering table); the shade is the near-black of the maker's
      photographs of the fitted part, which are renders.
