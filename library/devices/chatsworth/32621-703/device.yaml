      rows down at 1.374 mm per pixel, so 2133.6 tall. Page 3 adds three pairs of squares, a
      triangle and a dot. The side plate's mark places (page 1 photograph) are read across at 10.3
      mm per pixel. They are read down at 2.624 mm per pixel. A mark stands along the depth at 20
      plus its column less 99.5, times 10.3, and down at its row less 72, times 2.624. The side
      plate shows four marks near 505 mm, two dots near 1904 mm and one near 219 mm. The side
