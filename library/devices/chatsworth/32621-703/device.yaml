      The foot holes' centres stand 60 above the plate's foot, an estimate. Each door is 3 thick,
      the door part's own figure, and the fittings stand inside it. The plan's lips and foot
      blocks lie beyond the 600 mm depth, where a face clips decor, so none is drawn. The front
      and rear doors paint over the fittings, so those faces show none.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on each face is the channel between the two side assemblies, 160 wide,
      run down the height (`run: y`). Its finger pitch is the rack unit, 44.45; the gap between arms
      is the pitch less the arm's estimated 12.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, finish and the indoor-only statement are the specifications table (page
      1): 'Steel and aluminum with plastic T-shaped cable guides and plastic accessories', 'Black or
      Glacier White powder coat paint'. The matrix (page 3) gives the colour of this part and its
      black fingers.
  color:
    confidence: estimated
    note: >-
      estimated - 'Black' (matrix, page 3); the shade is the near-black of the data sheet's
      photographs of the fitted part, which are renders. The guides are black on every part number
      of this style.
