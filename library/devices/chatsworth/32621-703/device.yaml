format: 1
kind: device
name: 32621-703
version: 0.1.0
maturity: modelled
manufacturer: Chatsworth Products
model: '32621-703'
description: >-
  Motive double-sided vertical cable manager, Chatsworth Products 32621-703. It is a black steel and
  aluminum manager, 7 ft (2134 mm) tall and 8 in (200 mm) wide, with black fingers. It bolts to the
  side of the rack and stands beside it. Two channels stand back to back about a central track. Each
  has a T-shaped cable guide to every rack unit down both sides and a dual-hinged door. The overall
  depth is 23.6 in (600 mm). It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE DATA SHEET'S ORDERING MATRIX; THE CONSTRUCTION FROM ITS TEXT AND THE
      INSTALLATION DRAWINGS. The Motive Cable Management data sheet (MKT-60020-675, 09/24) (page 3)
      builds the part number 32621-703 from a style (2, double-sided, black fingers), a width (8 in,
      200 mm), a colour (Black) and a height (7 ft), and prints one overall depth for a double-sided
      manager, 23.6 in (600 mm). THE WIDTH AND THE HEIGHT ARE NOMINAL: the matrix prints them as
      sizes to order by, not as overall dimensions, and the figures here are taken as the overall
      size. The page 1 specifications and the installation instructions (IIS-737610) say what the
      manager is made of and how it is mounted and fitted with its doors. NO HELD PAGE DIMENSIONS
      THE PART INTERNALLY: a guide, a side assembly, the track, the centre section and the door are
      estimated, each in its own entry below. Nothing was copied from a picture; the figures are
      transcribed.
  mount:
    confidence: drawing
    note: >-
      drawing - rack-side. The installation instructions (page 2) have the manager positioned next
      to the rack and attached with 4 M8 carriage bolts, washers and flange nuts at the upper and
      lower pairs of holes, and draw the double-sided manager with the mounting holes of a 3 in and
      a 6 in wide rack in its centre section, so it stands beside the rack, outside the rails, a
      face to the front and a face to the rear. It occupies no rack unit; `ru: 48` is the 7 ft
      height over one rack unit and is estimated, because no held page says which racks a Motive
      height is for. The page 2 text says the manager is biased towards the rear on a 3 in wide
      rack; the model is drawn equal about its centre.
  chassis:
    confidence: estimated
    note: >-
      estimated - 200 mm wide, 2133.6 mm (7 ft, 84 in) high and 600 mm deep. THE DEPTH IS THE DATA
      SHEET'S (matrix note, page 3: 'Overall depth for Double-Sided manager is 23.6"D (600 mm)');
      THE WIDTH AND THE HEIGHT ARE NOMINAL (matrix, page 3: 8" (200) and 7' (2.1)), taken here as
      the overall size, which the matrix does not say they are. The section is therefore estimated
      as a whole, and the figure of each dimension is in the entry that uses it.
  shell:
    confidence: drawing
    note: >-
      drawing - a hollow manager, as every manager in the library is. The body is a sheet body and
      its views are elevations; the solid is what its parts build: a frame and the guides on each
      face, and the two doors that lift off.
  thickness:
    confidence: estimated
    note: >-
      estimated - no held page states a wall gauge. 1.5 is the plate of comparable parts in the
      library; the parts carry their own thicknesses.
  front:
    confidence: estimated
    note: >-
      estimated - the front channel with its door fitted. With the door off the front is the channel
      between the two side assemblies, the heads of the guides down each edge and the central track
      between them. The channel is 160 wide, the nominal 200 less a side assembly of 20 each side,
      which is an estimate.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear channel with its door fitted. The data sheet (page 1) lists a dual-hinged
      front door and rear door assembly, and the installation instructions (page 3) say the rear
      door is a plain flat door. No page draws the rear guides; the installation instructions' page
      2 figure draws guides on both sides of the centre section and the rear is taken to be the
      front again, 48 a side.
  fingers:
    confidence: estimated
    note: >-
      estimated - A GUIDE TO EACH RACK UNIT, 48 A SIDE ON EACH FACE, 192 IN ALL. The data sheet
      (page 1) says the side assemblies carry T-shaped cable guides 'that align with rack-mount unit
      (U) spaces on rack'; no page counts them. 48 is the nominal 84 in over 1.75 in, a column from
      the foot to the top of the manager. A guide is an arm 12 high with a head 30 high and 20 wide,
      read by eye from the page 1 photographs and taken to be the same on every width and on both
      faces.
  door:
    confidence: datasheet
    note: >-
      datasheet - a dual-hinged front door and a rear door assembly, pre-installed (data sheet, page
      1), each drawn as one plate the height of the manager (installation instructions, page 3). A
      door opens to the right or to the left and lifts off; the format has no hinge, so the side is
      a gap. The front door has a logo and the rear door is plain; neither logo is drawn.
  spine:
    confidence: estimated
    note: >-
      estimated - the centre section, 198 deep between the two channels, with the central track and
      the mounting holes for the rack (installation instructions, page 2). The page 2 figure draws
      the rear guides, the centre and the front guides about equal in depth, so each is a third of
      the overall depth less the doors. The figure is not to a stated scale. The data sheet (page 6)
      sells a Mid Panel Kit that 'covers and divides the front and rear', so none is fitted: the
      centre is open in the side views.
  top:
    confidence: estimated
    note: >-
      estimated - the end of the manager seen from above, rear at y=0: a door 3 thick at each end, a
      channel of 198 at each, and the centre section of 198 between. The 600 is the data sheet's;
      the split is the estimate of the centre section, the guide and the frame.
  bottom:
    confidence: estimated
    note: >-
      estimated - the bottom end is the top end again.
  left:
    confidence: estimated
    note: >-
      estimated - the side, rear at x=0: 48 arms and heads at one rack unit on each face and a door
      at each end. The side is open between the arms and across the centre, as the data sheet's
      photographs show a side of slots.
  right:
    confidence: estimated
    note: >-
      estimated - the left view mirrored: the manager is the same on both sides.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on each face is the channel between the two side assemblies, 160 wide,
      run down the height (`run: y`). Its finger pitch is the rack unit, 44.45; the gap between arms
      is the pitch less the arm's estimated 12.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, finish and the indoor-only statement are the specifications table (page
      1): 'Steel and aluminum with plastic T-shaped cable guides and plastic accessories', 'Black or
      Glacier White powder coat paint'. The matrix (page 3) gives the colour of this part and its
      black fingers.
  color:
    confidence: estimated
    note: >-
      estimated - 'Black' (matrix, page 3); the shade is the near-black of the data sheet's
      photographs of the fitted part, which are renders. The guides are black on every part number
      of this style.
attrs:
  physical:
    material: Steel and aluminum with plastic T-shaped cable guides and plastic accessories
    finish: Black powder coat paint
    color: Black
  compliance:
    environment: Indoor use only, in environmentally controlled areas
chassis:
  width: 200
  height: 2133.6
  depth: 600
  ru: 48
  mount: rack-side
  shell: sheet
  thickness: 1.5
  color: '#202224'
gaps:
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the data sheet's cable fill row points to the maker's cable fill table on its site and states
      no figure; that table is not held.
    wanted: the maker's cable fill table
  - what: door-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      each door opens to the right or to the left and lifts off; the format has no hinge, so it is
      drawn as one fitted plate and the side it swings from is not stated.
    wanted: a format that can say a hinged cover
  - what: finger-shape
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      no held page dimensions a guide: the arm, the head and the width are read by eye from the
      photographs and the page 2 figure.
    wanted: a dimensioned side view of one guide
  - what: finger-count
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the data sheet says the guides align with rack units and gives no count; 48 a side on each
      face is the nominal 84 in over one rack unit.
    wanted: the number of rack units the manager spans
  - what: nominal-size
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the matrix prints the width (8 in) and the height (7 ft) as sizes to order by; only the depth
      is printed as an overall figure, so the width and the height are drawn at their nominal
      values.
    wanted: an overall width and height, or a dimensioned drawing
  - what: channel-depth
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      only the overall depth is printed; the two channels and the centre section are each drawn a
      third of it less the doors (198), read from the proportions of the page 2 figure, which is not
      to a stated scale.
    wanted: a section through the manager
  - what: central-track
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet and the installation drawing show an integral central track and no held page
      gives its width or how far it stands; it is drawn as a strip the full depth between the doors.
    wanted: a section through the manager
  - what: accessories
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the manager ships with four accessory rods, rotating fingers, cable bundle swivels and half
      spools (the data sheet, page 1; no fingers or spools on the 6 in and 8 in widths), which fit
      anywhere on the track; none has a fixed place, so none is drawn.
    wanted: a drawing of a manager as shipped, with the accessories placed
  - what: mid-panel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet (page 6) sells a Mid Panel Kit that covers and divides the front and rear of
      the double-sided manager; it is not part of the manager as shipped, so the centre is drawn
      open.
    wanted: a drawing of the manager as shipped
  - what: door-features
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the front door has a logo at the top and both doors have two blue latches on the back
      (installation instructions, page 3), and the data sheet's page 1 photograph shows a lighter
      vertical strip down the front door; no held page gives their size or position, so none is
      drawn and the two doors are the same plain plate.
    wanted: a dimensioned door
  - what: door-bevel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      each door is drawn as a flat plate 3 mm thick at the end of its channel; no held page gives
      its section.
    wanted: a section through the door
  - what: bracket-stand-off
    scope: [top, bottom]
    reason: vendor-silent
    note: >-
      the manager attaches to the rack with carriage bolts; how far it stands from the upright,
      where the rack's rails fall in the centre section and the rearward bias on a 3 in rack
      (installation instructions, page 2) are never dimensioned.
    wanted: a dimensioned drawing of the manager fitted to a rack
  - what: color-shade
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the matrix says only Black; the shade drawn is read from the maker's renders of the fitted
      part, which no page gives as a colour value.
    wanted: the maker's colour specification
