format: 1
kind: device
name: 32621-703
version: 3.0.1
maturity: modelled
manufacturer: Chatsworth Products
model: '32621-703'
description: >-
  Motive double-sided vertical cable manager, Chatsworth Products 32621-703. It is a black steel and
  aluminum manager, 7 ft (2134 mm) tall and 8 in (200 mm) wide, with black fingers. It bolts to the
  side of the rack and stands beside it. Two channels stand back to back about a central track. Each
  has a T-shaped cable guide to every rack unit down both sides and a dual-hinged door. The overall
  depth is 23.6 in (600 mm). It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE DATA SHEET'S ORDERING MATRIX; THE CONSTRUCTION FROM ITS TEXT AND THE
      INSTALLATION DRAWINGS. The Motive Cable Management data sheet (MKT-60020-675, 09/24) (page 3)
      builds the part number 32621-703 from a style (2, double-sided, black fingers), a width (8 in,
      200 mm), a colour (Black) and a height (7 ft), and prints one overall depth for a double-sided
      manager, 23.6 in (600 mm). THE WIDTH AND THE HEIGHT ARE NOMINAL: the matrix prints them as
      sizes to order by, not as overall dimensions, and the figures here are taken as the overall
      size. The page 1 specifications and the installation instructions (IIS-737610) say what the
      manager is made of and how it is mounted and fitted with its doors. NO HELD PAGE DIMENSIONS
      THE PART INTERNALLY: a guide, a side assembly, the track, the centre section and the door are
      estimated, each in its own entry below. The matrix figures are transcribed, not copied from a picture. The frame fittings are read
      from the pictures, and the `frame` entry lists them as a table. A row is one figure: its
      picture, the pixels it spans, the direction it is read in, the scale, the size drawn and the
      tolerance. The direction is down the rows or across the columns of that picture. The
      tolerance is how far the drawn size may differ from the pixels times the scale; it is 0.05
      unless a row says otherwise. The scale list holds 12 scales, each the millimetres of a known
      part over the pixels it spans.
  mount:
    confidence: drawing
    note: >-
      drawing - rack-side. The installation instructions (page 2) have the manager positioned next
      to the rack and attached with 4 M8 carriage bolts, washers and flange nuts at the upper and
      lower pairs of holes, and draw the double-sided manager with the mounting holes of a 3 in and
      a 6 in wide rack in its centre section, so it stands beside the rack, outside the rails, a
      face to the front and a face to the rear. It occupies no rack unit; `ru: 48` is the 7 ft
      height over one rack unit and is estimated, because no held page says which racks a Motive
      height is for. The page 2 text says the manager is biased towards the rear on a 3 in wide
      rack; the model is drawn equal about its centre.
  chassis:
    confidence: estimated
    note: >-
      estimated - 200 mm wide, 2133.6 mm (7 ft, 84 in) high and 600 mm deep. THE DEPTH IS THE DATA
      SHEET'S (matrix note, page 3: 'Overall depth for Double-Sided manager is 23.6"D (600 mm)');
      THE WIDTH AND THE HEIGHT ARE NOMINAL (matrix, page 3: 8" (200) and 7' (2.1)), taken here as
      the overall size, which the matrix does not say they are. The section is therefore estimated
      as a whole, and the figure of each dimension is in the entry that uses it.
  shell:
    confidence: drawing
    note: >-
      drawing - a hollow manager, as every manager in the library is. The body is a sheet body and
      its views are elevations; the solid is what its parts build: a frame and the guides on each
      face, and the two doors that lift off.
  thickness:
    confidence: estimated
    note: >-
      estimated - no held page states a wall gauge. 1.5 is the plate of comparable parts in the
      library; the parts carry their own thicknesses.
  front:
    confidence: estimated
    note: >-
      estimated - the front channel with its door fitted. With the door off the front is the channel
      between the two side assemblies, the heads of the guides down each edge and the central track
      between them. The channel is 160 wide, the nominal 200 less a side assembly of 20 each side,
      which is an estimate.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear channel with its door fitted. The data sheet (page 1) lists a dual-hinged
      front door and rear door assembly, and the installation instructions (page 3) say the rear
      door is a plain flat door. No page draws the rear guides; the installation instructions' page
      2 figure draws guides on both sides of the centre section and the rear is taken to be the
      front again, 48 a side.
  fingers:
    confidence: estimated
    note: >-
      estimated - A GUIDE TO EACH RACK UNIT, 48 A SIDE ON EACH FACE, 192 IN ALL. The data sheet
      (page 1) says the side assemblies carry T-shaped cable guides 'that align with rack-mount unit
      (U) spaces on rack'; no page counts them. 48 is the nominal 84 in over 1.75 in, a column from
      the foot to the top of the manager. A guide is an arm 12 high with a head 30 high and 20 wide,
      read by eye from the page 1 photographs and taken to be the same on every width and on both
      faces.
  door:
    confidence: estimated
    note: >-
      estimated - the data sheet (page 1) lists a dual-hinged front door and a rear door assembly,
      pre-installed, and the installation instructions (page 3) draw the rear door as one plate;
      that the doors exist is printed, but no page prints a size of a door, so each is drawn as one
      plate of the manager's nominal width and height (the door components carry the method). A door
      opens to the right or to the left and lifts off; the format has no hinge, so the side is a
      gap. The front door has a latch tip at each edge and, on the 12 in width, two seams and a plate. The rear door is its own
      plain part with a latch tip at each edge. Each door has two latches on its inner face. On the side faces only the end of each handle
      shows, because the housing stands behind the arms. Each door
      component carries its figures.
  spine:
    confidence: estimated
    note: >-
      estimated - the centre section, 198 deep between the two channels, with the central track and
      the mounting holes for the rack (installation instructions, page 2). The page 2 figure draws
      the rear guides, the centre and the front guides about equal in depth, so each is a third of
      the overall depth less the doors. The figure is not to a stated scale. The data sheet (page 6)
      sells a Mid Panel Kit that 'covers and divides the front and rear'. That kit is a separate
      part and is not drawn. The flat centre plate of the page 3 render is drawn between the
      channels, with its holes and slots, in the side views.
  top:
    confidence: estimated
    note: >-
      estimated - the end of the manager seen from above, rear at y=0: a door 3 thick at each end, a
      channel of 198 at each, and the centre section of 198 between. The 600 is the data sheet's;
      the split is the estimate of the centre section, the guide and the frame.
      It draws four end caps, two rails, a cross tube and a beam across the rear. The cross tube
      stands 44 percent of the way from the front caps to the rear caps.
  bottom:
    confidence: estimated
    note: >-
      estimated - the bottom end has the layout of the top end: the doors, the channels and the
      centre section. It draws the base plate with four holes, two rails and four feet.
  left:
    confidence: estimated
    note: >-
      estimated - the side, rear at x=0: 48 arms and heads at one rack unit on each face and a door
      at each end. The side is open between the arms, as the data sheet's photographs show a side
      of slots. The flat centre plate of the page 3 render stands between the channels. Each
      door's latch stands on the door's inner face. The housing
      is 15 x 70.5 mm, 4.7 to 1, the proportion of the page 3 figure's housing. That housing is 18 x
      85.5 px at 300 dpi. At the figure's 1.380 mm per px it is about 25 x 118 mm. The built size is a
      stand-in. The arms and heads stand in front of the housing. Only about 14 mm of each 45 mm
      handle shows, between two heads.
  right:
    confidence: estimated
    note: >-
      estimated - the left view mirrored: the manager is the same on both sides, except the centre plate's head. The render's far plate shows its own head pattern, drawn on this face. The rear end is on
      the right in this view. The rear latch and the rear guides stand there, and the front ones stand
      at the left.
  frame:
    confidence: estimated
    note: >-
      estimated - the data sheet's page 1 photograph of the double-sided manager shows two caps on
      its top and two feet on a base plate. The data sheet's page 3 render shows four caps, a flat
      plate between the two channels and three feet. The other feet are inferred from the visible
      ones and the symmetry. No page gives a size. 12 scales are used, each in the direction it
      was read. Scale 1, photograph, read down: 2.624 mm per pixel, the nominal height 2133.6 mm
      over the left door's rows 72 to 885, 813 rows. Scale 2, photograph, read across: 2.679 mm
      per pixel, the 12 in width 300 mm over the door's columns at half level, 112 columns. Scale
      3, photograph, read across: 10.3 mm per pixel, the depth 600 mm over the left face's columns
      97 to 155, 58 columns. Scale 4, render, read across: 5.1 mm per pixel, the centre section
      198 mm over the plate's columns, 39 columns. Scale 5, render, read across: 5.35 mm per
      pixel, the centre section 198 mm over the near plate's end columns 118 to 155, 37 columns.
      Scale 6, render, read along the width axis: 4.4 mm per pixel, the door's width 300 mm over
      the cap centres, 67.8 pixels. Scale 7, render, read along the depth axis: 3.7 mm per pixel,
      the depth 600 mm over the left rail, 162 pixels. Scale 8, render, read down: 4.267 mm per
      pixel, the nominal height 2133.6 mm over the render's rows, 500 rows. Scale 9, plan, read
      both: 0.7444 mm per pixel, the centre section 198 mm over its columns 552 to 818, 266
      pixels. Scale 10, elevation, read across: 2.357 mm per pixel, the centre section 198 mm over
      its columns 2188 to 2272, 84 columns. Scale 11, elevation, read down: 1.374 mm per pixel,
      the nominal height 2133.6 mm over the manager's rows 515 to 2068, 1553 rows. Scale 12,
      elevation, read both: 1.484 mm per pixel, the plan's square 14.1 mm over the page 3 square's
      outline, 9.5 pixels. The centre section's 198 mm is itself an estimate, so scales 4, 5, 9
      and 10 rest on it. The pictures are the data sheet's page 1 photograph and page 3 render,
      and the installation instructions' page 2 plan and page 3 elevation. Each figure below names
      its picture, the pixels it spans, its direction and its scale. A cap (page 1 photograph) is
      28 columns across at 2.679 mm per pixel, so 75 wide. It is 8 rows down at 2.624 mm per
      pixel, so 21 tall. The cap and foot widths are read on the 12 in part and drawn on every
      width. A cap's depth is half its width, 37.5, a stand-in that no picture gives. A foot (page
      1 photograph) is 22 columns across at 2.679 mm per pixel, so 58.9 wide. It is 5 rows down at
      2.624 mm per pixel, so 13.1 tall. A foot's depth is half its width, 29.5, a stand-in that no
      picture gives. A render foot (page 3 render) is 7 columns across at 4.4 mm per pixel, so
      30.8 wide. The render's feet are narrower than the photograph's, and the photograph rules at
      its finer scale. The base rim (page 1 photograph) is 3 rows down at 2.624 mm per pixel, so
      7.9 tall. The bottom's base outline is the chassis width by its depth. A base-plate or
      side-plate hole (page 1 photograph) is 3 rows down at 2.624 mm per pixel, so 7.9 across. A
      side-plate dot (page 1 photograph) is 2 rows down at 2.624 mm per pixel, which gives 5.2
      across, and 5 is drawn, within 0.3. A rail's width (page 3 render) is 15.25 rows down at 4.4
      mm per pixel after the slant correction of 0.952, so 70.5 wide. The correction 0.952 is sin
      29.1 plus sin 27.8, the angles read in the render. The base rails take the same width,
      because the door hides them in the render. The cross tube's depth (page 3 render) is 14.75
      rows down at 3.7 mm per pixel, so 54.6 deep. The cross tube's place (page 3 render) is 44.3
      percent of the way from the front cap centres to the rear ones, 556.5 mm apart. It is the
      mean of four readings along the cap centres: 45.4, 43.7, 45.5 and 42.6. The rear beam's
      depth (page 3 render) is 7 rows down at 3.7 mm per pixel, so 25.9 deep. The centre plate is
      the centre section, 198 deep, between the two channels. A rounded lower corner's radius
      (page 2 plan) is 17.5 rows down at 0.7444 mm per pixel, so 13 radius. The plate's rounded
      foot is three corner radii tall, 39. A tall base rail (page 2 plan) is 44 rows down at
      0.7444 mm per pixel, so 32.8 tall. A round hole of the near plate (page 3 render) is 2.57
      columns across at 5.1 mm per pixel, so 13.1 across. Its rows span 2.29 on average, 9.8 down,
      and the column reading is used. The far plate's dark hole (page 3 render) is 3 columns
      across at 5.1 mm per pixel, so 15.3 across. A slot (page 3 render) is 4 columns across at
      5.1 mm per pixel, so 20.4 wide. It is 2 rows down at 4.267 mm per pixel, so 8.5 tall. A
      faint mark (page 3 render) is 1.5 columns across at 5.1 mm per pixel, so 7.7 across. A plan
      square (page 2 plan) is 19 columns across at 0.7444 mm per pixel, so 14.1 wide. It is 19
      rows down at 0.7444 mm per pixel, so 14.1 tall. The plan slot (page 2 plan) is 35 columns
      across at 0.7444 mm per pixel, so 26.1 wide. It is 19 rows down at 0.7444 mm per pixel, so
      14.1 tall. A plan screw ring (page 2 plan) is 20 columns across at 0.7444 mm per pixel, so
      14.9 across. A page 3 square (page 3 elevation) is 9.5 columns across at 1.484 mm per pixel,
      so 14.1 wide. It is 9.5 rows down at 1.484 mm per pixel, so 14.1 tall. It is drawn at the
      plan square's size, so the scale of the page 3 marks is a transfer from the plan. The page 3
      triangle (page 3 elevation) is 11 columns across at 1.484 mm per pixel, so 16.3 wide. It is
      8 rows down at 1.484 mm per pixel, so 11.9 tall. The page 3 dot (page 3 elevation) is 5
      columns across at 1.484 mm per pixel, so 7.4 across. The near plate's hole columns (page 3
      render) are 37 columns across at 5.35 mm per pixel, so 198 in all. The head holes, the foot
      holes, the foot slots and the fifth dot stand at the columns the render shows. The near
      plate's slot and dot rows (page 3 render) are read down at 4.267 mm per pixel. Each row is
      counted from the render's foot line under it. The far plate's mark places (page 3 render)
      are read across at 5.1 mm per pixel. They are read down at 4.267 mm per pixel. A column is
      counted from column 56 and a row from row 75, and each row is corrected by 0.49 per pixel
      along the axis. The overlay marks (page 3 render) are read across at 5.35 mm per pixel. They
      are read down at 4.267 mm per pixel. An overlay of the render on the built plate gave two
      more rows of marks, near 200 mm and 861 mm, and a foot row. The plan's places (page 2 plan)
      are read across at 0.7444 mm per pixel. They are read down at 0.7444 mm per pixel. The plan
      gives four squares, a slot and four screws on the centre section. The page 3 marks' places
