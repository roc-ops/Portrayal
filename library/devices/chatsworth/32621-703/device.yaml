gaps:
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the data sheet's cable fill row points to the maker's cable fill table on its site and states
      no figure; that table is not held.
    wanted: the maker's cable fill table
  - what: door-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      each door opens to the right or to the left and lifts off; the format has no hinge, so it is
      drawn as one fitted plate and the side it swings from is not stated.
    wanted: a format that can say a hinged cover
  - what: finger-shape
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      no held page dimensions a guide: the arm, the head and the width are read by eye from the
      photographs and the page 2 figure.
    wanted: a dimensioned side view of one guide
  - what: finger-count
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the data sheet says the guides align with rack units and gives no count; 48 a side on each
      face is the nominal 84 in over one rack unit.
    wanted: the number of rack units the manager spans
  - what: nominal-size
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the matrix prints the width (8 in) and the height (7 ft) as sizes to order by; only the depth
      is printed as an overall figure, so the width and the height are drawn at their nominal
      values.
    wanted: an overall width and height, or a dimensioned drawing
  - what: channel-depth
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      only the overall depth is printed; the two channels and the centre section are each drawn a
      third of it less the doors (198), read from the proportions of the page 2 figure, which is not
      to a stated scale.
    wanted: a section through the manager
  - what: central-track
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet and the installation drawing show an integral central track. No held page
      gives its width or how far it stands. The top and bottom faces draw it as a strip the full
      depth between the doors. The left and right faces draw the page 3 render's flat centre
      plate, 198 deep, in its place.
    wanted: a section through the manager
  - what: side-assembly
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no held page dimensions a side assembly: it is drawn as a plate 1.5 thick under its guides, the
      length of the manager and the width of a guide, which is an estimate; the guides stand on it
      and in front of the central section.
    wanted: a section through the manager
  - what: accessories
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the manager ships with four accessory rods, rotating fingers, cable bundle swivels and half
      spools (the data sheet, page 1; no fingers or spools on the 6 in and 8 in widths), which fit
      anywhere on the track; none has a fixed place, so none is drawn.
    wanted: a drawing of a manager as shipped, with the accessories placed
  - what: mid-panel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the data sheet (page 6) sells a Mid Panel Kit. It covers and divides the front and rear of
      the double-sided manager. It is not part of the manager as shipped, so the kit's panel is not
      drawn. The flat centre plate of the page 3 render is drawn.
    wanted: a drawing of the manager as shipped
  - what: door-hook
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet (page 1, key features) names a hook on the inside of the front door for a test meter,
      in text only. The installation figure (page 3) shows a hinge lug and the rear door's latches, not a
      hook. No held picture shows the hook, so it is not drawn.
    wanted: a photograph of the inside of the front door
  - what: door-hinge-tabs
    scope: [rear]
    reason: vendor-silent
    note: >-
      the installation figure (page 3) shows four hinge tabs, one at each corner of the rear door's back. It
      also shows a central rib and two cross bars. It gives no size. They belong to the rear door's own
      part, which a following change draws, so they are not drawn here.
    wanted: a dimensioned view of the door's back
  - what: end-fittings-front
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the end caps, feet and base plate show above and below the door in the data sheet's page 1
      photograph. Each door plate is drawn to the full nominal height over the frame. It hides the
      fittings in the front and rear elevations. No held page gives the overall height with them.
    wanted: a dimensioned elevation with the caps and the feet
  - what: track-rungs
    scope: [left, right]
    reason: vendor-silent
    note: >-
      the page 1 photograph and the page 3 render show a row of rungs down the central track, seen
      through the open channel. The left and right faces draw the guides but not the rungs. The door
      plates hide the track in the front and rear elevations. No held page gives the pitch or size
      of a rung.
    wanted: a dimensioned view of the central track
  - what: door-bevel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      each door is drawn as a flat plate 3 mm thick at the end of its channel; no held page gives
      its section. The frame, the guides and the door of each face stand in a well 201 deep,
      open behind.
    wanted: a section through the door
  - what: bracket-stand-off
    scope: [top, bottom]
    reason: vendor-silent
    note: >-
      the manager attaches to the rack with carriage bolts; how far it stands from the upright,
      where the rack's rails fall in the centre section and the rearward bias on a 3 in rack
      (installation instructions, page 2) are never dimensioned.
    wanted: a dimensioned drawing of the manager fitted to a rack
  - what: color-shade
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the matrix says only Black; the shade drawn is read from the maker's renders of the fitted
      part, which no page gives as a colour value.
    wanted: the maker's colour specification
