kind: device
name: 13901-703
version: 0.1.0
maturity: modelled
manufacturer: Chatsworth Products
model: '13901-703'
description: >-
  Velocity single-sided vertical cable manager, Chatsworth Products 13901-703: a black plastic
  and steel manager 80.5 in (2045 mm) tall and 3.6 in (91 mm) wide, for 7'H (2.1 m), 45U racks,
  that bolts to the side of the rack and stands beside it. A back plate carries a wall of
  T-shaped fingers down each edge, one rack unit apart, and a plastic door in two halves snaps
  onto their ends over a channel 58 mm wide and 191 mm deep. It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE DATA SHEET TABLE; THE CONSTRUCTION FROM THE INSTALLATION DRAWINGS OF THE
      6 IN PART. The Velocity Cable Management product data sheet (Rev.23 06/22) (page 3) prints
      the part as 80.5 x 3.6 x 9.7 in (2045 x 91 x 246 mm), shipping weight 18 lb (8.2 kg) as
      printed, for 7'H (2.1 m), 45U racks, with notes on depth and usable size. The Velocity
      Vertical Cable Manager installation instructions (IIS-713902, Rev. 2) draw how a Velocity
      vertical manager is assembled, mounted and fitted with its doors; the drawing names no
      width, and its construction is taken to hold for this one, which the data sheet photograph
      of the 12 in part (page 3) supports for the T-shaped guides and no page states for the
      others. NO HELD PAGE DIMENSIONS THE PART INTERNALLY: a finger, the root of a wall, the
      door section and the position of the rear openings are estimated, each in its own entry
      below. Nothing was copied from a picture; the figures are transcribed.
  mount:
    confidence: drawing
    note: >-
      drawing - rack-side. The installation instructions (pages 1 and 4) have the manager
      positioned next to the rack and bolted to the rack's upright with M8 bolts through the
      manager's holes and the rack's front holes ('the top front rack hole'), eight M8 x 25 mm
      bolts in the kit, so it stands beside the rack, outside the rails, its fingers facing
      forward. It occupies no rack unit; `ru: 45` is the rack it is sold for ('For 7'H (2.1 m),
      45U Racks').
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 80.5 in (2045 mm) high, 3.6 in (91 mm) wide and 9.7 in (246 mm) deep for
      13901-703 in the ordering table. THE DEPTH IS THE TABLE'S, WITH THE BEVEL OF THE DOOR: the
      table's note says the manager is 9.5 in (241 mm) deep without doors, that the overall
      depth varies a little with width because of the bevel of the door, and that the usable
      depth is 7.5 in (191 mm). So the guides end at 241 and the door stands at 246.
  shell:
    confidence: drawing
    note: >-
      drawing - a hollow manager, as every manager in the library is. The body is a sheet body
      and its views are elevations; the solid is what its parts build: the back plate as a well
      196 deep, the two finger walls and 90 fingers standing in it, and the two halves of the
      door, which pull off and open the channel.
  thickness:
    confidence: estimated
    note: >-
      estimated - no held page states a wall gauge. 1.5 is the plate of comparable parts in the
      library; the parts carry their own thicknesses.
  floor:
    confidence: datasheet
    note: >-
      datasheet - the floor of the well is 50 from the rear face: 241 (9.5 in without doors)
      less the 191 usable depth (7.5 in).
  front:
    confidence: estimated
    note: >-
      estimated - the doors, fitted. With them off the front is the channel between the two
      finger walls, the ends of the fingers along each edge and the back plate at the bottom of
      it. The channel is 58 wide, the 91 overall less the 33 (1.3 in) the table's note takes off
      for the usable width, so each wall is 16.5 if the two walls are equal and are all of the
      33, which no held page says.
  fingers:
    confidence: estimated
    note: >-
      estimated - A FINGER TO EACH RACK UNIT, 45 A SIDE. The data sheet says the T-shaped guides
      are 'spaced 1U apart' and the installation instructions show a column down each edge; no
      page counts them. 45 is the rack's units (7'H (2.1 m), 45U), a column centred on the
      height with 22.37 left at each end. A finger is an arm 14 high with a head 32 high, read
      by eye from the page 2 drawing of the 6 in part, and taken to be the same on every width.
  door:
    confidence: datasheet
    note: >-
      datasheet - two half-height covers that snap onto the T-shaped cable guides, plastic on
      the 3.6 in manager (page 2). They are drawn as one plate each, the seam at the middle of
      the height; for the 7 ft manager the installation instructions say the upper section is
      short and the lower long, and no page gives the lengths, so the seam is estimated there.
  rear:
    confidence: estimated
    note: >-
      estimated - the data sheet says 'openings in the back of the manager allow easy
      front-to-rear cabling' and the photographs show them, but no held page dimensions or
      positions any. The rear is drawn as the plain back plate with its seam; the openings are a
      gap.
  top:
    confidence: estimated
    note: >-
      estimated - the end of the manager seen from above, rear at y=0: the back plate to 50, the
      wall roots to 60, the arms to 232, the heads to 241 and the door to 246. The depths are
      the table's; the split is the estimate of the finger and wall.
  bottom:
    confidence: estimated
    note: >-
      estimated - the bottom end is the top end again.
  left:
    confidence: estimated
    note: >-
      estimated - the side, rear at x=0: the back plate, the wall root, 45 arms and heads at one
      rack unit and the door, with the seam between the two halves.
  right:
    confidence: estimated
    note: >-
      estimated - the left view mirrored: the manager is the same on both sides.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the two finger walls, 58
      wide, run down the height (`run: y`). Its finger pitch is the rack unit, 44.45; the gap
      between arms is the pitch less the arm's estimated 14.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 18 lb (8.2 kg) in the ordering table, whose column is SHIPPING weight: the
      carton is in it, so the manager itself weighs less. It is stated as the weight so the part
      has one, and is an upper bound.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, finish, colour and the indoor-only statement are the specifications
      table (page 2) and the table's note 'Color is Black'.
  color:
    confidence: estimated
    note: >-
      estimated - 'Color is Black' (ordering table); the shade is the near-black of the maker's
      photographs of the fitted part, which are renders.
attrs:
  physical:
    weight-kg: 8.2
    material: Steel mid panels and splice plates, plastic sides, plastic door
    finish: Black epoxy-polyester hybrid powder coat paint on steel parts; black plastic
    color: Black
  compliance:
    environment: Indoor use only, in environmentally controlled areas
