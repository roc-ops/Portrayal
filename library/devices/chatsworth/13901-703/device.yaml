  color: '#1b1c1e'
gaps:
  - what: rear-openings
    scope: [rear]
    reason: vendor-silent
    note: >-
      the data sheet says openings in the back allow front-to-rear cabling; no held page gives
      their size or position, so the rear is drawn as a plain back plate with no pass-through.
    wanted: a dimensioned rear view
  - what: finger-shape
    scope: [front, left, right]
    reason: vendor-silent
    note: >-
      no held page dimensions a finger: the arm and the head are read by eye from the page 2
      drawing, and the count (45 a side) is the rack's units.
    wanted: a dimensioned side view of one section
  - what: section-joint
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the guide says the manager is two sections, equal for 6 ft and 8 ft and a short upper over
      a long lower for 7 ft; no held page gives the lengths, so the seam is drawn at the middle.
    wanted: the section lengths
  - what: door-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the doors swing open to the right or left and lift off; the format has no hinge, so each
      is drawn as one fitted plate and the swing is not stated.
    wanted: a format that can say a hinged cover
  - what: door-bevel
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the table's depth includes the bevel of the door, which varies slightly with width; the
      door is drawn as a flat plate to 246, 5 mm past the 241 the guides reach.
    wanted: a section through the door
  - what: bracket-stand-off
    scope: [rear]
    reason: vendor-silent
    note: >-
      the manager bolts to the rack's upright with M8 bolts; how far it stands from the upright
      and whether it overlaps the rail is never dimensioned.
    wanted: a dimensioned drawing of the manager fitted to a rack
  - what: usable-split
    scope: [front, top, bottom]
    reason: vendor-silent
    note: >-
      the table's notes give the usable width (33 mm less than overall) and the usable depth
      (191 mm); they do not say that the two finger walls are equal and are all of the 33, or
      that the 191 runs from the floor to the ends of the guides, so the 16.5 mm wall and the 50
      mm behind the floor are derived with those assumptions.
    wanted: a dimensioned section of the manager
  - what: width-construction
    scope: [front, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the installation instructions name no width; the section, finger and wall are those drawn
      for the 6 in manager and are taken to hold at 3.6 in, where the table's notes give the
      same 33 mm off the width and the same depth without doors.
    wanted: an installation drawing or a section for this width
  - what: color-shade
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the table's note says only that the colour is black; the near-black shade drawn is read
      from the maker's renders of the fitted part, which no page gives as a colour value.
    wanted: the maker's colour specification
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet's cable fill row points to the maker's cable fill table on its site and
      states no figure; that table is not held.
    wanted: the maker's cable fill table
