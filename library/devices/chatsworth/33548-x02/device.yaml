format: 1
kind: device
name: 33548-x02
version: 0.1.1
maturity: modelled
manufacturer: Chatsworth Products
model: 33548-X02
description: >-
  2U Evolution horizontal cable manager with brushes, Chatsworth Products 33548-X02 (33548-702
  black, 33548-E02 Glacier White): a steel back plate the full 19 in EIA width that bolts to the
  rack rails and stands 208 mm out, with a row of ten plastic T-shaped cable guides (fingers)
  along its top and along its bottom, nine slots in each a cable is laid in through, and a
  contoured snap-on front door that closes the manager and swings open up or down or lifts off.
  A brush in the back plate closes the opening cables cross to the other side.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      FIGURES FROM A DATA SHEET TABLE AND FROM PICTURES. The Evolution Cable Management
      System data sheet (page 3, Evolution Horizontal Cable Managers table) states each part's
      height in rack units, 19" EIA, 8.2" (208 mm) deep, chassis style and shipping weight, and
      its pictures show the four chassis styles; the installation instructions (IIS-735441,
      Rev.3) draw the door off and on. NO DOCUMENT HOLDS A DIMENSIONED DRAWING: every figure
      below that is not the data sheet's table is read off a render or a line drawing and is
      `estimated`, with how. The maker's cable fill table (CPI Cable Fill Table, 2024) gives
      the interior width and depth of the manager, which fixes the finger plate and the cable
      space.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 2U x 19" EIA x 8.2" (208 mm) for 33548-X02 in the data sheet's ordering table,
      chassis style with brushes, and 3.5 in (89 mm) high, 19 in (483 mm) wide, 8.2 in (208 mm)
      deep on the product page for 33548-702. The width is the 482.6 of 19 in EIA, ears included,
      as a rack-face part is its ears and what hangs off them. The height is the 88.9 of two units
      at the EIA-310 1.75 in. The depth is the maker's overall projection from the rail face, door
      and fingers included, and not a body depth.
  mount:
    confidence: drawing
    note: >-
      drawing - the installation instructions' steps 2 and 3: the chassis is aligned to the
      desired rack unit and the mounting holes at its back line up with the rack's holes, one
      screw for every hole, "two to four" in all depending on the height. So the part bolts to
      the rail face at a rack unit and stands out from it, which is what `rack-face` says. The
      FS horizontal ducts are `rack` parts that state their units, so whether this line is
      `rack-face` or `rack` is a choice the pull request asks the owner to accept.
  ears:
    confidence: estimated
    note: >-
      estimated - the 16.3 of ear each end is half of the 32.6 between the 450.0 the manager's
      body is taken to fill (the EIA-310 clear opening between the rails, 17.72 in, to 450) and
      the 482.6 overall. No document gives the ear width. The ears are the ends of the back plate
      and are drawn with it, as the rack-face FS parts draw theirs; their mounting holes are not
      drawn, because the installation instructions give only "two to four" screws for the whole
      range of heights and no hole position.
  shell:
    confidence: estimated
    note: >-
      estimated - A SHEET BODY, NOT A BOX: the back plate as a well 206 deep whose floor is open at
      the brush's window, the two rows of fingers standing in it, the door in it across the finger
      heads, which lifts off and opens the manager. The data sheet says "welded and riveted
      frame/door attaches to all CPI Rack Systems with supplied tool-less mounting hardware".
  thickness:
    confidence: estimated
    note: >-
      estimated - no document states a gauge. 1.5 is the steel of comparable rack-face parts in
      this library (the FS FHD-CMP5DR, 1.5 mm cold-rolled), since the data sheet says only
      "steel, aluminum, and plastic T-shaped cable guides".
  weight:
    confidence: datasheet
    note: >-
      datasheet - 4 lb (1.8 kg) in the data sheet's ordering table: its column is SHIPPING
      weight, so the carton is in it and the manager itself weighs less. No net weight is stated
      by any document held; the figure is stated as the weight so the part has one, and is an
      upper bound.
  fingers:
    confidence: estimated
    note: >-
      estimated - T-SHAPED FINGERS, TOP AND BOTTOM, ON THE FRONT ONLY. The data sheet and
      installation instructions show the plastic T-shaped cable guides along the top edge and the
      bottom edge of the manager, standing from the back plate to the door (step 1: "the cover
      snaps onto the ends of the plastic, T-shaped cable guides (fingers)"). Nothing is on the
      back plate's far side. Ten fingers a row (nine slots counted across the width in the data
      sheet pictures), 45.0 pitch, a 24.0 slot and a head that leaves an 8.0 neck. The finger
      plate is 11.4 thick: (88.9 - 66.0) / 2 from the maker's interior width of 2.6 in. The
      pitch, slot and head are read off the pictures against the 450.0 between the ears and carry
      no tolerance.
  door:
    confidence: datasheet
    note: >-
      datasheet - "Contoured, snap-on front door opens up or down" (data sheet and product
      page), "The cover will open up or down and can be removed when cabling" (installation
      instructions). The door is its own part, fitted as shipped, so a drawing can take it off and
      show the fingers; the format has no hinge, so that it swings up or down is a gap.
  front:
    confidence: estimated
    note: >-
      estimated - the door, fitted. With it off, the two rows of finger heads, and the back
      plate's window the brush fills. The `duct` guide is the 66.1 between the finger plates (88.9
      less 2 x 11.4), the cable fill table's interior width of 2.6 in (66.0 mm), over the 450.0
      between the ears.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the back plate 2.0 thick, the finger plate to the door,
      nine slots 24.0 wide on a 45.0 pitch from 22 to 186 deep with rounded roots, narrowing to the
      8.0 neck under the door's 16 mm return. Read off the data sheet pictures; no view of the
      maker's is orthographic.
  bottom:
    confidence: estimated
    note: >-
      estimated - the pictures show the same fingers along the bottom as along the top; the bottom
      is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - the side: the back plate, the two finger plates 11.4 high with the cable space
      66.1 between them, and the door's face and returns at the front. No picture of the maker's
      is a side elevation; it is built from the front and plan figures.
  rear:
    confidence: estimated
    note: >-
      estimated - THE BACK PLATE WITH ITS BRUSH. The data sheet's one picture of the brush (page 3,
      "Brushes shown", a 2U part) shows a brush insert fitted at one end of the back plate and the
      same insert beside the part. It is drawn as one brush window 150.0 wide and 39.7 high (0.6 of
      the 66.1 between the finger plates), centred on the height, 30 mm in from the end of the
      450.0 between the ears, as seen from the front: the insert is about a third of the part's
      width in the perspective picture. The bristles are drawn vertical, meeting in a horizontal
      line; the picture does not show their direction. The window is outlined with a light frame 3.0 outside it and the seam is a lighter line, both STAND-INS so the brush reads on the dark plate: the picture shows the insert's raised rim and no document dimensions it. The plate's ears are the ends of the plate;
      their mounting holes are not drawn.
  passes:
    confidence: estimated
    note: >-
      estimated - the brush's window is a pass-through with `cover: brush`: a cable crosses the back
      plate through the brush from the front to the rear. The size is the window's in `rear`.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger plates, run across
      the rack; finger pitch 45.0 and slot 24.0 as `fingers`.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the maker's CPI Cable Fill Table (updated 2024; the data sheet's "Cable Fill" row
      points to chatsworth.com/cablefill, which links it) lists 33548-X02, Evolution Horizontal Cable
      Manager, Brush, 2U: interior width 2.6 in, interior depth 6.5 in, usable area 17.0 sq in;
      recommended fill 135 Cat 5e (0.200 in OD), 87 Cat 6 (0.250 in) and 60 Cat 6a (0.300 in); maximum
      fill 271, 173 and 120. The table's notes give recommended as 25% of the usable area and maximum
      as 50%. The figure stated is the maximum for Cat 6, 173, as the FS managers state their
      theoretical maximum for Cat6; the recommended 87 is in the basis.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - materials, finishes and the indoor-only statement are the data sheet's
      specifications table (page 2, "Steel, aluminum, and plastic T-shaped cable guides"; "Black or
      Glacier White powder coat paint"; "For indoor use only, in environmentally controlled areas; may
      not be used outdoors, in harsh environments or in air-handling spaces"). BABA compliance is the
      product page's. The part is not RoHS-stated by any document held.
  color:
    confidence: estimated
    note: >-
      estimated - black, or Glacier White (the colour letter X in the part number: 7 black, E Glacier
      White). The black is the maker's renders'; the Glacier White shade is not given by any document
      and is drawn a light grey.
attrs:
  physical:
    weight-kg: 1.8
    material: Steel, aluminum and plastic T-shaped cable guides
    finish: Black or Glacier White powder coat paint
  performance:
    cable-capacity: 173
    cable-capacity-basis: >-
      Cat 6 (0.250 in OD) at the maximum fill the maker's cable fill table gives (the 50% fill of the
      usable area, 17.0 sq in); its recommended fill for the same cable is 87
    cable-capacity-media: cat6
  compliance:
    environment: Indoor use only, in environmentally controlled areas
    baba: BABA Compliant
