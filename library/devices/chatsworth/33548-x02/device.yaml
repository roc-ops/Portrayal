gaps:
  - what: door-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the maker says the door "opens up or down" and can be removed; the format has no hinge, so the
      door is drawn as one fitted plate that lifts off, and the swing is not stated.
    wanted: a format that can say a hinged cover, and a close picture of the door's edge
  - what: ear-holes
    scope: [rear]
    reason: vendor-silent
    note: >-
      the installation instructions give "two to four" equipment mounting screws for the range of
      heights and "one screw for every mounting hole", and no document gives the holes' positions
      or count for this height.
    wanted: a dimensioned drawing of the back plate
  - what: brush-size
    scope: [rear]
    reason: vendor-silent
    note: >-
      no document dimensions the brush insert or says which way its bristles run; its window and
      bristle direction are read off one perspective picture. The brush is drawn on the rear view
      only, where its pass is declared; seen from the front, with the door off, the window is an
      open hole in the plate's drawing.
    wanted: a dimensioned rear view and a close picture of the brush
