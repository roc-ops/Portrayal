format: 1
kind: device
name: tm-3308h
version: 0.1.0
maturity: modelled
manufacturer: Telco Systems
model: TM-3308H
aliases:
- {name: T-Marc 3308, kind: superseded, note: 'the name on the 2019 data sheet (T-Marc 3308/H); the 2025-12 data sheet and product page call the same box TM-3308H'}
- {name: TMC-3308, kind: vendor, note: 'the model printed on the faceplate and the stem of every ordering code (TMC-3308-x, TMC-3308-2DC, TMC-3308H-2DC)'}
- {name: TM-3308, kind: variant, note: 'the commercial-temperature (0 to 50 C) build; the H suffix is the hardened -40 to 70 C DC build, TMC-3308H-2DC, and the data sheets describe one face for both'}
portfolio: {line: Carrier Ethernet, family: Network Interface Device, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-3308H, formerly T-Marc 3308/H - a half-width 1RU carrier
  Ethernet / MPLS / IP demarcation device: four 10/100/1000 copper ports in a 1 x 4 row, four
  100/1000 SFP ports in a 1 x 4 row, an ETH / CON management stack, PS1 / PS2 lamps and a
  reset pinhole; one internal AC or DC supply with an optional external redundant AC supply,
  for a 19-inch rack or a wall.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-3308H data sheet (telco.com 2025/12), "Carrier Ethernet/MPLS/IP SDN-Enabled NID"; the
      2019 edition calls it the T-Marc 3308/H, and the face prints TMC-3308.
  sources:
    confidence: datasheet
    note: >-
      Two data-sheet editions (2019-01 and 2025-12), five vendor renders of which telco.com
      2024/09/TMC3308.png (about 900 px across the face) is the best straight-ish view, and the
      legacy NetZoom stencil "Telco Systems" (2022), master T-Marc 3308 (F). No installation
      guide is public.
  chassis:
    confidence: datasheet
    note: >-
      Half-width 1RU, 221 x 44 x 235 - both editions' "1.75' (1RU) x 8.7' x 9.25' (44 mm x 221
      mm x 235 mm)", the same envelope as the TM-3312 and TM-3348. "19' rack and wall-mounting
      options" - the brackets are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THIS BOX'S OWN RENDER. telco.com 2024/09/TMC3308.png is rectified by a
      four-corner homography onto the data sheet's 221 x 44 (corners TL 4.5,174.5 TR 897,250
      BR 896.5,436 BL 5,335.5 - a perspective view of a planar face, which the homography takes
      out exactly; about 4 px/mm, so good to about half a millimetre) and every jack, cage,
      lamp, pinhole and vent slot is placed where it lands. The NetZoom master was not used for
      positions: the same stencil's TM-3312 and TM-3348 masters were measured against their
      renders and put the jacks on the wrong pitch (see the TM-3312's front-layout).
  ports:
    confidence: photo-measured
    note: >-
      Copper 1/1-1/4 are a 1 x 4 RJ45 row on a 14.1 pitch (centres 91.6-134.0) with lamp
      windows in the upper corners of every jack, drawn as common/rj45-ganged-eth@1 turned 180
      (latch up). SFP 2/1-2/4 are a 1 x 4 ganged cage on a 14.55 pitch, centres 153.2-196.85,
      from the bright cage walls in the rectified render (145.9, 160.5, 175.1, 189.6, 204.1).
      Each has one oblong lamp to the right of its printed number, 1.0-1.2 mm right of the
      cage centre (lamps measured at 154.4, 168.85, 183.35, 197.85) - so L61 stays in the
      baseline for these four ON PURPOSE: the lamp sits beside its numeral, not centred on the
      cage, and centring it would draw a face the unit does not have. Numbering as printed.
  jack-lamps:
    confidence: photo-measured
    note: >-
      The render shows two lamp windows on the CON console, and STS and FLT printed under it
      name them. CON is not Ethernet, so it is the bare std/rj45-ganged@2 with the two windows
      placed beside it as common/led-rect-sm@1, for: con, at the corners where
      common/rj45-ganged-eth@1 draws its own - the family's way of drawing a lamped
      non-Ethernet jack (juniper/mx204's BITS).
  lamps:
    confidence: estimated
    note: >-
      PS1 and PS2 are about 3.5 mm green lamps, with a reset pinhole to their left, placed where
      the rectified render has them; LNK/ACT and MNG are printed over the ETH jack and STS and
      FLT under the CON jack, naming those jacks' own lamp windows. No document says what any
      state means; PS1 / PS2 presumably report the internal supply and the optional external
      one (see the power note).
  eth-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheets list "1 x Console RJ45 port" and are silent on the
      ETH management port's rate. 1g is taken from the TM-8104's OOB port on the maintainer's
      ruling for unstated management rates; the eth-speed gap stays open.
  power:
    confidence: datasheet
    note: >-
      "Internal AC power supply with optional external AC power supply for redundancy
      (orderable separately)" (TMC-3308-x), "internal DC power supply (24/48VDC), dual feed
      power supply" (TMC-3308-2DC, TMC-3308H-2DC), and "TMC-3X0-EXTPS-x Optional, external
      redundant AC power supply". Input 100-240 VAC or 24/48 VDC. No consumption figure is
      published. The supply is internal, so the front carries no bays; the inlet and the
      external supply's connector are presumably at the rear.
attrs:
  physical:
    weight-kg: 1.1
    overall-mm: 221 x 44 x 235 (data sheet)
    mounting: 19-inch rack (half width) or wall
  power:
    input-voltage: 100-240 VAC, or 24/48 VDC
    psu-redundancy: one internal supply; an optional external redundant AC supply (TMC-3X0-EXTPS-x)
  environmental:
    operating-temp: 0 to 50 C; -40 to 70 C for the TMC-3308H
    humidity: 5 to 95 percent non-condensing
  features:
    services: MEF CE 2.0 E-LINE, E-LAN, E-TREE, E-ACCESS; 802.1Q, 802.1ad; MPLS VPWS, VPLS, H-VPLS
    l3: static routing, OSPF, BGP, VRF
    optics-sfp: '100BASE-FX, 1000BASE-X (data sheet, "4 x 100FX/1000BaseX SFP ports")'
    resiliency: G.8032, STP/RSTP/MSTP, LAG, redundant AC/DC power supply
  management:
    local: CON RS-232 ASCII console and ETH out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 221.0
  height: 44.0
  depth: 235
  ru: 1
  weight-kg: 1.1
  power: ac
  color: '#dddddd'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-3308H / T-Marc 3308 hardware installation guide, from the BATM support portal.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The internal supply's inlet (AC, or the DC build's dual feed) and the external redundant
    supply's connector are not on the front, so they are presumably at the rear, which nothing
    held shows.
  wanted: a photograph of the rear of an AC and of a DC unit.
- what: eth-speed
  scope: [eth]
  reason: vendor-silent
  note: >-
    No edition states the ETH port's rate; 1g is carried as a BORROWED value (see
    provenance.eth-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  copper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: four 10/100/1000Base-T UNI/NNI ports, 1/1 to 1/4, a 1 x 4 row.
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: four 100Base-FX/1000Base-X UNI/NNI ports, 2/1 to 2/4, a 1 x 4 ganged cage.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the ETH out-of-band Ethernet port over the CON RS-232 console, one RJ45 stack.
  con-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: STS and FLT, the CON jack's two lamp windows.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: PS1 and PS2.
  controls:
    term: Button
    role: management
    index-origin: 1
