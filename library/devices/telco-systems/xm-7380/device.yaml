configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - XM-7380-AC, "single hot-swappable AC power supply" (data sheet ordering table).
    description: One AC supply at the rear; the front is the same for every build.
  dc:
    kind: orderable
    power: dc
    description: XM-7380-DC - one DC supply at the rear.
  dual-ac:
    kind: orderable
    description: XM-7380-2AC - two hot-swappable AC supplies at the rear.
  dual-dc:
    kind: orderable
    power: dc
    description: XM-7380-2DC - two hot-swappable DC supplies at the rear.
  ac-dc:
    kind: orderable
    power: [ac, dc]
    description: XM-7380-AC/DC - one AC and one DC supply at the rear.
