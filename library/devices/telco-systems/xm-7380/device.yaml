format: 1
kind: device
name: xm-7380
version: 0.1.0
maturity: modelled
manufacturer: Telco Systems
model: XM-7380
aliases:
- {name: X-Metro 7380, kind: marketing, note: 'printed on the faceplate (X-METRO 7380, upright at the left) and on the stencil master'}
portfolio: {line: Carrier Ethernet, family: Aggregation, series: X-Series}
description: >-
  Telco Systems (BATM Networks) XM-7380, the X-Metro 7380 - a compact high-density 1RU Carrier
  Ethernet / MPLS switch: 48 SFP ports in three stacked 2 x 8 blocks with arrow lamps and four
  10G SFP+ ports at the right with LNK/ACT and SPEED lamps, a USB console, a bare SNMP RJ45, six
  status lamps and a reset pinhole; two hot-swappable AC or DC supplies, which are not on the
  front.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      XM-7380 data sheet (telco.com 2026-08), "Compact High-Density Carrier Ethernet"; the
      faceplate prints X-METRO 7380.
  sources:
    confidence: datasheet
    note: >-
      The data sheet (2026-08), the vendor render telco.com 2025/01/XM-7380new@2x.png (1678 px,
      square-on, about 3.25 px/mm on the face), and the NetZoom stencil "BATM X-Series"
      (2025-03-07), master X-Metro 7380 (CF). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      1RU, 440 x 44 x 360 - the data sheet's "44 cm x 36 cm x 4.4 cm", "1U, 19-inch
      rack-mountable", 6.77 kg. The rack ears are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S. Rectifying the four face corners (111.5,403 1540.5,401.5
      1540.5,541.5 111.5,543 - square-on to within 2 px) onto the data sheet's 440 x 44, every
      cage, jack, lamp, vent and legend is placed from dark-run, glyph-cluster and centroid
      scans of that 10 px/mm image. The stencil master is used for arrangement and legends only.
      THE UPRIGHT LEGENDS (X-METRO 7380, CONSOLE, SNMP, the laser label's text) are rotate -90,
      which the renderer draws reading upward with the caps to the LEFT of the baseline - checked
      by rasterising: CONSOLE's glyphs land at x 372.1-373.3, clear of the USB jack at 375.5. L21
      reports two of them as painted over, falsely and for two separate reasons in lint: its
      text-extent helper has the two right-angle cases swapped (a 270-degree mark's caps put to the
      right), which is the X-METRO 7380 line; and L21's placement boxes turn only a rotate-180
      part, so the rotate-90 USB console is boxed as if lying flat (12 x 4.5 across x 371.8-383.8)
      and swallows CONSOLE whichever side its caps are on. Both L21 lines are in the baseline as
      false positives, pending a fix to lint.
  ports:
    confidence: photo-measured
    note: >-
      The 48 UNI ports are three stacked 2 x 8 blocks, std/sfp-ganged@1, upper row bail up and
      lower turned 180, on the measured 14.37, 14.64 and 14.39 pitches (columns 17.5-118.1,
      138.1-240.55 and 260.7-361.45; rows 15.3 and 31.4), with the family's arrow strip between
      the rows. Each column is legended with one pair, 2/1 to 48/47; the upper cage is drawn as
      the first number (see the port-order gap). THE NUMERALS ARE PLACED WHERE PRINTED, measured
      by clustering their glyphs, up to about a millimetre either side of their columns, so L61
      stays in the baseline for them on purpose. The four NNI ports at the right are a 1 x 4 row
      printed 1-4, each with two bar lamps above it - LNK/ACT to its left and SPEED to its right,
      as the two legends read. The render's NNI cages sit on a 13.93 pitch, which the 14.25-wide
      std/sfp-ganged@1 cannot, so they are drawn at 14.25 on the row's measured centre (402.2);
      the numerals and lamps are placed where printed, so L61 stays for them too.
  port-speeds:
    confidence: estimated
    note: >-
      "20 x 10G/1G SFP+, 32 x 1G/100M SFP" - 52 ports, and the face has 48 in the blocks and four
      at the right. WHICH OF THE 48 ARE SFP+ IS NOT DOCUMENTED - there is no port table and the
      three blocks are identical in the render - so all 48 are one group at 1g, the only rate
      every UNI cage is documented to carry ("10G/1G" SFP+ and "1G/100M" SFP), and the split is
      stated only in attrs.features.uni-mix. The count of SFP+ among them (16) itself rests on the
      NNI four being 10G, which is borrowed (see nni-speed).
  nni-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The XM-7380 data sheet does not say which of its ports the four at the
      right are; 10g is taken from the sibling XM-7280's data sheet, which calls its right-hand four
      "4x10G SFP NNI" on the same face layout; the nni-speed gap stays open.
  snmp-jack:
    confidence: photo-measured
    note: >-
      THE SNMP JACK IS BARE - a metal-shielded RJ45 with no lamp windows, as on the XM-8102 - so
      it is std/rj45@2, and L76 stays in the baseline for it on purpose.
  snmp-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The ordering table lists "CONSOLE and SNMP ports for management" and
      gives no rate; 1g is taken from the TM-8104's OOB port on the maintainer's ruling for
      unstated management rates; the snmp-speed gap stays open.
  lamps:
    confidence: photo-measured
    note: >-
      Six status lamps in two columns (416.3 and 422.1 across, 7.0, 12.15 and 17.3 down),
      legended PWR1 / FAN1 / SNMP to the left and PWR2 / FAN2 / SYS to the right with bracket
      leaders, read top to bottom. No document says what any state means.
  power:
    confidence: datasheet
    note: >-
      "2 hot-swappable AC/DC power supplies provide 1+1 redundancy", "AC:220V, 100~240VAC | DC:
      -48V, -36~-72V". The front carries no supply, so the supplies (and presumably the fans)
      are at the rear, which nothing held shows; no consumption figure is published.
attrs:
  physical:
    weight-kg: 6.77
    overall-mm: 440 x 44 x 360 (data sheet)
    mounting: 19-inch rack
  power:
    input-voltage: 100-240 VAC (nominal 220), or -36 to -72 VDC (nominal -48)
    psu-redundancy: 1+1, two hot-swappable AC or DC supplies (rear)
  environmental:
    operating-temp: -5 to 55 C
  performance:
    switching-capacity: 464 Gbps
  features:
    services: E-LINE, E-LAN, E-TREE; MPLS L2VPN, L3VPN, H-VPLS; SR; IPv4/v6 routing
    uni-mix: '48 UNI cages of which 16 are SFP+ (10G/1G) and 32 SFP (1G/100M) - which ones is undocumented'
    resiliency: 1+1 supplies, LAG, MC-LAG
    timing: SyncE (data sheet "Precision SyncE"; no 1588 stated)
    optics-sfp-plus: '10GBASE, 1000BASE (data sheet, "20 x 10G/1G SFP+")'
    optics-sfp: '1000BASE, 100BASE (data sheet, "32 x 1G/100M SFP")'
  management:
    local: CONSOLE on USB, SNMP out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 44.0
  depth: 360
  ru: 1
  weight-kg: 6.77
  power: ac
  color: '#d8d7ce'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal behind a
    login, whose contact is on telco.com/support.
  wanted: the XM-7380 hardware installation guide, from the BATM support portal.
- what: uni-speeds
  scope: [uni]
  reason: vendor-silent
  note: >-
    Sixteen of the 48 UNI ports are SFP+ and 32 are SFP (a count that rests on the borrowed NNI
    speed), and nothing held says which; all 48 are exported at 1g, the rate every one carries
    (see provenance.port-speeds).
  wanted: the installation guide's port table.
- what: nni-speed
  scope: [nni]
  reason: vendor-silent
  note: >-
    The data sheet does not say the four right-hand ports are the 10G ones; 10g is BORROWED from
    the XM-7280 (see provenance.nni-speed).
  wanted: the installation guide's port table.
- what: port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    Each UNI column is legended with one pair of numbers ("2/1" ... "48/47") and nothing held
    says which cage is which; the upper cage is drawn as the first number.
  wanted: the installation guide's port-numbering figure.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The two hot-swappable supplies are not on the front, so they (and presumably the fans) are
    at the rear, which nothing held shows.
  wanted: a photograph of the rear.
- what: snmp-speed
  scope: [snmp]
  reason: vendor-silent
  note: >-
    No rate is stated for the SNMP out-of-band port; 1g is carried as a BORROWED value (see
    provenance.snmp-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  uni:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: >-
      the 48 UNI ports in three stacked 2 x 8 blocks, all at 1g - 16 of them are SFP+, which ones
      is undocumented (see the uni-speeds gap).
  uni-leds:
    term: LED
    role: indicator
    index-origin: 1
  nni:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the four 10G SFP+ NNI ports at the right, printed 1-4.
  nni-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: LNK/ACT and SPEED, a bar lamp each either side of every NNI port.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the SNMP out-of-band Ethernet port and the USB console.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: PWR1, FAN1, SNMP, PWR2, FAN2 and SYS.
  controls:
    term: Button
    role: management
    index-origin: 1
