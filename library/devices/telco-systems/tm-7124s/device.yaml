format: 1
kind: device
name: tm-7124s
version: 0.1.1
maturity: modelled
manufacturer: Telco Systems
model: TM-7124S
aliases:
- {name: T-Metro 7124S, kind: superseded, note: 'the name on the metal and on the 2016-2025 data sheets; the 2025-12 data sheet and product page (slug tm-7124) call the same box TM-7124S / TM-7124'}
- {name: TM-7124, kind: marketing, note: 'the product-page name and slug on telco.com (2025); the data sheet on that page is headed TM-7124S'}
portfolio: {line: Carrier Ethernet, family: Demarcation and Pre-Aggregation, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-7124S, formerly T-Metro 7124S - a 1.5RU carrier
  Ethernet / MPLS demarcation and pre-aggregation platform: 24 SFP ports in three stacked
  2 x 4 blocks with two arrow lamps per port, two hot-swappable supply bays (the base ships
  one AC supply and a blank), a full-width expansion slot for the LC-7124-2XFP-B (2 x XFP
  plus sync and phase clocks), a DA-15 alarm port, a four-pole DC feed connector, the CON /
  ETH management stack and a front fan tray.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-7124S data sheet (telco.com 2025/12, product page tm-7124); the 2016-08 and 2019-01
      editions call it the T-Metro 7124S, which the face prints.
  sources:
    confidence: datasheet
    note: >-
      Three data-sheet editions (2016-08, 2019-01, 2025-12); three vendor renders, of which
      telco.com 2025/09/t-metro-7124s.png (858 px) is the only near-square one; and the
      legacy NetZoom stencil "Telco Systems" (2022), masters TM-7124S (F), (CF), (R),
      TM-7124S-DC (CF) and LC-7124-2XFB-B (MFS). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      1.5RU, 440 x 66.3 x 253. Width and depth are the data sheets' ("440mm (19' racks) x
      67mm (2.625') x 253mm (10')"); the height is not - see chassis-height.
  chassis-height:
    confidence: photo-measured
    note: >-
      66.3, NOT the data sheet's 67. The height is 440 divided by the rendered face's
      MEASURED aspect, 6.64 - the render's four corners fix that ratio, and the stencil's
      body (441.4 x 66.2) agrees with it - against the data sheet's 67; the 0.7 mm between
      them is recorded rather than split.
  front-layout:
    confidence: estimated
    note: >-
      TWO SOURCES THAT DISAGREE, EACH USED FOR WHAT IT DOES WELL. Positions are read off the
      2025 render rectified by a four-corner homography onto the face (corners TL 83.5,155
      TR 784.5,154.5 BR 784.5,260.5 BL 84.5,260.5; about 1.6 px/mm, so good to about a
      millimetre), then scaled 440/441.4 to the data sheet's body. Shapes, pitches and the
      legends come from the 2022 stencil master, which is AN OLDER BUILD: its supply bays,
      DA-15 and expansion-slot left edge agree with the render within 2.5 mm, but it draws
      the SFP blocks 6.8 mm further right, the CON/ETH stack 4 mm right and a different
      expansion card. Where they disagree on position the render - the current product - is
      used (see the stencil-vs-render gap).
  ports:
    confidence: estimated
    note: >-
      24 std/sfp@1 in three 2 x 4 blocks. The blocks start where the render puts them (x
      190.0, 251.8, 313.5 before scaling); inside a block the columns are on the stencil's
      14.72 pitch - individual cages with a 0.8 mm web, not a ganged block - which the
      render's block widths (57.6-58.9 for four columns) corroborate. Rows at y 10.85 and
      26.35 (render centres); the lower row is turned 180. Numbered as printed, "△1 ▽2"
      over each column: the odd port above, the even below; "1/" before each block.
  lamps:
    confidence: estimated
    note: >-
      TWO ARROW LAMPS PER PORT. Each column carries two ▲▼ pairs in the strip between the
      rows - the stencil draws them at 1.55, 4.12, 7.88 and 10.46 mm from the column's left
      edge, and the render shows the same doubled pattern - so each port has two lamps (-a
      and -b), up-arrows for the upper port, down for the lower. What the two mean (likely
      link and activity) is not documented. Sync and Fan are round lamps and Reset a pinhole
      beside the DA-15; STS and EXT are small lamps over the CON/ETH stack.
  alarm-port:
    confidence: photo-measured
    note: >-
      "Alarm Input & Output" is a D-sub whose jackscrews stand 33.4 mm apart in the
      rectified render - the registry's DA-15 (33.32), not the HD-15 (25.0) - so it is
      std/da15@1. The stencil's shell is ambiguous between the two (24.1 wide, screws 28.4
      apart).
  controls:
    confidence: estimated
    note: >-
      The Alarm Cut Off push button is drawn with common/reset-button@1, the nearest library
      part; the real button is a small square cap about 5 x 7 mm (render and stencil). Reset
      is a pinhole.
  eth-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. No edition gives the ETH management port's rate. 1g is taken
      from the TM-8104's OOB port - same vendor, same OS family and the same console-plus-
      Ethernet management stack - following the maintainer's ruling for unstated management
      rates; NetBox's community entry types the 8104's port 1000base-t, itself unsourced.
      The eth-speed gap stays open.
  jack-orientation:
    confidence: photo-measured
    note: >-
      The ETH jack's lamp labels (LNK/ACT, MNG) are printed under it and its lamp windows sit
      on its lower corners in the render, so it is keyway-down (unrotated); CON above it is
      turned 180, belly to belly. CON carries no lamps, so the unlamped std/rj45-ganged@2 is
      used for it.
  timing:
    confidence: datasheet
    note: >-
      "SyncE, IEEE 1588v2* PTP, BITS and phase clock" (2019 edition). The chassis face has no
      timing connector; the sync and phase clock jacks are on the LC-7124-2XFP-B card.
  dc-feed:
    confidence: photo-measured
    note: >-
      The four-pole green connector at the left end, legend -48VA RETA -48VB RETB, is on
      the chassis in both the AC and DC stencil masters and in the render (an AC build), so
      it is drawn on every configuration. The DC system is ordered "with DC feed connector".
  fan-tray:
    confidence: estimated
    note: >-
      The data sheets ship a fan tray with every base system. The stencil draws it as a
      full-height module at the right end (40.85 x 64.66) with two corner thumbscrews and a
      pull window; the render shows the same. Its bay uses the stencil's position.
  power:
    confidence: datasheet
    note: >-
      NOT STATED: no edition gives a consumption figure. Input: "100-240VAC, 50/60 Hz, -48VDC,
      -60VDC and +24VDC nominal"; the AC supply's face prints "100-240V~50-60Hz 2A".
attrs:
  physical:
    weight-kg: 5.2
    overall-mm: 440 x 67 x 253 (data sheet)
  performance:
    switching-capacity: 44 Gbps full duplex, non-blocking
  power:
    input-voltage: 100-240 VAC 50/60 Hz, or -24 to -60 VDC wide range
    psu-redundancy: two hot-swappable supply bays; the base ships one AC supply and a blank
  environmental:
    operating-temp: AC system -20 to 65 C; DC system -40 to 65 C
    humidity: 5 to 95 percent, non-condensing
  platform:
    expansion-slots: 1
  features:
    services: MPLS L2/L3 VPN, VPWS, VPLS, H-VPLS, 802.1Q, 802.1ad
    resiliency: G.8031, sub-50 ms G.8032v2 R-APS and MSTP fast ring, sub-50 ms RSVP-TE FRR, H-VPLS dual homing, LAG
    timing: SyncE, IEEE 1588v2 PTP, BITS and phase clock
    optics-sfp: '100BASE-FX, 1000BASE-X (data sheet, "24 x 100BaseFX/1000BaseX SFP ports")'
    multicast: IGMP snooping v1/v2/v3, IGMP proxy, MVR
  management:
    local: CON serial console and ETH out-of-band Ethernet on RJ45; DA-15 alarm inputs and outputs
    mgmt-protocols: Console, Telnet, SSHv2, RADIUS, TACACS+, SNMP v1/2/3, xFTP, NTP, DHCP, NAT, ZTP
  compliance:
    nebs: NEBS Level 1 certified
    safety: C-UL 60950, CSA 22.2 No. 950, EN/IEC 60950, TUV/GS, CB, EN 60825-1/2 (2016 edition)
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 66.3
  depth: 253
  ru: 1.5
  weight-kg: 5.2
  color: '#d6d8da'
  silk: '#4d5156'
  power: ac
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-7124S / T-Metro 7124S hardware installation guide, from the BATM support portal.
- what: stencil-vs-render
  scope: [sfp, mgmt, slot-2, fan-tray]
  reason: sources-disagree
  note: >-
    The 2022 NetZoom master puts the SFP blocks 6.8 mm, the CON/ETH stack 4 mm and the fan
    tray's left edge 2.8 mm to the right of where the 2025 render (rectified, about 1.6 px/mm)
    puts them, and the render's expansion card is 166 wide where the stencil's is 171.5. The
    supply bays, the DA-15 and the slot's left edge agree within 2.5 mm. The render is used
    for positions and is itself only good to about a millimetre.
  wanted: a square-on photograph of the front at 4 px/mm or better.
- what: dc-supply
  scope: [psu-1, psu-2]
  reason: needs-photo
  note: >-
    The wide-range DC supply (TM-7124S-DCPS-W) is orderable but no image or stencil master
    draws its face, so it is not modelled and there is no DC configuration.
  wanted: a photograph of the DC supply's face.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The stencil master TM-7124S (R) draws the rear as a plain panel; no photograph confirms it.
  wanted: a photograph of the rear.
- what: eth-speed
  scope: [eth]
  reason: vendor-silent
  note: >-
    No edition states the ETH port's rate; 1g is carried as a BORROWED value from the
    TM-8104 (see provenance.eth-speed), not as a finding.
  wanted: the installation guide's interface table.
- what: dc-feed-a-b
  scope: [dc-feed]
  reason: vendor-silent
  note: >-
    The DC feed connector carries two feeds, A and B, but is one part and so exports one
    power port; a DCIM cannot cable the two feeds separately. Splitting it into two parts
    would draw one physical header as two.
  wanted: an exporter convention for a multi-feed connector (two power rows from one part).
- what: lamp-meanings
  scope: [sfp-leds, status-leds]
  reason: vendor-silent
  note: >-
    Two lamps per SFP port, and Sync, Fan, STS and EXT, are drawn where they are; no
    document says what any of their states mean.
  wanted: the installation guide's LED table.
groups:
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: data sheets - "Hot swappable, redundant AC/DC power supply"; the base ships one supply and a blank, the second is the redundant one.
    description: two hot-swappable supply bays, stacked at the left; the base system fills one and blanks the other.
  exp-slot:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      the one expansion slot, printed as slot 2 (the card's ports are 2/1 and 2/2; the base
      board's are 1/x), so the bay sits at rel-pos 2. Takes the LC-7124-2XFP-B.
  fans:
    term: Fan tray
    role: service
    index-origin: 1
    description: the front-serviced fan tray at the right end.
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: >-
      24 x 100BaseFX/1000BaseX SFP (data sheet), 1/1 to 1/24, in three stacked 2 x 4 blocks
      - odd ports above, even below.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: two arrow lamps per port in the strip between the rows.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the local management connectors: the CON serial console and the ETH out-of-band port
      on one RJ45 stack, and the Alarm Input & Output DA-15 - how the box is reached and how
      its alarms leave it.
  controls:
    term: Button
    role: management
    index-origin: 1
    description: Alarm Cut Off and Reset.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: Sync and Fan beside the alarm port, STS and EXT over the management stack.
  power-in:
    term: Power input
    role: service
    index-origin: 1
    description: the four-pole DC feed connector for two redundant -48 V feeds.
  grounding:
    term: Ground
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
