configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - TM-7124S-AC-x, "Base system including fan tray, one (1) AC PSU, blank plates
      (PSU & module slot), AC power cord" (data sheet ordering table).
    description: >-
      The TM-7124S as ordered: fan tray, one AC supply in PS1, a blank in PS2 and a blank in
      the expansion slot.
    bays:
      psu-1: telco-systems/tm-7124s-psu-ac@1
      psu-2: telco-systems/tm-7124s-psu-blank@1
      slot-2: telco-systems/tm-7124s-slot-blank@1
  dual-ac:
    kind: orderable
    description: >-
      The base with a second AC supply (TM-7124S-ACPS) in PS2 for redundancy.
    bays:
      psu-1: telco-systems/tm-7124s-psu-ac@1
      psu-2: telco-systems/tm-7124s-psu-ac@1
      slot-2: telco-systems/tm-7124s-slot-blank@1
  with-xfp-card:
    kind: orderable
    description: >-
      Two AC supplies and the LC-7124-2XFP-B in the expansion slot - how the 2025 render
      shows the TM-7124S.
    bays:
      psu-1: telco-systems/tm-7124s-psu-ac@1
      psu-2: telco-systems/tm-7124s-psu-ac@1
      slot-2: telco-systems/lc-7124-2xfp-b@1
