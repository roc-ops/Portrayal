format: 1
kind: device
name: tm-280
version: 0.1.1
maturity: modelled
manufacturer: Telco Systems
model: TM-280
aliases:
- {name: T-Marc 280, kind: superseded, note: 'the name printed on the faceplate and on the earlier data sheet'}
- {name: TMC-280, kind: vendor, note: 'the stem of the ordering code TMC-280-z'}
portfolio: {line: Carrier Ethernet, family: Network Interface Device, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-280, the T-Marc 280 - a compact half-width desktop Carrier
  Ethernet demarcation device: one 100FX/1000X SFP uplink (1/1), two 10/100/1000T Access ports
  (2/1-2/2) and one combo port (3/1, an SFP or an RJ45), with a CON console, STS and PWR lamps, a
  reset pinhole and a 5 VDC barrel inlet for its external power adaptor.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-280 data sheet (telco.com 2025/12, BATM Networks); the faceplate prints T-Marc 280.
  sources:
    confidence: datasheet
    note: >-
      The data sheet (2025-12) and an earlier T-Marc 280 edition (2021), four vendor renders of the same
      three-quarter view (the sharpest is telco.com 2025/12/TM-280.png, 1632 px), and the legacy
      NetZoom stencil "Telco Systems" (2022), masters TMC-280-x (CF) and (R). No installation
      guide is public.
  chassis:
    confidence: datasheet
    note: >-
      221 x 44 x 140.5 - the data sheet's "44 mm x 221 mm x 140.5 mm (1.73 in x 8.7 in x 5.51
      in)"; the stencil master's outline is 221.6 x 44.4. The face has rounded end-caps, which
      the rectangular panel does not draw. BOTH EDITIONS PRINT "0.6 kg (2.42 lbs)", which disagree
      with themselves (2.42 lb is 1.10 kg, the TM-340's figure); 0.6 kg is carried as the metric
      figure both print, and the conflict is recorded here.
  front-layout:
    confidence: estimated
    note: >-
      TWO SOURCES, EACH WHERE IT HOLDS. The only renders are three-quarter views, and the face's
      rounded end-caps give no clean corners to rectify on, so a homography was fitted instead
      on the corners of the 1/1 and 3/1 legend boxes, taken from the stencil master TMC-280-x
      (CF). Inside that span the stencil and the rectified render agree to about 0.5 mm in x (the
      1/1 lamp, both SFP cages and the 3/1 jack), so the frame is sound there; outside it the fit
      extrapolates badly - the CON bezel comes out half as big again as the Access jacks - so it
      is not used. POSITIONS IN THE PORT AREA (x 75-205) ARE THE RENDER'S: the Access pair is a
      ganged 2-jack block on a 14.05 pitch (the stencil draws two separate housings 16.5 apart),
      the RJ45s sit about 2 mm higher than the stencil has them, and the DC jack 1.7 mm left and
      3 mm higher; the port numerals, the Network bracket's drops and its word sit where the
      render prints them, measured by clustering the glyphs in the rectified image: 1/1 at 97.45,
      2/1 at 122.3 and 2/2 at 137.1 are within half a millimetre of their jacks and are drawn
      centred on them, and 3/1 at 166.95 is centred on its legend box rather than on its
      cage-and-jack pair (168.57), so it is drawn where it is printed and L61 stays in the
      baseline for it on purpose. The Network word is at 133.5. THE LEFT GROUP - the wordmark plate, T-Marc 280, CON, STS, PWR, the pinhole
      and the laser label - IS THE STENCIL'S, unchecked, and the renders show the same
      arrangement. See the left-group gap.
  ports:
    confidence: estimated
    note: >-
      1/1 is a single SFP cage with a lamp to its left (for the port, drawn beside it as in the
      stencil and the renders); 2/1-2/2 are a ganged pair, common/rj45-ganged-eth@1 turned 180
      (lamp windows up, green and amber in the render); 3/1 is a COMBO PORT - "1 x Combo port
      (10/100/1000Base-T or 100Base-FX / 1000Base-X)" - an SFP cage (port-3-1) beside an RJ45
      (copper-3-1, common/rj45-eth@1), one or the other in use at a time. The legend boxes group
      1/1 and 3/1 as Network and 2/1-2/2 as Access.
  far-right-slot:
    confidence: estimated
    note: >-
      A white oval slot or lug near the right end-cap (the render has it at about 207.5-216 x
      30-33.5, beyond the fitted span; the stencil draws a small rectangle at 207.2-213.8, 32.9-34.6)
      is drawn as panel decor between the two. Nothing held says what it is - a light pipe or a
      lock slot are both plausible.
  dc-in-rating:
    confidence: datasheet
    note: >-
      "5VDC @3A (max) with external power adaptor": the `input-voltage` and `current-max-a` of
      the dc-in jack, 3 A being the stated maximum. The data sheet states no barrel size; the
      jack is the library's one nominal `dc-barrel`.
  lamps:
    confidence: estimated
    note: >-
      STS over PWR, the reset pinhole, and the 1/1 port lamp, at the stencil's positions. No
      document says what any state means.
  power:
    confidence: datasheet
    note: >-
      "5VDC @3A (max) with external power adaptor (AC to DC, DC to DC)", and the faceplate prints
      5VDC 3A with a polarity symbol over the barrel inlet: two circles joined through a dot with
      an arc on its right, as the render shows it. The signs inside the circles are not legible in
      any render and the stencil draws them differently, so POLARITY IS NOT MODELLED - the circles
      are drawn plain. No watts are published
      (5 V at 3 A is 15 W at most).
attrs:
  physical:
    weight-kg: 0.6
    overall-mm: 221 x 44 x 140.5 (data sheet)
    mounting: desktop, 19-inch rack or wall
  power:
    input-voltage: 5 VDC, 3 A max, from an external AC-DC or DC-DC adaptor
    psu-redundancy: none - one external adaptor
  environmental:
    operating-temp: 0 to 40 C standard; -20 to 60 C extended
    storage-temp: -25 to 80 C
    humidity: 0 to 95 percent non-condensing
  performance:
    switching-capacity: 4 Gbps full duplex, non-blocking (2021 edition)
  features:
    services: all MEF services, IEEE 802.1Q bridging, IEEE 802.1ad Q-in-Q (2021 edition)
    timing: IEEE 1588v2 PTP (2021 edition)
    resiliency: G.8031, G.8032v2 R-APS, xSTP/MSTP, Fast Ring, Resilient Link, LAG (static / LACP)
    optics-sfp: '100BASE-FX, 1000BASE-X (data sheet, "1 x 100Base-FX / 1000Base-X uplink port")'
  management:
    local: CON console on RJ45
  lifecycle:
    eol: none-announced
