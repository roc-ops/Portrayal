gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-280 / T-Marc 280 installation guide, from the BATM support portal.
- what: left-group
  scope: [front]
  reason: needs-photo
  note: >-
    The left third of the face (wordmark plate, model name, CON, STS/PWR, pinhole, laser label)
    is drawn from the stencil master alone; the three-quarter renders cannot be rectified there
    with confidence, and the stencil was shown wrong elsewhere on this face by 2-2.5 mm.
  wanted: a square-on photograph of the front.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The stencil master TMC-280-x (R) draws a plain rear; no photograph is held.
  wanted: a photograph of the rear.
