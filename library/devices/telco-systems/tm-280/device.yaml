configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - TMC-280-z, "Managed Ethernet demarcation device with 2 x 10/100/1000Base-T ports,
      1 x combo copper/fiber port, 1 x SFP uplink, and external power supply" (data sheet
      ordering table).
    description: >-
      The TM-280, fed from its external 5 VDC adaptor. The 2021 edition's footnote says "'z'
      specifies power supply and cord types": NA, EUR and UK (an AC adaptor with that cord), DC (a
      DC-DC adaptor) and AC (an adaptor with no cord). The adaptor is outside the box, so every z
      build has this face; the base is drawn without asserting which adaptor feeds it.
