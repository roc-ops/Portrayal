configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      sourced - TM8106-2QS, the base SKU: the base board's 2 x QSFP28 + 16 x SFP+, fans and
      two supplies, the expansion slot empty (data sheet feature table, "2 x 40/100Ge + 16 x
      1/10Ge"); the vendor's own render T-Metro-8106-HL-3.png shows the slot empty.
    description: >-
      The TM-8106 base: two AC supplies, 2 x QSFP28 + 16 x SFP+ on the base board, the
      expansion slot empty.
    bays:
      slot-2: ''
  2qs-64:
    kind: orderable
    power: ac
    description: >-
      TM8106-2QS-64 - 2 x 40/100GE + 64 x 1/10GE: the TM810x-48SFP+ module in slot 2, two AC
      supplies.
    bays:
      slot-2: telco-systems/tm810x-48sfp@1
  6qs:
    kind: orderable
    power: ac
    description: >-
      TM8106-6QS - 6 x 40/100GE + 16 x 1/10GE: the TM810x-4QSFP28 module in slot 2, two AC
      supplies. How the vendor pictures the TM-8106 in most of its renders.
    bays:
      slot-2: telco-systems/tm810x-4qsfp28@1
  dc-power:
    kind: orderable
    power: dc
    description: >-
      TM8106-6QS with two DC supplies (24 / -48 V), the XX = DC suffix - as the 2022 front
      (telco.com 2022/05/8106.jpg) shows it.
    bays:
      psu-1: telco-systems/tm810x-psu-dc@1
      psu-2: telco-systems/tm810x-psu-dc@1
      slot-2: telco-systems/tm810x-4qsfp28@1
