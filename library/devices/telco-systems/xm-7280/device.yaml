format: 1
kind: device
name: xm-7280
version: 0.1.0
maturity: modelled
manufacturer: BATM/Telco Systems
model: XM-7280
aliases:
- {name: X-Metro 7280, kind: marketing, note: 'printed on the faceplate (X-METRO 7280) and on the stencil master'}
portfolio: {line: Carrier Ethernet, family: Aggregation, series: X-Series}
description: >-
  Telco Systems (BATM Networks) XM-7280, the X-Metro 7280 - a 1RU Carrier Ethernet / MPLS
  mobile-backhaul switch: 24 x 10G/1G/100M SFP+ UNI ports in two stacked 2 x 6 blocks with arrow lamps,
  four 10G SFP+ NNI ports with LNK/ACT and SPEED lamps, a CONSOLE / SNMP RJ45 stack, a USB
  console, a reset pinhole and six status lamps; two hot-swappable AC or DC supplies, which are
  not on the front.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      XM-7280 data sheet (telco.com 2026-08, "X-Metro 7280"); the faceplate prints X-METRO 7280.
  sources:
    confidence: datasheet
    note: >-
      The data sheet (2026-08), the vendor render telco.com 2025/01/XM-7280-new@2x.png (1678 px,
      square-on, about 3.4 px/mm on the face), and the NetZoom stencil "BATM X-Series"
      (2025-03-07), master X-Metro 7280 (CF). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      1RU, 440 x 44 x 360 - the data sheet's "44 cm x 36 cm x 4.4 cm", "1U, 19-inch
      rack-mountable", 4.42 kg. The rack ears are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S. Its face is square-on (147 px tall against the 148 its width
      implies); the four corners (93.5,402 1578,402 1578,549 93.5,549) are rectified onto 440 x 44
      and every cage, jack, lamp, vent and legend is placed from wall, dark-run, glyph-cluster and
      centroid scans of that 10 px/mm image. The stencil master is used for arrangement only.
  ports:
    confidence: photo-measured
    note: >-
      The 24 UNI ports are two stacked 2 x 6 blocks, std/sfp-ganged@1, upper row bail up and
      lower turned 180; the cage walls read 13.2-100.2 and 110.8-197.4 (pitches 14.5 and 14.43),
      rows 15.1 and 30.9, with the family's arrow strip between the rows. Each column is legended
      with one pair, 2/1 to 24/23; the upper cage is drawn as the first number (see the port-order
      gap). The numerals are placed where printed, measured by glyph clusters: they drift right
      of their columns about 0.85 to 0.35 mm across block 1 and 0.35 to 0 across block 2 - the
      XM-8102's decal drift, smaller (L61 reports 2/1 at 0.95 because the first cell is 14.9
      wide) - so L61 stays in the baseline for them on purpose. The four NNI ports are four separate cages on an
      18.5 pitch (211.75, 230.2, 248.7, 267.2), std/sfp@1, printed 1-4 about 0.3 mm left of each
      (the "1" measured at 211.2-211.7).
  snmp-jack:
    confidence: photo-measured
    note: >-
      CONSOLE over SNMP in one shielded 2-high RJ45 stack with no lamp windows, so both are the
      bare std/rj45-ganged@2; L76 stays in the baseline for the Ethernet SNMP jack on purpose, as on
      the XM-8102 and XM-7380.
  snmp-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheet lists "CLI, SNMP, Netconf, USB" and gives no rate for
      the SNMP port; 1g is taken from the TM-8104's OOB port on the maintainer's ruling for
      unstated management rates; the snmp-speed gap stays open.
  lamps:
    confidence: photo-measured
    note: >-
      LNK/ACT and SPEED are two columns of four lamps (282.65 and 289.9 across; 18.4, 23.5, 28.6
      and 33.7 down) - one row per NNI port, presumably top to bottom. Six status lamps in two
      columns (416.55 and 423.7; 23.6, 28.65 and 33.75), legended PWR1 / FAN1 / SNMP and PWR2 /
      FAN2 / SYS above them. The left legends are printed staggered - PWR1 at 414.8, FAN1 415.1,
      SNMP on its lamp (416.4 read, within a pixel) - and the right ones about 1.3 mm outboard;
      all placed as measured, with L61 baselined for the five that are off their lamps. The USB
      console's CONSOLE legend is printed 0.4 mm left of the jack (glyphs centre at 406.95 against
      the jack's 407.33) and is placed as printed, one more L61. No document says what any state means.
  power:
    confidence: datasheet
    note: >-
      "2 hot swappable AC/DC power supplies provide 1+1 redundancy", "AC:220V, 100-240 VAC | DC:
      -48V, -36~-72V". The supplies are not on the front, so they (and presumably the fans) are at
      the rear, which nothing held shows; no consumption figure is published.
attrs:
  physical:
    weight-kg: 4.42
    overall-mm: 440 x 44 x 360 (data sheet)
    mounting: 19-inch rack
  power:
    input-voltage: 100-240 VAC (nominal 220), or -36 to -72 VDC (nominal -48)
    psu-redundancy: 1+1, two hot-swappable AC or DC supplies (rear)
  environmental:
    operating-temp: -5 to 55 C
  performance:
    switching-capacity: 560 Gbps
  features:
    timing: SyncE, IEEE 1588v2 (OC, BC, TC), ITU-T G.8275.1 compliant
    resiliency: 1+1 supplies, LAG, MC-LAG
    optics-sfp-plus: '10GBASE, 1000BASE, 100BASE (data sheet, "4 x 10G/1G SFP+/SFP | 24 x 10G/1G/100M SFP+/SFP")'
  management:
    local: CONSOLE on RJ45 and on USB, SNMP out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 44.0
  depth: 360
  ru: 1
  weight-kg: 4.42
  power: ac
  color: '#dcdbd4'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal behind a
    login, whose contact is on telco.com/support.
  wanted: the XM-7280 hardware installation guide, from the BATM support portal.
- what: port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    Each UNI column is legended with one pair of numbers ("2/1" ... "24/23") and nothing held says
    which cage is which; the upper cage is drawn as the first number.
  wanted: the installation guide's port-numbering figure.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The two hot-swappable supplies are not on the front, so they (and presumably the fans) are at
    the rear, which nothing held shows.
  wanted: a photograph of the rear.
- what: snmp-speed
  scope: [snmp]
  reason: vendor-silent
  note: >-
    No rate is stated for the SNMP out-of-band port; 1g is carried as a BORROWED value (see
    provenance.snmp-speed), not as a finding.
  wanted: the installation guide's interface table.
