format: 1
kind: device
name: xm-3352
version: 0.1.0
maturity: modelled
manufacturer: Telco Systems
model: XM-3352
aliases:
- {name: X-Marc 3352, kind: marketing, note: 'printed on the faceplate (X-MARC 3352) and on the stencil master'}
portfolio: {line: Carrier Ethernet, family: Network Interface Device, series: X-Series}
description: >-
  Telco Systems (BATM Networks) XM-3352, the X-Marc 3352 - a compact half-width 1RU 10G Carrier
  Ethernet NID: four 10G SFP+ uplinks (1/1-1/4) and twelve 1G SFP downlinks (2/1-2/12), each with
  a bar lamp, a lamped MNG RJ45, a USB console, a reset button and SYS / PWR2 / PWR1 lamps, with
  two swappable AC or DC supply modules stacked at the left.
profile: networking
stack-exceptions:
- pairs: [[port-2-3, port-1-1], [port-2-4, port-1-2], [port-2-5, port-1-3], [port-2-6, port-1-4],
    [port-2-7, port-2-1], [port-2-8, port-2-2]]
  reason: >-
    Photo-measured, in provenance.ports. These are two single rows, not a stacked pair - 20.7 mm
    apart with a row of vent slots and the legend row between them - and the render reads the
    latch tab at the BOTTOM of every cage in both rows, so both rows are rotate 180 (bail down).
provenance:
  model:
    confidence: datasheet
    note: >-
      XM-3352 data sheet (telco.com 2026-08); the faceplate prints X-MARC 3352.
  sources:
    confidence: datasheet
    note: >-
      The data sheet (2026-08), the vendor render telco.com 2024/10/XM-3352@2x-1.png (1678 px, seen
      from slightly above, about 5 px/mm on the face), and the NetZoom stencil "BATM X-Series"
      (2025-03-07), master X-Marc 3352 (F). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      Half-width 1RU, 220 x 44 x 266 - the data sheet's "22 cm x 26.6 cm x 4.4 cm" and "half-19"
      wide" (ordering table). No weight is published. The spec table's "1U, 19-inch
      rack-mountable" is read with the ordering table's half-width: a bracket or tray, not part of
      the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S. Its face is foreshortened vertically (201 px tall where its 1094
      px width implies 219); rectifying the four face corners (316,369 1410,370 1410,571 318,572)
      onto the data sheet's 220 x 44 takes that out, and every cage, lamp, jack, vent and legend
      is placed from wall, dark-run, colour-mask, glyph-cluster and centroid scans of that 10
      px/mm image. The stencil master is used for arrangement only.
  ports:
    confidence: photo-measured
    note: >-
      Upper row: 2/3-2/6, 2/7-2/8 and 2/9-2/12 in three ganged blocks (cage walls 56.2-114.0,
      118.1-147.1, 151.0-209.2, a 14.45 pitch); lower row: 1/1-1/4 and 2/1-2/2 (walls 56.4-114.1
      and 120.1-149.1). std/sfp-ganged@1, every cage turned 180: the render reads the latch tab
      at the bottom of each cage in both rows (see stack-exceptions). Each port has one bar lamp under it, centred
      on the cage (the render reads 0.1-0.4 mm right, about 1-2 px). Every legend sits LEFT of its
      lamp except 2/1 and 2/2, which the face prints to the RIGHT of theirs, with "LNK/ACT" left of
      the 2/1 lamp - drawn as printed. The ordering table's "4x10G SFP+ for uplink, 12x1G SFP for
      downlink" makes 1/1-1/4 the SFP+ uplinks.
  mng-jack:
    confidence: photo-measured
    note: >-
      MNG is a lamped Ethernet RJ45 whose windows are at its TOP corners (green at 165.5, amber at
      176.8, y 27.3) while its latch key is at the bottom - a combination common/rj45-eth@1 cannot
      draw by rotation, so it is the bare std/rj45@2, key down, with the two windows placed as
      common/led-rect-sm@1, for: mng; printed LNK/ACT and 100M above them name them - 100M printed
      0.7 mm right of its window (glyphs centre at 177.5), placed as printed with L61 baselined.
  mng-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheet lists "CLI, SNMP, REST API" and the ordering table
      "CONSOLE and SNMP ports for management", with no rate; the face prints "100M" over MNG's
      right lamp, which names a lamp state rather than the port's rate. 1g is taken from the
      TM-8104's OOB port on the maintainer's ruling; the mng-speed gap stays open.
  lamps:
    confidence: photo-measured
    note: >-
      SYS, PWR2 and PWR1, top to bottom (206.2 across; 24.8, 30.3, 35.7 down), legends to the
      right. No document says what any state means.
  power:
    confidence: datasheet
    note: >-
      "Dual redundant power supplies", "100-240V AC, 48-60V DC"; ordered with one AC
      (XM-3352-AC-NA) or DC (XM-3352-DC) supply, two of either (-2AC-NA, -2DC), or one of each
      (XM-3352-AC/DC, as the render shows it: AC above, DC below). No consumption figure is
      published.
attrs:
  physical:
    overall-mm: 220 x 44 x 266 (data sheet)
    mounting: half 19-inch width
  power:
    input-voltage: 100-240 VAC, or 48-60 VDC (module face "-48V")
    psu-redundancy: dual redundant, swappable AC or DC supply modules
  environmental:
    operating-temp: -20 to 65 C (extended temperature)
  performance:
    switching-capacity: 52 Gbps
  features:
    services: MEF CE 2.0; MPLS L2VPN, L3VPN
    timing: SyncE, IEEE 1588v2 (TC)
    resiliency: dual supplies, LACP (802.1ax)
    optics-sfp-plus: '10GBASE (data sheet, "4 x 10G SFP+")'
    optics-sfp: '1000BASE (data sheet, "12 x 1G SFP")'
  management:
    local: CONSOLE on USB, MNG out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 220.0
  height: 44.0
  depth: 266
  ru: 1
  power: ac
  color: '#d5d7d9'
  silk: '#2f3337'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal behind a
    login, whose contact is on telco.com/support.
  wanted: the XM-3352 hardware installation guide, from the BATM support portal.
- what: weight
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: The data sheet gives no weight.
  wanted: the installation guide's physical specifications.
- what: single-supply-blank
  scope: [front]
  reason: needs-photo
  note: >-
    The single-supply builds leave one bay without a supply; whether it ships with a blank cover,
    and what one looks like, nothing held shows, so those configurations draw the bay empty.
  wanted: a photograph of a single-supply unit's front.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: Nothing held shows the rear.
  wanted: a photograph of the rear.
- what: mng-speed
  scope: [mng]
  reason: vendor-silent
  note: >-
    No rate is stated for the MNG out-of-band port; 1g is carried as a BORROWED value (see
    provenance.mng-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  uplink:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the four 10G SFP+ uplinks, 1/1 to 1/4.
  downlink:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the twelve 1G SFP downlinks, 2/1 to 2/12.
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the MNG out-of-band Ethernet port and the USB console.
  mng-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: LNK/ACT and 100M, MNG's two lamp windows.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: SYS, PWR2 and PWR1.
  controls:
    term: Button
    role: management
    index-origin: 1
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: data sheet - "Dual redundant power supplies"; the ordering table offers one or two, AC or DC.
    description: two swappable supply bays stacked at the left, AC or DC in either.
