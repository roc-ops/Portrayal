configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - XM-3352-AC-NA, "single swappable AC power supply" (data sheet ordering table).
    description: One AC supply in the upper bay; the lower bay is drawn empty (see the single-supply-blank gap).
    bays:
      psu-1: telco-systems/xm3352-psu-ac@1
      psu-2: ''
  dc:
    kind: orderable
    power: dc
    description: XM-3352-DC - one DC supply; the other bay is drawn empty.
    bays:
      psu-1: telco-systems/xm3352-psu-dc@1
      psu-2: ''
  dual-ac:
    kind: orderable
    description: XM-3352-2AC-NA - two hot-swappable AC supplies.
    bays:
      psu-1: telco-systems/xm3352-psu-ac@1
      psu-2: telco-systems/xm3352-psu-ac@1
  dual-dc:
    kind: orderable
    power: dc
    description: XM-3352-2DC - two hot-swappable DC supplies.
    bays:
      psu-1: telco-systems/xm3352-psu-dc@1
      psu-2: telco-systems/xm3352-psu-dc@1
  ac-dc:
    kind: orderable
    power: [ac, dc]
    description: XM-3352-AC/DC - one AC and one DC supply, as the render shows the XM-3352.
    bays:
      psu-1: telco-systems/xm3352-psu-ac@1
      psu-2: telco-systems/xm3352-psu-dc@1
