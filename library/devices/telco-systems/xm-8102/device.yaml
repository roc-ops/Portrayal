format: 1
kind: device
name: xm-8102
version: 0.1.0
maturity: modelled
manufacturer: BATM/Telco Systems
model: XM-8102
aliases:
- {name: X-Metro 8102, kind: marketing, note: 'printed on the faceplate (X-METRO 8102) and on the stencil master'}
portfolio: {line: Carrier Ethernet, family: Aggregation, series: X-Series}
description: >-
  Telco Systems (BATM Networks) XM-8102, the X-Metro 8102 - a 1RU Carrier Ethernet / MPLS
  mobile-backhaul aggregation switch: 24 x 10G/1G SFP+ in two stacked 2 x 6 blocks with arrow
  lamps, two 100G/40G QSFP28 ports, LNK/ACT and SPEED lamp pairs, a reset pinhole, an SNMP
  out-of-band RJ45, a USB console and six status lamps; two hot-swappable AC or DC supplies,
  which are not on the front.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      XM-8102 data sheet (telco.com 2026-08); the faceplate prints X-METRO 8102.
  sources:
    confidence: datasheet
    note: >-
      The data sheet (2026-08), the vendor render telco.com 2024/10/XM-8102@2x-1.png (1716 px,
      square-on, seen from slightly above, about 3.4 px/mm on the face), and the NetZoom stencil
      "BATM X-Series" (2025-03-07), master X-Metro 8102 (CF). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      1RU, 440 x 44 x 360 - the data sheet's "44 cm x 36 cm x 4.4 cm", "1U, 19-inch
      rack-mountable", 4.47 kg. The rack ears are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S. It is square-on across and seen from above, so the face is 136
      px tall where its 1504 px width says 150; rectifying the four face corners (105.5,394
      1609.5,394 1609.5,530 105.5,530) onto the data sheet's 440 x 44 takes the foreshortening
      out, and every cage, jack, lamp, vent and legend is placed from dark-run and centroid scans
      of that 10 px/mm image. The stencil master is used for the arrangement and legends only.
  ports:
    confidence: photo-measured
    note: >-
      The 24 SFP+ ports are two stacked 2 x 6 blocks, std/sfp-ganged@1, upper row bail up and
      lower row turned 180, on the measured 14.45 and 14.61 pitches (columns 19.55-91.8 and
      117.3-190.35, rows 14.15 and 32.15); the strip between the rows carries two arrow lamps per
      port, down-up-down-up, at the XM-8424H's and TM-3312's offsets from the column centre
      (-4.75, -1.9, +1.8, +4.65; measured here -4.55, -1.55, +1.95, +4.75 - within 0.35 mm, about
      1.2 px of the source render). Each column is legended with one pair, 2/1 to
      24/23; the upper cage is drawn as the first number (see the port-order gap). THE NUMERALS ARE
      PLACED WHERE PRINTED, measured by clustering their glyphs: they run on a 14.29 and a 14.44
      pitch against the cages' 14.45 and 14.61, so they sit 1.85 mm right of the first column
      and drift to 0.1 mm right of the last, and L61 stays in the baseline for them on purpose. A column of
      five vent dots stands at the left of each block. QSFP 1 and 2 are a 1 x 2 row
      (std/qsfp-ganged@1 at 231.25 and 261.35) under a bracketed "40GE/100GE" legend.
  snmp-jack:
    confidence: photo-measured
    note: >-
      THE SNMP JACK IS BARE. At 12x the rectified render shows a metal-shielded RJ45 with no lamp
      windows - the two blocks in its lower corners are shield tabs, not lenses - so it is
      std/rj45@2, and L76 (an Ethernet jack on a part with no lamps) stays in the baseline for it
      on purpose, as for the S9110-32X's out-of-band jack.
  snmp-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheet lists "CLI, SNMP, REST API" and gives no rate for the
      SNMP (out-of-band) port; 1g is taken from the TM-8104's OOB port on the maintainer's ruling
      for unstated management rates; the snmp-speed gap stays open.
  lamps:
    confidence: photo-measured
    note: >-
      LNK/ACT and SPEED are two lamps each (318.4 and 328.8 across, 29.3 and 34.95 down) under
      bracketed legends; which ports they report is not documented - presumably the two QSFPs,
      upper and lower. Six status lamps in two columns (416.8 and 423.9) under stacked legends
      PWR1 / FAN1 / SNMP and PWR2 / FAN2 / SYS, read top to bottom. No document says what any
      state means.
  power:
    confidence: datasheet
    note: >-
      "2 hot-swappable AC/DC power supplies provide 1+1 redundancy", "AC:220V, 100~240VAC | DC:
      -48V, -36~-72V". The front carries no supply, so the supplies (and presumably the fans)
      are at the rear, which nothing held shows; no consumption figure is published.
attrs:
  physical:
    weight-kg: 4.47
    overall-mm: 440 x 44 x 360 (data sheet)
    mounting: 19-inch rack
  power:
    input-voltage: 100-240 VAC (nominal 220), or -36 to -72 VDC (nominal -48)
    psu-redundancy: 1+1, two hot-swappable AC or DC supplies (rear)
  environmental:
    operating-temp: -5 to 55 C
  performance:
    switching-capacity: 640 Gbps
  features:
    services: MEF E-LINE, E-LAN; MPLS L2VPN (VPWS, VPLS, H-VPLS), L3VPN, TE; SRv6
    resiliency: 1+1 supplies; LACP (802.1ax), G.8031/G.8032 ERPS, VRRP, MPLS PW redundancy
    timing: SyncE only (data sheet "Synchronization - SyncE only"; no 1588 stated)
    optics-qsfp28: '100GBASE, 40GBASE (data sheet, "2 x 100G/40G QSFP28/QSFP+")'
    optics-sfp-plus: '10GBASE, 1000BASE, 100BASE (data sheet, "24 x 10G/1G/100M SFP+")'
  management:
    local: CONSOLE on USB, SNMP out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 44.0
  depth: 360
  ru: 1
  weight-kg: 4.47
  power: ac
  color: '#d8d7ce'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal behind a
    login, whose contact is on telco.com/support.
  wanted: the XM-8102 hardware installation guide, from the BATM support portal.
- what: port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    Each SFP+ column is legended with one pair of numbers ("2/1" ... "24/23") and nothing held
    says which cage is which; the upper cage is drawn as the first number.
  wanted: the installation guide's port-numbering figure.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The two hot-swappable supplies are not on the front, so they (and presumably the fans) are
    at the rear, which nothing held shows; the configurations record the supply mix as power
    only.
  wanted: a photograph of the rear.
- what: snmp-speed
  scope: [snmp]
  reason: vendor-silent
  note: >-
    No rate is stated for the SNMP out-of-band port; 1g is carried as a BORROWED value (see
    provenance.snmp-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  qsfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: two 100G/40G QSFP28/QSFP+ ports, 1 and 2.
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: 24 x 10G/1G/100M SFP+ ports in two stacked 2 x 6 blocks.
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 1
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: LNK/ACT and SPEED, two lamps each.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the SNMP out-of-band Ethernet port and the USB console.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: PWR1, FAN1, SNMP, PWR2, FAN2 and SYS.
  controls:
    term: Button
    role: management
    index-origin: 1
