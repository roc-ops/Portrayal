format: 1
kind: device
name: tm-3312
version: 0.1.0
maturity: modelled
manufacturer: Telco Systems
model: TM-3312
aliases:
- {name: T-Marc 3312SC, kind: superseded, note: 'the name on the metal (TMC-3312SC) and on the 2019-2021 data sheets; the 2025-12 data sheet and product page call the same box TM-3312'}
- {name: TMC-3312SC, kind: vendor, note: 'the model printed on the faceplate and the stem of every ordering code (TMC-3312SC-2AC-x, TMC-3312SC-2DC)'}
- {name: T-Marc 3312SCH, kind: variant, note: 'the hardened-temperature version (-40 to 65 C) with the optional BITS in/out interfaces; same face as drawn here is not confirmed - see the sch-variant gap'}
portfolio: {line: Carrier Ethernet, family: Network Interface Device, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-3312, formerly T-Marc 3312SC - a half-width 1RU carrier
  Ethernet / MPLS / IP demarcation device with TDM circuit emulation: four 10/100/1000
  copper ports, eight 100/1000 SFP ports and eight T1/E1 CES ports on RJ-48, an ETH / CON
  management stack, SYNC / SD / PS1 / PS2 lamps, two internal AC or DC supplies, for a
  19-inch rack or a wall.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-3312 data sheet (telco.com 2026/08), "Ethernet/MPLS/IP and TDM CES Multi-Service
      NID"; the 2019 and 2021 editions call it the T-Marc 3312SC/SCH, and the face prints
      TMC-3312SC.
  sources:
    confidence: datasheet
    note: >-
      Three data-sheet editions (2019-01, 2021-05, 2026-08), three vendor renders of which
      telco.com 2025/09/TMC3312SC.png (858 px) is the best, and the legacy NetZoom stencil
      "Telco Systems" (2022), master TMC-3312SC (F). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      Half-width 1RU, 221 x 44 x 235 - the data sheets' "1.75' (1RU) x 8.7' x 9.25' (44mm x
      221mm x 235mm)". The stencil master's own outline, which has no ears (a half-width box),
      is 221.25 x 43.79 and agrees to a quarter of a millimetre; the chassis carries the data
      sheet's figures. "19' rack and wall-mounting
      options" (2019 edition) - the brackets are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THIS BOX'S OWN RENDER, SHAPES THE STENCIL'S. The 2025 render (telco.com
      2025/09/TMC3312SC.png) is rectified by a four-corner homography onto the data sheet's
      221 x 44 (corners TL 170.5,186.5 TR 671,186.5 BR 670,280 BL 171,280; about 2.3 px/mm,
      so good to about a millimetre) and every jack, cage, lamp, slot and vent is placed
      where it lands. The NetZoom master TMC-3312SC (F) was the first source used and is
      retired for positions: it puts the copper jacks on a 16.7 pitch where this render
      measures 14.3, and the TM-3348's render (the same left half at 5.4 px/mm) measures
      14.1; its blocks sit 0.5-4 mm from where both renders put them, not at a constant
      offset. The two renders agree with each other on the shared left half to about 0.2
      mm once each image's corner offset is removed. The stencil keeps its legends and the
      cage and jack shapes.
  ports:
    confidence: photo-measured
    note: >-
      Copper 1/1-1/4 (columns 65.15 and 79.4) and CES 3/1-3/8 (columns 159.85, 175.45, 191.1
      and 206.6) are 2 x 2 RJ45 blocks with lamp windows in their outer corners - the render
      shows them on every jack - drawn as common/rj45-ganged-eth@1, upper row turned 180.
      SFP 2/1-2/8 are a 2 x 4 stacked block on a 14.3 pitch (columns 98.4-141.3) with TWO
      arrow lamps per port in the strip between the rows: the render prints ▼▲▼▲ across
      each column, at -4.75, -1.9, +1.8 and +4.65 mm from the column centre (the TM-3348's
      render gives the same offsets); what the pair means is undocumented. Numbering as
      printed: odd above, even below in every block.
  jack-lamps:
    confidence: photo-measured
    note: >-
      L76 STANDS IN THE BASELINE ON PURPOSE. It counts nine jacks as console or timing media
      on a lamped part - the CON console and the eight RJ-48 CES ports - and the 2025 render
      shows lamp windows on every one of them (the CES jacks' red and green corners, and the
      STS / FLT legends printed under CON naming its two). The CES ports are T1/E1 traffic,
      not timing, but RJ-48 is what the rule reads. The lamped part is the one the face
      shows; the waiver cap is kept for rules with no device-level answer.
  lamps:
    confidence: estimated
    note: >-
      SYNC, SD, PS1 and PS2 are about 4 mm lamps with a pinhole between SD and PS1, placed
      where the rectified render has them, as are the wordmark plate, the four short slots
      under the model name and the vent dashes along the top edge (none of which the
      stencil draws); LNK/ACT and MNG are printed over the ETH jack and STS and FLT under the CON jack,
      naming those jacks' own lamp windows. No document says what any state means.
  eth-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheets list "1 x Console RJ45 port" and are silent on the
      ETH management port's rate. 1g is taken from the TM-8104's OOB port on the maintainer's
      ruling for unstated management rates; the eth-speed gap stays open.
  power:
    confidence: datasheet
    note: >-
      "2 x internal AC power supplies" (TMC-3312SC-2AC-x) or "2 x internal DC wide-range (-24
      VDC to -72 VDC)" (TMC-3312SC-2DC, TMC-3312SH-2DC); "redundant AC/DC power supply". No
      consumption figure is published. The supplies are internal, so the front carries no
      bays; their inlets are presumably at the rear.
attrs:
  physical:
    weight-kg: 1.1
    overall-mm: 221 x 44 x 235 (data sheet)
    mounting: 19-inch rack (half width) or wall
  power:
    input-voltage: 100-240 VAC 50/60 Hz, or -24 to -72 VDC
    psu-redundancy: two internal supplies, AC or DC
  environmental:
    operating-temp: 0 to 50 C; -40 to 65 C for the TMC-3312SCH
    storage-temp: -25 to 70 C
  features:
    services: MEF CE 2.0 E-LINE, E-LAN, E-TREE, E-ACCESS; 802.1Q, 802.1ad; MPLS VPWS, VPLS, H-VPLS
    ces: 8 x T1/E1 circuit emulation for 2G/3G and TDM migration
    optics-sfp: '100BASE-FX, 1000BASE-X (data sheet, "8 x 100FX/1000BaseX SFP ports")'
    timing: SyncE, adaptive clocking; BITS in/out on the SCH version
    resiliency: sub-50 ms G.8032 R-APS, STP/RSTP/MSTP, FRR, H-VPLS dual homing, LAG, BFD, redundant power
  management:
    local: CON RS-232 ASCII console and ETH out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 221.0
  height: 44.0
  depth: 235
  ru: 1
  weight-kg: 1.1
  power: ac
  color: '#dddddd'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-3312 / T-Marc 3312SC hardware installation guide, from the BATM support portal.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The two internal supplies' inlets are not on the front, so they are presumably at the rear,
    which nothing held shows (no stencil rear master for this model).
  wanted: a photograph of the rear of an AC and of a DC unit.
- what: sch-variant
  scope: [front]
  reason: needs-photo
  note: >-
    The hardened TMC-3312SCH adds "optional BITS in/out interfaces"; where they appear on the
    face is not shown by anything held, so only the SC face is drawn.
  wanted: a photograph or render of the TMC-3312SCH front.
- what: dark-bar
  scope: [front]
  reason: needs-photo
  note: >-
    A dark 26 x 3.5 mm bar under the lamp row in the 2025 render, absent from the stencil and
    named by no document - drawn as panel.
  wanted: a close photograph of the lamp area.
- what: eth-speed
  scope: [eth]
  reason: vendor-silent
  note: >-
    No edition states the ETH port's rate; 1g is carried as a BORROWED value (see
    provenance.eth-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  copper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: four 10/100/1000Base-T UNI/NNI ports, 1/1 to 1/4, a 2 x 2 block.
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: eight 100Base-FX/1000Base-X UNI/NNI ports, 2/1 to 2/8, a stacked 2 x 4 block.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
  ces:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj48}
    description: eight T1/E1 circuit-emulation ports on RJ-48, 3/1 to 3/8, two 2 x 2 blocks.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the ETH out-of-band Ethernet port over the CON RS-232 console, one RJ45 stack.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: SYNC, SD, PS1 and PS2.
  controls:
    term: Button
    role: management
    index-origin: 1
