configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - TMC-3312SC-2AC-x, "2xinternal AC power supplies" (data sheet ordering table).
    description: The TM-3312 with its two internal AC supplies.
  dc-power:
    kind: orderable
    power: dc
    description: >-
      TMC-3312SC-2DC - two internal wide-range DC supplies (-24 to -72 VDC). The face is the
      same; the difference is at the rear.
