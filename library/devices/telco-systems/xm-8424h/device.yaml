format: 1
kind: device
name: xm-8424h
version: 0.1.0
maturity: modelled
manufacturer: Telco Systems
model: XM-8424H
aliases:
- {name: X-Metro 8424, kind: marketing, note: 'printed on the faceplate (X-METRO 8424) and on the stencil master'}
portfolio: {line: Carrier Ethernet, family: Aggregation, series: X-Series}
description: >-
  Telco Systems (BATM Networks) XM-8424H, the X-Metro 8424 - a temperature-hardened 1RU Carrier
  Ethernet / MPLS aggregation switch: four 100G/40G QSFP28 ports, 24 x 25G/10G/1G SFP28 in two
  stacked 2 x 6 blocks with arrow lamps, a PPS+ToD / 2M / CONSOLE / SNMP RJ45 cluster, a GNSS
  antenna SMA, a USB console and reset, and two hot-swappable AC or DC supply modules at the
  left.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      XM-8424H data sheet (telco.com 2026/08), "Temp-Hardened High-Capacity 4x100G Carrier Ethernet
      Solution"; the faceplate prints X-METRO 8424.
  sources:
    confidence: datasheet
    note: >-
      The data sheet (2026-08), a square-on vendor render seen from slightly above
      (telco.com 2024/10/XM-8424-new-1.png, 1243 px wide, about 2.6 px/mm on the face; a 1678 px @2x original exists and is not held), and the NetZoom stencil
      "BATM X-Series" (2025-03-07), master X-Metro 8424H (F). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      1RU, 440 x 44 x 248 - the data sheet's "44 cm x 24.8 cm x 4.4 cm", "1U, 19-inch
      rack-mountable", 5.1 kg. The stencil master draws the face with its rack ears (482.9 wide);
      the ears are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S. It is square-on across and seen from above (the lid shows), so
      the face is 110.5 px tall where its 1163 px width says 116; rectifying the four face
      corners (47,311 1210,311 1210,421.5 47,421.5) onto the data sheet's 440 x 44 takes the
      foreshortening out, and every cage, jack, lamp, vent and legend is placed from dark-run,
      colour-mask and centroid scans of that 10 px/mm image. The stencil master agrees on the
      arrangement and legends and is used for those only.
  ports:
    confidence: photo-measured
    note: >-
      QSFP 1-4 are a 1 x 4 row, std/qsfp-ganged@1 at the measured centres (118.9, 138.25, 156.9,
      175.45 - an 18.85 pitch against the part's 18.5 width), each with a bar lamp under it; the
      row is legended 100G/40G. THE LAMPS AND THE LEGEND ARE PLACED AS PRINTED: each lamp sits
      about 1.1 mm left of its cage centre (measured 155.7 and 174.6 under cages 3 and 4, about
      136.8 and 117.9 under the fainter 2 and 1) and the legend's glyphs centre at 146.4 against
      the row's 147.2, so L61 stays in the baseline for all five on purpose. The 24 SFP28 ports are two stacked 2 x 6 blocks, std/sfp-ganged@1,
      upper row bail up and lower row turned 180, on the measured 14.33 and 14.39 pitches (columns
      198.2-269.85 and 288.7-360.65); the strip between the rows carries two arrow lamps per port,
      down-up-down-up across each column, as on the TM-7124S and TM-3312. Each column is legended
      with one pair of numbers, 2/1 over the first and 24/23 over the last; the upper cage is
      drawn as the first number and the lower as the second (see the port-order gap).
  mgmt-jacks:
    confidence: photo-measured
    note: >-
      A 2 x 2 RJ45 cluster: PPS+TOD over 2M, CONSOLE over SNMP, every jack with lamp windows in
      its outer corners (green and amber in the render). SNMP is the out-of-band Ethernet port,
      common/rj45-ganged-eth@1; the other three are not Ethernet, so each is the bare
      std/rj45-ganged@2 with its two windows placed beside it as common/led-rect-sm@1, for: the
      jack - the family's convention for a lamped non-Ethernet jack. Upper jacks are turned 180.
  timing:
    confidence: datasheet
    note: >-
      "SyncE and IEEE 1588v2 (OC, BC, TC) for high-precision timing". The face adds what the
      data sheet does not list: a GNSS antenna input (ANT, an SMA, with a GNSS lamp), a PPS+TOD
      jack and a 2M jack (2.048 MHz / 2 Mb/s BITS by its legend). Direction and format of each
      are not documented.
  snmp-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheet lists "CLI, SNMP, Netconf, USB console" and gives no
      rate for the SNMP (out-of-band) port; 1g is taken from the TM-8104's OOB port on the
      maintainer's ruling for unstated management rates; the snmp-speed gap stays open.
  lamps:
    confidence: estimated
    note: >-
      SYS, ALM, PWR1, PWR2 and GNSS are small bar lamps in a row under the SFP blocks, each after
      its legend, measured by clustering the legend-and-lamp glyphs: 202.35, 220.35, 238.25,
      256.35 and 274.45, an even 18.0 pitch. No document says what any state
      means.
  power:
    confidence: datasheet
    note: >-
      "2 hot-swappable AC/DC power supplies provide 1+1 redundancy", "AC:220V, 100~240VAC | DC:
      -48V, -36~-72V". Ordered with one AC (XM-8424H-AC-x) or one DC (XM-8424H-DC) supply, two
      of either (-2AC-x, -2DC), or one of each (XM-8424H-AC/DC, as the render shows it). No
      consumption figure is published.
attrs:
  physical:
    weight-kg: 5.1
    overall-mm: 440 x 44 x 248 (data sheet)
    mounting: 19-inch rack
  power:
    input-voltage: 100-240 VAC, or -36 to -72 VDC
    psu-redundancy: 1+1, two hot-swappable AC or DC supplies
  environmental:
    operating-temp: -40 to 65 C (temperature-hardened)
  performance:
    switching-capacity: 2 Tbps device capacity
  features:
    services: Carrier Ethernet, MPLS L2VPN/L3VPN, network slicing
    timing: SyncE, IEEE 1588v2 (OC, BC, TC); GNSS antenna input, PPS+ToD and 2M on the face
    resiliency: 1+1 supplies, LAG (static/LACP), MC-LAG
    optics-qsfp28: '100GBASE, 40GBASE (data sheet, "4 x 100G/40G QSFP28/QSFP+")'
    optics-sfp28: '25GBASE, 10GBASE, 1000BASE (data sheet, "24 x 25G/10G/1G SFP28/SFP+")'
  management:
    local: CONSOLE on RJ45 and on USB, SNMP out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 44.0
  depth: 248
  ru: 1
  weight-kg: 5.1
  power: ac
  color: '#dcdedf'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal behind a
    login, whose contact is on telco.com/support.
  wanted: the XM-8424H hardware installation guide, from the BATM support portal.
- what: port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    Each SFP28 column is legended with one pair of numbers ("2/1" ... "24/23") and nothing held
    says which cage is which; the upper cage is drawn as the first number. The two lamp pairs in
    the strip below do not settle it either.
  wanted: the installation guide's port-numbering figure.
- what: single-supply-blank
  scope: [front]
  reason: needs-photo
  note: >-
    The single-supply builds (XM-8424H-AC-x, -DC) leave the second bay without a supply; whether
    it ships with a blank cover, and what one looks like, nothing held shows, so those
    configurations draw the bay empty.
  wanted: a photograph of a single-supply unit's front.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    Nothing held shows the rear, where the fans presumably are (the front has none).
  wanted: a photograph of the rear.
- what: snmp-speed
  scope: [snmp]
  reason: vendor-silent
  note: >-
    No rate is stated for the SNMP out-of-band port; 1g is carried as a BORROWED value (see
    provenance.snmp-speed), not as a finding.
  wanted: the installation guide's interface table.
