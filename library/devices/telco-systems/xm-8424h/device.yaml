configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - XM-8424H-AC-x, "single swappable AC power supply" (data sheet ordering table).
    description: One AC supply in the first bay; the second bay is drawn empty (see the single-supply-blank gap).
    bays:
      psu-1: telco-systems/xm8424-psu-ac@1
      psu-2: ''
  dc:
    kind: orderable
    power: dc
    description: XM-8424H-DC - one DC supply; the second bay is drawn empty.
    bays:
      psu-1: telco-systems/xm8424-psu-dc@1
      psu-2: ''
  dual-ac:
    kind: orderable
    description: XM-8424H-2AC-x - two hot-swappable AC supplies.
    bays:
      psu-1: telco-systems/xm8424-psu-ac@1
      psu-2: telco-systems/xm8424-psu-ac@1
  dual-dc:
    kind: orderable
    power: dc
    description: XM-8424H-2DC - two hot-swappable DC supplies.
    bays:
      psu-1: telco-systems/xm8424-psu-dc@1
      psu-2: telco-systems/xm8424-psu-dc@1
  ac-dc:
    kind: orderable
    power: [ac, dc]
    description: XM-8424H-AC/DC - one AC and one DC supply, as the render shows the XM-8424H.
    bays:
      psu-1: telco-systems/xm8424-psu-ac@1
      psu-2: telco-systems/xm8424-psu-dc@1
