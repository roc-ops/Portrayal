format: 1
kind: device
name: tm-8001
version: 0.1.0
maturity: modelled
manufacturer: Telco Systems
model: TM-8001
aliases:
- {name: T-Metro 8001, kind: superseded, note: 'the name on the metal (T-METRO 8001) and on the 2019 and 2025-09 data sheets; the 2025-12 data sheet and product page call the same box TM-8001'}
portfolio: {line: Carrier Ethernet, family: Service Aggregation Platform, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-8001, formerly T-Metro 8001 - a 1RU carrier Ethernet /
  MPLS aggregation and demarcation switch, 200 Gb switching: twenty 1/10GE SFP+ cages in one
  row of five colour-coded blocks, their lamps gathered in a colour-matched strip beneath,
  the CLI console and MNG management jacks and three status lamps at the left, and a
  front-serviced fan tray behind a large thumbscrew at the right.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-8001 data sheet (telco.com 2025/12), "TM-8001 Compact 10GE Service Demarcation
      Device"; the 2019 and 2025-09 editions call it the T-Metro 8001, which the face prints.
  sources:
    confidence: datasheet
    note: >-
      Three data-sheet editions (2019-01, 2025-09, 2025-12), ten vendor renders from the
      telco.com media library, and the legacy NetZoom stencil "Telco Systems" (2022), master
      T-Metro 8001 (F). NO VENDOR IMAGE IS SQUARE-ON - every render is a three-quarter view -
      and no installation guide is public. One file in the library, telco.com 2021/03/8001.png,
      is not this product: it is a T-Metro 8104 render filed under the 8001's name.
  front-layout:
    confidence: photo-measured
    note: >-
      Every feature is read off the 2025 render (telco.com 2025/08/8001@2x.png, 1678 px)
      after a four-corner homography of its front face onto a 440 x 44 rectangle at 10
      px/mm - a planar face under perspective is exactly what a homography undoes, so this
      is a measurement, not a reading of a slanted picture. Corners in the render: TL (90,
      309), TR (1361, 376), BR (1366, 512), BL (91, 434), each good to a pixel, which is
      about 0.35 mm across and 0.35 mm down. Features that stand proud of the face (the
      fan-tray wheel, the screws) are displaced by their own height and are estimated.
  chassis:
    confidence: photo-measured
    note: >-
      1RU x 440 x 44 x 508 deep. Depth, weight and 1RU are the data sheets' ("1.75'H (1RU) x
      19'W x 20'D (44.45 x 482.6 x 508 mm)"; 482.6 is the 19-inch face with ears). THE WIDTH IS
      MEASURED BY THE RULER THAT REPEATS: at a 440 body the rectified face's in-block SFP+
      pitch is 14.24 +/- 0.22 mm over fifteen adjacent pairs, the registry's ganged 14.25.
      44.0 is 1RU less the usual clearance, not measured.
  stencil-is-another-build:
    confidence: photo-measured
    note: >-
      The 2022 NetZoom master T-Metro 8001 (F) is NOT this face and is not used for
      geometry: it puts the logo and lamps at the right, has no fan-tray wheel, and draws
      the five port blocks 2 mm apart where the render has 5-6 mm. Its one agreement with
      the render is the colour-coded lamp strip under the middle of the port row (stencil 5
      x 26.06 mm, render 5 x 25.4-26.4), which is what confirms the strip is real rather than
      a render artefact. It is most likely the 2019 build's face; the current one is drawn.
  ports:
    confidence: photo-measured
    note: >-
      Twenty cage openings segmented in the rectified render, mean 13.4 x 8.7 at y 23.35, in
      blocks starting at x 71.6, 133.4, 193.8, 254.2 and 313.8. The raw centres scatter about
      0.2 mm, which at a 14.24 mean pitch would overlap neighbouring cages, so each block is
      drawn REGULAR - four std/sfp-ganged@1 at the registry's 14.25 pitch, centred on the
      block's measured mean centre. MNG is common/rj45-eth@1: the render shows lamp windows
      along the top edge of both jack openings, so MNG's lamped keyway side is turned up
      (rotate 180). Numbered 1-20 left to right in white on each block's
      colour bar (green 1-4, orange 5-8, blue 9-12, cyan 13-16, pink 17-20).
  lamps:
    confidence: photo-measured
    note: >-
      The per-port lamps are NOT under their ports: twenty dots in five colour strips, four
      to a strip, running x 157-287 under blocks 2-4, each strip the colour of its block and
      numbered with its first port (1, 5, 9, 13, 17). Dot centres measured, 1.6-2.0 mm, drawn
      as common/led-dot@1. FAN (red), PWR A and PWR B are round lamps in a column at x 55.5;
      FLT and STS are small lamps under blocks 1 and 2. FAN, PWR A and PWR B sit behind large
      domed lenses, about 7.6 mm across in the rectified render (FAN's red), drawn as bezels
      behind the 4 mm lamp part. No document says what any state means. A small printed "+"
      at about (297, 36), under block 4, is not identified by anything held and is not drawn.
  mgmt-plates:
    confidence: photo-measured
    note: >-
      CLI and MNG each sit on a raised plate held by a screw above and below the jack (x
      3.5-25.3 and 27-48.8). Whether these are removable modules is not documented; they are
      drawn as panel plates with their screws.
  mng-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. No TM-8001 edition gives the MNG port's rate (all three searched
      for 10/100, 1000, RJ-45, out-of-band and management port). 1g is taken from the
      TM-8104's OOB port, same vendor, same BiNOX OS generation and the same CLI / OOB pair,
      which NetBox's community entry types 1000base-t - itself unsourced. It is carried so
      the DCIM export does not guess, and the mng-speed gap stays open until a document
      states the real rate.
  fan-tray:
    confidence: estimated
    note: >-
      Data sheets: "Redundant hot-swappable ... fan tray" and "Fan: Load sharing, speed
      controlled, hot-swappable". The render prints FAN TRAY between two hazard triangles
      beside a large knurled wheel at the right, with a small screw left of it, so the tray
      is serviced from the front. ITS OUTLINE IS NOT VISIBLE - no seam shows in the render -
      so it is not drawn as a bay; the wheel is drawn as a fastener (see the fan-tray gap).
  power:
    confidence: datasheet
    note: >-
      "Max power consumption: 150W" in all three editions, unqualified. Supplies: "Dual
      redundant, hot-swappable AC/DC 100-240VAC / -48VDC (-36VDC to -60VDC)", ordered as
      TM8001-AC-x (2 x AC PSU) or TM8001-DC (2 x -48 VDC PEM). They are not on the front, so
      they are presumably at the rear, which nothing shows.
attrs:
  physical:
    weight-kg: 5.75
    overall-mm: 482.6 x 44.45 x 508 with rack ears (data sheet)
  performance:
    switching-capacity: 200 Gbps, wire speed, non-blocking
  power:
    power-max-w: 150
    power-envelope: unstated
    power-envelope-note: data sheet "Max power consumption 150W", no configuration or ambient stated
    input-voltage: 100-240 VAC, or -48 VDC (-36 to -60 VDC)
    psu-redundancy: dual redundant, hot-swappable AC PSUs or -48 VDC PEMs
  thermal:
    cooling: load-sharing, speed-controlled, hot-swappable fan tray, serviced from the front
  environmental:
    operating-temp: 0 to 45 C; extended -5 to 55 C for up to 96 hours
  features:
    services: MPLS L2VPN (VPLS, H-VPLS, VPWS), MPLS L3VPN, 802.1Q, 802.1ad Q-in-Q
    resiliency: sub-50 ms G.8032 R-APS and RSVP-TE FRR, secondary LSP, xSTP, dual-homed VPLS/H-VPLS, LAG, redundant power
    oam: hardware Y.1564 and RFC 2544 test head, MEF 46 latching loopback, Y.1731 PM, TWAMP
    timing: SyncE
    sdn: NETCONF / YANG, zero-touch provisioning
  management:
    local: CLI console and MNG out-of-band Ethernet on RJ45
    mgmt-protocols: Console, Telnet, SSHv2, RADIUS, TACACS+, SNMP v1/2/3, xFTP, NTP, DHCP client/server, ZTP
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 44.0
  depth: 508
  ru: 1
  weight-kg: 5.75
  color: '#d2d6d9'
  silk: '#5a6066'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-8001 / T-Metro 8001 hardware installation guide, from the BATM support portal.
- what: square-on-front
  scope: [front]
  reason: needs-photo
  note: >-
    Every vendor image is a three-quarter render; the face is measured through a homography
    of the best one, which is exact for the flat face and approximate for anything that
    stands proud of it.
  wanted: a square-on photograph of the front at 4 px/mm or better.
- what: rear-and-supplies
  scope: [rear]
  reason: needs-photo
  note: >-
    The two hot-swappable supplies (AC PSU or -48 VDC PEM) are not on the front and nothing
    held shows the rear, so they are not modelled and the device has no supply bays.
  wanted: a photograph of the rear, or the installation guide's rear view.
- what: fan-tray
  scope: [front]
  reason: needs-photo
  note: >-
    The render shows the fan tray's wheel, its FAN TRAY legend and a small screw, but no
    seam, so the tray's extent on the face is unknown and it is not modelled as a bay.
  wanted: a square-on or close photograph of the right end of the front.
- what: mng-speed
  scope: [mng]
  reason: vendor-silent
  note: >-
    No edition states the MNG port's rate; the data sheets list only "Console" among the
    management interfaces. 1g is carried as a BORROWED value from the TM-8104 (see
    provenance.mng-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      twenty 1/10GE SFP+ cages in one row, five colour-coded blocks of four, numbered 1-20
      left to right on each block's colour bar.
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      one lamp per port, gathered in five colour strips under blocks 2-4 rather than under
      the ports; strip colour matches the block's bar.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the CLI serial console and the MNG out-of-band Ethernet port, each on its own plate.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: FAN, PWR A and PWR B beside the management jacks, and FLT and STS under the first two port blocks.
  furniture:
    term: Item
    role: furniture
    index-origin: 1
