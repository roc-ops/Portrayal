format: 1
kind: device
name: tm-340
version: 0.1.0
maturity: modelled
manufacturer: BATM/Telco Systems
model: TM-340
aliases:
- {name: T-Marc 340, kind: marketing, note: 'the name printed on the faceplate and used throughout the only data sheet ("Telco Systems T-Marc 340 (TM-340)")'}
- {name: TMC-340, kind: vendor, note: 'the stem of every ordering code (TMC-340-z, TMC-340-2DC, TMC-340-z-E, TMC-340-EW, TMC-340-x-F)'}
portfolio: {line: Carrier Ethernet, family: Network Interface Device, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-340, the T-Marc 340 - a half-width 1RU Carrier Ethernet 2.0
  network interface device with six 1GE combo ports, each an SFP cage over an RJ45 jack: two
  Network ports (1/1-1/2) and four Access ports (2/1-2/4). A CON console jack, STS, PS-I and PS-E
  lamps and a reset pinhole; AC or dual-feed DC, for a rack, a wall or a desk.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-340 data sheet (telco.com 2025/12), "Compact, Hardened, and SLA-Assured Carrier Ethernet
      NID"; the faceplate prints T-Marc 340.
  sources:
    confidence: datasheet
    note: >-
      One data-sheet edition (2025-12), three vendor images of which telco.com
      2025/12/340-device.png (about 3.3 px/mm across the face) is the most nearly square-on, a 2021
      photograph of a unit (2021/03/340f.png) showing the same face, and the legacy NetZoom stencil
      "Telco Systems" (2022), master T-Marc 340 (CF). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      Half-width 1RU, 221 x 44 x 235 - the data sheet's "44 mm x 221 mm x 235 mm (1.75 in x 8.7
      in x 9.25 in)"; the stencil master's outline is 220.6 x 44.0. "1RU (1/2 width),
      wall/desk/rack-mountable" - the brackets are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S. telco.com 2025/12/340-device.png is square-on across but seen
      from about 22 degrees above (the lid shows), so the face is 134.5 px tall where its 730 px
      width says 144.6; rectifying the four face corners (44.5,95.5 774.3,95.5 774.3,229.5
      44.5,229.5) onto the data sheet's 221 x 44 takes the foreshortening out, and every cage,
      jack, lamp, vent and legend is placed where it lands in that 10 px/mm image. The stencil
      master is not used for positions: it puts the ports on a wider pitch and 5-8 mm left of
      where the render has them (the same failure as its TM-3312 and TM-3348 siblings).
  ports:
    confidence: photo-measured
    note: >-
      SIX COMBO PORTS: each number names an SFP cage (port-N) and the RJ45 jack under it
      (copper-N), one or the other in use at a time - "6 x 10/100/1000 Base-T or 100/1000Base-X
      Combo SFP ports". The Network pair (1/1, 1/2) and the Access four (2/1-2/4) are separate
      blocks under their own bracketed legends. The jacks are common/rj45-ganged-eth@1 turned 180
      (lamp windows in the upper corners, green and amber in the render) on the part's 13.97
      pitch, centred on each block as measured (57.55 and 112.6); the render's own jack pitch
      reads 13.6-13.9 at 3.3 px/mm. The cages are std/sfp-ganged@1 at the registry's 14.25
      pitch on the same block centres; the render's cage openings read 14.0, which a 14.25-wide
      part cannot sit on without overlapping, so the difference is in the drawing, not hidden.
      The printed numbers sit about 2.8 mm left of their jacks, as in the render.
  lamps:
    confidence: estimated
    note: >-
      STS beside the CON jack with a pinhole after it, and PS-I over PS-E between the two blocks,
      placed where the rectified render has them. No document says what any state means; PS-I
      and PS-E presumably report an internal and an external supply (see the ps-e gap).
  power:
    confidence: datasheet
    note: >-
      "AC 100-240 V, 50/60 Hz / DC -24 to -72 V (dual-feed)"; "Power Consumption Typical 25 W,
      Max 45 W", with no configuration or ambient stated. AC (TMC-340-z, -z-E) and dual-feed DC
      (TMC-340-2DC, -EW) builds. Nothing on the front is an inlet, so it is presumably at the
      rear.
attrs:
  physical:
    weight-kg: 1.1
    overall-mm: 221 x 44 x 235 (data sheet)
    mounting: 19-inch rack (half width), wall or desk
  power:
    power-typical-w: 25
    power-max-w: 45
    power-envelope: unstated
    power-envelope-note: data sheet "Typical 25 W, Max 45 W", no configuration or ambient stated
    input-voltage: 100-240 VAC 50/60 Hz, or -24 to -72 VDC dual feed
  environmental:
    operating-temp: >-
      0 to 50 C standard; -20 to 65 C extended (ordering table - the specification table prints
      -2 C); -40 to 65 C hardened
    humidity: 10 to 90 percent non-condensing
  performance:
    switching-capacity: 10 Gbps non-blocking
  features:
    services: MEF CE 2.0
    resiliency: sub-50 ms - G.8031, G.8032v2, Fast Ring, xSTP, LAG (static/LACP), BFD, Resilient Link
    optics-sfp: '100BASE-X, 1000BASE-X (data sheet, "100/1000Base-X Combo SFP ports")'
  management:
    local: CON console on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 221.0
  height: 44.0
  depth: 235
  ru: 1
  weight-kg: 1.1
  power: ac
  color: '#d9dadb'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-340 / T-Marc 340 hardware installation guide, from the BATM support portal.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The inlet (AC, or the DC build's dual feed) is not on the front, so it is presumably at the
    rear, which nothing held shows.
  wanted: a photograph of the rear of an AC and of a DC unit.
- what: f-variant
  scope: [front]
  reason: needs-photo
  note: >-
    TMC-340-x-F / DC-F is "2 x Copper + 4 x Fiber, Mixed port model option" - a different
    port set from the six combo ports drawn here, whose face nothing held shows.
  wanted: a photograph or render of the TMC-340-x-F front.
- what: ps-e
  scope: [front]
  reason: vendor-silent
  note: >-
    The face has PS-I and PS-E lamps, which read as an internal and an external supply, but the
    data sheet names no external supply for this model (the TM-3308's is TMC-3X0-EXTPS-x, a
    name that may cover the 340 too).
  wanted: the installation guide's power section.
groups:
  network:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the Network combo ports' SFP cages, 1/1 and 1/2.
  network-copper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      combo ports - copper-1-1 and copper-1-2 share their numbers with the SFP cages port-1-1 and
      port-1-2 above them, one or the other in use at a time.
  access:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the Access combo ports' SFP cages, 2/1 to 2/4.
  access-copper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      combo ports - copper-2-1..2-4 share their numbers with the SFP cages port-2-1..2-4 above
      them, one or the other in use at a time.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    description: the CON console (the data sheet says only "Console").
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: STS, PS-I and PS-E.
  controls:
    term: Button
    role: management
    index-origin: 1
