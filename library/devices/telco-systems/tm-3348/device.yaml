configurations:
  base:
    kind: base
    default: true
    source: >-
      sourced - TMC-3348S-2AC-x, two internal AC supplies (2024 data sheet ordering table).
    description: The TM-3348S with its two internal AC supplies.
  dc-power:
    kind: orderable
    power: dc
    description: >-
      TMC-3348S-2DC - "Dual feed -24/-48 VDC 3A power supplies" (ordering table), -24/-48 to
      -72 VDC. The face is the same; the difference is at the rear.
