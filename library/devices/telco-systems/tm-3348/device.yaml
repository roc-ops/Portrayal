format: 1
kind: device
name: tm-3348
version: 0.1.0
maturity: modelled
manufacturer: BATM/Telco Systems
model: TM-3348
aliases:
- {name: T-Marc 3348S, kind: superseded, note: 'the name on the metal (TMC-3348 S) and on the 2021-2024 data sheets; the 2025 data sheet and product page call the same box TM-3348S/SH'}
- {name: TMC-3348S, kind: vendor, note: 'the model printed on the faceplate and the stem of the ordering codes (TMC-3348S-2AC-x, TMC-3348S-2DC)'}
- {name: T-Marc 3348SH, kind: variant, note: 'the hardened-temperature version (-40 to 70 C) with the BITS in/out interfaces; that its face matches the S drawn here is not confirmed - see the sh-variant gap'}
portfolio: {line: Carrier Ethernet, family: Network Interface Device, series: T-Series}
description: >-
  Telco Systems (BATM Networks) TM-3348S, formerly T-Marc 3348S - a half-width 1RU carrier
  Ethernet / MPLS / IP 10GE aggregation and demarcation device: four 10/100/1000 copper
  ports, eight 100/1000 SFP ports and four 1/10GE SFP+ ports (3 and 4 licence-activated)
  under four vent grilles, an ETH / CON management stack, SYNC / SD / PS1 / PS2 lamps, two
  internal AC or DC supplies, for a 19-inch rack or a wall.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      TM-3348S/SH data sheet (telco.com 2025/12), "10GE Ethernet/MPLS/IP Aggregation &
      Demarcation Device"; the 2024 edition calls it the T-Marc 3348S/SH, and the face prints
      TMC-3348 S.
  sources:
    confidence: datasheet
    note: >-
      Two data-sheet editions (2024-05, 2025-12), twelve vendor images of which telco.com
      2024/09/TMC3348S-E.png (1200 x 331, near square-on, about 5.4 px/mm) is the best of
      any T-Series model, and the legacy NetZoom stencil "Telco Systems" (2022), master
      TMC-3348S (CF). No installation guide is public.
  chassis:
    confidence: datasheet
    note: >-
      Half-width 1RU, 221 x 44 x 235 - the data sheets' "1.75' (1RU) x 8.7' x 9.25' (44mm x
      221mm x 235mm)". The stencil master's own outline, which has no ears (a half-width box),
      is 221.25 x 43.79 and agrees to a quarter of a millimetre; the chassis carries the data
      sheet's figures. "19' rack and wall-mounting
      options" (2019 edition) - the brackets are not part of the face.
  front-layout:
    confidence: photo-measured
    note: >-
      POSITIONS ARE THE RENDER'S, SHAPES THE STENCIL'S. telco.com 2024/09/TMC3348S-E.png is
      rectified by a four-corner homography onto the data sheet's 221 x 44 (corners TL 5,106.5
      TR 1194,113.5 BR 1193,329 BL 5,328.5; about 5.4 px/mm, good to a few tenths of a
      millimetre) and every jack, cage, lamp, slot, vent and grille is placed where it lands.
      The NetZoom master TMC-3348S (CF) is retired for positions: its copper jacks sit on a
      16.7 pitch where this render measures 14.1, and its blocks are 0.5-4 mm from where the
      render puts them. The stencil keeps its legends and the cage and jack shapes. THE
      TM-3312's RENDER DOES NOT AGREE WITH THIS ONE CLOSELY on the shared left half, although
      the two faces are presumably one part: relative positions differ by up to about 1.3 mm
      in x (ETH to the first SFP column is 81.1 here and 82.35 on the TM-3312) and 0.5-1.1 mm
      in y, and the pitches differ (copper 14.1 here against 14.25, SFP 14.45 against 14.3).
      This render is 5.4 px/mm against the TM-3312's 2.3, so where they disagree this one is
      the likelier to be right; nothing held settles it.
  ports:
    confidence: photo-measured
    note: >-
      Copper 1/1-1/4 (columns 63.35 and 77.45) are a 2 x 2 RJ45 block with lamp windows in
      their outer corners, common/rj45-ganged-eth@1, upper row turned 180. SFP 2/1-2/8 are a 2
      x 4 stacked block on a 14.4 pitch (columns 95.95-139.25) with TWO arrow lamps per port
      in the strip between the rows, ▼▲▼▲ across each column at -4.75, -1.9, +1.8 and +4.65
      mm from the column centre. SFP+ 3/1-3/4 are one row of four under four slotted vent
      grilles, each with a lamp dot beside its legend; a LICENSE bracket spans 3/3 and 3/4,
      which the ordering table says need "Activation license ... for ports 3 & 4". The ETH
      legend's bracket runs under 1/1-2/8 and on under 3/1 and 3/2, with the word printed
      off-centre at about 134 mm where the render has it; 3/3 and 3/4 each have a bracket of
      their own under the LICENSE one - so the face groups 3/1-3/2 with the Ethernet ports and
      sets the licensed pair apart.
  jack-lamps:
    confidence: photo-measured
    note: >-
      The render shows two lamp windows on the CON console, and the STS and FLT legends
      printed under it name them. CON is not Ethernet, so it is the bare std/rj45-ganged@2
      with the two windows placed beside it as common/led-rect-sm@1, for: con, at the corners
      where common/rj45-ganged-eth@1 draws its own - the family's way of drawing a lamped
      non-Ethernet jack (juniper/mx204's BITS).
  lamps:
    confidence: estimated
    note: >-
      SYNC, SD, PS1 and PS2 are about 4 mm lamps with a pinhole between SD and PS1, placed
      where the rectified render has them, as are the wordmark plate, the four short slots
      under the model name and the vent dashes along the top edge (none of which the
      stencil draws); LNK/ACT and MNG are printed over the ETH jack and STS and FLT under the CON jack,
      naming those jacks' own lamp windows. No document says what any state means.
  eth-speed:
    confidence: borrowed
    note: >-
      BORROWED, NOT STATED. The data sheets list "1 x Console RJ45 port" and are silent on the
      ETH management port's rate. 1g is taken from the TM-8104's OOB port on the maintainer's
      ruling for unstated management rates; the eth-speed gap stays open.
  power:
    confidence: datasheet
    note: >-
      Two internal supplies, AC (TMC-3348S-2AC-x) or DC (TMC-3348S-2DC); "Redundant power
      supplies and wide-range DC input". Input "100-240 VAC, 50/60 Hz -24/48VDC to-72VDC" (both
      editions), and the ordering table rates the DC model "Dual feed -24/-48 VDC 3A power
      supplies" - recorded as stated, in volts and amps, on the dc-power configuration. No
      consumption figure in watts is published. The supplies are internal, so the front carries no
      bays; their inlets are presumably at the rear.
attrs:
  physical:
    weight-kg: 1.1
    overall-mm: 221 x 44 x 235 (data sheet)
    mounting: 19-inch rack (half width) or wall
  power:
    input-voltage: 100-240 VAC 50/60 Hz, or -24/-48 to -72 VDC
    dc-input: dual feed, -24/-48 VDC, 3 A (TMC-3348S-2DC, ordering table)
    psu-redundancy: two internal supplies, AC or DC
  environmental:
    operating-temp: 0 to 50 C; -40 to 70 C for the TM-3348SH
  features:
    services: MEF CE 2.0; 802.1Q, 802.1ad; MPLS VPWS, VPLS, H-VPLS; L3VPN with VRF
    optics-sfp: '100BASE-FX, 1000BASE-X (data sheet, "8 x 100FX/1000BaseX SFP ports")'
    optics-sfp-plus: '1000BASE-X, 10GBASE-X (data sheet, "4 x 1000FX/10000BaseX SFP+ ports")'
    timing: IEEE 1588v2 PTP, SyncE; BITS in/out on the SH version
    licensing: SFP+ ports 3 and 4 need an activation licence
    resiliency: sub-50 ms G.8032 R-APS, STP/RSTP/MSTP, FRR, H-VPLS dual homing, LAG, BFD, redundant power
  management:
    local: CON RS-232 ASCII console and ETH out-of-band Ethernet on RJ45
  lifecycle:
    eol: none-announced
chassis:
  width: 221.0
  height: 44.0
  depth: 235
  ru: 1
  weight-kg: 1.1
  power: ac
  color: '#dddddd'
  silk: '#3a3d41'
gaps:
- what: install-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    telco.com publishes data sheets only; hardware documentation is on a support portal
    behind a login, whose contact is on telco.com/support. Searched: the telco.com media
    library, every product and knowledge-centre page, and the Wayback index of telco.com PDFs.
  wanted: the TM-3348 / T-Marc 3348S hardware installation guide, from the BATM support portal.
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    The two internal supplies' inlets are not on the front, so they are presumably at the rear,
    which nothing held shows (no stencil rear master for this model).
  wanted: a photograph of the rear of an AC and of a DC unit.
- what: sh-variant
  scope: [front]
  reason: needs-photo
  note: >-
    The hardened TM-3348SH adds "BITS in/out clock interfaces"; where they appear on the face
    is not shown by anything held, so only the S face is drawn.
  wanted: a photograph or render of the TM-3348SH front.
- what: sd-slot
  scope: [front]
  reason: needs-photo
  note: >-
    A dark 26 x 3.5 mm slot under the lamp row in the render, absent from the stencil - the
    same slot, in the same place, as on the TM-3312, whose data sheets list an SD card under
    Management; the TM-3348's editions do not mention one. Probably the SD card slot, drawn as
    panel decor, not as a part.
  wanted: a close photograph of the lamp area with and without a card.
- what: eth-speed
  scope: [eth]
  reason: vendor-silent
  note: >-
    No edition states the ETH port's rate; 1g is carried as a BORROWED value (see
    provenance.eth-speed), not as a finding.
  wanted: the installation guide's interface table.
groups:
  copper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: four 10/100/1000Base-T UNI/NNI ports, 1/1 to 1/4, a 2 x 2 block.
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: eight 100Base-FX/1000Base-X UNI/NNI ports, 2/1 to 2/8, a stacked 2 x 4 block.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      four 1/10GE SFP+ UNI/NNI ports, 3/1 to 3/4, one row under the vent grilles; 3/3 and 3/4
      need an activation licence.
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the ETH out-of-band Ethernet port over the CON RS-232 console, one RJ45 stack.
  con-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: STS and FLT, the CON jack's two lamp windows.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: SYNC, SD, PS1 and PS2.
  controls:
    term: Button
    role: management
    index-origin: 1
