gaps:
- what: top-end
  scope: [bottom, top]
  reason: vendor-silent
  wanted: >-
    Which end of the plate is up on a wall. The datasheet draws the box lying down and does not
    say; the four jacks are drawn on the bottom end.
- what: side-ports-position
  scope: [left]
  reason: vendor-silent
  wanted: >-
    A dimensioned drawing of the long side: the micro-USB console port, the reset pinhole and
    the DC jack are placed by eye from a figure with no scale, and which long side carries them
    is not stated.
- what: rear-mounting-slots
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A dimensioned drawing of the wall side: the four mounting slots and the recess round the
    2.5GbE port are visible in the datasheet's figure and are not drawn.
