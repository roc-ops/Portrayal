format: 1
kind: device
name: ipc-apwf6-poe-wp
version: 1.0.0
maturity: modelled
manufacturer: ReadyLinks
model: IPC-APWF6-POE-WP
description: >-
  Wi-Fi 6 wall-plate access point that replaces the plate over an existing outlet. It has a
  2.5GbE PoE/PoE+ uplink on the wall side. Four GbE RJ45 ports are on one end, and LAN 1 hands on
  48 V / 10 W. A DC input, a micro-USB console port and a reset button sit on one long side. It
  carries Bluetooth 5.1.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      ReadyLinks, IPC-APWF6-POE-WP Wi-Fi 6 Wall-Plate Access Point product datasheet (July 2026,
      5 pages): page 3 for the dimensions, ports and power, page 4 for the ports and dimensions
      figure. The vendor's stock photograph of the unit (a three-quarter view of the end with the
      four jacks and of one long side) confirms the jack count, the DC jack and the legends. No
      vendor 3D model and no mechanical drawing is held for this unit.
  chassis:
    confidence: datasheet
    note: >-
      datasheet page 3, Dimensions: 6.69 x 3.39 x 1.69 in (170 x 86 x 43 mm), weight 0.66 lb (0.3
      kg). Modelled upright as a plate, 86 mm wide, 170 mm high and 43 mm deep. The figure on page
      4 draws the box lying on its back with the four jacks on the right-hand end; which end is
      the top once it is on a wall is not stated, and the jacks are drawn on the bottom end.
  power:
    confidence: datasheet
    note: >-
      datasheet page 3, Power input: 48 V DC / 0.6 A over a DC connector (2.1 mm / 5.5 mm,
      centre-positive), or PoE/PoE+ IEEE 802.3af/at; 'If both DC power and PoE are available, DC
      power is preferred'; 'When powered by 802.3at (PoE+), the AP operates with the optimal
      performance'. Max power consumption 25 W: 'DC power: 25 W', '802.3at (PoE+): 25 W', each
      with 'LAN 1 for PoE supply'; '802.3af (PoE): 15 W' with LAN 1 PoE out disabled; 'Idle mode:
      8 W'. The sheet does not say that 25 W excludes the PoE it hands on, and lists LAN 1 supply
      among its conditions, so 25 W is taken as the whole intake and is `poe-pd-max-w` as printed.
      LAN 1 hands on 48 V / 10 W (`poe-budget-w`). The sheet prints no 802.3 class. The 15 W mode
      with PoE out off and the 8 W idle figure are kept here and nowhere else.
  rear-layout:
    confidence: estimated
    note: >-
      datasheet page 4, the back view: one RJ45 on a recessed rectangle, labelled WAN / PoE and
      '2.5GbE PoE/PoE+ IN', with four mounting slots at the corners. Placed on the centre line,
      its height up the plate read by eye from a figure whose scale is not stated; the mounting
      slots are not drawn.
  bottom-layout:
    confidence: estimated
    note: >-
      datasheet page 4 and the stock photograph: four RJ45 jacks side by side, legends LAN 1 (with
      a 'PoE Out' tag beneath it), LAN 2, LAN 3 and LAN 4. The pitch and the margins are read by
      eye from the photograph and span the end; the jacks are the library's own 15.8 x 13.2.
  side-layout:
    confidence: estimated
    note: >-
      datasheet page 4 and the stock photograph show, on one long side, a micro-USB port (the
      sheet calls it the console port), a pinhole beside it (the reset button, 'Factory reset')
      and a DC jack legended DC 48 V. Drawn on the left side. Their distances along the plate are
      read by eye from the figure (about 23, 46 and 96 mm from the end opposite the jacks). The
      legends beside the micro-USB port and the pinhole are not legible at the size the sheet
      prints them and are not transcribed.
  chassis-shape:
    confidence: estimated
    note: >-
      the data sheet gives the three overall dimensions and no edge radius. The stock photograph
      shows every edge of the box softly rounded, to about 2.5 mm by eye against the 43 mm
      thickness. The library's bevel cuts an edge at 45 degrees, so each of the twelve edges is
      drawn as a 2.5 mm chamfer where the photograph shows a round of about that size.
  chassis-colour:
    confidence: photo-measured
    note: >-
      the median of the lit long face and the lit end of the stock photograph, #fdfdfd and #fbfbfb,
      taken as #fcfcfc; the shaded side reads #e6e6e6, which is the lighting and not the plastic.
  front-layout:
    confidence: estimated
    note: >-
      the data sheet prints the name ReadyLinks on the plate: in the header of page 1, on the
      plate's face in the page 1 picture and in small type on it in the page 4 figure. The
      wordmark is drawn as that name, as text near the top of the face; it is not the maker's
      logo. The stock photograph prints another maker's name there, on the face near one end,
      which is not reproduced; the data sheet is the authority for the device's name.
attrs:
  physical:
    weight-kg: 0.3
    overall-dimensions: 170 x 86 x 43 mm (datasheet)
  performance:
    wifi-rates: 802.11ax 2.976 Gbps, 802.11ac 1.733 Gbps, 802.11n 600 Mbps
  platform:
    memory: 512 MB DRAM
    storage: 128 MB flash
  power:
    power-max-w: 25
    power-max-scope: DC power or 802.3at, both radios 2x2, LAN 1 supplying PoE
    power-input: 48 V DC / 0.6 A over a 2.1 mm / 5.5 mm centre-positive connector, or PoE/PoE+ 802.3af/at over the 2.5GbE port. DC is preferred when both are present
    poe-pd-standard: 802.3at
    poe-pd-standard-min: 802.3af
    poe-pd-max-w: 25
    poe-budget-w: 10
    poe-budget-scope: LAN 1, 48 V
    power-idle-w: 8
  environmental:
    operating-temp-c: 0 to 40
    operating-humidity: 5 to 95 percent noncondensing
  features:
    wifi: 802.11a/b/g/n/ac/ax (WiFi 6), 2.4 GHz 2x2 and 5 GHz 2x2
    bluetooth: '5.1'
  management:
    interfaces: ReadyView cloud; Ethernet/Fiber in-band; Ethernet/Fiber out-of-band
    button-functions: factory reset
  lifecycle:
    eol: none-announced
