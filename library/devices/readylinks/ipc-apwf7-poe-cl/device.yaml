format: 1
kind: device
name: ipc-apwf7-poe-cl
version: 1.0.0
maturity: modelled
manufacturer: ReadyLinks
model: IPC-APWF7-POE-CL
description: >-
  Wi-Fi 7 ceiling access point with five radios, one of them an AI radio. Ports: a 10GbE PoE-in
  port, and a second 10GbE RJ45 shared with a 10GbE SFP+ cage. A GbE RJ45 hands on 48 V PoE. There
  are also an RJ45 console port, a DC input and a USB 3.0 Type-A port. It carries Bluetooth 5.3.
  The ports are on the mounting side. The face is a rounded square, smaller than the back, with
  diagonal ridges, a Wi-Fi mark and wordmark, and one slanted status lamp.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      ReadyLinks, IPC-APWF7-POE-CL Wi-Fi 7 Ceiling Access Point product datasheet (July 2026, 4
      pages): page 3 for the dimensions, ports and power, page 4 for the ports and dimensions
      figure. The vendor's stock photograph of the face confirms the wordmark and the status lamp.
      No vendor 3D model and no mechanical drawing is held for this unit.
  chassis:
    confidence: datasheet
    note: >-
      datasheet page 3, Dimensions: 9.65 x 9.65 x 2.64 in (245 x 245 x 67 mm), weight 4.41 lb (2.0
      kg). `ceiling`: the datasheet says to install it on the ceiling of high-density space. The
      face is the dome that shows below the ceiling; the rear is the mounting side that carries
      the ports.
  power:
    confidence: datasheet
    note: >-
      datasheet page 3, Power input: 54 V DC / 1.25 A over a DC connector (2.5 mm inner, 5.5 mm
      outer), or PoE input over WAN 1 from a PSE that 'complies with IEEE 802.3at/bt standard
      (PoE+/PoE++)'; 'if both DC power and PoE are available, DC power is preferred'; voltage
      range PoE mode 'PoE+: 50-57V'. 'PoE interfaces: (1) PoE IN. PoE+/PoE++ IEEE 802.3at/bt'.
      Max power consumption '60W (Excluding PoE output)', with 'LAN1 for PoE power supply (48 V/12.95
      W)' and 'USB port for external power supply (5 V/5 W)' listed among the conditions. So
      `power-self-max-w` is 60 as printed, `poe-budget-w` is 12.95 (LAN 1), and `poe-pd-max-w`
      is their sum, 72.95 W. The sheet prints no separate PoE-input figure, does not say whether
      the 5 W the USB port can supply is inside the 60 W, does not say what the unit does on
      802.3at, and prints no 802.3 class. Whether 72.95 W is within what an 802.3bt powered
      device may take in is not checked: IEEE 802.3 is not held.
  rear-layout:
    confidence: estimated
    note: >-
      datasheet page 4, the back view and its callouts: a recessed panel carrying one strip of
      six ports, legends DC 54V, SFP+, WAN 1/10G/PoE, WAN 2/10G, LAN 1/IoT and Console, in that
      order left to right. The positions are measured off the figure by scaling its 245 mm body
      (about 0.52 mm per pixel at 300 dpi); the legends above LAN 1 carry a rating the figure is
      too small to read and it is not transcribed. The four mounting screws round the panel and
      the fin pattern are not drawn as parts.
  right-layout:
    confidence: estimated
    note: >-
      datasheet page 4, the face view: a USB-A opening on the right-hand edge at about mid-height
      ('(1) USB 3.0 (Type-A connector)'). Its height along the edge is read from that figure; its
      depth position in the 67 mm thickness is not shown and is drawn at the middle.
  chassis-shape:
    confidence: estimated
    note: >-
      the datasheet's page 4 figure prints only the three overall dimensions (9.65, 9.65 and 2.64
      in) and no corner radius or taper angle. Read off the stock photograph of the face (about
      0.17 mm per pixel from the 245 mm width): the plan corner radius is about 43 mm, where the
      straight edge ends 250 pixels from the corner. A lighter band about 5 mm wide runs along the
      bottom edge of the face and its lower right, which is the wall seen leaning out, so the face
      is drawn 5 mm smaller on each side than the back. How deep the taper runs is not shown: it
      is drawn over the front 25 mm of the 67, which clears the USB-A port, about 11 degrees. The
      body is built as a taper over a rounded square, in eight chords a corner.
  chassis-colour:
    confidence: photo-measured
    note: >-
      the median of the plain lit face in the stock photograph, #f9f9f8 (69000 pixels); the
      shaded sides read #e3e3e3 to #ebebeb, which is the lighting and not the plastic.
  front-layout:
    confidence: photo-measured
    note: >-
      stock photograph of the face (about 0.17 mm per pixel from the 245 mm width): the wordmark
      ReadyLinks at the top right with a three-arc Wi-Fi mark above its right-hand letters, five
      diagonal ridges across the middle, and one status lamp at the bottom left, a bar about 15 mm
      long slanted at 45 degrees. The wordmark is printed as text, not as the maker's logo; the
      ridges are drawn as shading and not built up, because no document gives their height.
      The datasheet does not say what the lamp shows.
attrs:
  physical:
    weight-kg: 2.0
    overall-dimensions: 245 x 245 x 67 mm (datasheet)
  performance:
    wifi-rates: 802.11be 24.436 Gbps, 802.11ax 20.363 Gbps, 802.11ac 10.401 Gbps, 802.11n 2.4 Gbps
  power:
    power-self-max-w: 60
    power-input: 54 V DC / 1.25 A over a 2.5 mm / 5.5 mm centre-positive connector, or PoE+/PoE++ 802.3at/bt over WAN 1 (50-57 V). DC is preferred when both are present
    poe-pd-standard: 802.3bt
    poe-pd-standard-min: 802.3at
    poe-pd-max-w: 72.95
    poe-budget-w: 12.95
    poe-budget-scope: LAN 1, 48 V
  environmental:
    operating-temp-c: 0 to 40
    operating-humidity: 5 to 95 percent noncondensing
  features:
    wifi: 802.11n/ac/ax/be (WiFi 7), radios 2.4 GHz 4x4, 5 GHz 4x4 twice, 6 GHz 4x4 and an AI radio 2x2
    bluetooth: '5.3'
    optics-sfp-plus: 'datasheet: the SFP+ cage is compatible with 10GE, 2.5GE and 1GE modules; the sheet lists no vendor optics'
  management:
    interfaces: ReadyView cloud; Ethernet/Fiber in-band; Ethernet/Fiber out-of-band
    button-functions: factory reset
  lifecycle:
    eol: none-announced
chassis:
  width: 245.0
  height: 245.0
  depth: 67.0
  mount: ceiling
  rounded:
    radius: 43.0
    taper: {face: front, inset: 5.0, depth: 25.0}
  color: '#f9f9f8'
  edge: '#d3d6d9'
  silk: '#4a4f55'
gaps:
- what: corner-radius
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    A dimensioned drawing of the unit from the front, with the radius of its plan corners, which
    is read here by eye from a photograph.
- what: taper
  scope: [front, left, right, top, bottom]
  reason: vendor-silent
  wanted: >-
    A dimensioned side view of the unit, with how much smaller the face is than the back and how
    far down the wall the slope runs.
- what: usb-position
  scope: [right]
  reason: vendor-silent
  wanted: >-
    A dimensioned drawing of the right edge: the USB-A port is placed at mid-thickness and at the
    height the face-on figure shows it, which no document dimensions.
- what: usb-5w-inside-60w
  scope: [power]
  reason: vendor-silent
  wanted: >-
    Whether the 5 W the USB port can supply is inside the 60 W printed 'Excluding PoE output', and
    what the unit takes in on 802.3at.
- what: status-led-meaning
  scope: [front]
  reason: vendor-silent
  wanted: What the one status lamp shows and in which colours; no document says.
groups:
  wan:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
    description: WAN 1, the 10GbE PoE-in port, and WAN 2, the 10GbE RJ45 shared with the SFP+ cage
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the 10GbE SFP+ cage, shared with WAN 2; one or the other carries traffic
  lan:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the GbE port, LAN 1, which hands on 48 V PoE
  console:
    term: Port
    role: management
    index-origin: 1
  usb:
    term: Port
    role: service
    index-origin: 1
    attrs: {media: usb-a, usb: '3.0'}
  inlets:
    term: Inlet
    role: service
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
