format: 1
kind: device
name: gl-12xb-240d
version: 0.1.4
maturity: modelled
manufacturer: ReadyLinks
model: GL-12xB-240D
description: >-
  1RU coax edge switch - twelve ReadyLink ports on BNC jacks that carry gigabit Ethernet and
  PoE over existing 75 ohm camera coax, two 10G SFP+ and two GbE RJ45 uplinks, a pair of BNC
  sync jacks, and a console, USB-C and reset on the fixed left panel. The twelve BNC ports
  are a line card in the upper of two line-card slots; the lower slot ships blanked. Two
  internal 300 W supplies behind two switched C14 inlets give a 240 W PoE budget, and two
  six-pole DC headers at the rear stack DC power between units.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      vendor GLB 3D model (gl-12xb.glb from the product page's model viewer - a KeyShot CAD
      export, 812 nodes, 2.19 million triangles, Draco-compressed, per-part meshes at
      millimetre scale), read two ways: part boxes with spec/tools/intake/glb_parts.py, and
      orthographic z-buffered renders of each face at 4 to 20 px/mm; the vendor datasheet
      (ReadyLinks-GL-12xB-240D-Datasheet.pdf, three pages, whose page 3 panel figure is a
      1600 px photograph of the front and rear with callouts and a three-quarter view); the
      vendor product render (gl-12xb/front.png, 1920 x 1079, the same GLB with its textures);
      and the vendor catalogue API entry. The GLB is the position source for every feature;
      the datasheet names them; the render and photograph confirm colour and printing.
  chassis:
    confidence: drawing
    note: >-
      drawing - the GLB body is 440.0 wide between the side walls (GL24X-1U-003B, x -220 to
      220), 45.0 tall (bottom plate at y 0.5, top plate's top at 45.5) and 300.1 deep from the
      front panel face (z 160.35) to the rear panel face (z -139.75). The datasheet reads
      "12'(L) x 19'(W) x 1.75'(H) (305mm x 228.6mm x 44.45mm)": 19 in is the rack face with
      the ears (the GLB ears, PRODUCT_1304, make it 482.6), 12 in is 305 against 300.1 and
      1.75 in is 1RU against 45.0. The deltas are per-axis (42.6, 4.9, -0.55) and not a
      scale factor, so they are ears and rounding, and the CAD body is modelled. The
      sheet's 228.6 mm is 9 in, a slip for the 19 in it prints beside it. Ears are not
      drawn.
  front-layout:
    confidence: drawing
    note: >-
      drawing - every position is measured off the GLB in face coordinates (x from the left
      side wall, y down from the top plate). The fixed left panel (GL24X-1U-005B) runs x 0 to
      132.4; the two line-card plates (GL24X-1U-NEWBNC and GL24X-DANGPAN) x 132.70 to 414.20
      at y 2.35 to 21.90 and 23.05 to 42.60, flush with the panel at z 160.35, with a 1.15
      rail of chassis metal between them; the right panel (GL24X-1U-007B) x 414.5 to 440.
      Openings were found as depth-map regions behind the panel plane at 8 px/mm: GE2/GE1
      12.75 x 10.88 at (107.88, 8.00) and 12.62 x 10.75 at (107.88, 24.38), in a shell whose
      visible face runs y 7.32 to 35.6 (the GLB box reaches 38.65 with the light pipes below); SFP+2/SFP+1 14.1 x 10.9 centred (96.06, 15.69) and 14.25 x 10.75 centred (96.0,
      29.5) in a 14.9 x 25.0 cage; console 12.25 x 11.0 in a 15.9 x 13.4 housing centred
      (42.86, 28.5); USB-C 8.25 x 2.75 centred (57.25, 33.62); reset hole 3.38 across at
      (67.19, 31.06). Lamp lenses 3.0 across: status at x 30.6, y 17.4 / 22.5 / 27.6 / 32.7;
      the two SFP light pipes 1.5 x 1.35 at (91.35, 22.6) and (100.65, 22.6). The sync
      jacks' collars (SYNC_1) are 9.30 across, centred at (79.60, 12.33) and (79.60, 28.33),
      their fronts 11.9 in front of the panel.
  sync-jacks:
    confidence: drawing
    note: >-
      drawing - the datasheet's panel figure calls out "(2) BNC sync ports", and the faceplate
      prints OUT over the upper and IN under the lower, joined by a SYNC bracket. They are
      placed as common/bnc-jack@1, the library's BNC bezel. The GLB draws them as one
      simplified block with plain barrels, no bayonet lugs, and each collar 0.5 mm off the
      centre of the wider barrel behind it; the collar is what a plug mates, so the collar
      centres are used. Which signal they carry, at what level and impedance, no held
      document says (gap sync-signal).
  line-cards:
    confidence: datasheet
    note: >-
      datasheet - the panel figure labels the two openings "(2) Line card slots", and the PoE
      row reads "Ports 11 and 12 of each line card are PoE++ ports", so the twelve BNC jacks
      are a card in a slot and not part of the chassis. The GLB agrees: the card
      (GL24XB_ASM, a 269.5 x 170.8 board behind its faceplate) and the blank (GL24X-DANGPAN)
      are their own assemblies, each held by a captive thumbscrew at each end. The GL-12xB
      ships the card in the upper slot and the blank in the lower (datasheet photograph,
      product render and GLB all agree); the GL-24xB datasheet lists 24 ports on the same
      chassis, which is the second card.
  poe-polarity:
    confidence: datasheet
    note: >-
      datasheet, and probably copied - the PoE row of this BNC model's sheet reads "(F center
      pole: DC-, F shield: DC+)", the wording of the F-type GL-12xC sheet. On a BNC jack it
      can only mean the centre contact is DC- and the shell DC+; recorded as printed rather
      than corrected, since the polarity is a fact about the port and nothing held states it
      in BNC terms.
  silkscreen:
    confidence: drawing
    note: >-
      drawing - the GLB carries the panel legends as flat meshes on the plate, so their
      positions are measured off a 12 px/mm render: SYS/PWR/ALM/SYNC left-aligned at x 18.0,
      each baseline 1.1 below its lamp's centre, cap height 2.8; CONSOLE and USB on baseline
      41.0; SYNC with its two bracket arms (verticals at x 66.0, arms to 71.25 at y 12.1 and
      28.2); OUT on 5.0 and IN on 37.9; SFP+2 on 6.9 and SFP+1 on 39.8; GE2 on 5.0 and GE1 on
      39.8. Six of these sit off their part's centre and L61 says so, and the offsets are the
      CAD's, not slips: CONSOLE 1.66 left of the console jack, USB 1.35 right of the USB-C,
      SFP+2 and SFP+1 0.78 left of the cage, GE2 and GE1 1.02 left of the RJ45 openings (each
      word is centred on its own print block, which is not the connector's centre on this
      panel); they stay where the GLB and the product render put them. The ReadyLinks wordmark is not a mesh (it is a texture); it is placed from the
      product render at 3.616 px/mm (x 14.4 to 48.7, baseline about 9.7, cap height
      about 4.5) and drawn as plain text, not in the vendor's bold face. The wireless-arc mark above it is not drawn (no vendor logos); the logo-zone
      region reserves it.
  serial-label:
    confidence: photo-measured
    note: >-
      photo-measured - a white QR and serial sticker on the right panel, 19.7 x 19.8 at
      (415.6, 12.6), read off the product render at 3.616 px/mm (the GLB's right panel is
      untextured). Drawn as a plain label plate with placeholder blocks where the code and
      the serial string are; neither is transcribed.
  port-leds:
    confidence: drawing
    note: >-
      drawing - status lamps are 3.0 mm lenses in the GLB (LED_4_1), drawn with common/led-dot@1
      (2.0), the library's round lamp and the one the GL-8xEP uses; the diameter delta is
      recorded here. The SFP light pipes are triangles in the render, the left pointing down
      and the right up, so the left serves SFP+1 below and the right SFP+2 above; drawn with
      common/led-arrow-sm@1, down and up. The GbE lamps are the corner lamps of
      common/rj45-ganged-eth@1, which is where the GLB puts them (in the shell corners on each
      jack's keyway side).
  stack-orientation:
    confidence: drawing
    note: >-
      drawing - the GLB shows the upper RJ45 (GE2) keyway up and the lower (GE1) keyway down,
      so GE2 turns 180; the SFP+ pair follows the library's belly-to-belly rule (upper at 0,
      lower at 180), which the GLB's single stacked cage with its lamp band between the two
      openings matches. The console jack's latch slot is at the bottom.
  rear-layout:
    confidence: drawing
    note: >-
      drawing - measured off the GLB rear (x from the left as seen from behind). Two C14
      inlets on screw flanges (POWER_1, 50.0 x 22.5, screws 40 apart), the keyed shroud
      centred at (34.92, 29.47) and (404.45, 30.17); a 21 x 15 rocker switch above each
      (KAIGUAN_1) at (23.9, 2.4) and (394.7, 1.8); two six-pole headers (6P_FANFENGHUANG) at
      x 182.1 and 225.5, y 26.8 to 35.4, with latch posts to 24.3; a 3.4 mm hole at (360.0,
      32.5). The datasheet photograph names them "Primary power" (left), "Secondary power"
      (right) and "DC power stacking ports", and shows what the GLB omits: ON and OFF either
      side of each switch, -48V and -48VRTN under each header, an earth mark at about x 349.7
      and a hex nut on a stud in the hole, read at about 3.0 px/mm. The cord-retention bails
      over each inlet (SUS-DIANXIANKOU) are cable management and are not drawn.
  side-layout:
    confidence: drawing
    note: >-
      drawing - each side wall carries five round fan grilles, 40 holes about 3.9 across in
      a 32.8 circle centred 22.3 down, with the fans' screws at two opposite corners, 16 mm
      from the centre each way. Centres on the RIGHT view (x = 0 at the front) 53.75,
      102.73, 152.73, 213.73, 259.73; on the LEFT view (x = 0 at the rear) 40.25, 86.25,
      147.25, 197.25, 246.23, which is the right side mirrored (depth - x) to 0.1 mm. The
      holes are drawn with the library's `holes` pattern at a 5.2 pitch clipped to the
      circle, which gives the density and extent but not the rings of the real grille.
  top-layout:
    confidence: drawing
    note: >-
      drawing - the lid (GL24X-1U-001B) is one flat 427.5 x 293.8 sheet between the tops of
      the side walls, from 6.2 to 433.8 across and 6.25 to 299.95 from the rear (y = 0 is the
      REAR, the library's top-view convention); no opening, label or fastener shows on it in
      an orthographic render of the GLB from above. No held photograph shows the top of this
      model: the datasheet's three-quarter view is of a twisted-pair sibling (two RJ45
      cards, G1 to G12 each), and its lid is plain as well.
  bottom-layout:
    confidence: drawing
    note: >-
      drawing - sixteen screw heads (about 5.5 across; common/screw-head@1 is 3.6) found as
      bright discs in an orthographic render of the GLB underside at 6 px/mm. Axis
      convention: y = 0 is the REAR as on the top view, and x is mirrored because the face
      is seen from below (x = 0 is the chassis's right side as seen from the front).
  power:
    confidence: datasheet
    note: >-
      datasheet - "Maxpower consumption 80W (Excluding PoE output)" is power-self-max-w; "Total
      available PoE 240W (Using dual power) 90W (Using single power)" is the PoE budget; "Power
      supply AC/DC, internal, (2) 300W"; "Power input 100-240V AC, 50/60 Hz 48-56VDC". The
      sheet gives no figure for the box at full PoE load, so power-max-w is not stated; the
      two figures are not added together here. The two supplies are inside (the GLB has two
      RPS-300 boards behind the inlets) and are not field-replaceable, so they are not bays.
  cooling:
    confidence: drawing
    note: >-
      drawing - ten 40 x 20 mm fans (40X20_1), five behind each side-wall grille, so the air
      moves side to side. Which side takes air in is stated nowhere held.
  lifecycle:
    confidence: datasheet
    note: >-
      the catalogue API lists the GL-12xB-240D as a current product (created 2026-04-09) and
      the datasheet is dated 2026-07-27; no end-of-life notice was found on the vendor's site.
attrs:
  physical:
    weight-max-kg: 4.5
    weight-note: 'datasheet "<10lbs"'
    enclosure: Metal
    overall-dimensions: >-
      12 x 19 x 1.75 in with the ears (datasheet; its mm column reads 305 x 228.6 x 44.45,
      the 228.6 a slip for 482.6); body modelled from CAD 440 x 45.0 x 300.1
  performance:
    switching-capacity: 128 Gbps
  power:
    power-self-max-w: 80
    power-self-scope: excluding PoE output
    poe-budget-w: 240
    poe-budget-scope: using dual power; 90 W using single power
    poe-per-port: 'max per PSE: PoE 15.4 W, PoE+ 30 W, PoE++ 90 W; ports 11 and 12 of each line card are PoE++'
    power-input: 100-240V AC, 50/60 Hz; 48-56VDC
    power-supply: AC/DC, internal, (2) 300W
  thermal:
    cooling: ten 40 x 20 mm fans behind the side-wall grilles, five per side
  environmental:
    operating-temp-c: 0 to 40
    operating-humidity: 10 to 90 percent noncondensing
  features:
    optics-sfp-plus: 'vendor optics line per the ReadyLinks Optics datasheet: SFP-1/10G-MM, SFP-1/10G-SM, SFP-1/10G-SM-SF-23 and -SF-32 (BiDi) 1/10G transceivers; no third-party support statement published'
    layer-2: >-
      IGMP snooping; STP/RSTP with priorities and port-level disable; port isolation; storm
      control; voice VLAN; port mirroring; LACP; multicast/broadcast rate limiting; MAC
      blocking; flow control; 802.1X; jumbo frames; proprietary loop protection; DHCP
      snooping/guarding; egress rate limit; LLDP-MED; port restricted by MAC; device
      isolation with ACLs
    layer-3: DHCP server; IP routing; static routing between local networks; network isolation with ACLs
  management:
    interfaces: ReadyView, Ethernet/Fiber In-Band, Ethernet/Fiber Out-of-Band
    button-functions: factory reset
  lifecycle:
    eol: none-announced
chassis:
  width: 440.0
  height: 45.0
  depth: 300.1
  ru: 1
  color: '#141619'
  edge: '#0c0d0f'
  silk: '#e9ecef'
  airflow: side
gaps:
- what: sync-signal
  scope: [sync-out, sync-in]
  reason: vendor-silent
  wanted: >-
    What the SYNC OUT and IN BNC jacks carry (a 1PPS, a 10 MHz reference, a ReadyLinks
    stacking clock) and at what impedance. The datasheet names them "(2) BNC sync ports" in
    its panel figure and nowhere else; the catalogue API and the product page are silent.
- what: usb-function
  scope: [usb]
  reason: vendor-silent
  wanted: What the front USB-C port is for (console, storage, power); the datasheet's panel figure does not call it out and no other held text names it.
- what: led-meanings
  scope: [status-leds, sfp-leds]
  reason: vendor-silent
  wanted: >-
    What SYS, PWR, ALM and SYNC and the port lamps show in each colour. No held document has
    an LED table; the colours drawn are the GLB's and the render's.
- what: line-card-part-numbers
  scope: [slot-1, slot-2]
  reason: vendor-silent
  wanted: >-
    Orderable part numbers for the 12-port BNC line card and the slot blank, and whether a
    card is sold on its own. The datasheets, catalogue API and product pages name only whole
    switches.
- what: airflow-direction
  scope: [right, left]
  reason: vendor-silent
  wanted: Which side wall takes air in and which exhausts; the fans sit behind both walls and no held document says.
groups:
  line-cards:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      the two line-card slots, upper then lower ("(2) Line card slots" in the datasheet's
      panel figure). The GL-12xB fits the 12-port BNC card in slot 1 and a blank in slot 2.
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the two 10G SFP+ uplinks, SFP+1 below SFP+2 in one stacked cage.
  gbe:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two GbE RJ45 ports, GE1 below GE2 in one stacked shell.
  sync:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: coax-bnc}
    description: >-
      the two BNC sync jacks, OUT above IN, under one SYNC bracket - timing between units
      rather than traffic; what signal is not published (gap sync-signal).
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the local craft connectors on the fixed panel - the RJ45 CONSOLE and the USB-C beside
      it - how the box is reached without the network.
  buttons:
    term: Button
    role: management
    index-origin: 1
    description: the recessed factory-reset button (datasheet "Button - Factory reset").
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: SYS, PWR, ALM and SYNC, top to bottom at the left of the panel.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the two triangle lamps in the band between the SFP+ openings.
  power-in:
    term: Power input
    role: service
    index-origin: 1
    attrs: {inlet: c14}
    description: the primary (left, from behind) and secondary (right) AC inlets, one per internal 300 W supply.
  power-switches:
    term: Switch
    role: service
    index-origin: 1
    description: the rocker above each inlet that switches its supply.
  dc-stack:
    term: Power input
    role: service
    index-origin: 1
    description: the two six-pole "DC power stacking ports" (-48V and -48VRTN), the 48-56 V DC input.
  grounding:
    term: Ground
    role: furniture
    index-origin: 1
  furniture:
    term: Screw
    role: furniture
    index-origin: 1
    description: the two flange screws of each inlet.
  fan-screws:
    term: Screw
    role: furniture
    index-origin: 1
    description: the fan-mounting screws at two corners of each side grille.
  base-screws:
    term: Screw
    role: furniture
    index-origin: 1
