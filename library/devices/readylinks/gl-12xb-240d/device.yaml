      The GL-x chassis with both line-card slots blanked - the library's base, a chassis with
      nothing decided about traffic cards.
    bays:
      slot-1: readylinks/gl-x-lc-blank@1
      slot-2: readylinks/gl-x-lc-blank@1
  as-sold:
    kind: orderable
    description: >-
      The GL-12xB-240D as sold: the 12-port BNC line card in slot 1 and a blank in slot 2.
    source: >-
      sourced - the datasheet's panel figure, the product render and the vendor GLB all show
      the card in the upper slot and a plain plate in the lower.
    part-numbers:
      GL-12xB-240D: {}
    bays:
      slot-1: readylinks/gl-x-lc-12xb@1
      slot-2: readylinks/gl-x-lc-blank@1
