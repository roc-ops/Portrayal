    kind: orderable
    description: >-
      The GL-24xC-P600D as sold: the 12-port F-type line card in each slot.
    source: >-
      sourced - the data sheet lists "(24) PoX+ ReadyLink ports (F Connector)" and its panel
      figure shows two rows; the vendor's 3D model of the GL-24xC and the product render both
      show a card in each slot and no blank.
    part-numbers:
      GL-24xC-P600D: {}
