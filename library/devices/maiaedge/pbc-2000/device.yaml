      - {ref: common/qsfp-cage@2, id: port-2, at: [62.1, 19.26], group: qsfp28, rel-pos: 2}
      # THE BARE RECEPTACLE, NOT THE BEZELLED ONE, and the white USB 2.0 tongue -
      # see provenance `usb`
      - {ref: std/usb-a@1, id: usb, at: [257.55, 26.33], rotate: 90, skin: usb2, group: mgmt, rel-pos: 1}
      - {ref: common/led-dot@1, id: status-1, at: [34.95, 18.85], for: chassis, group: furniture, rel-pos: 4}
      - {ref: common/led-dot@1, id: status-2, at: [34.95, 21.1], for: chassis, group: furniture, rel-pos: 5}
