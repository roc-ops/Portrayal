format: 1
kind: device
name: pbc-2000
version: 7.0.0
maturity: modelled
manufacturer: MaiaEdge
model: PBC-2000
description: >-
  MaiaEdge Path Border Controller - a 1RU appliance that merges L2 switching and L3
  routing to provision deterministic private Ethernet paths over any underlying
  transport, with line-rate AES-256-GCM IPsec. Two 100GbE QSFP28 ports on the front
  beside a console and two management jacks, behind a built-in bezel, with a touch screen
  beside it; two hot-swap 550W supplies and a one-piece five-fan tray on the back,
  front-to-back.
profile: networking
provenance:
  model-number:
    confidence: datasheet
    note: >-
      vendor documentation - www.maiaedge.io/getting-started (getting-started.pdf), Safety
      Information: "The PBC-2000 is equipped with two redundant AC power inputs." THE DATASHEET
      AND THE MANAGEMENT UI BOTH SAY ONLY "PBC", which is what this device was first modelled as;
      the setup guide is the only source held that gives the number. A DCIM reads `model` as the
      identity, so it is the number and not the family.
  size:
    confidence: datasheet
    note: >-
      datasheet - MaiaEdge-PBC-PCE-Datasheet-v3.pdf page 3, "Chassis (H x W x D) 1.625 x 17.24 x
      11.46 in" = 41.27 x 437.90 x 291.08 mm. THE ROW BELOW IT, "Total (With Ears and Tabs) 1.625
      x 19.02 x 12.13 in", is NOT the chassis and is not modelled: 19.02 in is 483.11 mm, the rack
      face including the ears, and L43 exists because a device was once modelled wearing its
      flanges.
  cutouts:
    confidence: registry
    note: >-
      registry - each opening is the APERTURE the component declares, not the component's outline:
      common/qsfp-cage@2 is 19.5 x 10.18 of metal around an 18.5 x 9.58 hole offset (0.425, 0.0)
      into it, and a USB-A is 17.0 x 9.3 around a 12.0 x 4.5 hole at (2.5, 2.4). The first draft
      punched the outlines and test_cutout_derivation caught all three. common/qsfp-cage@2 draws its
      flange on the belly side, at the bottom of the upright cage, since 2.1.0, so the two cages'
      at moved 0.15 right and 0.6 down to keep the openings where they were measured; single cages
      stay upright (docs/pluggables-3d-design.md, S3), which is the rule and not a reading The numerals and
      100G legends, which were centred on the cage boxes, moved with them.
  numbering:
    note: >-
      MaiaEdge's own management UI (working/intake/maiaedge/pbc/renders/ui-port-view.png) numbers
      the two 100G ports 0 and 1, so the group is index-origin 0, and captions them 100G. It
      captions MGMT and CTRL 1G and CON not at all, and - independently of L76 - DRAWS CON AS A
      DIFFERENT JACK from the other two, which is the console-versus- Ethernet split the rule had
      already forced. A UI view is a schematic: it is taken here for what is on the face, in what
      order, and what the vendor calls it. No coordinate comes from it.
  jacks:
    note: >-
      L76 and docs/rj45-family-design.md settle which part each jack is: an Ethernet jack is
      common/rj45-eth@1 and a console or timing jack is std/rj45@2. CON is the console, so it is
      the std part; MGMT and CTRL are the two 1GB management ports the datasheet counts, so they
      are the Ethernet part. All three were std/rj45@2 in the first draft and the rule caught it.
      THE TWO ETHERNET JACKS ARE FITTED TAB UP and the console jack is not: the photograph reads
      MGMT's and CTRL's contacts along the bottom of the opening with the latch slot above, and
      CON's the other way about. Declared as rotate 180, because a jack fitted the other way up is
      the same jack turned over rather than a reflection of it, and its lamps really do change
      sides.
  usb:
    note: >-
      the bare std/usb-a@1 receptacle, not the bezelled common/usb-a-bezel@1. That part wraps the
      opening in a silver plate spanning the component so it can abut its neighbours' bezels,
      which is the S9510-28DC's face; here the photograph shows a narrow slot straight through the
      faceplate with no plate around it. THE TONGUE IS WHITE BECAUSE THE PORT IS USB 2.0: page 3
      says "1x USB 2.0", and USB-IF colours the Type-A insulator by what the port is - white for
      2.0, blue for 3.0. The part could only draw the blue one, so it grew a `usb2` skin and this
      device asks for it. The photograph agrees as far as it can: the slot shows a pale tongue
      against a dark opening, and nothing blue.
  ports:
    confidence: datasheet
    note: >-
      datasheet page 3 - "Dual 100GbE Ethernet (QSFP28)", "2x 1GB RJ45" management, "1x USB 2.0",
      "RJ45 115.2 kbps" console. Confirmed on the hardware: the front photograph reads the three
      jacks' own silkscreen as CON, MGMT and CTRL, which is the console plus the two management
      ports the table counts. AND NOW STATED BY THE VENDOR IN PROSE, which is better than either:
      the setup guide (www.maiaedge.io/getting-started) describes the face directly - the front
      has "two windows where the ports are exposed"; the lefthand window has "two 100G interfaces,
      numbered 0 and 1 from left to right"; and in the righthand window, "from left to right,
      you'll find a USB port (not currently used), a serial console port, a 10/100/1000 management
      port, and a 10/100/1000 control port". It calls MGMT "the PBC's center management port" and
      CTRL "rightmost port in the right window". Every one of those matches what was modelled from
      the photograph and the UI view; the ORDER of this face is no longer an inference. The
      vendor's own word for the octagonal cutouts is `window`, which is what the decor already
      calls them. Note the guide rates the two jacks 10/100/1000 where the table says 1GB, and
      calls the USB port NOT CURRENTLY USED.
  bezel:
    confidence: estimated
    note: >-
      ESTIMATED shape, from photographs and the maintainer's account of the hardware
      (2026-09-21), and since v5 photo-measured in plan. The front is a BUILT-IN BEZEL standing
      about 11 mm off the faceplate, from the left edge to the touch screen, with the two
      OCTAGONAL windows cut through it: the
      octagons frame the faceplate behind, where the ports are. It is flat only across the
      band level with the windows' vertical ends, and slopes back to the faceplate above and
      below. That plate is maiaedge/pbc-2000-bezel@2 and its own provenance carries the
      figures. v3 drew the slope as shading on a flat face; the window walls are the amber
      bead, which is what looking into a window shows.
      THE OCTAGONS ARE NOT REGULAR: the face-on photograph puts each chamfer at about 19 mm
      across for 13 down, where `shape: octagon` cuts 45 degrees. So the windows are no longer
      decor shapes at all - they are holes in the bezel's own art, drawn to the measured
      corners.
  louvres:
    confidence: photo-measured
    note: >-
      photo-measured - eight rows of horizontal slots in each window, 3.85 mm apart, in columns
      about 25.4 mm apart (left window) and 24.6 (right) with ribs about 2.5 mm wide between
      them. THE SLOTS STOP AT THE PORTS: full-width rows run above and below the ports, and
      beside and between the ports and jacks there are only short slots in the gaps. The counts
      v4 carried (eight by five) were right; the pitch, the slot width and the gaps were not
      measured until the face-on photograph.
  port-lamps:
    note: >-
      field knowledge (the maintainer, 2026-09-15) - ONE lamp per 100G port - and the face-on
      photograph now rules out where v4 drew it: above each cage is the printed "0" and "1", and
      there is no lamp there. The one lit opening near the ports is the slot left of port 0, in
      which the vendor's UI view draws a column of four lamps; those four are placed in it. Two
      of them may be the port lamps the maintainer counts, but nothing says which, so all four
      carry `for: chassis` and the separate port lamps v4 drew are gone. See gaps
      `front-indicator-meanings`.
  layout:
    confidence: photo-measured
    note: >-
      photo-measured - working/intake/maiaedge/pbc/photos/pbc-front-faceon.jpg (the maintainer,
      2026-09-21), the first square-on view of this face, which closed the `front-face-positions`
      gap v4 carried. Deskewed 0.93 degrees and scaled PER AXIS: 4.004 px/mm across on the
      smooth body between the textured ears (437.9 mm), 4.139 down on the face's own edges
      (41.27). The 3.4% between them is the photograph's aspect, not the hardware's; the vertical
      figure checks against the USB opening's standard 12.0 mm to 2.5%. Read on those scales:
      the windows (see maiaedge/pbc-2000-bezel@2), the two 100G cages at x 40.35 and 61.95 - a
      21.6 mm pitch, not abutting as v4 drew them - with "0"/"1" printed above and "100G" below;
      the status slot at x 34.3 to 37.6; the USB opening at x 261.3; CON, MGMT and CTRL centred
      at 289.45, 316.15 and 342.35 on a 26.3 mm pitch (v4 had 35.7), each captioned above and
      the two Ethernet jacks "1G" below; the touch screen at x 373.5 to 416.9. EVERY FRONT
      POSITION v4 CARRIED WAS WRONG by 5 to 25 mm, which is what "estimated" meant.
  jack-height:
    confidence: photo-measured
    note: >-
      THE JACKS ARE DRAWN 1.1 MM HIGHER THAN THE PHOTOGRAPH PUTS THEM, deliberately. The
      photograph shows each jack's opening 10.3 mm tall between its caption above (y 20.1 to
      22.7) and "1G" below (y 35.1 to 36.6); the library's RJ45 parts are the 13.2 mm housing,
      which cannot fit between the two captions. The housing is set with its foot on the "1G"
      line at y 35.0, and the three captions above are lowered 1.1 mm to clear it. The opening
      the housing frames is where the photograph shows the jack to within that.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - working/intake/maiaedge/pbc/photos/pbc-rear-faceon.jpg, square to the
      rear and out of the rack. Scaled per axis: 4.137 px/mm across on the body's 437.9 mm (x 98
      to 1910), 3.925 down on its 41.27; the scale checks against a part of known width, each
      supply's cage reading 74.9 and 73.6 mm against the CRPS module's 73.5. Left to right: a
      steel strap with the ground stud (x 0 to 17.5), supply 1 (cage 17.8 to 92.7), a steel
      strap (92.7 to 107.3), supply 2 (107.3 to 180.9), and the fan tray from 182.1 to the right
      edge. THE POSITIONS v4 TOOK FROM pbc-rear-b.jpeg WERE WRONG by up to 14 mm - in the rack,
      the side rails widened what was taken for the chassis. The whole rear is bare steel. The
      supplies and the fan tray are field-replaceable, each in its own bay; the supplies are
      maiaedge/psu-550w@1, whose face - handle along the foot, inlet in a black
      shroud, a purple latch tab standing straight out of the face - is drawn from the fitted
      modules; it is very probably a Gospower G1251-0550WN, the family common/psu-550w@2 also is
      (see that part's `identity`).
  power:
    confidence: datasheet
    note: >-
      datasheet page 3 - "Internal: AC, DC" with "Redundant Power Supply: Yes". The 550W
      per-supply figure is photo-measured: both modules carry a blue 550W label. The datasheet
      states no chassis draw, so none is recorded and L27 stands.
  thermal:
    confidence: datasheet
    note: >-
      datasheet page 3 - "Internal fan-based forced-air cooling. Front-to-Back (F2B) - intake at
      front bezel / port side, exhaust at rear (fan/PSU side)."

attrs:
  physical:
    weight-kg: 4.31
  performance:
    throughput: dual-100gbe
    latency-overhead-us: 2
  power:
    input: ac-or-dc
  features:
    encryption: aes-256-gcm-ipsec
    redundancy: 1+1
  thermal:
    airflow: front-to-back
  environmental:
    operating-temp-c: '0 to 50'
    storage-temp-c: '-40 to 70'
  lifecycle:
    eol: none-announced
chassis: {width: 437.9, height: 41.27, depth: 291.08, ru: 1, color: '#1b1e21'}
gaps:
- what: psu-identity
  scope: [rear]
  reason: needs-photo
  wanted: a photograph of one supply's rating label - it is on the module's body, so pull one supply to take it.
  note: >-
    The supplies are very probably Gospower G1251-0550WN-series 550 W CRPS modules taking AC
    or high-voltage DC through one inlet - a visual match on every feature against that
    module's photographs (see maiaedge/psu-550w@1's `identity`), and the Port Extender
    datasheet's "100-240VAC or 180-300VDC" is that module's range. But no document names the
    part, so its model is not recorded and no -48 V DC option is modelled or known.
- what: front-indicator-meanings
  scope: [front]
  reason: vendor-silent
  wanted: an LED table, or a photograph of the unit powered up with the transceivers out.
  note: >-
    WHAT THE LAMPS MEAN IS UNKNOWN. The slot left of port 0 is one light-pipe opening
    (photographed square-on), and the vendor's UI view draws four lamps in a column there;
    all four carry `for: chassis`. The maintainer counts one lamp per 100G port, and the
    photograph shows no lamp anywhere else near the ports, so two of the four are probably
    those - but nothing says which, and an invented mapping would be worse than none. The
    chassis status lamp on the bezel beside the right window is modelled. Red and green points
    seen through the louvres in the rack photograph are internal board LEDs and are
    deliberately not drawn. The touch screen is maiaedge/pbc-2000-lcd@2 and what it shows is
    software.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: >-
    photographs of the lid, the underside and either flank out of the rack. The unit
    was shot in service with a device directly above it.
  note: >-
    These four faces draw the chassis envelope and nothing else. The envelope itself is
    not a guess - 437.90 x 291.08 x 41.27 is dimensioned on page 3 of the datasheet -
    but no source held shows what is ON any of them: no vent field, no label, no screw
    pattern, no rail. The flat rect asserts the box and claims nothing about its
    surface, which is what lets the device carry a rack elevation and a 3D box without
    inventing detail.
- what: chassis-power-draw
  reason: vendor-silent
  wanted: a chassis draw or input figure from MaiaEdge.
  note: >-
    The datasheet states the supply configuration and no chassis draw figure, so none
    is recorded. L27 stands, and the chassis total is a floor rather than a total.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the console and the two out-of-band management jacks, which share a bezel
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'datasheet page 3, "Redundant Power Supply: Yes"; the setup guide, "equipped with two redundant AC power inputs"'}
  fans: {term: Fan, role: service, index-origin: 1}
  displays: {term: Display, role: indicator, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
