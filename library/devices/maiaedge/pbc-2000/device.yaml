      - {ref: std/rj45@2, id: con, at: [281.55, 21.8], group: mgmt, rel-pos: 2}
      # THE TWO ETHERNET JACKS ARE FITTED TAB UP - the latch slot is at the top
      # of the opening and the contacts along the bottom in the face-on
      # photograph, the console jack the other way about. A jack fitted the other
      # way up is the same jack turned through 180 degrees, not a reflection.
      - {ref: common/rj45-eth@1, id: mgmt, at: [308.25, 21.8], rotate: 180, group: mgmt, rel-pos: 3}
      - {ref: common/rj45-eth@1, id: ctrl, at: [334.45, 21.8], rotate: 180, group: mgmt, rel-pos: 4}
      # THE TOUCH SCREEN, as a part rather than paint - see gaps `front-indicator-meanings`
      - {ref: maiaedge/pbc-2000-lcd@2, id: display, at: [372.6, 2.8], for: chassis, group: displays, rel-pos: 1}
