format: 1
kind: device
name: port-extender
version: 2.0.0
maturity: modelled
manufacturer: MaiaEdge
model: Port Extender
description: >-
  MaiaEdge Port Extender - a 1RU switch sold to expand a Path Border Controller's
  physical port count. 48 SFP28 tenant ports in two rows and 8 QSFP28 fabric uplinks
  on a black face; a bare-steel chassis with 1+1 supplies, four fans and the management
  jacks behind. Its port roles are configured
  from the MaiaEdge portal rather than on the box, which is what distinguishes it from
  the third-party switches that can stand in for it.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      datasheet - MaiaEdge-Port-Extender-Datasheet-v1.pdf page 3, "Dimensions (H x W x D) 44 mm x
      438 mm x 520 mm (1U EIA Rackmount)". NOT the PBC-2000's envelope: that box is 41.27 x 437.90
      x 291.08, so this one is taller and 229 mm deeper, and nothing may be borrowed between them.
  ports:
    confidence: datasheet
    note: >-
      datasheet page 3 - "Tenant Ports: 48 x SFP28 10GbE / 25GbE" and "Fabric Uplink Ports: 8 x
      QSFP28 100GbE". 48 + 8 = 56, WHICH RECONCILES THE TWO PORT COUNTS IN CIRCULATION: the
      marketing copy says "48 ports" and the product documentation calls it "a 56-port switch",
      and both are right.
  port-ids:
    note: >-
      EVERY PORT IS `port-N`, INCLUDING THE EIGHT UPLINKS, and that is not cosmetic. dcim_export
      treats a placement as an interface only when its id starts with `port-`; the first draft
      called the uplinks `uplink-49`..`uplink-56` and the NetBox and Nautobot exports came out
      with 48 interfaces instead of 56, silently. The uplink's ROLE is carried by the part it is
      placed from (common/qsfp28-cage@3, media qsfp28) and by `numbering` below, which is where a
      role belongs - the id carries the number the vendor addresses it by.
  power:
    confidence: datasheet
    note: >-
      datasheet page 3 - "1+1 Redundant, Hot-Swappable PSUs (100-240VAC or 180-300VDC
      auto-ranging)" and "< 500W Maximum (Typical < 350W at 25C)".
  thermal:
    confidence: datasheet
    note: >-
      datasheet page 3 - "3+1 Redundant Fans; Front-to-Back and Back-to-Front configurations
      available". BOTH directions are offered, so no airflow is asserted: the same hole is an
      intake on one SKU and an exhaust on another.

  source-render:
    confidence: drawing
    note: >-
      THE FRONT IS MEASURED OFF THE DATASHEET'S OWN RENDER, which the first model never used.
      MaiaEdge-Port-Extender-Datasheet-v1.pdf embeds a 6000 x 3373 image on page 1 (`pdfimages
      -list` finds it; the staged 800 px marketing render is a different, angled asset), and
      it is square to the face: scaled on the datasheet's 438 mm across (x 610 to 5552 px,
      11.28 px/mm) it reads the face 43.2 mm tall against 44 - 1.8%, the lid showing above.
      Measured per axis: 11.28 px/mm across, 11.07 down. Staged as
      working/intake/maiaedge/port-extender/renders/datasheet-p1-front-render-6000.png.
  positions:
    confidence: drawing
    note: >-
      read off the page-1 render. SFP28: three blocks of eight columns by two rows starting at
      x 5.04, 122.05 and 239.07 on the SFF-8433 14.25 mm pitch, 3.0 mm between blocks; rows at
      y 9.62 and 23.35 (13.73 apart - the first model had 16.4). QSFP28: one block of four
      columns by two rows at x 356.45 on the 19.0 mm ganged pitch, rows at 10.21 and 24.03.
      THE LAMPS SET THE PITCH, NOT THE CAGES: the cage outlines read 14.33 mm apart and the
      lamps on the face beside them 14.25, because the cages stand proud of the face and the
      render's perspective magnifies them about 0.56% more. Corrected for that, every cage
      centre lands on its lamp.
  lamps:
    confidence: drawing
    note: >-
      read off the page-1 render, and it settles what the first model's `tenant-port-lamps`
      gap could not: the round features above and below the SFP rows are LAMPS, one per port -
      dark 2.45 mm lenses with no screw slot, at y 6.96 above each top-row port and 35.76 below
      each bottom-row one, centred on the column. Each uplink has FOUR in a row on a 4.05 mm
      pitch, centred on the port, at y 6.45 and 36.1 - not the two-and-two band
      common/qsfp28-cage@3 draws, which is why that part is no longer fitted
      (maiaedge/port-extender-lane-leds@1 is). What any lamp means is not stated.
  numbering:
    confidence: drawing
    note: >-
      read off the page-1 render: every column is printed "N (up)(down) N+1" on one line
      between the rows - odd port above, even below, 1 to 56 - with the two numerals hugging a
      pair of arrows. That is the column-major numbering the first model derived, now read
      rather than derived, and it agrees with every port number the product documentation
      names (41-44 and 48 among the tenants; 51-56 among the uplinks, a PBC cabled to 51 and
      52). Digits 1.54 mm tall, baseline y 22.23; arrows 1.5 mm each, 0.44 apart, drawn centred
      on their column - the render puts them 0.1 to 0.3 mm left of it, which is inside what it
      can resolve.
  front-vents:
    confidence: drawing
    note: >-
      rectangular slots along both edges: the top row from x 32.6 (past the wordmark) to 428,
      3.9 x 2.0 mm on a 5.02 pitch; the bottom from 5.4 to 432, 2.9 x 1.7 on about 4.0,
      interrupted by screws. `slots-h` draws its slot at a fixed 9/14 of its tile, so the
      slots are drawn somewhat narrower than they are; the pitch and the row are right.
  logo:
    note: >-
      the MaiaEdge mark sits at x 2.9 to 8.3, y 1.4 to 7.0, and IS NOT DRAWN - vendor logos
      are not reproduced (library/components/README.md). The wordmark beside it is set as
      text, white, x 9.7 to 25.9 with its capitals 3.2 mm tall.
  chassis-finish:
    confidence: photo-measured
    note: >-
      the MaiaEdge setup video (Step 5, "Attach Side Rails to the Port Extender", on the
      vendor's YouTube channel) and the maintainer's stills of it: the lid, flanks and rear are
      BARE GALVANISED STEEL, and only the front face is black. The first model drew the whole
      box black.
  rear:
    confidence: estimated
    note: >-
      ORDER OBSERVED, POSITIONS ESTIMATED. The video shows only the right half of the rear, and
      only obliquely at 640 x 360: from the right end, a CRPS supply (a 550W label, a C14 inlet
      with a cord clip), two fan modules (black, honeycomb grille, blue pull handle, red tab),
      and a small panel with two RJ45 jacks stacked one above the other; a third fan starts
      past it. The datasheet completes the inventory - "1+1 Redundant, Hot-Swappable PSUs",
      "3+1 Redundant Fans", and "1 x Rear CPU/BMC Shared Ethernet (RJ45) - 1 x Serial Console
      (RJ45) - 1 x USB Type-A" - and the product documentation puts the management jack "on the
      rear ... center of the device, at the top". So the rear is drawn SYMMETRIC: a supply at
      each end, two fans either side, and the management panel in the middle with the Ethernet
      jack on top. Every coordinate is chosen to fit that inventory into 438 mm with the small
      gaps the stills show. The supply is maiaedge/psu-550w@1, the PBC-2000's: the video shows
      the same face - 550W label, C14 with a cord clip - and the datasheet's input range is that
      part's.
attrs:
  # SECTIONS FOLLOW THE LIBRARY'S, NOT THE DATASHEET'S TABLE. L68 is the rule
  # that knows: `memory` and `storage` are filed under `platform` by 53 and 51
  # other devices, and a second home makes the key unfindable by section. Same
  # for `cpu` (54), `bmc` (41) and `packet-buffer` (41), which is why none of
  # them is spelled the way the datasheet's own rows are.
  performance:
    switching-capacity: 2.0 Tbps
    latency-overhead-ns: 500
    packet-buffer: 32 MB
  platform:
    cpu: Intel x86, up to 8 cores
    memory: 8-32 GB ECC DDR4
    storage: configurable M.2 SSD
    bmc: integrated BMC plane, IPMI 2.0 compliant
  power:
    input: ac-or-dc
    power-max-w: 500
    power-typical-w: 350
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 3+1
    airflow: front-to-back or back-to-front
  environmental:
    operating-temp-c: '0 to 45'
    operating-humidity: 5% to 90% non-condensing
    mtbf-hours: 150000
  lifecycle:
    eol: none-announced
chassis: {width: 438.0, height: 44.0, depth: 520.0, ru: 1, color: '#a9adb1'}
gaps:
- what: psu-identity
  scope: [rear]
  reason: needs-photo
  wanted: a photograph of one supply's rating label - it is on the module's body, so pull one supply to take it.
  note: >-
    The supplies are very probably Gospower G1251-0550WN-series 550 W CRPS modules taking AC
    or high-voltage DC through one inlet - a visual match on every feature against that
    module's photographs (see maiaedge/psu-550w@1's `identity`), and the Port Extender
    datasheet's "100-240VAC or 180-300VDC" is that module's range. But no document names the
    part, so its model is not recorded and no -48 V DC option is modelled or known.
- what: rear-positions
  scope: [rear]
  reason: needs-photo
  wanted: a face-on photograph of the rear, or a mechanical drawing of it.
  note: >-
    EVERY REAR POSITION IS ESTIMATED, and the left half is inferred. The setup video shows
    the right half obliquely and never the left; the order drawn - supply, two fans,
    management panel, two fans, supply - is the right half observed and mirrored, which the
    datasheet's inventory (two supplies, four fans) and the documentation's "center of the
    device" management jack both support but do not prove. The fan module's size, the
    supplies' faces and the USB port's place on the panel are all unmeasured. Tracked with
    the maintainer's pending photographs.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: square-on photographs of the lid, the underside and a flank.
  note: >-
    These faces draw the envelope, in the bare steel the video shows, and nothing on it. The
    envelope is dimensioned - 44 x 438 x 520 on page 3 of the datasheet. The video shows what
    is on the lid - two recessed finger pulls, a product label near the middle and a yellow
    warning sticker at the rear right corner - but only obliquely, so none of them is placed.
groups:
  # ONE GROUP, BECAUSE THE VENDOR NUMBERS ALL 56 IN ONE SPACE. The documentation
  # addresses tenant ports 41-48 and uplinks 51-56 without ever restarting the
  # count, so the uplinks are 49-56 and not 1-8 of their own group. `index-origin`
  # takes only 0 or 1, which is the schema saying exactly this: a group's numbering
  # starts at its first port, and a second group would have to start again. So the
  # blocks that generate them share the group, and each port carries its media in
  # its own attrs.
  ports:
    term: Port
    role: traffic
    index-origin: 1
    mixed: >-
      48 SFP28 tenant ports and 8 QSFP28 fabric uplinks, numbered 1-56 in one space.
      The media differ and the numbering does not, so each port carries its own media
      and speed rather than taking them from the group.
    description: >-
      A tenant port's ROLE is set from the MaiaEdge portal rather than on the box -
      Customer, Internal Fabric (INNI), External Fabric (ENNI), MaiaConnect or Internet
      (DIA) - which is what the documentation says distinguishes this switch from the
      third-party ones that can stand in for it.
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the CPU/BMC shared Ethernet jack, the serial console and the USB port on the rear panel
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'datasheet page 3, "1+1 Redundant, Hot-Swappable PSUs"'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: 3+1, redundancy-note: 'datasheet page 3, "3+1 Redundant Fans"'}
  furniture: {term: Part, role: furniture, index-origin: 1}
