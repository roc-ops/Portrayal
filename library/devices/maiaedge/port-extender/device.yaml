      - {id: faceplate, at: [0.0, 0.0], size: [438.0, 44.0], fill: '#25292e', kind: bezel}
      # A VENT STRIP ABOVE AND BELOW THE PORT FIELD, both running nearly the full
      # width. Their EXTENT is read off the render; their height is not, because the
      # face is foreshortened in it.
      # `slots-h` is a 14 x 8 tile, so a 2.2 mm strip showed less than a third of one
