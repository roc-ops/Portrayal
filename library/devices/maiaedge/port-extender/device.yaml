format: 1
kind: device
name: port-extender
version: 0.1.1
maturity: modelled
manufacturer: MaiaEdge
model: Port Extender
description: >-
  MaiaEdge Port Extender - a 1RU switch sold to expand a Path Border Controller's
  physical port count. 48 SFP28 tenant ports in two rows and 8 QSFP28 fabric uplinks
  on the front; 1+1 supplies and a 3+1 fan tray behind. Its port roles are configured
  from the MaiaEdge portal rather than on the box, which is what distinguishes it from
  the third-party switches that can stand in for it.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      datasheet - MaiaEdge-Port-Extender-Datasheet-v1.pdf page 3, "Dimensions (H x W x D) 44 mm x
      438 mm x 520 mm (1U EIA Rackmount)". NOT the PBC-2000's envelope: that box is 41.27 x 437.90
      x 291.08, so this one is taller and 229 mm deeper, and nothing may be borrowed between them.
  ports:
    confidence: datasheet
    note: >-
      datasheet page 3 - "Tenant Ports: 48 x SFP28 10GbE / 25GbE" and "Fabric Uplink Ports: 8 x
      QSFP28 100GbE". 48 + 8 = 56, WHICH RECONCILES THE TWO PORT COUNTS IN CIRCULATION: the
      marketing copy says "48 ports" and the product documentation calls it "a 56-port switch",
      and both are right.
  arrangement:
    confidence: photo-measured
    note: >-
      photo-measured (COUNT ONLY) from the product render. The SFP28 field is TWO ROWS of 24
      columns, ganged in three blocks of eight; the QSFP28 field is two rows of four, in one block
      at the right-hand end, with visibly wider cages. Counted at 6x on the render, and the counts
      close against the datasheet exactly - 3 x 8 x 2 = 48 and 4 x 2 = 8. Nothing else comes from
      that image: see `positions`.
  port-ids:
    note: >-
      EVERY PORT IS `port-N`, INCLUDING THE EIGHT UPLINKS, and that is not cosmetic. dcim_export
      treats a placement as an interface only when its id starts with `port-`; the first draft
      called the uplinks `uplink-49`..`uplink-56` and the NetBox and Nautobot exports came out
      with 48 interfaces instead of 56, silently. The uplink's ROLE is carried by the part it is
      placed from (common/qsfp28-cage@3, media qsfp28) and by `numbering` below, which is where a
      role belongs - the id carries the number the vendor addresses it by.
  numbering:
    note: >-
      derived, AND THE DOCUMENTATION CORROBORATES EVERY NUMBER IT NAMES. Ports run column-major,
      top then bottom, so column N carries ports 2N-1 and 2N - the arrangement std/sfp-ganged's
      other two-row users already draw. That puts column 21 at 41/42, column 24 at 47/48, and the
      four uplink columns at 49/50, 51/52, 53/54 and 55/56. prod.maiaedge.io/docs names ports 41,
      42, 43, 44 and 48 among the tenant ports and 51, 52, 53, 54, 55 and 56 among the uplinks,
      and cables a PBC's two 100G interfaces to 51 and 52 - one uplink COLUMN. Every number it
      uses falls where this scheme puts it. The scheme is still derived rather than read off the
      metal.
  positions:
    confidence: estimated
    note: >-
      ESTIMATED, AND THE WORD IS EXACT. The only image of this face is a marketing render, and it
      is not orthographic - the lid is visible, so the face is foreshortened vertically. Its
      HORIZONTAL proportions are usable and were checked: the cage pitch reads 22.2 px against a
      faceplate scaled on the datasheet's 438 mm, which is 14.0 mm against std/sfp-ganged's
      measured 14.25 - 2% out, so the standard pitch is what is placed rather than the reading.
      NOTHING VERTICAL COMES FROM THE RENDER. The two rows are centred on the face and the row gap
      is chosen, not measured.
  pitch:
    confidence: registry
    note: >-
      registry - 14.25 for the tenant ports (std/sfp-ganged@1, SFF-8433 port pitch) and 19.0 for
      the uplinks (common/qsfp28-cage@3's measured ganged pitch). The blocks then fill the face
      exactly: 4.0 margin + 3 x 114.0 + two 3.0 gaps + a 6.0 gap + 76.0 + 4.0 margin = 438.0. That
      the arithmetic closes on the datasheet width is a check, not a measurement - the margins and
      gaps were chosen to make it close.
  lint-l39:
    note: >-
      EIGHT L39 WARNINGS ON THIS DEVICE ARE roc-ops/Portrayal#248, NOT A DEFECT HERE. The rule
      checks that a part sits centred in its own opening; common/qsfp28-cage@3's aperture
      deliberately does not, because the lamp band occupies the top 3.4 mm of the part and the
      hole sits under it. The cutouts here are the component's own declared aperture, offset
      (0.25, 4.2) into it, which is what `cutouts` provenance requires. Do not "fix" them by
      centring - that would punch the hole in the wrong place to quiet a rule that is itself
      wrong.
  uplink-lamps:
    confidence: photo-measured
    note: >-
      photo-measured (count only) - FOUR lamps per uplink port, above the top row and below the
      bottom, clearly clustered in fours at 9x on the render. That is what common/qsfp28-cage@3
      draws, so the part is right here - unlike on the PBC-2000, where the same band had to be
      dropped because that chassis has none.
  power:
    confidence: datasheet
    note: >-
      datasheet page 3 - "1+1 Redundant, Hot-Swappable PSUs (100-240VAC or 180-300VDC
      auto-ranging)" and "< 500W Maximum (Typical < 350W at 25C)".
  thermal:
    confidence: datasheet
    note: >-
      datasheet page 3 - "3+1 Redundant Fans; Front-to-Back and Back-to-Front configurations
      available". BOTH directions are offered, so no airflow is asserted: the same hole is an
      intake on one SKU and an exhaust on another.

attrs:
  # SECTIONS FOLLOW THE LIBRARY'S, NOT THE DATASHEET'S TABLE. L68 is the rule
  # that knows: `memory` and `storage` are filed under `platform` by 53 and 51
  # other devices, and a second home makes the key unfindable by section. Same
  # for `cpu` (54), `bmc` (41) and `packet-buffer` (41), which is why none of
  # them is spelled the way the datasheet's own rows are.
  performance:
    switching-capacity: 2.0 Tbps
    latency-overhead-ns: 500
    packet-buffer: 32 MB
  platform:
    cpu: Intel x86, up to 8 cores
    memory: 8-32 GB ECC DDR4
    storage: configurable M.2 SSD
    bmc: integrated BMC plane, IPMI 2.0 compliant
  power:
    input: ac-or-dc
    power-max-w: 500
    power-typical-w: 350
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 3+1
    airflow: front-to-back or back-to-front
  environmental:
    operating-temp-c: '0 to 45'
    operating-humidity: 5% to 90% non-condensing
    mtbf-hours: 150000
  lifecycle:
    eol: none-announced
chassis: {width: 438.0, height: 44.0, depth: 520.0, ru: 1, color: '#1b1e21'}
gaps:
- what: rear-face-unmodelled
  scope: [rear]
  reason: needs-photo
  wanted: a photograph of the rear, or a mechanical drawing of it.
  note: >-
    THE REAR'S INVENTORY IS KNOWN AND NOTHING PLACES IT, so the face draws the envelope
    and nothing else. The datasheet counts two hot-swappable supplies and a 3+1 fan
    tray, and lists the management interfaces as "1 x Rear CPU/BMC Shared Ethernet
    (RJ45) - 1 x Serial Console (RJ45) - 1 x USB Type-A"; the product documentation
    puts the management jack "on the rear of the Port Extender (center of the device,
    at the top)". That is an inventory and one coarse position, and drawing a rear from
    it would be inventing five or six coordinates to carry one. The front render shows
    no jacks at all, which is why all three management interfaces are taken to be back
    there.
- what: front-face-positions
  scope: [front]
  reason: needs-drawing
  wanted: >-
    a face-on photograph or a mechanical drawing. Either settles the whole face in one
    step.
  note: >-
    EVERY POSITION ON THE FRONT FACE IS ESTIMATED. The only image held is a marketing
    render that is not orthographic - the lid is visible in it, so the face is
    foreshortened vertically and no vertical figure may be taken from it. What the
    render does settle is the ARRANGEMENT (see provenance `arrangement`), and the
    horizontal pitch it implies agrees with the standard part to 2%. The row heights,
    the row gap, the margins and the block gaps are all chosen.
- what: tenant-port-lamps
  scope: [front]
  reason: needs-photo
  wanted: a face-on photograph, or an LED table.
  note: >-
    A ROW OF SMALL ROUND FEATURES RUNS ABOVE AND BELOW THE TENANT PORTS, one per column
    in each row, and they are NOT DRAWN because nothing held can say whether they are
    lamps or fasteners. On an 800 px render an unlit indicator and a panel screw are the
    same dark dot. The uplink ports' lamps ARE drawn, and the difference is the evidence:
    those are clustered in fours per port and read clearly as the four-lane band the
    cage part carries. Guessing 48 indicators into existence, or 48 screws, would be
    drawing something nobody can check.
- what: port-numerals
  scope: [front]
  reason: needs-photo
  wanted: a face-on photograph square enough to read the legends.
  note: >-
    The port numbers are PRINTED between the two rows - the render shows a legend per
    column - and they are not drawn, because the render cannot resolve their format.
    Whether a column is labelled with both numbers, or one above the other, or on
    alternating sides, is not readable at 800 px. The NUMBERING is modelled (see
    provenance `numbering`); the artwork that carries it is not.
- what: wordmark-logo-mark
  scope: [front]
  reason: needs-drawing
  wanted: the MaiaEdge mark as vector art.
  note: >-
    The faceplate carries the word MaiaEdge at its top left, and that is drawn. The
    stylised angular glyph beside it is not - the same decision the PBC-2000's face
    records, for the same reason: approximating a company's mark from a render is
    drawing something nobody can check, and a wrong logo is worse than an absent one.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: photographs of the lid, the underside and either flank.
  note: >-
    These four faces draw the chassis envelope and nothing else. The envelope is not a
    guess - 44 x 438 x 520 is dimensioned on page 3 of the datasheet - but no source
    held shows what is on any of them.
groups:
  # ONE GROUP, BECAUSE THE VENDOR NUMBERS ALL 56 IN ONE SPACE. The documentation
  # addresses tenant ports 41-48 and uplinks 51-56 without ever restarting the
  # count, so the uplinks are 49-56 and not 1-8 of their own group. `index-origin`
  # takes only 0 or 1, which is the schema saying exactly this: a group's numbering
  # starts at its first port, and a second group would have to start again.
  ports:
    term: Port
    role: traffic
    index-origin: 1
    mixed: >-
      48 SFP28 tenant ports and 8 QSFP28 fabric uplinks, numbered 1-56 in one space.
      The media differ and the numbering does not, so each port carries its own media
      through the part it is placed from rather than from the group.
    description: >-
      A tenant port's ROLE is set from the MaiaEdge portal rather than on the box -
      Customer, Internal Fabric (INNI), External Fabric (ENNI), MaiaConnect or Internet
      (DIA) - which is what the documentation says distinguishes this switch from the
      third-party ones that can stand in for it.
  furniture: {term: Part, role: furniture, index-origin: 1}
