      - {ref: common/rack-ear@1, id: ear-right, at: [437.9, -1.1], skin: right, optional: ears, group: furniture, rel-pos: 2}
      # ONE LAMP PER PORT, NOT FOUR. common/qsfp28-cage@3 carries a four-lamp
      # band, and its own provenance says what those are: the AS7726-32X's
