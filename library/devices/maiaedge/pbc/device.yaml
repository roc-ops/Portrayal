  front:
    size: {w: 437.9, h: 41.27}
    panel:
      decor:
      # THE FACE IS NOT FLAT. It slopes out of the faceplate to a raised band that
      # runs the full width and slopes back down, the way a PowerEdge R740xd's bezel
      # does. Three fills read as that relief; nothing dimensions the slope, so this
      # is shading rather than a claimed depth.
      - {id: slope-top, at: [0.0, 0.0], size: [437.9, 5.4], fill: '#191c1f', kind: bezel}
      - {id: raised-band, at: [0.0, 5.4], size: [437.9, 30.2], fill: '#25292e', kind: bezel}
      - {id: slope-bottom, at: [0.0, 35.6], size: [437.9, 5.67], fill: '#191c1f', kind: bezel}
      - {id: crease-top, at: [0.0, 5.0], size: [437.9, 0.5], fill: '#31363c', kind: bezel}
      # THE WINDOWS ARE OCTAGONS, cut through the raised band to the faceplate behind:
      # flat top, 45-degree chamfer, short vertical end, chamfer back, flat bottom. A
      # first draft drew them as rounded rectangles and got the silhouette of the most
      # recognisable thing on this device wrong.
      # THE LOUVRES ARE EIGHT ROWS DEEP AND FIVE COLUMNS ACROSS in each window,
      # counted off the photograph (see provenance `louvres`), and they run the
      # whole window with the ports punched through them. `slots-h` is a 14 x 8
      # tile, so without a pitch this field came out as somebody else's grille -
      # three coarse rows of stubby dashes. 115/5 and 24/8 give the counts
      # exactly; the offset puts the lattice's first cell on the rect's own
      # corner, and the rect is inset far enough that all four of its corners
      # clear the octagon's chamfers.
      - {id: window-left, at: [8.0, 6.0], size: [132.0, 29.0], shape: octagon, fill: '#111316', kind: recess}
      - {id: vent-left, at: [16.5, 8.5], size: [115.0, 24.0], pattern: slots-h, pattern-pitch: [23.0, 3.0], pattern-offset: [16.5, 8.5], vent: 20}
      - {id: window-right, at: [232.0, 6.0], size: [132.0, 29.0], shape: octagon, fill: '#111316', kind: recess}
      - {id: vent-right, at: [240.5, 8.5], size: [115.0, 24.0], pattern: slots-h, pattern-pitch: [23.0, 3.0], pattern-offset: [240.5, 8.5], vent: 20}
      # the raised bead around each window, painted in the vendor's amber - the edge of
      # the cut, not a stripe on a flat plate
