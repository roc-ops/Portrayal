      - {id: right-panel-mesh, at: [382.0, 10.0], size: [14.0, 21.0], pattern: holes, vent: 12}
      cutouts:
      - {id: port-1, at: [20.575, 20.2], size: [18.5, 9.58], shape: rect}
      - {id: port-2, at: [40.075, 20.2], size: [18.5, 9.58], shape: rect}
      - {id: port-led-1, at: [28.75, 16.0], size: [2.0, 2.0], shape: circle}
      - {id: port-led-2, at: [48.25, 16.0], size: [2.0, 2.0], shape: circle}
      - {id: usb, at: [253.75, 19.6], size: [4.5, 12.0], shape: rect}
      - {id: status-1, at: [12.0, 13.6], size: [2.0, 2.0], shape: circle}
      - {id: status-2, at: [12.0, 17.6], size: [2.0, 2.0], shape: circle}
      - {id: status-3, at: [12.0, 21.6], size: [2.0, 2.0], shape: circle}
      - {id: status-4, at: [12.0, 25.6], size: [2.0, 2.0], shape: circle}
      - {id: con, at: [266.0, 19.0], size: [15.8, 13.2], shape: rect}
      - {id: mgmt, at: [296.0, 19.0], size: [15.8, 13.2], shape: rect}
      - {id: ctrl, at: [326.0, 19.0], size: [15.8, 13.2], shape: rect}
      - {id: sys-led, at: [359.2, 30.2], size: [4.0, 4.0], shape: circle}
    silkscreen:
    - {at: [196.0, 24.0], text: MaiaEdge, font-size: 9.0, fill: '#f2a71b', anchor: middle, for: chassis}
