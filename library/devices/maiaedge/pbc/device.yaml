gaps:
- what: front-face-positions
  scope: [front]
  reason: needs-drawing
  wanted: >-
    a face-on photograph of the front with nothing plugged in, or a mechanical drawing
    from MaiaEdge. Either settles the whole face in one step.
  note: >-
    EVERY POSITION ON THE FRONT FACE IS ESTIMATED. The only sources held are a
    three-quarter marketing render and photographs of a unit racked in service, and
    neither is orthographic. panel_measure refuses the photograph outright, and
    hand-anchoring it gives width- and height-derived scales that disagree far beyond
    its 3% gate - the RJ45 jacks read 11.5 mm against their known 15.8 because the
    right of the frame is further from the lens. So the ORDER of the face is evidence
    and the coordinates are not. Tracked as roc-ops/Portrayal#247.
- what: right-panel-identity
  scope: [front]
  reason: needs-photo
  wanted: >-
    a face-on photograph of the right end of the front face, or a word from the vendor
    saying what the recess is.
  note: >-
    The recessed rectangle at the right end of the front face is drawn as decor because
    nobody can put a part number to it. The product render shows it smooth and uniform,
    which reads as a display; the photograph shows two zones, a honeycomb-perforated
    left third and a smooth remainder, which reads as a vent beside something. It is
    modelled as a recess with a perforated region and NO identity is claimed. If it is
    an LCD it deserves a real component rather than paint.
- what: front-indicator-array
  scope: [front]
  reason: vendor-silent
  wanted: an LED table, or a photograph of the unit powered down so the louvres read clean.
  note: >-
    The photograph shows red and green points scattered at irregular positions and
    heights across BOTH vent fields. They are internal board LEDs glowing through the
    louvres, not a panel indicator array: they do not line up, they sit at several
    louvre heights, and no document held carries an LED table. Only the one discrete
    lamp right of the bezel is modelled. Inventing a row of indicators from those
    points would be drawing the light rather than the hardware.
- what: psu-module-width
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    a face-on rear photograph, or the vendor's part number for the supply. The answer
    decides which of the library's two 550W majors this device should carry.
  note: >-
    common/psu-550w@2 is placed, being the maintained major and the 73.5 mm CRPS 1U
    standard width. The rear photograph disagrees: on the scale the five fans validate
    to 0.2%, the two-supply block reads about 171 mm, or 85.5 mm each, which is far
    closer to the RETIRED common/psu-550w@1 at 84.0. An attempt to confirm the module
    seams programmatically failed, so the reading rests on an eyeball and is not
    asserted here. Either MaiaEdge fits a wider-than-CRPS module, or the eyeball is
    wrong.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: >-
    photographs of the lid, the underside and either flank out of the rack. The unit
    was shot in service with a device directly above it.
  note: >-
    These four faces draw the chassis envelope and nothing else. The envelope itself is
    not a guess - 437.90 x 291.08 x 41.27 is dimensioned on page 3 of the datasheet -
    but no source held shows what is ON any of them: no vent field, no label, no screw
    pattern, no rail. The flat rect asserts the box and claims nothing about its
    surface, which is what lets the device carry a rack elevation and a 3D box without
    inventing detail.
- what: wordmark-logo-mark
  scope: [front]
  reason: needs-drawing
  wanted: the MaiaEdge mark as vector art, or a face-on photograph square enough to trace it from.
  note: >-
    The centre band carries the word MaiaEdge in the vendor's amber, sized and coloured
    to match the photograph. The LOGO MARK that sits immediately left of it - a
    stylised angular glyph - is not drawn. Approximating a company's mark from a
    perspective photograph would be drawing something nobody can check, and a wrong
    logo is worse than an absent one.
- what: chassis-power-draw
  reason: vendor-silent
  wanted: a chassis draw or input figure from MaiaEdge.
  note: >-
    The datasheet states the supply configuration and no chassis draw figure, so none
    is recorded. L27 stands, and the chassis total is a floor rather than a total.
