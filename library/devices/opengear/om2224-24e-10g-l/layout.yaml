format: 1
kind: device
name: om2224-24e-10g-l
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: OM2224-24E-10G-L
description: >-
  Opengear OM2224-24E-10G-L Operations Manager, a 1RU rack appliance with dual AC power. It has 24 RJ45 RS-232 serial ports
  and a 24-port managed Ethernet switch on the front. Two SFP+ ports NET1 and NET2 and an RJ45 port NET3 take the network.
  Two USB 3.0 ports, an RJ45 console and a micro-USB console are on the front. Eight USB 2.0 ports, two SIM slots, three antenna jacks and two IEC C14 power inlets are on the rear.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear OM2200 Operations Manager datasheet (September 22, 2026), pages 1 to 4: interfaces, power,
      dimensions and model table. Opengear OM2200 Quick Start Guide v1 (October 2026) is the other source. Its page 5
      holds the "In the Box" figures. Page 5 also holds the AC rear figure. Page 9 holds the LED table. The OM2224-24E-10G-L
      front photograph and the OM2200 DC rear photograph are published with the family. The AC inlets are read off the page 5 rear figure.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, page 2, Physical Dimensions: "17.25 x 10.25 x 1.75 in, 44 x 26 x 4.5 cm", 3.5 kg, 1RU. The metric
      figures 440 x 260 mm are used for width and depth, as for the CM8100 family. The height is the 1RU 44 mm of the
      sibling devices. The data sheet does not say whether the width includes ears. Rack mount kit 590037 ships in the
      box and no held document dimensions it, so the body is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: the OM2224-24E-10G-L front photograph is measured against the data sheet envelope by its transparent
      background. It is 2560 px wide and shows the top plate at a slight angle. The face is 2304 px wide from 440 mm, 209 px high from 44 mm, so
      5.236 px/mm across, 4.75 px/mm down. Every position on the front is read off that photograph and is good to about 1.5 mm across and
      2 mm down. Jack centres are read from crops at 4 times. The two blocks of 12 columns are read on this face only.
  rear-layout:
    confidence: estimated
    note: >-
      Method as the front: the OM2200 DC rear photograph (2560 x 1707) is 2250 px wide for 440 mm. That is 5.114
      px/mm across and about 5.2 px/mm down. The eight USB-A jacks, the livery and the printing are read off it,
      good to about 1.5 mm. The photograph carries no model name. It is used for this model because the quick start
      shows the 10G variation as a change of the front only.
  top-layout:
    confidence: estimated
    note: >-
      Method: the front and rear photographs show the top plate at a slight angle. Seven screw heads are counted:
      three along the rear lip and two on each side. Their positions are read by interpolating along the plate's
      edges, good to about 10 mm. The seam along the front lip is a thin line in both photographs. In this view
      y = 0 is the rear of the chassis.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: OM2224-24E has 24 RJ45 RS-232 ports with a software selectable straight or rollover pinout, 50 to
      230,400 bps. The photograph numbers them 1 to 24 in two rows of 12 columns.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. Quick Start Guide, "Configure Serial Ports": the default mode is
      Console Server. The data sheet calls them "Managed Serial Ports".
  switch:
    confidence: datasheet
    note: >-
      Data sheet: 24 managed 10/100/1000 Base-T switched Ethernet ports. Quick Start Guide, page 14: the switch ports
      are bridged by default in an interface called "Switch". The 1G photograph prints NET3 over this block and the
      10G photograph prints SWITCH.
  network:
    confidence: datasheet
    note: >-
      Data sheet: 2 x SFP+ (10G only) Fiber and 1 x 10/100/1000 Base-T Ethernet (10 GbE chassis).
      Quick Start Guide, page 5: 10G models have NET1 (10G SFP+), NET2 (10G SFP+) and NET3 (1G copper).
      The photograph prints the lower cage caption as "NET1 SPF+". The drawing prints "NET1 SFP+", as the quick start spells it.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: 2 USB 3.0 host ports and 8 USB 2.0 ports for device console management. The front photograph prints
      the SuperSpeed mark under the two blue jacks. The rear photograph labels the eight jacks A to H.
  console:
    confidence: datasheet
    note: >-
      Data sheet: one RJ45 serial (straight pinout) and one micro USB 2.0 console port. The photograph prints
      CONSOLE under the micro-USB jack.
  lamps:
    confidence: datasheet
    note: >-
      Quick Start Guide, page 9, LED Panel: six lamps, each green, amber or off with the stated flashing states.
      The photograph shows all six dark, so no lit colour is sampled. The lit colours are the library's lamp colours.
  power:
    confidence: datasheet
    note: >-
      Data sheet, page 2: "Dual IEC 60320 Socket Universal 100-240V AC 50/60Hz", 1.6 A maximum. Quick Start Guide, page 5:
      the rear figure labels two inlets "Dual AC Power Supply". Page 7 lists two IEC C14 to C13 cables, 440055.
  livery:
    confidence: estimated
    note: >-
      The red field, the dark panel, its stripes, the label strips and the wordmark are painted livery, not parts.
      They are read off the photographs. Colours are medians of sampled pixels: front red
      #c71b2c, rear red #ec252d, dark panel #252528, top plate #939597. The logo mark is a simplified outline.
      The silver plate round the console jack and the two USB ports is a rounded rectangle behind the three jacks.
      Its colour #d7cec4 is the median of 1403 pixels from the strip left of the console jack.
      Its edges are found by pixel scan of the same photograph, against the USB jack positions, and are good to about 1 mm.
      The black pull tab under the vents is a decor tab at the bottom edge, 29.8 mm wide, read from the photograph.
      In the photograph it hangs below the chassis edge, and the drawing keeps it inside the 44 mm height.
  sides:
    confidence: estimated
    note: >-
      The data sheet prints "Passive Cooling - can be forward or reverse mounted". No held picture shows a side or the
      bottom straight on. The vent slots are read off the front and rear photographs.
attrs:
  power:
    power-input: >-
      two IEC C14 inlets, 100 to 240 V AC 50/60 Hz
    power-max-a: 1.6
  features:
    optics-sfp: >-
      10G SFP+ in the NET1 and NET2 cages; no document held names an optic type or reach
  thermal: {cooling: passive; forward or reverse mounted}
  environmental: {operating-temp-c: 5 to 50, humidity-pct: 5 to 90}
  platform:
    cpu: AMD GX-412TC 1.4 GHz 4-core x86
    memory: 8 GB DDR3
    storage: 64 GB M.2 SATA SSD
    tpm: TPM 2.0
  lifecycle: {eol: none-announced}
