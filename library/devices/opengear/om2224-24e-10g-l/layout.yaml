gaps:
- what: rack-kit
  scope: [front]
  reason: needs-drawing
  note: >-
    The data sheet and quick start list Rack Mount Kit 590037, ears and screws. No held document dimensions the ears
    or says where they sit, and the photographs show the chassis without ears, so no ear is modelled.
  wanted: The installation guide for rack mount kit 590037.
- what: ac-rear-picture
  scope: [rear]
  reason: needs-drawing
  note: >-
    The only held picture of an AC rear is the quick start page 5 figure of a cellular model, 1190 px wide.
    The inlet positions and the bay shapes are read off it, and the rear livery and USB positions are read off the DC photograph.
    No held picture shows a non-cellular AC rear, so that rear is the same face without the cellular parts.
  wanted: A rear photograph of the AC model.
- what: c14-inlet-turn
  scope: [rear]
  reason: needs-drawing
  note: >-
    The figure shows each inlet with its earth pin to the left. The part std/c14-inlet@1 is turned a quarter turn to match.
    Its shroud is drawn from a standard drawing, not from the maker's.
  wanted: A rear photograph of the AC model.
- what: sim-slot-size
  scope: [rear]
  reason: needs-drawing
  note: >-
    The quick start figure shows two slot openings 16 mm wide. The part opengear/sim-slot-2ff@1 is sized from the ACM7000 photograph. No OM2200 document gives the card size.
  wanted: The OM2200 hardware guide.
- what: antenna-jack-connector
  scope: [rear]
  reason: needs-drawing
  note: >-
    The three jacks are drawn as SMA, which the figure shows by their gold hex nuts. No document names the connector.
    The third jack is printed with a crossed satellite and the quick start says GPS is not implemented.
  wanted: The OM2200 hardware guide.
- what: usb2-jack-colour
  scope: [rear]
  reason: needs-drawing
  note: >-
    The rear photograph shows eight black jacks and the data sheet calls them USB 2.0. The library part
    std/usb-a@1 draws a blue USB 3.0 jack, so the rear jacks are the wrong colour.
  wanted: A black USB 2.0 type-A jack part.
- what: jack-lamp-meaning
  scope: [front]
  reason: vendor-silent
  note: >-
    The photograph shows a green window at each RJ45 jack corner. No held document says what a jack lamp shows, so no
    state is written for one.
  wanted: The hardware guide with its jack lamp table.
- what: power-draw
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The data sheet gives 1.6 A maximum for the mixed port models and no figure for one port or lamp.
  wanted: A per-port power table.
- what: serial-pinout-switch
  scope: [front]
  reason: vendor-silent
  note: >-
    The data sheet says each pinout is software selectable. The quick start gives the default, Pinout X2. No held
    document says how a pinout is set, so the ports carry no pinout attribute.
  wanted: The user guide section that sets the port pinout.
