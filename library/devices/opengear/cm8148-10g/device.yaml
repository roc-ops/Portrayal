format: 1
kind: device
name: cm8148-10g
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: CM8148-10G
description: >-
  Opengear CM8148-10G Console Manager, a 1RU rack appliance with 48 RJ45 RS-232 serial ports on the front.
  Two 10G SFP+ cages and two 1G RJ45 ports carry the network. A console RJ45 port and two USB 3.0 ports
  are on the front. Two IEC C14 inlets on the rear feed dual AC power.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear CM8100-10G High Density Console Manager datasheet (October 22, 2026): console specifications,
      interfaces, power requirements, physical dimensions and model table. Opengear CM8100 Quick Start
      Guide v1 (October 2026), p.5, "CM8100-10G Model": the front and rear of the 10G appliance, and p.6,
      the network interface names. The CM8148-10G-USB front photograph published with the family. No dimensioned
      drawing is held.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, p.2, Dimensions and Weight: "CM8148-10G, CM8132-10G, and CM8116-10G" are 17.3 x 10.5
      x 1.75 in, 8 lbs, 440 x 265 x 44 mm, 3.5 kg; Form Factor 1 RU. The rack kit 590037 ships in the
      box but no source dimensions it, so the body is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: no photograph of the CM8148-10G is held. The face is read from the CM8148-10G-USB front
      photograph (2560 x 1440, no scale marker, a slight downward view that shows a strip of the top),
      which has the same front, and from the Quick Start Guide p.5 figure of the 10G appliance. It is
      measured against the data sheet envelope. The face is 1722 px wide for 440 mm, 3.91 px/mm across;
      it is 164 px high for 44 mm, 3.73 px/mm down, so the face is foreshortened about 5 percent in height
      and the positions down the face are the less sure. The positions across are good to about 1 mm and
      the ones down to about 1.5 mm. The serial pitch (14.1 mm, 55.3 px) and the extra 3.7 mm (14.5 px)
      between the three groups of 16 are read on this face only.
  rear-layout:
    confidence: estimated
    note: >-
      Method: no rear photograph of the CM8148-10G is held. The Quick Start Guide p.5 10G rear figure
      shows the logo, the CM8100 mark, the "PSU 1 & 2" label and two inlets at the right, and no bank
      of ports. The positions are borrowed from the CM8148-10G-USB rear photograph (1961 px wide for 440
      mm, 4.46 px/mm; 191 px high for 44 mm, 4.34 px/mm), good to about 1 mm across and 1.5 mm down, with
      its USB-C bank left out. The inlet openings in the photograph are smaller than the library's C14
      part; the part is drawn as it is.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: CM8148-10G has 48 RJ45 RS-232 serial ports with a software selectable "Straight or Rollover"
      pinout, 50 to 230,400 bps. The pinout drawing prints, for the device ports, X1 "Cisco Rolled" (1
      RTS, 2 DTR, 3 TxD, 4 GND, 5 CTS, 6 RxD, 7 DCD, 8 DSR) and X2 "Cisco Straight" (1 CTS, 2 DSR DCD,
      3 RxD, 4 GND, 5 not connected, 6 TxD, 7 DTR, 8 RTS), and for the local console X1 with pins 2, 5
      and 7 not connected. The photograph numbers the ports 1, 3 to 47 over 2, 4 to 48 in three groups
      of 16, with SERIAL printed between 23 and 25.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. The CM8100-10G family data sheet, p.1, says of the family
      (not of this model alone): "Secure, remote, access to manage up to 96 serial devices". It also lists
      "IP alias for serial port console connections" under Console Management. The RJ45 console on the
      front is the local console (data sheet, p.1, "Console Port").
  network:
    confidence: datasheet
    note: >-
      Data sheet: "2 x 10G SFP+ Fiber and 2 x 1000 Base-T Ethernet". Quick Start Guide p.6: NET1 and NET2
      are the 10G SFP+ cages, NET3 and NET4 the 1000Base-T ports. The photograph prints NET1 SFP+ over
      NET2 SFP+ on two stacked cages and NET3 over NET4 on two stacked RJ45 jacks, each jack with a green
      and an amber lamp window.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: two USB 3.0 ports, 900 mA per port. The photograph labels the two USB-A jacks A and
      B and prints the SuperSpeed mark under them, beside the CONSOLE RJ45 jack in one housing.
  lamps:
    confidence: estimated
    note: >-
      The photograph prints four lamp windows with the power, heartbeat, IOIO and network symbols. Quick
      Start Guide p.9 describes the four lamps and what each shows; no lamp state is written here.
  power:
    confidence: datasheet
    note: >-
      Data sheet: dual socket universal IEC C14 inlet, 100-240 V AC 50/60 Hz; every appliance ships with
      two C14 power cables. Power consumption, as printed: "CM8148-10G: 20W (69 BTU/h) typical, 39W (133
      BTU/h) maximum". The rear prints the numbers 1 and 2 with a plug symbol under each inlet.
  livery:
    confidence: estimated
    note: >-
      The red border, the charcoal panel with its diagonal edge and two stripes, the white label tabs,
      the black serial frame and the wordmark are read off the photographs at the same scale and are painted
      livery, not parts. The logo mark is a simplified outline.
  sides:
    confidence: estimated
    note: >-
      The data sheet prints, p.2, "Passive Cooling - can be forward or reverse mounted to best suit airflow".
      It shows no top, bottom or side, so how those faces look is not stated; the vent slots drawn on
      the front and rear are read off those photographs.
attrs:
  power:
    power-typ-w: 20
    power-max-w: 39
    power-usage: typical 20 W (69 BTU/h), maximum 39 W (133 BTU/h), data sheet
    power-input: two IEC C14 inlets, 100-240 V AC 50/60 Hz; two C14 power cables in the box
  thermal: {cooling: passive; forward or reverse mounted}
  environmental: {operating-temp-c: 5 to 50, humidity-pct: 5 to 90 non-condensing}
  physical: {weight-kg: 3.5}
  platform: {cpu: 1.6 GHz dual-core ARM Cortex-A9, memory: 2 GB DDR4, storage: 32 GB eMMC, tpm: TPM 2.0}
  features:
    optics-sfp: 10G SFP+ in the NET1 and NET2 cages; no document held names an optic type or reach
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 265.0, ru: 1, color: '#3a3a3d', power: ac}
gaps:
- what: rack-kit
  scope:
  - front
  reason: needs-drawing
  note: >-
    The data sheet lists Rack Mount Kit 590037, ears and screws, as an accessory. No held document dimensions
    the ears or says where they sit, and the photographs show the chassis without ears, so no ear or kit
    is modelled.
  wanted: The installation guide for rack mount kit 590037.
- what: rear-positions
  scope:
  - rear
  reason: needs-photo
  note: >-
    No rear photograph of the CM8148-10G is held; the guide's rear figure is a small drawing of the appliance.
    The inlet and printing positions are borrowed from the CM8148-10G-USB rear.
  wanted: A straight-on rear photograph of the CM8148-10G.
- what: power-draw
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The data sheet states a typical and a maximum consumption for the unit and none for any one port or
    lamp, so none is stated for them.
  wanted: A per-port power table.
- what: serial-pinout-switch
  scope:
  - front
  reason: vendor-silent
  note: >-
    The data sheet says the pinout of each serial port is software selectable, straight or rollover. No
    held document says how the setting is made, so the ports carry no pinout attribute.
  wanted: The user guide section that sets the port pinout.
groups:
  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: forty-eight RJ45 RS-232 serial ports with a software selectable pinout.
  net-sfp:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp, speed: 10g}
    description: the two 10G SFP+ cages NET1 and NET2.
  net-rj45:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two 1G RJ45 ports NET3 and NET4.
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: two USB 3.0 ports, A and B.
  console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console}
    description: the RJ45 local console port, Cisco rolled X1 pinout.
  controls: {term: Control, role: management, index-origin: 1, description: the ERASE pinhole.}
  status-leds: {term: LED, role: indicator, index-origin: 1}
  inlets:
    term: Inlet
    role: service
    index-origin: 1
    attrs: {input-voltage: 100-240 V AC}
    description: the two IEC C14 power inlets.
