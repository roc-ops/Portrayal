format: 1
kind: device
name: acm7004-2-l
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: ACM7004-2-L
description: >-
  Opengear ACM7004-2-L Resilience Gateway, a compact desktop appliance. It has four RJ45 RS-232 serial
  ports, four USB 2.0 console ports and two RJ45 network ports. A 4G LTE cellular modem is fitted, with
  two SIM slots on the front. Main, GPS and auxiliary antenna jacks, a digital I/O header and a 9 to 30
  VDC power input are on the rear.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear Resilience Gateway ACM7000 data sheet (October 02, 2026): console specifications, interfaces,
      I/O ports, power, dimensions, weight, model table, package checklist and accessories. Resilience
      Gateway Quick Start Guide for the ACM7004-2-L, ACM7008-2-L and ACM7004-5-L (06052019), page 2: the
      front and rear photographs with callouts. ACM7000 front photograph published on the data sheet.
      ACM700x-2 Quick Start Guide (revision 1.0.0), page 1: the kit contents.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, Dimensions and Weight: 5 1/8 x 4 3/4 x 1 3/8 in, 13 x 12 x 3.5 cm, 0.6 kg. Form factor
      "Compact". The inch figures are 130.2 x 120.7 x 34.9 mm. The centimetre figures are used, as the
      user manual's appendix prints the same. The rack kit 590003 and the DIN rail kit 590012 are accessories
      and no source dimensions them, so the body is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: the ACM7004-2-L front photograph of the Quick Start Guide is measured against the 130 mm
      data sheet width. It is 718 px wide, straight on, with no scale marker, so 5.5 px/mm across. The
      data sheet's front photograph (626 x 343) agrees on the shared features to about 1 mm. Every position
      on the front is read off the photograph, good to about 0.7 mm. These are the two RJ45 jacks, the
      lamps and their symbols, the two SIM slots and the printing.
  rear-layout:
    confidence: estimated
    note: >-
      Method: the ACM7004-2-L rear photograph of the Quick Start Guide is 1127 px wide. The body is 1075
      px across for 130 mm (8.27 px/mm). It is 288 px high for 35 mm (8.23 px/mm), so the face is orthographic
      to about 1 percent. The serial block, the SMA jacks and the USB ports are read off it. So are the
      digital I/O header and the power housing, good to about 0.5 mm.
  cellular:
    confidence: datasheet
    note: >-
      Data sheet: ACM7004-2-L has a 4G LTE modem (Sierra Wireless EM7565, Cat-12) and two SIM card slots.
      Quick start, page 3: slide the carrier mini SIM into the slot with the contacts facing up. The rear
      photograph labels the antenna jacks (M), a satellite symbol and (A). The jacks are SMA by the registry's
      reading of the photograph (gold hex nut, centre pin). No document names the connector, which is
      recorded in the gaps.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: ACM7004-2 has 4 RJ45 RS-232 "Cisco straight" pinout console ports, 50 to 230,400 bps.
      The photograph numbers the ports 1 and 2 on the left and 3 and 4 on the right. It prints SERIAL
      above the left column.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. ACM700x-2 Quick Start Guide, page 3, "Configure managed
      devices": set the Console Server Mode radio button for a port. The data sheet calls them "console
      ports".
  network:
    confidence: datasheet
    note: >-
      Data sheet: ACM7004-2 has 2 x 10/100/1000 Ethernet ports. The front photograph prints NET1 and NET2
      over two RJ45 jacks, each with a lamp at each top corner. ACM700x-2 Quick Start Guide, page 1, steps
      03 and 04: NET1 connects to the primary network and NET2 to the out-of-band management network.
      That guide covers the ACM7004-2, which the -L fits with a modem. NET1 is a traffic port and NET2
      a management port.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: 4 x USB 2.0 console ports. The rear photograph shows two stacked pairs of USB-A jacks,
      numbered 1 and 2 on the left and 3 and 4 on the right. The user manual, section 3.1.8, puts the
      ACM7008-2 USB ports on the front. The photograph and the quick start callout put them on the rear,
      and the drawing follows the photograph.
  io:
    confidence: datasheet
    note: >-
      Data sheet, I/O Ports: 2 TTL level digital I/O ports (DIO) 5 V DC max at 20 mA. It also lists 2
      high voltage digital outputs (HVDO) 5-30 V DC at 100 mA. The rear prints DC O2 G O1 G I2 G I1 under
      an eight-position header. The kit lists a black terminal block that plugs into it.
  lamps:
    confidence: estimated
    note: >-
      The front photograph shows four lamps at the left. A power symbol, a heartbeat symbol, IOIO and
      an antenna symbol sit beside them. Four signal lamps sit at the right of the SIM slots beside a
      signal-bar symbol. All eight are dark in the photograph. This model has no SFP cage and so no cage
      marks. No document held gives a colour or a meaning for any of them, so each is drawn off and states
      are a gap.
  power:
    confidence: datasheet
    note: >-
      Data sheet: 110-240 V AC to 12 V DC external power adapter, consumption less than 11.5 W. ACM700x-2
      Quick Start Guide, page 1, kit table: the 12V switching DC power supply in the box is part 450031.
      Data sheet optional supplies are 450037 (12 VDC four chamber square connector), 450039 (AC adapter
      with a 4-pin connector) and 450041 (DC-DC converter). The rear prints 9~30V DC under a four-position
      housing, with a line over four dashes. The user manual's appendix says less than 30 W for all models.
      The data sheet's 11.5 W is followed. The appendix gives 5 to 50 C ambient where the data sheet gives
      -25 to 60 C. The data sheet is followed.
  livery:
    confidence: estimated
    note: >-
      The red and black front, the two diagonal stripes, the wordmark and the printing are read off the
      front photograph. They are painted livery, not parts. The red is the photograph's sampled median,
      #fa0024 over 800 px. The logo mark is a simplified outline.
  sides:
    confidence: datasheet
    note: >-
      The outlines are drawn from the data sheet's stated size. The data sheet photograph shows the top
      lid at an angle as a plain dark slab, with no detail to place. No held picture shows the bottom
      or either side. The user manual says the connection status can be seen from the LEDs on top of the
      device.
attrs:
  physical: {weight-kg: 0.6}
  power:
    power-max-w: 11.5
    power-input: 9 to 30 VDC four-position housing; 12 VDC external adapter in the box
  environmental: {operating-temp-c: -25 to 60, humidity-pct: 5 to 90}
  platform: {cpu: 800 MHz Armada 370 ARMv7 SoC (Marvell 88F6W11), memory: 256 MB DDR3 SDRAM, storage: 4
      GB NAND flash}
  features: {cellular: 'Sierra Wireless EM7565, 4G LTE Cat-12'}
  lifecycle: {eol: none-announced}
chassis: {width: 130.0, height: 35.0, depth: 120.0, color: '#2a2a2d', mount: desktop}
gaps:
- what: rack-kit
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The data sheet lists Rack Mount Kit 590003, DIN Rail 590012 and Rack Mount Tray 590033. The quick
    start describes 590003 as a tab with two rack screws, two nuts and three screws, fixed to the side.
    No held document dimensions any of them, so none is modelled.
  wanted: The kit installation guide for 590003, 590012 and 590033.
- what: lamp-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    The front prints eight lamps and the two jack lamps of each RJ45. No held document gives the colours
    or meanings, so each lamp states only off and is drawn off. The photograph shows the jack lamps green,
    sampled #358844 over 20 px, and the other lamps dark. The four signal lamps are small rectangles in
    the photograph. They are drawn as the library's round lamp, a stand-in for the shape.
  wanted: A hardware guide with the LED table.
- what: sides
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-photo
  note: >-
    The top, bottom, left and right sides are drawn as plain outlines from the stated size; no held picture
    shows their details.
  wanted: A photograph of the top, the base and each side.
- what: gps-jack-connector
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The middle antenna jack is printed with a satellite symbol. The data sheet lists an active GPS antenna
    (569018) and no connector. It is drawn as SMA like the other two jacks.
  wanted: A hardware guide that names the antenna jacks.
- what: antenna-jack-connector
  scope:
  - rear
  reason: vendor-silent
  note: >-
    No document names the jacks marked (M) and (A). SMA is read from the photograph (gold hex nut, centre
    pin).
  wanted: A hardware guide that names the antenna jacks.
- what: sim-slot-size
  scope:
  - front
  reason: needs-drawing
  note: >-
    The two mini SIM slots are drawn from the photograph alone, and no document dimensions the slot. The
    quick start says slot 1 is the bottom slot and the manual says top or bottom. The photograph shows
    two slots side by side.
  wanted: A drawing of the front panel.
- what: power-housing-and-dio-header
  scope:
  - rear
  reason: vendor-silent
  note: >-
    No document names a maker, series or pitch for the four-position power housing or the eight-position
    digital I/O header. Both are declared stand-ins with a registered key and a plug.
  wanted: A dimensioned drawing of the rear panel.
