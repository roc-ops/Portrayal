  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: four RJ45 RS-232 serial ports, "Cisco straight X2" pinout.
  net-rj45:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the RJ45 halves of the two combo network ports NET1 and NET2.
  net-sfp:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the SFP halves of the two combo network ports NET1 and NET2.
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: two USB 3.0 ports, A and B.
  console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-c}
    description: the USB-C local console port.
  controls:
    term: Control
    role: management
    index-origin: 1
    description: the factory erase pinhole.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  inlets:
    term: Inlet
    role: service
    index-origin: 1
    attrs: {input-voltage: 12 VDC}
    description: the two 12 VDC power jacks; the second is for redundancy.
