format: 1
kind: device
name: cm8004
version: 0.1.1
maturity: modelled
manufacturer: Opengear
model: CM8004
description: >-
  Opengear CM8004 Console Manager, a half-width 1RU appliance. It has four
  RJ45 RS-232 serial ports and two combo network ports, each an RJ45 or SFP.
  It has two USB 3.0 ports and a USB-C console port. Two 12 VDC power jacks
  are on the rear, and one adapter is supplied.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear CM8000 Console Manager datasheet (September 22, 2026): model
      table, interfaces, power, cooling, dimensions and weight, package
      checklist and accessories. CM8000 Quick Start Guide v1 (September 2026):
      "In the Box" front and rear callouts, hardware installation steps, the LED
      panel table. The CM8004 front and rear photographs and the "X2 Cisco
      Straight" pinout drawing published with them.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, Dimensions and Weight: standard models 8.66 x 7 x 1.75 in,
      220 x 177 x 44 mm, 1.25 kg. Form factor "Compact - SFF 1RU half-rack
      width". The rack kit 590054 ships in the box but no source
      dimensions it, so the body is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: the CM8004 front photograph (2560 x 1440, straight on, no scale
      marker) is measured against the data sheet envelope. The body outline is
      1251 px wide and 252 px high at the displayed 2000 px width, 5.69 px/mm
      across from 220 mm and 5.73 px/mm down from 44 mm, so the face is
      orthographic to about 1 percent and positions are read at
      5.7 px/mm. Every position on the front is read off that photograph and is
      good to about 0.5 mm: the two SFP cages, the two RJ45 jacks, the 2 x 2
      serial block (pitch 14.1 across, 14.0 down), the two USB-A ports, the
      USB-C console, the erase pinhole, the six lamps and the printing. The
      CM8008 photograph, at 4.12 px/mm, gives the same column x for the
      shared features within 0.3 mm.
  rear-layout:
    confidence: estimated
    note: >-
      Method as the front: the CM8004 rear photograph is 1101 px wide for
      220 mm (5.0 px/mm) and 218 px high for 44 mm (4.95 px/mm). The two 12VDC
      jacks (centres 158.8 and 208.8 mm) and the two cable retention openings
      (120.4 and 172.6 mm; the Quick Start Guide, p.5, names them) are read off it and agree within 0.3 mm with the CM8004-C rear
      photograph taken at 3.81 px/mm.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: CM8004 has 4 RJ45 RS232 "Cisco straight X2" pinout serial
      ports, 50 to 115,200 bps. The pinout drawing prints pin 1 CTS, 2 DSR/DCD,
      3 RxD, 4 GND, 5 not connected, 6 TxD, 7 DTR, 8 RTS. The photograph numbers
      the ports 1 and 3 over 2 and 4, with SERIAL printed between the lower
      numerals.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. Quick Start Guide, p.10, "Configure Serial Ports": "The
      default configuration for serial ports is: Mode: Console Server". The data sheet, p.1, calls them
      "Managed Serial Ports". The USB-C jack is the local console (data sheet, p.1, "Local Console Port").
  network:
    confidence: datasheet
    note: >-
      Data sheet: "2 x combo ports - RJ45 100BASE-TX/1000 BASE-T or SFP"; the
      model table lists "2x 1GbE SFP, 2x 1GbE". The photograph prints NET1(S),
      NET2(S) over two stacked SFP cages and NET1(C), NET2(C) over two stacked
      RJ45 jacks, each jack with a green lamp and an amber lamp. The (S) and (C)
      halves of one number are one combo port; both halves are placed and share
      the number, the way the library draws other combo ports. The Quick Start
      Guide's NET1/NET2 lamp table: amber is link at any speed or activity,
      green is link at 1G.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: two USB 3.0 ports (mass storage, device console management)
      and one USB-C console port, default 9600 8N1. The photograph labels the
      two USB-A jacks A and B and prints the SuperSpeed mark under them.
  lamps:
    confidence: datasheet
    note: >-
      Quick Start Guide, LED Panel: six LEDs, Power, Heartbeat, Network, IOIO,
      Cloud / Internet and Cellular Interface, each with its states. The
      photograph prints the power, heartbeat and network symbols over the top
      row and IOIO, an antenna and a cloud under the second row. The Cellular
      lamp is printed on every model, the standard ones included.
  power:
    confidence: datasheet
    note: >-
      Data sheet: dual power inputs, the second available as redundancy; one
      universal 110-240 V AC to 12 V DC external adapter in the box (450048,
      65 W, IEC C14 inlet), a 60 W 18-72 V DC kit (450051) as an accessory;
      consumption "less than 24 W". The rear prints 12VDC under each jack.
      Quick Start Guide: connect a second power cable for redundancy; the
      power lamp is green for redundancy and amber for none.
  livery:
    confidence: estimated
    note: >-
      The red and charcoal faces, the two diagonal stripes, the white label
      tabs and the wordmark are read off the photographs at the same scale and
      are painted livery, not parts. The logo mark is a simplified outline.
  sides:
    confidence: datasheet
    note: >-
      No source shows the top, bottom or either side of the unit. Passive
      cooling is stated (data sheet) and the front and rear photographs show a
      row of vent openings along their top edge, drawn on those faces.
attrs:
  physical: {weight-kg: 1.25}
  power:
    power-max-w: 24
    power-input: >-
      two 12 VDC jacks, the second for redundancy; external adapter 450048 in
      the box
  thermal: {cooling: passive; forward or reverse mounted}
  environmental: {operating-temp-c: 5 to 50, humidity-pct: 5 to 90 non-condensing}
  platform:
    cpu: 1.6 GHz quad-core ARM Cortex-A53
    memory: 4 GB LPDDR4
    storage: 32 GB eMMC
    tpm: 'TPM 2.0'
  features:
    optics-sfp: >-
      1GbE SFP in the combo ports; no document held names an optic type or reach
  lifecycle: {eol: none-announced}
chassis:
  width: 220.0
  height: 44.0
  depth: 177.0
  ru: 1
  color: '#3a3a3d'
  power: dc
gaps:
- what: rack-kit
  scope: [front]
  reason: needs-drawing
  note: >-
    The data sheet lists Rack Mount Kit 590054 in the box and Rack Tray Kit
    590085 (to full-rack width) as an accessory, and the Quick Start Guide
    calls the unit "1RU half-rack mountable". No held document dimensions
    either kit or says where the ears sit, so no ear or kit is modelled.
  wanted: The kit installation guide for 590054 and 590085.
- what: second-power-jack-function
  scope: [rear]
  reason: vendor-silent
  note: >-
    The data sheet says "Dual Power inputs, second available as redundancy"
    and the Quick Start Guide says to connect a second power cable for
    redundancy, but the box holds one adapter and no document says whether the
    jacks are interchangeable or which one the adapter belongs in. Both are
    drawn as 12 VDC jacks.
  wanted: A hardware guide that says what each jack feeds.
- what: cable-retention-insert
  scope: [rear]
  reason: needs-drawing
  note: >-
    The Quick Start Guide's "In the Box" figure labels the two round openings
    on the rear "Cable Retention Insert". The photograph prints a lock and a
    cable symbol and the numbers 1 and 2 beside them. No document dimensions
    the opening or the insert, or says whether the insert is fitted in the box,
    so they are drawn as 4.4 mm openings, read off the photograph, and not as
    parts.
  wanted: A drawing of the cable retention insert.
- what: jack-barrel-size
  scope: [rear]
  reason: vendor-silent
  note: >-
    No held document gives the barrel size or polarity of the 12 VDC jacks;
    the part is the library's one nominal barrel jack.
  wanted: A dimensioned drawing of the rear panel or the adapter plug.
- what: power-draw
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The data sheet states "less than 24 W" for the unit and no figure for any
    one jack, lamp or port, so none is stated for them.
  wanted: A per-port power table.
