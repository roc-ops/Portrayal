    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two 1G RJ45 ports NET1 and NET2.
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: two USB 3.0 ports.
  console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console}
