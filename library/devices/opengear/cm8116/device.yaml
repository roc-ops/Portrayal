format: 1
kind: device
name: cm8116
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: CM8116
description: >-
  Opengear CM8116 Console Manager, a 1RU rack appliance with 16 RJ45 RS-232 serial ports on the front.
  A console RJ45 port, two USB 3.0 ports and two 1G RJ45 network ports are on the front. Two IEC C14 inlets
  on the rear feed dual AC power.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear CM8100 High Density Console Manager datasheet (November 06, 2026): console specifications,
      interfaces, power requirements, physical dimensions and model table. Opengear CM8100 Quick Start
      Guide v1 (October 2026), p.5, "In the Box": the front and rear of the CM8100 appliance. The CM8132
      front photograph published with the family. No dimensioned drawing is held.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, p.2, Dimensions and Weight: 17.3 x 9.25 x 1.75 in, 9.5 lbs, 440 x 235 x 44 mm, 4.5 kg;
      Form Factor 1 RU. The rack kit 590037 ships in the box but no source dimensions it, so the body
      is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: no photograph of the CM8116 is held. The face is read from the CM8132 front photograph (2560
      x 1711, a slight downward view that shows the top), measured against the data sheet width: the face
      is 1893 px wide at the scale of the displayed copy for 440 mm, 4.30 px/mm, and from the Quick Start
      Guide p.5 figure of the 48-port appliance, which shows the same jacks, lamps and printing. Only
      the number of serial jacks differs from the CM8132: one gang of eight columns, 16 jacks in two rows.
      The serial pitch (14.1 mm) is taken from the CM8148-10G-USB face of the same jack block, the photograph
      agreeing to about 0.5 mm. Positions are good to about 1.5 mm.
  rear-layout:
    confidence: estimated
    note: >-
      Method: the Quick Start Guide p.5 rear figure shows the logo, the CM8100 mark and two inlets at
      the right; the positions are those of the CM8148-10G-USB rear, whose photograph is held, with no
      USB-C bank. The inlet openings in the figure are smaller than the library's C14 part; the part is
      drawn as it is.
  serial:
    confidence: datasheet
    note: >-
      Data sheet p.1: "16, 32 or 48 x RJ45 RS-232 Cisco straight X2 pinout", 50 to 230,400 bps. The CM8132
      photograph numbers the ports 1, 3 to 31 over 2, 4 to 32; the CM8116 numbers 1, 3 to 15 over 2, 4
      to 16 by the same rule.
  console:
    confidence: datasheet
    note: 'Data sheet p.1: "1 x RJ45 RS-232 Console Port - Cisco rolled X1 pinout, baud rate 9600".'
  network:
    confidence: datasheet
    note: >-
      Data sheet p.1: "2 x 10/100/1000 Ethernet port". The photograph prints NET1 over NET2 on two stacked
      RJ45 jacks.
  usb:
    confidence: datasheet
    note: >-
      Data sheet p.1: "2 x USB 3.0 host ports". The photograph shows two USB-A jacks and the SuperSpeed
      mark.
  power:
    confidence: datasheet
    note: >-
      Data sheet p.1: dual socket universal IEC C14 inlet 100-240 V AC; "Less than 15 W (51 BTU/h) typical"
      for the CM81xx family. Quick Start Guide p.8 step 6: the power lamp is green with two supplies and
      amber with one.
  livery:
    confidence: estimated
    note: >-
      The red face, the charcoal panel with its diagonal edge and two stripes and the wordmark are read
      off the photograph and the guide figure and are painted livery, not parts.
  sides:
    confidence: estimated
    note: >-
      Data sheet p.1: "Passive Cooling - can be forward or reverse mounted". No held source shows a top,
      bottom or side as a drawing, so those faces are stated empty.
attrs:
  power:
    power-input: two IEC C14 inlets, 100-240 V AC; two C14 power cables in the box
    power-typ-w: 15
  thermal: {cooling: passive; forward or reverse mounted}
  environmental: {operating-temp-c: 5 to 50, humidity-pct: 5 to 90 non-condensing}
  physical: {weight-kg: 4.5}
  platform: {cpu: 1.6 GHz dual-core ARM Cortex-A9, memory: 2 GB DDR4, storage: 32 GB eMMC, tpm: TPM 2.0}
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 235.0, ru: 1, color: '#3a3a3d', power: ac}
gaps:
- what: rack-kit
  scope:
  - front
  reason: needs-drawing
  note: >-
    The data sheet lists Rack Mount Kit 590037 in the box. No held document dimensions the ears or says
    where they sit, so no ear or kit is modelled.
  wanted: The installation guide for rack mount kit 590037.
