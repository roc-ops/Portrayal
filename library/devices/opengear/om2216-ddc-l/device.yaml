format: 1
kind: device
name: om2216-ddc-l
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: OM2216-DDC-L
description: >-
  Opengear OM2216-DDC-L Operations Manager. A 1RU network management
  appliance with 16 RJ45 RS-232 managed serial ports, cellular connectivity,
  and dual DC power inputs.

profile: networking
lint:
  waive:
    L61: >-
      The serial-port numerals 1 through 16 retain their measured positions from
      the text-bearing shapes in the official Opengear OM2216-L Visio front master.
      The numerals are printed across the two-row RJ45 block rather than centred on
      individual Portrayal jack components. Moving them to component centres would
      no longer match the vendor reference.

provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear OM2200 Data Sheet and OM2200 Quick Start Guide. The data
      sheet provides the OM2216 port count, physical dimensions, form factor,
      network interfaces, USB interfaces and dual DC power specifications.
      The Quick Start Guide identifies the hardware arrangement for the OM2200
      family, states that DDC models use dual DC power, describes the cellular
      interfaces on -L models, and lists the separate OM2200 rack ears.

  chassis:
    confidence: datasheet
    note: >-
      OM2200 Data Sheet: physical dimensions are 17.25 x 10.25 x 1.75 in
      and form factor is 1RU. Converted dimensions are 438.15 x 260.35 x
      44.45 mm. The data sheet separately lists Rack Mount Kit 590037 and
      the Quick Start Guide lists two OM2200 rack ears, so the published
      17.25 inch width is used here as the appliance body width. No
      dimensioned mechanical drawing is held.

  serial-ports:
    confidence: datasheet
    note: >-
      OM2200 Data Sheet: OM2216 has 16 RJ45 RS-232 software-selectable
      straight or rollover pinout console management ports.

  power:
    confidence: datasheet
    note: >-
      OM2200 Data Sheet: dual DC power inputs are +/-40 V to 72 V DC,
      1.5 A to 0.75 A x2, with 48 V nominal. The OM2200 Quick Start Guide
      states that DDC models have a dual DC power supply.

  cellular:
    confidence: datasheet
    note: >-
      The OM2200 Data Sheet lists OM2216-L with Global 4G LTE. The Quick
      Start Guide states that -L models connect antennas to CELL (MAIN)
      and CELL (AUX), and describes the SIM card slots.

  front-ports:
    confidence: estimated
    note: >-
      Official Opengear OM2216 and OM2216-L Visio stencils show sixteen RJ45 ports in two rows of eight. Positions use stencil proportions applied to the datasheet body dimensions. The stencil aspect differs from the datasheet by about 1.8 percent, so absolute stencil scale is not used. Column pitch measured approximately 13.89 to 14.11 mm and Portrayal std/rj45-ganged@2 uses 13.97 mm. Port numbering 1 through 16 is verified from the text-bearing shapes in the official Opengear OM2216-L Visio front master.
  front-usb:
    confidence: estimated
    note: >-
      Official Opengear OM2216-L Visio stencil shows two vertically arranged USB-A features. The Quick Start Guide identifies two front USB ports and states the front USB slots are USB 3.0. Positions use stencil proportions applied to the datasheet body dimensions.

chassis:
  width: 438.15
  height: 44.45
  depth: 260.35
  ru: 1
  power: dc


gaps:
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    Rack Mount Kit 590037 and two OM2200 rack ears are documented, but
    the held sources do not dimension their geometry or mounting position.
  wanted: A dimensioned drawing of the OM2200 rack ears and mounting position.


groups:
  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial}
    description: 16 RJ45 RS-232 managed serial ports arranged as a 2 x 8 block.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: 'the front-panel management interfaces: RJ45 console, Ethernet network-management ports and USB-A host ports'
    description: front-panel local console, network-management and USB host interfaces.

