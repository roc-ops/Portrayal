  uplink-rj45:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the RJ45 half of the combo uplink NET1.
  uplink-sfp:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the SFP half of the combo uplink NET1.
  switch:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the four gigabit switch ports of NET2.
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: four USB 2.0 console ports, A to D.
  status-leds: {term: LED, role: indicator, index-origin: 1}
  inlets:
    term: Inlet
    role: service
    index-origin: 1
    attrs: {input-voltage: 9 to 30 VDC}
    description: the 9 to 30 VDC power input.
  wwan:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: coax-sma}
    description: the main, GPS and auxiliary antenna jacks.
  sim:
    term: Slot
    role: service
    index-origin: 1
    attrs: {media: sim}
    description: the two mini SIM card slots.
