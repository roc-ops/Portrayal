format: 1
kind: device
name: acm7004-5-l
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: ACM7004-5-L
description: >-
  Opengear ACM7004-5-L Resilience Gateway, a compact desktop appliance. It has four RJ45 RS-232 serial
  ports, four USB 2.0 console ports and a four-port gigabit switch. The uplink is a combo port that is
  an RJ45 or an SFP. A 4G LTE cellular modem is fitted, with two SIM slots on the front. Main, GPS and
  auxiliary antenna jacks and a 9 to 30 VDC power input are on the rear.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear Resilience Gateway ACM7000 data sheet (October 02, 2026): console specifications, interfaces,
      power, dimensions, weight, model table, package checklist and accessories. Resilience Gateway Quick
      Start Guide for the ACM7004-2-L, ACM7008-2-L and ACM7004-5-L (06052019), page 2: the front and rear
      photographs with callouts. Its footnote says NET2 is the built-in switch on the ACM7004-5 units.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, Dimensions and Weight: 5 1/8 x 4 3/4 x 1 3/8 in, 13 x 12 x 3.5 cm, 0.6 kg. Form factor
      "Compact". The user manual's appendix prints the same 13 x 12 x 3.5 cm. The rack kit 590003 and
      the DIN rail kit 590012 are accessories and no source dimensions them, so the body is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: the ACM7004-5-L front photograph of the Quick Start Guide is measured against the 130 mm
      data sheet width. It is 717 px wide, straight on, with no scale marker, so 5.5 px/mm across. Every
      position on the front is read off the photograph, good to about 0.7 mm. These are the SFP cage,
      the RJ45 jack, the lamps and their symbols, the two SIM slots and the printing. The lamps, slots
      and printing right of the network ports are the ACM7004-2-L's to within 1 mm.
  rear-layout:
    confidence: estimated
    note: >-
      Method: the ACM7004-5-L rear photograph of the Quick Start Guide is 1127 px wide. The body is 1075
      px across for 130 mm (8.27 px/mm), so the face is orthographic to about 1 percent. The two RJ45
      blocks, the SMA jacks, the USB ports and the power housing are read off it, good to about 0.5 mm.
  cellular:
    confidence: datasheet
    note: >-
      Data sheet: ACM7004-5-L has a 4G LTE modem (Sierra Wireless EM7565, Cat-12) and two SIM card slots.
      Quick start, page 3: slide the carrier mini SIM into the slot with the contacts facing up. The rear
      photograph labels the antenna jacks (M), a satellite symbol and (A). The jacks are SMA by the registry's
      reading of the photograph. No document names the connector, which is recorded in the gaps.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: ACM7004-5 has 4 RJ45 RS-232 "Cisco straight" pinout console ports, 50 to 230,400 bps,
      and a 4 port embedded gigabit switch. The photograph numbers the serial ports 1 and 2 on the left
      and 3 and 4 on the right. It prints SERIAL beneath.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. ACM700x-2 Quick Start Guide, page 3, "Configure managed
      devices": set the Console Server Mode radio button for a port. The data sheet calls them "console
      ports".
  network:
    confidence: datasheet
    note: >-
      Data sheet: ACM7004-5 has 4 x 10/100/1000 Ethernet switch ports and 1 x 10/100/1000 Ethernet/SFP
      uplink, all with 1500 V AC isolation. The front photograph prints NET1(S) over an SFP cage and NET1(C)
      over an RJ45 jack. They are one combo port, drawn as two placements sharing the number. The rear
      photograph prints NET2 and the numbers 1 to 4 round the switch block. The quick start footnote says
      NET2 is the built-in switch.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: 4 x USB 2.0 console ports. The rear photograph shows two stacked pairs of USB-A jacks,
      lettered A and B on the left and C and D on the right. The user manual, section 3.1.8, puts the
      ACM7008-2 USB ports on the front. The photograph puts them on the rear, and the drawing follows
      the photograph.
  lamps:
    confidence: estimated
    note: >-
      The front photograph shows four lamps at the left. A power symbol, a heartbeat symbol, IOIO and
      an antenna symbol sit beside them. Four signal lamps sit at the right of the SIM slots beside a
      signal-bar symbol, all dark. The rear photograph shows a small light pipe at each corner of each
      switch jack. No document held gives a colour or a meaning for any of them, so each is drawn off
      and states are a gap.
  power:
    confidence: datasheet
    note: >-
      Data sheet: 110-240 V AC to 12 V DC external power adapter in the box (450031), consumption less
      than 11.5 W. Optional supplies are 450037, 450039 and 450041. The rear prints 9~30V DC under a four-position
      housing. The user manual's appendix says less than 30 W for all models. The data sheet's 11.5 W
      is followed.
  livery:
    confidence: estimated
    note: >-
      The red and black front, the two diagonal stripes, the wordmark and the printing are read off the
      front photograph. They are painted livery, not parts. The red is the photograph's sampled median,
      #fa0024 over 800 px. The logo mark is a simplified outline.
  sides:
    confidence: datasheet
    note: >-
      No source shows the top, bottom or either side of the unit. The user manual says the connection
      status can be seen from the LEDs on top of the device. No picture of the top is held.
attrs:
  physical: {weight-kg: 0.6}
  power:
    power-max-w: 11.5
    power-input: 9 to 30 VDC four-position housing; 12 VDC external adapter in the box
  environmental: {operating-temp-c: -25 to 60, humidity-pct: 5 to 90}
  platform: {cpu: 800 MHz Armada 370 ARMv7 SoC (Marvell 88F6W11), memory: 256 MB DDR3 SDRAM, storage: 4
      GB NAND flash}
  features:
    cellular: Sierra Wireless EM7565, 4G LTE Cat-12
    optics-sfp: 1GbE SFP in the combo uplink; no document held names an optic type or reach
  lifecycle: {eol: none-announced}
chassis: {width: 130.0, height: 35.0, depth: 120.0, color: '#2a2a2d', mount: desktop}
gaps:
- what: rack-kit
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The data sheet lists Rack Mount Kit 590003, DIN Rail 590012 and Rack Mount Tray 590033. The quick
    start describes 590003 as a tab with two rack screws, two nuts and three screws, fixed to the side.
    No held document dimensions any of them, so none is modelled.
  wanted: The kit installation guide for 590003, 590012 and 590033.
- what: lamp-states
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The front prints eight lamps and the two lamps of the RJ45 jack. The rear shows a light pipe at the
    corners of each switch jack. No held document gives the colours or meanings, so each is drawn off
    with no states. The four signal lamps are small rectangles in the photograph. They are drawn as the
    library's round lamp, a stand-in for the shape.
  wanted: A hardware guide with the LED table.
- what: gps-jack-connector
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The middle antenna jack is printed with a satellite symbol. The data sheet lists an active GPS antenna
    (569018) and no connector. It is drawn as SMA like the other two jacks.
  wanted: A hardware guide that names the antenna jacks.
- what: antenna-jack-connector
  scope:
  - rear
  reason: vendor-silent
  note: >-
    No document names the jacks marked (M) and (A). SMA is read from the photograph (gold hex nut, centre
    pin).
  wanted: A hardware guide that names the antenna jacks.
- what: sim-slot-size
  scope:
  - front
  reason: needs-drawing
  note: >-
    The two mini SIM slots are drawn from the photograph alone, and no document dimensions the slot. The
    quick start says slot 1 is the bottom slot and the manual says top or bottom. The photograph shows
    two slots side by side.
  wanted: A drawing of the front panel.
- what: power-housing
  scope:
  - rear
  reason: vendor-silent
  note: >-
    No document names a maker, series or pitch for the four-position power housing. It is a declared stand-in
    with a registered key and a plug.
  wanted: A dimensioned drawing of the rear panel.
