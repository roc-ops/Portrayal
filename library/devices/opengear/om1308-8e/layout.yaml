format: 1
kind: device
name: om1308-8e
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: OM1308-8E
description: >-
  Opengear OM1308-8E Operations Manager, a half-width 1RU appliance. It has
  eight RJ45 RS-232 serial ports and an eight-port managed Ethernet switch.
  It has two combo network ports, each an RJ45 or SFP. It has two USB 3.0 ports
  and a USB-C console port. Two 12 VDC power jacks are on the rear, and one
  adapter is supplied.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear OM1300 Operations Manager datasheet (September 22, 2026): model
      table, interfaces, power, cooling, dimensions and weight, package
      checklist and accessories. OM1300 Quick Start Guide v1 (September 2026):
      "In the Box" front and rear callouts, hardware installation steps, the LED
      panel table. The OM1308-8E front and rear photographs and the serial
      pinout drawing published with them.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, Dimensions and Weight: standard models 8.66 x 7 x 1.75 in, 220 x 177 x 44 mm, 1.45 kg. Form factor "Compact - SFF 1RU half-rack
      width". The rack kit 590054 ships in the box but no source
      dimensions it, so the body is drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: the OM1308-8E front photograph (2560 x 1440, straight on, no scale
      marker) is measured against the data sheet envelope by its transparent
      background: the body outline is 1394 px wide and 279 px high,
      6.34 px/mm across from 220 mm and 6.34 px/mm down from 44 mm, so the face is
      orthographic to about 2 percent. Every position on the front is read off that photograph
      and is good to about 1 mm: the two SFP cages, the two RJ45 jacks, the serial block
      (pitch 13.97 across, rows 14.0 apart, the pitch of the library's ganged jack), the
      eight-jack switch block, the two USB-A ports, the USB-C console, the erase pinhole, the six
      lamps and the printing. The serial and switch blocks are read on the front only.
  rear-layout:
    confidence: estimated
    note: >-
      Method as the front: the OM1308-8E rear photograph is 1385 px wide and 277 px high
      (6.3 and 6.3 px/mm), orthographic to about 2 percent. The two 12VDC jacks
      (centres 159.5 and 209.7 mm) are read off it, good to about 1 mm.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: OM1308-8E has 8 RJ45 RS232 serial ports with a software selectable
      straight or rollover pinout, 50 to 115,200 bps. The pinout drawing prints the X2 "Cisco
      Straight" pins 1 CTS, 2 DSR/DCD, 3 RxD, 4 GND, 5 not connected, 6 TxD, 7 DTR, 8 RTS, and the X1
      "Cisco Rolled" pins. The photograph numbers the ports 1, 3, 5 and 7 over 2, 4, 6 and 8, with SERIAL printed
      between the lower numerals.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. Quick Start Guide, "Configure Serial Ports": "Mode:
      Console Server" is the default. The data sheet calls them "Managed Serial Ports" and the
      USB-C jack the "Local Console Port".
  switch:
    confidence: datasheet
    note: >-
      Data sheet: OM1308-8E lists 8 "Ethernet Switch Ports" in its model table; the
      Interfaces table says "4 x Managed 10/100/1000 Base-T switched Ethernet Ports". The photograph
      prints SWITCH between the lower numerals of 6 and 8 and draws 8 jacks, each
      with two lamps, which is what is placed. Quick Start Guide: the switch ports are bridged by
      default in an interface called "Switch".
  network:
    confidence: datasheet
    note: >-
      Data sheet: "2 x combo ports - RJ45 100BASE-TX/1000 BASE-T or SFP". The photograph prints
      NET1(S), NET2(S) over two stacked SFP cages and NET1(C), NET2(C) over two stacked RJ45
      jacks, each jack with two lamps. The (S) and (C) halves of one number are one combo port;
      both halves are placed and share the number, the way the library draws other combo ports.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: two USB 3.0 ports (mass storage, device console management) and one USB-C
      console port, default 9600 8N1. The photograph labels the two USB-A jacks A and B and prints
      the SuperSpeed mark under them.
  lamps:
    confidence: datasheet
    note: >-
      Quick Start Guide, LED Panel: six LEDs, Power, Heartbeat, Network, IOIO, Cloud / Internet
      and Cellular Interface, each with its states. The photograph prints the power, heartbeat
      and network symbols over the top row and IOIO, an antenna and a cloud under the second row.
      The Cellular lamp is printed on every model, the standard ones included.
  power:
    confidence: datasheet
    note: >-
      Data sheet: dual power inputs, the second available as redundancy; one universal 110-240 V AC
      to 12 V DC external adapter in the box (450047, 65 W, IEC C14 inlet), a 60 W 18-72 V DC kit
      (450050) as an accessory; consumption "Less than 32W (110 BTU/h)". The rear prints 12VDC under each jack.
      Quick Start Guide: connect a second power cable for redundancy; the power lamp is green
      for redundancy and amber for none.
  livery:
    confidence: estimated
    note: >-
      The red and charcoal faces, the two diagonal stripes, the light label tabs and the wordmark
      are read off the photographs at the same scale and are painted livery, not parts. The logo
      mark is a simplified outline.
  sides:
    confidence: datasheet
    note: >-
      No source shows the top, bottom or either side of the unit. Passive cooling is stated
      (data sheet) and the front and rear photographs show a row of vent openings along their top
      edge, drawn on those faces.
attrs:
  physical: {weight-kg: 1.45}
  power:
    power-max-w: 32
    power-input: >-
      two 12 VDC jacks, the second for redundancy; external adapter 450047 in the box
  thermal: {cooling: passive; forward or reverse mounted}
  environmental: {operating-temp-c: -25 to 60, humidity-pct: 5 to 90 non-condensing}
  platform:
    cpu: 1.6 GHz quad-core ARM Cortex-A53
    memory: 4 GB LPDDR4
    storage: 32 GB eMMC
    tpm: 'TPM 2.0'
  features:
    optics-sfp: >-
      1GbE SFP in the combo ports; no document held names an optic type or reach
chassis:
  width: 220.0
  height: 44.0
  depth: 177.0
  ru: 1
  color: '#3a3a3d'
  power: dc
gaps:
- what: rack-kit
  scope: [front]
  reason: needs-drawing
  note: >-
    The data sheet lists Rack Mount Kit 590054 in the box and Rack Tray Kit
    590085 (to full-rack width) as an accessory, and describes the unit as
    half-rack width. No held document dimensions either kit or says where the
    ears sit, so no ear or kit is modelled.
  wanted: The kit installation guide for 590054 and 590085.
- what: second-power-jack-function
  scope: [rear]
  reason: vendor-silent
  note: >-
    The data sheet says "Dual Power inputs, second available as redundancy"
    and the Quick Start Guide says to connect a second power cable for
    redundancy, but the box holds one adapter and no document says whether the
    jacks are interchangeable or which one the adapter belongs in. Both are
    drawn as 12 VDC jacks.
  wanted: A hardware guide that says what each jack feeds.
- what: jack-barrel-size
  scope: [rear]
  reason: vendor-silent
  note: >-
    The data sheet calls the supply output a "locking barrel connector" and the photograph shows
    a locking nut on each jack, but no held document gives the barrel size or polarity. The part
    is the library's one nominal barrel jack, drawn without the nut.
  wanted: A dimensioned drawing of the rear panel or the adapter plug.
- what: power-draw
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The data sheet states "Less than 32W (110 BTU/h)" for the unit and no figure for any
    one jack, lamp or port, so none is stated for them.
  wanted: A per-port power table.
- what: switch-lamp-meaning
  scope: [front]
  reason: vendor-silent
  note: >-
    Each switch jack shows two lamps in the photograph. No held document says what they mean, so
    the lamps keep the library's link and activity convention for an Ethernet jack.
  wanted: A hardware guide that tables the switch jack lamps.
- what: switch-port-count
  scope: [front]
  reason: sources-disagree
  note: >-
    The data sheet's Interfaces table says "4 x Managed 10/100/1000 Base-T switched Ethernet Ports"
    for the whole family, its model table says "8x RJ45 Ethernet Switch Ports" for the OM1308 models, and
    the Quick Start Guide says "4x 1GbE Managed Switch Ports". The OM1308 photograph shows eight
    jacks under SWITCH, so eight are placed.
  wanted: A hardware guide or ordering guide that states the OM1308 switch port count.
- what: local-console-rj45
  scope: [front]
  reason: sources-disagree
  note: >-
    The Quick Start Guide, "Configure Local Console", says OM1300 appliances have one RJ45 serial
    console and one USB-C serial console. The front photograph and the data sheet show the USB-C
    console port only, so only that is placed.
  wanted: A hardware guide that says whether an RJ45 console exists.
groups:
  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: eight RJ45 RS-232 serial ports, software selectable pinout.
  switch:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the eight managed switch ports, 10/100/1000 Base-T.
  net-rj45:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the RJ45 halves of the two combo network ports NET1 and NET2.
  net-sfp:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the SFP halves of the two combo network ports NET1 and NET2.
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: two USB 3.0 ports, A and B.
  console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-c}
    description: the USB-C local console port.
  controls:
    term: Control
    role: management
    index-origin: 1
    description: the factory erase pinhole.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  inlets:
    term: Inlet
    role: service
    index-origin: 1
    attrs: {input-voltage: 12 VDC}
    description: the two 12 VDC power jacks; the second is for redundancy.
