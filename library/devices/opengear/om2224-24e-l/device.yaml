format: 1
kind: device
name: om2224-24e-l
version: 0.1.0
maturity: modelled
manufacturer: Opengear
model: OM2224-24E-L
description: >-
  Opengear OM2224-24E-L Operations Manager, a 1RU rack appliance with dual AC power. It has 24 RJ45 RS-232
  serial ports and a 24-port managed Ethernet switch on the front. Two 1G combination ports NET1 and NET2
  take an RJ45 or an SFP. Two USB 3.0 ports, an RJ45 console and a micro-USB console are on the front.
  Eight USB 2.0 ports, two SIM slots, three antenna jacks and two IEC C14 power inlets are on the rear.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Opengear OM2200 Operations Manager datasheet (September 22, 2026), pages 1 to 4: interfaces, power,
      dimensions and model table. Opengear OM2200 Quick Start Guide v1 (October 2026) is the other source.
      Its page 5 holds the "In the Box" figures. Page 5 also holds the AC rear figure. Page 9 holds the
      LED table. The OM2224-24E-L front photograph and the OM2200 DC rear photograph are published with
      the family. The AC inlets are read off the page 5 rear figure.
  chassis:
    confidence: datasheet
    note: >-
      Data sheet, page 2, Physical Dimensions: "17.25 x 10.25 x 1.75 in, 44 x 26 x 4.5 cm", 3.5 kg, 1RU.
      The metric figures 440 x 260 mm are used for width and depth, as for the CM8100 family. The height
      is the 1RU 44 mm of the sibling devices. The data sheet does not say whether the width includes
      ears. Rack mount kit 590037 ships in the box and no held document dimensions it, so the body is
      drawn alone.
  front-layout:
    confidence: estimated
    note: >-
      Method: the OM2224-24E-L front photograph is measured against the data sheet envelope by its transparent
      background. It is 2560 px wide and shows the top plate at a slight angle. The face is 2138 px wide
      from 440 mm, 200 px high from 44 mm, so 4.859 px/mm across, 4.55 px/mm down. Every position on the
      front is read off that photograph and is good to about 1.5 mm across and 2 mm down. Jack centres
      are read from crops at 4 times. The two blocks of 12 columns are read on this face only.
  rear-layout:
    confidence: estimated
    note: >-
      Method as the front: the OM2200 DC rear photograph (2560 x 1707) is 2250 px wide for 440 mm. That
      is 5.114 px/mm across and about 5.2 px/mm down. The eight USB-A jacks, the livery and the printing
      are read off it, good to about 1.5 mm. The photograph carries no model name. It is used for this
      model because the quick start shows the 10G variation as a change of the front only.
  top-layout:
    confidence: estimated
    note: >-
      Method: the front and rear photographs show the top plate at a slight angle. Seven screw heads are
      counted: three along the rear lip and two on each side. Their positions are read by interpolating
      along the plate's edges, good to about 10 mm. The seam along the front lip is a thin line in both
      photographs. In this view y = 0 is the rear of the chassis.
  serial:
    confidence: datasheet
    note: >-
      Data sheet: OM2224-24E has 24 RJ45 RS-232 ports with a software selectable straight or rollover
      pinout, 50 to 230,400 bps. The photograph numbers them 1 to 24 in two rows of 12 columns.
  serial-role:
    confidence: datasheet
    note: >-
      The serial ports are console server ports. Quick Start Guide, "Configure Serial Ports": the default
      mode is Console Server. The data sheet calls them "Managed Serial Ports".
  switch:
    confidence: datasheet
    note: >-
      Data sheet: 24 managed 10/100/1000 Base-T switched Ethernet ports. Quick Start Guide, page 14: the
      switch ports are bridged by default in an interface called "Switch". The 1G photograph prints NET3
      over this block and the 10G photograph prints SWITCH.
  network:
    confidence: datasheet
    note: >-
      Data sheet: 2 x 10/100/1000 Ethernet/SFP Fiber auto-media ports (1 GbE chassis). Quick Start Guide,
      page 5: NET1 and NET2 are combination interfaces, either SFP or copper.
  usb:
    confidence: datasheet
    note: >-
      Data sheet: 2 USB 3.0 host ports and 8 USB 2.0 ports for device console management. The front photograph
      prints the SuperSpeed mark under the two blue jacks. The rear photograph labels the eight jacks
      A to H.
  console:
    confidence: datasheet
    note: >-
      Data sheet: one RJ45 serial (straight pinout) and one micro USB 2.0 console port. The photograph
      prints CONSOLE under the micro-USB jack.
  lamps:
    confidence: datasheet
    note: >-
      Quick Start Guide, page 9, LED Panel: six lamps, each green, amber or off with the stated flashing
      states. The photograph shows all six dark, so no lit colour is sampled. The lit colours are the
      library's lamp colours.
  power:
    confidence: datasheet
    note: >-
      Data sheet, page 2: "Dual IEC 60320 Socket Universal 100-240V AC 50/60Hz", 1.6 A maximum. Quick
      Start Guide, page 5: the rear figure labels two inlets "Dual AC Power Supply". Page 7 lists two
      IEC C14 to C13 cables, 440055.
  livery:
    confidence: estimated
    note: >-
      The red field, the dark panel, its stripes, the label strips and the wordmark are painted livery,
      not parts. They are read off the photographs. Colours are medians of sampled pixels: front red #da212a,
      rear red #ec252d, dark panel #252528, top plate #939597. The logo mark is a simplified outline.
      The silver plate round the console jack and the two USB ports is a rounded rectangle behind the
      three jacks. Its colour #d4cec2 is the median of 1456 pixels from the strip left of the console
      jack. Its edges are found by pixel scan of the same photograph, against the USB jack positions,
      and are good to about 1 mm. The black pull tab under the vents is a decor tab at the bottom edge,
      29.8 mm wide, read from the photograph. In the photograph it hangs below the chassis edge, and the
      drawing keeps it inside the 44 mm height.
  sides:
    confidence: estimated
    note: >-
      The data sheet prints "Passive Cooling - can be forward or reverse mounted". No held picture shows
      a side or the bottom straight on. The vent slots are read off the front and rear photographs.
attrs:
  power: {power-input: 'two IEC C14 inlets, 100 to 240 V AC 50/60 Hz', power-max-a: 1.6}
  features:
    optics-sfp: >-
      1G SFP in the NET1 and NET2 combination ports; no document held names an optic type or reach
  thermal: {cooling: passive; forward or reverse mounted}
  environmental: {operating-temp-c: 5 to 50, humidity-pct: 5 to 90}
  platform: {cpu: AMD GX-412TC 1.4 GHz 4-core x86, memory: 8 GB DDR3, storage: 64 GB M.2 SATA SSD, tpm: TPM
      2.0}
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 260.0, ru: 1, color: '#939597', power: ac}
gaps:
- what: rack-kit
  scope:
  - front
  reason: needs-drawing
  note: >-
    The data sheet and quick start list Rack Mount Kit 590037, ears and screws. No held document dimensions
    the ears or says where they sit, and the photographs show the chassis without ears, so no ear is modelled.
  wanted: The installation guide for rack mount kit 590037.
- what: ac-rear-picture
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The only held picture of an AC rear is the quick start page 5 figure of a cellular model, 1190 px
    wide. The inlet positions and the bay shapes are read off it, and the rear livery and USB positions
    are read off the DC photograph. No held picture shows a non-cellular AC rear, so that rear is the
    same face without the cellular parts.
  wanted: A rear photograph of the AC model.
- what: c14-inlet-turn
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The figure shows each inlet with its earth pin to the left. The part std/c14-inlet@1 is turned a quarter
    turn to match. Its shroud is drawn from a standard drawing, not from the maker's.
  wanted: A rear photograph of the AC model.
- what: sim-slot-size
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The quick start figure shows two slot openings 16 mm wide. The part opengear/sim-slot-2ff@1 is sized
    from the ACM7000 photograph. No OM2200 document gives the card size.
  wanted: The OM2200 hardware guide.
- what: antenna-jack-connector
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The three jacks are drawn as SMA, which the figure shows by their gold hex nuts. No document names
    the connector. The third jack is printed with a crossed satellite and the quick start says GPS is
    not implemented.
  wanted: The OM2200 hardware guide.
- what: usb2-jack-colour
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The rear photograph shows eight black jacks and the data sheet calls them USB 2.0. The library part
    std/usb-a@1 draws a blue USB 3.0 jack, so the rear jacks are the wrong colour.
  wanted: A black USB 2.0 type-A jack part.
- what: jack-lamp-meaning
  scope:
  - front
  reason: vendor-silent
  note: >-
    The photograph shows a green window at each RJ45 jack corner. No held document says what a jack lamp
    shows, so no state is written for one.
  wanted: The hardware guide with its jack lamp table.
- what: power-draw
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The data sheet gives 1.6 A maximum for the mixed port models and no figure for one port or lamp.
  wanted: A per-port power table.
- what: serial-pinout-switch
  scope:
  - front
  reason: vendor-silent
  note: >-
    The data sheet says each pinout is software selectable. The quick start gives the default, Pinout
    X2. No held document says how a pinout is set, so the ports carry no pinout attribute.
  wanted: The user guide section that sets the port pinout.
groups:
  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: twenty-four RJ45 RS-232 serial ports with a software selectable pinout.
  switch:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the twenty-four managed switch ports, 10/100/1000 Base-T.
  net-sfp:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the SFP halves of the two combination ports NET1 and NET2.
  net-rj45:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the RJ45 halves of the two combination ports NET1 and NET2.
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: two USB 3.0 host ports on the front.
  usb-serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
    description: eight USB 2.0 ports on the rear, A to H, for device console management.
  console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console}
    description: the RJ45 local console port.
  console-usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: micro-usb-b, role: console}
    description: the micro-USB local console port.
  controls: {term: Control, role: management, index-origin: 1, description: the config erase pinhole.}
  status-leds: {term: LED, role: indicator, index-origin: 1}
  top-screws:
    term: Screw
    role: service
    index-origin: 1
    description: the seven screws that hold the top plate, counted on the photographs.
  inlets:
    term: Inlet
    role: service
    index-origin: 1
    attrs: {input-voltage: 100-240 V AC}
    description: the two IEC C14 power inlets.
  wwan:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: coax-sma}
    description: >-
      the main and auxiliary antenna jacks and the GPS jack, which the quick start marks not implemented.
  sim:
    term: Slot
    role: service
    index-origin: 1
    attrs: {media: sim}
    description: the two SIM card slots.
