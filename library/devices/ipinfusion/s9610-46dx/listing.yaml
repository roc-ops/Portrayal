format: 1
kind: listing
hardware: ufispace/s9610-46dx
version: 1.0.0
portfolio: {line: OcNOS SP}
description: >-
  Supported by OcNOS SP 7.0.1, licensed per switching capacity as OcNOS-SP-IPBASE-7200, OcNOS-SP-MPLS-7200, OcNOS-SP-PLUS-7200.
  Those are software licences shared by every box of the same capacity, not part
  numbers for this one.
source: >-
  OcNOS 7.0.1 MR Hardware Compatibility List (IP Infusion, July 2026), the row for
  S9610-46DX, current supported 'SP 7.0.1'.
  The names follow OcNOS's pattern rather than a table for this box: the port's speed class
  as prefix (ge 1G, xe 10G and 25G, ce 40G and 100G, cd 400G) and one 0-based count across
  the whole front panel, with eth0 for management. That is how the S9510-30XC's own
  configuration in the OcNOS SP 7.0 Segment Routing Guide names its ports - ce0, ce1, xe2 to
  xe29 - and it is exactly the UfiSpace silkscreen numbering, which this box shares. Not every
  platform counts this way: the AS7316-26XB example in the Layer 3 Guide restarts at xe0
  after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered in
  one run from 0, and nowhere else.
gaps:
  - what: ocnos-management-sfp-names
    reason: vendor-silent
    note: >-
      The mgmt-sfp-0, mgmt-sfp-1, mgmt-sfp-2, mgmt-sfp-3 SFP cage(s) sit outside the numbered front-panel run, and no OcNOS
      document held here names them. They are left out of `interfaces`, so the IP Infusion
      device type does not list them; the UfiSpace one still does.
    wanted: >-
      The Port Mapping chapter of the OcNOS UfiSpace Installation Guide for this box, or
      `show interface brief` from a unit - whatever OcNOS calls these cages.
interfaces:
  - {physical: 'port-{n}', name: 'ce{n}', range: '0-39'}
  - {physical: 'port-{n}', name: 'cd{n}', range: '40-45'}
  - {physical: 'port-{n}', name: 'xe{n}', range: '46-49'}
  - {physical: oob, name: eth0}
nos: ocnos
nos-versions: '>=7.0.1'
