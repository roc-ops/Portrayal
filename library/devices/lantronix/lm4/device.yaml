configurations:
  ac-4s:
    kind: orderable
    default: true
    description: >-
      The four-port unit with its external AC adapter. The brief lists LM4-4S and says AC plug options are available.
      The product page lists LM4-4S-NA, LM4-4S-UK and LM4-4S-EU, which differ by the power cord and adapter plug. They
      are not drawn as separate builds.
    part-numbers:
      LM4-4S: {}
  ac-2s:
    kind: orderable
    description: >-
      The two-port unit with its external AC adapter. The brief lists "LM4-2S: LM4, 2 serial ports". The product page
      lists LM4-2S-NA, LM4-2S-UK and LM4-2S-EU, which differ by the power cord and adapter plug. It is drawn with four
      jacks like the four-port unit, so its export lists four ports. That is a drawing choice and not the maker's count
      of two. The brief lists a serial port activation licence.
    export-description: >-
      Lantronix LM4-2S console server. The maker lists two serial ports. This drawing has four jacks, so the port list
      shows four. That is a drawing choice, not the maker's count.
    part-numbers:
      LM4-2S: {}
