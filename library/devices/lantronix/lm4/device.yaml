format: 1
kind: device
name: lm4
version: 0.1.0
maturity: draft
manufacturer: Lantronix
model: LM4
description: >-
  Lantronix LM4 compact advanced serial console server, a small chassis with four RJ45 serial ports. The front has one
  10/100/1000 Ethernet port, an RJ45 console port, one SFP port and two USB-A ports. No held document shows its rear.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      Lantronix LM4 product brief (MPB-00246 Rev A), page 2, System Specifications, Dimensions and Weight. It prints
      "44.45 mm (1.75 in.) x 158.75 mm (6.25 in.) x 158.75 mm (6.25 in.)" as height, width and depth. The width is one
      third of the 482.6 mm rack opening.
  layout-source:
    confidence: estimated
    note: >-
      The only picture of the front is the angled photograph on page 1 of the brief. It is 1550 x 1358 px and was taken
      from the left and above. Every position is read from it by eye. The four corner screws are the control points of a
      projective map to the 158.75 by 44.45 mm face. Their place on the face is itself read from the plate edges in the
      same photograph. It is 4.5 mm in from each side and 3.6 mm from top and bottom. The screw centres, re-read in the native
      photograph, are top-left 383,725, top-right 1029,619, bottom-left 383,897 and bottom-right 1029,777 (x,y in px).
      The left screws are 172 px apart and the right screws 158 px apart. The placements were made from an earlier
      reading of the same four screws, within 7 px of these. Each position is read by eye from an angled photograph, and
      its error was not measured. The rows of each column are drawn level where the photograph reads them 1.5 mm apart.
      The photograph's serial jacks read about 15.8 mm wide and the ganged jack part is 12.7 mm wide. The part is placed
      on the photograph's centres and the two widths are not made to agree.
  serial:
    confidence: datasheet
    note: >-
      LM4 product brief: "Supports up to 4 devices via serial (RS-232)". The photograph shows four RJ45 jacks in two
      rows of two numbered 1 and 2 over 3 and 4 under blue bars. The fact sheet says the ports are "RJ-45 wired as DCE".
      The brief lists LM4-2S as a 2-port model and a "1 serial port activation" licence. No held document says how many
      jacks the 2-port unit has. Every build is drawn with four jacks, so the LM4-2S export lists four ports. That is
      not a statement of the maker's.
  network:
    confidence: datasheet
    note: >-
      LM4 product brief: "One 10/100/1000 BaseT Ethernet interface" and "One 1-Gbps SFP port". The photograph prints E1
      under the RJ45 jack and E2 under the SFP cage. The maker's product page says "2 Ethernet Ports" for each model,
      which counts the two.
  console:
    confidence: datasheet
    note: >-
      LM4 product brief: "one RS-232 console port", "Two USB-A ports". The jack at the top of the column of three
      carries a prompt mark and is the console jack. The two USB-A ports are under it. The brief does not say what
      either USB port is for beyond "an external cellular modem connected over USB" on page 2.
  leds:
    confidence: estimated
    note: >-
      The photograph shows three small lamps in a level row and a round button. Under each lamp is a mark: a power
      mark, a bolt mark and a warning triangle. The lamp centres and the button colour are read from the photograph. No
      document says what a lamp shows or what the button does. The face does not draw these marks. Above E1 is a
      network icon and above E2 an antenna icon. Beside E1 and E2 are a link icon and an arrows icon. To the right of
      the serial jacks is a "10101" mark. Under the lamps are the three marks, and under the four-position housing is
      the DC mark. The photograph also shows a larger dark hole between the lamps and a small dark dot beside each of E1
      and E2. None is drawn or named.
  storage:
    confidence: datasheet
    note: >-
      The maker's product page for the LM4 prints "16GB eMMC flash memory supporting TCG Opal 2.0, 256-bit AES
      encryption" as the on-board storage. The brief and the fact sheet do not print this line.
  power:
    confidence: datasheet
    note: >-
      LM4 product brief: "DC input: 9 to 60 VDC" and "Power consumption: Less than 24W". The external AC to DC supply
      reads "AC Input: 100-240VAC, 50-60HZ, 1.4A" and "DC Output: 12VDC, 3A". The photograph shows a four-position
      connector at the lower left of the front, over a direct-current mark. No document names its type, pitch or the
      plug that mates it, so it is not drawn as a part.
  body:
    confidence: estimated
    note: >-
      The photograph shows a black front plate and lid and a silver left flank with three screws. At the top left of
      the front it shows a heatsink block of six fins, counted in a zoomed crop of the photograph. The colours are read
      from the photograph. The two USB-A ports show a pale tongue, drawn with the library's pale-tongue skin. The brief
      does not give a USB version. The right flank, the underside and the rear are not shown. The LANTRONIX wordmark is
      a logo and is not drawn: its place is the region logo-zone, read from the photograph. The plain text LM4 stays.
      The button and the four corner screws are round in the photograph. The kit has no circle decor shape and draws
      round decor as a rounded square, so they are drawn as rounded squares.
  mount:
    confidence: estimated
    note: >-
      The maker's product page lists "Rack Mount Ear" and "2 Mounting Screws" in the box. The brief calls the unit small
      and for IDFs and kiosks. No document shows an ear, a bracket or a position, so the unit is stated as a desktop
      device.
attrs:
  physical: {weight-kg: 1.42}
  power:
    input: dc
    power-max-w: 24
    power-input: 9 to 60 VDC; the box holds an external AC adapter, 100 to 240 VAC in, 12 VDC 3 A out
  environmental:
    operating-temp-c: 0 to 55
    storage-temp-c: -30 to 60
    humidity-pct: 10 to 90 non-condensing in operation
  features:
    optics-sfp: one 1-Gbps SFP port; no held document names an optic type or reach
  platform:
    storage: 16 GB eMMC flash, TCG Opal 2.0, 256-bit AES encryption
  compliance:
    emissions: FCC class A subpart B
    safety: UL
    rohs: RoHS compliant
  lifecycle: {eol: none-announced}
chassis:
  width: 158.75
  height: 44.45
  depth: 158.75
  mount: desktop
  color: '#2b2e33'
gaps:
- what: dc-input
  scope: [front]
  reason: vendor-silent
  wanted: the maker's name for the DC input connector, its pitch and the plug that mates it, from a hardware guide.
  note: >-
    The photograph shows a four-position housing at the lower left of the front. The brief gives the input range and
    the adapter's output, and names no connector. No part is placed and the position is left bare.
- what: rear-panel
  scope: [rear]
  reason: needs-photo
  wanted: a photograph or a drawing of the rear of the LM4.
  note: >-
    No held document shows the rear.
- what: front-positions
  scope: [front]
  reason: needs-drawing
  wanted: a straight front elevation or a hardware guide figure with dimensions.
  note: >-
    The positions are read by eye from an angled photograph, and their error was not measured.
- what: indicator-led
  scope: [front]
  reason: vendor-silent
  wanted: a table of what the three lamps and the round button show and do, and the marks beside them.
  note: >-
    No held LM4 document describes a lamp or a button. The lamps are drawn with no state. The photograph shows green and
    yellow lamps lit on the console and serial jacks. The built face shows none of them.
- what: mounting
  scope: [front]
  reason: vendor-silent
  wanted: a drawing of the rack mount ear and the screw positions.
  note: >-
    The product page lists "Rack Mount Ear" in the box. No held document shows it or says where it fits.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: photographs of the lid, the underside and both flanks.
  note: >-
    The four faces draw the envelope only. The photograph shows slats on the lid at the left and three screws on the
    left flank. It shows nothing of the right flank or the underside. Its size gives no position.
