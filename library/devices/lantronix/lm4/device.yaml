configurations:
  ac-4s:
    kind: orderable
    default: true
    description: >-
      The four-port unit with its external AC adapter. The brief lists LM4-4S and says AC plug options are available.
      The product page lists LM4-4S-NA, LM4-4S-UK and LM4-4S-EU, which differ by the power cord and adapter plug. They
      are not drawn as separate builds.
    part-numbers:
      LM4-4S: {}
  ac-2s:
    kind: orderable
    description: >-
      The two-port unit with its external AC adapter. The brief lists LM4-2S. The product page lists LM4-2S-NA, LM4-2S-UK
      and LM4-2S-EU, which differ by the power cord and adapter plug. It is drawn with four jacks because no held
      document says how many jacks the 2-port unit has, so its export lists four ports. That is a drawing choice and not
      a statement of the maker's. The brief lists a serial port activation licence.
    part-numbers:
      LM4-2S: {}
