format: 1
kind: device
name: lm4
version: 1.0.0
maturity: draft
manufacturer: Lantronix
model: LM4
description: >-
  Lantronix LM4 compact advanced serial console server, a small chassis with up to four RJ45 serial ports. The front has
  one 10/100/1000 Ethernet port, an RJ45 console port, one SFP port and two USB-A ports. No held document shows its rear.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      Lantronix LMOS 6.7 Local Manager documentation, LM4 series, Physical Installation page, dimensions figure. It prints
      a front view 159.0 mm wide by 43.2 mm high and a top view 155.5 mm deep. The drawn chassis takes those figures.
      The LM4 product brief (MPB-00246 Rev A), page 2, prints a height of 44.45 mm, or 1.75 inches. It prints a width and a
      depth of 158.75 mm, or 6.25 inches. The two documents differ by 1.25 mm in height, 0.25 mm in width and 3.25 mm
      in depth. The brief's figures are round inch values and the drawing's are dimensioned in millimetres.
      The drawing's figures are drawn, and the brief's rounded figures are stated here as the difference and not drawn.
  layout-source:
    confidence: estimated
    note: >-
      The front is read from the straight front view of the dimensions figure. The printed 159.0 mm over the plate's
      outer width gives 3.384 px per mm across. The printed 43.2 mm over its outer height gives 3.409 px per mm down.
      Each figure is a pixel edge read at 4 times, rounded to 0.05 mm, and holds to about 0.4 mm (one pixel). Black outline
      strokes about 0.3 mm wide are part of each drawn edge. The marks, bars and lamp colours are not in that view. They
      are read from the straight front elevation of the callouts figure, mapped plate to plate to 159.0 by 43.2 mm. Each
      mark keeps its place beside the hardware it labels. The callouts figure is an illustration, not a dimensioned
      drawing. Its jacks differ from the dimensioned view by up to 2.6 mm at the tops. Marks follow the dimensioned
      view's hardware. The lid is read from the top view with the same scale. The left flank screws are from the earlier
      angled photograph on page 1 of the brief and hold to about 2 mm. The DC housing's opening is read from the
      dimensioned view at the same scale, and its four cells and grey opening from the callouts figure.
  serial:
    confidence: datasheet
    note: >-
      LM4 product brief: "Supports up to 4 devices via serial (RS-232)". The callouts figure labels four RJ-45 RS-232
      serial ports numbered 1 and 2 over 3 and 4. The LM-Series fact sheet says the ports are "RJ-45 wired as DCE". It does
      not name the LM4. The LM4 documentation says the device management ports operate in DCE mode.
      The brief lists "LM4-2S: LM4, 2 serial ports" and a "1 serial port activation" licence. Every build is drawn with
      four jacks, so the LM4-2S export lists four ports. That is a drawing choice and not the maker's count of two.
  network:
    confidence: datasheet
    note: >-
      LM4 product brief: "One 10/100/1000 BaseT Ethernet interface" and "One 1-Gbps SFP port". The callouts figure labels E1
      under the RJ45 jack as the management Ethernet and E2 under the SFP cage. The maker's product page says "2 Ethernet
      Ports" for each model, which counts the two.
  console:
    confidence: datasheet
    note: >-
      LM4 product brief: "one RS-232 console port", "Two USB-A ports". The documentation labels the top jack of the
      column of three as the console, auto-sensing DCE or DTE at 9600 8N1. It labels the two ports under it USB-A. It
      lists a temperature and humidity sensor, an LCD and keypad module, a modem and a flash drive as USB devices.
  leds:
    confidence: estimated
    note: >-
      The callouts figure labels three front lamps, Power, Status and Warning, over a power mark, a pulse mark and
      a warning triangle. It also labels a round Power button. It labels a Reset pinhole between the button and E1. The documentation
      says the LEDs are a single colour and the Power LED is solid green when the system is on. The figure draws all three
      lamps green, and the text names the colour of the Power lamp only. The Status and Warning lamps are drawn green as
      the figure shows them. The Status and Warning flash states are the documentation's table. Their durations are not
      stated, so a pattern with short and long flashes is a sequence of equal phases. The two small lamps at the lower
      corners of the SFP cage are drawn green on the left and brown on the right. No document says what either shows. Their
      marks are a link icon and an arrows icon. Lit colours are sampled from the callouts figure. Green is (154,196,56) over 155
      px. SFP left green is (155,197,57) over 251 px. SFP right brown is (150,125,46) over 245 px. Every lamp is drawn off. The
      console and serial jack lamps keep the photograph's colours. The dimensions figure draws the console lamps yellow at
      the left and green at the right. The callouts figure and the photograph show green at the left, and that order is
      drawn. The silkscreen marks are simplified paths in the mean
      colour of the earlier photograph. Above E1 is a network icon and above E2 an antenna icon. The console jack has a
      prompt icon in a boxed outline. To the right of the serial jacks is a "10101" mark. Under the four-position housing
      is a DC mark.
  storage:
    confidence: datasheet
    note: >-
      The maker's product page for the LM4 prints "16GB eMMC flash memory supporting TCG Opal 2.0, 256-bit AES
      encryption" as the on-board storage. The brief and the fact sheet do not print this line.
  power:
    confidence: datasheet
    note: >-
      LM4 product brief: "DC input: 9 to 60 VDC" and "Power consumption: Less than 24W". The external AC to DC supply
      reads "AC Input: 100-240VAC, 50-60HZ, 1.4A" and "DC Output: 12VDC, 3A". The documentation says the supply has a 4-pin
      connector. The front view shows a black housing at the lower left with four cells in two rows of two and a latch tab
      above. The cells are 2.95 mm apart, read at 3.38 px per mm. No document names its type, pitch or the plug that mates
      it, so it is drawn as decor only and not as a part.
  body:
    confidence: estimated
    note: >-
      The dimensions figure shows a black front plate with four round corner screws. At the top left it shows a heatsink
      block with seven slots between six fins, at a pitch of 4.49 mm. Fins are drawn 1.45 mm wide, the width the callouts
      figure shows. The dimensions figure draws the seven slots white; the callouts figure and the photograph show them
      dark, and dark is drawn. The plate colour reads (67,65,70) over 92800 px in the earlier photograph, unevenly. The
      drawn plate is #2b2e33 and stays. In the photograph the console jack and the two USB-A ports sit in one pale housing
      block. The four serial jacks sit in another, with a band between the two rows. They are drawn as two rectangles in
      the housing colour behind the parts. The housing colour reads (229,217,207), #e5d9cf, over 270177 pale pixels. The six
      RJ45 jacks (E1, the console and the four serial jacks) are drawn in that colour through their finish field. The two
      USB-A ports show a dark grey tongue in the photograph and the callouts figure. The dimensioned view draws them blue.
      The drawn tongue is pale. For a device that does not claim 3.0 the library's skin for this port is the white one,
      usb2. Its other skin is blue. Neither is dark. It is not a statement of the USB version, which the brief does not
      give. The dimensions figure prints a small 4 in the lower-left serial jack. The callouts figure and the photograph
      number that jack 3. The glyph is a mark and is not drawn here. The lid carries engraved specks that are too faint to
      read, kept as the zone lid-marking. The DC housing at the lower left is drawn as decor: a latch tab, a body, a grey
      opening and four cells, estimated. The underside and the rear are not shown. No held picture shows the right flank.
      The held pages are the brief, the fact sheet, the product pages and four figures. The right flank is built as the
      documented side, the left flank, mirrored, as no document shows this one. The LANTRONIX wordmark and the registered
      mark beside it are a logo and are not drawn: their place is the region logo-zone. The plain text LM4 stays. The
      button and the four corner screws are round and are drawn round, by a corner radius of half their side. The screws
      read 6.5 mm across and the button 7.2 mm. The Reset pinhole reads 3.2 mm across. The lid carries six ridges in seven
      slots at the left, at the front's pitch. The left flank carries three round screws about 5.8 mm across, level at
      about half the height. Their places are the fractions of the flank's length and height the photograph gives, applied
      to the drawn flank.
  mount:
    confidence: estimated
    note: >-
      The documentation says the unit mounts in a 19-inch rack, left or right, using the one provided rack
      mounting ear. It also lists a DIN rail mount bought separately, and a shelf or desk. The mounting figure shows a plain flange at
      the front of the box on one side with two screws. No document gives the ear's size or screw holes, so the generic
      ear part stands in at both sides, estimated, and the box ships one. The figure also shows two loose screws apart
      from the unit. The device file has no key for a loose part, so they are not drawn. The chassis is stated as a
      desktop unit, and no document shows the DIN rail fitting.
attrs:
  physical: {weight-kg: 1.42}
  power:
    input: dc
    power-max-w: 24
    power-input: 9 to 60 VDC; the box holds an external AC adapter, 100 to 240 VAC in, 12 VDC 3 A out
  environmental:
    operating-temp-c: 0 to 55
    storage-temp-c: -30 to 60
    humidity-pct: 10 to 90 non-condensing in operation
  features:
    optics-sfp: one 1-Gbps SFP port; no held document names an optic type or reach
  platform:
    storage: 16 GB eMMC flash, TCG Opal 2.0, 256-bit AES encryption
  compliance:
    emissions: FCC class A subpart B
    safety: UL
    rohs: RoHS compliant
chassis:
  width: 159.0
  height: 43.2
  depth: 155.5
  mount: desktop
  color: '#2b2e33'
gaps:
- what: dc-input
  scope: [front]
  reason: vendor-silent
  wanted: the maker's name for the DC input connector, its pitch and the plug that mates it, from a hardware guide.
  note: >-
    The front view shows a black housing at the lower left, 8.6 mm wide and 11.4 mm high with its latch tab. Its opening is
    drawn as decor, estimated: a grey rectangle with four cells in two rows of two, 2.95 mm apart. The documentation says
    only that the supply has a 4-pin connector. No interface is known, so no connector part is placed and its identity stays
    this gap.
- what: rear-panel
  scope: [rear]
  reason: needs-photo
  wanted: a photograph or a drawing of the rear of the LM4.
  note: >-
    No held document shows the rear. A web search found no rear picture; the maker's pages show the front and top only.
- what: lamp-colour
  scope: [front]
  reason: vendor-silent
  wanted: the maker's statement of the colour of the Status, Warning and SFP lamps.
  note: >-
    The documentation says the LEDs are a single colour and names green for the Power lamp only. The callouts figure
    shows all three front lamps green. It shows the SFP lamps green and brown and says nothing of what they report.
- what: din-rail-mount
  scope: [front, rear, top, bottom, left, right]
  reason: needs-drawing
  wanted: a drawing of the DIN rail fitting and where it fixes.
  note: >-
    The documentation says a DIN rail mount is bought separately and shows no figure of it.
- what: envelope-faces-undetailed
  scope: [bottom, right]
  reason: needs-photo
  wanted: photographs of the underside and the right flank.
  note: >-
    The left flank draws three screws, estimated from the earlier photograph at a grazing angle, to about 2 mm. No held
    picture shows the right flank, so it is built as the documented side, the left flank, mirrored. No held picture shows
    the underside, so it draws the envelope only.
