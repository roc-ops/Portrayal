format: 1
kind: device
name: lm4
version: 0.1.0
maturity: draft
manufacturer: Lantronix
model: LM4
description: >-
  Lantronix LM4 compact advanced serial console server, a small chassis with up to four RJ45 serial ports. The front has
  one 10/100/1000 Ethernet port, an RJ45 console port, one SFP port and two USB-A ports. No held document shows its rear.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      Lantronix LM4 product brief (MPB-00246 Rev A), page 2, System Specifications, Dimensions and Weight. It prints
      "44.45 mm (1.75 in.) x 158.75 mm (6.25 in.) x 158.75 mm (6.25 in.)" as height, width and depth.
  layout-source:
    confidence: estimated
    note: >-
      The only picture of the front is the angled photograph on page 1 of the brief. It is 1550 x 1358 px and was taken
      from the left and above. The four corner screws are the control points of a projective map to the 158.75 by 44.45
      mm face. Their place on the face is itself read from the plate edges in the same photograph. It is 4.5 mm in from
      each side and 3.6 mm from top and bottom. The screw centres, re-read in the native photograph, are top-left
      383,725, top-right 1029,619, bottom-left 383,897 and bottom-right 1029,777 (x,y in px). The left screws are 172 px
      apart and the right screws 158 px apart. The photograph was resampled to the face at 20 px per mm. The heatsink
      opening and its fins, the legend bars, the logo, the two pale housing blocks, the screws, the lamps, the console
      and USB column and the colours were then read from threshold masks on that image, to about 0.2 mm of edge blur.
      The control points are themselves estimated, so every figure keeps about 1 mm of the method's own error. Every
      other position is read by eye from the photograph. The placements were made from an earlier reading of the same
      four screws, within 7 px of these. The rows of each column are drawn level where the photograph reads them 1.5 mm
      apart.
      The photograph's serial jacks read about 15.8 mm wide and the ganged jack part is 12.7 mm wide. The part is placed
      on the photograph's centres and the two widths are not made to agree.
  serial:
    confidence: datasheet
    note: >-
      LM4 product brief: "Supports up to 4 devices via serial (RS-232)". The photograph shows four RJ45 jacks in two
      rows of two numbered 1 and 2 over 3 and 4 under blue bars. The LM-Series fact sheet says the ports are "RJ-45 wired as DCE". It does not name the LM4.
      The brief lists "LM4-2S: LM4, 2 serial ports" and a "1 serial port activation" licence. Every build is drawn with
      four jacks, so the LM4-2S export lists four ports. That is a drawing choice and not the maker's count of two.
  network:
    confidence: datasheet
    note: >-
      LM4 product brief: "One 10/100/1000 BaseT Ethernet interface" and "One 1-Gbps SFP port". The photograph prints E1
      under the RJ45 jack and E2 under the SFP cage. The maker's product page says "2 Ethernet Ports" for each model,
      which counts the two.
  console:
    confidence: datasheet
    note: >-
      LM4 product brief: "one RS-232 console port", "Two USB-A ports". The jack at the top of the column of three
      carries a prompt mark and is the console jack. The two USB-A ports are under it. The brief does not say what
      either USB port is for beyond "an external cellular modem connected over USB" on page 2.
  leds:
    confidence: estimated
    note: >-
      The photograph shows three small lamps in a level row and a round button. Under each lamp is a mark: a power
      mark, a pulse mark and a warning triangle. The lamp centres and the button colour are read from the photograph. No
      document says what a lamp shows or what the button does. The photograph shows more marks. Above E1 is a network
      icon and above E2 an antenna icon. Beside E1 and E2 are a link icon and an arrows icon. The console jack has a
      prompt icon in a boxed outline. To the right of the serial jacks is a "10101" mark. Under the four-position
      housing is a DC mark. The photograph also shows a larger dark hole between the lamps and a small dark dot on each
      side of the SFP, one between E1 and E2 and one to the right of E2. None is drawn, except that the prompt icon is
      drawn as the bare text >_ with no box. A silkscreen path can draw a small mark, so leaving them out is a choice
      of this drawing and not a limit of the format.
  storage:
    confidence: datasheet
    note: >-
      The maker's product page for the LM4 prints "16GB eMMC flash memory supporting TCG Opal 2.0, 256-bit AES
      encryption" as the on-board storage. The brief and the fact sheet do not print this line.
  power:
    confidence: datasheet
    note: >-
      LM4 product brief: "DC input: 9 to 60 VDC" and "Power consumption: Less than 24W". The external AC to DC supply
      reads "AC Input: 100-240VAC, 50-60HZ, 1.4A" and "DC Output: 12VDC, 3A". The photograph shows a four-position
      connector at the lower left of the front, over a direct-current mark. No document names its type, pitch or the
      plug that mates it, so it is not drawn as a part.
  body:
    confidence: estimated
    note: >-
      The photograph shows a black front plate and lid and a silver left flank with three screws. At the top left of
      the front it shows a heatsink block of six fins and seven slots. The fins read 1.3 mm wide at a pitch of 4.6 mm,
      from the dark and grey runs of one row of the resampled photograph (the row at y 6.0 gives six runs of 1.25 to 1.3
      mm). The colours are read from the photograph. The plate reads (67,65,70) over 92800 px, but unevenly: about
      (71,69,74) at the left and (31,29,28) at the right, in shadow. The drawn plate is #2b2e33 and stays, between the
      two. In the photograph the console jack and the two USB-A ports sit in one pale housing block, and the four serial
      jacks in another, with a band between the two rows. They are drawn as two rectangles in the housing colour behind
      the parts. The housing colour reads (229,217,207), #e5d9cf, over 270177 pale pixels counted inside the two blocks
      themselves: 122619 px at (226,216,209) in the console block and 147558 px at (231,217,205) in the serial block.
      The six RJ45 jacks (E1, the console and the four serial jacks) are drawn in that colour through their finish
      field. E1's shell was not counted. The two USB-A ports show a dark grey tongue with a small pale slider at the
      lip, (33,32,32) over 12320 px. The drawn tongue is pale where the photograph's is dark. The library's skin for
      this port in a device that does not claim 3.0 is the white one, usb2, and its other skin is blue; neither is
      dark. The skin is a colour match only where it matches, which is the opening and not the tongue, and it is not a
      statement of the USB version, which the brief does not give. The right flank, the underside and the rear are not shown. The
      LANTRONIX wordmark is a logo and is not drawn: its place is the region logo-zone, read from the photograph. The
      plain text LM4 stays. The button and the four corner screws are round in the photograph and are drawn round, by
      a corner radius of half their side. The screws read about 5.6 mm across and the button 7 mm.
  mount:
    confidence: estimated
    note: >-
      The maker's product page lists "Rack Mount Ear" and "2 Mounting Screws" in the box. The brief calls the unit small
      and for IDFs and kiosks. No document shows an ear, a bracket or a position, so the unit is stated as a desktop
      device.
attrs:
  physical: {weight-kg: 1.42}
  power:
    input: dc
    power-max-w: 24
    power-input: 9 to 60 VDC; the box holds an external AC adapter, 100 to 240 VAC in, 12 VDC 3 A out
  environmental:
    operating-temp-c: 0 to 55
    storage-temp-c: -30 to 60
    humidity-pct: 10 to 90 non-condensing in operation
  features:
    optics-sfp: one 1-Gbps SFP port; no held document names an optic type or reach
  platform:
    storage: 16 GB eMMC flash, TCG Opal 2.0, 256-bit AES encryption
  compliance:
    emissions: FCC class A subpart B
    safety: UL
    rohs: RoHS compliant
chassis:
  width: 158.75
  height: 44.45
  depth: 158.75
  mount: desktop
  color: '#2b2e33'
gaps:
- what: dc-input
  scope: [front]
  reason: vendor-silent
  wanted: the maker's name for the DC input connector, its pitch and the plug that mates it, from a hardware guide.
  note: >-
    The photograph shows a black four-position housing at the lower left of the front, with a latch tab above it and a
    direct-current mark under it. The brief gives the input range and the adapter's output, and names no connector. No
    interface is known, so no part is placed and the position is left bare. A connector is a part, so it is not drawn
    as decor.
- what: rear-panel
  scope: [rear]
  reason: needs-photo
  wanted: a photograph or a drawing of the rear of the LM4.
  note: >-
    No held document shows the rear.
- what: front-positions
  scope: [front]
  reason: needs-drawing
  wanted: a straight front elevation or a hardware guide figure with dimensions.
  note: >-
    The positions are read from an angled photograph. Those read from threshold masks hold to about 1 mm, the error of
    the four estimated control points. After the parts were moved to their measured places these offsets remain: E1
    and the SFP cage sit 0.9 and 1.8 mm left of the photograph's centres (read by eye), the button's centre is 0.4 mm
    left and 0.2 mm low, and the serial jacks, whose photographed jacks are 15.8 mm wide against the part's 12.7, stand on the
    photograph's centres. Every other position is read by eye and its error was not measured.
- what: indicator-led
  scope: [front]
  reason: vendor-silent
  wanted: a table of what the three lamps and the round button show and do, and the marks beside them.
  note: >-
    No held LM4 document describes a lamp or a button. The photograph shows a lit green lamp on the left and a lit
    yellow lamp on the right of the console jack and of each serial jack. The format declares lamp states, and the
    part's lamp windows declare off and on. The built face draws each of these lamps in its off state, so none is
    drawn lit, and the three small status lamps are drawn off as well.
- what: mounting
  scope: [front]
  reason: vendor-silent
  wanted: a drawing of the rack mount ear and the screw positions.
  note: >-
    The product page lists "Rack Mount Ear" in the box. No held document shows it or says where it fits.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: photographs of the lid, the underside and both flanks.
  note: >-
    The four faces draw the envelope only. The photograph shows about eight diagonal slats on the lid at the left and
    three screws on the left flank, at a grazing angle. It shows nothing of the right flank or the underside. Decor
    can draw both a slat and a screw, so leaving them out is a choice of this drawing and not a limit of the format. A
    straight picture of the lid and the flank would place them.
