gaps:
- what: dc-input
  scope: [front]
  reason: vendor-silent
  wanted: the maker's name for the DC input connector, its pitch and the plug that mates it, from a hardware guide.
  note: >-
    The photograph shows a black four-position housing at the lower left of the front. A latch tab is above it and a
    direct-current mark under it. The brief gives the input range and the adapter's output, and names no connector. No
    interface is known, so no part is placed and the position is left bare. A connector is a part, so it is not drawn
    as decor.
- what: rear-panel
  scope: [rear]
  reason: needs-photo
  wanted: a photograph or a drawing of the rear of the LM4.
  note: >-
    No held document shows the rear.
- what: front-positions
  scope: [front]
  reason: needs-drawing
  wanted: a straight front elevation or a hardware guide figure with dimensions.
  note: >-
    The positions are read from an angled photograph. Those read from threshold masks hold to about 1 mm, the error of
    the four estimated control points. In the same image the plate's lower edge reads 1.8 to 2.4 mm below the face's
    lower edge. Its top edge reads about 2 mm above the face's top edge. Together the plate reads up to about 4.4 mm
    taller than the face's 44.45 mm. The front's y figures may be stretched by up to about 10 percent. After the parts
    were moved to their measured places these differences remain. The button's centre is 0.4 mm left and 0.2 mm low. The serial jacks read about 16.5 mm
    wide against the part's 12.7, and a placement cannot change a part's width. Their lamps read about 3 mm wide against
    the part's 2.0. Each jack stands on the centre of its opening. The USB openings read about 6.2 mm tall against the
    part's 4.5. Every other position is read by eye and its error was not measured.
- what: indicator-led
  scope: [front]
  reason: vendor-silent
  wanted: a table of what the three lamps and the round button show and do, and the marks beside them.
  note: >-
    No held LM4 document describes a lamp or a button. The photograph shows a lit green lamp on the left and a lit
    yellow lamp on the right of the console and serial jacks. The lamps are drawn in their off state by default. Their
    on states carry the colours the photograph shows, which a viewer sets. With a strict mask, serial green is 5464 px, mean
    (77,132,76), and serial yellow 4098 px, mean (189,172,16). Console green is 1159 px, mean (106,134,90), and console
    yellow 793 px, mean (148,138,51); a looser mask read them, so they are less certain. A second sample of the serial
    yellow with a looser mask came out darker, so that figure depends on the mask. The three small status lamps are dark
    in the photograph and are drawn off.
- what: registered-mark
  scope: [front]
  reason: needs-photo
  wanted: a larger photograph of the wordmark, to place the registered mark beside it.
  note: >-
    The registered mark sits at the upper right of the wordmark and reads about 2.1 mm across. Its ring is about 9 px
    across in the photograph and its letter about 4 px. That is too small to place honestly. The logo zone covers its
    place.
- what: mounting
  scope: [front]
  reason: vendor-silent
  wanted: a drawing of the rack mount ear and the screw positions.
  note: >-
    The product page lists "Rack Mount Ear" in the box. No held document shows it or says where it fits.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: photographs of the lid, the underside and both flanks.
  note: >-
    The lid draws six ridges in seven slots and the left flank three screws, from views at a grazing angle. They are
    estimated, to about 2 mm across and about 5 mm in depth. The photograph shows nothing of the right flank or the
    underside, so those two draw the envelope only. A straight picture of the lid and the flanks would place every
    feature on them.
