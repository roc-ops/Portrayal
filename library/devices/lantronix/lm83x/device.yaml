  physical: {weight-kg: 3.72}
  power:
    input: ac
    power-max-w: 60
    power-input: dual input, 100 to 240 VAC, 50/60 Hz
  environmental:
    operating-temp-c: 0 to 45
    storage-temp-c: -30 to 60
    humidity-pct: 20 to 80 non-condensing in operation
  features:
    optics-sfp: one 1-Gbps SFP port; no held document names an optic type or reach
  platform:
    storage: 256 GB NVMe, TCG Opal 2.0, 256-bit AES encryption
  compliance:
