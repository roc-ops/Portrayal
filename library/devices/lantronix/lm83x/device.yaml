    kind: example
    description: >-
      The build in the maker's front illustration. It seats an 8-port Ethernet module in the first bay, an 8-port serial
      module in the second and the LCD module in the third. No part number is given for it.
    bays:
      bay-2: lantronix/lm83x-8ea@1
      bay-3: lantronix/lm83x-8sa@1
      bay-4: lantronix/lm83x-lcda@1
