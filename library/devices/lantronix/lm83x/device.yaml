format: 1
kind: device
name: lm83x
version: 0.1.0
maturity: draft
manufacturer: Lantronix
model: LM83X
description: >-
  Lantronix LM83X advanced serial console server, a 1U chassis. The base unit has eight RJ45 serial ports and two
  10/100/1000 Ethernet ports. It also has an RJ45 console port, one SFP port, a USB-A port, a USB-C port and two SMA
  antenna connectors. Three expansion bays take an 8-port serial module, an 8-port Ethernet module or an LCD module. The rear
  has two AC inlets. This model draws the AC unit without cards in the default build.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      Lantronix LM83X product brief (MPB-00156 Rev B), System Specifications, Dimensions and Weight: "43.2 mm (1.7
      in.) x 445 mm (17.5 in.) x 264 mm (10.4 in.); 1 rack unit (1RU)". The width of 445 mm is narrower than the 482.6
      mm rack face, and the front illustration shows ears outside the body, so it is taken as the body between the ears.
      The 43.7 mm height printed for the expansion modules in the option card brief is 0.5 mm more and is not used for
      the chassis.
  layout-source:
    confidence: drawing
    note: >-
      Every position on the front is read off the maker's front illustration (5993 x 675 px). Its outline with the ears
      is 5680 px for 482.6 mm, which gives 11.77 px/mm across, and its body is 5238 px for 445 mm, which agrees. Its face
      is 513 px for 43.2 mm, which gives 11.88 px/mm down, 0.9 per cent from the across scale, so the figure is
      orthographic. Positions are read to about 0.5 mm. The straight photograph of the front agrees on the order and the
      count of every part. The illustration and the photograph show different modules in the second and third bays, so the
      bays are read from the illustration for geometry and the two builds are configurations.
  bays:
    confidence: drawing
    note: >-
      The three expansion bays are 92.9 mm wide each, the module face width in the option card brief. Three of them take
      278.7 mm of the 445 mm body, so the bays start 166.3 mm from the left edge. The illustration puts the first
      divider at 165.8 mm, which agrees within the reading.
  serial:
    confidence: drawing
    note: >-
      LM83X product brief: "Supports up to 104 devices via serial (RS-232)", base 8 serial ports. The illustration shows
      eight RJ45 jacks in two rows of four numbered 1 to 4 over 5 to 8 under blue bars. The jack centres are 16.0 mm apart
      across and 11.7 mm apart down, and each is placed as a cell of the 12.7 by 11.0 ganged jack part. The upper row is
      turned 180 degrees because its latch notch and lamp tabs are at the top. The maker's jacks read 14.2 by 10.1 mm
      inside their frames, wider than the part.
  network:
    confidence: datasheet
    note: >-
      LM83X product brief: "Two 10/100/1000 BaseT Ethernet interfaces (with failover support) and one RS-232 console
      port; One 1-Gbps SFP port". The illustration shows two stacked jacks printed E1 and E2 under yellow bars, and the
      SFP cage printed E3.
  console:
    confidence: datasheet
    note: >-
      LM83X product brief: "one RS-232 console port". The RJ45 jack at the top of the stack printed CON is the console
      jack, with a USB-A port and a USB-C port stacked under it. The brief says "One USB-A port, one USB-C port" and does
      not say what either is for.
  antenna:
    confidence: drawing
    note: >-
      The illustration and the photographs show two SMA connectors printed AUX and MAIN on a rounded plate at the left
      end, with a screw at two of its corners. The option card brief, page 2, shows the same plate as the face of each
      88-CAT4 cellular card, 50.3 mm wide and 22.9 mm high, so the plate is the face of the option slot with a cellular
      card in it. The plate and the connectors are drawn as the figures show them. The face of a unit with another card,
      or none, is not shown in any held document.
  leds:
    confidence: estimated
    note: >-
      The illustration prints four small lamps under the left end, each with a mark: a power mark, a link mark, a warning
      mark and a pulse mark. No document says what any lamp shows, so the lamps are drawn and claim no state. The round
      button above them and the pin hole beside the model name are not named by any document and are not drawn as parts.
  rear:
    confidence: photo-measured
    note: >-
      The straight photograph of the rear (6000 x 4000 px) shows two black AC inlets at the left, a label, and two rows of
      slotted vents, eight above and three below. The scale across is 4.06 px/mm taken from the 445 mm body, and down
      about 4.2 px/mm from the 43.2 mm face. Positions are read to about 1 mm. The inlets are drawn as the standard C14
      part, 28.0 by 20.0 mm, and the photograph shows a black housing about 32 by 33 mm, so the housing is not drawn as it
      is.
  power:
    confidence: datasheet
    note: >-
      LM83X product brief: "AC model: Dual input, (100-240 VAC) 50/60 Hz, 60 W" and "DC model: Dual input, -20 to -72
      VDC". The brief does not say whether 60 W is the draw or the rating, so it is filed as the maximum. The rear label
      in the photograph prints a 1.3 A input. The DC model is not drawn: no held document shows its rear.
  ears:
    confidence: estimated
    note: >-
      The illustration shows a flat ear with two slots at each end of the face. No document gives an ear position or says
      how far the ears sit behind the face, so no position is written. The ears are not drawn.
