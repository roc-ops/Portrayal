gaps:
- what: expansion-slot-blank
  scope: [front]
  reason: vendor-silent
  wanted: a photograph of the front with a bay empty or covered.
  note: >-
    No held document shows a bay without a module, or says what covers it. The default build leaves the three bays empty
    and the opening shows.
- what: expansion-modules-16-and-32-port
  scope: [front]
  reason: needs-photo
  wanted: a photograph or a drawing of the 83X-16SA and 83X-32SA faces.
  note: >-
    The option card brief gives the two serial modules a size and a small picture of the face, which shows two large
    high-density connectors, and says the 16-port module comes "w/2 high-density cables". No held document names the
    connector, so neither module is modelled.
- what: option-slot
  scope: [front]
  reason: needs-drawing
  wanted: a drawing of the option slot, and a registry key for what the slot takes.
  note: >-
    The option card brief gives each option card a size and a small picture of its face. The slot is the plate with the
    two SMA connectors at the left end. A bay for it needs an interface key that the registry does not hold, so the
    option cards are not modelled and no bay is declared for the slot.
- what: bay-number-legends
  scope: [front]
  reason: vendor-silent
  wanted: the maker's statement of where the numbers 2, 3 and 4 are printed.
  note: >-
    The figures show a circled number under the left screw of each module. The expansion modules brief says a module
    is sold installed per slot, so the numbers may be printed on the module. They are not drawn.
- what: indicator-led
  scope: [front]
  reason: vendor-silent
  wanted: a table of what the four lamps and the round button show and do.
  note: >-
    No held LM83X document describes a lamp or a button. The lamps are drawn with no state.
- what: ear-positions
  scope: [front]
  reason: needs-drawing
  wanted: a drawing of the ear and the mounting positions.
  note: >-
    The illustration shows an ear with two slots at each end. No held document gives an ear position, a depth or a rail
    kit.
- what: dc-model
  scope: [rear]
  reason: needs-photo
  wanted: a photograph of the rear of the DC model.
  note: >-
    The product brief lists 83X-8S-000-NDA with dual DC input of -20 to -72 VDC. No held document shows its inlet, so
    only the AC rear is drawn.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: photographs of the lid, the underside and both flanks.
  note: >-
    The four faces draw the envelope only. The angled photograph shows a plain lid and a flank with seams and screws,
    at a size that gives no position.
