format: 1
kind: device
name: lm80
version: 0.1.0
maturity: draft
manufacturer: Lantronix
model: LM80
description: >-
  Lantronix LM80 compact advanced serial console server, a small chassis with eight RJ45 serial ports. The front has two
  10/100/1000 Ethernet ports, an RJ45 console port, one SFP port, a USB-A port, a USB-C port and two SMA antenna
  connectors. It has no expansion bays. No held document shows its rear.
profile: networking
provenance:
  size:
    confidence: datasheet
    note: >-
      Lantronix LM80 product brief (MPB-00157 Rev A), System Specifications, Dimensions and Weight: "43 mm (1.7 in.) x
      254 mm (10 in.) x 163 mm (6.4 in.); 1 rack unit (1RU)". The width and the straight photograph show a unit about half
      the width of a rack, so the rack unit is the height class and the unit is not drawn as a rack part.
  layout-source:
    confidence: drawing
    note: >-
      Every position on the front is read off the maker's front illustration (2550 x 591 px). Its plate is 2377 px for 254
      mm, which gives 9.36 px/mm across, and 407 px for 43 mm, which gives 9.46 px/mm down. The two agree within 1.1 per
      cent, so the figure is orthographic. Positions are read to about 0.5 mm. The base ports stand at the same distances
      from the left edge as on the LM83X, which is what the two illustrations show. The straight photograph agrees on the
      order and the count of every part.
  serial:
    confidence: drawing
    note: >-
      LM80 product brief: "Supports up to 8 devices via serial (RS-232)". The illustration shows eight RJ45 jacks in two
      rows of four numbered 1 to 4 over 5 to 8 under blue bars. The jack centres are 16.1 mm apart across and 10.6 mm apart
      down. The ganged jack part is 11.0 mm high, so the rows are placed 11.0 mm apart, centred on the stack, 0.4 mm wider
      than the figure. The upper row is turned 180 degrees because its latch notch and lamp tabs are at the top.
  network:
    confidence: datasheet
    note: >-
      LM80 product brief: "Two 10/100/1000 BaseT Ethernet interfaces (with failover support) and one RS-232 console
      port; One 1-Gbps SFP port". The illustration prints E1 and E2 on two stacked jacks and E3 on the SFP cage.
  console:
    confidence: datasheet
    note: >-
      LM80 product brief: "one RS-232 console port", "One USB-A port, one USB-C port". The jack printed CON is the console
      jack, with the USB-A port and the USB-C port under it. The brief does not say what either USB port is for.
  antenna:
    confidence: drawing
    note: >-
      The illustration and the photographs show two SMA connectors printed AUX and MAIN on a rounded plate at the left
      end. The option card brief, page 2, shows the same plate as the face of each 88-CAT4 cellular card, 50.3 mm wide
      and 22.9 mm high, so the plate is the face of the option slot with a cellular card in it. The face of a unit with
      another card, or none, is not shown in any held document.
  leds:
    confidence: estimated
    note: >-
      The illustration prints four small lamps with a power mark, a link mark, a warning mark and a pulse mark. No
      document says what any lamp shows. The round button is not named by any document and is not drawn as a part.
  power:
    confidence: datasheet
    note: >-
      LM80 product brief: "Internal universal power (100-240 VAC, 50/60 Hz); 30W". The brief does not say whether 30 W is
      the draw or the rating, so it is filed as the maximum. No held document shows the inlet.
  mount:
    confidence: estimated
    note: >-
      The brief says the unit is "well-suited for deployments that have physical space limitations, or in non-racked
      environments" and lists no ear or rack kit. The photographs show a plain front with no ear. The unit is stated as
      a desktop device because no document shows a rack mount.
attrs:
  physical: {weight-kg: 1.2}
  power:
    input: ac
    power-max-w: 30
    power-input: internal universal supply, 100 to 240 VAC, 50/60 Hz
  environmental:
    operating-temp-c: 0 to 45
    storage-temp-c: -30 to 60
    humidity-pct: 20 to 80 non-condensing in operation
  features:
    optics-sfp: one 1-Gbps SFP port; no held document names an optic type or reach
  platform:
    storage: 256 GB NVMe, TCG Opal 2.0, 256-bit AES encryption
  compliance:
    emissions: FCC class A, CE, TUV
    rohs: RoHS Compliant
  lifecycle: {eol: none-announced}
chassis:
  width: 254.0
  height: 43.0
  depth: 163.0
  mount: desktop
  color: '#a6adb3'
gaps:
- what: rear-panel
  scope: [rear]
  reason: needs-photo
  wanted: a photograph or a drawing of the rear of the LM80.
  note: >-
    No held document shows the rear, so the AC inlet, any vent and the label are not drawn.
- what: option-slot
  scope: [front]
  reason: needs-drawing
  wanted: a drawing of the option slot, and a registry key for what the slot takes.
  note: >-
    The LM80 has one option slot. The option card brief gives each option card a size and a small picture of its face.
    The slot is the plate with the two SMA connectors at the left end. A bay for it needs an interface key that the
    registry does not hold, so the option cards are not modelled.
- what: indicator-led
  scope: [front]
  reason: vendor-silent
  wanted: a table of what the four lamps and the round button show and do.
  note: >-
    No held LM80 document describes a lamp or a button. The lamps are drawn with no state.
- what: mounting
  scope: [front]
  reason: vendor-silent
  wanted: a statement of how the unit mounts, and of any rack kit.
  note: >-
    The brief calls the unit 1RU and says it suits non-racked sites. No held document shows an ear or a bracket.
- what: envelope-faces-undetailed
  scope: [top, bottom, left, right]
  reason: needs-photo
  wanted: photographs of the lid, the underside and both flanks.
  note: >-
    The four faces draw the envelope only. The angled photograph shows a plain lid and one flank with a label, at a size
    that gives no position.
