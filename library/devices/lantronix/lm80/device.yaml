    description: eight RJ45 RS-232 serial ports.
  network:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two RJ45 10/100/1000 Ethernet ports E1 and E2.
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the 1-Gbps SFP port, printed E3.
  console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console}
    description: the RJ45 RS-232 console port.
  usb:
    term: Port
    role: management
    index-origin: 1
    mixed: the USB-A port and the USB-C port stacked under the console jack, which the brief lists together
    description: the USB-A port and the USB-C port.
  antenna:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: coax-sma}
    description: the two SMA connectors printed AUX and MAIN.
  status-leds: {term: LED, role: indicator, index-origin: 1}
