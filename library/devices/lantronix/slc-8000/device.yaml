configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with copper network ports, one AC inlet and no I/O modules. An illustration: no part number
      lists a chassis without I/O modules.
    source: >-
      derived - the data sheet lists no part numbers, and the maker's product page lists chassis with their I/O
      modules fitted, so no part number names this build.
    bays:
      io-bay-1: ''
      io-bay-2: ''
      io-bay-3: ''
  rj45-16:
    kind: example
    description: >-
      Copper network ports, one AC inlet and one 16-port RJ45 module in bay 1.
    source: >-
      the maker's product page lists SLC80161201S as the 16-port RJ45 model with single AC power and no SFP. The page
      does not say which module sits in which bay, so the bays fill in order from bay 1 as the I/O Module Installation
      Guide requires.
    bays:
      io-bay-1: lantronix/frrj451601@1
      io-bay-2: ''
      io-bay-3: ''
  rj45-32:
    kind: example
    description: >-
      Copper network ports, one AC inlet and two 16-port RJ45 modules in bays 1 and 2.
    source: >-
      the maker's product page lists SLC80321201S as the 32-port RJ45 model with single AC power and no SFP.
    bays:
      io-bay-1: lantronix/frrj451601@1
      io-bay-2: lantronix/frrj451601@1
      io-bay-3: ''
  rj45-48:
    kind: example
    description: >-
      Copper network ports, one AC inlet and three 16-port RJ45 modules.
    source: >-
      the maker's product page lists SLC80481201S as the 48-port RJ45 model with single AC power and no SFP.
    bays:
      io-bay-1: lantronix/frrj451601@1
      io-bay-2: lantronix/frrj451601@1
      io-bay-3: lantronix/frrj451601@1
  usb-16:
    kind: example
    description: >-
      Copper network ports, one AC inlet and one 16-port USB module in bay 1.
    source: >-
      the maker's product page lists SLC81161201S as the 16-port USB model with single AC power and no SFP.
    bays:
      io-bay-1: lantronix/frusb1601@1
      io-bay-2: ''
      io-bay-3: ''
