format: 1
kind: device
name: c9300-24s
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: C9300-24S
aliases:
- {name: Catalyst 9300-24S, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 9300, series: Catalyst 9300}
description: >-
  24x 10/100/1000 Mbps SFP 1RU stackable access switch running Cisco IOS XE, the C9300-24S of the Catalyst
  9300 family. The 24 SFP cages, the mode button, the status lamps, the USB mini-Type B console port,
  the USB Type A storage port and the beacon button are on the front, with a bay for an uplink network
  module at the right, shipped with a blank in it. The rear holds three fan modules, two StackWise-480
  stacking ports, two StackPower connectors, two power supply bays, the RJ-45 console and management ports,
  a USB 3.0 SSD slot and the ground connectors. The default supply is the 715 W AC Platinum PWR-C1-715WAC-P
  in one bay with the power supply slot cover in the other. The switch has no PoE. The -A and -E suffixes
  of the part number are software licences and not hardware, so there is one device.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Cisco Catalyst 9300 Series Switches Hardware Installation Guide, first published 2017-06-20, last
      modified 2026-05-15, https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig.pdf
      (sha256 c1db6738...441b). Page numbers are PDF pages with the printed page after them. Table 1 (models,
      PDF p16, printed 2), Table 18 (default supply, PDF p43 to p44, printed 29 to 30), Table 42 (dimensions,
      PDF p135, printed 121), Table 43 (weight, PDF p137, printed 123), Table 35 (the supplies), Figures
      3, 8 and 10 (the front, the lamps and the rear), the Fan Module section and Table 48. The text layer
      of those pages was read, not the pictures. COMMUNITY NETBOX DEVICETYPE-LIBRARY ELEVATIONS (cisco-c9300-24s.front.png
      and cisco-c9300-24s.rear.png, each 2289 x 219) are a second opinion and the only flat drawings held,
      not Cisco's. No data sheet, no photograph, no 3D model and no stencil is held for the Catalyst 9300.
  the-licence-suffix:
    confidence: datasheet
    note: >-
      C9300-24S-A (Network Advantage) and C9300-24S-E (Network Essentials) differ in software licence
      only; the guide lists the hardware as C9300-24S throughout. One device, and the suffixed ordering
      codes are not part numbers of a configuration.
  the-rear-figure:
    confidence: drawing
    note: >-
      THE GUIDE'S PDF PAGE 41 REAR FIGURE IS FIGURE 14, THE CATALYST 9300X, AND IS NOT USED. Figure 10
      of the guide, "Rear Panel of a Cisco Catalyst 9300 Series Switch" (PDF page 39), is isometric, one
      rear for the series. Its callouts name, in order, the ground connectors, the USB 3.0 SSD port, the
      BEACON LED, the RJ-45 CONSOLE port, the RJ-45 MGMT port, the fan modules, the StackPower connectors,
      the AC OK and PS OK lamps, the StackWise-480 port connectors and the power supply modules.
  the-envelope:
    confidence: datasheet
    note: >-
      Table 42, the C9300-24S row: 1.73 x 17.5 x 20.7 in (4.4 x 44.5 x 52.6 cm), with the fan modules
      and the default supplies installed. THE DEPTH IS 20.7 IN, NOT THE 19.2 IN OF THE COPPER MODELS.
      Width 444.5 (17.5 in; the 44.5 cm agrees). Depth 526.0 (52.6 cm; 20.7 in is 525.8). HEIGHT 44.45,
      THE RACK UNIT, NOT THE PRINTED 1.73 IN (43.9 mm): the guide prints 1.73 in for every 1RU model and
      both are nominal, so the unit is carried and the printed height is one millimetre under it. The
      17.5 in is the body between the ear fold lines (the NetBox elevation draws ears outside it).
  rack-positions:
    confidence: drawing
    note: >-
      Figures 32 to 35 of the guide draw the front-mounting, mid-mounting, rear-mounting and four-point
      mounting positions, isometrically, with no dimension. Front-mounting is the first and the guide's
      Mounting the Switch in a Rack step 1 attaches the brackets for "the front or rear mounting positions";
      it is taken as the shipped default. No setback is printed and none is written.
  front-scale:
    confidence: estimated
    note: >-
      EVERY FRONT POSITION IS READ OFF THIS MODEL'S OWN NETBOX ELEVATION, NOT THE GUIDE'S FIGURE 3, WHICH
      IS ISOMETRIC. The elevation is 2289 px wide for the 482.6 mm rack face, 4.743 px per mm; it is cropped
      to the centre 444.5 mm (the body between the ear fold lines), which starts at 90.3 px, and the body's
      top edge sits 4.1 px under the picture's. Good to about a millimetre. The same measurement on the
      C9300-48P's picture gave the merged 48P's figures.
  ports:
    confidence: estimated
    note: >-
      Table 1 gives 24 SFP ports and the elevation draws 24 cages, in two blocks of six columns at the
      right of the port area, two cages to a column, numbered DOWN each column (odd on the top row, even
      beneath) as the 48P's blocks are; the elevation prints 01 and 12 under the first block and 13 and
      24 under the second. The cages are 13.5 x 8.5 mm (64 x 41 px) on a 13.96 mm column step (66.2 px)
      and a 15.7 mm row step, the rows centre 16.0 and 31.7 mm below the top edge, and the second block
      starts 87.5 mm after the first. THE ELEVATION'S COLUMN STEP IS 13.97 AND THE REGISTRY'S FOR std/sfp-ganged
      IS 14.25, and cells at 13.97 would overlap (lint L13 and L39), so the registry's step is kept, the
      gutter is 2.0 mm so that each block still starts where the elevation's does, and each block is centred
      on the artwork: the first and last columns of a block are 0.7 mm off their cages and the middle
      ones are on them. The area to the left of the first block, from the left cluster to 187 mm, has
      no cages and is bare chassis in the elevation. std/sfp-ganged is the registry's cage for two rows
      of cages in one bezel slot; each port is typed 1000base-x-sfp by its media and speed.
  port-lamps:
    confidence: estimated
    note: >-
      One lamp per port in a strip along the bottom edge, an up triangle for the odd (upper) port and
      a down triangle for the even, as the elevation draws them. THE ELEVATION DRAWS SEVEN PAIRS OF TRIANGLES
      ACROSS EACH BLOCK OF SIX COLUMNS, at an 11.7 mm step, which cannot be one lamp per port. The pairs
      are placed under their own columns, the two triangles 6.4 mm apart as the elevation draws them,
      and the strip's height is its 40.5 mm below the top. The meaning of each colour is the guide's Table
      15 (green link, blinking green activity, amber blocked) and the mode decides which Table 14 reading
      the lamps show.
  numbering:
    confidence: estimated
    note: >-
      The legends under the strip are the NetBox elevation's: 01 and 12 under the first block and 13 and
      24 under the second. The block-end number 12 is set 1.2 mm right of where the elevation prints it
      so that the last lamp of the block does not paint over it (lint L21). Port numbering is as printed,
      and the interface names are not on the metal and are left out.
  left-cluster:
    confidence: estimated
    note: >-
      The beacon button (Figure 3 callout 1, "Beacon LED (UID button)", a lit square), the maker's mark,
      the Mode button, the status lamps and the USB mini-Type B console port (callout 4) are read off
      this model's NetBox elevation at the scale of front-scale. THE USB TYPE A STORAGE PORT (callout
      5) IS DRAWN AT THE LOWER LEFT, STANDING UPRIGHT UNDER A GRID OF TWELVE VENT SQUARES, not beside
      the mini-USB as in the 48P's picture, and it is placed there. The guide's Figure 8 names the lamps
      in two rows, Status, Duplex, Speed and Stack above, then System, Active, XPS and S-PWR, and the
      Console lamp beside the mini-USB port; the metal prints pictograms and not words, so no legend is
      drawn and each lamp is named by its id. THE ELEVATION ALSO DRAWS THE PoE PICTOGRAM AT THE END OF
      THE UPPER ROW; this model has no PoE (Table 18 prints "-" for its available PoE), so no PoE lamp
      is placed. THE FRONT USB TYPE A PORT'S GENERATION IS NOT STATED: the rear port is "USB3.0-SSD" and
      the front is only "USB Type A storage port", so it is drawn with the 2.0 tongue.
  vents:
    confidence: estimated
    note: >-
      Three vent strips and the name plate, at the x positions the elevation draws them, which are the
      same as the C9300-48P's to a millimetre. The first strip, over the area with no cages, is drawn
      in the elevation as an open crenellated vent and is carried as a vent of the same extent.
  network-module-bay:
    confidence: estimated
    note: >-
      Figure 3 callout 7, "Uplink network module slots". The bay is read off this model's elevation, which
      draws a C9300-NM-2Q seated in it: 364.8 to 440.8 mm across and 42.5 mm high. The guide's Table 5
      and the Installing a Network Module chapter say the blank C9300-NM-BLANK is fitted "when the switch
      has no uplink ports (this is required for sufficient air flow)". The blank is the default, so the
      render shows the blank and not the module the elevation draws. THE NETWORK MODULES THEMSELVES, C9300-NM-2Q,
      -4G, -4M, -2Y and -8X, ARE NOT MODELLED here and are left for a later 9300 batch; the bay accepts
      only the blank until they are.
  rear-scale:
    confidence: estimated
    note: >-
      THE REAR IS CARRIED FROM THE MERGED cisco/c9300-48p, NOT MEASURED ON THIS MODEL. The only held rear
      file, NetBox's cisco-c9300-24s.rear.png, is the C9300-48S's file byte for byte (COVERAGE.md item
      30), so it proves no SKU. It is used as a check: its fans, StackWise carriers, StackPower connectors
      and two supply bays are where the 48P's rear has them, in Figure 10's order from the left (ground
      connectors, SSD slot, console and management ports, fan, StackWise, fan, StackWise, fan, StackPower,
      two supplies). It differs from the 48P's rear in the supply legends (it prints PWR-C1-715WAC-P on
      both supplies, which is this model's default; the 48P's picture prints PWR-C1-715WAC), in the S-PWR
      lamp labels, and in drawing the USB 3.0 SSD slot under its blank cover with no port visible. The
      positions of the merged rear are kept and the SSD slot is kept as a port, as Figure 10's callout
      2 names a USB 3.0 SSD port. The supplies are the dark honeycomb faces the components use.
  rear-fans:
    confidence: estimated
    note: >-
      Three FAN-T2 modules (the guide: "support three internal hot-swappable 12-V fan modules (FAN-T2=)")
      at a 63.0 mm step, each 43.9 x 41.1 by Table 48, centred 70.5, 133.5 and 196.5 mm from the left.
      The StackWise-480 carriers lie between them (92.5 to 111.1 and 156.2 to 174.8 mm) and hold three
      stacked connectors each, as the elevation draws them, at a 9.3 mm pitch; the guide's Figure 10 points
      at two ports in all, so each carrier is one port.
  rear-power:
    confidence: estimated
    note: >-
      The StackPower connectors (callout 7), S-PWR 1 over S-PWR 2, with XPS under the first, at 233.0
      mm, and the two supply bays 258.5 and 348.4 mm from the left, each the supplies' 82.55 x 40.1 by
      the guide's physical table. A 13.5 mm strip of bare chassis closes the right. The guide does not
      number the supply slots; psu-1 is the left.
  rear-left:
    confidence: estimated
    note: >-
      The ground connectors (callout 1) as two ground screws, the USB 3.0 SSD slot (callout 2) under a
      cover the guide calls the "blank cover on the USB 3.0 SSD slot", the RJ-45 CONSOLE port (callout
      4) on the left and the RJ-45 MGMT port (callout 5) on the right, each 14.2 mm from the next, and
      the lamps for the console and the beacon (callout 3) in the icon row beneath. The jacks' keyways
      point down.
  console-over-management:
    confidence: drawing
    note: >-
      The guide's Ethernet Management Port text says the switch is reached "through the 10/100/1000 Ethernet
      management port or one of the console ports" and the RJ-45 Console Port LED table says the RJ-45
      console is disabled while the USB console is active, so the front mini-USB and the rear RJ-45 are
      one console, and the management port is its own.
  power:
    confidence: datasheet
    note: >-
      Table 1 and Table 18: two power supply slots with a 715 W supply installed by default, PWR-C1-715WAC-P,
      and "-" for available PoE: no PoE budget is printed and none is written. The guide holds no table
      of the switch's own draw, and none is written. Table 35 lists the supplies for the series and gives
      no per-model restriction, so every bay takes all of them.
  weight:
    confidence: datasheet
    note: >-
      Table 43, the C9300-24S row: 14.42 lb (6.54 kg) with the fan modules and the default power supplies
      installed. THE COMMUNITY NETBOX FILE GIVES 7.64 KG (COVERAGE.md item 29); the guide's figure is
      used.
  colour:
    confidence: estimated
    note: >-
      #b7b7b7, the median of the plain face between the left cluster and the first block of cages in this
      model's NetBox front elevation.
  airflow:
    confidence: datasheet
    note: >-
      The Fan Module section: "The airflow direction is from front-to-rear and side-to-rear." One airflow
      for every build, so there are no airflow configurations.
attrs:
  physical:
    weight-note: >-
      14.42 lb (6.54 kg) with the fan modules and the default power supplies installed (Table 43); the
      community NetBox file gives 7.64 kg
  power:
    power-supply-options: >-
      PWR-C1-350WAC, PWR-C1-350WAC-P, PWR-C1-715WAC, PWR-C1-715WAC-P, PWR-C1-1100WAC, PWR-C1-1100WAC-P,
      PWR-C1-1900WAC-P, PWR-C1-1900WHV-T, PWR-C1-715WDC (Tables 18 and 35)
  performance:
    port-modes-sfp: >-
      10/100/1000 Mbps SFP ports (Table 1); the guide prints no module list for the base switch
  environmental:
    operating-temp: -5 to 45 C (23 to 113 F), Table 37
    storage-temp: -40 to 70 C (-40 to 158 F), Table 37
    humidity: 5 to 90 percent, noncondensing
    altitude: operating up to 3000 m (10,000 ft); storage up to 4500 m (15,000 ft)
  features:
    stacking: StackWise-480 data stacking, up to nine switches, and StackPower, up to four switches
    uplink-modules: >-
      one network module slot; C9300-NM-2Q, -4G, -4M, -2Y, -8X and the 3850 uplink modules (Table 5);
      a blank when none is fitted
  management:
    console: USB mini-Type B on the front and RJ-45 on the rear; the USB console takes precedence
    oob: RJ-45 10/100/1000 management port on the rear
    usb: USB Type A storage port on the front; USB 3.0 SSD slot on the rear
  lifecycle: {eol: none-announced}
chassis:
  width: 444.5
  height: 44.45
  depth: 526.0
  ru: 1
  weight-kg: 6.54
  color: '#b7b7b7'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mounting, default: true}
    - {name: mid, label: mid-mounting}
    - {name: rear, label: rear-mounting}
gaps:
- what: rack-kit
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The rack depth the bracket kits span. The guide's Figure 29 and its table name the 19-inch brackets
    ACC-KIT-T1=, the four-point extension rails and five brackets 4PT-KIT-T2=, and the 23-inch, 24-inch
    and ETSI brackets RACK-KIT-T1=, and print no range of rack depth, no setback and no part dimension.
    A kind: kit contract needs a depth or a factory preset, so no kit is written and chassis.kits is left
    out; the three positions above are named without a number.
- what: rear-drawing
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A rear drawing of this model. The only held file, NetBox's cisco-c9300-24s.rear.png, is the C9300-48S's
    file byte for byte, so the rear is carried from cisco/c9300-48p and Figure 10 and is marked estimated.
- what: front-usb-generation
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Whether the front USB Type A storage port is USB 2.0 or 3.0. The guide says only "USB Type A storage
    port".
- what: network-modules
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The faces of C9300-NM-2Q, C9300-NM-4G, C9300-NM-4M, C9300-NM-2Y and C9300-NM-8X. The guide draws them
    isometrically and prints no dimension. Left for a later 9300 batch.
- what: lamp-pictograms
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The pictograms under the status lamps and beside the mini-USB port. The guide's Figure 8 gives their
    names and the NetBox elevation draws them at a few pixels each; no legend is drawn.
- what: sides-top-bottom
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the sides. The guide's Figure 3 and Figure 10 show them
    isometrically with a vent on the side and labels on the lid.
groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
  nm-bay: {term: Slot, role: traffic, index-origin: 1}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mode-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  controls:
    term: Button
    role: management
    index-origin: 1
    mixed: >-
      the beacon (UID) button and the Mode button at the left of the front: two buttons that identify
      the switch and step its lamps, both used from the front panel.
  usb-console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: mini-usb-b}
  usb-storage:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the rear RJ-45 console port beside the rear 10/100/1000 RJ-45 management port: two jobs, one purpose,
      reaching the switch when the data plane cannot.
  stackwise:
    term: Port
    role: fabric
    index-origin: 1
    attrs: {media: stackwise-480}
  stackpower:
    term: Port
    role: service
    index-origin: 1
    attrs: {media: stackpower}
  grounding: {term: Stud, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        The guide: "The switch has two internal power supply module slots. You can use two AC modules
        or one power supply module and a blank module."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 2+1
      redundancy-note: >-
        Three fan modules, and the Fan Module section of the guide says the switch can operate with two
        operational fans while the failed one is replaced.
