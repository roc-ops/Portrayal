configurations:
  c9300-24s:
    kind: orderable
    description: >-
      The switch as shipped: one PWR-C1-715WAC-P in the first power supply slot with the slot cover in
      the second, three FAN-T2 fan modules and the network module bay blank. Table 1 says the switch has
      two power supply slots with a 715 WAC supply installed by default, Table 18 names it PWR-C1-715WAC-P
      and the Power Supply Modules text says every switch ships with a blank in the second slot.
    default: true
    part-numbers:
      C9300-24S: {}
  dual-715wac-p:
    kind: example
    description: Two PWR-C1-715WAC-P supplies, as a switch with its second supply ordered.
