format: 1
kind: device
name: ws-c2960s-48lpd
version: 1.0.2
maturity: modelled
manufacturer: Cisco
model: WS-C2960S-48LPD-L
aliases:
- {name: Catalyst 2960S-48LPD-L, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 2960-S, series: Catalyst 2960-S FlexStack}
description: >-
  48x 10/100/1000 PoE+ RJ-45 (370 W PoE budget) and 2x SFP+ uplink 1RU stackable access switch running LAN Base. The
  front carries the mode button and switch lamps at the left, four blocks of twelve jacks in two rows, then the USB
  Type A port, the USB mini-Type B and RJ-45 console ports, the Ethernet management port and the two SFP+ slots.
  The rear carries the FlexStack module slot with its blank cover, the fan exhaust, the RPS connector and the AC
  inlet of the built-in supply. Ports number 1-48 and run DOWN each column - odd on the top row, even beneath it.
  Slots 49 and 50 are the SFP+ pair.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, 82 pages (the PDF prints its number and no
      date; Cisco URL https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/hardware/installation/guide_stack/2960SHIG.pdf).
      Pages below are PDF pages with the printed page after them. Table 1-1 (PDF p3-4, printed 1-1 to 1-2) lists the
      model; the appendix's Table 1-2 (PDF p62-63) gives this model's row; Figure 1-10 "Catalyst 2960-S Switch Rear
      Panel with Stacking Module Slot and RPS connector" (PDF p19, printed 1-17) is the rear of the stacking models.
      The guide draws no front of this model: Figure 1-1 "Catalyst 2960S-48FPD-L Front Panel" (PDF p4, printed 1-2)
      is a sibling's, and the guide says "All the 24- and 48-port switches have similar components" (Front Panel,
      PDF p4). Community NetBox (second opinion only, not Cisco's): the WS-C2960S-48LPD-L device type and its rear
      elevation, a photograph of this model's rear. Its front elevation is not used: it is a photograph of a
      "Catalyst 2960 Series SI", a different product with no USB port. No data sheet, no vendor 3D model and no
      photograph of this model's front is held. The pages were read through the PDF's text layer and the converted
      figures were viewed.
  gate-1-front:
    confidence: estimated
    note: >-
      No held document draws this model's front. It has the same 48 PoE+ ports and two SFP+ slots as the 48FPD-L, so
      every position is carried from cisco/ws-c2960s-48fpd, which was read from the NetBox front elevation of the
      WS-C2960S-48FPD-L at 11.345 px per mm (5475 x 503 px, aspect 10.88 against 10.86 for the 19-inch ear-to-ear
      width). The 48 jacks agree with Table 1-1 (four blocks of twelve in two rows), and the USB Type A, mini-B,
      RJ-45 console, management and two SFP+ slots agree with Figure 1-1 callouts 3 to 7. Every position is
      `estimated`: it is another model's reading, used because this model's own documents name the same parts.
  colour:
    confidence: estimated
    note: >-
      Front: this model's own NetBox front (cisco-ws-c2960s-48lpd-l.front.png, 1080 x 107 px) is a photograph of a
      Catalyst 2960 Series SI, another product, and is not read. The front takes the colours the four 2960-S stencils
      agree on: the bezel #255e6d (median of 7000 px, box (700,6,1200,20) of a 5475 x 503 px stencil; the lower edge, box
      (700,482,1200,497), reads the same), the charcoal panel #404040 (box (435,30,480,110)), the Mode button #255e6d (box
      (330,435,385,460)) and the console surround #bbd5d8 (box (4800,70,4850,90)); the WS-C2960S-48FPD-L, -48TD-L, -24PD-L
      and -24TD-L stencils give the same medians in every box. Figure 1-1 (PDF p4, printed 1-2), Cisco's own colour
      drawing of the 48FPD-L, draws the same scheme (a dark teal front edge round a charcoal panel, yellow frames round
      the jack blocks) and is the guide's own evidence that the teal is Cisco's finish. So `chassis.color` is #404040 and
      the teal edge, the console surround and the yellow frames are drawn; every figure is `estimated`, another model's
      reading. Rear: The rear is drawn in the chassis colour #404040. The only rear in colour with the FlexStack slot is
      the NetBox photograph of the WS-C2960S-48LPD-L (cisco-ws-c2960s-48lpd-l.rear.png, 1516 x 150 px), whose plain plate
      reads #3f4447 (median of 2000 px, box (440,15,520,40)) and whose fitted module's frame reads #3f565d (box
      (230,137,330,142)); the NetBox photograph of the WS-C2960S-24TS-L rear (cisco-ws-c2960s-24ts-l.rear.png, 1102 x 97
      px, a model with no FlexStack slot, read for colour only) reads #404145 (box (520,8,590,24)). The drawn #404040 is
      within 7 levels of 255 of each. Figure 1-10 (PDF p19, printed 1-17) draws the rear pale grey (#d4d6d8, box
      (330,150,430,185) of the converted figure), shaded by the light on each face; the two photographs and the figure
      disagree, so the photographs' charcoal is kept and the gap `faceplate-colour` says so.
  front-plates:
    confidence: estimated
    note: >-
      The ring, channel, silver plate and bar round each block of jacks, the yellow number tags above them and the yellow
      tick band under them, the console and management jack plates, the USB shell, the SFP+ frames with their pull tabs
      and numeral tabs, the Mode button's rim, the arrow fills and the USB symbol are placed as the WS-C2960S-48FPD-L
      stencil gives them (cisco-ws-c2960s-48fpd-l.front.png, 11.345 px per mm, the chassis starting 216 px in), which the
      48LPD-L stencil matches in layout and in every colour sampled above. The stencil is a community artist's flat render
      and these are that artist's palette; no photograph from Cisco of the front is held. The yellow outline stays round
      the white ring because the figure is isometric and too small to tell a ring from a frame.
  front-console-end:
    confidence: estimated
    note: >-
      The shapes at the console end are read from the NetBox front elevations of the WS-C2960S-48FPD-L, -48TD-L,
      -24PD-L and -24TD-L (cisco-ws-c2960s-<model>-l.front.png, 5475 x 503 px, 11.345 px per mm, the chassis starting
      216 px in, so one pixel is 0.09 mm). The four agree on every shape here. A model whose own stencil is another
      product is read from them. The legend band's left end slopes from (384.2, 2.1) to (394.5, 4.6) mm: the first teal
      pixel of each row runs from 4584 to 4683 px over rows 26 to 50. The dark panel's top-right corner is rounded at
      about 2.2 mm: the teal ends at 5191 px in row 53 and at 5213 px from row 77. The console surround stops at
      24.42 mm under the mini-B jack and at 21.24 mm under the RJ-45 jack, with the step at 402.1 mm, so the surround
      and its dark panel are two rectangles each, and the port lamp below stands on the panel. The stencil rounds the
      inside of the step by about 0.9 mm and it is drawn square here. The mini-B's lower corners show the surround's
      teal in the stencil, so two teal triangles, 0.8 by 1.2 mm, cover the hole's black beside the part's bevels.

  numbering:
    confidence: drawing
    note: >-
      Ports run left to right from the far left, port 1 above port 2 in each pair, and the module slots are 49 and
      50 (the note under Figure 1-3, PDF p5, printed 1-3). The numerals are carried on the face as printed on the
      strip above the jacks. Interface names are in the community NetBox device type only: GigabitEthernet1/0/1 to
      1/0/48, TenGigabitEthernet1/0/1 and 1/0/2 for the two slots and FastEthernet0 for the management port.
  jacks:
    confidence: estimated
    note: >-
      Row 1 starts 11.72 mm down the face and row 2 at 26.71, 15.0 apart; the first block's first jack at 24.06 mm
      from the chassis side and the blocks 89.4 mm apart (6 x 13.97 plus a 5.58 gutter), as on the 48FPD-L. Upper-row
      jacks take the 180-degree rotation the 4948E's upper row takes.
  controls-and-lamps:
    confidence: estimated
    note: >-
      The eight switch lamps (SYST, RPS, MSTR, STAT, DPLX, SPED, STCK, PoE) stand in a column at 7.1 mm, pitched
      2.53 mm, the Mode button below them (Figure 1-7, PDF p13, printed 1-11: System, RPS, Master, Status, Duplex,
      Speed, Stack, PoE, Mode button; the PoE lamp is "only on switch models that support PoE", which this one does).
      Port lamps are the two small arrows above each column pair, up for the upper port and down for the lower; their
      meaning depends on the selected mode (Table 1-9). The arrows by the console jacks are the USB and RJ-45 console
      lamps (Table 1-10, PDF p18, printed 1-16); their text is not on the metal.
  legend:
    confidence: estimated
    note: >-
      The legend "Catalyst 2960-S Series PoE+ 10G" is the NetBox stencil's text on the WS-C2960S-48FPD-L and the
      WS-C2960S-24PD-L, both PoE+ models with two SFP+ slots. Figure 1-1 shows only "2960-S" under the console
      callout. It is carried for this model from those two stencils, which are community art, not this model's own
      document.
  console:
    confidence: drawing
    note: >-
      Figure 1-1 callouts 5 and 6 and "Management Ports" (Figure 1-5, PDF p9): the USB mini-Type B console port and
      the RJ-45 console port are one console, and the USB port has priority when both are cabled (Table 1-10). The
      management port is its own (callout 7).
  power:
    confidence: datasheet
    note: >-
      Spec Table 1-2, row Catalyst 2960S-48LPD-L: AC input 100 to 240 VAC autoranging, 5 to 2 A, 50 to 60 Hz; DC
      input for the RPS 2300 +12 V @4 A and -52 V @8 A; power consumption 100 W, 341 BTUs per hour (footnote 1: the
      power consumed internally by the switch at 120 VAC, 60 Hz); power rating 0.48 KVA. The PoE budget is 370 W
      (Table 1-1; "PoE+", 30 W per port maximum, 370-W switch maximum, spec Table 1-2). The supply is built in: "The
      switch is powered through the internal power supply" (AC Power Connector, PDF p21-22, printed 1-19 to 1-20), so
      it is part of the chassis and not a bay.
  inlet:
    confidence: estimated
    note: >-
      The inlet is an IEC C14 appliance inlet, read from Figures 1-10 and 1-11 (a three-pin keyed inlet with a rating
      label beside it) and the NetBox WS-C2960S-48LPD-L rear photograph, which shows it. The guide does not name the
      connector type; it says "Use the supplied AC power cord" and describes an optional power cord retainer
      (PWR-CLP=, PDF p42, printed 1-18). Position is read from that photograph (3.41 px per mm from the 444.5 mm
      width, 1516 px).
  rear:
    confidence: estimated
    note: >-
      The rear is the stacking models' common rear (Figure 1-10, with the RPS connector: callouts 1 FlexStack module slot
      and cover, 2 fan exhaust, 3 RPS connector, 4 AC power connector). Positions come from the NetBox 48LPD-L rear
      photograph (3.41 px per mm along its width), which is this model's own rear by its model name but whose printed
      ratings match none of the five rows of spec Tables 1-2 and 1-3. It shows a C2960S-STACK module fitted; this device
      shows the blank cover (the module is optional: "FlexStack Ports", PDF p21, printed 1-19) and takes the module as a
      configuration. Spec Table 1-2 lists a DC input for the RPS 2300 for this model, so the RPS connector is present. The
      guide says "If you are not using an RPS with your switch, use the two Phillips pan-head screws to attach the RPS
      connector cover" (Figure 1-15, PDF p39, printed 1-15), so the connector is drawn open, as the photograph shows it.
      It is the part cisco/rps2300-connector@2 (interface `cisco-rps2300`), seated at the plate's place; the rating strip
      stays chassis art. Measured on the photograph at 3.41 px per mm: a metal plate 72.8 x 22.6 mm at (285.0, 21.4) with
      a raised rating strip above it (49.2 x 3.8 mm at 297.7, 17.9), a black shroud 48.2 x 11.3 mm at (298.4, 24.0)
      holding a cream housing 46.9 x 9.7 mm, and in it two rows of eleven cavities on a 4.17 mm pitch, with a screw hole
      at each end of the plate. Eleven across is what the serial-number figures draw (PDF p55-56, printed 1-5 to 1-6);
      Figure 1-10 draws seven in a smaller figure, and the photograph and the larger figures are followed. The warning
      label above the plate ("DC inputs for remote power supply specified in manual", with a triangle) is printed on the
      metal at (294.0, 5.9), 45.2 x 9.7 mm and is drawn as the photograph prints it; the rating strip over the pins and
      the rating plate beside the inlet (32.7 x 13.4 mm at (351.0, 6.1)) are drawn blank, because the figures the
      photograph prints match none of this model's own row of the spec tables (see the gap `rear-label-text`). The inlet
      sits in a moulded black surround 29.3 x 22.5 mm at (387.6, 8.3). The fan exhaust is a honeycomb of hexagons about
      9.7 x 8.5 mm on an 8.8 mm column pitch (21 cells, flat-topped), drawn with the library's `vent` pattern scaled by
      2.0 with `pattern-pitch` to that pitch over a plate in the web's colour (the photograph's web reads #404345, box
      (540,44,705,140), the holes #040507), with the two light cut edges above and below the field (#b9bcba, box
      (533,40,712,46)). Four pan-head screws, 6.8 mm across, stand at 7.3, 111.4, 274.2 and 436.4 mm along and 28.7 mm
      down; the first is on the module's flange and is drawn with the cover. The FlexStack slot is the fitted module's
      stepped frame (see the blank cover's contract). The faint stamped corner marks round the fan and one small drilled
      hole are not drawn.
  airflow:
    confidence: estimated
    note: >-
      The guide names a fan exhaust on the rear panel, counts no fans and gives no direction; no airflow is set and
      no fan redundancy is claimed. The exhaust is drawn where Figure 1-10 and the photograph put it.
  ears-and-kits:
    confidence: drawing
    note: >-
      Figure 1-12 (PDF p36, printed 1-12) "Attaching Brackets for 19-inch Racks": front-mounting, mid-mounting and
      rear-mounting positions, with number-8 Phillips flat-head screws (48-0655-01); Figure 1-13 (PDF p37, printed
      1-13): number-12 Phillips pan-head screws (48-0523-01) for the rack and a black Phillips machine screw
      (48-0654-01) for the cable guide. The text says four screws attach each bracket's long side to the switch. The
      19-inch brackets are in the box, so they are not a kit. No position is dimensioned, so none carries an `at`.
      The ETSI bracket is printed "700-19781XX" (PDF p34, printed 1-10), with its revision digits unread: it is a
      gap and not a kit.
  lifecycle:
    confidence: estimated
    note: >-
      No lifecycle date is carried. The end-of-sale notices are not held; only titles and list dates would be, and
      this model's is not among them.
