configurations:
  ac-350w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-350W-PI2 supplies and three NXA-SFAN-30CFM-PI fan modules: port-side intake airflow,
      burgundy latches
    default: true
    part-numbers:
      N9K-C92348GC-FX3: {part: N9K-C92348GC-FX3}
  ac-350w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-350W-PE2 supplies and three NXA-SFAN-30CFM-PE fan modules: port-side exhaust airflow,
      blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C92348GC-FX3: {part: N9K-C92348GC-FX3}
    component-attrs:
      nxa-sfan-30cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-350w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  hvac-hvdc-350w-port-side-intake:
