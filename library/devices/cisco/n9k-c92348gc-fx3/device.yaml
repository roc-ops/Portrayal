  width: 439.4
  height: 43.7
  depth: 457.2
  ru: 1
  weight-kg: 6.57
  color: '#d0d2cf'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: recessed, label: 'port end to the front, set back for interface cables'}
    - {name: recessed, label: 'module end to the front, set back for module handles'}
