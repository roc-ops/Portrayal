format: 1
kind: device
name: n9k-c92348gc-fx3
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: N9K-C92348GC-FX3
aliases:
- {name: Nexus 92348GC-FX3, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX3}
description: >-
  48x 10M/100M/1GBASE-T access, 4x 10/25G SFP28 and 2x 40/100G QSFP28 uplink 1RU data-centre switch running
  NX-OS. The port side carries all fifty-four ports and the BCN, STS and ENV lamps. The other side carries
  the console, an RJ-45 and an SFP management port, the USB port, three fan modules and two power supplies.
  Ports number 1-54 and run DOWN each column, odd on the top row. Ships port-side intake (burgundy modules)
  or port-side exhaust (blue).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco N92348GC-FX3
      NX-OS Mode Switch Hardware Installation Guide, 70 pages, First Published 2024-10-21, Last Modified
      2026-08-04 (the figures were read from the PDF pages themselves, rendered at 400 dpi, and the text
      from its text layer). Page numbers are PDF pages with the printed page after them. The Overview
      (PDF p7, printed 1) and its front and rear figures (PDF p8 and p9, printed 2 and 3; art numbers
      523972 and 523973), appendix B (PDF p58, printed 52, and PDF p59, printed 53) and appendix C (PDF
      p65, printed 59). THE FIGURES ARE GREY BITMAPS OF 1200 PX (200 ppi JPEG, about 2.7 px per mm in
      the guide's own file, so they are blurred beside the PH guide's line art) and carry callouts. NO
      DATA SHEET, PHOTOGRAPH, 3D MODEL OR STENCIL IS HELD for this model, and the NetBox devicetype-library
      is held as a path listing only: no file was read, so nothing is taken from it.
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its outermost end lines on the 400 dpi render of PDF p8, is 2329
      px across and 232 px down: aspect 10.04 against the guide's 17.3 x 1.72 in, 10.06, so 0.2% out,
      and it can be measured; 5.30 px per mm both ways. A repeated feature checks the scale: the jack
      columns step 74.2 px, 14.0 mm, against the registry's 13.97, and the boxed groups step 477 px, 90.0
      mm, so every pitch is the registry's and the figure fixes where each group starts. The rear figure
      is read at the same scale from its own outer end lines, 2323 px across. The figure is blurred: a
      reading is good to about 0.5 mm.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's convention: the upper cage upright over the lower turned 180, and the upper jack turned
      180 over the lower one. The front figure draws the upper jacks with their latch notch up and the
      lower jacks with the notch down, which is that arrangement.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure, origin the left end line. FOUR boxed groups of six jack columns: the box
      lines start at 15.15, 105.1, 195.1 and 285.1 mm (a stride of 90.0), and the jacks stand 2.7 mm inside
      each, so the columns start at 17.5, 107.5, 197.5 and 287.5 mm. At the registry's 13.97 mm pitch
      the stride is a gutter of 6.2 mm. The two SFP28 columns' boxes start at 375.8 and 390.8 mm, a 15.0
      mm step, and the QSFP28 pair at 409.4 mm. Read from this figure and not carried from the PH: the
      PH's groups start 0.05 mm away and its SFP28 step is 14.65 mm.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top line. The upper jack's centre is at 14.95 mm and the lower
      jack's at 30.55, a 15.6 mm row pitch (the PH figure reads 14.6; this figure draws its jacks about
      0.5 mm lower and is blurred); with the registry's 11.0 high cell the upper jack runs 9.45 to 20.45
      mm. The SFP28 boxes run 9.9 to 19.5 and 25.6 to 35.5 mm and the QSFP28 boxes the same. THE PORT
      LAMPS ARE SMALL RECTANGLES BELOW THE JACKS, one under each port, so common/led-rect@1 (4.6 x 2.6),
      two to a column, the left one for the upper port, at 38.9 mm; the numerals and a pair of arrows
      stand above them.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table (PDF p58, printed 52): "17.3 inches (43.9 cm)" wide, "1.72 inches
      (4.4 cm) (1 RU)" high, and for depth "Chassis without PSUs - 18.0 in (45.72 cm)", "With NXA-PAC-350W
      PSUs - 19.7 in (49.9 cm)", "With NXA-PHV-350W PSUs - 19.7 in (49.9 cm)" and "With NXA-PDC-440W PSUs
      - 21.0 in (53.34 cm)". The guide lists no 1900 W supply. The chassis depth carried is the first,
      457.2 mm: the library's depth is the chassis, and the others include the modules. 439.4 mm and 43.7
      mm are carried, the inch figures converted. The weights table on the same page gives this chassis
      "14.5 lb (6.57 kg)"; this is the 92348GC's own row (the PH's is 14.33 lb, 6.49 kg).
  port-order:
    confidence: estimated
    note: >-
      The figure prints a pair of numerals over each column of lamps with an up and a down triangle between
      them, "1 up down 2" to "47 up down 48", and "49 up down 50", "51 up down 52" and "53 up down 54"
      under the SFP28 and QSFP28 cages, so the odd port is the upper jack or cage. The Overview (PDF p7)
      gives 48 10M/100M/1G BASE-T downlink ports, 4 SFP28 uplinks and 2 QSFP28 uplinks, and the callout
      table (PDF p8) "10M/100M/1G RJ45 ports (48)", "SFP28 ports (4)" and "QSFP28 ports (2)". Port numbers
      are as printed; the NX-OS interface names are not in the guide.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs (PDF p65, printed 59): "The port LEDs appear as triangles pointing
      up or down to the nearest port." Green is admin up, module present and link up; amber is admin down
      or module absent; off is up and present but no link. The figure draws the SFP28 triangles large,
      between the two cage rows, and the QSFP28 triangles at the ends of a band with eight small windows
      between them; the windows are drawn as marks and carry no state. The copper triangles are the printed
      arrows beside the numerals; the copper lamps are the rectangles under the jacks.
  chassis-lamps:
    confidence: estimated
    note: >-
      Callout 1 is "LEDs". The figure draws a boxed panel at the left end with THREE ring lamps in a column,
      legends BCN, STS and ENV to their left, at 10.6 mm across and 11.95, 15.95 and 19.9 mm down; there
      is no fourth lamp and no P (this is the non-PoE model). Under them the figure draws a block of nine
      small rings in three rows, some with a mark inside that the blur does not resolve, and the maker's
      logo mark under them; the guide does not name the rings and they are drawn as plain marks. The figure
      also draws a column of seven rings at the right end, beside the QSFP28 pair; they are drawn as marks
      and are in the gaps. No logo is drawn: the library's practice for a Cisco face is no logo artwork.
      The model legend under the uplinks, CISCO NEXUS N9K-C92348GC-FX3, is printed on the figure and is
      carried as text.
  rear-face:
    confidence: estimated
    note: >-
      Art number 523973, PDF p9 (printed 3), whose text under the callout table says "The figure shows
      the chassis for Cisco N92348GC-FX3", so this is the model's own rear. The console jack over the
      RJ-45 management jack, the USB port stood on end, the SFP management port, two lamps labelled BCN
      and STS, a grounding symbol with two screws, three fan modules, then supply 1 and supply 2. THE
      OUT-OF-BAND BLOCK IS AT THE LEFT END, as on the 93180YC-EX. Every position was read off this figure
      and agrees with the PH guide's rear figure (a different bitmap, drawn at a different resolution)
      to within 0.4 mm, which is this figure's resolution, so the PH's values are used where this figure
      cannot say otherwise. The figure draws small airflow legends, F1 and F2 with arrows, beside the
      first fan and P1 and P2 beside the supplies; they are not carried. The management SFP cage is the
      registry's plain one. The grounding pad is drawn as the plain earth symbol; the registry's ground
      symbol is the circled one, so the mark is drawn.
  supply-label:
    confidence: estimated
    note: >-
      THE REAR FIGURE PRINTS A LABEL ON EACH SUPPLY, above its inlet. Read at the figure's native 200
      ppi it is about 6 px a glyph and reads C3KX-PWR-, then three characters the blur does not resolve
      (they look like 1100), then WAC: a Catalyst 3750-X supply legend, apparently left on the drawing.
      It is not one of the six part numbers the guide's text lists (NXA-PAC-350W-PI2 and -PE2, NXA-PHV-350W-PI
      and -PE, NXA-PDC-440W-PI and -PE; PDF p8, printed 2, and the weights table, PDF p58, printed 52),
      and the drawing says AC supplies are shown. The text is what the configurations name; the label
      is a drawing error, is not carried on the supplies, and adds no part.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements (PDF p59, printed 53, read from the page): typical 226
      W and maximum 242 W "(AC or DC)", 825.738 BTU per hour. The figures are the switch's draw and not
      a supply rating; the guide names no configuration or ambient.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the value the
      93180YC-EX's stencil sample gave, carried across as a family colour.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's NXK-ACC-KIT-1RU procedure says the holes used depend on the rack and on the clearance
      needed for interface cables, 3 inches minimum, and for module handles, 1 inch minimum, and its figure
      shows two ways to mount the brackets. None dimensions a position and none says which the box ships
      with, so the two positions are written without an `at`, named for what the text says they clear,
      and none is the default.
attrs:
  physical:
    weight-note: >-
      14.5 lb (6.57 kg) chassis without fans or PSUs. Fan module 0.26 lb (0.12 kg). Supplies 2.64 lb (1.2
      kg), one row for all six.
  power: {power-typical-w: 226, power-max-w: 242, power-envelope: unstated, heat-dissipation-btu-hr: 826,
    power-input-ac: '100 to 120 V or 200 to 240 V, 50 to 60 Hz (350 W AC)', power-input-hvac: 100 to 277
      V (350 W PHV), power-input-dc: -48 to -60 V nominal (440 W), power-input-hvdc: 240 to 380 V (350
      W PHV), power-supply-options: '350W AC, 350W PHV or 440W DC (two)'}
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: '5
      to 90% operating, 5 to 95% non-operating', altitude: '13,123 ft (4000 m) operating'}
  features:
    ports-t: 'guide: "48x 10M/100M/1G BASE-T downlink ports"'
    optics-sfp28: 'guide: "4x 10/25 Gbps SFP28+ uplink ports"'
    optics-qsfp28: 'guide: "2x 40/100 Gbps QSFP28+ uplink ports"'
    management-ports: 'rear figure: one RJ-45 and one SFP management port, and a console port'
  management: {usb: 1 USB port}
  lifecycle: {eol: none-announced}
