configurations:
  ac:
    kind: base
    description: >-
      One PWR-C2-640WAC in bay 1 and the PWR-C2-BLANK cover in bay 2, three FAN-T1 fan modules and a StackWise
      adapter blank in each StackWise port - the switch as Table 1-1 sells it, with every port empty. The guide
      prints a SKU for each software image, WS-C3650-48PD-L, -S and -E, and none for the hardware alone, so this
      build carries no part number.
    default: true
  ac-dual:
    kind: example
    description: >-
      Two PWR-C2-640WAC supplies, the "(1) 640 W + (1) 640 W" combination of Table 1-15. The guide prints no SKU
      for it.
    bays:
      psu-2: 'cisco/pwr-c2-640wac@1'
  ac-1025:
    kind: example
    description: >-
      One PWR-C2-1025WAC in bay 1 and the blank cover in bay 2, the "(1) 1025 W" combination of Table 1-15. The guide
      prints no SKU for it.
    bays:
      psu-1: 'cisco/pwr-c2-1025wac@1'
  dc:
    kind: example
    description: >-
      One PWR-C2-640WDC in bay 1 and the blank cover in bay 2, the DC build of Table 1-14. The guide prints no SKU for
      it.
    bays:
      psu-1: 'cisco/pwr-c2-640wdc@1'
  dc-dual:
    kind: example
    description: >-
      Two PWR-C2-640WDC supplies, 780 W of PoE (Table 1-14). The guide prints no SKU for it.
    bays:
      psu-1: 'cisco/pwr-c2-640wdc@1'
      psu-2: 'cisco/pwr-c2-640wdc@1'
references:
- {title: 'Cisco Catalyst 3650 Switches Hardware Installation Guide (September 2016, OL-29734-01)', url: 'https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/hardware/installation/guide/Cat3650hig_book.pdf', sha256: 869ad32a4637185d507d38022a8ea870557f1c2e5a7afa9bf7257069faad8329}
