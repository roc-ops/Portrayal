    - {name: flush, label: front-mounting position, default: true}
    - {name: rear, label: rear-mounting position}
gaps:
- what: usb-console-jack
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The USB mini-Type B console receptacle (Front Panel, USB Mini-Type B Port). It is not yet a library part:
    the standard `mini-usb-b` is on main and no component presents it. The guide puts the port in the band
    above the first block, between the CONSOLE lamp and the USB Type A port, at about 67 mm in. The port is
    placed once the jack is on main, before this change merges. Nothing that reads as a port is drawn there;
    its lamp and its CONSOLE legend are.
- what: rack-kit
  scope: [front, rear]
  reason: needs-drawing
  wanted: >-
    RACK-KIT-T1= (Figure 2-7: 19-, 23-, 24-inch and ETSI brackets; the 19-inch pair ships in the box) as a
    `kind: kit` component. A component with that part number is not on main, and the Catalyst 9300 names the same
    number, so it is not added here; it is listed under `chassis.kits` once it exists. 4PT-KIT-T1= (extension
    rails for four-point mounting) is likewise not added.
- what: uplink-legend-and-positions
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A flat elevation or a square-on photograph of the front. Every position on it is read off an isometric
    line drawing, and the uplink module's legend "Catalyst 3650 48PoE+ 2X10G" and the cage pitch are read at
    the figure's coarsest part. The port numerals under the lamps are drawn at the ends of each strip only,
    because only those are printed.
- what: rear-figure-positions
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A flat rear elevation. The rear is read off Figure 1-13, an isometric drawing at about 2.1 px/mm, and the
    legends under the console and management ports are too small to read exactly.
- what: mode-button-part
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A round push-button part for the mode button. The library's closest part is the 4 mm recessed reset
    button, which is placed here for want of one; the real button is a 5 mm round cap.
- what: stackwise-adapter
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The StackWise adapter (C3650-STACK-KIT= sells two with a 0.5 m cable). No figure held draws its face, so it is
    left for a later batch and the bays accept only the blank.
- what: sale-status
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    A link to the end-of-sale notice. The Catalyst 3650 series page is held and says End of Sale, but the
    notice itself is not, so no lifecycle is recorded.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. Figure 1-1 shows the lid with the vendor's
    logo and several screws, and a side wall with a vent field and bracket screw holes, only
    isometrically. None can be measured.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp:
    term: Uplink
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
  sfp-plus:
    term: Uplink
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  uplink-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the console and management jacks of the rear and the USB Type A port of the front. Two jobs, one purpose:
      reaching the switch when the data plane cannot, and holding the flash drive its software is copied from.
  controls: {term: Button, role: management, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Power Supply Modules (chapter 1): "The switch can operate with either one or two active power supply
        modules"; both slots must hold a supply or a blank cover.
  fans:
    term: Fan module
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        Fan Modules (chapter 1): "Three fans are required for proper cooling" and "The switch can operate with
        two operational fans".
  stackwise: {term: StackWise port, role: fabric, index-origin: 1}
