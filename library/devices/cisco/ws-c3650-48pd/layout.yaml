format: 1
kind: device
name: ws-c3650-48pd
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: WS-C3650-48PD
aliases:
- {name: Catalyst 3650-48PD, kind: marketing}
- {name: WS-C3650-48PD-L, kind: vendor, note: the LAN Base software image on this hardware}
- {name: WS-C3650-48PD-S, kind: vendor, note: the IP Base software image on this hardware}
- {name: WS-C3650-48PD-E, kind: vendor, note: the IP Services software image on this hardware}
portfolio: {line: Catalyst, family: Catalyst 3650, series: Catalyst 3650-48PD}
description: >-
  48x 10/100/1000 PoE+ RJ-45 and 4 uplink cages - two 1G SFP and two that take 1G SFP or 10G SFP+ - on a
  stackable 1RU switch, the 48PD of the Catalyst 3650. The downlinks, the mode button and status lamps, the
  USB Type A port and the uplink module are on the front; the RJ-45 console port, the Ethernet management
  port, the ground connector, three fan modules, two StackWise ports and two power supply bays are on the
  rear. Ports number 1-48 and run DOWN each column - odd on the top row, even beneath it. It ships with one
  640 W AC supply and a blank cover in the second bay. -L, -S and -E are the LAN Base, IP Base and IP
  Services software images of this one hardware and are not separate devices.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One source, not committed: Cisco Catalyst 3650 Switches Hardware Installation Guide, September 2016,
      OL-29734-01, 126 pages
      (https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/hardware/installation/guide/Cat3650hig_book.pdf).
      Table 1-1 (PDF p15-20) is the switch models table; the Technical Specifications appendix (from PDF
      p103) restarts its table numbers, so "spec Table 1-1", "spec Table 1-2" and "spec Table 1-5" below are
      the appendix's. Its figures are isometric line drawings that it says are "not intended to depict any
      particular color scheme" (Front Panel, PDF p21). No data sheet, no flat elevation, no photograph and no
      3D model of any 3650 is held. The front is Figure 1-1 (the 48PD-L) with the left end enlarged in Figure
      1-8; the rear is Figure 1-13. THE NETBOX COMMUNITY DEVICE TYPES for this model were read as a second
      opinion on the port list only and carry nothing else here.
  the-envelope:
    confidence: datasheet
    note: >-
      spec Table 1-1: "Catalyst 3650 48-port PoE+ switches 1.73 x 17.5 x 17.625 in. (4.4 x 44.5 x 44.8 cm)",
      H x W x D, for the chassis assembly as it is shipped: three fans, two StackWise adapter blanks, one power
      supply blank and the default power supply. 17.5 in is 444.5 mm and 17.625 in
      447.7 mm. 1.73 IN IS THE GUIDE'S NOMINAL 1RU: the same box is printed 1.75 in (4.45 cm) in other
      guides, neither is measured, and 44.45 mm is carried. One row of the table covers every 24- and
      48-port PoE+ model, and the 48-port PoE+ row was read for this model. Weight 16.75 lb (7.6 kg) from the
      same table's 48-port PoE row. The 1025 W supply is 1.5 in deeper than the others (spec Table 1-2), and
      the table's own deeper row, 19.125 in, belongs to the 48-port Full PoE models; no deeper figure is
      printed for a PoE+ model carrying that supply.
  gate-1:
    confidence: estimated
    note: >-
      THE FIGURES ARE PERSPECTIVE DRAWINGS, NOT ELEVATIONS, so every position is an estimate. Figure 1-1 is
      1280 x 440 px with the face seen from the right and above: its height reads 84 px at the left end and
      about 109 px at the right, so the scale grows by about a third along the face and no single px/mm
      holds. The anchors are the 17.5 in width (face edge to face edge, 24 to 982 px, 2.15 px/mm on
      average) and the RJ-45 pitch, 13.97 mm, which reads 2.08 px/mm in the first block and 2.36 px/mm in
      the fourth. Figure 1-8, the left end close up, is nearer square-on and gives the vertical order: the
      face 12.8 px/mm tall, the jack openings at 8.4 and 20.4 mm down, the lamp strip at 34.5 mm, and the
      mode button, lamp pills, mini-B and USB-A in a band above the jacks. Good to about 3 mm along the face
      near the left and 8 mm near the right, 1 mm across it.
  the-four-blocks:
    confidence: estimated
    note: >-
      Figure 1-1: four windows of twelve jacks, six columns by two rows, 174 px wide in the first and 198 px in
      the fourth, which is 83.8 mm of 13.97 mm pitch each. The first jack opening starts about 9 mm in from the
      face edge (Figure 1-8 and Figure 1-1 agree to 0.5 mm once the edge is read at 24 px, not at the window
      frame), and the windows are separated by a bar about 2 mm wide, so the block step is 85.8 mm. The
      fourth block is then read 266.7 mm in against 268 to 270 mm from the figure's right-hand scale.
  rows:
    confidence: estimated
    note: >-
      Figure 1-8: the upper jacks stand with the latch at the top and the lower with it at the bottom, the
      usual stacked mirror, so the top row is turned 180 as the registry's rj45-ganged is drawn. The
      openings read 9.7 mm tall and 2 mm apart, so a 12.0 mm row pitch of 11.0 mm jacks.
  port-order:
    confidence: drawing
    note: >-
      Figures 1-1 and 1-8: each block of twelve prints one up-arrow and one down-arrow lamp under each column,
      with "01X" at the left end of the strip and "12X" at the right, "13X" and "24X" under the second, "25X"
      and "36X" under the third and "37X" and "48X" under the fourth. So the odd port is the upper jack and
      numbering runs down each column. Only the ends of each strip are printed, so only they are drawn.
  lamps:
    confidence: datasheet
    note: >-
      Front Panel (chapter 1), Figure 1-8: STAT, DUPLX, SPEED, STACK and PoE are the mode lamps beside the
      mode button, SYST and ACTV beneath them, and the CONSOLE lamp beside the USB mini-B port. Table 1-2
      (SYST): off, green normal, blinking green POST, blinking amber a power supply or fan fault, amber
      receiving power but not functioning. Table 1-3 and Table 1-4 (port LEDs by mode): in STAT mode off is no
      link, green link, blinking green activity, alternating green-amber a link fault, amber blocked by
      spanning tree; the other modes read speed, duplex, active switch and PoE state. Table 1-5 (USB console):
      off disabled, green enabled. Table 1-6 (ACTV): off not the active switch, green active or standalone,
      amber an election or stack error, slow blinking green standby. Table 1-9 (uplink): off, green link,
      blinking green activity, blinking amber a fault or limit, amber disabled. The guide's blink patterns are
      not states a drawing can hold, so each lamp lists its steady colours.
  uplinks:
    confidence: estimated
    note: >-
      Figure 1-1 draws the uplink module at the right: two long vent slots, the legend "Catalyst 3650 48PoE+
      2X10G", four cages and under them G1, G2, G3 TE3 and G4 TE4 with a lamp beside each. Uplink Ports
      (chapter 1): "Two slots (left side) supporting only 1-Gigabit SFP modules and two slots (right side)
      supporting either 10-Gigabit SFP+ modules or 1-Gigabit SFP modules", and Table 1-1 gives this model two
      1G SFP and two 10G SFP+ uplinks. "An SFP+ module ports has two labels, G(x) and TE(x)". The cages read
      about 16.4 mm apart, wider than the registry's 14.25 mm abutting pitch, so they are placed on that pitch.
      The vent slots and the legend are read as fractions of the module's height.
  console-over-usb:
    confidence: datasheet
    note: >-
      USB Mini-Type B Port (chapter 1): the switch has "a USB mini-Type B console connection on the front
      panel, and the RJ-45 console port on the switch's rear panel", console input is active on one at a time
      and the USB connector takes precedence. The mini-B receptacle is not yet a library part (see the gap
      usb-console-jack), so only its lamp and its printed legend are drawn.
  rear-face:
    confidence: estimated
    note: >-
      Figure 1-13, read as fractions of the rear face (62 to 1000 px for 444.5 mm, 2.11 px/mm): at the left
      the ground connector (callout 1, two threaded holes with the ground symbol between), the RJ-45 console
      port (2) over the RJ-45 management port (3) with their legend CONSOLE and MGMT beneath; three fan
      modules (4) with a StackWise port (5) in the gap after the first and after the second; two supply bays
      (8) at the right, each with the AC OK (6) and PS OK (7) lamps. The supplies read 95 mm wide, which
      agrees with spec Table 1-2's 3.75 in. The fan modules read 44 mm wide, which fixes the face of spec Table
      1-5 (see cisco/fan-t1).
  stackwise:
    confidence: datasheet
    note: >-
      StackWise Ports (chapter 1): "StackWise adapter blanks installed in the StackWise ports is the default
      setup", and a stack needs adapters installed; "You cannot have a switch stack containing a mix of Catalyst
      3650 and Catalyst 3850 switches". The adapters and cables are sold as C3650-STACK-KIT=, and no figure
      draws the adapter's own face, so the bays accept only the blank here.
  rear-lamps:
    confidence: datasheet
    note: >-
      Table 1-12 (RJ-45 console): off is disabled with USB console active, green enabled with USB console
      disabled. Table 1-23 (Ethernet management port): green link up without activity, blinking green link and
      activity, off link down. The supplies' AC OK and PS OK lamps are Table 1-21 and the fan LED is green when
      the fan runs and amber when it fails (Fan Modules, chapter 1).
  ears-and-rack:
    confidence: drawing
    note: >-
      Rack-Mounting a Switch and Attaching the Rack-Mount Brackets (chapter 2): "The 19-inch brackets are
      included with the switch", attached with four screws "for the front-mounting or rear-mounting positions
      (Figure 2-8)", and "Use four screws to attach the brackets for the front-mounting position". Figure 2-8
      shows the bracket on the front and on the rear end of the side wall, so the front-mounting position is
      the one shipped and the rear-mounting position the other. NO FIGURE DIMENSIONS EITHER POSITION, so no
      `at` is written. Figure 2-7 lists RACK-KIT-T1= (19, 23, 24 inch and ETSI brackets) and 4PT-KIT-T1=
      (extension rails for four-point mounting); neither is a library part yet (see the gaps).
  power:
    confidence: datasheet
    note: >-
      Table 1-1: 640 W power supply. Table 1-13: 48-port PoE switch, default supply PWR-C2-640WAC, 390 W of PoE
      available; Table 1-14: 390 W with one 640 W DC supply and 780 W with two; Table 1-15: PoE+ on 48 ports
      needs two 1025 W supplies, and PoE (15.4 W) needs one 1025 W or two 640 W. Table 1-1 prints no
      typical or maximum draw for the switch itself and none is stated here.
  interface-names:
    confidence: estimated
    note: >-
      NOT IN THE GUIDE. Port naming lives in the IOS configuration guides, which are not held, so no
      `interfaces:` block is written. The NetBox community type for this model names GigabitEthernet1/0/1 to
      1/0/48 and TenGigabitEthernet1/1/1 to 1/1/4 (netbox-community/devicetype-library, device-types/Cisco/
      WS-C3650-48PD-L.yaml); that is a community file and is not carried.
attrs:
  physical:
    weight-note: '16.75 lb (7.6 kg) for the 48-port PoE switch, as shipped with three fans, two StackWise adapter blanks, one power supply blank and the default power supply (spec Table 1-1)'
    stackwise-adapter-weight: '0.25 lb (0.11 kg) for a StackWise stacking adapter, 0.1 lb (0.05 kg) for an adapter blank (spec Table 1-1)'
  power:
    poe-budget: '390 W with one PWR-C2-640WAC (Table 1-13); 780 W with two 640 W DC supplies (Table 1-14)'
    poe-power-per-port: 'up to 15.4 W (IEEE 802.3af) and up to 30 W PoE+ (IEEE 802.3at) per port (PoE+ and Cisco UPOE Ports)'
    power-supply-options: 'PWR-C2-250WAC, PWR-C2-640WAC, PWR-C2-1025WAC, PWR-C2-640WDC (Power Supply for Catalyst 3650-24TS/PS/TD/PD and 3650-48TS/PS/FS/TD/PD/FD/FQ/PQ/TQ)'
    psu-redundancy: 'two supply slots; the switch operates on one or two supplies, and on two AC, two DC or one of each'
  environmental:
    operating-temp: '-5 to +45 C up to 1500 m, -5 to +40 C up to 3000 m, -5 to +35 C up to 4000 m, -5 to +30 C up to 5000 m with an AC supply (spec Table 1-1)'
    storage-temp: '-40 to 70 C (-40 to 158 F)'
    humidity: '5 to 96%, noncondensing'
    altitude: 'storage up to 5000 m (16,400 ft)'
  features:
    stacking: 'StackWise-160; a 3650 cannot stack with a 3850 (StackWise Ports)'
    usb-storage: 'USB Type A port for Cisco USB flash drives of 64 MB to 1 GB'
    uplink-optics: 'SFP on G1 and G2; SFP or SFP+ on G3/TE3 and G4/TE4; an SFP+ module in an SFP-only slot does not operate'
chassis:
  width: 444.5
  height: 44.45
  depth: 447.7
  ru: 1
  weight-kg: 7.6
  color: '#d6d7d9'
  airflow: front-to-back
  power: ac
  ears:
