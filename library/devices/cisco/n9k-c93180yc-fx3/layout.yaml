  physical:
    weight-note: '21 lb (9.52 kg) chassis; each fan module 0.26 lb (0.12 kg); each 650 W AC power supply 2.42 lb (1.1 kg), no weight given for the other supplies'
  power:
    power-typical-w: 375
    power-max-w: 600
    power-envelope: unstated
    heat-dissipation-btu-hr: 2047.285
    power-input-ac: '100 to 240 V, 50 to 60 Hz'
    power-input-hvac: '200 to 277 V'
    power-input-dc: '-48 to -72 V nominal, as printed'
    power-input-hvdc: '240 to 380 V'
    power-supply-options: '650W AC, 1200W HVAC/HVDC or 930W DC (two)'
  environmental:
    operating-temp: '0 to 40 C (32 to 104 F)'
    storage-temp: '-40 to 70 C (-40 to 158 F)'
    humidity: '5 to 90% operating, 5 to 95% non-operating'
    altitude: '0 to 4000 m (0 to 13,123 ft), the specifications table'
  features:
    optics-sfp28: >-
      guide: "48 100M/1/10/25-Gigabit Ethernet SFP28 ports (ports 1-48)". Auto-negotiation is
      not supported at 10G on ports 1 to 48 and on ports 49 to 52 with a QSA. SFP-10G-T-X and
      SFP-10G-OLT20-X are supported on a stated pattern of ports, with the neighbours limited
      to passive copper.
    optics-qsfp28: 'guide: "6 10/25/40/50/100-Gigabit QSFP28 ports (ports 49-54)"'
    timing: >-
      1PPS and 10MHz SMB ports, a GPS/GNSS SMA antenna port and a ToD RJ-45 port. The guide
      says PTP grandmaster function is supported beginning with NX-OS release 10.3(2)F.
  management:
    usb: '1 USB port'
  compliance:
    regulatory: 'Products should comply with CEMarkings according to directives 2004/108/EC and 2006/95/EC.'
    safety: 'CAN/CSA-C22.2 No. 60950-1 Second Edition, CAN/CSA-C22.2 No. 62368-1-19 Third Edition, ANSI/UL 60950-1 Second edition, IEC 62368-1, EN 62368-1, AS/NZS 62368-1, GB4943'
    emissions: '47CFR Part 15 (CFR 47) Class A, AS/NZS CISPR22 Class A, CISPR22 Class A, EN55022 Class A, ICES003 Class A, VCCI Class A, EN61000-3-2, EN61000-3-3, KN22 Class A, CNS13438 Class A'
    immunity: 'EN55024, CISPR24, EN300386, KN 61000-4 series'
    rohs: 'The product is RoH-6 compliant with exceptions for leaded-ball grid-array (BGA) balls and lead press-fit connectors.'
  lifecycle:
