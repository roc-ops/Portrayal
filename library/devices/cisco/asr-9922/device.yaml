kind: device
name: asr-9922
version: 0.1.0
maturity: modelled
manufacturer: Cisco
model: ASR 9922
description: >-
  Cisco ASR 9922 Router - 44 RU and the largest of the family. TWENTY vertical line card slots in
  two cages, one above and one below a central cage of two route processors flanking seven fabric
  cards, with four fan trays between the cages and four power shelves across the top. The line
  cards in the LOWER cage, slots 10 to 19, are installed UPSIDE DOWN. Modelled as a bare cage.
portfolio:
  line: Service Provider
  family: Aggregation Services Router
  series: ASR 9000 Series
provenance:
  chassis: >-
    datasheet - Table 13, b-asr9k-overview-reference-guide.pdf p130. ASR 9922: chassis height 77.00
    inches (195.58 cm), chassis width 17.60 inches (44.70 cm) with "19.0 inches (48.3 cm) including
    chassis rack-mount flanges and front door width", chassis depth 26.3 inches (66.82 cm), "30.00
    inches (76.20 cm) including the cable management system" and "30.62 inches (77.77 cm) with
    front doors". Modelled as the BODY, 447.0 x 1955.8 x 668.0 mm
  ru: datasheet - 77.00 in / 1.75 = exactly 44.00 RU, and the stencil's height_in of 7.7006 agrees
  faces-verified-independently: >-
    THIS CHASSIS WAS HELD BACK UNTIL ITS FACES WERE SETTLED, because Cisco's ASR 9910 masters are
    named front and rear the wrong way round and an unverified face is not a face. Three
    independent checks now agree that asr-9922-front IS the front. FIRST, the guide states it:
    "Cisco ASR 9922 Router: All RP, FCs, and LCs are front-facing and mounted vertically, with
    ejector levers and captive screws at the top and bottom of each card" (Chassis Slots, p17).
    SECOND, this master carries the CABLE MANAGEMENT TRAY with its diagonal cable slots, which is
    front-face furniture on every chassis in this family. THIRD, its band order reproduces Figure
    24 exactly - power shelves, line card cage, a fan pair, the RP/FC cage, a second fan pair, the
    lower line card cage. The concern that first held it back, that the master named `-rear` shows
    power modules where Figure 24 puts them on the front, is explained by the power system being at
    the TOP and reachable from both faces
  calibration: >-
    measured - gate 1 passed. Calibrating x on 482.6 mm (the 19.0 in rack face) and y on Table 13's
    1955.8 mm independently gives 0.20134 and 0.20144 mm/px, agreeing to 0.05 percent
  slots: >-
    datasheet - Figure 24 "Cisco ASR 9922 Router Slot Numbering", p39 of
    b-asr9k-overview-reference-guide.pdf, read at 250 dpi. Top to bottom: power shelves PS0 to PS3
    each M0 to M3; the upper line card cage, Slot 0 to Slot 9 carrying LC0 to LC9; fan trays FT0
    and FT1; a cage of nine positions named RP0, FC0 to FC6, RP1; fan trays FT2 and FT3; and the
    lower line card cage, Slot 10 to Slot 19 carrying LC10 to LC19. As on the ASR 9912 the RP and
    FC positions are named by Cisco rather than numbered, so they are named here too
  cards-upside-down: >-
    datasheet - a real fact about this chassis that no drawing shows and nothing in the model can
    express yet. The guide states: "For the Cisco ASR 9922 Router, line cards must be installed
    upside down in slots 10 through 19 of the bottom card cage, whereas in slots 0 though 9 of the
    top card cage, the line cards are installed right side up" (p26). The bays for slots 10 to 19
    are geometrically identical to 0 to 9 and carry no rotation, because the card is inverted in
    its own plane rather than rotated in the panel's - see gaps
  cage-geometry: >-
    drawing - three cages measured off the front master. Upper line cards y 367.83 to 726.00, lower
    line cards y 1422.99 to 1781.15, both spanning x 6.36 to 440.24. The RP/FC cage sits between
    them at y 898.83 to 1254.58, spanning x 8.98 to 438.02 - very slightly narrower, which is why
    its nine positions are divided on their own span rather than on the line card cages'
  slot-pitch: >-
    measured, and NOT taken from the card guide rail on this chassis even though the rail is there.
    Its ten rail bolts give a pitch of 44.06 with a spread of 0.11 mm, identical to the ASR 9912's
    and confirming the two are one mechanical build. But those bolts are NOT aligned to slot
    centres here: taking them as centres puts slot 0 thirteen millimetres inside the cage and slot
    9 eighteen millimetres past its right edge, which is asymmetric in a way the 9912's are not.
    So the bays divide the MEASURED CAGE evenly - 433.88 over ten is 43.388 - and the rail is used
    only as corroboration that this generation's pitch is about 44. That asymmetry is what stopped
    this chassis being built on the rail, and it is the same check that caught the 9910's swapped
    faces and my own mislabelling of these bolts as printed slot IDs
  fan-band-pitch: >-
    drawing - the upper pair FT0 and FT1 sit at 762.30 and 808.80 mm, a 46.5 mm pitch. The lower
    pair is placed on the same pitch from the measured start of its band, 1276.90 and 1323.40. An
    earlier revision put FT3 at 1317.40, taken from a rule in the band scan that turned out to be
    internal detail rather than the tray's top edge, and the two openings overlapped by a
    millimetre - they rendered as one solid bar. LINT DID NOT SEE IT because L13 compares BAYS and
    these are cutouts, so overlapping holes in the metal are not checked. Only the render showed it
  power-shelves: >-
    measured, and the component confirms it. The top band measures 0.20 to 193.40 mm - 193.2 mm for
    four shelves, so 48.3 mm each. cisco/a9k-power-shelf-cover, built independently from the
    stencil's own 'Power Shelf Cover' master, is 193.7 mm tall with SIXTEEN positions PM0 to PM15
    on a 48.7 mm row pitch and a 105.05 mm column pitch. 193.2 against 193.7, and sixteen positions
    against this chassis's four shelves of four. That settles what had been an open question about
    which chassis that master belongs to: it is this one. Table 15 agrees on the count - "Version 2
    power system: Up to sixteen AC power modules per system, four per tray"
  power-module-columns: >-
    the four columns are placed on the cover's 105.05 mm column pitch, CENTRED in the body. That
    centring is an assumption: the cover is a rack-face part 475.12 mm wide and this chassis's body
    is 447.0, so its column origin cannot be read straight across. Four columns at 105.05 span
    420.2, leaving 13.4 mm each side of a 447 body, which is a plausible margin but is arithmetic
    rather than measurement
  card-orientation: >-
    datasheet - "Cisco ASR 9922 Router: All RP, FCs, and LCs are front-facing and mounted
    vertically, with ejector levers and captive screws at the top and bottom of each card"
    (Chassis Slots, p17). So every bay places its component unrotated
  card-compatibility: >-
    datasheet - c78-743580's "Chassis compatibility" row names this chassis: "Compatible with the
    Cisco ASR 9006, ASR 9010, ASR 9904, ASR 9906, ASR 9910, ASR 9912, and ASR 9922 chassis". Those
    four flex cards go in all twenty line card bays with the blank. The seven fabric bays take
    cisco/a99-sfc3@1, which Table 23 names as "A99-SFC3 Card (ASR 9922)" - this chassis by name,
    and the 340 W it carries is this chassis's figure rather than the 9912's lower one
  airflow: >-
    datasheet - "Cisco ASR 9922 Router: Front-to-rear cooling path. The inlet is at the front of
    the middle cage, and the exhaust is at the upper and lower rear",
    b-asr9k-overview-reference-guide.pdf p3737. Unique in the family for exhausting at BOTH ends
  air-filter: >-
    datasheet - Table 17, b-asr9k-hardware-installation-guide.pdf p228: "Three air filters located
    on the front of the middle card cage". The guide adds that on this chassis and the 9912 "the
    three air filters (left, center, and right) contain foam media" and can be removed
    individually. Not modelled - no figure dimensions them
  grounding: datasheet - "Top rear right side of the chassis",
    b-asr9k-hardware-installation-guide.pdf p125, illustrated by Figure 136. The same corner as the
    ASR 9006's, and unlike the 9010, 9910 and 9912 which put theirs at the bottom
  environmental: datasheet - Table 14, p131. The 9922 is in the narrower short-term group,
    23 to 122 degF (-5 to 50 degC)
  electrical: datasheet - Table 15 (AC) and Table 16 (DC), pp132-135, ASR 9922 columns only
  weight: >-
    datasheet - Table 13. "Chassis only - 300 pounds (136 kg)" and "Chassis: fully configured using
    all card slots and four power modules - 1038 pounds (470.28 kg)". Note "four power modules"
    against sixteen bays; Cisco's phrasing in this column is not consistent across the family
  no-chassis-power-figure: NOTE - Cisco publishes no chassis-level draw for any ASR 9000; Table 14
    says only to use the Cisco Power Calculator, so the module total here is a floor
  lifecycle: datasheet - searched. No end-of-sale or end-of-life notice for this chassis was found
  compliance: datasheet - data_sheet_c78-501767.pdf series compliance list, transcribed as printed
