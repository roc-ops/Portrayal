  environmental:
    operating-temperature: 41 to 104degF (5 to 40degC)
    operating-temperature-short-term: 23 to 122degF (-5 to 50degC)
    non-operating-temperature: -40 to 158degF (-40 to 70degC)
    humidity-operating: 10 to 85 percent noncondensing
    altitude-operating: 0 to 13,000 ft (0 to 4,000 m)
    acoustic-noise: 78 dB at 80.6degF (27degC) maximum
  power:
    power-modules-v2: Version 2 power system - up to sixteen AC power modules per system, four per tray
    power-modules-v3: Version 3 power system - up to twelve AC power modules per system, three per tray
    power-ac-input-per-module-v2: 3290 VA (3000 W output module)
    power-ac-input-per-module-v3: 6510 VA (6000 W output module)
    power-ac-input-voltage: 200-240 VAC nominal (range 180 to 264 VAC); 220-240 VAC (UK)
    power-ac-redundancy: AC power modules operate in N+N redundancy mode
  thermal:
    cooling-path: front-to-rear; inlet at the front of the middle cage, exhaust at the upper AND lower rear
    fan-trays: four - FT0 and FT1 above the RP/FC cage, FT2 and FT3 below it
    air-filter-location: three filters (left, center, right) on the front of the middle card cage
  platform:
    operating-system: Cisco IOS XR
    interface-path-id: rack/slot/module/port
