configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 20 slot bays are
      EMPTY; fabric, power-modules, rp are populated. Enough to power on and reach the
      box, which is the question most people ask first and the one `default` used to
      answer with whatever the drawing happened to be populated with.
    bays:
      slot-0: cisco/a9k-slot-cover@1
