gaps:
- what: lower-cage-cards-are-inverted
  scope: [slots]
  reason: needs-hardware
  note: >-
    The guide states that "line cards must be installed upside down in slots 10 through 19 of the
    bottom card cage, whereas in slots 0 though 9 of the top card cage, the line cards are
    installed right side up". This is a real property of the chassis and the model cannot currently
    express it. The bays for 10 to 19 are geometrically identical to 0 to 9 and carry no rotation,
    because the card is inverted about its own long axis rather than rotated in the plane of the
    panel - a `rotate: 180` would spin the faceplate end for end, which is a different thing and
    would put the ejectors at the wrong ends. So a card rendered in slot 15 will show its ports and
    its part number the same way up as one in slot 5, and on real hardware it would not. Anyone
    reading port positions off the lower cage should know that.
  wanted: a mirror or flip transform on a bay, distinct from rotation, or a photograph settling
    exactly which way an inverted card reads
- what: rp-positions-have-no-occupant-that-fits
  scope: [front]
  reason: sources-disagree
  note: >-
    RP0 and RP1 are CUTOUTS rather than bays. The candidate component is
    cisco/asr-9922-rp-se/-tr, named for this chassis and carrying Table 23's "RP Card" figure of
    259 W, but it declares a slot envelope of 46.0 mm and this cage's nine positions divide its
    measured 429.04 mm span into 47.67 mm each - which the RP would fit - while the LINE CARD cages
    divide into 43.388 and the rail pitch is 44.06. A 46.0 mm supervisor does not fit a 44 mm slot,
    and the same 46.0 x 428.5 x 628.9 appears on a9k-rsp880-se/-tr, byte for byte, which suggests
    one derivation reused rather than two measurements. Until that width is re-derived from the
    shapesheet these two positions stay openings. The seven fabric positions beside them ARE bays,
    because a99-sfc3's 41.4 fits comfortably.
  wanted: a re-derivation of asr-9922-rp's width from the stencil shapesheet, both axes from one source
- what: fan-tray-openings
  scope: [front]
  reason: sources-disagree
  note: >-
    The four fan trays are cutouts. cisco/asr-9922-fan-v3 declares 475.96 mm wide and this
    chassis's BODY is 447.0, so the component is 29 mm wider than the box it goes in. Compare
    cisco/asr-9910-fan at 445.2, which sits inside its own 447 mm body correctly. Both are class
    cooling and one of them is measured against the rack face rather than the body - the stencil
    records rack-face widths for trays and covers, and 475.96 is within a few millimetres of the
    482.6 mm rack face. The openings here are the measured bands and the component is not placed.
  wanted: asr-9922-fan-v3's width re-derived against the body, or confirmation that the fan tray
    really does span the rack face and needs a negative offset like a mounting ear
- what: blank-faces
  scope: [top, bottom, left, right]
  reason: vendor-silent
  note: >-
    All four side faces are sized from Table 13 and Figure 13 (the 9922's top-down footprint) and
    are deliberately EMPTY. This chassis draws air in at the front of its middle cage and exhausts
    at both ends of the rear, so no side carries a feature the guide names, and its three air
    filters are on the front. The sizes are right, which is what these views carry for a rack
    elevation and the 3D box.
  wanted: a six-face photograph set, or the mechanical drawings behind Figure 13
