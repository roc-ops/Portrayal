description: >-
  24x 10/100/1000 RJ-45 and 2x SFP+ uplink 1RU stackable access switch running LAN Base, without PoE. The front
  carries the mode button and switch lamps at the left, two blocks of twelve jacks in two rows at the right of the
  face, then the USB Type A port, the USB mini-Type B and RJ-45 console ports, the Ethernet management port and the
  two SFP+ slots. The rear carries the FlexStack module slot with its blank cover, the fan exhaust, the RPS connector
  and the AC inlet of the built-in supply. Ports number 1-24 and run DOWN each column - odd on the top row, even
  beneath it. The SFP+ pair follows the copper ports.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, 82 pages (the PDF prints its number and no
      date; Cisco URL https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/hardware/installation/guide_stack/2960SHIG.pdf).
      Pages below are PDF pages with the printed page after them. Table 1-1 (PDF p3-4, printed 1-1 to 1-2) lists the
      model; the appendix's Table 1-3 (PDF p64-65, printed 1-4 to 1-5) gives this model's row; Figure 1-10 "Catalyst
      2960-S Switch Rear Panel with Stacking Module Slot and RPS connector" (PDF p19, printed 1-17) is the rear of the
      stacking models. The guide draws no front of this model: Figure 1-1 "Catalyst 2960S-48FPD-L Front Panel" (PDF
      p4, printed 1-2) and Figure 1-2 "Catalyst 2960S-48TS-L Front Panel" (PDF p5, printed 1-3) are 48-port
      siblings'. Community NetBox (second opinion only, not Cisco's): the WS-C2960S-24TD-L device type. Its front
      elevation is not used: it prints "PoE+ 10G" and a PoE lamp, which Table 1-1 does not give a model without PoE.
      No data sheet, no vendor 3D model, no photograph and no rear elevation of this model is held. The pages were
      read through the PDF's text layer and the converted figures were viewed.
  gate-1-front:
    confidence: estimated
    note: >-
      No held document draws this model's front. Its jacks are the 24-port face of cisco/ws-c2960s-24pd (two blocks of
      twelve at the right of the face, read from that model's own NetBox stencil at 11.345 px per mm) and its
      non-PoE lamps and legend are cisco/ws-c2960s-48td's (seven switch lamps and no PoE lamp, read from that model's
      stencil), so the face joins two readings of siblings and carries nothing PoE. The right-hand cluster (USB, console,
      management, SFP+) is the same on every stencil checked. Every position is `estimated`: it is another model's
      reading, used because this model's own Table 1-1 row names the same parts.
  colour:
    confidence: estimated
    note: >-
      Front: this model's NetBox stencil (cisco-ws-c2960s-24td-l.front.png, 5475 x 503 px) is a PoE front (it prints "PoE+
      10G", a PoE lamp and a POWER over ETHERNET strip that Table 1-1's non-PoE model lacks), so its layout is not read,
      but its colours are the same as the 24PD-L's: the bezel #255e6d (median of 7000 px, box (700,6,1200,20) of a 5475 x
      503 px stencil; the lower edge, box (700,482,1200,497), reads the same), the charcoal panel #404040 (box
      (435,30,480,110)), the Mode button #255e6d (box (330,435,385,460)) and the console surround #bbd5d8 (box
      (4800,70,4850,90)); the WS-C2960S-48FPD-L, -48TD-L, -24PD-L and -24TD-L stencils give the same medians in every box.
      Figure 1-1 (PDF p4, printed 1-2), Cisco's own colour drawing of the 48FPD-L, draws the same scheme (a dark teal
      front edge round a charcoal panel, yellow frames round the jack blocks) and is the guide's own evidence that the
      teal is Cisco's finish. So `chassis.color` is #404040 and the teal edge, the console surround and the yellow frames
      are drawn; every figure is `estimated`. Rear: The rear is drawn in the chassis colour #404040. The only rear in
      colour with the FlexStack slot is the NetBox photograph of the WS-C2960S-48LPD-L (cisco-ws-c2960s-48lpd-l.rear.png,
      1516 x 150 px), whose plain plate reads #3f4447 (median of 2000 px, box (440,15,520,40)) and whose fitted module's
      frame reads #3f565d (box (230,137,330,142)); the NetBox photograph of the WS-C2960S-24TS-L rear (cisco-
      ws-c2960s-24ts-l.rear.png, 1102 x 97 px, a model with no FlexStack slot, read for colour only) reads #404145 (box
      (520,8,590,24)). The drawn #404040 is within 7 levels of 255 of each. Figure 1-10 (PDF p19, printed 1-17) draws the
      rear pale grey (#d4d6d8, box (330,150,430,185) of the converted figure), shaded by the light on each face; the two
      photographs and the figure disagree, so the photographs' charcoal is kept and the gap `faceplate-colour` says so.
  front-plates:
    confidence: estimated
    note: >-
      The ring, channel, silver plate and bar round each block of jacks, the yellow number tags above them and the yellow
      tick band under them, the console and management jack plates, the USB shell, the SFP+ frames with their pull tabs
      and numeral tabs, the Mode button's rim, the arrow fills and the USB symbol are placed as the WS-C2960S-48FPD-L
      stencil gives them (cisco-ws-c2960s-48fpd-l.front.png, 11.345 px per mm, the chassis starting 216 px in), which the
      24TD-L stencil matches in layout and in every colour sampled above. The stencil is a community artist's flat render
      and these are that artist's palette; no photograph from Cisco of the front is held. The yellow outline stays round
      the white ring because the figure is isometric and too small to tell a ring from a frame.
  numbering:
    confidence: drawing
    note: >-
      Ports run left to right from the far left, port 1 above port 2 in each pair (the note under Figure 1-3, PDF p5,
      printed 1-3, which is written for the 48-port models). The guide states the module slot numbers (49 and 50)
      only for the 48-port models; this model's slots are numbered 25 and 26 after the copper ports and the number is
      a gap. Interface names are in the community NetBox device type only: GigabitEthernet1/0/1 to 1/0/24 and
      FastEthernet0 for the management port.
  jacks:
    confidence: estimated
    note: >-
      Row 1 starts 11.72 mm down the face and row 2 at 26.71, 15.0 apart; the first jack at 202.86 mm from the
      chassis side and the blocks 89.4 mm apart (6 x 13.97 plus a 5.58 gutter), as on the 24PD-L. Upper-row jacks
      take the 180-degree rotation the 4948E's upper row takes.
  controls-and-lamps:
    confidence: estimated
    note: >-
      Seven switch lamps (SYST, RPS, MSTR, STAT, DPLX, SPED, STCK) stand in a column at 7.1 mm, pitched 2.53 mm, the
      Mode button below them (Figure 1-7, PDF p13, printed 1-11). The PoE lamp is "only on switch models that support
      PoE", so none is placed. Port lamps are the two small arrows above each column pair; their meaning depends on
      the selected mode (Table 1-9). The arrows by the console jacks are the USB and RJ-45 console lamps (Table 1-10,
      PDF p18, printed 1-16).
  legend:
    confidence: estimated
    note: >-
      The legend "Catalyst 2960-S Series 10G" is the NetBox stencil text of the WS-C2960S-48TD-L, a non-PoE model
      with two SFP+ slots. Figure 1-1 shows only "2960-S" under the console callout. It is carried for this model
      from that stencil, which is community art and not this model's own document.
  console:
    confidence: drawing
    note: >-
      Figure 1-1 callouts 5 and 6 and "Management Ports" (Figure 1-5, PDF p9): the USB mini-Type B console port and
      the RJ-45 console port are one console, and the USB port has priority when both are cabled (Table 1-10). The
      management port is its own (callout 7).
  power:
    confidence: datasheet
    note: >-
      Spec Table 1-3, row Catalyst 2960S-24TD-L: AC input 100 to 240 VAC autoranging, 1 to 0.5 A, 50 to 60 Hz; DC
      input for the RPS 2300 +12 V @3 A (no -52 V line); power consumption 40 W, 136 BTUs per hour (footnote 1: the
      power consumed internally by the switch at 120 VAC, 60 Hz); power rating 0.09 KVA. The switch has no PoE. The
      supply is built in: "The switch is powered through the internal power supply" (AC Power Connector, PDF p22,
      printed 1-20), so it is part of the chassis and not a bay.
  inlet:
    confidence: estimated
    note: >-
      The inlet is an IEC C14 appliance inlet, read from Figures 1-10 and 1-11 and from the serial-number figure for
      this model (Figure 1-2 of the appendix, PDF p56), which draw a three-pin keyed inlet at the right of the rear.
      The guide does not name the connector type; it says "Use the supplied AC power cord" (PWR-CLP=, PDF p42,
      printed 1-18). Position: the figures agree with the PoE rear to within the reading of an isometric drawing, so
      cisco/ws-c2960s-48fpd's position, read from the NetBox 48LPD-L rear photograph, is used.
  rear:
    confidence: estimated
    note: >-
      The rear is the stacking models' common rear (Figure 1-10, with the RPS connector: callouts 1 FlexStack module slot
      and cover, 2 fan exhaust, 3 RPS connector, 4 AC power connector). Positions come from the NetBox 48LPD-L rear
      photograph (3.41 px per mm along its width), a PoE model's rear. It shows a C2960S-STACK module fitted; this device
      shows the blank cover (the module is optional: "FlexStack Ports", PDF p21, printed 1-19) and takes the module as a
      configuration. Spec Table 1-2 lists a DC input for the RPS 2300 for this model, so the RPS connector is present. The
      guide says "If you are not using an RPS with your switch, use the two Phillips pan-head screws to attach the RPS
      connector cover" (Figure 1-15, PDF p39, printed 1-15), so the connector is drawn open, as the photograph shows it.
      It is the part cisco/rps2300-connector@2 (interface `cisco-rps2300`), seated at the plate's place; the rating strip
      stays chassis art. Measured on the photograph at 3.41 px per mm: a metal plate 72.8 x 22.6 mm at (285.0, 21.4) with
      a raised rating strip above it (49.2 x 3.8 mm at 297.7, 17.9), a black shroud 48.2 x 11.3 mm at (298.4, 24.0)
      holding a cream housing 46.9 x 9.7 mm, and in it two rows of eleven cavities on a 4.17 mm pitch, with a screw hole
      at each end of the plate. Eleven across is what the serial-number figures draw (PDF p55-56, printed 1-5 to 1-6);
      Figure 1-10 draws seven in a smaller figure, and the photograph and the larger figures are followed. The warning
      label above the plate ("DC inputs for remote power supply specified in manual", with a triangle) is printed on the
      metal at (294.0, 5.9), 45.2 x 9.7 mm and is drawn as the photograph prints it; the rating strip over the pins and
      the rating plate beside the inlet (32.7 x 13.4 mm at (351.0, 6.1)) are drawn blank, because the figures the
      photograph prints match none of this model's own row of the spec tables (see the gap `rear-label-text`). The inlet
      sits in a moulded black surround 29.3 x 22.5 mm at (387.6, 8.3). The fan exhaust is a honeycomb of hexagons about
      9.7 x 8.5 mm on an 8.8 mm column pitch (21 cells, flat-topped), drawn with the library's `vent` pattern scaled by
      2.0 with `pattern-pitch` to that pitch over a plate in the web's colour (the photograph's web reads #404345, box
      (540,44,705,140), the holes #040507), with the two light cut edges above and below the field (#b9bcba, box
      (533,40,712,46)). Four pan-head screws, 6.8 mm across, stand at 7.3, 111.4, 274.2 and 436.4 mm along and 28.7 mm
      down; the first is on the module's flange and is drawn with the cover. The FlexStack slot is the fitted module's
      stepped frame (see the blank cover's contract). The faint stamped corner marks round the fan and one small drilled
      hole are not drawn.
  airflow:
    confidence: estimated
    note: >-
      The guide names a fan exhaust on the rear panel, counts no fans and gives no direction; no airflow is set and
      no fan redundancy is claimed.
  ears-and-kits:
    confidence: drawing
    note: >-
      Figure 1-12 (PDF p36, printed 1-12) "Attaching Brackets for 19-inch Racks": front-mounting, mid-mounting and
      rear-mounting positions, with number-8 Phillips flat-head screws (48-0655-01); Figure 1-13 (PDF p37, printed
      1-13): number-12 Phillips pan-head screws (48-0523-01) for the rack and a black Phillips machine screw
      (48-0654-01) for the cable guide. The text says four screws attach each bracket's long side to the switch. The
      19-inch brackets are in the box, so they are not a kit. No position is dimensioned, so none carries an `at`.
      The ETSI bracket is printed "700-19781XX" (PDF p34, printed 1-10), with its revision digits unread: it is a
      gap and not a kit.
  lifecycle:
    confidence: estimated
    note: >-
      No lifecycle date is carried. The end-of-sale notices are not held; only titles and list dates would be, and
      this model's is not among them.
