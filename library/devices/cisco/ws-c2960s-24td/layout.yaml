gaps:
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's figures show the lid and one side
    isometrically (bracket screw holes and slots on the side); none can be measured. Each carries an `empty:`
    sentence saying where I looked.
- what: rps-connector-part
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The RPS connector is the part cisco/rps2300-connector@2, drawn open where the photograph puts it. The part draws the
    plate, its two screw holes, the shroud with its dark top edge, the housing and the two rows of eleven cavities with
    a contact in each; it does not draw the chamfered lower corners of the cells or the slot in the screws, which the
    photograph shows at about one pixel. The rating strip stays chassis art. The guide says the cover (two Phillips
    pan-head screws, Figure 1-15) goes on when no RPS is connected.
- what: faceplate-colour
  scope: [rear]
  reason: needs-photo
  wanted: >-
    This model's own rear in colour. The only held rear in colour with the FlexStack slot is the NetBox photograph of
    the WS-C2960S-48LPD-L, whose plain plate reads #3f4447 and whose fitted module's plain frame reads #3f565d; the
    NetBox photograph of the WS-C2960S-24TS-L rear (no FlexStack slot, read for colour only) reads #404145. The drawn
    #404040 is within 7 levels of 255 of each. The guide's own drawing of the rear (Figure 1-10, PDF p19, printed
    1-17) is pale grey (#d4d6d8) and shades one finish by the light on each face, so it conflicts with the
    photographs; the guide gives no housing colour. The rear is drawn charcoal, a stand-in that the owner may accept
    or replace. The front is not in doubt: the teal edge, charcoal panel and white console surround are what the
    four 2960-S stencils agree on, and Figure 1-1 draws the same scheme.
- what: front-text-and-corner-marks
  scope: [front]
  reason: needs-photo
  wanted: >-
    Cisco's logo is never drawn (the region `logo-zone` stays). The corner marks 1X, 11X, 2X, 12X and so on at the
    corners of each block read clearly on the stencil but sit where the jack part's box begins: each mark's inner
    0.6 to 1.0 mm lies under the part, so a mark would be half hidden and is not drawn.
- what: etsi-bracket
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The ETSI mounting bracket, printed "700-19781XX" (PDF p34, printed 1-10). Its revision digits are not read, and
    the guide gives no contents or install steps beyond Figure 1-10, so no kit contract is written.
- what: sfp-slot-numbers
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The numbers of the two SFP+ slots on this 24-port model. The guide says "Module slot numbers are 49 and 50" under
    the 48-port figure only. They are numbered 25 and 26 here, after the copper ports.
- what: flexstack-slot-on-the-td-rear
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A drawing of this model's own rear. Table 1-1 footnote 1 says it supports FlexStack and Figures 1-10 and 1-11 give
    the stacking rear a cover, but its serial-number figure (Figure 1-2 of the appendix, PDF p56, printed 1-6) draws
    no cover. That figure is captioned for models that do not stack too (the 2960S-48TS-S and -24TS-S), so it is not
    read as this model's own. The fan, RPS connector and inlet read within 3 percent of the PoE rear's positions along
    the long edge, which is inside the reading of an isometric figure, so they are placed as on the PoE rear, with
    the slot and its cover.
- what: front-of-the-24td-itself
  scope: [front]
  reason: needs-photo
  wanted: >-
    A flat drawing or photograph of this model's own front. Its only NetBox front shows a PoE legend and lamp that
    Table 1-1 does not give it, so the face is two siblings' readings joined.
- what: mode-button-part
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The Mode button is drawn as plain panel art. No library part is a flush push button of this shape.
- what: rear-label-text
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The rating label text beside the inlet. The guide's drawings show "12-6A" and this model's row of Table 1-3
    reads 1 to 0.5 A, so no text is carried.
- what: port-arrow-fill
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A `common/led-arrow-sm` skin whose off fill is the stencil's solid light grey (#808080: 120 px, box
    (520,96,535,104) of a port arrow and 155 px, box (4660,118,4676,128) of the console arrow; each arrow 2.38 x
    2.12 mm) without the dark fill and the #5b6167 edge. The part is on `main` and its skin is not edited, and a
    lamp's colour in the static drawing is the part's own (a lamp state paints only when a state is set), so each
    lamp keeps its dark triangle; a light grey triangle of the stencil's size is drawn under it, which leaves a
    light rim of about 0.25 mm, and the black disc the punched lamp opening drew is covered in the panel's colour.
    The three lamps by the console and management jacks are arrows too (Figure 1-9, PDF p18, printed 1-16, "Console
    LEDs": 1 USB console LED, 2 RJ-45 console LED; Table 1-10 gives their colours): they were round dots and are
    arrow lamps now, down for the USB console LED, right for the RJ-45 console LED (the up skin turned 90 degrees:
    a lamp, not a connector) and up under the management jack.
- what: rj45-white-body-skin
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A white or silver body for the RJ-45 part. The console jack, the management jack and the 48 jack-block jacks are
    `std/rj45-ganged@2`, whose only skin paints a near-black body with light grey shoulders. The stencil draws the
    console and management jacks on a white plate (#efefef, 10086 px of each, boxes (4782,86,4959,226) and
    (4998,86,5175,226)) round a dark opening, so a plate of that colour and outline (15.6 x 12.34 mm) is drawn under
    each of the two jacks and the part keeps its own body. On the 48 block jacks the stencil draws charcoal bodies
    with white shoulders, where the render has near-black bodies with light grey shoulders; left: the part's skin.
    Request: an `std/rj45` skin with a white body or white shoulders. The latch stays up and the contacts down, as
    the stencil shows them.
- what: usb-a-interior
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A USB-A skin with a silver interior and the tongue at the left, as the stencil shows. `std/usb-a@1` is placed
    with `skin: usb2` and rotated 90 degrees, and draws a black opening (#17191c) with a pale tongue (#d5d9de) to
    the right of the middle of the vertical opening; the stencil draws a silver-grey shell with the tongue at the
    left. Neither skin of the part draws a silver interior (`default` draws a blue tongue, `usb2` a white one, in
    the same place), so the part stays as it is. The only way to bring the tongue to the left with this skin is a
    270 degree turn of the placed part, which is a rotation and is the owner's to decide. Figure 1-1 (PDF p4,
    printed 1-2) is too small at this port to say more. The shell around the part is drawn silver (#7b7b7b).
- what: mini-usb-contact-side
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A mini-B skin with the five contacts in the lower half of the opening. `std/mini-usb@1` draws the flat edge at
    the top, bevelled corners at the bottom and the five contacts (#7a8087) in the upper half; the stencil has the
    same flat edge and bevel and the contacts in the lower half. The stencil is the only source of the contact side:
    Figure 1-5 (USB Mini-Type B Port, PDF p9, printed 1-7) draws a mini-B port with the bevelled corners at the top
    and contacts both on its tongue and in a row below it, which does not settle the side for this connector as it
    is mounted, and Figure 1-1 (PDF p4, printed 1-2) is too small. The part's skin is not edited and the connector is
    not turned: turning it would put the bevel on top, and a rotation after merge is a major version.
- what: sfp-collar-silver
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A version of the SFP+ cage part with the stencil's silver frame (#cfcfcf, 1423 px of each cage), its two clips on
    the right side (#bdbdbd with black edges), its two small squares near the top (#707070), its gold contacts at the
    lower left and its pull tab inside the opening. The part's own skin paints a grey collar (#9aa0a8) round a dark
    opening and its skin is not edited here. Drawn outside or under the part's box: the silver as the surround the
    part leaves visible (about 0.5 mm each side), the black projection at each cage's foot (#000000, 861 px, box
    (4570,427,4652,441)), the silver pull tab (#c1c5cb, 240 px, box (4588,416,4636,421); all but about 0.2 mm of it
    lies under the part's box and is hidden) and the white numeral tab under each cage (#f2f2f2, 2112 px, box
    (4570,450,4652,477)) with its numeral in #595959 (70 px, box (4600,456,4624,474)). Not drawn: the clips, the
    squares and the gold contacts, because they lie inside the cage's own opening and would paint over the part's
    skin. Request: `std/sfp` with the clips, squares, contacts and pull tab in its opening.
- what: mgmt-base-t-legend
  scope: [front]
  reason: needs-photo
  wanted: >-
    The "MGMT" and "BASET" legend right of the management jack. The stencil prints it vertically in yellow
    (#ffff99, 341 px, box (5190,95,5215,212)): the letters M, G, M, T, then a gap, then B, A, S, E, T, one above the
    other and upright, each 0.78 mm tall, 10.3 mm in all (it reads "BASET", with no hyphen, at 6x). A legend 0.78 mm
    tall is under the 1.5 mm font size the library's legend test asks for, so it is not drawn. Wanted: a
    photograph or a dimensioned front that gives the legend at a size that reads.
- what: rear-undrawn-details
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A dimensioned view of this model's rear. The NetBox photograph of the WS-C2960S-48LPD-L (3.41 px per mm) shows
    these things that the render does not, each looked at at 4x: the chassis' own diagonal edge at the far right,
    running from about (422.6, 18) up to (443.7, 1.5) mm with two small steps below it, which is the chassis outline
    and is not drawn over the face; two small oval tabs above and below the AC inlet, about 9 x 3 mm at (386 to 396,
    3 to 6) and (386 to 396, 33 to 36) mm, whose interior (#323637, 110 px, box (1322,12,1344,17)) is 5 levels of 255
    from the plate round it (#373b3e, 200 px, box (1360,12,1400,17)), too faint for an outline to be placed, so they
    are not drawn; faint rectangular outline marks stamped in the rear plate between the module and the fan and
    beside the RPS plate; a small round hole at the left of the fan, near (149.6, 28.7) mm; a small dark notch in the
    RPS plate's left edge, near (285 to 288, 25 to 33) mm; and the AC inlet's three pins, which are light grey blocks
    in the render and dark pockets with a small light mark in the photograph. All are drawn from one model's
    photograph and none from the guide, whose Figure 1-10 (PDF p19, printed 1-17) is too small to show them.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the four port-mode lamps; the one lit says what each port lamp shows (Table 1-7)
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the RJ-45 console port and the 10/100/1000 Ethernet management port at the right of the front: two jobs, one
      purpose, reaching the switch when the data plane cannot
  usb-console:
    term: Port
    role: management
    index-origin: 1
  usb-storage:
    term: Port
    role: management
    index-origin: 1
  power-input:
    term: Inlet
    role: service
    index-origin: 0
  stack-slot:
    term: Slot
    role: service
    index-origin: 1
