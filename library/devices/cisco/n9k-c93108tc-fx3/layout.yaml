configurations:
  ac-500w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-500W-PI supplies and four NXA-SFAN-35CFM-PI fan modules: port-side intake
      airflow, burgundy latches
    default: true
    part-numbers:
      N9K-C93108TC-FX3: {part: N9K-C93108TC-FX3}
  ac-500w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-500W-PE supplies and four NXA-SFAN-35CFM-PE fan modules: port-side exhaust
      airflow, blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C93108TC-FX3: {part: N9K-C93108TC-FX3}
    component-attrs:
