gaps:
- what: kit-contents-table-empty
  scope: [front]
  reason: vendor-silent
  note: >-
    The guide's appendix D, Additional Kits (page 59 to 60, PDF page 65 to 66), has no content.
    The NXK-ACC-KIT-1RU parts are read from the rack-mount procedure (page 20) alone: front
    brackets, rear brackets and slider rails, with countersink screws and no ground lug kit.
  wanted: >-
    The NXK-ACC-KIT-1RU contents table for this switch, as the FX3 and FX3S guides print it. The
    parts carried agree with those guides.
- what: kit-named-without-contents
  scope: [front]
  reason: vendor-silent
  note: >-
    The guide's installation options list "Rack-mount kit (N3K-C3064-ACC-KIT) which you can
    order from Cisco" and say nothing else of it: no contents, no figure, no procedure, no
    depth range.
  wanted: >-
    The kit's contents and its rack depth range, from a document that describes it. It is not
    listed under the kits of this device, because a kit needs parts and a range.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The guide's overview shows one
    side wall in three-quarter view and calls out its mounting-bracket screw holes and a
    grounding pad; none is flat and none can be measured. Each face carries an `empty:`
    sentence.
- what: supply-weights-not-given
  scope: [rear]
  reason: vendor-silent
  note: >-
    The guide's weights table gives 2.42 lb (1.1 kg) against the 500 W AC supply and has no row
    for the 1200 W HVAC/HVDC or the 930 W DC supply. No weight is carried for either.
  wanted: >-
    The weight of the N9K-PUV-1200W and the NXA-PDC-930W, from a document that prints it.
- what: other-supplies-have-no-picture
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A picture of the 930 W DC and the 1200 W HVAC/HVDC supply. The guide's figure shows AC
    supplies only, and its replacement chapter has no picture. Their faces are the AC supply's
    with the inlet changed.
- what: sizes-off-a-figure
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A stated size for the supply and the fan module. The guide gives "Form factor RSP1" for
    every supply and nothing for the fan.
- what: management-sfp-bail
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A cage skin with a bail. The guide's rear figure draws the management SFP port with a
    latch plate across the foot of its opening; the library's SFP cage has one skin and none
    shows a bail, and a second skin on it would move every device that seats it.
- what: fan-redundancy
  scope: [fans]
  reason: vendor-silent
  note: >-
    The Overview says the switch "will power down due to a fan-policy trigger if fewer than 3
    fans are operational" and, in another note, that it "runs with +1 redundancy mode".
  wanted: >-
    Whether the first sentence counts fan modules or rotors. It is read as modules, three of
    four, so the group says 3+1.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block between the fan modules and supply 2: an RJ-45 console port, an
      RJ-45 and an SFP management port and a USB port. Three media, one purpose: reaching the
      switch when the data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        installation guide: "Power supply modules (two-One for operations and one for
        redundancy [1+1])". Slot 1 is on the left and slot 2 on the right.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '3+1'
      redundancy-note: >-
        Installation guide, Overview: four fan modules of two rotors each. The switch "will
        power down due to a fan-policy trigger if fewer than 3 fans are operational". It works
        with one rotor failed in any one module and, with more than one rotor failed, warns and
        powers down in two minutes.
