kind: device
name: n9k-c93108tc-fx3
version: 3.0.0
maturity: modelled
manufacturer: Cisco
model: N9K-C93108TC-FX3
aliases:
- {name: Nexus 93108TC-FX3, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX3}
description: >-
  48x 100M/1G/10GBASE-T and 6x 40/100G QSFP28 1RU data-centre leaf switch running NX-OS. The
  port side carries all fifty-four ports and the BCN, STS and ENV lamps. The other side carries
  two power supplies, four fan modules, the console, an RJ-45 and an SFP management port and the
  USB port. Ports number 1-54 and run DOWN each column, odd on the top row. Ships port-side
  intake (burgundy modules) or port-side exhaust (blue).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco
      N93108TC-FX3 NX-OS Mode Switch Hardware Installation Guide, First Published 2023-12-14,
      Last Modified 2026-07-16, 66 pages: the overview and its figures (art numbers 505474
      and 505475, and a three-quarter view), appendix B specifications, appendix C LEDs, the
      rack-mounting chapter. NO DATA SHEET, PHOTOGRAPH, 3D MODEL OR STENCIL IS HELD for this model, and the
      NetBox devicetype-library is held as a path listing only: it names a device type and a
      front and a rear elevation for this model, and neither file was read. THE GUIDE'S
      FIGURES ARE FLAT LINE ART AND CARRY CALLOUTS: the front is 1254 px across the body at
      this size, 2.85 px per mm, so every position here is a reading good to about a
      millimetre. The 93180YC-FX3 and 93180YC-FX3S guides were read for the supplies and
      kits they share with this one.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's convention: the upper cage upright over the lower turned 180, and the upper
      jack turned 180 over the lower one. The front figure draws the upper jacks with their
      latch notch up and a lamp triangle in each top corner, and the lower jacks with the notch
      down, which is that arrangement. The three QSFP28 pairs follow the same rule.
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its two fold lines, is 1254 px across and 126 px down:
      aspect 9.96 against the guide's 17.3 x 1.72 in, 10.05, so 0.9% out, and it can be
      measured; 2.854 px per mm across from 439.4 mm and 2.883 down from 43.7. The rear figure's
      body is 1248 px across and 126 down, 9.90, 1.5% out, 2.840 px per mm across. A repeated
      feature checks the scale: the jack columns step 40.25 px, 14.10 mm, against the
      registry's 13.97 (0.9% out, the same as the aspect), so every pitch is the registry's
      and the figure fixes where each group starts.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure at 2.854 px per mm, origin the left fold line. Three groups of
      eight jack columns start at 9.3, 130.5 and 251.7 mm, a stride of 121.2: at the registry's
      13.97 mm pitch that is a gutter of 9.4 mm. The figure shows the same gap, 28 px, between
      the groups. The three QSFP28 cages start at 368.3, 390.6 and 412.9 mm: the figure's step is
      63.6 px, 22.3 mm, and its right edge, 433.1, fits 20 mm cages. The 93180YC-EX steps its
      QSFP28 cages 24.4 mm and this figure does not.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top fold line. The upper jacks run 10.4 to 20.6 mm and the
      lower jacks 26.0 to 36.0, and the QSFP28 block 10.7 to 36.3; two jack cells of the
      registry's 11.0 fill 10.4 to 37.0 on a 15.6 row pitch, which is the pitch used for the
      jacks; the 10.15 high QSFP28 cages use 15.4. THE LAMP TRIANGLES AND THE NUMERALS ARE DRAWN
      HIGHER THAN THE FIGURE SHOWS THEM. The figure puts each lamp in a top corner of the
      upper jack, beside its latch slot; the library's jack cell is a plain rectangle, and a
      lamp placed over it is an overlap error (L13, L39). So the lamps sit in a row just above
      the cells, 2.5 mm higher than the figure's, and the numerals and arrows above them move up
      by the same amount. Their x is the figure's.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table: "17.3 inches (43.9 cm)" wide, "17.9 inches (45.7
      cm)" deep and "1.72 inches (4.4 cm) (1 RU)" high; the weights table gives the chassis
      "15.8 lb (7.1 kg)". 439.4 mm, 454.7 mm and 43.7 mm are carried, the inch figures
      converted. The metric weight is carried as printed; 15.8 lb is 7.17 kg.
  port-order:
    confidence: estimated
    note: >-
      The figure prints a pair of numerals over each column, "1 up down 2" to "47 up down 48",
      and "49 up down 50", "51 ..." and "53 ..." over the QSFP28 pairs, so the odd port is the
      upper cage or jack. The guide's text gives the ports as 1-48 and 49-54. Port numbers are
      as printed; the NX-OS interface names are in the interface-names entry.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down to
      the nearest port." Green is admin up, module present and link up; amber is admin down or
      module absent; off is up and present but no link. The figure draws an up triangle at the
      left and a down triangle at the right of each column's upper jack, and one at each end of
      each QSFP28 band with four small windows between them. The windows are drawn as marks and
      carry no state; the guide does not name them.
  chassis-lamps:
    confidence: estimated
    note: >-
      Callout 3 is "BCN, STS, ENV LEDs"; appendix C says they sit "on the left side of the front".
      The figure draws three lamps in a row under the first jacks, each with its legend to its
      left, at 20.2, 29.5 and 39.3 mm across and 39.4 mm down. The vertical is measured from
      the figure's top and bottom edges, 127 px for 43.7 mm, 2.9 px per mm. The lamps are flat
      rectangles, about twice as wide as high, so they are common/led-rect-sm@1 (2.8 x 1.6), the
      part the rear's lamps use, centred on those points, and not the square lamp; the lamp rows and
      the legend sit 4.3 mm above the bottom edge. The legend after them reads CISCO NEXUS
      N9K-C93108TC-FX3, from 41.8 mm; the library's practice for a Cisco face is that text,
      as on the 93180YC-EX, and no logo artwork. The figure's mark at the top left is not
      drawn. Under the jacks the figure draws two rows of small cells: an upper row from 75.2
      mm to the right end, beside the legend, and a lower row that runs the whole width from
      18.3 to 421.5 mm.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the power-supply side is read off the rear figure (2.840 px per mm
      across, 2.883 down). Supply 1, four fan modules, then the console jack over the RJ-45
      management jack, the SFP management port, the USB port stood on end, and supply 2. THE
      OUT-OF-BAND BLOCK SITS BETWEEN THE FANS AND SUPPLY 2, not beyond supply 2 as on the
      93180YC-EX. Two lamps with a screw between them stand under the jacks, with the legends
      BCN and STS, which the figure prints. The fan handles were redrawn from a 5x enlargement
      of fan 1 (grey pads, a squeeze bar at each side of the hub, grip marks on the left). The
      figure draws the management SFP cage with a latch plate across the foot of its opening;
      the library's std/sfp@1 has one skin and no cage with a bail, so the cage is the plain
      one. A bail skin on std/sfp@1 would rehash 121 devices.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements: typical 420 W and maximum 464 W "(AC or DC)",
      1583 BTU per hour. The figures are the switch's draw and not a supply rating; the guide
      names no configuration or ambient.
  interface-names:
    confidence: estimated
    note: >-
      mgmt0 is stated: the guide's setup chapter asks for "the Management (Mgmt0) interface".
      Ethernet1/1 to Ethernet1/54 are NOT IN THE GUIDE (searched for "Ethernet1/": none) and
      the NetBox device-type file, which names them, is not held, only its path. They are the
      slot/port form NX-OS uses on the fixed Nexus 9300 and are not written into the device:
      the faceplate prints 1 to 54.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the
      value the 93180YC-EX's stencil sample gave, carried across as a family colour; it is a
      relative's figure and not a reading of this device.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's NXK-ACC-KIT-1RU procedure draws the front bracket screwed to the chassis side
      in a figure shared with the 93180YC-FX3 guide, and says the holes used depend on the rack
      and on the clearance needed for interface cables, 3 inches minimum, and for module
      handles, 1 inch minimum. The NXK-ACC-KIT2-2RU procedure says the chassis slides onto the
      rails "until the front panel is flush with the front of the rack". No figure dimensions
      a position and none says which the box ships with, so the two positions are written
      without an `at`, named for what the text says they clear, and none is the default.
