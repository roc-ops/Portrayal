configurations:
  c9300-48t:
    kind: orderable
    description: >-
      The switch as shipped: one PWR-C1-350WAC-P in the first power supply slot with the slot cover in
      the second, three FAN-T2 fan modules and the network module bay blank. Table 18 gives the 350 W
      Platinum supply as the default of the C9300-48T and the Power Supply Modules text says every switch
      ships with a blank in the second slot.
    default: true
    part-numbers:
      C9300-48T: {}
  dual-350wac-p:
    kind: example
    description: Two PWR-C1-350WAC-P supplies, as a switch with its second supply ordered.
    bays: {psu-2: cisco/pwr-c1-350wac-p@1}
  psu-350wac:
    kind: example
    description: A PWR-C1-350WAC in the first slot.
    bays: {psu-1: cisco/pwr-c1-350wac@1}
  psu-715wac:
    kind: example
    description: A PWR-C1-715WAC in the first slot.
    bays: {psu-1: cisco/pwr-c1-715wac@1}
  psu-715wac-p:
    kind: example
    description: A PWR-C1-715WAC-P in the first slot.
    bays: {psu-1: cisco/pwr-c1-715wac-p@1}
  psu-1100wac:
    kind: example
    description: A PWR-C1-1100WAC in the first slot.
    bays: {psu-1: cisco/pwr-c1-1100wac@1}
  psu-1100wac-p:
    kind: example
    description: A PWR-C1-1100WAC-P in the first slot.
    bays: {psu-1: cisco/pwr-c1-1100wac-p@1}
  psu-1900wac-p:
    kind: example
    description: A PWR-C1-1900WAC-P in the first slot.
    bays: {psu-1: cisco/pwr-c1-1900wac-p@1}
  psu-1900whv-t:
    kind: example
    description: A PWR-C1-1900WHV-T in the first slot.
    bays: {psu-1: cisco/pwr-c1-1900whv-t@1}
  psu-715wdc:
    kind: example
    description: A PWR-C1-715WDC in the first slot, a DC-powered switch.
    power: dc
    bays: {psu-1: cisco/pwr-c1-715wdc@1}
  empty-supply-bay:
    kind: example
    description: The second power supply slot left empty, which the guide says not to do.
    bays: {psu-2: ''}
