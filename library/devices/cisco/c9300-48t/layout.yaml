configurations:
  c9300-48t:
    kind: orderable
    description: >-
      The switch as shipped: one PWR-C1-350WAC-P in the first power supply slot with the slot cover
      in the second, three FAN-T2 fan modules and the network module bay blank. Table 18 gives the
      350 W Platinum supply as the default of the C9300-48T and the Power Supply Modules text says
      every switch ships with a blank in the second slot.
    default: true
    part-numbers:
      C9300-48T: {}
  dual-350wac-p:
    kind: example
    description: Two PWR-C1-350WAC-P supplies, as a switch with its second supply ordered.
    bays: {psu-2: 'cisco/pwr-c1-350wac-p@1'}
