format: 1
kind: device
name: c9300-48t
version: 1.1.0
maturity: modelled
manufacturer: Cisco
model: C9300-48T
aliases:
- {name: Catalyst 9300-48T, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 9300, series: Catalyst 9300}
description: >-
  48x 10/100/1000 RJ-45 1RU stackable access switch running Cisco IOS XE, the non-PoE C9300-48T
  of the Catalyst 9300 family and the sibling of the PoE+ C9300-48P, which has the same metal.
  The 48 ports, the mode button, the status lamps, the USB mini-Type B console port, the USB Type
  A storage port and the beacon button are on the front, with a bay for an uplink network module
  at the right, shipped with a blank in it. The rear holds three fan modules, two StackWise-480
  stacking ports, two StackPower connectors, two power supply bays, the RJ-45 console and
  management ports, a USB 3.0 SSD slot and the ground connectors. The default supply is the 350 W
  AC Platinum PWR-C1-350WAC-P in one bay with the power supply slot cover in the other. The -A and
  -E suffixes of the part number are software licences and not hardware, so there is one device.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Cisco Catalyst 9300 Series Switches Hardware Installation Guide, first published 2017-06-20,
      last modified 2026-05-15, https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig.pdf
      (sha256 c1db6738...441b). Table 42 (dimensions), Table 43 (weight), Table 18 (default
      supply), Table 35 (the supplies), Figures 1, 8 and 10, the Fan Module section and Table 48.
      The community NetBox devicetype-library elevations of the C9300-48T (front and rear) are a
      second opinion and the only flat drawings held, not Cisco's. No data sheet, photograph, 3D
      model or stencil is held for the Catalyst 9300. The faces are the C9300-48P's
      (cisco/c9300-48p) less the PoE lamp, and their provenance applies here.
  the-licence-suffix:
    confidence: datasheet
    note: >-
      C9300-48T-A (Network Advantage) and C9300-48T-E (Network Essentials) differ in software
      licence only; the guide lists the hardware as C9300-48T throughout. One device, and the
      suffixed ordering codes are not part numbers of a configuration.
  the-rear-figure:
    confidence: drawing
    note: >-
      THE TASK'S "C9300 REAR PANEL ON PDF PAGE 41" IS FIGURE 14, THE CATALYST 9300X. The C9300
      rear is Figure 10 (PDF page 39), isometric, and the guide holds no flat drawing of it. The
      rear is read off the NetBox elevation of THIS model, the C9300-48T, whose order from the left
      agrees with Figure 10's callouts.
  the-envelope:
    confidence: datasheet
    note: >-
      Table 42: 1.73 x 17.5 x 19.2 in (4.4 x 44.5 x 48.8 cm), the C9300-48P's row to the digit.
      Width 444.5 and depth 487.7 are the inch figures in millimetres; HEIGHT 44.45, THE RACK UNIT,
      NOT THE PRINTED 1.73 IN (43.9 mm), which both rows print for every 1RU model and which is
      nominal. Table 43 weighs it 16.43 lb (7.45 kg), 0.14 kg under the C9300-48P.
  rack-positions:
    confidence: drawing
    note: >-
      Figures 32 to 35 of the guide: front-mounting (the first, taken as the shipped default),
      mid-mounting, rear-mounting and four-point mounting. No setback is printed and none is written.
  front-scale:
    confidence: estimated
    note: >-
      Every front position is read off the NetBox C9300-48P front elevation at 4.743 px per mm, as
      cisco/c9300-48p reads it; NetBox's 48T front is the same drawing and carries the 48P's
      "Catalyst 9300 48 PoE+" label, which is not a 48T label and is not drawn here. The 48T's
      name plate is left blank, since no source gives the text the metal carries.
  ports:
    confidence: estimated
    note: >-
      Forty-eight 10/100/1000 jacks in the 48P's blocks: 24 columns in four blocks of six at a
      14.19 mm column step and a 14.0 mm row step, numbered down each column, with the NetBox
      numbering 01X to 12X, 13X to 24X, 25X to 36X and 37X to 48X under the blocks. The lamps sit
      under their columns, as the 48P's do. Interface names are not on the metal and are left out.
  left-cluster:
    confidence: estimated
    note: >-
      As the 48P, without the PoE lamp: the guide's Figure 8 is shared by the whole family and
      names a PoE lamp, but a switch with no PoE budget is not assumed to carry one. Status,
      Duplex, Speed and Stack above and System, Active, XPS and S-PWR below, the Console lamp
      beside the mini-USB port, and the Mode and beacon buttons.
  network-module-bay:
    confidence: estimated
    note: >-
      Figure 1 callout 6, read off the NetBox elevation as on the 48P, with the blank
      C9300-NM-BLANK as the default. The network modules are not modelled and are left for the next
      9300 batch.
  rear-scale:
    confidence: estimated
    note: >-
      The NetBox C9300-48T rear at 5.031 px per mm, as cisco/c9300-48p reads it. It labels its
      supplies PWR-C1-1100WAC; the faces here are the default PWR-C1-350WAC-P and the slot cover.
  colour:
    confidence: estimated
    note: >-
      #cccccc, as cisco/c9300-48p.
  airflow:
    confidence: datasheet
    note: >-
      The Fan Module section: front-to-rear and side-to-rear, for every build.
attrs:
  physical:
    weight-note: '16.43 lb (7.45 kg) with the fan modules and the default power supplies installed (Table 43)'
  power:
    power-supply-options: 'PWR-C1-350WAC, PWR-C1-350WAC-P, PWR-C1-715WAC, PWR-C1-715WAC-P, PWR-C1-1100WAC, PWR-C1-1100WAC-P, PWR-C1-1900WAC-P, PWR-C1-1900WHV-T, PWR-C1-715WDC (Tables 18 and 35)'
  environmental:
    operating-temp: '-5 to 45 C (23 to 113 F), Table 37'
    storage-temp: '-40 to 70 C (-40 to 158 F), Table 37'
    humidity: '5 to 90 percent, noncondensing'
    altitude: 'operating up to 3000 m (10,000 ft); storage up to 4500 m (15,000 ft)'
  features:
    stacking: 'StackWise-480 data stacking, up to nine switches, and StackPower, up to four switches'
    uplink-modules: 'one network module slot; C9300-NM-2Q, -4G, -4M, -2Y, -8X and the 3850 uplink modules (Table 5); a blank when none is fitted'
  management:
    console: 'USB mini-Type B on the front and RJ-45 on the rear; the USB console takes precedence'
    oob: 'RJ-45 10/100/1000 management port on the rear'
    usb: 'USB Type A storage port on the front; USB 3.0 SSD slot on the rear'
  lifecycle: {eol: none-announced}
chassis:
  width: 444.5
  height: 44.45
  depth: 487.7
  ru: 1
  weight-kg: 7.45
  color: '#cccccc'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mounting, default: true}
    - {name: mid, label: mid-mounting}
    - {name: rear, label: rear-mounting}
gaps:
- what: rack-kit
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The rack depth the bracket kits span. The guide's Figure 29 and its table name ACC-KIT-T1=,
    4PT-KIT-T2= and RACK-KIT-T1= and print no range of rack depth, no setback and no part
    dimension; a kind: kit contract needs a depth or a factory preset, so no kit is written and
    chassis.kits is left out.
- what: front-usb-generation
  scope: [front]
  reason: vendor-silent
  wanted: >-
    Whether the front USB Type A storage port is USB 2.0 or 3.0. The guide says only "USB Type A
    storage port".
- what: name-plate
  scope: [front]
  reason: needs-photo
  wanted: >-
    The text the C9300-48T's name plate carries. The only front drawing held is the 48P's.
- what: network-modules
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The faces of C9300-NM-2Q, C9300-NM-4G, C9300-NM-4M, C9300-NM-2Y and C9300-NM-8X. Left for the
    next 9300 batch.
- what: lamp-pictograms
  scope: [front]
  reason: needs-photo
  wanted: >-
    The pictograms under the status lamps. The guide's Figure 8 names them and the NetBox
    elevation draws them at a few pixels each; no legend is drawn.
- what: sides-top-bottom
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the sides; the guide shows them isometrically.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  nm-bay:
    term: Slot
    role: traffic
    index-origin: 1
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mode-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  controls:
    term: Button
    role: management
    index-origin: 1
    mixed: >-
      the beacon (UID) button and the Mode button at the left of the front: two buttons that
      identify the switch and step its lamps, both used from the front panel.
  usb-console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: mini-usb-b}
  usb-storage:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the rear RJ-45 console port beside the rear 10/100/1000 RJ-45 management port: two jobs, one
      purpose, reaching the switch when the data plane cannot.
  stackwise:
    term: Port
    role: fabric
    index-origin: 1
    attrs: {media: stackwise-480}
  stackpower:
    term: Port
    role: service
    index-origin: 1
    attrs: {media: stackpower}
  grounding: {term: Stud, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        The guide: "The switch has two internal power supply module slots. You can use two AC
        modules or one power supply module and a blank module."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        Three fan modules, and the Fan Module section of the guide says the switch can operate with
        two operational fans while the failed one is replaced.
