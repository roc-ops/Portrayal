format: 1
kind: device
name: asr-9903
version: 1.0.3
maturity: modelled
manufacturer: Cisco
model: ASR 9903
portfolio:
  line: Service Provider
  family: Aggregation Services Router
  series: ASR 9000 Series
description: >-
  Cisco ASR 9000 Series ASR 9903 Router - a 3 RU fixed-port aggregation services
  router delivering up to 3.6 Tbps. Everything a user touches is on the front:
  two route processors across the top, the integrated fixed board in the middle
  with sixteen 100GE QSFP28 ports and twenty 10GE SFP+ ports, and one bay below
  it for an optional Port Expansion Card. The rear carries four 1.6 kW power
  modules in a row and four fan trays below them, with the NEBS grounding lug on
  a fixed panel between the middle pair. Airflow is front to back.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 8 QSFP pairs (port-0/port-1 to
      port-14/port-15), the 10 SFP pairs (port-16/port-17 to port-34/port-35).
  sources:
    confidence: datasheet
    note: >-
      the Cisco ASR 9903 Compact High-Performance Router Data Sheet (c78-744035,
      2021); the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation
      Guide (b-asr9001-hardware-installation-guide.pdf, last modified 2021-07-30,
      which despite its filename covers the 9001, 9901, 9902 and 9903); the
      Interface and Hardware Component Configuration Guide, IOS XR 24.x; and
      Cisco's own Visio stencil Routers-Cisco_ASR_9000, masters "ASR-9903 Front"
      and "ASR-9903 Rear". THE STENCIL IS THE GEOMETRY AND THE GUIDE IS THE
      IDENTITY of everything on the two faces; where they were compared, they
      agree.
  face-check:
    confidence: drawing
    note: >-
      done BEFORE measuring, because Cisco's master filenames name the wrong
      faces on the ASR 9910 and nothing downstream would have caught it. No swap
      here. "ASR-9903 Front" carries the two A99-RP-F cards, the fixed board's
      thirty-six ports numbered 0 to 35, the CISCO and ASR 9903 branding and the
      A9903-20HG-PEC in the lower bay, and matches Figure 3 of the install guide,
      "Front Panel of the Cisco ASR 9903 Router". "ASR-9903 Rear" carries the
      four power modules, the four FAN-ASR9903-V01 trays and the grounding panel,
      and matches Figure 4, "Rear Panel of the Cisco ASR 9903 Router".
  chassis:
    confidence: datasheet
    note: >-
      datasheet - Table 2 of c78-744035, "Physical dimensions (includes ejector
      bracket/lever); (H x W x D); weight": ASR 9903 chassis with 2 RPs, 4 PSUs
      and 4 FANs, 5.18 x 17.475 x 30 in. and 81.62 lb, or 131.57 x 443.86 x 762
      mm and 37 kg, with the note underneath: "Excluding ejector, the depth is
      23.62 in/600 mm".
      DEPTH IS THE 600, NOT THE 762, and the difference is not an ejector in the
      ordinary sense - 162 mm is far too much for one. The data sheet's own
      overview paragraph settles which figure describes the box: "The compact
      size (depth is 600 mm), front-to-back airflow ... make this platform very
      efficient". So 600 mm is the chassis and 762 is the chassis plus whatever
      Cisco measures in front of and behind it; `chassis.depth` carries the
      former and the 762 is recorded in attrs.physical beside it rather than
      discarded.
      WIDTH IS THE BODY. 443.86 mm is 17.475 in, which is not the 19 in rack
      face, so this figure is already between the ear folds and L43 has nothing
      to catch. HEIGHT IS THE CHASSIS AS BUILT, NOT THE RACK ALLOCATION: 131.57
      mm against 3 RU's 133.35, built 1.78 mm under its allocation for clearance,
      the same shortfall the ASR 9904, 9906 and 9910 show. The install guide's
      own sentence agrees to a tenth - "Cisco ASR 9903 Router is 5.25 inches
      (13.34 cm)" is the ALLOCATION quoted as the height, which is exactly the
      rounding trap to expect here, so the data sheet's 5.18 in is carried and
      the RU is carried separately rather than reconciled.
  stencil-calibration:
    confidence: drawing
    note: >-
      THE TWO AXES AGREE TO 0.32 PERCENT, which is this stencil's trustworthy
      band - better than the ASR 9001's 0.66 and short of the ASR 9904's 0.06.
      The ink bounding box of both masters is the 19.0 in rack face flange-tip to
      flange-tip and the shape box in index.json reads exactly 1.9 x 0.525 in at
      1:10, i.e. 482.60 x 133.35 mm, which is 19 in by 3 RU. Calibrating x on
      482.60 over 1709.10 art units gives 0.282374 mm/unit and y on 133.35 over
      473.75 units gives 0.281477 - 0.32 percent apart, so the drawing is uniform
      and the box is the rack face rather than the body.
      THE MODEL IS THEN ANCHORED ON THE BODY, not on the rack face, because the
      body is what the views are. The chassis metal inside the flanges spans
      1569.68 units across and 469.25 down; setting those to the data sheet's
      443.86 x 131.57 gives 0.282773 and 0.280384 mm/unit, which reproduces the
      rack-face calibration to 0.15 percent across and 0.39 percent down. Both
      calibrations are recorded because either can be re-derived from the other;
      the numbers in this file are the second.
      CONFIRMED ON SOMETHING NEVER USED AS AN INPUT, which is the check the ASR
      9006's power shelf earned: the Port Expansion Card plate measures 3.26 mm
      from the body's left edge and 3.42 mm from its right. Nothing in the
      calibration forced that symmetry, and it holds to 0.16 mm.
  rp-slots:
    confidence: drawing
    note: >-
      READ THIS BEFORE CHANGING THE RP BAY WIDTH. The two RP slots are on a
      211.44 mm pitch and the bays carry that figure, while the module they
      accept, cisco/a99-rp-f@1, declares 221.84 mm. L33 reports the 10.40 mm
      difference and it is not a mistake in either number.
      THE PITCH IS MEASURED THREE WAYS AND ALL THREE AGREE. On the front master
      every feature of RP1 sits exactly 211.43 to 211.44 mm left of the matching
      feature on RP2 - the yellow A99-RP-F band at 16.38 against 227.81, the
      SYNC0 legend at 63.84 against 275.28, MGT LAN 0 at 129.43 against 340.87,
      and eighteen more. On the install guide's Figure 3 render, calibrated at
      2.698 px/mm off the PEC plate's known 436.58 mm width, the two RPs' SYNC0
      jack bezels sit 571 px apart, which is 211.7 mm. And the arithmetic closes
      across the face: 4.45 mm of left margin, two slots of 211.44, and a 16.5 mm
      furniture strip at the right carrying the grounding stud sums to 443.83
      against a 443.86 body.
      WHAT THE 221.84 IS. The a99-rp-f master's art includes a retention bracket
      at each end, each about 11 mm wide with one captive screw, and its Visio
      shape box measures the lot. In the chassis those brackets INTERLEAVE - the
      screw on RP1's right bracket sits low and the screw on RP2's left bracket
      sits high, which is why the seam in the artwork shows two screws stacked in
      one bracket's width - so two cards on a 211.44 pitch is physically what the
      drawing shows, and the two plates overlap by 10.4 mm in the master because
      the artist pasted each card at its own full extent.
      SO THE BAY STAYS AT THE PITCH. docs/bay-and-component-size.md: "A bay may
      be larger than the cage opening (ejectors) but must NEVER be larger than
      the slot pitch", because widening past it makes adjacent bays overlap,
      which is what L13 reports. Two bays of 221.84 on a 211.44 pitch is exactly
      that. The component's figure is left alone rather than reconciled, per the
      same note's rule, and cisco/a99-rp-f@1's own size provenance should be
      re-read against this measurement - roc-ops/Portrayal#262 is where that
      belongs, not here.
  fixed-board:
    confidence: drawing
    note: >-
      THE FIXED BOARD IS NOT A BAY. The install guide's overview is explicit:
      the Fixed Board, also called a Line Card (LC0), carries sixteen 100GE
      QSFP28 ports and twenty 10GE SFP+ ports, is integrated with the chassis,
      and gives up to 1.6 Tbps of throughput. So its thirty-six ports are
      placements on the chassis face, not a module's own,
      and there is nothing to seat or remove.
      THE NUMBERING IS THE GUIDE'S, NOT AN INFERENCE. Figure 120, "Cisco ASR
      9903 Fixed Ports", labels callout 1 "QSFP28 ports (0-15)" and callout 2
      "SFP+ ports (16-35)", and the master prints all thirty-six numerals under
      the cages - 0 and 1 under the first QSFP28 cage, 34 and 35 under the last
      SFP+ column - so the two readings confirm each other digit for digit.
      WITHIN A COLUMN, THE TRIANGLE SAYS WHICH IS WHICH. Each numeral has a
      small solid triangle beside it: a down-pointing one for the upper port and
      an up-pointing one for the lower, which is Cisco's usual marking on a
      stacked cage. Even numbers take the down triangle throughout, so the
      upper row is 0, 2, 4 ... 34 and the lower is 1, 3, 5 ... 35.
      THE APERTURES ARE THE STANDARD ONES. The master draws the QSFP28 bores at
      19.02 x 8.92 mm against std/qsfp-ganged's 18.5 x 9.58, on a 29.17 mm
      column pitch and a 16.68 mm row pitch; the SFP+ bores are the module
      mouths rather than the cage openings, so those ports are positioned on
      their measured 14.36 mm column pitch and 10.71 mm row pitch, which sit
      within 0.8 and 3.0 percent of std/sfp-ganged's own 14.25 and 10.40.
      Placements are centred on the drawn bores in both cases.
  rp-lamp-count:
    confidence: drawing
    note: >-
      A DISCREPANCY WORTH KNOWING ABOUT BEFORE SOMEBODY RE-COUNTS. Callout 1 of
      Figure 11 reads "10MHz and 1PPS ports / Eight discrete LED indicators",
      and the route processor's faceplate prints NINE legends: ACTIVE, FAIL,
      BOOT, SYNC and CRIT on one line, PWR, SSD, GPS and MAJ/MIN below. The ninth
      is almost certainly MAJ/MIN being counted as one lamp serving two alarm
      levels or being read as a legend rather than a lamp; nothing in the guide
      says which. The lamps belong to cisco/a99-rp-f@1 and this model does not
      restate them - the note is here because this file cites Figure 11 for the
      RP's ports, and a reader following that citation should know the same
      callout under-counts by one.
  port-lamps:
    confidence: drawing
    note: >-
      drawing for the count and the positions, install guide for the states.
      THIRTY-SIX LAMPS FOR THIRTY-SIX PORTS, one each, all on one baseline at y
      84.48 and all cut to 2.80 x 1.60 mm - the master draws them as a single
      rounded rectangle beside each port's direction triangle. The rule reaches
      the end of the face: the last SFP+ port, 35, has its lamp at 426.74 like
      every other, and no port on this board is without one.
      THE STATES ARE TABLE 27 of the install guide, "Port Status and LC FAIL
      LEDs", transcribed: Port Status LEDs, one per port: green = port up with a
      valid physical-layer link; blinking = line activity, the LED going
      green-amber-green; red = port up but link lost, or an SFP/QSFP failure; off
      = port administratively shut down. The blinking state is carried as a green
      lamp with an amber second colour, which is what "green-amber-green"
      describes.
  port-modes:
    confidence: drawing
    note: >-
      READ WHAT THE COLOURED CHIPS ARE. The master prints a dark red chip under
      port 10 and a cyan chip under port 14, a cyan band under ports 16 to 25 and
      a dark red band under 26 to 35, and a rate legend over each: "100G/-" over
      port 14's chip, "-/10G" over each SFP+ band.
      THE PAIRING IS THE DRAWING'S OWN DEVICE and the counts close. Table 2 of
      the data sheet gives the board three combinations - "16x100GE, 15x100GE +
      10x10GE or 14x100GE + 20x10GE" - so each ten-port SFP+ block costs exactly
      one QSFP28 port, and the drawing says which two by colouring them to match:
      cyan port 14 against the cyan block 16-25, dark red port 10 against the
      dark red block 26-35. The legends read the same way, one slash-separated
      pair per mode.
      WHAT IS NOT SOURCED IS THE MAPPING IN WORDS. No sentence in the intake
      names ports 10 and 14 as the two that give way; the reading is the colour
      pairing plus the arithmetic, and it is recorded here rather than asserted
      in the configurations, which carry only what the data sheet states.
  power:
    confidence: datasheet
    note: >-
      datasheet - Table 2 of c78-744035: "1.6 kW DC power module (up to 4
      modules), redundancy: 2+2" and "1.6 kW AC power module (up to 4 modules),
      redundancy: AC high line (200-240V): 2+2; AC low line (90-130V): 3+1",
      with "Mixing of AC and DC modules is not supported".
      THE CHASSIS CARRIES NO ENVELOPE FIGURE AND THIS FILE INVENTS NONE. Neither
      the data sheet nor the install guide states a typical or maximum chassis
      draw for the ASR 9903; the closest thing in the intake is a `show
      environment` example in the troubleshooting chapter taken on an ASR 9902,
      which is a different chassis with two supplies and three fans. So there is
      no power-max-w here, the module contracts carry their own figures, and the
      L29 census counts what is missing rather than a number somebody guessed.
  cooling:
    confidence: datasheet
    note: >-
      datasheet - the ASR 9903 is a compact router with two redundant Route
      Processors (RP), two integrated switch fabrics, 4 AC or DC power supply
      modules and 4 fans in a redundant configuration, and
      Table 2's Redundancy row lists "Fan redundancy" with no ratio. Airflow is
      "Front to back" in the same table, and the install guide adds the filter:
      the ASR 9903 and ASR 9902 each have a serviceable air filter (Cisco PID
      ASR-9903-FILTER and ASR-9902-FILTER), a single component that takes the
      dust out of the room air the fan trays pull into the chassis.
      THE REDUNDANCY RATIO IS NOT PUBLISHED AND IS NOT SUPPLIED. Cisco names the
      property and not the arithmetic, so the `fan-trays` group carries a
      `redundancy-note` and NO `redundancy`, and L69 warns that this chassis does
      not say how many fans it can lose. That warning is the record. Four trays
      described as redundant is 3+1 or 2+2, the difference is the whole question
      a reader would be asking, and writing either would make a guess comparable
      with the ASR 9006's stated form. It is the ruling edgecore/csr310 already
      carries for "Hot swappable redundant fan modules", applied to a vendor who
      said more and still not enough.
  grounding:
    confidence: drawing
    note: >-
      install guide for what it is, master for where. "Cisco ASR 9902 and Cisco
      ASR 9903 Router - One grounding lug, which has two M5 bolt holes", and
      Figure 75, "NEBS Bonding and Grounding Points on the Cisco ASR 9903
      Router", circles that lug on the fixed panel between the middle pair of fan
      trays. The rear master draws the two holes 15.77 mm apart on centres, which
      cisco/a9k-ground-pad@1's 15.3 mm two-hole lug covers to within half a
      millimetre; the pad is placed rotate: 90 because this chassis mounts the
      lug upright where the modular chassis mount it flat.
      A SECOND EARTH MARK IS ON THE FRONT and is drawn rather than documented.
      The front master prints a hex nut and an IEC 60417-5019 earth symbol on the
      furniture strip at the right of the RP row, and the install guide's
      grounding chapter describes only the rear lug. The symbol is placed where
      the drawing puts it and the stud beside it is panel decor; neither is
      claimed to be a second NEBS bonding point.
  air-filter:
    confidence: datasheet
    note: >-
      NOT DRAWN, deliberately. ASR-9903-FILTER mounts on the FRONT of the
      chassis, in front of every face this model draws - Figure 177, "Install Air
      Filter-Cisco ASR 9903", shows it sliding onto the front mounting brackets
      as a full-face frame. Drawing it would hide the whole front view, and it is
      an option rather than part of the chassis. ASR-9903-CAB-MGMT is left out
      for the reason the modelling guide gives for cable management generally: it
      is not a panel fact.
  unmodelled-front-furniture:
    confidence: drawing
    note: >-
      TWO SMALL ROUND FEATURES ON THE FRONT RIGHT STRIP ARE NOT MODELLED AND ARE
      NOT GUESSED AT. Above the grounding stud the master draws a plain dimple
      and, below it, a dark slot; the same two appear on the install guide's
      Figure 3 render at 2.7 px/mm, where the upper reads as a blind dimple and
      the lower as a through-hole. Nothing in the guide names either. They could
      be an ESD strap jack and a captive-screw well, and calling them so would be
      a guess with a citation, so they are left off the face and recorded in a
      gap instead.
attrs:
  physical:
    rack-face-width-mm: '482.6'
    rack-aperture-min-mm: '450.85'
    depth-over-ejectors-mm: '762'
    rack-mounting: 19-in. four-post
  performance:
    capacity: 3.6 Tbps nonblocking full-duplex
    fixed-board-capacity: 1.6 Tbps
    integrated-interfaces: 16 x 100GE QSFP28, 20 x 10GE SFP+
    port-expansion-cards: A9903-20HG-PEC (2T), A9903-8HG-PEC (800G)
    port-rates: 10, 25, 40, 100, 200 and 400 Gigabit Ethernet
    fixed-board-combinations: 16x100GE; 15x100GE + 10x10GE; 14x100GE + 20x10GE
    port-modes-qsfp28: '10, 40 and 100 Gigabit Ethernet - data sheet Table 2, "16 QSFP28 ports capable of 10Gb, 40Gb, and 100Gb Ethernet". Cisco publishes no per-optic list for this chassis and points at the Cisco Optics Compatibility Matrix instead, so this is the rate list and not an optics list'
    port-modes-sfp-plus: '10 Gigabit Ethernet - data sheet Table 2, "20 SFP+ ports capable of 10Gb Ethernet", with no dual-rate note beside it. The chassis-wide sentence "10, 25, 40, 100, and 400 Gigabit Ethernet interface types across the ASR 9903 chassis" covers the Port Expansion Cards as well and is not a claim about these twenty cages'
  power:
    power-input-ac: 200-240 VAC high line, 90-130 VAC low line, 50-60 Hz
    power-input-dc: -48 VDC nominal, -40.5 to -72 VDC, 40 A max per module
    power-supply-pids: PWR-1.6KW-AC, PWR-1.6KW-DC
    power-redundancy-ac: '2+2 at high line, 3+1 at low line'
    power-redundancy-dc: '2+2'
  thermal:
    airflow: front to back
    air-filter: ASR-9903-FILTER, one serviceable filter on the front
  environmental:
    operating-temp: 5 to 40 C (41 to 104 F)
    storage-temp: -40 to 70 C (-40 to 158 F)
    operating-humidity: 10 to 85 percent
    storage-humidity: 5 to 95 percent
    operating-altitude: -60 to 1800 m
  features:
    ethernet: 10-Gbps IEEE 802.3ae, 40/100-Gbps IEEE 802.3ba, 100GE PHY monitoring, IEEE 802.x flow control, full duplex, per-port byte and packet counters
    timing: 2 x BITS RJ-45, ToD RJ-45, 10 MHz and 1 PPS SMB per RP, IEEE 1588 PTP telecom profiles G.8265.1/G.8275.1/G.8275.2 and SyncE
  platform:
    route-processor: 'A99-RP-F, two, redundant'
    switch-fabric: two integrated
    rp-memory: SDRAM DDR4 32 GB
    software: Cisco IOS XR 64-bit, from Release 7.1.25
  management:
    console: RJ-45 serial on each RP
    auxiliary: RJ-45 serial on each RP
    mgmt-ethernet: 2 x RJ-45 per RP
    usb: 1 x USB class A per RP
  compliance:
    nebs: 'designed to meet SR-3580 NEBS Criteria Level 3, GR-1089-CORE and GR-63-CORE'
    safety: UL/CSA/IEC/EN 60950-1, IEC/EN 60825 laser safety, ACA TS001, AS/NZS 60950
    emc: FCC Class A, ICES 003 Class A, AS/NZS 3548 Class A, CISPR 22 (EN55022) Class A, VCCI Class A, BSMI Class A
    etsi: EN300 386, ETSI 300 019 Storage 1.1, Transportation 2.3, Stationary 3.1
    railway: EN50121-4
    immunity: IEC/EN-61000-4-2 ESD (8 kV contact, 15 kV air), -4-3 radiated (10 V/m), -4-4 EFT (2 kV power, 1 kV signal), -4-5 surge (AC 4 kV CM / 2 kV DM, signal 1 kV, DC 1 kV), -4-6 conducted (10 Vrms), -4-8 power-frequency magnetic field (30 A/m), -4-11 dips and interruptions
  lifecycle:
    eol: none-announced
chassis:
  width: 443.86
  height: 131.57
  depth: 600.0
  ru: 3
  weight-kg: 37.0
  airflow: front-to-back
  color: '#c8cacc'
  silk: '#231f20'

gaps:
- what: chassis-weight-sources-disagree
  reason: sources-disagree
  note: >-
    TWO CISCO DOCUMENTS GIVE THIS CHASSIS TWO MAXIMUM WEIGHTS and they are not
    reconcilable as different scopes. Table 2 of the ASR 9903 data sheet
    (c78-744035) gives ASR 9903 chassis with 2 RPs, 4 PSUs and 4 FANs, 5.18 x
    17.475 x 30 in. and 81.62 lb, or 131.57 x 443.86 x 762 mm and 37 kg. The
    fixed-port Hardware Installation Guide's Lifting Guidelines read "A
    fully-configured Cisco ASR 9903 can weigh as much as 70 pounds (31.75 kg)".
    Both are maxima and the guide's scope is the WIDER of the two - "fully
    configured" must include a PEC, which the data sheet's list does not - so the
    larger figure should have been the guide's, and it is 5.25 kg smaller.
    `chassis.weight-kg` carries the data sheet's 37 kg because the source table
    makes the data sheet authoritative for weight, and this gap carries the
    guide's figure so the disagreement is not silently resolved.
  wanted: >-
    a scale under a real ASR 9903, or a Cisco document that states the weight
    with its scope spelled out.
  blocks: []
- what: front-right-furniture-unidentified
  scope: [front]
  reason: vendor-silent
  note: >-
    The furniture strip at the right of the RP row carries four features. Two are
    identified and drawn: a hex grounding stud and an IEC 60417-5019 earth
    symbol. The other two are not. Above the stud the master draws a plain
    circular dimple about 3 mm across, and between them a smaller dark circle
    that reads as a through-hole on the install guide's Figure 3 render at 2.7
    px/mm. NO SENTENCE IN THE INTAKE NAMES EITHER. They are the right shape and
    the right place for an ESD wrist-strap jack and a captive-screw well - the
    ASR 9001 has an ESD socket on its front and Figure 9 of the same guide points
    at it - but the ASR 9903 is not in that figure and the guide's ESD section
    names no socket for this chassis. Drawing them as an esd-jack would be a
    guess with a citation attached, so they are left off.
  wanted: >-
    a callout in a Cisco figure, or a photograph of the front right corner close
    enough to read the two features.
  blocks: []
- what: attention-on-off-tag-not-identified
  scope: [front]
  reason: vendor-silent
  note: >-
    The front master draws a recessed frame 13.51 x 26.01 mm at the left end of
    the fixed board with a yellow tag in it reading ATTENTION / ON-OFF, and the
    install guide's Figure 3 render shows the same recess with a plain white tag.
    WHAT IT IS, IS NOT SAID FOR THIS CHASSIS. The identical assembly on the ASR
    9902's REAR is captioned in Figure 158 of the same guide with POWER printed
    under it and a lamp beside it, so on that chassis it is a power switch. For
    the ASR 9903 the guide says only that the AC and DC PSUs for ASR 9903
    routers have no power switch, being plug-and-play, and that the power LED
    (PWR) is on the router's front, which places a PWR lamp on the front and
    names no switch. So the recess and its tag are drawn as panel decor and
    silkscreen, exactly as the artwork has them, and nothing here asserts that
    they are a switch.
  wanted: >-
    a callout naming this feature on the ASR 9903, or a photograph of the front
    left corner.
  blocks: []
- what: fan-bay-labels-sit-in-a-notch
  scope: [rear, fan-trays]
  reason: needs-drawing
  note: >-
    FT0 to FT3 are printed on the chassis in a notch at the bottom left of each
    tray - the tray is cut away there and the label plate shows through, which is
    how the drawing and the guide's Figure 4 both have it. This model draws each
    tray as a filled rectangle, so the four marks land under their bays and L21
    reports them. The marks are kept at the positions the master gives rather
    than moved somewhere they would render, because moving them would put ink
    where the device has none; the honest fix is a notched tray outline, which is
    a component change.
  wanted: >-
    cisco/asr-9903-fan@1 drawn with its bottom-left notch, so the chassis label
    shows through it.
  blocks: []
- what: four-faces-carry-no-documented-feature
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    THE TOP, BOTTOM AND TWO SIDES ARE SIZED AND NOT DRAWN, and each carries an
    `empty:` sentence saying where the search ran. What they have in common is
    that no source in the intake ELEVATES them. The Visio stencil's 119 masters
    are front and rear elevations and hold no plan or side view at all. The
    install guide's figures for this chassis are two elevations, a top-view
    FOOTPRINT (Figure 19, which dimensions the outline and draws no feature), an
    airflow path, two rack-mounting sequences, a bracket-to-side sequence and an
    air-filter exploded view - the last two show the sides at an angle and
    dimension nothing on them. The data sheet gives the envelope.
    WHAT IS ACTUALLY THERE, from the photographs, is a cisco wordmark and a large
    product label on the top, four feet and the bracket landings underneath, and
    a bracket rail on each side. None is positioned by anything, and drawing them
    by eye off a three-quarter render would put unmeasured furniture on four
    faces at once.
  wanted: >-
    a Cisco mechanical drawing of the ASR 9903, or orthographic photographs of
    the top and one side with something of known size in frame.
  blocks: []
- what: per-module-power-for-this-chassis
  scope: [power-modules, fan-trays]
  reason: vendor-silent
  note: >-
    NEITHER THE FAN TRAY NOR THE ROUTE PROCESSOR CARRIES A DRAW FIGURE MEASURED
    ON THIS CHASSIS, and the L27 and L29 warnings are left standing as the
    record. The one per-FRU table in the intake is a `show environment` example
    in the fixed-port guide's troubleshooting chapter, and it was taken on an ASR
    9902: its rows read ASR-9902-LC 614/283, A99-RP-F 102/43 and ASR-9902-FAN
    72/7. The RP figure is this chassis's RP and cisco/a99-rp-f@1 carries it. The
    fan row is a different tray in a 2RU chassis with three of them, and the PECs
    have no row at all because an ASR 9902 has no PEC bay. Searched: Table 35 of
    the Ethernet Line Card Installation Guide (modular-chassis cards only), Table
    24 of the Overview and Reference Guide (modular-chassis fan trays only), the
    ASR 9903 and ASR 9902 data sheets, and every document in the intake for
    "Power consumption" on a line with one of these part numbers.
  wanted: >-
    a Cisco specifications appendix for the fixed-port chassis, or a `show
    environment` capture from a real ASR 9903.
  blocks: []
groups:
  rp-slots:
    term: RP
    role: management
    index-origin: 0
    physical-context: NetworkingDevice
    attrs:
      redundancy: '1+1'
      redundancy-note: 'the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide, "Cisco ASR 9903 Router": "Route Processors-up to two route processors may be used in a redundant configuration", and the ASR 9903 data sheet c78-744035, which lists "Route processor redundancy" in Table 2 and says in its overview that the chassis "supports two redundant Route Processors (RP)". NEITHER NAMES A FORM, and 1+1 is the reading: with exactly two slots and redundancy between them there is no other arithmetic. That is a weaker basis than the power modules two rows down, where Table 2 prints 2+2 and 3+1 outright'
  pec-bay:
    term: Bay
    role: traffic
    index-origin: 1
    physical-context: NetworkingDevice
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 0
  board-status:
    term: LED
    role: indicator
    index-origin: 0
  power-modules:
    term: PM
    role: service
    index-origin: 0
    physical-context: Power Module
    attrs:
      redundancy: '2+2'
      redundancy-note: 'data sheet Table 2: "1.6 kW DC power module (up to 4 modules), redundancy: 2+2" and "1.6 kW AC power module (up to 4 modules), redundancy: AC high line (200-240V): 2+2; AC low line (90-130V): 3+1". The 2+2 here is the high-line AC and the DC case; a low-line AC build is 3+1 and that is in attrs.power rather than lost'
  fan-trays:
    term: FT
    role: service
    index-origin: 0
    physical-context: Fan
    attrs:
      redundancy-note: 'NO FORM IS STATED AND NONE IS INVENTED, so this group carries a note and no `redundancy`. The ASR 9903 data sheet c78-744035 says "4 fans in redundant configuration" in its overview and lists "Fan redundancy" in Table 2 with no arithmetic beside it, and the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide gives replacement steps and no ratio. Four trays redundant could be 3+1 or 2+2 and the difference is what a reader would want; writing either would make a guess comparable with the ASR 9006 guide s stated form, which is what the edgecore CSR310 refuses to do for the same reason'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
