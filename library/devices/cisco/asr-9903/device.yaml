  top:
    empty: >-
      the top is a plain cover. Figure 177 and Figure 107 both photograph it from above at
      an angle and show a cisco wordmark, a large white product label with a yellow corner
      patch, and the heads of the cover screws; nothing is dimensioned, no figure in the
      fixed-port guide elevates this face, and the data sheet gives the chassis envelope
      only. Searched: every 'Figure' caption in the guide for 'top', the ASR 9903 data
      sheet, and the Visio stencil, whose 119 masters are front and rear elevations with
      no plan view at all.
    size: {w: 443.86, h: 600.0}
  bottom:
    empty: >-
      the bottom carries the four feet and the four-post bracket landings and is
      photographed in no figure. Figure 83, 'Cisco ASR 9903: Attach the Brackets to the
      Sides of the Chassis', is the closest and shows the SIDE. Searched the guide's
      figure captions, the data sheet and the stencil; nothing elevates this face.
    size: {w: 443.86, h: 600.0}
  left:
    empty: >-
      the left side is sheet metal with the four-post bracket rail on it and no documented
      feature. Figure 83 draws a bracket being screwed to this side and dimensions neither
      the bracket nor the holes; Figure 19, 'Cisco ASR 9903 Router Chassis Footprint and
      Dimensions-Top View', dimensions the footprint and not the side. Airflow is front to
      back, so there is no side vent to draw.
    size: {w: 600.0, h: 131.57}
