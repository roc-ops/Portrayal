    empty: >-
      the right side mirrors the left: bracket rail, no vent, nothing dimensioned. Same
      three sources searched as the left face, with the same result.
    size: {w: 600.0, h: 131.57}
configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - built from the group roles rather than from a vendor bundle: the
      service and management bays keep their seats and the one traffic bay is
      emptied. Cisco publishes no base bundle for this chassis - the ordering
      tables in c78-744035 list the chassis, the RP, the two PECs, the supplies,
      the fan tray, the mounting kit, the cable management and the filter as
      separate line items - so the library defines one.
    description: >-
      Chassis only - what you spec before deciding what goes in it. Both route
      processors, four AC supplies and all four fan trays are seated; the Port
      Expansion Card bay is EMPTY, which is how the router ships when nobody
      orders a PEC. The thirty-six fixed-board ports are part of the chassis and
      are there in every configuration.
    bays:
      pec-1: ''
  ac:
    kind: orderable
    description: >-
      The AC build: four PWR-1.6KW-AC modules. Named explicitly even though the
      base already seats them, so that asking for the AC variant does not mean
      knowing which flavour the base happens to carry. Redundancy is 2+2 at high
      line (200-240 V) and 3+1 at low line (90-130 V); a module handles both, but
      swapping between them means pulling the supply out and back in.
    part-numbers:
      ASR 9903 Router, AC supplies:
        part: ASR-9903
    bays:
      pec-1: ''
      pm-0: cisco/pwr-1p6kw-ac@1
      pm-1: cisco/pwr-1p6kw-ac@1
      pm-2: cisco/pwr-1p6kw-ac@1
      pm-3: cisco/pwr-1p6kw-ac@1
  dc:
    kind: orderable
    description: >-
      The DC build: four PWR-1.6KW-DC modules at -48 VDC, 2+2. The chassis PID is ASR-9903 either way; the supplies are separate line items. Mixing AC and DC
      modules in one chassis is not supported, which is why this is a
      configuration of the whole chassis rather than a choice per bay.
    part-numbers:
      ASR 9903 Router, DC supplies:
        part: ASR-9903
    bays:
      pec-1: ''
      pm-0: cisco/pwr-1p6kw-dc@1
      pm-1: cisco/pwr-1p6kw-dc@1
      pm-2: cisco/pwr-1p6kw-dc@1
      pm-3: cisco/pwr-1p6kw-dc@1
  pec-2t:
    kind: example
    description: >-
      With the 2T Port Expansion Card in bay 1 - five 400GE QSFP-DD and fifteen
      100GE QSFP28 ports on top of the fixed board's thirty-six, for 3.6 Tbps.
      This is what the Visio master draws and what Figure 3 of the install guide
      photographs.
    bays:
      pec-1: cisco/a9903-20hg-pec@1
  pec-800g:
    kind: example
    description: >-
      With the 800G Port Expansion Card in bay 1 - forty-eight SFP+ ports, of
      which thirty-two also run 25GE, grouped into slice 4 and slice 5.
    bays:
      pec-1: cisco/a9903-8hg-pec@1
