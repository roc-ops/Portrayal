format: 1
kind: device
name: asr-9912
version: 0.1.0
maturity: modelled
manufacturer: Cisco
model: ASR 9912
description: >-
  Cisco ASR 9912 Router - 30 RU, and the first chassis in this family with TWO card cages on one
  face. Ten vertical line card slots sit above a second cage of nine positions carrying two route
  processors flanking seven fabric cards, with three power shelves below. The two fan trays are
  fitted from the REAR, which the guide marks on the figure itself. Modelled as a bare cage with
  every card position a real bay.
portfolio:
  line: Service Provider
  family: Aggregation Services Router
  series: ASR 9000 Series
provenance:
  chassis: >-
    datasheet - Table 13, b-asr9k-overview-reference-guide.pdf p130. ASR 9912: chassis height 52.5
    inches (133.4 cm), chassis width 17.6 inches (44.7 cm) with "19.0 inches (48.3 cm) including
    chassis rack-mount flanges and front doors", chassis depth 25.7 inches (65.2 cm), "29.4 inches
    (74.7 cm) including the cable management system" and "30.1 inches (76.4 cm) including cable
    management system and front doors". Modelled as the BODY, 447.0 x 1333.5 x 652.0 mm, taking
    the bare depth. This row gives 17.6 and 19.0 on separate lines, which is what showed the ASR
    9910's row has its flange phrase attached to the wrong number
  ru: datasheet - 52.5 in / 1.75 = exactly 30.00 RU, and the stencil's height_in of 5.2500 agrees
    exactly. One of the four chassis in the family where the guide and the stencil need no
    reconciling
  calibration: >-
    measured - gate 1 passed. Calibrating x on 482.6 mm (the 19.0 in rack face) and y on Table 13's
    1333.5 mm independently gives 0.20134 and 0.20144 mm/px, agreeing to 0.05 percent
  master-faces-verified: >-
    drawing - checked deliberately, because Cisco's ASR 9910 masters are SWAPPED and modelling from
    a filename there would build the chassis inside out. The 9912's are correctly named:
    asr-9912-ac-front carries the cable management tray with the cisco logo, both card cages and
    the populated power shelves, while asr-9912-ac-rear carries the two fan trays, a block of
    yellow warning labels and the power inlets. Figure 23 corroborates by marking the fan trays
    "(rear insertion)"
  card-orientation: >-
    datasheet - stated directly, and it had been an inference until now. The Overview and
    Reference Guide's "Chassis Slots" section (b-asr9k-overview-reference-guide.pdf p17) names
    every chassis in the family and gives the ejector position as the tell: "Cisco ASR 9912
    Router: All RP, FCs, and LCs are front-facing and mounted vertically, with ejector levers
    and captive screws at the top and bottom of each card". A bay therefore places a card
    component unrotated. Only the ASR 9006 and ASR 9904 are horizontal; the 9010, 9906, 9910,
    9912 and 9922 all stand their cards up, including the 21 RU 9010. This section supersedes
    the three-way inference an earlier revision rested on - the slot figures, Figure 2's "four
    on each side" callout and the measured cage aspect - all of which agreed with it.
  slots: >-
    datasheet - Figure 23 "Cisco ASR 9912 Router Slot Numbering", p38 of
    b-asr9k-overview-reference-guide.pdf, read at 250 dpi. Top to bottom: fan trays FT0 over FT1
    marked "rear insertion"; then Slot 0 to Slot 9 carrying LC0 to LC9; then a second cage of nine
    positions labelled by NAME and not by slot number - RP0, FC0, FC1, FC2, FC3, FC4, FC5, FC6,
    RP1; then power shelves PS0, PS1, PS2 each M0 to M3. The RP/FC positions are named directly by
    Cisco, so they are named directly here rather than given invented slot numbers
  slot-pitch-measured-from-the-card-guide-rails: >-
    measured - CORRECTED. An earlier revision of this file said both cages PRINT their positions.
    They do not: what was measured is the row of bolt heads on each cage's card guide rail, checked
    by eye at 2400 px after the same reading was found to be wrong on the ASR 9910. The numbers are
    unchanged, because a uniform rail is a better ruler than printed text - a label's centre moves
    with its character count, and on the 9910 the text row gives pitches ranging 41.78 to 55.16
    where its rail gives 43.78 with a spread of 0.2.
    Ten line card rail bolts centre at 25.08 through 421.61 mm with nine pitches of 44.10, 43.99,
    44.09, 44.09, 43.99, 44.10, 44.09, 43.99 and 44.09 - a mean of 44.06 with a spread of 0.11 mm.
    The nine RP/FC positions give the same 44.05, so the two cages share a pitch, which is what
    makes a fabric card and a line card the same mechanical slot here. Both cages measure 6.36 to
    440.24 mm across the body. THE SIBLING CONFIRMS IT: the ASR 9922's front master, measured the
    same way, gives 44.06 with a spread of 0.11 - identical, and the two are the same build
  pitch-against-the-siblings: >-
    NOTE - 44.06 here against 43.78 measured the same way on the ASR 9910 and 43.75 on the ASR
    9906. The 0.28 mm difference is larger than either chassis's own label spread, so it is
    probably real rather than noise, and it is consistent with the 9912 and 9922 being a slightly
    different mechanical build from the 9906 and 9910 - they take the full-width A99-SFC3 fabric
    card at 41.4 mm where the 9910 takes the double-width A99-SFC3-S at 76.2. Recorded rather than
    averaged away
  bay-sizing: >-
    the bays are sized to the COMPONENT envelope, 41.4 x 395.7, and POSITIONED on the measured
    label centres. The 2.66 mm between that envelope and the 44.06 measured pitch is the card guide
    between slots, which is chassis structure rather than part of the bay. This follows the team's
    arbitration that a module's size is the slot envelope and that a bay and its occupant must
    carry the same size so the two can be checked against each other. NOTE FOR HARMONISING LATER:
    the ASR 9006 and ASR 9010 committed earlier size their bays to the cage OPENING instead, which
    predates that ruling and should be brought into line
  card-compatibility: >-
    datasheet - the per-card datasheets carry a "Chassis compatibility" row. c78-743580, the 5th
    Generation High-Density Multi-Rate data sheet, says of A9K-20HG-FLEX-SE/-TR and
    A9K-8HG-FLEX-SE/-TR: "Compatible with the Cisco ASR 9006, ASR 9010, ASR 9904, ASR 9906, ASR
    9910, ASR 9912, and ASR 9922 chassis". This chassis is named, so those four are in every line
    card bay. Cards whose rows omit the 9912 are deliberately absent
  fabric-and-rp: >-
    datasheet - the seven FC positions accept cisco/a99-sfc3@1, which Table 23 names as an ASR 9912
    part in its own right. The two RP positions accept the RP3 pair; the ASR 9900 Series Route
    Processor 3 data sheet is the source for the part and Figure 23 for the positions. THE FABRIC
    CARD'S POWER FIGURE IS SCOPED AND MUST NOT BE READ OFF THE COMPONENT HERE - see gaps
  airflow: >-
    datasheet - "Cisco ASR 9912 Router: Front-to-rear cooling path. The inlet is at the bottom
    front of the chassis, and the exhaust is at the upper rear",
    b-asr9k-overview-reference-guide.pdf p3740
  air-filter: >-
    datasheet - Table 17, b-asr9k-hardware-installation-guide.pdf p228: "Cisco ASR 9912 Router -
    Three air filters on the front of the RP and FC card cage". THREE filters, on the FRONT, which
    is unlike every other chassis in the family - the 9006 and 9904 put theirs on the right side
    and the 9010, 9906 and 9910 underneath a cage. Not modelled as bays; no figure dimensions them
  grounding: datasheet - "Bottom rear right side of the chassis",
    b-asr9k-hardware-installation-guide.pdf p125, illustrated by Figure 137
  environmental: datasheet - Table 14, p131. The 9912 is in the narrower short-term group,
    23 to 122 degF (-5 to 50 degC), with the 9010, 9910 and 9922
  electrical: datasheet - Table 15 (AC) and Table 16 (DC), pp132-135, ASR 9912 columns only
  weight: >-
    datasheet - Table 13. "Chassis only - 181 pounds (82.10 kg)" and "Chassis: fully configured
    using all card slots and three power trays - 643 pounds (291.66 kg)"
  no-chassis-power-figure: NOTE - Cisco publishes no chassis-level draw for any ASR 9000; Table 14
    says only to use the Cisco Power Calculator, so the module total here is a floor
  lifecycle: datasheet - searched. No end-of-sale or end-of-life notice for this chassis was found
  compliance: datasheet - data_sheet_c78-501767.pdf series compliance list, transcribed as printed
