gaps:
- what: fabric-card-power-is-scoped-to-the-9922
  scope: [fabric]
  reason: sources-disagree
  note: >-
    cisco/a99-sfc3@1 carries power-draw-max-w 340, and that figure is the ASR 9922's. Table 23 of
    b-asr9k-overview-reference-guide.pdf lists the SAME part number twice with different figures
    scoped by chassis - "A99-SFC3 Card (ASR 9922)" at 320/330/340 W across the three ambients, and
    a separate ASR 9912 row at a lower number. These are two scopes rather than two answers: the
    same card draws less in this chassis than in the 9922. A chassis total built from the component
    here is therefore CONSERVATIVE - it over-counts each of the seven fabric cards - which is the
    safe direction but is not the right number. The component cannot carry both without a
    chassis-scoped mechanism, which the library does not have; casa/c100g records the same species
    of problem for paired modules.
  wanted: a per-chassis power scope on a component contract, or a separate PID for the 9912 variant
- what: power-module-openings
  scope: [front]
  reason: needs-drawing
  note: >-
    Three power shelves are drawn as single openings rather than four module openings each. Figure
    23 numbers them M0 to M3 per shelf and Table 15 gives "Version 2 power system: Up to twelve AC
    power modules per system, four per tray" - so twelve, and the count is not in doubt. The
    boundaries are: the master draws all three shelves populated, so scanning returns module detail
    rather than separators. The shelves' vertical extents here are estimated from the band below
    the RP/FC cage rather than measured off separator rules, which is weaker than everything else
    in this file and is why they are cutouts and not bays.
  wanted: a figure showing the power shelves empty, or a dimensioned front elevation
- what: blank-faces
  scope: [top, bottom, left, right]
  reason: vendor-silent
  note: >-
    All four side faces are sized from Table 13 and Figure 14 (the 9912's top-down footprint) and
    are deliberately EMPTY. This chassis breathes front to rear and its three air filters are on
    the FRONT, so no side carries a feature the guide names. The sizes are right, which is what
    these views carry for a rack elevation and the 3D box.
  wanted: a six-face photograph set, or the mechanical drawings behind Figure 14
