configurations:
  ac:
    kind: orderable
    description: >-
      ASR 9006 AC Chassis with PEM Version 2 - the chassis ordered with a version 3 AC power feed. The
      difference is which modules seat in the power tray; the chassis is the
      same metal either way, which is why this is a configuration and not a
      separate device.
    part-numbers:
      ASR-9006-AC-V2: {part: ASR-9006-AC-V2, power-cord: none}
    bays:
      pm-0: cisco/a9k-pwr-3kw-ac@1
      pm-1: cisco/a9k-pwr-3kw-ac@1
      pm-2: cisco/a9k-pwr-3kw-ac@1
  dc:
    kind: orderable
    description: >-
      ASR 9006 DC Chassis with PEM Version 2 - the chassis ordered with a version 2 DC power feed. The
      difference is which modules seat in the power tray; the chassis is the
      same metal either way, which is why this is a configuration and not a
      separate device.
    part-numbers:
      ASR-9006-DC-V2: {part: ASR-9006-DC-V2, power-cord: none}
    bays:
      pm-0: cisco/a9k-pwr-2kw-dc@1
      pm-1: cisco/a9k-pwr-2kw-dc@1
      pm-2: cisco/a9k-pwr-2kw-dc@1
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 6 slot bays are
      EMPTY; power-modules are populated. Enough to power on and reach the box, which is
      the question most people ask first and the one `default` used to answer with
      whatever the drawing happened to be populated with.
    bays:
      slot-5: cisco/a9k-slot-cover@1
      slot-4: cisco/a9k-slot-cover@1
      slot-3: cisco/a9k-slot-cover@1
      slot-2: cisco/a9k-slot-cover@1
      slot-1: cisco/a9k-slot-cover@1
      slot-0: cisco/a9k-slot-cover@1
gaps:
- what: power-module-width-disagrees-with-the-component
  scope: [power-modules]
  reason: sources-disagree
  note: >-
    cisco/a9k-pwr-3kw-ac@1 states 142.78 mm wide. Three of them need 428.34 mm and this chassis's
    power shelf interior measures 416.50, so they do not fit - lint L13 flagged the overlap
    directly when they were placed at the measured centres. Against that, the stencil's shape box
    for the 'A9K Power Module' master reads 0.5477 in, which is 139.12 mm at the stencil's 1:10
    scale, and my own measurement of the three openings in the ASR 9006 front master gives 138.35,
    137.50 and 138.23. Those two agree to under a millimetre, and three at 139.12 come to 417.36
    against a 416.50 shelf - the arithmetic a shelf that holds exactly three ought to produce.
    The 142.78 is most likely the art measured over something that is not the module's seating
    width, the same class of error as reading a card's shape box instead of its art. The bays here
    are sized to the measured openings, so the chassis is right and the component and the chassis
    disagree by about 3.7 mm until someone re-measures the master.
  wanted: a re-measurement of the 'A9K Power Module' stencil master, or a Cisco dimension for the
    version 1 power module
- what: rsp880-width-cannot-fit-this-cage
  scope: [slots]
  reason: sources-disagree
  note: >-
    NINE CARDS SHARE THESE SIX SLOTS AND TWO FAMILIES DISAGREE BY 32.8 mm ON THE
    ONE AXIS THAT HAS TO FIT ONE OPENING. The line cards and the blank filler are
    395.7 mm; all four RSP-880 variants are 428.5. The measured cage opening is
    352.59.
    The line-card story is coherent: a9k-slot-cover's own art measures a PLATE of
    362.24 inside a 395.7 envelope, so the plate covers the 352.59 opening with
    4.8 mm of overlap per side and the ejector brackets account for the remaining
    16.7 per side. Every number has a job.
    The RSP-880's does not. 428.5 needs 37.96 mm of overlap per side to cover the
    same opening, and a card centred on this cage reaches x 22.99 to 451.49 in a
    444.5 mm chassis - 6.99 mm PAST the outer wall, which is visible in the 3D
    view as the card's end standing proud of the side of the box.
    WHERE 428.5 COMES FROM, AND WHY IT IS THE SUSPECT: the RSP-880 data sheet's
    'Physical specifications' row. This library's own a9k-rsp880-se provenance
    already records that NINE RSP AND RP MASTERS IN THE STENCIL ARE ONE DRAWING,
    scaled to four different stated widths - 402.8, 428.5, 428.2 and 403.4 - so
    "the drawing is generic across the family and cannot be all four sizes". The
    cage, by contrast, is measured off this chassis's own master and independently
    supported by Figure 19.
    NOT RESOLVED HERE. Two numbers describing different things is the likeliest
    reading - the same trap as a plate against an envelope - but nothing we hold
    says WHICH thing 428.5 measures, and inventing a smaller one would be the
    reconciliation this project keeps digging back out.
  wanted: >-
    a Cisco mechanical drawing of an RSP-880 faceplate, or one measurement across
    a real card from ejector tip to ejector tip. Either settles it for all four
    variants at once and for every chassis they go in. REQUESTED FROM THE LAB,
    2026-08-26, and tracked as roc-ops/ndv#16 - that issue carries the three
    conflicting Cisco figures and what to do when the number arrives.
  blocks: []
- what: slot-pitch-even-division-is-unconfirmed
  scope: [slots]
  reason: needs-drawing
  note: >-
    NARROWED, not closed. This file and the ASR 9010's carried pitches that disagreed - 46.60 here
    against 44.33 there - for two chassis that take the same cards. Cisco's RSP-880 sheet resolved
    the 9010 half: the card is 46.0 mm thick and Cisco names the 9010 among the chassis it serves,
    so a 44.33 slot is impossible there and that cage is now divided on published card thicknesses.
    THIS CHASSIS IS NOT DISCRIMINATED BY THAT EVIDENCE. Its 279.63 mm cage admits both readings:
    four line card slots at 41.4 plus two RSP slots at 46.0 is 257.6, leaving 22.03 for guides; and
    an even six-way division at 46.60 is also >= 46.0 and so also admits the RSP-880. The even
    division is kept because it is what the cage measures and because nothing here favours the
    other, but it is an assumption and the 9010 shows the family does not always divide evenly.
    Neither this master nor the 9010's prints slot labels or draws cage dividers, which is why both
    were assumptions in the first place - the 9904, 9906, 9910, 9912 and 9922 all have a ruler in
    the picture and these two do not.
  wanted: a dimensioned front elevation of the ASR 9006, or a per-slot width from any Cisco document
- what: chassis-width-sources-disagree
  scope: [front, rear, top, bottom]
  reason: sources-disagree
  note: >-
    Two figures in b-asr9k-overview-reference-guide.pdf give the ASR 9006 body width differently.
    Table 13 "Cisco ASR 9000 Series Routers Physical Descriptions" (p130) says 17.50 inches
    (44.45 cm). Figure 9 "Cisco ASR 9006 Router Chassis Footprint Dimensions - Top Down View"
    (p24) dimensions the same body at 17.38 inches (44.15 cm). Same measure, same part, 3 mm
    apart, so this is a real conflict and not two scopes. The manifest carries 44.45 because the
    spec table is authoritative for overall dimensions and because Cisco's own Visio master
    independently records 1.9 in at 1:10 over the flanges, which back-solves to Table 13's split
    once the 19.05 mm flange protrusion is subtracted. The likeliest reconciliation is that 17.50
    is over the outer skin and 17.38 is the sheet metal at the section plane Figure 9 cuts, but no
    document we hold says that, so it is not written as though one does. The height is unaffected -
    both sources and the stencil agree on 17.50 in there.
  wanted: a Cisco mechanical drawing with a tolerance, or a tape measure on a real ASR 9006
- what: rear-power-inlet-detail
  scope: [rear]
  reason: needs-drawing
  note: >-
    The power modules load from the front but their inlets are on the rear, and the only artwork we
    hold for that rear panel is the stencil's ASR-9006-AC Rear master, which draws the VERSION 1
    tray: three IEC inlets labelled M2, M1, M0 left to right (mirrored from the front's M0, M1, M2)
    with the legend "100-240V 50/60 Hz 16A MAX (3X)" and a yellow warning label. This chassis is
    modelled as version 2, which has four modules and therefore four inlets, and no figure in any
    document we hold shows the version 2 rear panel. Rather than mirror three inlets into four and
    invent a pitch, the rear carries the inlet panel's outer band only. The DC rear is a further
    unknown again - there is no ASR-9006-DC master in the stencil at all.
  wanted: a figure or photograph of the version 2 AC rear panel, and of the DC rear panel
- what: air-filter-position
  scope: [right, filters]
  reason: needs-drawing
  note: >-
    The air filter is real, sourced and correctly typed as a bay - Table 17 of
    b-asr9k-hardware-installation-guide.pdf places it along the right side accessible from the
    rear, and Figure 207 shows the panel and its thumb screw. What is NOT sourced is its geometry.
    Figure 207 is a three-quarter perspective view with no dimension lines on it, so its aspect is
    foreshortened and it fails gate 1 as a source of absolute size. The filter's 52 mm width and
    its 8 mm standoff from the rear edge are read as fractions of that figure and anchored to the
    chassis depth, and its height is set to the card cage band rather than measured. Treat the
    filter's extent as the one feature here that a tape measure would most likely move. Its
    presence, its side, its access direction and the fact that it is user-replaceable are all
    stated in words by the guide and are not in doubt.
