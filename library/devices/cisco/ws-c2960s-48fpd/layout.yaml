gaps:
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's figures show the lid and one side
    isometrically (bracket screw holes and slots on the side); none can be measured. Each carries an `empty:`
    sentence saying where I looked.
- what: rps-connector-part
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A part for the RPS connector. No registry part exists for an RPS 2300 connector, so it is drawn as chassis art
    where the photograph puts it, open. The guide says the cover (two Phillips pan-head screws, Figure 1-15) goes on
    when no RPS is connected.
- what: etsi-bracket
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The ETSI mounting bracket, printed "700-19781XX" (PDF p34, printed 1-10). Its revision digits are not read, and the guide
    gives no contents or install steps beyond Figure 1-10, so no kit contract is written.
- what: front-text-and-corner-marks
  scope: [front]
  reason: needs-photo
  wanted: >-
    The corner marks 1X to 48X, the "POWER OVER ETHERNET" and "740 W" legends under the jacks and the SFP+ labels
    are on the NetBox stencil only; the numerals above the jacks and the SFP+ numbers are drawn, the rest is not.
- what: front-of-the-48fpd-itself
  scope: [front]
  reason: needs-photo
  wanted: >-
    A square-on photograph of this model's front. The only flat face is community art; every position is read from
    it at 11.3 px per mm.
- what: mode-button-part
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The Mode button is drawn as plain panel art. No library part is a flush push button of this shape.
- what: rear-label-text
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The rating label text beside the inlet. The photograph shows another model's label ("100-240V~ 8-4A") and the
    guide's drawing shows "12-6A", so none is carried for this model.
