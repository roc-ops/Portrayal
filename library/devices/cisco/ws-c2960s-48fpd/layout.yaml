  power:
    power-input-ac: '100 to 240 VAC (autoranging), 9 to 4 A, 50 to 60 Hz'
    rps-input: '+12 V @ 4 A, -52 V @ 15 A (RPS 2300)'
    power-consumption-w: 129
    heat-dissipation-btu-hr: 440
    power-rating-kva: 0.89
    poe-budget-w: 740
    power-envelope: unstated
  features:
    sfp-plus-slots: '2 SFP+ module slots (49 and 50), 10 Gigabit; the SFP+ slots also take 1 Gigabit SFP modules'
    optics-sfp-plus: >-
      Table 1-3 Supported SFP+ Modules (PDF p12, printed 1-10), the row listing this model: SFP-10G-LR=, SFP-10G-SR=,
      SFP-10G-LRM=, and SFP-H10GB-CU1M=, -CU3M= and -CU5M= twinax cables.
    stacking: 'FlexStack, optional C2960S-STACK module in the rear slot'
  management:
    console: 'USB mini-Type B and RJ-45; the USB port has priority when both are connected (Table 1-10)'
