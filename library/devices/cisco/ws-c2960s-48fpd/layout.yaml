manufacturer: Cisco
model: WS-C2960S-48FPD-L
aliases:
- {name: Catalyst 2960S-48FPD-L, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 2960-S, series: Catalyst 2960-S FlexStack}
description: >-
  48x 10/100/1000 PoE+ RJ-45 (740 W PoE budget) and 2x SFP+ uplink 1RU stackable access switch running LAN Base. The
  front carries the mode button and switch lamps at the left, four blocks of twelve jacks in two rows, then the USB
  Type A port, the USB mini-Type B and RJ-45 console ports, the Ethernet management port and the two SFP+ slots.
  The rear carries the FlexStack module slot with its blank cover, the fan exhaust, the RPS connector and the AC
  inlet of the built-in supply. Ports number 1-48 and run DOWN each column - odd on the top row, even beneath it.
  Slots 49 and 50 are the SFP+ pair.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, 82 pages (the PDF prints its number and no
      date; Cisco URL https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/hardware/installation/guide_stack/2960SHIG.pdf).
      Pages below are PDF pages with the printed page after them. Table 1-1 (PDF p3-4, printed 1-1 to 1-2) lists the
      model; Figure 1-1 "Catalyst 2960S-48FPD-L Front Panel" (PDF p4, printed 1-2) is an isometric line drawing of
      this model; Figure 1-10 "Catalyst 2960-S Switch Rear Panel with Stacking Module Slot and RPS connector" (PDF
      p19, printed 1-17) is the rear of the stacking models; the appendix's Table 1-2 (PDF p62-63, printed 1-2 to
      1-3) gives this model's row. Community NetBox (second opinion only, not Cisco's): the 48FPD-L device type and
      its front elevation (a flat stencil render, 5475 x 503 px) and the WS-C2960S-48LPD-L rear elevation (a
      photograph). No data sheet, no vendor 3D model and no photograph of this model is held. The pages were read
      through the PDF's text layer and the converted figures were viewed.
  gate-1-front:
    confidence: estimated
    note: >-
      The front is read from the NetBox front elevation of the WS-C2960S-48FPD-L, checked against the guide first.
      Its aspect is 5475 / 503 = 10.88 against 482.6 / 44.45 = 10.86 for the 19-inch width the ears make, so the
      image runs ear tip to ear tip and is read at 11.345 px per mm, with the chassis starting 216 px (19.05 mm)
      in. The 48 jacks agree with Table 1-1, four blocks of twelve in two rows, and the USB Type A, mini-B, RJ-45
      console, management and two SFP+ slots agree with Figure 1-1 callouts 3 to 7. The jack pitch reads 13.96 mm
      across 24 columns against the 13.97 of std/rj45-ganged, which supports the scale; the drawn chassis is 441
      mm between its ears' edges, 0.8 % under the stated 444.5, so every position is `estimated`. The NetBox image
      is community art, not Cisco's.
  numbering:
    confidence: drawing
    note: >-
      Ports run left to right from the far left, port 1 above port 2 in each pair, and the module slots are 49 and
      50 (the note under Figure 1-3, PDF p5, printed 1-3). The elevation prints 1 and 2 over each column pair, 1X and 2X at the first column's corners. The numerals are
      carried on the face as printed on the strip above the jacks. Interface names are in the community NetBox
      device type only: GigabitEthernet1/0/1 to 1/0/48, TenGigabitEthernet1/0/1 and 1/0/2 for the two slots and
      FastEthernet0 for the management port.
  jacks:
    confidence: estimated
    note: >-
      Row 1 starts 11.72 mm down the face and row 2 at 26.71, 15.0 apart; the first block's first jack at 24.06 mm
      from the chassis side and the blocks 89.4 mm apart (6 x 13.97 plus a 5.58 gutter). Jack height 11.0 reads
      11.0 on the elevation. Upper-row jacks are drawn with their contacts at the bottom of the opening, so they
      take the 180-degree rotation the 4948E's upper row takes.
  controls-and-lamps:
    confidence: estimated
    note: >-
      The eight switch lamps (SYST, RPS, MSTR, STAT, DPLX, SPED, STCK, PoE) stand in a column at 7.1 mm, pitched
      2.53 mm, the Mode button below them (Figure 1-7, PDF p13, printed 1-11: System, RPS, Master, Status, Duplex,
      Speed, Stack, PoE, Mode button; the RPS lamp is "only on switch models that support RPS", the Master and Stack
      lamps "only on switch models that support stacking", the PoE lamp "only on switch models that support PoE").
      The two small arrows above each column pair are the port lamps; the stencil shows them as triangles, up for
      the upper port and down for the lower, so the library's up and down arrow skins are used. The port lamp's
      meaning depends on the selected mode (Table 1-9). The arrows by the console jacks are read as the USB and
      RJ-45 console lamps (Table 1-10, PDF p18, printed 1-16); their text is not on the metal.
  legend:
    confidence: estimated
    note: >-
      The legend "Catalyst 2960-S Series PoE+ 10G" is printed on the NetBox stencil's face. Figure 1-1 shows only
      "2960-S" under the console callout, so the full text is the stencil's, which is community art, not this
      model's own document; it is carried as `estimated`.
  console:
    confidence: drawing
    note: >-
      Figure 1-1 callouts 5 and 6 and "Management Ports" (Figure 1-5, PDF p9): the USB mini-Type B console port and
      the RJ-45 console port are one console, and the USB port has priority when both are cabled (Table 1-10). The
      management port is its own (callout 7).
  power:
    confidence: datasheet
    note: >-
      Spec Table 1-2, this model's row: AC input 100 to 240 VAC autoranging, 9 to 4 A, 50 to 60 Hz; DC input for the
      RPS 2300 +12 V @ 4 A and -52 V @ 15 A; power consumption 129 W, 440 BTUs per hour (footnote 1: the power
      consumed internally by the switch at 120 VAC, 60 Hz); power rating 0.89 KVA. The PoE budget is 740 W (Table
      1-1). The supply is built in: "The switch is powered through the internal power supply" (AC Power Connector,
      PDF p21-22, printed 1-19 to 1-20), so it is part of the chassis and not a bay.
  inlet:
    confidence: estimated
    note: >-
      The inlet is an IEC C14 appliance inlet, read from Figures 1-10 and 1-11 (a three-pin keyed inlet with a
      rating label beside it) and the NetBox 48LPD-L rear photograph. The guide does not name the connector type; it
      says "Use the supplied AC power cord" and describes an optional power cord retainer (PWR-CLP=, PDF p42, printed 1-18).
      Position is read from the NetBox 48LPD-L rear photograph (same stacking rear, Figure 1-10; 3.41 px per mm from
      the 444.5 mm width, 1516 px).
  rear:
    confidence: estimated
    note: >-
      The rear is the stacking models' common rear (Figure 1-10, with the RPS connector: callouts 1 FlexStack module
      slot and cover, 2 fan exhaust, 3 RPS connector, 4 AC power connector). The guide's figure is isometric, so
      positions come from the NetBox 48LPD-L rear photograph, a different model of the same rear, read at 3.41 px
      per mm along its width. It shows a C2960S-STACK module fitted; this device shows the blank cover (the module
      is optional: "FlexStack Ports", PDF p21, printed 1-19). Spec Table 1-2 lists a DC input for the RPS 2300 for this model, so the RPS connector is
      present. The guide says "If you are not using an RPS with your switch, use the two Phillips pan-head screws to
      attach the RPS connector cover" (Figure 1-15, PDF p39, printed 1-15), so the connector is drawn open, as the
      photograph shows it. It is chassis art and not a part: no RPS 2300 connector is a registry part.
  airflow:
    confidence: estimated
    note: >-
      The guide names a fan exhaust on the rear panel and counts no fans and gives no direction; no airflow is set
      and no fan redundancy is claimed. The exhaust is drawn where Figure 1-10 and the photograph put it.
  ears-and-kits:
    confidence: drawing
    note: >-
      Figure 1-12 (PDF p36, printed 1-12) "Attaching Brackets for 19-inch Racks": front-mounting, mid-mounting and
      rear-mounting positions, with number-8 Phillips flat-head screws (48-0655-01); Figure 1-13 (PDF p37, printed
      1-13): number-12 Phillips pan-head screws (48-0523-01) for the rack and a black Phillips machine screw
      (48-0654-01) for the cable guide. The text says four screws attach each bracket's long side to the switch. The
      19-inch brackets are in the box, so they are not a kit. No position is dimensioned, so none carries an `at`.
      The ETSI bracket is printed "700-19781XX" (PDF p34, printed 1-10), with its revision digits unread: it is a
      gap and not a kit.
  lifecycle:
    confidence: estimated
    note: >-
      No lifecycle date is carried. The end-of-sale notices are not held; only titles and list dates would be, and
      this model's is not among them.
