configurations:
  ac:
    kind: base
    description: >-
      The switch as it runs: the built-in AC supply and the blank cover over the FlexStack module slot. The
      C2960S-STACK module is optional (PDF p21, printed 1-19) and is not seated here.
    default: true
  ws-c2960s-48fpd-l:
    kind: orderable
    description: >-
      WS-C2960S-48FPD-L, the model's only SKU (Table 1-1, LAN Base, PoE budget 740 W). It seats the blank cover in
      the FlexStack slot: the stack kit is a separate, optional part (PDF p21, printed 1-19) and the cover is removed only to fit
      the module (PDF p31).
    part-numbers:
      WS-C2960S-48FPD-L: {}
    bays:
      flexstack-slot: cisco/c2960s-flexstack-blank@1
references:
- {title: 'Catalyst 2960-S Switch Hardware Installation Guide (OL-19732-04)'}
- {title: 'NetBox community device-type library: Cisco WS-C2960S-48FPD-L and WS-C2960S-48LPD-L elevation images'}
