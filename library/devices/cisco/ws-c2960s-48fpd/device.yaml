gaps:
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's figures show the lid
    and one side isometrically (bracket screw holes and slots on the side); none can be measured. Each
    carries an `empty:` sentence saying where I looked.
- what: rps-connector-part
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    A part for the RPS connector. No registry part exists for an RPS 2300 connector and no `std/` header
    names it, so it is drawn as chassis art where the photograph puts it: a plate, a shroud, a housing
    with two rows of eleven cavities, two screw holes and a rating strip. It is drawn open. The guide
    says the cover (two Phillips pan-head screws, Figure 1-15) goes on when no RPS is connected.
- what: faceplate-colour
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    This model's own rear in colour. The only held rear in colour is the NetBox photograph of the WS-C2960S-48LPD-L,
    whose plain plate reads #3f4447 and whose fitted module's frame reads #344a54; its printed ratings
    ("8-4A", "+12V @11.25A, -48V @7.8A") match none of the five rows of spec Tables 1-2 and 1-3, so it
    is another model's rear. The guide gives no housing colour and says nothing of a shared finish ("All
    the 24- and 48-port switches have similar components" is about parts). The rear is drawn in the chassis
    colour, #404040, which is the front's own measured panel colour: a stand-in the owner may accept or
    replace.
- what: etsi-bracket
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The ETSI mounting bracket, printed "700-19781XX" (PDF p34, printed 1-10). Its revision digits are
    not read, and the guide gives no contents or install steps beyond Figure 1-10, so no kit contract
    is written.
- what: front-text-and-corner-marks
  scope:
  - front
  reason: needs-photo
  wanted: >-
    Two things on the NetBox stencil are not drawn. The USB symbol beside the USB Type A port is a small
    glyph of about 3 x 9 mm that no held source draws larger. The "740 W" after "POWER over ETHERNET"
    under the first jack block is printed near-black over the dark panel and the yellow ticks, so it cannot
    be read on either stage. The corner marks 1X to 48X are on the stencil, printed over each block's
    corner shoulders; the jack part's own skin paints those shoulders and a silkscreen line lies under
    the parts, so a mark would be half hidden and is not drawn. The strip's "POWER over ETHERNET" and
    the yellow ticks are drawn from the stencil. The ticks are a motif whose gaps take the renderer's
    own dark (#17191c), a shade under the panel's #404040.
- what: front-of-the-48fpd-itself
  scope:
  - front
  reason: needs-photo
  wanted: >-
    A square-on photograph of this model's front. The only flat face is community art; every position
    is read from it at 11.3 px per mm.
- what: mode-button-part
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The Mode button is drawn as plain panel art. No library part is a flush push button of this shape.
- what: rear-label-text
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    This model's own rear label text. The rear labels (the warning above the RPS plate, the ratings line
    over its pins and the rating plate beside the inlet) are drawn as the NetBox photograph of the WS-C2960S-48LPD-L
    rear prints them, and that photograph is another model's rear: its figures are stand-ins, every one
    `estimated`. It prints "8-4A, 50-60Hz" and "+12V ... @11.25A, -48V ... @7.8A", which match none of
    the five models' rows of the guide's tables, and the guide's own drawing of the rear without an RPS
    connector (Figure 1-13, PDF p21, printed 1-19) prints "12-6A", so the guide's drawing is not followed
    either. What each model's own label should read, from its own row of Table 1-2 (PDF p62-63, printed
    1-2 to 1-3) and Table 1-3 (PDF p64-65, printed 1-4 to 1-5): the WS-C2960S-48FPD-L, AC 9 to 4 A and
    +12 V @ 4 A, -52 V @ 15 A; the 48LPD-L, 5 to 2 A and +12 V @ 4 A, -52 V @ 8 A; the 24PD-L, 5 to 2
    A and +12 V @ 3 A, -52 V @ 8 A; the 48TD-L, 1 to 0.5 A and +12 V @ 4 A; the 24TD-L, 1 to 0.5 A and
    +12 V @ 3 A. All five: 100 to 240 VAC, 50 to 60 Hz.
- what: sfp-collar-silver
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    A version of the SFP+ cage part with the stencil's silver frame (#cfcfcf, 1423 px of each cage). The
    part's own skin paints a grey collar (#9aa0a8) round a dark opening and its skin is not edited here,
    so the silver is drawn only as the surround the part leaves visible (about 0.5 mm each side) and the
    part's collar stays its own grey.
