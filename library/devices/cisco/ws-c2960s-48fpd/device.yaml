manufacturer: Cisco
model: WS-C2960S-48FPD-L
aliases:
- {name: Catalyst 2960S-48FPD-L, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 2960-S, series: Catalyst 2960-S FlexStack}
description: >-
  48x 10/100/1000 PoE+ RJ-45 (740 W PoE budget) and 2x SFP+ uplink 1RU stackable access switch running
  LAN Base. The front carries the mode button and switch lamps at the left, four blocks of twelve jacks
  in two rows, then the USB Type A port, the USB mini-Type B and RJ-45 console ports, the Ethernet management
  port and the two SFP+ slots. The rear carries the FlexStack module slot with its blank cover, the fan
  exhaust, the RPS connector and the AC inlet of the built-in supply. Ports number 1-48 and run DOWN each
  column - odd on the top row, even beneath it. Slots 49 and 50 are the SFP+ pair.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, 82 pages (the PDF prints its number
      and no date; Cisco URL https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/hardware/installation/guide_stack/2960SHIG.pdf).
      Pages below are PDF pages with the printed page after them. Table 1-1 (PDF p3-4, printed 1-1 to
      1-2) lists the model; Figure 1-1 "Catalyst 2960S-48FPD-L Front Panel" (PDF p4, printed 1-2) is an
      isometric line drawing of this model; Figure 1-10 "Catalyst 2960-S Switch Rear Panel with Stacking
      Module Slot and RPS connector" (PDF p19, printed 1-17) is the rear of the stacking models; the appendix's
      Table 1-2 (PDF p62-63, printed 1-2 to 1-3) gives this model's row. Community NetBox (second opinion
      only, not Cisco's): the 48FPD-L device type and its front elevation (a flat stencil render, 5475
      x 503 px) and the WS-C2960S-48LPD-L rear elevation (a photograph). No data sheet, no vendor 3D model
      and no photograph of this model is held. The pages were read through the PDF's text layer and the
      converted figures were viewed.
  gate-1-front:
    confidence: estimated
    note: >-
      The front is read from the NetBox front elevation of the WS-C2960S-48FPD-L, checked against the
      guide first. Its aspect is 5475 / 503 = 10.88 against 482.6 / 44.45 = 10.86 for the 19-inch width
      the ears make, so the image runs ear tip to ear tip and is read at 11.345 px per mm, with the chassis
      starting 216 px (19.05 mm) in. The 48 jacks agree with Table 1-1, four blocks of twelve in two rows,
      and the USB Type A, mini-B, RJ-45 console, management and two SFP+ slots agree with Figure 1-1 callouts
      3 to 7. The jack pitch reads 13.96 mm across 24 columns against the 13.97 of std/rj45-ganged, which
      supports the scale; the drawn chassis is 441 mm between its ears' edges, 0.8 % under the stated
      444.5, so every position is `estimated`. The NetBox image is community art, not Cisco's.
  colour:
    confidence: estimated
    note: >-
      Front: the faceplate is two-tone, read from the NetBox WS-C2960S-48FPD-L stencil (cisco-ws-c2960s-48fpd-l.front.png,
      5475 x 503 px), whose fills are flat. The largest plain area is the charcoal panel, #404040 (median
      of 3600 px, box (435,30,480,110)), so that is `chassis.color`. The teal bezel round it is #255e6d
      (median of 7000 px, box (700,6,1200,20); the same on the lower edge, box (700,482,1200,497)); the
      console surround is #bad4d7 and the jack-block, SFP+ cage and management-jack outlines and the port-number
      tags are #ffff99. Lamp and model legends are inked as the stencil prints them: #ffffff for the lamps,
      #bbd5d8 for CONSOLE and #f2f2f2 for the model name. A NetBox stencil is a community artist's flat
      render, so these are that artist's palette and not a reading of the metal. Figure 1-1 (PDF p4, printed
      1-2), Cisco's own colour drawing of this model, agrees on the scheme (a dark teal front edge round
      a charcoal panel, yellow frames round the jack blocks, a pale-grey lid) with its own fills: panel
      #4a5153, teal #1d5e7a, yellow #fff647, lid #c3c4c7 (exact pixel colours of the figure's vector fills,
      400 dpi render of the page). Those are within 10 to 20 of 255 of the stencil's and are not used;
      the stencil is kept because the other models' stencils give the same set. The stencil of this model
      draws the jack-block outlines white (#ffffff) and those of the SFP+ cages and management jack yellow
      (#ffff99); Figure 1-1 of this model draws all of them yellow, and the 48TD-L stencil draws the blocks
      yellow too, so the blocks are drawn yellow here and the white is the stencil artist's choice. Rear:
      no held rear carries this model's colour. The only rear in colour is the WS-C2960S-48LPD-L NetBox
      photograph, whose plain rear plate reads #3f4447 (median of 2000 px, box (440,15,520,40)) and whose
      fitted module's frame reads #344a54; a photograph's colour depends on its lighting. Its printed
      ratings (AC "8-4A", RPS "+12V @11.25A, -48V @7.8A") match none of the five rows of spec Tables 1-2
      and 1-3, so it is not proof of the 48LPD-L's own rear. The guide names no housing colour and says
      nothing of a shared finish. The rear is therefore drawn in the chassis colour and the `faceplate-colour`
      gap says so. The rear reads charcoal, not teal; the teal is the fitted module's frame only. The
      lid and sides, which Figure 1-1 draws grey, stay `empty:`.
  front-plates:
    confidence: estimated
    note: >-
      Read from the NetBox WS-C2960S-48FPD-L stencil (cisco-ws-c2960s-48fpd-l.front.png) at 11.345 px
      per mm, the chassis starting 216 px in; the 48TD-L and 24PD-L stencils give the same value for every
      figure here. Each block of twelve sits in a ring (#ffffff on this model, 1800 px, box (450,200,460,380);
      yellow on the other stencils), round a dark channel and a silver plate (#efefef, the pixels of 0xd0
      or more outside the bar, 23316 px, box (473,146,1443,260)) with a silver bar between the two rows
      (#dcdcdc, 31850 px, box (503,264,1413,299)). The MODE button is teal #255e6d (1375 px, box (330,435,385,460))
      in a black rim #020404 (90 px, box (315,430,318,460)), 85 x 62 px, 7.5 x 5.46 mm. It was already
      declared teal and read as a dark tab because the bezel beside it is the same teal: it had no rim.
      The USB-A shell is #7b7b7b (7675 px, box (4541,80,4595,228)) and the two SFP+ frames #cfcfcf (1423
      px, box (4526,310,4697,444) and 1424 px, box (4866,310,5037,444)). The ticks are 47 to a block,
      0.44 mm wide on a 1.799 mm pitch from 481 px, #ffff99 (110 px, box (481,446,486,468)). All medians.
      The ring is white on this stencil and Figure 1-1 (PDF p4, printed 1-2) draws the frames yellow,
      so the yellow outline stays round the white ring: the figure is isometric and too small to tell
      a ring from a frame. The stencil is a community artist's flat render, so these are that artist's
      palette; no photograph from Cisco of the front is held.
  rear-labels:
    confidence: estimated
    note: >-
      The rear labels are read from the NetBox WS-C2960S-48LPD-L rear photograph (cisco-ws-c2960s-48lpd-l.rear.png,
      1516 x 150 px, 3.41 px per mm), and that photograph is another model's rear: its printed ratings
      match none of the five models' rows of the guide's tables, so the text is a stand-in and every figure
      is `estimated`. The guide's Figure 1-10 (PDF p19, printed 1-17) draws the rear at a scale too small
      to read the label text. Ink, each the median of the pixels over 150 in its box: the warning text
      #cfd3d1 (948 px, box (1043,20,1160,55)), the triangle #dce0e0 (211 px, box (1000,22,1034,52)). The
      ratings line is printed dark on the light strip, #626661 (477 px darker than 135, box (1018,62,1182,72));
      the rating plate's text is #414445 (906 px darker than 100, box (1200,20,1315,62)) on a plate that
      reads #8c8e8a (1150 px, box (1200,20,1315,30)). The drawn plate colours are the earlier measured
      #b3b7b4 and #a5aba7 and are not changed. The text is drawn as the photograph prints it: "DC INPUTS
      FOR REMOTE POWER SUPPLY SPECIFIED IN MANUAL" under a warning triangle, "+12V ... @11.25A, -48V ...
      @7.8A" with two direct-current symbols, and "RATING 100-240V~ 8-4A, 50-60Hz".
  numbering:
    confidence: drawing
    note: >-
      Ports run left to right from the far left, port 1 above port 2 in each pair, and the module slots
      are 49 and 50 (the note under Figure 1-3, PDF p5, printed 1-3). The elevation prints 1 and 2 over
      each column pair, 1X and 2X at the first column's corners. The numerals are carried on the face
      as printed on the strip above the jacks. Interface names are in the community NetBox device type
      only: GigabitEthernet1/0/1 to 1/0/48, TenGigabitEthernet1/0/1 and 1/0/2 for the two slots and FastEthernet0
      for the management port.
  jacks:
    confidence: estimated
    note: >-
      Row 1 starts 11.72 mm down the face and row 2 at 26.71, 15.0 apart; the first block's first jack
      at 24.06 mm from the chassis side and the blocks 89.4 mm apart (6 x 13.97 plus a 5.58 gutter). Jack
      height 11.0 reads 11.0 on the elevation. Upper-row jacks are drawn with their contacts at the bottom
      of the opening, so they take the 180-degree rotation the 4948E's upper row takes.
  controls-and-lamps:
    confidence: estimated
    note: >-
      The eight switch lamps (SYST, RPS, MSTR, STAT, DPLX, SPED, STCK, PoE) stand in a column at 7.1 mm,
      pitched 2.53 mm, the Mode button below them (Figure 1-7, PDF p13, printed 1-11: System, RPS, Master,
      Status, Duplex, Speed, Stack, PoE, Mode button; the RPS lamp is "only on switch models that support
      RPS", the Master and Stack lamps "only on switch models that support stacking", the PoE lamp "only
      on switch models that support PoE"). The two small arrows above each column pair are the port lamps;
      the stencil shows them as triangles, up for the upper port and down for the lower, so the library's
      up and down arrow skins are used. The port lamp's meaning depends on the selected mode (Table 1-9).
      The arrows by the console jacks are read as the USB and RJ-45 console lamps (Table 1-10, PDF p18,
      printed 1-16); their text is not on the metal.
  legend:
    confidence: estimated
    note: >-
      The legend "Catalyst 2960-S Series PoE+ 10G" is printed on the NetBox stencil's face. Figure 1-1
      shows only "2960-S" under the console callout, so the full text is the stencil's, which is community
      art, not this model's own document; it is carried as `estimated`.
  console:
    confidence: drawing
    note: >-
      Figure 1-1 callouts 5 and 6 and "Management Ports" (Figure 1-5, PDF p9): the USB mini-Type B console
      port and the RJ-45 console port are one console, and the USB port has priority when both are cabled
      (Table 1-10). The management port is its own (callout 7).
  power:
    confidence: datasheet
    note: >-
      Spec Table 1-2, this model's row: AC input 100 to 240 VAC autoranging, 9 to 4 A, 50 to 60 Hz; DC
      input for the RPS 2300 +12 V @ 4 A and -52 V @ 15 A; power consumption 129 W, 440 BTUs per hour
      (footnote 1: the power consumed internally by the switch at 120 VAC, 60 Hz); power rating 0.89 KVA.
      The PoE budget is 740 W (Table 1-1). The supply is built in: "The switch is powered through the
      internal power supply" (AC Power Connector, PDF p21-22, printed 1-19 to 1-20), so it is part of
      the chassis and not a bay.
  inlet:
    confidence: estimated
    note: >-
      The inlet is an IEC C14 appliance inlet, read from Figures 1-10 and 1-11 (a three-pin keyed inlet
      with a rating label beside it) and the NetBox 48LPD-L rear photograph. The guide does not name the
      connector type; it says "Use the supplied AC power cord" and describes an optional power cord retainer
      (PWR-CLP=, PDF p42, printed 1-18). Position is read from the NetBox 48LPD-L rear photograph (same
      stacking rear, Figure 1-10; 3.41 px per mm from the 444.5 mm width, 1516 px).
  rear:
    confidence: estimated
    note: >-
      The rear is the stacking models' common rear (Figure 1-10, with the RPS connector: callouts 1 FlexStack
      module slot and cover, 2 fan exhaust, 3 RPS connector, 4 AC power connector). The guide's figure
      is isometric, so positions come from the NetBox 48LPD-L rear photograph, a different model of the
      same rear, read at 3.41 px per mm along its width. It shows a C2960S-STACK module fitted; this device
      shows the blank cover (the module is optional: "FlexStack Ports", PDF p21, printed 1-19). Spec Table
      1-2 lists a DC input for the RPS 2300 for this model, so the RPS connector is present. The guide
      says "If you are not using an RPS with your switch, use the two Phillips pan-head screws to attach
      the RPS connector cover" (Figure 1-15, PDF p39, printed 1-15), so the connector is drawn open, as
      the photograph shows it. It is chassis art and not a part: no RPS 2300 connector is a registry part,
      and no `std/` header names it (the EPS12V, PCIe 8-pin and 12V-2x6 headers are other connectors).
      Measured on the photograph at 3.41 px per mm: a metal plate 72.8 x 22.6 mm at (285.0, 21.4) with
      a raised rating strip above it (49.2 x 3.8 mm at 297.7, 17.9), a black shroud 48.2 x 11.3 mm at
      (298.4, 24.0) holding a cream housing 46.9 x 9.7 mm, and in it two rows of eleven cavities, 3.5
      x 3.7 mm each, on a 4.17 mm pitch across and 4.03 mm between the rows, with a screw hole at each
      end of the plate (centres 294.7 and 350.2 mm, 29.8 mm down). Eleven across is what the serial-number
      figures draw for the PoE and the TD models (PDF p55, printed 1-5, Figure 1-1 of the appendix, and
      PDF p56, printed 1-6, Figure 1-2); Figure 1-10 (PDF p19, printed 1-17) draws seven across in a smaller
      figure, and the photograph and the two larger figures are followed. The warning label above the
      plate ("DC inputs for remote power supply specified in manual", with a triangle) is printed on the
      metal at (294.0, 5.9), 45.2 x 9.7 mm; its triangle and three lines, the ratings line over the pins
      and the rating plate beside the inlet (32.7 x 13.4 mm at (351.0, 6.1)) are drawn as the photograph
      prints them, which is another model's text and is declared a stand-in (see `rear-labels` and the
      gap `rear-label-text`). The inlet sits in a moulded black surround 29.3 x 22.5 mm at (387.6, 8.3).
      The fan exhaust is a honeycomb of hexagons about 9.7 x 8.5 mm on an 8.8 mm column pitch, centres
      measured from the dark cells of the photograph (21 cells, flat-topped); the library's `vent` pattern
      is hexagonal and is the nearest of the schema's patterns, scaled by 2.0 with `pattern-pitch` to
      that pitch, and its tile is crisp (a filled hexagon, no stroke and no filter), so `motif` is not
      needed. The faintness in the earlier comparison was the cairosvg rasteriser, which resamples a scaled
      pattern tile; in Chromium, the viewer's own rasteriser, the holes are sharp. The web between the
      holes is the chassis colour, not bright metal: the photograph's web reads #404345 (3999 px of the
      pixels between 40 and 130, box (540,44,705,140)) against the plate's #3f4447, and the holes #040507
      (256 px, box (572,52,588,68)); only the cut edges above and below the field are light, #b9bcba (517
      px, box (533,40,712,46)), drawn as two thin strips. The renderer's `vent` and `motif` tiles both
      fill their holes #17191c, so the holes are a shade lighter than the photograph's. The web is a plate
      under the field. Four pan-head screws, 6.8 mm across, stand at 7.3, 111.4, 274.2 and 436.4 mm along
      and 28.7 mm down; the first is on the module's flange and is drawn with the cover. The FlexStack
      slot is the fitted module's stepped frame (see the blank cover's contract). The faint stamped corner
      marks round the fan and one small drilled hole at (149.0, 28.9) are not drawn.
  airflow:
    confidence: estimated
    note: >-
      The guide names a fan exhaust on the rear panel and counts no fans and gives no direction; no airflow
      is set and no fan redundancy is claimed. The exhaust is drawn where Figure 1-10 and the photograph
      put it.
  ears-and-kits:
    confidence: drawing
    note: >-
      Figure 1-12 (PDF p36, printed 1-12) "Attaching Brackets for 19-inch Racks": front-mounting, mid-mounting
      and rear-mounting positions, with number-8 Phillips flat-head screws (48-0655-01); Figure 1-13 (PDF
      p37, printed 1-13): number-12 Phillips pan-head screws (48-0523-01) for the rack and a black Phillips
      machine screw (48-0654-01) for the cable guide. The text says four screws attach each bracket's
      long side to the switch. The 19-inch brackets are in the box, so they are not a kit. No position
      is dimensioned, so none carries an `at`. The ETSI bracket is printed "700-19781XX" (PDF p34, printed
      1-10), with its revision digits unread: it is a gap and not a kit.
  lifecycle:
    confidence: estimated
    note: >-
      No lifecycle date is carried. The end-of-sale notices are not held; only titles and list dates would
      be, and this model's is not among them.
