format: 1
kind: device
name: ws-c4948e
version: 0.1.4
maturity: modelled
manufacturer: Cisco
model: WS-C4948E
aliases:
- {name: Catalyst 4948E, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 4900, series: Catalyst 4948E}
description: >-
  48x 10/100/1000 RJ-45 and 4x 1/10G SFP+ 1RU top-of-rack switch running Cisco IOS, the front-to-back
  build of the Catalyst 4948E. All fifty-two ports, the console and management jacks, the status lamps
  and the recessed reset switch are on the front; two 300 W supplies and one four-fan tray between them
  are on the rear. Ports number 1-52 and run DOWN each column - odd on the top row, even beneath it. Its
  back-to-front sibling, the WS-C4948E-F, takes different supplies and a different fan tray and is not
  this device. End-of-sale was announced in October 2016.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Four sources, none of them committed. (1) Catalyst 4948E and Catalyst 4948E-F Switch Installation
      Guide, OL-21561-02, 162 pages: Table 1-1 features, Table 1-2 specifications, Figures 1-1, 1-2 and
      1-7, Table 1-5 LEDs, appendix A power supplies. (2) Cisco Catalyst 4948E and 4948E-F Ethernet Switches
      Data Sheet, c78-598933, 9 pages: Table 1, Table 2, Table 4, and Figures 1 to 3, which are square-on
      photographs of the front and of both rear builds. (3) Cisco's end-of-sale notice EOL11273. (4) Photographs
      of real units from resale listings, for what the small data-sheet photographs cannot resolve. THE
      GUIDE'S OWN CHASSIS FIGURES ARE ISOMETRIC LINE DRAWINGS and gave callouts only. No vendor 3D model
      and no stencil render was found.
  gate-1:
    confidence: measured
    note: >-
      BOTH DATA-SHEET PHOTOGRAPHS PASS, AT LOW RESOLUTION. The front, Figure 1, is 907 x 217 px with the
      face 827 px across and 84 tall: 9.85 against the stated 444.4 / 44.45 = 10.0, 1.5% out. The rear,
      Figure 2, is 853 px by 84: 10.15, 1.5% the other way. Scaled on the stated width the front is 1.861
      px per mm, AND THE RJ-45 PITCH THEN READS 13.97 mm - 26.0 px, averaged over the 20 steps inside
      the four blocks of one row - which is the 0.550 in ganged-jack pitch the registry's rj45-ganged
      notes record from a TE 2x6 magjack, on a quantity the scale never saw. The registry states that
      pitch in its notes and not as a key, so the block gives 13.97 as a number; the 12.7 part leaves
      1.27 mm of wall between openings, as the photograph shows. The SFP+ pair steps 14.5 against the
      registry's 14.25. So both axes are read off the photographs, and at under 2 px per mm every position
      is good to about half a millimetre and no better.
  the-width:
    confidence: datasheet
    note: >-
      17.5 in is 444.5 mm; both documents print "1.75 x 17.5 x 19.4 in. (4.4 x 44.4 x 49.3 cm)". 444.4
      x 44.45 x 492.8 is carried: the metric width as printed, and the inch figures converted for height
      and depth, which the metric rounds to a millimetre. The photographs show no ears, and the RJ-45
      pitch closing on the registry at that width says the figure is the body. The rack-mount brackets
      are a separate kit.
  the-four-blocks:
    confidence: photo-measured
    note: >-
      The 24 columns stand in four blocks of six. Their first openings read 25, 193, 361 and 531 px -
      steps of 168, 168 and 170 - so a least-squares block step of 90.59 mm starting at 10.4, a 6.77 gutter.
      That fits the four starts to 0.2, 0.1, 0.7 and 0.3 mm. A captive-looking screw sits in each gutter
      and a fourth before the uplinks.
  rows:
    confidence: photo-measured
    note: >-
      Jack openings read 69-86 and 97-114 px down a face that runs from 53 to 137, 84 px for the stated
      44.45 mm, so at 0.529 mm per px the rows centre 12.9 and 27.7 mm down: tops at 7.4 and 22.2 for
      an 11.0 part, a 14.8 step. The upper jacks show their keyways up and the lower their keyways down,
      the usual stacked mirror. The SFP+ openings centre 12.5 and 27.5, which is the registry's 15.0 belly-to-belly
      step, upper cage upright over the lower turned 180.
  port-order:
    confidence: photo-measured
    note: >-
      Each block prints twelve lamps in one row under its six columns, alternately an up and a down triangle,
      with a numeral under each running 1 to 12, 13 to 24 and so on. Two lamps per column, up then down,
      so the odd port is the upper jack. The four uplink lamps under the SFP+ cages run the same way with
      49 to 52 beneath them, on a row of their own that reads about a millimetre higher than the jack
      lamps' (centred 36.0 mm down against 37.1). SO A NUMERAL SITS UNDER ITS LAMP AND NOT UNDER ITS JACK:
      twelve lamps on a 5.8 mm step stand beneath six columns on a 13.97 step, and L61 reports the sixteen
      numerals that land within a millimetre or so of their jack's centre by accident. The legends printed
      ABOVE the jacks are not legible at this resolution and are a gap.
  lamps:
    confidence: datasheet
    note: >-
      Installation guide, Table 1-5 and Table 1-1. STATUS: green up and running, red system fault, flashing
      amber power-on self-test. Port LINK lamps: green link, amber disabled, blinking amber link fault.
      FAN: green tray OK, red a fan has failed. PS1 and PS2: green input power OK, red fault. The management
      lamp is the data sheet's "green (good), orange (disabled), or off (not connected)". Positions are
      Figure 1-7's callouts placed on the photograph: PS1, PS2 and FAN in a column at the right, MGT and
      STATUS on the bottom row with the recessed RESET beside STATUS.
  console-over-management:
    confidence: drawing
    note: >-
      Figure 1-1 points callout 5, the console port, at the upper jack of the stacked pair and callout
      3, the management port, at the lower; Figure 1-7 puts the MGT lamp under the stack. The management
      jack takes the bare part because its lamp is that one on the bottom row, not a pair in the bezel.
  rear-face:
    confidence: photo-measured
    note: >-
      The data sheet's Figure 2 at 1.919 px per mm. Supply 1 runs 8 to 230 px, the fan tray 232 to 598,
      supply 2 from 600 to 822, and a strip of bare chassis with an earth mark closes the face. The guide's
      Figure 1-2 names them in the same order: power supply 1 (primary), fan tray, power supply 2 (redundant).
  power:
    confidence: datasheet
    note: >-
      Data sheet Table 2: "Typical operating power 230W at 25C" and "Maximum power 275W at 55C"; Table
      1 calls the first "230W average". These are the switch's draw, ambient stated, configuration not.
      Heat is printed three ways and they are not one measure: the data sheet gives 1173 BTU per hour
      on AC input and 1251 on DC, and the guide's Table 1-2 gives 1364 BTU/hour "worst case". The guide's
      is carried, as the largest.
  interface-names:
    confidence: estimated
    note: >-
      NOT IN EITHER STAGED CISCO DOCUMENT. Searched the installation guide and the data sheet for GigabitEthernet,
      FastEthernet and their short forms and found nothing; port naming lives in the IOS configuration
      guides, which are not staged. The names are the NetBox devicetype-library device type for this model,
      a community file (netbox-community/devicetype-library, device-types/Cisco/WS-C4948E.yaml): GigabitEthernet1/1
      to 1/48, TenGigabitEthernet1/49 to 1/52 and FastEthernet1 for the management port. THAT FILE ALSO
      TYPES THE MANAGEMENT PORT 100BASE-TX, which its name suggests and Cisco's own documents contradict
      - the guide says "a 10/100/1000 RJ-45 port Ethernet Management port" and the data sheet "10/100/1000BASE-TX"
      - so the name is taken from it and the speed from Cisco. Estimated, because a community file is
      the only source for the names.
  colour:
    confidence: photo-measured
    note: >-
      The front face is the median of 2400 pixels of bare plate under the third block in the data sheet's
      Figure 1, #d3d4d1. The lamp strips are a pale yellow there; their value and the ink's are chosen
      by eye against the same photograph.
