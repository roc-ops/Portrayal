  platform: {processor: 1 GHz, memory: 1 GB SDRAM}
  features:
    optics-sfp-plus: >-
      data sheet: "supports 10 Gigabit Ethernet SFP and SFP+ on all the four uplinks". The installation
      guide's Table 1-1: 4 1-GB or 10-GB uplink ports, each needing an SFP or SFP+ transceiver.
  management: {reset: recessed on the front panel; needs a pointed object}
  compliance:
    regulatory: >-
      Products bear CE Marking, indicating compliance with the 89/336/EEC and 73/23/EEC directives
    safety: >-
      UL 60950-1, CAN/CSA-C22.2 No. 60950-1, EN 60950-1, IEC 60950-1, AS/NZS 60950, IEC 60825-1, IEC 60825-2,
