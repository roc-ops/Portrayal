    nebs: GR-63-Core NEBS Level 3, GR-1089-Core NEBS Level 3
    etsi: ETS 300 019 Storage Class 1.1, Transportation Class 2.3, Stationary Use Class 3.1
    rohs: RoHS-6 compliance
