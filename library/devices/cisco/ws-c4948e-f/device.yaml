interfaces:
- {physical: 'port-{n}', name: 'GigabitEthernet1/{n}', range: 1-48}
- {physical: 'port-{n}', name: 'TenGigabitEthernet1/{n}', range: 49-52}
- {physical: mgmt, name: FastEthernet1}
configurations:
  ac:
    kind: base
    description: >-
      Two PWR-C49E-300AC-F supplies and the WS-X4993-F fan tray - the switch as it runs, with every port
      empty
    default: true
  ac-ip-base:
    kind: orderable
    description: >-
      WS-C4948E-F-S, the build with an AC supply and the IP Base image. The bare chassis WS-C4948E-F ("no
      p/s") and the ten-unit bundle WS-C4948E-F-BDL are not configurations.
    part-numbers:
      WS-C4948E-F-S: {}
    bays: {psu-1: cisco/pwr-c49e-300ac-f@1, psu-2: cisco/pwr-c49e-300ac-f@1, fan-tray: cisco/ws-x4993-f@1}
  ac-ent-services:
    kind: orderable
    description: >-
      WS-C4948E-F-E, the build with an AC supply and the Enterprise Services image: the same hardware
      as WS-C4948E-F-S, a second software image and a second SKU.
    part-numbers:
      WS-C4948E-F-E: {}
    bays: {psu-1: cisco/pwr-c49e-300ac-f@1, psu-2: cisco/pwr-c49e-300ac-f@1, fan-tray: cisco/ws-x4993-f@1}
references:
- title: Catalyst 4948E and Catalyst 4948E-F Switch Installation Guide (OL-21561-02)
- title: Cisco Catalyst 4948E and 4948E-F Ethernet Switches Data Sheet (c78-598933)
- title: >-
    End-of-Sale and End-of-Life Announcement for the Cisco Catalyst 4948E Ethernet Switch (EOL11273)
