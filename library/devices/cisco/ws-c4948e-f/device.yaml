gaps:
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's Figures 1-1 and 1-2 show
    the lid and one side isometrically - a logo and labels on the lid, rotated 180 degrees and with airflow
    labels on the -F, bracket screw holes and small slots on the side - and the data sheet says the chassis
    has "no side or top venting". None can be measured. Each of the four carries an `empty:` sentence
    saying where I looked.
- what: legends-above-the-jacks
  scope:
  - front
  reason: needs-photo
  wanted: >-
    What is printed above each column of jacks and above the two SFP+ columns. The 4948E data sheet's
    front photograph shows a short legend over every column, about 2 mm tall, and at 1.86 px per mm it
    is a grey smudge. A front photograph at 5 px per mm settles it.
- what: front-of-the-4948e-f-itself
  scope:
  - front
  reason: needs-photo
  wanted: >-
    A photograph of this build's front. The data sheet's Figure 1 is the 4948E's and the guide's front
    figures are isometric drawings of both, so the front here is the 4948E's reading carried over and
    is `estimated`. A square-on photograph would confirm or correct it.
- what: end-label-text
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    What the yellow label at the right end of the rear says. It is a caution label and its text is a few
    pixels tall in the data sheet's Figure 3.
- what: blank-cover-face
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A picture of the blank power supply cover WS-X4994-F. The guide names it and its colour and draws
    it nowhere, so it is a plain plate.
- what: half-millimetre-positions
  scope:
  - front
  - rear
  reason: needs-drawing
  wanted: >-
    A mechanical drawing or a photograph at several pixels per millimetre. Every position on the front
    is the 4948E's, read at under 2 px per mm; every position on the rear is read along the width of a
    composite at 3.9 px per mm.
- what: fan-tray-power
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The fan tray's draw. Neither document gives a figure for WS-X4993-F apart from the switch.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band pair at the right of the front - an RJ-45 console port over a 10/100/1000 RJ-45
      Ethernet management port - and the recessed reset switch beside the status lamp. Two jobs, one purpose:
      reaching and restarting the switch when the data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        Data sheet Table 1, "Power redundancy: 1+1 AC or DC", and the guide's Figure 1-2, which names
        the two bays power supply 1 (primary) and power supply 2 (redundant). The -F takes only the AC
        supply.
  fans:
    term: Fan tray
    role: service
    index-origin: 1
    attrs:
      redundancy-note: >-
        One tray of four fans. The data sheet says the tray has "redundant fans" and the guide that the
        remaining fans speed up to compensate for one that fails; neither gives an N+1 form, so none is
        written here.
