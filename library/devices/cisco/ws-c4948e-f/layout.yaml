configurations:
  ac:
    kind: base
    description: >-
      Two PWR-C49E-300AC-F supplies and the WS-X4993-F fan tray - the switch as it runs, with
      every port empty
    default: true
  ac-ip-base:
    kind: orderable
    description: >-
      WS-C4948E-F-S, the build with an AC supply and the IP Base image. It seats one
      PWR-C49E-300AC-F in psu-1 and the blank WS-X4994-F over psu-2 (data sheet Table 5, "AC
      p/s", the second supply sold as PWR-C49E-300AC-F/2; guide Table 1-1, an empty bay takes
      WS-X4994-F). The bare chassis WS-C4948E-F ("no p/s") and the bundle WS-C4948E-F-BDL are
      not configurations.
    part-numbers:
      WS-C4948E-F-S: {}
    bays:
      psu-1: cisco/pwr-c49e-300ac-f@1
      psu-2: cisco/ws-x4994-f@1
      fan-tray: cisco/ws-x4993-f@1
  ac-ent-services:
    kind: orderable
    description: >-
      WS-C4948E-F-E, the build with an AC supply and the Enterprise Services image. The
      hardware is WS-C4948E-F-S's (one supply in psu-1, the blank WS-X4994-F over psu-2; data
      sheet Table 5, guide Table 1-1), with a second software image and a second SKU.
    part-numbers:
      WS-C4948E-F-E: {}
    bays:
      psu-1: cisco/pwr-c49e-300ac-f@1
      psu-2: cisco/ws-x4994-f@1
      fan-tray: cisco/ws-x4993-f@1
