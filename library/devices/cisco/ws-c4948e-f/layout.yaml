portfolio: {line: Catalyst, family: Catalyst 4900, series: Catalyst 4948E}
description: >-
  48x 10/100/1000 RJ-45 and 4x 1/10G SFP+ 1RU top-of-rack switch running Cisco IOS, the
  back-to-front build of the Catalyst 4948E. The front is the 4948E's: all fifty-two ports,
  the console and management jacks, the status lamps and the recessed reset switch. The
  rear is its own: two 300 W supply bays and one four-fan tray between them, all
  colour-coded blue, drawing air in at the rear and out at the ports. Ports number 1-52 and
  run DOWN each column - odd on the top row, even beneath it. Its front-to-back sibling,
  the WS-C4948E, takes different supplies and a different fan tray and is not this device.
  End-of-sale was announced in October 2016.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Three sources, none of them committed. (1) Catalyst 4948E and Catalyst 4948E-F Switch
      Installation Guide, OL-21561-02, 162 pages: Table 1-1 features, Table 1-2
      specifications, the fan tray and power supply rows of Table 1-1, Figures 1-2, 1-6 and
      3-1, Table 3-1 rack-mount kits, appendix A power supplies. (2) Cisco Catalyst 4948E and
      4948E-F Ethernet Switches Data Sheet, c78-598933, 9 pages: Table 1, Table 2, Table 4
      (regulatory compliance), Table 5 (ordering information: the SKUs, "AC p/s", "Not
      Available at this time" for DC, and the second supply sold as PWR-C49E-300AC-F/2) and
      Figure 3, a photograph of the back-to-front rear. (3) The 4948E model's own
      provenance (library device cisco/ws-c4948e), from which the front is carried. THE
      GUIDE'S OWN CHASSIS FIGURES ARE ISOMETRIC LINE DRAWINGS and gave callouts only. No
      vendor 3D model and no stencil render was found.
  the-front-is-the-4948es:
    confidence: estimated
    note: >-
      The front is cisco/ws-c4948e's, position for position. The data sheet says the two
      switches "include identical features except that the Cisco Catalyst 4948E offers
      front-to-back cooling, and the Cisco Catalyst 4948E-F offers back-to-front cooling",
      and the guide covers both in one document with one front figure (1-1, 1-7). It holds
      no photograph of the -F's front: the data sheet's Figure 1 is captioned "Cisco Catalyst
      4948E and 4948E-F Front Panel", presenting one front for both builds, but the unit
      photographed prints "Catalyst 4948E", and guide Figure 1-1 is captioned "(Catalyst
      4948E Switch Shown)". So the front is not a second reading; it is the 4948E's reading (the gate-1 measurement of
      its photograph, its four blocks, rows, port order, lamps and the console over the
      management port, in that device's provenance) applied to a face the guide says is the
      same, and every position on it is `estimated` here on that account. The one printed
      difference the guide names is on the lid, where "The Cisco logo that appears on the
      Catalyst 4948E-F chassis top cover is rotated 180 degrees" and labels there give the
      airflow direction; the lid is not drawn flat by any staged source.
  front-legend:
    confidence: estimated
    note: >-
      The model legend on the face, "Catalyst 4948E", is carried from a 4948E unit: it is what
      the data sheet's Figure 1 prints, and that figure is captioned as the front of both
      builds. No source shows the -F's own legend (see the gap front-of-the-4948e-f-itself),
      so the text is an estimate.
  gate-1:
    confidence: estimated
    note: >-
      The front passes no gate of its own - see above. The rear's source, data sheet Figure
      3, is a composite 1714 px across the chassis and 154 px tall: 11.1 against the stated
      444.4 / 44.45 = 10.0, 11% out, so its height cannot be measured and its width can.
      It is read at 3.857 px per mm from the stated width, and only along the width.
  the-width:
    confidence: datasheet
    note: >-
      17.5 in is 444.5 mm; the 4948E guide and data sheet print "1.75 x 17.5 x 19.4 in. (4.4
      x 44.4 x 49.3 cm)" for both switches. 444.4 x 44.45 x 492.8 is carried as on
      cisco/ws-c4948e: the metric width as printed, and the inch figures converted for
      height and depth. The rack-mount brackets are a separate part.
  rear-face:
    confidence: photo-measured
    note: >-
      Data sheet Figure 3, along its width only. Supply 1 runs from the left edge to 454 px
      (117.7 mm) from it, the fan tray to 1210 px (313.7 mm), supply 2 to 1657 px (429.6
      mm), and an end strip carrying a yellow label closes the face. The 4948E's bay
      footprints are carried (supplies 115.7 wide, tray 190.7), which the photograph
      matches to within the three pixels a blurred edge allows; the tray reads 196 mm
      against 190.7. The guide's Figure 1-2 names the bays in the same order: power supply 1
      (primary), fan tray, power supply 2 (redundant). The three modules are blue: "The fan
      tray for the Catalyst 4948E-F is color-coded blue", "The front panel on the power
      supply for the Catalyst 4948E-F is color-coded blue".
  end-label:
    confidence: photo-measured
    note: >-
      A yellow label stands on the end strip, from 429.4 to 440 mm along the width and about
      two thirds of the strip's height, with the ground symbol beneath it. Its text is not
      legible at the photograph's resolution, so it is drawn as a plain yellow patch without
      text; the median of 2560 pixels is #dbc64c. Its position down the face is a fraction of
      the photograph's height, since that axis is the one the composite distorts.
  power:
    confidence: datasheet
    note: >-
      As cisco/ws-c4948e: the data sheet's Table 2 "Typical operating power 230W at 25C" and
      "Maximum power 275W at 55C" and the guide's Table 1-2 heat of 1364 BTU per hour. These
      are the switch's draw and do not depend on the airflow build.
  lifecycle:
    confidence: estimated
    note: >-
      The end-of-sale and end-of-life dates and the announcement URL are carried from
      cisco/ws-c4948e's provenance. The notice itself (EOL11273) is not held, and its title
      names only the Catalyst 4948E Ethernet Switch, so whether it lists WS-C4948E-F has not
      been checked here.
  interface-names:
    confidence: estimated
    note: >-
      NOT IN EITHER STAGED CISCO DOCUMENT. As on cisco/ws-c4948e: GigabitEthernet1/1 to
      1/48, TenGigabitEthernet1/49 to 1/52 and FastEthernet1 for the management port, from
      the community NetBox device type for the 4948E, which this model's sibling shares.
  airflow:
    confidence: datasheet
    note: >-
      The guide says "The airflow in the Catalyst 4948E-F chassis is from back to front" and
      its Figure 1-6 draws it; the fan tray "draws in air through vents at the rear of the
      chassis and exhausts it through the front". The appendix gives the supply fan's
      direction in the supply's own frame, with its faceplate as its front: Table A-3, the -F
      supply's, says "Front to back" and Table A-1, the -R supply's, says "Back to front",
      under "Power supply fan". In the chassis frame those are back-to-front and
      front-to-back, which agree with Table 1-1, the figures and the data sheet.
      Back-to-front is carried.
  ears-and-kits:
    confidence: drawing
    note: >-
      Figure 3-1 draws the two rack-mount brackets bolted to the front sides of the chassis
      and, in its lower view, to the rear sides; "The rack-mount brackets can be installed
      either on the front sides of the chassis or on the rear sides". Neither position is
      dimensioned, so the positions are named and carry no `at`; the front is the one the
      guide installs first and the one the Panduit inlet duct needs, so it is the default.
      NO KIT IS LISTED, and that is a decision, not an omission. The standard kit 69-2037-xx
      "ships with the chassis as part of the accessory kit", and the guide gives a rack depth
      "at least 19.25 inches (48.9 cm) but not more than 32.5 inches (82.5 cm)" between the
      front and rear mounting strips: 488.95 to 825.5 mm. A `kind: kit` contract was written
      for it and withdrawn: it would be the library's first, and the census tests that walk
      every component contract (power roles for `class`, the cage census, the catalogue and
      the components index) do not yet take a contract that has no `class`. Making them take
      one is tool and test work outside this change. WS-X4948E-19CNTR= and WS-X4948E-23CNTR=
      (centre-mount kits for 19- and 23-inch racks, orderable) are named in Table 3-1 with no
      figure, depth or part count - their installation note is not staged. The cable
      management kit 69-1303-xx is not a rack kit, and the Panduit CDE2 inlet air duct is a
      third party's accessory for the -F alone.
