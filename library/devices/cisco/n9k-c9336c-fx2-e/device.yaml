configurations:
  ac-750w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-750W-PI supplies and six NXA-SFAN-35CFM-PI fan modules: port-side intake airflow, burgundy
      latches
    default: true
    part-numbers:
      N9K-C9336C-FX2-E: {part: N9K-C9336C-FX2-E}
  ac-750w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-750W-PE supplies and six NXA-SFAN-35CFM-PE fan modules: port-side exhaust airflow,
      blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C9336C-FX2-E: {part: N9K-C9336C-FX2-E}
    component-attrs:
      nxa-sfan-35cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-750w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  dc-1100w-port-side-intake:
    kind: orderable
    description: >-
