gaps:
- what: figure-spells-fc2-in-the-dimension-row
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The guide's Switch Dimensions row names the switch "N9336C-FC2-E". Every other row, the title and
    the kit table say FX2-E. The part number carried is N9K-C9336C-FX2-E.
  wanted: A corrected dimension row.
- what: chassis-lamp-legends-unread
  scope:
  - front
  reason: needs-photo
  wanted: >-
    A larger picture of the left end. The figure's callout 1 names "LEDs", draws four round lamps and
    prints no legend that can be read; appendix C names BCN, STS and ENV only. The fourth lamp is read
    as the lane lamp the twin guide describes.
- what: port-numerals-unread
  scope:
  - front
  reason: needs-photo
  wanted: >-
    A larger picture of the foot of the front. The figure prints two rows of small boxes under the cages
    that carry the port numbers, too small to read; the numbering is the library's convention (odd on
    the top row), not a reading.
- what: lane-button-art
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    A round push-button part about 6.5 mm across. The registry's reset button is a 4 mm pinhole and stands
    in for the lane select button.
- what: supply-1100w-ac-not-seated
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The guide lists a 1100 W AC supply (NXA-PAC-1100W-PE3, -PI3, -PE and -PI). cisco/nxa-pac-1100w@1 is
    drawn 84.7 mm wide from another guide's figure and this guide's supply bay is 56.0 mm wide; the bay
    would reserve less room than a module it accepts. The part is not accepted and no configuration seats
    it.
  wanted: >-
    A stated size for the 1100 W AC supply, and a new version of cisco/nxa-pac-1100w if it is 56 mm wide
    here.
- what: nxa-fan-35cfm-not-seated
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The guide lists the NXA-FAN-35CFM and the NXA-SFAN-35CFM. The bay is sized to the figure and to cisco/nxa-sfan-35cfm@1
    (40.8 by 40.7); cisco/nxa-fan-35cfm@1 is 39.9 by 39.3, from another guide's figure, and one module
    may not be reserved two bay sizes. Only the SFAN is accepted.
  wanted: A stated size for each fan module.
- what: supply-weights-not-given
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The weights table gives 2.1 lb (0.95 kg) for the 750 W AC supply and one row, 2.36 lb (1.07 kg), for
    six 1100 W supplies, AC and DC. No weight is carried for the 1100 W DC supply.
  wanted: The weight of the NXA-PDC-1100W.
- what: other-supplies-have-no-picture
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A picture of the 750 W supply by its rating and of the 1100 W DC supply. The guide's figure shows
    AC supplies and does not say the rating; the 750 W AC supply takes the figure and the 1100 W DC supply
    is drawn from it with a plain recess for the inlet.
- what: kit-contents-and-n3k-kit
  scope:
  - front
  reason: vendor-silent
  note: >-
    The guide's installation options name "Rack-mount kit (N3K-C3064-ACC-KIT) which you can order from
    Cisco" and say nothing else of it, and its airflow sleeve (N9K-AIRFLOW-SLV) is "only compatible with"
    it. The sleeve's rail depth table (806.90 to 898.70 mm for this switch) is the sleeve's and not the
    kit's. Appendix D lists the NXK-ACC-KIT-1RU: two front brackets, two rear brackets, two slider rails
    and ten M4 screws, and a ground lug kit.
  wanted: >-
    The N3K-C3064-ACC-KIT's contents and its rack depth range. It is not listed under the kits of this
    device, because a kit needs parts and a range.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The guide's three-quarter view (art number
    503530) shows the lid with its SSD cover and one side wall with six screw holes for mounting brackets
    and a grounding pad; none is flat and none can be measured.
- what: rear-legends-unread
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A larger picture of the rear. The figure prints legends on the supplies, the fan modules and beside
    the jacks; at 2.9 px per mm none can be read.
- what: fan-redundancy
  scope:
  - fans
  reason: vendor-silent
  note: >-
    The Overview says each fan module has two rotors and the switch works with one rotor failed in any
    one module; with more than one rotor failed it warns and powers down in two minutes. It states no
    count of modules that may fail.
  wanted: How many of the six modules the switch survives losing. No redundancy is claimed.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block between the fan modules and the second supply: an RJ-45 console port, an RJ-45
      and an SFP management port and a USB port. Three media, one purpose: reaching the switch when the
      data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        installation guide: "Power supply modules (two-One for operations and one for redundancy [1+1])".
        Slot 1 is on the left and slot 2 on the right.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy-note: >-
        Installation guide, Overview: six fan modules of two rotors each; the switch works with one rotor
        failed in any one module. It states no module count that may fail, so none is claimed.
