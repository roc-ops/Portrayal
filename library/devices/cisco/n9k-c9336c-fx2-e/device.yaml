format: 1
kind: device
name: n9k-c9336c-fx2-e
version: 1.0.2
maturity: modelled
manufacturer: Cisco
model: N9K-C9336C-FX2-E
aliases:
- {name: Nexus 9336C-FX2-E, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX2}
description: >-
  36x 40/100G QSFP28 1RU data-centre leaf switch running NX-OS. The port side carries the thirty-six cages
  in two rows of eighteen, four lamps and a lane select button. The other side carries six fan modules,
  the console, an RJ-45 and an SFP management port, the USB port and two power supplies. Ships port-side
  intake (burgundy modules) or port-side exhaust (blue). A device of its own, not a configuration of the
  N9K-C9336C-FX2: its guide draws six fan modules where the other draws three.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco N9336C-FX2-E
      NX-OS Mode Switch Hardware Installation Guide, First Published 2021-02-16, Last Modified 2026-07-27,
      66 pages: the overview and its flat front figure (art number 503528, PDF page 8, printed 2), flat
      rear figure (503529, PDF page 9, printed 3) and three-quarter view (503530), appendix B specifications
      (PDF page 55, printed 49), appendix C LEDs, appendix D kits. NO DATA SHEET, PHOTOGRAPH, 3D MODEL
      OR STENCIL IS HELD for this model (the Nexus 9300-FX2 Series data sheet is not in the intake), and
      the NetBox devicetype-library is held as a path listing only: it names no device type for this model
      and no file was read. The Cisco N9336C-FX2 guide (a twin, 2018-03-12, last modified 2026-07-16)
      was read for the decision below and for the callouts it prints; none of its figures, which are three-quarter
      views only, is drawn from. THE FX2-E IS A DEVICE OF ITS OWN: its rear figure draws six fan modules
      and the twin's text says three fan modules, its supplies sit at both ends of the rear in a 56 mm
      bay where the twin's guide gives no flat figure to compare, and the two guides pair different fans
      with their chassis (NXA-FAN-35CFM and NXA-SFAN-35CFM here, NXA-FAN-65CFM and NXA-SFAN-65CFM there).
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its two end lines, is about 1269 px across and 126.5 px down: aspect
      10.03 against the guide's 17.3 x 1.72 in, 10.06, so 0.3% out, and it can be measured; 2.888 px per
      mm. The rear figure's body is 1274 px across and 126 px down: aspect 10.1, 0.5% out; 2.899 px per
      mm. A repeated feature checks the scale: the supply and fan modules fill the width, 2 x 56.0 + 6
      x 45.4 + the out-of-band block, 439 mm.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure at 2.888 px per mm, origin the left end line. Eighteen stacked cage pairs:
      the first cage's outline starts at 18.7 mm and the last at 411.0, a pitch of 23.08 mm; each outline
      is 20.7 mm wide, so the registry's 20.0 mm opening is centred in it (x 19.05). The four lamps stand
      12.4 mm from the end line and the lane select button is centred there.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top line. The upper cage opening starts 9.5 mm down and the lower
      26.7 mm, a row pitch of 17.2 mm; the strip between the two cages carries the printed arrows and
      four lane windows, centred at 22.7 mm. The lamps stand at 12.2, 16.3, 20.4 and 24.2 mm and the button's
      centre at 31.0 mm, 6.5 mm across.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table (PDF page 55, printed 49): "17.3 inches (43.9 cm)" wide, "24.7
      inches (62.7 cm)" deep, "1.72 inches (4.4 cm) (1 RU)" high; the figures are carried as inches converted.
      THE DEPTH COLUMN IS HEADED "Depth" ONLY: it states no inclusion. The twin guide heads its column
      "Depth with Handles" and prints 24.5 in (62.3 cm); the 0.2 in difference is declared, not explained,
      and the twin's figure is not applied to this model. 627.4 mm is carried as the chassis depth because
      it is the only figure the FX2-E guide prints; whether it counts the module handles is not said.
      THE DIMENSION ROW NAMES THE SWITCH "N9336C-FC2-E" (a typo for FX2; the weights, power and kit rows
      say N9K-C9336C-FX2-E). The part number carried is N9K-C9336C-FX2-E and the guide's spelling is declared
      here and not carried. The weights table gives the chassis 18.8 lb (8.5 kg); 8.5 kg is carried.
  port-order:
    confidence: estimated
    note: >-
      The figure prints numbers in boxes along the foot of the face, two rows of small boxes too small
      to read. Ports number 1-36, as the guide's text says ("36 40/100-Gigabit QSFP28 ports"; "Fiber Channel
      (FC) transceivers are supported on ports 9-36 only"), and run down each column, odd on the top row,
      which is the library's convention for a stacked pair and the way the 93180YC-FX3 prints its uplinks;
      THE FIGURE DOES NOT SHOW IT. Port numbers are as printed; the NX-OS interface names are not in the
      guide.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down to the nearest
      port." Green is admin up, module present and link up; amber is admin down or module absent; off
      is up and present but no link. The figure draws an up triangle and a down triangle at the ends of
      the strip between each stacked pair, with four small windows between them; the windows are drawn
      nowhere and carry no state.
  chassis-lamps:
    confidence: estimated
    note: >-
      Callout 1 is "LEDs" and the figure draws FOUR round lamps in a column at the left end, and below
      them a ring that is callout 2, the lane select button. Appendix C lists three chassis lamps, BCN,
      STS and ENV, "located on the left side of the front of the switch", and a lane link LED text exists
      in the twin guide only. The first three lamps are named for the table's three, in the table's order,
      top to bottom, and the fourth is the lane lamp: THE FIGURE PRINTS NO LEGEND THAT CAN BE READ and
      the order is a reading, not a printed fact. The figure's small marks at the logo's place are not
      drawn: the library's practice for a Cisco face is no logo artwork.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the module side is read off the rear figure (1274 px across, 2.899 px per mm).
      Supply 1, six fan modules numbered 1 (left) to 6 (right), then the out-of-band block (the console
      jack over the RJ-45 management jack, the SFP management port, the USB port) and supply 2: callouts
      3, 4, 5 and 6 and the guide's rule that slots are "numbered 1 (left) and 2 (right)". The out-of-band
      block sits between the fans and supply 2. The fan frame reads about 41.4 mm across and 40.7 down,
      and each bay reserves 40.8 by 40.7, the size of cisco/nxa-sfan-35cfm@1. The supply frame reads 55.9
      by 41.0 mm and each supply bay reserves 56.0 by 41.0. The figure's printed legends, the two small
      lamp boxes under the jacks and the ground screw are not readable beyond the screw, which is placed.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements: typical 321 W and maximum 702 W "(AC or DC)", 2395.323
      BTU per hour. The figures are the switch's draw and not a supply rating; the guide notes that optics
      of 5 W or more on all 36 ports need the 1100 W supplies. No held document prints a draw for one
      fan module (cisco/nxa-sfan-35cfm) or splits the switch's draw; none is derived by dividing it.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the value the
      93180YC-EX's stencil sample gave, carried across as a family colour.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's NXK-ACC-KIT-1RU procedure (PDF page 28, printed 22) says the holes used depend on the
      rack and on the clearance needed for interface cables, 3 inches minimum, and for module handles,
      1 inch minimum, and its figure shows two ways to mount the brackets. None dimensions a position
      and none says which the box ships with, so the two positions are written without an `at`, named
      for what the text says they clear, and none is the default.
attrs:
  physical:
    weight-note: >-
      18.8 lb (8.5 kg) chassis. Fan module 0.26 lb (0.12 kg). 750 W supply 2.1 lb (0.95 kg); the 1100
      W supplies 2.36 lb (1.07 kg) in one row.
  power: {power-typical-w: 321, power-max-w: 702, power-envelope: unstated, heat-dissipation-btu-hr: 2395,
    power-input-ac: '100 to 240 V, 50 to 60 Hz (750 W)', power-input-dc: -48 to -60 V (1100 W), power-supply-options: 750W
      AC or 1100W DC (two)}
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: '5
      to 90% operating, 5 to 95% non-operating', altitude: '13,123 ft (4000 m) operating'}
  features:
    optics-qsfp28: 'guide: "36 40/100-Gigabit QSFP28 ports"'
    management-ports: 'guide: "Two management ports (one 10/100/1000BASE-T port and one SFP port)"'
  management: {usb: 1 USB port}
