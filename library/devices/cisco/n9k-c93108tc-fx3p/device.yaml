gaps:
- what: fx3h-has-no-table-row
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The guide's overview opens "The Cisco N9K-C93108TC-FX3P, N9K-C93108TC-FX3H switch", but its dimension,
    weight and power rows name the FX3P only, and its figures carry no model name. The FX3H configurations
    carry the FX3P's figures; what the FX3H adds is not stated.
  wanted: >-
    A dimension, weight and power row for the N93108TC-FX3H, and the difference from the FX3P.
- what: p-lamp-undocumented
  scope:
  - front
  reason: vendor-silent
  note: >-
    The figure's callout 1 names a P lamp beside BCN, STS and ENV, and appendix C's chassis LED table
    does not list it. It is read as the PoE lamp from the overview's "PoE is supported on ports 1-48"
    and is given a single lit state.
  wanted: The P lamp's colours and meanings.
- what: rear-legends-unread
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A larger picture of the rear. The figure draws a column of small printed legends between the USB port
    and supply 1, and legends on the supplies and fan modules; at 1.58 px per mm none can be read.
- what: kit-contents-and-n3k-kit
  scope:
  - front
  reason: vendor-silent
  note: >-
    The guide's installation options name "Rack-mount kit (N3K-C3064-ACC-KIT) which you can order from
    Cisco" and say nothing else of it, and its airflow sleeve (N9K-AIRFLOW-SLV) is "only compatible with"
    it. Its appendix D lists the NXK-ACC-KIT-1RU: two front brackets, two rear brackets, two slider rails
    and ten M4 screws, and a ground lug kit.
  wanted: >-
    The N3K-C3064-ACC-KIT's contents and its rack depth range. It is not listed under the kits of this
    device, because a kit needs parts and a range.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The guide's overview shows one side wall
    in three-quarter view (art number 502827) and calls out three screw holes for mounting brackets and
    a grounding pad; none is flat and none can be measured.
- what: other-supplies-have-no-picture
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A picture of the 1900 W AC and the 715 W DC supply. The guide's figure shows AC supplies only, and
    does not say the rating. Their faces are the 1100 W supply's.
- what: sizes-off-a-figure
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A stated size for the supplies and the fan module. The guide gives "Form factor RSP1" for the 715
    W and 1100 W supplies and nothing for the fan.
- what: management-sfp-bail
  scope:
  - rear
  reason: needs-drawing
  wanted: A cage skin with a bail. The library's SFP cage has one skin and none shows a bail.
- what: fan-redundancy
  scope:
  - fans
  reason: vendor-silent
  note: >-
    The Overview says the switch "runs with +1 redundancy mode" and "if a 2nd fan fails, this switch is
    not designed to sustain operation".
  wanted: >-
    Whether the sentence counts fan modules or rotors. It is read as modules, three of four, so the group
    says 3+1.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g, poe: true}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block between the fan modules and the supplies: an RJ-45 console port, an RJ-45
      and an SFP management port and a USB port. Three media, one purpose: reaching the switch when the
      data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        installation guide: "Power supply modules (two-One for operations and one for redundancy [1+1])".
        Slot 1 is on the left and slot 2 on the right.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 3+1
      redundancy-note: >-
        Installation guide, Overview: four fan modules of two rotors each. The switch "runs with +1 redundancy
        mode" and powers down on a second fan failure. It works with one rotor failed in any one module
        and, with more than one rotor failed, warns and powers down in two minutes.
