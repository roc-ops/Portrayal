format: 1
kind: device
name: n9k-c93108tc-fx3p
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: N9K-C93108TC-FX3P
aliases:
- {name: Nexus 93108TC-FX3P, kind: marketing}
- {name: Nexus 93108TC-FX3H, kind: marketing, note: 'a configuration of this device; the guide gives it no front or rear figure of its own'}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX3}
description: >-
  48x 100M/1G/2.5G/5G/10GBASE-T (PoE) and 6x 40/100G QSFP28 1RU data-centre leaf switch running
  NX-OS. The port side carries all fifty-four ports and the BCN, STS, ENV and P lamps. The other
  side carries four fan modules, the console, an RJ-45 and an SFP management port, the USB port
  and two power supplies. Ports number 1-54 and run DOWN each column, odd on the top row. Ships
  port-side intake (burgundy modules) or port-side exhaust (blue). The N9K-C93108TC-FX3H is
  listed as configurations.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco
      N93108TC-FX3P NX-OS Mode Switch Hardware Installation Guide, First Published 2020-07-14,
      Last Modified 2026-07-16, 64 pages: the overview and its figures (art numbers 502825 and
      502826 and a three-quarter view), appendix B specifications, appendix C LEDs, appendix D
      kits. THE FRONT FIGURE WAS DROPPED BY THE PDF CONVERSION as a banner and is read from the
      PDF itself (page 8): it is a 710 px bitmap across the whole switch, about 1.58 px per mm,
      so every position here is a reading good to about a millimetre. NO DATA SHEET,
      PHOTOGRAPH, 3D MODEL OR STENCIL IS HELD for this model, and the NetBox devicetype-library
      is held as a path listing only: it names a device type and a front elevation for this
      model, and no file was read. The 93108TC-FX3 device was read for the jacks, cages and
      lamps this one shares.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's convention: the upper cage upright over the lower turned 180, and the upper
      jack turned 180 over the lower one. The front figure draws the upper jacks with their
      latch notch up and the lower jacks with the notch down, which is that arrangement. The
      three QSFP28 pairs follow the same rule.
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its two end lines, is about 690 px across and 68.5 px
      down: aspect 10.07 against the guide's 17.2 x 1.72 in, 10.0, so 0.7% out, and it can be
      measured; 1.58 px per mm. A repeated feature checks the scale: the jack columns step
      21.8 px, 13.8 mm, against the registry's 13.97 (1.2% out), so every pitch is the
      registry's and the figure fixes where each group starts.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure at 1.58 px per mm, origin the left end line. FOUR boxed groups of six
      jack columns: the boxes start at 9.5, 99.7, 189.9 and 280.1 mm, a stride of 90.2, and the
      jacks stand 2.8 mm inside each box, so the columns start at 12.3, 102.5, 192.7 and 282.9
      mm. At the registry's 13.97 mm pitch the stride is a gutter of 6.4 mm. The 93108TC-FX3 has
      three groups of eight and this switch does not. The three QSFP28 cages start at 368.3,
      390.6 and 412.9 mm, the 93108TC-FX3's: the figure reads 368.7, 390.6 and 412.6. The
      figure was laid over the render at matched scale (Gate 5) and the jack columns, the group
      boxes, the lamps and the cages fall within a pixel, 0.6 mm, of each other.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top line. The upper jack's centre is at 15.4 mm and the
      lower jack's at 30.0, a 14.6 mm row pitch; the 9348GC-FX3 guide's figure, which is a clean
      4 px per mm drawing of the same jack rows, gives the same 14.6 (the 93108TC-FX3 batch
      carries 15.6 for its own figure). With the registry's 11.0 high cell the upper jack runs
      9.9 to 20.9 mm. THE PORT LAMPS ARE SMALL RECTANGLES BELOW THE JACKS, one under each port,
      4.4 by 2.7 mm in the figure, so common/led-rect@1 (4.6 x 2.6); two to a column, the left
      one for the upper port, at 38.8 mm. The numerals and a pair of arrows stand above them at
      about 37 mm.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table: "17.2 inches (43.68 cm)" wide, "1.72 inches (4.37
      cm) (1 RU)" high, and for depth "Without fans or PSUs - 18 inches (45.73 cm) With fans -
      19.4 inches (49.28 cm) With PSUs - 21.1 inches (53.47 cm)". The chassis depth carried is
      the first, 457.3 mm: the library's depth is the chassis, and the other two include the
      modules. The weights table gives the chassis "Without fans or PSUs - 16 lb (7.26 kg) With
      fans and PSUs - 23 lb (10.43 kg)"; 7.26 kg is carried. The table lists the FX3P only;
      the FX3H is not given a row.
  port-order:
    confidence: estimated
    note: >-
      The figure prints a numeral above each lamp, in pairs, and "49 up down 50", "51 ..." and
      "53 ..." under the QSFP28 cages, so the odd port is the upper cage or jack. THE 710 PX
      BITMAP IS TOO SMALL TO READ THE COPPER NUMERALS: the pairs are written "1 up down 2" to "47
      up down 48" as the 9348GC-FX3 guide's clean figure prints them, and the figure shows a
      mark of the same width between the numerals. The guide's text gives the ports as 1-48 and
      49-54. Port numbers are as printed; the NX-OS interface names are not in the guide.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down to
      the nearest port." Green is admin up, module present and link up; amber is admin down or
      module absent; off is up and present but no link. The triangles are the printed arrows
      beside the numerals; THE FRONT FIGURE DRAWS THE COPPER LAMPS AS RECTANGLES (see the y
      axis), and draws an up triangle and a down triangle at the ends of each QSFP28 band with
      four small windows between them; the windows are drawn as marks and carry no state.
  chassis-lamps:
    confidence: estimated
    note: >-
      Callout 1 is "BCN, STS, ENV, and P LEDs". The figure draws four round lamps in a column at
      the left end, 6.7 mm in, at 16.6, 20.1, 24.0 and 28.0 mm down, each with a legend to its
      left. The legends are too small to read in the bitmap and are written in the callout's
      order, top to bottom. The P lamp is not in appendix C (see the gaps). The figure prints
      small marks above the column, at the logo's place; none is drawn, as the library's
      practice for a Cisco face is no logo artwork. A line of small text stands under the
      QSFP28 cages, 18 mm long and too small to read; it is written as the model legend the
      9348GC-FX3 guide's figure prints, CISCO NEXUS and the part number, right-aligned to the
      cages. The reading of the text is an estimate.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the module side is read off the rear figure (708 px across, 1.58 px per
      mm). Four fan modules, then the console jack over the RJ-45 management jack, the SFP
      management port, the USB port, and supply 1 and supply 2. THE OUT-OF-BAND BLOCK SITS
      BETWEEN THE FANS AND THE SUPPLIES, as on the 93180YC-EX and not as on the 93108TC-FX3.
      Two lamps with a screw between them stand under the jacks. The figure draws a column of
      small printed legends between the USB port and supply 1; they cannot be read and are not
      carried. The management SFP cage is the registry's plain one. The fan frame reads about
      40.6 mm across in the figure; each fan bay reserves 39.9 by 39.3, the size of
      cisco/nxa-fan-35cfm@1 in the 93180YC-FX3 (one module, one bay size), centred on the frame.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements: typical 500 W and maximum 600 W "(AC or DC)",
      2047.285 BTU per hour. The figures are the switch's draw and not a supply rating; the
      guide names no configuration or ambient, and notes that optics of 5 W or more on all 36
      ports need the 1100 W supplies.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the
      value the 93180YC-EX's stencil sample gave, carried across as a family colour.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's NXK-ACC-KIT-1RU procedure says the holes used depend on the rack and on the
      clearance needed for interface cables, 3 inches minimum, and for module handles, 1 inch
      minimum, and its figure shows two ways to mount the brackets. None dimensions a position
      and none says which the box ships with, so the two positions are written without an `at`,
      named for what the text says they clear, and none is the default.
