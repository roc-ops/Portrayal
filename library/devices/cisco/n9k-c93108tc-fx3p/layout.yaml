    optics-qsfp28: 'guide: "6 40/100-Gigabit ports QSFP28 (ports 49-54)"'
    poe: 'guide: "PoE is supported on ports 1-48."'
    management-ports: 'guide: "Two management ports (one 10/100/1000BASE-T port and one SFP port)"'
