configurations:
  ac-1100w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-1100W-PI supplies and four NXA-FAN-35CFM-PI fan modules: port-side intake
      airflow, burgundy latches
    default: true
    part-numbers:
      N9K-C93108TC-FX3P: {part: N9K-C93108TC-FX3P}
  ac-1100w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-1100W-PE supplies and four NXA-FAN-35CFM-PE fan modules: port-side exhaust
      airflow, blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C93108TC-FX3P: {part: N9K-C93108TC-FX3P}
    component-attrs:
      nxa-fan-35cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-1100w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  ac-1900w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PAC-1900W-PI supplies and four NXA-FAN-35CFM-PI fan modules: port-side intake
      airflow, burgundy latches. The guide lists no port-side exhaust 1900 W supply.
    part-numbers:
      N9K-C93108TC-FX3P: {part: N9K-C93108TC-FX3P}
    bays:
      psu-1: cisco/nxa-pac-1900w@1
      psu-2: cisco/nxa-pac-1900w@1
  dc-715w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PDC-715W-PI DC supplies and four NXA-FAN-35CFM-PI fan modules: port-side intake
      airflow, burgundy latches. The guide lists no port-side exhaust 715 W supply.
    power: dc
    part-numbers:
      N9K-C93108TC-FX3P: {part: N9K-C93108TC-FX3P}
    bays:
      psu-1: cisco/nxa-pdc-715w@1
      psu-2: cisco/nxa-pdc-715w@1
  fx3h-ac-1100w-port-side-intake:
    kind: orderable
    description: >-
      N9K-C93108TC-FX3H with dual NXA-PAC-1100W-PI supplies and four NXA-FAN-35CFM-PI fan
      modules: port-side intake airflow
    part-numbers:
      N9K-C93108TC-FX3H: {part: N9K-C93108TC-FX3H}
  fx3h-ac-1100w-port-side-exhaust:
    kind: orderable
    description: >-
      N9K-C93108TC-FX3H with dual NXA-PAC-1100W-PE supplies and four NXA-FAN-35CFM-PE fan
      modules: port-side exhaust airflow
    airflow: back-to-front
    part-numbers:
      N9K-C93108TC-FX3H: {part: N9K-C93108TC-FX3H}
    component-attrs:
      nxa-fan-35cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-1100w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  fx3h-ac-1900w-port-side-intake:
    kind: orderable
    description: >-
      N9K-C93108TC-FX3H with dual NXA-PAC-1900W-PI supplies and four NXA-FAN-35CFM-PI fan
      modules: port-side intake airflow
    part-numbers:
      N9K-C93108TC-FX3H: {part: N9K-C93108TC-FX3H}
    bays:
      psu-1: cisco/nxa-pac-1900w@1
      psu-2: cisco/nxa-pac-1900w@1
  fx3h-dc-715w-port-side-intake:
