  power:
    power-typical-w: 500
    power-max-w: 600
    power-envelope: unstated
    heat-dissipation-btu-hr: 2047
    power-input-ac: '100 to 240 V, 50 to 60 Hz (1100 W); 115 to 120 V or 200 to 240 V (1900 W)'
    power-input-dc: '-48 to -60 V nominal (715 W)'
    power-supply-options: '1100W AC, 1900W AC or 715W DC (two)'
  environmental:
