configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      derived - Cisco publishes no bundle for the Nexus 9504 in the guide, so the library defines one from the
      guide's own power-budget example (Planning for Power Requirements, Step 1, PDF p21, printed 15: two
      supervisor B, two N9K-SC-A system controllers, four line cards, six fabric modules at 504 W, the
      N9K-C9504-FM-G's maximum, and three fan trays at 600 W, the N9K-C9504-FAN2's maximum, 9,256 W in all):
      those parts in their slots, six N9K-C9504-FM-G in FM 1 to FM 6, three N9K-C9504-FAN2, and a line-card
      blank in each of the four line-card slots. The example's 9,256 W over 3,000 W (Step 2) needs four
      supplies, and the supply type is the library's choice: four N9K-PAC-3000W-B in PS 1 to PS 4. The example
      names no supply and no line-card blank (it counts four 1050 W line cards).
    description: >-
      Chassis with the common equipment seated: both supervisors and system controllers, three fan trays, six
      fabric modules, four 3 kW AC supplies and four line-card blanks.
    part-numbers:
      N9K-C9504: {}
    bays:
      lc-1: cisco/n9k-c9500-lc-cv@1
      lc-2: cisco/n9k-c9500-lc-cv@1
      lc-3: cisco/n9k-c9500-lc-cv@1
      lc-4: cisco/n9k-c9500-lc-cv@1
  psu-universal:
    kind: example
    power: [ac, hvdc]
    description: >-
      The base with four N9K-PUV-3000W-B universal AC/DC supplies in PS 1 to PS 4. An illustration: the guide
      prints no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-puv-3000w-b@1
      ps-2: cisco/n9k-puv-3000w-b@1
      ps-3: cisco/n9k-puv-3000w-b@1
      ps-4: cisco/n9k-puv-3000w-b@1
  psu-dual-input:
    kind: example
    power: [ac, hvdc]
    description: >-
      The base with four N9K-PUV2-3000W-B dual-input universal AC/DC supplies in PS 1 to PS 4. An
      illustration: the guide prints no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-puv2-3000w-b@1
      ps-2: cisco/n9k-puv2-3000w-b@1
      ps-3: cisco/n9k-puv2-3000w-b@1
      ps-4: cisco/n9k-puv2-3000w-b@1
  psu-dc:
    kind: example
    power: dc
    description: >-
      The base with four N9K-PDC-3000W-B -48 V DC supplies in PS 1 to PS 4. An illustration: the guide prints
      no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-pdc-3000w-b@1
      ps-2: cisco/n9k-pdc-3000w-b@1
      ps-3: cisco/n9k-pdc-3000w-b@1
      ps-4: cisco/n9k-pdc-3000w-b@1
  fabric-g-five:
    kind: example
    description: >-
      Five N9K-C9504-FM-G fabric modules in FM 2 to FM 6 and an N9K-C9504-FAN-PWR card in FM 1, with three
      N9K-C9504-FAN2 trays, as the guide's note under Table 1 pairs them. An illustration: the guide prints no
      ordering code for it.
    bays:
      fm-1: cisco/n9k-c9504-fan-pwr@1
  fabric-e:
    kind: example
    description: >-
      Five N9K-C9504-FM-E fabric modules in FM 2 to FM 6 (the guide says five FM-E must be in those slots),
      the N9K-C9504-FM-CV blank in FM 1 and three N9K-C9504-FAN trays. An illustration: the guide prints no
      ordering code for it.
    bays:
      fan-1: cisco/n9k-c9504-fan@1
      fan-2: cisco/n9k-c9504-fan@1
      fan-3: cisco/n9k-c9504-fan@1
      fm-1: cisco/n9k-c9504-fm-cv@1
      fm-2: cisco/n9k-c9504-fm-e@1
      fm-3: cisco/n9k-c9504-fm-e@1
      fm-4: cisco/n9k-c9504-fm-e@1
      fm-5: cisco/n9k-c9504-fm-e@1
      fm-6: cisco/n9k-c9504-fm-e@1
  empty:
    kind: example
    description: >-
      The chassis with every supervisor, system-controller, fan-tray and fabric-module bay empty, a blank over
      each power-supply slot and a line-card blank in each line-card slot. An illustration of what the bays
      look like with nothing seated.
    bays:
      sup-1: ''
      sup-2: ''
      sc-1: ''
      sc-2: ''
      ps-1: cisco/n9k-psu-blank@1
      ps-2: cisco/n9k-psu-blank@1
      ps-3: cisco/n9k-psu-blank@1
      ps-4: cisco/n9k-psu-blank@1
      fan-1: ''
      fan-2: ''
      fan-3: ''
      fm-1: ''
      fm-2: ''
      fm-3: ''
      fm-4: ''
      fm-5: ''
      fm-6: ''
