configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      derived - Cisco publishes no bundle for the Nexus 9516 in the guide, so the library defines one from the
      guide's own power-budget example (Planning for Power Requirements, Step 1, PDF p20, printed 14: two
      supervisor A, two N9K-SC-A system controllers, sixteen line cards, six fabric modules at 504 W, the
      N9K-C9516-FM's maximum, and three fan trays, 13,227 W in all): those parts in their slots, six
      N9K-C9516-FM in FM 1 to FM 6, three N9K-C9516-FAN, and a line-card blank in each of the sixteen
      line-card slots. Step 2 of the example says the load needs five supplies (13,224 W over 3,000 W is
      4.41, rounded up to five; the same sentence also says "rounded up to three", a slip), and the supply
      type is the library's choice: five N9K-PAC-3000W-B in PS 1 to PS 5 (grid A), with a blank over each
      other supply slot. The example names no supply and no line-card blank.
    description: >-
      Chassis with the common equipment seated: both supervisors and system controllers, three fan trays, six
      fabric modules, five 3 kW AC supplies with a blank over each of the other five slots, and sixteen
      line-card blanks.
    part-numbers:
      N9K-C9516: {}
    bays:
      lc-1: cisco/n9k-c9500-lc-cv@1
      lc-2: cisco/n9k-c9500-lc-cv@1
      lc-3: cisco/n9k-c9500-lc-cv@1
      lc-4: cisco/n9k-c9500-lc-cv@1
      lc-5: cisco/n9k-c9500-lc-cv@1
      lc-6: cisco/n9k-c9500-lc-cv@1
      lc-7: cisco/n9k-c9500-lc-cv@1
      lc-8: cisco/n9k-c9500-lc-cv@1
      lc-9: cisco/n9k-c9500-lc-cv@1
      lc-10: cisco/n9k-c9500-lc-cv@1
      lc-11: cisco/n9k-c9500-lc-cv@1
      lc-12: cisco/n9k-c9500-lc-cv@1
      lc-13: cisco/n9k-c9500-lc-cv@1
      lc-14: cisco/n9k-c9500-lc-cv@1
      lc-15: cisco/n9k-c9500-lc-cv@1
      lc-16: cisco/n9k-c9500-lc-cv@1
  psu-universal:
    kind: example
    power: [ac, hvdc]
    description: >-
      The base with five N9K-PUV-3000W-B universal AC/DC supplies in PS 1 to PS 5. An illustration: the guide
      prints no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-puv-3000w-b@1
      ps-2: cisco/n9k-puv-3000w-b@1
      ps-3: cisco/n9k-puv-3000w-b@1
      ps-4: cisco/n9k-puv-3000w-b@1
      ps-5: cisco/n9k-puv-3000w-b@1
  psu-dual-input:
    kind: example
    power: [ac, hvdc]
    description: >-
      The base with five N9K-PUV2-3000W-B dual-input universal AC/DC supplies in PS 1 to PS 5. An
      illustration: the guide prints no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-puv2-3000w-b@1
      ps-2: cisco/n9k-puv2-3000w-b@1
      ps-3: cisco/n9k-puv2-3000w-b@1
      ps-4: cisco/n9k-puv2-3000w-b@1
      ps-5: cisco/n9k-puv2-3000w-b@1
  psu-dc:
    kind: example
    power: dc
    description: >-
      The base with five N9K-PDC-3000W-B -48 V DC supplies in PS 1 to PS 5. An illustration: the guide prints
      no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-pdc-3000w-b@1
      ps-2: cisco/n9k-pdc-3000w-b@1
      ps-3: cisco/n9k-pdc-3000w-b@1
      ps-4: cisco/n9k-pdc-3000w-b@1
      ps-5: cisco/n9k-pdc-3000w-b@1
  fabric-e:
    kind: example
    description: >-
      Five N9K-C9516-FM-E fabric modules in FM 2 to FM 6 (the guide says five FM-E must be in those slots) and
      the N9K-C9516-FM-CV blank in FM 1. An illustration: the guide prints no ordering code for it.
    bays:
      fm-1: cisco/n9k-c9516-fm-cv@1
      fm-2: cisco/n9k-c9516-fm-e@1
      fm-3: cisco/n9k-c9516-fm-e@1
      fm-4: cisco/n9k-c9516-fm-e@1
      fm-5: cisco/n9k-c9516-fm-e@1
      fm-6: cisco/n9k-c9516-fm-e@1
  fabric-three:
    kind: example
    description: >-
      Three N9K-C9516-FM-E2 fabric modules in FM 2, FM 4 and FM 6, as the guide's slot rule puts three, and the
      N9K-C9516-FM-CV blank in each odd slot. An illustration: the guide prints no ordering code for it.
    bays:
      fm-1: cisco/n9k-c9516-fm-cv@1
      fm-2: cisco/n9k-c9516-fm-e2@1
      fm-3: cisco/n9k-c9516-fm-cv@1
      fm-4: cisco/n9k-c9516-fm-e2@1
      fm-5: cisco/n9k-c9516-fm-cv@1
      fm-6: cisco/n9k-c9516-fm-e2@1
  empty:
    kind: example
    description: >-
      The chassis with every supervisor, system-controller, fan-tray and fabric-module bay empty, a blank over
      each power-supply slot and a line-card blank in each line-card slot. An illustration of what the bays
      look like with nothing seated.
    bays:
      sup-1: ''
      sup-2: ''
      sc-1: ''
      sc-2: ''
      ps-1: cisco/n9k-psu-blank@1
      ps-2: cisco/n9k-psu-blank@1
      ps-3: cisco/n9k-psu-blank@1
      ps-4: cisco/n9k-psu-blank@1
      ps-5: cisco/n9k-psu-blank@1
      ps-6: cisco/n9k-psu-blank@1
      ps-7: cisco/n9k-psu-blank@1
      ps-8: cisco/n9k-psu-blank@1
      ps-9: cisco/n9k-psu-blank@1
      ps-10: cisco/n9k-psu-blank@1
      fan-1: ''
      fan-2: ''
      fan-3: ''
      fm-1: ''
      fm-2: ''
      fm-3: ''
      fm-4: ''
      fm-5: ''
      fm-6: ''
