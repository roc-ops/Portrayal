portfolio: {line: Nexus 9000, family: Nexus 9500, series: Nexus 9500 Series}
description: >-
  Cisco Nexus 9516 - the 21 RU, sixteen-line-card modular chassis of the Nexus 9500 family, running NX-OS
  mode. The FRONT carries the chassis lamps across the top, sixteen line-card slots LC 1 to LC 16 from top to
  bottom, two supervisor slots SUP 1 and SUP 2 side by side below them, and ten power-supply slots PS 1 to
  PS 10 standing on end along the bottom. The REAR carries three fan trays FAN 1 to FAN 3, six
  fabric-module slots FM 1 to FM 6 behind the fan trays, and two system controllers SC 1 and SC 2 below
  them. Air enters at the front and leaves at the rear. This batch draws the chassis and its common
  equipment; the line cards are added in a later batch, so each line-card slot holds its blank.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Cisco N9516 NX-OS Mode Switch Hardware Installation Guide (138 pp; first published 2014-06-24, last
      modified 2026-09-17),
      https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/hw/n9516_hig/guide/b_n9516_hardware_installation_guide.pdf
      (page numbers below are PDF pages with the printed page after them, six lower: "PDF p10 (printed 4)").
      Cisco's Nexus 9508 and 9504 hardware installation guides were read to confirm the parts the three
      chassis share; each chassis cites its own guide. The NetBox devicetype-library has no 9516 device type,
      and the module-type files it lists for the 9516 and its images were NOT available to this work - only a
      path listing of that library is - so no NetBox elevation was compared. No data sheet, photograph, 3D
      model or stencil is held for the 9516. The guide has no flat front or rear view and prints no figure
      caption: both faces were read from its isometric figures on PDF p10 (printed 4) and p11 (printed 5).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - Appendix A "Switch Dimensions" (PDF p115, printed 109): "Cisco N9516 chassis: width 17.5
      inches (44.5 cm); depth 31.76 inches (80.67 cm) for chassis and handles; height 36.70 inches (93.41 cm)
      (21 RU)". Modelled as 444.5 x 933.45 x 806.7 mm. CONFLICT ON HEIGHT: 36.70 in is 932.2 mm, the same
      cell's 93.41 cm is 934.1 mm, the rack text and rail steps say "21-RU (36.7 inches or 93.4 cm)" (PDF p24,
      printed 18; PDF pp32-35, printed 26-29), and 21 x 44.45 mm is 933.45 mm; the cell's own RU count,
      933.45 mm, is used, which is also what the front stack of modules adds up to. CONFLICT ON DEPTH: the
      clearance figure (PDF p25, printed 19, callout 11) gives the chassis depth as 33.15 in (84.2 cm), the
      same drawing as the 9504's; the table's 31.76 in (80.67 cm) is used because it is the stated dimension
      "for chassis and handles", and the figure's number is not explained. Chassis weight 192.0 lb (87.3 kg),
      PDF p116 (printed 110).
  ru:
    confidence: datasheet
    note: >-
      datasheet - 21 RU, printed in the dimensions table (PDF p115, printed 109) and in "Rack and Cabinet
      Requirements" (PDF p24, printed 18). "Fully loaded, the switch weighs up to 568 lb (258 kg)" (PDF p35,
      printed 29) is carried as an attribute, not as the chassis weight.
  front-stack:
    confidence: estimated
    note: >-
      estimated - every position on the front is derived, not measured. The guide's front figure (PDF p10,
      printed 4) is an isometric drawing, so no aspect check (Gate 1) can be made. The layout follows that
      figure's arrangement and the guide's dimension table: a top band for the chassis lamps (callout 5);
      sixteen line cards of 1.75 in (44.45 mm) stacked top to bottom; the two supervisors, 1.75 in high and
      8.0 in (203.2 mm) wide with brackets, side by side; and ten power supplies standing on end, 5.25 in
      (133.35 mm) tall and 1.75 in (44.45 mm) wide, in a row at the bottom. The arithmetic closes: 44.45 +
      16 x 44.45 + 44.45 + 133.35 = 933.45 mm, and ten supplies of 44.45 mm span 444.5 mm, the chassis width.
      The cage is taken as the 17.0 in (431.8 mm) line-card width, centred in the 444.5 mm face. The figure
      shows nine supplies and a plain blank in the fourth slot; that is one photograph of one build and is not
      carried. The seven chassis lamps are read from the figure's strip at the top, which sits left of centre
      and is about a quarter of the face wide: they are put at an even pitch across it.
  chassis-lamps-position:
    confidence: estimated
    note: >-
      estimated - Appendix B "Chassis LEDs" (PDF p129, printed 123) says the lamps are "located at the top of
      the front of the chassis", which this figure agrees with. The legends BCN, SUP, FAB, IOM, PSU, FAN and
      PWR MGMT are plain text as the guide prints them; the vendor logo is not drawn, and a logo-zone is
      reserved.
  rear-stack:
    confidence: estimated
    note: >-
      estimated - the rear is derived the same way. The guide's rear figure (PDF p11, printed 5) is
      isometric. Three fan trays of 5.04 in (128.02 mm) are centred across the width, each 32.08 in (814.83
      mm) tall with its brackets; the six fabric modules, 2.46 in (62.48 mm) wide and 30.4 in (772.16 mm)
      tall, sit behind them on a pitch of half a fan tray, so FM 1 and FM 2 are behind FAN 1, FM 3 and FM 4
      behind FAN 2, FM 5 and FM 6 behind FAN 3 (the guide says the even-numbered fabric slot is the one behind
      a fan tray that powers it, PDF p131, printed 125). The two system controllers, 7.81 in (198.37 mm) wide
      with brackets and 1.42 in (36.07 mm) high, sit below the fan trays. The vertical position of the
      controllers and the margin above the fan trays are estimated.
  slots:
    confidence: datasheet
    note: >-
      datasheet - "Overview" (PDF p7, printed 1, and p9, printed 3): supervisor modules in slots SUP 1 and
      SUP 2 (modules 27 and 28), system controllers in SC 1 and SC 2 (modules 29 and 30), line cards in LC 1 to
      LC 16 (top to bottom; the guide's "Modules 1 and 16" is a slip for 1 to 16), fabric modules in FM 1 to
      FM 6 (slots 21 to 26, left to right), fan trays in FAN 1 to FAN 3 (modules 41 to 43) and power supplies
      in PS 1 to PS 10 (modules 31 to 40, left to right). "Slots are numbered from left to right or from top
      to bottom" (PDF p10, printed 4). Numbering is the guide's; whether each label is printed on the metal
      is not shown by any figure the guide gives.
  fabric-slots:
    confidence: datasheet
    note: >-
      datasheet - "Overview" slot rules and notes (PDF p9, printed 3): three fabric modules go in FM 2, 4 and
      6; four in FM 2, 3, 4 and 6; five in FM 1, 2, 3, 4 and 6 or alternatively FM 2 to 6; five FM-E or FM-E2
      in FM 2 to 6; six in FM 1 to 6. Fabric slots FM 2, FM 4 and FM 6 must be filled with functioning fabric
      modules or with blank modules with power connectors (N9K-C9516-FM-Z), which provide power to the fan
      trays covering those modules, and an empty FM 1, FM 3 or FM 5 takes the blank N9K-C9516-FM-CV. An empty odd
      slot defaults to the FM-CV, an empty even slot to the FM-Z. The fan-tray lamp table (PDF p131, printed
      125) lists the FM and FM-E as powering the tray and leaves out the FM-E2: the omission is recorded and
      the FM-E2 is accepted in every slot. A bay holds any module or blank; the pairing rules are the
      guide's and are not enforced by the model. The migration caution (PDF p114, printed 108) names
      "N9K-C950x-FM-G-Z", the 9508 guide's text copied; no part is made from it.
  power-slots:
    confidence: datasheet
    note: >-
      datasheet - "Overview of Power Modes" (PDF pp70-73, printed 64-67): with grid redundancy PS 1 to PS 5
      go to one source (grid A) and PS 6 to PS 10 to the other (grid B), PDF p71 (printed 65) and p73
      (printed 67); "up to five with the combined power mode, up to six with n+1, or up to ten with n+n"
      (PDF p9, printed 3). The guide contradicts itself on mixing supply types: "The switch can be powered
      by a mix of AC, DC, HVAC/HVDC power sources" (PDF p10, printed 4, and p23, printed 17) against "Do not
      use a mix of AC and DC power sources for a switch" (PDF p118, printed 112). Every supply type is
      accepted by every slot.
  line-cards-not-here:
    confidence: datasheet
    note: >-
      The sixteen line-card slots accept only the line-card blank N9K-C9500-LC-CV in this batch. The line
      cards follow in a later batch and will be added to these slots. The N9K-X9716D-GX line card is not
      compatible with this switch (PDF p7, printed 1).
  ears-and-kits:
    confidence: drawing
    note: >-
      drawing - the clearance figure (PDF p25, printed 19) shows the chassis between front and rear vertical
      rack posts with its front at the front posts, and the front figure (PDF p10, printed 4, callout 4)
      shows "2 vertical mounting brackets used to mount the chassis onto a rack" at the sides of the front.
      The rack-mount figure (PDF p38, printed 32) shows the chassis mounting brackets against the rack's
      vertical rails. The shipped position is therefore flush, and no `at` is written: no figure gives the
      bracket's depth position. The clearance figure (PDF p25, printed 19, and its callout row, same page)
      prints "Width of the chassis plus vertical mounting brackets on each side" as 19.2 in (48.8 cm),
      against the 17.5 in chassis: about 21.6 mm of bracket on each side. The ear model takes a depth offset
      and a height and no width, so that span is carried here and in a gap, not drawn. A rear-mount position
      is not given by the guide. The shipment list (PDF p31, printed 25) names "Rack mount kit for the Cisco
      N9516 (N9K-C9500-RMK) chassis" and the "Switch accessory kit (N9K-ACC-KIT)"; Appendix C Table 5
      (PDF p135, printed 129) lists the N9K-C9500-RMK contents and prints the accessory kit as N9K-C9500-ACK.
      The bottom-support rails carry the weight; the rack must be a four-post rack 24 to 32 in (61.0 to 81.3
      cm) deep between its front and rear rails (PDF p24, printed 18; the rails' span again on PDF p32,
      printed 26). No kit is listed under `chassis.kits`: a listed kit that still says `unplaced:` fails
      lint, and removing the sentence edits a shared kit, so the kits are a follow-up pull request.
  airflow:
    confidence: datasheet
    note: >-
      datasheet - "Air intake from the cold aisle for all modules and power supplies" and "Air exhaust to the
      hot aisle" (clearance figure, PDF p25, printed 19, callouts 4 and 5), and "port-side intake airflow" for
      every supply. The chassis is front-to-back.
  environmental:
    confidence: datasheet
    note: >-
      datasheet - Appendix A "Environmental Specifications" (PDF p115, printed 109), transcribed. CONFLICT ON
      ALTITUDE: the "Altitude Requirements" paragraph (PDF p14, printed 8) says 10,000 ft (3048 m), and 6,562
      ft (2000 m) for China; the Appendix A table says 0 to 13,123 ft (0 to 4,000 m). The table is used, and
      the paragraph is recorded here.
  power-tables:
    confidence: datasheet
    note: >-
      datasheet - "Planning for Power Requirements" holds two tables. The first (PDF pp17-19, printed 11-13) is
      a copy of the 9508's, naming N9K-C9508-* parts; the chassis's own table (PDF pp19-20, printed 13-14) is
      used for every module here, and the copy is recorded as a conflict. The own table's FM-E and FM-E2 share
      one row printed on two lines (980 W / 1320 W and 439 W / 900 W, typical and maximum) and are read BY LINE
      ORDER, FM-E first; no worked example confirms either. The worked example (PDF p20, printed 14) counts
      two supervisor A at 80 W, two system controllers at 25 W, sixteen line cards at 540 W, six fabric
      modules at 504 W, which confirms the FM row, and three fan trays at "3 x 451 W = 1353 W", which matches
      neither fan figure in the table (330 W typical, 600 W maximum): total 13,227 W. Step 2 says that 13,224
      W over 3,000 W needs "five power supplies" and in the same sentence "rounded up to three": a slip, and
      the arithmetic (4.41, rounded up) gives five.
  lifecycle:
    confidence: datasheet
    note: >-
      datasheet - Cisco has announced the end of sale of the Nexus 9516 chassis: "End-of-Sale and End-of-Life
      Announcement for the Cisco N9500 Cloud-scale 16-slot Chassis and Components",
      https://www.cisco.com/c/en/us/products/collateral/switches/nexus-9000-series-switches/n9500-cloud-16-slot-chassis-comp-eol.html
      (the title names a group of parts and no date is held, so none is written). Sale status of each module
      is per module: N9K-C9516-FM is end-of-sale by its own notice; the others have no status and are
      recorded as unknown.
