configurations:
  ac-port-side-intake:
    kind: base
    default: true
    power: ac
    source: >-
      derived - the guide prints no ordering code for any build and does not say which route processors
      or supplies ship, so the library defines the base as the -S's Figure 19 shows, with the hardened
      parts Table 2 names: two NC57-1600W-ACFW supplies, six HX fan trays and two NC57-MOD-RP2-E-HX route
      processors, with the MPA bays holding blanks.
    description: >-
      Two NC57-1600W-ACFW supplies, six fan trays (two NC57-C3-FAN2-HX and four NC57-C3-FAN1-HX), two
      NC57-MOD-RP2-E-HX route processors and three NC55-MPA-BLNK blanks: AC power, port-side intake.
  dc-port-side-intake:
    kind: example
    power: dc
    description: >-
      The base build with two NC57-1600W-DCFW supplies: DC power, port-side intake. An illustration: the
      guide prints no ordering code for this build.
    bays: {psu-1: cisco/nc57-1600w-dcfw@1, psu-2: cisco/nc57-1600w-dcfw@1}
references:
- title: >-
    Hardware Installation Guide for Cisco NCS 5700 Series Fixed-Port Routers (first published 2021-06-23,
    last modified 2026-05-15)
