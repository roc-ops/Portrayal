format: 1
kind: device
name: ncs-57c3-mod-hx
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: NCS-57C3-MOD-HX
portfolio: {line: NCS, family: NCS 5700}
description: >-
  Cisco Network Convergence System 57C3-MOD-HX, the environment-hardened variant of the NCS-57C3-MOD-S
  for outside plant cabinets: a three-rack-unit fixed-port router with forty-eight 25G SFP28 ports and
  eight 100G QSFP28 ports, three modular port adapter bays, two route processor bays and two 1600 W power
  supply bays at the front, and six fan trays at the rear. It is a flexible-consumption product ID of
  its own and takes only the hardened route processor, fan trays and port adapter. The port adapter bays
  hold their blanks here; the adapters are left to a later batch. The guide says nothing about end-of-sale;
  the status is unknown.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One document: Hardware Installation Guide for Cisco NCS 5700 Series Fixed-Port Routers, first published
      2021-06-23, last modified 2026-05-15 (https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/hardware-install/b-ncs5700-hardware-installation-guide-fixed-port.pdf).
      HELD AND SEARCHED FOR THIS MODEL: the guide's text and figures (1, 4, 5, 9, 19, 20, 127, 130, 131,
      135 and 138 were read), and the intake notes for the NCS line. NOT HELD: the NCS-57C3 Fixed Chassis
      Data Sheet, the modular port adapter data sheet, a NetBox device type or elevation, a photograph,
      a 3D model. The guide prints no chassis dimension table: the size is in Figure 1, an image. THERE
      IS NO FIGURE OF THE -HX ITSELF. Table 2 calls it "an environmental-hardened variant of the NCS-57C3-MOD-S
      router" with the same ports (48 SFP28, 8 QSFP28, three MPA slots), so its dimensions, face and positions
      are carried from the NCS-57C3-MOD-S's figures and every one is marked `estimated` for this model.
      The hardened route processor, fan trays and port adapter have no figure of their own either; their
      faces are the standard parts'.
  gate-1:
    confidence: estimated
    note: >-
      Taken from the NCS-57C3-MOD-S's figures, not the -HX's: Figure 19 (front) and Figure 20 (rear) are
      flat, face-on renders. Gate 1: the chassis in Figure 19 spans 1177 x 349 px, aspect 3.37, against
      Figure 1's 438.4 x 130.88 mm, aspect 3.35, within 0.7 percent; Figure 20 spans 1262 x 373 px, aspect
      3.38, within 1 percent. Scale is taken from the 438.4 mm width: 2.685 px/mm on the front and 2.87
      px/mm on the rear, with the vertical scale within 1 percent of it. Positions are read off gridded
      enlargements and are good to about 1 mm, apart from the modules' outer edges, which are good to
      about 2 mm.
  dimensions:
    confidence: estimated
    note: >-
      WHETHER FIGURE 1 COVERS THE -HX IS NOT STATED: its title is "NCS-57C3-MOD Dimensions" and the -HX
      is a different chassis ID, so these are the -S's figures carried over. Figure 1 (PDF page 9), a
      dimensioned drawing "with and without fans and power supplies": 17.26 in (438.4 mm) wide and 5.15
      in (130.88 mm) high on the upper front view; the upper side view has two depth lines, 12.55 in (318.77
      mm) along the body and 11.59 in (294.35 mm) along its upper edge; the lower, populated side view
      has 12.8 in (324.76 mm), 11.68 in (296.57 mm) and 12.83 in (325.82 mm). THE FIGURE DOES NOT SAY
      WHICH LINE IS THE CHASSIS DEPTH IN WORDS. The depth used is 318.77 mm, the longest line of the bare
      chassis, because Figure 26 (Clearance Requirement, PDF page 47) prints "Chassis depth: NCS-57C3-MOD:
      12.55 in. (31.88 cm)" and 31.88 cm is 318.8 mm. The longer lines of the populated view reach the
      protruding handles and sliders and are not the body. Three rack units: the kit is named NC57-3RU-ACC-KIT
      and 130.88 mm is 2.94 of 44.45 mm.
  ports:
    confidence: datasheet
    note: >-
      Table 2 (PDF page 8): NCS-57C3-MOD-HX (flexible consumption), "a total of 56 ports: 48 ports of
      25G SFP28, 8 ports of 100G QSFP28", and "3 Modular Port Adapter (MPA) slots". The Ports section
      numbers MACsec on "ports 0-7, 40-55" for the S and the HX. Figure 19, which is of the -S, prints
      the numbers on the metal, in green strips, and they run 0 to 23 on the two left SFP28 groups, 24
      to 31 on the QSFP28 and 32 to 55 on the two right groups: a column of three SFP28 ports is numbered
      upward from the bottom (0, 1, 2 for the first column), the printed pair "0 down-arrow up-arrow 1"
      sits between the middle and bottom rows and the top row's number is printed over it (the first column's
      "2" is covered by callout 1's arrow in Figure 19; it is drawn by the pattern of the other columns).
      The small triangles beside each pair are not drawn. Each QSFP28 column prints "24 down-arrow up-arrow
      25" and is numbered the same way, the lower cage first.
  arrangement:
    confidence: estimated
    note: >-
      Figure 19: four SFP28 assemblies of four columns by three rows, each column's upper two cages a
      stacked pair and the third cage below it, on a 14.25 mm column pitch (the registry's ganged pitch;
      the figure's dividers measure 14.2 to 14.3), at x = 23.6, 104.6, 268.6 and 349.6 mm. Rows (top of
      the opening): 44.4, 59.4 and 73.5 mm. Eight QSFP28 cages in four columns of two at x = 165.5, 188.5,
      221.7 and 244.8 mm, rows at 59.8 and 72.9 mm. The module bays are read from Figure 19 and Figure
      1: three MPA bays (two at the top left, one at the bottom), two route processor bays stacked at
      the top right, two supply bays at the bottom left, and a plate with a vent field at the bottom right.
      Every position is a reading of a render and each is good to about 1 mm.
  cage-orientation:
    confidence: datasheet
    note: >-
      The guide's note on the SFP28 ports (PDF page 127): the router has three rows of SFP28 ports; in
      the top row the transceivers go in with their electrical connectors on the bottom, and in the two
      bottom rows with the connectors on the top. The top row is placed upright and the two lower rows
      turned 180, by the library's convention that the upper cage of a stack is upright; the mapping from
      "connectors on the bottom" to upright is the library's and not the guide's. The QSFP28 stack takes
      the same convention (upper upright, lower turned 180), which the guide does not state.
  timing-ports:
    confidence: estimated
    note: >-
      Figure 19 callouts 6 to 9, at the right edge: 1PPS, 10 MHz, GNSS and ToD. The guide gives the timing
      interfaces as 1.0/2.3 DIN for 1PPS and 10 MHz ("Network Timing Interfaces", PDF page 38) and the
      ToD as an RJ-45; the GNSS jack is drawn as an SMA. THE GUIDE NAMES THE GNSS CONNECTOR NOWHERE IN
      THE FIGURES; SMA is the registry jack of the round, threaded antenna connector the render shows.
      The ToD jack reads 16 mm wide in the figure and is placed on the registry's 12.7 mm RJ-45 at its
      centre.
  rear-face:
    confidence: estimated
    note: >-
      Figure 20, left to right: fan tray slots 0 and 1 (2x60mm, tall) with a "FAN TRAY 0 1" plate between
      them, slots 2 and 3 (2x40mm), a plate "FAN TRAY 2 3 4 5", slots 4 and 5, and below the 2x40 trays
      a lower strip holding a grounding pad (callout 3) at the centre and a vent field at the right. "The
      rear view of both the chassis is same." The fan tray widths are read from the figure; slot 5 is
      the narrowest by about 1 mm and the trays share one component size.
  lamps:
    confidence: estimated
    note: >-
      Figure 127: the chassis' STATUS and ATTN lamps are at the lower right of the front plate and SYNC
      and GNSS below the route processors, next to the port groups; their positions are read from Figure
      19. THE GUIDE GIVES NO STATE TABLE FOR THE 57C3'S STATUS AND ATTN LAMPS: Table 31, the only chassis
      LED table, follows the NCS-57D2's figure. The four-cell display and its DISPLAY button at the lower
      right show port status as "##BB" (GN, YL, RD; Table 35) and are not modelled (see the gaps). Management
      port link and activity lamps (Figure 131, Table 36) belong to the route processor and are listed
      there.
  bays:
    confidence: estimated
    note: >-
      Bay positions from Figure 19 at 2.685 px/mm: MPA 111 x 37.5 mm at x 7.5 and 124.5 (top) and 177
      (bottom); route processors 196 x 18.5 mm at x 237.5, one above the other; supplies 81 x 43.5 mm
      at x 3.5 and 92.5. Which of the two top MPA bays is slot 2 and which is slot 3 cannot be read: the
      figure prints MPA3 and MPA2 on the strip between them with arrows that could point either way. The
      bottom one is MPA1 (Figure 19 prints MPA1 beside it, and the 12-port MPA's slot-1 note places it
      there). The bays are therefore numbered left to right along the top, then the bottom, and the numbers
      are the library's.
  ears-and-kits:
    confidence: datasheet
    note: >-
      Rack Mount the NCS-57C3-MOD Chassis in a 2-Post Rack, step 1: the bracket ears are aligned to the
      front of the chassis and the bracket's seven holes to seven of the chassis screw holes, so the shipped
      position is flush with the front; it is the default and has no `at` because no figure dimensions
      it. NC57-3RU-ACC-KIT ("Rack mount kit and ground lug kit", Table 16) IS NOT MODELLED AS A KIT: a
      kit contract needs a rack depth range or a preset for each configuration, and the guide gives neither
      for the bracket kit, which bolts to the front posts; the contract could not be written without inventing
      one. The slider kit NC55-2RU-ACC-SL2 with the tray NC57C3-ACC-SL-TR (the 4-post procedure) and the
      air filter kit NCS-57C3-FR-KIT are gaps too. Table 21 lists the bracket kit: 2 brackets, 12 M4 x
      8 mm and 2 M4 x 6 mm countersunk screws, 12 to 14 10-32 screws.
  configuration-names:
    confidence: estimated
    note: >-
      THE GUIDE GIVES NO ORDERING CODE FOR ANY BUILD. The chassis product ID is NCS-57C3-MOD-HX (flexible
      consumption), the model name. The base build seats what the -S's Figure 19 shows, with the hardened
      parts Table 2 names for the -HX: two NC57-1600W-ACFW supplies, six HX fan trays, two NC57-MOD-RP2-E-HX
      route processors and MPA blanks (the adapters wait for a later batch). The guide does not say which
      route processors or supplies ship with the chassis, so the base is `derived`. The guide does not
      say whether the hardened chassis takes the standard supply and blank or has hardened ones; Table
      2 names hardened parts only for the route processor, fan trays and MPA. The DC build is an example.
      The guide lists only port-side-intake parts, so there is no airflow build.
  lifecycle:
    confidence: estimated
    note: >-
      SALE STATUS IS UNKNOWN. The guide says nothing about end-of-sale or end-of-life and no other document
      for this model is held. No end-of-sale date is written.
  colour:
    confidence: estimated
    note: >-
      The port plate is cream (#d9d2c1) and the bay faces are light grey (#c3c7cc), by eye from Figure
      19, not sampled.
attrs:
  power:
    power-supply-options: >-
      NC57-1600W-ACFW (AC) and NC57-1600W-DCFW (DC), 1600 W each, two, 1+1 redundant, installed from the
      front
  features:
    optics-sfp28: guide Table 2 lists forty-eight 25G SFP28 ports
    optics-qsfp28: guide Table 2 lists eight 100G QSFP28 ports
    redundancy: >-
      two 1+1 power supplies and two route processors, one active and one standby; the fan trays work
      with N+1 redundancy (guide, Fan Modules and Fan Trays)
chassis:
  width: 438.4
  height: 130.88
  depth: 318.77
  ru: 3
  airflow: front-to-back
  color: '#c3c7cc'
  ears:
    positions:
    - {name: flush, label: bracket ears at the front, default: true}
gaps:
- what: sale-status
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    Whether the NCS-57C3-MOD-HX is on sale. The one held document is silent; the intake grid marks every
    NCS model unknown.
- what: chassis-data-sheet
  scope:
  - front
  - rear
  reason: needs-drawing
  wanted: >-
    The NCS-57C3 Fixed Chassis Data Sheet (not held): weight, power draw and a dimension table. The guide
    prints no chassis dimension table.
- what: depth-lines
  scope:
  - top
  - left
  - right
  reason: sources-disagree
  wanted: >-
    Which of Figure 1's depth lines is the chassis depth. Figure 1 prints 12.55 in (318.77 mm), 11.59
    in (294.35 mm), 12.8 in (324.76 mm), 11.68 in (296.57 mm) and 12.83 in (325.82 mm); Figure 26 prints
    12.55 in (31.88 cm). 318.77 mm is used.
- what: mpa-slot-numbers
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    Which top bay is MPA slot 2 and which is slot 3. Figure 19 prints "MPA3" and "MPA2" with arrows on
    the strip between the bays.
- what: mpa-adapters
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The modular port adapters, for a later batch: the guide's Modular Port Adapters section lists NC55-MPA-4H-S
    (4 x QSFP+/QSFP28), NC55-MPA-2TH-S (2 x CFP2-DCO), NC55-MPA-1TH2H-S (1 x CFP2-DCO and 2 x QSFP+/QSFP28),
    NC55-MPA-12T-S (12 x SFP+), NC57-MPA-2D4H-S and its hardened -H-S (4 x QSFP28/QSFP-DD), NC55-OIP-02
    (8 x SFP+) and NCS57-MPA-1FH1D-S, with slot rules (slots 2 and 3 do not support the 12-port MPA's
    1G ports; on slot 1 ports 0-3 and 8-11 only support 1G; 2x100GbE autobreakout on slots 2 and 3 from
    release 24.2.1). Each bay holds its blank until the adapters are modelled. The MPA data sheet is not
    held.
- what: hx-adapter-and-blank
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The adapter and blank the -HX takes. Table 2 names the NC57-MPA-2D4H-H-S as the MPA of this chassis
    and the guide's note says only hardened MPAs are to be installed; no document held says whether the
    hardened chassis takes the standard NC55-MPA-BLNK, the NC57C3-PS-BLNK and the NC57C3-RP-BLNK or has
    hardened blanks. The standard blanks are seated.
- what: printed-model-text
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The model text printed on the -HX's front plate. No figure of the -HX is held, so none is drawn; the
    -S's figure prints NCS-57C3-MOD-S in that place.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The states of the chassis STATUS, ATTN, SYNC and GNSS lamps of the 57C3. Figure 127 shows them; the
    guide's Table 31 follows the NCS-57D2's figure, so no 57C3 state table is held.
- what: chassis-display
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The four-cell port status display and its DISPLAY button at the lower right of the front plate (Table
    35: "##BB" with GN, YL and RD). They are not modelled as parts: the guide gives no size or position
    beyond Figure 19.
- what: rack-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack-mount kit NC57-3RU-ACC-KIT as a kit contract: the bracket's dimensions and the rack depth
    range or preset it serves. Table 21 lists 2 brackets and the screws; the 2-post procedure gives no
    rack depth. Without a depth the library's kit contract cannot be written, so no kit is listed under
    the chassis.
- what: slider-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The 4-post slider kit NC55-2RU-ACC-SL2 (min. 650 x 650 mm cabinet) with the tray NC57C3-ACC-SL-TR,
    and NC55-2RU-ACC-SL1 (476 mm cabinets, attached to the chassis): the guide lists contents (Table 25:
    2 brackets, 2 slider rails, 8 M4 x 8 mm screws) and a rack requirement of 16.0 to 19.9 in between
    the outside faces of the rails for the SL1, and no dimension of a rail or the tray. The SL2 also fits
    the 2RU NCS 55A2.
- what: air-filters
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The optional air filter kit NCS-57C3-FR-KIT, which needs the 19-inch bracket shipped with it ("(Optional)
    Install the Air Filter on the NCS-57C3 Router"). The guide gives no size or part dimension and the
    base build takes no filter.
- what: management-jack-speed
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The management Ethernet jacks' rate on the route processors. The guide names the port and gives no
    rate, so the DCIM export writes the exporter's default for a management jack.
- what: fan-and-lamp-power
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The fan trays', route processors' and chassis' own power draw. The guide's power tables give supply
    ratings only.
- what: gnss-connector
  scope:
  - front
  reason: vendor-silent
  wanted: The GNSS port's connector type, which the guide does not name. It is drawn as an SMA.
- what: rear-labels
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The printed legends and warning labels on the rear plates (FAN TRAY 0 1, FAN TRAY 2 3 4 5, a hot-handle
    caution) and the screws, which are not drawn.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the side walls. Figure 1 shows a side view with screw
    holes and no dimension for them.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the network timing interfaces - 1PPS and 10 MHz on 1.0/2.3 DIN jacks, GNSS on an SMA and time-of-day
      on an RJ-45. One job (clock), several media.
  leds: {term: LED, role: indicator, index-origin: 1}
  mpa-bays: {term: Slot, role: traffic, index-origin: 1, physical-context: NetworkingDevice}
  rp-bays:
    term: Slot
    role: management
    index-origin: 1
    physical-context: NetworkingDevice
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        1+1 - guide, Install or Replace a Route Processor: the router "supports up to two redundant route
        processor (RP) cards"; one is the active and the other the standby, and a new RP can be installed
        in an empty slot in operation.
  psus:
    term: PSU
    role: service
    index-origin: 1
    physical-context: PowerSupply
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        guide, Power Supply Unit: "The PSUs have a capacity of 1600W and works with 1+1 redundancy."
  fans:
    term: Fan Tray
    role: service
    index-origin: 0
    physical-context: Fan
    attrs:
      redundancy: n+1
      redundancy-note: >-
        n+1 - guide, Fan Modules and Fan Trays: "The fan modules work with N+1 redundancy." Said once
        for the whole family; it names no count for the six trays.
