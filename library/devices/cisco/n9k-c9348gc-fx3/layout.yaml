    power-input-hvac: '100 to 277 V (350 W PHV)'
    power-input-dc: '-48 to -60 V nominal (440 W and 715 W)'
    power-input-hvdc: '240 to 380 V (350 W PHV)'
    power-supply-options: '350W AC, 350W PHV, 440W DC or 715W DC (two)'
  environmental:
