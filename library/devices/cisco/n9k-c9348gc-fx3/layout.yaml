    airflow: back-to-front
    power: [ac, hvdc]
    part-numbers:
      N9K-C9348GC-FX3: {part: N9K-C9348GC-FX3}
    bays:
      psu-1: cisco/nxa-phv-350w@1
      psu-2: cisco/nxa-phv-350w@1
    component-attrs:
      nxa-sfan-30cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-phv-350w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  dc-440w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PDC-440W-PI DC supplies and three NXA-SFAN-30CFM-PI fan modules: port-side intake
      airflow, burgundy latches
    power: dc
    part-numbers:
      N9K-C9348GC-FX3: {part: N9K-C9348GC-FX3}
    bays:
      psu-1: cisco/nxa-pdc-440w@1
      psu-2: cisco/nxa-pdc-440w@1
  dc-440w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PDC-440W-PE DC supplies and three NXA-SFAN-30CFM-PE fan modules: port-side
      exhaust airflow, blue latches
    airflow: back-to-front
    power: dc
    part-numbers:
      N9K-C9348GC-FX3: {part: N9K-C9348GC-FX3}
