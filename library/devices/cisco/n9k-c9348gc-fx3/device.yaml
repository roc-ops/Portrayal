model: N9K-C9348GC-FX3
aliases:
- {name: Nexus 9348GC-FX3, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX3}
description: >-
  48x 100M/1GBASE-T access, 4x 1/10/25G SFP28 and 2x 40/100G QSFP28 uplink 1RU data-centre switch running
  NX-OS. The port side carries all fifty-four ports and the BCN, STS and ENV lamps. The other side carries
  the console, an RJ-45 and an SFP management port, the USB port, three fan modules and two power supplies.
  Ports number 1-54 and run DOWN each column, odd on the top row. Ships port-side intake (burgundy modules)
  or port-side exhaust (blue).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco N9348GC-FX3
      NX-OS Mode Switch Hardware Installation Guide, First Published 2023-08-18, Last Modified 2026-09-18,
      64 pages: the overview and its figures (art numbers 505030 and 504861), appendix B specifications,
      appendix C LEDs, appendix D kits. THE GUIDE'S FIGURES ARE CLEAN FLAT LINE ART AT ABOUT 4 PX PER
      MM and carry callouts; they are read from the PDF's embedded bitmaps. NO DATA SHEET, PHOTOGRAPH,
      3D MODEL OR STENCIL IS HELD for this model, and the NetBox devicetype-library is held as a path
      listing only: it names a device type with a front and a rear elevation for this model, and no file
      was read.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's convention: the upper cage upright over the lower turned 180, and the upper jack turned
      180 over the lower one. The front figure draws the upper jacks with their latch notch up and the
      lower jacks with the notch down, which is that arrangement.
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its two end lines, is 1771 px across and 177 px down: aspect 10.0
      against the guide's 17.3 x 1.72 in, 10.05, so 0.5% out, and it can be measured; 4.03 px per mm across
      from 439.4 mm and 4.05 down from 43.7. The rear figure's body is 1773 px across and 177 down, 10.0,
      4.035 px per mm. A repeated feature checks the scale: the jack columns step 56 px, 13.9 mm, against
      the registry's 13.97 (0.5% out), so every pitch is the registry's and the figure fixes where each
      group starts.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure, origin the left end line. FOUR boxed groups of six jack columns: the boxes
      start at 13.6, 103.9, 194.2 and 284.5 mm, a stride of 90.3, and the jacks stand 2.8 mm inside each
      box, so the columns start at 16.15, 106.45, 196.75 and 287.05 mm (the figure's jack outline is 12.2
      wide against the registry's 12.7, centred). At the registry's 13.97 mm pitch the stride is a gutter
      of 6.5 mm. The two SFP28 columns start at 375.9 and 391.0 mm and the QSFP28 pair at 409.9 mm.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top line. The upper jack's centre is at 15.4 mm and the lower jack's
      at 30.0, a 14.6 mm row pitch; with the registry's 11.0 high cell the upper jack runs 9.9 to 20.9
      mm. The SFP28 cages run 9.7 to 20.1 and 25.4 to 35.8, and the QSFP28 cages 9.8 to 19.95 and 25.2
      to 35.35. THE PORT LAMPS ARE SMALL RECTANGLES BELOW THE JACKS, one under each port, 4.4 by 2.7 mm
      in the figure, so common/led-rect@1 (4.6 x 2.6), two to a column, the left one for the upper port,
      at 38.8 mm; the numerals and a pair of arrows stand above them at about 37 mm.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table: "17.3 inches (43.9 cm)" wide, "1.72 inches (4.4 cm) (1 RU)"
      high, and for depth "Chassis without PSUs - 18.0 in (45.72 cm)" and 19.7 in (49.9 cm) with the NXA-PAC-350W
      or NXA-PHV-350W supplies and 21.0 in (53.34 cm) with the NXA-PDC-440W or NXA-PDC-715W-PI supplies.
      The chassis depth carried is the first, 457.2 mm: the library's depth is the chassis, and the others
      include the modules. 439.4 mm and 43.7 mm are carried, the inch figures converted. The weights table
      gives the chassis "14.5 lb (6.57 kg)".
  port-order:
    confidence: estimated
    note: >-
      The figure prints a pair of numerals over each column of lamps with an up and a down triangle between
      them, "1 up down 2" to "47 up down 48", and "49 up down 50", "51 up down 52" and "53 up down 54"
      under the SFP28 and QSFP28 cages, so the odd port is the upper jack or cage. The guide's text gives
      48 downlink ports, 4 SFP28 uplinks and 2 QSFP28 uplinks and does not number them. Port numbers are
      as printed; the NX-OS interface names are not in the guide.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down to the nearest
      port." Green is admin up, module present and link up; amber is admin down or module absent; off
      is up and present but no link. The figure draws the SFP28 triangles large, between the two cage
      rows, and the QSFP28 triangles at the ends of a band with eight small windows between them; the
      windows are drawn as marks and carry no state. The copper triangles are the printed arrows beside
      the numerals; the copper lamps are the rectangles under the jacks.
  chassis-lamps:
    confidence: estimated
    note: >-
      Callout 1 is "LEDs". The figure draws a boxed panel at the left end with three ring lamps in a column,
      legends BCN, STS and ENV to their left, at 9.1 mm across and 11.9, 15.8 and 19.7 mm down. Under
      them the figure draws a block of nine small rings in three rows and a mark; the guide does not name
      them and they are drawn as marks. The figure also draws a column of seven rings at the right end,
      beside the QSFP28 pair; they are drawn as marks and are in the gaps. The mark is the maker's logo;
      none is drawn, as the library's practice for a Cisco face is no logo artwork. The model legend under
      the uplinks, CISCO NEXUS N9K-C9348GC-FX3, is printed on the figure and is carried as text.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the module side is read off the rear figure (4.035 px per mm across, 4.05 down).
      The console jack over the RJ-45 management jack, the USB port stood on end, the SFP management port,
      two lamps labelled BCN and STS, a grounding pad with two screws, three fan modules, then supply
      1 and supply 2. THE OUT-OF-BAND BLOCK IS AT THE LEFT END, as on the 93180YC-EX. The figure draws
      small airflow legends, F1 and F2 with arrows, beside the first fan and P1 and P2 beside the supplies;
      they are not carried. The management SFP cage is the registry's plain one.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements: typical 226 W and maximum 242 W "(AC or DC)", 825.738
      BTU per hour. The figures are the switch's draw and not a supply rating; the guide names no configuration
      or ambient.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the value the
      93180YC-EX's stencil sample gave, carried across as a family colour.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's NXK-ACC-KIT-1RU procedure says the holes used depend on the rack and on the clearance
      needed for interface cables, 3 inches minimum, and for module handles, 1 inch minimum, and its figure
      shows two ways to mount the brackets. None dimensions a position and none says which the box ships
      with, so the two positions are written without an `at`, named for what the text says they clear,
      and none is the default.
attrs:
  physical:
    weight-note: >-
      14.5 lb (6.57 kg) chassis without fans or PSUs. Fan module 0.26 lb (0.12 kg). Supplies 2.64 lb (1.2
      kg), 2.61 lb (1.18 kg) for the NXA-PDC-715W-PI.
  power: {power-typical-w: 226, power-max-w: 242, power-envelope: unstated, heat-dissipation-btu-hr: 826,
    power-input-ac: '100 to 120 V or 200 to 240 V, 50 to 60 Hz (350 W AC)', power-input-hvac: 100 to 277
      V (350 W PHV), power-input-dc: -48 to -60 V nominal (440 W and 715 W), power-input-hvdc: 240 to
      380 V (350 W PHV), power-supply-options: '350W AC, 350W PHV, 440W DC or 715W DC (two)'}
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: '5
      to 90% operating, 5 to 95% non-operating', altitude: '13,123 ft (4000 m) operating'}
  features:
    ports-t: 'guide: "48 x 100M/1G BASE-T downlink ports"'
    optics-sfp28: 'guide: "4 x 10/25G SFP28 uplink ports ... configured as 1/10/25-Gbps"'
    optics-qsfp28: 'guide: "2 x 40/100G QSFP28 uplink ports"'
    management-ports: 'rear figure: one RJ-45 and one SFP management port, and a console port'
  management: {usb: 1 USB port}
  lifecycle: {eol: none-announced}
