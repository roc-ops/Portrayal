configurations:
  ac:
    kind: base
    description: >-
      The switch as it runs: the built-in AC supply and the blank cover over the FlexStack module slot. The
      C2960S-STACK module is optional (PDF p21, printed 1-19) and is not seated here.
    default: true
  ws-c2960s-24pd-l:
    kind: orderable
    description: >-
      WS-C2960S-24PD-L, the model's only SKU (Table 1-1, LAN Base, PoE budget 370 W). It seats the blank cover in
      the FlexStack slot: the stack kit is a separate, optional part (PDF p21, printed 1-19) and the cover is
      removed only to fit the module (PDF p31).
    part-numbers:
      WS-C2960S-24PD-L: {}
    bays:
      flexstack-slot: cisco/c2960s-flexstack-blank@1
references:
- {title: 'Catalyst 2960-S Switch Hardware Installation Guide (OL-19732-04)'}
- {title: 'NetBox community device-type library: Cisco WS-C2960S-24PD-L device type and front elevation image'}
