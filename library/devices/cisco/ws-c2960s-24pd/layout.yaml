gaps:
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's figures show the lid and one side
    isometrically (bracket screw holes and slots on the side); none can be measured. Each carries an `empty:`
    sentence saying where I looked.
- what: rps-connector-part
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A part for the RPS connector. No registry part exists for an RPS 2300 connector and no `std/` header names it, so
    it is drawn as chassis art where the photograph puts it: a plate, a shroud, a housing with two rows of eleven
    cavities, two screw holes and a rating strip. It is drawn open. The guide says the cover (two Phillips pan-head
    screws, Figure 1-15) goes on when no RPS is connected.
- what: faceplate-colour
  scope: [rear]
  reason: needs-photo
  wanted: >-
    This model's own rear in colour. The only held rear in colour is the NetBox photograph of the WS-C2960S-48LPD-L,
    whose plain plate reads #3f4447 and whose fitted module's frame reads #344a54; its printed ratings ("8-4A",
    "+12V @11.25A, -48V @7.8A") match none of the five rows of spec Tables 1-2 and 1-3, so it is another model's
    rear. Figure 1-10 (PDF p19, printed 1-17) fills the rear face pale grey, which is the drawing's shading. The guide
    gives no housing colour and says nothing of a shared finish ("All the 24- and 48-port switches have similar
    components" is about parts). The rear is drawn in the chassis colour, #404040, which is the front's own measured
    panel colour: a stand-in the owner may accept or replace.
- what: etsi-bracket
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The ETSI mounting bracket, printed "700-19781XX" (PDF p34, printed 1-10). Its revision digits are not read, and
    the guide gives no contents or install steps beyond Figure 1-10, so no kit contract is written.
- what: sfp-slot-numbers
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The numbers of the two SFP+ slots on this 24-port model. The guide says "Module slot numbers are 49 and 50" under
    the 48-port figure only. They are numbered 25 and 26 here, after the copper ports.
- what: front-text-and-corner-marks
  scope: [front]
  reason: needs-photo
  wanted: >-
    The corner marks 1X to 24X, the "POWER OVER ETHERNET" legend under the jacks and the SFP+ labels are on the
    NetBox stencil only; the numerals above the jacks and the SFP+ numbers are drawn, the rest is not.
- what: front-of-the-24pd-itself
  scope: [front]
  reason: needs-photo
  wanted: >-
    A square-on photograph of this model's front. The only flat face is community art; every position is read from
    it at 11.3 px per mm.
- what: mode-button-part
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The Mode button is drawn as plain panel art. No library part is a flush push button of this shape.
- what: rear-label-text
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The rating label text beside the inlet. The photograph shows another model's label ("100-240V~ 8-4A") and the
    guide's drawing "12-6A", and this model's row of Table 1-2 reads 5 to 2 A, so none is carried.
