portfolio: {line: Catalyst, family: Catalyst 2960-S, series: Catalyst 2960-S FlexStack}
description: >-
  24x 10/100/1000 PoE+ RJ-45 (370 W PoE budget) and 2x SFP+ uplink 1RU stackable access switch running LAN Base. The
  front carries the mode button and switch lamps at the left, two blocks of twelve jacks in two rows at the right of
  the face, then the USB Type A port, the USB mini-Type B and RJ-45 console ports, the Ethernet management port and
  the two SFP+ slots. The rear carries the FlexStack module slot with its blank cover, the fan exhaust, the RPS
  connector and the AC inlet of the built-in supply. Ports number 1-24 and run DOWN each column - odd on the top row,
  even beneath it. The SFP+ pair follows the copper ports.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, 82 pages (the PDF prints its number and no
      date; Cisco URL https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/hardware/installation/guide_stack/2960SHIG.pdf).
      Pages below are PDF pages with the printed page after them. Table 1-1 (PDF p3-4, printed 1-1 to 1-2) lists the
      model; the appendix's Table 1-2 (PDF p62-63, printed 1-2 to 1-3) gives this model's row; Figure 1-10 "Catalyst
      2960-S Switch Rear Panel with Stacking Module Slot and RPS connector" (PDF p19, printed 1-17) is the rear of the
      stacking models. The guide draws no front of this model: Figure 1-1 "Catalyst 2960S-48FPD-L Front Panel" (PDF
      p4, printed 1-2) is a 48-port sibling's. Community NetBox (second opinion only, not Cisco's): the
      WS-C2960S-24PD-L device type and its front elevation, a flat stencil render. No data sheet, no vendor 3D model,
      no photograph and no rear elevation of this model is held. The pages were read through the PDF's text layer and
      the converted figures were viewed.
  gate-1-front:
    confidence: estimated
    note: >-
      The front is read from the NetBox front elevation of the WS-C2960S-24PD-L, checked against the guide first. Its
      aspect is 5475 / 503 = 10.88 against 10.86 for the 19-inch ear-to-ear width, so it is read at 11.345 px per mm
      with the chassis starting 216 px (19.05 mm) in. It shows 24 jacks in two blocks of twelve in two rows, as Table
      1-1 says, at the right of the face with the left of the panel plain, eight switch lamps including PoE, the USB
      Type A, mini-B, RJ-45 console, management and two SFP+ slots. The two blocks sit where blocks 3 and 4 of
      cisco/ws-c2960s-48fpd stand (the first jack 202.9 mm from the chassis side, read by eye against the same
      stencil family), and that device's positions are used for the jacks and the right-hand cluster. Every position
      is `estimated`; the image is community art, not Cisco's.
  numbering:
    confidence: drawing
    note: >-
      Ports run left to right from the far left, port 1 above port 2 in each pair (the note under Figure 1-3, PDF p5,
      printed 1-3, which is written for the 48-port models). The stencil prints 1 to 24 above the jacks. The guide
      states the module slot numbers (49 and 50) only for the 48-port models; this model's slots are unnumbered
      there, so they are numbered 25 and 26 after the copper ports and the number is a gap. The stencil prints 1 and
      2 under the slots. Interface names are in the community NetBox device type only: GigabitEthernet1/0/1 to
      1/0/24, the SFP+ slots and FastEthernet0 for the management port.
  jacks:
    confidence: estimated
    note: >-
      Row 1 starts 11.72 mm down the face and row 2 at 26.71, 15.0 apart; the first jack at 202.86 mm from the
      chassis side and the blocks 89.4 mm apart (6 x 13.97 plus a 5.58 gutter), as on the 48FPD-L. Upper-row jacks
      take the 180-degree rotation the 4948E's upper row takes.
  controls-and-lamps:
    confidence: estimated
    note: >-
      The eight switch lamps (SYST, RPS, MSTR, STAT, DPLX, SPED, STCK, PoE) stand in a column at 7.1 mm, pitched
      2.53 mm, the Mode button below them (Figure 1-7, PDF p13, printed 1-11; the PoE lamp is "only on switch models
      that support PoE", which this one does). Port lamps are the two small arrows above each column pair, up for the
      upper port and down for the lower; their meaning depends on the selected mode (Table 1-9). The arrows by the
      console jacks are the USB and RJ-45 console lamps (Table 1-10, PDF p18, printed 1-16).
  legend:
    confidence: estimated
    note: >-
      The legend "Catalyst 2960-S Series PoE+ 10G" is printed on the NetBox stencil's face. Figure 1-1 shows only
      "2960-S" under the console callout, so the full text is the stencil's, which is community art, not this model's
      own document; it is carried as `estimated`.
  console:
    confidence: drawing
    note: >-
      Figure 1-1 callouts 5 and 6 and "Management Ports" (Figure 1-5, PDF p9): the USB mini-Type B console port and
      the RJ-45 console port are one console, and the USB port has priority when both are cabled (Table 1-10). The
      management port is its own (callout 7).
  power:
    confidence: datasheet
    note: >-
      Spec Table 1-2, row Catalyst 2960S-24PD-L: AC input 100 to 240 VAC autoranging, 5 to 2 A, 50 to 60 Hz; DC
      input for the RPS 2300 +12 V @3 A and -52 V @8 A; power consumption 84 W, 286 BTUs per hour (footnote 1: the
      power consumed internally by the switch at 120 VAC, 60 Hz); power rating 0.46 KVA. The PoE budget is 370 W
      (Table 1-1; "PoE+", 30 W per port maximum, 370-W switch maximum, spec Table 1-2). The supply is built in: "The
      switch is powered through the internal power supply" (AC Power Connector, PDF p22, printed 1-20), so it is part
      of the chassis and not a bay.
  inlet:
    confidence: estimated
    note: >-
      The inlet is an IEC C14 appliance inlet, read from Figures 1-10 and 1-11 (a three-pin keyed inlet with a rating
      label beside it). The guide does not name the connector type; it says "Use the supplied AC power cord" (PWR-CLP=,
      PDF p42, printed 1-18). Position: this model shares the PoE rear with the 48FPD-L and 48LPD-L (the serial-number
      figure, Figure 1-1 of the appendix, PDF p55, names all three), so cisco/ws-c2960s-48fpd's position, read from
      the NetBox 48LPD-L rear photograph (3.41 px per mm), is used.
  rear:
    confidence: estimated
    note: >-
      The rear is the stacking models' common rear (Figure 1-10, with the RPS connector: callouts 1 FlexStack module
      slot and cover, 2 fan exhaust, 3 RPS connector, 4 AC power connector). The serial-number figure for this model
      (Figure 1-1 of the appendix, PDF p55, printed 1-5) draws the same rear as for the 48FPD-L and 48LPD-L. Positions
      are the NetBox 48LPD-L rear photograph's, read at 3.41 px per mm along its width, a different model of the same
      rear; it shows a C2960S-STACK module fitted, and this device shows the blank cover (the module is optional:
      "FlexStack Ports", PDF p21, printed 1-19). Spec Table 1-2 lists a DC input for the RPS 2300 for this model, so
      the RPS connector is present. The guide says "If you are not using an RPS with your switch, use the two
      Phillips pan-head screws to attach the RPS connector cover" (Figure 1-15, PDF p39, printed 1-15), so the
      connector is drawn open, as the photograph shows it. It is chassis art and not a part: no RPS 2300 connector is
      a registry part.
  airflow:
    confidence: estimated
    note: >-
      The guide names a fan exhaust on the rear panel, counts no fans and gives no direction; no airflow is set and
      no fan redundancy is claimed.
  ears-and-kits:
    confidence: drawing
    note: >-
      Figure 1-12 (PDF p36, printed 1-12) "Attaching Brackets for 19-inch Racks": front-mounting, mid-mounting and
      rear-mounting positions, with number-8 Phillips flat-head screws (48-0655-01); Figure 1-13 (PDF p37, printed
      1-13): number-12 Phillips pan-head screws (48-0523-01) for the rack and a black Phillips machine screw
      (48-0654-01) for the cable guide. The text says four screws attach each bracket's long side to the switch. The
      19-inch brackets are in the box, so they are not a kit. No position is dimensioned, so none carries an `at`.
      The ETSI bracket is printed "700-19781XX" (PDF p34, printed 1-10), with its revision digits unread: it is a
      gap and not a kit.
  lifecycle:
    confidence: estimated
    note: >-
      No lifecycle date is carried. The end-of-sale notices are not held; only titles and list dates would be, and
      this model's is not among them.
