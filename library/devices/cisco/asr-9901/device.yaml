format: 1
kind: device
name: asr-9901
version: 0.3.0
maturity: modelled
manufacturer: Cisco
model: ASR 9901
portfolio:
  line: Service Provider
  family: Aggregation Services Router
  series: ASR 9000 Series
description: >-
  Cisco ASR 9000 Series ASR 9901 Router - a 2 RU fixed-port provider-edge router
  with an integrated route processor and 456 Gbps of fabric. Everything a user
  touches is on the front: forty-two ports across the top in five blocks - eight
  1GE, twelve dual-rate 10/1GE, two 100GE, twelve more 10/1GE and eight more 1GE
  - and below them the timing, management and console jacks, nine alarm lamps, a
  four-character LED matrix display and the shelf power switch. The rear carries
  three fan trays and two 1.6 kW supplies. Airflow is front to back, and nothing
  seats on the front face at all.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      the Cisco ASR 9901 Router Data Sheet (c78-740540, 2021); the Cisco ASR 9000
      Series Fixed-Port Routers Hardware Installation Guide
      (b-asr9001-hardware-installation-guide.pdf, last modified 2021-07-30, which
      despite its filename covers the 9001, 9901, 9902 and 9903); and Cisco's own
      Visio stencil Routers-Cisco_ASR_9000, masters "ASR-9901 Front" and
      "ASR-9901 Rear".
  face-check:
    confidence: drawing
    note: >-
      done BEFORE measuring, because Cisco's master filenames name the wrong faces
      on the ASR 9910. No swap here. "ASR-9901 Front" carries the forty-two
      numbered ports, the GRP 0 to GRP 5 group labels, the timing and management
      jacks, the nine alarm lamps, the LED matrix and the CISCO / ASR9901
      branding, and matches Figure 5 of the install guide, "Front Panel of the
      Cisco ASR 9901 Router", feature for feature. "ASR-9901 Rear" carries three
      fan trays and two power modules and matches Figure 6.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - Table 2 of c78-740540: "Height: 3.43 inches (8.7 cm); Width:
      17.32 inches (44 cm); Depth: 23.62 inches (60 cm); Weight of chassis: 47.62
      lbs (21.6 kg); Weight of fully configured (including 2 x power modules & 3x
      Fan trays) chassis 55.97 lbs (25.4 kg)". The inch figures are carried
      because the centimetre ones beside them are rounded to two significant
      figures: 3.43 in is 87.12 mm, 17.32 in is 439.93, 23.62 in is 599.95.
      `chassis.weight-kg` is the FULLY CONFIGURED 25.4, because that is what the
      other chassis in this family carry and what a rack calculation wants; the
      bare 21.6 is in attrs beside it.
      THE HEIGHT DISAGREES WITH THE INSTALL GUIDE and the disagreement is
      recorded as a gap rather than averaged. The guide says "Height of the ...
      Cisco ASR 9901 Router and Cisco ASR 9001 Router is 3.47 inches (8.8 cm)" -
      one sentence covering two chassis, and 3.47 in is the ASR 9001's own data
      sheet figure. The stencil settles it: the REAR master's ink is 550.64 art
      units tall and its shape box reads 87.38 mm, so at the width-anchored scale
      the body comes out 87.11 mm against the data sheet's 87.12. Two independent
      readings agreeing to a hundredth of a millimetre beat one sentence that
      looks like a sibling's number reused.
      WIDTH IS THE BODY: 17.32 in is not the 19 in rack face, so L43 has nothing
      to catch, and the install guide's mounting section agrees from the other
      side - "the usable aperture ... must be at least 17.75 inches (45.09 cm)
      for the Cisco ASR 9901 Router".
  stencil-calibration:
    confidence: drawing
    note: >-
      THE TWO MASTERS USE DIFFERENT CONVENTIONS, as they do on the ASR 9902:
      "ASR-9901 Front" reads 482.60 x 88.90 mm - the 19 in rack face by the 2 RU
      ALLOCATION - and "ASR-9901 Rear" reads 482.60 x 87.38, the rack face by the
      chassis as built. Each is calibrated on its own.
      THE BODY BOX IS NOT THE INK BOX ON THE FRONT, and getting that wrong is a
      1.7 percent error in y. The front master's ink runs 561.30 units tall
      because the bezel draws a lip above and below the chassis; the RACK EAR
      beside it runs 6.00 to 556.55, and that 550.55-unit span is the body. Set
      to 87.12 mm it gives ky 0.158242 against kx 0.158210 from the 2780.68-unit
      body width at 439.93 mm - 0.02 percent apart, which is this stencil's best
      calibration yet. The rear needs no such care: its body ink is 550.64 units
      and comes out 0.00 percent apart.
      THE RULER INSIDE THE ARTWORK CONFIRMS BOTH. The twenty SFP-class cage
      columns across the four port blocks sit on a measured 14.24 mm pitch,
      constant to 0.01 over nineteen consecutive gaps, against SFF-8433's 14.25
      for a ganged SFP assembly - 0.07 percent, on a dimension that was never an
      input. The 100GE bores then measure 18.95 x 8.96 mm against
      std/qsfp-ganged's 18.5 x 9.58, and the nine RJ-45 jacks 12.66 x 10.76
      against std/rj45-ganged's 12.7 x 11.0.
  ports:
    confidence: datasheet
    note: >-
      FORTY-TWO PORTS, AND THE THREE SOURCES AGREE. Table 2 of c78-740540 gives
      "Integrated interfaces: 16x1 GE, 24x 1/10 GE, 2x100 GE". The install guide
      spells the same thing out: "The Cisco ASR 9901 Router has an integrated
      route processor (RP) and 42 fixed-configuration ports ... 24 ports that
      support 1 GbE (using SFP) or 10 GbE (using SFP+) ... 16 ports that support
      1 GbE (using SFP)" plus two QSFP28. And Figure 121, "Cisco ASR 9901 Fixed
      Ports", numbers them: "1 SFP ports (0-7), 2 SFP/SFP+ ports (8-19), 3 QSFP28
      ports (20-21), 4 SFP/SFP+ ports (22-33), 5 SFP ports (34-41)".
      THE MASTER PRINTS ALL FORTY-TWO NUMERALS and they match Figure 121 block
      for block: 0 to 7 over the left four columns, 8 to 19 over the next six, 20
      and 21 on the stacked 100GE cage, 22 to 33 over the next six and 34 to 41
      over the last four. Even numbers on the top row throughout.
      THE DUAL-RATE PORTS COME WITH A CAVEAT THE GUIDE PRINTS ITSELF: "1 GE
      copper transceivers are supported in dual-rate ports on Cisco ASR 9901
      routers from Cisco IOS-XR Software Release 7.0.1 onwards. However, only 1
      GE data rate is supported and 10 Mbps/100 Mbps data rates are not
      supported."
  port-groups:
    confidence: drawing
    note: >-
      drawing - the twenty-four dual-rate ports are printed GRP 0 to GRP 5, six
      labels over six pairs of columns, four ports to a group: GRP 0 over ports 8
      to 11, GRP 1 over 12 to 15, GRP 2 over 16 to 19, GRP 3 over 22 to 25, GRP 4
      over 26 to 29 and GRP 5 over 30 to 33. NO DOCUMENT IN THE INTAKE SAYS WHAT
      A GRP IS on this chassis - the configuration guide's slice mechanism is
      written for the ASR 9902 and the PECs and names no groups here - so the
      labels are carried as printed and nothing is claimed about what they
      constrain. The rate legends under the blocks are the master's own: 1GE,
      10/1GE, 100GE, 10/1GE, 1GE.
  the-1588-jack-is-ethernet-doing-a-timing-job:
    confidence: drawing
    note: >-
      L76 REPORTS THIS ONE AND IT IS RIGHT TO, so here is the reading rather than
      a silenced warning. The IEEE 1588 service LAN jack sits in the `timing`
      group, because what it is FOR is telling this router the time - and it is
      seated as common/rj45-ganged-eth@1, the lamped Ethernet part, because what
      it IS is an Ethernet port. The master draws LINK and ACT beside it, and
      Table 4 of the same install guide describes the equivalent jack on the ASR
      9001 as "Service LAN Port (IEEE 1588) | RJ45 | A 10/100Mbps Ethernet Port
      for IEEE1588 Grand Master Connection through CAT5 cable".
      docs/rj45-family-design.md sorts jacks by job and this one has two, so
      whichever part it takes, one of the two rules disagrees. The lamped part is
      carried because the lamps are drawn on the hardware; taking std/rj45-ganged
      to quiet the rule would remove two lamps the device has.
  lamps:
    confidence: drawing
    note: >-
      drawing for the count and the arrangement, guide for the count again. Nine
      lamps in a three-by-three grid at the right of the control row, printed
      SSD, FAN FLT and GPS across the top, CRIT, MAJ and MIN across the middle,
      and RSP FAIL, LC STAT / INPUT OK and SYNC across the bottom. Figure 12's
      callout 8 says "Nine discrete LED indicators", which is the same nine.
      THE MIDDLE LAMP OF THE BOTTOM ROW CARRIES TWO LEGENDS, LC STAT above INPUT
      OK, and the master draws one lens for them. It is modelled as one lamp with
      both words in its description rather than as two, because two lenses is not
      what the drawing shows and nine is what the guide counts.
      THE POSITIONS ARE READ OFF A 2x RENDER BY EYE. The lamps are drawn as
      stroked circles with no fill, which the shape parser does not carry - the
      same situation cisco/a99-rp-f@1 records for its own nine. The LEGENDS are
      extracted text and their positions are exact; the lens centres are a
      consistent 2.2 mm left of their legend.
      NO STATE TABLE FOR THESE NINE IS IN THE INTAKE. The guide's RP Front Panel
      Indicators section covers the ASR 9001's cluster and the LED matrix, and
      Table 21 covers line cards, supplies and fan trays. So each lamp carries the
      colours its name implies - red for CRIT, amber for MAJ and MIN, green for
      SSD, GPS, SYNC and INPUT OK - and that is a READING of the names, flagged
      here rather than presented as sourced.
  led-matrix:
    confidence: drawing
    note: >-
      install guide for what it is, master for where. "The LED matrix displays one
      row of four characters. The matrix becomes active when the CPU powers on and
      displays the stages of the boot process, as well as displaying runtime
      information during normal operation. If there are CAN Bus Controller
      problems, error messages are displayed." Table 25 and Table 26 list the
      twenty-eight readings, and cisco/led-matrix-4@1 carries them.
      IT IS A PLACED PART NOW AND NOT PANEL DECOR. It was two decor rectangles
      until `class: display` learned to say how many characters it shows and what
      they can read; the part carries the same two rectangles, measured the same
      way, and the model can now be asked what the display says. Its box is read
      off a 2x render by eye, because the bezel is a stroked rounded rectangle the
      parser does not carry.
      NO CUTOUT IS PUNCHED FOR IT. The bezel lands on the metal and the window is
      the aperture, but nothing in the intake dimensions that aperture apart from
      the drawn window, and L63 wants a cutout to restate a component's own
      opening exactly. So the part draws its window and the panel declares no hole,
      which is what every other display in this library does.
  power:
    confidence: datasheet
    note: >-
      datasheet - Table 2 of c78-740540: "Power supply part number: A9K-1600W-AC,
      A9K-1600W-DC", "Power inputs: Worldwide ranging AC (90-265V; 50-60 Hz),
      Worldwide ranging DC (-40V to -72V)", "Power consumption: 850 watts typical,
      1100 watts maximum", and "Redundancy: Power supply and Fan redundancy".
      THESE ARE NOT THE ASR 9902'S SUPPLIES. That chassis takes PWR-1.6KW-AC and
      -DC; this one takes A9K-1600W-AC and -DC, and the master draws a 71.21 x
      39.21 mm module against the other's 74.94 x 40.91. Same wattage, different
      part, different envelope.
      THE CHASSIS FIGURE IS THE VENDOR'S AND IS NOT RECONCILED against the module
      total. 850 W typical and 1100 W maximum are what the box draws; 2 x 1600 W
      is what the supplies can give.
  ac-inlet:
    confidence: datasheet
    note: >-
      THE CORD TABLE NAMES A CONNECTOR THIS LIBRARY HAS NO PART FOR. Table 11 of
      the install guide, "AC-Input Power Cord Options for Cisco ASR 9901 Router",
      lists sixteen cords and every one is a CAB-AC-*-SG-* - sixteen amps at 250
      VAC across Europe, the UK, Japan, Australia, India and the rest, and
      CAB-AC-20A-SG-US and -US1 at twenty amps for North America. SG is Cisco's
      Saf-D-Grid, and the master draws that profile rather than a C14: a shrouded
      rectangular body with a stepped keyway.
      THE RATING IS WHY. 1600 W off a 90 V low line is nearly eighteen amps,
      which is past what a C14 carries, so the connector is not a detail somebody
      chose freely.
      THE PART NOW EXISTS AND THE MODULE COMPOSES IT. std/saf-d-grid@1 carries
      Anderson Power Products' own panel cutout - 26.80 x 19.90 mm, corners R2.5
      max, off APP drawing 115171S1 rev 12 - and cisco/a9k-1600w-ac@1 places it
      `rotate: 90` because this module mounts the receptacle upright. The gap this
      file used to carry for it is closed.
      AND THE TWO SOURCES AGREE WITHOUT EVER HAVING BEEN COMPARED. This chassis's
      rear master draws the module's aperture 19.98 x 26.51 mm at a scale set by
      the body width alone; Anderson's cutout turned a quarter turn is 19.90 x
      26.80 - 0.4 percent across and 1.1 percent down, between two documents that
      share no author, no units convention and no measurement, and neither of
      which was an input to the other.
  cooling:
    confidence: datasheet
    note: >-
      datasheet - "Redundancy: Power supply and Fan redundancy" and "Air flow:
      Front to Back", and the install guide adds the count: "Cisco ASR 9901 Router
      has three fan trays."
      THE REDUNDANCY RATIO IS NOT PUBLISHED AND IS NOT SUPPLIED. The `fan-trays`
      group carries a note and no `redundancy`, and L69 warns that this chassis
      does not say how many fans it can lose - the same ruling the ASR 9902 and
      ASR 9903 carry, and edgecore/csr310 before them.
      THE TRAY NUMBERING RUNS RIGHT TO LEFT. The master prints FAN 2 on the
      leftmost tray, FAN 1 in the middle and FAN 0 on the right, which is the
      opposite of the power modules two rows over, where PM1 is left of PM0.
      Both are carried as printed.
  power-switch:
    confidence: drawing
    note: >-
      drawing AND install guide. The master draws a recessed slider at the left of
      the control row under a yellow tag reading ATTENTION / ON-OFF FOR ENTIRE
      SHELF, and Figure 156, "Power Switch on the Cisco ASR 9901", names it. The
      step it illustrates is the same one the ASR 9902 gets: "Set the power switch
      to the ON position."
      IT IS SEATED RATHER THAN PAINTED, using common/power-switch-slide@1 - the
      part the ASR 9902 introduced - because a switch is a thing a viewer should
      be able to click. THE TAG WORDING IS THE CHASSIS'S OWN and is printed here
      rather than taken from the part: this chassis says ON-OFF FOR ENTIRE SHELF
      where the ASR 9902 says ON-OFF, and the component's own tag carries the
      shorter wording.
      THERE IS NO SEPARATE POWER-STATUS LAMP BESIDE IT on this chassis. The ASR
      9902 has one; here the master draws none, and the nine-lamp cluster carries
      INPUT OK instead.
  grounding:
    confidence: drawing
    note: >-
      install guide for what it is, master for where. Figure 76, "NEBS Bonding and
      Grounding Points on the Cisco ASR 9901 Router". The rear master draws a
      two-hole lug landing on the panel above the power modules, holes 15.96 mm
      apart on centres, with an IEC 60417-5019 earth mark beside it.
      cisco/a9k-ground-pad@1 carries a 15.3 mm two-hole pitch, which covers it to
      within 0.66 mm, and it is placed unrotated because the lug lies flat.
  air-filter:
    confidence: datasheet
    note: >-
      NOT DRAWN. The ASR 9901 ordering table in c78-740540 lists no filter PID -
      unlike the ASR 9902 and ASR 9903, which both have one - and the install
      guide's air-filter chapter covers the 9001, 9902 and 9903 and not this
      chassis. So there is nothing to draw and nothing to record as missing.
      ASR-9901-CAB-MGMT is left out for the reason the modelling guide gives for
      cable management generally: it is not a panel fact.
