  width: 439.93
  height: 87.12
  depth: 599.95
  ru: 2
  weight-kg: 25.4
  airflow: front-to-back
  color: '#c8cacc'
  silk: '#231f20'
gaps:
- what: chassis-height-sources-disagree
  reason: sources-disagree
  note: >-
    TWO CISCO DOCUMENTS GIVE THIS CHASSIS TWO HEIGHTS. The ASR 9901 Router Data
    Sheet (c78-740540) Table 2 says "Height: 3.43 inches (8.7 cm)", which is
    87.12 mm. The fixed-port Hardware Installation Guide says "Height of the ...
    Cisco ASR 9901 Router and Cisco ASR 9001 Router is 3.47 inches (8.8 cm)",
    which is 88.14 - and note that one sentence covers two chassis, and that 3.47
    in is the ASR 9001's own data sheet figure.
    THE DATA SHEET IS CARRIED AND THE STENCIL IS WHY. The rear master's shape box
    reads 87.38 mm and its body ink, at the scale set by the body WIDTH alone,
    comes out 87.11 mm - a hundredth of a millimetre from the data sheet's 87.12,
    on an axis that was never anchored to it. The guide's sentence looks like a
    sibling's number reused; it is recorded here rather than dismissed.
  wanted: >-
    a ruler on a real ASR 9901, or a Cisco mechanical drawing.
  blocks: []
- what: led-matrix-reading-axis-is-undrawn
  scope: [front]
  reason: needs-drawing
  note: >-
    THE DISPLAY IS MODELLED AND ITS READING DIRECTION IS NOT. cisco/led-matrix-4@1
    carries the guide's "one row of four characters" and the twenty-eight readings
    of Tables 25 and 26, so the model can be asked what this display says.
    THE WINDOW STANDS ON END, and that much is now settled by three sources rather
    than by one traced twice: the stencil master, Figure 12's line art, and the
    data sheet's three-quarter product photograph, which is not a drawing and shows
    a dark dotted window standing tall beside the CISCO wordmark. So a row of four
    characters in it reads TURNED.
    WHICH WAY IT TURNS IS IN NOTHING. Up or down, no document says, and the
    photograph is of a dark panel. So the skin draws the window and nothing in it,
    `characters: 4` is Cisco's sentence rather than a reading of the artwork, and
    no rotation is claimed.
  wanted: >-
    a photograph of a POWERED ASR 9901 front panel - the matrix mid-boot would read
    it off in one frame - or any Cisco drawing that puts characters in the window.
  blocks: []
- what: fan-bay-labels-sit-on-the-tray-flange
  scope: [rear, fan-trays]
  reason: needs-drawing
  note: >-
    FAN 2, FAN 1 and FAN 0 are printed bottom-to-top on a narrow rail at the right
    of each tray, and the tray's own drawn plate covers that rail - the captive
    screw sits on the same strip. This model draws each tray as a filled
    rectangle, so the three marks land under their bays and L21 reports them. The
    marks are kept where the master puts them rather than moved somewhere they
    would render, because moving them would put ink where the device has none. It
    is the same defect cisco/asr-9902 and cisco/asr-9903 carry and the same fix
    closes all three.
  wanted: >-
    cisco/asr-9901-fan@1 drawn with its flange cut away where the chassis prints
    the slot label, so the mark shows through.
  blocks: []
- what: nine-alarm-lamps-have-no-state-table
  scope: [alarms]
  reason: vendor-silent
  note: >-
    The nine lamps are counted by Figure 12's callout 8 and printed by the
    master, and no document in the intake says what their colours mean. The
    guide's RP Front Panel Indicators section describes the ASR 9001's cluster
    and the LED matrix; Table 21, "LEDs at System Startup", covers line cards,
    power modules and fan trays. Searched both, plus the data sheet, for each
    legend by name.
    SO THE COLOURS ARE READ OFF THE NAMES - red for CRIT, amber for MAJ and MIN,
    green for SSD, GPS, SYNC and INPUT OK - and every one of the nine says so in
    its own description rather than leaving the reading to be inferred from the
    fact that a colour is written down.
  wanted: >-
    a Cisco LED table for the ASR 9901 front panel.
  blocks: []
- what: four-faces-carry-no-documented-feature
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    THE TOP, BOTTOM AND TWO SIDES ARE SIZED AND NOT DRAWN, and each carries an
    `empty:` sentence saying where the search ran. No source in the intake
    elevates them: the stencil's 119 masters are front and rear elevations, the
    install guide's figures for this chassis are two elevations, a top-view
    FOOTPRINT (Figure 20, which dimensions the outline and draws no feature), an
    airflow path, a two-post mounting figure, a clearance diagram and an
    unpacking sequence, and the data sheet gives the envelope.
  wanted: >-
    a Cisco mechanical drawing of the ASR 9901, or orthographic photographs of
    the top and one side with something of known size in frame.
  blocks: []
- what: the-9901-and-9902-fan-trays-may-be-one-part
  scope: [fan-trays]
  reason: sources-disagree
  note: >-
    cisco/asr-9901-fan@1 measures 88.62 x 81.70 mm off this chassis's rear master
    and cisco/asr-9902-fan@1 measures 88.58 x 82.18 off the ASR 9902's - four
    hundredths of a millimetre apart across and half a millimetre down, which is
    inside what either reading can resolve. Cisco's ordering tables give them
    different part numbers, ASR-9901-FAN and ASR-9902-FAN, and that is the only
    reason this library holds two contracts.
    WHAT WOULD SETTLE IT is a photograph of either tray's label, or the two in
    one hand. If they are one part, one contract should carry both chassis and
    the ASR 9901's missing power figure is answered by the ASR 9902's 72 W - which
    is exactly why the two are not merged on a drawing's say-so.
  wanted: >-
    a label photograph of an ASR-9901-FAN, or a Cisco document that dimensions
    either tray.
  blocks: []
