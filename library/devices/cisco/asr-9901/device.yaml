configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - built from the group roles rather than from a vendor bundle: the
      service bays keep their seats, and this chassis has no traffic bay to empty
      because its forty-two ports and its route processor are integrated. Cisco
      publishes no base bundle for it - the ordering table in c78-740540 lists the
      chassis, the two supplies, the fan tray and the cable management as separate
      line items.
    description: >-
      Chassis only - what you spec before deciding what goes in it. Two AC
      supplies and all three fan trays are seated. Everything else on this router
      is part of the chassis: the route processor is integrated, and so are the
      forty-two ports, the timing and management jacks, the nine alarm lamps and
      the LED matrix.
  ac:
    kind: orderable
    description: >-
      The AC build: two A9K-1600W-AC modules, 1+1, on Saf-D-Grid cords -
      CAB-AC-16A-SG-* at 16 A 250 VAC worldwide, CAB-AC-20A-SG-US and -US1 at 20 A
      for North America. Named explicitly even though the base already seats them,
      so that asking for the AC variant does not mean knowing which flavour the
      base happens to carry.
    part-numbers:
      ASR 9901 Router, AC supplies:
        part: ASR-9901
    bays:
      pm-0: cisco/a9k-1600w-ac@1
      pm-1: cisco/a9k-1600w-ac@1
  dc:
    kind: orderable
    description: >-
      The DC build: two A9K-1600W-DC modules over the -40 to -72 VDC range, 1+1.
      The chassis PID is ASR-9901 either way; the supplies are separate line
      items.
    part-numbers:
      ASR 9901 Router, DC supplies:
        part: ASR-9901
    bays:
      pm-0: cisco/a9k-1600w-dc@1
      pm-1: cisco/a9k-1600w-dc@1
