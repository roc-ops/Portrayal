gaps:
- what: bay-extents-reconciled-rather-than-measured
  scope: [slots]
  reason: needs-drawing
  note: >-
    THESE BAY DIMENSIONS WERE GROWN TO MEET A COMPONENT AND ARE NOT MEASUREMENTS. Each was set by
    taking the size of a card the bay accepts, because a fit check reported the bay as too small.
    On this chassis:
    403.10 on 8 bays - the 5th-generation envelope, 403.10 long
    406.40 on 2 bays - a9k-rsp, 406.40 long
    The danger is specific and it is why they are listed rather than left to look like geometry.
    A fit check compares a bay to a component and NEITHER of them to the world, so it is satisfied
    by both being wrong together exactly as easily as by both being right. Every mismatch resolved
    by moving one side removes the signal without adding any truth, and once resolved nothing will
    flag it again. These are the entries where that happened, so the record survives the check
    going quiet.
    What IS independently grounded and is not in this list: the cage extents, measured off the
    stencil and confirmed on several chassis by printed slot labels or a card guide rail; the slot
    pitch; the 395.70 fourth-generation envelope, which is Cisco's own "includes ejector
    bracket/lever" figure; and the shapesheet sizes for the power modules and fan trays. The
    ejector arithmetic that explains why a bay legitimately exceeds its cage opening - 355.60
    against 395.70, 40.10 mm - is also sourced, and it justifies the SHAPE of these numbers
    without justifying any particular one of them.
  wanted: a dimensioned figure giving the clear opening of any ASR 9000 card cage, which would
    replace every reconciled figure above with a measured one
- what: neighbour-constraint-excludes-the-control-card-length
  scope: [slots]
  reason: sources-disagree
  note: >-
    A THIRD LINE OF EVIDENCE ON THE ~428 mm CONTROL CARDS, derived rather than asserted, and it
    comes from parts that have nothing to do with the question. The vertical space available to a
    card is bounded by whatever structure sits above and below its cage, and on this chassis that
    space measures the figure recorded in card-envelope-headroom below. A card envelope larger than
    that cannot be installed whatever any data sheet says, because something else is already there.
    Applied across the family:
        ASR 9010   399.96 mm between the cable management tray and the card guide bar
        ASR 9910   421.79 mm between the tray band and the front air intake
        ASR 9922   420.30 mm between the tray band and the fan band
        ASR 9912   439.21 mm - does NOT exclude 428.5, so this chassis is silent on the question
        ASR 9906   unbounded above in the model, so no constraint is derivable
    Three of the five independently exclude a 428.2-428.5 card. That is a separate argument from
    the slot pitch and from the ejector arithmetic, and it agrees with both. THE 9912 DOES NOT
    EXCLUDE IT and is recorded as silent rather than as agreement - a constraint that fails to
    bite is not evidence either way, and reporting it as if it were would manufacture support.
    The 9010's 399.96 also sits 3.14 mm under the 403.10 fifth-generation envelope its bays now
    carry, which is a smaller open question of the same kind.
  wanted: a figure dimensioning the clear vertical opening of any ASR 9000 card cage, which would
    turn all of this from derived to measured
- what: rsp880-length-also-exceeds-the-cage
  scope: [slots]
  reason: sources-disagree
  note: >-
    THE SECOND AXIS OF THE SAME CONFLICT, and it makes the first one much harder to explain away.
    The RSP-880 family is published at 428.5 mm on its long axis. Two Cisco statements fix what a
    line card measures on that axis in this family: Table A-10 of OL-17500-09 gives the
    original-generation card 14 in (355.60 mm) with NO qualifier, and the 4th-generation data
    sheets give 15.58 in (395.70) explicitly "including ejector bracket/lever". The 40.10 mm
    between them is the ejectors, about 20 mm each end - which is also why a bay declared at the
    395.70 envelope is legitimately longer than the cage opening it sits in.
    Against that, 428.50 does not reconcile. Subtract the same 40.10 of ejector and the plate would
    still be 33.45 mm longer than this chassis's measured cage - a cage independently confirmed to
    0.65 mm by Table A-10's own 355.60. So BOTH published RSP-880 dimensions, 46.0 thick and 428.5
    long, are irreconcilable with a cage that two unrelated sources agree on.
    That is why the bays were NOT inflated to hold it. Building five chassis around a pair of
    numbers that contradict the only independently confirmed dimension in the family would put the
    error into the geometry instead of into the record. The accepts keep the RSP-880 where Cisco
    names it; the bays stay at what the cage and the reconcilable envelopes allow.
  wanted: the RSP-880's plate dimensions as distinct from whatever 46.0 x 428.5 measures, or a
    photograph of an RSP-880 beside a line card
- what: rsp880-width-exceeds-every-measured-pitch
  scope: [slots]
  reason: sources-disagree
  note: >-
    Cisco's RSP-880 and RSP880-LT data sheet gives "Height: 1.81 in. (4.60 cm)", i.e. 46.0 mm, and
    names the ASR 9006, 9010, 9904, 9906 and 9910 as the chassis they are the system processor for.
    THAT WIDTH EXCEEDS THE MEASURED SLOT PITCH ON EVERY CHASSIS IN THE FAMILY:
        9010 44.33   9906 43.42   9910 43.78   9912 44.06   9922 44.06
    and three of those pitches are measured from PRINTED SLOT LABELS or a card guide rail with a
    spread of 0.11 to 0.20 mm - among the best-supported numbers in this library. A card cannot be
    thicker than its slot, so 1.81 in is not the seating width; it is most likely taken over the
    ejector levers, the same way Cisco's line card "Width" is stated as "includes ejector
    bracket/lever" elsewhere.
    The accepts lists keep the RSP-880 family where Cisco names it, because a compatibility claim is
    Cisco's to make. The bays are sized to what the measured opening can hold. So a reader will find
    a bay narrower than a component it accepts, and that is a RECORDED CONFLICT between two sources
    rather than an oversight - the alternative was to inflate five chassis' geometry to fit one
    published number that three independent pitch measurements contradict.
  wanted: the RSP-880's seating width as distinct from its over-ejector width, or any Cisco
    statement of an ASR 9000 slot pitch
- what: power-module-width-disagrees-with-the-component
  scope: [power-modules]
  reason: sources-disagree
  note: >-
    cisco/a9k-pwr-3kw-ac@1 states 142.78 mm wide. Three of them need 428.34 mm and this chassis's
    power shelf interior measures 416.50, so they do not fit - lint L13 flagged the overlap
    directly when they were placed at the measured centres. Against that, the stencil's shape box
    for the 'A9K Power Module' master reads 0.5477 in, which is 139.12 mm at the stencil's 1:10
    scale, and my own measurement of the three openings in the ASR 9006 front master gives 138.35,
    137.50 and 138.23. Those two agree to under a millimetre, and three at 139.12 come to 417.36
    against a 416.50 shelf - the arithmetic a shelf that holds exactly three ought to produce.
    The 142.78 is most likely the art measured over something that is not the module's seating
    width, the same class of error as reading a card's shape box instead of its art. The bays here
    are sized to the measured openings, so the chassis is right and the component and the chassis
    disagree by about 3.7 mm until someone re-measures the master.
  wanted: a re-measurement of the 'A9K Power Module' stencil master, or a Cisco dimension for the
    version 1 power module
- what: rsp-slot-width-is-a-lower-bound
  scope: [slots]
  reason: needs-drawing
  note: >-
    The two RSP slots are 46.0 mm because that is the RSP-880's published thickness and Cisco names
    this chassis as one it serves - so 46.0 is a LOWER BOUND on the slot, not a measurement of it.
    The eight line card slots are 41.4 on the same basis. The 20.12 mm those twenty-two millimetres
    of card leave over is distributed as eleven equal guides, which is arithmetic rather than
    observation: the real chassis may well have wider guides between the cages and narrower ones
    within them. What IS solid is that an even ten-way division is impossible, since 44.33 is
    thinner than a card Cisco says seats here. Searched and not found: any per-slot width in the
    Ethernet Line Card Installation Guide, the Hardware Installation Guide or the Overview and
    Reference Guide, and the stencil master draws the cage as a single undivided rectangle.
  wanted: a dimensioned front elevation, a per-slot width from any Cisco document, or a tape
    measure on a real ASR 9010
- what: fan-tray-split
  scope: [front, fan-trays]
  reason: needs-drawing
  note: >-
    The ASR 9010's two fan trays occupy the band between the card guide bar at 566.51 mm and the
    front air intake grille at 673.60 mm - 107.09 mm for the pair, which is measured and solid.
    Where one ended and the other began was NOT measured. Scanning that band finds a dark
    separator at about 605.8 mm, but it does not bisect the band (39.3 mm above it, 66.9 mm below),
    so it was read as internal faceplate detail rather than the boundary, and an EVEN split was
    recorded as the right inference: the master labels both trays "ASR-9010-FAN", so they are the
    same part stacked twice and the same part is the same height.
    RESOLVED, AND THE SEPARATOR WAS THE BOUNDARY AFTER ALL. Dismissing it assumed the two trays
    fill the band, and they do not - two trays of 33.32 come to 66.64 of 107.09. cisco/asr-9010-fan
    was measured off this chassis's own front master at y 571.44 to 604.76, and that bottom edge
    and the separator at 605.8 agree to 1.04 mm: two measurements taken for different reasons,
    landing on the same line. Both trays are seated there now rather than split evenly, so the
    placement is measured and the inference is retired. What the band holds BELOW them - about
    34 mm between the second tray and the grille starting at 675.08 - is still unnamed, and the
    band stays ONE cutout because a single opening with two trays in the top of it and intake
    beneath is what the guide's own cooling-path figure (Figure 71) draws.
  wanted: a dimensioned front elevation, or the ASR-9010-FAN spare-part drawing
- what: bays-awaiting-components
  scope: [front, fan-trays, power-shelves, power-modules]
  reason: needs-drawing
  note: >-
    The card slots are bays and accept the line card and RSP blank. THE FAN TRAYS HAVE SINCE
    LEFT THIS LIST - cisco/asr-9010-fan now exists and both are seated as bays at the
    positions its own size provenance measured off this chassis's front master. The eight
    power module positions and the air filter are still NOT modelled as bays, because a bay
    must name a component that fits it and library/components/cisco/ carries no version 2
    or 3 power module and no filter. Their openings ARE measured and are drawn as cutouts, so the
    metal is right and only the occupants are missing. The power shelf openings are 13.96 to
    431.66 mm at y 811.74 and 873.33; the fan band is 566.51 to 673.60. Pointing them at the line
    card blank would lint clean and claim something false - a 41.4 x 395.7 filler plate does not
    cover a power module opening.
  wanted: an ASR 9010 fan tray, the version 2 and 3 AC and DC power modules, and the chassis air filter
- what: cable-management-tray-branding
  scope: [front]
  reason: needs-drawing
  note: >-
    The cisco logo, the "ASR 9000 Series" wordmark and an "OPEN" legend are printed on the CABLE
    MANAGEMENT TRAY, not on chassis metal - the stencil master draws them inside that band. Per the
    skill, text on a part's own face is that part's silkscreen, so this chassis deliberately carries
    none and the tray is not modelled as a placement for want of a component. The band itself is
    measured (0 to 163.76 mm) and drawn as decor, so the metal is right and only the printing and
    the tray are absent. This is the same decision taken on the ASR 9006's fan tray door.
  wanted: a cable management tray component carrying its own branding
- what: bottom-face-is-undocumented-family-wide
  scope: [bottom]
  reason: vendor-silent
  note: >-
    THE BOTTOM IS THE ONLY FACE OF THIS CHASSIS WITH NO SOURCE, and it is not a gap in this file's
    research. There is no bottom view of ANY ASR 9000 chassis anywhere in the 78-document intake:
    every figure caption in all 65 PDFs was searched for "Bottom View", "underside" and "bottom of
    the chassis", and the result is zero hits. That is a fact about how Cisco documents a rack
    chassis rather than about this model - a face that sits on rack rails and is never serviced
    gets no figure.
    The face is SIZED correctly from Table 13, so a rack elevation and the 3D box are the right
    shape; what it lacks is any statement of what is on it. Nothing is invented to fill it, and no
    region is added naming the absence, because a check passed by annotating that you have nothing
    is worse than a check failed honestly.
    THIS HOLDS THE CHASSIS AT CAPABILITY 2. Front, rear, top, left and right all now carry sourced
    content; the bottom alone does not, and level 3's implementation requires content on all six.
    The written design asks only that six faces be "present, sized, and mutually consistent", which
    this file satisfies - the content requirement comes from `_has_content`, which was written for
    level 1. See working/notes/deliberately-empty-faces.md.
  wanted: a bottom elevation, a photograph of the underside, or a way for a view to declare itself
    deliberately empty so that empty-by-verification counts where empty-by-omission does not
