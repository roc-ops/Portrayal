format: 1
kind: device
name: c1300-24t-4g
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: C1300-24T-4G
portfolio: {line: Catalyst, family: Catalyst 1300}
description: >-
  Fixed 1RU Catalyst 1300 switch with 24 10/100/1000 ports and four 1 Gigabit SFP uplink cages, no PoE.
  The AC supply is built in and the switch has no fan. The front carries the 24 jacks in two blocks of
  six columns by two rows with a row of arrow lamps under them numbered 1 to 12 and 13 to 24, the four
  SFP cages numbered 25 to 28, and at the left a RESET button, a USB Type-C port, a stacked USB Type-A
  over RJ-45 pair and a blue console strip. The rear carries the C14 AC inlet with its printed rating,
  a security-lock slot and four screws. The 19-inch brackets ship in the box.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      "Cisco Catalyst 1300 and 1300X Series Switches" data sheet, Cisco public, (c) 2026, document 3659554-09,
      41 pages (https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-1300-series-switches/nb-06-cat1300-ser-data-sheet-cte-en.pdf):
      the physical table (p25), power use (p21), dimensions (p30-31), weights (p32), power, operating
      temperature and certifications (p33), fans and MTBF (p34), package contents (p35) and the ordering
      table (p36-37). The NetBox device type C1300-24T-4G and its front and rear elevations cisco-c1300-24t-4g.front.png
      and cisco-c1300-24t-4g.rear.png, community files and not Cisco's. No Catalyst 1300 installation
      guide, no photograph of a single SKU and no 3D model is held. The data sheet's family photograph
      is unlabelled and is not used.
  gate-1:
    confidence: photo-measured
    note: >-
      FRONT. The elevation is 2479 x 253 px, aspect 9.80, against 444.3 / 43.94 = 10.11 for the body.
      The picture is cropped at its right edge (the metal runs to the last column) and carries about 5
      px of margin at the left and 9 px of shadow and lip at the top and 3 px at the bottom. Its jacks,
      cages and legends stand at the same pixels as on the 24P's elevation, so the front is read at the
      same scale: the metal from x 5.5 to 2483 (the printed 444.3 mm, 5.58 px per mm, checked on the jack
      pitch, which steps 78.0 px, 13.98 mm against the registry's 13.97) and from y 9 to 250 (241 px for
      the printed 43.94 mm, 5.48 px per mm, 1.8% under the horizontal). Every front x is (px - 5.5) /
      5.58 and every y is (px - 9) / 5.48; across the figures are good to about 0.2 mm, down to about
      0.5 mm. The right edge of this picture lies 5 px inside the metal, so no x past 440 mm is read from
      it. REAR. The elevation is 2508 x 256 px, aspect 9.80. The metal runs from x 3 to 2485 (2482 px
      for the printed 444.3 mm, 5.586 px per mm) and from y 7 to 247 (240 px for 43.94 mm, 5.46 px per
      mm, 2.3% under the horizontal). Every rear x is (px - 3) / 5.586 and every y is (px - 7) / 5.46,
      good to about 0.2 mm across and 0.5 mm down. The inlet's housing reads 31.5 x 24.6 mm, which is
      not the registry's 28 x 20 opening, so the part is centred on the housing.
  chassis:
    confidence: datasheet
    note: >-
      444.3 x 240 x 43.94 mm (17.49 x 9.45 x 1.73 in), data sheet p30, in its W x D x H order. 444.3 is
      the body: neither elevation shows ears. 1RU. Weight 2.63 kg (5.80 lb), p32.
  front-layout:
    confidence: photo-measured
    note: >-
      From the NetBox front elevation at the scales in gate-1. Two beige jack plates 87.6 and 87.3 mm
      wide at 168.2 and 272.2 mm, top 8.7 mm, 26.5 mm tall. Six columns of two jacks in each on the registry's
      13.97 mm pitch, the first jack at 170.3 mm and the seventh at 274.5 mm, a 20.28 mm gutter beyond
      the pitch. The cell tops read 9.5 and 23.9 mm, a 14.4 mm row step; the upper jacks show their keyway
      up and the lower their keyway down. The four SFP cages are 14.0 mm wide at a 19.0 mm step, centres
      372.3, 391.3, 410.3 and 429.3 mm, centred 29.6 mm down, so the 14.5 x 10.0 registry cage is placed
      on those centres. The stacked housing at the left is 16.8 x 21.7 mm at 30.8, 13.0 mm. Its USB Type-A
      opening is centred 39.2, 17.2 mm and its RJ-45 opening 39.2, 29.3 mm; the registry parts are centred
      on those. The USB Type-C port reads 9.6 x 3.3 mm centred 23.1, 33.2 mm. The reset button is 4.1
      mm across, centred 12.0, 31.0 mm. The colours are medians of the elevation: face #e7e6e6, plates
      #d2cac0, console strip #b5d5e3.
  port-numbering:
    confidence: photo-measured
    note: >-
      The elevation prints 1 and 12 at the ends of the first block's arrow row, 13 and 24 at the ends
      of the second's, and 25 and 28 at the ends of the uplinks, with an arrow for each port: an up arrow
      for the upper jack of a column and a down arrow for the lower. So the upper jack takes the odd number
      and the lower the even, and the numbers run along the columns from the left, 1 to 24, then the four
      cages 25 to 28. Only those six numerals are printed and drawn. NetBox names the interfaces GigabitEthernet1
      to 28 and types the four cages 1000base-x-sfp; no Cisco document held gives interface names, so
      none is written as an `interfaces:` block. The elevation has no PoE strip, bracket or legend, as
      it has no PoE.
  lamps:
    confidence: estimated
    note: >-
      estimated - the elevation shows no lamp except the arrows. The data sheet's LED row (p25) lists
      "System, Link/Act, PoE, Speed" and no held document says where they are or what they show. The 28
      grey arrows by the ports are drawn as the library's arrow lamps, and the faint two-gear pictogram
      under the reset button as the System lamp. The arrows are at 3.4 mm and 10.4 mm from the left of
      each column and 39.2 mm down; the cage arrows are centred under their cages.
  console-and-usb:
    confidence: photo-measured
    note: >-
      The data sheet (p25) lists "Cisco standard RJ-45 console port and USB Type C port" and one reset
      button, and calls the USB port the Type-C port on the front panel; its text on the Bluetooth dongle
      (p4) says the dongle "plugs into the USB port on the switch". THE ELEVATION SHOWS A USB TYPE-A PORT
      as well, the upper half of the stacked housing under a USB symbol, with the RJ-45 below it and the
      USB Type-C port to its left. NetBox lists three console ports: RJ-45, USB-C and USB-A. The Type-A
      port is drawn from the elevation as a USB port and not as a console; the Type-C port is the console.
      The blue strip under the three ports carries a console pictogram. The Type-A port's generation is
      not stated, so the white (USB 2.0) skin is used, which claims less than the blue one.
  rear-layout:
    confidence: photo-measured
    note: >-
      From the NetBox rear elevation. The C14 inlet's black housing is 31.5 x 24.6 mm centred 402.1, 21.6
      mm, with the printed rating "AC INPUT RATING: / 100-240V~ / 700mA, 50-60Hz" in three lines centred
      402.1 mm under it. At the left a security-lock slot 3.0 x 7.1 mm at 6.4, 14.5 mm with a lock pictogram
      under it, and four screws at x 7.7, 106.2, 264.2 and 434.8 mm, 34.6 mm down. The picture also shows
      an angled end plate at each side, a white clip above the inlet, a few thin printed outlines and
      two notches by the end plates; they are not drawn. The rear shows no vent, no fan and no label.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      "100-240V 50-60 Hz, internal, universal" (p33): the supply is built into the chassis, part of it
      and not a bay. The C1300-24T-4G is fanless (p34), so no fan is drawn and no fan bay is declared;
      the rear elevation shows none. The data sheet states no fan redundancy. NetBox types the power port
      iec-60320-c14, maximum draw 15 W; the data sheet's worst case is 14.8 W.
  power-use:
    confidence: datasheet
    note: >-
      Power consumption (worst case), p21: system 14.6 W at 110 V and 14.8 W at 220 V; "N/A" with PoE;
      50.5 BTU/hr; idle 4.9 W at 110 V and 5.2 W at 220 V.
  ears:
    confidence: estimated
    note: >-
      "Only 24-and 48-port models include the 19-in mounting brackets with the switch" (p35, again p40)
      and the ordering table reads "Rack-mountable" (p36). No held document draws the brackets, gives
      their positions or a part number, so the shipped position is declared as the default with no `at`,
      no kit is listed and the ears are not drawn. The accessory table's RCKMNT-CMPCT-1K= is for the 8,
      12 and 16 port models and is not this device's.
  logo:
    confidence: photo-measured
    note: >-
      The Cisco logo and wordmark at 9.4 to 22.5 mm and 4.7 to 11.5 mm are not drawn; a logo-zone reserves
      the place. The printed "Catalyst 1300 Series" is drawn as plain text.
attrs:
  physical: {weight-note: '2.63 kg (5.80 lb), data sheet p32'}
  performance: {switching-capacity: 56 Gbps, forwarding-rate: 41.67 Mpps (64-byte packets)}
  power:
    power-max-w: 14.8
    power-envelope: fully-configured
    power-system: 14.6 W at 110 V, 14.8 W at 220 V (system power consumption, worst case)
    power-idle: 4.9 W at 110 V, 5.2 W at 220 V
    heat-dissipation-btu-hr: 50.5
    power-input-ac: 100-240 V, 50-60 Hz, internal, universal
    power-current-max: 700 mA (printed on the rear)
  thermal: {cooling: fanless}
  environmental: {operating-temp: -5 to 50 C (23 to 122 F); cold start from 0 C (32 F), storage-temp: -25
      to 70 C (-13 to 158 F), humidity: '10 to 90%, relative, noncondensing', mtbf-hours: '664,987 at
      25 C'}
  platform: {processor: ARM dual-core at 1.5 GHz, memory: 1 GB DDR4, flash: 1 GB SLC}
  features:
    optics-sfp: >-
      The ordering table calls the four uplinks "4x Gigabit SFP" (p36). The data sheet's supported-optics
      table (p27-29) is not keyed by model; its 1000 Mbps SFPs are MGBSX1, MGBLX1, MGBLH1, MGBT1, GLC-SX-MMD,
      GLC-EX-SMD, GLC-ZX-SMD, GLC-LH-SMD, GLC-BX-U, GLC-BX-D, GLC-TE and the CWDM-SFP-1470 to -1610 series.
  management: {reset: recessed button on the front panel}
  compliance:
    certifications: UL (UL 62368), CSA (CSA 22.2), CE mark, FCC Part 15 (CFR 47) Class A
  lifecycle: {eol: none-announced}
chassis:
  width: 444.3
  height: 43.94
  depth: 240.0
  ru: 1
  weight-kg: 2.63
  color: '#e7e6e6'
  ears:
    positions:
    - {name: flush, default: true}
  power: ac
gaps:
- what: ears
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The data sheet says the 19-inch brackets ship with the switch and holds no figure of them, no position
    and no part number. No Catalyst 1300 installation guide is held. The ears are declared with the default
    position and no `at`, and no kit is listed.
  wanted: The Catalyst 1300 hardware installation guide's rack-mounting section.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    The data sheet lists the LEDs "System, Link/Act, PoE, Speed" and nothing more; no document held says
    which lamp shows what, where the PoE and Speed lamps are, or whether the arrows by the ports are the
    Link/Act lamps. The arrows and the System lamp carry the component's own vocabulary and no meaning
    is stated.
  wanted: The installation guide's LED table.
- what: usb-type-a
  scope:
  - front
  reason: sources-disagree
  note: >-
    The data sheet names a USB Type-C port and no Type-A; the NetBox elevation shows a Type-A port above
    the RJ-45 jack and NetBox lists a USB-A console. The Type-A port is drawn from the elevation as a
    USB port, not a console. Its generation is not stated.
  wanted: The installation guide's front-panel figure.
- what: pictograms
  scope:
  - front
  - rear
  reason: needs-photo
  note: >-
    The pictogram over the cages, the lock pictogram under the rear slot and the rear's thin printed outlines
    are not drawn; what they mean is not stated in any held document.
  wanted: A close-up of each face.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    Cisco's series page lists the model with no end-of-sale notice when the sources were gathered; no
    end-of-life page was held, so none is quoted.
  wanted: none
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 24 10/100/1000 ports; rel-pos is the number the front prints, the upper jack of a column takes
      the odd number
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: the four 1 Gigabit SFP uplink cages, numbered 25 to 28
  port-leds: {term: LED, role: indicator, index-origin: 1, description: one arrow lamp by each of the
      28 ports}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the console and USB group at the left of the front: an RJ-45 console, the USB Type-C console and
      a USB Type-A port, with the reset button; one job, reaching and restarting the switch when the data
      plane cannot.
  status-leds: {term: LED, role: indicator, index-origin: 1, description: the System lamp}
  power-input: {term: Inlet, role: service, index-origin: 0}
  furniture: {term: Part, role: furniture, index-origin: 1}
