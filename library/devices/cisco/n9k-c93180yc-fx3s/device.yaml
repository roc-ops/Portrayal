manufacturer: Cisco
model: N9K-C93180YC-FX3S
aliases:
- {name: Nexus 93180YC-FX3S, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX3}
description: >-
  48x 100M/1/10/25G SFP28 and 6x 10/25/40/50/100G QSFP28 1RU data-centre leaf switch running NX-OS. The
  port side carries all fifty-four ports, two coaxial timing jacks, a GNSS antenna jack and six lamps.
  The other side carries two power supplies, four fan modules, the console, the management port, a ToD
  jack and the USB port. Ports number 1-54 and run DOWN each column, odd on the top row. Ships port-side
  intake (burgundy modules) or port-side exhaust (blue).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco N93180YC-FX3S
      NX-OS Mode Switch Hardware Installation Guide, First Published 2020-07-22, Last Modified 2026-07-27,
      72 pages: the overview and its figures (art numbers 502822, 502823 and 502824), appendix B specifications,
      appendix C LEDs, appendix D kits. The Cisco N93180YC-FX3 guide (First Published 2021-02-16, Last
      Modified 2026-07-27) prints the same text and the same three figures. NO DATA SHEET, PHOTOGRAPH,
      3D MODEL OR STENCIL IS HELD for this model, and the NetBox devicetype-library is held as a path
      listing only: it names a device type for this model and no elevation, and the file was not read.
      THE GUIDE'S FIGURES ARE FLAT AND CARRY CALLOUTS: the front is 715 px native across the body, about
      1.6 px per mm, so every position here is a reading good to about a millimetre. The converted front,
      rear and side figures of the two guides are byte-identical, so the positions are the ones measured
      once for cisco/n9k-c93180yc-fx3.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's convention: the upper cage upright over the lower turned 180. THE FIGURE CANNOT CONFIRM
      IT. Its cages are drawn as front faces with the module block shaded, and the lamp band between the
      rows prints an up triangle toward the upper cage and a down triangle toward the lower, which is
      the arrangement the convention gives. The same reading holds for the three QSFP28 pairs.
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its two fold lines, is 1251 px across and 124 px down (the outer
      outline is 1260 across): aspect 10.09 against the guide's 17.3 x 1.72 in, 10.05, so 0.4% out, and
      it can be measured. 2.847 px per mm across, from 439.4 mm. The rear figure's body is 1257 px across
      and 126 down, 9.98, 0.7% out the other way, 2.861 px per mm across and 2.883 down. A repeated feature
      checks the scale: the SFP columns step 40.96 px, 14.39 mm, against the registry's 14.25 (1.0% out),
      and the two groups of twelve end 6 and 5 px short of the body's two fold lines.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure at 2.847 px per mm, origin the body's left fold line. The two groups of twelve
      SFP columns are centred at 101.9 and 277.9 mm; at the registry's 14.25 mm pitch they start at 16.4
      and 192.4, with a 5.0 mm gutter. The figure's own outlines give 14.39 mm and a 3.3 gutter; the registry's
      pitch is used because a cage's pitch is a standard, and the group centres are what the figure fixes.
      The three QSFP28 cages start at 366.9, 389.8 and 412.7: their 22.9 mm step is the figure's, 65 px,
      and is NOT the 24.4 mm of the 93180YC-EX. Their right edge, 432.7, is the figure's.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top fold line, 2.847 px per mm. The SFP cage block runs from 10.7
      to 35.8 mm; two openings of the registry's 10.4 on the registry's 15.0 row pitch fill 10.5 to 35.9,
      so 15.0 is used. The 93180YC-EX carries 16.2 for the same cage and the figure does not support it.
      The QSFP28 pairs, 10.15 high, run 10.6 to 35.75 on the same 15.0. The lamp band reads 20.9 to 25.5
      mm between the SFP rows.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table: "17.3 inches (43.9 cm)" wide, "19.5 inches (49.6 cm)" deep
      and "1.72 inches (4.4 cm) (1 RU)" high, the same row as the FX3 guide's. 439.4 mm, 495.3 mm and
      43.7 mm are carried (the inch figures converted; the centimetre figures are rounded). The guide's
      rack clearance figure gives the width with two rack-mount brackets as 19.0 in (48.3 cm).
  port-order:
    confidence: estimated
    note: >-
      The figure prints a pair of numerals over each column of cages, "1 up down 2" and so on to "47 up
      down 48", and "49 up down 50", "51 ..." and "53 ..." over the QSFP28 pairs, so the odd port is the
      upper cage. The numerals are blurred at this size; the order is the one the guide's own text gives
      (ports 1-48 and 49-54) and the printed pattern the 93180YC-EX shows, which is a relative and is
      not evidence. Port numbers are as printed; the NX-OS interface names are in the interface-names
      entry.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down to the nearest
      port." Each port lamp is green (admin up, module present, link up), amber (admin down or module
      absent) or off (up and present but no link). The figure draws an up and a down triangle in each
      SFP column's lamp band and one at each end of each QSFP28 band, with four small windows between
      them. The windows are drawn as marks and carry no state; the guide does not name them.
  front-left-block:
    confidence: estimated
    note: >-
      The figure's callout 1 is "1PPS and 10MHz SMB ports", callout 2 "GPS/GNSS antenna connector, ANT
      port is SMA Pin In" and callout 3 the lamps. Two round jacks and a larger one stand in a column
      at the left, centred 9.1 mm from the fold line and 11.1, 20.4 and 29.9 mm down; the two upper ones
      are drawn as std/smb@1 and the lower as std/sma@1 because the guide names the types. A printed legend
      sits under each: 1PPS, 10MHz, ANT. THE FIGURE'S LEGENDS ARE A FEW PIXELS HIGH. "1PPS" and "ANT"
      read; the second reads like 10MHZ and is spelled as the guide spells it, 10MHz.
  front-lamps:
    confidence: estimated
    note: >-
      Six square lamps stand in a row under the left of the SFP block, at 19.3, 28.1, 34.1, 42.5, 48.5
      and 56.9 mm and 39.3 mm down, each with a printed legend under it that the figure cannot resolve.
      THEIR NAMES ARE INFERRED: the guide's LED appendix lists BCN, STS and ENV, "located on the left
      side of the front", then SYNC, TIMING, GNSS and GPS; the legends' widths in the figure fit BCN,
      STS, ENV, SYNC, TIMING and a four-letter name, in that order, and the sixth is drawn as GNSS. Whether
      it is GNSS or GPS, and whether the timing lamps exist on every model the guide covers, are in the
      gaps.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the power-supply side is read off the rear figure (2.861 px per mm across, 2.883
      down) and is estimated. The figure shows supply 1, four fan modules, then the console jack over
      the management jack, a recessed box holding the ToD jack over the USB port, and supply 2: THE OUT-OF-BAND
      BLOCK SITS BETWEEN THE FANS AND SUPPLY 2, not beyond supply 2 as on the 93180YC-EX. The figure labels
      nothing beside the supplies, so the P1, F1 and similar strips of the EX are not drawn. Two lamps
      with a screw between them stand below the jacks.
  rear-lamps:
    confidence: estimated
    note: >-
      The two rear lamps sit 306.5 and 318.9 mm across and 37.7 mm down, with a screw between. The guide
      says of the front lamps, "The function is the same for the port and rear side of switch". Their
      legends are BCN and STS, which the 93108TC-FX3 guide's rear figure prints legibly; this guide's
      figure shows two short legends it cannot resolve.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements: typical 375 and maximum 600 W "(AC or DC)", 2047.285
      BTU per hour, the same as the FX3 guide's. The guide prints "375" with no unit and the maximum as
      "600W". The figures are the switch's draw and not a supply rating; the guide names no configuration
      or ambient.
  interface-names:
    confidence: estimated
    note: >-
      mgmt0 is stated: the guide's setup chapter asks for "the Management (Mgmt0) interface". Ethernet1/1
      to Ethernet1/54 are NOT IN ANY GUIDE HELD (searched all three for "Ethernet1/": none) and the NetBox
      device-type file, which names them, is not held, only its path. They are the slot/port form NX-OS
      uses on the fixed Nexus 9300 and are not written into the device: the faceplate prints 1 to 54.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guides' figures are uncoloured line art. #d0d2cf is the value the
      93180YC-EX's stencil sample gave, carried across as a family colour; it is a relative's figure and
      not a reading of this device.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's rack-mounting figure (art number 503557, PDF page 31) draws the NXK-ACC-KIT-1RU front
      bracket screwed to the chassis side twice, once on the drawing of the port end and once on the drawing
      of the module end, with the bracket at a different place on the side in each. The text says the
      holes used depend on the rack and on the clearance needed for interface cables, 3 inches minimum,
      and for module handles, 1 inch minimum (it prints the metric as 7.6 mm and 2.5 mm, which are centimetres).
      Those are clearances and not setbacks. The figure dimensions neither place and the guide does not
      say which the box ships with, so the two positions are written without an `at`, named for what the
      text says they clear, and none is the default. The guide's second kit, NXK-ACC-KIT2-2RU, has a procedure
      and no figure of the ears: it says the chassis slides onto the rails "until the front panel is flush
      with the front of the rack", a position it does not dimension, so no flush position is written.
attrs:
  physical:
    weight-note: >-
      21 lb (9.52 kg) chassis; each fan module 0.26 lb (0.12 kg); each 650 W AC power supply 2.42 lb (1.1 kg), no weight given for the other supplies
  power: {power-typical-w: 375, power-max-w: 600, power-envelope: unstated, heat-dissipation-btu-hr: 2047.285,
    power-input-ac: '100 to 240 V, 50 to 60 Hz', power-input-hvac: 200 to 277 V, power-input-dc: '-48
      to -72 V nominal, as printed', power-input-hvdc: 240 to 380 V, power-supply-options: '650W AC, 1200W
      HVAC/HVDC or 930W DC (two)'}
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: '5
      to 90% operating, 5 to 95% non-operating', altitude: '0 to 4000 m (0 to 13,123 ft), the specifications
      table'}
  features:
    optics-sfp28: >-
      guide: "48 100M/1/10/25-Gigabit Ethernet SFP28 ports (ports 1-48)". Auto-negotiation is not supported
      at 10G on ports 1 to 48 and on ports 49 to 52 with a QSA. SFP-10G-T-X and SFP-10G-OLT20-X are supported
      on a stated pattern of ports, with the neighbours limited to passive copper.
    optics-qsfp28: 'guide: "6 10/25/40/50/100-Gigabit QSFP28 ports (ports 49-54)"'
    timing: >-
      1PPS and 10MHz SMB ports, a GPS/GNSS SMA antenna port and a ToD RJ-45 port. The guide says PTP grandmaster
      function is supported beginning with NX-OS release 10.3(2)F.
  management: {usb: 1 USB port}
  compliance:
    regulatory: >-
      Products should comply with CEMarkings according to directives 2004/108/EC and 2006/95/EC.
    safety: >-
      CAN/CSA-C22.2 No. 60950-1 Second Edition, CAN/CSA-C22.2 No. 62368-1-19 Third Edition, ANSI/UL 60950-1
      Second edition, IEC 62368-1, EN 62368-1, AS/NZS 62368-1, GB4943
    emissions: >-
      47CFR Part 15 (CFR 47) Class A, AS/NZS CISPR22 Class A, CISPR22 Class A, EN55022 Class A, ICES003
      Class A, VCCI Class A, EN61000-3-2, EN61000-3-3, KN22 Class A, CNS13438 Class A
    immunity: EN55024, CISPR24, EN300386, KN 61000-4 series
    rohs: >-
      The product is RoH-6 compliant with exceptions for leaded-ball grid-array (BGA) balls and lead press-fit
      connectors.
  lifecycle: {eol: none-announced}
