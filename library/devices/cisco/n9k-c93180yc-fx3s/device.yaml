gaps:
- what: figures-shared-with-the-fx3-guide
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The FX3S guide and the FX3 guide print the same three figures (art numbers 502822, 502823, 502824;
    the converted files are byte-identical), and the figure prints the FX3's model name. The FX3S guide's
    overview opens "The Cisco N9K-C93180YC-FX3S switch" and lists the SMB and SMA jacks and the ToD port
    among the features it shows. It does not say that the figure is of another model.
  wanted: >-
    A figure drawn for the FX3S, or a photograph of one. The face carries the guide's figure, with the
    model name printed as N9K-C93180YC-FX3S, which is an assumption about the metal.
- what: lamp-legends-4-to-6
  scope:
  - front
  reason: needs-photo
  note: >-
    Appendix C names SYNC, TIMING, GNSS and GPS lamps. The figure draws six square lamps under the left
    of the SFP block and prints a legend under each that is a few pixels high.
  wanted: >-
    The six legends as printed, and whether the last reads GNSS or GPS. They are drawn as BCN, STS, ENV,
    SYNC, TIMING and GNSS.
- what: altitude-3048-or-4000
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    The guide's Altitude Requirements say "Altitude rating is 10,000 ft (3048 m). For China, it is 6,562
    ft (2000 m)." Its Environmental Specifications table says operating "0 to 13,123 feet (0 to 4,000
    meters)". Same measure, same scope, same guide.
  wanted: >-
    Which is the rating. The table's figure is carried in the attrs, as the 93180YC-EX's was.
- what: kit-named-without-contents
  scope:
  - front
  reason: vendor-silent
  note: >-
    The guide's installation options list "Rack-mount kit (N3K-C3064-ACC-KIT) which you can order from
    Cisco" and say nothing else of it: no contents, no figure, no procedure, no depth range. Its Airflow
    Sleeve section says the sleeve is only compatible with this kit.
  wanted: >-
    The kit's contents and its rack depth range, from a document that describes it. It is not listed under
    the kits of this device, because a kit needs parts and a range.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The guide's overview shows one side wall
    in three-quarter view and calls out its mounting-bracket screw holes and a grounding pad; none is
    flat and none can be measured. Each face carries an `empty:` sentence.
- what: supply-weights-not-given
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's weights table gives 2.42 lb (1.1 kg) against the 650 W AC supply and has no row for the
    1200 W HVAC/HVDC or the 930 W DC supply. No weight is carried for either.
  wanted: The weight of the N9K-PUV-1200W and the NXA-PDC-930W, from a document that prints it.
- what: other-supplies-and-fans-have-no-picture
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A picture of the 930 W DC and the 1200 W HVAC/HVDC supply. The guide's figures show AC supplies only,
    and its replacement chapter has no picture. Their faces are the AC supply's with the inlet changed.
- what: sizes-off-a-figure
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A stated size for the supply and the fan module. The guide gives "Form factor RSP1" for every supply
    and nothing for the fan.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the precision-timing jacks: two SMB coax jacks for the 1PPS and 10MHz signals, an SMA jack for the
      GNSS antenna and, on the other side, a ToD RJ-45. Two media, one job: giving the switch a time and
      frequency reference.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block between the fan modules and supply 2: an RJ-45 console port, an RJ-45 management
      port and a USB port. Three media, one purpose: reaching the switch when the data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        installation guide: "Power supply modules (two-One for operations and one for redundancy [1+1])".
        Slot 1 is on the left and slot 2 on the right.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Installation guide, Overview: four fan modules of two rotors each. The guide says the switch "runs
        with +1 redundancy mode" and does not sustain a second failed fan. It works with one rotor failed
        in any one module and, with more than one rotor failed, warns and powers down in two minutes.
