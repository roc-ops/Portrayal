configurations:
  ac-650w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-650W-PI supplies and four NXA-FAN-35CFM-PI fan modules: port-side intake airflow, burgundy
      latches
    default: true
    part-numbers:
      N9K-C93180YC-FX3S: {part: N9K-C93180YC-FX3S}
  ac-650w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-650W-PE supplies and four NXA-FAN-35CFM-PE fan modules: port-side exhaust airflow,
      blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C93180YC-FX3S: {part: N9K-C93180YC-FX3S}
    component-attrs:
      nxa-fan-35cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-650w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
