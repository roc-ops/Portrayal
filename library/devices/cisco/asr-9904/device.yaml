gaps:
- what: card-openings-are-cutouts-not-bays
  scope: [front]
  reason: needs-drawing
  note: >-
    The four card slots are drawn as CUTOUTS, and this is a deliberate refusal rather than an
    unfinished model. A bay must name a component that fits it, and the only Cisco blank in the
    library - a9k-slot-cover, part numbers A9K-LC-FILR and A9K-LC-FILR-V2 - measures a plate of
    42.05 x 362.24 mm. This chassis's opening is 372.27 mm wide, so that plate would leave a 5 mm
    gap at each end and would not cover it. That is consistent with A9K-LC-FILR being the
    ASR 9006/9010-era part, sourced as it is from the Ethernet Line Card Installation Guide, and
    the ASR 9900 generation having its own filler. Declaring it anyway would lint clean and claim
    something false about a product. Every measurement is here and converting these four cutouts
    to bays is mechanical once a part that fits exists.
  wanted: the ASR 9900 generation's line card and RP blank, or a Cisco table giving chassis support per card
- what: power-module-openings
  scope: [front]
  reason: needs-drawing
  note: >-
    The power shelf is drawn as one opening, 423.85 x 48 mm, rather than four module openings.
    Figure 20 and Table 15 both establish that there are FOUR modules and that Cisco numbers them
    M0 to M3, so the count and the numbering are not in doubt - what is missing is where the
    boundaries fall. The stencil master draws this shelf POPULATED, with each module rendered as a
    pair of fan wheels, so scanning the band returns grille detail rather than separators and the
    per-module pitch could not be recovered the way the ASR 9006's was from its bare shelf. An
    even four-way division would be arithmetic rather than measurement, and the 9006 showed the
    gaps between modules are not uniform with the end margins.
  wanted: a bare-shelf figure, or a front elevation with the power shelf dimensioned
- what: blank-faces
  scope: [top, bottom, left]
  reason: vendor-silent
  note: >-
    top, bottom and left are sized from Table 13 and Figure 10 (the 9904's top-down footprint) and
    are deliberately EMPTY. No document we hold shows any of the three. The right side is not
    blank - the guide states the air inlet and the air filter are both there - and the rear carries
    the single fan tray and two grounding points, so four of the six faces have sourced content.
    The sizes here are right, which is what these views are carrying for a rack elevation and the
    3D box.
  wanted: a six-face photograph set, or the mechanical drawings behind Figure 10
