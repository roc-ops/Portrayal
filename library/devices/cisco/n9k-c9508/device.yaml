configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      derived - Cisco publishes no bundle for the Nexus 9508 in the guide, so the library defines one from the
      guide's own power-budget example (Planning for Power Requirements, Step 2: two N9K-SUP-B+, two N9K-SC-A,
      five N9K-C9508-FM-E2, three N9K-C9508-FAN): those parts in their slots, the empty odd fabric-module
      slot FM 1 blanked with N9K-C9508-FM-CV (the guide's rule for an empty odd slot), four N9K-PAC-3000W-B supplies in PS 1 to PS 4 with a blank over each other
      supply slot, and a line-card blank in each of the eight line-card slots. The example gives no supplies
      and no line cards, so the four supplies are the library's choice.
    description: >-
      Chassis with the common equipment seated: both supervisors and system controllers, three fan trays, five
      fabric modules in FM 2 to FM 6 and a blank in FM 1, four 3 kW AC supplies and eight line-card blanks.
    part-numbers:
      N9K-C9508: {}
    bays:
      lc-1: cisco/n9k-c9500-lc-cv@1
      lc-2: cisco/n9k-c9500-lc-cv@1
      lc-3: cisco/n9k-c9500-lc-cv@1
      lc-4: cisco/n9k-c9500-lc-cv@1
      lc-5: cisco/n9k-c9500-lc-cv@1
      lc-6: cisco/n9k-c9500-lc-cv@1
      lc-7: cisco/n9k-c9500-lc-cv@1
      lc-8: cisco/n9k-c9500-lc-cv@1
  psu-universal:
    kind: example
    power: [ac, hvdc]
    description: >-
      The base with four N9K-PUV-3000W-B universal AC/DC supplies in PS 1 to PS 4. An illustration: the guide
      prints no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-puv-3000w-b@1
      ps-2: cisco/n9k-puv-3000w-b@1
      ps-3: cisco/n9k-puv-3000w-b@1
      ps-4: cisco/n9k-puv-3000w-b@1
  psu-dual-input:
    kind: example
    power: [ac, hvdc]
    description: >-
      The base with four N9K-PUV2-3000W-B dual-input universal AC/DC supplies in PS 1 to PS 4. An
      illustration: the guide prints no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-puv2-3000w-b@1
      ps-2: cisco/n9k-puv2-3000w-b@1
      ps-3: cisco/n9k-puv2-3000w-b@1
      ps-4: cisco/n9k-puv2-3000w-b@1
  psu-dc:
    kind: example
    power: dc
    description: >-
      The base with four N9K-PDC-3000W-B -48 V DC supplies in PS 1 to PS 4. An illustration: the guide prints
      no ordering code for a build with this supply.
    bays:
      ps-1: cisco/n9k-pdc-3000w-b@1
      ps-2: cisco/n9k-pdc-3000w-b@1
      ps-3: cisco/n9k-pdc-3000w-b@1
      ps-4: cisco/n9k-pdc-3000w-b@1
  fabric-g:
    kind: example
    description: >-
      The 400-Gigabit build: three N9K-C9508-FAN2 trays, five N9K-C9508-FM-G fabric modules in FM 2 to FM 6
      and an N9K-C9508-FAN-PWR card in FM 1, as the guide's Table 1 and the note beneath it pair them. An
      illustration: the guide prints no ordering code for it.
    bays:
      fan-1: cisco/n9k-c9508-fan2@1
      fan-2: cisco/n9k-c9508-fan2@1
      fan-3: cisco/n9k-c9508-fan2@1
      fm-1: cisco/n9k-c9508-fan-pwr@1
      fm-2: cisco/n9k-c9508-fm-g@1
      fm-3: cisco/n9k-c9508-fm-g@1
      fm-4: cisco/n9k-c9508-fm-g@1
      fm-5: cisco/n9k-c9508-fm-g@1
      fm-6: cisco/n9k-c9508-fm-g@1
  empty:
    kind: example
    description: >-
      The chassis with every supervisor, system-controller, fan-tray and fabric-module bay empty, a blank over
      each power-supply slot and a line-card blank in each line-card slot. An illustration of what the bays
      look like with nothing seated.
    bays:
      sup-1: ''
      sup-2: ''
      sc-1: ''
      sc-2: ''
      ps-1: cisco/n9k-psu-blank@1
      ps-2: cisco/n9k-psu-blank@1
      ps-3: cisco/n9k-psu-blank@1
      ps-4: cisco/n9k-psu-blank@1
      fan-1: ''
      fan-2: ''
      fan-3: ''
      fm-1: ''
      fm-2: ''
      fm-3: ''
      fm-4: ''
      fm-5: ''
      fm-6: ''
