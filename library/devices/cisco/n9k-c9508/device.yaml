format: 1
kind: device
name: n9k-c9508
version: 1.1.0
maturity: modelled
manufacturer: Cisco
model: N9K-C9508
aliases:
- {name: Nexus 9508, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9500, series: Nexus 9500 Series}
description: >-
  Cisco Nexus 9508 - the 13 RU, eight-line-card modular chassis of the Nexus 9500 family, running NX-OS
  mode. The FRONT carries the chassis lamps across the top, eight line-card slots LC 1 to LC 8 from top to
  bottom, two supervisor slots SUP 1 and SUP 2 side by side below them, and eight power-supply slots PS 1 to
  PS 8 standing on end along the bottom. The REAR carries three fan trays FAN 1 to FAN 3, six fabric-module
  slots FM 1 to FM 6 behind the fan trays, and two system controllers SC 1 and SC 2 below them. Air enters
  at the front and leaves at the rear. Each line-card slot holds its blank and accepts the line-card blank and
  the four line cards modelled so far (N9K-X9736C-FX, N9K-X97160YC-EX, N9K-X9732C-FX and N9K-X9716D-GX); the
  other 9500 line cards follow.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Cisco N9508 NX-OS Mode Switch Hardware Installation Guide (140 pp; first published 2014-11-21, last
      modified 2026-09-17),
      https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/hw/n9508_hig/guide/b_n9508_nxos-mode_hardware_install_guide.pdf
      (page numbers below are PDF pages, and the printed page is six lower).
      Cisco's Nexus 9504 and 9516 hardware installation guides were read to confirm that the supervisors, the
      system controller and the 3000 W supplies are the same parts. The NetBox devicetype-library file for
      N9K-C9508 (u_height 13) and its elevation images were NOT available to this work - only a path
      listing of that library is - so no NetBox elevation was compared. No data sheet, photograph, 3D model or
      stencil is held for the 9508.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - Appendix A "Switch Dimensions" (printed p113, PDF p119): "Cisco N9508 chassis: width 17.5
      inches (44.5 cm); depth 31.76 inches (80.67 cm) for chassis and handles; height 22.70 inches (57.78
      cm) (13 RU)". Modelled as 444.5 x 577.85 x 806.7 mm. CONFLICT ON HEIGHT: 22.70 in is 576.6 mm, but
      the same cell gives 57.78 cm, the rack-requirements text gives "13-RU (22.7 inches or 57.8 cm)", the
      bottom-rail step gives "13 RU (22.75 in [57.8 cm])", and 13 x 44.45 mm is 577.85 mm. 22.70 reads as a
      rounding slip for 22.75; 577.85 is used, which is also what the front stack of modules adds up to.
      CONFLICT ON DEPTH: the clearance figure (PDF p24, callout 11) gives the chassis depth as 33.15 in
      (84.2 cm); the table's 31.76 in (80.67 cm) is used because it is the stated dimension "for chassis and
      handles", and the figure's number is not explained.
  ru:
    confidence: datasheet
    note: >-
      datasheet - 13 RU, printed in the dimensions table and in "Rack and Cabinet Requirements". Chassis
      weight: the guide's weights table is empty in the held copy; "up to 395 pounds (179 kg) when fully
      loaded" is stated in "Installing a Chassis in a Rack or Cabinet" and is carried as an attribute, not as
      the chassis weight.
  front-stack:
    confidence: estimated
    note: >-
      estimated - every position on the front is derived, not measured. The guide has no flat front view: its
      front figure (PDF p11) is an isometric drawing. The layout follows that figure's arrangement and the
      guide's dimension table: a top band for the chassis lamps; eight line cards of 1.75 in (44.45 mm)
      stacked top to bottom; the two supervisors, 1.75 in high and 8.0 in (203.2 mm) wide with brackets,
      side by side; and eight power supplies standing on end, 5.25 in (133.35 mm) tall and 1.75 in (44.45
      mm) wide, in a row at the bottom. The top band is the remainder, 44.45 mm, which is also what the
      figure suggests. The cage is taken as the 17.0 in (431.8 mm) line-card width, centred in the 444.5 mm
      face. The power supplies are spread across the 431.8 mm cage at an even 53.975 mm pitch. Overlaying
      the figure is not possible: it is perspective, so no aspect check (Gate 1) can be made.
  rear-stack:
    confidence: estimated
    note: >-
      estimated - the rear is derived the same way. The guide's rear figure (PDF p12) is isometric. Three
      fan trays of 5.04 in (128.02 mm) are centred across the width, each 18.08 in (459.2 mm) tall with its
      brackets; the six fabric modules, 2.46 in (62.48 mm) wide, sit behind them on a pitch of half a fan
      tray, so FM 1 and FM 2 are behind FAN 1, FM 3 and FM 4 behind FAN 2, FM 5 and FM 6 behind FAN 3 (the
      guide says the even-numbered fabric slot is the one behind a fan tray that powers it). The two system
      controllers, 7.81 in (198.37 mm) wide with brackets and 1.42 in (36.07 mm) high, sit below the fan
      trays. The vertical position of the controllers and the margin above the fan trays are estimated.
  slots:
    confidence: datasheet
    note: >-
      datasheet - "Overview": supervisor modules in slots SUP 1 and SUP 2 (modules 27 and 28), system
      controllers in SC 1 and SC 2 (modules 29 and 30), line cards in LC 1 to LC 8 (modules 1 to 8, top to
      bottom), fabric modules in FM 1 to FM 6 (slots 21 to 26, left to right), fan trays in FAN 1 to FAN 3
      and power supplies in PS 1 to PS 8 (left to right). Numbering is the guide's; whether each label is
      printed on the metal is not shown by any figure the guide gives.
  fabric-slots:
    confidence: datasheet
    note: >-
      datasheet - "Overview" note: three fabric modules go in FM 2, 4 and 6; four in FM 2, 3, 4 and 6; five in
      FM 2 to 6; six in FM 1 to 6. Slots left empty take N9K-C9508-FAN-PWR (with -FM-G and N9K-C9508-FAN2) or,
      with any other fabric module, a blank by slot: an empty odd slot (FM 1, FM 3, FM 5) takes N9K-C9508-FM-CV
      (Overview note, PDF p10; migration cautions, PDF pp113-116), and an empty even slot (FM 2, FM 4, FM 6)
      takes N9K-C9508-FM-Z, which powers the fan tray (Fan Tray LEDs, PDF p135). Table 1 (PDF p7) lists only
      the FM-Z in its blank column. With N9K-C9508-FM-R2 no fabric slot may be empty. A bay holds any of
      them; the pairing rules are the guide's and are not enforced by the model.
  power-slots:
    confidence: datasheet
    note: >-
      datasheet - "Installing or Replacing Power Supplies": with n+n redundancy the supplies in slots 1 to 4
      go to one source and those in slots 5 to 8 to the other. Any supply type may be mixed ("The switch can be
      powered by a mix of AC, DC, HVAC/HVDC power sources" in the Overview; "Do not use a mix of AC and DC
      power sources" in the power-requirements text: the guide contradicts itself, and every type is
      accepted by every slot).
  line-cards:
    confidence: datasheet
    note: >-
      datasheet - the eight line-card slots accept the line-card blank N9K-C9500-LC-CV and the line cards this
      guide supports among those modelled: N9K-X9736C-FX, N9K-X97160YC-EX, N9K-X9732C-FX and N9K-X9716D-GX,
      which Overview Table 1 and the power tables (PDF pp8-9 and 18-19, printed 2-3 and 12-13) list. A line
      card is accepted because this chassis's own guide supports it. The other 9500 line cards follow in later
      batches; the N9K-X9788TC-FX is listed in the guide and not modelled, because the guides name its 48 ports
      three ways and no figure of its faceplate is held. The guide's weights section (PDF p120, printed 114)
      has a heading and no table, so no line-card weight is read from this guide.
  ears-and-kits:
    confidence: drawing
    note: >-
      drawing - the clearance figure (PDF p24) shows the chassis between front and rear vertical rack posts
      with its front at the front posts; the front figure (PDF p11, callout 5) shows "2 vertical mounting
      brackets that are used to mount the chassis onto rack" at the sides of the front. The shipped position
      is therefore flush, and no `at` is written: no figure gives the bracket's depth position. The clearance
      figure (PDF p24, callout 14) prints "Width of the chassis plus vertical mounting brackets on each side"
      as 19.2 in (48.8 cm), against the 17.5 in chassis: about 21.6 mm of bracket on each side. The ear model
      takes a depth offset and a height and no width, so that span is carried here and in a gap, not drawn.
      A rear-mount position is not given by the guide. The bottom-support rails (kit N9K-C9500-RMK; the
      accessory kit is N9K-ACC-KIT in the procedure and N9K-C9500-ACK in its table) carry the weight; the rack must be a four-post rack 24 to 32
      in deep between rails. No kit is listed under `chassis.kits`: the first `kind: kit` contract in the
      library broke six existing tests, so the kit is left out of this batch.
  airflow:
    confidence: datasheet
    note: >-
      datasheet - "Air intake from the cold aisle for all modules and power supplies" and "Air exhaust to the hot
      aisle" (clearance figure, callouts 4 and 5), and "port-side intake airflow" for every supply. The
      chassis is front-to-back.
  environmental:
    confidence: datasheet
    note: >-
      datasheet - Appendix A "Environmental Specifications", transcribed.
  lifecycle:
    confidence: datasheet
    note: >-
      datasheet - Cisco's support page lists the Nexus 9508 as available (support page "Cisco Nexus 9000
      Series Switches",
      https://www.cisco.com/c/en/us/support/switches/nexus-9000-series-switches/series.html). Sale status of
      each module is per module: N9K-SUP-A, N9K-SUP-B, N9K-C9508-FM, -FM-S and -FM-E are end-of-sale by
      notice; the others have no status on the support page and are recorded as unknown.
