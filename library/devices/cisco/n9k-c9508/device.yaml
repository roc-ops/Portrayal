    - {name: flush, label: vertical mounting brackets at the front of the chassis, default: true}
gaps:
- what: chassis-power-figure
  scope: [power-supplies]
  reason: vendor-silent
  note: >-
    The guide gives a typical and maximum draw per module and no figure for the chassis itself; the chassis
    total is whatever its occupants sum to. Each line card carries its own typical and maximum draw, so a
    loaded chassis's total is the sum of its occupants; none is written here.
  wanted: a chassis-level draw from Cisco, or confirmation that the sum of the module table is the answer
- what: line-card-fabric-pairing
  scope: [line-cards]
  reason: needs-drawing
  note: >-
    Which fabric module each line card goes with, and how many are needed, is listed here and NOT ENFORCED:
    no bay or card restricts the fabric module it is seated with. The guide's Overview Table 1 (PDF pp8-9,
    printed 2-3) pairs the cards modelled here with the N9K-C9508-FM-E, -FM-E2 and -FM-G; the count is the
    fabric modules required for maximum bandwidth, read by line order. N9K-X9736C-FX: FM-E 5, FM-E2 5, FM-G 5.
    N9K-X97160YC-EX: FM-E 4, FM-E2 4, FM-G 4. N9K-X9732C-FX: FM-E 4 plus 1 for redundancy, FM-E2 4 plus 1 for
    redundancy, FM-G 4. N9K-X9716D-GX: FM-G 4 only. The guide's notes: all fabric modules in the switch must
    be of one type; with the -FM-G the empty slots take N9K-C9508-FAN-PWR and the N9K-C9508-FAN2 fan trays are
    used; and "Do not mix ACI-mode line cards with NX-OS mode line cards in the same switch" (PDF p7, printed
    1). "Migrate the switch to 400-Gigabit -GX line cards" (PDF p114, printed 108) says to replace the older
    fabric modules with N9K-C9508-FM-G modules.
  wanted: a restriction in the format between a card and the fabric modules it is seated with
- what: bracket-width
  scope: [front]
  reason: needs-drawing
  note: >-
    The clearance figure (PDF p24, callout 14) gives the width of the chassis plus the vertical mounting
    brackets as 19.2 in (48.8 cm). The ear model has no field for an overall width, so the mounting-bracket
    region is not sized by it and the front face stays the 444.5 mm chassis width.
  wanted: ear support for an overall width, or a dimensioned front view of the bracket
- what: no-flat-views
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    The guide has no flat front or rear elevation, and the NetBox elevations are not held. Every position on
    both faces is derived from the dimension table and the arrangement in the isometric figures; see the
    front-stack and rear-stack provenance. No position is measured.
  wanted: a flat front and rear elevation of the chassis with dimensions, or the NetBox elevation images
- what: supervisor-and-controller-slot-blanks
  scope: [supervisors, system-controllers]
  reason: vendor-silent
  note: >-
    The guide says a blank module sits in an empty supervisor or system-controller slot ("remove the blank
    module that is already in that slot. Unscrew its captive screw") and gives it no part number, drawing or
    dimension. The supervisor and system-controller bays therefore show nothing when empty.
  wanted: the part number and a drawing of the supervisor and system-controller slot blanks
- what: bay-extents-derived
  scope: [line-cards, supervisors, system-controllers, fabric, fan-trays, power-supplies]
  reason: needs-drawing
  note: >-
    The bay sizes are the module envelopes of the dimension table, and the positions are the stack derived
    from them; none is a measurement of the chassis. The fan-tray bays and the fabric-module bays occupy the
    same area of the rear face because the fabric modules are behind the fan trays.
  wanted: a dimensioned rear view with the fan trays removed
- what: top-bottom-side-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    The side and top faces are named in the figures (handles on both sides, mounting bracket, rack rail
    positions) and no figure dimensions any feature on them, so those faces carry regions with no
    coordinates. The bottom face is empty: no view of it is published.
  wanted: a dimensioned side and top view
groups:
  line-cards:
    term: Slot
    role: traffic
    index-origin: 1
    physical-context: NetworkingDevice
  supervisors:
    term: Slot
    role: management
    index-origin: 1
    physical-context: NetworkingDevice
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - hardware guide, "Overview of Supervisor Modules": one or two supervisors; with two, one is active and the other standby, and the standby takes over if the active goes down. Both must be the same type.'
  system-controllers:
    term: Slot
    role: management
    index-origin: 1
    physical-context: NetworkingDevice
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - hardware guide, "Installing or Replacing a System Controller Module": the switch can operate with one or two system controllers; one is replaced while the other is installed.'
  fabric:
    term: Slot
    role: service
    index-origin: 1
    physical-context: NetworkingDevice
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - hardware guide, "Overview" Table 2 "Fabric Modules Required for Maximum Bandwidth": for most line cards the count is four or five, and for the cloud-scale cards "4 (plus 1 for redundancy)". Three to six fabric modules are supported, in the slots the Overview note names.'
  fan-trays:
    term: Fan Tray
    role: service
    index-origin: 1
    physical-context: Fan
    attrs:
      redundancy: '2+1'
      redundancy-note: '2+1 - hardware guide, "Replacing a Fan Tray": "The switch uses three fan trays. It can operate with two fan trays while you replace one"; the other trays speed up their fans when one is removed.'
  power-supplies:
    term: Slot
    role: service
    index-origin: 1
    physical-context: PowerSupply
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - hardware guide, "Overview of Power Modes": combined, n+1 and n+n modes; n+1 needs at least one supply more than the number the modules need, n+n twice that, half on each source.'
  leds:
    term: LED
    role: indicator
    index-origin: 1
