    storage-temp: -40 to 158degF (-40 to 70degC)
    humidity-operating: 5 to 90 percent
    humidity-non-operating: 5 to 95 percent
    altitude-operating: 0 to 13,123 ft (0 to 4,000 m)
  power:
    power-supply-capacity-w: 3000 W per supply (3150 W for the N9K-PUV2-3000W-B), up to eight
    power-redundancy-modes: combined, n+1, n+n
  thermal:
    cooling-path: front-to-back; air enters at the line-card and power-supply side, leaves at the fan trays
