configurations:
  ac-3200w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-3200W-PI AC/HVDC supplies and four NXA-SFAN-160CFM2-PI fan modules: port-side
      intake airflow, burgundy latches
    default: true
    power: [ac, hvdc]
    part-numbers:
      N9K-C9348D-GX2A: {part: N9K-C9348D-GX2A}
  ac-3200w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-3200-PE AC supplies (the guide's spelling) and four NXA-SFAN-160CFM2-PE fan
      modules: port-side exhaust airflow, blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C9348D-GX2A: {part: N9K-C9348D-GX2A}
    component-attrs:
      nxa-sfan-160cfm2: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-3200w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  dc-3200w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PDC-3200W-PI DC/HVDC supplies and four NXA-SFAN-160CFM2-PI fan modules: port-side
      intake airflow, burgundy latches
    power: [dc, hvdc]
    part-numbers:
      N9K-C9348D-GX2A: {part: N9K-C9348D-GX2A}
    bays:
      psu-1: cisco/nxa-pdc-3200w@1
      psu-2: cisco/nxa-pdc-3200w@1
