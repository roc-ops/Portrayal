  physical:
    weight-note: '51.2 lb (23.22 kg) chassis. Fan module 1.35 lb (0.61 kg). Supply 3.6 lb (1.63 kg), one row for the 3200 W AC/HVDC, AC exhaust and DC/HVDC supplies.'
  power:
    power-typical-w: 1380
    power-max-w: 3124
    power-envelope: unstated
    heat-dissipation-btu-hr: 10660
    power-input-ac: '100 to 120 V or 200 to 240 V at 16 A max, 50/60 Hz (3200 W AC/HVDC)'
    power-input-hvdc: '240 VDC at 14.5 max (3200 W AC/HVDC and DC/HVDC)'
    power-input-dc: '-40 to -72 VDC (3200 W DC/HVDC)'
    power-supply-options: '3200W AC/HVDC port-side intake, 3200W AC port-side exhaust, or 3200W DC/HVDC port-side intake (two)'
  environmental:
