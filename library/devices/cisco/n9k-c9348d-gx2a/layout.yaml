  features:
    optics-qsfp-dd: 'guide: "400-Gigabit QSFP-DD ports (48)". Table 1, 3200 W supplies, 40 C ambient limit, 48 ports MACsec enabled: 20 W on ports 3, 6, 9 ... 48 (and 26, 29, 32, 35, 38, 41, 47 as printed) and 12 W on the remaining 24'
    optics-sfp-plus: 'guide: "10-Gigabit SFP+ ports (2)"'
    management-ports: 'front figure: one RJ-45 and one SFP management port, and a console port'
  management:
    usb: '1 USB port'
  lifecycle:
    eol: none-announced
chassis: {width: 442.3, height: 87.6, depth: 757.6, ru: 2, weight-kg: 23.22, color: '#d0d2cf', airflow: front-to-back,
  power: ac,
  kits: [{ref: 'cisco/nxk-acc-kit2-2ru@1', supply: optional}]}
gaps:
- what: size-figures
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    The Overview (PDF p7, printed 1) says "2-rack unit (RU)"; the Switch Dimensions table (PDF
    p47, printed 41) says "1.72 inches (4.4 cm) (1 RU)" for the height. The front figure's aspect
    (5.04, against 5.05 for 2 RU) agrees with the Overview, so `ru` is 2. The height 87.6 mm is
    the N9364D-GX2A guide's row (3.45 in, PDF p60, printed 54), estimated, and not a row of this
    guide. The depth: the Dimensions table gives 29.82 in (75.76 cm) and the Clearance table (PDF
    p16, printed 10) gives 29.78 in (75.65 cm); the 757.6 mm of the Dimensions table is carried.
  wanted: >-
    The height row corrected in the guide, and which inclusion each depth has (whether 29.78 in is
    the chassis without a module handle).
- what: ears-not-dimensioned
  scope: [front]
  reason: vendor-silent
  note: >-
    The guide names two rack kits, NXK-ACC-KIT2-2RU and N9K-C9300-RMK ("Installation Options with
    Rack-Mount Kits", printed 17), and gives the install procedure for NXK-ACC-KIT2-2RU only
    (printed 20); no ear position is drawn or dimensioned. N9K-C9300-RMK is named with no
    contents and no procedure, so it is not a part here.
  wanted: >-
    The shipped ear position, if the chassis has ears, and what N9K-C9300-RMK holds. The guide's
    unpacking table lists "Rack-mount brackets (2)" and "Rack-mount guides (2)" without naming
    the kit it belongs to.
- what: kit-contents-disagree
  scope: [front]
  reason: sources-disagree
  note: >-
    Appendix D (printed 51) lists the NXK-ACC-KIT2-2RU as a slider bracket (2), slider rails (2) and
    twelve M4 screws, with a ground lug kit; the install procedure calls its parts inner rails
    and outer rails. cisco/nxk-acc-kit2-2ru@1 is the procedure's wording and is referenced, not
    edited.
  wanted: >-
    Nothing further for this device.
- what: fan-part-number-printed-three-ways
  scope: [rear]
  reason: sources-disagree
  note: >-
    The Overview and the weights row print NXA-SFAN-160CFM2-PI and -PE, Table 1 "NXA-SF
    AN-160CFM2PI", and the label on the rear figure (art 503779) reads NXA-FAN-160CFM2PI, without
    the S. The component is cisco/nxa-sfan-160cfm2@1, named by the text's form.
  wanted: >-
    The printed label at full size, and whether NXA-FAN-160CFM2 is a second part.
- what: fan-weight-row-says-intake-for-the-exhaust-fan
  scope: [rear]
  reason: sources-disagree
  note: >-
    The weights row (PDF p48, printed 42) reads "Port-side intake (blue) (NXA-SFAN-160CFM2-PE)";
    the Overview says the -PE fan is port-side exhaust with blue coloring. It is read as a typo
    for "exhaust": blue is the exhaust colour throughout.
  wanted: >-
    Nothing further.
- what: exhaust-supply-part-number-spelling
  scope: [rear]
  reason: sources-disagree
  note: >-
    The Overview prints the exhaust AC supply as NXA-PAC-3200-PE, without the W of
    NXA-PAC-3200W-PI. It is read as the same 3200 W family and seated as cisco/nxa-pac-3200w@1
    with the blue colouring; the configuration's part number is not taken from either spelling.
  wanted: >-
    The orderable part number of the exhaust supply.
- what: supply-inlet-and-cords
  scope: [rear]
  reason: sources-disagree
  note: >-
    "Power Cables for NXA-PAC-3200W Power Supplies" lists cords ending in C19 and the connection
    steps ("Starting the Switch", printed 28) say an HVAC/HVDC supply takes an Anderson Saf-D-Grid
    connector. The rear figure draws one rectangular inlet on each supply, which
    cisco/nxa-pac-3200w@1 draws as a C20 inlet, an estimate.
  wanted: >-
    Which inlet the supply has at full size.
- what: fan-and-supply-lamps-unnamed
  scope: [rear]
  reason: vendor-silent
  note: >-
    Appendix C describes the fan status lamp and the power-supply lamps by state and not by
    position; the figure draws a ring on each fan and two circles with a small mark on each supply.
  wanted: >-
    Which circle is which, and what the small mark between them is.
- what: unnamed-marks-on-the-front
  scope: [front]
  reason: vendor-silent
  note: >-
    The figure draws two small circles above the management SFP cage, small text over the top and
    bottom cage rows that the resolution does not read, printed marks beside the SFP+ pair,
    perforation fields, and three small squares under the management SFP cage whose legend is
    not legible. None is named by the guide's callout table; the circles are drawn as marks and the
    rest is not drawn, and the three squares are named BCN, STS and ENV from the appendix's order
    with no legend.
  wanted: >-
    What those marks are, and the order of the three chassis lamps.
- what: port-lamps-are-not-triangles
  scope: [front]
  reason: sources-disagree
  note: >-
    Appendix C says the port LEDs are triangles pointing up or down to the nearest port; the
    front figure draws round lamps, three to a column under the bottom cage. They are drawn as the
    figure shows, one per port.
  wanted: >-
    Whether the lamps are the figure's simplification.
- what: other-supplies-have-no-picture
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A picture of the 3200 W DC/HVDC supply and of the exhaust supply. The guide's figure shows AC
    supplies only ("AC power supplies shown"). The DC supply's face is the AC supply's with the inlet
    changed, and the guide's lug (a two-hole copper lug, #2 AWG) is not drawn.
- what: sizes-off-a-figure
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A stated size for the supplies and the fan module. The guide gives neither.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's only picture of a
    side (PDF page 9, "The figure shows the side of the chassis") is a three-quarter view; it is
    perspective, so nothing on a wall can be measured from it, and no wall is drawn.
- what: dust-cover-is-an-accessory
  scope: [front]
  reason: vendor-silent
  note: >-
    The Overview names a dust cover for unused ports (NXA-ACC-QDD-DC), and appendix D (printed 52)
    lists it at 16 to a kit. It is an accessory, not a seated part, and no component is added.
  wanted: >-
    Nothing further.
- what: fan-redundancy-counting
  scope: [fans]
  reason: vendor-silent
  note: >-
    The Overview says four fan modules; if one fails the others go to 100% capacity, and if two
    fail the multi-fan failure policy issues a warning and powers the switch down in 2 minutes.
    Read as modules, one of four redundant, so the group says 3+1; the guide does not say how
    many it needs running.
  wanted: >-
    Whether the switch needs three modules turning, as the 9364D guide says.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block at the left end of the port side: an RJ-45 console port, an RJ-45 and an
      SFP management port and a USB port. Three media, one purpose: reaching the switch when the
      data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        installation guide, Overview: "Power supply modules (two-One for operations and one for
        redundancy [1+1])". Slot 1 is the top one and slot 2 the bottom one.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '3+1'
      redundancy-note: >-
        installation guide, Overview: four fan modules, "slots numbered from 1 (left) to 4 (right)".
        If a fan fails the other fans go to 100%; if two fail the multi-fan failure policy warns
        and powers the switch down in 2 minutes. The guide does not say how many must turn.
