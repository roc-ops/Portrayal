format: 1
kind: device
name: c9300-48u
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: C9300-48U
aliases:
- {name: Catalyst 9300-48U, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 9300, series: Catalyst 9300}
description: >-
  48x 10/100/1000 Cisco UPOE RJ-45 1RU stackable access switch running Cisco IOS XE, the C9300-48U of
  the Catalyst 9300 family. The 48 ports, the mode button, the status lamps, the USB mini-Type B console
  port, the USB Type A storage port and the beacon button are on the front, with a bay for an uplink network
  module at the right, shipped with a blank in it. The rear holds three fan modules, two StackWise-480
  stacking ports, two StackPower connectors, two power supply bays, the RJ-45 console and management ports,
  a USB 3.0 SSD slot and the ground connectors. The default supply is the 1100 W AC Platinum PWR-C1-1100WAC-P
  in one bay with the power supply slot cover in the other. The -A and -E suffixes of the part number
  are software licences and not hardware, so there is one device.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Cisco Catalyst 9300 Series Switches Hardware Installation Guide, first published 2017-06-20, last
      modified 2026-05-15, https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig.pdf
      (sha256 c1db6738...441b). Table 1 (models), Table 42 (dimensions), Table 43 (weight), Table 18 (default
      supply and PoE), Table 35 (the supplies), Figures 1, 8 and 10 (the front, the lamps and the rear),
      the Fan Module section and Table 48. COMMUNITY NETBOX DEVICETYPE-LIBRARY ELEVATION cisco-c9300-48u.front.png
      (2289 x 219) is a second opinion and the only flat front held for this model, not Cisco's. No data
      sheet, no photograph, no 3D model and no stencil is held for the Catalyst 9300.
  the-licence-suffix:
    confidence: datasheet
    note: >-
      C9300-48U-A (Network Advantage) and C9300-48U-E (Network Essentials) differ in software licence
      only; the guide lists the hardware as C9300-48U throughout. One device, and the suffixed ordering
      codes are not part numbers of a configuration.
  the-rear-figure:
    confidence: drawing
    note: >-
      THE GUIDE'S PDF PAGE 41 REAR FIGURE IS FIGURE 14, THE CATALYST 9300X, AND IS NOT USED. Figure 10
      of the guide, "Rear Panel of a Cisco Catalyst 9300 Series Switch" (PDF page 39), is isometric, one
      rear for the series. Its callouts name, in order, the ground connectors, the USB 3.0 SSD port, the
      BEACON LED, the RJ-45 CONSOLE port, the RJ-45 MGMT port, the fan modules, the StackPower connectors,
      the AC OK and PS OK lamps, the StackWise-480 port connectors and the power supply modules.
  the-envelope:
    confidence: datasheet
    note: >-
      Table 42: 1.73 x 17.5 x 19.2 in (4.4 x 44.5 x 48.8 cm), with the fan modules and the default supplies
      installed. Width 444.5 (17.5 in; the 44.5 cm agrees). Depth 487.7 (19.2 in; 48.8 cm is 488). HEIGHT
      44.45, THE RACK UNIT, NOT THE PRINTED 1.73 IN (43.9 mm): the guide prints 1.73 in for every 1RU
      model and both are nominal, so the unit is carried and the printed height is one millimetre under
      it. The 17.5 in is the body between the ear fold lines (the NetBox elevation draws ears outside
      it).
  rack-positions:
    confidence: drawing
    note: >-
      Figures 32 to 35 of the guide draw the front-mounting, mid-mounting, rear-mounting and four-point
      mounting positions, isometrically, with no dimension. Front-mounting is the first and the guide's
      Mounting the Switch in a Rack step 1 attaches the brackets for "the front or rear mounting positions";
      it is taken as the shipped default. No setback is printed and none is written.
  front-scale:
    confidence: estimated
    note: >-
      EVERY FRONT POSITION IS READ OFF THIS MODEL'S OWN NETBOX ELEVATION, NOT THE GUIDE'S FIGURE 1, WHICH
      IS ISOMETRIC. The elevation is 2289 px wide for the 482.6 mm rack face, 4.743 px per mm; it is cropped
      to the centre 444.5 mm (the body between the ear fold lines), which starts at 90.4 px. The jack
      cavities measure 12.4 to 12.65 mm across on a 14.13 to 14.17 mm column step and a 13.92 mm row step,
      and each block starts 18.55 mm after the last cavity of the one before. Good to about a millimetre.
      The picture agrees with the merged C9300-48P's front to the pixel everywhere but the name plate,
      so the 48P's positions, which were read from that kind of picture, are kept: pitch 14.19 mm, first
      jack at 8.65 mm, and the cavities of this picture land on them to 0.4 mm.
  ports:
    confidence: estimated
    note: >-
      24 columns of two jacks in four blocks of six, numbered DOWN each column (odd on the top row, even
      beneath) as the 4948E's blocks are; the NetBox elevation prints 01X to 12X, 13X to 24X, 25X to 36X
      and 37X to 48X under the four blocks. The column step is 14.19 mm and a block starts 89.4 mm after
      the last, a 4.26 mm gutter on the cell pitch. The jack cell is the registry's 12.7 x 11.0. The elevation
      draws no marking that tells UPOE from PoE+ on a jack; the model is told by Table 1 and the name
      plate.
  port-lamps:
    confidence: estimated
    note: >-
      One lamp per port in a strip along the bottom edge, an up triangle for the odd (upper) port and
      a down triangle for the even, as the elevation draws them. THE ELEVATION DRAWS SEVEN PAIRS OF TRIANGLES
      ACROSS EACH BLOCK OF SIX COLUMNS, at an 11.7 mm step, which cannot be one lamp per port. The pairs
      are placed under their own columns, the two triangles 5.17 mm apart as the elevation draws them,
      and the strip's height is its 40.5 mm below the top. The meaning of each colour is the guide's Table
      15 (green link, blinking green activity, amber blocked) and the mode decides which Table 14 reading
      the lamps show.
  numbering:
    confidence: estimated
    note: >-
      The legends under the strip are the NetBox elevation's: 01X and 12X, 13X and 24X, 25X and 36X, 37X
      and 48X, one pair at the ends of each block. The elevation prints 01X with a leading zero; it is
      carried as drawn. Port numbering is as printed, and the interface names are not on the metal and
      are left out.
  left-cluster:
    confidence: estimated
    note: >-
      The beacon button (Figure 1 callout 1, "Beacon LED (UID button)", a lit square), the maker's mark,
      the Mode button, the status lamps, the USB mini-Type B console port (callout 3) and the USB Type
      A storage port (callout 4) are read off this model's NetBox elevation at the scale of front-scale.
      The guide's Figure 8 names the lamps in two rows, Status, Duplex, Speed, Stack and PoE above, then
      System, Active, XPS and S-PWR, and the Console lamp beside the mini-USB port; the metal prints pictograms
      and not words, so no legend is drawn and each lamp is named by its id. THE FRONT USB TYPE A PORT'S
      GENERATION IS NOT STATED: the rear port is "USB3.0-SSD" and the front is only "USB Type A storage
      port", so it is drawn with the 2.0 tongue.
  network-module-bay:
    confidence: estimated
    note: >-
      Figure 1 callout 6, "Network module slots". The bay is read off the NetBox elevation, which draws
      a C9300-NM-8X seated: 364.8 to 440.8 mm across and 42.5 mm high, 4.3 mm beyond the last block. The
      guide's Table 5 and the Installing a Network Module chapter say the blank C9300-NM-BLANK is fitted
      "when the switch has no uplink ports (this is required for sufficient air flow)". The blank is the
      default. THE NETWORK MODULES THEMSELVES, C9300-NM-2Q, -4G, -4M, -2Y and -8X, ARE NOT MODELLED here
      and are left for a later 9300 batch; the bay accepts only the blank until they are.
  rear-scale:
    confidence: estimated
    note: >-
      THE REAR IS NOT READ FROM A DRAWING OF THIS MODEL. NetBox's cisco-c9300-48u.rear.png is byte-identical
      to its cisco-c9300-48p.rear.png (the same checksum), so it proves no SKU and is used only as a check.
      The rear is taken from the merged cisco/c9300-48p, which was read from the C9300-48T elevation,
      where Figure 10 of the guide shows the same series panel in the same order from the left: ground
      connectors, SSD slot, console and management ports, fan, StackWise, fan, StackWise, fan, StackPower,
      two supplies. The 48U's rear elevation has the same picture as the 48P's, so it does not disagree.
  rear-fans:
    confidence: estimated
    note: >-
      Three FAN-T2 modules (the guide: "support three internal hot-swappable 12-V fan modules (FAN-T2=)")
      at a 63.0 mm step, each 43.9 x 41.1 by Table 48, centred 70.5, 133.5 and 196.5 mm from the left,
      as on cisco/c9300-48p. The StackWise-480 carriers lie between them (92.5 to 111.1 and 156.2 to 174.8
      mm) and hold three stacked connectors each at a 9.3 mm pitch; the guide's Figure 10 points at two
      ports in all, so each carrier is one port.
  rear-power:
    confidence: estimated
    note: >-
      The StackPower connectors (callout 7), S-PWR 1 over S-PWR 2, with XPS under the first, at 233.0
      mm, and the two supply bays 258.5 and 348.4 mm from the left, each the supplies' 82.55 x 40.1 by
      the guide's physical table, as on cisco/c9300-48p. A 13.5 mm strip of bare chassis closes the right.
      The guide does not number the supply slots; psu-1 is the left.
  rear-left:
    confidence: estimated
    note: >-
      The ground connectors (callout 1) as two ground screws, the USB 3.0 SSD slot (callout 2) under a
      cover the guide calls the "blank cover on the USB 3.0 SSD slot", the RJ-45 CONSOLE port (callout
      4) on the left and the RJ-45 MGMT port (callout 5) on the right, each 14.2 mm from the next, and
      the lamps for the console and the beacon (callout 3) in the icon row beneath, as on cisco/c9300-48p.
      The jacks' keyways point down.
  console-over-management:
    confidence: drawing
    note: >-
      The guide's Ethernet Management Port text says the switch is reached "through the 10/100/1000 Ethernet
      management port or one of the console ports" and the RJ-45 Console Port LED table says the RJ-45
      console is disabled while the USB console is active, so the front mini-USB and the rear RJ-45 are
      one console, and the management port is its own.
  power:
    confidence: datasheet
    note: >-
      Table 1 and Table 18: PoE budget 822 W with the 1100 W supply, "Available PoE" of the C9300-48U.
      The guide holds no table of the switch's own draw, and none is written. Table 35 lists the supplies
      for the series and gives no per-model restriction, so every bay takes all of them; the available
      PoE with a smaller supply is not printed for this model.
  colour:
    confidence: estimated
    note: >-
      #cccccc, the median of the pale bar between the two jack rows in the NetBox front elevation.
  airflow:
    confidence: datasheet
    note: >-
      The Fan Module section: "The airflow direction is from front-to-rear and side-to-rear." One airflow
      for every build, so there are no airflow configurations.
attrs:
  physical:
    weight-note: >-
      17.03 lb (7.72 kg) with the fan modules and the default power supplies installed (Table 43); the
      community NetBox file gives 6.32 kg and the guide is used
  power:
    poe-budget-w: 822
    poe-budget-note: 822 W with the default PWR-C1-1100WAC-P (Tables 1 and 18)
    power-supply-options: >-
      PWR-C1-350WAC, PWR-C1-350WAC-P, PWR-C1-715WAC, PWR-C1-715WAC-P, PWR-C1-1100WAC, PWR-C1-1100WAC-P,
      PWR-C1-1900WAC-P, PWR-C1-1900WHV-T, PWR-C1-715WDC (Tables 18 and 35)
  environmental:
    operating-temp: -5 to 45 C (23 to 113 F), Table 37
    storage-temp: -40 to 70 C (-40 to 158 F), Table 37
    humidity: 5 to 90 percent, noncondensing
    altitude: operating up to 3000 m (10,000 ft); storage up to 4500 m (15,000 ft)
  features:
    stacking: StackWise-480 data stacking, up to nine switches, and StackPower, up to four switches
    uplink-modules: >-
      one network module slot; C9300-NM-2Q, -4G, -4M, -2Y, -8X and the 3850 uplink modules (Table 5);
      a blank when none is fitted
    poe: >-
      10/100/1000 Cisco UPOE on all 48 ports, up to 60 W per port (PoE, PoE+, Cisco UPOE and Cisco UPOE+
      Ports)
  management:
    console: USB mini-Type B on the front and RJ-45 on the rear; the USB console takes precedence
    oob: RJ-45 10/100/1000 management port on the rear
    usb: USB Type A storage port on the front; USB 3.0 SSD slot on the rear
  lifecycle: {eol: none-announced}
chassis:
  width: 444.5
  height: 44.45
  depth: 487.7
  ru: 1
  weight-kg: 7.72
  color: '#cccccc'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mounting, default: true}
    - {name: mid, label: mid-mounting}
    - {name: rear, label: rear-mounting}
gaps:
- what: rack-kit
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The rack depth the bracket kits span. The guide's Figure 29 and its table name the 19-inch brackets
    ACC-KIT-T1=, the four-point extension rails and five brackets 4PT-KIT-T2=, and the 23-inch, 24-inch
    and ETSI brackets RACK-KIT-T1=, and print no range of rack depth, no setback and no part dimension.
    A kind: kit contract needs a depth or a factory preset, so no kit is written and chassis.kits is left
    out; the three positions above are named without a number.
- what: rear-drawing
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A rear drawing of this model. The only held file, NetBox's cisco-c9300-48u.rear.png, is the C9300-48P's
    file byte for byte, so the rear is carried from cisco/c9300-48p and Figure 10 and is marked estimated.
- what: front-usb-generation
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Whether the front USB Type A storage port is USB 2.0 or 3.0. The guide says only "USB Type A storage
    port".
- what: network-modules
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The faces of C9300-NM-2Q, C9300-NM-4G, C9300-NM-4M, C9300-NM-2Y and C9300-NM-8X. The guide draws them
    isometrically and prints no dimension. Left for a later 9300 batch.
- what: lamp-pictograms
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The pictograms under the status lamps and beside the mini-USB port. The guide's Figure 8 gives their
    names and the NetBox elevation draws them at a few pixels each; no legend is drawn.
- what: sides-top-bottom
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the sides. The guide's Figure 1 and Figure 10 show them
    isometrically with a vent on the side and labels on the lid.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  nm-bay: {term: Slot, role: traffic, index-origin: 1}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mode-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  controls:
    term: Button
    role: management
    index-origin: 1
    mixed: >-
      the beacon (UID) button and the Mode button at the left of the front: two buttons that identify
      the switch and step its lamps, both used from the front panel.
  usb-console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: mini-usb-b}
  usb-storage:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the rear RJ-45 console port beside the rear 10/100/1000 RJ-45 management port: two jobs, one purpose,
      reaching the switch when the data plane cannot.
  stackwise:
    term: Port
    role: fabric
    index-origin: 1
    attrs: {media: stackwise-480}
  stackpower:
    term: Port
    role: service
    index-origin: 1
    attrs: {media: stackpower}
  grounding: {term: Stud, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        The guide: "The switch has two internal power supply module slots. You can use two AC modules
        or one power supply module and a blank module."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 2+1
      redundancy-note: >-
        Three fan modules, and the Fan Module section of the guide says the switch can operate with two
        operational fans while the failed one is replaced.
