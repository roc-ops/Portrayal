configurations:
  c9300-24p:
    kind: orderable
    description: >-
      The switch as shipped: one PWR-C1-715WAC-P in the first power supply slot with the slot cover in
      the second, three FAN-T2 fan modules and the network module bay blank. Table 18 gives the 715 W
      Platinum supply as the default of the C9300-24P and the Power Supply Modules text says every switch
      ships with a blank in the second slot.
    default: true
    part-numbers:
      C9300-24P: {}
  dual-715wac-p:
    kind: example
    description: Two PWR-C1-715WAC-P supplies, as a switch with its second supply ordered.
    bays: {psu-2: cisco/pwr-c1-715wac-p@1}
  psu-350wac:
    kind: example
    description: A PWR-C1-350WAC in the first slot.
    bays: {psu-1: cisco/pwr-c1-350wac@1}
  psu-350wac-p:
