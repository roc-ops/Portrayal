format: 1
kind: device
name: c9300-24p
version: 1.1.0
maturity: modelled
manufacturer: Cisco
model: C9300-24P
aliases:
- {name: Catalyst 9300-24P, kind: marketing}
portfolio: {line: Catalyst, family: Catalyst 9300, series: Catalyst 9300}
description: >-
  24x 10/100/1000 PoE+ RJ-45 1RU stackable access switch running Cisco IOS XE, the C9300-24P of the Catalyst
  9300 family. The 24 ports, the mode button, the status lamps, the USB mini-Type B console port, the
  USB Type A storage port and the beacon button are on the front, with a bay for an uplink network module
  at the right, shipped with a blank in it. The rear holds three fan modules, two StackWise-480 stacking
  ports, two StackPower connectors, two power supply bays, the RJ-45 console and management ports, a USB
  3.0 SSD slot and the ground connectors. The default supply is the 715 W AC Platinum PWR-C1-715WAC-P
  in one bay with the power supply slot cover in the other. The -A and -E suffixes of the part number
  are software licences and not hardware, so there is one device.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Cisco Catalyst 9300 Series Switches Hardware Installation Guide, first published 2017-06-20, last
      modified 2026-05-15, https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig.pdf
      (sha256 c1db6738...441b). Table 1 (models), Table 42 (dimensions), Table 43 (weight), Table 18 (default
      supply and PoE), Table 35 (the supplies), Figures 1, 8 and 10 (the front, the lamps and the rear),
      the Fan Module section and Table 48. COMMUNITY NETBOX DEVICETYPE-LIBRARY ELEVATIONS (cisco-c9300-24p.front.png
      and cisco-c9300-24p.rear.png, each 2289 x 219) are a second opinion and the only flat drawings held,
      not Cisco's. No data sheet, no photograph, no 3D model and no stencil is held for the Catalyst 9300.
  the-licence-suffix:
    confidence: datasheet
    note: >-
      C9300-24P-A (Network Advantage) and C9300-24P-E (Network Essentials) differ in software licence
      only; the guide lists the hardware as C9300-24P throughout. One device, and the suffixed ordering
      codes are not part numbers of a configuration.
  the-rear-figure:
    confidence: drawing
    note: >-
      THE GUIDE'S PDF PAGE 41 REAR FIGURE IS FIGURE 14, THE CATALYST 9300X, AND IS NOT USED. Figure 10
      of the guide, "Rear Panel of a Cisco Catalyst 9300 Series Switch" (PDF page 39), is isometric, one
      rear for the series. Its callouts name, in order, the ground connectors, the USB 3.0 SSD port, the
      BEACON LED, the RJ-45 CONSOLE port, the RJ-45 MGMT port, the fan modules, the StackPower connectors,
      the AC OK and PS OK lamps, the StackWise-480 port connectors and the power supply modules.
  the-envelope:
    confidence: datasheet
    note: >-
      Table 42: 1.73 x 17.5 x 19.2 in (4.4 x 44.5 x 48.8 cm), with the fan modules and the default supplies
      installed. Width 444.5 (17.5 in; the 44.5 cm agrees). Depth 487.7 (19.2 in; 48.8 cm is 488). HEIGHT
      44.45, THE RACK UNIT, NOT THE PRINTED 1.73 IN (43.9 mm): the guide prints 1.73 in for every 1RU
      model and both are nominal, so the unit is carried and the printed height is one millimetre under
      it. The 17.5 in is the body between the ear fold lines (the NetBox elevation draws ears outside
      it).
  rack-positions:
    confidence: drawing
    note: >-
      Figures 32 to 35 of the guide draw the front-mounting, mid-mounting, rear-mounting and four-point
      mounting positions, isometrically, with no dimension. Front-mounting is the first and the guide's
      Mounting the Switch in a Rack step 1 attaches the brackets for "the front or rear mounting positions";
      it is taken as the shipped default. No setback is printed and none is written.
  front-scale:
    confidence: estimated
    note: >-
      EVERY FRONT POSITION IS READ OFF THIS MODEL'S OWN NETBOX ELEVATION, NOT THE GUIDE'S FIGURE 1, WHICH
      IS ISOMETRIC. The elevation is 2289 px wide for the 482.6 mm rack face, 4.743 px per mm; it is cropped
      to the centre 444.5 mm (the body between the ear fold lines), which starts at 90.4 px. The jack
      cavities measure 12.4 to 12.65 mm across on a 14.13 to 14.17 mm column step and a 13.92 mm row step,
      and the second block starts 18.55 mm after the first block's last cavity. Good to about a millimetre.
      The merged C9300-48P was read from the same kind of picture, and this picture's two port blocks
      sit at the x positions of that picture's third and fourth blocks to 0.4 mm, so the ports are placed
      on the 48P's pitch, 14.19 mm. The picture and the 48P's are the same drawing to the pixel at the
      left cluster (0 to 98 mm, zero differing pixels) and differ in the empty area, the name plate and
      the seated module.
  ports:
    confidence: estimated
    note: >-
      12 columns of two jacks in two blocks of six at the right of the port area, numbered DOWN each column
      (odd on the top row, even beneath) as the 48P's blocks are; the NetBox elevation prints 1X and 12X
      under the first block and 13X and 24X under the second. The column step is 14.19 mm and the second
      block starts 89.4 mm after the first. The area to the left of the first block, from the left cluster
      to 99 mm, has no jacks and is bare chassis in the elevation. The jack cell is the registry's 12.7
      x 11.0.
  port-lamps:
    confidence: estimated
    note: >-
      One lamp per port in a strip along the bottom edge, an up triangle for the odd (upper) port and
      a down triangle for the even, as the elevation draws them. THE ELEVATION DRAWS SEVEN PAIRS OF TRIANGLES
      ACROSS EACH BLOCK OF SIX COLUMNS, at an 11.7 mm step, which cannot be one lamp per port. The pairs
      are placed under their own columns, the two triangles 5.17 mm apart as the elevation draws them,
      and the strip's height is its 40.5 mm below the top. The meaning of each colour is the guide's Table
      15 (green link, blinking green activity, amber blocked) and the mode decides which Table 14 reading
      the lamps show.
  numbering:
    confidence: estimated
    note: >-
      The legends under the strip are the NetBox elevation's: 1X and 12X, 13X and 24X, one pair at the
      ends of each block. The elevation prints 1X without a leading zero; it is carried as drawn. Port
      numbering is as printed, and the interface names are not on the metal and are left out.
  left-cluster:
    confidence: estimated
    note: >-
      The beacon button (Figure 1 callout 1, "Beacon LED (UID button)", a lit square), the maker's mark,
      the Mode button, the status lamps, the USB mini-Type B console port (callout 3) and the USB Type
      A storage port (callout 4) are read off this model's NetBox elevation at the scale of front-scale.
      The guide's Figure 8 names the lamps in two rows, Status, Duplex, Speed, Stack and PoE above, then
      System, Active, XPS and S-PWR, and the Console lamp beside the mini-USB port; the metal prints pictograms
      and not words, so no legend is drawn and each lamp is named by its id. THE FRONT USB TYPE A PORT'S
      GENERATION IS NOT STATED: the rear port is "USB3.0-SSD" and the front is only "USB Type A storage
      port", so it is drawn with the 2.0 tongue.
  vents:
    confidence: estimated
    note: >-
      Three vent strips and the name plate, at the x positions the elevation draws them. The first strip,
      over the area with no jacks, is drawn in the elevation as an open crenellated vent and is carried
      as a vent of the same extent.
  network-module-bay:
    confidence: estimated
    note: >-
      Figure 1 callout 6, "Network module slots". The bay is read off the NetBox elevation, which draws
      a C9300-NM-2Q seated in it: 364.8 to 440.8 mm across and 42.5 mm high, 4.3 mm beyond the last block.
      The guide's Table 5 and the Installing a Network Module chapter say the blank C9300-NM-BLANK is
      fitted "when the switch has no uplink ports (this is required for sufficient air flow)". The blank
      is the default. THE NETWORK MODULES THEMSELVES, C9300-NM-2Q, -4G, -4M, -2Y and -8X, ARE NOT MODELLED
      here and are left for a later 9300 batch; the bay accepts only the blank until they are.
  rear-scale:
    confidence: estimated
    note: >-
      The rear is this model's own NetBox rear elevation, 2289 x 219 px, 4.743 px per mm, the body 444.5
      mm from 90.4 px. THE ELEVATION LABELS ITS SUPPLIES PWR-C1-715WAC; IT IS NOT SKU PROOF AND IS THE
      SAME PICTURE AS THE C9300-24U'S. Its column-brightness profile over the supply and fan band, resampled
      to millimetres, agrees with the 48T elevation the merged rear was read from (mean difference 3.4
      of 255, every step edge at the same position to a millimetre), and with Figure 10 in its order from
      the left: ground connectors, SSD slot, console and management ports, fan, StackWise, fan, StackWise,
      fan, StackPower, two supplies. The positions of the merged C9300-48P rear are therefore kept. The
      supplies are the dark honeycomb faces the components use.
  rear-fans:
    confidence: estimated
    note: >-
      Three FAN-T2 modules (the guide: "support three internal hot-swappable 12-V fan modules (FAN-T2=)")
      at a 63.0 mm step, each 43.9 x 41.1 by Table 48, centred 70.5, 133.5 and 196.5 mm from the left.
      The StackWise-480 carriers lie between them (92.5 to 111.1 and 156.2 to 174.8 mm) and hold three
      stacked connectors each, as the elevation draws them, at a 9.3 mm pitch; the guide's Figure 10 points
      at two ports in all, so each carrier is one port.
  rear-power:
    confidence: estimated
    note: >-
      The StackPower connectors (callout 7), S-PWR 1 over S-PWR 2, with XPS under the first, at 233.0
      mm, and the two supply bays 258.5 and 348.4 mm from the left, each the supplies' 82.55 x 40.1 by
      the guide's physical table. A 13.5 mm strip of bare chassis closes the right. The guide does not
      number the supply slots; psu-1 is the left.
  rear-left:
    confidence: estimated
    note: >-
      The ground connectors (callout 1) as two ground screws, the USB 3.0 SSD slot (callout 2) under a
      cover the guide calls the "blank cover on the USB 3.0 SSD slot", the RJ-45 CONSOLE port (callout
      4) on the left and the RJ-45 MGMT port (callout 5) on the right, each 14.2 mm from the next, and
      the lamps for the console and the beacon (callout 3) in the icon row beneath. The jacks' keyways
      point down.
  console-over-management:
    confidence: drawing
    note: >-
      The guide's Ethernet Management Port text says the switch is reached "through the 10/100/1000 Ethernet
      management port or one of the console ports" and the RJ-45 Console Port LED table says the RJ-45
      console is disabled while the USB console is active, so the front mini-USB and the rear RJ-45 are
      one console, and the management port is its own.
  power:
    confidence: datasheet
    note: >-
      Table 1 and Table 18: PoE budget 445 W with the 715 W supply, "Available PoE" of the C9300-24P.
      The guide holds no table of the switch's own draw, and none is written.
  colour:
    confidence: estimated
    note: >-
      #cccccc, the median of the pale bar between the two jack rows in the NetBox front elevation.
  airflow:
    confidence: datasheet
    note: >-
      The Fan Module section: "The airflow direction is from front-to-rear and side-to-rear." One airflow
      for every build, so there are no airflow configurations.
attrs:
  physical:
    weight-note: >-
      16.33 lb (7.4 kg) with the fan modules and the default power supplies installed (Table 43)
  power:
    poe-budget-w: 445
    poe-budget-note: 445 W with the default PWR-C1-715WAC-P (Tables 1 and 18)
    power-supply-options: >-
      PWR-C1-350WAC, PWR-C1-350WAC-P, PWR-C1-715WAC, PWR-C1-715WAC-P, PWR-C1-1100WAC, PWR-C1-1100WAC-P,
      PWR-C1-1900WAC-P, PWR-C1-1900WHV-T, PWR-C1-715WDC (Tables 18 and 35)
  environmental:
    operating-temp: -5 to 45 C (23 to 113 F), Table 37
    storage-temp: -40 to 70 C (-40 to 158 F), Table 37
    humidity: 5 to 90 percent, noncondensing
    altitude: operating up to 3000 m (10,000 ft); storage up to 4500 m (15,000 ft)
  features:
    stacking: StackWise-480 data stacking, up to nine switches, and StackPower, up to four switches
    uplink-modules: >-
      one network module slot; C9300-NM-2Q, -4G, -4M, -2Y, -8X and the 3850 uplink modules (Table 5);
      a blank when none is fitted
    poe: 10/100/1000 PoE+ on all 24 ports
  management:
    console: USB mini-Type B on the front and RJ-45 on the rear; the USB console takes precedence
    oob: RJ-45 10/100/1000 management port on the rear
    usb: USB Type A storage port on the front; USB 3.0 SSD slot on the rear
  lifecycle: {eol: none-announced}
