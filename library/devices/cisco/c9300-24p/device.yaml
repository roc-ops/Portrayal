  width: 444.5
  height: 44.45
  depth: 487.7
  ru: 1
  weight-kg: 7.4
  color: '#cccccc'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mounting, default: true}
    - {name: mid, label: mid-mounting}
    - {name: rear, label: rear-mounting}
gaps:
- what: rack-kit
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The rack depth the bracket kits span. The guide's Figure 29 and its table name the 19-inch brackets
    ACC-KIT-T1=, the four-point extension rails and five brackets 4PT-KIT-T2=, and the 23-inch, 24-inch
    and ETSI brackets RACK-KIT-T1=, and print no range of rack depth, no setback and no part dimension.
    A kind: kit contract needs a depth or a factory preset, so no kit is written and chassis.kits is left
    out; the three positions above are named without a number.
- what: front-usb-generation
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Whether the front USB Type A storage port is USB 2.0 or 3.0. The guide says only "USB Type A storage
    port".
- what: network-modules
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The faces of C9300-NM-2Q, C9300-NM-4G, C9300-NM-4M, C9300-NM-2Y and C9300-NM-8X. The guide draws them
    isometrically and prints no dimension. Left for a later 9300 batch.
- what: lamp-pictograms
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The pictograms under the status lamps and beside the mini-USB port. The guide's Figure 8 gives their
    names and the NetBox elevation draws them at a few pixels each; no legend is drawn.
- what: sides-top-bottom
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the sides. The guide's Figure 1 and Figure 10 show them
    isometrically with a vent on the side and labels on the lid.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  nm-bay: {term: Slot, role: traffic, index-origin: 1}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mode-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  controls:
    term: Button
    role: management
    index-origin: 1
    mixed: >-
      the beacon (UID) button and the Mode button at the left of the front: two buttons that identify
      the switch and step its lamps, both used from the front panel.
  usb-console:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: mini-usb-b}
  usb-storage:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the rear RJ-45 console port beside the rear 10/100/1000 RJ-45 management port: two jobs, one purpose,
      reaching the switch when the data plane cannot.
  stackwise:
    term: Port
    role: fabric
    index-origin: 1
    attrs: {media: stackwise-480}
  stackpower:
    term: Port
    role: service
    index-origin: 1
    attrs: {media: stackpower}
  grounding: {term: Stud, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        The guide: "The switch has two internal power supply module slots. You can use two AC modules
        or one power supply module and a blank module."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 2+1
      redundancy-note: >-
        Three fan modules, and the Fan Module section of the guide says the switch can operate with two
        operational fans while the failed one is replaced.
