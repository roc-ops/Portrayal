aliases:
- {name: Nexus 93180YC-EX, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-EX}
description: >-
  48x 1/10/25G SFP28 and 6x 40/100G QSFP28 1RU data-centre leaf switch on Cisco's Cloud Scale LSE ASIC,
  running NX-OS or ACI. All fifty-four ports and the BCN, STS and ENV lamps are on the port side; two
  power supplies, four fan modules, the console, both management ports and the USB are on the other. Ports
  number 1-54 and run DOWN each column - odd on the top row, even beneath it. Ships port-side intake (burgundy
  modules) or port-side exhaust (blue). End-of-sale was announced in August 2021.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Staged under working/intake/cisco/nexus9300-ex and never committed. (1) Cisco Nexus 93180YC-EX NX-OS
      Mode Hardware Installation Guide, 72 pages, the 2023 capture: the overview callouts, the specification
      appendix B and the LED appendix C. (2) Cisco Nexus 9300-EX Series Switches Data Sheet, c78-742283,
      the 2025 capture: Table 2 specifications, Tables 4 to 6. (3) Cisco's end-of-sale notice EOL14472.
      (4) The NetBox devicetype-library front and rear elevations of this model, which are renders of
      Cisco's own Visio stencil, 1841 x 170 px. (5) Photographs of real units from resale listings: one
      port-side photograph at 1600 x 1200 and one power-supply-side photograph at 1600 x 603 with blue
      modules. THE GUIDE'S OWN FIGURES ARE THREE-QUARTER VIEWS at 718 x 168 px and carry callouts, not
      geometry. No vendor 3D model was found.
  stack-orientation:
    confidence: photo-measured
    note: >-
      Both rows of SFP cages show their contacts toward the band between the rows, and the port lamps
      in that band point up to the upper cage and down to the lower, in the stencil and in the port-side
      photograph alike. So a row pair is the upper cage upright over the lower turned 180, the library's
      stack convention, here read off the device for the SFP rows. The QSFP28 pairs take the same rule;
      their lamps point the same way.
  gate-1:
    confidence: measured
    note: >-
      NEITHER FULL-FACE IMAGE IS AN ELEVATION TO BE MEASURED WHOLE, AND THE TWO FAIL DIFFERENTLY. The
      stencil render is flat, but scaled on its own SFP pitch (54.0 px per 14.25 mm) its body between
      the ear folds is 431.7 mm against the data sheet's 439.4: 1.7% narrow, and its 170 px height is
      44.9 mm against 43.7. The port-side photograph is a perspective view from the left: the SFP pitch
      reads 51.9 px in the first group of eight, 50.75 in the second and 49.1 in the third. THE PHOTOGRAPH
      IS THE ONE USED FOR X, WITH THE PERSPECTIVE FITTED AND THEN PROVED. A quadratic through those three
      local scales, integrated from the left edge of the face, puts the right edge at 438.8 mm - 0.14%
      from the stated 439.4, on a quantity the fit never saw. The same integration reads the three QSFP28
      openings 19.95, 19.84 and 19.73 mm wide against the registry's 20.0, and each SFP group 114.0 to
      114.1 against 8 x 14.25.
  the-x-axis:
    confidence: photo-measured
    note: >-
      From that integration, with the 0.6 mm residual split between the two margins. The SFP groups start
      at 10.9, 129.1 and 247.3: two gutters of 4.2 mm, read 4.16 and 4.28. THE STENCIL DRAWS THOSE GUTTERS
      AT 1.85 mm and the left margin at 9.8; the photograph of the real unit is followed, and the three
      gutter-and-margin differences add up to the 7.7 mm by which the stencil body is narrow. The QSFP28
      openings start at 366.9, 391.3 and 415.7, a 24.4 mm step read 24.7 and 24.1.
  the-y-axis:
    confidence: estimated
    note: >-
      NOT MEASURED. The photograph is taken from above and its vertical axis carries no scale. Every y
      is a fraction of the stencil render's 170 px height applied to the stated 43.7 mm: SFP rows at 7.2
      and 23.4, QSFP28 rows at 7.3 and 24.1, the numerals on one baseline at 5.0, the two rows of square
      vent holes at 37.6 and 41.0. The SFP row step that gives is 16.2 mm where the registry's belly-to-belly
      figure is 15.0; the photograph shows a tall bright band between the rows, so the stencil's step
      is kept and recorded as an estimate.
  the-width:
    confidence: datasheet
    note: >-
      THE TWO DOCUMENTS DISAGREE AND THE DATA SHEET IS CARRIED. Data sheet Table 2: "1.72 x 17.3 x 22.5
      in. (4.4 x 43.9 x 57.1 cm)". Installation guide, Switch Dimensions: width "17.5 inches (44.5 cm)".
      17.3 in is 439.4 mm and the perspective-corrected photograph closes on it to 0.14% with the SFP
      pitch as its only ruler; 444.5 would leave 5.7 mm unaccounted for. Neither figure includes the rack
      brackets, which are a separate kit (NXK-ACC-KIT-1RU). Height 1.72 in is 43.7 mm and depth 22.5 in
      is 571.5 mm, the same in both documents. See the gap.
  port-order:
    confidence: photo-measured
    note: >-
      Read off the port-side photograph and the stencil, which agree. Each SFP column prints two numerals
      on one baseline above the upper cage with an up and a down triangle between them - "1 (up)(down)
      2" - so the odd port is the upper cage. The QSFP28 columns print "49 (up)" and "(down) 50" the same
      way. The installation guide numbers nothing in its figures; the data sheet's architecture text gives
      ports 1 to 48 and 49 to 54.
  port-lamps:
    confidence: datasheet
    note: >-
      Installation guide, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down
      to the nearest port." Both images show one up and one down triangle per SFP column in the band between
      the rows, and one of each at the two ends of each QSFP28 band. THE GUIDE GIVES NO COLOUR TABLE for
      port lamps or for BCN, STS and ENV; the states here are the legend and on, nothing more.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the power-supply side is a fraction of the stencil render, scaled so the body between
      the ear folds is 439.4 mm across and 43.7 down. The stencil is the only flat picture of this face.
      WHAT IS ON IT AND IN WHAT ORDER IS CONFIRMED by the real-unit photograph and by the guide's callouts
      1 to 7: supply 1, four fans with fan 1 at the left, supply 2, then the console jack over the RJ-45
      management jack, the SFP management port, the USB port stood on end, and the BCN and STS lamps with
      a screw between them. The printed strips beside the supplies read P1, F1, F2 and P2, F4, F3 in the
      stencil; the photograph resolves the same six labels.
  power:
    confidence: datasheet
    note: >-
      Data sheet Table 2 and the installation guide's Switch Power Input Requirements agree: 210 W typical,
      470 W maximum, "(AC or DC)". The data sheet's footnote says both "are based on input drawn from
      the power circuit", so these are the switch's draw at the inlet and not a supply rating. Neither
      document names the configuration or ambient. Heat is printed two ways - 1604 BTU/hr in the data
      sheet, "1603.706" per hour in the guide - and the data sheet's rounding is carried.
  colour:
    confidence: estimated
    note: >-
      The face is a light grey with dark printing and bright bands between the cage rows, in the photographs
      and the stencil alike. The hex values are read off those images.
