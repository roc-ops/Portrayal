      25-Gigabit Ethernet". SFP-10G-T-X is supported only in a stated checkerboard of ports, with the
      neighbours limited to passive copper.
    optics-qsfp28: >-
      installation guide: "six fixed 40/100-Gigabit QSFP28 uplink ports that support combinations of 10-,
      25-, 40-, 50-, and 100-Gigabit connectivity".
    usb-limit: USB 2.0 devices that use less than 2.5 W (0.5 A inclusive of surge current)
