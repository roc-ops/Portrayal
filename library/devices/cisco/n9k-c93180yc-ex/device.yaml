configurations:
  ac-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-650W-PI supplies and four NXA-FAN-30CFM-B fan modules - port-side intake airflow, burgundy
      latches
    default: true
  ac-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-650W-PE supplies and four NXA-FAN-30CFM-F fan modules - port-side exhaust airflow,
      blue latches. The installation guide's Overview table gives the colours.
    airflow: back-to-front
    component-attrs:
      nxa-fan-30cfm: {latch-finish: '#2f7fd1', latch-edge: '#1d4f8a', airflow: port-side-exhaust}
      nxa-pac-650w: {latch-finish: '#2f7fd1', latch-edge: '#1d4f8a', airflow: port-side-exhaust}
references:
- title: Cisco Nexus 93180YC-EX NX-OS Mode Hardware Installation Guide
- {title: Cisco Nexus 9300-EX Series Switches Data Sheet (c78-742283)}
- title: >-
    End-of-Sale and End-of-Life Announcement for the Cisco N9K-C93180YC-EX and Cisco N9K-C93108TC-EX (EOL14472)
