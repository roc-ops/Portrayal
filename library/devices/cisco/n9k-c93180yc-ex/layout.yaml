gaps:
- what: width-17-3-or-17-5
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    The data sheet (c78-742283, Table 2) gives the width as 17.3 in (43.9 cm); the
    installation guide's Switch Dimensions table gives 17.5 inches (44.5 cm). Same measure,
    same scope, different value. 439.4 is carried because a real-unit photograph, corrected
    for perspective on the SFP cage pitch, closes on it to 0.14%. A ruler across a chassis
    settles it.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The installation guide's two
    overview figures show a side wall in three-quarter view and call out six screw holes for
    the rack-mount brackets and two for the grounding lug on it, and the mounting chapter
    shows the lid the same way; none is flat and none can be measured. Each of the four
    carries an `empty:` sentence saying where I looked.
- what: two-unlabelled-features-above-bcn
  scope: [front]
  reason: needs-photo
  wanted: >-
    What the two round dark features at the upper left of the port side are. The stencil
    render and the port-side photograph both show two of them side by side at about 5.4 and
    8.9 mm from the left edge, 11.8 mm down, above the BCN lamp, with no legend. The guide's
    callout for this corner names only BCN, STS and ENV. They are not drawn: a lamp, a
    button and a hole look the same at this resolution.
- what: qsfp-lane-windows
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the eight dashes in each QSFP28 band are. Between the up and down port lamps each
    band carries two rows of four short dark dashes, clear in the stencil and resolved in
    the photograph. They are in the right place and number to be per-lane breakout lamps for
    the two cages, and no staged document says so: the guide's LED appendix describes port
    lamps as triangles and nothing else. They are drawn as marks on the band and carry no
    state.
- what: marks-under-the-qsfp-cages
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The meaning of the row printed under each QSFP28 pair: a square, an up and a down
    triangle, and a second square. Drawn as printed, from the stencil, and explained
    nowhere in the guide or the data sheet.
- what: lamp-colours
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The colours and blink patterns of BCN, STS, ENV and the port lamps. The installation
    guide's LED appendix gives tables for the fan module and the power supply and one
    sentence for the chassis; the startup procedure adds only that STS "is green" after
    initialisation. Searched both staged documents for BCN, ENV and "port LED".
- what: other-power-supplies
  scope: [rear]
  reason: needs-photo
  wanted: >-
    Faces for the other supplies this switch accepts. The guide lists N9K-PUV-1200W (HVAC/
    HVDC, white), UCSC-PSU-930WDC (green), UCS-PSU-6332-DC (grey), NXA-PDC-930W-PI and
    NXA-PDC-930W-PE, and the data sheet adds NXA-PAC-500W-PI and NXA-PAC-500W-PE. The only
    supply any staged image shows is the 650 W AC one, so that is the only one the bays
    accept here.
- what: module-sizes-are-off-a-stencil
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A stated or measured size for the supply and the fan module. No staged document gives
    either in millimetres; both are read off the stencil render, which is 1.7% narrow on
    the port side where a photograph can check it.
- what: sfp-row-step
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The vertical step between the two SFP rows. 16.2 mm is the stencil's proportion; the
    registry's stacked-cage figure is 15.0. A square-on photograph with the full face height
    in frame would settle it and every other y on this face.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the power-supply side - an RJ-45 console
      port, an RJ-45 and an SFP management port of which one is active at a time, and a USB
      Type-A port for saving and copying files. Three media, one purpose: reaching the
      switch when the data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        installation guide: "Power supply modules (two - One for operations and one for
        redundancy [1+1])". Slot 1 is on the left and slot 2 on the right.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy-note: >-
        Installation guide, Overview: four fan modules of two rotors each. The switch runs
        normally with one rotor failed in any one module; with more than one rotor failed it
        warns and powers down in two minutes. The guide states no N+1 figure for whole
        modules, so none is written here.
