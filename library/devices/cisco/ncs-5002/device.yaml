  width: 442.5
  height: 88.9
  depth: 489.7
  ru: 2
  color: '#c9cccf'
  ears:
    positions:
    - {name: flush, label: front bracket, default: true}
gaps:
- what: sale-status
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    Whether the NCS 5002 is on sale. The one held document is silent; the intake grid marks every NCS
    model unknown. An end-of-sale notice or the product page would settle it.
- what: flat-face-figures
  scope:
  - front
  - rear
  reason: needs-drawing
  wanted: >-
    A flat front and rear elevation, or a photograph taken square on. The guide's Figures 3 and 4 are
    greyscale three-quarter views, so every position is estimated and no printed numeral or legend can
    be read.
- what: seam-width
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The width of the seam between the two stacked halves and the margin above and below the cage fields.
    They are read off Figure 4 as 3.0 mm and 17.5 mm from a three-quarter view, and a flat elevation would
    settle them to the millimetre.
- what: printed-legends
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: >-
    The legends printed beside the ports, lamps and jacks. None is resolved in the held figures, so none
    is drawn, and the model name is not drawn either because nothing shows it as printed.
- what: which-half-is-which-board
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Which half of the face is the baseboard and which the DWDM and ZR mezzanine. The guide gives the counts
    and the colours and no position.
- what: management-jack-speed
  scope:
  - mgmt
  reason: vendor-silent
  wanted: >-
    The management jack's rate. Searched the guide for "10/100", "1000", "Gigabit" and "speed" beside
    the management interface: it names the interface and the console's RS-232 and gives no rate for the
    jack.
- what: grounding-pad
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The grounding pad. The guide says to remove "the label on the right side of the front side (port side)"
    of the 5002 to expose it and shows it in Figure 15 in three-quarter view; its position and size cannot
    be read, so it is not drawn.
- what: rack-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack-mount kit as a kit contract: part numbers, the dimensions of the bracket, guide and slider
    rail, and the rack depth range. The guide gives a parts list (Table 9; accessory kit NCS-5002-ACSR
    in Appendix A) whose counts disagree, and a rack requirement of 23.5 to 34.0 in between the outside
    faces of the front and rear rails.
- what: fan-and-lamp-power
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The fan module's power draw, and the chassis' own draw. Appendix C gives supply ratings only.
- what: air-filters
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The air filters, which the guide draws but does not size or number. Port-side intake takes a three-piece
    filter on the port-side faceplate (Figure 22); port-side exhaust takes clip-on filters on the supply
    and fan fronts (Figure 23, drawn on this chassis's two-fan rear). No part number, size or position
    is held for either.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the side walls. The guide shows them in three-quarter view
    only, with bracket holes on a side wall.
groups:
  sfp-plus-upper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  sfp-plus-lower:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  qsfp28-upper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  qsfp28-lower:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band ports on the lower half of the port side - an RJ-45 console, an RJ-45 management
      jack and a USB port. Two media and a USB, one purpose: reaching the router when the data plane cannot.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        guide Chapter 1, Features: "Two 1+1 redundant, hot-swappable power supplies", and "A minimum of
        one power supply is required for normal operation".
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        guide Chapter 1, Fan Modules: "slots for two 1+1 redundant fan modules", hot-swappable; "The system
        can work with a single fan failure. More than one fan failure leads to system shutdown."
