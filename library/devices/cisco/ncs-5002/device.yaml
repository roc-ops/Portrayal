configurations:
  ac-port-side-intake:
    kind: base
    default: true
    power: ac
    airflow: front-to-back
    source: >-
      derived - the guide prints no ordering code for any build, so the library defines the base as the
      first build the guide lists: AC supplies and front-to-back fan modules (Tables 4 and 5).
    description: >-
      Two NC5K-PAC-650W-FR supplies and two NCS-5002-FN-FR fan modules: AC power, front-to-back airflow
      (port-side intake).
  ac-port-side-exhaust:
    kind: example
    power: ac
    airflow: back-to-front
    description: >-
      Two NC5K-PAC-650W-BK supplies and two NCS-5002-FN-BK fan modules: AC power, back-to-front airflow
      (port-side exhaust). An illustration: the guide prints no ordering code for this build.
    bays: {psu-1: cisco/nc5k-pac-650w-bk@1, psu-2: cisco/nc5k-pac-650w-bk@1, fan-1: cisco/ncs-5002-fn-bk@1,
      fan-2: cisco/ncs-5002-fn-bk@1}
  dc-port-side-intake:
    kind: example
    power: dc
    airflow: front-to-back
    description: >-
      Two NC5K-PDC-930W-FR supplies and two NCS-5002-FN-FR fan modules: DC power, front-to-back airflow
      (port-side intake). An illustration: the guide prints no ordering code for this build.
    bays: {psu-1: cisco/nc5k-pdc-930w-fr@1, psu-2: cisco/nc5k-pdc-930w-fr@1}
  dc-port-side-exhaust:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two NC5K-PDC-930W-BK supplies and two NCS-5002-FN-BK fan modules: DC power, back-to-front airflow
      (port-side exhaust). An illustration: the guide prints no ordering code for this build.
    bays: {psu-1: cisco/nc5k-pdc-930w-bk@1, psu-2: cisco/nc5k-pdc-930w-bk@1, fan-1: cisco/ncs-5002-fn-bk@1,
      fan-2: cisco/ncs-5002-fn-bk@1}
references:
- title: >-
    Hardware Installation Guide for Cisco NCS 5000 Series Routers (first published 2015-12-23, last modified
    2019-01-31)
