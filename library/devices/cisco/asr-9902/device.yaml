      redundancy-note: 'the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide lists "Route Processors (RPs) | A99-RP-F | 2" in its ASR 9902 components table, and the data sheet c78-744663 says the router "supports two redundant Route Processors (RPs)" and lists "Route processor redundancy" in Table 2. NEITHER NAMES A FORM, and 1+1 is the reading: with exactly two slots and redundancy between them there is no other arithmetic'
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  qsfp-dd:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 100g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 0
  board-status:
    term: LED
    role: indicator
    index-origin: 0
  power-modules:
    term: PM
    role: service
    index-origin: 0
    physical-context: Power Module
    attrs:
      redundancy: '1+1'
      redundancy-note: 'data sheet c78-744663 Table 2, twice over: "1.6 kW DC power module (up to 2 modules), redundancy: 1+1" and "1.6 kW AC power module (up to 2 modules), redundancy: 1+1". The install guide adds the constraint that decides a build: "A total of two AC or DC power supplies are allowed in the Cisco ASR 9902 chassis", and mixing AC and DC is not supported'
  fan-trays:
    term: FT
    role: service
    index-origin: 0
    physical-context: Fan
    attrs:
      redundancy-note: 'NO FORM IS STATED AND NONE IS INVENTED, so this group carries a note and no `redundancy`. The data sheet says "3 fans in redundant configuration" and lists "Fan redundancy" in Table 2 with no arithmetic beside it, and the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide gives replacement steps and no ratio. It is the ruling edgecore/csr310 carries for "Hot swappable redundant fan modules"'
  power-switch:
    term: Switch
    role: service
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 1
