format: 1
kind: device
name: asr-9902
version: 0.1.3
maturity: modelled
manufacturer: Cisco
model: ASR 9902
portfolio:
  line: Service Provider
  family: Aggregation Services Router
  series: ASR 9000 Series
description: >-
  Cisco ASR 9000 Series ASR 9902 Router - a 2 RU fixed-port aggregation services
  router delivering up to 800 Gbps. Two route processors across the top and the
  integrated fixed board below them, carrying forty-eight ports in two mirrored
  slices: eight SFP28, three QSFP28 and one QSFP-DD and twelve SFP+ on each. The
  rear carries two 1.6 kW power modules at the ends and three fan trays between
  them, with the power switch on the left panel and the NEBS grounding lug on
  the right. Airflow is front to back. Nothing seats in the front: the board is
  part of the chassis and there is no Port Expansion Card bay, which is what
  separates this from its 3 RU ASR 9903 sibling.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      the Cisco ASR 9902 Compact High-Performance Router Data Sheet (c78-744663,
      2021); the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation
      Guide (b-asr9001-hardware-installation-guide.pdf, last modified
      2021-07-30, which despite its filename covers the 9001, 9901, 9902 and
      9903); the Interface and Hardware Component Configuration Guide, IOS XR
      24.x, whose Table 19 is what settles which two ports are the QSFP-DDs; and
      Cisco's own Visio stencil Routers-Cisco_ASR_9000, masters "ASR-9902 Front"
      and "ASR-9902 Rear".
  face-check:
    confidence: drawing
    note: >-
      done BEFORE measuring, because Cisco's master filenames name the wrong
      faces on the ASR 9910 and nothing downstream would have caught it. No swap
      here. "ASR-9902 Front" carries the two A99-RP-F cards, the forty-eight
      numbered ports, the two slice bands and the CISCO / ASR 9902 branding, and
      matches Figure 1 of the install guide, "Front Panel of the Cisco ASR 9902
      Router". "ASR-9902 Rear" carries the two power modules, the three fan
      trays, the power switch and the grounding lug, and matches Figure 2.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - Table 2 of c78-744663, "Physical dimensions (includes ejector
      bracket/lever); (H x W x D); weight": ASR 9902 chassis with 2 RPs, 2 PSUs
      and 3 FANs, 3.45 x 17.3 x 19 in. and 46.39 lb, or 87.63 x 439.74 x 482.60
      mm and 21.04 kg. THE DEPTH NOTE IS A TAUTOLOGY AND IS NOT A SECOND FIGURE.
      Underneath the row Cisco writes "Note: Excluding ejector, the depth is 19
      in./482.6 mm" - the same number the row already gives, so unlike the ASR
      9903, where the two differ by 162 mm, there is nothing here to choose
      between. The data sheet's own overview agrees a third time: "The compact
      size (depth is 19 in., 483 mm)". So `chassis.depth` is 482.60 and no gap is
      opened over it. WIDTH IS THE BODY: 439.74 mm is 17.3 in, not the 19 in rack
      face, so this figure is already between the ear folds and L43 has nothing
      to catch. HEIGHT IS THE CHASSIS AS BUILT, NOT THE RACK ALLOCATION: 87.63 mm
      against 2 RU's 88.90, built 1.27 mm under its allocation for clearance, the
      same shortfall the ASR 9903, 9904, 9906 and 9910 show. The install guide
      quotes the allocation instead - "Height of the ... Cisco ASR 9902 Router is
      3.45 inches (8.77 cm)" is 87.63 and agrees, while its ASR 9903 line quotes
      5.25 in, which is that chassis's 3 RU allocation rather than its height.
      The data sheet figure is carried and the RU is carried separately.
  stencil-calibration:
    confidence: drawing
    note: >-
      THE TWO MASTERS CALIBRATE SEPARATELY AND THEY HAD TO BE, because their
      shape boxes use different conventions: "ASR-9902 Front" reads 1.9 x 0.35
      in at 1:10, which is 482.60 x 88.90 mm - the 19 in rack face by the 2 RU
      ALLOCATION - while "ASR-9902 Rear" reads 482.60 x 87.38, which is the rack
      face by the CHASSIS AS BUILT to within a quarter of a millimetre. One
      stencil, one chassis, two conventions; the metrology note's rule that a
      master's height must be checked against a document every time is what
      caught it.
      Both are uniform enough to measure: x against y comes out 0.24 percent
      apart on the front and 0.29 on the rear, against 0.66 on the ASR 9001 and
      0.06 on the ASR 9904.
      THE MODEL IS ANCHORED ON THE DATA SHEET BODY on both faces, because the
      body is what the views are: the front's ink spans 1568.93 x 315.59 art
      units between the ear folds and the rear's 1562.93 x 309.49, and setting
      each to 439.74 x 87.63 gives kx/ky of 0.280280/0.277670 and
      0.281356/0.283143.
      THE RULER THAT CONFIRMS IT IS INSIDE THE ARTWORK. The fixed board's twenty
      SFP-class cage columns sit on a measured 50.85 art-unit pitch, constant to
      0.01 over five consecutive gaps; at this scale that is 14.253 mm against
      SFF-8433's 14.25 for a ganged SFP+ assembly - 0.02 percent, on a dimension
      that was never an input. The cage bores then come out 9.49 x 3.53 mm and
      the QSFP bores 18.86 x 8.83, against 9.58 x 3.56 and 19.02 x 8.92 measured
      the same way on the ASR 9903: the same parts, agreeing to a percent across
      two chassis.
  the-stencil-draws-both-bodies-the-same-width:
    confidence: drawing
    note: >-
      WORTH KNOWING BEFORE ANYONE RE-MEASURES EITHER CHASSIS. The ASR 9902 and
      ASR 9903 front masters draw their chassis bodies 1568.93 and 1569.68 art
      units wide - the same outline to 0.2 mm - while Cisco publishes 439.74 mm
      for this chassis and 443.86 for the 9903, which is 4.12 mm apart. Both
      cannot be right about the drawing.
      THE SFP RULER SAYS THIS ONE IS THE HONEST FIT. Anchored on 439.74 the
      cage pitch lands on 14.253 mm against the standard's 14.25; anchored on
      443.86 the ASR 9903's equivalent pitch lands on 14.36, which is 0.8 percent
      over a standard that does not vary. The likeliest reading is that one body
      outline was drawn for one of the two chassis and reused for the other, and
      that the ASR 9903's ports are drawn about 0.8 percent wide as a result.
      NOTHING IS CHANGED ON THE STRENGTH OF THAT HERE. It is a measurement of
      this master, recorded where it was made; re-reading the ASR 9903 against
      it is roc-ops/Portrayal#374.
  rp-slots:
    confidence: drawing
    note: >-
      The two RP slots are on a 209.58 mm pitch and the bays carry that figure,
      while the module they accept, cisco/a99-rp-f@1, declares a 221.84 mm
      envelope, so L33 reports 12.26 mm on each. This is the same situation the
      ASR 9903 carries and the same reason: the a99-rp-f master's art includes a
      retention bracket at each end and its Visio shape box measures the lot,
      and in the chassis those brackets interleave.
      THE PITCH IS THE DRAWING'S, TWENTY-ONE TIMES OVER. Every feature of RP1
      sits exactly 209.58 mm left of its twin on RP2 - the yellow A99-RP-F band
      at 20.30 against 229.88, SYNC0 at 63.07 against 272.64, and nineteen more -
      and the two plates measure 220.21 mm each, overlapping by 10.63.
      IT IS NOT THE SAME NUMBER AS THE ASR 9903'S 211.44 AND THE DIFFERENCE IS
      NOT PHYSICAL. In ART UNITS the two masters place the RPs identically, at
      747.73 and 747.75 units; the mm differ only because the two chassis bodies
      the pitch is anchored to differ by 4.12 mm. Whichever body figure is wrong -
      see the-stencil-draws-both-bodies-the-same-width - one of the two pitches
      is wrong with it, by about 0.9 percent. The bay is sized to the pitch
      either way, because docs/bay-and-component-size.md is explicit that a bay
      may exceed the opening and must never exceed the pitch.
  fixed-board:
    confidence: datasheet
    note: >-
      THE FIXED BOARD IS NOT A BAY, and Cisco is in two minds about how to say
      so. Table 2 of the install guide lists it as a component with a part
      number - "Fixed Board Line Card | ASR-9902-LC | 1" - and the
      troubleshooting chapter's `show environment` gives it a slot and a power
      allocation, "0/0 ASR-9902-LC 614 283 ON". But the data sheet calls the
      ports "integrated" four times, the router "consists of the fixed board",
      and the guide's replacement chapter - which has a procedure for the RPs,
      the power modules, the fan trays and the air filter - has none for it. So
      its forty-eight ports are placements on the chassis face, and the part
      number and the 614 W allocation are recorded in attrs rather than on a
      module nobody can remove.
      THE NUMBERING IS THE GUIDE'S AND THE MASTER'S TOGETHER. Figure 119, "Cisco
      ASR 9902 Fixed Ports", gives the arrangement by slice - "SFP28 ports; eight
      on each slice", "QSFP28 ports; three on each slice", "QSFP-DD ports; one on
      each slice", "SFP+ ports; twelve on each slice" - and the master prints all
      forty-eight numerals under the cages, 0 to 23 on the blue slice-0 band and
      24 to 47 on the purple slice-1 band. Eight plus four plus twelve is
      twenty-four a slice, and the two readings agree port for port.
      THE BOARD IS MIRROR-SYMMETRIC. Slice 0 runs SFP28, QSFP, SFP+ left to right
      and slice 1 runs SFP+, QSFP, SFP28, so the two QSFP blocks sit inboard and
      the two SFP28 blocks at the ends.
  which-two-are-qsfp-dd:
    confidence: datasheet
    note: >-
      SOURCED, NOT INFERRED, and that is worth saying because the equivalent fact
      on the ASR 9903's 2T Port Expansion Card had to be guessed at. Table 19 of
      the Interface and Hardware Component Configuration Guide, "Supported Line
      Cards, Ports, and Modes" for the 400G Digital Coherent QSFP-DD optics,
      carries a row for this chassis: "ASR-9902 | 1x100G | 11, 37 | No | No | No |
      No | Yes". Ports 11 and 37 are the two front-panel ports that take a
      QSFP-DD coherent module, which is one per slice and exactly what Figure
      119's callout 5 says there should be.
      THE DRAWING AGREES WITHOUT BEING ASKED. On the master, the EMI gasket
      between the two bores of the cage holding ports 10 and 11 is drawn as a hex
      mesh where every other stacked cage on the board has a slotted grid, and
      the same is true of the cage holding 36 and 37. Two independent sources
      landing on the same two ports is what makes this sourced rather than read.
  port-lamps:
    confidence: drawing
    note: >-
      drawing for the count and the positions, install guide for the states.
      FORTY-EIGHT LAMPS FOR FORTY-EIGHT PORTS, one each, all on one baseline at y
      82.00 and all cut to 2.78 x 1.59 mm, each beside its port's direction
      triangle - down for the upper port of a stacked pair, up for the lower. The
      rule reaches the end of the face: port 47's lamp is at 422.43 like every
      other, and no port on this board is without one.
      THE STATES ARE TABLE 27 of the install guide, "Port Status and LC FAIL
      LEDs", transcribed: Port Status LEDs, one per port: green = port up with a
      valid physical-layer link; blinking = line activity, the LED going
      green-amber-green; red = port up but link lost, or an SFP/QSFP failure; off
      = port administratively shut down. The blinking state is carried as a green
      lamp with an amber second colour, which is what "green-amber-green"
      describes.
  slices:
    confidence: drawing
    note: >-
      install guide for what they are, master for where they are. "The 48 ports
      are grouped in slice 0 and slice 1. The slice 0 is color coded in blue, and
      slice 1 in purple", with the note that "A slice is a logical grouping of
      physical ports". The master paints them: a #00b0f0 band from 21.86 to
      218.69 under ports 0 to 23 and a #cc66ff band from 226.40 to 425.33 under
      24 to 47, each carrying its ports' numerals in white and the rate chips
      10/25G, 100G and 10G in black.
      THE SLICE IS WHERE PORT MODE IS SET, which is why the band is worth
      drawing rather than treating as decoration: "The port mode configuration is
      per slice and not per port", and the configuration guide's Table 41 gives
      five options per slice, from the default 1x100GE, 1x100GE, 10x10GE, 10x10GE
      through to four-by-25GE mixes.
  power:
    confidence: datasheet
    note: >-
      datasheet - Table 2 of c78-744663: "1.6 kW DC power module (up to 2
      modules), redundancy: 1+1" and "1.6 kW AC power module (up to 2 modules),
      redundancy: 1+1", with "Mixing of AC and DC modules is not supported". The
      install guide adds the input ranges, shared with the ASR 9903 because it is
      the same module: 200-240 V high line and 90-130 V low line for AC, -48 VDC
      nominal over a -40.5 to -72 V range at 40 A maximum for DC.
      THE ONE PER-FRU TABLE IN THE INTAKE WAS TAKEN ON THIS CHASSIS. The
      troubleshooting chapter's `show environment` example is an ASR 9902 with
      two supplies and three fans, and its allocations - ASR-9902-LC 614 W,
      A99-RP-F 102 W, ASR-9902-FAN 72 W - are this chassis's own rather than a
      sibling's. That is why cisco/asr-9902-fan@1 carries a power figure and
      cisco/asr-9903-fan@1 does not.
      THE CHASSIS CARRIES NO ENVELOPE FIGURE AND THIS FILE INVENTS NONE. Neither
      document states a typical or maximum chassis draw, so there is no
      power-max-w here and the per-module figures stand on their own.
  cooling:
    confidence: datasheet
    note: >-
      datasheet - "3 fans in redundant configuration", Table 2's Redundancy row
      lists "Fan redundancy" with no ratio, and Airflow is "Front to back". The
      install guide adds the filter: "The Cisco ASR 9903 and Cisco ASR 9902
      Router have a serviceable air filter (Cisco PID: ASR-9903-FILTER and
      ASR-9902-FILTER)."
      THE REDUNDANCY RATIO IS NOT PUBLISHED AND IS NOT SUPPLIED. The group
      carries a `redundancy-note` and no `redundancy`, and L69 warns that this
      chassis does not say how many fans it can lose. Three trays described as
      redundant is 2+1 and nothing else worth writing - but Cisco does not write
      it, and the ruling edgecore/csr310 carries for "Hot swappable redundant fan
      modules" applies the same way here as it does on the ASR 9903.
  power-switch:
    confidence: drawing
    note: >-
      IT IS A REAL SWITCH AND THE GUIDE NAMES IT, which is the difference between
      this chassis and its sibling. Figure 154, "Power Switch on the Cisco ASR
      9902 Router", callouts: "1 Power Switch, 2 Power Status", and the step it
      illustrates reads "Set the power switch to the ON position. The chassis
      power LED turns Red." The switch is the slider under the yellow ATTENTION /
      ON-OFF tag on the left-hand rear panel, and the Power Status lamp is the
      small round lens below it.
      IT IS DRAWN AND NOT SEATED. A panel switch is not a module, so the frame
      and its tag are panel decor and the legend is silkscreen; only the lamp is
      a placement, because a lamp is a thing the viewer lights. The lamp's
      POSITION is read off a 4x render of the master by eye - it is drawn as a
      stroked circle with no fill, which the shape parser does not carry - while
      its legend and its identity are the guide's.
      THE MASTER AND THE GUIDE DISAGREE ABOUT ONE WORD, and only one of them is
      printed here. Cisco's photograph prints POWER in the space under the tag
      with the lamp below it; the Visio master prints STATUS in that same space.
      They are not two legends in two places - they are one legend, worded twice.
      The master's word is carried, because the master is what positions every
      other mark on this face and printing both would put ink on the metal twice
      over. If a photograph of a real ASR 9902 rear settles it the other way, the
      change is one string.
  grounding:
    confidence: drawing
    note: >-
      install guide for what it is, master for where. "Cisco ASR 9902 and Cisco
      ASR 9903 Router - One grounding lug, which has two M5 bolt holes", and
      Figure 74, "NEBS Bonding and Grounding Points on the Cisco ASR 9902
      Router". The rear master draws the two holes 15.95 mm apart on centres, on
      a lug landing at the right-hand rear panel, with an IEC 60417-5019 earth
      symbol below it and a hex bonding stud to its left. cisco/a9k-ground-pad@1
      carries a 15.3 mm two-hole pitch, which covers it to within 0.65 mm, and it
      is placed unrotated here because this chassis mounts the lug flat where the
      ASR 9903 mounts it upright.
      ONE EARTH MARK, NOT TWO. cisco/a9k-ground-pad@1 draws its own IEC
      60417-5019 mark beside the lug, so no separate symbol is placed here; the
      master puts the mark BELOW the lug instead, and that difference is the
      component's drawing convention rather than a second grounding point.
  air-filter:
    confidence: datasheet
    note: >-
      NOT DRAWN, deliberately, and for the reason the ASR 9903's is not:
      ASR-9902-FILTER mounts on the FRONT of the chassis, in front of every face
      this model draws - Figure 178, "Install Air Filter-Cisco ASR 9902", shows
      it sliding onto the front mounting brackets as a full-face frame. Drawing
      it would hide the whole front view, and it is an option rather than part of
      the chassis. ASR-9902-CAB-MGMT is left out for the reason the modelling
      guide gives for cable management generally: it is not a panel fact.
attrs:
  physical:
    rack-face-width-mm: '482.6'
    rack-mounting: 2-post and 4-post, 19-in. and 23-in.
  performance:
    capacity: 800 Gbps nonblocking full-duplex
    integrated-interfaces: 2 x QSFP-DD, 6 x QSFP28, 16 x SFP28, 24 x SFP+
    fixed-board-part: ASR-9902-LC
    port-rates: 1, 10, 25, 40 and 100 Gigabit Ethernet
    slices: 2 (slice 0 colour-coded blue, slice 1 purple); port mode is set per slice
    port-modes-sfp28: '25GbE and 10GbE dual-rate - data sheet Table 2, "16 SFP28 dual-rate ports capable of 25Gb and 10Gb Ethernet". Cisco publishes no per-optic list for this chassis and points at the Cisco Optics Compatibility Matrix, so this is the rate list and not an optics list'
    port-modes-sfp-plus: '10GbE LAN and WAN (OTN) - data sheet Table 2, "24 SFP+ ports capable of 10Gb Ethernet (LAN) and WAN (OTN)". Configuration guide Table 41 adds 1GbE and 5x1GE_5x10GE slice modes from IOS XR 7.9.1'
    port-modes-qsfp28: '10, 40 and 100 Gigabit Ethernet - data sheet Table 2, "6 QSFP28 ports capable of 10Gb, 40Gb, and 100Gb Ethernet". The 40G port mode needs IOS XR 7.8.x or higher'
    port-modes-qsfp-dd: '10, 40 and 100 Gigabit Ethernet on the cage - data sheet Table 2, "2 QSFP-DD ports capable of 10Gb, 40Gb, and 100Gb Ethernet" - plus 1x100G transponder mode with a 400G digital coherent module, per Table 19 of the configuration guide, which lists ASR-9902 ports 11 and 37 and marks the 400G and muxponder modes No'
