configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - built from the group roles rather than from a vendor bundle: the
      service and management bays keep their seats, and this chassis has no
      traffic bay to empty because its forty-eight ports are on an integrated
      board. Cisco publishes no base bundle for it - the ordering tables in
      c78-744663 list the chassis, the RP, the supplies, the fan tray, the
      mounting kits, the cable management and the filter as separate line items.
    description: >-
      Chassis only - what you spec before deciding what goes in it. Both route
      processors, two AC supplies and all three fan trays are seated. The
      forty-eight fixed-board ports are part of the chassis and are there in
      every configuration; unlike the ASR 9903 there is no Port Expansion Card
      bay, so there is nothing to leave out.
  ac:
    kind: orderable
    description: >-
      The AC build: two PWR-1.6KW-AC modules, 1+1. Named explicitly even though
      the base already seats them, so that asking for the AC variant does not
      mean knowing which flavour the base happens to carry. The module handles
      both high line (200-240 V) and low line (90-130 V), but swapping between
      them means pulling the supply out and back in.
    part-numbers:
      ASR 9902 Router, AC supplies:
        part: ASR-9902
    bays:
      pm-0: cisco/pwr-1p6kw-ac@1
      pm-1: cisco/pwr-1p6kw-ac@1
  dc:
    kind: orderable
    description: >-
      The DC build: two PWR-1.6KW-DC modules at -48 VDC, 1+1. Mixing AC and DC
      modules in one chassis is not supported, which is why this is a
      configuration of the whole chassis rather than a choice per bay. The
      chassis PID is ASR-9902 either way; the supplies are separate line items.
    part-numbers:
      ASR 9902 Router, DC supplies:
        part: ASR-9902
    bays:
      pm-0: cisco/pwr-1p6kw-dc@1
      pm-1: cisco/pwr-1p6kw-dc@1
