gaps:
- what: fan-bay-labels-sit-on-the-tray-flange
  scope: [rear, fan-trays]
  reason: needs-drawing
  note: >-
    FT0, FT1 and FT2 are printed bottom-to-top on a narrow rail at the left of
    each tray, and the tray's own drawn plate starts on that rail rather than
    beside it - the captive screw sits on the same strip. This model draws each
    tray as a filled rectangle, so the three marks land under their bays and L21
    reports them. The marks are kept where the master puts them rather than moved
    somewhere they would render, because moving them would put ink where the
    device has none. It is the same defect cisco/asr-9903's fan labels carry and
    the same fix closes both.
  wanted: >-
    cisco/asr-9902-fan@1 drawn with its left flange cut away where the chassis
    prints the slot label, so the mark shows through.
  blocks: []
- what: two-chassis-one-body-outline
  scope: [front]
  reason: sources-disagree
  note: >-
    CISCO'S OWN STENCIL AND ITS OWN DATA SHEETS DISAGREE ABOUT HOW WIDE THIS
    CHASSIS IS RELATIVE TO ITS SIBLING. The ASR 9902 and ASR 9903 front masters
    draw their bodies 1568.93 and 1569.68 art units wide, the same outline to 0.2
    mm, while c78-744663 gives 439.74 mm for this chassis and c78-744035 gives
    443.86 mm for the 9903.
    THIS FILE TAKES THE 439.74 and the evidence for that choice is a ruler inside
    the artwork rather than a preference: at that scale the twenty SFP-class cage
    columns come out on a 14.253 mm pitch against SFF-8433's 14.25, while the
    same measurement on the ASR 9903 at its own stated width lands on 14.36,
    which is 0.8 percent over a standard that does not vary. So the 9902 is the
    chassis the outline fits.
    WHAT IT COSTS IF THE READING IS WRONG is about 0.9 percent on every x on this
    face and on the RP slot pitch, which would go from 209.58 to 211.44.
  wanted: >-
    a Cisco mechanical drawing of either chassis, or a tape measure across a real
    ASR 9902 and a real ASR 9903 - two numbers that would settle both models at
    once. Tracked in roc-ops/Portrayal#374.
  blocks: []
- what: four-faces-carry-no-documented-feature
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    THE TOP, BOTTOM AND TWO SIDES ARE SIZED AND NOT DRAWN, and each carries an
    `empty:` sentence saying where the search ran. What they have in common is
    that no source in the intake ELEVATES them. The Visio stencil's 119 masters
    are front and rear elevations and hold no plan or side view at all. The
    install guide's figures for this chassis are two elevations, a top-view
    FOOTPRINT (Figure 18, which dimensions the outline and draws no feature), an
    airflow path, eight rack-mounting sequences across 19-inch and 23-inch,
    2-post and 4-post racks, a stacking figure and an air-filter view - the
    mounting figures show the sides at an angle and dimension nothing on them.
    The data sheet gives the envelope.
    WHAT IS ACTUALLY THERE, from the photographs, is a cisco wordmark and a
    product label on the top, feet and bracket landings underneath, and a
    bracket rail on each side. None is positioned by anything, and drawing them
    by eye off a three-quarter render would put unmeasured furniture on four
    faces at once.
  wanted: >-
    a Cisco mechanical drawing of the ASR 9902, or orthographic photographs of
    the top and one side with something of known size in frame.
  blocks: []
- what: front-right-furniture-unidentified
  scope: [front]
  reason: vendor-silent
  note: >-
    The furniture strip at the right of the RP row carries a captive screw, a
    round dimple above it and a small dark circle between them, and the guide
    names none of the three. The same two unnamed features appear on the ASR
    9903 in the same place. They are the right shape for an ESD wrist-strap jack
    and a captive-screw well, and calling them so would be a guess with a
    citation attached, so they are left off the face.
  wanted: >-
    a callout in a Cisco figure, or a photograph of the front right corner close
    enough to read the two features.
  blocks: []
- what: per-port-lamp-colour-for-the-qsfp-dd-ports
  scope: [qsfp-dd, port-leds]
  reason: vendor-silent
  note: >-
    Ports 11 and 37 get the same four-state Port Status vocabulary as the other
    forty-six, out of Table 27, because Table 27 is written for a port and does
    not distinguish media. WHAT IS NOT SAID is whether a lamp beside a QSFP-DD
    running a 400G coherent module means anything different - the coherent optics
    section of the configuration guide describes transponder and muxponder modes
    and their alarms and never mentions the faceplate lamp. So the lamp says what
    Table 27 says it says, and nothing here claims it reports coherent state.
  wanted: >-
    a Cisco LED table written for the QSFP-DD ports on this chassis.
  blocks: []
