    term: Slot
    role: traffic
    index-origin: 0
    physical-context: NetworkingDevice
  fabric:
    term: Slot
    role: service
    index-origin: 0
    physical-context: NetworkingDevice
    attrs:
      redundancy: '6+1'
      redundancy-note: '6+1 - b-asr9k-overview-reference-guide, "Fabric Controller Card": "Cisco ASR 9906 and 9910: When two RSP cards and three FC cards are installed in the chassis, the switch fabric is 4+1 redundant. When two RSP cards and five FC cards are installed in the chassis, the switch fabric is 6+1 redundant." This cage has five FC bays, so 6+1 is the fully-populated figure, and it counts fabric planes across the RSP pair as well as the five FCs rather than the five bays alone. The same guide, "Fabric Switchover", adds the part the form drops: on the 9910 the RSP card makes up most of the fabric and the fabric is configured active/active, while the RSP pair is active/standby for control'
