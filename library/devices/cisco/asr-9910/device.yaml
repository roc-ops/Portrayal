gaps:
- what: power-module-openings
  scope: [front]
  reason: needs-drawing
  note: >-
    Two power shelves are drawn as single openings rather than three module openings each. Table 15
    establishes the count - "ASR 9910: Version 3 power system: Up to six AC power modules per
    system, three per tray" - and Figure 22 numbers them M0 to M3 for the DC system, which is four
    per tray, so the count itself DIFFERS BETWEEN AC AND DC on this chassis and neither figure nor
    table gives boundaries. The master draws both shelves populated, so a scan returns module
    detail rather than separators. The shelves' outer rectangles are measured and drawn.
  wanted: a figure showing the power shelves empty, and a statement of the AC and DC module counts
    on one page
- what: blank-faces
  scope: [top, bottom, left, right]
  reason: vendor-silent
  note: >-
    All four side faces are sized from Table 13 and Figure 12 (the 9910's top-down AND side view,
    the only chassis in the family whose footprint figure includes a side elevation) and are
    deliberately EMPTY. Figure 12 dimensions the outline but shows no features on any side panel,
    and this chassis breathes front to rear so its sides carry nothing the guide names. Its air
    filter is underneath the card cage, which no view we model shows. The sizes are right, which
    is what these views carry for a rack elevation and the 3D box.
  wanted: a six-face photograph set, or the mechanical drawings behind Figure 12
