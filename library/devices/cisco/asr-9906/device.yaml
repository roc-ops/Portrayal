gaps:
- what: card-openings-are-cutouts-not-bays
  scope: [front]
  reason: needs-drawing
  note: >-
    The six card slots are CUTOUTS rather than bays, deliberately. A bay must name a component
    that fits it, and the only Cisco blank in the library - a9k-slot-cover, A9K-LC-FILR - carries
    size.w 44.39 against this chassis's measured 43.42 mm pitch, so six of them come to 266.3 mm
    in a 260.52 mm cage. Its plate measures 42.05 mm and WOULD fit, which is the heart of the
    problem: it is not established whether a card component's size.w is the faceplate or the slot
    pitch, and the answer decides every accepts list in this family. A9K-LC-FILR is also sourced
    from the Ethernet Line Card Installation Guide, a 9006/9010-era document, while this is an
    ASR 9900 chassis. The measurements are all here and converting cutouts to bays is mechanical.
  wanted: the ASR 9900 generation's line card and RP blank, or a statement of whether a card
    component's size is its faceplate or its slot pitch
- what: power-module-openings
  scope: [front]
  reason: needs-drawing
  note: >-
    The vertical power shelf is drawn as one opening rather than three module openings. Figure 21
    and Table 15 both establish three modules stacked M0 at the bottom to M2 at the top, so the
    count and numbering are not in doubt; the boundaries are. The master draws this column
    POPULATED - each module rendered with its own fan wheel - so a scan returns grille detail
    rather than separators, the same obstacle the ASR 9904's horizontal shelf presents. The
    column's outer rectangle is measured and drawn.
  wanted: a figure showing the power shelf empty, or a dimensioned front elevation
- what: rear-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    The ASR 9906's rear carries the fabric card cage and we know a great deal ABOUT it and almost
    nothing about its geometry. There is no ASR-9906 Rear master in Cisco's stencil, and Figure 21
    shows only the front. The count is sourced but indirectly: Table 13 quotes the configured
    weight for a chassis "Configured with two fan trays, two RSPs, five fabric cards, and one PEM",
    so five, and the sibling ASR 9910's Figure 22 shows fabric slots numbered from 0. Nothing
    states their width, their height, or where the PEM sits. The rear is therefore sized and
    carries regions naming what is there, with no cutouts invented to fill it.
  wanted: an ASR 9906 rear elevation, or a rear photograph
- what: blank-faces
  scope: [top, bottom, left, right]
  reason: vendor-silent
  note: >-
    All four side faces are sized from Table 13 and Figure 11 (the 9906's top-down footprint) and
    are deliberately EMPTY. This chassis breathes front to rear, so unlike the ASR 9006 and 9904 -
    whose right sides carry an intake and an air filter - its sides have no stated features, and
    its air filter is underneath the card cage where no view we model shows it. The sizes are
    right, which is what these views carry for a rack elevation and the 3D box.
  wanted: a six-face photograph set, or the mechanical drawings behind Figure 11
