gaps:
- what: power-module-openings
  scope: [front]
  reason: needs-drawing
  note: >-
    The vertical power shelf is drawn as one opening rather than three module openings. Figure 21
    and Table 15 both establish three modules stacked M0 at the bottom to M2 at the top, so the
    count and numbering are not in doubt; the boundaries are. The master draws this column
