format: 1
kind: device
name: n9k-c9364d-gx2a
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: N9K-C9364D-GX2A
aliases:
- {name: Nexus 9364D-GX2A, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-GX2}
description: >-
  64x 400G QSFP-DD and 2x 10G SFP+ 2RU data-centre switch running NX-OS. The port side carries the QSFP-DD
  cages in sixteen columns of stacked pairs in an upper and a lower group, the stacked SFP+ pair, the
  console, an RJ-45 and an SFP management port, the USB port and the BCN, STS and ENV lamps. The other
  side carries four fan modules and two power supplies stacked at the right. Ports number 1-64 in pairs
  down each column, odd on the upper cage. Ships port-side intake only (burgundy modules).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco N9364D-GX2A
      NX-OS Mode Switch Hardware Installation Guide, 72 pages, First Published 2022-06-24, Last Modified
      2026-09-16: the Overview and its two flat figures (front art number 503684, rear 503685, both PDF
      page 8), appendix B specifications, appendix C LEDs, appendix D kits. PAGES ARE PDF PAGES with the
      printed page after them; THE PRINTED PAGE IS THE TABLE OF CONTENTS' NUMBER, and the converted set
      puts the dimension table on PDF page 60 against a printed 54, so PDF = printed + 6; no PDF renderer
      is installed on the host that did this work, so no PDF page was viewed and the text layer and the
      converted figures were read. NO DATA SHEET, PHOTOGRAPH, 3D MODEL OR STENCIL IS HELD for this model
      (the Nexus 9300-GX2 data sheet is on the intake's hand-off list and is not in the intake), and the
      NetBox devicetype-library is held as a path listing only: no file was read and nothing is taken
      from it. The figures are the guide's embedded bitmaps at about 2.85 pixels per mm and are low resolution;
      the 2-RU figure is flat and has callouts.
  stack-orientation:
    confidence: estimated
    note: >-
      Each column of each group is a stacked pair of QSFP-DD cages with a belly band between them, printed
      with a pair of numbers ("1~2"). The library's convention is the upper cage upright over the lower
      turned 180, as cisco/n9k-x9716d-gx@1 places its pairs; the figure is too coarse to show which way
      the contacts face, so the convention is taken.
  gate-1:
    confidence: measured
    note: >-
      The front figure's outline is 1261 px across (x 5 to 1266) and 249 px down (y 104 to 353): aspect
      5.06 against the guide's 17.41 x 3.45 in, 5.05, so 0.3% out, and it can be measured; 2.85 px per
      mm across and 2.84 down. THE FIGURE AGREES WITH 2 RU (one rack unit would be 10.1). The rear figure's
      outline is 1273 px across and 253 down, 5.03, 2.88 px per mm. The cage columns repeat at 67.6 px,
      23.72 mm, from 167 px to 1181 px, so the pitch is the figure's and not the registry's.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure, origin the left outline. The first cage opening starts at 56.8 mm and the
      sixteen columns step 23.72 mm; the last cage ends at 431.6 mm, 10.7 mm short of the right outline.
      The std/qsfp-dd@1 opening is 19.0 mm wide and the figure's reads about 19.9, so a column is the
      registry's cage centred on the figure's.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top outline. The upper group's stack runs 10.0 to 35.6 mm and the
      lower group's 50.2 to 76.5, so each stack is two 10 mm cages 15.8 mm apart (cisco/n9k-x9716d-gx@1
      uses 14.85). A perforated band between the groups runs 36.3 to 49.6 mm and a row of small squares
      along the bottom edge.
  port-order:
    confidence: estimated
    note: >-
      The figure prints a pair of numbers over each column of the upper group, "1~2", "3~4" to "31~32",
      and under each column of the lower group a pair that reads "33~34" to "63~64" at this resolution
      (the first of the lower group reads like "35~36" and the rest of the lower group is not sharper,
      so the lower pair numbers are the sequence and not a reading). The guide's overview lists 64 QSFP-DD
      ports and its Table 1 reads "Ports 1-64" and "Odd numbered ports" against "Even numbered ports",
      so the upper cage of a pair is odd. Port numbers are as printed; the NX-OS interface names are not
      in the guide. The two SFP+ ports are numbered 65 and 66: the figure prints a number under each and
      the figure does not resolve them.
  port-lamps:
    confidence: estimated
    note: >-
      Appendix C, Switch Chassis LEDs: "The port LEDs appear as triangles pointing up or down to the nearest
      port." Green is admin up, SFP present and link up; amber is admin down or SFP absent; off is up
      and present but no link. The figure draws four marks under each column of the LOWER group only:
      a boxed triangle at each end and two circles between them. The boxed triangles are drawn as the
      up and down lamps of the pair and the circles as marks. The upper group draws none.
  chassis-lamps:
    confidence: estimated
    note: >-
      Appendix C: "The BCN, STS, and ENV, LEDs are located on the left side of the front of the switch."
      The figure draws three lamps in a row with a vertical legend under each, at 18.4, 23.1 and 27.5
      mm across and 40.8 down. Above the management SFP cage the figure draws two small circles under
      printed text the resolution does not read; they are drawn as marks. The mark at the top left is
      the maker's logo; none is drawn. The model legend, NEXUS over N9K-C9364D-GX2A, is printed on the
      figure and is carried as text.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the rear is read off the rear figure (2.88 px per mm). Four fan modules at the
      left, "slots numbered from 1 (left) to 4 (right)", then two supplies stacked at the right, "slots
      numbered 1 (top) and 2 (bottom)", with a vertical MAC legend between the fans and the supplies.
      The figure shows AC supplies. The rear carries no port.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements: typical 1378 W and maximum 3000 W "(AC or DC)", 10,236.426
      BTU per hour. The figures are the switch's draw and not a supply rating; the guide names no configuration
      or ambient. The same page carries a note, "If you want to use optics that consume 5W or more power
      on all the 36 ports , you must install 1100W power supplies", that cannot be this 64-port switch's
      (it names 36 ports and a supply this guide does not list) and is not carried.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the value the
      93180YC-EX's stencil sample gave, carried across as the family colour.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's Overview and its Clearance Requirements give no ear position: its rack-mount procedure
      for the NXK-ACC-KIT2-2RU installs two inner rails on the chassis sides and two outer rails on the
      posts, and slides the chassis in "until the front panel is flush with the front of the rack". The
      Clearance table calls the front clearance width "equal to the width of the chassis with two rack-mount
      brackets that are attached to it", 19.0 in, and no figure dimensions a bracket. So `chassis.ears`
      is left out and the gap says so.
attrs:
  physical:
    weight-note: >-
      58 lb (26.3 kg) chassis. Fan module 1.35 lb (0.61 kg). Supply 3.6 lb (1.63 kg), the row for the
      3200 W and the 3000 W AC/HVDC supplies.
  power:
    power-typical-w: 1378
    power-max-w: 3000
    power-envelope: unstated
    heat-dissipation-btu-hr: 10236
    power-input-ac: 100 to 120 V or 200 to 240 V at 16 A max, 50/60 Hz (3200 W AC/HVDC)
    power-input-hvdc: 240 VDC at 14.5 max (3200 W AC/HVDC and DC/HVDC)
    power-input-dc: -40 to -72 VDC (3200 W DC/HVDC)
    power-supply-options: 3200W AC/HVDC or 3200W DC/HVDC (two); the weights row also names a 3000W AC/HVDC
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -40 to 70 C (-40 to 158 F)
    humidity: 8 to 80% operating, 5 to 95% non-operating
    altitude: 0 to 10,000 ft (3,048 m) operating; 6,562 ft (2000 m) for China
  features:
    optics-qsfp-dd: >-
      guide: "400-Gigabit QSFP-DD ports (64)". Table 1, 3200 W supplies, 40 C ambient limit: 12 W per
      port with 16 MACsec ports enabled; 20 W on 8 or 16 odd ports and 12 W on the rest with 8 or 0 MACsec
      ports
    optics-sfp-plus: 'guide: "10-Gigabit SFP+ ports (2)"'
    management-ports: 'front figure: one RJ-45 and one SFP management port, and a console port'
  management: {usb: 1 USB port}
  lifecycle: {eol: none-announced}
