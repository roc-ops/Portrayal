configurations:
  ac-3200w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-3200W-PI AC/HVDC supplies and four NXA-SFAN-160CFM2-PI fan modules: port-side intake
      airflow, burgundy latches
    default: true
    power:
    - ac
    - hvdc
    part-numbers:
      N9K-C9364D-GX2A: {part: N9K-C9364D-GX2A}
  dc-3200w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PDC-3200W-PI DC/HVDC supplies and four NXA-SFAN-160CFM2-PI fan modules: port-side intake
      airflow, burgundy latches
    power:
    - dc
    - hvdc
    part-numbers:
      N9K-C9364D-GX2A: {part: N9K-C9364D-GX2A}
    bays: {psu-1: cisco/nxa-pdc-3200w@1, psu-2: cisco/nxa-pdc-3200w@1}
