gaps:
- what: size-figures
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    The Switch Dimensions table (PDF p60, printed 54) gives the depth as 29.82 in (75.76 cm) and the width
    as 17.41 in (44.23 cm); the Clearance Requirements table (printed p10) gives the depth of the chassis
    as 29.78 in (75.65 cm) and the chassis width as 17.3 in (43.9 cm). The Dimensions table is carried,
    442.3 by 757.6 mm, because its row also carries the height and the RU; the 4 mm of depth and 3 mm
    of width are not explained by the guide.
  wanted: >-
    Which inclusion each figure has (whether 29.78 in is the chassis without a module handle).
- what: ears-not-dimensioned
  scope:
  - front
  reason: vendor-silent
  note: >-
    The guide names two rack kits, NXK-ACC-KIT2-2RU and N9K-C9300-RMK ("Installation Options with Rack-Mount
    Kits", printed p17), and gives the install procedure for NXK-ACC-KIT2-2RU only (printed p21); no ear
    position is drawn or dimensioned.
  wanted: >-
    The shipped ear position, if the chassis has ears, and what N9K-C9300-RMK holds. The guide's "Installing
    the Chassis in a Four-Post Rack" table lists "Rack-mount brackets (2)", "Rack-mount guides (2)", "Rack-mount
    guide rails (2)" and screws without naming the kit it belongs to.
- what: kit-contents-disagree
  scope:
  - front
  reason: sources-disagree
  note: >-
    Appendix D lists the NXK-ACC-KIT2-2RU as a slider bracket (2), slider rails (2) and twelve M4 screws,
    with a ground lug kit; the install procedure calls its parts inner rails and outer rails. cisco/nxk-acc-kit2-2ru@1
    is the procedure's wording and is referenced, not edited.
  wanted: Nothing further for this device.
- what: ac-3000w-supply-named-not-seated
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The weights row (PDF p60, printed 54) names a 3000-W AC/HVDC port-side intake supply (NXA-PAC-3000W-PI)
    and the power-specifications contents name a 3000-W AC supply (for PSU3KW-HVPI). The Overview's user-replaceable
    components list names the two 3200 W supplies only, and the Table 1 rows name the 3200 W supplies
    only. The 3000 W supply is not seated and no component is added; cisco/n9k-pac-3000w-b@1 is the Nexus
    9500's different part and is not used.
  wanted: Whether NXA-PAC-3000W-PI is orderable for this chassis, and its face.
- what: shipment-list-names-other-supplies
  scope:
  - rear
  reason: sources-disagree
  note: >-
    "Unpacking and Inspecting a New Switch" (printed p18) lists a 3000 W dual AC/DC supply (PSU3KW-HVPI),
    a 2000 W AC/DC supply (PSU-2KW-ACPI) and a 1400 W AC supply (PSU-1.4KW-ACPI) with red or blue tabs.
    They are not in the Overview and no other page names them; the text is read as left over from another
    switch's guide and is not carried.
  wanted: Nothing further.
- what: fan-part-number-printed-three-ways
  scope:
  - rear
  reason: sources-disagree
  note: >-
    The Overview prints NXA-SFAN-160CFM2-PI, the weights row NXA-FAN-160CFM2-PI, Table 1 "NXA-SF AN-160CFM2PI",
    and the label on the rear figure (art 503685) a label of the "NXA-FAN-160CFM2PI" form that the figure
    is too small to read letter by letter. The component is cisco/nxa-sfan-160cfm2@1, named by the Overview's
    and the Dimensions appendix's form.
  wanted: The printed label at full size, and whether NXA-FAN-160CFM2 is a second part.
- what: fan-and-supply-lamps-unnamed
  scope:
  - rear
  reason: vendor-silent
  note: >-
    Appendix C describes the fan status lamp and the power-supply lamps by state and not by position;
    the figure draws a ring on each fan and two circles with a small mark on each supply.
  wanted: Which circle is which, and what the small mark between them is.
- what: unnamed-marks-on-the-front
  scope:
  - front
  reason: vendor-silent
  note: >-
    The figure draws two small circles above the management SFP cage under printed text, two circles between
    the boxed triangles under each lower-group column, one lamp under the SFP+ pair, printed marks beside
    it and perforation fields. None is named by the guide's Switch Chassis LEDs table or its callout table;
    they are drawn as marks, and the SFP+ marks are not drawn.
  wanted: What those marks are, and the printed numerals under the SFP+ pair.
- what: upper-group-has-no-port-lamps
  scope:
  - front
  reason: vendor-silent
  note: >-
    Appendix C says every port has a lamp. The figure draws lamps under the lower group only and no lamp
    near the upper group's cages.
  wanted: Where the upper group's lamps are.
- what: other-supplies-have-no-picture
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A picture of the 3200 W DC/HVDC supply. The guide's figure shows AC supplies only ("AC power supplies
    shown"). Its face is the AC supply's with the inlet changed, and the guide's lug (a two-hole copper
    lug, #2 AWG) is not drawn.
- what: sizes-off-a-figure
  scope:
  - rear
  reason: needs-drawing
  wanted: A stated size for the supplies and the fan module. The guide gives neither.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A flat drawing of the lid, the underside and the two side walls. The guide's only picture of a side
    (PDF page 9, art 503686, "The figure shows the side of the chassis", with one callout, "Grounding
    pad") is a three-quarter view from the front left that shows a side wall, the lid with a rectangular
    cover plate and the grounding pad; it is perspective, so nothing on a wall can be measured from it,
    and no wall is drawn. The grounding pad is left out of the rear for the same reason.
- what: fan-redundancy-counting
  scope:
  - fans
  reason: vendor-silent
  note: >-
    "Replacing a Fan Module During Operations" (printed p37): "there must be three fan modules circulating
    air in the chassis at all times. The other fan module is redundant", and the Overview note says that
    if one fan fails the others go to 100%, and if two fail "the switch will issue a warning, and power
    down in 2 minutes".
  wanted: 'Nothing further: read as modules, three of four, so the group says 3+1.'
groups:
  qsfpdd-400g-1-32:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  qsfpdd-400g-33-64:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block at the left end of the port side: an RJ-45 console port, an RJ-45 and an SFP
      management port and a USB port. Three media, one purpose: reaching the switch when the data plane
      cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        installation guide, Overview: "Power supply modules (two-One for operations and one for redundancy
        [1+1])". Slot 1 is the top one and slot 2 the bottom one.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 3+1
      redundancy-note: >-
        installation guide: four fan modules, "slots numbered from 1 (left) to 4 (right)". The replacement
        section (printed p37) says three fan modules must be circulating air at all times and the fourth
        is redundant. If one fan fails the others go to 100%; if two fail the switch warns and powers
        down in 2 minutes (Overview note).
