format: 1
kind: device
name: asr-9001
version: 0.1.0
maturity: modelled
manufacturer: Cisco
model: ASR 9001
part-numbers:
  chassis: ASR-9001
description: >-
  Cisco ASR 9000 Series ASR 9001 Router - a 2 RU fixed-port aggregation services
  router with an integrated route processor, four fixed 10 GE SFP+ ports, two
  modular port adapter bays and 120 Gbps of fabric. Everything is on the front
  face: both MPA bays, both power supplies, the side-mounted fan tray and every
  port. The rear is a plain louvred panel.
portfolio:
  line: Service Provider
  family: Aggregation Services Router
  series: ASR 9000 Series
provenance:
  sources: 'the Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation
    Guide (b-asr9001-hardware-installation-guide.pdf, retitled from the ASR 9001
    HIG and now covering the 9001, 9901, 9902 and 9903); the Cisco ASR 9001 Router
    Data Sheet (c78-685687); and Cisco''s own Visio stencil Routers-Cisco_ASR_9000_11_15_13,
    masters asr-9001-front and asr-9001-rear'
  chassis: 'datasheet - the ASR 9001 data sheet''s Table 2: ''Height: 3.472 inches
    (88.2 mm), Width: 17.42 inches (442 mm), Depth: 18.5 inches (470 mm), Weight
    of chassis: 30.2032 lbs (13.7 kg)''. THREE SOURCES AGREE ON THE HEIGHT to 0.06
    percent - the data sheet''s 3.472 in, the install guide''s ''Cisco ASR 9901
    Router and Cisco ASR 9001 Router is 3.47 inches (8.8 cm)'', and the stencil
    master''s props.height_in of 0.3472 at 1:10. So the rounding-up trap in stencil-as-metrology.md
    does not bite this chassis: 2 RU is 3.5 in and the chassis is built 0.028 in
    under it. chassis.width is the 442 BODY, not the 19 in rack face the stencil
    box carries'
  stencil-calibration: 'the asr-9001-front master calibrates to 0.66 percent between
    its two axes - x on the 19.0 in rack face (0.18562 mm/px over 2600 px) and y
    on the data sheet''s 88.2 mm (0.18452 mm/px over 478 px). By stencil-as-metrology.md
    that is trustworthy but not pristine; the ASR 9904 managed 0.06 percent. CONFIRMED
    ON SOMETHING NEVER USED AS AN INPUT: with x calibrated on the rack face, the
    body''s left edge measures 21.0 mm, against 20.3 mm predicted by (482.6 - 442)
    / 2 from two data sheet numbers. That is the note''s third check and it passes'
  face-check: 'done BEFORE measuring, per the ASR 9910 lesson in stencil-as-metrology.md,
    where Cisco''s master filenames name the wrong faces. No swap here: asr-9001-front
    carries the MPA bays, the PSU openings, every port, the LED cluster, the fan
    module and the ''Cisco ASR-9001'' branding, and matches Figure 7 of the guide,
    ''Front Panel of the Cisco ASR 9001 Router''. asr-9001-rear is a plain louvred
    panel'
  mpa-openings: 'THESE TWO OPENINGS ARE BAYS PENDING A PART, not permanent holes,
    and the cutout is a placeholder for a bay. They are declared in panel.cutouts
    only because device.schema.json requires `accepts` on a bay with minItems 1,
    so a bay cannot exist with nothing legal to accept, and no MPA component or
    MPA blank is modelled yet. Every measurement needed for the conversion is already
    here - x 20.0 and 208.9, y 2.6, 163.0 x 35.6 each - so turning them into bays
    is mechanical the moment a part lands. asr9k-chassis hit the same wall tonight
    and solved it the same way'
  front-geometry: 'drawing-measured off the stencil master at the calibration
    above, expressed in body coordinates. The two MPA bays are one row at y 2.6
    to 38.2, BAY 0 at x 20.0 to 182.9 and BAY 1 at x 208.9 to 371.9, each 163.0
    wide and separated by a 26 mm divider that carries both captive screws and both
    BAY legends - which is what settles that the bays are SIDE BY SIDE and not stacked,
    since the two rotated legends sit at opposite ends of one divider. The PSU openings
    are at y 45.0 to 86.0, x 10.3 to 66.9 and 72.0 to 128.7, so 56.6 x 41.0 - against
    cisco/a9k-750w-ac''s 55.2 x 39.9, agreeing to 2.5 percent, which is the confirmation
    that the data sheet''s PSU PID is the part that fits'
  port-rows: 'drawing-measured - every stacked port pair sits on the SAME two
    rows, which is what makes the reading safe: the upper row at y 46.5 to 55.4
    and the lower at 62.6 to 71.4, a 16.1 mm pitch, reproduced independently at
    eight different x positions. The SFP cages measure a 15.3 mm belly-to-belly
    pitch against the 15.00 std/sfp-ganged carries from a measured TE part'
  sfp-plus-numbering: 'READ AT HIGH ZOOM, AND DO NOT ''FIX'' IT. The left cage
    is SFP+ 3 over SFP+ 1 and the right cage is SFP+ 2 over SFP+ 0, so numbering
    runs RIGHT TO LEFT along the bottom row and then right to left along the top:
    port 0 bottom-right, 1 bottom-left, 2 top-right, 3 top-left. This looks like
    a transcription error and is not one - it is what the stencil prints and what
    the guide''s Figure 13 shows. It is the same class of trap as the rotated crop
    that once reversed an entire supervisor card in this project: the obvious reading
    is wrong and looks right. If a future reader is tempted to renumber these left-to-right,
    the thing to do is re-read the artwork at 4x, not the manifest'
  rear: 'drawing - the rear is a plain louvred panel and that is the finding,
    not an omission. Horizontal vent slots across the full width, six screws and
    the two rack ears. No connectors and no modules: on this chassis the PSUs, the
    fan tray, both MPA bays and every port are on the FRONT'
  airflow: 'drawing - ''the fan tray on Cisco ASR 9001 Router is located along
    the right side of the router and circulates cool air from right-to-left through
    the router'', which is why the fan bay sits at the right end of the front face.
    The guide adds that ''Each power supply is also equipped with fans'''
  side-faces: 'no figure in either document shows the top, bottom or side faces
    of this chassis, so they are sized from the data sheet and carry only the integral
    rack flanges. Stated rather than left blank, as on the Casa chassis'
  din-connectors: 'THE 10MHz AND 1PPS PORTS ARE DECLARED AS PANEL CUTOUTS AND
    NOT COMPOSED, deliberately. Table 4 of the guide gives their connector as DIN
    1.0/2.3, and there is no std/ part for it - the registry has sma, smb, mcx and
    f-type. Substituting one of those would name a connector Cisco does not. The
    holes are measured (about 4 mm, centred at y 68.0) and a gap records what is
    missing'
  leds: 'drawing - eight discrete indicators, which matches the guide''s callout
    ''Eight discrete LED indicators'' on Figure 13. Grouped as the stencil draws
    them: RSP FAIL and LC FAIL in the left column, CRIT / MAJ / MIN in the middle,
    EUSB / ACO / SYNC on the right. Their POSITIONS are read off the master at a
    scale where the dots are a few pixels, so treat the grouping and the count as
    reliable and the millimetres as approximate'
  lifecycle: 'searched and not found, with a caveat worth stating. No end-of-sale
    or end-of-life announcement for the ASR 9001 CHASSIS appears in the material
    held; the one EOL bulletin in the intake covers the ASR 9000 Series 4th Generation
    Ethernet Line Card Family, announced 2024-03-15, which is a different product.
    A live check was not possible - cisco.com returns 403 to this machine, which
    is why the whole intake came from the Wayback Machine - so this records ''nothing
    found in what we hold'' rather than a confirmed absence'
