configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 2 bay bays are
      EMPTY; cooling, power-modules are populated. Enough to power on and reach the box,
      which is the question most people ask first and the one `default` used to answer
      with whatever the drawing happened to be populated with.
    bays:
      mpa-0: cisco/a9k-mpa-blank@1
      mpa-1: cisco/a9k-mpa-blank@1
  asr-9001:
    kind: model
    description: >-
      The full ASR 9001. 120 Gbps fabric, four fixed 10 GE SFP+ ports and both
      modular bays usable.
    part-numbers:
      ASR 9001 Router:
        part: ASR-9001
  asr-9001-s:
    kind: model
    description: >-
      The ASR 9001-S - THE SAME SHEET METAL, sold at half the capacity. 60 Gbps
      instead of 120, one usable modular bay (BAY 0) instead of two, and two
      usable fixed ports (SFP+ 0 and SFP+ 1) instead of four. BAY 1 and SFP+ 2
      and 3 are physically present and identical - the cages are the same cages -
      but disabled by default and dust-capped, and unlocked by applying the
      A9K-9001-120G-LIC upgrade licence, after which the router must be reloaded.
      NOTE WHAT THIS CONFIGURATION STILL CANNOT SAY - see the config-scoped-device-attrs
      gap. It cannot mark SFP+ 2 and 3 as disabled, and it cannot carry the
      60 Gbps figure, so both live in this sentence rather than in data.
    part-numbers:
      ASR 9001-S Router with 2 x 10 GE:
        part: ASR-9001-S
      Upgrade license for 120G Bandwidth:
        part: A9K-9001-120G-LIC
    component-attrs:
      sfp-plus-2: {enabled: 'no', enabled-by: A9K-9001-120G-LIC}
      sfp-plus-3: {enabled: 'no', enabled-by: A9K-9001-120G-LIC}
    bay-attrs:
      mpa-1: {enabled: 'no', enabled-by: A9K-9001-120G-LIC}
references:
  - {title: 'Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide (2021-07-30)', sha256: 8b539355306e5bd2cfd9293a07dfe3acc95cb6aa95435537225b667901ac9d13}
