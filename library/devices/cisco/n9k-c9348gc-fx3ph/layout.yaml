format: 1
kind: device
name: n9k-c9348gc-fx3ph
version: 1.0.0
maturity: modelled
manufacturer: Cisco
model: N9K-C9348GC-FX3PH
aliases:
- {name: Nexus 9348GC-FX3PH, kind: marketing}
portfolio: {line: Nexus 9000, family: Nexus 9300, series: Nexus 9300-FX3}
description: >-
  48x copper PoE/PoE+/PoE++ access (40 at 10M/100M/1G and 8 at 10M/100M), 4x 10/25G SFP28 and 2x
  40/100G QSFP28 uplink 1RU data-centre switch running NX-OS. The port side carries all
  fifty-four ports and the BCN, STS, ENV and P lamps. The other side carries the console, an RJ-45
  and an SFP management port, the USB port, three fan modules and two power supplies. Ports number
  1-54 and run DOWN each column, odd on the top row. Ships port-side intake (burgundy modules) or
  port-side exhaust (blue).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One guide, held as PDF and as converted text and figures; it is not committed. Cisco
      N9348GC-FX3PH NX-OS Mode Switch Hardware Installation Guide, 66 pages, First Published
      2023-08-18, Last Modified 2026-07-22 (the figures were read from the PDF pages themselves,
      rendered at 400 dpi, and the text from its text layer). Page numbers are PDF pages with the
      printed page after them. The Overview (PDF p7, printed 1) and its front and rear figures (PDF
      p8 and p9, printed 2 and 3; art numbers 504860 and 504861), appendix B (PDF p54, printed 48,
      and PDF p55, printed 49), appendix C (PDF p61, printed 55) and appendix D. THE FRONT
      FIGURE IS CLEAN FLAT LINE ART, a 1821 px bitmap, about 4 px per mm, with callouts. NO DATA
      SHEET, PHOTOGRAPH, 3D MODEL OR STENCIL IS HELD for this model, and the NetBox
      devicetype-library is held as a path listing only: no file was read, so nothing is taken from
      it.
  rear-figure:
    confidence: estimated
    note: >-
      THE REAR FIGURE IS THE 9348GC-FX3's. Art number 504861, PDF p9 (printed 3), the page whose
      text under the callout table says "The figure shows the Cisco N9348GC-FX3 switch." The
      embedded bitmap is pixel for pixel the one in the N9348GC-FX3 guide's rear figure (the same
      1820 x 412 image and mask, compared after extraction), so the two guides' drawings agree
      exactly. This guide holds no rear figure drawn for the PH: the callout list is the PH's (3
      power supply modules, 1 or 2) and the figure is the sibling's. The rear is drawn from the
      figure, as a reading of this guide, and the gap says what is not shown.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's convention: the upper cage upright over the lower turned 180, and the upper
      jack turned 180 over the lower one. The front figure draws the upper jacks with their latch
      notch up and the lower jacks with the notch down, which is that arrangement.
  gate-1:
    confidence: measured
    note: >-
      The front figure's body, between its outermost end lines on the 400 dpi render of PDF p8, is
      2344 px across and 235 px down: aspect 9.97 against the guide's 17.3 x 1.72 in, 10.06, so
      0.9% out, and it can be measured; 5.33 px per mm across from 439.4 mm and 5.38 down from
      43.7. A repeated feature checks the scale: the jack columns step 74.5 px, 13.97 mm, against
      the registry's 13.97, so every pitch is the registry's and the figure fixes where each group
      starts. The rear figure's body is 2344 px across and 234 down, 10.02, 5.33 px per mm. The
      origin is the outermost end line on the left (the body outline is drawn double, 1.2 to 1.5 mm
      apart); the merged 9348GC-FX3 reads its positions from an inner line, so the same bitmap's
      left-end positions here are 1.2 mm further right.
  the-x-axis:
    confidence: estimated
    note: >-
      From the front figure, origin the left end line. FOUR boxed groups of six jack columns: the
      box lines start at 15.0, 105.0, 195.0 and 285.0 mm, a stride of 90.0, and the jacks stand 2.7
      mm inside each box, so the columns start at 17.55, 107.55, 197.55 and 287.55 mm (the figure's
      jack outline is 12.2 wide against the registry's 12.7, centred). At the registry's 13.97 mm
      pitch the stride is a gutter of 6.2 mm. The two SFP28 columns' boxes start at 376.1 and 390.9
      mm, a 14.65 mm step, and the QSFP28 pair at 409.9 mm.
  the-y-axis:
    confidence: estimated
    note: >-
      From the same figure, origin the top line. The upper jack's centre is at 15.25 mm and the
      lower jack's at 29.9, a 14.6 mm row pitch; with the registry's 11.0 high cell the upper jack
      runs 9.75 to 20.75 mm. The SFP28 boxes run 9.5 to 19.3 and 25.2 to 34.8 mm and the QSFP28
      boxes 9.2 to 19.2 and 25.6 to 35.2. THE PORT LAMPS ARE SMALL RECTANGLES BELOW THE JACKS, one
      under each port, about 4.1 by 2.8 mm in the figure, so common/led-rect@1 (4.6 x 2.6), two to a
      column, the left one for the upper port, at 38.3 mm; the numerals and a pair of arrows stand
      above them, the numerals' baseline at 37.65 mm.
  the-width:
    confidence: datasheet
    note: >-
      The guide's Switch Dimensions table (PDF p54, printed 48): "17.3 inches (43.9 cm)" wide,
      "1.72 inches (4.4 cm) (1 RU)" high, and for depth "Chassis without PSUs - 18.0 in (45.72 cm)",
      "With NXA-PAC-350W PSUs - 19.7 in (49.9 cm)", "With NXA-PHV-350W PSUs - 19.7 in (49.9 cm)",
      "With NXA-PDC-440W PSUs - 21.0 in (53.34 cm)" and "With NXA-PAC-1900W PSUs - 21.1 in (53.6
      cm)". The chassis depth carried is the first, 457.2 mm: the library's depth is the chassis,
      and the others include the modules. 439.4 mm and 43.7 mm are carried, the inch figures
      converted. The weights table on the same page gives this chassis "14.33 lb (6.49 kg)"; this is
      the PH's own row (the 9348GC-FX3's is 14.5 lb, 6.57 kg).
  port-order:
    confidence: estimated
    note: >-
      The figure prints a pair of numerals over each column of lamps with an up and a down triangle
      between them, "1 up down 2" to "47 up down 48", and "49 up down 50", "51 up down 52" and "53
      up down 54" under the SFP28 and QSFP28 cages, so the odd port is the upper jack or cage. The
      Overview (PDF p7) gives 40 10M/100M/1G and 8 10M/100M copper downlink ports that support
      PoE, PoE+ and PoE++, 4 SFP28 uplinks and 2 QSFP28 uplinks, and the callout table (PDF p8)
      gives "100M/1G RJ45 ports (40)" and "100M RJ45 ports (8)". The Overview note says "Ports
      41-48 support 10M/100M half-duplex only", and the figure marks ports 41 to 48 with a shaded
      band above their jacks and a shaded strip behind their numerals, so the first 40 are ports 1
      to 40. Port numbers are as printed; the NX-OS interface names are not in the guide.
  port-rates:
    confidence: datasheet
    note: >-
      Ports 1-40 take the group's rate, 1g (10M/100M/1G). Ports 41-48 state `speed: 100m` and a
      `rate-note` of their own: the guide says they support 10M/100M half-duplex only. The DCIM
      export types them 100base-tx.
  port-lamps:
    confidence: datasheet
    note: >-
      Appendix C, Switch Chassis LEDs (PDF p61, printed 55): "The port LEDs appear as triangles
      pointing up or down to the nearest port." Green is admin up, module present and link up;
      amber is admin down or module absent; off is up and present but no link. The figure draws
      the SFP28 triangles large, between the two cage rows, and the QSFP28 triangles at the ends of
      a band with eight small windows between them; the windows are drawn as marks and carry no
      state. The copper triangles are the printed arrows beside the numerals; the copper lamps are
      the rectangles under the jacks.
  chassis-lamps:
    confidence: estimated
    note: >-
      Callout 1 is "LEDs". The figure draws a boxed panel at the left end with four ring lamps in a
      column, legends BCN, STS, ENV and P to their left, at 10.6 mm across and 11.7, 15.6, 19.6 and
      23.5 mm down. The P lamp is read as the PoE lamp: Appendix C (PDF p62, printed 56) lists a
      "PoE" row, green "PoE mode is operational", amber "Any fault, or power that is denied on PoE
      ports because providing power exceeds the switch power capacity" and off "PoE is disabled",
      under a heading that reads "Fan Module LEDs" because the table runs over a page, and the
      sentence naming the lamps ("The BCN, STS, and ENV, LEDs") does not name P. The figure's
      legend and the table's row are the evidence for the reading. The same table has a "(GPS)"
      row that no figure here draws. Under the panel the figure draws a block of nine small rings
      in three rows and a mark; the guide does not name them and they are drawn as marks. The
      figure also draws a column of seven rings at the right end, beside the QSFP28 pair; they are
      drawn as marks and are in the gaps. The mark is the maker's logo; none is drawn, as the
      library's practice for a Cisco face is no logo artwork. The model legend under the uplinks,
      CISCO NEXUS N9K-C9348GC-FX3PH, is printed on the figure and is carried as text.
  shaded-ports:
    confidence: estimated
    note: >-
      The figure draws ports 41 to 48 (callout 5) shaded: a dark band above the upper jacks of the
      last four columns, 53.8 mm long, and a strip behind their numerals. They are decor, on the
      panel, in a mid grey that keeps the dark numerals readable on both stages. The guide's text
      gives the reason only as the half-duplex note.
  rear-face:
    confidence: estimated
    note: >-
      Every x and y on the module side is read off the rear figure (5.33 px per mm across, 5.36
      down, origin the outermost end line). The console jack over the RJ-45 management jack, the
      USB port stood on end, the SFP management port, two lamps labelled BCN and STS, a grounding
      symbol with two screws, three fan modules, then supply 1 and supply 2. THE OUT-OF-BAND BLOCK
      IS AT THE LEFT END, as on the 93180YC-EX. The figure draws small airflow legends, F1 and F2
      with arrows, beside the first fan and P1 and P2 beside the supplies; they are not carried.
      The management SFP cage is the registry's plain one. The grounding pad is drawn as the plain
      earth symbol; the registry's ground symbol is the circled one, so the mark is drawn.
  power:
    confidence: datasheet
    note: >-
      Appendix B, Switch Power Input Requirements (PDF p55, printed 49, read from the page): typical
      238 W and maximum 251 W "(AC or DC)", 856.447 BTU per hour. The figures are the switch's draw
      and not a supply rating; the guide names no configuration or ambient. The Overview (PDF p8,
      printed 2) says "48 PoE++ (60W ports) - two 1900W power supplies needed", "21 PoE++ (60W
      ports) - one 1900W power supplies needed" and "Non-PoE - one or two 350W power supplies
      needed". No table prints a PoE budget, so none is carried.
  supply-1900w:
    confidence: datasheet
    note: >-
      THIS GUIDE CONTRADICTS cisco/nxa-pac-1900w@1 in two places, and the component is not
      edited. (1) The Overview (PDF p8, printed 2) and the weights table (PDF p54, printed 48) list
      both NXA-PAC-1900W-PI (port-side intake, burgundy) and NXA-PAC-1900W-PE (port-side exhaust,
      blue); the component says the FX3P guide "lists no port-side exhaust version". The exhaust
      build here is written with component-attrs (the airflow and the latch colour of the
      configuration), as the exhaust builds of the 350 W, PHV and 440 W supplies are. (2) The
      weights table gives ONE row for all eight supplies, "2.64 lb (1.2 kg)", where the FX3P
      guide's row for its 1900 W supply is 3.6 lb (1.63 kg) (the component's weight). The PH row
      is carried in this device's weight note only; no weight is put on the component.
  colour:
    confidence: estimated
    note: >-
      NO SOURCE FOR THE COLOUR. The guide's figures are uncoloured line art. #d0d2cf is the value
      the 93180YC-EX's stencil sample gave, carried across as a family colour.
  rack-ears:
    confidence: estimated
    note: >-
      The guide's NXK-ACC-KIT-1RU procedure says the holes used depend on the rack and on the
      clearance needed for interface cables, 3 inches minimum, and for module handles, 1 inch
      minimum, and its figure shows two ways to mount the brackets. None dimensions a position and
      none says which the box ships with, so the two positions are written without an `at`, named
      for what the text says they clear, and none is the default.
