configurations:
  ac-350w-port-side-intake:
    kind: base
    description: >-
      Dual NXA-PAC-350W-PI2 supplies and three NXA-SFAN-30CFM-PI fan modules: port-side intake airflow,
      burgundy latches
    default: true
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
  ac-350w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-350W-PE2 supplies and three NXA-SFAN-30CFM-PE fan modules: port-side exhaust airflow,
      blue latches. The guide's Overview gives the colours.
    airflow: back-to-front
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
    component-attrs:
      nxa-sfan-30cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-350w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  ac-1900w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PAC-1900W-PI supplies and three NXA-SFAN-30CFM-PI fan modules: port-side intake airflow,
      burgundy latches. The 1900 W supply is the one the PoE paragraph names.
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
    bays: {psu-1: cisco/nxa-pac-1900w@1, psu-2: cisco/nxa-pac-1900w@1}
  ac-1900w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PAC-1900W-PE supplies and three NXA-SFAN-30CFM-PE fan modules: port-side exhaust airflow,
      blue latches. This guide lists the exhaust 1900 W supply. The component's own guide lists none,
      so the build is an attribute override of it.
    airflow: back-to-front
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
    bays: {psu-1: cisco/nxa-pac-1900w@1, psu-2: cisco/nxa-pac-1900w@1}
    component-attrs:
      nxa-sfan-30cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-pac-1900w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  hvac-hvdc-350w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PHV-350W-PI HVAC/HVDC supplies and three NXA-SFAN-30CFM-PI fan modules: port-side intake
      airflow, burgundy latches
    power:
    - ac
    - hvdc
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
    bays: {psu-1: cisco/nxa-phv-350w@1, psu-2: cisco/nxa-phv-350w@1}
  hvac-hvdc-350w-port-side-exhaust:
    kind: orderable
    description: >-
      Dual NXA-PHV-350W-PE HVAC/HVDC supplies and three NXA-SFAN-30CFM-PE fan modules: port-side exhaust
      airflow, blue latches
    airflow: back-to-front
    power:
    - ac
    - hvdc
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
    bays: {psu-1: cisco/nxa-phv-350w@1, psu-2: cisco/nxa-phv-350w@1}
    component-attrs:
      nxa-sfan-30cfm: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
      nxa-phv-350w: {latch-finish: '#50a2cf', latch-edge: '#2c6f96', airflow: back-to-front}
  dc-440w-port-side-intake:
    kind: orderable
    description: >-
      Dual NXA-PDC-440W-PI DC supplies and three NXA-SFAN-30CFM-PI fan modules: port-side intake airflow,
      burgundy latches
    power: dc
    part-numbers:
      N9K-C9348GC-FX3PH: {part: N9K-C9348GC-FX3PH}
    bays: {psu-1: cisco/nxa-pdc-440w@1, psu-2: cisco/nxa-pdc-440w@1}
  dc-440w-port-side-exhaust:
    kind: orderable
    description: >-
