gaps:
- what: unnamed-rings
  scope:
  - front
  reason: vendor-silent
  note: >-
    The front figure draws a column of seven rings at the right end beside the QSFP28 pair and a block
    of nine rings under the lamp panel. Callout 1 is "LEDs" and the text names no others, and appendix
    C lists the BCN, STS, ENV and PoE lamps and the port lamps only. They are drawn as marks without a
    state.
  wanted: What the sixteen rings are, and whether they are lamps.
- what: rear-figure-is-the-sibling-9348gc-fx3
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's rear figure (art 504861, PDF p9) is the N9348GC-FX3's, by the guide's own sentence and
    by the identical bitmap. It shows AC supplies of the 350 W kind and no 1900 W supply, and nothing
    in it is specific to the PoE model.
  wanted: A rear drawing of the PH itself, and a picture of its 1900 W supply.
- what: default-configuration
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide states no default build among its eight supply and airflow combinations. The configuration
    `ac-350w-port-side-intake` is the base, as for the 9348GC-FX3, so that a plain chassis lists with
    the family's first supply; it is a choice, not a statement of the guide.
  wanted: Which combination Cisco ships by default.
- what: mixed-ac-dc-supplies
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's supply list allows "a mix of AC and DC power sources" but not a mix of airflow directions.
    A configuration seats one supply type in both bays, so a mixed build (for instance a 1900 W AC beside
    a 440 W DC) is not written as a configuration. The bays accept every listed supply, so a user can
    seat the mix by hand.
  wanted: Which mixed pairs Cisco supports, and for how long, if that is limited.
- what: poe-budget
  scope:
  - front
  reason: vendor-silent
  note: >-
    The Overview says how many 1900 W supplies 48 and 21 PoE++ (60 W) ports need and prints no PoE budget
    in watts, per supply or per chassis; none is carried.
  wanted: The PoE power budget of the chassis with one and with two of each supply.
- what: kit-named-without-contents
  scope:
  - front
  reason: vendor-silent
  note: >-
    The installation options (PDF p23, printed 17) also name the N3K-C3064-ACC-KIT, with no contents and
    no procedure. NXK-ACC-KIT-1RU (appendix D, PDF p65, printed 59) and NXK-ACC-KIT2-2RU (install procedure,
    PDF p29, printed 23) have procedures and are on main as cisco/nxk-acc-kit-1ru@1 and cisco/nxk-acc-kit2-2ru@1;
    the third is not modelled.
  wanted: The contents or procedure of the N3K-C3064-ACC-KIT.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The guide's overview shows the chassis
    only in the two flat views and calls out the grounding pad; no side wall is drawn and none can be
    measured.
- what: other-supplies-have-no-picture
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A picture of the 1900 W AC, the 350 W PHV and the 440 W DC supplies. The guide's figure shows AC supplies
    only ("AC power supplies shown"). Their faces are the 350 W AC supply's with the inlet changed.
- what: sizes-off-a-figure
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A stated size for the supplies and the fan module. The guide gives "Form factor RSP1" for the 350
    W AC and PHV supplies and nothing for the others or for the fan.
- what: management-sfp-bail
  scope:
  - rear
  reason: needs-drawing
  wanted: A cage skin with a bail. The library's SFP cage has one skin and none shows a bail.
- what: fan-redundancy
  scope:
  - fans
  reason: vendor-silent
  note: >-
    The Overview says the switch "will power down due to a fan-policy trigger if fewer than 2 fans are
    operational", and that with more than one rotor failed it "will issue a warning and power down in
    2 minute".
  wanted: >-
    Whether the first sentence counts fan modules or rotors. It is read as modules, two of three, so the
    group says 2+1.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  rj45-100m:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 100m, rate-note: 'guide: ports 41-48 support 10M/100M half-duplex only'}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band block at the left end: an RJ-45 console port, an RJ-45 and an SFP management port
      and a USB port. Three media, one purpose: reaching the switch when the data plane cannot.
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        installation guide: "Power supply modules (two-one for operations and one for redundancy [1+1])".
        Slot 1 is on the left and slot 2 on the right.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 2+1
      redundancy-note: >-
        Installation guide, Overview: three fan modules of two rotors each. The switch "will power down
        due to a fan-policy trigger if fewer than 2 fans are operational". It works with one rotor failed
        in any one module and, with more than one rotor failed, warns and powers down in two minutes.
