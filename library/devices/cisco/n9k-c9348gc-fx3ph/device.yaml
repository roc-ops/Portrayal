      14.33 lb (6.49 kg) chassis without fans or PSUs. Fan module 0.26 lb (0.12 kg). One row, 2.64 lb
      (1.2 kg), for all eight supplies including the 1900 W.
  power:
    power-typical-w: 238
    power-max-w: 251
    power-envelope: unstated
    heat-dissipation-btu-hr: 856
    power-input-ac: '350 W: 100 to 120 V or 200 to 240 V. 1900 W: 115 to 120 V or 200 to 240 V. 50 to
      60 Hz'
    power-input-hvac: 100 to 277 V (350 W PHV)
    power-input-dc: -48 to -60 V nominal (440 W)
    power-input-hvdc: 240 to 380 V (350 W PHV)
    power-supply-options: 350W AC, 1900W AC, 350W PHV or 440W DC (two)
    poe-power-supplies: >-
      guide: "48 PoE++ (60W ports) - two 1900W power supplies needed"; "21 PoE++ (60W ports) - one 1900W
      power supplies needed"; "Non-PoE - one or two 350W power supplies needed"
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: '5
      to 90% operating, 5 to 95% non-operating', altitude: '13,123 ft (4000 m) operating'}
  features:
    ports-t: >-
      guide: "40 10M/100M/1G copper RJ45 downlink ports that support PoE/PoE+/PoE++ and 8 10M/100M copper
      RJ45 downlink ports that support PoE/PoE+/PoE++"; "Ports 41-48 support 10M/100M half-duplex only"
    optics-sfp28: 'guide: "4 10-/25G SFP28 uplink ports"'
    optics-qsfp28: 'guide: "2 40-/100G QSFP28 uplink ports"'
    management-ports: 'rear figure: one RJ-45 and one SFP management port, and a console port'
