format: 1
kind: device
name: 492ru-hfr
version: 1.0.0
maturity: modelled
manufacturer: Leviton
model: 492RU-HFR
description: >-
  2RU front-and-rear horizontal slotted duct, Leviton VERSI-DUCT 492RU-HFR: a PVC mounting
  plate on the rack rails with a 3 in by 3 in channel standing out of the front and a 2 in
  by 4 in channel out of the back, each with a wall of ten fingers along its top and another
  along its bottom, nine slots in each a cable is laid in through, and a snap-on cover across
  the finger tips that ships fitted and is pushed down and rotated off. A sloped section
  joins the plate to the rear channel and carries four oval pass-through holes in its top
  and four in its bottom.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The ears are the flat
      ends of the mounting plate: the top view of the 492RU-HFR dimensional drawing dimensions
      3.3247 in [84.45mm] from the front of the cover to the back of the plate, and the front
      channel stands in front of it, the rear channel and the sloped section behind it, 170.2
      mm of the 254.63. `at` is 84.45, so the part spans the rail. This states a placement; no
      dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the front channel stands 84.45 mm in front of the plane of the ears and
      the rear channel and its sloped section 170.2 behind it (the top view, 254.63 overall),
      so it serves the face it is bolted to and the space just behind the rails; at 170 mm it
      does not reach the rear rails of a rack, and the rear face of its rack units stays free
      for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DIMENSIONAL DRAWING. Leviton publishes the 492RU-HFR drawing as
      DXF and DWG on its product page; the DXF is vector CAD in inches with five views
      (front, rear and side elevations, the top and bottom, and an isometric), with the
      dimensions 19.0054 in, 17.5 in, 3.475 in, 3.3247 in, 6.7003 in and 2.3865 in. The assembly
      in the drawing includes the covers ("w/ cover"). Every figure here is read from its line
      work at 25.4 mm to the inch: the side view's outline gives each channel's height
      (3.0 in over the front walls, 2.0 in over the rear's, the covers and finger tips 3.38 and 2.38
      in, which the specification sheet's page 2 labels), the top view the slots, the plate and the
      ovals. THE SPECIFICATION SHEET'S PAGE 2 DRAWS THE DUCT'S TOP VIEW WITH FOUR DIMENSIONS
      (4.23, 2.50, 3.29 and 10.03 in) that this reads as the plan's rear section, sloped section and
      front section.
  chassis:
    confidence: drawing
    note: >-
      drawing - 444.5 x 88.3 x 254.6. The plate is 19.0054 in [482.74mm] wide over its ears and 3.475
      in [88.27mm] high; the body between its ears is the 444.5 from 19.15 to 463.65 on the top
      view (17.50 in on the specification sheet), which this library draws and not the ears.
      The 254.6 is the drawing's 10.025 in overall: 84.45 from the front to the ear plane, then
      the rear 170.2.
  thickness:
    confidence: drawing
    note: >-
      drawing - the walls of the fingers are 2.54 mm [0.1 in] on the side view (6.03 to 8.57 and
      79.69 to 82.23 for the front channel, 18.75 to 21.29 and 67.01 to 69.55 for the rear) and the
      plate 3.04, from its two faces 81.41 and 84.45 mm from the front.
  weight:
    confidence: estimated
    note: >-
      no document states a weight: the specification sheet, the product page and the
      instruction sheet are silent. `weight-kg` is left out and a gap says so.
  front:
    confidence: drawing
    note: >-
      drawing - the front channel with its cover fitted: 3.0 in [76.2mm] high over its walls and
      3.38 in [85.9mm] over the cover and finger tips, its two walls 6.04 mm in from the top and
      bottom of the plate. The channel's clear size is 2.75 in x 3.00 in [69.85 x 76.2mm],
      8.25 sq in, in Leviton's application note (page 15).
  rear:
    confidence: drawing
    note: >-
      drawing - the rear channel with its cover fitted: 2.0 in [50.8mm] high over its walls, centred
      on the plate, and 2.38 in [60.6mm] over the cover and finger tips; the back of the plate
      and the sloped section round it. The channel's clear size is 1.625 in x 3.75 in
      [41.3 x 95.25mm], 6.1 sq in, in the application note (page 7).
  top:
    confidence: drawing
    note: >-
      drawing - an elevation, rear at the top of the drawing: the rear cover over the rear 22.8 mm,
      the rear finger wall and its nine slots from 23.1 mm in to the base of the channel, the
      sloped section with its four oval holes (75.88 x 38.1 mm, 110.2 apart, centred 116.2
      mm from the front), the plate, then the front finger wall with the same nine slots and
      the front cover over the front 22.8 mm. The slots are 22.45 mm wide on a 49.375 pitch, the
      first from 32.65 to 55.10 on the drawing. The bottom is the same from underneath.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the drawing's side view: the front channel and its cover, the plate,
      the sloped section narrowing from the plate's 88.3 to the rear channel's 50.8 (the
      drawing's outline runs from 0 to 88.3 at the plate to 21.1 to 67.1 at the narrow end) and
      the rear channel and its cover. The slope is drawn in four steps. The right is the same,
      turned round.
  passes:
    confidence: drawing
    note: >-
      drawing - the four oval holes in the top of the sloped section and the four in its bottom, as
      the drawing draws them in its top and bottom views: 75.88 x 38.1 mm, through the sloped
      section into the hollow between the plate and the rear channel. The first stands 18.96 mm
      from the left end of the duct and the rest 110.2 apart, the panels of the sloped section
      between 114.65 and 335.1. A cable laid over the duct can be put through one into the hollow
      and out of the opposite hole to the other side. Open: no document says the holes are
      closed.
  guides:
    confidence: drawing
    note: >-
      drawing - each duct is the channel between its two finger walls, run across the rack;
      finger pitch (49.375) and slot gap (22.45) are the top view figures above, and each size
      is the clear height Leviton's application note gives (69.85 mm in front, 41.3 behind).
  cover:
    confidence: datasheet
    note: >-
      datasheet - both covers ship fitted: the specification sheet lists the duct "with black
      covers" and calls them "snap-on duct cover"; the instruction sheet (Versi-Duct Slotted Duct
      System, horizontal slotted duct, step 2) says to fit the cover over the top of the duct
      fingers, push down and rotate it to the other side until it snaps into place. They are drawn
      fitted in `base` and absent in `cover-off`. A hinge for each (49265-HNG, "Duct Cover
      Hinge", at least two to a cover) is a separate accessory.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - Leviton's application note "Maximum Cable Fill Ratios in Cable Managers"
      (NS-AN-23-006-05-30-23, 5/30/2023). Front: page 15, "2RU Horizontal Cable Manager 8.25
      sq.in. (492RU-HFR, -HFO)" and, for the 6AS10 patch cord (0.240 in), 91 cords at 50 percent
      fill, 54 at 30 percent (the "recommended practical maximum" for patch cords in front
      managers), 45 at 25 percent. Rear: page 7, "Rear Channel of 2RU Front/Rear Horizontal Duct
      492RU-HFR 1.625 in x 3.75 in 6.1 sq.in." and page 8, for a 0.240 in cable, 33 at 25 percent
      and 47 at 35 percent (the practical maximum for cable in rear managers). The cords and
      cables are named by Leviton part number or outer diameter and not by category, so no
      `cable-capacity-media` is stated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material (PVC rated UL 94V-0), the standards (ANSI/TIA 568, cULus
      listed), the covers and the accessories are the specification sheet's.
  color:
    confidence: estimated
    note: >-
      estimated - the specification sheet sells the ducts "with black covers" and names no
      colour for the duct; every drawing is line work, so the whole is this library's render
      of black PVC. The product page states no colour.
attrs:
  physical:
    material: PVC rated UL 94V-0
    color: Black covers
  performance:
    cable-capacity: 54
    cable-capacity-basis: >-
      front channel: 6AS10 patch cords (0.240 in OD) at the 30 percent recommended practical
      maximum fill of its 8.25 sq in usable area (2.75 x 3.00 in); 91 at 50 percent and 45 at 25
      percent - Leviton application note NS-AN-23-006-05-30-23, page 15
    cable-capacity-rear: 47
    cable-capacity-rear-basis: >-
      rear channel: a 0.240 in cable at the 35 percent recommended practical maximum fill of its
      6.1 sq in usable area (1.625 x 3.75 in); 33 at 25 percent - Leviton application note
      NS-AN-23-006-05-30-23, pages 7 and 8
  features:
    standards: ANSI/TIA 568, cULus Listed
