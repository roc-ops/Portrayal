configurations:
  base:
    kind: base
    default: true
    description: 'The front-and-rear duct as Leviton ships 492RU-HFR, both covers fitted.'
  cover-off:
    kind: example
    description: >-
      The same duct with both snap-on covers taken off, the finger walls and their slots open to
      lay a cable in. The covers come with the duct, so this is an illustration and not a
      device type.
    views: {top: top-open, bottom: bottom-open, left: left-open, right: right-open}
  designer-cover:
    kind: example
    description: >-
      The same duct with the 2RU cover from the separately sold gray 49265-DC2 pack snapped on the
      front channel in place of the black cover. The rear channel keeps its black cover,
      because the pack's 1.5RU rear cover is not modelled. The cover is a second purchase, so this
      is an illustration and not a device type.
    views: {top: top-designer, bottom: bottom-designer, left: left-designer, right: right-designer}
