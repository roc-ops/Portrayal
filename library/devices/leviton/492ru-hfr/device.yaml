gaps:
  - what: weight
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the specification sheet, the product page and the instruction sheet state no weight.
    wanted: a shipping weight on the product page or the specification sheet
  - what: cover-hinge
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the covers are snap-on and ship without a hinge; the Duct Cover Hinge (49265-HNG) is a
      separate accessory, at least two to a cover, and no view draws it. The format has no
      hinge, so a cover is either on or off.
    wanted: a drawing of the hinge fitted
  - what: designer-cover-rear
    scope: [rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the specification sheet's page 2 says the 49265-DC2 part number "includes 2RU cover for front
      and 1.5RU cover for rear". It draws no 1.5RU cover and gives it no size, so the
      designer-cover configuration fits the 2RU cover on the front channel only and the rear
      channel keeps its black cover.
    wanted: a drawing of the 1.5RU rear cover, or its height and depth
  - what: designer-cover-section
    scope: [front, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the designer cover's section on the specification sheet's page 2 is a C-shaped profile whose
      plate is dished and whose lips end in barbs, with its depth dimensioned and no thickness. The
      cover is drawn with a flat plate and lips 2.0 mm thick, an estimate, and no barbs.
    wanted: a dimensioned section through a designer cover and a finger tip
  - what: bend-radius-router
    scope: [front, rear, top, bottom]
    reason: needs-drawing
    note: >-
      the specification sheet's page 2 draws a "Bend Radius Compliant Router (included with
      Horizontal Slotted Duct)", 3.74 in wide and 1.75 in and 1.45 in on its views, which
      snaps onto the fingers where cords enter and leave. The 492RU-HFR dimensional drawing
      does not include it, so it is not drawn.
    wanted: a drawing of the router on the fingers
  - what: cover-section
    scope: [front, rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the covers are drawn from the outline of the side view and the top view's front and rear
      22.8 mm; the thickness of their plates and lips is not dimensioned, and the lips' and the
      rear cover's are estimated.
    wanted: a section through a cover and a finger tip
  - what: slope-shape
    scope: [left, right]
    reason: needs-drawing
    note: >-
      the sloped section is a hollow of two sloped sheets and the ribs between its panels; the
      elevations draw it in four steps along the outline of the side view, and the ribs are not
      drawn.
    wanted: a section through the sloped section
