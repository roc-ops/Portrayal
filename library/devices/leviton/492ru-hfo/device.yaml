format: 1
kind: device
name: 492ru-hfo
version: 1.0.0
maturity: modelled
manufacturer: Leviton
model: 492RU-HFO
description: >-
  2RU front-only horizontal slotted duct, Leviton VERSI-DUCT 492RU-HFO: a PVC mounting plate on
  the rack rails with a 3 in by 3 in channel standing out of it, a wall of ten fingers along
  its top and another along its bottom, nine slots in each a patch cord is laid in
  through, and a snap-on cover across the finger tips that ships fitted and is pushed
  down and rotated off.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The ears are the
      flat ends of the mounting plate at the back of the duct: the top view of the 492RU-HFO
      dimensional drawing dimensions 3.325 in [84.46mm] from the front of the cover to the back
      of the plate, which is the whole depth, so `at` is 84.46 and nothing stands behind the
      rail. This states a placement; no dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the duct stands wholly in front of the rail, 84.46 mm, and the
      rear face of its rack units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DIMENSIONAL DRAWING. Leviton publishes the 492RU-HFO drawing as
      DXF and DWG on its product page; the DXF is vector CAD in inches, five views (front,
      top, bottom, side and isometric), with the dimensions 3.475 in, 3.325 in and 19.0054
      in. The assembly in the drawing includes the cover ("w/ cover"). Every figure here is
      read from its line work at 25.4 mm to the inch. The specification sheet (Versi-Duct
      Horizontal Cable Management System, revised June 2022) draws the 2RU duct's side view
      and top view with the cover on, and gives part numbers and sizes.
  chassis:
    confidence: drawing
    note: >-
      drawing - 444.5 x 88.3 x 84.46. The plate is 19.0054 in [482.74mm] wide over its ears, 3.475
      in [88.27mm] high, and its top and bottom edges fold back from 19.15 to 463.65 on the top
      view, so the flat ends outside the folds are the ears, which this library does not
      draw, and the body is the 444.5 (17.50 in on the specification sheet's top view).
  thickness:
    confidence: drawing
    note: >-
      drawing - the walls of the fingers are 2.54 mm [0.1 in] on the side view and the plate
      3.04, from its two faces 81.41 and 84.45 mm from the front on the 492RU-HFR's.
  weight:
    confidence: estimated
    note: >-
      no document states a weight: the specification sheet, the product page and the
      instruction sheet are silent. `weight-kg` is left out and a gap says so.
  front:
    confidence: drawing
    note: >-
      drawing - the front channel with its cover fitted: the side view's outline is 3.38 in
      [85.9mm] over the cover and the finger tips, 3.0 in [76.2mm] over the walls (6.03 to
      82.23). The two walls stand 6.04 mm in from the top and bottom of the plate; the
      channel's clear size is 2.75 in x 3.00 in [69.85 x 76.2mm], 8.25 sq in, in Leviton's
      application note. The cover is the 17.5 in [444.5mm] one the specification sheet
      names.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate, plain. The isometric shows it as one flat sheet with
      the ear slots at each end, which are not drawn.
  top:
    confidence: drawing
    note: >-
      drawing - an elevation, rear at the top of the drawing: the plate, then the finger wall with
      nine slots 22.45 wide on a 49.375 pitch, each running from the finger tips 24.15 mm
      from the front back to the plate, and the cover over the front 22.8 mm. The bottom is
      the same from underneath.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the drawing's side view: the plate, the two finger walls 6.04 mm
      in from its top and bottom edges, and the cover's plate and lips over their tips. The
      right is the same, turned round.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct is the channel between the two finger walls, run across the rack; its
      finger pitch (49.375) and slot gap (22.45) are the top view figures above, and its
      size the 69.85 mm of clear height Leviton's application note gives.
  cover:
    confidence: datasheet
    note: >-
      datasheet - the cover ships fitted: the specification sheet lists the duct "with black
      covers" and calls it a "snap-on duct cover"; the instruction sheet (Versi-Duct Slotted
      Duct System, horizontal slotted duct, step 2) says to "fit the cover over the top of
      duct fingers. Push down and rotate the cover to the other side until it snaps into
      place." It is drawn fitted in `base` and absent in `cover-off`. A hinge for it
      (49265-HNG, "Duct Cover Hinge") is a separate accessory.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - Leviton's application note "Maximum Cable Fill Ratios in Cable Managers"
      (NS-AN-23-006-05-30-23, 5/30/2023), page 15, "VERSI-DUCT Horizontal Cable Managers Front
      Channel Capacities": "2RU Horizontal Cable Manager 8.25 sq.in. (492RU-HFR, -HFO)" and, for
      the 6AS10 patch cord (0.240 in), 91 cords at 50 percent fill, 54 at 30 percent, 45 at 25
      percent. It states 30 percent as the "recommended practical maximum" for patch cords in
      front managers. It names the cord by Leviton part number and not by category, so no
      `cable-capacity-media` is stated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material (PVC rated UL 94V-0), the standards (ANSI/TIA 568, cULus
      listed), the covers and the accessories are the specification sheet's.
  color:
    confidence: estimated
    note: >-
      estimated - the specification sheet sells the ducts "with black covers" and names no
      colour for the duct; every drawing is line work, so the whole is this library's render
      of black PVC. The product page states no colour.
attrs:
  physical:
    material: PVC rated UL 94V-0
    color: Black covers
  performance:
    cable-capacity: 54
    cable-capacity-basis: >-
      6AS10 patch cords (0.240 in OD) at the 30 percent recommended practical maximum fill
      of the front channel's 8.25 sq in usable area (2.75 x 3.00 in); 91 at 50 percent and 45
      at 25 percent - Leviton application note NS-AN-23-006-05-30-23, page 15
  features:
    standards: ANSI/TIA 568, cULus Listed
chassis:
  width: 444.5
  height: 88.3
  depth: 84.46
  ru: 2
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 84.46, default: true}
  shell: sheet
  thickness: 2.54
  color: '#1b1d20'
gaps:
  - what: weight
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the specification sheet, the product page and the instruction sheet state no weight.
    wanted: a shipping weight on the product page or the specification sheet
  - what: cover-hinge
    scope: [front, top, left, right]
    reason: vendor-silent
    note: >-
      the cover is snap-on and ships without a hinge; the Duct Cover Hinge (49265-HNG) is a
      separate accessory, at least two to a cover, and no view draws it. The format has no
      hinge, so the cover is either on or off.
    wanted: a drawing of the hinge fitted
  - what: designer-cover-section
    scope: [front, top, left, right]
    reason: needs-drawing
    note: >-
      the designer cover's section on the specification sheet's page 2 is a C-shaped profile whose
      plate is dished and whose lips end in barbs, with its depth dimensioned and no thickness. The
      cover is drawn with a flat plate and lips 2.0 mm thick, an estimate, and no barbs.
    wanted: a dimensioned section through a designer cover and a finger tip
  - what: bend-radius-router
    scope: [front, top]
    reason: needs-drawing
    note: >-
      the specification sheet's page 2 draws a "Bend Radius Compliant Router (included with
      Horizontal Slotted Duct)", 3.74 in wide and 1.75 in and 1.45 in on its views, which
      snaps onto the fingers where cords enter and leave. The 492RU-HFO dimensional
      drawing does not include it, so it is not drawn.
    wanted: a drawing of the router on the fingers
  - what: cover-section
    scope: [front, top, left, right]
    reason: needs-drawing
    note: >-
      the cover is drawn from the outline of the side view and the top view's front 22.8 mm;
      the thickness of its plate and lips is not dimensioned, and the lips' is estimated.
    wanted: a section through the cover and a finger tip
