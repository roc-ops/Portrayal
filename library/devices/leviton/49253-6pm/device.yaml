configurations:
  base:
    kind: base
    default: true
    description: 'The cable manager as Leviton ships 49253-6PM, five rings and no cover.'
  with-cover:
    kind: example
    description: >-
      The same manager with the separately sold 49253-1CV metal cover hooked over its two
      outer rings. The cover is a second purchase, so this is an illustration and not a
      device type.
