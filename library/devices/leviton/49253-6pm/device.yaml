format: 1
kind: device
name: 49253-6pm
version: 0.1.1
maturity: modelled
manufacturer: Leviton
model: 49253-6PM
description: >-
  1RU five-ring horizontal cable manager with 6 in rings, Leviton 49253-6PM: a flat black
  16-gauge steel panel on the rack rails with five steel distribution rings welded to it,
  each a bar loop standing 6 in out of the panel with a slit in its front end that a
  patch cord is laid in through. A metal cover, 49253-1CV, is sold separately and hooks
  over the two outer rings.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The ears are
      the flat ends of the panel, so the ear plane is the panel, and its back face is the one
      that meets the rail: the top view of the 49253-6PM dimensional drawing dimensions the
      plate's front face 152.4 mm [6.00 in] behind the ring tips and the sheet 1.5 mm, so
      `at` is 153.9. Of the 165.1 depth, 11.2 stands behind the rail. This states a
      placement; no dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the rings stand 152.4 mm in front of the panel and its folded
      edges reach only 11.2 behind it (the side view), so the rear face of its rack unit
      stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DIMENSIONAL DRAWING. Leviton publishes the 49253-6PM
      drawing as DXF and DWG on its product page; the DXF is vector CAD in inches with five
      views, and its dimensions read 19.00 in, 1.72 in and 6.0 in. Every figure here is
      read from its line work at 25.4 mm to the inch and agrees with those dimensions and
      with the specification sheet's page 2 (482.6, 43.7, 152.4 and 165.1 mm). It is the
      49253-LPM with 50.8 mm more depth between the back leg and the front legs.
  chassis:
    confidence: drawing
    note: >-
      drawing - 444.5 x 43.7 x 165.1. The plate is flat over the whole 19.00 in [482.6mm] and
      its top and bottom edges fold back from 0.75 in [19.05mm] inside each end to 17.5 in
      [463.55mm], so the flat ends outside the folds are the ears, which this library does
      not draw, and the body is the 444.5. Overall depth is 6.50 in [165.1mm]: the rings 6.00
      in [152.4mm] from the face of the plate, the sheet 1.5 and the fold 11.2 behind it.
  thickness:
    confidence: drawing
    note: >-
      drawing - 1.5 mm, the plate's two faces 152.4 and 153.9 mm from the front in the top
      view; "16-gauge steel" on the specification sheet.
  weight:
    confidence: estimated
    note: >-
      no document states a weight: the specification sheet, the product page and the
      instruction sheet are silent. `weight-kg` is left out and a gap says so.
  front:
    confidence: drawing
    note: >-
      drawing - the front view: the plate between the folds and the five rings on it, at
      the other 49253 managers' positions (centred 26.1 mm from the left end of the 482.6
      and 107.6 apart), each 38.1 mm high and centred on the 43.7 plate (2.8 above and
      below). Leviton's mark, printed on the plate near the right ring, is not drawn: a
      vendor mark never is.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view: the back of the plate, plain, with ten round holes 4.58 mm
      across, two behind each ring's middle 14.2 mm apart, and the folded edges end-on.
  top:
    confidence: drawing
    note: >-
      drawing - an elevation, rear at the top of the drawing: the folded edge behind the
      plate and the five rings' top bars from above, with each bottom bar's last 12.7 mm
      showing beyond the top bar's end. The bottom is the same from underneath, where each
      ring's bottom bar runs its full length.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the drawing's side view: the folded edges behind the plate and
      the ring's profile in front of it. The right is the same, turned round.
  rings:
    confidence: drawing
    note: >-
      drawing - the side view of a ring and the front view of five: see the contract. The
      drawing carries no dimension for the inner leg's place, which its line work puts 12.7
      mm behind the front, as on the 4 in rings; the specification sheet's page 2 gives this
      part's 6.00 and 6.50 in only. The application note's usable depth of 5.25 in agrees
      with that place.
  guides:
    confidence: drawing
    note: >-
      drawing - the five rings are the guides: each a component with a `ring` guide
      (see its contract), cables passing along the panel through each in turn. The opening
      is 31.75 x 133.35 mm, 6.6 sq in, and Leviton's application note gives the ring's
      cross-section as 6.5 sq in.
  cover:
    confidence: drawing
    note: >-
      drawing - the 49253-1CV cover is a separate part sold separately (specification sheet:
      "Covers are available (sold separately)"), so the manager is drawn without it; the
      `with-cover` configuration fits it. The instruction sheet, step 3, says to align the
      cover's sides to the outside split rings and slide it down until fully seated.
      Nothing says the cover is hinged.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - Leviton's application note "Maximum Cable Fill Ratios in Cable Managers"
      (NS-AN-23-006-05-30-23, 5/30/2023), page 14: "Ring size: 6.5 sq.in. (49253-6PM)", and
      for the 6AS10 patch cord (0.240 in) 71 cords at 50 percent fill, 43 at 30 percent,
      35 at 25 percent. It states 30 percent as the "recommended practical maximum" for
      patch cords in front managers. The count is a ring's: each of the five has the same
      opening. It names the cord by Leviton part number and not by category, so no
      `cable-capacity-media` is stated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, the finish, the standards (c(UL)us, RoHS, EIA 310.E) and the
      four #12-24 screws supplied are the specification sheet's; "Color: Black" is the
      product page's.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black" and "black powder-coat finish". The drawing is line work
      and the product images were not used, so the shade is this library's render of black.
attrs:
  physical:
    material: 16-gauge steel, black powder coated
    color: Black
    mounting-hardware: Four #12-24 screws supplied
  performance:
    cable-capacity: 43
    cable-capacity-basis: >-
      6AS10 patch cords (0.240 in OD) at the 30 percent recommended practical maximum fill
      of one ring's 6.5 sq in usable area (1.25 x 5.25 in); 71 at 50 percent and 35 at 25
      percent - Leviton application note NS-AN-23-006-05-30-23, page 14. A ring's count
  features:
    standards: c(UL)us, RoHS, EIA 310.E
chassis:
  width: 444.5
  height: 43.7
  depth: 165.1
  ru: 1
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 153.9, default: true}
  shell: sheet
  thickness: 1.5
  color: '#1b1d20'
gaps:
  - what: weight
    scope: [front, rear, top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the specification sheet, the product page and the instruction sheet state no weight.
    wanted: a shipping weight on the product page or the specification sheet
  - what: ring-fixing
    scope: [rear]
    reason: vendor-silent
    note: >-
      the drawing's rear view shows ten round holes 4.58 mm across behind the rings and
      no document says what they are (the rings' tabs, rivets or open holes), so they are
      drawn as dark discs.
    wanted: a section of the panel through a ring's back leg
