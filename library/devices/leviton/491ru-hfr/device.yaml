format: 1
kind: device
name: 491ru-hfr
version: 1.0.0
maturity: modelled
manufacturer: Leviton
model: 491RU-HFR
description: >-
  1RU front-and-rear horizontal slotted duct, Leviton VERSI-DUCT 491RU-HFR: a PVC mounting
  plate on the rack rails with a 1.5 in by 3 in channel standing out of the front and a
  1.5 in by 4 in channel out of the back, each with a wall of ten fingers along its top and
  another along its bottom, nine slots in each a cable is laid in through, and a snap-on
  cover across the finger tips that ships fitted and is pushed down and rotated off. A
  section joins the plate to the rear channel and carries four oval pass-through holes in
  its top and four in its bottom.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The ears are the flat
      ends of the mounting plate: the top view of the 491RU-HFR dimensional drawing dimensions
      3.306 in [83.97mm] from the front of the cover to the back of the plate, and the front
      channel stands in front of it, the rear channel and the section joining it behind it, 171
      mm of the 254.95. `at` is 83.97, so the part spans the rail. This states a placement; no
      dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the front channel stands 83.97 mm in front of the plane of the ears and
      the rear channel 171 behind it (the top view, 254.95 overall), so it serves the face it is
      bolted to and the space just behind the rails; at 171 mm it does not reach the rear rails
      of a rack, and the rear face of its rack unit stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DIMENSIONAL DRAWING. Leviton publishes the 491RU-HFR drawing as
      DXF and DWG on its product page; the DXF is vector CAD in inches with five views, with the
      dimensions 18.9974 in, 17.5 in, 1.8865 in, 3.306 in and 6.7316 in. The assembly in the drawing
      includes the covers ("w/ cover"). Every figure here is read from its line work at 25.4 mm
      to the inch: the side view's outline gives each channel's height (1.5 in over both walls, the
      covers and finger tips 1.886 in), the top view the slots, the plate and the ovals. This
      drawing's top view is drawn with the rear at the bottom; the figures are turned to the
      front-first order of the 492RU-HFR, whose slots, ovals and covers it repeats. THE
      SPECIFICATION SHEET AND THE DRAWING AGREE on the channels' nominal sizes (1.5 x 3 in front,
      1.5 x 4 in rear), and the application note's usable sizes are smaller (1.125 x 2.75 in and
      1.125 x 3.75 in).
  chassis:
    confidence: drawing
    note: >-
      drawing - 444.5 x 47.9 x 254.95. The plate is 18.9974 in [482.53mm] wide over its ears and
      1.8865 in [47.9mm] high, which is 3.5 mm more than a rack unit; the body between its ears is
      the 444.5 from 18.85 to 463.35 on the top view (17.50 in on the specification sheet), which
      this library draws and not the ears. The 254.95 is the drawing's 10.038 in overall: 83.97
      from the front to the ear plane, then the rear 171.
  thickness:
    confidence: drawing
    note: >-
      drawing - the walls of the fingers are 2.54 mm [0.1 in] on the side view (4.91 to 7.45 and
      40.47 to 43.01 for both channels) and the plate 3.04.
  weight:
    confidence: estimated
    note: >-
      no document states a weight: the specification sheet, the product page and the
      instruction sheet are silent. `weight-kg` is left out and a gap says so.
  front:
    confidence: drawing
    note: >-
      drawing - the front channel with its cover fitted: 1.5 in [38.1mm] high over its walls
      (4.91 to 43.01), centred on the 47.9 plate, and 1.886 in [47.9mm] over the cover and finger
      tips. The channel's clear size is 1.125 in x 2.75 in [28.58 x 69.85mm], 3.1 sq in, in
      Leviton's application note (page 15).
  rear:
    confidence: drawing
    note: >-
      drawing - the rear channel with its cover fitted: 1.5 in [38.1mm] high over its walls,
      centred on the plate, and 1.886 in [47.9mm] over the cover and finger tips; the back of
      the plate and the section round it. The channel's clear size is 1.125 in x 3.75 in
      [28.58 x 95.25mm], 4.2 sq in, in the application note (page 7).
  top:
    confidence: drawing
    note: >-
      drawing - an elevation, rear at the top of the drawing: the rear cover over the rear 22.8 mm,
      the rear finger wall and its nine slots from 23.1 mm in to the base of the channel, the
      section with its four oval holes (75.88 x 38.15 mm, 110.2 apart), the plate, then the front
      finger wall with the same nine slots and the front cover over the front 22.8 mm. The slots
      are those of the 492RU-HFR, which this drawing draws at the same places. The bottom is the
      same from underneath.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the drawing's side view: the front channel and its cover, the plate,
      the section joining it to the rear channel (its two sloped sheets run 38.1 apart at the
      rear channel and 43.8 at the plate, drawn as flat strips) and the rear channel and its
      cover. The right is the same, turned round.
  passes:
    confidence: drawing
    note: >-
      drawing - the four oval holes in the top of the section and the four in its bottom, as the
      drawing draws them in its top and bottom views: 75.88 x 38.15 mm, through the section into
      the hollow between the plate and the rear channel. Their places are the 492RU-HFR's: the
      drawing's panel lines (22.85, 128.45, 133.0, 238.6, 243.15, 348.75, 353.3 and 458.9) repeat
      its own. A cable laid over the duct can be put through one into the hollow and out of the
      opposite hole to the other side. Open: no document says the holes are closed.
  guides:
    confidence: drawing
    note: >-
      drawing - each duct is the channel between its two finger walls, run across the rack;
      finger pitch (49.375) and slot gap (22.45) are the top view figures above, and each size
      is the clear height Leviton's application note gives (28.58 mm both).
  cover:
    confidence: datasheet
    note: >-
      datasheet - both covers ship fitted: the specification sheet lists the duct "with black
      covers" and calls them "snap-on duct cover"; the instruction sheet (Versi-Duct Slotted Duct
      System, horizontal slotted duct, step 2) says to fit the cover over the top of the duct
      fingers, push down and rotate it to the other side until it snaps into place. They are drawn
      fitted in `base` and absent in `cover-off`. A hinge for each (49265-HNG, "Duct Cover
      Hinge", at least two to a cover) is a separate accessory.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - Leviton's application note "Maximum Cable Fill Ratios in Cable Managers"
      (NS-AN-23-006-05-30-23, 5/30/2023). Front: page 15, "1RU Horizontal Cable Manager 3.1
      sq.in. (491RU-HFR, -HFO)" and, for the 6AS10 patch cord (0.240 in), 34 cords at 50 percent
      fill, 20 at 30 percent (the "recommended practical maximum" for patch cords in front
      managers), 17 at 25 percent. Rear: page 7, "Rear Channel of 1RU Front/Rear Horizontal Duct
      491RU-HFR 1.125 in x 3.75 in 4.2 sq.in." and page 8, for a 0.240 in cable, 23 at 25 percent
      and 32 at 35 percent (the practical maximum for cable in rear managers). The cords and
      cables are named by Leviton part number or outer diameter and not by category, so no
      `cable-capacity-media` is stated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material (PVC rated UL 94V-0), the standards (ANSI/TIA 568, cULus
      listed), the covers and the accessories are the specification sheet's.
  color:
    confidence: estimated
    note: >-
      estimated - the specification sheet sells the ducts "with black covers" and names no
      colour for the duct; every drawing is line work, so the whole is this library's render
      of black PVC. The product page states no colour.
attrs:
  physical:
    material: PVC rated UL 94V-0
    color: Black covers
  performance:
    cable-capacity: 20
    cable-capacity-basis: >-
      front channel: 6AS10 patch cords (0.240 in OD) at the 30 percent recommended practical
      maximum fill of its 3.1 sq in usable area (1.125 x 2.75 in); 34 at 50 percent and 17 at 25
      percent - Leviton application note NS-AN-23-006-05-30-23, page 15
    cable-capacity-rear: 32
    cable-capacity-rear-basis: >-
      rear channel: a 0.240 in cable at the 35 percent recommended practical maximum fill of its
      4.2 sq in usable area (1.125 x 3.75 in); 23 at 25 percent - Leviton application note
      NS-AN-23-006-05-30-23, pages 7 and 8
  features:
    standards: ANSI/TIA 568, cULus Listed
