configurations:
  base:
    kind: base
    default: true
    description: 'The front-and-rear duct as Leviton ships 491RU-HFR, both covers fitted.'
  cover-off:
    kind: example
    description: >-
      The same duct with both snap-on covers taken off, the finger walls and their slots open to
      lay a cable in. The covers come with the duct, so this is an illustration and not a
      device type.
    views: {top: top-open, bottom: bottom-open, left: left-open, right: right-open}
  designer-cover:
    kind: example
    description: >-
      The same duct with the separately sold gray 49265-DC1 designer covers snapped on in place of
      the black covers, one on each channel. The covers are a second purchase, so this is an
      illustration and not a device type.
    views: {top: top-designer, bottom: bottom-designer, left: left-designer, right: right-designer}
