gaps:
- what: input-polarity
  scope:
  - rear
  reason: vendor-silent
  note: 'each feed is two stud terminals, one BATT and one RTN, and no drawing or sentence held says which is the
    outer one: the input-lug figure of the guide (Fig. 2-7) carries no legend, and its rear photograph prints BATT
    and RTN beside the output rows only. Each side is one part, `input-a` and `input-b`, whose two terminals are
    `terminal-1` and `terminal-2` by position, not by polarity.'
  wanted: a rear photograph that resolves the input legends, or the panel itself.
- what: fuse-holder-face
  scope:
  - front
  reason: needs-drawing
  note: 'the TPA fuse holder, part 307492, is seated from three-quarter views only: its face is placed by eye and
    its size is borrowed from the breaker whose position it fits.'
  wanted: a face-on, dimensioned view of 307492.
- what: monitoring-card-draw
  scope:
  - front
  reason: vendor-silent
  note: the power drawn by the nrgSMART card is stated nowhere in the datasheet, the installation guide, the controller
    datasheet or the two controller configuration guides; searched for mA, watt, consumption and current draw. `power-max-w`
    is the alarm card alone.
  wanted: the controller and sensor card current at 12, 24 and 48 V.
- what: nrgnet-pitch
  scope:
  - rear
  reason: vendor-silent
  note: the two five-way nrgNET connectors are drawn at a 3.81 pitch, read off five ways in about 20 on Fig. 3-7;
    no document states the header or its pitch.
  wanted: the nrgNET header part number or pitch.
- what: temp-jack-type
  scope:
  - rear
  reason: vendor-silent
  note: the two nrgTEMP probe jacks are drawn from a photograph; no document held names the jack, and the probe
    ends in a phone-style plug of no stated size.
  wanted: the probe jack type and plug size.
- what: display-characters
  scope:
  - front
  reason: vendor-silent
  note: the controller datasheet prints the display as 2-line, Xx characters, with the count left blank. Forty is
    an estimate from one photograph.
  wanted: the display part or its character count.
- what: reset-button
  scope:
  - front
  reason: vendor-silent
  note: the face letters a RESET button and no document says what a press does; searched the guides and release
    notes for reset, press and factory.
  wanted: the reset procedure.
groups:
  breakers-a:
    term: Position
    role: traffic
    index-origin: 1
    description: side A breaker positions, numbered 1 to 8 left to right
  breakers-b:
    term: Position
    role: traffic
    index-origin: 1
    description: side B breaker positions; the panel prints POS 1 at the centre end and POS 8 at the right
  status:
    term: LED
    role: indicator
    index-origin: 1
  alarm-enable:
    term: Switch
    role: management
    index-origin: 1
    description: one eight-way DIP switch per side, a switch enabling the alarm for the breaker position of the
      same number; and the controller RESET button
  cover:
    term: Screw
    role: furniture
    index-origin: 1
  outputs-a:
    term: Output
    role: traffic
    index-origin: 1
  outputs-b:
    term: Output
    role: traffic
    index-origin: 1
  feeds:
    term: Input
    role: service
    index-origin: 1
    description: one feed per side, A and B, each a BATT and an RTN stud terminal; which terminal is which is a
      recorded gap
  alarms:
    term: Alarm
    role: management
    index-origin: 1
    description: 'the rear centre block: alarm relay headers, nrgNET IN and OUT, and two temperature probe jacks'
  grounding:
    term: Ground
    role: furniture
    index-origin: 1
  network:
    term: Port
    role: management
    index-origin: 1
    attrs:
      media: rj45
      speed: 100m
    description: 'the controller network jacks: LAN, which carries the web interface and SNMP, and MGMT, which the
      firmware does not enable'
