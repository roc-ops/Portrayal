  breakers-a:
    term: Position
    role: traffic
    index-origin: 1
    description: side A breaker positions, numbered 1 to 8 left to right
  breakers-b:
    term: Position
    role: traffic
    index-origin: 1
    description: side B breaker positions; the panel prints POS 1 at the centre end and POS 8 at the right
  status:
    term: LED
    role: indicator
    index-origin: 1
  alarm-enable:
    term: Switch
    role: management
    index-origin: 1
    description: one eight-way DIP switch per side, a switch enabling the alarm for the breaker position of the
      same number; and the controller RESET button
  cover:
    term: Screw
    role: furniture
    index-origin: 1
  outputs-a:
    term: Output
    role: traffic
    index-origin: 1
  outputs-b:
    term: Output
    role: traffic
    index-origin: 1
  feeds:
    term: Input
    role: service
    index-origin: 1
    description: one feed per side, A and B, each a BATTERY and a RETURN busbar landing; BATTERY is the outer one
  alarms:
    term: Alarm
    role: management
    index-origin: 1
    description: 'the rear centre block: alarm relay headers, nrgNET IN and OUT, and two temperature probe jacks'
  grounding:
    term: Ground
    role: furniture
    index-origin: 1
  network:
    term: Port
    role: management
    index-origin: 1
    attrs:
      media: rj45
      speed: 100m
    description: 'the controller network jacks: LAN, which carries the web interface and SNMP, and MGMT, which the
      firmware does not enable'
