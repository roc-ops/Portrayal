format: 1
kind: device
name: nrg300cb08-ctrl-c
version: 1.1.1
maturity: modelled
manufacturer: Amphenol Network Solutions
model: nrg300CB08-CTRL-C
description: '1RU dual-feed DC circuit breaker panel with an integrated nrgSMART controller: the 300CB08-C with
  a controller card that measures feed and per-circuit current and voltage, shows them on a front display, serves
  a web interface and SNMP on its LAN port, and collects up to 30 sensor panels over nrgNET. Horizontal busbar inputs
  that run straight back from the panel, and connectorized outputs - sixteen two-pole P40 receptacles in place of
  the screw terminal blocks. Two isolated sides, each fed at up to 325 A and each distributing to eight plug-in
  breaker positions of up to 60 A.'
profile: power
provenance:
  method:
    confidence: drawing
    note: THE MONITORED CTRL PANEL WITH THE CONNECTORIZED -C REAR. The front, top, bottom and sides are amphenol-ns/nrg300cb08-ctrl
      and take its readings; the rear outputs, inputs, depth and weight are amphenol-ns/300cb08-c, whose datasheet
      rows this version shares, and the rear centre block is the monitored one, read off Fig. 3-9 of the installation
      guide.
  chassis:
    confidence: drawing
    note: '431.8 wide and 43.9 high as the 300CB08. THE DEPTH MODELLED IS THE CHASSIS, 330.8, the figure the plain
      panel bottom view dimensions. The datasheet gives this version as 478 deep without its tie bar: the extra
      147 is the input busbars standing behind the chassis rear, and they are drawn as that, on the input parts.
      With the tie bar it is 559.'
  ears:
    confidence: drawing
    note: NOT DRAWN. The panel ships with separate 19 inch and 23 inch mounting brackets (PMTG19, PMTG23) that bolt
      to the sides; Fig. 3-1 dimensions them at 482.6 and 584.2 over the body.
  front:
    confidence: drawing
    note: 'The breaker cells and thumbscrews are the 300CB08. THE CENTRE PANEL IS THE CONTROLLER ONE, measured on
      Fig. 3-2, the embedded 1188 x 258 image on page 38, at the same 1.9685 px/mm: two RJ45 openings 14.7 wide
      either side of a display window 24.9 by 7.6, a small round button under the window, the two switch slots where
      the plain panel has them but 1.0 higher, five lamp holes 1.3 higher, and the card slot. What is printed comes
      from Fig. 2-14, which letters MGMT, an address above it, LAN, RESET, 1 and 8 at each slot, nrg over the centre
      lamp and the voltage at the lower left. That figure shows no maker name and no model on this face, and none
      is printed here. Legend positions are read off that figure by eye. THE ADDRESS ABOVE MGMT IS NOT DRAWN: the
      face prints the controller''s factory default management address, a private (RFC 1918) address, centred over
      the jack about 3.9 from the top edge, and the repository''s private-address gate keeps such addresses out
      of tracked files. Its place is left blank.'
  lamps:
    confidence: drawing
    note: 'Five lamps: A PWR, A ALM, nrg, B ALM, B PWR. PWR is green with its feed present and ALM red on an alarm,
      as on the plain panel. The nrg lamp is the controller: the controller guide says the Identify button blinks
      it; the installation guide gives off, red, green and flashing red for the older nrg300CB08 in terms of nrgNET
      power, which these panels do not take. Red, green and a blink are recorded and no more.'
  rear:
    confidence: drawing
    note: 'Fig. 3-8, the embedded 1399 x 199 image on page 40, at 2.849 px/mm, scaled on the body between its two
      edges (85 to 1315 px) taken as 431.8, which then reads 43.9 high. Sixteen P40 receptacles on a 13.41 pitch,
      as on the -SC. Each input is two horizontal busbar landings seen end-on, and the drawing prints what the stud
      versions do not: a large B at the left end and A at the right, and BATTERY and RETURN beside each assembly,
      BATTERY on the OUTER side of both. SIDE A IS THE MIRROR OF SIDE B: the narrow landing, 6.0 against 7.7, is
      the outer one on each (26.3 and 399.8 from the left), so the side A feed is the same part turned 180 degrees
      and its `landing-1` is BATTERY on both sides. THE CENTRE BLOCK IS THE MONITORED ONE: Fig. 3-9, the embedded
      1399 x 199 image 3 on page 40, is Fig. 3-8 with two five-way nrgNET connectors and two probe jacks under the
      alarm headers, as Fig. 3-7 draws them for the stud-and-screw version; amphenol-ns/nrg-rear-block@1 is placed
      where the passive panel has its alarm card.'
  breaker-ratings:
    confidence: datasheet
    note: ONE MODULE CARRIES ELEVEN RATINGS AS A FIELD. The datasheet sells breakers from 2 A to 60 A as eleven
      part numbers that differ in nothing but the figure printed on the handle, so they are one part with a `rating`
      field, set per position in a configuration. Each breaker ships with a touch guard seated on it, a separate
      part that a configuration can take off. The populated example is an invented load to show the field working;
      the vendor publishes no standard fill.
  ratings:
    confidence: datasheet
    note: 'The datasheet gives the maximum input load as 325A @ 45 C per panel. The installation guide prints the
      same row with its de-rating: 325A @45 C per panel (De-rated to 200A @70 C). That is the only temperature either
      document states for the panel, so it is what `operating-temp` carries: a ceiling with its two rating points,
      and no lower limit.'
  front-cover:
    confidence: drawing
    note: 'THE FRONT FACE IS A REMOVABLE COVER. The guide has a procedure for it (section 2.2.7): two thumbscrews
      release a bar that spans the front, with sixteen openings the breaker guards show through and the lamps, switch
      slots and card slot in its centre. It is drawn as the panel, not as a part, because the panel is never seen
      without it in service and the breakers, not the cover, are what a position holds. The slot under the lamps
      is the designation card holder the datasheet lists.'
  lifecycle:
    confidence: estimated
    note: searched 2026-10-05 for an end-of-life, end-of-sale or discontinuation notice for the 300CB08 and found
      none; the vendor product page lists it as current. The installation guide marks a different part, the original
      nrg300CB08, as EOL and replaced by the -SENS and -CTRL versions.
  rear-cover:
    confidence: datasheet
    note: NOT DRAWN. A clear polycarbonate cover closes the whole rear over the input and output terminals (datasheet,
      Primary Features; guide Fig. 2-20). It is transparent and everything behind it is what the rear view shows.
  envelope-faces:
    confidence: drawing
    note: 'Top, bottom, left and right are sized from the chassis. The bottom vent fields and its two ground bolts
      are placed from Fig. 3-12 at 1.336 px/mm, a coarse reading. The top is given the same two side fields the
      photographs show running the depth of the lid; their extent is estimated. The sides are placed from the side
      view, Fig. 3-4, at 1.717 px/mm: four bracket holes 29.1 apart starting 11.1 from the front, and a two-bolt
      ground landing 268.8 from the front. THE GROUND BOLTS ARE DRAWN ON THE STATED 5/8 INCH CENTRES, 15.9 apart,
      not the 18.3 the drawing measures, because the callout states the figure and the drawing is coarse. Each side
      carries one landing and the bottom a third; the guide says only one ground connection is required.'
  ground-stud-size:
    confidence: datasheet
    note: 'The installation guide is one document for every version of the panel and its grounding specification
      is not limited to a version, as its input rows are: three sets of 1/4-20 threaded holes on 5/8 inch centres,
      bolted with washers to 50 in-lb, for a dual-hole compression lug on #6 to #1 AWG wire. Its description says
      the ground terminals take either a dual-hole or a single-hole lug and that only one ground connection is required.
      That is the `stud-size` of all six ground placements, two on each side and two on the bottom.'
  monitoring:
    confidence: datasheet
    note: 'nrgSMART measures feed and per-circuit current, voltage and two probe temperatures. The controller and
      sensor electronics are powered from the A and B feeds, not from nrgNET (the nrgSMART integrated controller
      system configuration guide 151881). NO DOCUMENT HELD STATES WHAT THEY DRAW: the only power figure is the alarm
      card, 1.44 W at 48 V, which is what `power-max-w` carries here as it does on the plain panel. That figure
      is therefore low for this device by the draw of its monitoring card.'
  network:
    confidence: datasheet
    note: 'LAN IS 10/100: the controller configuration guide 152344 offers auto-negotiate and 100 or 10 Mbps, full
      or half duplex, and no gigabit; a later release note makes it auto-negotiate only. MGMT IS NOT ENABLED: the
      installation guide, the system guide and every release note to 5.2.6 say so, and no document gives its speed
      - it is recorded at the LAN speed as the same kind of jack, with `enabled: no`. Both jacks are turned 180:
      Fig. 3-2 draws their two lamp windows at the TOP of each opening. The address printed above it appears in
      no text. What the two lamps in each jack mean is not stated.'
  display:
    confidence: datasheet
    note: a two-line black and white OLED; see amphenol-ns/nrg-oled@1 for what it shows and for why its character
      count is an estimate. The RESET button under it is named on the face and described nowhere.
  tie-bar:
    confidence: datasheet
    note: NOT DRAWN. The panel ships with a rear tie bar for dressing the output cables (guide Fig. 2-2 and 2-25),
      and takes an optional four-post bracket kit, 307622. Cable management is not drawn; the datasheet depth with
      the bar fitted is recorded.
attrs:
  physical:
    weight-empty-kg: 6.62
    weight-configured-kg: 8.89
    weight-configured-scope: populated, 19.6 lb in the datasheet; unpopulated is 14.6 lb
    overall-mm: 431.8 x 44 x 478 without tie bar, 559 deep with the tie bar it ships with (17 x 1.75 x 18.8 in)
    mounting: 19 inch and 23 inch brackets included
  power:
    input-voltage: ±12 VDC, ±24 VDC and ±48 VDC nominal
    input-dc: 'dual feed; maximum input load 325 A at 45 C per panel, de-rated to 200 A at 70 C; input wire 2/0
      AWG to 350 MCM; output wire #14 to #6 AWG in P40 connectors'
    short-circuit-withstand-a: 5000
    output-breaker-max: 60 A single-pole; the UL rating holds to 48 A continuous per output
    input-interrupt-max: 125 percent of the panel rating
    power-max-w: 1.44
    power-max-scope: the alarm card alone at 48 V (30 mA); 0.48 W at 24 V and 0.22 W at 12 V. THE MONITORING CARD
      ALSO DRAWS FROM THE A AND B FEEDS, and no document held states how much (gap monitoring-card-draw), so this
      figure is a floor for the panel, not its total. Separately the guide gives a nominal power LOSS of less than
      45 W per side at 325 A and 48 V, which is heat in the conductors and not a draw.
  thermal:
    cooling: passive, perforated lid and base
  environmental:
    operating-temp: to 70 C - 325 A per panel at 45 C, de-rated to 200 A at 70 C; no lower limit is stated
  management:
    alarm-contacts: Form C relay per side, 2 A at 30 VDC and 0.6 A at 60 VDC, on wire-wrap terminals
  compliance:
    safety: UL Listed
    nebs: Level 3
  lifecycle:
    eol: none-announced
