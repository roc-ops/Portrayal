format: 1
kind: device
name: nrg300cb08-sens-sc
version: 2.0.1
maturity: modelled
manufacturer: Amphenol Network Solutions
model: nrg300CB08-SENS-SC
description: '1RU dual-feed DC circuit breaker panel with nrgSMART circuit monitoring, sensor version: the 300CB08-SC
  with a sensor card that measures feed and per-circuit current and voltage and reports over nrgNET to a controller
  panel or an external controller. Vertical dual-stud inputs, and connectorized outputs - sixteen two-pole P40 receptacles
  in place of the screw terminal blocks. Two isolated sides, each fed at up to 325 A and each distributing to eight
  plug-in breaker positions of up to 60 A.'
profile: power
provenance:
  method:
    confidence: drawing
    note: THE MONITORED SENS PANEL WITH THE CONNECTORIZED -SC REAR. The front, top, bottom and sides are amphenol-ns/nrg300cb08-sens
      and take its readings; the rear outputs, inputs, depth and weight are amphenol-ns/300cb08-sc, whose datasheet
      rows this version shares, and the rear centre block is the monitored one, read off Fig. 3-11 of the installation
      guide.
  chassis:
    confidence: drawing
    note: '431.8 wide, 43.9 high and 330.8 deep, as the 300CB08: the datasheet gives this version the same 13.0
      inch (331 mm) depth without a tie bar. With the optional tie bar, 307661, it is 420.'
  ears:
    confidence: drawing
    note: NOT DRAWN. The panel ships with separate 19 inch and 23 inch mounting brackets (PMTG19, PMTG23) that bolt
      to the sides; Fig. 3-1 dimensions them at 482.6 and 584.2 over the body.
  front:
    confidence: drawing
    note: 'Breaker cells, thumbscrews, lamp holes, switch slots and the designation card slot are measured on Fig.
      3-1. Sixteen cells 17.8 x 39.1 on a 19.81 pitch (39 px), the first at 14.2 and the ninth at 261.1, which mirror
      about the centre to a tenth. What is printed on the front comes from the front photograph in the same guide
      (Fig. 1-1) and its positions are fractions of the centre panel read off that photograph, which is taken from
      slightly above: the wording is as printed, the positions are approximate. The DC, alarm and electrostatic
      symbols are drawn as plain strokes in the places the photograph shows them; their exact artwork is not resolved
      at that size. The front prints in dark ink on the pale panel. THE MODEL LEGEND IS A JUDGEMENT: the photograph
      of a sensor panel in the guide (Fig. 1-3) shows the plain panel layout with a model name beginning nrg300CB08
      at the top right, cut off by the frame. nrg300CB08-SENS is printed here, WITHOUT the -SC suffix, as amphenol-ns/300cb08-sc
      keeps the plain 300CB08 legend; no photograph of this version shows whether its face adds the suffix. Fig.
      3-3, the sensor front view, draws a box at that place and a small square between the switch slots that no
      document names; they are taken to be the model and voltage legends.'
  lamps:
    confidence: drawing
    note: 'Five lamps on a 12.7 pitch: A PWR, A ALM, nrg, B ALM, B PWR (Fig. 2-11 names them, Fig. 3-3 draws the
      five holes). PWR is green with its feed present and ALM red on an alarm, as on the plain panel. The nrg lamp
      is the monitoring card: the guide gives off, red, green and flashing red for the older nrg300CB08 in terms
      of nrgNET power, and the controller guide says the Identify button blinks it. Whether the sensor version keeps
      the older meanings is not stated; red, green and a blink are recorded and no more.'
  rear:
    confidence: drawing
    note: 'Fig. 3-10, the embedded 1399 x 217 image on page 40, at 2.858 px/mm, scaled on the body between its two
      edges (82 to 1316 px) taken as 431.8, which then reads 43.7 high. Sixteen P40 receptacles on a 13.41 pitch,
      the first at 91.0 and the ninth at 236.9; their numerals are printed BELOW each bank, 8 to 1 left to right,
      with OUTPUTS, BATT and RTN lettered at the outer end. The stud inputs are where the plain panel has them.
      As seen from the rear the left bank is side B. THE CENTRE BLOCK IS THE MONITORED ONE: Fig. 3-11, the embedded
      1399 x 218 image 5 on page 40, is Fig. 3-10 with two five-way nrgNET connectors and two probe jacks under
      the alarm headers, as Fig. 3-7 draws them for the stud-and-screw version; amphenol-ns/nrg-rear-block@1 is
      placed where the passive panel has its alarm card.'
  breaker-ratings:
    confidence: datasheet
    note: ONE MODULE CARRIES ELEVEN RATINGS AS A FIELD. The datasheet sells breakers from 2 A to 60 A as eleven
      part numbers that differ in nothing but the figure printed on the handle, so they are one part with a `rating`
      field, set per position in a configuration. Each breaker ships with a touch guard seated on it, a separate
      part that a configuration can take off. The populated example is an invented load to show the field working;
      the vendor publishes no standard fill.
  ratings:
    confidence: datasheet
    note: 'The datasheet gives the maximum input load as 325A @ 45 C per panel. The installation guide prints the
      same row with its de-rating: 325A @45 C per panel (De-rated to 200A @70 C). That is the only temperature either
      document states for the panel, so it is what `operating-temp` carries: a ceiling with its two rating points,
      and no lower limit.'
  front-cover:
    confidence: drawing
    note: 'THE FRONT FACE IS A REMOVABLE COVER. The guide has a procedure for it (section 2.2.7): two thumbscrews
      release a bar that spans the front, with sixteen openings the breaker guards show through and the lamps, switch
      slots and card slot in its centre. It is drawn as the panel, not as a part, because the panel is never seen
      without it in service and the breakers, not the cover, are what a position holds. The slot under the lamps
      is the designation card holder the datasheet lists.'
  lifecycle:
    confidence: estimated
    note: searched 2026-10-05 for an end-of-life, end-of-sale or discontinuation notice for the 300CB08 and found
      none; the vendor product page lists it as current. The installation guide marks a different part, the original
      nrg300CB08, as EOL and replaced by the -SENS and -CTRL versions.
  rear-cover:
    confidence: datasheet
    note: NOT DRAWN. A clear polycarbonate cover closes the whole rear over the input and output terminals (datasheet,
      Primary Features; guide Fig. 2-20). It is transparent and everything behind it is what the rear view shows.
  envelope-faces:
    confidence: drawing
    note: 'Top, bottom, left and right are sized from the chassis. The bottom vent fields and its two ground bolts
      are placed from Fig. 3-12 at 1.336 px/mm, a coarse reading. The top is given the same two side fields the
      photographs show running the depth of the lid; their extent is estimated. The sides are placed from the side
      view, Fig. 3-4, at 1.717 px/mm: four bracket holes 29.1 apart starting 11.1 from the front, and a two-bolt
      ground landing 268.8 from the front. THE GROUND BOLTS ARE DRAWN ON THE STATED 5/8 INCH CENTRES, 15.875 apart (one pair, see ground-pairs),
      not the 18.3 the drawing measures, because the callout states the figure and the drawing is coarse. Each side
      carries one landing and the bottom a third; the guide says only one ground connection is required.'
  ground-pairs:
    confidence: datasheet
    note: >-
      EACH LANDING IS ONE PAIR, NOT TWO STUDS (#828, #830). The installation guide's three sets of
      1/4-20 threaded holes on 5/8 inch centres are each the landing of one dual-hole lug, so each
      is common/ground-stud-pair-5-8-1-4@1, two 1/4-20 pan-head screws at exactly 15.875, the
      pitch of the stud-pair-5-8 interface (formerly two common/ground-stud@1 placements 15.9
      apart). Each pair is placed at rotate 90, one screw above the other as the side view, Fig.
      3-4, and the bottom view, Fig. 3-12, draw the landings, centred where the two studs'
      midpoint was. A two-hole lug seated on a pair leaves its wire down the face (toward the
      front on the bottom view); each screw still takes a single-hole lug on its own, which the
      guide also allows. The earth mark beside each side landing is centred on its pair, 1.8 lower
      than it sat beside the two studs.
  ground-stud-size:
    confidence: datasheet
    note: 'The installation guide is one document for every version of the panel and its grounding specification
      is not limited to a version, as its input rows are: three sets of 1/4-20 threaded holes on 5/8 inch centres,
      bolted with washers to 50 in-lb, for a dual-hole compression lug on #6 to #1 AWG wire. Its description says
      the ground terminals take either a dual-hole or a single-hole lug and that only one ground connection is required.
      That is the `stud-size` of all three ground pairs, one on each side and one on the bottom.'
  monitoring:
    confidence: datasheet
    note: 'nrgSMART measures feed and per-circuit current, voltage and two probe temperatures. The controller and
      sensor electronics are powered from the A and B feeds, not from nrgNET (the nrgSMART integrated controller
      system configuration guide 151881). NO DOCUMENT HELD STATES WHAT THEY DRAW: the only power figure is the alarm
      card, 1.44 W at 48 V, which is what `power-max-w` carries here as it does on the plain panel. That figure
      is therefore low for this device by the draw of its monitoring card.'
  tie-bar:
    confidence: datasheet
    note: NOT DRAWN. An optional rear tie bar, 307661, dresses the output cables (guide Fig. 2-4 and 2-27). Cable
      management is not drawn.
attrs:
  physical:
    weight-empty-kg: 5.44
    weight-configured-kg: 7.71
    weight-configured-scope: populated, 17.0 lb in the datasheet; unpopulated is 12.0 lb
    overall-mm: 431.8 x 44 x 331 without tie bar, 420 deep with the optional tie bar (17 x 1.75 x 13.0 in)
    mounting: 19 inch and 23 inch brackets included
  power:
    input-voltage: ±12 VDC, ±24 VDC and ±48 VDC nominal
    input-dc: 'dual feed; maximum input load 325 A at 45 C per panel, de-rated to 200 A at 70 C; input wire 2/0
      AWG to 350 MCM; output wire #14 to #6 AWG in P40 connectors'
    short-circuit-withstand-a: 5000
    output-breaker-max: 60 A single-pole; the UL rating holds to 48 A continuous per output
    input-interrupt-max: 125 percent of the panel rating
    power-max-w: 1.44
    power-max-scope: the alarm card alone at 48 V (30 mA); 0.48 W at 24 V and 0.22 W at 12 V. THE MONITORING CARD
      ALSO DRAWS FROM THE A AND B FEEDS, and no document held states how much (gap monitoring-card-draw), so this
      figure is a floor for the panel, not its total. Separately the guide gives a nominal power LOSS of less than
      45 W per side at 325 A and 48 V, which is heat in the conductors and not a draw.
  thermal:
    cooling: passive, perforated lid and base
  environmental:
    operating-temp: to 70 C - 325 A per panel at 45 C, de-rated to 200 A at 70 C; no lower limit is stated
  management:
    alarm-contacts: Form C relay per side, 2 A at 30 VDC and 0.6 A at 60 VDC, on wire-wrap terminals
  compliance:
    safety: UL Listed
    nebs: Level 3
  lifecycle:
    eol: none-announced
