  status:
    term: LED
    role: indicator
    index-origin: 1
  alarm-enable:
    term: Switch
    role: management
    index-origin: 1
    description: one eight-way DIP switch per side; a switch enables the alarm for the breaker position of the same
      number
  cover:
    term: Screw
    role: furniture
    index-origin: 1
  outputs-a:
    term: Output
    role: traffic
    index-origin: 1
  outputs-b:
    term: Output
    role: traffic
    index-origin: 1
  feeds:
    term: Input
    role: service
    index-origin: 1
    description: one feed per side, A and B, each a BATT and an RTN stud terminal; which terminal is which is a
      recorded gap
  alarms:
    term: Alarm
    role: management
    index-origin: 1
    description: 'the rear centre block: alarm relay headers, nrgNET IN and OUT, and two temperature probe jacks'
  grounding:
    term: Ground
    role: furniture
    index-origin: 1
