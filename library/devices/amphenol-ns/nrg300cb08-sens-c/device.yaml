gaps:
- what: fuse-holder-face
  scope:
  - front
  reason: needs-drawing
  note: 'the TPA fuse holder, part 307492, is seated from three-quarter views only: its face is placed by eye and
    its size is borrowed from the breaker whose position it fits.'
  wanted: a face-on, dimensioned view of 307492.
- what: monitoring-card-draw
  scope:
  - front
  reason: vendor-silent
  note: the power drawn by the nrgSMART card is stated nowhere in the datasheet, the installation guide, the controller
    datasheet or the two controller configuration guides; searched for mA, watt, consumption and current draw. `power-max-w`
    is the alarm card alone.
  wanted: the controller and sensor card current at 12, 24 and 48 V.
- what: nrgnet-pitch
  scope:
  - rear
  reason: vendor-silent
  note: the two five-way nrgNET connectors are drawn at a 3.81 pitch, read off five ways in about 20 on Fig. 3-7;
    no document states the header or its pitch.
  wanted: the nrgNET header part number or pitch.
- what: temp-jack-type
  scope:
  - rear
  reason: vendor-silent
  note: the two nrgTEMP probe jacks are drawn from a photograph; no document held names the jack, and the probe
    ends in a phone-style plug of no stated size.
  wanted: the probe jack type and plug size.
- what: c-side-view
  scope:
  - left
  - right
  reason: needs-drawing
  note: 'the chassis is 367.0 deep, read off this version''s bottom view (#860), but its side view, Fig. 3-5, was
    not re-read: the four bracket holes are the stud panel''s placed from the front, and the two-bolt ground landing
    the stud panel''s placed from the rear, where the bottom view shows the side lug about 65 from the rear against
    the 62 the side view gives the stud panel.'
  wanted: the -C side view, Fig. 3-5, measured for the bracket holes and the ground landing.
