format: 1
kind: device
name: 300cb08
version: 1.0.0
maturity: modelled
manufacturer: Amphenol Network Solutions
model: 300CB08
description: >-
  1RU dual-feed DC circuit breaker panel. Two electrically isolated sides, A
  and B, each fed at up to 325 A and each distributing to eight plug-in
  breaker positions of up to 60 A. This is the plain 300CB08: vertical
  dual-stud inputs and screw terminal-block outputs at the rear, a passive
  alarm card, and no circuit monitoring. Universal ±12, ±24 and ±48 V DC.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FROM THE DIMENSIONED VIEWS IN SECTION 3 OF THE INSTALLATION GUIDE. The
      front is P_IG_300CB08 (installation guide 149722-2 A9) Fig. 3-1, the embedded 1189 x 257 image on page 38, and the
      rear is Fig. 3-6, the embedded 1576 x 243 image on page 39. Both are CAD
      elevations and both were checked before use: on the front the 19.00 and
      23.00 inch bracket dimensions and the 17.00 inch body all give 1.9685
      px/mm, and the body then reads 43.7 high against the 43.9 the side view
      dimensions. Each image is about 2 to 3 px/mm, so every position taken
      from them is good to roughly half a millimetre and no better.
  chassis:
    confidence: drawing
    note: >-
      431.8 wide is the 17.00 inch dimension on Fig. 3-1, between the bracket
      folds. 43.9 high is the 1.73 inch dimension on the side view; the
      datasheet rounds the same height to 1.75 inch (44 mm). 330.8 deep is the
      13.02 inch dimension on the bottom view, Fig. 3-12, front of the metal to
      the rear; the datasheet gives 13.0 inch (331 mm). The same view gives
      345.5 overall, the extra 14.7 being the front cover and breaker guards
      standing proud of the chassis front.
  ears:
    confidence: drawing
    note: >-
      NOT DRAWN. The panel ships with separate 19 inch and 23 inch mounting
      brackets (PMTG19, PMTG23) that bolt to the sides; Fig. 3-1 dimensions
      them at 482.6 and 584.2 over the body.
  front:
    confidence: drawing
    note: >-
      Breaker cells, thumbscrews, lamp holes, switch slots and the designation
      card slot are measured on Fig. 3-1. Sixteen cells 17.8 x 39.1 on a 19.81
      pitch (39 px), the first at 14.2 and the ninth at 261.1, which mirror
      about the centre to a tenth. What is printed on the front comes from the
      front photograph in the same guide (Fig. 1-1) and its positions are
      fractions of the centre panel read off that photograph, which is taken
      from slightly above: the wording is as printed, the positions are
      approximate. The DC, alarm and electrostatic symbols are drawn as plain
      strokes in the places the photograph shows them; their exact artwork is
      not resolved at that size. The front prints in dark ink on the pale
      panel.
  lamps:
    confidence: drawing
    note: >-
      Fig. 3-1 draws five lamp holes on a 12.7 pitch. Fig. 2-11 names them for
      the monitored panel as A PWR, A ALM, nrg, B ALM, B PWR, and section 1.4
      says the alarm card controls four indicator LEDs on the front. So the
      plain panel has four lamps in the outer four holes and the centre hole,
      the nrg position, is not lit. The guide gives the colours in its power-up
      steps (section 2.2.9): a PWR lamp is green when its feed is present, and
      an ALM lamp is red when a breaker on that side is off or tripped with its
      alarm switch enabled. The front photograph shows something in the
      centre hole too; what fills it is not established.
  rear:
    confidence: drawing
    note: >-
      Fig. 3-6 at 3.2006 px/mm, scaled on the symmetric extent of the drawing
      (98 to 1480 px) taken as the 431.8 body, which then reads 43.6 high. The
      right bracket of that drawing is cropped, so its 19 inch span could not
      be used as a second check the way the front one was. The outputs are
      printed 8 to 1 left to right on each bank. As seen from the rear the
      left bank is side B and the right bank is side A, because side A is on
      the left of the front.
  breaker-ratings:
    confidence: datasheet
    note: >-
      ONE MODULE CARRIES ELEVEN RATINGS AS A FIELD. The datasheet sells
      breakers from 2 A to 60 A as eleven part numbers that differ in nothing
      but the figure printed on the handle, so they are one part with a
      `rating` field, set per position in a configuration. Each breaker ships
      with a touch guard seated on it, a separate part that a configuration
      can take off. The populated
      example is an invented load to show the field working; the vendor
      publishes no standard fill.
  ratings:
    confidence: datasheet
    note: >-
      The datasheet gives the maximum input load as 325A @ 45 C per panel. The
      installation guide prints the same row with its de-rating: 325A @45 C per
      panel (De-rated to 200A @70 C). That is the only temperature either
      document states for the panel, so it is what `operating-temp` carries: a
      ceiling with its two rating points, and no lower limit.
  front-cover:
    confidence: drawing
    note: >-
      THE FRONT FACE IS A REMOVABLE COVER. The guide has a procedure for it
      (section 2.2.7): two thumbscrews release a bar that spans the front, with
      sixteen openings the breaker guards show through and the lamps, switch
      slots and card slot in its centre. It is drawn as the panel, not as a
      part, because the panel is never seen without it in service and the
      breakers, not the cover, are what a position holds. The slot under the
      lamps is the designation card holder the datasheet lists.
  lifecycle:
    confidence: estimated
    note: >-
      searched 2026-10-05 for an end-of-life, end-of-sale or discontinuation
      notice for the 300CB08 and found none; the vendor product page lists it
      as current. The installation guide marks a different part, the original
      nrg300CB08, as EOL and replaced by the -SENS and -CTRL versions.
  rear-cover:
    confidence: datasheet
    note: >-
      NOT DRAWN. A clear polycarbonate cover closes the whole rear over the
      input and output terminals (datasheet, Primary Features; guide Fig.
      2-20). It is transparent and everything behind it is what the rear view
      shows.
  envelope-faces:
    confidence: drawing
    note: >-
      Top, bottom, left and right are sized from the chassis. The bottom vent
      fields and its two ground bolts are placed from Fig. 3-12 at 1.336 px/mm,
      a coarse reading. The top is given the same two side fields the
      photographs show running the depth of the lid; their extent is estimated.
      The sides are placed from the side view, Fig. 3-4, at 1.717 px/mm: four
      bracket holes 29.1 apart starting 11.1 from the front, and a two-bolt
      ground landing 268.8 from the front. THE GROUND BOLTS ARE DRAWN ON THE
      STATED 5/8 INCH CENTRES, 15.9 apart, not the 18.3 the drawing measures,
      because the callout states the figure and the drawing is coarse. Each
      side carries one landing and the bottom a third; the guide says only one
      ground connection is required.
attrs:
  physical:
    weight-empty-kg: 5.44
    weight-configured-kg: 7.71
    weight-configured-scope: populated, 17.0 lb in the datasheet; unpopulated is 12.0 lb
    overall-mm: 431.8 x 44 x 331 without brackets (17 x 1.75 x 13.0 in)
    mounting: 19 inch and 23 inch brackets included
  power:
    input-voltage: ±12 VDC, ±24 VDC and ±48 VDC nominal
    input-dc: dual feed; maximum input load 325 A at 45 C per panel, de-rated to 200 A at 70 C; input wire 2/0 AWG to 350 MCM
    short-circuit-withstand-a: 5000
    output-breaker-max: 60 A single-pole; the UL rating holds to 48 A continuous per output
    input-interrupt-max: 125 percent of the panel rating
    power-max-w: 1.44
    power-max-scope: >-
      the alarm card alone at 48 V (30 mA); 0.48 W at 24 V and 0.22 W at 12 V.
      It is the only thing in the panel that draws. Separately the guide gives
      a nominal power LOSS of less than 45 W per side at 325 A and 48 V, which
      is heat in the conductors and not a draw.
  thermal:
    cooling: passive, perforated lid and base
  environmental:
    operating-temp: to 70 C - 325 A per panel at 45 C, de-rated to 200 A at 70 C; no lower limit is stated
  management:
    alarm-contacts: Form C relay per side, 2 A at 30 VDC and 0.6 A at 60 VDC, on wire-wrap terminals
  compliance:
    safety: UL Listed
    nebs: Level 3
  lifecycle:
    eol: none-announced
chassis: {width: 431.8, height: 43.9, depth: 330.8, ru: 1, color: '#e6e4de', airflow: passive, weight-kg: 5.44}
gaps:
- what: input-polarity
  scope: [rear]
  reason: vendor-silent
  note: >-
    each feed is two stud terminals, one BATT and one RTN, and no drawing or
    sentence held says which is the outer one: the input-lug figure of the
    guide (Fig. 2-7) carries no legend, and its rear photograph prints BATT and
    RTN beside the output rows only. Each side is one part, `input-a` and
    `input-b`, whose two terminals are `terminal-1` and `terminal-2` by
    position, not by polarity.
  wanted: a rear photograph that resolves the input legends, or the panel itself.
- what: fuse-holder-face
  scope: [front]
  reason: needs-drawing
  note: >-
    the TPA fuse holder, part 307492, is seated from three-quarter views only:
    its face is placed by eye and its size is borrowed from the breaker whose
    position it fits.
  wanted: a face-on, dimensioned view of 307492.
groups:
  breakers-a: {term: Position, role: traffic, index-origin: 1, description: 'side A breaker positions, numbered 1 to 8 left to right'}
  breakers-b: {term: Position, role: traffic, index-origin: 1, description: 'side B breaker positions; the panel prints POS 1 at the centre end and POS 8 at the right'}
  status: {term: LED, role: indicator, index-origin: 1}
  alarm-enable: {term: Switch, role: management, index-origin: 1, description: 'one eight-way DIP switch per side; a switch enables the alarm for the breaker position of the same number'}
  cover: {term: Screw, role: furniture, index-origin: 1}
  outputs-a: {term: Output, role: traffic, index-origin: 1}
  outputs-b: {term: Output, role: traffic, index-origin: 1}
  feeds: {term: Input, role: service, index-origin: 1, description: 'one feed per side, A and B, each a BATT and an RTN stud terminal; which terminal is which is a recorded gap'}
  alarms: {term: Alarm, role: management, index-origin: 1}
  grounding: {term: Ground, role: furniture, index-origin: 1}
