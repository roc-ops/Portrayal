format: 1
kind: device
name: nrgils300cb08
version: 2.0.1
maturity: modelled
manufacturer: Amphenol Network Solutions
model: nrgILS300CB08
description: '1RU dual-feed -48 V DC circuit breaker panel with nrgILS intelligent load shedding: the 300CB08 breaker
  layout with a controller that measures feed and per-circuit current and voltage and can switch each output circuit
  off and on through a solid-state switch, on a schedule, on a failed ping or by hand. Front display, web interface,
  REST API and SNMP over Ethernet; IN and OUT nrgNET jacks link it to further panels. Vertical dual-stud inputs
  and screw terminal-block outputs. Two isolated sides, each fed at up to 325 A and each distributing to eight plug-in
  breaker positions of up to 60 A.'
profile: power
provenance:
  method:
    confidence: drawing
    note: THE nrgILS IS THE CTRL FRONT ON A DEEPER CHASSIS WITH ITS OWN REAR CENTRE. the 300CB08/nrg300CB08/nrgILS300CB08
      installation guide 149722-2 A9 covers the nrgILS beside the 300CB08 and the nrg300CB08, and captions its controller
      front, Fig. 3-2, and its plain rear, Fig. 3-7, for the nrgILS too. the nrgILS300CB08 datasheet (08.10.26 v.5)
      photographs the front and agrees with Fig. 3-2 in every feature, so the front, its legends and its parts are
      amphenol-ns/nrg300cb08-ctrl's. Its rear photograph shows a centre block Fig. 3-7 does not draw, and the guide's
      own nrgILS bottom view, Fig. 3-12, is 42.4 deeper than the 300CB08's; both are modelled from those, and Fig.
      3-7 is not used for the centre block. the nrgILS controller configuration/user guide 155376 is a software
      guide and supplies only behaviour.
  chassis:
    confidence: drawing
    note: '431.8 wide and 43.9 high as the 300CB08. THE DEPTH IS 373.2, read off the nrgILS bottom view, Fig. 3-12
      (lower), which dimensions the panel 387.9 (15.27 inch) overall: the drawing is 1.19 px/mm on both axes (514
      px across the 431.8 body, 461 px down the 387.9), and less the 14.7 the front guards stand proud, as on the
      300CB08''s own drawing above it, the chassis is 373.2. The extra 42.4 is all in the bottom pan; the rear terminal
      band measures the same on both drawings. THE SPECIFICATION TABLES DISAGREE: the installation guide gives the
      nrgILS300CB08 13.6 inch (346), the same row as the 300CB08 (gap depth).'
  ears:
    confidence: drawing
    note: NOT DRAWN. The nrgILS datasheet gives 19 inch mounting brackets as included with the panel and 23 inch
      brackets as sold separately (its dimension rows); both bolt to the sides. Fig. 3-1 dimensions them at 482.6
      and 584.2 over the body.
  front:
    confidence: drawing
    note: 'The breaker cells and thumbscrews are the 300CB08. THE CENTRE PANEL IS THE CONTROLLER ONE, measured on
      Fig. 3-2, the embedded 1188 x 258 image on page 38, at the same 1.9685 px/mm: two RJ45 openings 14.7 wide
      either side of a display window 24.9 by 7.6, a small round button under the window, the two switch slots where
      the plain panel has them but 1.0 higher, five lamp holes 1.3 higher, and the card slot. What is printed comes
      from Fig. 2-14, which letters MGMT, an address above it, LAN, RESET, 1 and 8 at each slot, nrg over the centre
      lamp and the voltage at the lower left. That figure shows no maker name and no model on this face, and none
      is printed here. Legend positions are read off that figure by eye. THE ADDRESS ABOVE MGMT IS NOT DRAWN: the
      face prints the controller''s factory default management address, a private (RFC 1918) address, centred over
      the jack about 3.9 from the top edge, and the repository''s private-address gate keeps such addresses out
      of tracked files. Its place is left blank.'
  lamps:
    confidence: drawing
    note: 'Five lamps: A PWR, A ALM, nrg, B ALM, B PWR. PWR is green with its feed present and ALM red on an alarm,
      as on the plain panel. The nrg lamp is the controller: the controller guide says the Identify button blinks
      it; the installation guide gives off, red, green and flashing red for the older nrg300CB08 in terms of nrgNET
      power, which these panels do not take. Red, green and a blink are recorded and no more. The nrgILS datasheet
      close-up shows the PWR lamps white-blue rather than green and the designation card slot glowing; a lit photograph
      at that size cannot separate lamp colour from white balance and reflection, so nothing is changed for it.'
  rear:
    confidence: drawing
    note: 'The plain rear of the 300CB08 (Fig. 3-6, at 3.2006 px/mm) with the nrgILS centre block where the passive
      panel has its alarm card. THE CENTRE BLOCK IS NOT FIG. 3-7: that figure, captioned for the nrgILS beside the
      nrgSMART panels, draws five-way nrgNET headers and two probe jacks, while the guide''s own specifications
      give ILS panels a removable RJ45 nrgNET connector and the nrgILS datasheet photographs two stacked RJ45 jacks
      under an nrgNET legend. See amphenol-ns/nrg-ils-rear-block@1 for how little of it could be measured.'
  breaker-ratings:
    confidence: datasheet
    note: ONE MODULE CARRIES ELEVEN RATINGS AS A FIELD. The datasheet sells breakers from 2 A to 60 A as eleven
      part numbers that differ in nothing but the figure printed on the handle, so they are one part with a `rating`
      field, set per position in a configuration. Each breaker ships with a touch guard seated on it, a separate
      part that a configuration can take off. The populated example is an invented load to show the field working;
      the vendor publishes no standard fill.
  ratings:
    confidence: datasheet
    note: The nrgILS datasheet gives the maximum input load as 325A @45 C per panel; the installation guide that
      covers the nrgILS prints the same row with its de-rating to 200 A at 70 C. That is what `operating-temp` carries.
  front-cover:
    confidence: drawing
    note: 'THE FRONT FACE IS A REMOVABLE COVER. The guide has a procedure for it (section 2.2.7): two thumbscrews
      release a bar that spans the front, with sixteen openings the breaker guards show through and the lamps, switch
      slots and card slot in its centre. It is drawn as the panel, not as a part, because the panel is never seen
      without it in service and the breakers, not the cover, are what a position holds. The slot under the lamps
      is the designation card holder the datasheet lists.'
  lifecycle:
    confidence: estimated
    note: searched 2026-10-07 for an end-of-life, end-of-sale or discontinuation notice for the nrgILS300CB08 and
      found none; the vendor product page listed it as current at intake, 2026-10-05.
  rear-cover:
    confidence: datasheet
    note: NOT DRAWN. A clear polycarbonate cover closes the whole rear over the input and output terminals (datasheet,
      Primary Features; guide Fig. 2-20). It is transparent and everything behind it is what the rear view shows.
  envelope-faces:
    confidence: drawing
    note: 'Top, bottom, left and right are sized from the chassis. THE BOTTOM IS RE-READ off the nrgILS bottom view,
      Fig. 3-12 (lower), at 1.19 px/mm, origin the rear edge as on the 300CB08: the same four side fields, the rear
      pair 143.8 deep and the front pair 86.7, and a centre column the 300CB08 lacks, 32.8 wide, in two runs either
      side of a screw. The two ground bolts sit at the head of that column, 216.2 from the left on their centres,
      drawn on the stated 5/8 inch centres. The top keeps the 300CB08''s two estimated side fields, lengthened by
      the extra depth. The sides take the 300CB08''s readings off its side view, Fig. 3-4, which the guide does
      not repeat for the nrgILS: the four bracket holes are placed from the front and the two-bolt ground landing
      from the rear, where the nrgILS bottom view shows the side lug within 5 of its 300CB08 position.'
  ground-pairs:
    confidence: datasheet
    note: >-
      EACH LANDING IS ONE PAIR, NOT TWO STUDS (#828, #830). The installation guide's three sets of
      1/4-20 threaded holes on 5/8 inch centres are each the landing of one dual-hole lug, so each
      is common/ground-stud-pair-5-8-1-4@1, two 1/4-20 pan-head screws at exactly 15.875, the
      pitch of the stud-pair-5-8 interface (formerly two common/ground-stud@1 placements 15.9
      apart). Each pair is placed at rotate 90, one screw above the other as the side view, Fig.
      3-4, and the bottom view, Fig. 3-12, draw the landings, centred where the two studs'
      midpoint was. A two-hole lug seated on a pair leaves its wire down the face (toward the
      front on the bottom view); each screw still takes a single-hole lug on its own, which the
      guide also allows. The earth mark beside each side landing is centred on its pair, 1.8 lower
      than it sat beside the two studs.
  ground-stud-size:
    confidence: datasheet
    note: 'the installation guide''s specifications give the earth ground terminals as three sets of 1/4-20 threaded
      holes on 5/8 inch centres, bolted with washers to 50 in-lb, for a dual-hole compression lug on #6 to #1 AWG
      wire; its description says they take either a dual-hole or a single-hole lug and that only one ground connection
      is required: the `stud-size` of all three ground pairs, one on each side and one on the bottom.'
  monitoring:
    confidence: datasheet
    note: The nrgILS measures feed and per-circuit voltage and current (voltage to +/-0.1 V from 20 to 60 V; current
      +/-5 % and +/-0.2 A) and reads an analog nrgTEMP probe and an I2C nrgILSTEMP temperature and humidity probe
      (the nrgILS300CB08 datasheet (08.10.26 v.5); the nrgILS controller configuration/user guide 155376, section
      6.1). Each output passes through a solid-state switch the software can open, which a DIP switch per circuit
      overrides ON (the 300CB08/nrg300CB08/nrgILS300CB08 installation guide 149722-2 A9, step 21; the nrgILS controller
      configuration/user guide 155376, section 6.3). NO DOCUMENT STATES WHAT THE PANEL DRAWS, so `power-max-w` is
      not given (gap panel-draw).
  network:
    confidence: datasheet
    note: 'THE DATASHEET LISTS ONE ETHERNET CONNECTION, 10/100/1000 WITH PoE AND IPv4/IPv6; the front carries two
      jacks, MGMT and LAN, in Fig. 3-2 and in both datasheet photographs. Which jack the datasheet means, what the
      other does on this firmware, and whether PoE powers the controller or is offered on the port, no document
      held says (gaps ethernet-ports, poe-role). Both are recorded as the same gigabit jack. Both jacks are turned
      180: Fig. 3-2 draws their lamp windows at the top, and the datasheet close-up agrees. The address printed
      above MGMT is not drawn, as on amphenol-ns/nrg300cb08-ctrl.'
  display:
    confidence: datasheet
    note: the datasheet calls it an LCD; its close-up shows the same two-line black and white display, white text
      on black, as the nrgSMART controller, so amphenol-ns/nrg-oled@1 is reused. The datasheet sells a replacement
      LCD/carrier board with SOM, 090-1000-0011. The RESET button under it is named on the face and described nowhere.
attrs:
  physical:
    weight-empty-kg: 6.4
    weight-configured-kg: 8.66
    weight-configured-scope: populated, 19.1 lb in the nrgILS datasheet; unpopulated is 14.1 lb
    overall-mm: '431.8 x 44 x 387.9 without brackets: 387.9 is the dimension on the nrgILS bottom view, Fig. 3-12;
      the specification tables give 346 (gap depth)'
    mounting: 19 inch brackets included; 23 inch brackets sold separately
  power:
    input-voltage: -48 VDC nominal (gap input-voltage)
    input-dc: dual feed; maximum input load 325 A at 45 C per panel, de-rated to 200 A at 70 C; input wire 2/0 AWG
      to 350 MCM
    short-circuit-withstand-a: 5000
    output-breaker-max: 60 A single-pole; the UL rating holds to 48 A continuous per output
    input-interrupt-max: 125 percent of the panel rating
  thermal:
    cooling: passive, perforated lid and base
  environmental:
    operating-temp: to 70 C - 325 A per panel at 45 C, de-rated to 200 A at 70 C; no lower limit is stated
  management:
    interfaces: HTTPS web interface, REST API, SNMP v1, v2c and v3, SNTP, syslog; IPv4 and IPv6
    alarm-contacts: Form C relay per side, 2 A at 30 VDC and 0.6 A at 60 VDC, on wire-wrap terminals
  compliance:
    safety: UL Listed
    nebs: Level 3
  lifecycle:
    eol: none-announced
  features:
    load-shedding: 'per-circuit solid-state switching under software control: scheduled on/off, power cycle after
      failed pings, manual override; a DIP switch per circuit forces it on'
    monitoring: feed and per-circuit voltage and current; one analog (nrgTEMP) and one digital I2C (nrgILSTEMP)
      temperature probe
    ethernet: one Ethernet connection, 10/100/1000 with PoE, in the datasheet (gap ethernet-ports)
