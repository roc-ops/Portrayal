gaps:
- what: input-polarity
  scope:
  - rear
  reason: vendor-silent
  note: 'each feed is two stud terminals, one BATT and one RTN, and no drawing or sentence held says which is the
    outer one: the input-lug figure of the guide (Fig. 2-7) carries no legend, and its rear photograph prints BATT
    and RTN beside the output rows only. Each side is one part, `input-a` and `input-b`, whose two terminals are
    `terminal-1` and `terminal-2` by position, not by polarity.'
  wanted: a rear photograph that resolves the input legends, or the panel itself.
- what: display-characters
  scope:
  - front
  reason: vendor-silent
  note: the nrgSMART controller datasheet prints its display as 2-line, Xx characters, with the count left blank,
    and the nrgILS datasheet calls this one an LCD and gives no count. Forty is the estimate amphenol-ns/nrg-oled@1
    carries, from one photograph of the nrgSMART display.
  wanted: the display part or its character count.
- what: reset-button
  scope:
  - front
  reason: vendor-silent
  note: the face letters a RESET button and no document says what a press does; searched the guides and release
    notes for reset, press and factory.
  wanted: the reset procedure.
- what: depth
  scope:
  - bottom
  - left
  - right
  - top
  reason: sources-disagree
  note: Fig. 3-12 dimensions the nrgILS bottom view 387.9 (15.27 inch) overall, 42.4 more than the 300CB08 view
    above it; the specification tables of the same guide give the nrgILS300CB08 13.6 inch (346), the 300CB08's row
    repeated. The model carries the drawing, 373.2 of chassis.
  wanted: a dimensioned nrgILS side view, or the panel itself.
- what: input-voltage
  scope:
  - front
  reason: sources-disagree
  note: the nrgILS datasheet gives -48 VDC alone; the face it photographs prints +/-12/24/48 V, the nrgSMART legend.
    The model carries the datasheet and draws the face as printed.
  wanted: the vendor's voltage range for the nrgILS controller.
- what: ethernet-ports
  scope:
  - network
  reason: sources-disagree
  note: the datasheet lists one Ethernet connection, 10/100/1000 with PoE; the face has MGMT and LAN jacks in Fig.
    3-2 and both datasheet photographs. The nrgils controller configuration/user guide 155376 configures one LAN
    and says nothing of MGMT.
  wanted: which jack is the network connection and what the other one does.
- what: poe-role
  scope:
  - network
  reason: vendor-silent
  note: 'the datasheet says POE and nothing more: not whether the controller can be powered from it or offers power
    on it, nor the class.'
  wanted: the PoE role and class.
- what: panel-draw
  scope:
  - front
  reason: vendor-silent
  note: neither the nrgILS datasheet, the installation guide nor the configuration guide states what the controller
    and its circuit switches draw; searched for watt, mA and consumption.
  wanted: the panel's own draw at -48 V.
- what: rear-block
  scope:
  - rear
  reason: needs-drawing
  note: the nrgILS rear centre is seen only in the datasheet's 790 px three-quarter photograph, where the plate
    is about 65 px across; every position in amphenol-ns/nrg-ils-rear-block@1 is a fraction by eye.
  wanted: a face-on rear drawing or photograph of the nrgILS centre block.
- what: rear-headers
  scope:
  - rear
  reason: vendor-silent
  note: three small white headers under the probe jack are named by no document; probably the two alarm outputs
    and the I2C probe, in an unknown order.
  wanted: the rear legends or a pinout.
