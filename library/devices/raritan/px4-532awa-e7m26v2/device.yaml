format: 1
kind: device
name: px4-532awa-e7m26v2
version: 0.1.0
maturity: modelled
manufacturer: Raritan
model: PX4-532AWA-E7M26V2
description: >-
  Raritan PX4-532AWA-E7M26V2 rack PDU, 0U: a black strip 56 mm wide, 65 mm deep and 1780 mm long for a rack's vertical
  channel. It has 18 IEC C13 and 18 Cx locking outlets in six groups, six 20 A breakers and a replaceable controller
  in the middle. A keyed Legrand Universal Input connector takes the cord.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S PRINTED SIZES AND A READING OF ITS MECHANICAL DRAWING. The technical specification and
      the mechanical drawing MPX4 (Rev 0C, Mar. 25, 2025) print the unit size and the outlet pitch; every position
      along the strip is read off the drawing's front view in proportion to the printed 1780 mm length, to about 10
      mm, from the cord end. The library draws the PDU STANDING with the cord end down, so a position along the strip
      is the y of the front view. The figures are read off the maker's mechanical drawing. THE DRAWING READ IS THE ONE OF THE PX4-132AWA-E7M26V2, THE SIBLING PART NUMBER: no drawing of this part number is held (gaps: own-drawing).
  chassis:
    confidence: drawing
    note: >-
      drawing - 56 x 65 x 1780 mm (2.2 x 2.6 x 70.1 in), the specification's width, depth and height. A step of 10.0
      mm in the side view is not drawn (gaps: sides). Weight and shipping figures are not published ('TBD'), so none
      is stated. `ru: 40` is the height it runs, 1780 mm being 40.04 units; it is derived, not printed.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`: a zero-U strip with a tool-less button mount. The drawing gives two buttons 1244.0 mm
      apart.
  front:
    confidence: drawing
    note: >-
      drawing - every position along the strip is read off the front view to about 10 mm. The outlet pitch inside a
      group, 26.6, is printed. The groups, the breaker blocks, the logo plate and the controller span are read, and a
      group's start is read, not computed. Positions ACROSS the strip are not in any source: the parts are centred and
      the controller's parts are placed by estimate.
  colours:
    confidence: estimated
    note: >-
      THE COLOURS ARE UNCHECKED ESTIMATES. The maker's pages give no colour for this model. The chassis black
      (#1c1c1e), the panel, the plates, the outlets, the jacks and the lamps are estimates. The maker's PX4 product
      images show black, and they were not compared with this model. The drawn faces have not been compared with a
      vendor photograph of the model. THE FRAME COLOURS ON THE CONTROLLER ARE BORROWED AND UNCHECKED: the green frame
      of Ethernet 1 and the yellow frame of the sensor jack follow the maker's PX4 controller product image, which is
      not of this model; the maker's pages for this model state no frame colour.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the technical specification: (18) C13 locking 10 A and (18) Cx locking 16 A, in groups of 6 with the
      3 C13 first and the 3 Cx last (the drawing's front view, counted from the cord end). The C13 is
      std/c13-outlet@1. The Cx is raritan/px4-cx-outlet@1, the HDOT Cx outlet, which presents
      `raritan-hdot-cx` (gaps: cx-outline). Alternating-branch
      distribution is stated but not which outlet is on which branch.
  numbering:
    confidence: estimated
    note: >-
      estimated - outlets are numbered 1 to 36 from the cord end, the C13 of a group first, as the maker's PX4 product
      image of one group shows digits rising away from the cord end. The drawing's printed digits are per group and
      per circuit and are not read (gaps: numbering). Each outlet has a lamp beside it in that render; its place is an
      estimate.
  breakers:
    confidence: datasheet
    note: >-
      datasheet - six 20 A 2-pole J62-X0 breakers, 10 kAIC (the specification). Six raised blocks of one rocker stand
      along the strip, three each side of the controller as the drawing shows. Which circuit each feeds is not read
      (gaps: breaker-feed).
  controller:
    confidence: estimated
    note: >-
      ESTIMATED BEYOND ITS SPAN. The maker's pages give the controller (a hot-swappable iX12 module) from its span,
      with a colour display, four buttons, two 10/100/1000 Ethernet jacks, two USB-A, one USB-B, a PDU link jack, a
      sensor jack, a reset pinhole and two lamps (View C, not dimensioned). The display and the buttons are the PXO's
      measured sizes (the same maker), and every place inside the span is an estimate (gaps: controller-layout).
  rear:
    confidence: estimated
    note: >-
      drawing and estimate - two mounting buttons 1244.0 apart. The drawing marks 273.0, 117.5 and 1555.0 and the
      maker's pages do not say which end each belongs to; they do not add up to a pair of end offsets, so the pair is
      centred on the strip (268.0 from each end). The button is centred across, an estimate (gaps: mount-marks).
  input:
    confidence: datasheet
    note: >-
      datasheet - a Legrand Universal Input connector, 45 degree angled feed. The Raritan PX4 Universal Input data
      sheet says the cords are separate part numbers; the maker's product-selector page lists one 3 m cord. The device
      states a detachable cord and no plug (gaps: input-cord).
  capability:
    confidence: datasheet
    note: >-
      datasheet - the Raritan PX4 Universal Input data sheet (p. 3) lists this part number as outlet metered with
      outlet control, so `outlet-switching: true` and each outlet states on and off.
attrs:
  physical:
    length-mm: 1780
    construction: metal strip
  power:
    input-cord: detachable
    breakers: six 20 A 2-pole breakers, 10 kAIC
  management:
    metering-scope: outlet
    outlet-switching: true
chassis: {width: 56, height: 1780, depth: 65, ru: 40, mount: rack-side, color: '#1c1c1e', airflow: passive}
gaps:
- what: breaker-feed
  scope: [front]
  reason: vendor-silent
  note: >-
    the maker's drawing gives six breaker blocks and does not say which group of outlets each breaker feeds, so no
    outlet is linked to a breaker. The circuit labels of the blocks are read from the 132AWA drawing;
    they are drawn in the margin beside each block, because a placed part paints over silkscreen.
  wanted: the drawing's wiring view, or the maker's user guide for the PX4.
- what: controller-layout
  scope: [front]
  reason: needs-drawing
  note: >-
    the controller's span is read off the drawing and its ports, display and buttons are named without sizes or
    positions. They are placed inside the span at estimated places, the display and buttons at the PXO's sizes, the
    USB-B as the PXO's part, the link and sensor jacks as RJ45 serial jacks. The two lamps and the reset pinhole stand
    at estimated places.
  wanted: the drawing's View C dimensioned, or a close photograph of the controller.
- what: mount-marks
  scope: [rear]
  reason: needs-drawing
  note: >-
    the drawing marks 273.0, 117.5 and 1555.0 mm near the mounting buttons and the maker's pages do not say which end
    each belongs to. They are not drawn as positions: the pair of buttons, 1244.0 apart, is centred on the strip.
  wanted: the drawing's rear view read for those marks.
- what: numbering
  scope: [front]
  reason: needs-drawing
  note: >-
    the printed digits of the drawing are per group and per circuit and are not read, so the outlets are numbered 1
    upward from the cord end, as the maker's product image of one group shows. The exported names are these numbers.
  wanted: the drawing's View B read for the printed digits, or a straight-on photograph.
- what: circuit-labels
  scope: [front]
  reason: needs-drawing
  note: >-
    a circuit label stands at the right end of each outlet group in the drawing and the maker's pages do not give its
    digits, so none is drawn on a group.
  wanted: the drawing's View B read for the labels.
- what: cx-outline
  scope: [front]
  reason: needs-drawing
  note: >-
    the Cx outlet's size and shape are estimates (the part's contract says so). The retention clip drawn above each
    outlet on View B is not drawn.
  wanted: the drawing's View B dimensioned.
- what: input-cord
  scope: [front]
  reason: vendor-silent
  note: >-
    the Universal Input data sheet says the cords are separate part numbers and the maker's product-selector page
    lists one 3 m cord. The device states a detachable cord and no plug type.
  wanted: the maker's SKU page for this part number.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    the drawing's side and rear views carry only the mounting buttons and the cord, and a step marked 10.0 mm in the
    side view. No feature on the ends or the long sides is placed, so none is drawn. Their outlines are the printed 56
    by 65 and 65 by 1780.
  wanted: the drawing's side and end views dimensioned, or photographs of the ends and the sides.
- what: own-drawing
  scope: [front, rear, top, bottom, left, right]
  reason: needs-drawing
  note: >-
    the geometry, colours and positions on every face are those of the sibling part number PX4-132AWA-E7M26V2, whose provenance cites the technical
    specification and mechanical drawing MPX4, Rev 0C, Mar. 25, 2025; the PX4 Universal Input data sheet (p. 3) lists the two part numbers with the same
    form factor (0U), outlet mix ((18) C13, (18) Cx) and breaker count (6), and differing only in intelligence level. No held document is specific to
    this part number, and the sibling's own drawing is not held here either. Whether the drawing of this part number differs is not known.
  wanted: the mechanical drawing and the technical specification of PX4-532AWA-E7M26V2.
