  buttons: {term: Button, role: service, index-origin: 1, description: the recessed RESET hole}
  serial-1-8:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: serial ports 1 to 8, the lower row of the left bank
  serial-9-16:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: serial ports 9 to 16, the upper row of the left bank
  serial-17-24:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: serial ports 17 to 24, the lower row of the right bank
  serial-25-32:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: serial ports 25 to 32, the upper row of the right bank
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the 32 port channel lamps on the front, numbered 1 to 32 as printed
  furniture: {term: Item, role: furniture, index-origin: 1}
