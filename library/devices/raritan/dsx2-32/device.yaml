format: 1
kind: device
name: dsx2-32
version: 0.1.0
maturity: modelled
manufacturer: Raritan
model: DSX2-32
portfolio: {line: Console servers, family: Dominion SX II}
description: >-
  Raritan Dominion SX II DSX2-32, a 32-port serial console server with dual AC power, 1U. The rear carries
  two AC inlets, each with a power switch, and a fan. It has a TERMINAL serial jack, a mini-USB Admin
  jack, three USB ports, a reset hole and a DVI-D video jack. Two Gigabit LAN jacks sit beside 32 RJ45
  serial ports in two banks of two rows. The lower rows are numbered 1 to 8 and 17 to 24, and the upper
  rows 9 to 16 and 25 to 32. The front carries a USB port and the port lamps 1 to 32.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      datasheet - Raritan Dominion SX II data sheet V1209R3 (2021), page 4: the specification and model
      tables and the labelled rear-panel photograph of the DSX2-32. Dominion SX II User Guide v2.6.0,
      Appendix A (printed pp. 51 to 55): dimensions, weight, power and the port pins. Dominion SX II Quick
      Setup Guide v2.6.0, page 1: the rack mounting kit. Dominion SX II Features and Benefits: the USB
      ports. The maker's product photograph of the front of a DSX2-32M-DC (header-sxii-new.jpg, 1600 x
      353 pixels). No dimensioned drawing, 3D model or stencil is held, and no stencil was opened.
  method:
    confidence: estimated
    note: >-
      NO DRAWING IS HELD, SO EVERY POSITION ON BOTH FACES IS MEASURED OFF A PHOTOGRAPH AND IS ESTIMATED.
      The rear is the data sheet's DSX2-32 photograph (page 4, rendered at 200 dpi): the body spans 1351
      pixels for the family's 440 mm, 3.07 pixels per millimetre, and its height reads 42.7 mm against
      44, so the view is square-on to about 3 percent. The serial jack pitch reads 43.1 pixels, 14.0 mm,
      which agrees with the library's 13.97 ganged pitch. A rear position is good to about 0.5 mm across
      and 1 mm down. The front is the photograph of a DSX2-32M-DC, a DIFFERENT SKU, and it looks down
      on the unit: the lid shows above the face. Horizontal positions are read at 1.859 pixels per millimetre
      across the 818 pixels of the face and are good to about 1 mm; vertical positions are read from the
      top of the silver ear at the same scale and are good to about 2 mm. Colours are medians of the photographs.
  chassis:
    confidence: datasheet
    note: >-
      User Guide v2.6.0, Appendix A (printed p. 51): "17.3" W x 13.15'' D x 1.73'H '; (440mm x 334mm x
      44mm)" and 9.08 lbs (4.12 kg). THE GUIDE GIVES ONE SET OF FIGURES FOR THE WHOLE FAMILY AND DOES
      NOT SAY WHICH SKU IT DESCRIBES, so they are carried here as the family's (gaps: family-size). Whether
      the 334 mm depth includes the cable-support bar or the mounting brackets is not stated. The photograph
      shows no bracket, so 440 is read as the body.
  colour:
    confidence: photo-measured
    note: >-
      medians of the photographs: the rear face #1a1b20, the front lower face #171819, the silver ears
      #c3c9c3 on the left and #ccd1cc on the right, the dark band between them #353935, the perforated
      area #131514.
  rear-layout:
    confidence: estimated
    note: >-
      From the data sheet photograph. From the left: the two AC inlets, each under its switch and numbered
      1 and 2; the fan; the TERMINAL jack with the ADMIN mini-USB jack to its right and the MODEM position,
      which is a blank square on this AC model; under them the DVI jack between two thumbscrews and the
      RESET hole; a column of THREE USB ports; the two LAN jacks, LAN 2 over LAN 1; and the serial ports,
      two banks of 16 in two rows each with its numerals above and below.
  front-layout:
    confidence: estimated
    note: >-
      From the DSX2-32M-DC front photograph, used for a DSX2-32 because no page shows the front of a DSX2-32
      (gaps: front-other-sku). The USB-A port at the left with its symbol, the silver ear at each end,
      a dark band with the DOMINION mark, the row of 32 port lamps with the numerals 1 to 32 under it,
      and a perforated area below. The perforation is drawn as one darker panel and not as holes. The
      model label printed on the right ear reads DSX2-32M-DC in the photograph and is not drawn.
  serial-ports:
    confidence: datasheet
    note: >-
      Data sheet, page 4 caption "RJ-45 Serial Ports" and the numerals 1 to 32 on the photograph. User
      Guide Appendix A (printed pp. 54 to 55): the pins of the server port in DTE mode (1 RTS, 2 DTR,
      3 TXD, 4 and 5 ground, 6 RXD, 7 DSR, 8 CTS) and in DCE mode (1 CTS, 2 DSR, 3 RXD, 4 and 5 ground,
      6 TXD, 7 DTR, 8 RTS); the data sheet says the port detects DTE or DCE by itself. The numbering is
      read off the photograph: 1 to 8 along the lower row of the left bank, 9 to 16 above them, 17 to
      24 and 25 to 32 in the right bank the same way. The latch of the upper row is at the top of the
      jack and of the lower row at the bottom, as the photograph shows. No lamp is visible on a serial
      jack.
  serial-role:
    confidence: datasheet
    note: >-
      The data sheet calls the unit a serial console server and the ports "RJ-45 Serial Ports"; the Quick
      Setup Guide connects target devices to them with a standard Cat5 cable. The TERMINAL jack is the
      local serial Admin port: the user guide's Local Terminal pins are 1 RTS, 3 TXD, 4 and 5 ground,
      6 RXD and 8 CTS, with 2 and 7 not used (printed p. 54).
  power:
    confidence: datasheet
    note: >-
      Data sheet and User Guide Appendix A: 100/240 VAC auto-switching, 50 to 60 Hz, 0.35 A, and 36 to
      72 VDC on the DC models; the 32-port unit draws at most 23 W. Two inlets on every model: this AC
      model's are drawn as IEC C14 as the photograph shows, and the guide and data sheet say "Dual AC
      Power".
  lamps:
    confidence: datasheet
    note: >-
      User Guide Appendix A, SX II Appliance LED Status Indicators (printed pp. 57 to 58): the front panel
      port channel lamp turns on when a powered-on target is connected and blinks during a session. The
      same page describes a front Power lamp, red with one supply and blue with two; no photograph shows
      it (gaps: power-lamp). The lamp colour of a port is not stated.
  ears:
    confidence: estimated
    note: >-
      Quick Setup Guide v2.6.0, page 1: the kit is two side brackets and a cable-support bar, fixed with
      three screws per side, and the unit sits forward (front flush with the ears) or rear (front flush
      with the back edges of the brackets). No hole spacing and no bracket size is stated, so no ear is
      drawn and the shipped forward position is the one listed (gaps: rack-kit).
  sku:
    confidence: datasheet
    note: >-
      Data sheet page 4 model table: "DSX2-32 / DSX2-32M: 32-port serial console server with dual-power
      AC and dual gigabit LAN". This device is the AC model without a modem. The DSX2-32M adds an internal
      telephone modem and the DSX2-32M-DC has dual DC power.
attrs:
  physical:
    weight-note: 9.08 lb (4.12 kg) in the user guide, as one figure for the whole SX II family
  power:
    power-max-w: 23
    power-input: >-
      100 to 240 VAC auto-switching, 50 to 60 Hz, 0.35 A, two C14 inlets (data sheet and user guide)
  environmental: {operating-temp-c: 0 to 50, non-operating-temp-c: 0 to 55, operating-humidity: 20% to
      85%}
  features:
    serial-pinout: >-
      DTE or DCE detected by the port; RJ45 pins in user guide Appendix A, printed pp. 54 and 55
    video: DVI-D local video jack (data sheet)
    usb-admin: USB 2.0 mini-B Admin port for a laptop (data sheet and features sheet)
    modem: none on this model; the M models add an internal telephone modem
chassis:
  width: 440
  height: 44
  depth: 334
  ru: 1
  color: '#1a1b20'
  ears:
    positions:
    - {name: flush, label: forward mount, default: true}
    - {name: rear, label: rear mount}
  power: ac
gaps:
- what: dimensioned-drawing
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    No dimensioned drawing, 3D model or stencil is held. Both faces are measured off photographs and every
    position is estimated (provenance `method`).
  wanted: A dimensioned front and rear view of the DSX2-32.
- what: family-size
  scope:
  - front
  - rear
  - top
  - bottom
  - left
  - right
  reason: vendor-silent
  note: >-
    The user guide gives 440 x 334 x 44 mm and 4.12 kg for the SX II family and does not say which SKU
    it describes, whether the depth includes the cable-support bar or the brackets, or how the weight
    differs between the 4-port and the 48-port unit.
  wanted: The maker's dimensions and weight for the DSX2-32.
- what: front-other-sku
  scope:
  - front
  reason: needs-photo
  note: >-
    The only front photograph held is of a DSX2-32M-DC. The front of the DSX2-32 is drawn from it. Whether
    the two fronts differ beyond the printed model label is not stated by any held page.
  wanted: A straight-on front photograph of the DSX2-32.
- what: dvi-d
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The DVI-D jack is a region only: the library has no DVI jack part and no connector key covers a DVI-D
    jack.
  wanted: A ruling on the connector key for the DVI-D jack.
- what: power-lamp
  scope:
  - front
  reason: needs-photo
  note: >-
    The user guide describes a front Power lamp (red with one supply, blue with two). The front photograph
    shows none, so none is drawn.
  wanted: A close photograph of the front of an SX II.
- what: rack-kit
  scope:
  - front
  - left
  - right
  reason: needs-drawing
  note: >-
    The quick setup guide describes two side brackets and a cable-support bar and shows no dimension,
    hole spacing or part number. The brackets are not drawn and neither mounting position states an offset.
  wanted: A dimensioned drawing of the rackmount kit.
- what: lamp-colour
  scope:
  - front
  reason: vendor-silent
  note: >-
    No held page states the colour of a port channel lamp, so the states carry names and no colour.
  wanted: The maker's description of the front lamps.
- what: sides
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-photo
  note: No held page shows the top, the bottom or a side straight on.
  wanted: Photographs or a drawing of the top, bottom and sides.
