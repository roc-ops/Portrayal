format: 1
kind: device
name: px3-5469r
version: 0.1.0
maturity: modelled
manufacturer: Raritan
model: PX3-5469R
description: >-
  Raritan PX3-5469R rack PDU, 2U: a black chassis 440 mm wide, 293 mm deep and 88 mm high. Two rows of ten outlets,
  eight IEC C13 and two C19 in each, sit left of a controller panel. A rear panel carries the Ethernet, sensor and
  expansion jacks, and a fixed 3 m cord has an IEC 60309 2P+E 6h 32 A plug.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S PRINTED SIZES AND A READING OF ITS MECHANICAL DRAWING. The technical specification (rev
      2025-06-25) and the mechanical drawing MPX3-5469R (Rev 2A, April 23, 2017) print the unit size and the bracket
      height. The front elevation is read off the drawing, 440 mm wide, to about 3 mm. The rear is read in less
      detail: the maker's pages name its jacks and do not place them. The figures are read off the maker's mechanical
      drawing.
  chassis:
    confidence: drawing
    note: >-
      drawing - 440 x 293 x 88 mm (17.3 x 11.5 x 3.5 in), width, depth, height. 2U horizontal; `ru: 2`. Weight 7 kg,
      shipping 10.6 kg and 560 x 552 x 284 mm.
  colours:
    confidence: estimated
    note: >-
      THE COLOURS ARE UNCHECKED ESTIMATES. The maker's pages give no colour for this model. The chassis black
      (#1c1c1e), the panel, the plates, the outlets, the jacks and the lamps are estimates. The maker's PX4 product
      images show black, and they were not compared with this model. The drawn faces have not been compared with a
      vendor photograph of the model. THE FRAME COLOURS ARE SOURCED FOR THE JACKS ONLY: the green Ethernet frame, the
      yellow sensor frame, the grey expansion frame and the red feature frame follow the PX3 user guide's table of
      connection-port colours (the series, not this model's drawing); the cyan console frame is read from the maker's
      pages. None was checked against a photograph of this model.
  front:
    confidence: estimated
    note: >-
      drawing - two rows of ten outlets, circuit 1 on the top row and circuit 2 on the bottom, about 43 mm apart. In
      each row five C13, a small gap, three more C13, then two C19, read at column centres of about 26, 61, 96, 131,
      165, 204, 239, 273, 308 and 339 mm (+/- 3). Three centres are moved inside that reading so that no two outlets
      overlap: 273 to 272.5, 308 to 306 and 339 to 342. The controller panel stands at the right end from about 359 to
      440 mm.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the technical specification: (16) C13 and (4) C19, two rows on the front, switched and metered per
      outlet. std/c13-outlet@1 and std/c19-outlet@1. Their turn is not published, so they are drawn unturned.
  controller:
    confidence: estimated
    note: >-
      ESTIMATED BEYOND ITS SPAN. The maker's pages give, on the controller panel, a large colour display at the top,
      an RJ45 console jack in a cyan frame, a USB-B jack, a USB-A jack, four buttons, a reset pinhole and two lamps,
      with the logo printed vertically at the extreme right. The display and the buttons are the PXO's measured sizes
      (the same maker) and every place is an estimate.
  rear:
    confidence: estimated
    note: >-
      estimated - the maker's pages name, on a rear panel, an Ethernet jack (green), sensor and expansion RJ45 jacks
      and a feature jack, and says the cord leaves the rear; it places none of them. They stand in a row at the end
      that is behind the controller panel, and the cord gland at the other end, each an estimate (gaps: rear-panel).
  input:
    confidence: datasheet
    note: >-
      datasheet - IEC 60309 2P+E 6h 32 A (IP44), 3 m cord, rear feed, cord retention no.
  capability:
    confidence: datasheet
    note: >-
      datasheet - switched and metered per outlet (the specification), so `outlet-switching: true` and each outlet
      states on and off.
attrs:
  physical:
    weight-kg: 7
    construction: metal
  power:
    input-cord: fixed
    input-plug: other
    input-current-a: 32
    breakers: two breakers, one for each row of ten outlets (not placed)
  management:
    metering-scope: outlet
    outlet-switching: true
chassis: {width: 440, height: 88, depth: 293, ru: 2, mount: rack, color: '#1c1c1e', airflow: passive}
gaps:
- what: breakers
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    the specification gives two breakers and the drawing's elevation as read places none, so none is drawn and no
    outlet is linked to one.
  wanted: the drawing's views read for the breakers, or a photograph.
- what: rear-panel
  scope: [rear]
  reason: needs-drawing
  note: >-
    the rear panel's jacks are named (Ethernet in green, sensor, expansion, feature) and not placed. They are drawn in
    a row at estimated places, the expansion and feature jacks as RJ45 serial jacks because their media is not
    published, and the cord gland at an estimated place. Nothing else is stated on the rear.
  wanted: the drawing's View C and D dimensioned.
- what: rack-kit
  scope: [front]
  reason: needs-drawing
  note: >-
    the specification lists the rack kit RACK-KIT-PX-2U. The Raritan Mounting Brackets data sheet gives it an L
    bracket (250-70-3017-00, 365.23 x 88.1 x 21.3 mm) and a cable management bracket (250-70-3018-00, 447.6 x 12.4 x 8
    mm) and no rack depth range or ear position, so no kit contract can be written and no ear position is stated.
  wanted: the kit's installation sheet, or a rack depth range from the maker.
- what: numbering
  scope: [front]
  reason: needs-drawing
  note: >-
    the maker's pages do not say whether the outlets are numbered. They are named 1 to 10 along the top row from the
    left and 11 to 20 along the bottom row, an assumption; the exported names are these numbers.
  wanted: a straight-on photograph of the front.
- what: controller-layout
  scope: [front]
  reason: needs-drawing
  note: >-
    the controller panel's parts are named and placed by estimate, the display and buttons at the PXO's sizes, the
    USB-B as the PXO's part. The console jack's cyan frame is a colour estimate. The logo is printed as text.
  wanted: the drawing's View C dimensioned.
- what: eth-speed
  scope: [eth]
  reason: vendor-silent
  note: >-
    the specification for this model does not state the rate of its Ethernet jack. The PX3 user guide (connection
    ports) says the port marked green is 10/100/1000 and the one marked white is 10/100, and the maker's pages give
    this jack as green, so 1g is stated by that colour rule and not by a printed label on this model.
  wanted: a close photograph of the jack's label, or the specification's port table.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    the maker's pages give no view of the top, bottom or ends, so none is drawn. Their outlines are the printed sizes.
  wanted: the drawing's plan and end views.
