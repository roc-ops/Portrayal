format: 1
kind: device
name: dsxa-32
version: 0.1.0
maturity: modelled
manufacturer: Raritan
model: DSXA-32
portfolio: {line: Console servers, family: Dominion SX}
description: >-
  Raritan Dominion SX DSXA-32, a 32-port serial console server with dual AC power, one Ethernet port and a built-in modem, 1U.
  The rear carries two AC inlets, each with a power switch, and a modem jack. It has a DB9 terminal port, a 10/100 Ethernet jack,
  three lamps and a reset hole. Thirty-two RJ45 serial ports sit in four groups of two rows of four.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Datasheet - Raritan Dominion SX data sheet (2008, V1008R3), page 4: the model table with the width, depth, height and weight of the DSXA-32.
      The same page holds the rear-panel photograph labelled DSXA-32 shown. Dominion SX Quick Setup Guide v3.5 (QSG-DSXv3-5.0-0N-E), page 2:
      the connection figure and its key. The figure is for a model with two power outlets, one LAN interface and 32 server ports.
      Page 1 of that guide holds an oblique photograph of a unit labelled SX16. Dominion SX User Guide v3.5, printed pp. 23 to 27:
      the same key and the port numbering of the 32-port models. Its Appendix A (printed pp. 253 to 262) holds the terminal ports and the
      dimension table. No dimensioned drawing or 3D model is held.
  method:
    confidence: estimated
    note: >-
      NO DRAWING IS HELD, SO EVERY POSITION ON THE REAR IS MEASURED OFF THE DATA SHEET PHOTOGRAPH AND IS ESTIMATED.
      The photograph is embedded at 545 by 100 pixels. The page was rendered at 600 dpi, which enlarges it four times.
      In the render the rear face spans 2040 pixels for 440 mm, 4.64 pixels per millimetre, so one embedded pixel is about 0.86 mm.
      The face height reads 43 mm against 44, so the view is square-on to about 3 percent across the rear plate.
      The lid recedes above it and is not measured. The serial jack pitch reads 65 pixels, 14.0 mm, which agrees with the library's 13.97 ganged pitch.
      A rear position is good to about 1 mm across and 2 mm down. The front and the side vents are read from the quick setup guide's page 1.
      That photograph shows a unit labelled SX16. It is oblique and 398 pixels wide, so a position there is good to about 10 mm (gaps: front-photo).
  chassis:
    confidence: datasheet
    note: >-
      Data sheet page 4 and User Guide Appendix A (printed p. 253) both give 17.32 x 11.41 x 1.75 in for the DSXA-32.
      That is 440 x 290 x 44 mm, as width, depth and height. Both give its weight as 8.40 lb (3.78 kg).
      Whether the depth includes the rack brackets is not stated.
  colour:
    confidence: photo-measured
    note: >-
      Medians of the data sheet photograph rendered at 600 dpi. The rear face reads #a39ea5 from 900 pixels and the modem plate #8f8e96 from 1200 pixels.
      The inlet recesses read #2d2c30 from 800 pixels and the DB9 shell #0d618c from 1500 pixels. The serial bank plates read #c7bfbc from 200 pixels.
      The photograph shows a light grey box, not the black of the SX II. The three vents are drawn as hole and slot patterns on the face colour.
  rear-layout:
    confidence: estimated
    note: >-
      From the data sheet photograph and the quick setup guide's figure, read from the left. Two AC inlets come first, each with a rocker switch above it.
      Then the modem plate with an RJ11 jack, and the DB9 terminal port with a jackscrew at each end. Below the DB9 sits the Ethernet jack,
      with three lamps to its left and the reset hole to its right. The serial ports follow in four groups of two rows of four.
      The jack under the modem plate is the built-in modem the data sheet lists for this model (key B in the guide).
  serial-ports:
    confidence: datasheet
    note: >-
      Data sheet page 4 captions the jacks "RJ-45 Serial Ports". User Guide printed p. 26 has a figure, "32 Port SX Models - Port Numbering".
      It numbers ports 1 to 4 on the lower row and 5 to 8 on the upper row of the first group. Ports 9 to 16, 17 to 24 and 25 to 32 follow in the next groups.
      The RJ-45 serial pins in Appendix A are RTS, DTR, TxD, GND, signal GND, RxD, DSR and CTS on pins 1 to 8.
      The upper row is drawn turned 180 degrees from the lower. That is an estimate, as the photograph is too small to show the latch side.
  terminal-port:
    confidence: datasheet
    note: >-
      Quick Setup Guide page 3, command line setup step 1, says: "This port is a DB9 male port on all models except" some.
      The exceptions are models with two power connectors and two LAN interfaces. The DSXA-32 has one LAN interface, so its terminal port is the DB9 male port.
      The photograph has a caption under the DB9 and another under the reset hole. Each is about 2 embedded pixels tall, 1.7 mm, too small to read.
      The guide's wording for other models is not evidence of this one, so neither legend is drawn (gaps: legends).
  lamps:
    confidence: datasheet
    note: >-
      User Guide printed p. 23, key G: the unit status lamp blinks on network or serial activity. The Activity and 10/100 lamps are tied to the network port.
      The photograph shows three small lamps left of the Ethernet jack, two green and one amber by eye.
      Each is about 3 pixels across in the embedded picture.
      Each caption beside them is about 2 pixels tall there, too small to read, so the guide's lamps are not matched to them.
      Lit colours are the median of the 12 most saturated pixels of a 30 by 24 pixel box in the 600 dpi render.
      The top lamp reads #527058, the middle one #587765 and the low one #897f5b.
      These are dull, so the library's green and amber are used for the lit states. No blink behaviour is stated, as no lamp is matched to a guide entry.
      The lamps are drawn off.
      The jack is drawn bare: the photograph shows no lamp inside it, and the three lamps beside it are drawn as the picture shows them.
  front:
    confidence: estimated
    note: >-
      Read from the oblique photograph on the quick setup guide's page 1, 398 pixels wide, of a unit labelled SX16. It shows one perforated band.
      The Raritan logo sits at its left end and a model label at its right end. A blue mark sits above the right end of the band.
      The holes form a staggered lattice. Alternate rows are offset by 0.48 to 0.51 of a pitch, read over 21 holes a row.
      The hole pitch is 4.13 pixels, 5.63 mm, and the row pitch is about 3 pixels, 4.3 mm. The scales are 1.36 mm a pixel across and 1.42 down.
      The band has seven rows at its left end and five from pixel column 76 to its right end. The rows hold 9, 9, 56, 55, 54, 54 and 50 holes.
      Each row is drawn as its own hole pattern at its counted length, so the band keeps the slanted ends the photograph shows.
      The first full row sits about 22 mm below the top. The last row sits about 4 mm above the bottom. Both are read from the face edges in the picture.
      The logo mark is about 25 pixels wide there and the label about 30. Both are regions without text.
      The photograph shows one blue mark, at about 84 percent of the face width and 11 mm below the top, and none at the left. One lamp is drawn off at that mark.
      The blue reads #5a7d82 from the 12 bluest of 360 pixels, so a library blue is used.
  side-walls:
    confidence: estimated
    note: >-
      Both walls are read from the oblique photograph on the quick setup guide's page 1, which shows two stacked units.
      The upper unit is seen from the front and the lower unit from the rear, so the picture shows opposite walls of the two.
      Left and right are as seen from the front. The upper unit's wall is the right wall, with the front at its left as the right view runs.
      The lower unit's wall is the left wall, with the rear at its left as the left view runs. Each wall has three rows, 4.7 pixels apart, about 5.6 mm.
      The right wall rows read as dashes at a pitch of 2.9 pixels, about 12 mm, from pixel column 336 to 384. That is x 45.5 to 253 mm, drawn as 17 whole dashes.
      The left wall rows read as dots at a pitch of 2.4 pixels, about 9.6 mm, from column 330 to 383. That is x 17 to 245 mm, drawn as 24 dots.
      The depth scale is 4.33 mm per pixel, from wall corners 67 pixels apart. The pattern stops inside the picture on both walls.
      The unit above hides the top of the lower wall. Its rows are placed from its bottom edge, and only the visible extent is drawn.
      A mark is 1 to 2 pixels, so its size is the pattern's own proportion at the pitch.
  power:
    confidence: datasheet
    note: >-
      Data sheet page 4: 110/240 VAC auto-switching, 50 to 60 Hz, dual-feed AC, 32-port maximum 9.375 W.
      Two inlets, each drawn as an IEC C14 as the photograph shows, each with a power on/off switch (guide key A).
attrs:
  physical:
    weight-note: 8.40 lb (3.78 kg), data sheet page 4
  power:
    power-max-w: 9.375
    power-input: 110 to 240 VAC auto-switching, 50 to 60 Hz, dual-feed, two C14 inlets (data sheet)
  environmental:
    operating-temp-c: 0 to 40
    operating-humidity: 20% to 85% non-condensing
  features:
    serial-pinout: RJ45 pins in user guide Appendix A
    modem: built-in modem
    ethernet: one 10/100 RJ45
    terminal: DB9 male terminal port
chassis:
  width: 440
  height: 44
  depth: 290
  ru: 1
  color: '#a39ea5'
  ears:
    positions:
    - {name: flush, label: bracket mount, default: true}
  power: ac
gaps:
- what: dimensioned-drawing
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    No dimensioned drawing or 3D model is held. The rear is measured off a photograph and every position is estimated (provenance method).
  wanted: A dimensioned front and rear view of the DSXA-32.
- what: front-photo
  scope: [front, left, right]
  reason: needs-photo
  note: >-
    No held page shows the front straight on. The only picture is an oblique photograph on the quick setup guide's page 1, 398 pixels wide, of a unit labelled SX16.
    It shows a perforated bezel with a logo at the left and a model label at the right. The front is drawn from it as an estimate and may differ on the 32-port unit.
  wanted: A straight-on front photograph of the DSXA-32.
- what: rack-kit
  scope: [front, left, right]
  reason: needs-drawing
  note: >-
    The User Guide's table (printed p. 26) lists a 19-inch rack-mount kit for the DSXA-32. The held guides print no bracket drawing, hole spacing or part number.
    No bracket is drawn.
  wanted: A dimensioned drawing of the rack kit.
- what: lamp-captions
  scope: [rear]
  reason: needs-photo
  note: >-
    The three lamps beside the Ethernet jack are about 3 pixels across in the embedded photograph, and their captions are about 2 pixels tall.
    The captions cannot be read, so the lamps are not matched to the guide's list.
  wanted: A close photograph of the Ethernet jack and its lamps.
- what: modem-label
  scope: [rear]
  reason: needs-photo
  note: The caption under the modem jack is about 2 pixels tall in the embedded photograph. It cannot be read, so no text is drawn on that plate.
  wanted: A close photograph of the modem plate.
- what: inlet-captions
  scope: [rear]
  reason: needs-photo
  note: >-
    Each inlet has a small caption block to its right and a mark at the corner of its recess. A network symbol sits under the Ethernet jack.
    Each is about 2 pixels tall in the embedded photograph, so none is drawn.
  wanted: A close photograph of the inlets and the Ethernet jack.
- what: top-and-bottom
  scope: [top, bottom]
  reason: needs-photo
  note: >-
    No held page shows the top or the bottom straight on, so neither is drawn.
    The rear photographs show a banded logo area on the lid. It is a mark and is not drawn.
  wanted: Photographs or a drawing of the top and the bottom.
- what: front-holes
  scope: [front]
  reason: needs-photo
  note: >-
    The lattice is staggered and counted row by row, but the photograph is oblique and 398 pixels wide.
    The straight-on outline, the row count and the hole size are unknown. A hole is 1 to 3 pixels by two methods, so the pattern draws its own proportion.
    The two short rows at the left end sit on the curved cap, so their place is a guess.
  wanted: A straight-on front photograph of the DSXA-32, to read the lattice outline and the hole size.
- what: side-slot-rows
  scope: [left, right]
  reason: needs-photo
  note: >-
    Each side wall is drawn as a pattern from its own wall in the photograph, but the mark size and the exact pitch are estimates.
    A mark is 1 to 2 pixels in a 398 pixel photograph. The unit above hides the top of the left wall, so its rows are placed from its bottom edge.
  wanted: A straight-on photograph of each side wall.
- what: legends
  scope: [rear]
  reason: needs-photo
  note: >-
    The captions under the DB9 and the reset hole are about 2 pixels tall in the embedded photograph and cannot be read.
    The guide's text for the DSX16 and DSX32 is not evidence of this model, so no legend is drawn.
  wanted: A close photograph of the DB9 and the reset hole.
- what: db9-colour
  scope: [rear]
  reason: needs-drawing
  note: >-
    The photograph shows the DB9 shell blue, #0d618c from 1500 pixels. The shared DB9 part has a grey skin and a teal skin only.
  wanted: A blue skin for the shared DB9 part, if the maintainer wants one.
- what: lid-tabs
  scope: [rear]
  reason: needs-photo
  note: >-
    The three tabs on the rear face's top edge are drawn as flat rectangles, 10 by 1.7 mm. They are read from the data sheet photograph.
    Their depth and shape are unknown. The photograph shows only a 2 pixel step in the shadow line of the lip.
  wanted: A close photograph of the top edge of the rear face, to show the tab shape.
