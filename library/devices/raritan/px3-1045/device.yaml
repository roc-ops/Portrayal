format: 1
kind: device
name: px3-1045
version: 0.1.0
maturity: modelled
manufacturer: Raritan
model: PX3-1045
description: >-
  Raritan PX3-1045 rack PDU, 0U: a black strip 52 mm wide, 55 mm deep and 1780 mm long for a rack's vertical channel.
  It has 36 IEC C13 outlets, 10 A, in two circuits of 18 and six groups of three. Each circuit has a breaker, and a
  replaceable controller sits between the two circuits. The fixed 3 m cord has an IEC 60309 2P+E 6h 32 A plug.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      FIGURES FROM THE MAKER'S PRINTED SIZES AND ONE FRONT PHOTOGRAPH. The technical specification (rev 2025-06-25)
      and the mechanical drawing MPX3-1045 (Rev 2A, June 13, 2017) print the unit size, the outlet pitch and the
      mounting buttons; the front photograph (9600 x 2000, straight on) gives every position along the strip, read to
      about 5 mm from the end where the photograph starts. The library draws the PDU STANDING, cord end down, as the
      photograph's cord end is the bottom when mounted, so a position along the strip is the y of the front view. No
      vendor file is held; the figures were read by a person and written down. No PX3 3D model or stencil was read.
  chassis:
    confidence: drawing
    note: >-
      drawing - 1780 x 52 x 55 mm (70.1 x 2.1 x 2.2 in), the specification's width, depth and height. 6.5 kg, shipping
      9 kg and 285 x 115 x 1915 mm. The chassis is black and matte, from the photograph; the hex value is an estimate
      of that black.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`: a zero-U strip that hangs on two mounting buttons beside the rack's upright (kit RACK-
      KIT-PX2-1K-ZU). `ru: 40` is the height it runs, 1780 mm being 40.04 units; it is derived, not printed.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - every position along the strip is read off the front photograph to about 5 mm. Circuit 1: 18
      outlets in six groups of three from about 46 to 520 mm, CIRCUIT 1 and a breaker at about 560 to 580. Controller
      from about 648 to 864. Circuit 2: 18 outlets from about 911 to 1384, CIRCUIT 2 and a breaker at about 1425 to
      1445. Cord gland at about 1749. The outlets stand 24.0 apart inside a group, the printed pitch; the gap between
      groups, 8.0, is DERIVED from the span and is an estimate. Positions ACROSS the strip are not in any source: the
      outlets are centred, the rest are estimates.
  numbering:
    confidence: estimated
    note: >-
      the photograph prints 1 to 18 and 19 to 36 above the outlets. The maker's pages donot say which end of a circuit
      carries 1, so the numerals are taken to rise along the strip in the photograph's reading order (gaps: numbering-
      direction).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the technical specification: (36) IEC C13, 10 A, two circuits of 18, drawn as std/c13-outlet@1. The
      outlets are not described as locking, and the orientation of the nose is not published, so the part is drawn
      unturned.
  breakers:
    confidence: datasheet
    note: >-
      datasheet and photograph - two breakers, one for each circuit (the selector table and the photograph's CIRCUIT 1
      and CIRCUIT 2 labels). Each outlet of a circuit runs through its breaker. No rating is published.
  controller:
    confidence: estimated
    note: >-
      ESTIMATED BEYOND ITS SPAN. The maker's pages givethe controller as replaceable, from about 648 to 864 mm, with a
      colour matrix display and four buttons on its left half and two stacked Ethernet jacks, two USB, a console and a
      sensor port on its right half. The sizes of the display and the buttons are the PXO's (the same maker's drawing-
      measured 42.2 by 33.9 and 8.4), and every position inside the span is an estimate (gaps: controller-layout).
  rear:
    confidence: drawing
    note: >-
      drawing - two mounting buttons 1244.0 apart. The drawing marks 268.0 at one end; 268.0 + 1244.0 + 268.0 =
      1780.0, so the buttons are read as 268.0 from each end. The marks 423.5 and 933.0 are not read (gaps: rear-
      marks). The button is centred across, an estimate.
  input:
    confidence: datasheet
    note: >-
      datasheet - IEC 60309 2P+E 6h, 32 A, IP44, 3 m (9.84 ft) standard, bottom-front feed, cord retention yes. No
      voltage or phase is printed.
attrs:
  physical:
    length-mm: 1780
    weight-kg: 6.5
    construction: metal strip
  power:
    input-cord: fixed
    input-plug: other
    input-current-a: 32
    breakers: two breakers, one for each circuit of 18 outlets (no rating published)
chassis: {width: 52, height: 1780, depth: 55, ru: 40, mount: rack-side, color: '#1c1c1e', airflow: passive}
gaps:
- what: numbering-direction
  scope: [front]
  reason: vendor-silent
  note: >-
    the photograph prints 1 to 18 and 19 to 36 above the outlets, and the maker's pages donot say whether 1 is at the
    end nearer the cord or the end away from it. The numerals are drawn rising along the strip from the end the
    photograph starts at.
  wanted: the front photograph read for the numeral beside the first outlet of each circuit.
- what: controller-layout
  scope: [front]
  reason: needs-drawing
  note: >-
    the controller's span is read off the photograph, and its ports and display are named in the maker's pages
    withoutsizes or positions. The display, the four buttons and the jacks are placed inside the span at estimated
    positions, the display and buttons at the PXO's sizes. The two USB ports are drawn as USB-A, since the maker's
    pages donot give their types, and the console and sensor jacks are drawn as RJ45 serial jacks like the PXO's. The
    logo at the controller's top right is not drawn.
  wanted: the drawing's View C dimensioned, or a close photograph of the controller.
- what: port-names
  scope: [front]
  reason: vendor-silent
  note: >-
    the maker's pages name the ports and not their printed labels, so the two Ethernet jacks are exported as Ethernet
    1 and Ethernet 2.
  wanted: a close photograph of the controller, or the maker's user guide for the PX3.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: >-
    no dimensioned outlet drawing is held, so the C13 is the standard's, and the outlet's nose direction and any
    locking feature are not drawn.
  wanted: the drawing's View B dimensioned across the strip.
- what: cord-end-marks
  scope: [front]
  reason: vendor-silent
  note: >-
    the photograph shows a small earth symbol and a lamp near the cord gland, and the maker's pages giveno position
    for either, so neither is drawn. The gland's diameter is not published and is an estimate.
  wanted: the front photograph read at the cord end.
- what: breaker-lamp
  scope: [front]
  reason: vendor-silent
  note: >-
    each breaker is a small rocker with a lamp, and the lamp's colour and meaning are not published, so only the
    rocker is a part and its lamp is art.
  wanted: the maker's user guide.
- what: rear-marks
  scope: [rear]
  reason: needs-drawing
  note: >-
    the drawing marks 423.5 and 933.0 on the back, and the maker's pages donot say what they locate. They are not
    drawn.
  wanted: the mechanical drawing's rear view read for those two marks.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    the maker's pages giveno view of the ends or the long sides: no feature, vent or fastener on them is published, so
    none is drawn. Their outlines are the printed 52 by 55 and 55 by 1780.
  wanted: the drawing's side and end views dimensioned, or photographs of the ends and the sides.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, attrs: {outlet: iec-60320-c13}, description: 'the 36 IEC C13 outlets in two circuits of 18, numbered 1 to 36 as the photograph prints them'}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'the two circuit breakers, one for each circuit of 18 outlets'}
  eth: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 1g}, description: 'the two 10/100/1000 BaseT Ethernet jacks of the controller (technical specification, networking)'}
  mgmt: {term: Port, role: management, index-origin: 1, mixed: 'the console jack, the sensor jack and the two USB jacks of the controller'}
  mounting: {term: Button, role: furniture, index-origin: 1}
  power-input: {term: Cord, role: service, index-origin: 1}
