format: 1
kind: device
name: px3-5493
version: 0.1.0
maturity: modelled
manufacturer: Raritan
model: PX3-5493
description: >-
  Raritan PX3-5493 rack PDU, 0U: a black strip 52 mm wide, 65 mm deep and 1539 mm long for a rack's vertical channel.
  It has 20 IEC C13 and 4 C19 outlets in four groups of six, two circuit breakers and a controller panel. The panel sits
  between the second and third groups. A 3 m cord leaves near the bottom end and ends in an IEC 60309 2P+E 6h 32 A plug.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S PRINTED SIZES AND A READING OF ITS MECHANICAL DRAWING. The technical specification (rev
      2025-06-25) prints the unit size on page 2. Its mechanical diagram MPX3-5493 & MPX3-4493 (Rev 0A; PDF page 6) draws
      the strip's elevation. Each position along it is read at 3.089 px per mm, set by the printed 1539 mm, to about 0.5
      mm. Its control panel (page 4) and its one-line diagram (page 5) name the jacks and the circuits. The library
      draws the PDU STANDING, cord end down, so a position along the strip is the y of the front view. The drawing is
      turned a quarter turn, outlet 1 at the top. No vendor stencil was opened and no vendor drawing, photograph or
      stencil is copied. The figures were read by a person and written down. No photograph of this model is held.
  chassis:
    confidence: drawing
    note: >-
      drawing - 1539 x 52 x 65 mm (60.6 x 2.1 x 2.6 in), the specification's height, width and depth (page 2). The drawing
      prints 1539 and 52. 5.3 kg, shipping 7.7 kg and 280 x 115 x 1655 mm. `ru: 35` is the height it runs, 1539 mm being
      34.6 units; it is derived, not printed.
  colours:
    confidence: estimated
    note: >-
      THE HEX VALUES ARE ESTIMATES. The specification gives "Black powder coat (custom colors available)". No photograph
      of this model is held. So the chassis is black and the panel and plates are estimates of dark grey. The jack frame
      colours (green, grey, red, cyan, yellow) are those the page 4 drawing paints, written as estimated hex values. The
      lamp colours are the user guide's, written as estimated hex values. None was checked against a photograph.
  front:
    confidence: drawing
    note: >-
      drawing - outlet centres, measured from the cord end, at 306.2 + 33.4 n mm for outlets 24 to 19. Outlets 18 to 13
      stand at 515.1 + 33.4 n. Outlets 12 to 7 stand at 1096.8 + 33.4 n and 6 to 1 at 1305.1 + 33.4 n (n from 0). The first of each group
      is a C19. The drawing's numerals under the outlets give the numbering, outlet 1 at the far end. Positions ACROSS the
      strip are not printed. Each outlet is centred, as the drawing's outlet frames are. The breaker plates are about 55 by
      42 mm, from 204.1 and 994.2 mm. Each has a rocker, two screws and its CIRCUIT label. The ring beside each outlet is
      read at about 2.4 mm.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the technical specification: (20) IEC320 C13, 10 A, and (4) IEC320 C19, 16 A, switched and metered per
      outlet (page 1). The one-line diagram (page 5) puts outlets 1 to 12 on circuit 1 and 13 to 24 on circuit 2. Drawn as
      std/c13-outlet@1 and std/c19-outlet@1, unturned. The drawing's chamfered C13 end and C19 earth slot point to the
      strip's top end, as the parts are drawn.
  breakers:
    confidence: datasheet
    note: >-
      datasheet - two LEGBXA6-16 breakers, 5KAIC (page 2). The one-line diagram prints each as 16 A. The breaker is the
      shared raritan/px3-breaker@1, turned a quarter turn so its 14 mm lies along the strip. Its size is that part's
      estimate and not this drawing's rocker (gaps: rocker-size).
  controller:
    confidence: drawing
    note: >-
      drawing - the panel is about 212 by 43.4 mm. It starts 749.1 mm from the cord end (page 6, read at 1200 dpi), 577.9 to
      789.9 mm from the top. Its contents are read from the page 4 drawing and the page 6 elevation. There are four round
      buttons (left chevron, right chevron, cross, circle) beside a display window of 42.4 by 33.7 mm. There is a RESET
      pinhole with a lamp under it. Two stacked jacks, ETH 1 over ETH 2, come next. Then come USB-A 1, USB-A 2 and USB-B,
      then FEATURE over CONSOLE / MODEM, then EXPANSION over SENSOR. A screw ring stands at each end. Each jack is turned a
      quarter turn so its latch edge faces the strip's left, as the drawing's latch edge faces up. The display and the
      buttons are the PXO's parts, whose sizes match the drawing to about 0.5 mm. The frame colours and the labels' names
      follow page 4. The Raritan logo, the iX7 mark and the label texts are not drawn. A later change draws marks.
  rear:
    confidence: drawing
    note: >-
      drawing - two mounting buttons 1244.0 apart, the first 147.5 from the cord end (PDF page 6, rear view, dimensions
      147.5 and 1244.0). They stand 147.5 and 1391.5 mm from the top. The button is the maker's PX3 mounting button, its 14.7
      head borrowed (gaps: mounting-button-size). It is centred across, an estimate. A ring 25.2 mm across is drawn round each,
      the flange that page 7 prints for the button part.
  sides:
    confidence: estimated
    note: >-
      estimated - the page 6 side elevation draws profile lines and an end cap that this change does not read. Every side is
      a plain outline at the printed size (gaps: side-profile, ends).
  input:
    confidence: datasheet
    note: >-
      datasheet - IEC 60309 2P+E 6h 32 A (2P3W), IP44, 3 m (9.84 ft) cord (page 2). It has a bottom-front feed, cord
      retention, a 32 A maximum and a 200 - 240 V rating. The cord leaves through the end cap, about 30 mm from the bottom end.
  capability:
    confidence: datasheet
    note: >-
      datasheet - remote outlet switching yes and metering per outlet, per branch breaker and per input line (page 1). So
      `outlet-switching: true` and each outlet states on and off, and `metering-scope: outlet`.
  lamps:
    confidence: estimated
    note: >-
      The drawing shows a small ring beside every outlet. The PX-Series PDU User Guide (4.3.11, page 88) lists an LED for
      5000 series models. It is not lit when an outlet is off, red when it is on and live, and green when it is off and live.
      The guide also lists blinking states for overload and tripped breakers. It names a series and not this model. The
      model number places this one in the 5000 series. The lamps are drawn OFF. No picture is held, so no lit colour was
      sampled.
attrs:
  physical:
    length-mm: 1539
    weight-kg: 5.3
    construction: metal strip
  power:
    input-cord: fixed
    input-plug: other
    input-current-a: 32
    breakers: two LEGBXA6-16 breakers, one for each circuit of 12 outlets
  management:
    metering-scope: outlet
    outlet-switching: true
chassis: {width: 52, height: 1539, depth: 65, ru: 35, mount: rack-side, color: '#1c1c1e', airflow: passive}
gaps:
- what: eth2-speed
  scope: [front, eth]
  reason: sources-disagree
  note: >-
    the specification's table (page 1) lists a secondary, redundant 10/100/1000 BaseT Ethernet port. The control panel
    drawing (page 4) labels the second jack 10/100/1000. The mechanical drawing's view C (page 6, dated 2016) labels it
    "ETH 2 10/100". The device follows the table and page 4, 1 Gbps, and the first jack is 1 Gbps by all three.
  wanted: the maker's statement of the second port's rate.
- what: jack-media
  scope: [front]
  reason: vendor-silent
  note: >-
    the FEATURE, CONSOLE / MODEM, EXPANSION and SENSOR jacks are drawn as RJ45 serial jacks, as the maker's other PDUs are.
    The specification names them and does not give their connector or signal type.
  wanted: the specification's port table, or a close photograph of the panel.
- what: usb-speed
  scope: [front]
  reason: vendor-silent
  note: >-
    the two USB-A jacks and the USB-B jack are drawn at the library's default skins. The specification does not give their
    speeds.
  wanted: the specification's port table.
- what: controller-lamp
  scope: [front]
  reason: vendor-silent
  note: >-
    the panel drawing shows one lamp under the RESET pinhole. No page says what it shows, so it is drawn off with the
    library's default states.
  wanted: the controller's description in the maker's user guide.
- what: rocker-size
  scope: [front]
  reason: needs-drawing
  note: >-
    the drawing's rocker is about 13.6 along the strip by 15.4 across. The shared breaker part is 14 by 20 and is an
    estimate. The part is not changed here.
  wanted: a drawing of the breaker with its sizes.
- what: mounting-button-size
  scope: [rear]
  reason: needs-drawing
  note: >-
    the Raritan Mounting Brackets data sheet names 250-80-0011-00 the M5 button mount of kit G2-RACK-FOR-ZU. Page 7 draws its
    head at 14.00 and its flange at 25.20. The shared PX3 mounting button is 14.7 across, from another drawing's screw
    head. It is not changed here.
  wanted: the kit's installation sheet.
- what: rack-kit
  scope: [rear]
  reason: needs-drawing
  note: >-
    the specification lists the mounting kit G2-RACK-FOR-ZU and draws four of its parts (page 7). The rear view also draws a
    sliding plate with four holes and two small marks, 290.9 and 933.0 from the cord end. None is drawn, and no kit
    contract is written.
  wanted: the kit's installation sheet.
- what: printed-marks
  scope: [front]
  reason: needs-drawing
  note: >-
    the drawing prints a nameplate, the jack and button labels, an earth mark near the cord, the Raritan logo and the iX7
    mark. Only the outlet numerals and the CIRCUIT labels are drawn.
  wanted: a later change for marks and printed text.
- what: side-profile
  scope: [left, right]
  reason: needs-drawing
  note: >-
    the side elevation on page 6 draws profile lines along the strip and an end cap at each end. They are not read in this
    change, so each long side is a plain outline at 65 by 1539 mm.
  wanted: the side elevation read at its printed sizes.
- what: ends
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    the drawing has no end view and the specification publishes no end feature. Each end is a plain outline at 52 by 65 mm.
  wanted: an end view of the strip.
