  outlets: {term: Outlet, role: traffic, index-origin: 1, attrs: {outlet: iec-60320-c13}, description: 'the four locking C13 outlets, numbered 1 to 4 from the left as seen from the outlet face, as printed'}
  outlet-leds: {term: LED, role: indicator, index-origin: 1, description: 'one lamp per outlet, below its mouth: not lit when the outlet is off, red when it is on (user guide, PXC and PXO switched series outlets and LEDs)', states: ['off', {name: 'on', color: '#dc2626'}]}
  lock-buttons: {term: Button, role: service, index-origin: 1, description: 'the release button of a locking outlet: hold it and unplug the cord (quick setup guide, Appendix C)'}
  eth: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 100m}, description: 'the two 10/100 Ethernet jacks, ETH1 and ETH2'}
  mgmt: {term: Port, role: management, index-origin: 1, mixed: 'the console jack, the sensor jack for environmental sensors and the two USB jacks of the controller'}
  buttons: {term: Button, role: service, index-origin: 1, description: 'the four navigation buttons and the reset button of the controller'}
  display: {term: Display, role: indicator, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
