format: 1
kind: device
name: pro3x-switched-3f01
version: 0.1.0
maturity: modelled
manufacturer: Server Technology
model: PRO3X Switched 3F01
description: 'Server Technology PRO3X Switched 3F01, 0U: a 1778.0 mm strip for a rack''s vertical channel. It has 36 outlets,
  18 HDOT C13 and 18 HDOT Cx, in six groups of six behind two two-pole breakers. A controller panel sits between the two banks.
  The unit meters the input and each branch circuit and switches each outlet. The drawing is the one for the 230 V 32 A SKU.'
profile: power
provenance:
  method:
    confidence: drawing
    note: FIGURES FROM THE MAKER'S SKU SHEET C3W36RL-EPJE2MT4, PAGE 5 (headed Drawings), READ FROM A 300 PPI RASTER. The sheet
      draws the strip as the Basic 3A01 sheet does and adds the controller panel between the banks. Positions along the strip
      carry about 1 to 3 mm. The controller panel's place is read from the plan view of the Smart 3C01 sheet at 900 dpi and
      carries about 3 mm. The three intelligent sheets draw the same strip.
  mount:
    confidence: drawing
    note: '`rack-side`: the strip stands beside a rack''s upright on mounting buttons at the back. The rear view dimensions
      68.4, 20.0 and 98.4 from the cord end. It gives 422.3 from either end to a button and 933.5 between the buttons. It
      gives 31.3 either side of each button and 1555.8 to the far outer mark. It gives 123.8 from that mark to the end, and
      68.4 and 20.0 from the far end. The two marks 933.5 apart carry a button and the other ten are holes (gaps: button-positions).'
  chassis:
    confidence: drawing
    note: drawing - 1778.0 long and 55.9 wide. The side view's body is 63.5 deep and the outlets reach 81.8; the SKU sheet
      prints 70.0 x 2.2 x 2.5 in.
  front:
    confidence: drawing
    note: drawing - the plan view, measured on the raster. From the cord end come the front-entry cover and a ground point.
      Then two symbol labels, a rating label, and a plate with a breaker and its label. Then three groups of six outlets,
      three HDOT Cx then three HDOT C13 (detail A), with a blank plate before the second and third. Then the controller panel,
      a second plate with a breaker, and three more groups with a blank plate before the second and third. The outlet centres
      and pitches are the 3A06's, which the HDOT module of this chassis shares. Cx is 26.65 apart and C13 21.25, and the C13
      triplet is spaced at the standard recess 22.0 about its middle. Across, the outlets sit where the 3A06's do (a stand-in).
      The labels and the ground point are read to about 2 mm. Each outlet has a retention lever, drawn estimated as a block
      7.6 long along the strip and 2.0 across, standing 18.3 proud. The 7.6 is the peg width read on the side view at 600
      ppi. The 2.0 and the place across are scaled from the data sheet photograph by the C13 width, 22.0 at the standard recess.
      Each lever is centred on its outlet (gap outlet-lever).
  numbering:
    confidence: estimated
    note: 'estimated - outlet #1 is opposite the power input (the sheet). So the far end is 1 and the cord end 36, as the
      3A06 prints. The numbers under the outlets are not legible on this raster. The order is the 3A06''s.'
  breakers:
    confidence: drawing
    note: drawing - the wiring schematic draws two breakers (CB). The cord side one feeds the first three groups and the far
      one the last three. Each is two-pole across L1 and L2/N. The sheet says two 2-pole 20 A trip breakers, 10 kAIC (North
      America) and 5 kAIC (rest of world). Which group each blank plate belongs to is read from the schematic.
  capability:
    confidence: datasheet
    note: 'datasheet - the C3W36RL-EPJE2MT4 sheet lists the key features of a PRO3X Switched PDU, so `metering-scope: branch`
      and `outlet-switching: true`. Each outlet declares [on, off].'
  outlets:
    confidence: datasheet
    note: datasheet - the sheet says 18 IEC 60320 C13 and 18 Cx outlets. HDOT Cx is a hybrid C13/C19 that takes a C14 or a
      C20 plug. HDOT C13 is drawn as std/c13-outlet@1. The HDOT Cx is servertech/hdot-cx-outlet@1, an estimate of the recess,
      as no dimensioned outlet drawing is held.
  rear:
    confidence: drawing
    note: drawing - the twelve positions the rear view marks. 391.0 and 453.6 are 31.3 either side of the 422.3 button. 1324.4
      and 1387.0 are either side of the 1355.7 one.
  sides:
    confidence: drawing
    note: drawing - the side view shows a perforated band along nearly the whole length; the other side is drawn as its mirror
      (estimated).
  ends:
    confidence: estimated
    note: estimated - the end views show a plate with the cord entry; they are drawn as caps.
  input:
    confidence: datasheet
    note: 'datasheet - the SKU sheet prints Input Voltage 230 V, Input Plug IEC 230V/32A 2P+PE 6Hr, 32 A (32 A rated), 7.3
      kW. The cord''s length and gauge and the plug''s face are in no held document (gaps: cord-and-plug).'
  controller:
    confidence: estimated
    note: estimated - Detail A of the Smart 3C01 sheet draws the panel with no scale; the part's contract states the method.
      The Switched and Switched POPS sheets draw the same panel small in their plan views and carry no Detail A.
attrs:
  physical:
    length-mm: 1778.0
    construction: metal strip
  power:
    input-cord: fixed
    input-plug: other
    input-phase: single
    input-voltage-v: 230
    input-current-a: 32
    input-ac: single-phase 230 V, L1 L2/N PE. The SKU sheet for C3W36RL-EPJE2MT4 prints 230 V, 32 A (32 A rated), 7.3 kW and
      an IEC 230V/32A 2P+PE 6h plug.
    breakers: two two-pole branch breakers, 10 kAIC North America, 5 kAIC rest of world (SKU sheet)
  management:
    metering-scope: branch
    outlet-switching: true
    network-module: PRO3X controller
chassis:
  width: 55.9
  height: 1778.0
  depth: 63.5
  ru: 40
  mount: rack-side
  color: '#2b2d30'
  airflow: passive
gaps:
- what: cord-and-plug
  scope:
  - bottom
  reason: vendor-silent
  note: the sheet names the plug and the drawing marks front and bottom entry. No held document gives the cord's length or
    gauge or draws the plug's face. Only an entry frame is drawn, at the size of the PRO4X 4G16A's, borrowed.
  wanted: a photograph of the cord and its plug.
- what: button-positions
  scope:
  - rear
  reason: vendor-silent
  note: the rear view marks twelve positions and no document says which carry buttons on this SKU; the pair 933.5 apart is
    drawn with buttons.
  wanted: the PRO3X installation guide, or a photograph of the back.
- what: outlet-size
  scope:
  - front
  reason: needs-drawing
  note: no dimensioned drawing of an HDOT Cx or HDOT C13 outlet is held. The Cx recess is estimated and the C13 is the standard's.
    The retention latch of each outlet is drawn estimated (gap outlet-lever).
  wanted: a dimensioned outlet drawing from Server Technology.
- what: outlet-lever
  scope:
  - front
  reason: needs-drawing
  note: the pictures show a lever at each outlet and no dimensioned drawing gives it. Its 7.6 along the strip is the peg width
    on the side view and its 18.3 reach is the sheet's. Its 2.0 across and its place are scaled from the data sheet photograph.
  wanted: a dimensioned drawing of the HDOT outlet module with its lever.
- what: body-colour
  scope:
  - front
  reason: vendor-silent
  note: the PRO3X data sheet's photographs (pages 1 and 2) show white outlet modules, a black plate and a silver side. None
    is of this SKU. The library's dark neutral is drawn on every face, as on the sibling devices.
  wanted: a photograph of this SKU, and the maintainer's word on drawing the colours.
- what: end-plates
  scope:
  - front
  - top
  - bottom
  reason: needs-photo
  note: the end views are small, so the end faces are caps and the front-entry cover is a plate.
  wanted: a close photograph of each end.
- what: outlet-across-position
  scope:
  - front
  reason: needs-drawing
  note: the sheet's drawing is a raster with no dimension across the strip, so the outlets sit where the 3A06's do, as a stand-in.
  wanted: a dimensioned front view of the HDOT module.
- what: outlet-numbering
  scope:
  - front
  reason: needs-photo
  note: the numbers printed under the outlets are not legible on the raster; the order is the 3A06's and the numbering is
    estimated.
  wanted: a photograph of the front.
- what: label-positions
  scope:
  - front
  reason: needs-photo
  note: the ground point and the two symbol labels at the cord end are read off the raster to about 2 mm.
  wanted: a close photograph of the cord end.
- what: other-side
  scope:
  - left
  - right
  reason: vendor-silent
  note: the sheet shows one side of the strip, so the other is drawn as its mirror, estimated.
  wanted: a photograph of the other side.
- what: controller-scale
  scope:
  - front
  reason: needs-drawing
  note: Detail A of the Smart 3C01 sheet draws the panel with no scale or dimension. So its size and its jacks' places are
    read at the PRO4X controller bay's width. The display window then reads within 3 percent of the PRO4X controller's.
  wanted: a dimensioned drawing of the PRO3X controller panel.
- what: lcd-content
  scope:
  - front
  reason: vendor-silent
  note: the sheet says a multi-colour LCD and states no character count or rows, so it is drawn as a window with no display
    kind.
  wanted: the PRO3X user guide.
