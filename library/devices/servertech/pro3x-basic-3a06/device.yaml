format: 1
kind: device
name: pro3x-basic-3a06
version: 0.1.0
maturity: modelled
manufacturer: Server Technology
model: PRO3X Basic 3A06
description: 'Server Technology PRO3X Basic 3A06, 0U: a 1778.0 mm strip for a rack''s vertical channel. It has 36 outlets,
  18 HDOT C13 and 18 HDOT Cx, in six groups of six, each behind its own two-pole breaker. It has no controller, and it meters
  and switches nothing. The drawing is the one for the 208 V delta 60 A SKU.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S VECTOR DRAWING. Server Technology outline drawing 412-1500-060
      rev 1A (sheet 1, titled PRO3X V36, 208V 3PH DELTA 60A) draws the strip lying down, cord end left, with a plan view,
      a rear view above it, a side view, two end views and a detail A of the outlets. Its views are paths, so positions were
      read off the PDF''s geometry at 0.51381 pt/mm, the scale that puts the 1778.0 overall on the strip. The library draws
      the PDU STANDING, cord end down, so a position along the drawing becomes 1778.0 minus that, and a position across becomes
      x. The maker''s Visio stencil for the 3A06 was not opened.'}
  mount: {confidence: drawing, note: '`rack-side`: the strip stands beside a rack''s upright on mounting buttons at the back.
      The outline dimensions twelve positions along the back and marks two of them as buttons 933.5 apart; those two carry
      a button here and the other ten are holes (gaps: button-positions).'}
  chassis: {confidence: drawing, note: drawing - 1778.0 long and 55.9 wide. The side view's body is 63.5 deep and the outlets
      reach 81.2; the SKU page prints 82 maximum and 64 nominal depth.}
  front: {confidence: drawing, note: 'drawing - the plan view. From the cord end: the front-entry plate, a caution label,
      a rating label, then three groups, each a breaker module and six outlets (three HDOT Cx then three HDOT C13, detail
      A), a blank panel where the 4G16A''s controller would be, and three more groups. Group and module positions are dimensioned
      by paths and read at about 0.3 mm. THE OUTLETS'' OWN CENTRES ARE THE RAMLOCK TAB CENTRES, 26.65 apart for Cx and 21.25
      for C13; the C13 triplet is spaced at the standard recess 22.0 about its drawn middle, so a C13 sits up to 0.8 mm off,
      and its housing runs 6 past the group''s drawn frame. Across, the outlets sit where the PRO4X 4G16A''s do (a stand-in,
      not measured here). The front-entry plate and the two labels are read off the raster to about 2 mm.'}
  numbering: {confidence: drawing, note: 'drawing - the numbers printed under the outlets were read from a render: the group
      of BR2 prints 12 11 10 9 8 7 from the cord side, and the group beyond BR1 ends at 1.'}
  breakers: {confidence: drawing, note: 'drawing - each module prints its pair of lines and BR number: BR6 L3-L1, BR5 L2-L3,
      BR4 L1-L2 from the cord end, then BR3 L3-L1, BR2 L2-L3, BR1 L1-L2, an arrow pointing at the group it feeds. The wiring
      diagram 495-1500-060 draws six breakers (CB) each feeding six adjacent outlets. The SKU page says 2-pole breakers, 10
      kAIC. No current rating is held.'}
  capability: {confidence: datasheet, note: 'datasheet - the SKU page prints Branch Monitoring, Input Monitoring and Outlet
      Monitoring None, so `metering-scope: none` and `outlet-switching: false`; no outlet declares a state.'}
  outlets: {confidence: datasheet, note: 'datasheet - the SKU page says 18 IEC C13 and 18 Cx outlets, HDOT Cx a hybrid C13/C19
      that takes a C14 or a C20 plug. HDOT C13 is drawn as std/c13-outlet@1; the HDOT Cx is servertech/hdot-cx-outlet@1, an
      estimate of the recess (no dimensioned outlet drawing is held).'}
  rear: {confidence: drawing, note: 'drawing - the rear view dimensions 68.4 and 20.0 from each end, 98.4 from each end to
      the outer pair 1581.2 apart, and 31.3 either side of marks 422.3 from the 98.4 marks, 933.5 apart. The marks beside
      the 88.4 and 68.4 ones are read as holes: twelve positions in all, two of them buttons.'}
  sides: {confidence: drawing, note: drawing - the side view shows a perforated band along nearly the whole length; the other
      side is drawn as its mirror (estimated); its depth is read off the raster.}
  ends: {confidence: estimated, note: estimated - the end views show a plate with the cord entry; they are drawn as caps.}
  input: {confidence: datasheet, note: 'datasheet - the SKU page lists C3B36RL-DQJE0AT2 as 208V Delta 60A IEC 60309 3P+G 9Hr,
      17.3 kW, 60 A (48 A rated), three-phase delta, cord Bottom/End; the drawing title matches that SKU, and the page''s
      other SKUs print other plugs. The cord''s length and gauge and the plug''s face are in no held document (gaps: cord-and-plug).'}
attrs:
  physical: {length-mm: 1778.0, construction: metal strip}
  power: {input-cord: fixed, input-plug: other, input-phase: three, input-wiring: delta, input-voltage-v: 208, input-current-a: 60,
    input-ac: 'three-phase delta, L1 L2 L3 PE. The SKU page for C3B36RL-DQJE0AT2 prints 208 V, 60 A (48 A rated), 17.3 kW
      and an IEC 60309 3P+G 9h plug.', breakers: 'six two-pole branch breakers, 10 kAIC (SKU page)'}
  management: {metering-scope: none, outlet-switching: false}
chassis: {width: 55.9, height: 1778.0, depth: 63.5, ru: 40, mount: rack-side, color: '#2b2d30', airflow: passive}
gaps:
- what: cord-and-plug
  scope: [bottom]
  reason: vendor-silent
  note: the SKU page names the plug and the outline marks the entry locations, and no held document gives the cord's length
    or gauge or draws the plug's face. Only an entry frame is drawn, at the size of the PRO4X 4G16A's, borrowed.
  wanted: the SKU's own data sheet or a photograph of the cord and its plug.
- what: button-positions
  scope: [rear]
  reason: vendor-silent
  note: the rear view marks twelve positions and no document says which carry buttons on this SKU; the pair 933.5 apart is
    drawn with buttons.
  wanted: the PRO3X installation guide, or a photograph of the back.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: no dimensioned drawing of an HDOT Cx or HDOT C13 outlet is held; the Cx recess is estimated and the C13 is the standard's,
    so the retention latch above each outlet is not drawn.
  wanted: a dimensioned outlet drawing from Server Technology.
- what: breaker-handle
  scope: [front]
  reason: vendor-silent
  note: the module draws an OFF and ON handle window; only the window is drawn, and its legend and the arrow are not reproduced.
  wanted: a photograph of a breaker module.
- what: body-colour
  scope: [front]
  reason: vendor-silent
  note: no document states a colour and no photograph of this SKU is held, so a dark neutral is used.
  wanted: a photograph of this SKU.
- what: end-plates
  scope: [front, top, bottom]
  reason: needs-photo
  note: the end views are read at low resolution, so the end faces are caps and the front-entry plate is a plate.
  wanted: a close photograph of each end.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the PDU''s 36 outlets, numbered 1 to 36 as printed from
      the far end - 18 HDOT C13 and 18 HDOT Cx in six groups of six'}
  outlet-numerals: {term: Label, role: furniture, index-origin: 1}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'six two-pole branch breakers, each feeding the six
      outlets of one group'}
  mounting: {term: Button, role: furniture, index-origin: 1}
  power-input: {term: Cord, role: service, index-origin: 1}
