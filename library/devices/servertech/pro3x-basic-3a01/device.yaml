format: 1
kind: device
name: pro3x-basic-3a01
version: 0.1.0
maturity: modelled
manufacturer: Server Technology
model: PRO3X Basic 3A01
description: 'Server Technology PRO3X Basic 3A01, 0U: a 1778.0 mm strip for a rack''s vertical channel. It has 36 outlets,
  18 HDOT C13 and 18 HDOT Cx, in six groups of six behind two two-pole breakers. It has no controller, and it meters and switches
  nothing. The drawing is the one for the 230 V 32 A SKU.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S SKU SHEET, READ FROM A 300 PPI RASTER. The Server Technology
      data sheet of C3B36RL-EPJE0AT4 (page 4, headed Drawings) draws the strip lying down, cord end left: a rear view, a plan
      view, a side view, two end views, a detail A of an outlet group and a wiring schematic. The drawing is an image, not
      paths, so positions were measured on it at 0.97 mm a pixel (the 1778.0 overall spans 1833 pixels) and carry about 1
      to 3 mm. The chassis is the one the PRO3X Basic 3A06 outline drawing 412-1500-060 draws: its group and plate positions
      agree with this sheet to within 3 mm wherever both were read, so the 3A06''s more exact figures are used for them. The
      library draws the PDU STANDING, cord end down, so a position along the drawing becomes 1778.0 minus that, and a position
      across becomes x. The maker''s Visio stencil was not opened.'}
  mount: {confidence: drawing, note: '`rack-side`: the strip stands beside a rack''s upright on mounting buttons at the back.
      The rear view dimensions 68.4, 20.0 and 98.4 from the cord end, 422.3 from either end to a button, 933.5 between the
      buttons, 31.3 either side of each, 1555.8 to the far outer mark, 123.8 from it to the end and 68.4 and 20.0 from the
      far end; the two marks 933.5 apart carry a button and the other ten are holes (gaps: button-positions).'}
  chassis: {confidence: drawing, note: drawing - 1778.0 long and 55.9 wide. The side view's body is 63.5 deep and the outlets
      reach 81.2; the SKU sheet prints 70.0 x 2.2 x 2.5 in.}
  front: {confidence: drawing, note: 'drawing - the plan view, measured on the raster. From the cord end: the front-entry
      cover, a ground point and two symbol labels, a rating label, a plate with a breaker and its label, three groups of six
      outlets (three HDOT Cx then three HDOT C13, detail A) with a blank plate before the second and third, a blank panel,
      a second plate with a breaker and three more groups with a blank plate before the second and third. The outlet centres
      and pitches are the 3A06''s, which the HDOT module of this chassis shares: Cx 26.65 apart and C13 21.25, the C13 triplet
      spaced at the standard recess 22.0 about its middle. Across, the outlets sit where the 3A06''s do (a stand-in). The
      labels and the ground point are read to about 2 mm.'}
  numbering: {confidence: estimated, note: 'estimated - outlet #1 is opposite the power input (the sheet), so the far end
      is 1 and the cord end 36, as the 3A06 prints. The numbers under the outlets are not legible on this raster; the order
      is the 3A06''s.'}
  breakers: {confidence: drawing, note: 'drawing - the wiring schematic draws two breakers (CB), the cord side one feeding
      the first three groups and the far one the last three, each two-pole across L1 and L2/N. The sheet says two 2-pole 20
      A trip breakers, 10 kAIC (North America) and 5 kAIC (rest of world). Which group each blank plate belongs to is read
      from the schematic.'}
  capability: {confidence: datasheet, note: 'datasheet - the sheet lists Communications & Security as Not Applicable and no
      monitoring, so `metering-scope: none` and `outlet-switching: false`; no outlet declares a state.'}
  outlets: {confidence: datasheet, note: 'datasheet - the sheet says 18 IEC 60320 C13 and 18 Cx outlets, HDOT Cx a hybrid
      C13/C19 that takes a C14 or a C20 plug. HDOT C13 is drawn as std/c13-outlet@1; the HDOT Cx is servertech/hdot-cx-outlet@1,
      an estimate of the recess (no dimensioned outlet drawing is held).'}
  rear: {confidence: drawing, note: 'drawing - the twelve positions the rear view marks, 391.0 and 453.6 being 31.3 either
      side of the 422.3 button and 1324.4 and 1387.0 either side of the 1355.7 one.'}
  sides: {confidence: drawing, note: drawing - the side view shows a perforated band along nearly the whole length; the other
      side is drawn as its mirror (estimated).}
  ends: {confidence: estimated, note: estimated - the end views show a plate with the cord entry; they are drawn as caps.}
  input: {confidence: datasheet, note: 'datasheet - the SKU sheet prints Input Voltage 230 V, Input Plug IEC 230V/32A 2P+PE
      6Hr, 32 A (32 A rated), 7.3 kW. The cord''s length and gauge and the plug''s face are in no held document (gaps: cord-and-plug).'}
attrs:
  physical: {length-mm: 1778.0, construction: metal strip}
  power: {input-cord: fixed, input-plug: other, input-phase: single, input-voltage-v: 230, input-current-a: 32, input-ac: 'single-phase
      230 V, L1 L2/N PE. The SKU sheet for C3B36RL-EPJE0AT4 prints 230 V, 32 A (32 A rated), 7.3 kW and an IEC 230V/32A 2P+PE
      6h plug.', breakers: 'two two-pole branch breakers, 10 kAIC North America, 5 kAIC rest of world (SKU sheet)'}
  management: {metering-scope: none, outlet-switching: false}
chassis: {width: 55.9, height: 1778.0, depth: 63.5, ru: 40, mount: rack-side, color: '#2b2d30', airflow: passive}
gaps:
- what: cord-and-plug
  scope: [bottom]
  reason: vendor-silent
  note: the sheet names the plug and the drawing marks front and bottom entry, and no held document gives the cord's length
    or gauge or draws the plug's face. Only an entry frame is drawn, at the size of the PRO4X 4G16A's, borrowed.
  wanted: a photograph of the cord and its plug.
- what: button-positions
  scope: [rear]
  reason: vendor-silent
  note: the rear view marks twelve positions and no document says which carry buttons on this SKU; the pair 933.5 apart is
    drawn with buttons.
  wanted: the PRO3X installation guide, or a photograph of the back.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: no dimensioned drawing of an HDOT Cx or HDOT C13 outlet is held; the Cx recess is estimated and the C13 is the standard's,
    so the retention latch above each outlet is not drawn.
  wanted: a dimensioned outlet drawing from Server Technology.
- what: breaker-handle
  scope: [front]
  reason: vendor-silent
  note: the plate shows an opening with a handle behind it and a small legend; only the opening is drawn. The opening is read
    off the raster to about 1 mm.
  wanted: a photograph of a breaker plate.
- what: body-colour
  scope: [front]
  reason: vendor-silent
  note: no document states a colour and no photograph of this SKU is held, so a dark neutral is used.
  wanted: a photograph of this SKU.
- what: end-plates
  scope: [front, top, bottom]
  reason: needs-photo
  note: the end views are small, so the end faces are caps and the front-entry cover is a plate.
  wanted: a close photograph of each end.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the PDU''s 36 outlets, numbered 1 to 36 from the far end
      - 18 HDOT C13 and 18 HDOT Cx in six groups of six'}
  outlet-numerals: {term: Label, role: furniture, index-origin: 1}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'two two-pole branch breakers, each feeding the 18
      outlets of three groups'}
  mounting: {term: Button, role: furniture, index-origin: 1}
  power-input: {term: Cord, role: service, index-origin: 1}
