format: 1
kind: device
name: pro3x-switched-pops-3g01
version: 0.1.0
maturity: modelled
manufacturer: Server Technology
model: PRO3X Switched POPS 3G01
description: 'Server Technology PRO3X Switched POPS 3G01, 0U: a 1778.0 mm strip for a rack''s vertical channel. It has 36
  outlets, 18 HDOT C13 and 18 HDOT Cx, in six groups of six behind two two-pole breakers. A controller panel sits between
  the two banks. The unit meters the input, each branch circuit and each outlet and switches each outlet. The drawing is the
  one for the 230 V 32 A SKU.'
profile: power
provenance:
  method:
    confidence: drawing
    note: FIGURES FROM THE MAKER'S SKU SHEET C3WG36RL-EPJE2MT4, PAGE 5 (headed Drawings), READ FROM A 300 PPI RASTER. The
      sheet draws the strip as the Basic 3A01 sheet does and adds the controller panel between the banks. Positions along
      the strip carry about 1 mm. The controller panel's place and size are read from the front view of the Smart 3C01 sheet
      at 1200 ppi and carry about 2 mm. The three intelligent sheets draw the same strip.
  mount:
    confidence: drawing
    note: '`rack-side`: the strip stands beside a rack''s upright on mounting buttons at the back. The rear view dimensions
      68.4, 20.0 and 98.4 from the cord end. It gives 422.3 from either end to a button and 933.5 between the buttons. It
      gives 31.3 either side of each button and 1555.8 to the far outer mark. It gives 123.8 from that mark to the end, and
      68.4 and 20.0 from the far end. The two marks 933.5 apart carry a button and the other ten are holes (gaps: button-positions).'
  chassis:
    confidence: drawing
    note: drawing - 1778.0 long and 55.9 wide. The side view's body is 63.5 deep and the outlets reach 81.8; the SKU sheet
      prints 70.0 x 2.2 x 2.5 in.
  front:
    confidence: drawing
    note: drawing - the front view, measured on the raster. From the cord end come the front-entry cover and a ground point.
      Then two symbol labels, a rating label, and a plate with a breaker and its label. Then three groups of six outlets,
      three HDOT Cx then three HDOT C13 (detail A), with a blank plate before the second and third. Then the controller panel,
      a second plate with a breaker, and three more groups with a blank plate before the second and third. The outlet centres
      along the strip are read from the sheet's raster, Cx about 26.5 apart and each C13 group 22.0 apart (gap outlet-along-position).
      Across, the outlets sit where the 3A06's do (a stand-in). The labels and the ground point are read to about 2 mm. Each
      outlet has a retention lever, drawn estimated as a block 7.6 long along the strip and 2.0 across, standing 18.3 proud.
      The 7.6 is the peg width read on the side view at 600 ppi. The 2.0 and the place across are scaled from the data sheet
      photograph by the C13 width, 22.0 at the standard recess. Each lever is centred on its peg on the side view (gap outlet-lever).
      Each outlet has a hole by its numeral, 36 in all, read from the data sheet photograph (gap numeral-hole). Each bank
      has two end lugs, six top tabs and six bottom tabs, read to about 1 mm (gap raster-detail). Each top tab has two holes
      and each C13 tab a notch. Each outlet has a bump and a dot on the bottom edge. Each blank plate has a tab and two dots.
      The cover has two screw holes, and the ground point is a ring with a centre dot. A plain plate stands between the controller
      and the far breaker. Each breaker cell holds a framed square and a bar with two dots (gap raster-detail). Each bank's
      housing is full width over its three Cx outlets and 3.0 narrower on each side over its three C13 outlets (gap housing-step).
  numbering:
    confidence: estimated
    note: 'estimated - outlet #1 is opposite the power input (the sheet). So the far end is 1 and the cord end 36, as the
      3A06 prints. The numbers under the outlets are not legible on this raster. The order is the 3A06''s.'
  breakers:
    confidence: drawing
    note: drawing - the wiring schematic draws two breakers (CB). The cord side one feeds the first three groups and the far
      one the last three. Each is two-pole across L1 and L2/N. The sheet says two 2-pole 20 A trip breakers, 10 kAIC (North
      America) and 5 kAIC (rest of world). Which group each blank plate belongs to is read from the schematic.
  capability:
    confidence: datasheet
    note: 'datasheet - the C3WG36RL-EPJE2MT4 sheet lists the key features of a PRO3X Switched POPS PDU, so `metering-scope:
      outlet` and `outlet-switching: true`. Each outlet declares [on, off].'
  outlets:
    confidence: datasheet
    note: 'datasheet - the sheet says 18 IEC 60320 C13 and 18 Cx outlets. HDOT Cx is a hybrid C13/C19 that takes a C14 or
      a C20 plug. HDOT C13 is drawn as std/c13-outlet@1. The HDOT Cx is servertech/hdot-cx-outlet@1. Its recess is the part''s
      own: 30.1 across, from the PRO4X outline drawing''s plan view, and 24.0 along, an estimate. The figures are not read
      from this sheet. The part''s contract states the method and no tolerance. This sheet''s views read the body 5.9 smaller
      across and 6.8 along, so the real tolerance is about 6 mm (gap outlet-size).'
  rear:
    confidence: drawing
    note: drawing - the twelve positions the rear view marks. A seam crosses the rear 119.8 from the cord end, where the side
      seam stands. 391.0 and 453.6 are 31.3 either side of the 422.3 button. 1324.4 and 1387.0 are either side of the 1355.7
      one.
  sides:
    confidence: drawing
    note: drawing - the side view shows two perforated zones with a seam between them. It shows 11 screws along the front
      edge and 2 nubs on the rear edge. The other side is drawn as its mirror (estimated). The 36 lever pegs under the body
      are named in gap side-nubs.
  ends:
    confidence: estimated
    note: estimated - the end views show a plate with the cord entry; they are drawn as caps. The figures are in gap end-plates.
  input:
    confidence: datasheet
    note: 'datasheet - the SKU sheet prints Input Voltage 230 V, Input Plug IEC 230V/32A 2P+PE 6Hr, 32 A (32 A rated), 7.3
      kW. The cord''s length and gauge and the plug''s face are in no held document (gaps: cord-and-plug).'
  controller:
    confidence: estimated
    note: estimated - the controller's size is read from the front view of the Smart 3C01 sheet. Its jacks come from the lower
      Detail A, which has no scale; the part's contract states the method. The Switched and Switched POPS sheets draw the
      same panel small in their front views and carry no controller detail. The notched outline is the part's plate and four
      tabs, two stretches (gap controller-outline).
