gaps:
- what: cord-and-plug
  scope:
  - bottom
  reason: vendor-silent
  note: the sheet names the plug and the drawing marks front and bottom entry. No held document gives the cord's length or
    gauge or draws the plug's face. The entry frame is servertech/pro3x-cord-60309-2pe@1, a shared part that the Basic 3A01
    also places, so it is not changed here. The part draws the frame 29.2 by 33.1, a stand-in taken from the PRO4X cord part.
    The end view on page 5, read at 2400 ppi and 8.25 pixels per mm, shows the frame 26.1 across and 33.8 along. It is 29.7
    across with its side arcs. Its four corner screws stand 27.1 across and 34.9 along, its two mid screws about 42 apart,
    and its centre 32 from the rear edge. The part's frame is 21.6 by 25.5. Its corner screws stand 25.2 across and 20.7 along,
    and its mid screws 30.3 apart. Its centre is 44.2 from the top edge of the bottom view. The part's frame is 4.5 narrower
    and 8.3 shorter than the sheet's, and 12 mm off its place. The sheet's figures carry a tolerance of about 1 mm, so the
    part is wrong by far more than the reading can explain. A new version of the part moves the 3A01's lock, so it is its
    own change.
  wanted: a photograph of the cord and its plug.
- what: button-positions
  scope:
  - rear
  reason: vendor-silent
  note: the rear view marks twelve positions and no document says which carry buttons on this SKU; the pair 933.5 apart is
    drawn with buttons.
  wanted: the PRO3X installation guide, or a photograph of the back.
- what: outlet-size
  scope:
  - front
  reason: needs-drawing
  note: 'no dimensioned drawing of an HDOT Cx or HDOT C13 outlet is held. The sheet''s HDOT detail is drawn at 0.36 to 1 and
    gives no dimension. The Cx recess is the shared part''s own figure, from its contract: 30.1 across, read on the PRO4X
    outline drawing''s plan view, and 24.0 along, estimated as the 26.69 pitch less a 2.7 web. The figures are not read from
    this sheet, and the contract states no tolerance. The sheet''s side and front views read the Cx body 24.2 across and 17.2
    along. The part is 5.9 wider and 6.8 longer, so the tolerance it really carries is about 6 mm. That part is shared by
    the Basic, PRO3X and PRO4X devices that place it. A wrongly drawn shared part gets a new version. A new version moves
    the lock of every device that places it, so it is its own change. The C13 is the standard''s. The retention latch of each
    outlet is drawn estimated (gap outlet-lever).'
  wanted: a dimensioned outlet drawing from Server Technology.
- what: outlet-lever
  scope:
  - front
  reason: needs-drawing
  note: the pictures show a lever at each outlet and no dimensioned drawing gives it. Its 7.6 along the strip is the peg width
    on the side view and its 18.3 reach is the sheet's. Each lever is centred on its peg's centre, read on the side view at
    600 ppi, 2.063 pixels per mm, from the 1778.0 length. The six pegs of the cord-end bank stand at 254.2, 280.9, 307.3,
    334.2, 354.8 and 375.9 mm from the cord end. That is about 2.2 mm nearer the cord end than the outlet centres. The tolerance
    along the strip is about 0.5 mm, one pixel, and four rows read the same within 0.3. Its 2.0 across and its place across
    are scaled from the data sheet photograph by the C13 width, a taken figure. The tolerance across is about 1 mm. The front
    view's top-edge tabs and the side view's pegs may be the same part as the levers, which the held pages do not settle.
  wanted: a dimensioned drawing of the HDOT outlet module with its lever.
- what: raster-detail
  scope:
  - front
  reason: needs-drawing
  note: 'the sheet draws the bank lugs, the edge tabs, the cover screw holes and the plain plate as a 300 ppi raster. Each
    source pixel is about 1 mm: 1778.0 spans 3668 pixels at 600 ppi, 0.485 mm per pixel. The tolerance is about 1 mm on every
    place. Each top tab has two holes, 1.6 across and about 10 apart, and each C13 tab has a notch 4.4 by 1.4. Each outlet
    has a bottom-edge bump 3.9 by 4.2 and a dot 3.0 to 3.3 across. Each Cx outlet also has a ring 1.6 across. Each blank plate
    has a tab 3.3 by 10.9 on its far edge and two dots 1.5 across on its bottom edge. The lugs are 8.3 and 7.3 by 4.6, and
    the top edge tabs 9.7 across. Each lug stands 2.4 inside its bank''s far edge, as the sheet draws it. Each breaker cell
    holds a framed square and a bar with two dots. They are read on a 2400 ppi render at 8.252 pixels per mm, from the 1778.0
    length. The frame is 17.4 across and 17.4 along. The bar''s head is 3.8 across and 6.7 along, on a stem 2.8 along, with
    dots 2.8 and 2.0 across. The tolerance is about 1 mm, one pixel of the raster.'
  wanted: a dimensioned front view of the strip.
- what: numeral-hole
  scope:
  - front
  reason: needs-photo
  note: the data sheet photograph shows a hole by each numeral. It is 1.6 across and 4.3 before the numeral toward the far
    end. The scale is 0.067 mm per pixel. It is set by the model's 22.0 outlet pitch between numerals 22 and 23, a taken figure.
    The tolerance is about 1 mm on the place and 0.5 mm on the 1.6. It is drawn at 50.4 across, clear of the numeral window,
    which is estimated wider than the numeral.
  wanted: a dimensioned drawing of the outlet module.
- what: controller-outline
  scope:
  - front
  reason: needs-drawing
  note: the front view draws the controller plate with a notched outline of two wider stretches. They are 31.0 along over
    the display and 21.3 along over the jack group. Each stretch reaches the strip's wall, 1.9 beyond the narrow outline on
    both sides. The part's plate is the narrow outline and each stretch is a tab beside the bay, four in all. The plate's
    edge has a notch 1.5 along and 1.2 deep at each end of each stretch, 8 in all. It has 4 notches near the ring end and
    a lip 5.0 along and 2.0 deep at each side of the cord end. They are read on the 600 ppi raster at 0.485 mm per pixel and
    on a 1200 ppi crop at 0.242. The source raster is 300 ppi, so the crop adds no resolution. The tolerance is about 1 mm in
    depth and along.
  wanted: a dimensioned drawing of the PRO3X controller panel.
- what: housing-step
  scope:
  - front
  reason: needs-drawing
  note: 'the front view draws each bank''s housing stepped where the Cx outlets change to C13: 3.0 narrower on each side over
    the three C13 outlets, with a bump of 6.0 along back to full width between them. The step is drawn square, though the
    sheet slopes it over about 3 mm. Decor draws a rect, circle, d-sub, slot or octagon and no sloped edge (device schema,
    decor `shape`). The tolerance is about 1.5 mm for the step''s place along and 0.5 mm for its depth.'
  wanted: a dimensioned front view of the strip.
- what: side-detail
  scope:
  - left
  - right
  reason: needs-drawing
  note: the side view is a 300 ppi raster. The dot grid is read at 4.5 pitch with a 2.0 dot, in two zones and a seam. The
    11 screws and 2 nubs are read to a tolerance of about 1 mm, and the pitch to 0.2 mm.
  wanted: a dimensioned side view of the strip.
- what: side-nubs
  scope:
  - left
  - right
  reason: needs-drawing
  note: the side view on page 5 shows each nub standing 6.9 beyond the body's rear edge. It also shows 36 lever pegs standing
    under the body, beyond the side face. A face is the body's width, so no shape draws what stands beyond it. Each nub is
    drawn as a footprint inside the face, along the rear edge. The pegs are drawn on the front, 18.3 proud (gap outlet-lever).
    The footprint has a tolerance of about 1 mm. The side view also shows a box under each breaker, about 62 along and 9.7
    below the body. The boxes stand from 175.9 to 237.6 and from 1103.8 to 1165.8 from the cord end. A thin bar about 33
    along, 12.6 below the body, lies under each box. It stands from 187.0 to 220.2 and from 1115.9 to 1148.9. A flat bar
    about 52 along and 2.9 below the body stands under the cover. Under the body from 887 to 1025 the view shows five small
    items. A thin bar stands from 887.1 to 905.5, 2.9 below the body. Two nubs about 3 wide stand at 931.2 and 945.7, 1.9
    below. A longer bar stands from 976.2 to 1005.3, 1.9 below to 988 and 2.9 below beyond. A small round stands from 1016.0
    to 1023.7, 3.9 below. Depths are measured from the centre of the body's bottom line. These figures are read on 1800 and
    2400 ppi renders at 6.19 and 8.25 pixels per mm, from the body's 1778.0 length. The box positions carry a tolerance of
    about 4 mm, the spread of three readings of the raster. The other figures carry about 1.5 mm along and 1 mm below. They
    stand beyond the face too, so none is drawn.
  wanted: a side view that allows features beyond the body.
- what: body-colour
  scope:
  - front
  reason: vendor-silent
  note: the PRO3X data sheet's photographs (pages 1 and 2) show white outlet modules, a black plate and a silver side. None
    is of this SKU. The library's dark neutral is drawn on every face, as on the sibling devices.
  wanted: a photograph of this SKU, and the maintainer's word on drawing the colours.
- what: end-plates
  scope:
  - front
  - top
  - bottom
  reason: needs-photo
  note: the end views on page 5 are small, so the end faces are caps and the front-entry cover is a plate. At 2400 ppi, 8.25
    pixels per mm, the cord-end view reads 56.3 across and 63.7 deep between its wall lines. Each cap is drawn 55.9 by 63.5,
    the body's own size. The nub stands beyond the cap and the entry frame is a part, so each has its own gap (side-nubs,
    cord-and-plug). The tolerance is about 1 mm, one pixel of the raster.
  wanted: a close photograph of each end.
- what: outlet-across-position
  scope:
  - front
  reason: needs-drawing
  note: the sheet's front view carries no dimension across the strip. The outlets keep the 3A06 drawing's places across, a
    stand-in. Read off the sheet's raster at 0.121 mm per pixel, the outlet bodies' top edges agree with that place within
    about 1 mm. The housing lines sit 4.9 nearer the top edge, and the housings are drawn there. That reading has a tolerance
    of about 1 mm.
  wanted: a dimensioned front view of the HDOT module.
- what: outlet-along-position
  scope:
  - front
  reason: needs-drawing
  note: the outlets' centres along the strip are read from the sheet's front view at 600 ppi, 0.485 mm per pixel, from its
    1778.0 length. Cx outlets read about 26.5 apart and C13 outlets about 21.0. The C13 part is 22 along, so each C13 group
    is spaced 22.0 about its mean, within 1.1 mm of the centres read. They differ from the 3A06 drawing's places, which the
    sibling devices keep. The plates and the housings' cord-side edges are read the same way. The tolerance is about 1 mm
    along.
  wanted: a dimensioned front view of the HDOT module.
- what: outlet-numbering
  scope:
  - front
  reason: needs-photo
  note: the numbers printed under the outlets are not legible on the raster. The order is the 3A06's, from 1 at the far end
    to 36 at the cord end. No figure is read, so the tolerance is the order itself, which the sheet's text confirms only
    for outlet 1.
  wanted: a photograph of the front.
- what: label-positions
  scope:
  - front
  reason: needs-photo
  note: the ground point and the two symbol labels at the cord end are read off the raster to about 2 mm.
  wanted: a close photograph of the cord end.
- what: other-side
  scope:
  - left
  - right
  reason: vendor-silent
  note: the sheet shows one side of the strip, so the other is drawn as its mirror. It has the
    left side's figures and their tolerance of about 1 mm. No held page shows whether the right side differs.
  wanted: a photograph of the other side.
- what: controller-scale
  scope:
  - front
  reason: needs-drawing
  note: the lower Detail A of the Smart 3C01 sheet draws the panel with no scale or dimension. The panel's 52.0 by 141.6 is
    read from the sheet's own front view, dimensioned at 1778.0 long, at 1200 ppi. The window, keys and holes are read there
    too. The jacks' places are the detail's, fitted to that size by 0.982 across and 1.018 along. Each figure has a tolerance
    of about 1 mm.
  wanted: a dimensioned drawing of the PRO3X controller panel.
- what: lcd-content
  scope:
  - front
  reason: vendor-silent
  note: the sheet says a multi-colour LCD and states no character count or rows, so it is drawn as a window with no display
    kind.
  wanted: the PRO3X user guide.
