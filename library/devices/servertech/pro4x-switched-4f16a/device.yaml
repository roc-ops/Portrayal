format: 1
kind: device
name: pro4x-switched-4f16a
version: 0.1.0
maturity: modelled
manufacturer: Server Technology
model: PRO4X Switched 4F16A
description: >-
  Server Technology PRO4X Switched, 0U: a 1778.2 mm strip for a rack's vertical channel.
  It has 36 outlets, 12 HDOT C13 and 24 HDOT Cx, in two banks of eighteen either side of a controller panel.
  The panel has a colour LCD, two Ethernet ports, a PDU link port, a sensor port and USB ports.
  Each bank has three branch breakers, and neighbouring outlets sit on different breakers.
  It is the Switched unit of the 16 A family the maker's outline drawing is titled for.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      THE FACES ARE THE 4G16A'S, READ FROM THE SAME DRAWING. The maker's outline drawing 810-03-1596-00 is titled
      C4x36RA-GPBD2FE1 and this family's SKU page lists it, the wiring diagram 810-04-1596-WYE and a stencil and a
      3D model of the same title, so one outline serves the four families. No held photograph or drawing is
      specific to this family: the one photograph is a single generic image (the same file on all four family
      pages), so the controller panel is taken to be the 4G16A's (gaps: family-faces).
      FIGURES FROM THE MAKER'S VECTOR DRAWING. Server Technology outline drawing 810-03-1596-00 rev A (sheet 1,
      11-Dec-2021) draws the strip lying down, cord end left, with a plan view, a rear view above it, a side
      view and an end view, and a detail A of the outlets. Its views are paths, so positions were read off the
      PDF's geometry at 0.42483 pt/mm, the scale that puts the 1778.2 overall on the strip; the 68.4, 88.4,
      422.4 and 1555.8 button dimensions land within 0.9 mm at it. The library draws the PDU STANDING, cord
      end down, so a position along the drawing becomes 1778.2 minus that, and a position across becomes x.
      The STEP model in the maker's archive was not read: no reader for it is held.
  mount:
    confidence: drawing
    note: >-
      `rack-side`: the strip stands beside a rack's upright on mounting buttons at the back. The outline
      dimensions eleven positions along the back; the maker's mounting data sheet says a kit is two
      buttons, and a PDU wider than 45 mm takes two kits. Which positions carry buttons on this SKU is
      not stated, so the pair 1555.8 apart, the dimensioned one, is drawn (gaps: button-positions).
  chassis:
    confidence: drawing
    note: >-
      drawing - 1778.2 long and 55.9 wide. The side view's body is 63.5 deep; the outlets stand about 14.4
      beyond it, which makes the 77.9 callout. THAT READING IS FROM THE SIDE VIEW'S GEOMETRY, not a label.
  front:
    confidence: drawing
    note: >-
      drawing - the plan view. From the cord end: an end plate with the cord entry, the label panel, a
      three-breaker module, 18 outlets in groups of 3, 6, 6 and 3, the controller panel, a second
      three-breaker module and 18 more outlets in the same groups. Outlet positions are the centres of
      each outlet's lamp window; the C13 pitch is 21.18 and the HDOT Cx pitch 26.69, measured from the
      paths and not dimensioned. THE STANDARD C13 RECESS IS 22.0 ALONG, WIDER THAN THE 21.18 PITCH, so
      each C13 triplet is spaced at 22.0 about its drawn middle, up to 0.8 mm off the drawn centres.
  numbering:
    confidence: drawing
    note: >-
      drawing - read from a render, not text extraction. Detail A prints 36, 35, 34 at the cord end and 19
      beside the controller; the far bank prints 18 beside the controller and 1 at the far end.
  breakers:
    confidence: drawing
    note: >-
      drawing - the wiring diagram 810-04-1596-WYE rev A draws two banks of three two-pole breakers
      ("MONITORED OCPs"), each bank feeding 18 outlets. Its drops alternate three colours along a bank, so
      each outlet is on the breaker its position leaves after three, 1 2 3 1 2 3 from the bank's cord side;
      the data sheet lists "Alternating Phase Outlet Technology".
      Which breaker takes which line is not labelled and is not stated.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the PRO4X data sheet's family table gives Switched individual outlet control, input current monitoring and
      branch circuit protection and no per outlet power monitoring, and the SKU page prints Outlet Monitoring None and
      Branch Monitoring Current (A). So `metering-scope: branch` and `outlet-switching: true`, and each outlet
      declares [on, off].
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the PRO4X data sheet says HDOT Cx is a hybrid of the IEC C13 and C19 and HDOT C13 is
      its C13. The twelve HDOT C13 are drawn as std/c13-outlet@1 (the retention feature is not drawn).
      The HDOT Cx is servertech/hdot-cx-outlet@1, an estimate: no dimensioned outlet drawing is held.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view dimensions 68.4 and 20.0 from the cord end, 1555.8 between the outer pair,
      31.3 either side of marks at 422.4 and 1355.9, and 68.4 and 20.0 from the far end: eleven positions.
  sides:
    confidence: drawing
    note: >-
      drawing - the side view shows a perforated area along the back half of one long side, from 48.9 to
      1756.8, 29 deep. The other side is drawn as its mirror (estimated).
  ends:
    confidence: estimated
    note: >-
      estimated - the end views show a plate with the cord entry at one end and two screws at the other.
      The cord end's entry frame is drawn from its end view; no view shows the cord itself, so none is drawn.
  input:
    confidence: datasheet
    note: >-
      drawing and datasheet - the wiring diagram titles the unit 3PH WYE and draws a plug with L1, L2, L3,
      NEUT and GND. The SKU page for C4W36RA-GPBD2FE1 prints Input Plug Type "230/400 32A & 240/415V Wye 30A
      IEC 60309 3P+N+G 6Hr", 415 V, 30 A (24 A rated), 17.3 kW and Input Cord Location Bottom/Angled; the
      drawing serves five SKUs and the other four print other plugs, so only this SKU's is stated. The fixed
      cord is one part at the cord end, drawn as the end view shows its entry frame (29.2 across), and every
      outlet is fed by it. The cord's length and gauge and the plug's face are in no held document (gaps:
      cord-and-plug).
attrs:
  physical:
    length-mm: 1778.2
    construction: metal strip
  power:
    input-cord: fixed
    input-plug: other
    input-phase: three
    input-wiring: wye
    input-ac: >-
      three-phase wye, L1 L2 L3 N PE. The SKU page for C4W36RA-GPBD2FE1 prints 415 V, 30 A (24 A rated), 17.3 kW
      and an IEC 60309 3P+N+G 6h plug.
    breakers: six two-pole branch breakers, 10 kAIC (SKU page)
  management:
    metering-scope: branch
    outlet-switching: true
    network-module: PRO4X controller
chassis: {width: 55.9, height: 1778.2, depth: 63.5, ru: 40, mount: rack-side, color: '#2b2d30', airflow: passive}
gaps:
- what: family-faces
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    the maker's outline drawing 810-03-1596-00 is titled C4x36RA-GPBD2FE1, so its body, outlet layout and cord
    end are the maker's own for all four 16 A families. The controller panel is the 4G16A's part, drawn from the
    one photograph that is the same file on all four family pages. No held document says this family's panel
    looks like the 4G16A's, so it is borrowed and unverified here.
  wanted: a photograph of this family's controller panel, or the PRO4X user guide.
- what: metering-scope-source
  scope: [front]
  reason: vendor-silent
  note: >-
    `metering-scope: branch` is read from the SKU page, which prints Branch Monitoring Current (A). The data
    sheet's family table gives input monitoring only for this family.
  wanted: the PRO4X user guide, to say what the branch monitoring covers.
- what: cord-and-plug
  scope: [bottom]
  reason: vendor-silent
  note: >-
    the SKU page names the plug and the outline drawing marks the cord entry, and no held document gives the
    cord's length or gauge or draws the plug's face. Only the entry frame is drawn. The held 3D archive was
    not read: no reader for a STEP file is held.
  wanted: the SKU's own data sheet or a photograph of the cord and its plug.
- what: button-positions
  scope: [rear]
  reason: vendor-silent
  note: >-
    the rear view marks eleven positions and no document says which carry buttons on this SKU. The pair
    1555.8 apart is drawn with buttons and the rest as holes.
  wanted: the PRO4X installation guide, or a photograph of the back.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: >-
    no dimensioned drawing of an HDOT Cx or an HDOT C13 outlet is held. The Cx recess is estimated and the
    C13 is the standard's, so the maker's retention feature is not drawn.
  wanted: a dimensioned outlet drawing from Server Technology.
- what: lcd-content
  scope: [front]
  reason: vendor-silent
  note: >-
    the data sheet calls the screen a high-resolution full-colour LCD and states no character count or rows.
    It is drawn as a window with no display kind.
  wanted: the PRO4X user guide.
- what: port-names
  scope: [front]
  reason: vendor-silent
  note: >-
    no held document labels the controller's jack stacks. The stack by the LCD is taken as Ethernet from the
    data sheet's list, and the other as the link and sensor ports in its order.
  wanted: the PRO4X user guide or a close photograph of the controller.
- what: breaker-handle
  scope: [front]
  reason: vendor-silent
  note: >-
    the outline shows a rectangular window per breaker and no document names or draws its handle, so only
    the window is drawn. Which line a breaker takes is not labelled either.
  wanted: the PRO4X user guide or a photograph of a breaker module.
- what: lamp-colours
  scope: [front]
  reason: vendor-silent
  note: >-
    the data sheet says R/G/B outlet and breaker indicators without saying which colour means what, so the
    lamp windows are drawn unlit and no state is given.
  wanted: the PRO4X user guide.
- what: wordmark-and-end-plates
  scope: [front, top, bottom]
  reason: needs-photo
  note: >-
    the label panel's wordmark is not reproduced, the cord-end bevel is a silhouette not drawn, and the end
    views are read at low resolution, so the end faces are caps with the cord entry only.
  wanted: a close photograph of each end.
- what: body-colour
  scope: [front]
  reason: vendor-silent
  note: >-
    no document states a colour. The only photograph is a generic strip image, not this SKU's, so a dark
    neutral is used.
  wanted: a photograph of this SKU.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the PDU''s 36 outlets, numbered 1 to 36 as printed from the far end - 12 HDOT C13 and 24 HDOT Cx in two banks of eighteen, each switchable'}
  outlet-numerals: {term: Label, role: furniture, index-origin: 1}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'six two-pole branch breakers in two banks of three, each feeding every third outlet of its bank'}
  controller: {term: Module, role: management, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
  power-input: {term: Cord, role: service, index-origin: 1}
