# WHAT THIS PROJECT NEEDS TO RUN, IN THE ONE PLACE A TOOL LOOKS FOR IT.
#
# There was no pyproject, no requirements at the root, no lockfile and no
# Makefile; the dependency list lived in a step of gates.yml, and README said
# "standard library only" while the linter imported pyyaml and jsonschema. A
# contributor's first command had nowhere to come from (#178).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portrayal"
version = "0.2.0"
description = "Hardware devices as declarative SVG: a library, a compiler and the gates that keep them honest"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Jason Patterson", email = "jpatterson@portrayal.dev"}]
requires-python = ">=3.12"
# WHAT THE TOOLS THEMSELVES IMPORT, and nothing else. `lint` and the indexers
# need a YAML parser and a schema validator; that is the whole of it, which is
# why the lint CI job installs these two and runs in under a minute against the
# suite's several tens of megabytes of wheels.
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/roc-ops/Portrayal"
Issues = "https://github.com/roc-ops/Portrayal/issues"

[project.optional-dependencies]
# DERIVED BY WALKING EVERY TEST MODULE'S TOP-LEVEL IMPORTS one hop through the
# local modules, rather than by guessing. A module-scope import in a collected test file is
# a COLLECTION ERROR, so a missing one takes the suite down rather than skipping
# a file.
#
# PYTEST BELOW 9.2, UNTIL pytest-xdist CATCHES UP. 9.2 builds a test's `nodeid`
# from a new field, and xdist 3.8 still groups a test by rewriting the old one,
# so under 9.2 every `xdist_group` runs as plain `load` - with nothing failing.
# CI picked 9.2 up on its release (2026-10-27) and the full-lint readers went
# from one lint to three at once. 9.1.1 was CI's last good version.
# `test_an_xdist_group_reaches_the_scheduler` (test_onebuild.py) fails by name
# on a version that breaks the rename, so lifting this pin is safe to try.
test = ["pytest>=9.0,<9.2", "pytest-xdist", "pillow", "numpy"]
# Rasterising the DCIM elevation images. Imported lazily, so a build that passes
# `--no-raster` needs none of it.
render = ["cairosvg"]
# The machine that converts vendor PDFs, which may be a different and beefier
# box - see spec/tools/intake/requirements.txt for why, and the
# portrayal-vendor-intake skill for the workflow.
intake = ["docling>=2.0", "pillow>=10.0", "DracoPy", "numpy", "opencv-python-headless"]
# The measurement benchmarks under spec/tools/portrayal/bench*.py. `mlx-vlm` is
# Apple-silicon only and is deliberately absent: it cannot install on a Linux
# runner, and every tool that uses it imports it lazily.
bench = ["ultralytics", "opencv-python-headless", "numpy", "pillow",
         "rapidocr-onnxruntime"]

[project.scripts]
portrayal = "portrayal.__main__:main"

[tool.setuptools]
# THE PACKAGES LIVE WHERE THE TOOLS HAVE ALWAYS LIVED. `package-dir` maps each
# directory to its import name, so `import portrayal` resolves without moving
# fifty files and without a doc having to learn a new path.
#
# `spec/tools/intake` becomes `portrayal_intake` rather than `intake`, which is
# a real package on PyPI, and rather than a subpackage of `portrayal`: the
# intake tools convert vendor PDFs on what may be a different and beefier box,
# and none of the gates need any of their dependencies. A sibling says that;
# `portrayal.intake` would say the opposite.
# THE COMPILER IS THE FIRST ENTRY AND THE OTHERS ARE NOT PART OF IT. What
# `build.sh`, `publish.sh` and CI reach is twenty-one modules; the directory
# held fifty, and no reader or grep could tell which mattered (#179). The
# dependency runs one way - dev, bench and sweeps import the compiler and it
# imports none of them - and test_tools_layout.py asserts that rather than
# trusting it.
package-dir = {portrayal = "spec/tools/portrayal", portrayal_intake = "spec/tools/intake", portrayal_dev = "spec/tools/dev", portrayal_bench = "spec/tools/bench", portrayal_sweeps = "spec/tools/sweeps"}
packages = ["portrayal", "portrayal_intake", "portrayal_dev", "portrayal_bench", "portrayal_sweeps"]

[tool.pytest.ini_options]
testpaths = ["spec/tests"]
# TESTS THAT WAIT ON ONE SHARED RUN GO TO ONE WORKER (spec/tests/onebuild.py).
# `loadgroup` is `load` for every test without an `xdist_group` mark, and does
# nothing at all without `-n`.
addopts = "--dist loadgroup"
# THE TWO TIERS. A pull request push runs `-m "not heavy"`; a full run - the
# dispatch before a merge, the nightly, a fork's pull request - runs everything.
# A test is marked from a measurement (spec/tools/dev/mark_heavy.py), and both
# tiers answer to spec/test-budget.json.
markers = [
  "heavy: five seconds or more per function in a full run; runs at merge time and nightly, not on a pull request push",
]
# A PASSING TEST'S tmp_path IS REMOVED WHEN IT FINISHES, and a clean run removes
# its worker directories; only failures are kept to look at. pytest's default
# keeps every test's directory for the last three runs, and this suite renders
# into them: with several checkouts running it on one machine, the user temp
# directory reached 31 GB and filled the disk mid-run. The shared builds and the
# lint cache live in the run directory's parent (conftest.py), which this policy
# does not touch, so no worker loses them while another still reads them.
tmp_path_retention_policy = "failed"
