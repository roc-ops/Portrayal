  - id: iec-60603-7
    title: "IEC 60603-7 Connectors for electronic equipment - 8-way modular (RJ45)"
    org: IEC
    status: paywalled
    url: https://webstore.iec.ch/publication/2077
    secondary:
      - https://www.te.com/en/products/connectors/modular-connectors.html
    governs: [rj45]
    notes: Governs the plug/jack INTERFACE - the 8P8C contact geometry and mating
      dimensions. It does not govern the panel cutout the library draws. Since
      roc-ops/Portrayal#125 that follows the jack HOUSING (15.8 x 13.2, TE 1734264), because the
      housing is what a panel is cut for. The 16 x 14 this entry used to call for
      verification was the registry's own unsourced aperture and is retired.

