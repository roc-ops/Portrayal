# Portrayal spec-source registry
#
# Canonical list of the standards documents that govern (or will govern) entries
# in schemas/standards.yaml. Intended consumers:
#   - humans chasing a dimension back to its source
#   - the knowledge base (point the ingester at `url` / `mirrors`)
#   - tooling that wants sha256 verification of a local copy
#
# status: acquired  = we hold a verified local copy (working/specs/, NOT committed
#                     - spec PDFs are copyrighted; only facts are transcribed)
#         needed    = identified, not yet acquired/verified
#         paywalled = standard exists but is purchase-only; secondary sources listed
# (conversion to markdown is handled downstream by the knowledge base, not here)
# governs: keys in schemas/standards.yaml this document is authoritative for.
# local paths are relative to the repo-parent working/ dir (never committed).
format: 1
