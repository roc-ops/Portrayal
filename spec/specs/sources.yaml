    org: Linx Technologies / TE Connectivity
    status: acquired
    url: https://www.te.com/usa-en/product-CONSMA001-C-G.html
    local: connectors/te-CONSMA001-C-G/
    governs: [sma, smb]
    notes: Vendor CAD, licensed for design use - NOT redistributable. Confirms the
      SMA 1/4-36 UNS thread (major dia measures 6.448 against nominal 6.35) and
      gives pitch 0.706, threaded length ~4.0, jam nut 7.92 across flats. The SMB
      part shows NO thread at all, which contradicts the S9510-28DC datasheet's
      10-32UNF-2A callout and is why smb dropped to registry confidence.
      Measured on the part in hand; the notes are kept locally, not committed.

