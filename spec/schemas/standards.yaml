      square are dimensioned, now twice over - the ProLabs section A-A the entry has
      always rested on, and LINK-PP's LS-SM311G-10C, which calls 4.7 +/-0.05 out four
      times on an 8.5 +/-0.1 face and is the first TRANSCEIVER-specific source for it.
