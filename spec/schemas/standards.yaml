      into one long wall, the way `lc-duplex-receptacle`'s w/h include its latch tiers.
      THE BODY IS PRINTED, NOT FITTED. DS-SC-000010's front view carries `7.5 -0.0/-0.1`
      and `9 +0.1/-0.0`, and both callouts' witness lines land on the OPENING's walls,
