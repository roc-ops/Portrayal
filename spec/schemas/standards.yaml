    notes: >-
      One bore of a duplex LC receptacle as it appears in a transceiver face, not a
      bulkhead adapter - for the panel-mount part see the lc-duplex-adapter component.
      THE OPENING IS KEYED AND w/h ARE ITS BOUNDING BOX, not a square: this entry was
      4.7 x 4.7 at measured confidence and that described only the first tier (#126).
      The tiers run on one axis, concentric, body outward along the latch. Pitch is the
      centre distance to the bore's partner, so a duplex pair spans pitch plus the body
      width (10.95) and sits inside an 18.35 by 8.50 module face. THE PAIR'S CONFIDENCE
      IS THE WEAKER HALF AND THE HALVES ARE VERY DIFFERENT. w 4.7 and the 4.7 body
      square are dimensioned, now twice over - the ProLabs section A-A the entry has
      always rested on, and LINK-PP's LS-SM311G-10C, which calls 4.7 +/-0.05 out four
      times on an 8.5 +/-0.1 face and is the first TRANSCEIVER-specific source for it.
      That retires the single-source risk this entry carried. h 6.3 is not dimensioned
      by anybody: the three latch tiers take their WIDTHS from the plug that has to
      enter (SENKO DS-LC-000004 dimensions it 3.3 / 4.3 / 2.3 with tolerances, and the
      aperture runs 0.16-0.40 larger at every tier, the clearance traced off SENKO's
      adapter), and their HEIGHTS from what an 8.5 face has room for once the furniture
      around the opening is respected - a bail on the SFP, a receptacle housing on the
      QSFP - split in the proportions traced off that adapter. THAT IS SHORTER THAN THE
      HARDWARE THIS ENTRY IS NOT: a
      bulkhead adapter carries a 3.51 stack in a 9.3 face, and lc-duplex-adapter
      composes this part and so draws the transceiver's shorter slot. Five documents
      draw this receptacle - QSFP-DD HW 6.2.2, SFF-8436 5.10, NTT TR142002 s6, SENKO,
      LINK-PP - and not one dimensions the latch slot; the first three defer to IEC
      61754-20, which is paywalled and unheld, and QSFP-DD Figure 27 fixes lane
      assignment and key orientation rather than the optical axis height. The 6.25 now
      carries four independent agreements -
      the IEC duplex standard, a 6.25 +/-0.05 callout on the ProLabs drawing, the same
      callout on LINK-PP's, and the Smartoptics QSFP-LC stencil master placing its
      optical connection points at Width/3 and 2*Width/3, which is 6.12 on an 18.35
      face. Ferrule diameter is 1.25 by the same standard.
