      MEASURED FROM THE VECTOR PATH AS A CHECK. The front view is one vector path; at the
      scale its printed 22 overall fixes (3.9541 pt/mm), the body comes out 9.285 wide,
      inside 9.4 -0.2, and the opening 7.508 x 9.046 - the printed figures to 0.05.
      THE KEYWAY WIDTH IS PRINTED, ITS DEPTH IS MEASURED. DS-SC-000011's top view
      dimensions a `2.1` slot with a rounded end in the side wall; DS-SC-000010's front
