  mpo-adapter:
    registry: >-
      IEC 61754-7 / TIA-604-5 FOCIS 5 governs the MPO mating interface and is not
      held here (the publisher's preview of IEC 61754-7-1 stops before its
      adaptor table). w/h are DERIVED, NOT READ: the `mpo-plug` envelope
      printed on US Conec C20044 rev B and C20851 rev D, plus the clearance
      measured on SENKO's LC pair (DS-LC-000010 Rev A against DS-LC-000004 Rev
