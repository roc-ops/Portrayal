  vhdci:
    registry: SFF-8441 Specification for VHDCI Shielded Configurations, Rev 14.1 (November 21, 1999), Figure 25 "Fixed mating side dimensions", p.37
    confidence: drawing
    source: >-
      SFF-8441 Rev 14.1, Figure 25, p.37: the fixed (panel) connector has 68
      positions in two rows on a 0.8 pitch (33 places a row), a shell 31.65
      across (basic) round an opening 28.3 +/-0.05 wide, and a female
      screwlock, M2 x 0.4, either side on 37.7 +/-0.1 centres, 3.83 MAX in
      diameter. The shell stands 5.2 +/-0.06 and the screwlocks 5.8 +/-0.11
      in front of the seating surface. The same document says, in its
      description of the connector, that only the 68 position version is
      standardized.
    notes: >-
      NO ENVELOPE IS CLAIMED. The `vhdci` interface cites this entry for what
      the connector is; common/vhdci-receptacle@1, the one part that presents
      it, is photo-measured off a vendor image and states no `conforms`. Its
      measured figures agree with the specification where both give one: an
      opening 28.2 wide against 28.3, a shell 30.9 against 31.65 and screw
      centres 37.2 against 37.7. The cable plug that mates it is `vhdci-plug`.
      A connector of another position count is not in SFF-8441 and is not
      this entry.
