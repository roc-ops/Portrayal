      of SKU 147015, a caliper on one adapter, or a held US Conec/Senko
      mechanical drawing.
  keystone-opening:
    registry: >-
      NOT MEASURED AND NOT READ FROM A STANDARD, AND NOT EVEN A FIBRE
      INTERFACE. A keystone clip is a generic snap-in mounting opening, not a
      connector standard - no IEC or TIA fibre document governs it, and no
      FS render dimensions its panel cutout at all. SKU 143239's three-quarter
      product shot shows only the moulded clip body, not a panel with a
      cutout to measure. 14.8 x 19.3 is the de-facto snap-in keystone jack
      cutout published across keystone-panel vendors' generic cut sheets
      (RJ45, fibre, and blank keystone inserts all share this one opening),
      adopted here for lack of anything FS-specific. The pitch is DERIVED the
      same way as the other four: FS sells this panel with 6 clips, and the
      12x MTP panel's (35510, face-on) 88.8 mm outermost-centre envelope gives
      88.8 / 5 across a 6-across, 5-gap row.
    w: 14.8
    h: 19.3
    confidence: estimated
    pitch: 17.76
    pitch-confidence: estimated
    pitch-kind: floor
    pitch-kind-note: >-
      There is no fibre or mechanical interface standard to be a target
      against - a keystone opening's spacing is purely a function of whatever
      panel it is punched into - and 17.76 is derived arithmetic rather than a
      measured layout, same as st-adapter. Recorded as a floor: FS's own panel
      does not sit tighter than this, nothing more is claimed.
    notes: >-
      EVERY FIGURE HERE IS AN ESTIMATE. Unlike the other four entries, the
      14.8 x 19.3 opening is not even derived from FS's own hardware - it is
      the widely-published generic keystone cutout, carried here because it is
      the only figure available for a form factor with no single owning
      standard. It happens to leave a plausible ~3 mm gap under the 17.76 mm
      pitch, the same kind of real gap 57058's SC adapters showed between
      bodies narrower than their own pitch - which is reassuring but is not
      confirmation, since neither the opening nor the pitch is measured here.
      What settles it: a face-on photograph of SKU 143239's actual panel (not
      just the clip), a caliper, or a manufacturer cut sheet for this specific
      panel.
  lc-duplex-receptacle:
    registry: IEC 61754-20 / TIA-604-10 FOCIS 10 for the duplex pitch; the bore square
      from section A-A of the ProLabs PAN-QSFP28-100GBASE-CWDM4-C datasheet and from
      the LINK-PP LS-SM311G-10C product drawing; the latch tiers from SENKO
      DS-LC-000004 Rev A (the plug) and DS-LC-000010 Rev A (the adapter)
    w: 4.7
    h: 6.3
    confidence: estimated
    pitch: 6.25
    pitch-confidence: verified
    pitch-kind: target
    pitch-kind-note: This is the duplex interface pitch itself, not a layout
      clearance - fixed by IEC 61754-20 / TIA-604-10 FOCIS 10 and corroborated
      four ways in the notes below (the standard, two independent vendor
      drawings, and the Smartoptics stencil master). A part conforming to this
      standard sits ITS bores at 6.25; there is no "wider is fine" reading of
      a keyed mating interface the way there is for a cage-to-cage layout.
    tiers:
      - {name: body, w: 4.7, h: 4.7}
      - {name: neck, w: 3.46, h: 0.42, confidence: conventional}
      - {name: shoulder, w: 4.7, h: 0.49, confidence: conventional}
      - {name: tongue, w: 2.64, h: 0.69, confidence: conventional}
    notes: >-
      One bore of a duplex LC receptacle as it appears in a transceiver face, not a
      bulkhead adapter - for the panel-mount part see the lc-duplex-adapter component.
      THE OPENING IS KEYED AND w/h ARE ITS BOUNDING BOX, not a square: this entry was
      4.7 x 4.7 at measured confidence and that described only the first tier (#126).
      The tiers run on one axis, concentric, body outward along the latch. Pitch is the
      centre distance to the bore's partner, so a duplex pair spans pitch plus the body
      width (10.95) and sits inside an 18.35 by 8.50 module face. THE PAIR'S CONFIDENCE
      IS THE WEAKER HALF AND THE HALVES ARE VERY DIFFERENT. w 4.7 and the 4.7 body
      square are dimensioned, now twice over - the ProLabs section A-A the entry has
      always rested on, and LINK-PP's LS-SM311G-10C, which calls 4.7 +/-0.05 out four
      times on an 8.5 +/-0.1 face and is the first TRANSCEIVER-specific source for it.
      That retires the single-source risk this entry carried. h 6.3 is not dimensioned
      by anybody: the three latch tiers take their WIDTHS from the plug that has to
      enter (SENKO DS-LC-000004 dimensions it 3.3 / 4.3 / 2.3 with tolerances, and the
      aperture runs 0.16-0.40 larger at every tier, the clearance traced off SENKO's
      adapter), and their HEIGHTS from what an 8.5 face has room for once the furniture
      around the opening is respected - a bail on the SFP, a receptacle housing on the
      QSFP - split in the proportions traced off that adapter. THAT IS SHORTER THAN THE
      HARDWARE THIS ENTRY IS NOT: a
      bulkhead adapter carries a 3.51 stack in a 9.3 face, and lc-duplex-adapter
      composes this part and so draws the transceiver's shorter slot. Five documents
      draw this receptacle - QSFP-DD HW 6.2.2, SFF-8436 5.10, NTT TR142002 s6, SENKO,
      LINK-PP - and not one dimensions the latch slot; the first three defer to IEC
      61754-20, which is paywalled and unheld, and QSFP-DD Figure 27 fixes lane
      assignment and key orientation rather than the optical axis height. The 6.25 now
      carries four independent agreements -
      the IEC duplex standard, a 6.25 +/-0.05 callout on the ProLabs drawing, the same
      callout on LINK-PP's, and the Smartoptics QSFP-LC stencil master placing its
      optical connection points at Width/3 and 2*Width/3, which is 6.12 on an 18.35
      face. Ferrule diameter is 1.25 by the same standard.
