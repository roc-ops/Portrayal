      adapter carries two MDC duplex connectors of two fibres each - a
      published figure, not a derivation, and the basis for this part's
      `optical.positions: 4`.
    pitch: 13.4
    pitch-confidence: estimated
    pitch-kind: floor
    pitch-kind-note: >-
      No interface standard is held to fix an MDC panel's adapter spacing at
      all, and 13.4 is derived arithmetic from an inferred row count and an
      averaged envelope, rather than a measured layout - the same reasoning as
      lsh-adapter, whose panel shares this count and whose row layout is at
      least counted off a held render where 147015's is only inferred.
