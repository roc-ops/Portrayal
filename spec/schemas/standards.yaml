  st-adapter:
    registry: >-
      NOT MEASURED AND NOT READ FROM A STANDARD. IEC 61754-2 governs the ST/BFOC
      interface and is not held here, and no face-on render of an FS ST panel
      exists - only a three-quarter product shot (SKU 183380), which
      panel_measure REFUSES outright: its scaled plate height misses the known
      35.05 mm by 87.8%, an order of magnitude past the 3% a face-on render
      clears. The pitch is DERIVED: FS's catalogue line for 183380 lists 6
      adapters, but the render shows them in two rows of 3, not one row of 6 -
      counting rows off a three-quarter shot is not measuring, so the row
      count stands even though no dimension does. A 3-across row spans 2 gaps.
      The envelope such a row fills is bracketed by two face-on siblings:
      35510's outermost centres run 18.50 to 87.34 mm, a 68.84 mm span, and
      57058's run 20.51 to 85.50 mm, a 64.99 mm span (both counted from
      panel_measure's x0 as it then stood, on the plate's rounded corner; a
      span does not depend on where it is counted from) - two measured
      six-per-row panels disagreeing by 5.6%, so ~67 mm +/- 3% is used rather
      than either alone. 67 / (3 - 1) = 33.5.
    pitch: 33.5
    pitch-confidence: estimated
    pitch-kind: floor
    pitch-kind-note: >-
      No interface standard fixes an ST panel's adapter spacing - IEC 61754-2
      governs the bayonet mating geometry, not how many bulkheads sit side by
      side - and this pitch is itself derived arithmetic from a row count and
      an averaged envelope, not even a vendor-measured layout the way
      mpo-adapter's floor is. A floor is the only honest reading of a number
      this soft: it says "FS's own panel does not sit tighter than this,"
      nothing stronger, and a composed layout wider than 33.5 raises nothing.
    notes: >-
      NO APERTURE DIMENSION IS HELD HERE. This entry carried w: 10.0, h: 10.0
      at confidence: estimated until this fix, a plausible round number for a
      bayonet adapter's bulkhead that rested on nothing - and nothing
      declares `conforms: st-adapter`, so L9 never checked it against
      anything. common/st-simplex-adapter@1's own `size: {w: 10.0, h: 10.0}`
      is that same guess, held once on the component rather than twice with
      no comparison between the copies. The pitch is the only figure this
      entry still holds: it at least follows from a row count counted off
      the three-quarter render and an envelope bracketed by two sibling
      panels, which is more than the deleted aperture ever had. What settles
      an aperture: a face-on photograph of SKU 183380, a caliper on one
      adapter, or IEC 61754-2.
      FS also sells 183381, an 8-adapter version of the same panel family. IF
      it follows the same two-row pattern as 382881's 8-adapter FC panel (two
      rows of 4) - which has not been examined, only assumed by family
      resemblance - 67 / 3 = 22.3. That is left as an aside, not a second
      derived pitch: one derived pitch per part actually built here.
      THIS ENTRY PREVIOUSLY RECORDED pitch: 17.76, from an arithmetic error in
      the brief that called 35510's outermost-centre span 88.8 mm when its own
      numbers give 87.34 - 18.50 = 68.84 mm, and from treating 183380 as one
      row of 6 rather than the two rows of 3 the render actually shows. Both
      are corrected above; nothing here was measured either time.
