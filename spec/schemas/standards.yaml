  pcie-bracket-fh:
    w: 120.02
    h: 21.59
    description: >-
      PCI Express standard (full height) add-in card I/O bracket - 21.59 overall
      across, of which the body is 18.42 and the keyed top the rest
    confidence: verified
    registry: PCIe CEM 5.0 fig 11-5 / fig 11-13
    source: >-
      PCI Express Card Electromechanical Specification Revision 5.0, June 2021,
      figure 11-5 "Standard Add-in Card I/O Bracket", page 172, and figure 11-13
      "Detailed Two-Slot I/O Bracket Design", page 181. 120.02 +/-0.38 long;
      connector opening 89.90 by 12.06; tapped hole spacing 85.40; 0.86 +/-0.08
      mm (20 GA) low carbon steel.
      h IS 21.59, NOT 18.42. The body is 18.42 for almost the whole length, but
      the flange end is KEYED - the top 2.84 is the same width and offset 2.54
      sideways, so the outline steps OUT past the body and the overall across
      extent is 21.59. That is what the specification's otherwise unattributable
      21.59 measures, and it is why nothing inside the bracket is 21.59 on its
      own. In inches: body 0.725, key 0.750, offset 0.100, overall 0.850.
      IT IS THE INTERLOCK: slots are on a 20.32 pitch and the part is 21.59
      across, so adjacent brackets interleave by 1.27 at their keyed tops.
      THE OPENING IS NOT THE BRACKET: measuring a photograph gives 89.90 because
      the hole is what the eye finds, and that mistake produced impossible
      per-riser bracket widths before the spec was read. Reading figure 11-5's
      crowded top then produced a second wrong shape - a NECK, the opposite of
      the key - because the extension lines for the four dimensions printed there
      trace like an outline. An extension line runs above the part; an outline
      edge starts at it.
