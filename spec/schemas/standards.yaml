      caliper on one adapter, or IEC 61754-15.
  mdc-adapter:
    registry: >-
      NOT MEASURED AND NOT READ FROM A STANDARD. No IEC part is held here for
      MDC - US Conec and Senko originated and publish the connector, and no
      vendor mechanical drawing for either's adapter is in this corpus. No
      face-on render of an FS MDC panel exists either - only a three-quarter
      product shot (SKU 147015). The pitch is DERIVED: FS sells this panel
      with 12 two-port duplex adapters, and the 12x MTP panel's (35510,
