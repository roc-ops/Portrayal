    pitch-confidence: estimated
    pitch-kind: floor
    pitch-kind-note: >-
      No interface standard is held to fix an MDC panel's adapter spacing at
      all, held or otherwise, and 8.07 is derived arithmetic rather than a
      measured layout - the same reasoning as lsh-adapter, whose panel shares
      this count. Recorded as a floor: the one FS panel on record, not a
      requirement.
    notes: >-
      EVERY FIGURE HERE IS AN ESTIMATE. w: 6.6 is a PROPORTION OF A KNOWN PART,
      not an independent guess: MDC is marketed by US Conec and Senko as
      roughly twice the density of LC duplex in the same panel space, and
      common/lc-duplex-adapter@3's own measured body is 13.2 mm wide for a
