      skin draws the pair stacked.
      THE PITCH IS THE ONLY FIGURE THIS ENTRY STILL HOLDS, AND IT IS THE
      STRONG HALF: 12.71 is the narrowest of a five-gap measurement (spread
      0.51) off 57058's
      six adapters, detected by the blue flange each carries across its top
