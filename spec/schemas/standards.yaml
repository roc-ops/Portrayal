      with a 0.9 key. The 0.1 of width is the fit, and the plus-only tolerance
      on the opening's 9 is what lets a 9 plug pass a 9 hole. A component
      drawing the plug therefore cannot `conforms:` to the receptacle entry -
      L9 allows 0.05 and the width is out by 0.09 - which is why this entry
      exists rather than the plug borrowing the hole's figures.
      THE KEY IS SHORTER THAN ITS SLOT: 1.8 against the receptacle's 2.1,
      0.3 of clearance along the same wall. Neither document tolerances either
      figure; TIA-604-3 (FOCIS 3) or IEC 61754-4 would.
      NO DEPTH. The same catalogue prints 25 from the plug's front face to
      where the boot begins and 36.5 overall, both on one product's side view,
      and they differ across the family (25/33, 25/36.5, 25/55 for the four
      variants on that page) because the length behind the housing is the
      cable assembly's, not the interface's - the same reason `lc-plug` above
      carries no depth. The 25 is used by generic/sc-plug@1 for how far the
      plug stands out of a panel, where it is bracketed and marked estimated.
      HOUSING CORNERS ARE CHAMFERED about 0.5 on the drawn front view and no
      callout dimensions them; a component drawing this profile as a plain
      rectangle is not in conflict with this entry, which holds the envelope.
