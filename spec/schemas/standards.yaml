  fhd-lc-cassette:
    registry: >-
      MEASURED, NOT READ FROM A STANDARD. No published figure governs how FS
      spaces the adapters on an FHD cassette face. The pitch comes from FS's own
      face-on render of SKU 57016 (FHD-1MTP6LCDOS2A), scaled on the 108.97 mm
      FHD module width and validated against the 35.05 mm height to 1.02%: six
      bodies 9.28 wide, centres 21.91 34.86 47.81 60.94 73.89 86.84, pitches
      12.95 12.95 13.13 12.95 12.95, mean 12.985, spread 0.18.
      THE CENTRES ABOVE ARE ROUNDED TO 0.01 AND THE MEAN IS NOT DERIVED FROM
      THEM. Differencing the rounded centres gives a mean of 12.986; the mean
      is (last - first) / 5, so 0.005 of rounding on
      each end carries 0.002 into it, and each gap carries 0.01 into the
      spread. The difference sits inside that, so it is rounding rather
      than disagreement, and the figures here are the unrounded measurement.
      Do not "correct" them from the two-decimal centres - that would be
      deriving a measured claim from rounded inputs.
      THE FIRST READING OF THIS RENDER PUT THE ROW 1.46-1.76 mm FURTHER LEFT:
      20.45 to 85.08, gaps of 12.89 and one 13.07, mean 12.924, which is where
      the 12.92 below comes from. It counted from panel_measure's x0 as the tool
      then stood - a row on the plate's rounded top corner, 1.375 mm inboard of
      the real edge - and scaled on the band's single widest row, 0.475% wider
      than the plate's median one. The figures above are the same render in
      the corrected frame, the one fs/fhd-1mtp6lcd-os2-a@3 carries. The 12.92
      floor is left as it is: a floor 0.065 under the corrected mean is still a
      floor, each gap moved by under half a pixel on this render, and
      fs/fhd-splice-12-lc@2 is laid out on it.
    pitch: 12.92
    pitch-confidence: measured
    pitch-kind: floor
    pitch-kind-note: >-
      A FLOOR, not a target. The bodies do NOT abut - each is 9.28 wide on a
      measured mean pitch of 12.985, leaving a real 3.7 mm gap visible in the
      render (3.64 even at the 12.92 floor) - so 12.92 is not a physical
      minimum the way an abutting pitch would be. It is
      recorded as a floor because nothing in any standard fixes an FHD cassette
      pitch, so a layout WIDER than the one vendor arrangement measured here is
      unremarkable while a narrower one is worth a question.
    notes: >-
      THIS IS NOT THE IEC 61754-20 LC DUPLEX PITCH and must not be confused with
      it. `lc-duplex-receptacle` records 6.25 mm, which is the spacing of the two
      BORES INSIDE one duplex adapter; this is the spacing BETWEEN adapters on a
      cassette face. The parts are different too: FS's cassette adapter is 9.28
      wide with its ports stacked vertically, where common/lc-duplex-adapter@4 is
      13.2 wide with its bores side by side. This entry closes the open question
      at docs/optical-paths-design.md:287, which read 12.90 against our 13.2 as
      though one part had been measured two ways.
