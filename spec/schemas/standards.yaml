# Portrayal standards registry: governed panel-cutout dimensions for common connectors.
# Components declaring `conforms: <key>` are lint-enforced to these dimensions.
# confidence: verified = checked against primary/secondary spec sources;
#             registry = from the compiled reference table, primary source pending.
# w/h/radius: the FACEPLATE APERTURE - the hole in the panel, i.e. what a
#             component's `size` declares and what lint L9 enforces.
# cavity:     the RECESS CROSS-SECTION behind that aperture, when it differs.
#             Absent means a straight bore (cavity == aperture). Present means the
#             opening steps in: the aperture is the hole you punch, the cavity is
#             the box behind it. Components declare it as `relief.size` and point
#             `relief.cavity` at the skin node drawing that silhouette.
# depth: recess depth behind the panel face in mm - what 3D renders as cavity.
# depth-confidence: verified = read from the governing spec (REF dims allowed);
#                   estimated = plausible approximation, refine as specs ingest.
format: 1
standards:
  usb-c:
    registry: USB-IF Type-C
    w: 8.34
    h: 2.56
    radius: 1.28
    confidence: verified
    depth: 6.5
    depth-confidence: estimated
    notes: Full corner rounding per USB Type-C receptacle spec
  usb-a:
    registry: USB 2.0/3.0
    w: 12.0
    h: 4.5
    radius: 0
    confidence: verified
    depth: 13.7
    depth-confidence: estimated
    notes: Rectangular, sharp corners
  micro-usb-b:
    registry: USB-IF Micro-USB Cables and Connectors Spec 1.01
    w: 7.5
    h: 2.75
    confidence: verified
    depth: 5.9
    depth-confidence: verified
    notes: Micro-B receptacle shell, Fig 3-2. The plug interface inside it is
      6.85 x 1.8, which the component draws as its `opening` element - the shell
      is what the panel is cut for, so the shell is what is registered here. No
      radius - the Micro-B shell is a D-profile with two chamfered corners rather
      than a rounded rectangle, and no corner figure is sourced.
  sfp:
    registry: SFF-8432 / INF-8074
    w: 14.5
    h: 10.0
    radius: 0.3
    confidence: verified
    depth: 41.0
    depth-confidence: measured
    notes: Cage body 14.0 x 8.95 (INF-8074/SFF-8432) + panel clearance; source-table
      height of 11.5 rejected as inflated (likely included flange). 1G/10G/25G pluggable.
      Single-port only - at 14.5 wide this cannot gang, since SFF-8433 sets the ganged
      port pitch at 14.25. Use sfp-ganged inside a ganged block.
  rj45:
    registry: TE customer drawing 1734264 rev A2 (RJ45 8P8C side entry, panel ground); IEC 60603-7 governs the plug interface
    w: 15.8
    h: 13.2
    radius: 0.4
    confidence: drawing
    depth: 18.6
    depth-confidence: drawing
    cavity: {w: 11.91, h: 11.2}
    cavity-confidence: drawing
    tiers:
      - {name: body, w: 11.91, h: 6.83}
      - {name: shoulder, w: 6.30, h: 1.69}
      - {name: slot, w: 4.06}
    notes: THE JACK HOUSING, not a panel aperture. This entry was 16 x 14, described as
      the IEC 60603-7 panel cutout at registry confidence, and no source ever gave that
      figure (#61). TE 1734264 dimensions the housing at 15.8 wide (body 15.6 +/-0.3)
      by 13.2 high and 18.6 deep; Amphenol's RJHSE-508X and RJESE-808X read 15.75 x 13.21.
      The plug opening is three tiers - 11.91 x 6.83 body, a 6.30 wide shoulder 1.69 high
      beneath it, a 4.06 wide latch slot running to the housing's lower edge. `cavity` is
      the opening's bounding box from the body's top edge to the housing's lower edge
      (6.83 + 1.69 + a 2.68 slot = 11.2 with the body top 2.0 below the housing top,
      estimated from the drawing at scale). Contact pitch 1.02, eight over 7.14 (detail C).
      A single jack's panel cutout is this housing; a device that punches 16 x 14 for it
      is 0.2 and 0.8 oversize against the only sourced figure.
  qsfp28:
    registry: SFF-8663 Rev 1.7
    w: 20.0
    h: 10.15
    radius: 0.3
    confidence: verified
    depth: 37.0
    depth-confidence: verified
    depth-notes: bezel to connector face 37 REF (SFF-8663 Fig 4-1)
    notes: Recommended bezel opening 20.0 +/-0.1 x 10.15 +/-0.10, R0.3 max, per
      SFF-8663 Rev 1.7 Figure 5-4 (spring-finger EMI, single cage; min pitch 21.0;
      elastomer-gasket variant 20.8 wide, behind-bezel variant 19.5 x 9.7). Prior
      19.0 x 10.0 was uncited. Ganged/stacked rows share cage walls - vendor pitch
      can be narrower than this cutout and than the 21.0 minimum here (TE
      2322551-4 measures 19.0 ganged), so ganged cages
      keep vendor-measured geometry; registry governs the single opening only.
  qsfp56:
    registry: SFF-8663 family
    w: 20.0
    h: 10.15
    radius: 0.3
    confidence: registry
    depth: 37.0
    depth-confidence: verified
    notes: 200G variant; same QSFP cage family, assumed identical bezel opening to
      the SFF-8663 Fig 5-4 spring-finger value. Primary-source check pending.
  qsfp-ganged:
    registry: SFF-8661 Rev 2.5 (QSFP+ module envelope) / TE 2322551-4 ganged cage
    w: 18.5
    h: 9.58
    radius: 0.3
    confidence: measured
    depth: 37.0
    depth-confidence: verified
    depth-notes: bezel to connector face 37 REF (SFF-8663 Fig 4-1)
    cavity: {w: 18.35, h: 8.5}
    cavity-confidence: verified
    pitch: 19.0
    pitch-confidence: measured
    notes: Per-port opening inside a ganged QSFP block. The aperture is the CAGE
      opening 18.50 x 9.58, measured off TE 2322551-4 (a 1x2 ganged QSFP cage,
      40.2 x 14.0 x 71.8); the cavity behind it is the SFF-8661 module envelope
      18.35 x 8.5, which is the invariant mating interface. Ganged pitch is 19.0
      with a 0.50 shared wall - the same part measures its two openings at 96.750
      and 115.750, centres 19.000 apart. Note this beats SFF-8663's 21.0 minimum
      pitch precisely because ganged cages share walls, where standalone cages
      cannot - TE's single-cage 1-2342933-2 is 27.9 wide overall for the same
      18.50 x 9.58 opening. An 18.5 pitch is NOT possible - that is the opening
      width, and would leave no cage wall at all.
  qsfp-dd:
    registry: QSFP-DD MSA
    w: 19.0
    h: 10.0
    radius: 0.3
    confidence: registry
    depth: 37.0
    depth-confidence: estimated
    notes: 400G backward-compatible faceplate interface
  sma:
    registry: SMA (1/4-36UNS-2B)
    w: 6.35
    h: 6.35
    radius: 3.175
    depth: 0.0
    confidence: verified
    notes: Panel hole = 1/4 inch thread major diameter. Thread spec cited by the
      UfiSpace S9510-28DC datasheet ('50 ohm SMA coaxial cable with 1/4-36UNS-2B
      connector for GNSS'); MIL-STD-348 interface drawing verification pending.
      Confirmed by CAD - Linx CONSMA001-C-G profiles a thread band of continuously
      varying radius (2.79-3.22) from z -1 to -5, major dia 6.448 against the
      nominal 6.35, so the panel hole is right. Same part gives the jam nut at 7.92
      across flats (5/16 in, 9.15 across corners), threaded length ~4.0 and overall
      13.6; pitch is 25.4/36 = 0.706. The nut sits outside the hole.
      GNSS/RF antenna jacks.
  smb:
    registry: SMB (snap-on; 10-32UNF-2A panel bushing unconfirmed)
    w: 4.83
    h: 4.83
    radius: 2.415
    depth: 0.0
    confidence: registry
    notes: 4.83 was taken as the 10-32 UNF thread major diameter on the strength of
      the UfiSpace S9510-28DC datasheet ('50 ohm SMB coaxial cable with 10-32UNF-2A
      connector for 1PPS and 10MHz'). CAD does not support it - TE 2477461-1
      profiles as discrete cylinders with NO thread band anywhere (front interface
      3.68 dia, a 9.90 flange, 11.5 overall), which is what SMB should look like,
      being a snap-on interface with no coupling thread. Either the datasheet
      describes a panel bushing rather than the connector, or that part is not
      panel-mount and a panel variant does carry a 10-32 bushing. Confidence
      dropped from verified to registry - 4.83 is retained as the incumbent value,
      not a confirmed one. Compare sma, where CAD did confirm the thread.
  mcx:
    registry: >-
      MCX (IEC 61169-36 / CECC 22220) - bulkhead FRONT-MOUNT panel hole. The panel
      HOLE is variant-independent and this entry is about the hole; what stands in
      front of it is not. A front-mount jack's flange sits proud, and at least one
      vendor here (Casa, confirmed against hardware) uses a variant RECESSED into
      the faceplate. Do not read std/mcx's 2.0 barrel as a property of MCX.
    w: 4.95
    h: 4.50
    radius: 2.475
    depth: 0.0
    confidence: verified
    notes: >-
      Read off the MOUNTING HOLE / PERCAGE PANNEAU inset of the Radiall
      R113.553.000 technical data sheet (issue 9841B04, MCX bulkhead jack
      receptacle, front mount, cylindrical contact) - Radiall originated MCX and
      publishes the panel drawing the series is cut to. The aperture is a D-HOLE,
      not a circle: dimension A, the bore diameter, is 5.00 max / 4.90 min
      (0.197/0.193 in), and dimension B, across the single anti-rotation flat, is
      4.55 max / 4.45 min (0.179/0.175 in). w/h here are the midpoints of those
      two tolerance bands, so w is the full bore and h is the flat-to-arc height.
      Corroborated independently by L-com LCCN3038, an MCX bulkhead jack sold as
      fitting a ".177 inch D hole" - 4.496 mm, inside Radiall's B band.
      The same drawing offers a threaded alternative, a No 10-56 UNS 2B tapped
      hole (major dia 4.826), for panels that are tapped rather than punched; the
      punched D-hole is registered here because it is the one that is a cutout.
      depth 0.0 - like sma and smb this is a hole through sheet metal with the
      barrel standing proud of it, not a recess to look into.
      Casa's own C100G installation guide points at the same specification from
      the other side - Table A-9 gives the UPS 32x4 I/O module's connector as
      "MCX (micro coaxial), 50 ohm, European CECC 22220" - so the vendor whose
      cards this key serves names the standard even though it publishes no
      dimension. Note also that 75-ohm MCX (Casa's BDM 6+12 I/O, Table A-10) and
      50-ohm MCX share one mechanical interface; the impedance is inside the
      connector, not in the panel hole.
  f-type:
    registry: F (IEC 61169-24 / SCTE; 3/8-32 UNEF-2A) - double-D bulkhead panel hole
    w: 9.7
    h: 7.9
    radius: 4.85
    depth: 0.0
    confidence: registry
    notes: >-
      Read off the MOUNTING HOLE inset of the Pasternack PE44327 CAD drawing
      (REV 1.1, 75-ohm F female bulkhead mount, .380 inch DD hole) - 0.380 [9.7]
      across by 0.310 [7.9], a double-D hole with a flat top and bottom, for a
      3/8-32 UNEF-2A threaded neck and a maximum panel of 0.093 [2.4].
      Confidence is `registry` rather than `verified` ON PURPOSE, and the reason
      is a real difference from mcx. The F INTERFACE is standardised - the
      3/8-32 thread is what a plug's nut screws onto, and every F bulkhead
      carries it - but the PANEL HOLE is not: Pasternack alone sells F bulkheads
      for a .380 DD hole (PE44327), a .350 D hole (PE44334) and a .340 D hole,
      and L-com for a .500 D. What every variant has in common is that the hole
      must clear the 3/8-32 major diameter, 9.525. So 9.7 x 7.9 is one sourced
      panel drawing for the mounting style a chassis faceplate uses, not a
      figure the F standard fixes, and a card documented to a different hole
      should say so rather than be forced onto this key.
  drive-25:
    w: 15.0
    h: 69.85
    depth: 100.45
    description: >-
      2.5 inch form factor drive - the drive body, not the bay it sits in nor
      the carrier that holds it
    confidence: verified
    registry: SFF-8201 Rev 3.4 table 2-1
  drive-35:
    w: 101.6
    h: 26.1
    depth: 147.0
    description: >-
      3.5 inch form factor drive - the drive body, not the bay it sits in nor
      the carrier that holds it. Drawn lying flat, which is how a front-loading
      bay presents it, where drive-25 is drawn standing on edge
    confidence: verified
    registry: SFF-8301, the A1/A2/A3 envelope
    source: >-
      SFF-8201 "2.5\" Form Factor Drive Dimensions" Revision 3.4, SFF-TA TWG:
      A4 = 69.85 [2.750] width, A1 = 15.00 [0.591] thickness for the server
      form factor, A6 = 100.45 [3.955] maximum length. Note 1 gives A4+A5 =
      70.10 as the maximum width with tolerance; note 2 a nominal length of
      100.20. A1 also admits 17.00, 15.00, 9.50, 7.00 and 5.00 - 15 is
      registered because that is the height a 2.5 inch hot-swap bay is cut for.
      w AND h ARE THE DRAWN ORIENTATION, NOT THE SPEC'S AXES: the part stands on
      edge at 15.00 across by 69.85 tall, which is how a front-loading server bay
      presents a drive. A bay that lays it down says so with `rotate`.
      THREE DIFFERENT THINGS GET CALLED "a 2.5 inch drive bay" and only this one
      is standard: the chassis OPENING is the chassis's, the CARRIER is the
      vendor's, and the DRIVE is everybody's.
  db9:
    registry: TE 114-40010 Rev G, D-subminiature shell size E (DE-9)
    w: 20.47
    h: 11.40
    radius: 3.35
    confidence: verified
    depth: 6.73
    depth-confidence: estimated
    notes: >-
      The errand fifteen Cisco RSP and RP components have been waiting on: each
      draws its own ALARM OUT connector because there was no std/ part and no key
      here, and cisco/a99-rp3-se's own gap note names exactly this entry as what
      would close it.

      THE APERTURE IS THE SLOT, NOT THE FLANGE. TE application specification
      114-40010 Rev G Figure 3 gives the mounting panel cutout as a D-shaped
      opening 20.47 wide by 11.40 high with 10 degrees +/- 2 of taper on the two
      sloped sides and a 3.35 radius in four places; the shell passes through it.
      The connector's FLANGE is larger and sits on the panel face covering the
      hole - customer drawing C-747905 Rev AB1 puts it at 30.8 x 12.5 for a
      9-position receptacle, with a 16.30 +/-0.25 shell. So a component's `size`
      is 20.47 x 11.40 and what a viewer sees painted on the faceplate is the
      30.8 x 12.5 flange, which is a skin rather than an aperture.

      Mounting holes are a separate feature at 24.99 centres, diameter 3.05
      plain or 4.83 with screwlocks (114-40010) and 3.1 on the part drawing.
      Both documents agree on the 24.99, which is what reconciles them.

      Width is per shell size and this key is the E shell only. 114-40010 also
      gives 33.32 for 15 positions, 47.04 for 25 and 63.50 for 37 - but those
      are the mounting-hole spacings of the A, B and C shells at STANDARD
      density, and searching that 15 row for VGA is the wrong row. See `hd15`,
      which shares this aperture.

      Depth 6.73 is the MATING dimension from Figure 4 - 'needed to ensure full
      mating of connectors' for 9 and 15 position, 6.50 for 25 and 37. It is how
      far a plug engages, not a measured recess, and stands in because neither
      document dimensions the insert's setback from the panel face.
  hd15:
    registry: D-subminiature high density, 15 position, shell size E (HD-15 / DE-15)
    w: 20.47
    h: 11.40
    radius: 3.35
    confidence: verified
    depth: 6.73
    depth-confidence: estimated
    notes: >-
      The VGA connector. SAME APERTURE AS `db9` AND THAT IS THE POINT - high
      density means more contacts in the SAME shell, not a bigger shell, so
      fifteen pins in three rows sit in the size E opening that nine pins in two
      rows do.

      Sourced rather than assumed. Amphenol's High Density D-Subminiature
      datasheet (io_dsub_highdensity.pdf) tabulates its 15-position part at a
      30.81 flange on 24.99 mounting centres; TE's standard-density DE-9
      customer drawing C-747905 Rev AB1 gives 30.8 and 24.99. Identical. The
      same table then puts HD-26 on 33.32 centres and HD-44 on 47.04, which are
      the A and B shells - so the high density line walks the same shell ladder
      with more contacts in each, and the 15-position part is unambiguously on
      the E rung.

      THE 15 ROW OF A STANDARD-DENSITY TABLE IS THE WRONG ROW, which is what
      made this hard to find: DA-15 is fifteen pins in two rows in the A shell
      at 33.32 centres, a different connector that shares only a number. Look up
      D-subs by SHELL, not by pin count.

      Aperture, taper, radius and depth all as `db9` - see that entry for the
      114-40010 Figure 3 derivation and for what is not sourced. The difference
      between the two parts is the insert and the gender, and on equipment VGA
      is a female receptacle where the alarm and serial DE-9s are usually male.
      Neither changes the hole.
  crps-1u:
    registry: CRPS (Common Redundant Power Supply) 1U module envelope
    w: 73.5
    h: 40.0
    confidence: registry
    depth: 185.0
    depth-confidence: measured
    notes: Module envelope for a 1U CRPS power supply, the redundant hot-swap
      form factor used across many switch and server chassis. Recorded here as a
      form factor rather than a bezel cutout - what conforms is the module, and
      the chassis bay is its complement. Confidence is 'registry' deliberately -
      the 73.5 x 40 face is the common CRPS 1U envelope but no CRPS specification
      document is held locally, so it has not been read off a drawing the way
      SFF-8433 was. Depth is measured - a Gospower G1251-0550WNA (P/N
      CRPS0550-AH) photographed flat gives a top-face aspect of 2.559, which at
      73.5 wide puts the depth at 188 against the 185 nominal. That agreement is
      also what corroborates the width - an 84mm-wide module, which is what this
      was estimated at before the photos, would imply a 215mm depth, which is not
      a CRPS length. Depths vary by model (185 and 265 are both common), so treat
      depth as per-part rather than fixed by the form factor.
  sfp-ganged:
    registry: SFF-8433 Rev 0.7 (SFP+ Ganged Cage Footprints and Bezel Openings)
    w: 14.25
    h: 10.4
    radius: 0.03
    confidence: verified
    depth: 41.0
    depth-confidence: measured
    row-pitch: 15.0
    row-pitch-confidence: measured
    notes: Per-port share of a ganged SFP+ bezel slot. Unlike rj45-ganged the ports
      are NOT separated in the bezel - a 1xN assembly gets one continuous cutout,
      C01 = N x 14.25 + 1.2 (1x2 29.7, 1x4 58.2, 1x6 86.7) by C02 10.40 high, corner
      radius C06 0.03 max. So w here is the port pitch B04 (14.25 Basic) and adjacent
      instances abut exactly. Block-to-block cutout pitch is a minimum, not a basic -
      C04 88.00 for 1x6 with external EMI springs, C05 91.25 with an elastomeric
      gasket. Applies to SFP28 too - same cage mechanicals. SFF-8433 covers 1xN only.
      Belly-to-belly row pitch is specified nowhere, so row-pitch 15.0 here is
      measured off TE 2007562-6 (2x6) rather than governed - it is a reference, not
      a conformance requirement, and other cage vendors may stack differently. That
      part also confirms B04 independently (measured 14.25) and puts the cage front
      at 14.00 x 9.50 inside the 14.25 pitch, leaving a 0.25 shared wall. Depth 41.0
      is the bezel-to-connector distance, STEP planes at 40.9-42.7 (SFF-8433 C07/C08
      give 38.9/39.4 to the guide-pin centreline, a slightly different datum).
  rj45-ganged:
    registry: (ganged block aperture - no governing spec found)
    w: 12.7
    h: 11.0
    radius: 0.3
    depth: 16.0
    confidence: measured
    depth-confidence: estimated
    cavity: {w: 11.91, h: 10.5}
    cavity-confidence: drawing
    tiers:
      - {name: body, w: 11.91, h: 6.83}
      - {name: shoulder, w: 6.30, h: 1.69}
      - {name: slot, w: 4.06}
    notes: Per-port opening inside a ganged 2xN RJ45 block, where adjacent ports
      share walls and the pitch (~14.5mm on 48-port 1U faceplates) is narrower
      than the IEC 60603-7 single-port cutout of 16x14. Same relationship as
      qsfp-ganged to qsfp28. Ganged pitch is a standard imperial 0.550 in
      (13.97mm) - measured off the TE 2497310-1 2x6 magjack CAD (autocorrelation
      13.9695, comb fit 13.960) and independently off the ES1010 square-on photo
      (13.99mm) - agreeing to 0.02mm. Vertical row pitch ~12.1mm from the same
      CAD (12.09mm), matching the ES1010 photo's ~12mm; rows are mirrored, not
      translated - the top row is the same part rotated 180. (Which way the keyway
      points is a per-device fact, not settled by the TE CAD.)
      w/h here is the per-port face area between shared walls
      (photo-derived); the cavity behind it is the invariant 8P8C interface, the
      same one as single-port rj45. What ganged blocks differ in is wall
      thickness, which is what sets the row pitch. Depth estimated. The opening
      is the same three-tier 8P8C interface as rj45 (TE 1734264); in a 11.0 cell
      the body top sits 0.5 below the cell's top edge and the slot runs 1.98 to
      its lower edge.
  c14-inlet:
    registry: IEC 60320-1 (C14 appliance inlet, mates C13)
    w: 28.0
    h: 20.0
    radius: 3.0
    confidence: verified
    depth: 13.0
    depth-confidence: estimated
    notes: Standard desktop/switch PSU inlet. Colloquially 'C13 inlet'; the male
      appliance inlet is formally C14. Panel cutout 28.0 +0.2/0 x 20.0 +0.2/0,
      corners max R3, verified against the SCHURTER 6100-3 datasheet (screw-on,
      front-side mounting). The prior 23.5 x 16.0 was uncited and roughly 20 percent
      undersized - it is close to the C14 coupler D-profile, i.e. the cavity rather
      than the aperture, the same confusion std/rj45 had. Around the cutout that part
      carries a 48 x 23 hex flange 2.5 thick on M3 / dia-3.5 screws at 40 centres;
      the C14 boss is 28 x 20.5 standing 5.0 proud and the rear body is 27.5 x 19.5.
      Cutout is series-specific across the C14 range - 28.0 x 20.0 here, 28.5 x 21.0
      for the same part rear-mounted, 29.0 +/-0.10 x 21.5 +/-0.10 on the flying-lead
      series with its 24.6 x 48.6 flange; all max R3 on M3 at 40 centres. Treat
      28.0 x 20.0 as the reference, not as the only legal cutout. Flange and cutout
      are mounting-style specific; the boss and the coupler profile are the IEC
      invariants. Depth 13.0 is still estimated - no drawing dimensions the shroud
      interior, only the whole moulding behind the flange (E 20.5 solder / 23.5
      quick connect on 6100-3, 25.6 on the flying-lead series behind a 2.9 flange).
      Those are total body lengths the way the TE SFP cage measures 63.25 overall
      against 41.0 bezel-to-connector; this field wants the latter kind of number.
      The pins' 12.2 rise in std/c14-inlet encodes the same guess - both want
      calipers.
  c20-inlet:
    registry: IEC 60320-1 (C20 appliance inlet, mates C19)
    w: 32.4
    h: 24.4
    radius: 4.5
    confidence: verified
    depth: 15.0
    depth-confidence: estimated
    notes: High-current datacenter PSU inlet. Panel cutout 32.4 +0.1/0 x 24.4 +0.1/0,
      corners max R4.5, from a SCHURTER C20 dimension drawing. The prior 32.5 x 22.0
      had the width about right but was 2.4 short in height, with the corner radius
      far too tight at 1.0 - R4.5 is a visibly rounded rectangle. Flange 34.9 x 26.9,
      37.9 across the mounting ears. Unlike C13/C14 the C19/C20 coupler profile is a
      plain rounded rectangle, NOT keyed with chamfers - polarity comes from the pin
      layout (earth top centre, line and neutral below). Depth still estimated.
  mpo-adapter:
    registry: IEC 61754-7 / TIA-604-5 FOCIS 5 for the mating interface; footprint
      from US Conec C9857 rev AA and Amphenol 955 series
    w: 14.9
    h: 9.8
    confidence: measured
    depth: 19.8
    depth-confidence: measured
    notes: Panel-mount MTP/MPO bulkhead adapter. w and h are the adapter body
      cross-section, which the cutout has to clear - the governing cutout is in a
      US Conec Technical Note (C9857 rev Y moved it off the drawing) that has not
      been obtained, so read these as the body outline rather than the punched
      hole. Two independent vendor drawings 22 years apart agree on the body (14.9
      against 14.8 by 9.8) and on the full-flange mounting pattern (25.0 wide, 20.0
      hole spacing, 3.1 dia), which is what makes this a footprint and not one
      vendor's shell. They differ on depth (19.8 against 20.6), flange thickness
      (4.0 against 1.7) and reduced-flange width (18.9 against 17.3), so those are
      vendor detail. NOT the QSFP optical interface - a QSFP module face is 8.50
      high and cannot take a 9.8 body, so that interface is a bare MT ferrule
      window and is still unsourced.
  lc-duplex-receptacle:
    registry: IEC 61754-20 / TIA-604-10 FOCIS 10 for the duplex pitch; opening from
      the ProLabs PAN-QSFP28-100GBASE-CWDM4-C datasheet, section A-A
    w: 4.7
    h: 4.7
    confidence: measured
    pitch: 6.25
    pitch-confidence: verified
    notes: One bore of a duplex LC receptacle as it appears in a transceiver face,
