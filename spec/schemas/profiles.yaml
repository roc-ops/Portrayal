# What a device of each class has to STATE before the `specified` capability
# flag is true.
#
# The flag could have been "at least ten attrs". It is not, because a threshold
# is arbitrary and games easily - ten trivia beat five facts, and nobody can
# argue about the number on its merits. The device class already says what
# matters, and `profile:` already exists on the device, so the minimum set is
# declared here per profile: one file to argue about instead of a negotiation
# per device.
#
# This file used to list SPELLINGS. A requirement named a fact and then listed
# the four keys that happened to say it - `power-max`, `power-ac-max-w`,
# `power-max-ac-w`, `power-max-dc-w` - with a comment saying that listing them
# was "the first step to ending it, not permission for more". Ending it is what
# `attrs` sections did (see spec/tools/portrayal/attrsections.py). A requirement now
# names a SECTION, which makes the predicate "states its thermal data" rather
# than "has a key spelled one of four ways" - and the drifted spellings inside
# the sections were normalised in the same pass, so where a key still has to be
# named there is exactly one of it.
#
# THE GRAMMAR
#
#   - section: thermal              the section itself is the fact. Any key in
#                                   it satisfies this. Use it wherever the class
#                                   owes "some data about X" and the vendors
#                                   reasonably differ on which number they give.
#
#   - section: platform             every key listed must be present. Use it
#     keys: [cpu, memory]           where the section is broad and only specific
#                                   facts are owed.
#
#   - section: power                at least one of these. Use it ONLY where a
#     any-of: [power-max-w,         device genuinely may owe one figure or the
#              power-max-ac-w,      other and not both.
#              power-max-dc-w]
#
# `any-of` is for ONE fact that a vendor may state in one of several MUTUALLY
# EXCLUSIVE forms - never for several names for one number, which is the drift
# this file used to institutionalise. There are exactly two here and both meet
# that test:
#
#   maximum power. A box sold DC-only has no AC figure and owes none, and a box
#   whose two figures differ (the S9510-28DC draws 306 W on DC and 301.2 W on
#   AC) would have to invent a combined number to satisfy a single key.
#
#   operating temperature. The airflow SKUs have DIFFERENT ranges - the
#   AS7326-56X is rated 0-45 C front-to-back and 0-40 C back-to-front - so a
#   device states either one range or two, and both spellings are real facts.
#
# The temperature requirement cannot be left as bare `section: thermal`, and
# the AS7726-32X is why: its thermal section holds `fans`, so section presence
# alone reported it as fully specified while the manifest states no operating
# range at all. A section is the right unit for "has data about X" only where
# any key in it IS the fact; where the section also holds the machinery, name
# the fact.
#
# Note what is still deliberately NOT accepted: `power-typical-w` does not
# satisfy the maximum, and `forwarding-rate` (pps) is in the same section as
# `switching-capacity` (bps) but the section is satisfied by either because a
# device stating only one of them has still stated how much it forwards. Where
# that distinction matters, name the key.
#
# A device that declares no `profile:` is not judged against a default set -
# it is reported as unevaluable, and the register carries a `device-profile`
# gap saying so. Inventing a universal minimum would mean asserting that a
# passive optical mux and a 2U switch owe the same facts, which is false.

profiles:

  networking:
    description: a switch, router or aggregation device - the box forwards packets
    requires:
      - section: performance
      - section: platform
        keys: [cpu, memory]
      - section: power
        any-of: [power-max-w, power-max-ac-w, power-max-dc-w]
      - section: thermal
        any-of: [operating-temp, operating-temp-f2b, operating-temp-b2f]

  optical:
    description: >-
      DWDM transport - mux/demux, transponder, amplifier. No CPU or memory is
      owed: a passive mux has neither, and requiring them would make the flag
      unreachable for a whole product class rather than informative about it.
    requires:
      - section: performance
      - section: power
        any-of: [power-max-w, power-max-ac-w, power-max-dc-w]
      - section: thermal
        any-of: [operating-temp, operating-temp-f2b, operating-temp-b2f]
