# Which way a component's watts point, decided once per CLASS.
#
# A power-totalling tool walked an MX chassis and stopped at the craft
# interface: it could not tell "this part draws nothing" from "nobody has said
# what this part draws". Both look identical in a contract - no power key - and
# the difference is the whole answer. A filter contributes zero and a line card
# with no figure makes the total a floor rather than a total.
#
# WHY A CLASS AND NOT A CONTRACT. The obvious fix is a marker on every passive
# part, which is 109 components today and every one added after. But passivity
# is not a fact about a part, it is a fact about a KIND of part: an air filter
# draws nothing because filters have no electronics, not because someone
# measured this filter. Deciding it per class puts it in one file that can be
# argued with, and a contract that says nothing is then answered by its class
# rather than by silence. The escape hatch for the exception is unchanged and
# already exists - a `draw` part that genuinely draws nothing states
# `power-draw-max-w: 0` and says why in provenance.
#
# lint reads this file, so the sets cannot drift from the rule that enforces
# them, and L51 refuses a class that appears in no role - which is how a new
# class gets its power question asked at the moment it is invented rather than
# by a tool falling over months later.
format: 1
roles:

  # CONSUMERS: state `power-draw-max-w` (and `power-draw-typical-w` beside it
  # where the vendor gives one). L27 asks these and warns while they are silent.
  draw:
    - line-card
    - drive
    - supervisor
    - fabric
    # `switch` is here because all three components carrying it are chassis
    # CARDS in rear slots, sitting in the same bays as the io-6p12 cards that
    # are counted. Leaving them out made a C100G's coverage report short by
    # three modules in its denominator.
    - switch
    # `cooling` merged into `fan` (#173). Nine parts carried it - the Casa and
    # Cisco fan trays and Dell's fan module - and every description said fan
    # tray, fan module or fan assembly. The split was by who modelled the part,
    # not by what the part is, and `comparable.py` already had to paper over it
    # with FAN_WORDS = ("fan", "cooling").
    - fan
    - transceiver
    # THE CRAFT INTERFACE, AND THE REASON THIS FILE EXISTS. `display` carries the
    # MX craft interfaces - an LCD, buttons, alarm lamps and a processor behind
    # them. It used to carry only two of the four: the MX240's and MX480's were
    # `display` and the MX2000's and MX960's were `panel`, one kind of part under
    # two names, which #173 merged into `display`. They were in no set, so L27 never asked, so every
    # craft contract is silent, so the totalling tool that stopped at "I don't
    # know how much the craft interface uses" was reading a silence nothing had
    # ever demanded be filled. That is a class-set omission, not a missing token.
    - display
    # a control panel is lamps, buttons and a flex cable to the board. It draws
    # little and no document held here says how little - which is exactly the
    # case this list exists for, because a class in no role is never asked and
    # its silence then reads as zero rather than as unknown.
    - control-panel
    # a network daughter card is silicon and optics: it draws, and Dell publishes
    # no figure for it in anything held here, so the warning is the record.
    - nic
    # a PCIe riser is a board with connectors and, on some variants, a switch.
    # Nothing held here states a figure for one, so the warning is the record.
    - riser
    # a DIMM is silicon on a board: it draws, a few watts each, and nothing held
    # here states a figure per module - Dell publishes system power through a
    # planning tool. The warning is the record, as it is for nic and riser.
    - memory
    # an expansion card is silicon on a bracket, and what a riser is for. No
    # document held here states a figure per card; the warning is the record.
    - expansion-card

  # SUPPLIES: state `power-output-w` and never a draw key - they are opposite
  # signs of one unit, so a sum over both is a category error that reads as an
  # answer.
  supply:
    - psu
    - power

  # PASSIVES: contribute zero, and say so by being of a kind that has no
  # electronics. Nothing is asked of them and a consumer may total them as 0.
  passive:
    # sheet metal, plastic and hardware
    - blank
    - filter
    # AN OPTICAL COUPLER IS GLASS. Smartoptics' OCU modules split or combine
    # C-band power in a fixed ratio with a fused fibre coupler and no electronics
    # at all - ds-ppm-r4.0 gives them a passband, a coupling ratio and an
    # insertion loss, and no power row, in a datasheet that gives every module
    # one where there is one to give. It is deliberately NOT `filter`, which the
    # add/drop and DCM members of the same family carry: a coupler splits power
    # across the whole band and a filter selects a wavelength out of it.
    - coupler
    - ground
    - mechanical
    - mount
    # `fastener` merged into `screw` (#173): its one part was a captive slotted
    # thumb screw, which is what `screw` already held.
    - screw
    - latch
    - ear
    - tab
    # a strain-relief sleeve over the back of a plug - rubber or PVC, no
    # electronics, the same argument as `ear` and `tab` beside it. Not a
    # synonym for anything already here: common/lc-boot@1 is the first part
    # to carry it (pluggables B2, Task 5).
    - boot
    # a PCIe I/O bracket is 20 GA steel and nothing else - the CARD behind it
    # draws, and the card is a different part.
    - bracket
    # a plain front bezel is a sheet of metal with a lock in it. The LCD variant
    # is NOT this class - it carries a display and would draw - which is part of
    # why the two are separate parts rather than skins of one.
    - bezel
    # printing and reference marks - not parts at all, but they carry a class
    - sticker
    - marking
    - silkscreen
    - reference
    # connectors and cages. A cage is a hole with a bezel; the OPTIC in it
    # draws, and `transceiver` is a draw class for exactly that reason.
    - port
    # A terminal block is the same argument as an appliance inlet at the other
    # polarity: dell/dc-terminal-6ryj9 is two bladed openings and a ground stud,
    # and the SUPPLY behind it is what draws. It had a class of its own,
    # `connector`, until #173 read that argument back and merged it here - a
    # note saying "the same argument as `inlet`" is a note saying it IS one.
    - inlet
    # A button is a switch contact. An indicator's draw sits inside the figure
    # of the card that lights it, and at hundredths of a watt it is below the
    # resolution of every published figure in the corpus - counting them
    # separately would add noise to a total, not accuracy.
    - button
    - led
    # an FHD fibre cassette is a faceplate carrying LC and MTP adapters and the
    # fibre between them - glass and a shell, the same argument as `coupler`.
    # `cassette` is a free class name and a future one could hold electronics;
    # if that happens it belongs in `draw` instead rather than widening this
    # one, the same way `bracket` and `panel-blank` stay separate from the
    # active parts they sit beside.
    - cassette
    # an FHD adapter panel is a plate of adapters with no glass behind it at all
    # - each front bore is the mouth of a mating sleeve whose far end is the
    # rear bore - so it is passive for the same reason `port` is. It is not
    # `cassette`: a cassette is one envelope, 117.86 deep with fibre inside, and
    # the FHD tests hold every cassette to that box; a panel is 16-32 deep.
    - adapter-panel
    # a dust cap is a moulded plastic plug that keeps dirt out of an idle
    # fibre port until something is plugged into it - the same argument as
    # `boot` and `blank` beside it, and the same as `port`, which is the
    # receptacle this occupies. Nothing in a cap is electrical; what would
    # draw is the optic that replaces it, and that optic is a different part
    # under `transceiver`. First carried by the four caps of pluggables B3
    # (common/lc-dust-cap@1 and its LC duplex, SC and MPO siblings).
    - cap
