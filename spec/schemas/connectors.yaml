# spec/schemas/connectors.yaml
# Connector interfaces a port can present. A part presenting one is a SLOT
# (B3, docs/pluggables-caps-design.md): it accepts every part whose `mates:`
# names the interface - dust caps and plugs alike. No ladder: a connector
# either intermates or it does not.
#
# AN ENTRY is {standard, note, spans, cover}, every key optional:
#   standard  the standards.yaml entry that holds the interface's figures
#   note      what the interface is, for a reader
#   spans     {interface, count}: this connector fills `count` slots of
#             `interface` at once (a duplex over two bores; see lc-duplex)
#   cover     true for an entry that is NOT a connector but a COVER MOUNT: the
#             place on a part where a cover that ships on it and comes off is
#             fixed (a breaker's touch guard). It seats as a connector slot
#             does - one slot, one occupant, a default - and states no
#             `standard`, because no published interface governs it.
#             Whether cover mounts belong here or in a registry of their own
#             is open (#822); there is one today, breaker-1ru-guard.
format: 1
interfaces:
  lc: {standard: lc-duplex-receptacle, note: one LC bore}
  # SPANS: one lc-duplex connector fills TWO `lc` bores, so a duplex adapter
  # holds two levels of slot for one piece of hardware - its own, and the two
  # bores it composes - and the two are mutually exclusive (B3,
  # docs/pluggables-caps-design.md, "The duplex host"). `interface` names what
  # the spanned parts present and `count` how many of them there must be; the
  # pitch they sit at is this interface's own `standard` in standards.yaml, so
  # no figure is written twice.
  lc-duplex:
    standard: lc-duplex-receptacle
    note: two LC bores at the 6.25 duplex pitch, presented by the adapter itself
    spans: {interface: lc, count: 2}
  sc: {standard: sc-simplex-receptacle}
  rj45: {standard: rj45, note: 'an 8P8C modular jack; generic/rj45-plug@1 mates it (#610)'}
  mpo: {standard: mpo-adapter, note: 'MPO-8/12/24 share the opening; MPO-16 is keyed differently and is not this interface'}
  mpo16: {standard: mpo-adapter, note: 'MTP-16 (TIA 604-18 / FOCIS 18): the MPO opening with the key offset, so an MPO-8/12/24 plug does not mate it'}
  f-type: {standard: f-type, note: 'F (IEC 61169-24, ANSI/SCTE 02), 75 ohm by definition'}
  sma: {standard: sma, note: 'SMA (IEC 61169-15, MIL-STD-348); reverse-polarity SMA does not mate it and is not this interface'}
  smb: {standard: smb, note: 'SMB snap-on (IEC 61169-10); 50 and 75 ohm variants intermate, so impedance is an attr, not the interface'}
  mcx: {standard: mcx, note: 'MCX snap-on (IEC 61169-36); 50 and 75 ohm variants intermate; a recessed variant exists (see standards.yaml mcx)'}
  bnc: {standard: bnc, note: 'BNC bayonet (IEC 61169-8, MIL-STD-348); 50 and 75 ohm intermate, so impedance is an attr'}
  din-1-0-2-3: {standard: din-1-0-2-3, note: '1.0/2.3 push-pull (DIN 41626/2, the standard the HUBER+SUHNER catalogue names; IEC 61169-29 internationally); 50 and 75 ohm variants; spelled with hyphens, an interface may not contain a dot'}
  # AC appliance inlets (#785, docs/connectors-power-design.md). The cord end
  # that mates each is a generic plug; the far end of the cord is not a part.
  iec-c14: {standard: c14-inlet, note: 'IEC 60320-1 C14 appliance inlet; generic/c13-plug@1 mates it. A C15 or C17 connector is a different interface'}
  iec-c20: {standard: c20-inlet, note: 'IEC 60320-1 C20 appliance inlet; generic/c19-plug@1 mates it. A C21 connector is a different interface'}
  iec-c13: {standard: c13-outlet, note: 'IEC 60320 C13 outlet (a PDU socket); generic/c14-plug@1 mates it'}
  # The PDU side (#933): an outlet is a slot for the plug end of a jumper.
  iec-c19: {standard: c19-outlet, note: 'IEC 60320-3 sheet J C19 outlet, a PDU socket; generic/c20-plug@1 mates it. Eaton C39 also takes a C20 and is its own part'}
  saf-d-grid: {standard: saf-d-grid, note: 'Anderson Power Products Saf-D-Grid receptacle (drawing 115171S1 rev 12; no IEC standard governs it); it sits in a C14 cutout but a C13 does not mate it'}
  # USB receptacles (#786, docs/connectors-usb-design.md). The cable plug that
  # mates each is a generic plug; the far end of the cable is not a part. An
  # interface is the connector, not the bus: none states a speed or a USB
  # generation.
  usb-a: {standard: usb-a, note: 'USB Standard-A receptacle (USB 2.0 specification, figure 6-7); generic/usb-a-plug@1 mates it. A USB 3.x Standard-A plug mates the same opening'}
  micro-usb-b: {standard: micro-usb-b, note: 'USB 2.0 Micro-B receptacle (Micro-USB Cables and Connectors Specification 1.01, figure 4-10); generic/micro-usb-b-plug@1 mates it. Micro-AB and the wider USB 3.x Micro-B are different interfaces'}
  usb-c: {standard: usb-c, note: 'USB Type-C receptacle (USB Type-C Cable and Connector Specification, figure 3-1); generic/usb-c-plug@1 mates it, either way up'}
  # D-subminiature and VGA connectors (#787, docs/connectors-dsub-design.md).
  # The hooded cable plug that mates each is a generic plug; the far end of
  # the cable is not a part. GENDER IS PART OF THE INTERFACE: each key names
  # the connector with the gender the library's panel part has, and a panel
  # connector of the other gender would be a different interface with its own
  # key, because the plug that mates it is the other plug.
  db9: {standard: db9, note: 'D-subminiature 9 position, shell size E (DE-9), MALE on the panel: pins, as std/db9@1 draws it; generic/db9-plug@1, a female cable plug, mates it. A female DE-9 on a panel would be a different interface'}
  hd15: {standard: hd15, note: 'High-density D-subminiature 15 position in shell size E (VGA), FEMALE on the panel: sockets, as std/vga@1 draws it; generic/hd15-plug@1, a male cable plug, mates it. The shell is the db9 shell and neither plug mates the other connector. A male HD-15 on a panel would be a different interface'}
  da15: {standard: da15, note: 'D-subminiature 15 position in two rows, shell size A (DA-15), FEMALE on the panel: sockets, as std/da15@1 draws it; generic/da15-plug@1, a male cable plug, mates it. A male DA-15 on a panel would be a different interface'}
  db25: {standard: db25, note: 'D-subminiature 25 position, shell size B (DB-25), FEMALE on the panel: sockets, as std/db25@1 draws it; generic/db25-plug@1, a male cable plug, mates it. A male DB-25 on a panel would be a different interface'}
  # Pluggable terminal headers on a 5.08 mm pitch (#789,
  # docs/connectors-dc-terminal-design.md). An interface is the connector, not
  # the use: the pitch and the number of positions are in the key, and a
  # header feeding power and one carrying a relay contact are the same
  # interface when they are the same header. NOR IS A FLANGE: an interface is
  # the mating face, which a header presents with or without screw flanges
  # and a plug mates with or without them, so there is one five-position key
  # and no `f`.
  terminal-508-2: {standard: terminal-508-2-header, note: 'two-position plain pluggable header on a 5.08 mm pitch (Phoenix Contact MSTBA 2,5/..-G-5,08 and equivalents); generic/terminal-508-2-plug@1 mates it'}
  terminal-508-5: {standard: terminal-508-5-header, note: 'the five-position mating face of a pluggable header on a 5.08 mm pitch (Phoenix Contact MSTB 2,5 and equivalents), which a flanged or a plain header presents and a flanged or a plain plug mates; generic/terminal-508-5-plug@1, the screw-flange plug, mates it, because the one header placed (common/terminal-header-508-5f@2) is flanged'}
  terminal-508-6: {standard: terminal-508-6-header, note: 'six-position plain pluggable header on a 5.08 mm pitch (Phoenix Contact MSTBA 2,5/ 6-G-5,08 and equivalents); generic/terminal-508-6-plug@1 mates it'}
  # The DC barrel jack (#789, docs/connectors-dc-terminal-design.md). ONE
  # INTERFACE, BY RULING: see the note.
  dc-barrel: {standard: barrel-jack, note: 'the library treats the DC barrel jack as ONE nominal connector. Barrel diameters vary by product, and none of the documents held for the four devices that place common/dc-barrel@1 states one, so the interface claims no diameter. The rating is carried as attributes of each placement of the jack (input-voltage, current-max-a) and not by the interface. generic/dc-barrel-plug@1, drawn at the common 5.5 mm barrel, mates it'}
  # Screw and stud terminals a lug lands on (#789,
  # docs/connectors-dc-terminal-design.md section 12). ONE INTERFACE, BY
  # RULING: see the note. The part that presents it is the terminal screw
  # itself, composed once per pole into its block, so each pole is a slot.
  # TURNS: the turns, relative to the seat, at which an occupant may be seated
  # on a slot presenting the interface (#829, docs/connectors-dc-terminal-
  # design.md section 13.4). A ring lug turns freely about its stud, so all
  # four right angles. An interface that names no `turns` allows 0 alone, and
  # a part's own `mate` point may narrow the list (`turns:` on the point), as
  # a barrier block's terminal screw narrows it to 0.
  terminal-stud: {standard: terminal-stud, turns: [0, 90, 180, 270], note: 'the library treats a screw or stud terminal that a lug lands on as ONE nominal connector. Stud and screw sizes vary by product and most placing parts state none, so the interface claims no size; where a document states one it is an attribute of the placement and not of the interface. generic/ring-lug@1, a one-hole insulated ring terminal on its wire, mates it. A two-hole lug across a pair of studs is not this interface: it mates a `stud-pair-*` interface, which spans two of these'}
  # PAIRS OF STUDS ONE TWO-HOLE LUG LANDS ACROSS (#828,
  # docs/connectors-dc-terminal-design.md section 13.7). Each SPANS two
  # `terminal-stud` seats, as `lc-duplex` spans two `lc` bores: a part
  # presenting one composes the two studs at the interface's pitch and
  # presents the pair at their midpoint, and the pair and its two studs are
  # mutually exclusive (L115). THE PITCH IS THE INTERFACE: a two-hole lug is one
  # stamping, so a lug for 5/8 in. centres does not land on studs 3/4 in. apart,
  # and the pitch is in the key. The stud SIZE is not: it is the placement's
  # `stud-size`, as on a single stud. The axis a pair runs on is derived from
  # the order its studs are composed in (manifest.spanning_axis), so one lug
  # serves a pair side by side and one stood on end, and the order says which
  # way the wire leaves. `turns: [0, 180]` (#829): a lug across a pair can lie
  # either way along it, and no other way.
  stud-pair-5-8: {standard: two-hole-lug-5-8, turns: [0, 180], note: 'two studs or tapped holes on 5/8 in. (15.875) centres that one two-hole lug lands across; generic/two-hole-lug-5-8@1 mates it. The ring lug still mates each stud alone', spans: {interface: terminal-stud, count: 2}}
  stud-pair-3-4: {standard: two-hole-lug-3-4, turns: [0, 180], note: 'two studs or tapped holes on 3/4 in. (19.05) centres that one two-hole lug lands across; generic/two-hole-lug-3-4@1 mates it. The ring lug still mates each stud alone', spans: {interface: terminal-stud, count: 2}}
  stud-pair-1: {standard: two-hole-lug-1, turns: [0, 180], note: 'two studs or tapped holes on 1 in. (25.4) centres that one two-hole lug lands across; generic/two-hole-lug-1@1 mates it. The ring lug still mates each stud alone', spans: {interface: terminal-stud, count: 2}}
  # The high-density and telephone connectors (#790,
  # docs/connectors-mrj21-vhdci-rj11-design.md). The cable plug that mates
  # each is a generic plug; the far end of the cable, and any breakout, is not
  # a part.
  mrj21: {standard: mrj21, note: 'TE Connectivity MRJ21 48-position receptacle, six 10/100/1000 Ethernet ports to a connector, as std/mrj21@1 draws it; generic/mrj21-plug@1, the straight cable plug with two jackscrews, mates it'}
  vhdci: {standard: vhdci, note: 'VHDCI 68-position shielded receptacle on a 0.8 mm pitch with a screwlock either side (SFF-8441, Figure 25), as common/vhdci-receptacle@1 draws it; generic/vhdci-plug@1, the thumbscrew cable plug, mates it. The count is not in the key because SFF-8441 standardizes only the 68-position connector, so no other count of it could be on a panel'}
  rj11: {standard: rj11, note: 'the six-position modular telephone jack (6P2C, 6P4C or 6P6C: one body, and RJ11 names the wiring of the first), as common/rj11-jack@1 draws it; generic/rj11-plug@1 mates it. The four-position handset jack and the eight-position rj45 are different interfaces'}
  # The P40 output connector of the Amphenol Network Solutions power panels
  # (docs/connectors-dc-terminal-design.md section 14). A vendor connector:
  # no standard is held for it, so the entry cites none.
  p40: {note: 'the two-pole latching output connector of the Amphenol Network Solutions connectorized power panels, the Amphenol PRM series with 4 mm RADSOK contacts, BATT over RTN. amphenol-ns/output-p40@1 presents it and amphenol-ns/p40-plug@1 mates it. A vendor connector: no standard is held for it'}
  # The rack PDU mounting interface (#934, docs/pdu-model-design.md section
  # 6.2). NOT A CONNECTOR - A MOUNT: the slot is the keyhole in a bracket or a
  # cabinet channel, which presents it, and the button on the PDU's back is
  # the part that mates it. No standard governs it, so the entry cites none.
  pdu-button: {note: 'NOT A CONNECTOR - A MOUNT. The shoulder-style mounting button on the back of a zero-U rack PDU and the keyhole slot that takes it: a keyhole in a bracket or a cabinet zero-U channel presents it, eaton/g4-mounting-button@1 mates it. The Eaton Rack PDU G4 installation and setup guide P-164001156 rev 3, section 2.11, sizes the slot: 11.5 to 12.5 mm in 1.5 to 2 mm sheet (Eaton enclosures), or 14 mm in 3 mm sheet (Tripp Lite racks). No standard governs it'}
  breaker-1ru-guard: {cover: true, note: 'NOT A CONNECTOR - A COVER MOUNT. The face of a 1RU plug-in breaker, where its touch guard screws on; amphenol-ns/touch-guard-1ru@1 mates it. Registered here because a cover that ships on a part and comes off is the same mechanism as a dust cap in a port: one slot, one occupant, a default'}
