# spec/schemas/connectors.yaml
# Connector interfaces a port can present. A part presenting one is a SLOT
# (B3, docs/pluggables-caps-design.md): it accepts every part whose `mates:`
# names the interface - dust caps and plugs alike. No ladder: a connector
# either intermates or it does not.
#
# AN ENTRY is {standard, note, spans, turns, unmated, cover}, every key optional:
#   standard  the standards.yaml entry that holds the interface's figures
#   note      what the interface is, for a reader
#   spans     {interface, count}: this connector fills `count` slots of
#             `interface` at once (a duplex over two bores; see lc-duplex)
#   turns     the turns, in degrees, relative to the seat, at which an occupant
#             may be seated on a slot presenting the interface (see
#             terminal-stud); an interface that names none allows 0 alone, and a
#             part's own `mate` point may narrow the list
#   unmated   a sentence of at least 40 characters saying why no plug of this
#             interface can exist. The part-conformance runner reads it: its
#             check that every published connector slot has a mate (C21) does
#             not report a slot of this interface, and a sentence on an
#             interface some part `mates` is an error.
#   cover     true for an entry that is NOT a connector but a COVER MOUNT: the
#             place on a part where a cover that ships on it and comes off is
#             fixed (a breaker's touch guard). It seats as a connector slot
#             does - one slot, one occupant, a default - and states no
#             `standard`, because no published interface governs it.
#             Whether cover mounts belong here or in a registry of their own
#             is open (#822); there is one today, breaker-1ru-guard.
format: 1
interfaces:
  lc: {standard: lc-duplex-receptacle, note: one LC bore}
  # SPANS: one lc-duplex connector fills TWO `lc` bores, so a duplex adapter
  # holds two levels of slot for one piece of hardware - its own, and the two
  # bores it composes - and the two are mutually exclusive (B3,
  # docs/pluggables-caps-design.md, "The duplex host"). `interface` names what
  # the spanned parts present and `count` how many of them there must be; the
  # pitch they sit at is this interface's own `standard` in standards.yaml, so
  # no figure is written twice.
  lc-duplex:
    standard: lc-duplex-receptacle
    note: two LC bores at the 6.25 duplex pitch, presented by the adapter itself
    spans: {interface: lc, count: 2}
  sc: {standard: sc-simplex-receptacle}
  rj45: {standard: rj45, note: 'an 8P8C modular jack; generic/rj45-plug@1 mates it (#610)'}
  keystone: {standard: keystone-opening, note: 'the landscape keystone opening of the FS FHD-FAPM6 panel and the clip FS ships in it (FS figures, not a standard); common/keystone-blank@2 and fs/keystone-rj45-cat6@1 mate it'}
  mpo: {standard: mpo-adapter, note: 'MPO-8/12/24 share the opening; MPO-16 is keyed differently and is not this interface'}
  mpo16: {standard: mpo-adapter, note: 'MTP-16 (TIA 604-18 / FOCIS 18): the MPO opening with the key offset, so an MPO-8/12/24 plug does not mate it'}
  f-type: {standard: f-type, note: 'F (IEC 61169-24, ANSI/SCTE 02), 75 ohm by definition'}
  g-type: {note: 'the G-type male test connector (the panel carries the pin) of the -20 dB RF test points of the CommScope CH3000 receivers (AR3002E data sheet 87-11046 Rev F, Specifications: "G-type male connector (at front panel, -20 dB)"; the AR3044H and AR3044L data sheets print the same words). No document held gives a standard, a dimension, an impedance or a maker for it, so this key claims none. common/g-type-male-port@1 presents it and common/g-type-female-plug@1 mates it. A G-type female on a panel is a different interface (g-type-female). No standard is held for it'}
  g-type-female: {note: 'the G-type female test connector (the panel carries the socket) of the -20 dB RF test point of the CommScope CH3000 DR3600N (DR3600N data sheet, Specifications: "G-type female connector (front panel, -20 dB)"). No document held gives a standard, a dimension, an impedance or a maker for it, so this key claims none. common/g-type-female-port@1 presents it and common/g-type-male-plug@1 mates it. A G-type male on a panel is a different interface (g-type). No standard is held for it'}
  stereo-jack: {note: 'the stereo jack style RS-232 connector of the CommScope CH3000 CX3003C and CX3033N communications modules (CX3003C data sheet, Specifications: "RS-232 port uses a stereo jack style connector"; the CX3033N data sheet prints the same). The data sheets give no jack diameter, contact count or pinout, so this key claims none and says nothing of the signals. common/stereo-jack@1 presents it and common/stereo-plug@1 mates it. No standard is held for it'}
  sma: {standard: sma, note: 'SMA (IEC 61169-15, MIL-STD-348); reverse-polarity SMA does not mate it and is not this interface'}
  smb: {standard: smb, note: 'SMB snap-on (IEC 61169-10); 50 and 75 ohm variants intermate, so impedance is an attr, not the interface'}
  mcx: {standard: mcx, note: 'MCX snap-on (IEC 61169-36); 50 and 75 ohm variants intermate; a recessed variant exists (see standards.yaml mcx)'}
  bnc: {standard: bnc, note: 'BNC bayonet (IEC 61169-8, MIL-STD-348); 50 and 75 ohm intermate, so impedance is an attr'}
  din-1-0-2-3: {standard: din-1-0-2-3, note: '1.0/2.3 push-pull (DIN 41626/2, the standard the HUBER+SUHNER catalogue names; IEC 61169-29 internationally); 50 and 75 ohm variants; spelled with hyphens, an interface may not contain a dot'}
  # AC appliance inlets (#785, docs/connectors-power-design.md). The cord end
  # that mates each is a generic plug; the far end of the cord is not a part.
  iec-c14: {standard: c14-inlet, note: 'IEC 60320-1 C14 appliance inlet; generic/c13-plug@1 mates it. A C15 or C17 connector is a different interface'}
  iec-c20: {standard: c20-inlet, note: 'IEC 60320-1 C20 appliance inlet; generic/c19-plug@1 mates it. A C21 connector is a different interface'}
  iec-c13: {standard: c13-outlet, note: 'IEC 60320 C13 outlet (a PDU socket); generic/c14-plug@1 mates it'}
  # The PDU side (#933): an outlet is a slot for the plug end of a jumper.
  iec-c19: {standard: c19-outlet, note: 'IEC 60320-3 sheet J C19 outlet, a PDU socket; generic/c20-plug@1 mates it. Eaton C39 also takes a C20 and is its own part'}
  # The C16 appliance inlet. THE KEY IS THE INLET ON THE DEVICE, never the C15 coupler of the cord
  # that mates it. No standard is held for it, so the entry cites none.
  iec-c16: {note: 'the AC appliance inlet of the 1050 W and 1600 W supplies of the Juniper EX4400 switches, a C14 inlet with a raised rim, which a C15 cord mates (EX4400 Switch Hardware Guide, Juniper Networks, PDF created 2026-07-22: Table 53 prints the inlet type of each supply as IEC-320-C15, and the cord text says each ships with a C15 coupler cord). The guide types the inlet by its cord, so C16 is the reading of juniper/jpsu-1050-c-ac-afo@1 and juniper/jpsu-1600-c-ac-afo@1, which describe the inlet this key covers. No standard is held for it'}
  # NEMA straight-blade receptacles and the Eaton C39 (#1045,
  # docs/connectors-power-design.md section 9). THE KEY IS THE RECEPTACLE, as
  # `iec-c13` is the outlet and not the plug that enters it: `nema-5-15r` and
  # `nema-5-20r` are the NEMA WD 6 designations in lower case, the spelling the
  # `nema-5-20r` entry of standards.yaml and both DCIM outlet types already
  # have, and `eaton-c39` is the outlet type both DCIM targets carry. A 5-15R
  # and a 5-20R are TWO interfaces and not one, because what each accepts
  # differs: a 5-20P does not enter a 5-15R. A plug that enters both names both
  # in its `mates`, which is why `mates` takes a list. `nema-5-15r` cites no
  # standard: the library holds no 5-15R part and no drawing of one yet.
  nema-5-15r: {note: 'NEMA WD 6 configuration 5-15R, the 125 V 15 A straight-blade receptacle with two parallel slots and an earth hole; generic/nema-5-15p-cord@1 mates it, and a 5-20P does not enter it. No part in the library presents it yet'}
  nema-5-20r: {standard: nema-5-20r, note: 'NEMA WD 6 configuration 5-20R, the 125 V 20 A straight-blade receptacle whose neutral slot is a T, as std/nema-5-20r@1 draws it; generic/nema-5-15p-cord@1 and generic/nema-5-20p-cord@1 both mate it'}
  eaton-c39: {note: 'the Eaton C39 outlet of a Rack PDU G4, a combination of the C13 and C19 outlets that takes a C14 or a C20 plug (Eaton installation and setup guide P-164001156 rev 3, section 1.5); eaton/c39-outlet@1 presents it and generic/c14-plug@1 and generic/c20-plug@1 mate it. A vendor connector and no IEC 60320 sheet, so the entry cites no standard'}
  saf-d-grid: {standard: saf-d-grid, note: 'Anderson Power Products Saf-D-Grid receptacle (drawing 115171S1 rev 12; no IEC standard governs it); it sits in a C14 cutout but a C13 does not mate it'}
  # USB receptacles (#786, docs/connectors-usb-design.md). The cable plug that
  # mates each is a generic plug; the far end of the cable is not a part. An
  # interface is the connector, not the bus: none states a speed or a USB
  # generation.
  usb-a: {standard: usb-a, note: 'USB Standard-A receptacle (USB 2.0 specification, figure 6-7); generic/usb-a-plug@1 mates it. A USB 3.x Standard-A plug mates the same opening'}
  micro-usb-b: {standard: micro-usb-b, note: 'USB 2.0 Micro-B receptacle (Micro-USB Cables and Connectors Specification 1.01, figure 4-10); generic/micro-usb-b-plug@1 mates it. Micro-AB and the wider USB 3.x Micro-B are different interfaces'}
  mini-usb-b: {standard: mini-usb-b, note: 'USB 2.0 Mini-B receptacle (shell from Molex sales drawing SD-54819-026, part 54819-0519). std/mini-usb@1 presents it (the console of the Catalyst 9300 and 3650), so does juniper/ex4300-console-usb-mini@1 (the console of the EX4300 and EX4550), and generic/mini-usb-b-plug@1 mates it. Micro-B and Mini-AB are different interfaces'}
  usb-c: {standard: usb-c, note: 'USB Type-C receptacle (USB Type-C Cable and Connector Specification, figure 3-1); generic/usb-c-plug@1 mates it, either way up'}
  # D-subminiature and VGA connectors (#787, docs/connectors-dsub-design.md).
  # The hooded cable plug that mates each is a generic plug; the far end of
  # the cable is not a part. GENDER IS PART OF THE INTERFACE: each key names
  # the connector with the gender the library's panel part has, and a panel
  # connector of the other gender would be a different interface with its own
  # key, because the plug that mates it is the other plug.
  db9: {standard: db9, note: 'D-subminiature 9 position, shell size E (DE-9), MALE on the panel: pins, as std/db9@1 draws it; generic/db9-plug@1, a female cable plug, mates it. A female DE-9 on a panel would be a different interface'}
  hd15: {standard: hd15, note: 'High-density D-subminiature 15 position in shell size E (VGA), FEMALE on the panel: sockets, as std/vga@1 draws it; generic/hd15-plug@1, a male cable plug, mates it. The shell is the db9 shell and neither plug mates the other connector. A male HD-15 on a panel would be a different interface'}
  da15: {standard: da15, note: 'D-subminiature 15 position in two rows, shell size A (DA-15), FEMALE on the panel: sockets, as std/da15@1 draws it; generic/da15-plug@1, a male cable plug, mates it. A male DA-15 on a panel would be a different interface'}
  db25: {standard: db25, note: 'D-subminiature 25 position, shell size B (DB-25), FEMALE on the panel: sockets, as std/db25@1 draws it; generic/db25-plug@1, a male cable plug, mates it. A male DB-25 on a panel would be a different interface'}
  # The 50-pin micro D-sub of the CO alarm interface of the Nokia general facilities cards. Named for
  # the layout the guides name; the gender on the panel is in the note, as for the keys above. No
  # standard, shell size or pitch is held for it, so the entry cites none and claims none.
  micro-dsub-50: {note: 'the 50-pin micro D-sub connector of the CO alarm interface on the front panel of the Nokia NGFC-H and NGFC-G general facilities cards, FEMALE on the panel: sockets (Lightspan Access Node FX Unit Data Sheet Guide 3HH-90279-AAAA-TQZZA issue 23, sections 31.5.3.1 and 32.5.3.1: a "female 50-pin micro DSUB connector" carries the external alarms, and Tables 115 and 122 give its pinning; Hardware Installation Manual 3HH-91853-AAAA-RJZZA issue 08, sections 18.6 and 24.6: the shelf "requires a 50-pin micro DSUB connector with an angled head" and a cable assembly is sold for it). The guides state no standard, shell size, pitch or dimension for it, so this key claims none and no other D-sub key stands for it; it covers the connector as nokia/ngfc-h@1 and nokia/ngfc-g@1 draw it. A male 50-pin micro D-sub on a panel would be a different interface. No standard is held for it'}
  # Pluggable terminal headers on a 5.08 mm pitch (#789,
  # docs/connectors-dc-terminal-design.md). An interface is the connector, not
  # the use: the pitch and the number of positions are in the key, and a
  # header feeding power and one carrying a relay contact are the same
  # interface when they are the same header. NOR IS A FLANGE: an interface is
  # the mating face, which a header presents with or without screw flanges
  # and a plug mates with or without them, so there is one five-position key
  # and no `f`.
  terminal-508-2: {standard: terminal-508-2-header, note: 'two-position plain pluggable header on a 5.08 mm pitch (Phoenix Contact MSTBA 2,5/..-G-5,08 and equivalents); generic/terminal-508-2-plug@1 mates it'}
  terminal-508-5: {standard: terminal-508-5-header, note: 'the five-position mating face of a pluggable header on a 5.08 mm pitch (Phoenix Contact MSTB 2,5 and equivalents), which a flanged or a plain header presents and a flanged or a plain plug mates; generic/terminal-508-5-plug@1, the screw-flange plug, mates it, because the one header placed (common/terminal-header-508-5f@2) is flanged'}
  terminal-508-6: {standard: terminal-508-6-header, note: 'six-position plain pluggable header on a 5.08 mm pitch (Phoenix Contact MSTBA 2,5/ 6-G-5,08 and equivalents); generic/terminal-508-6-plug@1 mates it'}
  # The DC barrel jack (#789, docs/connectors-dc-terminal-design.md). ONE
  # INTERFACE, BY RULING: see the note.
  dc-barrel: {standard: barrel-jack, note: 'the library treats the DC barrel jack as ONE nominal connector. Barrel diameters vary by product, and of the seven devices that place common/dc-barrel@1 only the CSS326-24G-2S+RM and CRS309-1G-8S+IN quick guides state one (5.5 mm outside, 2 mm inside), so the interface claims no diameter. The rating is carried as attributes of each placement of the jack (input-voltage, current-max-a) and not by the interface. generic/dc-barrel-plug@1, drawn at the common 5.5 mm barrel, mates it'}
  # Screw and stud terminals a lug lands on (#789,
  # docs/connectors-dc-terminal-design.md section 12). ONE INTERFACE, BY
  # RULING: see the note. The part that presents it is the terminal screw
  # itself, composed once per pole into its block, so each pole is a slot.
  # TURNS: the turns, relative to the seat, at which an occupant may be seated
  # on a slot presenting the interface (#829, docs/connectors-dc-terminal-
  # design.md section 13.4). A ring lug turns freely about its stud, so all
  # four right angles. An interface that names no `turns` allows 0 alone, and
  # a part's own `mate` point may narrow the list (`turns:` on the point), as
  # a barrier block's terminal screw narrows it to 0.
  terminal-stud: {standard: terminal-stud, turns: [0, 90, 180, 270], note: 'the library treats a screw or stud terminal that a lug lands on as ONE nominal connector. Stud and screw sizes vary by product and most placing parts state none, so the interface claims no size; where a document states one it is an attribute of the placement and not of the interface. generic/ring-lug@1, a one-hole insulated ring terminal on its wire, mates it. A two-hole lug across a pair of studs is not this interface: it mates a `stud-pair-*` interface, which spans two of these'}
  # PAIRS OF STUDS ONE TWO-HOLE LUG LANDS ACROSS (#828,
  # docs/connectors-dc-terminal-design.md section 13.7). Each SPANS two
  # `terminal-stud` seats, as `lc-duplex` spans two `lc` bores: a part
  # presenting one composes the two studs at the interface's pitch and
  # presents the pair at their midpoint, and the pair and its two studs are
  # mutually exclusive (L115). THE PITCH IS THE INTERFACE: a two-hole lug is one
  # stamping, so a lug for 5/8 in. centres does not land on studs 3/4 in. apart,
  # and the pitch is in the key. The stud SIZE is not: it is the placement's
  # `stud-size`, as on a single stud. The axis a pair runs on is derived from
  # the order its studs are composed in (manifest.spanning_axis), so one lug
  # serves a pair side by side and one stood on end, and the order says which
  # way the wire leaves. `turns: [0, 180]` (#829): a lug across a pair can lie
  # either way along it, and no other way.
  stud-pair-5-8: {standard: two-hole-lug-5-8, turns: [0, 180], note: 'two studs or tapped holes on 5/8 in. (15.875) centres that one two-hole lug lands across; generic/two-hole-lug-5-8@1 mates it. The ring lug still mates each stud alone', spans: {interface: terminal-stud, count: 2}}
  stud-pair-3-4: {standard: two-hole-lug-3-4, turns: [0, 180], note: 'two studs or tapped holes on 3/4 in. (19.05) centres that one two-hole lug lands across; generic/two-hole-lug-3-4@1 mates it. The ring lug still mates each stud alone', spans: {interface: terminal-stud, count: 2}}
  stud-pair-1: {standard: two-hole-lug-1, turns: [0, 180], note: 'two studs or tapped holes on 1 in. (25.4) centres that one two-hole lug lands across; generic/two-hole-lug-1@1 mates it. The ring lug still mates each stud alone', spans: {interface: terminal-stud, count: 2}}
  # The high-density and telephone connectors (#790,
  # docs/connectors-mrj21-vhdci-rj11-design.md). The cable plug that mates
  # each is a generic plug; the far end of the cable, and any breakout, is not
  # a part.
  mrj21: {standard: mrj21, note: 'TE Connectivity MRJ21 48-position receptacle, six 10/100/1000 Ethernet ports to a connector, as std/mrj21@1 draws it; generic/mrj21-plug@1, the straight cable plug with two jackscrews, mates it'}
  vhdci: {standard: vhdci, note: 'VHDCI 68-position shielded receptacle on a 0.8 mm pitch with a screwlock either side (SFF-8441, Figure 25), as common/vhdci-receptacle@1 draws it; generic/vhdci-plug@1, the thumbscrew cable plug, mates it. The count is not in the key because SFF-8441 standardizes only the 68-position connector, so no other count of it could be on a panel'}
  rj11: {standard: rj11, note: 'the six-position modular telephone jack (6P2C, 6P4C or 6P6C: one body, and RJ11 names the wiring of the first), as common/rj11-jack@1 draws it; generic/rj11-plug@1 mates it. The four-position handset jack and the eight-position rj45 are different interfaces'}
  # The P40 output connector of the Amphenol Network Solutions power panels
  # (docs/connectors-dc-terminal-design.md section 14). A vendor connector:
  # no standard is held for it, so the entry cites none.
  p40: {note: 'the two-pole latching output connector of the Amphenol Network Solutions connectorized power panels, the Amphenol PRM series with 4 mm RADSOK contacts, BATT over RTN. amphenol-ns/output-p40@1 presents it and amphenol-ns/p40-plug@1 mates it. A vendor connector: no standard is held for it'}
  # The DC input connector of the Edgecore 650 W DC supplies PSU-48V-650-F and -B.
  # A vendor connector: no standard is held for it, so the entry cites none.
  positronic-pla03: {note: 'the three-position, one-row power connector of the Positronic PCS series, MALE on the panel: pins, size 16 contacts on a 5.00 mm pitch (Positronic Power Connection Systems catalog C-014 Rev. G9, pages 11, 14, 16 and 26). The Edgecore DCS204 quick start guide names the plug that takes it, Positronic PLA03F7000/AA, which the catalog ordering code reads as the one-row, three-position, female cable connector; common/pla03-receptacle@1 presents it, as the Edgecore supplies edgecore/psu-48v-650-f@1 and edgecore/psu-48v-650-b@1 compose it, and generic/pla03-plug@1, that cable connector, mates it. A female PLA03 on a panel would be a different interface. A vendor connector: no standard is held for it'}
  # The DC power connector of the Oscilloquartz OSA 5420 and OSA 5421 -48 VDC supplies.
  # A vendor connector: no standard is held for it, so the entry cites none.
  latch-header-3: {note: 'the three-position keyed latching power header on the face of the Oscilloquartz OSA 5420 and OSA 5421 -48 VDC supplies: a body with a release tab above it and three contacts in a row, printed "- Gnd +", pin 3 the -48 VDC battery, pin 2 ground and pin 1 the return for the battery source (OSA 5420/5421 Installation and Commissioning Manual R9.5.1, Figures 13 and 15 and Table 8). The manual names no maker, series, pitch, dimension or gender for it, so this key claims none and no other three-position header; it covers the connector as oscilloquartz/osa542x-dc-header@1 draws it. The supplies oscilloquartz/osa542x-psu-dc-40w@1 and oscilloquartz/osa542x-psu-dc-90w@1 compose that part and oscilloquartz/osa542x-dc-plug@1, the cable connector of Figure 15, mates it. A vendor connector: no standard is held for it'}
  # The DC power connector of the Cisco NXA-PDC-930W supply.
  # A vendor connector: no standard is held for it, so the entry cites none.
  cisco-dc-block-3: {note: 'the three-position DC power connector block on the face of the Cisco NXA-PDC-930W supply, a body with a clip and three cells in a column printed "- DC", "+ DC" and an earth symbol from the top down (Cisco N93108TC-FX3 NX-OS Mode Switch Hardware Installation Guide, "Connecting a Power Cable to an NXA-PDC-930W Power Supply" and its figure 504148; the cable table names the cable CAB-48DC-40A-8AWG). The guide names no maker, series, pitch, dimension or gender for it, so this key claims none and no other three-position block; it covers the connector as cisco/nxa-pdc-930w-dc-header@1 draws it and as cisco/nc5k-pdc-930w-dc-header@1 draws it at the size of the housing of the NCS 5000 supplies (Hardware Installation Guide for Cisco NCS 5000 Series Routers, Figure 21). The supply cisco/nxa-pdc-930w@1 composes that part and cisco/nxa-pdc-930w-dc-plug@1, the cable connector of the figure, mates it. A vendor connector: no standard is held for it'}
  # The DC power connector of the Juniper QFX5210 DC supplies.
  # A vendor connector: no standard is held for it, so the entry cites none.
  juniper-qfx5210-dc-header-3: {note: 'the three-position DC power header on the face of the Juniper QFX5210 DC power supplies (JPSU-1100W-DC-AFI and -AFO): a keyed shroud with three round cells in a column, numbered 1, 2 and 3 from the top and printed with no pole (QFX5210 Switch Hardware Guide, Figures 19 and 32, where it is called the "Terminal block"). The guide names no maker, series, pitch, dimension or gender for it and says in different places that the power cables are provided, that they are unlatched, and that a lug is attached to them, so this key claims none and no other three-position header; it covers the connector as juniper/qfx5210-dc-header@1 draws it. The supplies juniper/qfx5210-jpsu-1100w-dc-afi@1 and juniper/qfx5210-jpsu-1100w-dc-afo@1 compose that part and juniper/qfx5210-dc-plug@1, a stand-in for the cable connector no figure draws, mates it. A vendor connector: no standard is held for it'}
  # The DC power connector of the Juniper QFX5200-48Y DC supplies.
  # A vendor connector: no standard is held for it, so the entry cites none.
  juniper-dc-header-3: {note: 'the three-position DC power header on the face of the Juniper QFX5200-48Y DC power supplies (QFX520048Y-DPSU-AI and -AO): a housing with three round cells in a column, numbered 3, 2 and 1 from the top, and wires labelled "Red: RTN", "Black: -36 -72V" and "Green: Grounding" at them (QFX5200 Hardware Guide, Figure 42; Figure 85 shows the cable connector going in). The guide names no maker, series, pitch, dimension or gender for it, so this key claims none and no other three-position header; it covers the connector as juniper/qfx5200-48y-dc-header@1 draws it. The supplies juniper/qfx5200-48y-dpsu-ai@1 and juniper/qfx5200-48y-dpsu-ao@1 compose that part and juniper/qfx5200-48y-dc-plug@1, the cable connector of Figure 85, mates it. A vendor connector: no standard is held for it'}
  # The DC power connectors of the Edgecore AS5835 (DCS201 and DCS202), AMX3200 and AGR560 48 VDC supplies.
  # Vendor connectors: no standard is held for them, so the entries cite none.
  # The DC power connector of the Cisco ASR 9000 fixed-port DC supplies.
  # A vendor connector: no standard is held for it, so the entry cites none.
  cisco-dc-block-2: {note: 'the two-socket DC power connector on the face of the Cisco ASR 9000 fixed-port DC supplies (A9K-1600W-DC of the ASR 9901, PWR-1.6KW-DC of the ASR 9902 and ASR 9903), a shrouded body with two round sockets, each with a pin at its centre, marked "+DC" above and "-DC" below (Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide, Figures 162 and 163; the cable block that seats in it is Figures 67 and 68, and the guide''s cable list reads "6AWG Amphenol connector"). The guide names a maker for the cable and no series, part number, pitch, dimension or gender for the connector, so this key claims none and no other two-socket connector; it covers the connector as cisco/a9k-dc-header@1 draws it. The supplies cisco/a9k-1600w-dc@1 and cisco/pwr-1p6kw-dc@2 compose that part and cisco/a9k-dc-plug@1, a declared stand-in for the cable block, mates it. A vendor connector: no standard is held for it'}
  edgecore-dcs-dc-block-3: {note: 'the three-position pluggable DC terminal on the face of the Edgecore AS5835-54X and AS5835-54T 48 VDC supply, a green body with three cells in a column and a label strip printed with an earth symbol, "-" and "+" from the top down (Edgecore AS5835-54T Quick Start Guide, "Connect Power", the "DC Power" figure; the package contents list it as "DC power connector (included with 48 VDC PSU only)"). The guides name no maker, series, pitch, dimension or gender for it, so this key claims none and no other three-position terminal; it covers the connector as edgecore/dcs201-dc-header@1 draws it. The supply edgecore/dcs201-psu-dc@1 composes that part and edgecore/dcs201-dc-plug@1, the cable connector of the figure, mates it. A vendor connector: no standard is held for it'}
  edgecore-amx-dc-block-3: {note: 'the three-pin DC power connector on the face of the Edgecore AMX3200 48 VDC supply, a blue housing with three gold pins down it (Edgecore AMX3200 Quick Start Guide, "Connect Power", the figure above the wire list; the package contents list "DC power cord (included with DC PSUs only)"). The guide names no series, part number, pitch, dimension or gender for it and prints no mark on the housing, so this key claims none and no other three-position connector, the library''s positronic-pla03 among them; it covers the connector as edgecore/amx-3200-dc-header@1 draws it. The supply edgecore/amx-3200-48v-psu@1 composes that part and edgecore/amx-3200-dc-plug@1, the cable connector of the figure, mates it. A vendor connector: no standard is held for it'}
  edgecore-agr-dc-block-2: {note: 'the two-socket DC power connector on the face of the Edgecore AGR560 48 VDC supply, a dark shroud with two round sockets, each with a pin at its centre (Edgecore AGR560 Quick Start Guide, "Connect Power", the "DC Power" figure; the data sheet reads "DC Inlet: Amphenol Terminal"). The documents name a maker and no series or part number, and print no pitch, dimension, mark or gender, so this key claims none and no other two-socket connector; it covers the connector as edgecore/agr560-dc-header@1 draws it. The supply edgecore/agr560-psu-dc@1 composes that part and edgecore/agr560-dc-plug@1, a stand-in for the cable connector no document draws, mates it. A vendor connector: no standard is held for it'}
  # The DC power connector of the Juniper JPSU-150-DC-AFO supplies of the EX3400 and EX4100 switches.
  # A vendor connector: no standard is held for it, so the entry cites none.
  juniper-dc-block-3: {note: 'the three-position pluggable DC power connector on the face of the Juniper JPSU-150-DC-AFO supply of the EX3400 and EX4100 switches: a grey block with three cells in a column printed "+", "-" and an earth symbol from the top down and a mounting hole at each end, and a cable connector held by a screw at each end of its flange (EX3400 Switch Hardware Guide, "Connecting DC Power to an EX3400 Switch", Figures 46 and 47; EX4100 Switch Hardware Guide, "Connect DC Power to an EX4100 Switch", Figures 74 and 75). The guides name no maker, series, pitch, dimension or gender for it (the EX3400 guide names Molex 192120005 for the wire pins only), so this key claims none and no other three-position block; it covers the connector as juniper/jpsu-150-dc-header@1 draws it. The supplies juniper/ex3400-jpsu-150-dc-afo@1 and juniper/ex4100-jpsu-150-dc-afo@1 compose that part and juniper/jpsu-150-dc-plug@1, the cable connector of the figures, mates it. A vendor connector: no standard is held for it'}
  # The DC input connector of the UfiSpace PSU-242-DEERN supply.
  # A vendor connector: no standard is held for it, so the entry cites none.
  ufispace-dc-block-6: {note: 'the six-position DC input connector on the face of the UfiSpace PSU-242-DEERN supply of the S9311-64D: a body with two rows of three cells, the upper row printed "V+" and "DC+(+48V)" and the lower "V-" and "DC-(0)" (UfiSpace S9311-64D Hardware Installation Guide, Figure 6, which prints "INPUT CONNECTOR PN:3072980925" beside it; the connecting-power step calls it the inlet connector and Figures 24 and 25 show a cable connector with a pull handle going in with a click). The guide names no maker, series, pitch, dimension or gender for it, and no document joins the printed number to a part of any maker, so this key claims none and no other six-position block; it covers the connector as ufispace/psu-242-dc-header@1 draws it. The supply ufispace/psu-242-dc@1 composes that part and ufispace/psu-242-dc-plug@1, the cable connector of the figures, mates it. A vendor connector: no standard is held for it'}
  # The DC power connector of the Juniper QFX5241-64OD and QFX5241-64QD DC supply.
  # A vendor connector: no standard is held for it, so the entry cites none.
  juniper-dc-header-6: {note: 'the six-position DC power connector on the face of the Juniper QFX524X-2RU-PWR-DO DC power supply of the QFX5241-64OD and QFX5241-64QD: a keyed housing with six round cells in two rows of three (QFX5241-64OD and QFX5241-64QD Hardware Guide, Figure 22 and Figure 25). The DC cord goes into it with a latch (Figure 35) and the guide calls the cord connector a "six-pin female" 2x3 connector with pins P1, P2, S1, S2, P3 and P4 (Table 18). The guide names no maker, series, pitch, dimension or part number for it and does not say which cell is which pin, so this key claims none and no other six-position connector; it covers the connector as juniper/qfx524x-dc-header@1 draws it. The supply juniper/qfx524x-2ru-pwr-do@1 composes that part and juniper/qfx524x-dc-plug@1, the cord connector, mates it. A vendor connector: no standard is held for it'}
  # The D-sub 3W3 DC power connector of the Juniper QFX10002 1600 W DC supply.
  # The guide names the connector type and no standard document is held, so the entry cites none.
  dc-connector-3w3: {note: 'the D-sub 3W3 DC power connector on the face of the Juniper JPSU-1600W-DC-AFO supply of the QFX10002-36Q, -60C, -72Q and QFX5220-128C: a vertical D-sub shell with three contacts, a hex standoff above and below it for the cable plug''s thumbscrews (QFX10002 Switch Hardware Guide, Figure 31). The guide says the supplies "require a D-Sub 3W3-type connector" whose three pins carry -48 VDC input, return and ground (QFX10002 DC Power Cable Specifications) and names the cables CBL-JNP-PWR-DSUB, -DSUB2 and -DSUB3, which are whole cables and not a connector part number. It names no maker, series, shell dimension or gender, and does not say which contact is which, so this key claims none; it covers the connector as juniper/qfx10002-dc-header@1 draws it. The supply juniper/qfx10002-jpsu-1600w-dc-afo@1 composes that part and juniper/qfx10002-dc-plug@1, the cable connector, mates it. A vendor connector: no standard is held for it'}
  # The DC power connector of the Smartoptics DCP-2-PSU-DC-FB supply.
  # A vendor connector: no standard is held for it, so the entry cites none.
  smartoptics-dcp-dc-block-3: {note: 'the three-cell pluggable DC power connector on the face of the Smartoptics DCP-2-PSU-DC-FB supply, a metal shell round a black insulator with three gold-coloured cells in a column, one small, one large and one small from the top down, and a "+" scribed on the panel at its upper end (DCP-series User Manual 14.0 A, figure 2-13 and section 3.1.5, "the DC power connector"). The manual names no maker, series, part number, pitch, dimension or gender for it, so this key claims none and no other three-position connector; it covers the connector as smartoptics/dcp-2-dc-header@1 draws it. The supply smartoptics/dcp-2-psu-dc@1 composes that part and smartoptics/dcp-2-dc-plug@1, a stand-in for the cable connector no document shows, mates it. A vendor connector: no standard is held for it'}
  # The rack PDU mounting interface (#934, docs/pdu-model-design.md section
  # 6.2). NOT A CONNECTOR - A MOUNT: the slot is the keyhole in a bracket or a
  # cabinet channel, which presents it, and the button on the PDU's back is
  # the part that mates it. No standard governs it, so the entry cites none.
  pdu-button: {note: 'NOT A CONNECTOR - A MOUNT. The shoulder-style mounting button on the back of a zero-U rack PDU and the keyhole slot that takes it: a keyhole in a bracket or a cabinet zero-U channel presents it, eaton/g4-mounting-button@1 mates it. The Eaton Rack PDU G4 installation and setup guide P-164001156 rev 3, section 2.11, sizes the slot: 11.5 to 12.5 mm in 1.5 to 2 mm sheet (Eaton enclosures), or 14 mm in 3 mm sheet (Tripp Lite racks). No standard governs it'}
  # GPU power connectors and the NVLink bridge (P-0028, docs/connectors-gpu-design.md).
  # THE KEY NAMES THE BOARD CONNECTOR, as `iec-c14` names the inlet. The two 8-pin
  # connectors are two interfaces over one housing size, because Molex lists the
  # PCIe housing's polarisation as its own, so an EPS12V plug does not enter a PCIe
  # header and a PCIe plug does not enter an EPS12V one. The 12VHPWR and 12V-2x6
  # headers are two interfaces too (12V-2x6 recesses its sense contacts), but the
  # one 16-pin plug mates both, so its `mates` names both.
  eps12v-8pin: {standard: mini-fit-8-header, note: 'the 8-pin CPU / EPS12V power connector (ATX12V), a Molex Mini-Fit Jr. 2 x 4 on 4.20 pitch with four 12 V and four ground contacts; the A100 takes it as "CPU 8-pin" (NVIDIA PB-10577 fig 6 and 7). generic/eps12v-8pin-plug@1 mates it. A PCIe 8-pin plug is a different interface'}
  pcie-8pin: {standard: mini-fit-8-header, note: 'the PCIe 8-pin (6+2) auxiliary power connector, the same 2 x 4 housing size with PCIe polarisation, three 12 V and five ground contacts (NVIDIA PB-10577 fig 7). generic/pcie-8pin-plug@1 mates it. The 6-pin PCIe connector is not registered'}
  pcie-12vhpwr: {standard: pcie-16pin-header, note: 'the 16-pin 12VHPWR connector of PCIe CEM 5.0 and ATX 3.0: twelve 12 V and ground power contacts on 3.00 pitch and four sense contacts; marked "H+". generic/pcie-16pin-plug@1 mates it'}
  pcie-12v-2x6: {standard: pcie-16pin-header, note: 'the 12V-2x6 revision of the 16-pin connector (PCIe CEM 5.1, ATX 3.1): the same housing as 12VHPWR with the sense contacts recessed further; marked "H++". The cable plug is unchanged, so generic/pcie-16pin-plug@1 mates it'}
  nvlink-a100-pcie: {standard: nvlink-a100-pcie-connector, note: 'the NVLink bridge connector on the top edge of an A100 PCIe card (three per card); nvidia/nvlink-bridge-a100-2slot@1, NVIDIA 900-53651-0000-000, mates it at both ends. Other cards that take a bridge (A30, A40, H100 PCIe, H100 NVL, H200 NVL) have their own bridge part numbers and are not this interface until a source says the connectors intermate'}
  # PCIe add-in card slots (docs/cards-by-interface-design.md). THE KEY IS THE SLOT
  # THE BRACKET FITS, as `sfp` names the cage and not the optic, and it is spelled
  # without the word bracket because the standards entry names the part and this
  # names the opening. Two keys by bracket height; length, lane width and
  # generation stay in `attrs` and the bay's `slot:` block, because a gen3 card
  # seats in a gen4 slot and an x8 card in an x16. A two-slot card is not a key: it
  # mates `pcie-fh` and states `slot-width: 2`. A component bay states the key as
  # its `interface`, and a card that fills a bay states it as `mates`. No part
  # states either yet.
  pcie-fh: {standard: pcie-bracket-fh, note: 'a PCIe slot whose opening takes a full-height add-in card bracket (PCI Express CEM 5.0, figure 11-5); a two-slot card mates it too and states slot-width: 2'}
  pcie-lp: {standard: pcie-bracket-lp, note: 'a PCIe slot whose opening takes a low-profile add-in card bracket (PCI Express CEM 5.0, figure 11-9)'}
  # OCP NIC 3.0 card slots (docs/cards-by-interface-design.md), from the OCP NIC 3.0
  # Design Specification, Version 1.6.0, Table 5, under the Open Compute Project
  # Hardware License (Permissive) Version 1.0. THE KEY IS THE SLOT, by the card outline
  # it is cut for. The deprecated large form factor is not registered. No part states
  # any of them as `mates` yet; a device bay may state one as its `interface`.
  ocp3-sff: {standard: ocp3-sff, note: 'an OCP NIC 3.0 slot for the small form factor card: 76.00 x 115.00, 11.50 high, one 4C+ connector (OCP NIC 3.0 Design Specification 1.6.0, Table 5, page 25). A TSFF slot takes this card mechanically too, so a card of this form factor is not refused by an ocp3-tsff slot'}
  ocp3-tsff: {standard: ocp3-tsff, note: 'an OCP NIC 3.0 slot for the tall small form factor card: the SFF outline at 14.20 high, one 4C+ connector (OCP NIC 3.0 Design Specification 1.6.0, Table 5, page 25). The specification says a TSFF slot may mechanically accept an SFF card and leaves the electromagnetic effect of the faceplate gap out of its scope (section 2.1.2, page 26; Table 7, page 43: "Fits mechanically"), so this slot takes ocp3-tsff and ocp3-sff cards. An SFF slot does not take a TSFF card, which is 2.70 taller'}
  ocp3-dsff: {standard: ocp3-dsff, note: 'an OCP NIC 3.0 slot for the dual small form factor card: 157.55 x 115.00, 11.50 high, two 4C+ connectors (OCP NIC 3.0 Design Specification 1.6.0, Table 5, page 25). The specification describes a DSFF slot as two SFF slots with a removable guide rail (section 2.1.3, page 27) and lists SFF cards as supported in it (Table 7, page 43). No held device has one'}
  ocp3-tdsff: {standard: ocp3-tdsff, note: 'an OCP NIC 3.0 slot for the tall dual small form factor card: the DSFF outline at 14.20 high, two 4C+ connectors (OCP NIC 3.0 Design Specification 1.6.0, Table 5, page 25). Table 7, page 43, lists SFF and DSFF cards as fitting it mechanically and TSFF cards as supported. No held device has one'}
  # Stacking, Virtual Chassis and redundant-power connectors. VENDOR CONNECTORS: each is
  # the maker's own, no standard is held for any, and the entries cite none. THE KEY IS
  # THE RECEPTACLE ON THE SWITCH, as `p40` is, and not the cable or the use. Two
  # connectors that the held guides do not show to intermate are two keys, so each
  # key is the narrowest the guides settle and its note says what they leave open.
  # Each is presented by a part and mated by a plug, and its note names both.
  flexstack: {note: 'the stack port of the Cisco FlexStack module (C2960S-STACK) of the Catalyst 2960-S, printed STACK 1 and STACK 2 (Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, "FlexStack Ports" and "Connecting the FlexStack Cables", Figure 1-17). The guide names the ports and the cables CAB-STK-E-0.5M, -1M and -3M and gives no connector type or contact count. It does not say that the two ports are one receptacle, only that the cable tab sits above the connector at STACK 1 and below it at STACK 2, so this key covers the connector as the module draws it and no other Cisco stacking port. A vendor connector: no standard is held for it. cisco/flexstack-port@1 presents it and cisco/flexstack-plug@1 mates it'}
  stackwise-480: {note: 'the StackWise-480 port connector on the rear of a Catalyst 9300, a modular-uplink model (Catalyst 9300 Series Switches Hardware Installation Guide, Figure 10 callout 10, "StackWise-480 port connectors", and "StackWise Ports"). The cable is fastened by finger-tightened screws, and the guide lists the cables STACK-T1-50CM, -1M and -3M in Table 51. The guide prints no connector dimension or contact count. It lists the same cables for StackWise-1T (Catalyst 9300X) and does not say that the 1T port connector is this receptacle, so that connector is not this key; the StackWise-320 port of the 9300L takes an adapter in the port and the guide does not show it to be this receptacle. A vendor connector: no standard is held for it. cisco/stackwise-480-port@1 presents it and cisco/stackwise-480-plug@1 mates it'}
  stackpower: {note: 'the StackPower connector on the rear of a Catalyst 9300 (Catalyst 9300 Series Switches Hardware Installation Guide, Figure 10 callout 7, "StackPower connectors", and "StackPower Connector"), for the cables CAB-SPWR-30CM and CAB-SPWR-150CM. The guide says the ports are keyed and have colored bands that match the cable connectors, and prints no connector dimension or contact count. The Catalyst 9300X rear panel names "StackPower+ connectors" (Figure 14) and the guide does not say they are this receptacle, so they are not this key. A vendor connector: no standard is held for it. cisco/stackpower-port@1 presents it and cisco/stackpower-plug@1 mates it'}
  ex4200-vcp: {note: 'the Virtual Chassis port (VCP) on the rear panel of a Juniper EX4200, two per switch (EX4200 Switch Hardware Guide, published 2022-01-16, "Rear Panel of an EX4200 Switch", Figure 4, and the pinout topic: "EX4200 switches use a 68-pin connector cable to interconnect switches"). Table 30 lists the pins and the cable ships with the switch. The EX4200 guide names no connector type and gives no dimension, and it does not say that the VCP of any other Juniper switch is this connector. juniper/ex4500-vc1@1 composes this port at each of its two Virtual Chassis ports. A vendor connector: no standard is held for it. juniper/ex4200-vcp-port@1 presents it and juniper/ex4200-vcp-plug@1 mates it'}
  cisco-rps2300: {note: 'the RPS connector on the rear of a Catalyst 2960-S that supports the Cisco RPS 2300 (Catalyst 2960-S Switch Hardware Installation Guide, OL-19732-04, Figure 1-10 callout 3 and Figure 1-12, "RPS Connector": "Attach only the following Cisco RPS model to the RPS receptacle: RPS2300"). The cable is CAB-RPS2300-E. The guide names no connector type and gives no contact count or dimension, and a cover closes the connector when no RPS is attached (Figure 1-15). A vendor connector: no standard is held for it. cisco/rps2300-connector@1 presents it and cisco/rps2300-plug@1 mates it'}
  ex3300-rps: {note: 'the redundant power system (RPS) port on the rear panel of a Juniper EX3300 (EX3300 Switch Hardware Guide, published 2020-12-15, "Rear Panel of an EX3300 Switch": "Redundant power system (RPS) port", Figures 3 and 4). The guide names no connector type, contact count, dimension or cable. The EX2200 Switch Hardware Guide lists a "Redundant power system (RPS) port" in the same words and gives no connector type either, so the two guides do not settle that the EX2200 port is this connector, and this key covers the EX3300 only. A vendor connector: no standard is held for it. juniper/ex3300-rps-port@1 presents it and juniper/ex3300-rps-plug@1 mates it'}
  # Alarm headers, pluggable screw-terminal headers and the Open Rack v3 bus-bar connector.
  # VENDOR CONNECTORS: no standard is held for any, so the entries cite none. THE KEY IS THE
  # HEADER OR CONNECTOR ON THE DEVICE, never the plug that enters it. A stated figure goes in
  # the key (`terminal-381-5`: the pitch and the number of positions). Where no document states
  # the pitch, the key is named for its position count, claims no pitch, and its note says what
  # it leaves open: a plug for one pitch does not enter a header of another, and nothing held
  # shows two of these headers to intermate, so each is its own key.
  wire-wrap-3: {note: 'the three-pin wire-wrap header on each side of the rear alarm card of an Amphenol Network Solutions 300CB08 power panel, carrying Form C alarm relay contacts (300CB08 installation guide 149722-2 A9, Figure 3-6; the datasheet gives the contacts on wire-wrap terminals that also mate with TE Connectivity 3-640428-3). The documents held state no pitch for it, so this key covers the header as amphenol-ns/alarm-card-307608@1 draws it, which amphenol-ns/nrg-rear-block@1 repeats, and no other wire-wrap header. No standard is held for it'}
  wire-wrap-6: {note: 'the six-pin right-angle wire-wrap header of the BITS interface on the front panel of the Nokia NGFC-H and NGFC-G general facilities cards (Lightspan Access Node FX Unit Data Sheet Guide 3HH-90279-AAAA-TQZZA issue 23, sections 31.5.3.2 and 32.5.3.2: a "6-pin wire-wrap" header at a right angle is accessible through the front panel, the front panel lists call it "recessed", and Tables 116 and 123 give the signal on each of its six pins). The guides state no pitch, pin dimension or standard for it, so this key claims none; it is not wire-wrap-3, the three-pin header of the Amphenol Network Solutions 300CB08 alarm card, and it covers the header as nokia/ngfc-h@1 and nokia/ngfc-g@1 draw it. No standard is held for it', unmated: 'the two BITS cables connect to the six pins of this header by wire-wrap, three pins for each of NT-A and NT-B, so no plug seats on it (Lightspan Access Node FX Hardware Installation Manual 3HH-91853-AAAA-RJZZA issue 08, sections 18.7 and 24.7: "six wire-wrappable pins")'}
  screw-terminal-5: {note: 'the nrgNET connector of an Amphenol Network Solutions nrgSMART power panel with an integrated controller or sensor card: a removable 5-pin connector with screw-down terminals (controller datasheet), RS485, pins COM+, COM-, S, PWR+ and PWR- (300CB08 installation guide 149722-2 A9, table 2.9.2), photographed as green pluggable headers (Figure 2-30). No document held states its pitch, and the part is drawn at 3.81 mm by estimate only, so this key claims none and is not terminal-381-5; it covers the connector as amphenol-ns/nrg-rear-block@1 draws it and no other five-position screw-terminal header. No standard is held for it'}
  screw-terminal-2: {note: 'the two-pole pluggable DC terminal block of the Edgecore ECS4530-54CSFP-DC-I faceplate: a green header with a matching two-way screw-clamp plug seated in it, held by a flange screw at each end (ECS4530 datasheet, "DC Power Input (-48~-60 V)"). The datasheet states no pitch, so this key claims none and is not terminal-508-2; it covers the block as common/dc-terminal-plug-2@1 draws it and no other two-position pluggable header. No standard is held for it'}
  terminal-381-5: {note: 'the five-position pluggable screw-terminal header on a 3.81 mm pitch of the PSU 0 and PSU 1 connectors of the Juniper EX4100-H-12MP, a green plug with a captive screw at each end that ships preassembled (EX4100-H Switch Hardware Guide, Juniper Networks, published 2026-10-01, Figure 1 and Table 65). The guide gives no dimension for the plug: the pitch is read off Figure 1. juniper/ex4100-h-psu-connector@1 draws it. No standard is held for it'}
  terminal-350-6: {note: 'the six-position pluggable screw-terminal header on a 3.5 mm pitch of the dry contact alarm connector of the Juniper EX4100-H switches, a green plug with a captive screw at each end that ships preassembled (EX4100-H Switch Hardware Guide, Juniper Networks, published 2026-10-01, Figures 1 and 3 and Table 4). The guide gives no dimension for the plug: the pitch is read off those figures. juniper/ex4100-h-alarm-connector@1 draws it. No standard is held for it'}
  screw-terminal-4: {note: 'the four-pole DC feed connector at the left end of the TM-7124S face, labelled for two feeds (-48VA RETA and -48VB RETB): a green pluggable screw-clamp header held by a screw above and below. The drawing the part is drawn from shows four screw-clamp poles and states no pitch, so this key claims none; it covers the header as telco-systems/tm-7124s-dc-feed@1 draws it and no other four-position screw-terminal header. telco-systems/tm-7124s-dc-cable-plug@1, a declared stand-in for the cable connector, mates it. No standard is held for it'}
  orv3-busbar: {note: 'the Open Rack v3 48 V bus-bar power connector on the rear of an IT tray: a blind-mate clip body with a vertical blade slot that engages the vertical bus bar of the rack as the tray slides home (Celestica DS6001 datasheet rev 120325: "48VDC Bus bar input", "2OU ORv3 form factor"). No document held states its maker or part number. common/orv3-busbar-connector@1 draws it. No standard is held for it'}
  telco-dc-block-3: {note: 'the three-cell pluggable DC connector on the face of the Telco Systems XM-3352 DC supply: a green block with a flange and a screw at each end and three cells in a row, printed "-" above the left cell and "+" above the right one (Telco Systems XM-3352 data sheet, its front photographs; the data sheet draws no connector and names none). No document held states its maker, series, pitch or gender, so this key claims none and no other three-cell connector; it covers the connector as telco-systems/xm3352-dc-header@1 draws it. The supply telco-systems/xm3352-psu-dc@1 composes that part and telco-systems/xm3352-dc-cable-plug@1, a declared stand-in for the cable connector, mates it. A vendor connector: no standard is held for it'}
  telco-dc-block-2: {note: 'the two-cell pluggable DC connector on the face of the Telco Systems XM-8424H DC supply: a green block with a screw at each end, two cells and a latch tab above the middle, and no pole mark legible beside it (Telco Systems XM-8424H data sheet, its front photographs; the data sheet draws no connector and names none). No document held states its maker, series, pitch or gender, so this key claims none and no other two-cell connector, the ECS4530 block of screw-terminal-2 among them; it covers the connector as telco-systems/xm8424-dc-header@1 draws it. The supply telco-systems/xm8424-psu-dc@1 composes that part and telco-systems/xm8424-dc-cable-plug@1, a declared stand-in for the cable connector, mates it. A vendor connector: no standard is held for it'}
  telco-ac-cloverleaf-3: {note: 'the three-lobe AC inlet on the face of the Telco Systems XM-3352 AC supply: a dark rectangular surround holding three round lobes, two above and one below, each with a pin (Telco Systems XM-3352 data sheet, its front photographs; the data sheet draws no inlet and names none). No document held states its type, maker or part number, so this key claims none and no other three-lobe inlet; it covers the connector as telco-systems/xm3352-ac-inlet@1 draws it. The supply telco-systems/xm3352-psu-ac@1 composes that part and telco-systems/xm3352-ac-cord-plug@1, a declared stand-in for the cord connector, mates it. A vendor connector: no standard is held for it'}
  breaker-1ru-guard: {cover: true, note: 'NOT A CONNECTOR - A COVER MOUNT. The face of a 1RU plug-in breaker, where its touch guard screws on; amphenol-ns/touch-guard-1ru@1 mates it. Registered here because a cover that ships on a part and comes off is the same mechanism as a dust cap in a port: one slot, one occupant, a default'}
