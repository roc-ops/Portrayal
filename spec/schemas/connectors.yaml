# spec/schemas/connectors.yaml
# Connector interfaces a port can present. A part presenting one is a SLOT
# (B3, docs/pluggables-caps-design.md): it accepts every part whose `mates:`
# names the interface - dust caps and plugs alike. No ladder: a connector
# either intermates or it does not.
format: 1
interfaces:
  lc: {standard: lc-duplex-receptacle, note: one LC bore}
  # SPANS: one lc-duplex connector fills TWO `lc` bores, so a duplex adapter
  # holds two levels of slot for one piece of hardware - its own, and the two
  # bores it composes - and the two are mutually exclusive (B3,
  # docs/pluggables-caps-design.md, "The duplex host"). `interface` names what
  # the spanned parts present and `count` how many of them there must be; the
  # pitch they sit at is this interface's own `standard` in standards.yaml, so
  # no figure is written twice.
  lc-duplex:
    standard: lc-duplex-receptacle
    note: two LC bores at the 6.25 duplex pitch, presented by the adapter itself
    spans: {interface: lc, count: 2}
  sc: {standard: sc-simplex-receptacle}
  rj45: {standard: rj45, note: 'an 8P8C modular jack; generic/rj45-plug@1 mates it (#610)'}
  mpo: {standard: mpo-adapter, note: 'MPO-8/12/24 share the opening; MPO-16 is keyed differently and is not this interface'}
  mpo16: {standard: mpo-adapter, note: 'MTP-16 (TIA 604-18 / FOCIS 18): the MPO opening with the key offset, so an MPO-8/12/24 plug does not mate it'}
  f-type: {standard: f-type, note: 'F (IEC 61169-24, ANSI/SCTE 02), 75 ohm by definition'}
  sma: {standard: sma, note: 'SMA (IEC 61169-15, MIL-STD-348); reverse-polarity SMA does not mate it and is not this interface'}
  smb: {standard: smb, note: 'SMB snap-on (IEC 61169-10); 50 and 75 ohm variants intermate, so impedance is an attr, not the interface'}
  mcx: {standard: mcx, note: 'MCX snap-on (IEC 61169-36); 50 and 75 ohm variants intermate; a recessed variant exists (see standards.yaml mcx)'}
  bnc: {standard: bnc, note: 'BNC bayonet (IEC 61169-8, MIL-STD-348); 50 and 75 ohm intermate, so impedance is an attr'}
  din-1-0-2-3: {standard: din-1-0-2-3, note: '1.0/2.3 push-pull (DIN 41626/2, the standard the HUBER+SUHNER catalogue names; IEC 61169-29 internationally); 50 and 75 ohm variants; spelled with hyphens, an interface may not contain a dot'}
  # AC appliance inlets (#785, docs/connectors-power-design.md). The cord end
  # that mates each is a generic plug; the far end of the cord is not a part.
  iec-c14: {standard: c14-inlet, note: 'IEC 60320-1 C14 appliance inlet; generic/c13-plug@1 mates it. A C15 or C17 connector is a different interface'}
  iec-c20: {standard: c20-inlet, note: 'IEC 60320-1 C20 appliance inlet; generic/c19-plug@1 mates it. A C21 connector is a different interface'}
  saf-d-grid: {standard: saf-d-grid, note: 'Anderson Power Products Saf-D-Grid receptacle (drawing 115171S1 rev 12; no IEC standard governs it); it sits in a C14 cutout but a C13 does not mate it'}
  # USB receptacles (#786, docs/connectors-usb-design.md). The cable plug that
  # mates each is a generic plug; the far end of the cable is not a part. An
  # interface is the connector, not the bus: none states a speed or a USB
  # generation.
  usb-a: {standard: usb-a, note: 'USB Standard-A receptacle (USB 2.0 specification, figure 6-7); generic/usb-a-plug@1 mates it. A USB 3.x Standard-A plug mates the same opening'}
  micro-usb-b: {standard: micro-usb-b, note: 'USB 2.0 Micro-B receptacle (Micro-USB Cables and Connectors Specification 1.01, figure 4-10); generic/micro-usb-b-plug@1 mates it. Micro-AB and the wider USB 3.x Micro-B are different interfaces'}
  usb-c: {standard: usb-c, note: 'USB Type-C receptacle (USB Type-C Cable and Connector Specification, figure 3-1); generic/usb-c-plug@1 mates it, either way up'}
  # D-subminiature and VGA connectors (#787, docs/connectors-dsub-design.md).
  # The hooded cable plug that mates each is a generic plug; the far end of
  # the cable is not a part. GENDER IS PART OF THE INTERFACE: each key names
  # the connector with the gender the library's panel part has, and a panel
  # connector of the other gender would be a different interface with its own
  # key, because the plug that mates it is the other plug.
  db9: {standard: db9, note: 'D-subminiature 9 position, shell size E (DE-9), MALE on the panel: pins, as std/db9@1 draws it; generic/db9-plug@1, a female cable plug, mates it. A female DE-9 on a panel would be a different interface'}
  hd15: {standard: hd15, note: 'High-density D-subminiature 15 position in shell size E (VGA), FEMALE on the panel: sockets, as std/vga@1 draws it; generic/hd15-plug@1, a male cable plug, mates it. The shell is the db9 shell and neither plug mates the other connector. A male HD-15 on a panel would be a different interface'}
  da15: {standard: da15, note: 'D-subminiature 15 position in two rows, shell size A (DA-15), FEMALE on the panel: sockets, as std/da15@1 draws it; generic/da15-plug@1, a male cable plug, mates it. A male DA-15 on a panel would be a different interface'}
  db25: {standard: db25, note: 'D-subminiature 25 position, shell size B (DB-25), FEMALE on the panel: sockets, as std/db25@1 draws it; generic/db25-plug@1, a male cable plug, mates it. A male DB-25 on a panel would be a different interface'}
