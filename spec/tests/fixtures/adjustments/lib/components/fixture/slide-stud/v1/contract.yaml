format: 1
kind: component
name: slide-stud
version: 1.0.0
class: screw
behaviour: mounts
description: >-
  Test fixture: the head of a stud, 6 across, that holds a sliding plate to a side plate through a
  slot. Its `finish` field paints the head, so a test can repaint a part that has moved.
fields:
  finish:
    label: Finish
    type: text
    default: '#d0d3d6'
provenance:
  size: >-
    estimated - a test fixture; the numbers are chosen for the tests.
  relief: >-
    estimated - a test fixture; the head stands 2 off the plate.
size: {w: 6.0, h: 6.0}
size-confidence: {w: estimated, h: estimated}
elements: {}
relief:
  features:
  - {node: head, cyl: 2.0, color: '#d0d3d6', confidence: estimated, source: 'test fixture'}
skins: [default]
