format: 1
kind: component
name: slide-rail
version: 1.0.0
class: mount
behaviour: mounts
description: >-
  Test fixture: a rail 80 by 10 that stands 7.5 off the plate it is fixed to, with a lip along its
  lower edge that slopes from 3 to 1.
provenance:
  size: >-
    estimated - a test fixture; the numbers are chosen for the tests.
  relief: >-
    estimated - a test fixture; the rail stands 7.5 off its plate.
size: {w: 80.0, h: 10.0}
size-confidence: {w: estimated, h: estimated}
elements:
  rail: {at: [0.0, 0.0], size: [80.0, 10.0], class: bezel}
relief:
  features:
  - {node: rail, out: 7.5, color: '#8e9399', confidence: estimated, source: 'test fixture'}
  - {node: lip, out: 3.0, profile: [[0, 3.0], [80, 1.0]], color: '#8e9399', confidence: estimated,
    source: 'test fixture'}
skins: [default]
