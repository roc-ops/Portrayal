<svg xmlns="http://www.w3.org/2000/svg" width="80.0mm" height="10.0mm" viewBox="0 0 80.0 10.0">
  <g id="rail">
    <rect x="0" y="0" width="80.0" height="8.0" fill="#b9bdc2"/>
  </g>
  <!-- a lip along the lower edge that slopes from 3 high at the left to 1 at
       the right: a relief `profile`, so a test moves heights that are not an `out` -->
  <g id="lip">
    <rect x="0" y="8.0" width="80.0" height="2.0" fill="#8e9399"/>
  </g>
</svg>
