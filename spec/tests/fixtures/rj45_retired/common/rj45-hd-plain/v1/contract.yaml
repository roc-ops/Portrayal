format: 1
kind: component
name: rj45-hd-plain
version: 1.3.0
class: port
profile: networking
description: High-density ganged RJ45 port with a jack-outline bezel and no LEDs
  (console/serial use on dense faceplates)
size: {w: 14.0, h: 12.0, d: 16.0}
attrs: {media: rj45}
provenance:
  depth: >-
    derived - the std/rj45-ganged@1 aperture this composes is 16.0 mm deep, and a bezel
    around an aperture is as deep as the aperture. Stated so the 3D view has a recess to
    extrude and a seated module has a hole to sit in: with the mating fix in #54 a module
    now actually seats here, and a cage with no depth put it in a flat patch painted on the
    panel. Not a new measurement - the number is the aperture's own, read through the part
    that composes it.
  bezel-window: generated from the std cavity silhouette (11.89 x 6.85 body
    + 4.0 x 2.6 keyway, TE 2497310-1 CAD) so the plate frames the recess exactly
    rather than approximating it
  size: measured (ES1010 square-on product photo)
  bezel: photo (console jack carries no LEDs)
  cutout: via std/rj45-ganged (ganged opening)
elements: {}
parts:
  - {ref: std/rj45-ganged@1, id: jack, at: [0.65, 0.5], behind: true}
relief:
  features:
    - node: bezel
      out: 0.5
      color: '#9aa0a8'
      confidence: estimated
      source: >-
        common/rj45-hd-plain@1 itself - unsourced. Four RJ45 bezel plates and the USB-A
        bezel all carry out 0.5: one estimate written five times. Their bezel WINDOWS are
        exact - generated from the TE 2497310-1 CAD cavity silhouette - so the opening is
        sourced and the plate's thickness is not.
connection-points:
  net: {at: [7.0, 6.0], direction: front}
skins: [default]
