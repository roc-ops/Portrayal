      depth and a lower casting from 28 to 253.
  chassis.plan-outline:
    confidence: estimated
    note: >-
      a test fixture: three bands that tile the height. The flange band has corners of 24 mm in four
      chords, a lobe 10 mm out on the right end and one 8 mm out on the rear long side. The upper
      casting has corners of 12 mm and the lower one of 9 mm, each in three chords, and neither
      reaches a side of the box.
