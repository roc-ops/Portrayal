      20.5 (solder) / 23.5 (quick connect). Does NOT dimension the shroud interior.

  - id: schurter-c20-dims
    title: "SCHURTER C20 appliance inlet - dimension drawing"
    org: SCHURTER AG
    status: acquired
    url: https://www.schurter.com/en/Components/Connectors/IEC-Appliance-Inlet-C20
    local: specs/schurter-c20-dimensions.png
    governs: [c19-inlet]
    notes: Panel cutout 32.4 +0.1/0 x 24.4 +0.1/0 max R4.5; flange 34.9 x 26.9
      (37.9 over the ears); PCB footprint dia-6 +/-0.05 and dia-2.2 holes, 32 +/-0.1
      pin span, 15.1 and 8.3 offsets. Companion drawing for the flying-lead C14
      series is specs/schurter-c14-screw-dimensions.png - cutout 29.0 +/-0.10 x
      21.5 +/-0.10 max R3, M3 at 40, flange 24.6 x 48.6 - which is why the C14
      cutout is recorded as series-specific rather than single-valued.

