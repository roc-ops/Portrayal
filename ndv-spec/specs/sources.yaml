    local: specs/sff-8433-r0.7.pdf
    governs: [sfp-module]
    notes: The governing source for ganged SFP+ - port pitch B04 14.25 Basic, bezel
      cutout C01 N x 14.25 + 1.2 by C02 10.40, corner radius C06 0.03 max, block
      pitch minimums C04/C05. Written because "some ganged configurations were
      incompatible amongst the industry" (Scope). Covers 1xN only.

