name: Device request
description: Ask for a device to be modelled, or say you are modelling one
title: "<vendor> <model>: "
labels: [device-request]
body:
  - type: input
    id: device
    attributes:
      label: Vendor and model
      placeholder: UfiSpace S9600-28DX
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Public sources you know of
      description: Datasheet, hardware installation guide, product page, gallery images. Links only; nothing is uploaded here.
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Do you have the hardware in hand?
      options: ["No", "Yes, and I can photograph and measure it", "Yes, but I cannot open or photograph it"]
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Are you modelling it yourself?
      options: ["I am modelling it, this issue claims it", "Requesting only"]
    validations:
      required: true
  - type: checkboxes
    id: paid
    attributes:
      label: Covering the cost
      description: >-
        Optional. Devices are modelled with AI, and inference costs money, so a
        request the maintainers build themselves moves up the list when it has
        support (a thumbs-up on this issue from others who need it) or when its
        cost is covered. Tick this if you would pay to have it built, and the
        maintainer will follow up with an estimate - on this issue, or by email
        from maintainer@portrayal.dev if you'd rather keep cost private; nothing is agreed
        until you accept it. Without either, the request stays open at a lower
        priority, and anyone can pick it up.
      options:
        - label: I'm open to paying to have this built
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual about the device
      description: Modular chassis, AC/DC variants, odd faceplate, components that do not exist in the library yet.
