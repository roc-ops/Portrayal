# The compiled library, published to npm (#526).
#
# One package per device, one for the component skins and one index, as
# `npm_packages.py` lays them out (#528). jsDelivr and unpkg serve them from
# there, which is the point: nobody fetches an artifact from us.
#
# NOTHING HERE DECIDES WHAT IS PUBLISHED. The packager reads what npm holds for
# every package, publishes the ones whose bytes changed and leaves the rest
# alone, so a run that has nothing new sends nothing and a run that failed
# partway is finished by running it again.
name: release

# ONLY ON REQUEST, AND A REAL PUBLISH IS ASKED FOR TWICE. npm never gives a
# version number back - an unpublished version cannot be reused - so no push,
# tag or release event reaches this file, and the button's default is a dry
# run: it builds, prices every package against the registry and prints what it
# would send.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm. Unticked, the run is a dry run.
        type: boolean
        default: false

permissions:
  contents: read

# ONE RELEASE AT A TIME, AND NONE IS CANCELLED. Each run reads the registry and
# then publishes against what it read; two at once would price the same change
# twice, and a cancelled one has sent some packages and not the index.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    # workflow_dispatch offers every branch; only main is ever released.
    if: github.ref == 'refs/heads/main'
    # HOSTED, AND NOT A VARIABLE. npm's trusted publishing refuses a self-hosted
    # runner, and none may be registered on this repository again (#656).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # THE ENVIRONMENT IS WHERE THE TOKEN LIVES AND WHO MAY USE IT. NPM_TOKEN is
    # an environment secret, not a repository one, so no other workflow and no
    # other job can read it; the environment admits only `main` and can ask for
    # the maintainer's approval before the job starts. The trusted publisher on
    # each package names this environment too.
    environment: npm
    # `id-token: write` lets the job mint the OIDC token npm exchanges for a
    # publish. It writes nothing to the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # NODE 22 AND AN npm 11, NOT THE GATES' NODE 20. Trusted publishing needs
      # Node 22.14 and npm 11.5.1; Node 20 ships npm 10, which does not know the
      # identity token is there and fails the publish as unauthenticated.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0

      - run: pip install -e .

      # WITH ITS LINT. The gates pass NO_LINT=1 because a lint job runs beside
      # the build; nothing runs beside this one.
      - name: build
        run: ./publish.sh --no-images

      # HOW A PUBLISH IS AUTHORISED. A package that already exists on npm is
      # published by trusted publishing: npm checks that the request comes from
      # this workflow file in this repository, and no secret is stored. A
      # package's FIRST publish cannot be - a trusted publisher is configured on
      # a package, and there is none to configure yet - so NPM_TOKEN, when it is
      # set, covers those. npm tries the identity first and falls back to the
      # token. docs/maintainers.md has the procedure.
      #
      # ONLY THIS STEP SEES THE TOKEN. The build runs every tool in the tree and
      # is handed nothing.
      - name: packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ !inputs.publish && '--dry-run' || '' }}
        # pipefail, or `tee` answers for the packager and a failed publish is green
        run: |
          set -o pipefail
          python3 spec/tools/portrayal/npm_packages.py --from-registry --publish $DRY_RUN \
            | tee "$RUNNER_TEMP/packages.txt"

      # ON A FAILED RUN TOO, AND THAT IS WHEN IT MATTERS MOST. A package sent
      # before the failure is on npm, so the next run does not call it a first
      # publish; this run's summary is the only list that says to trust it.
      - name: summary
        if: always()
        run: |
          {
            echo '```'
            grep -E '^(wrote|first publish|published|would publish)' "$RUNNER_TEMP/packages.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
