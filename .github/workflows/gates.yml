# The gates, on every pull request - because the failure that prompted this
# could only appear AFTER a merge.
#
# #100 gave the Dell R740xd its rear face and, with it, two PSU bays. #101 added
# a library-wide test asserting every multi-bay power group states its
# redundancy. Both were correct in isolation, neither branch could see the
# other, and main went red the moment the two landed within minutes of each
# other. Nothing was wrong with either change; the pair had simply never been
# run together, because nothing ran them together until somebody did it by hand.
name: gates

on:
  pull_request:
  push:
    branches: [main]
  # A FULL RUN ON MAIN, ON REQUEST. A push to main runs lint only (see `build`
  # below); this is the button for the day somebody wants the whole thing.
  workflow_dispatch:

# NO `paths-ignore`, AND THAT IS A DECISION (#183). The obvious saving is to
# skip the run on a docs-only diff, and this repository cannot: four files under
# docs/ are asserted by tests - `lint-rules.md` against the linter's own rule
# table, `modelling-a-device.md`, `optical-paths-design.md` and
# `what-a-configuration-cannot-say.md` - plus DESIGN.md and two CATALOGUE.md.
# A "docs-only" change is one of the ways this suite most easily goes red, so
# filtering it out would turn the cheapest failure into the one nobody catches.
# The saving is bought instead where it helps every run: a pip cache, a lint job
# that fails in half a minute, and one lint per run instead of three.

# READ-ONLY, AND PINNED BY SHA (#456). Neither job writes anything back - no
# comment, no status beyond its own, no push - so the token gets `contents: read`
# and nothing else, whatever the repository default happens to be. Once this
# repository is public, a pull request from a fork runs this file; a tag like
# `@v4` is a pointer its owner can move, a commit SHA is not. The comment beside
# each pin says which release it is, so a bump is a deliberate edit.
permissions:
  contents: read

# A second push to a PR makes the first run pointless - it is testing a tree
# nobody will merge.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WHERE THE JOBS RUN IS A REPOSITORY VARIABLE, NOT THIS FILE. While the
# repository is private, `GATES_RUNNER` names the label of a self-hosted pool
# (`portrayal-ci`) with six times the cores of a hosted runner; the suite is the
# long pole of every run and it scales with them. Unset the variable and both
# jobs are back on `ubuntu-latest` with no edit here - which is the step for
# going public, and the fallback if the machine is down.
#
# A PULL REQUEST FROM A FORK NEVER GETS THE VARIABLE'S ANSWER. A self-hosted
# runner executes whatever the pull request's tree says, on a machine that is
# not thrown away afterwards; that is acceptable for branches in this repository
# and never for a stranger's. The fork test comes first so that forgetting to
# unset the variable when the repository opens is not the thing that exposes it.
#
# WHAT A HOSTED RUNNER GAVE FOR FREE, THIS FILE NOW ASKS FOR: the self-hosted
# user has no sudo, so apt installs only what is missing; and several runners
# share one /tmp, so the pytest log lives under the job's own RUNNER_TEMP.
jobs:
  # LINT ON ITS OWN. It is the fastest gate and the one whose failure is most
  # often the whole story, so it answers in well under a minute instead of
  # behind a render log.
  #
  # `build` NO LONGER WAITS ON IT, and that is a trade. With `needs: lint` a run
  # joined the runner queue twice - once for lint, then again for build - and on
  # a busy pool of three the second wait was up to fifteen minutes (#573, the
  # night of 2026-09-24), longer than the build itself. Now both jobs queue at
  # once. What a broken manifest costs is a build run that was going to fail
  # anyway; what lint GATING buys is unchanged, because the gate is the merge:
  # merge-if-green refuses a head with any check-run that did not succeed, and
  # lint is one of them.
  lint:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.GATES_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      # ONLY WHAT LINT IMPORTS, which is the point of this job existing. The
      # suite's extra pulls numpy and pillow - tens of megabytes of wheel for a
      # job that reads YAML and validates it against a schema, and on a cold
      # cache that is most of the "fast" gone.
      #
      # `pip install -e .` IS THAT LIST NOW: pyproject's `dependencies` are
      # pyyaml and jsonschema and nothing else, so this stays seconds long and
      # the two names stop being duplicated in a YAML step (#178). The editable
      # install is also what makes `import portrayal` resolve, which every tool
      # now needs.
      - run: pip install -e .
      - name: lint
        run: python3 spec/tools/portrayal/lint.py --schemas spec/schemas --library library

  build:
    # NOT ON A PUSH TO MAIN. merge-if-green merges only a head that is green AND
    # up to date with main, and `--merge` of such a head gives main the very tree
    # that was just built and tested - so the build on the push re-ran twenty
    # minutes of work on a known answer, and on the self-hosted pool it held one
    # of three runners through every burst of merges. Lint still runs on the push
    # (a minute), and `workflow_dispatch` runs everything on request.
    if: github.event_name != 'push'
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.GATES_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # NODE IS INSTALLED, NOT INHERITED. Fourteen test modules shell out to it
      # and each carries `skipif(shutil.which("node") is None)`, so before this
      # line the suite depended on the runner image happening to ship it - and
      # the day it stopped, fourteen files would have gone quiet rather than red.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      # THE `test` EXTRA, which is the same list spec/requirements-ci.txt held and
      # in the one place a tool looks for it. Editable, so `import portrayal`
      # resolves for the tools the shell scripts run by path.
      - run: pip install -e ".[test]"

      # pdftoppm gates the OCR tests. Without it they SKIP, which is the one
      # thing this workflow exists to stop happening quietly.
      - name: poppler
        run: |
          command -v pdftoppm \
            || { sudo apt-get update && sudo apt-get install -y poppler-utils; }

      # BUILD BEFORE PYTEST, AND THIS ORDER IS THE POINT. Four test modules -
      # behaviour, config-scope, viewbox, state-css - skip themselves when
      # library/dist is missing, and dist is gitignored so a fresh checkout has
      # none. A run that tests before building reports 532 passed / 509 skipped
      # and looks green. That happened once, on a branch that changed 14
      # devices, and none of the rendering was exercised.
      #
      # publish.sh IS build.sh plus the exports, so this is one build and not
      # two, and it leaves library/exports regenerated for the check below.
      # --no-images: every rendered PNG under library/exports is gitignored, so
      # CI was building 1104 pictures and throwing them away inside the step
      # that costs a quarter of the run.
      #
      # NO_LINT=1 because the `lint` job runs it beside this one, and no head can
      # merge unless that job passed. That is the second of the three lints a run
      # used to do; the third is inside the suite and is skipped for the same
      # reason, below.
      - name: build and publish
        run: NO_LINT=1 ./publish.sh --no-images

      - name: devicelock
        run: python3 spec/tools/portrayal/devicelock.py --library library

      # The kit is eleven ES modules that nothing checked. `node --check` is a
      # syntax check and not a test suite, which is what the script claims;
      # before it, a broken module surfaced only if some python test happened to
      # shell out to the one that imports it.
      - name: kit
        run: cd kit && npm test

      # ONE WORKER PER CORE. The suite spends most of its wall clock waiting on
      # child processes - node for the kit tests, lint.py and render.py for the
      # tool tests - so the parent sits idle while a core is free. Measured on
      # this suite after the loader fix: 358s serial, 235s at -n 2, 177s at -n 4.
      #
      # `auto` and not a number, because the runner decides. A GitHub-hosted
      # ubuntu-latest has two cores; a larger runner would use them without this
      # line being touched. THE SELF-HOSTED POOL CAPS IT IN THE RUNNER'S OWN .env
      # (PYTEST_XDIST_AUTO_NUM_WORKERS=4, which xdist reads for `auto`): three
      # runners share six cores, and three jobs at `auto` put 36 workers on
      # them - tests went from about 6 minutes alone to 13 under load.
      #
      # PORTRAYAL_LINT_ALREADY_RAN retires the third lint of the run.
      # `test_lint_green` shells out and lints the whole library at 76s, which
      # made it the critical path INSIDE the suite - it cannot be split, which is
      # why parallelism flattened after two workers. It is worth its time
      # locally and is redundant here, because the `lint` job runs beside this
      # one and a merge needs both.
      #
      # NOTHING HERE SHARES MUTABLE STATE: the only test that writes outside a
      # tmp fixture makes its own tempfile.mkdtemp(), and the library the rest
      # read is read-only by libdata's own contract.
      - name: tests
        env:
          PORTRAYAL_LINT_ALREADY_RAN: '1'
        run: |
          set -o pipefail
          python3 -m pytest spec/tests -q -rs -n auto | tee "$RUNNER_TEMP/pytest.txt"

      # The guard for the failure above, and it checks WHICH test stopped running
      # rather than how many.
      #
      # IT CHECKS THAT THE SUITE RAN AT ALL FIRST, and that is not theoretical:
      # the first run of this workflow had no pytest installed, so the file held
      # one line of error text, the skip count parsed as zero, and this step
      # reported SUCCESS. A suite that never started looked exactly like a suite
      # with nothing skipped - the same shape of blindness the step exists to
      # prevent, one level up.
      #
      # THE ALLOW-LIST REPLACED A BUDGET OF FIVE. An integer is a global anyone's
      # legitimate optional test spends for everyone, and it says nothing about
      # what went quiet: `node` vanishing skips fourteen files at once and a
      # budget catches that only because fourteen happens to exceed five.
      # spec/allowed-skips.txt says which reasons are facts about the world.
      - name: no silent skipping
        if: always()
        run: |
          if ! grep -qE '[0-9]+ (passed|failed|error)' "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::pytest produced no summary line - the suite did not run."
            echo "::error::A missing interpreter or package looks like a clean result here."
            tail -20 "$RUNNER_TEMP/pytest.txt" || true
            exit 1
          fi
          python3 spec/tools/portrayal/check_skips.py "$RUNNER_TEMP/pytest.txt" spec/allowed-skips.txt

      # The exports are committed and a DCIM reads them, so a stale one is a
      # real defect rather than untidiness. publish.sh above has already
      # regenerated them from this tree; anything left in the diff is a change
      # somebody made without republishing. #100 merged that way and it went
      # unnoticed for two PRs.
      - name: exports are current
        run: |
          # `git diff` SEES ONLY TRACKED FILES, so a device whose configurations
          # produce a document that has never been committed slipped straight
          # past this gate: publish.sh wrote four new Edgecore device types and
          # the check reported clean, because an untracked file is not a
          # difference to `diff`. A NEW export is exactly the case this step
          # exists to catch - it is a document a DCIM would never receive.
          if ! git diff --quiet -- library/exports \
             || [ -n "$(git status --porcelain --untracked-files=all -- library/exports)" ]; then
            echo "::error::library/exports is stale - run ./publish.sh and commit the result"
            git --no-pager diff --stat -- library/exports
            git status --porcelain --untracked-files=all -- library/exports
            exit 1
          fi
