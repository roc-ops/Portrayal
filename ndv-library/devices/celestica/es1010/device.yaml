format: 1
kind: device
name: es1010
version: 0.7.0
manufacturer: celestica
model: ES1010
description: Celestica ES1010 - 1U 48-port 1GbE (PoE++) access switch with 4x 25G
  SFP28 uplinks; Broadcom TD3.X2, fixed 2+1 fans, 1+1 hot-swap AC PSUs
datasheet:
  title: Celestica ES1010 datasheet (cls_branded_datasheet_ES1010_111224)
  url: https://www.celestica.com/
  sha256: 7f3f95af70982d00e06cf319f604c55f247d9fc7bf1c56d86f43c9f528a30c12
provenance:
  chassis: datasheet (438.2 x 371.6 x 43.4 mm)
  layout: measured from a square-on product photo (working/celestica/product-front.png),
    calibrated on two independent references - the 438.2mm chassis body and the
    482.6mm rack width - which agree to 99.6 percent. Column pitch 13.99mm, extra
    8.0mm between the four blocks, first column centre 8.46mm from the faceplate
    edge. Supersedes the earlier oblique-photo reading (order and
    grouping are reliable, mm positions are NOT calibrated; column pitch 14.5mm
    estimated from the front photo and from fitting 24 columns plus the uplink
    and management clusters into 438.2mm). Needs caliper verification or a
    square-on photo before the geometry can be trusted.
  port-apertures: ganged block openings via std/rj45-module (estimated)
  psu: photo (Gospower G1482-1600WRA FRU, six faces)
  fans: datasheet (2+1 FIXED fans - not FRUs; three grilles seen on the rear photo)
attrs:
  asic: Broadcom TD3.X2
  switching-capacity: 148 Gbps
  cpu: Intel Denverton x86, 4C @ 2.1 GHz (8C @ 2.2 GHz option)
  memory: 16 GB DDR4 (32 GB option)
  storage: 64 GB M.2 SSD (up to 256 GB)
  encryption: 256b MACsec
  timing: optional IEEE 1588 and SyncE
  poe: optional IEEE 802.3af/at/bt Type 4 Class 8, 90 W per port, persistent PoE
  psus: 2x 1600 W hot-swap AC, 0:1 / 1:1 redundancy
  fans: 2+1 fixed (not field-replaceable)
  port-modes-rj45: 1000Base-T
  port-modes-sfp28: 1/10/25G
  mgmt-ports: 1x RJ45 console, OOB management as a combo pair (RJ45 at the mgmt
    stack and SFP in the top band share one interface), 2x USB 3.0 Type A
chassis:
  width: 438.2
  height: 43.4
  depth: 371.6
  ru: 1
