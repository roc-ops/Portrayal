format: 1
kind: device
name: dcp-r-9d-cs
version: 0.1.0
manufacturer: Smartoptics
model: DCP-R-9D-CS
description: >-
  40-channel colourless/directionless ROADM line unit, 1RU. Two rows of LC
  duplex adapters carrying channels 921-960 plus Line, 1510 OSC filter and
  cross-connects XC1-XC4, with ETH0 and RS232 management.
profile: optical
references:
  - title: Smartoptics DCP-R User Manual 14.0_A
  - title: Smartoptics DCP-R Visio stencil DCP-R_v260105.vssx (master r-9d)
provenance:
  chassis: manual DIMENSIONS (DCP-R) - 440mm (W) x 45mm (H) x 505mm (D), 1 RU
  port-positions: stencil ShapeSheet connection points, which Visio stores as
    fractions of shape width/height and therefore survive without the drawing
    scale. Resolved against the 19-inch rack width the master is drawn at.
  port-pairing: each LC duplex adapter carries two connection points about
    6.6mm apart, one per fibre; adapters recovered by pairing those
  column-grid: top and bottom rows agreed across all 23 columns, so one
    averaged grid is used and the drawing jitter discarded
  y-scale: this master is drawn 46.0mm tall against a 45mm chassis, so y was
    scaled by 45/46.0. The 34D master needed no such correction - a reminder
    that masters in one stencil are not all drawn to the same scale
  channel-plan: silkscreen - channels alternate in pairs between rows, 921/922
    top then 923/924 bottom, continuing to 960
attrs:
  channels: 40
  form-factor: 1RU
chassis: {width: 440, height: 45, depth: 505, ru: 1}
