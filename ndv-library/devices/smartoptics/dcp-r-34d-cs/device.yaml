format: 1
kind: device
name: dcp-r-34d-cs
version: 0.1.0
manufacturer: Smartoptics
model: DCP-R-34D-CS
description: >-
  34-channel colourless/directionless cross-connect ROADM line unit, 1RU. Two
  rows of LC duplex adapters (XC01-XC34) plus Line, 1510 OSC filter and OSC
  monitor, with ETH0 and RS232 management.
profile: optical
references:
  - title: Smartoptics DCP-R User Manual 14.0_A
  - title: Smartoptics DCP-R Visio stencil DCP-R_v260105.vssx (master r-34d-cs)
provenance:
  chassis: manual DIMENSIONS (DCP-R) - 440mm (W) x 45mm (H) x 505mm (D), 1 RU.
    The manual also states power and fan units are in the back panel, so this is
    a standalone chassis and not a plug-in unit
  port-positions: stencil ShapeSheet connection points. Visio stores these as
    FRACTIONS of shape width/height, so they survive without knowing the drawing
    scale - resolved against the 19-inch rack width the master is drawn at, then
    expressed from the body edge
  port-pairing: each LC duplex adapter carries two connection points 6.6mm apart
    (the Tx and Rx fibres); adapters were recovered by pairing those
  column-grid: top and bottom rows agreed to within 0.15mm across all 17 columns,
    so a single averaged grid is used and the drawing jitter discarded
  silkscreen: read from the stencil master artwork - XC01 alone, then eight
    abutting pairs at 13.24mm with about 17.3mm between pairs
