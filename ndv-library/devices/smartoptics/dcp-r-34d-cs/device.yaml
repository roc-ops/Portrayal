format: 1
kind: device
name: dcp-r-34d-cs
version: 0.1.0
manufacturer: Smartoptics
model: DCP-R-34D-CS
description: >-
  34-channel colourless/directionless cross-connect ROADM line unit, 1RU. Two
  rows of LC duplex adapters (XC01-XC34) plus Line, 1510 OSC filter and OSC
  monitor, with ETH0 and RS232 management.
profile: optical
references:
  - title: Smartoptics DCP-R User Manual 14.0_A
  - title: Smartoptics DCP-R Visio stencil DCP-R_v260105.vssx (master r-34d-cs)
provenance:
  chassis: manual DIMENSIONS (DCP-R) - 440mm (W) x 45mm (H) x 505mm (D), 1 RU.
    The manual also states power and fan units are in the back panel, so this is
    a standalone chassis and not a plug-in unit
  port-positions: stencil ShapeSheet connection points. Visio stores these as
    FRACTIONS of shape width/height, so they survive without knowing the drawing
    scale - resolved against the 19-inch rack width the master is drawn at, then
    expressed from the body edge
  port-pairing: each LC duplex adapter carries two connection points 6.6mm apart
    (the Tx and Rx fibers); adapters were recovered by pairing those
  column-grid: top and bottom rows agreed to within 0.15mm across all 17 columns,
    so a single averaged grid is used and the drawing jitter discarded
  silkscreen: port grouping read from the stencil master - XC1 alone, then
    eight abutting pairs at 13.24mm with about 17.3mm between pairs. Label text
    corrected from a rack photo - the device prints XC1, not the stencil's XC01,
    and every port carries a small Tx/Rx box between its name and the adapter,
    reversed on the bottom row
  markings: photo - IEC 60825 laser hazard triangles in the gap between the two
    port blocks, one above the top row and one below the bottom
  rear-layout: photo IMG_2181 of racked DCP-R units - PSU with integrated fan
    and C14 inlet at each end, mirrored; honeycomb vent panel across the centre;
    management block right of centre. Block positions are approximate to about
    3mm - the photo has uncorrected perspective and partial cable occlusion, so
    it fixes the structure and order but not exact millimetres
  side-top-bottom: IMG_2188 shows the lid, so these now carry the real finish -
    a light silver body with the black front panel wrapping about 12.7mm (half
    an inch) back along every face. Still no vents, screws or lid labels - the
    photo shows the finish and the panel depth but not those details, so they
    are left out rather than invented
  psu-part: label - Gospower G1251-0550WNA, P/N CRPS0550-AH, and the fan
    sticker reads 550W Platinum CRPS. So the module is a standard CRPS 1U part
    at 73.5 x 40 x 185, not the 84mm-wide estimate taken from the racked photo,
    and both bays sit flush to the chassis edges
  psu-orientation: photo - both modules are fitted the same way round, fan
    inboard of the inlet, so the C14 sits at the far right on PSU-2 and inboard
    on PSU-1. They are not mirrored
  rear-mgmt-block: stencil master dcp-r-rear, which is orthographic - a 2x2
    ganged RJ45 shell (ETH 2 / ETH 4 over ETH 1 / ETH 3), ESD warning, Tx and Rx
    LEDs, an ETH 5 SFP cage and a recessed RESET button
