format: 1
kind: device
name: dcp-sc-28p
version: 0.1.0
manufacturer: Smartoptics
model: DCP-SC-28P
description: >-
  28-port service channel unit, 1RU. Twenty-four RJ45 service ports in two
  rows flanking four LC duplex ports, plus a PROBE port, with ETH0 and RS232
  management.
profile: optical
references:
  - title: Smartoptics DCP-SC-28P User Manual R14.0_A
  - title: Smartoptics DCP-R Visio stencil DCP-R_v260105.vssx (master sc-28p)
provenance:
  chassis: DCP-SC-28P User Manual - unit height is 1U (1.77 in); width and depth
    taken from the DCP-R chassis the family shares (440 x 505mm)
  port-positions: stencil ShapeSheet connection points, stored by Visio as
    fractions of shape width/height and resolved against the 19-inch rack width
  port-count: the recovered layout confirms the model name - 24 RJ45 on a
    14.3mm column pitch plus 4 LC duplex, i.e. 28 ports, and a separate PROBE
  port-identification: RJ45 columns carry one connection point per port; the LC
    columns carry two about 6.4mm apart, one per fibre, which is what
    distinguishes them
  column-pitch: raw connection points jitter between 13.85 and 14.80mm, which
    put ports 7/9 and 8/10 into a 0.15mm overlap that lint L13 caught. Each RJ45
    group is therefore fitted to a uniform pitch across its span - 14.32mm left,
    14.34mm right - and the drawing jitter discarded
  connector-choice: rj45-hd (14.0mm) is used rather than rj45-shielded (15.8mm)
    because the measured 14.3mm column pitch cannot accommodate the latter
attrs:
  ports: 28
  form-factor: 1RU
