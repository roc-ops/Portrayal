format: 1
kind: device
name: dcp-sc-28p
version: 0.1.0
manufacturer: Smartoptics
model: DCP-SC-28P
description: >-
  28-port service channel unit, 1RU. Twenty-four RJ45 service ports in two
  rows flanking four LC duplex ports, plus a PROBE port, with ETH0 and RS232
  management.
profile: optical
references:
  - title: Smartoptics DCP-SC-28P User Manual R14.0_A
  - title: Smartoptics DCP-R Visio stencil DCP-R_v260105.vssx (master sc-28p)
provenance:
  chassis: DCP-SC-28P User Manual - unit height is 1U (1.77 in); width and depth
    taken from the DCP-R chassis the family shares (440 x 505mm)
  port-positions: stencil ShapeSheet connection points, stored by Visio as
    fractions of shape width/height and resolved against the 19-inch rack width
  port-count: the recovered layout confirms the model name - 24 RJ45 on a
    14.3mm column pitch plus 4 LC duplex, i.e. 28 ports, and a separate PROBE
  port-identification: RJ45 columns carry one connection point per port; the LC
    columns carry two about 6.4mm apart, one per fiber, which is what
    distinguishes them
  column-pitch: raw connection points jitter between 13.85 and 14.80mm, which
    put ports 7/9 and 8/10 into a 0.15mm overlap that lint L13 caught. Each RJ45
    group is therefore fitted to a uniform pitch across its span - 14.32mm left,
    14.34mm right - and the drawing jitter discarded
  connector-choice: rj45-hd (14.0mm) is used rather than rj45-shielded (15.8mm)
    because the measured 14.3mm column pitch cannot accommodate the latter
  rear-layout: photo IMG_2181 of racked DCP-R units - PSU with integrated fan
    and C14 inlet at each end, mirrored; honeycomb vent panel across the centre;
    management block right of centre. Block positions are approximate to about
    3mm - the photo has uncorrected perspective and partial cable occlusion, so
    it fixes the structure and order but not exact millimetres
  side-top-bottom: IMG_2188 shows the lid, so these now carry the real finish -
    a light silver body with the black front panel wrapping about 12.7mm (half
    an inch) back along every face. Still no vents, screws or lid labels - the
    photo shows the finish and the panel depth but not those details, so they
    are left out rather than invented
  psu-part: label - Gospower G1251-0550WNA, P/N CRPS0550-AH, and the fan
    sticker reads 550W Platinum CRPS. So the module is a standard CRPS 1U part
    at 73.5 x 40 x 185, not the 84mm-wide estimate taken from the racked photo,
    and both bays sit flush to the chassis edges
  psu-orientation: photo - both modules are fitted the same way round, fan
    inboard of the inlet, so the C14 sits at the far right on PSU-2 and inboard
    on PSU-1. They are not mirrored
  rear-mgmt-block: none. The SC-28P carries no rear management ports - its
    manual places only power and fan units in the back panel, and its ETH0 and
    RS232 are on the front. An earlier revision copied the DCP-R rear here by
    mistake; the vent now spans what that block wrongly occupied
