profile: networking
datasheet:
  title: Edgecore DCS203 (AS7326-56X) Data Sheet R10
  url: https://www.edge-core.com/product/dcs203/
  sha256: 23267a41b66743e5d81b1697fc4c88f2602fcbb122fac1afa78af6023c18d364
provenance:
  attrs: datasheet (Ports/Key-Components/Performance/Power/Physical sections)
  chassis: datasheet (Dimensions WxDxH 43.84 x 53.6 x 4.35 cm; Weight 10 kg)
  port-arrangement: 3 rows x 16 columns confirmed on the physical unit by the owner.
    The datasheet panel figure is a marketing render whose column widths do not
    reconcile - 24 columns would need 342mm and leave no room for the mgmt block
  port-pitch: standard - SFP columns on the SFF-8433 basic 14.25, QSFP on the 19.0
    measured from TE 2322551-4. The datasheet figure measures 14.45, the same ~1.4
    percent scale error the S9510 HIG figure carried, so the standards are used
    rather than the figure
  port-row-pitch: estimated (~14.5-15.0 to fit three rows in the 43.5mm face;
    the belly-to-belly reference from TE 2007562-6 is 15.0) - verify with calipers
  rear-layout: datasheet figure (PSU2 | 6 fans | PSU1, grounding point each end),
    geometry reused from the AS7726-32X which shares this chassis width
  mgmt-block: photo-inferred (IMG_2141 racked front) - 2x 10G stacked, RJ45 mgmt and
    console stacked, USB-A; positions estimated
  psu-fan-reuse: the AC PSU FRU part numbers (F0TZZ5654019A / F0TZZ5654020A) are
    identical to the AS7726-32X, so common/psu-ac-650 is the same physical module
attrs:
  asic: Broadcom BCM56873 Trident 3
  cpu: Intel Xeon D-1518, 4-core @ 2.2 GHz
  memory: 16 GB DDR4 (2x 8 GB SO-DIMM)
  storage: 64 GB M.2 SSD (MLC)
  spi-flash: 2x 16 MB
  switching-capacity: 2 Tbps (4 Tbps full duplex)
  forwarding-rate: 2 Bpps
  packet-buffer: 32 MB integrated
  jumbo-frames: 9000 bytes
  mac-table: 32 K min / 288 K max
  vlan-ids: 4 K
  psus: 2x redundant, load-sharing, hot-swappable AC or -48 VDC
  fans: 5+1 redundant, hot-swappable
  software: ONIE installer
  port-modes-qsfp28: 1x 100G, 1x 40G, 4x 25G, 4x 10G (breakout via DAC)
  optics-sfp28: 1G fixed / 10G / 25G single-rate transceivers, AOC, DAC;
    10GBASE-RJ45 supported on H/W R01G or newer
  optics-qsfp28: 100GBASE-SR4/CWDM4/LR4, 100G-DAC/AOC, 40GBASE-SR4/LR4, 40G-DAC/AOC
  mgmt-ports: 1x RJ-45 console, 1x RJ-45 100/1000BASE-T, 2x 10G, 1x USB-A storage
  operating-temp-f2b: 0 to 45 C
  operating-temp-b2f: 0 to 40 C
