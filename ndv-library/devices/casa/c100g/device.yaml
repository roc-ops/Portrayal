format: 1
kind: device
name: c100g
version: 0.1.0
manufacturer: Casa Systems
model: C100G
description: 'Casa C100G CMTS/CCAP - 13RU, 14 paired front/rear slots. Front and rear slot
  N are two halves of one logical position: a DOCSIS line card in front N requires its I/O
  partner in rear N.'
provenance:
  chassis: 'datasheet - Table A-1 of the C100G Hardware Installation Guide (rev 07/08/2022):
    22.5in (571mm) H, 19in (482mm) W, 15.25in (386mm) D, 13RU'
  slots: datasheet - 14 module slots front and rear, SMM in front 6 and 7
  slot-pitch: ESTIMATED - arithmetic, not measured. 19in face less ~21mm of ear each side
    gives ~440 interior, over 14 slots = 31.43. The guide figures are schematic and cannot
    be scaled - see docs/casa-modular-chassis.md
  card-height: ESTIMATED - bracketed by two schematic readings that disagree by 10 percent
    (461mm and 417mm), 440 is the midpoint
  configurations: datasheet - the redundancy layouts are stated per scheme in Chapter 3 (Remote
    PHY) and Chapter 4 (BDM)
  smm-slots: front 6 and 7 are SMM slots and are deliberately NOT declared as bays yet. The
    schema requires every bay to accept at least one component, and no SMM is modelled so
    far, so declaring them would mean inventing an occupant. They come back when casa/smm
    exists - Figures 1-7 to 1-10 cover four variants
attrs:
  role: CMTS/CCAP
  slots: 14 front + 14 rear, associated 1:1
  smm-slots: front 6 and 7
  rack: 13 RU
  weight: 132 lb / 61.23 kg fully loaded
  power: -42 to -60 VDC, 20 A nominal per feed at -48 VDC
