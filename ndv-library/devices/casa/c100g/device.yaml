format: 1
kind: device
name: c100g
version: 0.1.0
maturity: modelled
manufacturer: Casa Systems
model: C100G
description: 'Casa C100G CMTS/CCAP - 13RU, 14 paired front/rear slots. Front and rear slot
  N are two halves of one logical position: a DOCSIS line card in front N requires its I/O
  partner in rear N.'
provenance:
  chassis: 'datasheet - Table A-1 of the C100G Hardware Installation Guide (rev 07/08/2022):
    22.5in (571mm) H, 19in (482mm) W, 15.25in (386mm) D, 13RU'
  slots: datasheet - 14 module slots front and rear, SMM in front 6 and 7
  slot-pitch: drawing - 426.6mm card region from Fig 1-1 over 14 slots = 30.47
  card-height: drawing - Figure 1-1 puts the card band between the slot-number strip at 18.9
    percent and the FILTER band at 79.4 percent of chassis height, so 108.1 to 453.5, a 345.5
    card. An earlier 440 was wrong and made the cards overrun the space above
  configurations: datasheet - the redundancy layouts are stated per scheme in Chapter 3 (Remote
    PHY) and Chapter 4 (BDM)
  smm-slots: datasheet - front 6 and 7 take the SMM. Modelled with the 8x10GigE variant (Fig
    1-8); the guide also lists SMM 2x10GE, SMM 300G and SMM 300Gm, which are further skins
    or components when needed
  bands: drawing - front is air baffle above (0 to 108.1), cards, then FILTER (453.5) and
    the fan tray below. Rear is fan assemblies above (0 to 105.9), cards, then two power entry
    modules from 491.4. Fig 1-1 and Fig 1-2
  card-aspect: NOTE - the isolated card figures (1-14, 1-15, 1-8) are drawn NARROWER than
    the real card. Their faceplate aspect is 13.26; the chassis front view gives 345.5 by
    30.46 = 11.34, about 17 percent wider. Port positions taken from those figures are therefore
    used as FRACTIONS of the faceplate and stretched to this width, not as absolute geometry
  width: 'Table A-1 quotes 19in / 482, which is the rack face INCLUDING the mounting ears.
    Jason confirmed from a real chassis that the ears sit outside the body and that there
    is only a 1/8in (3.175mm) flange either side of the cards. Working back: the card region
    measures 426.6 in Fig 1-1, so the BODY is 426.6 + 2x3.175 = 432.95, and the ears must
    protrude 24.5 each side to reach 482. Drawn as the body only - the ears are deliberately
    omitted for now and can be added as their own part'
  airflow: Jason - air is drawn in at the rear, passes behind and through the cards, and exhausts
    at the FRONT bottom. So the grille below the filter is the fan EXHAUST, not an intake,
    and it is a coarse wire grille rather than perforation
  rear-slots: 'datasheet - C100G rear side (11+1) in Chapter 4, verbatim: slots 0-4 6+12 IO
    or IO2; slot 5 LC-BDM-SWITCH for BDM line module redundancy; slots 6 and 7 SMM-SW-BDM-A
    and -B respectively, with the guide noting that correct slot positions are indicated on
    the module faceplates; slot 8 6+12 SW-IO or SW-IO2, non-redundant under 11+1; slots 9-13
    6+12 IO or IO2'
  rear-order: 'Jason - the rear slot order is MIRRORED. Rear N connects to front N, so viewed
    from the back the numbering runs right to left: rear 0 sits directly behind front 0, which
    is on the far side when you walk round. Rear bay x is therefore FL + (13 - N) * pitch,
    not FL + N * pitch'
  front-furniture: photograph + drawing - the top is a sloped shroud carrying the casa systems
    mark and the model, with a row of card-guide tabs along its lower lip, then the black
    slot-number strip. Numbers run 0 to 13 with 6 and 7 in RED, which is how both the product
    photo and Fig 1-1 mark the SMM pair
