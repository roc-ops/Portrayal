configurations:
  bdm2m-11plus1:
    description: BDM2m "11+1" - the vendor's name for it. Redundancy collapses to a single
      protecting slot. Rear 5 takes the LC-BDM-SWITCH that does the protecting; rear 8 takes
      a combined 6+12 SW-IO, which is what frees front/rear 8 to carry traffic instead of
      standing spare. Neither slot carries a plain 6+12 I/O.
    default: true
    bays:
      front-0: casa/bdm@1
      front-1: casa/bdm@1
      front-2: casa/bdm@1
      front-3: casa/bdm@1
      front-4: casa/bdm@1
      front-5: casa/bdm@1
      front-8: casa/bdm@1
      front-9: casa/bdm@1
      front-10: casa/bdm@1
      front-11: casa/bdm@1
      front-12: casa/bdm@1
      front-13: casa/bdm@1
      rear-0: casa/io-6p12@1
      rear-1: casa/io-6p12@1
      rear-2: casa/io-6p12@1
      rear-3: casa/io-6p12@1
      rear-4: casa/io-6p12@1
      rear-9: casa/io-6p12@1
      rear-10: casa/io-6p12@1
      rear-11: casa/io-6p12@1
      rear-12: casa/io-6p12@1
      rear-13: casa/io-6p12@1
      front-6: casa/smm-8x10g@1
      front-7: casa/smm-8x10g@1
      rear-8: casa/io-6p12-sw@1
      rear-5: casa/lc-sw-bdm@1
      rear-6: casa/smm-sw-bdm-a@1
      rear-7: casa/smm-sw-bdm-b@1
  docsis-classic:
    description: Classic DOCSIS. Redundancy is per side, one protecting slot each - front/rear
      5 and 8 - with LC Switch behind both.
    bays:
      front-0: casa/bdm@1
      front-1: casa/bdm@1
      front-2: casa/bdm@1
