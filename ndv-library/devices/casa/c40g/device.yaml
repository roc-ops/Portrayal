format: 1
kind: device
name: c40g
version: 0.1.0
manufacturer: Casa Systems
model: C40G
description: Casa C40G CMTS/CCAP - 6RU, 6 paired front/rear slots. Takes the same line cards
  as the C100G but HORIZONTALLY, so the card is one model placed at rotate 90.
provenance:
  chassis: 'datasheet - Table A-1 of the C40G Hardware Installation Guide (rev 07/07/2022):
    10.47in (265.90mm) H, 19in (482mm) W, 15.25in (388.45mm) D, 6RU'
  width: body 432.95, the same as the C100G - both are 19in rack devices and the ears sit
    outside that. See the C100G provenance for the derivation
  orientation: Jason, confirmed against Fig 1-1 - the C40G takes the SAME line cards as the
    C100G but on their side, so every bay is rotate 90
  slot-order: drawing + photograph - slots run 5 at the TOP down to 0 at the bottom, printed
    on the chassis, with 3 and 2 in red as the SMM pair
  rear-order: NOT mirrored, unlike the C100G. Walking round a chassis flips left to right,
    not top to bottom - and these cards stack vertically, so rear 5 stays at the top where
    front 5 is
  rear-slots: photograph - a C40G rear shows plain 6+12 I/O in slots 0 and 5, the 6+12 SW
    I/O in slot 4, and SMM-SW-BDM B and A in 3 and 2. Slot 1 takes the LC-BDM-SWITCH that
    protects, per the 3+1 scheme
attrs:
  role: CMTS/CCAP
  slots: 6 front + 6 rear, associated 1:1
  smm-slots: front 2 and 3
  card-orientation: horizontal
  redundancy: 3+1 with BDM (slot 1 protects, slot 4 active); classic DOCSIS protects per side
    at 1 and 4
chassis:
  width: 432.95
  height: 265.9
  depth: 388.45
  ru: 6
  color: '#a7a9ac'
configurations:
  bdm-3plus1:
    description: 'BDM "3+1". Redundancy collapses to a single protecting slot: rear 1 takes
      the LC-BDM-SWITCH, and rear 4 takes a combined 6+12 SW-IO which frees slot 4 to carry
      traffic.'
    default: true
    bays:
      front-0: casa/bdm@1
      front-1: casa/bdm@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/bdm@1
      front-5: casa/bdm@1
      rear-0: casa/io-6p12@1
      rear-1: casa/lc-sw-bdm@1
      rear-2: casa/smm-sw-bdm-a@1
      rear-3: casa/smm-sw-bdm-b@1
      rear-4: casa/io-6p12-sw@1
      rear-5: casa/io-6p12@1
  docsis-classic:
    description: Classic DOCSIS. Redundancy is per side - front/rear 1 and 4 - with an LC
      Switch behind both.
    skins:
      bdm: bdm
    bays:
      front-0: casa/bdm@1
      front-1: casa/bdm@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/bdm@1
      front-5: casa/bdm@1
      rear-0: casa/io-6p12@1
      rear-1: casa/lc-sw-bdm@1
      rear-2: casa/smm-sw-bdm-a@1
      rear-3: casa/smm-sw-bdm-b@1
      rear-4: casa/io-6p12-sw@1
      rear-5: casa/io-6p12@1
