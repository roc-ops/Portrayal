<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NDV — scan ortho snapshots</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181b; color: #d7dbdf; margin: 0; overflow: hidden; }
  #bar { position: absolute; top: 0.6rem; left: 0.8rem; z-index: 5; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  button { background: #2b2f33; color: #d7dbdf; border: 1px solid #4a4f55; border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.8rem; }
  #hud { position: absolute; bottom: 0.8rem; left: 0.8rem; z-index: 5; font-size: 0.8rem; color: #9aa1a8; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar"><strong style="font-size:0.9rem">Scan ortho</strong>
  <button data-f="top">top</button><button data-f="bottom">bottom</button>
  <button data-f="front">front</button><button data-f="rear">rear</button>
  <button data-f="left">left</button><button data-f="right">right</button>
  <button id="orbit">orbit</button>
</div>
<div id="hud">loading model…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const DEV = new URLSearchParams(location.search).get('device') || 'hlx-tgv';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181b);
scene.add(new THREE.AmbientLight(0xffffff, 2.2));
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
let camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.001, 100);
const controls = new OrbitControls(camera, renderer.domElement);
let bbox = null, size = new THREE.Vector3(), center = new THREE.Vector3();

function face(name) {
  if (!bbox) return;
  const d = Math.max(size.x, size.y, size.z) * 2;
  const dirs = {top: [0, 1, 0], bottom: [0, -1, 0], front: [0, 0, 1], rear: [0, 0, -1],
                left: [-1, 0, 0], right: [1, 0, 0]};
  const [dx, dy, dz] = dirs[name];
  camera.position.set(center.x + dx * d, center.y + dy * d, center.z + dz * d);
  camera.up.set(0, Math.abs(dy) ? 0 : 1, Math.abs(dy) ? (name === 'top' ? -1 : 1) : 0);
  camera.lookAt(center);
  const spans = {top: [size.x, size.z], bottom: [size.x, size.z], front: [size.x, size.y],
                 rear: [size.x, size.y], left: [size.z, size.y], right: [size.z, size.y]};
  const [w, h] = spans[name];
  const asp = innerWidth / innerHeight;
  let hw = w / 2 * 1.05, hh = h / 2 * 1.05;
  if (hw / hh < asp) hw = hh * asp; else hh = hw / asp;
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.near = 0.0001; camera.far = d * 4;
  camera.updateProjectionMatrix();
  controls.target.copy(center); controls.update();
  document.getElementById('hud').textContent =
    `${name}: span ${w.toFixed(3)} x ${h.toFixed(3)} model-units`;
}
document.querySelectorAll('button[data-f]').forEach(b => b.onclick = () => face(b.dataset.f));
document.getElementById('orbit').onclick = () => { controls.enableRotate = true; };

const tex = new THREE.TextureLoader().load(`reference/${DEV}/model_tex.png`);
tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = true;
new OBJLoader().load(`reference/${DEV}/model.obj`, m => {
  m.traverse(o => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({map: tex}); });
  scene.add(m);
  bbox = new THREE.Box3().setFromObject(m);
  bbox.getSize(size); bbox.getCenter(center);
  document.getElementById('hud').textContent =
    `model loaded: ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)} units`;
  face('top');
}, undefined, e => { document.getElementById('hud').textContent = 'OBJ load failed: ' + e; });
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script>
</body>
</html>
