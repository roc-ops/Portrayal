format: 1
kind: module
name: io-6p12
version: 1.0.0
class: line-card
profile: networking
description: >-
  Casa 6+12 I/O module - the rear half of a BDM position, carrying six
  downstream (D0-D5) and twelve upstream (U0-U11) MCX jacks. Pairs with a BDM
  in the associated front slot. The IO2 variant is the same faceplate at
  5-204 MHz instead of 5-85 MHz.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs: {media: coax, connector: mcx, downstream: '6', upstream: '12', spectrum: 5-85MHz}
provenance:
  layout: drawing - Figure 1-15 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Twelve U jacks in the left column, six D in the right,
    interleaved. Port COUNT and ARRANGEMENT are read straight off the figure
    and are reliable
  size: ESTIMATED. The guide figures are schematic, not to scale - the drawn
    chassis aspect is 0.936 against a specified 0.844, and the drawn slot
    pitches are irregular (108, 130, 78, 112 px for what should be one pitch).
    Width is arithmetic from Table A-1 instead - 19in rack, ~440mm interior,
    14 slots gives 31.43. Height is bracketed by two schematic estimates that
    disagree by 10 percent - 461mm from the front-view proportion, 417mm from
    the Fig 1-15 faceplate aspect - so 440 is the midpoint. Needs a caliper
  connector: drawing - the figure's cable note reads "Single quad-shielded
    cable with MCX male snap-on plug; 75 ohm male F-connector on opposite end",
    so the jack on this card is MCX and the F-connector is at the headend end
  bore: ESTIMATED - no MCX dimension in the guide
  comb: photograph - a C40G rear shot shows every I/O card fronted by a cable
    comb carried on brass standoffs. Jason measured the standoffs at about 3/8in
    (9.5mm) proud of the faceplate and the comb itself at about 1/16in (1.6mm)
    thick. The comb is notched per port and carries the U0-U11 / D0-D5 silkscreen,
    and the labels appear on BOTH the card face and the comb - the comb
    repeats them where the cable actually lands rather than replacing them
