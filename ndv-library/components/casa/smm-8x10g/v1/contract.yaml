format: 1
kind: module
name: smm-8x10g
version: 1.0.0
class: supervisor
profile: networking
description: >-
  Casa high-density SMM 8x10GigE - the C100G/C40G supervisor and switch module.
  Eight 10GigE SFP+ (XG0-XG7), two GigE SFP (G0, G1), a 10/100BASE-T management
  RJ45 and an RS-232 console RJ45, plus STATUS, ACTIVE and ALARM LEDs.
size: {w: 26.26, h: 345.5, d: 380.0}
attrs: {role: supervisor, sfp-plus: '8', sfp: '2', mgmt: 10/100BASE-T, console: RS-232}
provenance:
  layout: drawing - Figure 1-8 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Port order down the faceplate is 10/100MI, XG0 to XG7,
    G0, G1, then the console - XG numbering runs UP the card, so XG0 is nearest
    the management port at the top
  ports: drawing - the caption states eight 10GigE and two GigE, which the
    twelve detected cage bodies match once console and management are counted
  size: ESTIMATED, shared with the rest of the family - this faceplate measures
    201 x 2614 px against the BDM's 196 x 2610 and the 6+12 I/O's 197 x 2613.
    Absolute numbers are Table A-1 arithmetic; the figures are schematic
  leds: drawing - STATUS and ACTIVE drawn lit, ALARM unlit, plus a dark/green
    pair beside each SFP and SFP+ cage
