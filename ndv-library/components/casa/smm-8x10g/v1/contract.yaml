  - {ref: common/sfp-plus-cage@2, id: xg1, at: [7.23, 81.68], rotate: 90}
  - {ref: common/sfp-plus-cage@2, id: xg2, at: [7.23, 101.86], rotate: 90}
  - {ref: common/sfp-plus-cage@2, id: xg3, at: [7.23, 119.06], rotate: 90}
  - {ref: common/sfp-plus-cage@2, id: xg4, at: [7.23, 138.84], rotate: 90}
  - {ref: common/sfp-plus-cage@2, id: xg5, at: [7.23, 156.04], rotate: 90}
  - {ref: common/sfp-plus-cage@2, id: xg6, at: [7.23, 176.3], rotate: 90}
