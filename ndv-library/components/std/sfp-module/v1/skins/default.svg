<svg xmlns="http://www.w3.org/2000/svg" width="14.25mm" height="10.4mm" viewBox="0 0 14.25 10.4">
  <!-- full-bleed: the ganged bezel cutout is one continuous slot (SFF-8433 C01),
       so ports abut - the only thing between them is the shared cage wall below -->
  <rect id="opening" x="0" y="0" width="14.25" height="10.4" fill="#17191c"/>
  <rect id="cage-wall" x="0" y="0" width="0.25" height="10.4" fill="#3a4046"/>
  <rect id="cage-lip" x="1.1" y="1.3" width="12.0" height="1.2" rx="0.3" fill="#2b2f33"/>
  <rect id="module-slot" x="1.1" y="3.8" width="12.0" height="2.7" rx="0.4" fill="#000000"/>
</svg>
