format: 1
kind: component
name: sfp-module
version: 1.1.0
class: port
profile: networking
conforms: sfp-module
interface: sfp
description: Per-port opening inside a ganged SFP+/SFP28 block - the port's share of
  a continuous 1xN bezel slot, so adjacent instances abut with no gap
size: {w: 14.25, h: 10.4, d: 41.0}
attrs: {media: sfp}
provenance:
  size: standard (SFF-8433 Rev 0.7 - port pitch B04 14.25 Basic, bezel cutout height
    C02 10.40; cutout width C01 is N x 14.25 + 1.2, so the 0.6 end margin belongs to
    the block, not the port)
  depth: measured (TE 2007562-6 STEP - bezel face to connector planes at 40.9-42.7;
    the pre-existing 41.0 estimate was confirmed rather than changed)
  row-pitch: measured (TE 2007562-6 - 15.00 belly-to-belly; not governed by any
    spec, so devices are not linted against it)
elements:
  opening: {at: [0.0, 0.0], size: [14.25, 10.4], class: cutout}
relief:
  wall: '#aab0b7'
connection-points:
  mate: {at: [7.125, 5.2], direction: front}
skins: [default]
