<svg xmlns="http://www.w3.org/2000/svg" width="12.7mm" height="11mm" viewBox="0 0 12.7 11">
  <!-- aperture: the hole in the panel / the port's face area -->
  <rect id="opening" x="0" y="0" width="12.7" height="11" rx="0.3" fill="#17191c"/>
  <!-- cavity: the 8P8C plug interface, 11.89 x 6.85 body + 4.0 x 2.6 latch keyway.
       Standard across vendors - a plug that fits one RJ45 fits them all. -->
  <path id="cavity" d="M 0.405 0.775 h 11.89 v 6.85 h -3.945 v 2.6 h -4 v -2.6 h -3.945 z" fill="#0a0c0e"/>
  <g id="pins" fill="#a8873c">
    <rect x="2.519" y="1.325" width="0.55" height="2.0"/>
    <rect x="3.535" y="1.325" width="0.55" height="2.0"/>
    <rect x="4.551" y="1.325" width="0.55" height="2.0"/>
    <rect x="5.567" y="1.325" width="0.55" height="2.0"/>
    <rect x="6.583" y="1.325" width="0.55" height="2.0"/>
    <rect x="7.599" y="1.325" width="0.55" height="2.0"/>
    <rect x="8.615" y="1.325" width="0.55" height="2.0"/>
    <rect x="9.631" y="1.325" width="0.55" height="2.0"/>
  </g>
</svg>
