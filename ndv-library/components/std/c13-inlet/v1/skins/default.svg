<svg xmlns="http://www.w3.org/2000/svg" width="28mm" height="20mm" viewBox="0 0 28 20">
  <!-- aperture: the panel cutout, 28.0 x 20.0 max R3 (SCHURTER 6100-3) -->
  <rect id="opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c"/>
  <!-- cavity: the keyed C14 coupler shroud - chamfered top corners are what makes
       a C13 cord only fit one way up. Proportional, not dimensioned. -->
  <path id="inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11"/>
  <rect id="pin-earth"   x="12.8" y="5.0"  width="2.4" height="4.8" rx="0.3" fill="#7a8087"/>
  <rect id="pin-line"    x="6.6"  y="9.6"  width="2.4" height="4.8" rx="0.3" fill="#7a8087"/>
  <rect id="pin-neutral" x="19.0" y="9.6"  width="2.4" height="4.8" rx="0.3" fill="#7a8087"/>
</svg>
