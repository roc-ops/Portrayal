<svg xmlns="http://www.w3.org/2000/svg" width="56mm" height="40mm" viewBox="0 0 56 40">
  <defs>
    <pattern id="mesh" width="2.4" height="2.4" patternUnits="userSpaceOnUse">
      <rect x="0.25" y="0.25" width="1.9" height="1.9" fill="#3c4046"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="56" height="40" rx="0.8" fill="#b9bec4" stroke="#7a8087" stroke-width="0.4"/>
  <rect id="vent-field" x="1.2" y="1.5" width="53.6" height="37" fill="url(#mesh)"/>
  <rect id="latch" x="2" y="14" width="6" height="7" rx="0.8" fill="#3d7bd6"/>
  <g id="handle">
    <rect id="handle-bar" x="10" y="8" width="5" height="24" rx="1.6" fill="#2b2f33" stroke="#171a1d" stroke-width="0.35"/>
    <rect id="handle-grip" x="11.2" y="10" width="2.6" height="20" rx="1.2" fill="#0d0f11"/>
  </g>
  <g id="dc-inlet">
    <rect id="dc-inlet-frame" x="20.5" y="4" width="23" height="32" rx="1.0" fill="#e6e9ec" stroke="#7a8087" stroke-width="0.35"/>
    <rect id="dc-inlet-body" x="22.5" y="6" width="19" height="28" rx="0.8" fill="#0d0f11" stroke="#33373c" stroke-width="0.4"/>
    <rect id="dc-term-cover" x="24.5" y="8.5" width="15" height="10.5" rx="1.2" fill="#3d7bd6" stroke="#2a5aa8" stroke-width="0.4"/>
    <rect id="dc-term-cover-rib" x="26.5" y="10" width="11" height="1.4" rx="0.7" fill="#2a5aa8"/>
    <rect id="dc-lug-neg" x="26" y="21" width="5.2" height="6.5" rx="0.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.3"/>
    <rect id="dc-lug-pos" x="33" y="21" width="5.2" height="6.5" rx="0.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.3"/>
    <text x="28.6" y="31.8" font-family="sans-serif" font-size="3.4" text-anchor="middle" fill="#e6e9ec">-</text>
    <text x="35.6" y="31.8" font-family="sans-serif" font-size="3.4" text-anchor="middle" fill="#e6e9ec">+</text>
