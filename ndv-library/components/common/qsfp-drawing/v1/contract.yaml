format: 1
kind: component
name: qsfp-drawing
version: 1.0.0
class: reference
profile: networking
description: >-
  QSFP orthographic views transcribed from a vendor mechanical drawing - top,
  side and bottom at true scale. A drawing study rather than a placeable part:
  it exists so the 2D can be checked against the dimensions before any 3D is
  built from it.
size: {w: 118.0, h: 19.0}
attrs: {role: drawing-study}
provenance:
  overall: drawing - (118) reference length, bail extended
  width: drawing - 19.00 MAX across the pull tab, 18.35 +/-0.10 across the body,
    so the body is inset 0.325 each side of the tab
  height: drawing - 8.50 +/-0.10, shown in the side view
  tab: drawing - 34.80 MAX reach, 3.40 MAX thick, 1.60 MAX rail section. The
    rail thickness is what says the tab is a flat loop rather than a wire bail
  features: drawing - latch shoulder 29.60 +/-0.10 from datum D, 4.20 +/-0.15
    step at D, 2.00 +/-0.15 rail, LABEL AREA 40.10 MAX on the underside
  rear-sections: photo IMG_2190, scaled on the 8.50 body height - the datum D
    end is three parts at three lengths, not one square edge. Shell 2.94 tall
    reaching furthest, PCB edge connector 1.24 tall and 1.85 short of it, guide
    plate 0.93 tall and 3.09 short. Both the PCB and the guide plate are also
    narrower than the shell, which the top and bottom views now show
  body-step: photo - the body is taller where it meets the pull tab than along
    the rest of its length, stepping down about 0.85 at roughly 52mm. In plan
    that edge reads as a line across the body
  part: photographs are of a ROCNET QSFP28-SR4-UFI-RS, 100G 850nm 100m MMF
  inferred: the heatsink rib pitch and the exact position of the body step are
    not dimensioned. Rib count and that 52mm are read off photographs at scale,
    not measured, and are the first things to correct
elements: {}
skins: [top, side, bottom]
