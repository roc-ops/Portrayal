<svg xmlns="http://www.w3.org/2000/svg" width="118.0mm" height="19.0mm" viewBox="0 0 118.0 19.0">
  <!-- Front elevation, looking into the optical face. 18.35 x 8.50, centred on
       the common sheet. This part is an SR4, so the interface is MPO. -->
  <rect id="shell" x="49.83" y="5.25" width="18.35" height="8.5" rx="0.7"
        fill="#a9b0b7" stroke="#767d84" stroke-width="0.25"/>
  <rect id="opening" x="53.33" y="7.30" width="11.35" height="4.4" rx="0.4" fill="#15181b"/>
  <rect id="mpo" x="54.33" y="8.10" width="9.35" height="2.8" rx="0.25" fill="#d7dbdf"/>
  <g fill="#8d949c">
    <rect x="54.73" y="8.85" width="0.5" height="1.3"/>
    <rect x="56.23" y="8.85" width="0.5" height="1.3"/>
    <rect x="57.73" y="8.85" width="0.5" height="1.3"/>
    <rect x="59.23" y="8.85" width="0.5" height="1.3"/>
  </g>
  <!-- pull tab, anchored at the top edge as the side view shows -->
  <rect id="tab" x="49.50" y="5.60" width="19.0" height="3.4" rx="1.2"
        fill="#e8dcc0" stroke="#c4b898" stroke-width="0.25"/>
</svg>
