format: 1
kind: component
name: qsfp28-cage
version: 3.1.0
class: port
profile: networking
description: QSFP28 cage at the measured 19.0mm ganged pitch, four round per-lane LEDs (v3 = composed - cage bezel wraps a std/qsfp-module aperture core; ganged cages keep vendor pitch, the aperture is the standard part)
size: {w: 19.0, h: 14.5}
attrs: {media: qsfp28, speed: 100g, lanes: '4'}
provenance:
  size: measured (TE 2322551-4 ganged QSFP cage - pitch 19.000, opening 18.500,
    shared wall 0.500). The previous 18.5 was the OPENING width mistaken for the
    pitch, which would have left no cage wall at all between ganged ports
  elements: photo-inferred
  led-states: quick start guide (blue=100G, orange=40G, white=25G breakout/lane, green=10G breakout/lane)
elements:
  cage: {at: [0.25, 3.5], size: [18.5, 11.0], class: cage}
  led-1:
    at: [1.75, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
  led-2:
    at: [4.15, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
  led-3:
    at: [13.25, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
  led-4:
    at: [15.65, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
parts:
  - {ref: std/qsfp-module@1, id: aperture, at: [0.25, 4.2]}
connection-points:
  net: {at: [9.5, 9.0], direction: front}
skins: [default]
