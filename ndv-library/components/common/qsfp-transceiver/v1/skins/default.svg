<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <rect id="shell" x="0.1" y="0.1" width="18.15" height="8.3" rx="0.8" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- optical opening: the MPO ferrule window in the module face -->
  <rect id="opening" x="3.6" y="2.05" width="11.15" height="4.4" rx="0.4" fill="#15181b"/>
  <rect id="ferrule" x="4.6" y="2.85" width="9.15" height="2.8" rx="0.25" fill="#d7dbdf"/>
  <!-- white pull-latch bail, raised as a U off the face -->
  <rect id="bail" x="0" y="2.55" width="18.35" height="3.4" rx="1.7" fill="#f2f4f6" stroke="#c4c9ce" stroke-width="0.15"/>
</svg>
