<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <rect id="shell" x="0.1" y="0.1" width="18.15" height="8.3" rx="0.8" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- Optical face - duplex LC. Bore centres 6.25 +/-0.05 apart and each
       opening 4.7 +/-0.05 square, both called out in section A-A of the vendor
       mechanical specification. T left, R right, as that section labels them. -->
  <rect id="opening" x="3.40" y="1.60" width="11.55" height="5.30" rx="0.4" fill="#15181b"/>
  <rect id="bore-tx" x="3.70" y="1.90" width="4.7" height="4.7" rx="0.35" fill="#0a0c0e"/>
  <rect id="bore-rx" x="9.95" y="1.90" width="4.7" height="4.7" rx="0.35" fill="#0a0c0e"/>
  <circle cx="6.05" cy="4.25" r="0.625" fill="#d7dbdf"/>
  <circle cx="12.30" cy="4.25" r="0.625" fill="#d7dbdf"/>
  <g font-family="sans-serif" font-size="1.1" fill="#8d949c" text-anchor="middle">
    <text x="6.05" y="6.30">T</text>
    <text x="12.30" y="6.30">R</text>
  </g>
</svg>
