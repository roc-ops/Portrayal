<svg xmlns="http://www.w3.org/2000/svg" width="13.5mm" height="8.5mm" viewBox="0 0 13.5 8.5">
  <!-- module body 13.5 x 8.5 (SFP-30K-FSF drawing, full scale).
       The bores live INSIDE this group on purpose: the 3D textures a raised
       'out' box with the node's own art, so anything drawn as a sibling would
       be hidden behind the 13.9mm the module stands proud. -->
  <g id="body">
    <rect id="plate" x="0" y="0" width="13.5" height="8.5" rx="0.6" fill="#9aa0a8"
          stroke="#6e747c" stroke-width="0.25"/>
    <!-- LC duplex: bore centres 6.35 apart (+/-3.175 from module centre, measured).
         Opening size is proportional - the drawing does not dimension it. -->
    <rect id="lc-a" x="1.275" y="2.05" width="4.6" height="4.4" rx="0.45" fill="#15181b"/>
    <rect id="lc-b" x="7.625" y="2.05" width="4.6" height="4.4" rx="0.45" fill="#15181b"/>
    <circle id="ferrule-a" cx="3.575" cy="4.25" r="0.85" fill="#c9cdd1"/>
    <circle id="ferrule-b" cx="9.925" cy="4.25" r="0.85" fill="#c9cdd1"/>
  </g>
  <!-- bail latch, latched flat across the face: a thin bar ON the module front,
       not a slab from the faceplate, hence lift = the module protrusion -->
  <rect id="bail" x="0.5" y="0.55" width="12.5" height="1.05" rx="0.5" fill="#2f5fa8"
        stroke="#20406f" stroke-width="0.18"/>
</svg>
