format: 1
kind: lab
name: rocnet-roadm-demo
title: ROCNet ROADM customer demo
description: >-
  Three-site optical ring built in the lab for a customer demo. Each site is a
  DCP-SC-28P service-channel controller with two DCP-R ROADM units below it,
  one per direction. Transcribed from a hand-drawn Visio connectivity diagram.
provenance:
  layout: stated - controllers at U36, U28 and U20, each with its two ROADMs
    below on alternate Us
  topology: ring read off the connectivity diagram - D1-to-D1 between the first
    pair, D2-to-D1 onward, closing D2-to-D2 back to the first site. Management
    and the site cross-connect were corrected from the diagram afterwards
  management: stated - each ROADM's rear ETH 4 goes to the controller's rear
    ETH 1 for D1 and ETH 2 for D2. Rear to rear, not front
  cross-connect: stated - D1 XC34 to D2 XC34 at every site
  osc-loop: stated - OSC TX into 1510 RX, 1510 TX back into OSC RX, per ROADM
  strands: every fibre is modelled individually rather than as a duplex link, so
    a run appears as two tubes - TX at one end into RX at the other, and back
  roadm-model: assumed dcp-r-34d-cs. The diagram labels the units only as
    roadm01-D1/D2; the 34D-CS is the colourless-directionless cross-connect,
    which is the better fit for a ROADM role than the 9D
rack:
  height-ru: 42
  rails-only: true
devices:
  - {id: mcdnny-sc01,        ref: dcp-sc-28p,    ru: 36, label: mcdnny-sc01,        mgmt-ip: 10.22.64.121}
  - {id: mcdnny-roadm01-D1,  ref: dcp-r-34d-cs,  ru: 34, label: mcdnny-roadm01-D1}
  - {id: mcdnny-roadm01-D2,  ref: dcp-r-34d-cs,  ru: 32, label: mcdnny-roadm01-D2}
  - {id: abrnny-sc01,        ref: dcp-sc-28p,    ru: 28, label: abrnny-sc01,        mgmt-ip: 10.22.64.122}
  - {id: abrnny-roadm01-D1,  ref: dcp-r-34d-cs,  ru: 26, label: abrnny-roadm01-D1}
  - {id: abrnny-roadm01-D2,  ref: dcp-r-34d-cs,  ru: 24, label: abrnny-roadm01-D2}
  - {id: gnvany-sc01,        ref: dcp-sc-28p,    ru: 20, label: gnvany-sc01,        mgmt-ip: 10.22.64.122}
  - {id: gnvany-roadm01-D1,  ref: dcp-r-34d-cs,  ru: 18, label: gnvany-roadm01-D1}
  - {id: gnvany-roadm01-D2,  ref: dcp-r-34d-cs,  ru: 16, label: gnvany-roadm01-D2}
links:
  # management - each ROADM's rear ETH 4 back to the controller's rear ETH 1/2
  - {media: ethernet, from: [mcdnny-roadm01-D1, eth4], to: [mcdnny-sc01, eth1]}
  - {media: ethernet, from: [mcdnny-roadm01-D2, eth4], to: [mcdnny-sc01, eth2]}
  - {media: ethernet, from: [abrnny-roadm01-D1, eth4], to: [abrnny-sc01, eth1]}
  - {media: ethernet, from: [abrnny-roadm01-D2, eth4], to: [abrnny-sc01, eth2]}
  - {media: ethernet, from: [gnvany-roadm01-D1, eth4], to: [gnvany-sc01, eth1]}
  - {media: ethernet, from: [gnvany-roadm01-D2, eth4], to: [gnvany-sc01, eth2]}
  # site cross-connect - D1 XC34 to D2 XC34, both strands
  - {media: smf, from: [mcdnny-roadm01-D1, xc34, tx], to: [mcdnny-roadm01-D2, xc34, rx]}
  - {media: smf, from: [mcdnny-roadm01-D2, xc34, tx], to: [mcdnny-roadm01-D1, xc34, rx]}
  - {media: smf, from: [abrnny-roadm01-D1, xc34, tx], to: [abrnny-roadm01-D2, xc34, rx]}
  - {media: smf, from: [abrnny-roadm01-D2, xc34, tx], to: [abrnny-roadm01-D1, xc34, rx]}
  - {media: smf, from: [gnvany-roadm01-D1, xc34, tx], to: [gnvany-roadm01-D2, xc34, rx]}
  - {media: smf, from: [gnvany-roadm01-D2, xc34, tx], to: [gnvany-roadm01-D1, xc34, rx]}
  # OSC loop on every ROADM - OSC TX into 1510 RX and 1510 TX back into OSC RX
  - {media: smf, from: [mcdnny-roadm01-D1, port-osc, tx], to: [mcdnny-roadm01-D1, port-1510, rx]}
  - {media: smf, from: [mcdnny-roadm01-D1, port-1510, tx], to: [mcdnny-roadm01-D1, port-osc, rx]}
  - {media: smf, from: [mcdnny-roadm01-D2, port-osc, tx], to: [mcdnny-roadm01-D2, port-1510, rx]}
  - {media: smf, from: [mcdnny-roadm01-D2, port-1510, tx], to: [mcdnny-roadm01-D2, port-osc, rx]}
  - {media: smf, from: [abrnny-roadm01-D1, port-osc, tx], to: [abrnny-roadm01-D1, port-1510, rx]}
  - {media: smf, from: [abrnny-roadm01-D1, port-1510, tx], to: [abrnny-roadm01-D1, port-osc, rx]}
  - {media: smf, from: [abrnny-roadm01-D2, port-osc, tx], to: [abrnny-roadm01-D2, port-1510, rx]}
  - {media: smf, from: [abrnny-roadm01-D2, port-1510, tx], to: [abrnny-roadm01-D2, port-osc, rx]}
  - {media: smf, from: [gnvany-roadm01-D1, port-osc, tx], to: [gnvany-roadm01-D1, port-1510, rx]}
  - {media: smf, from: [gnvany-roadm01-D1, port-1510, tx], to: [gnvany-roadm01-D1, port-osc, rx]}
  - {media: smf, from: [gnvany-roadm01-D2, port-osc, tx], to: [gnvany-roadm01-D2, port-1510, rx]}
  - {media: smf, from: [gnvany-roadm01-D2, port-1510, tx], to: [gnvany-roadm01-D2, port-osc, rx]}
  # the optical ring - Line ports, one fibre pair per span
  - {media: smf, from: [mcdnny-roadm01-D1, port-line, tx], to: [abrnny-roadm01-D1, port-line, rx]}
  - {media: smf, from: [abrnny-roadm01-D1, port-line, tx], to: [mcdnny-roadm01-D1, port-line, rx]}
  - {media: smf, from: [abrnny-roadm01-D2, port-line, tx], to: [gnvany-roadm01-D1, port-line, rx]}
  - {media: smf, from: [gnvany-roadm01-D1, port-line, tx], to: [abrnny-roadm01-D2, port-line, rx]}
  - {media: smf, from: [gnvany-roadm01-D2, port-line, tx], to: [mcdnny-roadm01-D2, port-line, rx]}
  - {media: smf, from: [mcdnny-roadm01-D2, port-line, tx], to: [gnvany-roadm01-D2, port-line, rx]}
