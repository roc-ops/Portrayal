<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrayal explorer</title>
<!--
  The page a contributor opens to look at what they built. It is the kit's
  shell (device picker, view switch, tree, inspector) over a local build:

      ./build.sh                       # or ./build.sh --device <name>
      python3 tools/serve.py 8931      # from the repository root
      open http://localhost:8931/kit/index.html?device=<name>

  Everything it draws comes from ../library/dist. `?dist=packages` reads the
  npm packages instead, as `npm_packages.py` (or `./publish.sh`) left them in
  ../library/packages; `?dist=cdn` reads them from jsDelivr, at `&index=` a
  version of @portrayal/index (latest if not given). The shell and the viewer are
  the kit modules the README lists; what this page adds is the wiring BETWEEN
  them, because three of the things Gate 5 asks you to check live in that gap:

    - a lamp's states, as chips on the tree row that owns them
    - a pulled FRU, reaching the 3D scene and not just the drawing
    - every face in one tree while 3D is showing every face at once

  None of the three needed a change to a module. `states.js` has exported
  `statesOfEl` all along, `viewer3d.js` has exported `setStates` and `setPulled`,
  and `shell.js` has exported `loadFaces`, `refreshTree` and `pulledPaths` - this
  page simply never called any of them, so a contributor checking their own work
  could not light a lamp, could not see a card leave its bay in 3D, and could
  only ever see the tree for the face they were pointing at. The published site's
  explorer wires the same modules the same way; this is that wiring, kept here so
  the visual gates in docs/modelling-a-device.md can be run without the site.
-->
<style>
  #mode { display: inline-flex; gap: 2px; margin-right: 8px; }
  #mode button, #earsbar button { font: inherit; padding: 2px 10px; border: 1px solid #555; background: #222; color: #ddd; cursor: pointer; }
  #mode button.on, #earsbar button.on { background: #f59e0b; color: #111; border-color: #f59e0b; }
  #mode button:disabled { opacity: .45; cursor: not-allowed; }
  #earsbar { display: inline-flex; margin-right: 8px; }
  #earsbar[hidden] { display: none; }     /* inline-flex outranks the hidden attribute */
  #stage-3d { position: absolute; inset: 0; }
  /* The tree row's state chips. Sized and coloured from the shell's own
     variables so they read as part of its tree rather than as this page's. */
  .chip { display: inline-block; margin-left: .3rem; padding: 0 .4rem; border: 1px solid var(--line);
          border-radius: 9px; font-size: .64rem; color: var(--dim); cursor: pointer;
          user-select: none; line-height: 1.35; }
  .chip:hover { border-color: var(--warn); color: var(--ink); }
  .chip.on { background: var(--warn); color: #111; border-color: var(--warn); }
  /* over --hl, the selection colour the user picks, so it stays legible there */
  .node.sel .chip { border-color: #ffffff66; }
  /* A display's readings are a fact to be read, not a control: nothing here can
     make the drawing say INIT, because no skin in the library draws glyphs. */
  .chip.ro { cursor: default; }
  .chip.ro:hover { border-color: var(--line); color: var(--dim); }

  /* The kit's palette has no "good" green - the shell never needed one - so the
     met-capability chip brings its own rather than borrowing --accent, which is
     the selection blue and would read as "selected" on a row of flags. */
  :root { --good: #4ade80; --good-line: #4ade8066; --good-wash: #4ade801a; }

  /* the FRU bar: one button per removable unit, in the header beside the status */
  #frus { display: flex; gap: .2rem; flex-wrap: wrap; }
  #frus[hidden] { display: none; }        /* display:flex outranks the hidden attribute */
  #frus button { font-family: ui-monospace, monospace; font-size: .72rem; padding: .26rem .42rem;
                 border: 1px solid var(--control-line); background: var(--control); color: var(--ink);
                 cursor: pointer; }
  #frus button:hover { background: var(--control-hover); border-color: var(--control-hover-line); }
  #frus button.on { background: var(--warn); color: #111; border-color: var(--warn); }

  /* renderer diagnostics and the export bar, both over the canvas */
  #gfx { position: absolute; bottom: .6rem; right: .7rem; z-index: 5; pointer-events: none;
         background: color-mix(in srgb, var(--stage) 80%, transparent); border: 1px solid var(--line);
         border-radius: 4px; padding: .25rem .45rem; font: 11px ui-monospace, monospace; color: var(--dim); }
  #gfx.warn { color: var(--warn); border-color: var(--warn); }
  #glx { position: absolute; bottom: .6rem; left: .7rem; z-index: 5; display: flex;
         gap: .3rem; align-items: center; font-size: .72rem; }
  #glx button { font: inherit; padding: .2rem .5rem; border: 1px solid var(--control-line);
                background: var(--control); color: var(--ink); cursor: pointer; }
  #glx button:disabled { opacity: .55; cursor: progress; }
  #glx .msg { color: var(--dim); }
  #glx .msg.bad { color: var(--warn); }

  /* the About panel, which takes over the inspector on the chassis row */
  #inspect .prov { color: var(--dim); font-size: .68rem; line-height: 1.45; margin: -.15rem 0 .5rem 5.4rem;
                   border-left: 2px solid var(--line); padding-left: .45rem; }
  #inspect .pn { margin: 0 0 .5rem .2rem; font-size: .7rem; }
  #inspect .pn code { color: var(--ink); }
  #inspect .pn div { color: var(--dim); }
  #inspect .cfgname { color: var(--ink); font-weight: 600; }
  /* Capability and gaps are read by someone deciding whether to trust the model
     or to go and fill it in, so `blocked` and `wanted` - the two fields that say
     what to do next - get full-width lines rather than a tooltip. */
  #inspect .lvl { display: flex; gap: .35rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .45rem; }
  #inspect .lvl b { font-size: .95rem; color: var(--ink); }
  #inspect .lvl .nm { color: var(--ink); }
  #inspect .flag { border: 1px solid var(--good-line); background: var(--good-wash); color: var(--good);
                   border-radius: 9px; padding: 0 .42rem; font-size: .64rem; }
  /* a flag nothing could test is not a flag that failed, and must not be mistaken
     for one at a glance - dashed, dim, and question-marked */
  #inspect .flag.unk { border-style: dashed; border-color: var(--line); background: none; color: var(--dim); }
  #inspect .legend { color: var(--dim); font-size: .66rem; margin: -.2rem 0 .5rem; line-height: 1.45; }
  #inspect .blocked { border-left: 2px solid var(--warn); padding: .1rem 0 .1rem .5rem;
                      margin: .35rem 0; line-height: 1.5; }
  #inspect .blocked b { color: var(--warn); font-weight: 600; }
  #inspect .gap { border: 1px solid var(--line); border-radius: 6px; padding: .4rem .5rem;
                  margin-bottom: .45rem; line-height: 1.5; }
  #inspect .gap .hd { display: flex; gap: .35rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .2rem; }
  #inspect .gap .what { color: var(--ink); font-weight: 600; }
  #inspect .gap .why { border: 1px solid var(--warn); color: var(--warn); border-radius: 9px;
                       padding: 0 .4rem; font-size: .64rem; }
  #inspect .gap .sc { color: var(--dim); font-size: .68rem; }
  #inspect .gap .note { color: var(--dim); font-size: .7rem; }
  #inspect .gap .want { margin-top: .25rem; color: var(--ink); font-size: .72rem; }
  #inspect .gap .want b { color: var(--accent); font-weight: 600; }
</style>
<!-- viewer3d.js imports `three` as a bare specifier; the kit resolves nothing itself. -->
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
}}
</script>
</head>
<body>
<script type="module">
import { createShell, esc } from './shell.js';
import { statesOfEl, messagesOfEl, charactersOfEl, boundLamps, offIsSet } from './states.js';
import { encodeSwaps, encodeTurns, searchWith } from './swap.js';
import { encodeFields } from './fields.js';
import { flatDist, packageDist, distResolver, faceFile } from './dist.js';
import { drawEars, clearEars, earPlan, faceSize, frontWidthOfText } from './ears2d.js';

// WHERE THE FILES COME FROM. The build directory by default; the npm packages
// (#528) on `?dist=packages` (a local npm_packages.py run) or `?dist=cdn`.
const page = new URLSearchParams(location.search);
const DIST = page.get('dist') === 'packages'
  ? await packageDist({at: name => `../library/packages/${name.split('/')[1]}/`})
  : page.get('dist') === 'cdn'
    ? await packageDist({index: page.get('index') || 'latest'})
    : flatDist('../library/dist');
const shell = createShell({ title: 'Portrayal explorer', dist: DIST });
const state = shell.state;

// ---------------------------------------------------------------- state chips
// A lamp declares what it can be; until now nothing here could ask it to be one.
// `statesOfEl` reads the vocabulary - that parsing is states.js's job and this
// page does not repeat it - and a chip per state sets `state-<name>` on the live
// element. Clicking the chip that is already on clears it.
//
// `off` (#934, docs/pdu-model-design.md section 3.2) is a state that can be
// lit: the G4 outlet lamp is red when its outlet is off. So the `off` chip sets
// `state-off` where states.js offIsSet says so - on an outlet (it has a lamp
// bound to it, or it is a power outlet with none, which the stylesheet dims)
// and on an element that declares a colour for off - and clears only a lamp or
// a plain element with no declared off colour, as it always did.
//
// AN OUTLET'S STATE IS SHOWN ON ITS LAMP. A chip on a switched outlet writes
// the same class on every lamp `for:` binds to it (states.js boundLamps, the
// rule marks.js and the 3D scene apply too), so liveStates reads the lamps'
// paths off the drawing and 2D and 3D agree.
const CHIPS = new WeakMap();          // element -> its row's chip span
function syncChips(el) {
  const span = CHIPS.get(el);
  if (span) for (const c of span.querySelectorAll('.chip'))
    c.classList.toggle('on', el.classList.contains('state-' + c.textContent));
}
function chips(el) {
  const states = statesOfEl(el);
  if (!states.length) return null;
  const span = document.createElement('span');
  for (const st of states) {
    const chip = document.createElement('span');
    chip.className = 'chip' + (el.classList.contains('state-' + st) ? ' on' : '');
    chip.textContent = st;
    chip.title = `show this element in its ${st} state`;
    chip.onclick = ev => {
      ev.stopPropagation(); ev.preventDefault();
      const was = el.classList.contains('state-' + st);
      const path = el.getAttribute('data-path');
      const lamps = (path && state.svg && boundLamps(state.svg).get(path)) || [];
      const set = !was && (st !== 'off' || offIsSet(el, lamps));
      for (const t of [el, ...lamps]) {
        [...t.classList].filter(c => c.startsWith('state-')).forEach(c => t.classList.remove(c));
        if (set) t.classList.add('state-' + st);
        syncChips(t);
      }
      pushStates();
    };
    span.appendChild(chip);
  }
  CHIPS.set(el, span);
  return span;
}

// ------------------------------------------------------------- display badge
// A DISPLAY IS NOT A LAMP and gets no chips: a chip sets a class, and setting
// `state-init` on an LED matrix paints nothing, because no skin in this library
// draws characters. What a display can answer is how wide it is and what it is
// able to say - Cisco's four-character matrix knows twenty-eight readings off
// Tables 25 and 26 - so the row carries that as a badge with the vocabulary in
// its tooltip, and claims no control over it.
function reading(el) {
  const cells = charactersOfEl(el);
  if (!cells) return null;
  const msgs = messagesOfEl(el);
  const badge = document.createElement('span');
  badge.className = 'chip ro';
  badge.textContent = msgs.length ? `${cells} chars, ${msgs.length} readings`
                                  : `${cells} chars`;
  badge.title = msgs.length ? msgs.join(', ')
                            : 'the model records the capacity and no vocabulary';
  return badge;
}

// The shell offers every tree row as it builds it. A group fold owns no element
// and so declares nothing; only a row with one gets chips.
shell.on('row', (row, node) => {
  if (!node.el) return;
  const c = chips(node.el) || reading(node.el);
  if (c) row.querySelector('.nm').after(c);
});

// A STATE IS A FACT ABOUT THE DEVICE, not about the drawing that happened to be
// mounted when it was set, so it has to reach both stages. The chip writes a
// class into the live SVG; the scene is rasterised from the compiled faces,
// which carry every state's RULE and never one APPLIED - so without this a lamp
// lit in 2D is dark in 3D on every device in the library.
//
// The whole drawing is read rather than the one element that changed: it is one
// pass over a few thousand nodes for a click, it gives the same answer after a
// swap or a config change as after a chip, and it cannot drift from what is on
// screen the way an incrementally-maintained copy can.
function liveStates() {
  const out = {};
  if (!state.svg) return out;
  for (const el of state.svg.querySelectorAll('[data-path][class]')) {
    const sts = [...el.classList].filter(c => c.startsWith('state-'));
    if (sts.length) out[el.dataset.path] = sts.join(' ');
  }
  return out;
}
function pushStates() {
  if (mode !== '3d' || !viewer) return;
  Promise.resolve(viewer.setStates(liveStates()))
    .catch(err => console.warn('[portrayal] 3D state sync failed', err));
}

// ---------------------------------------------------------------- pulled FRUs
// A PULL IS A STATE THE SCENE HAS TO BE TOLD ABOUT TOO. The shell takes a part
// out by hiding it in the drawing, which is the whole of the job in 2D and none
// of it in 3D - the scene is built from the compiled faces, so it went on
// showing a card the tree had already struck through. That reads as a control
// that does nothing, and it is exactly what you need when checking that a bay
// renders what it holds.
//
// Asked of the shell rather than read off `state.svg`, because the shell knows
// every face it has loaded: a pull on a top-face part has to reach the scene
// while the front drawing is the one mounted.
const livePulled = () => typeof shell.pulledPaths === 'function'
  ? shell.pulledPaths()
  : (state.svg ? [...state.svg.querySelectorAll('[data-portrayal-pulled]')]
      .map(e => e.dataset.path).filter(Boolean) : []);
function pushPulled() {
  if (mode !== '3d' || !viewer) return;
  Promise.resolve(viewer.setPulled(livePulled()))
    .catch(err => console.warn('[portrayal] 3D pull sync failed', err));
}
shell.on('pulled', pushPulled);

// ---------------------------------------------------------------- About panel
// Facts about the device that belong to no view: they are not in the drawing and
// they are not in the tree, so there was nowhere to read them. The chassis row is
// already the first row of the tree, so selecting it is the natural way in.
const dim = v => (v == null ? '—' : `${(+v).toFixed(1).replace(/\.0$/, '')} mm`);

// Capability and gaps are computed by the build - there is deliberately no
// `capability:` key in a manifest - and arrive in <device>.configs.json. They are
// written by a different hand and may not be there yet, so every branch is
// guarded: a manifest without them reads as it did rather than showing an empty
// heading.
//
// The flags need three states, not two. A flag in `flags` was tested and met; one
// in `unknown` could never be tested at all - a device that declares no `profile:`
// has no minimum attr set to judge `specified` against; a flag in neither was
// tested and not met. Printing the second as a plain "no" would call a device
// unspecified when it is merely unjudged, which is false in a way that matters.
function capability(cap, gapList) {
  if (!cap || cap.level == null) return '';
  // A CAP gap carries the reason a flag could not be judged, which is exactly the
  // tooltip. It is named for the cause rather than the flag, so this looks for the
  // flag named in the text too - best effort, and the full sentence is under Gaps.
  const why = f => (gapList || []).find(
    g => g.what === f || (g.wanted || '').includes('`' + f + '`'))?.wanted || '';
  let h = `<h3>Capability</h3>`;
  h += `<div class="lvl"><b>level ${esc(cap.level)}</b>`
     + (cap.name ? `<span class="nm">${esc(cap.name)}</span>` : '')
     + (cap.flags || []).map(f => `<span class="flag" title="met">+${esc(f)}</span>`).join('')
     + (cap.unknown || []).map(f =>
         `<span class="flag unk" title="${esc(why(f) || 'nothing to test it against')}">?${esc(f)}</span>`).join('')
     + `</div>`;
  // the legend only earns its space once a `?` is on screen
  if ((cap.unknown || []).length)
    h += `<div class="legend">+ met · ? nothing to test it against ·`
       + ` a flag shown by neither was tested and not met</div>`;
  for (const b of cap.blocked || []) {
    // `needs` is the whole point of the record - "level 4 needs rel-pos on 12
    // placements in view rear" is a job someone can pick up.
    h += `<div class="blocked"><b>level ${esc(b.level)}`
       + (b.name ? ` ${esc(b.name)}` : '') + ` blocked</b>`
       + (b.needs ? ` — needs ${esc(b.needs)}` : '') + `</div>`;
  }
  return h;
}

// A gap is a fact about what nobody knows, and half of them are facts about a
// DOCUMENT rather than about the manifest - "the HIG has no port-lamp table" -
// which no rule can ever find. `wanted` says what would close it, and that turns
// the panel from a list of shortcomings into a list of requests.
function gaps(list) {
  if (!Array.isArray(list) || !list.length) return '';
  let h = `<h3>Gaps</h3>`;
  for (const g of list) {
    const scope = Array.isArray(g.scope) ? g.scope.join(', ') : (g.scope || '');
    // `because` is one field with two vocabularies and `kind` says which to read:
    // on a declared gap it is the controlled word for who could close it, on a
    // derived one it is the rule that found it. `reason` and `rule` were the two
    // fields it replaced and cost nothing to keep reading.
    const because = g.because || g.reason || g.rule;
    h += `<div class="gap"><div class="hd"><span class="what">${esc(g.what || '')}</span>`
       + (because ? `<span class="why">${esc(because)}</span>` : '')
       + (g.kind ? `<span class="sc">${esc(g.kind)}</span>` : '')
       // a count of 0 means the rule had nothing to count, not that it found
       // nothing wrong - the gap is there, so print the gap and not the zero
       + (g.count > 0 ? `<span class="sc">×${esc(g.count)}</span>` : '')
       + `</div>`;
    if (scope) h += `<div class="sc">${esc(scope)}</div>`;
    if (g.note) h += `<div class="note">${esc(g.note)}</div>`;
    if (g.wanted) h += `<div class="want"><b>wanted:</b> ${esc(g.wanted)}</div>`;
    h += `</div>`;
  }
  return h;
}

function about(box) {
  const meta = state.meta || {};
  const d = shell.device() || {};
  const ch = meta.chassis || {};
  const prov = {...(meta.provenance || {})};
  const attrs = meta.attrs || {};
  const row = (k, v) => `<div class="row"><span>${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
  // A fact and its citation belong together. Whatever provenance is left over is
  // about the modelling rather than about one fact, and goes at the bottom.
  // A PROVENANCE ENTRY IS `{confidence, note}` since #167, not a string, and
  // printing it raw showed "[object Object]" under every cited fact.
  const said = t => typeof t === 'object'
    ? [t.confidence && `[${t.confidence}]`, t.note].filter(Boolean).join(' ')
    : t;
  const cite = (...keys) => keys.map(k => {
    const t = prov[k];
    if (!t) return '';
    delete prov[k];
    return `<div class="prov">${esc(k)}: ${esc(said(t))}</div>`;
  }).join('');

  let h = `<h2>About</h2>`;
  h += row('manufacturer', d.manufacturer || '');
  // WHOSE ENTRY THIS IS, when the reader came to the box through a NOS vendor
  // (#709). The drawing is the metal's, so the manufacturer above stays true;
  // this says who sells it as what.
  const ls = shell.listing?.();
  if (ls) h += row('listed by', `${ls.manufacturer || ls.ns}${ls.model ? ` as ${ls.model}` : ''}`
                                + (ls.nos ? ` (NOS: ${ls.nos})` : ''));
  h += row('model', meta.model || d.model || '');
  const pf = d.portfolio || {};
  if (pf.series) h += row('series', pf.series);
  if (pf.family) h += row('family', pf.family);
  if (pf.line) h += row('line', pf.line);
  if (d.version) h += row('version', d.version);
  if (d.description) h += row('description', d.description);

  h += capability(meta.capability || d.capability, meta.gaps || d.gaps);

  h += `<h3>Dimensions</h3>`;
  // A box that is not racked says how it is installed instead (#734).
  if (ch.mount && ch.mount !== 'rack') h += row('mount', ch.mount);
  else h += row('rack units', ch.ru != null ? `${ch.ru} RU` : '—');
  h += row('W × H × D', `${dim(ch.w)} × ${dim(ch.h)} × ${dim(ch.d)}`);
  h += cite('chassis', 'dimensions', 'width', 'height', 'depth', 'ru');

  // POWER AND AIRFLOW ARE FIELDS, NOT PROSE (#513). `options` is what the device
  // can be bought with across its orderable builds; the configuration row is the
  // build on screen. Neither lives in `attrs`, so without this section the only
  // place either showed was the description.
  const opts = meta.options || {};
  const cur = (meta.configs || []).find(c => c.name === state.cfg) || {};
  const feed = v => (v || []).map(x => x.toUpperCase()).join(' / ');
  if ((opts.power || []).length || (opts.airflow || []).length || cur.airflow || (cur.power || []).length) {
    h += `<h3>Power and airflow</h3>`;
    h += row('power options', feed(opts.power) || '—');
    h += row('airflow options', (opts.airflow || []).join(' / ') || '—');
    if (cur.name)
      h += row(`this build (${cur.name})`,
               [feed(cur.power), cur.airflow].filter(Boolean).join(' · ') || '—');
    // `provenance.power` is about the wattage figures, which print under
    // Power below; only airflow has a provenance entry about this section
    h += cite('airflow');
  }

  // Attributes are SECTIONED, and this is where the sectioning pays: two dozen
  // rows in one column headed "Attributes" is a wall. Unknown sections are
  // printed after the known ones rather than dropped - this page may be older or
  // newer than the drawing it is reading, and silently swallowing a section the
  // manifest declares is the worst of the options.
  const SECTIONS = ['physical', 'performance', 'power', 'thermal', 'environmental',
                    'platform', 'features', 'management', 'compliance', 'lifecycle', 'other'];
  const present = Object.keys(attrs).filter(s2 => attrs[s2] && Object.keys(attrs[s2]).length);
  const akeys = present.flatMap(s2 => Object.keys(attrs[s2]));
  for (const s2 of [...SECTIONS.filter(x => present.includes(x)),
                    ...present.filter(x => !SECTIONS.includes(x))]) {
    h += `<h3>${esc(s2[0].toUpperCase() + s2.slice(1))}</h3>`;
    for (const [k, v] of Object.entries(attrs[s2])) h += row(k, v) + cite(k);
  }

  const cfgs = (meta.configs || []).filter(c => Object.keys(c['part-numbers'] || {}).length);
  if (cfgs.length) {
    h += `<h3>Part numbers</h3>`;
    for (const c of cfgs) {
      h += `<div class="pn"><span class="cfgname">${esc(c.name)}</span>`
         + (c.description ? ` — ${esc(c.description)}` : '');
      for (const [sku, v] of Object.entries(c['part-numbers'])) {
        const cord = (v || {})['power-cord'];
        h += `<div><code>${esc(sku)}</code> · ${esc((v || {}).part || '')}`
           + (cord && cord !== 'none' ? ` · ${esc(cord)}` : '') + `</div>`;
      }
      h += `</div>`;
    }
    h += cite('configurations', 'part-numbers');
  }

  h += gaps(meta.gaps || d.gaps);

  const rest = Object.keys(prov);
  if (rest.length) {
    h += `<h3>Provenance</h3>`;
    for (const k of rest) h += `<div class="prov" style="margin-left:0">${esc(k)}: ${esc(said(prov[k]))}</div>`;
  }
  if (!akeys.length && !rest.length)
    h += `<div class="hint" style="padding-left:0">This manifest carries no attrs or provenance.
          Both are optional; a device at maturity <code>modelled</code> or better has them.</div>`;
  box.innerHTML = h;
}

// The chassis row is the device itself, so it gets the device's own facts rather
// than the generic node inspector. Inside a module the chassis is that module's
// faceplate and not the box, so leave it alone there.
shell.on('inspect', ({path, box}) => {
  if (path !== 'chassis' || state.module) return false;
  about(box);
  return true;
});

// ---------------------------------------------------------------- FRU bar
// ONE BUTTON PER REMOVABLE UNIT, and this is the control that answers "does the
// bay render what it holds". It is not the same thing as the tree's pull: a pull
// HIDES a cover so you can see behind it, and an eject SLIDES THE UNIT OUT along
// its own travel, which is the only way to see whether a module was modelled
// sitting in its bay or merely painted on the face.
//
// frus() names each unit by its class - "Fan module", "Power supply" - which is
// true and useless when a 2RU box has five fans and two PSUs. So the button
// carries the unit's own PATH, which is what the tree row, the halo and the hover
// status already call it: pressing `fan-3` and watching `fan-3` slide out needs no
// translation. The glyph is the module's own and reports the action available
// (eject, insert, or extend for a captive unit), and toggleFru returns the next
// state, so the button re-labels itself as it moves.
const fruBox = document.createElement('span');
fruBox.id = 'frus';
fruBox.hidden = true;
shell.el.status.before(fruBox);

function fruBar(v) {
  fruBox.replaceChildren();
  if (typeof v.frus !== 'function' || typeof v.toggleFru !== 'function') return;
  for (const fru of v.frus() || []) {
    const btn = document.createElement('button');
    btn.dataset.fru = fru.path;
    const paint = st => {
      btn.textContent = `${st.icon} ${st.path}`;
      // out units stay lit, so a chassis left half stripped still reads at a glance
      btn.classList.toggle('on', !!st.out);
      btn.title = `${st.label} — ${st.out ? 'insert' : 'eject'}`
                + ` (${Math.round(st.travel)} mm travel${st.captive ? ', captive' : ''})`;
    };
    paint(fru);
    btn.onclick = () => {
      const st = v.toggleFru(fru.path);
      if (!st) return;
      paint(st);
      shell.el.status.textContent = st.text || '';
    };
    fruBox.appendChild(btn);
  }
}

// ------------------------------------------------------- over-canvas chrome
// The renderer's own report, and the export the module already knows how to do.
// Both are things `viewer3d.js` hands a host "to rebuild the chrome this module
// gave up", in its own words, and neither had a host here to rebuild it.
const kb = n => n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;

function mountExtras(v) {
  // A DIAGNOSIS AID, NOT DECORATION. WebGL1, msaa 0 and anisotropy below 4 each
  // produce shimmer no material setting can fix, and knowing which of the three
  // you are looking at is the difference between a driver note and a bug hunt.
  if (typeof v.capabilities === 'function' && !host3d.querySelector('#gfx')) {
    const gfx = document.createElement('div');
    gfx.id = 'gfx';
    const c = v.capabilities() || {};
    gfx.textContent = c.text || '';
    gfx.classList.toggle('warn', !!c.warn);
    host3d.appendChild(gfx);
  }
  // A GLB is the only output of this page that survives someone not being able to
  // run it. The module does the exporting - it owns the scene graph, and the API
  // deliberately does not hand that out - so this is two buttons and a line.
  if (typeof v.download !== 'function' || host3d.querySelector('#glx')) return;
  const bar = document.createElement('div');
  bar.id = 'glx';
  bar.innerHTML =
    `<button data-fmt="glb" title="Geometry and textures in one file. Opens in Quick Look, Windows 3D Viewer, PowerPoint, Blender, Sketchfab.">Download GLB</button>`
  + `<button data-fmt="usdz" title="AR Quick Look on iPhone and iPad.">USDZ</button>`
  + `<span class="msg"></span>`;
  host3d.appendChild(bar);
  const msg = bar.querySelector('.msg');
  const all = [...bar.querySelectorAll('button')];
  for (const b of all) b.onclick = async () => {
    const fmt = b.dataset.fmt;
    all.forEach(x => { x.disabled = true; });
    msg.classList.remove('bad');
    msg.textContent = `building ${fmt.toUpperCase()}…`;
    try {
      const {name, size} = await v.download(fmt);
      msg.textContent = `${name} — ${kb(size)}`;
    } catch (err) {
      // USDZ is fussier than GLB, so say which one failed rather than "export failed"
      msg.textContent = `${fmt.toUpperCase()} failed: ${err.message || err}`;
      msg.classList.add('bad');
    } finally {
      all.forEach(x => { x.disabled = false; });
    }
  };
}

// ---------------------------------------------------------------- swap state
// What the BUILD put in each bay or cage, so a swap can be told from a default.
// Only what actually changed is sent; everything else keeps the compiled
// geometry. Bay ids and cage ids are both data-paths in one namespace, so one
// function answers for both. A CAGE's built optic is this configuration's
// `configs[].occupants[id]`, and a cage it does not name is built empty - never
// the cage's own `occupant`, which is only the default configuration's answer.
// The rule itself is swap.js's `swapOverrides`, beside `builtOccupants` - the
// one reading of `configs[].occupants` (a ref or a `{ref, id, ...}` mapping,
// and chained keys that are not cages) the shell's state is built from too.
// The shell assembles its arguments (`swapDelta`), because it seats the faces
// the merged tree lists from the same map: built twice, the tree and the 3D
// scene could be handed two different answers.
const swapOverrides = () => shell.swapDelta();
// THE SWAP STATE IS PART OF WHAT IS ON SCREEN, so it is part of the key. A
// runtime swap changes no file on disk - the scene is extracted from the compiled
// faces, which know only what the built configuration says - so the overrides
// have to travel with the load AND be visible to the early return, or sync3d
// decides it is already showing the right thing and swapping in 3D does nothing.
const swapKey = () => Object.entries(swapOverrides())
  .sort(([a], [b]) => a < b ? -1 : 1)
  .map(([k, v]) => `${k}=${v || ''}`).join(',')
  // a lug turned is a scene to rebuild as much as one swapped (#829)
  + `|${encodeTurns(shell.turnDelta())}`;

// A SWAP SURVIVES A RELOAD. This page's OWN location carries the device, its
// configuration, its view and the swaps, rewritten in place (replaceState, so
// swapping does not fill the back button) on every swap, configuration change
// and view change; shell.js reads them back on load in that order.
//
//   ?device=<name>&listing=<ns>/<id>&config=<c>&view=<v>&swap=<k>~<ref>,<k>~
//   &fields=<path>~<key>~<value>,...&turn=<k>~<deg>,...
//
// `turn=` is a parameter of its own (#829, swap.js encodeTurns): a third `~`
// piece in `swap=` would have made every older link lose the lug.
//
// The swap string carries its own escaping (encodeSwaps in swap.js), so it is
// written raw, and parameters this page does not own - `tex` - are kept.
//
// THIS PAGE MAY BE INSIDE SOMEBODY ELSE'S. The tab shell that embeds it picks
// the device and hands it over in the query string, and its own address is not
// this page's to write. So the encoded swap string is also announced as a
// shell event, `swaps`, whenever it changes, for a host that wants to keep it
// in its own URL; nothing here reaches into the parent.
let lastSwaps = null;
function writeLocation() {
  if (!state.device || !state.meta) return;
  const swaps = encodeSwaps(swapOverrides());
  const e = encodeURIComponent;
  const search = searchWith(location.search, {
    device: e(state.device), listing: e(state.listing || ''),
    config: e(state.cfg || ''), view: e(state.view || ''), swap: swaps,
    // what the reader set on a part (#811); carries its own escaping, as swap does
    fields: encodeFields(state.cfgFields),
    // the turns the reader gave a seated lug (#829); none on an untouched page
    turn: encodeTurns(shell.turnDelta()),
  });
  if (search !== location.search) {
    try { history.replaceState(history.state, '', `${location.pathname}${search}${location.hash}`); }
    catch (err) { /* a sandboxed or file: frame may refuse; the event below still fires */ }
  }
  if (swaps !== lastSwaps) { lastSwaps = swaps; shell.emit('swaps', swaps); }
}
shell.on('change', writeLocation);
shell.on('load', writeLocation);

// ---------------------------------------------------------------- 2D / 3D
// The scene is mounted beside the SVG stage and imported on first use, so a
// page that never presses 3D pays for neither three.js nor a WebGL context.
const modeBar = document.createElement('span');
modeBar.id = 'mode';
modeBar.innerHTML = '<button data-mode="2d" class="on">2D</button><button data-mode="3d">3D</button>';
shell.el.fit.before(modeBar);

const host3d = document.createElement('div');
host3d.id = 'stage-3d';
host3d.hidden = true;
shell.el.stage.appendChild(host3d);

let mode = '2d', viewer = null, loading = null, loadedKey = '', gpuLost = false;

// ---------------------------------------------------------------- rack ears
// THE GENERIC EAR IS A CHOICE HERE, AND OFF UNTIL THE READER MAKES IT (#909).
// Ears built into the face - a blanking panel, a full-width patch panel, the
// R740xd's 482.6 mm front - are part of the drawing and always shown. A device
// modelled between its ear folds gets a generic L-bracket only on request:
// the 3D scene builds it (viewer3d `setEars`), and the drawing, whose
// published face has none, gets it as an overlay from ears2d.js - the plan
// the scene builds from, drawn as render.py `--with ears` draws it. The
// button is there only for a device that gets one.
//
// A VIEWING PREFERENCE, NOT A FACT ABOUT THE DEVICE, so it is remembered per
// viewer as the selection and stage colours are, and not written into the
// location with the swaps: a link shares a device, not how its reader likes
// to look at one.
const EARS_KEY = 'portrayal.ears';
let earsOn = false;
try { earsOn = localStorage.getItem(EARS_KEY) === '1'; } catch (e) { /* private mode */ }
const earsBar = document.createElement('span');
earsBar.id = 'earsbar';
earsBar.hidden = true;
earsBar.innerHTML = '<button type="button" aria-pressed="false">Rack ears</button>';
const earsBtn = earsBar.querySelector('button');
shell.el.fit.before(earsBar);

// The front's declared width is what says an ear is built in, so a device is
// judged on its front even while another face is on screen: the mounted
// front, else the front the merged tree holds, else the front file itself.
const distAt = distResolver(DIST, '../library/dist');
const frontW = {};
async function frontWidth() {
  const key = `${state.device}.${state.cfg}`;
  if (state.view === 'front' && state.svg) return faceSize(state.svg)?.[0];
  if (state.faces?.front && state.facesFor === key) return faceSize(state.faces.front)?.[0];
  if (!(key in frontW)) {
    frontW[key] = fetch(distAt(faceFile(state.meta, state.cfg, 'front')))
      .then(r => (r.ok ? r.text() : '')).then(frontWidthOfText).catch(() => null);
  }
  return frontW[key];
}

let earsPlan = null;
async function syncEars() {
  const svg = state.svg;
  const plan = (state.module || !state.meta) ? null : earPlan(state.meta, await frontWidth());
  if (svg !== state.svg) return;           // another face arrived while this one asked
  earsPlan = plan;
  earsBar.hidden = !plan;
  earsBtn.classList.toggle('on', earsOn);
  earsBtn.setAttribute('aria-pressed', String(earsOn));
  earsBtn.title = earsOn ? 'Hide the generic rack ears (not part of this face)'
                         : 'Show generic rack ears: an L-bracket each side, to the 482.6 mm rack face';
  if (!svg) return;
  const vb = svg.getAttribute('viewBox');
  if (plan && earsOn) drawEars(svg, plan, state.view);
  else clearEars(svg);
  // the stage is sized from the viewBox: refit when the ears grew or shrank
  // it, and only then, so a swap redrawing them keeps the reader's zoom
  if (svg.getAttribute('viewBox') !== vb) shell.fit();
}
earsBtn.onclick = () => {
  earsOn = !earsOn;
  try { localStorage.setItem(EARS_KEY, earsOn ? '1' : '0'); } catch (e) { /* private mode */ }
  syncEars().catch(err => console.warn('[portrayal] rack ears', err));
  if (viewer) Promise.resolve(viewer.setEars(earsOn))
    .catch(err => console.warn('[portrayal] 3D rack ears', err));
};
// every face mounted (a device, a configuration, a view, a module), and every
// swap, which can append to the drawing after the overlay
shell.on('load', () => { syncEars().catch(err => console.warn('[portrayal] rack ears', err)); });
shell.on('change', () => { syncEars().catch(err => console.warn('[portrayal] rack ears', err)); });

// WHY 3D IS NOT SHOWING, in words a reader can act on. A browser keeps only
// about sixteen WebGL contexts alive and, after repeated GPU resets, refuses
// new ones until it restarts; three.js reports either as "Error creating WebGL
// context", which on its own tells nobody what to do next.
function why3d(err) {
  const msg = String(err?.message || err);
  if (/WebGL context/i.test(msg))
    return '3D unavailable: the browser would not create a graphics context — ' +
           'reload the page, or close other tabs with 3D open (browsers allow only about 16)';
  return `3D unavailable: ${msg}`;
}
const LOST_MSG = '3D paused — the graphics context was lost; it will resume, or reload the page';

async function ensureViewer() {
  if (viewer) return viewer;
  if (!loading) loading = (async () => {
    const { createViewer } = await import('./viewer3d.js');
    // the ears as the reader left them; the viewer keeps them across loads
    const v = createViewer(host3d, { dist: DIST, background: shell.stage(), ears: earsOn });
    shell.on('stage', c => v.setBackground(c));
    v.on('select', p => {
      if (!p) return;
      if (state.svg?.querySelector(`[data-path="${CSS.escape(p)}"]`)) return shell.select(p, false);
      shell.el.status.textContent = `${p} — not in the ${state.view} view`;
    });
    // while the context is gone the pick still works on the CPU, and a hover
    // clearing the status would take the only explanation of the blank scene
    v.on('hover', p => { if (!gpuLost) shell.el.status.textContent = p || ''; });
    v.on('contextlost', () => { gpuLost = true; shell.el.status.textContent = LOST_MSG; });
    v.on('contextrestored', err => {
      gpuLost = false;
      shell.el.status.textContent = err ? why3d(err) : '';
    });
    return v;
  })();
  try { viewer = await loading; }
  catch (err) { loading = null; throw err; }   // a rejected promise would poison every retry
  return viewer;
}

async function sync3d() {
  if (mode !== '3d') return;
  const v = await ensureViewer();
  const key = `${state.device}.${state.cfg}|${swapKey()}`;
  // BEFORE THE EARLY RETURN, AND BEFORE THE LOAD. Before the return because a
  // lamp lit or a cover taken off while the drawing was showing is exactly the
  // case where the device and the swaps have NOT changed and the scene still has
  // to catch up - putting these after the return was a real bug, and the same
  // trap the swap key has to be taught about. Before the load because the build
  // reads them, so a scene comes up already lit instead of flashing dark and
  // repainting itself.
  await Promise.resolve(v.setStates(liveStates())).catch(() => {});
  await Promise.resolve(v.setPulled(livePulled())).catch(() => {});
  // the fields the reader set, the same map 2D painted from (#811)
  await Promise.resolve(v.setFields(state.cfgFields)).catch(() => {});
  if (key === loadedKey) return;
  await v.load({ device: state.device, config: state.cfg, overrides: swapOverrides(),
                 turns: shell.turnsNow() });
  loadedKey = key;              // only once it is actually the thing on screen
  mountExtras(v);
  fruBar(v);
  if (state.sel) v.select(state.sel);
}

async function setMode(m) {
  if (m === mode) return;
  mode = m;
  for (const b of modeBar.querySelectorAll('button')) b.classList.toggle('on', b.dataset.mode === m);
  shell.el.svgHost.hidden = m !== '2d';
  host3d.hidden = m !== '3d';
  shell.emit('mode', m);
  // IN 3D THE VIEW IS NOT A CHOICE. A drawing shows one face, so picking which
  // is a real control; a scene shows every face at once, and a tree still
  // pinned to one of them listed a sixth of what was on screen - which is why
  // an R740xd riser could not be reached from the rear it is drawn on. So the
  // tree merges, one section per face with the 2D view's first, and the picker
  // stands down until the drawing is back.
  //
  // ONLY IF THE SHELL CAN: this page is opened against whatever shell.js sits
  // beside it, and one without loadFaces() would throw here - inside an async
  // setMode, so sync3d never runs and 3D never comes up at all. An older shell
  // keeps its one-view tree and its picker instead of failing.
  const viewPick = shell.el.view.closest('label') || shell.el.view;
  const merge = m === '3d' && typeof shell.loadFaces === 'function';
  state.merge = merge;
  // not `hidden`: the shell styles `label.f { display:flex }`, which outranks
  // the UA's [hidden] rule and would leave the picker on screen
  viewPick.style.display = merge ? 'none' : '';
  if (merge) shell.loadFaces().then(() => shell.refreshTree())
    .catch(err => console.warn('[portrayal] faces for the merged tree', err));
  else shell.refreshTree();
  if (m === '2d') { shell.fit(); if (state.sel) shell.select(state.sel, true); return; }
  shell.el.status.textContent = 'loading 3D…';
  try {
    await sync3d();
    (await ensureViewer()).resize();
    // a context lost while the drawing showed is still lost: keep saying so
    shell.el.status.textContent = gpuLost ? LOST_MSG : '';
  } catch (err) {
    console.warn('[portrayal] 3D unavailable', err);
    shell.el.status.textContent = why3d(err);
    setMode('2d');
  }
}
for (const b of modeBar.querySelectorAll('button')) b.onclick = () => setMode(b.dataset.mode);

// A device below capability level 3 has no box to show; say why instead of failing.
const btn3d = modeBar.querySelector('[data-mode="3d"]');
shell.on('device', (name, meta) => {
  const cap = meta?.capability || shell.device()?.capability;
  const short = cap && cap.level != null && cap.level < 3;
  btn3d.disabled = !!short;
  btn3d.title = short ? ((cap.blocked || []).find(b => b.level === 3)?.needs
                         ? `3D needs ${(cap.blocked || []).find(b => b.level === 3).needs}`
                         : '3D needs portrayal level 3') : '';
  if (short && mode === '3d') setMode('2d');
  else sync3d();
});
// Ejecting a fan does nothing you can see on a flat drawing, so the FRU bar is 3D
// chrome and leaves with the canvas. Fit goes the other way: it measures the SVG
// stage, and while that stage is hidden it measures 0x0 and returns without doing
// anything - a button that silently does nothing is worse than no button.
shell.on('mode', m => {
  fruBox.hidden = m !== '3d';
  shell.el.fit.hidden = m === '3d';
});

shell.on('select', path => { if (mode === '3d' && viewer) viewer.select(path); });

// A SWAP IS THE SAME EVENT AS A CONFIG CHANGE as far as the scene is concerned:
// the drawing now shows something the scene does not. In 2D sync3d returns
// immediately and the rebuild is deferred to the mode switch, which is where the
// cost belongs - swapping is a 2D affordance and nobody should pay for a scene
// they are not looking at. The scene's half can fail on its own, and an unhandled
// rejection is a silent one.
shell.on('change', () => { sync3d().catch(err => {
  console.warn('[portrayal] 3D swap sync failed', err);
  shell.el.status.textContent = why3d(err);
}); });
shell.on('load', () => { sync3d().catch(err => {
  console.warn('[portrayal] 3D reload failed', err);
  shell.el.status.textContent = why3d(err);
}); });

addEventListener('resize', () => { if (mode === '3d' && viewer) viewer.resize(); });
</script>
</body>
</html>
